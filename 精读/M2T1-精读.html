<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 T1 · 无监督学习与 PCA · 逐页精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}
.qbadge.bad{color:var(--warn)}
#wrongBox .tally{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
#wrongBox .tally span{border:1px solid var(--line);border-radius:8px;padding:5px 11px;
  font-size:12.5px;color:var(--dim);background:var(--sunken)}
#wrongBox .tally b{color:var(--ink);font-weight:650}
#wrongBox .tally b.hot{color:var(--warn)}
.wrow .h{gap:3px}
.wrow .h u{display:flex;gap:2px;text-decoration:none;
  padding-right:7px;margin-right:4px;border-right:1px solid var(--line)}
.wrow .h u:last-child{border-right:0;padding-right:0;margin-right:0}
#revChip{display:none;align-items:center;gap:9px;border:1px solid var(--warn);
  border-radius:8px;padding:5px 11px;font-size:12.5px;color:var(--warn);
  background:var(--tintwarn2);white-space:nowrap}
#revChip.on{display:inline-flex}
#revChip b{font:650 12px var(--mono)}
#revChip button{background:none;border:0;color:var(--dim);cursor:pointer;
  font:12px var(--cjk);text-decoration:underline;padding:0}
#revChip button:hover{color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default}
.btn:disabled:hover{border-color:var(--line)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qhist{font:11px var(--mono);color:var(--dim);margin-top:8px;display:flex;
  align-items:center;gap:5px}
.qhist i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.qhist i.o{background:var(--acc)} .qhist i.x{background:var(--warn)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
#strip b.err{background:var(--errdot)}
#strip b.err.on{background:var(--acc2)}
/* 错题本 */
#wrongPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#wrongPanel.on{display:flex}
#wrongBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(760px,100%);max-height:84vh;overflow:auto;padding:22px 24px}
#wrongBox h3{margin:0 0 4px;font-size:18px}
#wrongBox .sub{color:var(--dim);font-size:13px;margin:0 0 16px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;
  border:1px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--sunken)}
.wrow:hover{border-color:var(--acc2)}
.wrow .p{font:700 12px var(--mono);color:var(--acc2);flex:0 0 52px}
.wrow.done{opacity:.5}
.wrow.done .p{color:var(--acc)}
.wrow .n2{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.wrow .s{font:11.5px var(--mono);color:var(--dim);flex:0 0 auto}
.wrow .h{display:flex;gap:3px;flex:0 0 auto}
.wrow .h i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.wrow .h i.o{background:var(--acc)} .wrow .h i.x{background:var(--warn)}
#wrongBox .none{color:var(--dim);text-align:center;padding:30px 0;line-height:2}
#wrongFoot{display:flex;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line)}
#wrongFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ EXTRA_CSS:BEGIN ══ */
/* ══ 讲解区里的链接兜底 ══
   ⚠ 2026-10-03 查出来的：原先只给 .ng a 上了色，放在 tip / say / pts / exam 里的链接
   会退回浏览器默认的 #0000EE —— 浅色下还能看（8.47:1），**暗色下只有 1.95:1**。
   做 notes2 时第一次往 tip 里放时间码链接就撞上了。这条规则管住所有其它位置。 */
#card a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
#card a:hover{opacity:.75}

/* ══ 「从零补基础 · Andrew Ng」栏 ══ */
.ng{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintviolet)}
.ng .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--violet);
  letter-spacing:.4px;margin-bottom:5px}
/* ⚠ 要用 #card .ng a 而不是 .ng a —— 上面的兜底规则带了 #card 这个 id，
   光写 .ng a（0,1,1）会被 #card a（1,0,1）压过去，紫色链接会变蓝。 */
#card .ng a{color:var(--violet);text-decoration:none;border-bottom:1px solid var(--violet)}
#card .ng a:hover{opacity:.75}
.ng .src{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
:root:not([data-theme="dark"]) .ng{box-shadow:var(--shadow)}

/* ══ 「课件原话」栏：引官方英文 ══ */
.quote{border-left:3px solid var(--dim);background:var(--lift2);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;font-size:13px;line-height:1.7;color:var(--ink3)}
.quote .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--dim);
  letter-spacing:.4px;margin-bottom:5px}
.quote b{color:var(--ink2)}
.quote em{font-style:normal;color:var(--ink2);font-weight:560}

/* ══ 笔记表格：对比表 / 情况表 / 数值表 ══ */
.tw{margin:13px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tc{font-size:11.5px;font-family:var(--mono);color:var(--dim);letter-spacing:.3px;
  padding:7px 12px;background:var(--sunken);border-bottom:1px solid var(--line)}
table.nt{width:100%;border-collapse:collapse;font-size:12.8px;line-height:1.55}
table.nt th{text-align:left;font-weight:620;font-size:11.5px;color:var(--dim);
  background:var(--panel2);padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
table.nt td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.nt tbody tr:last-child td{border-bottom:none}
table.nt td:first-child{font-weight:560;color:var(--ink2)}
table.nt b{color:var(--ink2)}
:root:not([data-theme="dark"]) .tw{box-shadow:var(--shadow)}

/* ══ 「与考试的联系」栏 ══ */
.exam{border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintacc2)}
.exam .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--acc2);
  letter-spacing:.4px;margin-bottom:5px}
:root:not([data-theme="dark"]) .exam{box-shadow:var(--shadow)}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}
/* ══ EXTRA_CSS:END ══ */

</style>
</head>
<body data-key="cs234-2019-l01">

<div id="bar">
  <h1>M2 T1 · <span>无监督学习与 PCA</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 18</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <span id="revChip">复习模式 <b></b><button id="revOff">退出</button></span>
  <button class="btn" id="wrongBtn">错题本</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="wrongPanel"><div id="wrongBox">
  <h3>错题本</h3>
  <p class="sub">错过的题<b>连着答对两次就毕业</b>，自动从这里和复习模式里退出。<br>
  还没毕业的排在前面，最近错得多的更靠前。点任意一行跳到那一页重看。</p>
  <div class="tally" id="wrongTally"></div>
  <div id="wrongList"></div>
  <div id="wrongFoot">
    <button class="btn" id="revOn">只复习这些页</button>
    <button class="btn" id="wrongClose">关闭</button>
    <button class="btn" id="wrongReset">清空全部记录</button>
  </div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示课件？</b></p>
      <p>本页直接引用同目录下的 <code>slides/M2T1_PCA.pdf</code>。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>精读</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/M2T1-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say CS229 / 讲义补充（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {"1": [{"q": "PCA 找到的那组方向有什么性质？", "o": ["与原始坐标轴平行", "彼此平行，且都通过原点", "彼此正交，在中心化数据上依次捕获最大的剩余方差", "由目标变量 y 决定"], "a": 2, "why": "PCA 找的是<b>互相正交</b>的方向，第一个捕获最大方差，之后每个在与前面正交的前提下捕获最大的剩余方差。它<b>不使用 y</b>，也一般不与坐标轴平行。"}], "2": [{"q": "路线图里特别强调「预处理会改变 PCA 的方向」，指的主要是哪一步？", "o": ["画图时的配色", "保留几个成分", "解特征方程的顺序", "中心化与是否标准化"], "a": 3, "why": "中心化决定了协方差描述的是「围绕中心」还是「离原点」；标准化决定了各特征以什么尺度参与比较。<b>换一个单位就可能换一个主方向</b>。保留几个成分是拿到方向之后的事。"}], "3": [{"q": "以下哪一组是本课会深入学习（可能出题）的四个无监督方法？", "o": ["k-means、DBSCAN、GMM、t-SNE", "PCA、关联规则、GMM、表示学习", "PCA、k-means、DBSCAN、GMM", "PCA、k-means、DBSCAN、异常检测"], "a": 2, "why": "深考四个：<b>PCA</b>（降维）、<b>k-means</b> 与 <b>DBSCAN</b>（聚类）、<b>GMM</b>（密度估计与软聚类）。异常检测、关联规则、表示学习、t-SNE 都属于「只要求知道有这回事」。"}, {"q": "某题问「以下哪一项<b>不属于</b>本课要求深入掌握的无监督方法」，正确选择是？", "o": ["主成分分析", "高斯混合模型", "DBSCAN", "异常检测（如 Isolation Forest）"], "a": 3, "why": "深考的是 <b>PCA、K-means、DBSCAN、GMM</b> 四个。异常检测、关联规则发现、表示学习在讲义里被明确标为「introduced for awareness，不直接考核」。"}], "4": [{"q": "工作流第二步是「定义相似」。为什么它被单独列成一步？", "o": ["因为相似是建模选择——特征、尺度、距离都会改变结果", "因为无监督算法不需要目标函数", "因为距离公式很难记", "因为相似度必须由领域专家提供"], "a": 0, "why": "同一批观测，换一组特征、换一个缩放、换一种距离，得到的结构就可能完全不同。<b>相似不是数据的固有属性，是你选的</b>。这也是为什么两个人用同一份数据能得到不同的簇。"}], "5": [{"q": "一个 PCA 投影保留了很高的方差，但保留方向几乎被一个未缩放的特征主导。多证据框架里哪两条最先发出警告？", "o": ["假设（表示是否合理）与检视（看图和载荷）", "稳定性与内部证据", "只有有用性", "内部证据与有用性"], "a": 0, "why": "高方差本身是<b>内部证据</b>，它不会报警。报警的是<b>假设</b>——未缩放的大量纲特征让「方差」失去可比性；以及<b>检视</b>——看载荷就会发现成分几乎只由那一个特征构成。"}, {"q": "某团队只报告了「k=3 时 silhouette 最高」。按四类证据框架，他们至少还缺哪两类？", "o": ["假设与内部证据", "内部证据与拟合", "稳定性与假设/表示", "拟合与领域有用性"], "a": 2, "why": "silhouette 属于<b>内部证据（拟合）</b>那一类，已经有了。缺的是<b>稳定性</b>（换种子/重采样还成不成立）和<b>假设与表示</b>（尺度、簇几何是否合理）。领域有用性也缺，但题目问「至少两类」，这两项最直接。"}, {"q": "讲义那张决策表里，silhouette 最高的候选最终被否掉，理由是什么？", "o": ["它不稳定——某个小组在不同运行间会变", "它的 inertia 太高", "它的簇数不是奇数", "它没有通过显著性检验"], "a": 0, "why": "表里 k=4 的 silhouette 是 0.59（最高），但标注为<b>不稳定</b>；k=2 稳定却合并了专家要区分的组。最后选 k=3，因为<b>多路证据一致</b>。这正是「不能只看一个数」的示范。"}], "6": [{"q": "「无监督学习没有目标函数」这句话对吗？", "o": ["对，无监督只做可视化", "不对。没有的是标签，不是目标函数——PCA 优化投影方差，k-means 优化 WCSS", "不对，无监督其实偷偷用了标签", "对，因为没有标签就无从优化"], "a": 1, "why": "每个无监督方法都在优化一个明确的准则：PCA 最大化投影方差（等价于最小化正交重构误差），k-means 最小化簇内平方和，GMM 最大化似然。缺的只是<b>用来评判对错的标签</b>。"}], "7": [{"q": "同一份中心化数据，用 S = XcᵀXc 和用 Cov = S/(n−1) 做特征分解，结果的关系是？", "o": ["特征向量不同，特征值相同", "特征向量完全相同；特征值差 (n−1) 倍；解释方差比完全一样", "两者互不相关", "只有 Cov 能用来做 PCA"], "a": 1, "why": "两者只差一个正的常数因子：<b>Sv = λv ⟺ (S/(n−1))v = (λ/(n−1))v</b>，同一个 v。解释方差比 λⱼ/Σλ 上下同时缩放，<b>值不变</b>。所以手算用 S 更省事，只有问「方差」时才除 (n−1)。"}, {"q": "某题给出 S = [[10,20],[20,40]]（n=4），问「PC1 方向上的<b>样本方差</b>是多少」。正确答案是？", "o": ["10", "50/3 ≈ 16.67", "50", "50/4 = 12.5"], "a": 1, "why": "S 的最大特征值是 50，但那是<b>散布矩阵</b>的特征值。样本方差要除 <b>(n−1) = 3</b>，得 <b>50/3 ≈ 16.67</b>。若题目只问「主方向」或「解释方差比」，则不必除。"}, {"q": "为什么必须先中心化再算协方差？", "o": ["否则矩阵不可逆", "否则二阶矩量的是「到坐标原点的距离」，而不是围绕数据中心的变化", "否则特征值会是复数", "为了让所有数值变成正数"], "a": 1, "why": "协方差的定义就是围绕<b>均值</b>的变化。不减均值时，一团紧凑但整体远离原点的点云会被算出巨大的「方差」，主方向被拽向指向原点的方向。与可逆性、复数都无关（对称矩阵特征值本来就是实数）。"}], "8": [{"q": "手算 PCA 时，哪一组自检最能当场抓出错误？", "o": ["中心化后每列和为 0；特征值之和等于矩阵的迹", "检查特征数是否小于样本数", "检查所有数值是否为正", "检查数据有没有缺失值"], "a": 0, "why": "这两条一秒钟能验、覆盖最常见的两类错误：均值算错（列和不为 0）和特征值解错（和 ≠ 迹）。而且写在卷面上<b>本身就是采分点</b>。"}, {"q": "手算中发现「特征值之和 ≠ 矩阵的迹」，最可能是哪一步出错？", "o": ["投影算错了", "均值算错了", "归一化忘了做", "特征值解错了（或矩阵本身抄错）"], "a": 3, "why": "Σλ = 迹是<b>矩阵与其特征值之间</b>的恒等式，与投影、归一化无关。若不相等，要么特征方程解错，要么矩阵本身写错。均值出错会先在「列和为 0」那一步暴露。"}], "9": [{"q": "某分类任务在做完 PCA 之后表现反而变差了。最合理的解释是？", "o": ["解释方差比算错了", "保留的成分太多了", "PCA 实现有 bug", "被丢弃的低方差方向可能携带了区分类别的信息，而 PCA 不使用标签"], "a": 3, "why": "PCA 只最大化<b>输入方差</b>、完全不看 y。高方差方向可能是量纲或光照等干扰，低方差方向反而可能把类别分开。所以 PCA 对下游<b>可能提升、可能降低、也可能没影响</b>，必须在<b>验证数据</b>上比较。"}, {"q": "「PCA 与线性回归都在拟合一条直线，只是 PCA 没有标签」——这个说法的主要问题是？", "o": ["PCA 其实也用标签", "两者最小化的误差方向不同：回归量竖直的预测误差，PCA 量垂直于方向的重构误差", "线性回归不能用于二维数据", "PCA 得到的是曲线不是直线"], "a": 1, "why": "关键差异不只是「有没有标签」，还有<b>误差的度量方向</b>：回归最小化<em>目标方向（竖直）</em>的预测误差，PCA 最大化投影方差、等价地最小化<em>正交（垂直）</em>重构误差。所以同一份数据上两条线一般不重合。"}, {"q": "下列哪种情形下，PCA 最可能<b>损害</b>下游分类表现？", "o": ["样本量远大于特征数时", "区分类别的信息集中在低方差方向时", "所有特征都已标准化时", "特征高度相关、信息冗余时"], "a": 1, "why": "PCA 按<b>输入方差</b>排序并丢弃低方差方向。若判别信息恰好住在低方差方向上，降维就把它削掉了。特征冗余时反而是 PCA 最有效的场景。"}], "10": [{"q": "重构公式 X̂ = Z Wₖᵀ + μ 里，为什么最后要加上 μ？", "o": ["为了让结果都变成正数", "因为投影用的是中心化数据，得分表达的是相对于均值的位置，映回原空间必须把均值还回去", "因为 sklearn 要求这么写", "为了让解释方差之和等于 1"], "a": 1, "why": "整条链是：先减 μ 得 Xc → 投影得 Z → 映回 d 维 → <b>把当初减掉的 μ 加回来</b>。漏掉这一步，重构点会整体偏移到原点附近。sklearn 的 inverse_transform 已经替你加了。"}, {"q": "保留 k 个成分时，总平方重构误差等于什么？", "o": ["最大特征值", "保留的特征值之和", "被丢弃的特征值之和", "全部特征值之和"], "a": 2, "why": "投影保住的是前 k 个方向的变化，<b>丢掉的那些方向的特征值之和就是没被表示的变化</b>，也就是总平方重构误差。by-hand 例子里 λ₂=2，重构误差正好是 2。"}, {"q": "某观测在被丢弃的那个方向上取值明显偏离中心。重构后它在该特征上会变成什么？", "o": ["0", "该特征的均值", "保持原值", "最大值"], "a": 1, "why": "被丢弃方向上的得分为 0，重构时 <b>x̂ = μ + Σⱼ zⱼvⱼ</b> 在该方向只剩下均值那一项。by-hand 例子里 (0,−1) 和 (0,1) 都被重构到 (0,0) 就是这个道理。"}], "11": [{"q": "第 i 个观测在 PC1 上的得分 zᵢ 是怎么算的？", "o": ["原始观测 xᵢ 与 v₁ 的内积", "中心化观测 xᵢ,c 与单位向量 v₁ 的内积", "xᵢ 到原点的欧氏距离", "xᵢ 各分量之和"], "a": 1, "why": "<b>必须先减均值</b>再投影，而且 v₁ 要<b>归一化成单位长度</b>，否则得分整体差一个倍数。均值是在<b>重构</b>那一步才加回去的。"}, {"q": "一维 PCA 中，第 i 个观测的得分 zᵢ 与重构 x̂ᵢ 的关系是？", "o": ["x̂ᵢ = zᵢ v₁ᵀ + μ", "x̂ᵢ = zᵢ + μ", "x̂ᵢ = zᵢ", "x̂ᵢ = zᵢ / ‖v₁‖"], "a": 0, "why": "得分是<b>一个数</b>（在 PC1 上的坐标），重构要把它<b>乘回方向向量</b>再<b>加上均值</b>才能回到原特征空间。少了任何一步维度或位置都不对。"}], "12": [{"q": "sklearn 里 components_ 和 transform(X) 的输出分别是什么？", "o": ["components_ 是主方向（每行一个方向）；transform 给出每个观测的得分", "transform 返回重构后的观测", "components_ 是均值向量", "都是得分矩阵"], "a": 0, "why": "<b>components_</b>：一行一个主方向，用原特征坐标表示；<b>transform</b>：返回 n×k 的<b>得分</b>矩阵。要回到原特征空间得用 <b>inverse_transform</b>。三者对应「方向 / 坐标 / 重构」。"}, {"q": "某次 PCA 后 <code>explained_variance_</code> 返回 [6.0, 0.667]。关于这两个数，正确的是？", "o": ["它们是成分的载荷", "它们是重构误差", "它们是各成分的方差（协方差矩阵的特征值），比例要看 explained_variance_ratio_", "它们是解释方差比例，应当加起来等于 1"], "a": 2, "why": "<b>explained_variance_ 是方差本身</b>（这里对应散布特征值 18 和 2 除以 n−1=3）。比例是 <b>explained_variance_ratio_</b> = [0.9, 0.1]，那个才加起来为 1。"}], "13": [{"q": "在「StandardScaler + PCA + 分类器」的预测流程中，正确的做法是？", "o": ["PCA 不会造成泄漏，怎么 fit 都行", "先划分，再只在训练集上 fit scaler 和 PCA，测试集只 transform", "先用全部数据 fit 好 scaler 和 PCA，再划分训练测试", "训练集和测试集各自 fit 一次"], "a": 1, "why": "用全量数据 fit，测试集信息会进入均值和主方向，评估偏乐观——这是<b>泄漏</b>。测试集自己 fit 一次同样错，那样两边的坐标系不一致，变换结果没法比较。"}, {"q": "把某个特征乘以 100（仅改变单位），PCA 的结果会怎样？", "o": ["完全不变，PCA 会自动归一化", "只有特征值变化，主方向不变", "该特征方差放大 10000 倍，可能整个主导 PC1 并使主方向翻转", "会报错"], "a": 2, "why": "PCA 追的是<b>数值方差</b>。特征 ×c 会让它的方差 ×c²，量纲一换主方向就可能整个转过去。<s>PCA 不会自动让不同单位可比</s>——那要靠标准化，而标准化是一个<b>要论证</b>的决定。"}, {"q": "对某数据标准化后做 PCA，两个成分的解释方差比都是 0.5。最恰当的解读是？", "o": ["出现了特征值平局，第一主方向不唯一，返回哪个方向取决于数值细节", "数据没有任何结构", "标准化做错了", "PC1 在两个特征上载荷相等"], "a": 0, "why": "标准化后两特征方差都为 1、协方差为 0 时会出现<b>特征值相等</b>的情形，此时任何正交方向组都是合法解，<b>PC1 不唯一</b>。讲义专门点名「不要把它解读成载荷均等」。"}], "14": [{"q": "没有除以 (n−1) 的那个矩阵 XcᵀXc，规范的叫法是什么？", "o": ["载荷矩阵", "协方差矩阵", "散布矩阵（scatter matrix）", "相关矩阵"], "a": 2, "why": "<b>散布矩阵 S = XcᵀXc</b>；除以 (n−1) 之后才叫<b>样本协方差矩阵</b>。两者特征向量相同、解释方差比相同，但<b>名字和特征值的数值不同</b>，答题时用错名称会被扣。"}, {"q": "没有除以 (n−1) 的矩阵 XcᵀXc，规范叫法是？", "o": ["散布矩阵（scatter matrix）", "协方差矩阵", "相关矩阵", "载荷矩阵"], "a": 0, "why": "<b>S = XcᵀXc 叫散布矩阵</b>，除以 (n−1) 之后才是<b>样本协方差矩阵</b>。两者特征向量与解释方差比相同，但名称和特征值数值不同——答题时用错名称会被扣。"}], "15": [{"q": "Tutorial 那份数据是秩一的（四个点共线）。这会造成什么现象？", "o": ["无法计算协方差矩阵", "所有特征值都相等", "第二个特征值为 0，一个成分就能 100% 重构，重构误差为 0", "必须先标准化才能做 PCA"], "a": 2, "why": "四个点严格成比例 ⇒ 数据完全落在一条直线上 ⇒ 垂直方向没有任何变化 ⇒ <b>λ₂ = 0</b>。这是<b>刻意设计的退化例子</b>，用来把流程走通；真实数据通常不会这样，别把 100% 重构当常态。"}], "16": [{"q": "Q1 要求「验证每个中心化后的列加起来为 0」。这一步验证的是什么？", "o": ["每个特征的均值确实被减掉了，即中心化做对了", "数据已经标准化", "特征值计算正确", "特征之间不相关"], "a": 0, "why": "中心化的定义就是让<b>每个特征的均值为 0</b>，等价于每一列的和为 0（容许浮点舍入）。它<b>不保证</b>方差为 1（那是标准化），也和特征间相关性无关。"}, {"q": "四个观测 (2,3), (3,5), (0,−1), (−1,−3) 的特征均值向量是？", "o": ["(0, 0)", "(2, 3)", "(1, 1)", "(1.5, 1)"], "a": 2, "why": "按<b>列</b>求平均：第一列 (2+3+0−1)/4 = <b>1</b>，第二列 (3+5−1−3)/4 = <b>1</b>。所以 μ = (1,1)。注意是每个特征一个均值，不是整个矩阵一个数。"}], "17": [{"q": "解出两个特征值后，怎么判断算得对不对（不重解一遍）？", "o": ["看它们是否都小于 1", "看它们是否互为倒数", "看它们是否都为正", "看它们之和是否等于矩阵的迹、乘积是否等于行列式"], "a": 3, "why": "对任意方阵，<b>特征值之和 = 迹</b>（对角线元素之和），<b>特征值之积 = 行列式</b>。这两条几秒钟能验，是手算题里性价比最高的检查。协方差矩阵的特征值确实非负，但这个条件太弱、抓不出算错。"}, {"q": "S = [[10,20],[20,40]] 的特征方程是？", "o": ["λ² + 50λ = 0", "λ² − 10λ − 40 = 0", "λ² − 50λ + 400 = 0", "λ² − 50λ = 0"], "a": 3, "why": "det(S−λI) = (10−λ)(40−λ) − 20·20 = λ² − 50λ + 400 − 400 = <b>λ² − 50λ</b>，解得 λ = 50 与 0。验算：50+0 = 50 = 迹；50×0 = 0 = 行列式（400−400）。"}, {"q": "为什么要挑<b>最大</b>特征值对应的特征向量？最完整的理由是？", "o": ["因为惯例如此", "因为它数值最大，计算最稳定", "因为它对应的向量最长", "因为在驻点上 vᵀΣv = λ，目标函数的值就等于特征值本身"], "a": 3, "why": "把 Σv = λv 代回目标：<b>vᵀΣv = vᵀ(λv) = λ·vᵀv = λ</b>（v 是单位向量）。所以每个特征对都是一个驻点，而它的「得分」正是 λ——最大化投影方差就等于挑最大的特征值。这句写进大题能拿解释分。"}], "18": [{"q": "某次 PCA 保留一个成分即达到 90% 的累计解释方差。下列哪项一定成立？", "o": ["第二个方向一定是噪声", "每个原始特征都保住了 90% 的变化", "被丢弃方向上的变化不会出现在重构里，该方向的差异可能完全消失", "下游模型一定更准"], "a": 2, "why": "解释方差是<b>总方差</b>的比例，不是逐特征的比例。公开 by-hand 例子里 r₁ = 0.9，但 (0,−1) 和 (0,1) 在秩一重构后<b>完全一样</b>——如果应用恰恰要区分这两个观测，90% 就不够。低方差也<s>不自动等于噪声</s>。"}, {"q": "某 PCA 保留一个成分即达到 90% 累计解释方差。下列哪项<b>一定</b>成立？", "o": ["下游模型一定更准", "被丢弃方向上的变化不会出现在重构里，该方向的差异可能完全消失", "每个原始特征都保住了 90% 的变化", "第二个方向一定是噪声"], "a": 1, "why": "解释方差是<b>总方差</b>的比例，不是逐特征的比例。by-hand 例子里 r₁=0.9，但 (0,−1) 与 (0,1) 在秩一重构后完全相同——第二个特征的差异<b>整个消失</b>。低方差也<s>不自动等于噪声</s>。"}, {"q": "重构公式里为什么要加上 μ？", "o": ["因为投影用的是中心化数据，得分表达的是相对于均值的位置，映回原空间必须把均值还回去", "为了让解释方差之和为 1", "因为 sklearn 要求", "为了让结果非负"], "a": 0, "why": "整条链是「减 μ → 投影 → 映回 d 维 → <b>加回 μ</b>」。漏掉这一步，重构点会整体挤到原点附近。sklearn 的 <code>inverse_transform</code> 已经替你加了，手算时要自己写。"}]};

var N = [{"r": [1, 1], "t": "这一讲要回答什么", "star": 1, "one": "没有标签的时候，怎么用更少的变量描述同一批观测？", "pts": ["<b>标题里已经给了这一讲的全部承诺</b>：<em>lower-dimensional</em>（更少的维度）、<em>structure</em>（结构）、<em>without labels</em>（没有标签）。三个词对应三件事——做什么、找什么、在什么条件下找。", "<b>「没有标签」不是省事，是换了一类问题。</b> M1 里你总能拿预测和真值比对，算个准确率就知道好不好；这里<b>没有那个数字</b>。所以这门课把重心整个挪到了「你凭什么相信这个结果」。", "<b>PCA 在这一讲里的定位</b>：它是「降维」这一族里最经典的一个，做法是找<b>正交的高方差方向</b>。注意<em>正交</em>和<em>高方差</em>这两个限定词——后面所有性质都从它们推出来。", "⚠️ <b>第 2 页 Acknowledgement of Country 不考</b>，裁页时已经去掉了，所以这份精读的页码比原课件少 1（原第 2 页起整体前移）。"], "tip": {"t": "与考试的关系", "v": "M2 测验 110 分钟、20 选择 + 4 大题。PCA 的手算题几乎一定落在上面那条链上，换的只是数字。"}, "exam": "选择题会考「PCA 属于哪一类任务」「无监督与监督的根本差别」。大题开头那一句定调的话就从这里来：<b>「因为无监督学习没有供给的目标标签，不存在唯一裁判，所以需要综合多类证据来判断」</b>。", "ng": "<b>「PCA 到底是什么」就听这 9 分钟</b>——Lecture 15 的 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=129s\" target=\"_blank\">02:09</a> 到 11:20。他先举一个例子：一份数据里有两列其实是<b>同一个速度的 mph 和 km/h</b>，两列几乎完全线性相关，于是数据实际只住在低一维的空间里；接着换成遥控直升机飞手的「技术 vs 享受程度」，两个特征强相关、数据沿一条对角轴分布；最后用一张二维点云问「要压到一维，该往哪个方向投」。<b>全程没有公式，就是在回答『PCA 想干什么』。</b>听完再回来看这份精读会顺很多。<span class='src'>视频：CS229 Lecture 15 · 讲义：main_notes.pdf 第 168–173 页（本地已抽成 CS229/notes/ch12_pca.txt）</span>", "quote": "<b>Unsupervised Learning and PCA</b> — <em>Finding lower-dimensional structure without labels</em>", "say": "把这一讲放进整幅地图：CS229 用一张 2×2 给无监督分类——横轴「建不建模 P(x)」、纵轴「数据住在低维子空间还是聚成团」。<b>PCA = 子空间 × 非概率</b>；同一行的概率版是因子分析，下一行是 K-means（非概率）与 GMM（概率）。<b>M2 的三个 Topic 正好占这张表的三格。</b>"}, {"r": [2, 2], "t": "六段路线图", "one": "全景 → 为什么降维 → 中心化与缩放 → 主方向 → 投影重构与 sklearn → tutorial。", "pts": ["<b>路线图本身就是答题顺序。</b> 大题要你「完整做一遍 PCA」时，按这五段写下来就不会漏步骤。", "<b>第 3 段的小标题是这一讲最该记的一句</b>：<em>Preprocessing changes PCA directions</em>——<b>预处理会改变主方向</b>。不是「影响一点点」，是<b>换一组方向</b>。所以中心化与缩放不是格式化步骤，是建模决定。", "<b>第 4 段点明了主方向的身份</b>：<em>Eigenvectors of covariance</em>——协方差矩阵的特征向量。⚠️ 这不是定义，是<b>推出来的结论</b>（在约束 ‖v‖=1 下最大化 vᵀΣv，用拉格朗日乘子解出 Σv=λv）。", "<b>第 5 段把三件容易混的事并列</b>：投影（得到得分）、重构（回到特征空间）、实现（sklearn）。这三者的区别是 p10 和 p12 的主题，也是最常考的概念题。"], "tip": {"t": "读法建议", "v": "先看第 ③ 段和第 ⑤ 段——它们对应大题里最常考的「为什么要中心化」和「得分与重构的区别」。"}, "exam": "官方 Study check 问的是：<b>「解释为什么特征准备会改变 PCA 的方向，并说出一个能帮你决定保留几个成分的实现输出」</b>。后半问的答案是 <code>explained_variance_ratio_</code>。", "quote": "<b>M2 T1 Roadmap</b>：1 Unsupervised Landscape · 2 Why Reduce Dimensions · 3 Centre and Scale — <em>Preprocessing changes PCA directions</em> · 4 Principal Directions — <em>Eigenvectors of covariance</em> · 5 Project, Reconstruct &amp; Implement", "tbl": [{"cap": "五段路线图 ↔ 它各自回答什么问题", "head": ["段", "小标题", "回答的问题"], "rows": [["1", "Unsupervised Landscape", "无监督都有哪些任务，本课考哪几个"], ["2", "Why Reduce Dimensions", "为什么要降维：压缩、可视化、去噪"], ["3", "Centre and Scale", "<b>为什么预处理会换掉主方向</b>"], ["4", "Principal Directions", "主方向是什么、怎么解出来"], ["5", "Project / Reconstruct / Implement", "得分与重构的区别；sklearn 怎么对应"]]}], "say": "路线图这五段的<b>顺序本身就是一个论点</b>：为什么「中心化与缩放」要排在「主方向」<em>前面</em>？因为<b>预处理决定了协方差矩阵长什么样，而主方向是协方差矩阵的特征向量</b>——先有什么样的 Σ，才有什么样的 v。<b>顺序反过来讲，整个推导就没有起点。</b>这也解释了为什么第 3 段的小标题敢把话说死：<em>Preprocessing changes PCA directions</em>，不是「影响一点点」而是<b>换一组方向</b>。", "ng": "Ng 讲 PCA 的整体安排和这张路线图<b>几乎一样</b>，只是顺序更紧凑：<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=129s\" target=\"_blank\">02:09</a> 起用厘米/英寸、振动传感器、直升机飞手三个例子讲动机；<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=408s\" target=\"_blank\">06:48</a> 讲预处理（<em>common pre-processing is to zero out the mean and standard deviation</em>）；<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=851s\" target=\"_blank\">14:11</a> 投影 uᵀx；<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=914s\" target=\"_blank\">15:14</a> 最大化投影方差；<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=1184s\" target=\"_blank\">19:44</a> 拉格朗日解出 Σu=λu；<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=1450s\" target=\"_blank\">24:10</a> top-k 与解压。⭐ <b>但他比课件多了整整一半</b>：从 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=2280s\" target=\"_blank\">38:00</a> 起讲「哪些用法可疑」、<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=2661s\" target=\"_blank\">44:21</a> 讲「用之前先试试不用 PCA 会怎样」。<b>课件只覆盖了他的前半场。</b><span class=\"src\">CS229/transcripts/ · 本地已下载全部 20 讲</span>"}, {"r": [3, 3], "t": "无监督是一片任务地形，不是一个算法", "star": 2, "one": "深考四个方法；外围三类只要求知道有这回事。", "pts": ["<b>这一页明确划了考试范围</b>，值得先看清楚：<em>studied in depth</em> 的是<b>四个核心方法</b>，<em>awareness only · not assessed</em> 的是更广的任务族。别在不考的部分花时间。", "<b>三类核心任务对应三个 Topic</b>：降维（PCA）= T1，聚类（K-means、DBSCAN）= T2，密度估计（GMM）= T3。<b>整个 M2 就这三块。</b>", "⚠️ <b>「用无监督学习」还不是一个完整的建模决定</b>——这是官方 Study check 的原话。你还得说清楚：属于哪一类任务、用哪个方法、在什么特征与缩放下、用什么证据判断好坏。", "<b>任务类型怎么认</b>：要「更少的特征」→ 降维；要「有用的分组」→ 聚类；要「这个观测有多罕见」→ 密度估计。<b>第三个是 GMM 能做而 K-means 做不到的。</b>"], "tip": {"t": "考纲边界", "v": "选择题喜欢考「以下哪个属于本课深入学习的方法」。记住四个：PCA、K-means、DBSCAN、GMM。"}, "exam": "这一页是概念选择题的直接来源。<b>「把任务归类」型的题按上表两问定位：要少的特征 / 要分组 / 要罕见度。</b>", "ng": "开头 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=7s\" target=\"_blank\">00:07</a>–02:00 给了 PCA 的<b>定位</b>：它<b>不建模 P(x)</b>（那是密度估计/因子分析的事），只回答「数据近似落在哪个子空间」。这条区分决定了后面所有结果该怎么解释。<span class='src'>视频：CS229 Lecture 15 开场</span>", "quote": "<b>Unsupervised Learning Is a Landscape of Tasks</b> — <em>Core methods are studied in depth; wider task families provide non-assessed context.</em>", "tbl": [{"cap": "考什么 / 不考什么", "head": ["范围", "内容", "考不考"], "rows": [["核心方法", "降维 <b>PCA</b>", "<b>深入考</b>"], ["", "聚类 <b>K-means、DBSCAN</b>", "<b>深入考</b>"], ["", "密度估计 <b>GMM</b>", "<b>深入考</b>"], ["更广的任务族", "关联规则、异常检测、表示学习等", "<b>只需知道存在</b>，不考"]]}, {"cap": "给任务定类型（Study check 的三个例子）", "head": ["场景", "任务族", "本课的方法"], "rows": [["压缩互相关联的特征", "降维", "PCA"], ["把客户分组", "聚类", "K-means / DBSCAN"], ["标记异常交易", "密度估计", "GMM（算 p(x) 很小就报警）"]]}], "say": "这一页划考试范围时有个容易忽略的细节：<b>四个核心方法里，本课只考三个</b>——降维（PCA）、聚类（K-means/DBSCAN）、密度估计（GMM）。CS229 那张 2×2 表里的第四格<b>因子分析</b>，在你们这门课里<b>一个字都不考</b>。知道这件事的用处是：<b>看到「概率 × 低维子空间」这一格时不用慌</b>，它存在只是为了让你理解 PCA 的位置，不是考点。"}, {"r": [4, 4], "t": "一套可复用的无监督工作流", "one": "定义问题 → 定义相似 → 准备特征 → 匹配假设 → 拟合检视 → 评估解释。", "pts": ["<b>第 2 步「定义相似」是整条流程的枢纽</b>，也是最容易被跳过的一步。<em>Choose features, scales and distance</em>——特征、缩放、距离，<b>三者任何一个变了，「谁和谁相似」就变了</b>。", "⚠️ <b>官方 Study check 直接问：为什么对同一份数据做标准化会得到不同的簇？</b> 答案就在第 2 步：标准化改变了距离的含义，于是改变了「相似」的定义，于是改变了分组。<b>这不是算法不稳定，是你换了问题。</b>", "<b>第 4 步「匹配假设」问的是</b>：你要找的结构是什么形状（球形？弯曲？）、密度均不均匀、有没有噪声、维度多高。<b>选算法的理由就写在这一步。</b>", "<b>第 6 步「解释并报告局限」是评分点</b>，不是客套。大题最后一句必须写「这个结果不能证明什么」。"], "say": "第 2 步和第 3 步的顺序有实际后果：<b>DBSCAN 的 ε 必须在缩放之后选</b>，因为 ε 是一个带量纲的距离阈值，缩放一变它的含义就全变了。讲义原话是 <em>Select eps AFTER scaling, because its numerical meaning changes with the representation</em>。", "tip": {"t": "大题骨架", "v": "被要求「评价某个无监督流程」时，直接按这六步逐条扫，能问出的问题基本都在里面。"}, "exam": "「为什么标准化会改变聚类结果」是高频问答。答：<b>标准化改变了距离的含义 ⇒ 改变了「相似」的定义 ⇒ 改变了分组</b>；并补一句这是建模决定不是格式化步骤。", "quote": "<b>A Reliable Unsupervised-Learning Workflow</b>：1 Define the Question · 2 Define Similarity — <em>Choose features, scales and distance</em> · 3 Prepare Features · 4 Match Assumptions · 5 Fit and Inspect · 6 Interpret and report limitations", "tbl": [{"cap": "六步工作流 · 每步的产出与常见失分", "head": ["步", "做什么", "这一步没做好会怎样"], "rows": [["1 定义问题", "什么样的结构能回答它", "做出来的结构没人用得上"], ["2 <b>定义相似</b>", "选特征、缩放、距离", "大量纲特征独占距离，分组只由它决定"], ["3 准备特征", "缺失值、单位、尺度", "尺度不可比，后面全歪"], ["4 匹配假设", "形状、密度、噪声、维度", "用 K-means 去切弯曲结构"], ["5 拟合与检视", "看投影、看簇、看成员", "只报数字不看图，看不出失败模式"], ["6 <b>解释与局限</b>", "连回原问题、说清边界", "<b>最多拿一半分</b>"]]}], "ng": "这套六步工作流<b>在 CS229 里没有对应的一页</b>——Ng 不讲「标准流程」，但他用<b>一整讲</b>讲了同一件事的另一面：<b>Lecture 12 · Debugging ML Models and Error Analysis</b>。<a href=\"https://www.youtube.com/watch?v=ORrStCArmP4&t=247s\" target=\"_blank\">04:07</a> 他开宗明义说这一讲要讲<em>怎么弄清什么没work（error analysis）、以及什么真的在起作用（ablative analysis）</em>；<a href=\"https://www.youtube.com/watch?v=ORrStCArmP4&t=4472s\" target=\"_blank\">74:32</a> 详细讲消融分析。⭐ <b>这两种分析正好补上工作流第 5、6 步</b>（拟合与检视、解释与报告局限）：<b>误差分析问「错在哪个环节」，消融分析问「哪个环节真的有贡献」</b>。⚠️ 这一讲<b>不在你们考纲</b>，但它是把「检视」这一步做实的最好参考。<span class=\"src\">CS229/transcripts/ · 本地已下载全部 20 讲</span>"}, {"r": [5, 5], "t": "用多种证据判断结果，不能只看一个数", "star": 3, "one": "内部证据 / 稳定性 / 假设 / 检视 / 有用性——五路证据大体一致，结论才站得住。", "pts": ["⭐ <b>这一页是整个 M2 的主线</b>，官方在 Canvas 的评估页把它标为 <b>Core and assessable</b>，而 PPT 只给了五个词。四道大题里至少两道要用到它。", "<b>五类证据各自问什么</b>：内部证据问「按这个方法自己的标准，结构好不好」；稳定性问「换个种子/样本/邻近参数还在不在」；假设检查问「表示与模型对这份数据合不合理」；检视问「画出来长什么样」；有用性问「连回原问题有没有用」。", "⚠️ <b>关键的限定词是 never one score alone</b>——<b>永远不要只用一个分数</b>。原话还有一句：<em>one attractive plot or one high score is not enough</em>。", "<b>什么时候算「站得住」</b>：官方的说法是 <em>A result is defensible when these signals broadly agree</em>——<b>几类信号大致一致</b>时才站得住。注意是「大致一致」，不是「全部最优」。"], "say": "官方 Study check 给了一个很好的情形：<b>「一个 PCA 投影保留了很高的方差，但保留下来的方向被某个未缩放的特征主导。框架里哪几部分会警告你别马上接受？」</b> 答案至少有两条——<b>假设检查</b>（缩放不当，表示不合理）和<b>检视</b>（看载荷就能发现一个特征独大）；还可以补<b>有用性</b>（这个主成分连不回原问题）。", "tip": {"t": "必背", "v": "评估文档原话：<b>A correct final number alone may not demonstrate the required understanding</b>。大题只报数字，最多一半分。", "w": 1}, "exam": "「评价某个无监督结论」的大题按这五条逐条扫，每条都能得分。<b>只报一个 silhouette 或一个解释方差就下结论，最多拿一半分。</b>", "ng": "<b>CS229 没有对应内容。</b> 这套「四类证据」框架是<b>本课自己的教学设计</b>（Canvas 标为 Core and assessable），CS229 没有单独讲评估无监督结果的通用框架。所以这一页只能按 Canvas 那页来背，没有替代来源。<span class='src'>来源：Canvas「Evaluating Unsupervised Learning」，本地 M2材料/Canvas讲义/T1-A_总览与评估框架.txt</span>", "quote": "<b>Evaluate Unsupervised Results with Multiple Signals</b>：Internal evidence — <em>Use method-appropriate scores, but never one score alone</em> · Stability · Assumptions · Inspection · Usefulness", "tbl": [{"cap": "五类证据 · 在三个 Topic 里各自长什么样", "head": ["证据", "PCA", "聚类", "GMM"], "rows": [["内部证据", "解释方差比、重构误差", "inertia、silhouette", "对数似然、<b>AIC/BIC</b>"], ["稳定性", "换样本看子空间稳不稳", "换种子/重采样比<b>成员</b>", "多次初始化比最终似然"], ["假设", "线性、方差≈信息", "形状是凸的吗、密度均匀吗", "高斯假设成立吗"], ["检视", "看散点、看重构", "把标签画回散点图", "看成分与数据的贴合"], ["有用性", "降维后下游好用吗", "这些组讲得通吗", "责任度对业务有意义吗"]]}]}, {"r": [6, 6], "t": "有没有标签，问的问题就不同", "star": 1, "one": "监督预测一个目标；无监督描述结构。", "pts": ["<b>监督</b>：用带标签的样本，<b>目标 y 指挥目标函数</b>，评估就是把预测和真值对比（回归、分类）。", "<b>无监督</b>：只用特征之间的模式，训练时<b>没有任何供给的目标</b>，<em>Structure needs interpretation</em>——<b>得到的结构需要人来解释</b>。", "<b>共同点别忽略</b>：两者都在优化某个准则、都依赖特征表示、都会被尺度影响。<b>所以「无监督没有目标函数」是错的</b>——没有的是<b>标签</b>，不是目标函数。", "<b>最重要的差别</b>：<b>无监督没有唯一裁判</b>。这一句直接决定了上一页那套多证据框架为什么必须存在，也决定了四道大题的写法。", "<b>什么时候这个差别会改变你的建模决定</b>（Study check 的第三问）：当你手上<b>有部分标签</b>时——那就该考虑半监督或直接做监督，而不是硬套无监督；反过来，当标签<b>昂贵或根本不存在</b>时，无监督是唯一选择，但你必须准备好用多类证据来论证。"], "tip": {"t": "容易答错", "v": "<b>「无监督就是没有目标函数」是错的。</b> 没有的是<b>标签</b>，不是目标函数——K-means 在最小化 J，PCA 在最大化投影方差，GMM 在最大化似然，每个都有明确的目标函数。"}, "exam": "概念选择题的常客。也很适合写进大题开头一句：<b>「因为无监督学习没有供给的目标标签，不存在唯一裁判，所以需要综合多类证据来判断……」</b>——这一句给后面所有论证定调。", "quote": "<b>Labels Change the Question We Ask</b> — <em>Supervised learning predicts a target; unsupervised learning describes structure.</em>", "tbl": [{"cap": "两边对照（课件原表 + 补充）", "head": ["", "监督 Supervised", "无监督 Unsupervised"], "rows": [["用什么", "带标签的样本", "只用特征之间的模式"], ["谁指挥目标", "<b>目标 y</b>", "没有供给的目标"], ["怎么评估", "预测 vs 真值", "<b>多类证据，需要解释</b>"], ["例子", "回归、分类", "PCA、聚类、GMM"], ["有没有唯一裁判", "<b>有</b>（准确率 / MSE）", "<b>没有</b>"]]}], "say": "「没有唯一裁判」带来的第二个后果常被忽略：<b>无监督结果的「对错」依赖于你选的表示</b>。同一批客户，用「年消费额 + 到访次数」和用「客单价 + 到访频率」聚出来的组可以完全不同，而<b>两者都没算错</b>。所以讲义反复强调聚类结果是<b>模型产出的摘要</b>，需要解释和验证，<s>不是自动发现的真实类别</s>。这也是为什么大题的最后一步必须写局限——你报的从来不是「真相」，而是「在这组选择下看到的结构」。", "ng": "<b>Ng 用一张 2×2 把无监督算法全放进去</b>——Lecture 15 的 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=2947s\" target=\"_blank\">49:07</a> 起，他在课上让同学一起填这张表：横轴是<b>建不建模 P(x)</b>，纵轴是<b>你假设数据长什么样</b>。<b>数据住在低维子空间</b>那一行：非概率的是 <b>PCA</b>，概率的是<b>因子分析</b>；<b>数据聚成团</b>那一行：非概率的是 <b>K-means</b>，概率的是<b>混合高斯</b>。到 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=3110s\" target=\"_blank\">51:50</a> 他补了一句关键的：<b>EM 管的是整个「概率」列</b>（任何含隐变量 z 的 P(x,z)），这也顺带解释了<b>K-means 为什么没有 EM 步骤</b>——它在非概率那一列，压根没有 P(x)。<span class=\"src\">CS229/transcripts/L15.txt · 本地已下载</span>"}, {"r": [7, 7], "t": "PCA 找的是最大方差方向", "star": 3, "one": "中心化让协方差描述「围绕数据中心」的变化；最大特征值对应的特征向量就是 PC1。", "eq": "S = Xcᵀ Xc\nCov = S / (n − 1)\nΣv = λ v，‖v‖ = 1  ⇒  vᵀΣv = λ", "pts": ["<b>为什么必须中心化</b>：协方差衡量的是「围绕数据中心的变化」。不减均值的话，「方差最大的方向」会被数据<b>离原点多远</b>牵着走——那是位置信息，不是形状信息。中心化之后，S 才真正描述形状。", "⭐ <b>这一页最常考的一句</b>：<em>the scale changes eigenvalues, not eigenvectors</em>。S 与 Cov=S/(n−1) 只差一个正常数倍，所以<b>特征向量完全相同，特征值差 (n−1) 倍</b>。推论：<b>主方向一样，解释方差比也一样</b>（分子分母同时除以 n−1，比值不变）。", "<b>实战结论</b>：手算时<b>直接用 S</b>，因为通常是整数、不用一路带分数。<b>只有一种情况必须除</b>——题目明确问「这个方向上的<b>方差</b>是多少」，或要你和 sklearn 的 <code>explained_variance_</code> 对数。", "<b>vᵀΣv = λ 的含义</b>：把 Σv=λv 左乘 vᵀ，配合 vᵀv=1 即得。<b>特征值就是该方向上的投影方差</b>——所以「取最大特征值」和「取方差最大的方向」是同一件事。"], "say": "记号对照：<b>CS229 把投影长度写作 uᵀx</b>（单个点与单位向量做内积），<b>你们课件写作 Z = Xc W</b>（整个矩阵一次投影）——<em>同一件事的两种写法</em>，看到别慌。另外 CS229 里 Ng 是用<b>拉格朗日乘子</b>把 Σu=λu 解出来的：在 ‖u‖=1 约束下最大化 uᵀΣu，对 u 求导令零，<b>「主方向必须是特征向量」是解出来的结论，不是定义</b>。", "tip": {"t": "高频失分点", "v": "<b>忘记中心化就直接算 XᵀX。</b> 那样得到的第一「主方向」往往指向数据中心的方位，而不是数据的伸展方向。手算题里中心化后<b>每一列的和应当为 0</b>——这是官方给的自检步骤，算完务必核一下。", "w": 1}, "exam": "「S 与 Σ 的特征向量/特征值关系」几乎必考。答题写：<b>特征向量相同、特征值差 (n−1) 倍、解释方差比不变</b>；问方差数值或对 sklearn 才除。", "ng": "推导从 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=688s\" target=\"_blank\">11:28</a> 开始：先讲预处理，再说「投影长度就是 xᵀu」，到 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=914s\" target=\"_blank\">15:14</a> 写出「最大化投影方差」并展开，<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=1018s\" target=\"_blank\">16:58</a> 那里他指着式子说<b>「这就是协方差矩阵」</b>，接着 18:36–21:20 用拉格朗日解出 <b>Σu = λu</b>。<b>想弄懂「为什么偏偏是特征向量」，听这 10 分钟最直接。</b><span class='src'>视频：CS229 Lecture 15 · 讲义：ch12_pca.txt「Why covariance eigenvectors appear」一节</span>", "quote": "<b>PCA Finds Directions of Maximum Variance</b> — <em>Mean-centring makes covariance describe variation around the data centre.</em> · <b>S = XcᵀXc</b>；<em>Sample covariance is S/(n−1); the scale changes eigenvalues, not eigenvectors.</em> · <em>The eigenvector with the largest eigenvalue is the first principal direction.</em>", "tbl": [{"cap": "by-hand 数据 (−3,0)(3,0)(0,−1)(0,1)：S 与 Cov 的对照（已复算）", "head": ["量", "用 S", "用 Cov = S/3"], "rows": [["矩阵", "[[18, 0], [0, 2]]", "[[6, 0], [0, 0.667]]"], ["特征值", "18 与 2", "<b>6 与 0.667</b>（差 3 倍）"], ["特征向量", "(1,0) 与 (0,1)", "<b>完全相同</b>"], ["解释方差比", "18/20 = <b>0.9</b>", "6/6.667 = <b>0.9</b>（一样）"], ["对应 sklearn", "—", "<code>explained_variance_</code> ≈ [6, 0.667]"]]}]}, {"r": [8, 8], "t": "PCA 是一串线性代数决定，每步都有自检", "star": 2, "one": "准备 → 协方差 → 分解 → 投影，四步，每步都有一个能当场检查的量。", "pts": ["⭐ <b>这一页的关键词是 diagnostic——每一步都有一个可以当场检查的量。</b> 手算大题写出这些检查，就是在给自己送分。", "<b>第 1 步 Prepare</b>：中心化是<b>必须</b>的；标准化是<em>if units differ</em>——<b>有条件的</b>。这两者的地位不同，别混为一谈。", "<b>第 3 步 Decompose 的动词是 sort</b>：解出特征对之后<b>必须按特征值从大到小排序</b>。不排序的话「第一主成分」就没有意义。", "<b>第 4 步 Project 之后还有一个动作</b>：<em>inspect retained variance</em>——算完得分要<b>检视保留了多少方差</b>，这是决定保留几个成分的依据。"], "tip": {"t": "送分的自检", "v": "手算大题里把「列和为 0」和「λ 之和 = 迹」写出来，是<b>免费的采分点</b>，而且能当场抓住算错的均值。"}, "exam": "大题要求「展示矩阵计算与中心化步骤」。<b>把上表第三列的自检写进答卷</b>——「中心化后列和为 0」「Σλ=trace(S)」「‖v‖=1」，既防止自己算错，也是明确的采分点。", "ng": "预处理那一段在 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=688s\" target=\"_blank\">11:28</a>–14:40。CS229 把它拆成<b>两件事</b>并说明各自何时可省：减均值只有在已知均值为 0 时才能省（如声学信号）；除标准差只在各特征本来同尺度时能省（如灰度图 0–255）。<span class='src'>视频：CS229 Lecture 15 · 讲义：ch12_pca.txt 预处理段</span>", "quote": "<b>PCA Is a Sequence of Linear-Algebra Decisions</b> — <em>Each step has a diagnostic students can check.</em> · 1 Prepare — <em>centre features; standardise if units differ</em> → 2 Covariance → 3 Decompose — <em>sort eigenvectors by decreasing eigenvalue</em> → 4 Project", "tbl": [{"cap": "四步 · 每步的自检量（考试写出来就是采分点）", "head": ["步", "做什么", "<b>当场能检查的量</b>"], "rows": [["1 Prepare", "减均值；必要时标准化", "<b>每一列的和 = 0</b>"], ["2 Covariance", "S = XcᵀXc 或 S/(n−1)", "<b>S 对称</b>；对角线非负"], ["3 Decompose", "解特征对，<b>按 λ 降序排</b>", "<b>Σλ = trace(S)</b>；‖v‖ = 1；两向量点积 = 0"], ["4 Project", "Z = Xc W，看保留方差", "解释方差比<b>加起来为 1</b>（全保留时）"]]}], "say": "第 3 步那两个自检值得多说一句。<b>Σλ = trace(S)</b>（特征值之和等于对角线之和）是线性代数的恒等式，手算时<b>一秒钟就能验出特征值解错没有</b>——by-hand 例子里 18+2 = 18+2 ✓。而<b>特征向量两两正交</b>不是 PCA 额外要求的，是因为 <b>S 是对称矩阵，而对称矩阵的特征向量必然正交</b>。"}, {"r": [9, 9], "t": "PCA 保的是方差，不是意义", "star": 3, "one": "高方差方向可能只是量纲、光照或批次效应；低方差方向可能才是分类关键。", "pts": ["⭐ <b>页标题就是结论</b>：<b>PCA 保的是方差，不一定保意义。</b> 这句话是大题「说出局限」那一步最常用的一句。", "<b>五条局限各自的机制</b>——<b>缩放</b>：大量纲特征在协方差里贡献大，方向就被它拽过去；<b>离群点</b>：平方距离对极端值极其敏感，几个点就能把成分转过去；<b>线性</b>：PCA 只会找<b>线性</b>子空间，弯曲的流形它表示不了；<b>方差</b>：高方差和「对任务有用」<b>没有必然联系</b>；<b>解释</b>：成分的<b>符号是任意的</b>。", "⚠️ <b>成分符号任意这一条经常被忽略</b>：v 和 −v 是同一个特征向量（都满足 Σv=λv、‖v‖=1），所以 sklearn 给你 (0.6, 0.8) 还是 (−0.6, −0.8) <b>纯看求解器</b>。<b>得分会整体变号，但解释方差、重构结果完全不变。</b>", "<b>为什么低方差方向仍可能要紧</b>（Study check 第一问）：方差大小衡量的是<b>输入自己的变化</b>，和<b>类别可不可分</b>没有关系。一个方向上两类正好分得开、但整体幅度很小，PCA 会第一个把它丢掉。"], "say": "CS229 里 Ng 对这一页有更重的说法。他说自己跑 PCA 时<b>从不去看任何单个特征向量</b>，因为<b>单个特征向量的位置在数值上是不稳定的</b>——改一个训练样本、动一下小数点第五位，基就可能在子空间里大幅旋转。<b>稳定的是前 k 个特征向量张成的子空间，不是单根轴。</b> 他用这一点解释了为什么 K-means 的簇质心可以解释、而主成分不可以，也用它否掉了 eigenfaces 那套解读（「至少一半是研究者的想象」）。", "tip": {"t": "高频失分点", "v": "<b>「解释方差 95% 所以信息几乎没丢」</b>——丢没丢<b>对任务有用的</b>信息，解释方差答不了。它只说明保住了多少<b>输入的</b>变化。", "w": 1}, "exam": "「PCA 降维后分类反而变差」是选择题原型。答：<b>PCA 只最大化输入方差、从不看 y</b>，被丢掉的低方差方向可能正是判别关键；要判断只能用<b>验证数据</b>比较有无 PCA。若目的是抗过拟合，<b>正则化是更直接的手段</b>。", "ng": "两处值得听：<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=1735s\" target=\"_blank\">28:55</a> 讲为什么要标准化（举了具体例子）；<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=3393s\" target=\"_blank\">56:33</a> 他直接问 <b>「Can PCA overfit?」</b>。更有意思的是 38:00 之后他把「用 PCA 降过拟合」列为<b>可疑的应用</b>，说实测下来<b>成败各半</b>，而成功的那一半发了论文——但讲义里又写「降维可减小假设类复杂度」。<b>这个张力本身就是理解这一页的钥匙。</b><span class='src'>视频：CS229 Lecture 15 后半 · 讲义：ch12_pca.txt 应用段</span>", "quote": "<b>PCA Preserves Variance, Not Necessarily Meaning</b> — Scaling: <em>Large-unit features can dominate directions</em> · Outliers: <em>Extreme points can rotate components</em> · Linearity: <em>Curved manifolds may not be represented well</em> · Variance: <em>High variance may be unrelated to a target</em> · Interpretation: <em>Component signs are arbitrary and loadings need context</em>", "tbl": [{"cap": "五条局限 · 机制与应对", "head": ["局限", "机制", "应对"], "rows": [["缩放", "大量纲特征在协方差里占比大", "比较缩放前后的结果；必要时标准化"], ["离群点", "平方距离对极端值敏感，成分会被转向", "先查离群点；或用稳健方法"], ["线性", "只能表示<b>线性</b>子空间", "弯曲结构考虑非线性降维"], ["方差", "<b>高方差 ≠ 与目标相关</b>", "用<b>验证数据</b>比较有无 PCA"], ["解释", "<b>符号任意</b>、载荷需要上下文", "别解读单个成分的符号；看子空间"]]}, {"cap": "⚠ PCA 与线性回归最小化的误差不是同一个（Study check 第二问）", "head": ["", "PCA", "线性回归"], "rows": [["最小化什么", "到子空间的<b>正交（垂直）距离</b>", "y 方向的<b>竖直</b>残差"], ["用不用 y", "<b>不用</b>", "用"], ["对称性", "x 与 y 地位对称", "不对称（换轴结果就变）"]]}]}, {"r": [10, 10], "t": "投影给坐标，重构回特征空间", "star": 3, "one": "得分是新坐标；重构是把坐标映回去——两者回答的问题不同。", "eq": "Z = Xc Wₖ        （得分：n × k）\nX̂ = Z Wₖᵀ + μ    （重构：n × d）\n保留方差 = (λ₁+…+λₖ) / (λ₁+…+λ_d)", "pts": ["⭐ <b>三个对象必须分清</b>，这是这一页的全部重点：<b>方向</b>（特征向量 v，d 维，单位长度）、<b>得分</b>（标量 z，新坐标）、<b>重构</b>（x̂，回到原特征空间，d 维）。", "⚠️ <b>投影用中心化数据，均值只在重构时加回去。</b> 这是官方明说的顺序（<em>add the mean only during reconstruction</em>）。顺序错了重构结果会整体平移。", "<b>为什么重构要加回均值</b>：投影是在<b>中心化后</b>的坐标系里做的，z·vᵀ 得到的是「相对于数据中心的偏移」；要回到原始特征空间，必须把当初减掉的 μ 加回来。", "<b>保留方差的比值</b>：选中的特征值之和 ÷ 全部特征值之和。<b>全部保留时比值加起来是 1</b>——这是一个自检。"], "say": "⭐ 上表最后一行藏着一个漂亮的恒等式：<b>重构误差的平方和 = 被丢掉的特征值之和</b>。这个例子里被丢掉的是 λ₂ = 2，而误差合计正好也是 2（我用 numpy 复算过）。这解释了为什么<b>「最大化投影方差」和「最小化正交重构误差」是同一件事</b>——总方差固定，保住的多，丢掉的就少。CS229 用勾股定理给了这个等价性的完整证明。", "tip": {"t": "容易混", "v": "<b>得分 z 不是「距离」。</b> 它是<b>带符号的坐标</b>：z 可以是负数，表示在 v₁ 的反方向。上表里 (−3,0) 的得分是 <b>−3</b> 不是 3。", "w": 1}, "exam": "「哪个是方向、哪个是坐标、为什么逆变换要加回均值」是官方 Study check 原题。另一道常考：<b>给一组特征值，问保留 k 个的解释方差比</b>——直接用上面那个比值。", "ng": "对应 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=1280s\" target=\"_blank\">21:20</a>–27:00：取前 k 个特征向量、写出 y=(u₁ᵀx,…,u_kᵀx)，并说明<b>解压就是 x ≈ y₁u₁+…+y_ku_k</b>——他把「压缩 1000 维到 10 个数、再解压回去」讲得很具体。<span class='src'>视频：CS229 Lecture 15 · 讲义：ch12_pca.txt top-k 与应用段</span>", "quote": "<b>Projection Separates Coordinates from Reconstruction</b> — <em>Scores are new coordinates; reconstruction maps them back to feature space.</em> · <b>Z = XcWₖ，X̂ = ZWₖᵀ + μ</b> · <em>Use centred data for the projection; add the mean only during reconstruction.</em> · <em>Retained variance = selected eigenvalue sum ÷ total eigenvalue sum.</em>", "tbl": [{"cap": "三个对象 · 只保留 PC1 时的形状与含义", "head": ["对象", "形状（d 维、n 个样本）", "是什么"], "rows": [["方向 v₁", "d × 1", "<b>一个方向</b>，单位长度"], ["得分 zᵢ", "每个样本一个<b>标量</b>", "<b>新坐标</b>：该样本在 v₁ 上投影多远"], ["重构 x̂ᵢ", "d × 1", "<b>回到原特征空间</b>的近似点"], ["components_", "k × d（<b>一行一个方向</b>）", "sklearn 存主方向的地方"], ["transform(X)", "n × k", "得分矩阵"]]}, {"cap": "by-hand 例子只留 PC1（已复算）", "head": ["原始点", "得分 z", "重构 x̂", "误差²"], "rows": [["(−3, 0)", "−3", "(−3, 0)", "0"], ["(3, 0)", "+3", "(3, 0)", "0"], ["(0, −1)", "<b>0</b>", "(0, 0)", "1"], ["(0, 1)", "<b>0</b>", "(0, 0)", "1"], ["合计", "—", "—", "<b>2</b>"]]}]}, {"r": [11, 11], "t": "Checkpoint：五个必须能默写的量", "star": 2, "one": "中心化 / 协方差 / PC1 / 得分 / 重构——盖住右边，自己先说一遍。", "eq": "zᵢ = xᵢ,cᵀ v₁　（第 i 个观测在 PC1 上的得分）\nx̂ᵢ = zᵢ v₁ᵀ + μ　（用一个成分重构）", "pts": ["<b>这一页是官方给的「必须能默写」清单</b>，五个量。Study check 的要求是 <em>without looking</em>——合上书能写出来才算过关。", "<b>五个量之间的连接</b>（Study check 要你说出一条）：最容易说的一条是——<b>PC1 是协方差矩阵最大特征值对应的特征向量，而那个特征值就等于得分的方差</b>。也就是说，<b>λ₁ = Var(z)</b>。", "<b>另一条连接</b>：得分用<b>中心化</b>的 xᵢ,c，重构时<b>加回</b> μ——两个式子里 μ 的出现位置正好互补。", "⚠️ <b>zᵢ = xᵢ,cᵀ v₁ 里的转置位置</b>：xᵢ,c 是列向量，转置后是行向量，和 v₁ 做内积得到<b>标量</b>。写成 v₁ᵀ xᵢ,c 是同一个数。"], "tip": {"t": "主动回忆", "v": "这一页就是给你做遮挡自测的。能不看提示把五个量和它们之间的关系说全，PCA 的计算部分就稳了。"}, "exam": "Checkpoint 页的内容<b>就是手算大题会用到的全部量</b>。考前把这张表默写一遍，能确认没有漏洞。", "quote": "<b>M2 T1 Checkpoint</b>：Centre — <em>subtract each feature mean</em> · Covariance — <em>compute from centred observations</em> · PC1 — <em>eigenvector of largest eigenvalue</em> · Score — <b>zᵢ = xᵢ,cᵀ v₁</b> · Reconstruct — <b>x̂ᵢ = zᵢ v₁ᵀ + μ</b>", "tbl": [{"cap": "五个量 · 默写自检表（盖住右两列试试）", "head": ["量", "定义", "by-hand 例子的值"], "rows": [["Centre", "减去每个特征的均值", "μ = (0, 0)，本来就已中心化"], ["Covariance", "<b>从中心化后的观测</b>算", "S = [[18,0],[0,2]]"], ["PC1", "<b>最大特征值</b>对应的特征向量", "v₁ = (1, 0)，λ₁ = 18"], ["Score", "zᵢ = xᵢ,cᵀ v₁", "(−3, 3, 0, 0)"], ["Reconstruct", "x̂ᵢ = zᵢ v₁ᵀ + μ", "(−3,0) (3,0) (0,0) (0,0)"]]}], "say": "Checkpoint 这五个量可以串成<b>一条因果链</b>，比孤立记忆省事得多：<br><b>中心化</b>决定了原点 → 原点决定了<b>协方差</b>长什么样 → 协方差的特征分解给出 <b>PC1</b> → PC1 和中心化数据的内积给出<b>得分</b> → 得分乘回 PC1 再加均值给出<b>重构</b>。⭐ 注意这条链的<b>首尾呼应</b>：<b>开头减掉的 μ，结尾又加了回来</b>。这不是巧合——投影整个是在「以数据中心为原点」的坐标系里做的，要回到原始特征空间就必须把那个平移还原。<b>能说出这一条，Study check 要的「一条连接」就有了。</b>", "ng": "Ng 没有「Checkpoint 页」这种东西，但这五个量他都推过，而且<b>最关键的一步讲得比课件细</b>：<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=914s\" target=\"_blank\">15:14</a> 起他写下「在 ‖u‖=1 的约束下最大化投影的平方平均」，展开后指着中间那一坨说<b>这就是协方差矩阵</b>；到 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=1184s\" target=\"_blank\">19:44</a> 用<b>拉格朗日乘子</b>求导令零，<b>Σu = λu 直接掉出来</b>。⭐ 所以 Checkpoint 里「PC1 = 最大特征值对应的特征向量」这一条，<b>在 CS229 里是解出来的结论，不是定义</b>——理解了这点，这一行就不用背了。<span class=\"src\">CS229/transcripts/ · 本地已下载全部 20 讲</span>"}, {"r": [12, 12], "t": "sklearn 的 API 就是这条工作流", "star": 2, "one": "fit 学均值和方向 → components_ 读方向 → transform 得分 → inverse_transform 重构。", "pts": ["<b>考的是「读输出」不是「写代码」。</b> 重点在于每个属性对应数学里的哪个量。", "⚠️ <b>components_ 是「一行一个方向」</b>（<em>as rows</em>）。所以保留 1 个成分、原始 2 个特征时，<code>components_</code> 的形状是 <b>(1, 2)</b>，而 <code>transform(X)</code> 的形状是 <b>(n, 1)</b>——这正是官方 Study check 的第二问。", "<b>fit 学到了两样东西</b>：<em>the mean and directions</em>——<b>均值和方向</b>。均值存在 <code>mean_</code> 里，这就是为什么 <code>inverse_transform</code> 能自动把均值加回去。", "<b>explained_variance_ 是协方差矩阵的特征值</b>（by-hand 例子里是 6 和 0.667），<b>explained_variance_ratio_ 是比例</b>（0.9 和 0.1）。⚠️ 前者是<b>除过 (n−1) 的</b>，别和 S 的特征值 18、2 搞混。"], "tip": {"t": "高频失分点", "v": "<b>把 explained_variance_ 和 S 的特征值混为一谈。</b> 前者 = 后者 ÷ (n−1)。例子里是 <b>6 与 0.667</b>，不是 18 与 2。但<b>比例（0.9 / 0.1）两边一样</b>。", "w": 1}, "exam": "「读输出」型选择题。记牢三件事：<b>components_ 一行一个方向</b>、<b>explained_variance_ 是协方差的特征值</b>、<b>k=1 时形状是 (1,d) 与 (n,1)</b>。", "ng": "<b>CS229 没有对应内容。</b> CS229 是 2018 年的课，作业用 Python/NumPy 手写，<b>没有讲 scikit-learn 的 API</b>。这一页的属性方法只能按 Canvas 的 Python 工作流页来记。<span class='src'>来源：Canvas「PCA in Python: a guided workflow」，本地 M2材料/Canvas讲义/T1-B_PCA讲义.txt</span>", "quote": "<b>The scikit-learn API Mirrors the PCA Workflow</b> — <em>Use fitted attributes to connect code back to the mathematics.</em> · <code>PCA(n_components=k).fit(X)</code> <em>learns the mean and directions</em> · <code>components_</code> <em>stores the principal axes as rows</em> · <code>transform(X)</code> <em>gives scores</em>", "tbl": [{"cap": "属性 ↔ 数学量（by-hand 例子的实际值）", "head": ["sklearn", "数学里是什么", "例子里的值"], "rows": [["<code>mean_</code>", "拟合时学到的 μ", "(0, 0)"], ["<code>components_</code>", "主方向，<b>一行一个</b>", "[[1, 0]]（k=1 时形状 1×2）"], ["<code>explained_variance_</code>", "<b>协方差</b>的特征值", "[6, 0.667]"], ["<code>explained_variance_ratio_</code>", "该方向占总方差的比例", "[0.9, 0.1]"], ["<code>transform(X)</code>", "得分 Z", "形状 n×k"], ["<code>inverse_transform(Z)</code>", "重构 X̂（<b>自动加回 μ</b>）", "形状 n×d"]]}], "say": "sklearn 这一页真正要防的是<b>三个量纲不同的东西被混为一谈</b>：<br><b>①</b> <code>components_</code> 是<b>方向</b>（单位向量，无量纲）；<br><b>②</b> <code>explained_variance_</code> 是<b>方差</b>（原特征单位的平方）；<br><b>③</b> <code>explained_variance_ratio_</code> 是<b>比例</b>（无量纲，加起来为 1）。<br>⚠️ 最常见的错是把 ② 和 S 的特征值混起来——<b>差 (n−1) 倍</b>。by-hand 例子里 S 的特征值是 <b>18 和 2</b>，而 <code>explained_variance_</code> 是 <b>6 和 0.667</b>；但 ③ <b>两边完全一样（0.9 / 0.1）</b>，因为分子分母同时除以 3 约掉了。<b>记住这个「差三倍但比例不变」的例子，比记公式牢。</b>"}, {"r": [13, 13], "t": "缩放与泄漏会改变 PCA 的结果", "star": 3, "one": "PCA 自动中心化，但<b>不会</b>替你统一尺度；预处理参数只能在训练集上学。", "pts": ["⚠️ <b>第一句就纠正了一个常见误解</b>：<em>PCA centres features, but does not standardise their scales</em>——<b>PCA 自己会中心化，但不会标准化</b>。想要标准化必须你自己加 <code>StandardScaler</code>。", "<b>为什么大量纲特征会主导</b>：协方差里每个特征的贡献是它<b>自身方差</b>的量级。一个以元为单位、方差上万的特征，和一个 0~1 的特征放在一起，前者几乎独占第一主方向——<b>这时 PC1 基本就是那个特征本身</b>，没有信息量。", "⭐ <b>顺序是：先切分 → 只在训练集上 fit → 用同一变换 transform 两边。</b> 三步一步都不能换。", "<b>两种错法的毛病不同</b>：<b>全量 fit</b> ⇒ 测试集信息渗进了变换，是<b>数据泄漏</b>；<b>测试集上重新 fit</b> ⇒ 两边坐标系<b>不一致</b>，得分根本没法比。"], "say": "CS229 课上有学生问过一模一样的问题：<b>「用 PCA 的话，测试集上是不是也要求一遍特征向量？」</b> Ng 的回答是 <b>The answer is actually no</b>——在训练集上跑一次，<b>特征向量从此永久固定</b>，测试数据一律用同一组 uᵢ 映射过去。实务上把 <code>StandardScaler</code> 和 <code>PCA</code> 放进 <code>Pipeline</code> 最稳，交叉验证时每一折会自动只在训练折上 fit。", "tip": {"t": "高频失分点", "v": "<b>「PCA 不用标签，所以全量 fit 不算泄漏」</b>——错。<b>泄漏与用不用标签无关</b>，只要测试集的信息进了变换，评估就偏乐观了。", "w": 1}, "exam": "泄漏题是 T1 选择题的固定考点。答题写全三步：<b>split → train 上 fit → 同一变换 transform 两边</b>，并点明<b>放进 Pipeline</b>。", "ng": "标准化那段在 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=1735s\" target=\"_blank\">28:55</a>–32:00。⚠️ <b>泄漏（train-only fit）CS229 是在 Lecture 8 讲的</b>（偏差方差与模型选择那一讲），不在 PCA 这一讲里；本地对应 <code>CS229/transcripts/L8.txt</code>。<span class='src'>视频：CS229 Lecture 15（标准化）+ Lecture 8（划分与泄漏）</span>", "quote": "<b>Scaling and Leakage Change the PCA Result</b> — Centre: <em>PCA centres features, but does not standardise their scales</em> · Split first: <em>Create train and test sets before learning preprocessing parameters</em> · Fit on train: <em>Fit StandardScaler and PCA using training data only</em>", "tbl": [{"cap": "哪些操作会「学参数」（学了就不能在测试集上重学）", "head": ["操作", "学到什么参数", "测试集上"], "rows": [["<code>StandardScaler</code>", "每个特征的<b>均值与标准差</b>", "<b>只 transform</b>"], ["<code>PCA</code>", "<b>均值 μ 与主方向 W</b>", "<b>只 transform</b>"], ["缺失值填补", "填补用的统计量", "<b>只 transform</b>"], ["取对数 / 平方等", "<b>不学参数</b>", "可各自做"]]}, {"cap": "三种做法对照", "head": ["做法", "问题"], "rows": [["全量数据上 fit 后再切分", "<b>数据泄漏</b>：测试集信息进了变换"], ["训练集与测试集各自 fit", "<b>坐标系不一致</b>，得分不可比"], ["<b>切分 → train 上 fit → 两边 transform</b>", "<b>✓ 正确</b>"]]}]}, {"r": [14, 14], "t": "第一部分小结 + 进 tutorial 前的清单", "star": 2, "one": "五条要点 + 五个手算前必须确认的动作。", "pts": ["<b>五条小结按重要性排</b>，第 3 条和第 5 条最常出题。", "<b>「Scaling is a modelling decision, not a cosmetic step」</b>——缩放是<b>建模决定</b>，不是化妆。这句话可以整句抄进大题。", "<b>「Projection and reconstruction answer different questions」</b>——投影回答「这个样本在新坐标系里的位置」，重构回答「只用这些方向能把原始观测还原到什么程度」。<b>前者给坐标，后者给误差。</b>", "<b>Study check 要求</b>：说清<b>主方向 / 得分 / 重构观测</b>三者的区别，并各自指出对应的 sklearn 方法或属性——答案见 p10 与 p12 的表。"], "tip": {"t": "自测", "v": "能不能一句话说清「主方向、得分、重构观测」三者的区别，并各自点出对应的 sklearn 属性或方法？说不出就回到第 10 页。"}, "exam": "小结页的五句话<b>每一句都可以直接当大题的采分句</b>。尤其「缩放是建模决定」和「投影与重构回答不同的问题」。", "quote": "<b>Section 1 Complete</b> — Key Takeaways：<em>PCA is unsupervised: no target guides the directions</em> · <em>Mean-centring is required for the standard derivation</em> · <em>Scaling is a modelling decision, not a cosmetic step</em> · <em>Eigenvalues rank directions by captured variance</em> · <em>Projection and reconstruction answer different questions</em>", "tbl": [{"cap": "三个对象 ↔ sklearn（Study check 的答案）", "head": ["对象", "是什么", "sklearn"], "rows": [["主方向 principal direction", "一个单位向量", "<code>components_</code>"], ["得分 score", "新坐标（标量）", "<code>transform(X)</code>"], ["重构观测 reconstructed observation", "回到原特征空间的近似点", "<code>inverse_transform(Z)</code>"]]}], "say": "五条小结里，<b>第 3 条和第 5 条是「立场」而不是「事实」</b>，值得单独标出来：<br><b>「缩放是建模决定，不是化妆」</b>——这是在反对一种常见做法：拿到数据不问三七二十一先 StandardScaler。课件的立场是<b>要论证</b>：量纲不可比时考虑标准化，但若方差差异<em>本身有含义</em>，标准化反而抹掉了它。<br><b>「投影与重构回答不同的问题」</b>——这是在反对把两者当成一个操作的两半。<b>投影问「这个样本在新坐标系里在哪」，重构问「只用这些方向能还原到什么程度」</b>：前者的输出是坐标，后者的输出是<b>误差</b>。大题里问的是哪一个，决定了你该报什么数。", "ng": "⭐ <b>Ng 在这一页的位置上说了一句课件完全没有的话</b>，而且是整讲最实用的一条建议：<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=2661s\" target=\"_blank\">44:21</a>「<em>Before using PCA, consider just using the original data x(i)</em>」——<b>用 PCA 之前，先试试直接用原始数据会怎么样</b>。他说在 CS229 的课程项目提案里经常看到学生写「我打算先把 x 降成低维 y」，但<b>很多时候根本没必要</b>，并把这种习惯类比成<b>过早优化</b>。⭐ 对你们的直接用处：这句话可以<b>原样写进大题的「局限」那一步</b>——<b>「本流程中的 PCA 是否必要，应与不降维的基线对照后才能确定」</b>。<span class=\"src\">CS229/transcripts/ · 本地已下载全部 20 讲</span>"}, {"r": [15, 15], "t": "Tutorial 三道题各在考什么", "star": 1, "one": "Q1 中心化与矩阵，Q2 特征对与归一化，Q3 投影重构与保留方差；扩展题考缩放与预测有用性。", "pts": ["⚠️ <b>关键词是 rank-one（秩 1）</b>——Tutorial 用的数据<b>完全共线</b>。这不是巧合，是特意设计的：秩 1 意味着<b>第二个特征值恰好是 0</b>，于是解释方差是 100% / 0%，重构误差是 0。", "<b>三问各自测什么</b>：Q1 测<b>中心化与矩阵构造</b>；Q2 测<b>特征对求解与归一化</b>；Q3 测<b>投影、重构与解释方差</b>。三问正好覆盖 p7–p10 的全部内容。", "⭐ <b>「Show matrix calculations and centring steps」是评分要求</b>：<b>要展示中间步骤</b>，只写最后答案拿不到全部分数。", "<b>Study check 的第二问很值得想</b>：<em>为什么 PCA 可能保住了方差却丢掉了对目标要紧的信息？</em>——因为方差衡量的是<b>输入自身</b>的变化，与<b>类别可分性</b>无关（见 p9）。"], "tip": {"t": "答题要求", "v": "题面写明要<b>展示矩阵计算和中心化检查</b>。只写最终答案会丢过程分。"}, "exam": "Tutorial 三问就是大题的原型。答题结构：<b>列出中心化后的矩阵 → 写 S → 解特征对并排序 → 归一化 → 投影 → 算解释方差 → 解释含义</b>。", "quote": "<b>Section 2: M2 T1 Tutorial Activity</b> — <em>Three core questions reproduce PCA on a small rank-one dataset</em> · Q1 <em>centres data and forms scatter/covariance matrices</em> · Q2 <em>verifies eigenpairs and normalises the first component</em> · Q3 <em>projects, reconstructs and explains retained variance</em> · <em>Show matrix calculations and centring steps</em>", "tbl": [{"cap": "Tutorial 数据 (1,2)(2,4)(−1,−2)(−2,−4)：秩 1 的后果（已复算）", "head": ["量", "值", "为什么"], "rows": [["均值", "(0, 0)", "数据本来就已中心化"], ["S = XcᵀXc", "[[10, 20], [20, 40]]", "两列严格成 1:2"], ["det(S)", "<b>0</b>", "两行成比例 ⇒ 秩 1"], ["特征值", "<b>50 与 0</b>", "Σλ = 50 = trace ✓"], ["PC1", "(1,2)/√5 ≈ (0.4472, 0.8944)", "归一化后 ‖v‖=1"], ["解释方差", "<b>100% / 0%</b>", "λ₂ = 0"], ["重构误差", "<b>0</b>", "= 被丢掉的特征值之和 = 0"]]}], "say": "<b>秩 1 数据的特殊性要拿捏好</b>：它让每一步的数字都很干净，非常适合手算；但也意味着<b>「投影垂线长度 = 丢掉的信息」这个几何直觉在这组数据上看不出来</b>——所有点本来就在那条线上，垂线长度全是 0。想理解那个几何含义，要看<b>不共线</b>的例子（比如 by-hand 那组，垂线长度分别是 0、0、1、1）。", "ng": "⚠️ <b>Tutorial 用的是「秩 1」数据，这在 CS229 里是被明确点名为「不现实」的尺度。</b><a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=408s\" target=\"_blank\">06:48</a> Ng 说 2 维压 1 维「<em>in practice people don't do this</em>」，典型数字是 <b>10,000 维压到 1,000 或 100 维</b>，他之所以在黑板上画 2→1，纯粹是因为<b>白板只有二维</b>。⭐ 所以这组数据的定位要拿捏准：<b>它是为了「能用笔算出来」而设计的，不是 PCA 的真实使用场景</b>。手算题里它很好用（每一步都是整数），但别把「解释方差 100%」这种结论迁移到真实数据上。<span class=\"src\">CS229/transcripts/ · 本地已下载全部 20 讲</span>"}, {"r": [16, 16], "t": "Q1：先中心化，再算协方差", "star": 2, "one": "正确的协方差计算，从正确的原点开始。", "eq": "μ = 每个特征的均值\nXc = X − μ（逐行减）\nS = Xcᵀ Xc　，　Cov = S/(n−1)", "pts": ["⭐ <b>第 3 步「Verify」是官方写进流程的自检</b>：<b>中心化后每一列的和应当为 0</b>。算完立刻核一下，能挡掉绝大多数低级错误。", "<b>页标题的说法很准</b>：<em>A correct covariance calculation begins with the correct origin</em>——<b>协方差算得对不对，取决于原点选得对不对</b>。不中心化，原点就还在 (0,0)，算出来的不是「围绕数据中心的变化」。", "<b>S 与 Cov 都要会写</b>：S = XcᵀXc 是<b>散布矩阵</b>（scatter matrix），Cov = S/(n−1) 是<b>样本协方差</b>。手算优先用 S（整数），除非题目问方差数值。", "⚠️ <b>Xcᵀ Xc 的顺序不能反</b>：Xc 是 n×d，所以 Xcᵀ Xc 是 <b>d×d</b>（特征之间的关系，正确）；Xc Xcᵀ 是 n×n（样本之间的关系，那是另一回事）。"], "tip": {"t": "容易算错", "v": "<b>S 的非对角元算错符号。</b> S₁₂ = Σ xᵢ₁·xᵢ₂ = 1·2 + 2·4 + (−1)(−2) + (−2)(−4) = 2+8+2+8 = <b>20</b>——<b>负负得正</b>，四项全是正的。", "w": 1}, "exam": "Q1 是送分题，但<b>必须把第 3 步的验证写出来</b>。评分要求明确说了 <em>Show matrix calculations and centring steps</em>。", "quote": "<b>Question 1: Centre Before Covariance</b> — <em>A correct covariance calculation begins with the correct origin.</em> · 1 Find means → 2 Centre rows → 3 <b>Verify: each centred column should sum to zero</b> → 4 Form matrix — <b>S = XcᵀXc 和 Cov = S/(n−1)</b>", "tbl": [{"cap": "Q1 四步 · Tutorial 数据实做", "head": ["步", "操作", "结果"], "rows": [["1 求均值", "每个特征一个均值", "μ = (0, 0)"], ["2 中心化", "逐行减去均值向量", "Xc = X（本来就中心化了）"], ["3 <b>验证</b>", "<b>每列求和应为 0</b>", "1+2−1−2 = 0 ✓；2+4−2−4 = 0 ✓"], ["4 构造矩阵", "S = XcᵀXc；Cov = S/3", "S = [[10,20],[20,40]]；Cov = [[3.33,6.67],[6.67,13.33]]"]]}], "say": "「先中心化再算协方差」这件事，换个角度看会更好记：<b>协方差矩阵衡量的是「形状」，而不中心化会把「位置」混进去</b>。<br>想象一团很紧凑的点云，整体离原点很远。<b>不中心化</b>时，XᵀX 的最大特征向量会大致指向<b>原点到点云中心的方向</b>——因为那个方向上所有点的坐标都很大。但那是<b>位置信息</b>，和点云自己的伸展方向毫无关系。<b>中心化之后</b>，原点被移到点云中心，剩下的才是纯粹的形状。⭐ 这也解释了官方为什么把「每列和为 0」写成一个<b>验证步骤</b>：它是在确认原点真的移对了。", "ng": "Ng 讲预处理在 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=408s\" target=\"_blank\">06:48</a>：「<em>Before running PCA, common pre-processing is to zero out the mean and standard deviation</em>」。⚠️ <b>注意他把两件事连在一句话里说，但它们的地位不同</b>——<b>减均值是标准推导的前提（必须）</b>，<b>除以标准差是看情况的（特征同量纲时可省）</b>。课件把这两者分得比 Ng 这句话更清楚：<em>centre features; standardise <b>if units differ</b></em>。<b>答题按课件的口径写。</b><span class=\"src\">CS229/transcripts/ · 本地已下载全部 20 讲</span>"}, {"r": [17, 17], "t": "Q2：特征值给方向排序", "star": 3, "one": "特征方程给出候选方向，特征值决定谁排第一。", "eq": "det(S − λI) = 0        → 求出各个 λ\n(S − λI) v = 0         → 对每个 λ 求出 v\n按 λ 从大到小排序 → 归一化使 ‖v‖ = 1", "pts": ["<b>官方把这一问拆成四个检查</b>：<em>determinant</em>（求 λ）→ <em>null space</em>（求各自的 v）→ <em>order</em>（按最大 λ 排在前）→ <em>normalise</em>（保证 ‖v‖=1）。<b>四步缺一不可，尤其后两步最容易漏。</b>", "⚠️ <b>「归一化」不是可选项</b>：原话是 <em>Normalise the leading eigenvector <b>before using it as an axis</b></em>。因为特征向量方程 Sv=λv 对任意倍数都成立，不归一化的话「投影长度」可以靠拉长 v 随意放大，得分就没有意义了。", "<b>自检一：Σλ = trace(S)</b>。Tutorial 数据里 50 + 0 = 10 + 40 ✓。<b>这一秒钟的检查能挡住大部分特征值解错。</b>", "<b>自检二：det(S) = λ₁·λ₂</b>。这里 det = 10·40 − 20·20 = <b>0</b>，而 λ₁λ₂ = 50·0 = 0 ✓。<b>det = 0 本身就说明数据是秩 1 的。</b>"], "tip": {"t": "高频失分点", "v": "<b>忘记归一化</b>，直接拿 (1,2) 当轴去投影。那样算出的得分会是真实值的 √5 倍，解释方差比虽然不变，但<b>得分数值和重构结果全错</b>。", "w": 1}, "exam": "求特征对是大题主体。<b>把两个自检写进答卷</b>——既防算错，也是采分点。归一化那一步<b>务必写出 √5</b>，只写 (1,2) 会扣分。", "ng": "严格解在 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=1116s\" target=\"_blank\">18:36</a>–21:20：用拉格朗日乘子把带约束的最大化解成 <b>Σu = λu</b>，并说明<b>为什么取最大的特征值</b>。讲义里这一步写在脚注（「try using the method of Lagrange multipliers」）。<span class='src'>视频：CS229 Lecture 15 · 讲义：ch12_pca.txt 脚注 1</span>", "quote": "<b>Question 2: Eigenvalues Rank the Directions</b> — <em>The characteristic equation supplies candidate directions.</em> · <b>Sv = λv</b>；<em>Solve det(S−λI)=0, then solve (S−λI)v=0.</em> · <em>Normalise the leading eigenvector before using it as an axis.</em> · 四步检查：determinant → null space → order → normalise", "tbl": [{"cap": "Q2 四步 · Tutorial 数据实做（已复算）", "head": ["步", "做什么", "结果"], "rows": [["determinant", "解 det(S−λI)=0", "λ² − 50λ + 0 = 0 ⇒ <b>λ = 50, 0</b>"], ["null space", "对 λ=50 解 (S−50I)v=0", "[[−40,20],[20,−10]]v=0 ⇒ v ∝ <b>(1, 2)</b>"], ["order", "按 λ 降序", "50 在前 ⇒ PC1 用 (1,2)"], ["<b>normalise</b>", "除以 ‖v‖ = √5", "v₁ = <b>(1,2)/√5 ≈ (0.4472, 0.8944)</b>"]]}, {"cap": "两个一秒钟自检", "head": ["恒等式", "这里的值", "通过？"], "rows": [["Σλ = trace(S)", "50 + 0 = 10 + 40 = 50", "✓"], ["λ₁·λ₂ = det(S)", "50 × 0 = 0 = 10·40 − 20²", "✓（det=0 ⇒ 秩 1）"]]}], "say": "「归一化」这一步为什么<b>非做不可</b>，可以从目标函数直接看出来：<br>PCA 要最大化的是 <b>vᵀΣv</b>。如果不限制 v 的长度，<b>把 v 拉长 10 倍，目标就变成 100 倍</b>——最大化问题<b>没有解</b>（可以无限大）。所以约束 <b>‖v‖=1</b> 不是为了好看，<b>是为了让这个最大化问题有意义</b>。<br>⭐ 同样的道理解释了另一件事：<b>特征向量方程 Σv=λv 对任意倍数都成立</b>，所以求出 (1,2) 之后你<b>必须</b>除以 √5。否则投影得分会是真实值的 √5 倍——<b>解释方差比不受影响（分子分母同时放大），但得分数值和重构结果全错</b>。"}, {"r": [18, 18], "t": "Q3：投影、重构，并解释保留了多少", "star": 3, "one": "一维 PCA 的结果是「每个观测一个得分」。", "eq": "Z = Xc v₁　（每个观测一个得分）\nx̂ = z v₁ᵀ + μ　（重构，别漏 μ）\n保留方差 = λ₁ / Σλ", "pts": ["<b>第一句就是这一问的全部形状</b>：<em>A one-dimensional PCA result is one score per observation</em>——<b>降到一维，就是每个观测一个数</b>。n 个样本得到 n 个得分。", "<b>第 3 步的两个动作不能漏</b>：<em>map the first score back</em>（用 z·v₁ᵀ 映射回去）<b>and add μ</b>（加回均值）。", "<b>第 4 步是 calculate and interpret</b>——不只算出解释方差，还要<b>解释它意味着什么</b>。这里是 100%，意思是<b>这组数据本来就住在一条直线上，降到一维不丢任何信息</b>。", "⚠️ <b>但「不丢信息」要说清楚是在什么意义上</b>：不丢的是<b>输入的方差</b>。如果这两个特征背后还有个你关心的目标，PCA 照样可能把有用的东西丢掉（见 p9）。"], "say": "⭐ 两组数据对照着看，能一次理解<b>「重构误差 = 被丢掉的特征值之和」</b>这个恒等式：Tutorial 丢掉 λ₂=0，误差就是 0；by-hand 丢掉 λ₂=2，误差就是 2（两者我都用 numpy 复算过）。这也正是<b>「最大化投影方差」与「最小化正交重构误差」等价</b>的数值体现——总方差是固定的，保住的越多、丢掉的就越少。CS229 用勾股定理给了这个等价性的严格证明。", "tip": {"t": "四步答题法", "v": "<b>报结果 → 解释它说明什么 → 用可见证据支撑 → 说出证据的局限</b>。只写出 v₁ 和 100% 这两个数字，最多拿一半分。", "w": 1}, "exam": "Q3 是完整流程的收尾。答题必须包含：<b>归一化的 v₁ → 每个得分 → 重构结果 → 解释方差的数值与含义</b>，最后补一句<b>「保住方差不等于保住对目标有用的信息」</b>。", "quote": "<b>Question 3: Project and Reconstruct</b> — <em>A one-dimensional PCA result is one score per observation.</em> · 1 Choose PC1 — <em>use the normalised leading eigenvector</em> → 2 Project — <b>Z = Xc v₁</b> → 3 Reconstruct — <em>map the first score back and add μ</em> → 4 Interpret — <em>calculate and interpret the retained variance</em>", "tbl": [{"cap": "Q3 四步 · Tutorial 数据实做（已复算）", "head": ["步", "操作", "结果"], "rows": [["1 选 PC1", "归一化后的首特征向量", "v₁ = (1,2)/√5"], ["2 投影", "Z = Xc v₁", "(2.236, 4.472, −2.236, −4.472) = (√5, 2√5, −√5, −2√5)"], ["3 重构", "x̂ = z·v₁ᵀ + μ", "<b>完全等于原始点</b>（误差 0）"], ["4 解释", "λ₁/(λ₁+λ₂) = 50/50", "<b>100%</b> —— 秩 1，降维无损"]]}, {"cap": "⚠ 对照：如果换成 by-hand 那组不共线的数据", "head": ["", "Tutorial（秩 1）", "by-hand（不共线）"], "rows": [["特征值", "50, <b>0</b>", "18, <b>2</b>"], ["解释方差", "100% / 0%", "<b>90% / 10%</b>"], ["重构误差", "<b>0</b>", "<b>2</b>（= 丢掉的 λ₂）"], ["几何上", "点本来就在线上，垂线长度全 0", "有两点各差 1，垂线可见"]]}], "ng": "Ng 讲 top-k 与「解压」在 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=1450s\" target=\"_blank\">24:10</a> 起（他举 k=10 的例子）。⭐ 他对<b>得分的含义</b>给了一个很好的说法：解压式 x ≈ y₁u₁ + y₂u₂ + … + y_k u_k 说明<b>得分 y 就是「配方比例」</b>——这个点是由各个主方向<em>按多少份量</em>配出来的。<br>另外他在 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=3519s\" target=\"_blank\">58:39</a> 讲解释方差比时补了个直觉：<b>方差为零的数据就是「每个样本都等于零向量」</b>，所以方差衡量的是「数据相对于全零变化了多少」；而 PCA 本来就在最大化投影方差，<b>所以这个比值大致就是「你保住了多少信号、丢掉了多少」</b>。<span class=\"src\">CS229/transcripts/ · 本地已下载全部 20 讲</span>"}];

     全部存 localStorage，纯本地。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function rec(key, ok){
    var d = ST[key] || {n:0, w:0, r:[]};
    d.n++; if(!ok) d.w++;
    d.r.push(ok ? 1 : 0);
    if(d.r.length > 6) d.r = d.r.slice(-6);
    ST[key] = d; save();
  }
  /* 最近错次数 —— 薄弱点排序用的就是它，不是历史总错数：
     一个月前错过三次但最近三次全对，不该再排在最前面。 */
  function recentWrong(d){ return (d.r||[]).filter(function(x){ return x===0; }).length; }
  /* 「还算不算薄弱」：错过、且最近两次没有连对。
     用连对而不是「最近窗口里没有 0」，是为了让规则能一句话说清楚，
     用户看得见自己离毕业还差几次；也挡住了蒙对一次就算掌握。 */
  function isWeak(d){
    if(!d || !d.w) return false;
    var r = d.r || [];
    return !(r.length >= 2 && r[r.length-1] === 1 && r[r.length-2] === 1);
  }
  function unitWrong(start){
    var qs = Q[start] || [], rw = 0, w = 0, n = 0, qw = 0;
    qs.forEach(function(_,i){
      var d = ST[start+"#"+i]; if(!d) return;
      rw += recentWrong(d); w += d.w; n += d.n; if(isWeak(d)) qw++;
    });
    // rw 数的是最近错的**次数**（只用来排序，谁更该先复习）；
    // qw 数的是**还没毕业的题数**（给人看，也决定标红和进不进复习队列）。
    return {rw:rw, w:w, n:n, qw:qw};
  }
  function histHtml(d){
    var h = "";
    for(var i=0;i<6;i++){
      var v = d && d.r ? d.r[d.r.length-6+i] : undefined;
      h += '<i class="'+(v===1?"o":v===0?"x":"")+'"></i>';
    }
    return h;
  }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>自测 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key];
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        h += '<button class="opt" data-j="'+j+'">'+o+'</button>';
      });
      h += '<div class="why" style="display:none"></div>';
      h += '<div class="qhist">'+histHtml(d)+
           '<span style="margin-left:6px">'+
           (d ? "做过 "+d.n+" 次 · 错 "+d.w : "还没做过")+'</span>'+
           '<button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j, ok = (j === ans);
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(!ok){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          rec(key, ok);
          box.querySelector(".qhist").innerHTML =
            histHtml(ST[key]) + '<span style="margin-left:6px">做过 '+ST[key].n+
            ' 次 · 错 '+ST[key].w+'</span><button class="qagain">重做</button>';
          bindAgain(box); paintStrip(); revSync();
          var bd = document.querySelector('#card>h2 .qbadge');
          if(bd) bd.outerHTML = qBadge(+key.split('#')[0]);
          bindBadge();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){ render(cur); };
  }

  /* 页条上标红：这一单元最近还在错 */
  function paintStrip(){
    cells.forEach(function(c,k){
      var i = map[k+1];
      var cls = (i!=null ? "has" : "");
      if(i!=null){
        if(unitWrong(N[i].r[0]).qw > 0) cls += " err";
      }
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }


  /* ── 标题角标：不用滚到底就知道这页有没有题、错没错过 ── */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var st = unitWrong(start);
    return '<span class="qbadge'+(st.qw?" bad":"")+'" title="跳到自测">'+
      (st.qw ? "还错 "+st.qw+"/"+qs.length+" 题" : qs.length+" 题")+' ↓</span>';
  }

  /* ── 复习模式：前进/后退只在「最近还在错」的页之间跳 ──
     用户要的是「专项针对薄弱部分复习」。光有一张错题清单还得自己一条条点，
     所以把它接到翻页上：开了之后 ← → 就只在这些页里走。
     依据是**最近**错次，不是累计——早就改对的题不该再拦路。 */
  var rev = false, revList = [];
  function weakPages(){
    return N.filter(function(n){ return unitWrong(n.r[0]).qw > 0; })
            .map(function(n){ return n.r[0]; });
  }
  function revPaint(){
    var chip = document.getElementById("revChip");
    chip.classList.toggle("on", rev);
    if(!rev) return;
    var i = revList.indexOf(mapStart(cur));
    chip.querySelector("b").textContent =
      (i < 0 ? "?" : (i+1)) + " / " + revList.length + " 页";
  }
  function mapStart(p){ var i = map[p]; return i==null ? -1 : N[i].r[0]; }

  function step(d){
    if(!rev) return go(cur + d);
    if(!revList.length) return exitRev(true);
    var here = mapStart(cur), i = revList.indexOf(here);
    if(i < 0){                       // 当前不在清单里：跳到顺着方向最近的一页
      var t = null;
      for(var k=0;k<revList.length;k++){
        if(d > 0 ? revList[k] > cur : revList[k] < cur){ t = revList[k]; if(d>0) break; }
      }
      return go(t == null ? revList[d>0 ? 0 : revList.length-1] : t);
    }
    go(revList[(i + d + revList.length) % revList.length]);
  }
  function enterRev(){
    revList = weakPages();
    if(!revList.length){ alert("没有待复习的页——错过的题都连对两次毕业了。"); return; }
    rev = true; wp.classList.remove("on");
    go(revList.indexOf(mapStart(cur)) >= 0 ? cur : revList[0]);
    revPaint();
  }
  function exitRev(done){
    rev = false; revPaint();
    if(done) alert("待复习的页都毕业了，已退出复习模式。");
  }
  document.getElementById("revOff").onclick = function(){ exitRev(false); };

  /* 答完一题就重算一次清单：刚改对的页当场从复习队列里消失。 */
  function revSync(){
    if(!rev) return;
    revList = weakPages();
    if(!revList.length) exitRev(true); else revPaint();
  }

  /* 错题本 */
  var wp = document.getElementById("wrongPanel");
  function openWrong(){
    var list = [];
    N.forEach(function(n){
      var st = unitWrong(n.r[0]);
      if(st.n === 0 || st.w === 0) return;
      list.push({n:n, rw:st.rw, w:st.w, tot:st.n, qw:st.qw});
    });
    // 还没毕业的一律排前面；同样没毕业的，最近错得多的更靠前。
    list.sort(function(a,b){
      return (b.qw > 0) - (a.qw > 0) || (b.rw - a.rw) || (b.w - a.w); });
    var box = document.getElementById("wrongList");
    if(!list.length){
      box.innerHTML = '<div class="none">还没有错题。<br>做几道自测再回来看。</div>';
    } else {
      box.innerHTML = list.map(function(it){
        var qs = Q[it.n.r[0]] || [];
        // 每道题的六格单独成一组，多题的单元才不会连成一片看不出边界
        var h = qs.map(function(_,i){
          return "<u>"+histHtml(ST[it.n.r[0]+"#"+i])+"</u>"; }).join("");
        return '<div class="wrow'+(it.qw ? "" : " done")+'" data-p="'+it.n.r[0]+'">'+
          '<span class="p">p'+it.n.r[0]+'</span>'+
          '<span class="n2">'+it.n.t+'</span>'+
          '<span class="h">'+h+'</span>'+
          '<span class="s">'+(it.qw ? "还差 "+it.qw+" 题毕业" : "已毕业")+
          ' · 累计错 '+it.w+'/'+it.tot+'</span></div>';
      }).join("");
      box.querySelectorAll(".wrow").forEach(function(r){
        r.onclick = function(){ wp.classList.remove("on"); go(+r.dataset.p); };
      });
    }
    // 总账。三个数分工明确：做了多少、还有多少没过关、一共栽过几次。
    var done=0, tot=0, weak=0, wsum=0;
    Object.keys(Q).forEach(function(k){
      Q[k].forEach(function(_,i){
        tot++;
        var d = ST[k+"#"+i]; if(!d) return;
        done++; wsum += d.w; if(isWeak(d)) weak++;
      });
    });
    document.getElementById("wrongTally").innerHTML =
      '<span>做过 <b>'+done+'</b> / '+tot+' 题</span>'+
      '<span>没毕业 <b class="hot">'+weak+'</b> 题</span>'+
      '<span>累计错 <b>'+wsum+'</b> 次</span>'+
      '<span>待复习 <b>'+weakPages().length+'</b> 页</span>';
    document.getElementById("revOn").disabled = !weakPages().length;
    wp.classList.add("on");
  }
  document.getElementById("wrongBtn").onclick = openWrong;
  document.getElementById("revOn").onclick = enterRev;
  document.getElementById("wrongClose").onclick = function(){ wp.classList.remove("on"); };
  document.getElementById("wrongReset").onclick = function(){
    if(!confirm("清空全部自测记录？此操作不可撤销。")) return;
    ST = {}; save(); exitRev(false); paintStrip(); openWrong(); render(cur);
  };
  wp.onclick = function(e){ if(e.target === wp) wp.classList.remove("on"); };

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>

      + '用本地静态服务器打开即可。</p></div>';
