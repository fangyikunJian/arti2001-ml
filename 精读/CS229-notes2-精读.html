<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS229 讲义精读 · 生成式学习算法 · GDA 与朴素贝叶斯（讲义 Part IV） · 逐页精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}
.qbadge.bad{color:var(--warn)}
#wrongBox .tally{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
#wrongBox .tally span{border:1px solid var(--line);border-radius:8px;padding:5px 11px;
  font-size:12.5px;color:var(--dim);background:var(--sunken)}
#wrongBox .tally b{color:var(--ink);font-weight:650}
#wrongBox .tally b.hot{color:var(--warn)}
.wrow .h{gap:3px}
.wrow .h u{display:flex;gap:2px;text-decoration:none;
  padding-right:7px;margin-right:4px;border-right:1px solid var(--line)}
.wrow .h u:last-child{border-right:0;padding-right:0;margin-right:0}
#revChip{display:none;align-items:center;gap:9px;border:1px solid var(--warn);
  border-radius:8px;padding:5px 11px;font-size:12.5px;color:var(--warn);
  background:var(--tintwarn2);white-space:nowrap}
#revChip.on{display:inline-flex}
#revChip b{font:650 12px var(--mono)}
#revChip button{background:none;border:0;color:var(--dim);cursor:pointer;
  font:12px var(--cjk);text-decoration:underline;padding:0}
#revChip button:hover{color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default}
.btn:disabled:hover{border-color:var(--line)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qhist{font:11px var(--mono);color:var(--dim);margin-top:8px;display:flex;
  align-items:center;gap:5px}
.qhist i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.qhist i.o{background:var(--acc)} .qhist i.x{background:var(--warn)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
#strip b.err{background:var(--errdot)}
#strip b.err.on{background:var(--acc2)}
/* 错题本 */
#wrongPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#wrongPanel.on{display:flex}
#wrongBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(760px,100%);max-height:84vh;overflow:auto;padding:22px 24px}
#wrongBox h3{margin:0 0 4px;font-size:18px}
#wrongBox .sub{color:var(--dim);font-size:13px;margin:0 0 16px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;
  border:1px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--sunken)}
.wrow:hover{border-color:var(--acc2)}
.wrow .p{font:700 12px var(--mono);color:var(--acc2);flex:0 0 52px}
.wrow.done{opacity:.5}
.wrow.done .p{color:var(--acc)}
.wrow .n2{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.wrow .s{font:11.5px var(--mono);color:var(--dim);flex:0 0 auto}
.wrow .h{display:flex;gap:3px;flex:0 0 auto}
.wrow .h i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.wrow .h i.o{background:var(--acc)} .wrow .h i.x{background:var(--warn)}
#wrongBox .none{color:var(--dim);text-align:center;padding:30px 0;line-height:2}
#wrongFoot{display:flex;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line)}
#wrongFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ EXTRA_CSS:BEGIN ══ */
/* ══ 讲解区里的链接兜底 ══
   ⚠ 2026-10-03 查出来的：原先只给 .ng a 上了色，放在 tip / say / pts / exam 里的链接
   会退回浏览器默认的 #0000EE —— 浅色下还能看（8.47:1），**暗色下只有 1.95:1**。
   做 notes2 时第一次往 tip 里放时间码链接就撞上了。这条规则管住所有其它位置。 */
#card a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
#card a:hover{opacity:.75}

/* ══ 「从零补基础 · Andrew Ng」栏 ══ */
.ng{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintviolet)}
.ng .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--violet);
  letter-spacing:.4px;margin-bottom:5px}
/* ⚠ 要用 #card .ng a 而不是 .ng a —— 上面的兜底规则带了 #card 这个 id，
   光写 .ng a（0,1,1）会被 #card a（1,0,1）压过去，紫色链接会变蓝。 */
#card .ng a{color:var(--violet);text-decoration:none;border-bottom:1px solid var(--violet)}
#card .ng a:hover{opacity:.75}
.ng .src{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
:root:not([data-theme="dark"]) .ng{box-shadow:var(--shadow)}

/* ══ 「课件原话」栏：引官方英文 ══ */
.quote{border-left:3px solid var(--dim);background:var(--lift2);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;font-size:13px;line-height:1.7;color:var(--ink3)}
.quote .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--dim);
  letter-spacing:.4px;margin-bottom:5px}
.quote b{color:var(--ink2)}
.quote em{font-style:normal;color:var(--ink2);font-weight:560}

/* ══ 笔记表格：对比表 / 情况表 / 数值表 ══ */
.tw{margin:13px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tc{font-size:11.5px;font-family:var(--mono);color:var(--dim);letter-spacing:.3px;
  padding:7px 12px;background:var(--sunken);border-bottom:1px solid var(--line)}
table.nt{width:100%;border-collapse:collapse;font-size:12.8px;line-height:1.55}
table.nt th{text-align:left;font-weight:620;font-size:11.5px;color:var(--dim);
  background:var(--panel2);padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
table.nt td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.nt tbody tr:last-child td{border-bottom:none}
table.nt td:first-child{font-weight:560;color:var(--ink2)}
table.nt b{color:var(--ink2)}
:root:not([data-theme="dark"]) .tw{box-shadow:var(--shadow)}

/* ══ 「与考试的联系」栏 ══ */
.exam{border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintacc2)}
.exam .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--acc2);
  letter-spacing:.4px;margin-bottom:5px}
:root:not([data-theme="dark"]) .exam{box-shadow:var(--shadow)}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}
/* ══ EXTRA_CSS:END ══ */

</style>
</head>
<body data-key="cs234-2019-l01">

<div id="bar">
  <h1>CS229 讲义精读 · <span>生成式学习算法 · GDA 与朴素贝叶斯（讲义 Part IV）</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 14</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <span id="revChip">复习模式 <b></b><button id="revOff">退出</button></span>
  <button class="btn" id="wrongBtn">错题本</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="wrongPanel"><div id="wrongBox">
  <h3>错题本</h3>
  <p class="sub">错过的题<b>连着答对两次就毕业</b>，自动从这里和复习模式里退出。<br>
  还没毕业的排在前面，最近错得多的更靠前。点任意一行跳到那一页重看。</p>
  <div class="tally" id="wrongTally"></div>
  <div id="wrongList"></div>
  <div id="wrongFoot">
    <button class="btn" id="revOn">只复习这些页</button>
    <button class="btn" id="wrongClose">关闭</button>
    <button class="btn" id="wrongReset">清空全部记录</button>
  </div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示课件？</b></p>
      <p>本页直接引用同目录下的 <code>slides/cs229-notes2.pdf</code>。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>精读</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/CS229-notes2-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */

. 答题时把这两步分开写，才看得出你知道哪一步是假设。"}], "10": [{"t": "φ_{j|y=1} 的含义用大白话说是什么？", "o": ["垃圾邮件中出现了第 j 个词的那部分比例", "出现第 j 个词的邮件中垃圾邮件的比例", "第 j 个词是垃圾词的概率", "第 j 个词在所有邮件中出现的频率"], "a": 0, "w": "讲义原话：just the fraction of the spam (y=1) emails in which word j does appear。⚠️ 选项三把条件方向搞反了，那是 p(y=1|xⱼ=1)，正是要用贝叶斯反推的东西。"}, {"t": "实际实现朴素贝叶斯时，为什么一定要取对数把连乘变连加？", "o": ["50000 个小于 1 的数连乘会下溢成 0", "因为对数似然更容易求导", "因为对数能让模型变成线性的", "因为这样可以不用算分母"], "a": 0, "w": "双精度浮点在约 10⁻³⁰⁸ 处归零。log 单增所以 argmax 不变。⭐ 这也解释了零概率为什么致命：log 0 = −∞，一个没见过的词会把整个和拖到负无穷。"}], "11": [{"t": "训练集里从未出现过的词，会让朴素贝叶斯产生什么后果？", "o": ["模型会报错并停止训练", "预测结果略微偏向非垃圾邮件", "该词被自动忽略，不影响结果", "该项概率为 0，整个连乘被清零，分子分母都是 0，得到 0/0 无法预测"], "a": 3, "w": "讲义原话：our algorithm obtains 0/0, and doesn't know how to make a prediction。答这类题一定要说出「连乘」——加法里一个 0 只是少加一项，乘法里一个 0 让全体归零。"}, {"t": "讲义把零概率问题提升成了一条统计学原则，是哪一条？", "o": ["训练集必须足够大才能用贝叶斯方法", "最大似然估计总是有偏的", "仅仅因为在有限训练集里没见过，就把某事件的概率估成 0，在统计上是个坏主意", "概率为 0 的事件不可能发生"], "a": 2, "w": "讲义原话：it is statistically a bad idea to estimate the probability of some event to be zero just because you haven't seen it before in your finite training set. 「没见过」不等于「不可能」——Ng 在 L6 用斯坦福橄榄球队连输的例子讲的就是这个。"}], "12": [{"t": "Laplace 平滑「分子加 1、分母加 k」，这里的 k 是什么？", "o": ["类别数，二分类时 k=2", "这个随机变量的取值个数——朴素贝叶斯里 xⱼ∈{0,1} 所以 k=2", "词表的大小 |V|", "训练样本数 n"], "a": 1, "w": "分母加 k 是为了让 Σφⱼ=1 仍然成立（分子一共加了 k 个 1）。⚠️ 常见错误是把 k 当成词表大小——那是第 14 页多项事件模型的做法，两种模型加的数不一样。"}, {"t": "某词在 100 封垃圾邮件中出现了 0 次，Laplace 平滑后 φ 是多少？", "o": ["1/102", "1/100", "1/50000", "0"], "a": 0, "w": "(0+1)/(100+2) = 1/102 ≈ 0.0098。⭐ 注意平滑的影响是不对称的：稀有事件被改动很大（0→0.0098），常见事件几乎不动（50/100=0.50 → 51/102=0.50）——正是我们想要的行为。"}, {"t": "讲义说 Laplace 平滑「在某些条件下可以证明给出最优估计」，它对这个说法的态度是？", "o": ["讲义没有提到最优性", "有所保留——原文括号里写着「可以说是相当强的」条件", "完全否定，认为只是权宜之计", "完全肯定，认为这是最优解"], "a": 1, "w": "原文：under certain (arguably quite strong) conditions。讲义在很多地方都有这种自我保留的括号，读的时候值得留意——它们通常标记着「这个结论别说太满」。"}], "13": [{"t": "伯努利事件模型和多项事件模型里，下标 j 分别代表什么？", "o": ["两者都代表邮件里第 j 个位置", "两者都代表词表里第 j 个词", "伯努利：词表里第 j 个词；多项：邮件里第 j 个位置", "伯努利：第 j 个位置；多项：第 j 个词"], "a": 2, "w": "这是两者最关键的差别，直接决定了 x 的长度：伯努利模型 x 长度恒为 |V|，多项模型 x 长度是邮件词数 d，每封不同。"}, {"t": "两种事件模型最实质的差别是什么？", "o": ["伯努利完全忽略词频，多项把出现次数计入", "伯努利考虑词序，多项不考虑", "伯努利需要平滑，多项不需要", "伯努利用于二分类，多项用于多分类"], "a": 0, "w": "「免费」出现 20 次显然比出现 1 次更可疑，这正是多项模型在文本分类上更好的原因。两者都是词袋模型，都不考虑词序（讲义明说 p(xⱼ|y) 对所有位置 j 相同），也都需要平滑。"}, {"t": "一个常被忽略的差别：没有出现在邮件里的词，在两个模型中分别如何处理？", "o": ["伯努利忽略它，多项为它贡献因子", "伯努利会为它贡献一个 (1−φ) 因子当作证据，多项模型里它根本不进式子", "两个模型都会为它贡献一个因子", "两个模型都会忽略它"], "a": 1, "w": "伯努利的连乘跑遍整个词表，所以「这封邮件里没有 viagra」也是实打实的证据。这解释了适用场景：长文本里绝大多数词都缺席，一堆 (1−φ) 会淹没有信息的那几个词，所以长文本上多项模型明显更好。"}], "14": [{"t": "多项事件模型里 φ_{k|y=1} 的分母是什么？", "o": ["训练样本总数 n", "所有垃圾邮件加起来一共有多少个词（Σᵢ1{y⁽ⁱ⁾=1}dᵢ）", "垃圾邮件的封数", "词表的大小 |V|"], "a": 1, "w": "计数单位从「文档」变成了「词次」：伯努利模型分母是「有几封垃圾邮件」，多项模型分母是「垃圾邮件里一共有几个词」。注意 dᵢ 带下标，每封邮件长度不同。"}, {"t": "多项事件模型做 Laplace 平滑时，分母应该加多少？", "o": ["|V|（词表大小）", "1", "2", "n（样本数）"], "a": 0, "w": "每个位置的词可以是词表里任何一个，取值个数就是 |V|。⭐ 一句话记法：分母加的永远是「这个随机变量有几种可能取值」——伯努利模型里 xⱼ∈{0,1} 所以加 2。"}, {"t": "讲义对朴素贝叶斯的最终定位是什么？", "o": ["是文本分类的最佳算法", "不一定最好，但常常好得出人意料，而且简单易实现，是很好的「第一个该试的东西」", "只适用于训练数据极多的场景", "已经被逻辑回归完全取代，不再使用"], "a": 1, "w": "讲义原话：often works surprisingly well … a very good \"first thing to try\"。它的位置是基线（baseline），不是终点。⚠️ Ng 在 L5 77:45 说得更直接：逻辑回归做垃圾邮件分类几乎总是更好——两句并不矛盾，朴素贝叶斯胜在几分钟就能跑出结果。"}]};

var N = [{"r": [1, 1], "star": 3, "t": "★ 判别式 vs 生成式：两种完全不同的提问方式", "one": "一个学「怎么把两类分开」，一个学「每一类长什么样」。", "quote": "<em>Algorithms that try to learn p(y|x) directly (such as logistic regression), or algorithms that try to learn mappings directly from the space of inputs X to the labels {0,1} (such as the perceptron algorithm) are called <b>discriminative</b> learning algorithms. Here, we'll talk about algorithms that instead try to model p(x|y) (and p(y)). These algorithms are called <b>generative</b> learning algorithms.</em>", "eq": "判别式：直接建模 p(y | x)\n生成式：建模 p(x | y) 与 p(y)，再用贝叶斯反推 p(y | x)\n\np(y) 有个专名：class priors（类先验）", "pts": ["⭐ <b>讲义的大象/狗例子要记住，它比定义好用</b>：<b>判别式</b>的做法是在大象和狗之间<b>找一条分界线</b>，来了新动物就看它落在线的哪一侧。<b>生成式</b>的做法是——先看所有大象，建一个「大象长什么样」的模型；再看所有狗，建一个「狗长什么样」的模型；<b>来了新动物就分别和两个模型比一比，看它更像哪边</b>。", "<b>判别式这一栏到目前为止你学的全在里面</b>：线性回归、逻辑回归、感知机、softmax。注意讲义把感知机单列了一种说法——它<b>连 p(y|x) 都不建模</b>，是「直接学从 X 到 {0,1} 的映射」。<b>所以「判别式」其实是个更宽的筐，装得下不建概率模型的算法。</b>", "<b>p(x|y) 读作「给定类别，特征长什么样」</b>。讲义举例：y=0 是狗、y=1 是大象，那么 <b>p(x|y=0) 就是狗的特征分布</b>，p(x|y=1) 就是大象的特征分布。", "<b>「生成」这个词的字面含义</b>：建好 p(x|y) 和 p(y) 之后，你<b>可以真的拿它造出新样本</b>——先按 p(y) 抽一个类，再按 p(x|y) 抽一组特征。判别式模型做不到这件事，它只会判断，不会生成。"], "tbl": [{"cap": "★ 两条路线对照（大题比较题照这张表答）", "head": ["", "判别式 Discriminative", "生成式 Generative"], "rows": [["建模对象", "<b>p(y|x)</b>（或直接学映射）", "<b>p(x|y) 和 p(y)</b>"], ["问的问题", "「这两类<b>怎么分开</b>？」", "「每一类<b>长什么样</b>？」"], ["怎么得到 p(y|x)", "<b>就是它本身</b>", "<b>贝叶斯反推</b>"], ["能造新样本吗", "<b>不能</b>", "<b>能</b>"], ["本课学过的", "逻辑回归、感知机、SVM", "<b>GMN／GMM（M2 T3）</b>"], ["这份讲义的", "—", "<b>GDA、朴素贝叶斯</b>"]]}], "say": "⭐ <b>这个区分直通 M2 T3</b>。混合高斯模型（GMM）就是一个<b>生成式</b>模型：它建的正是 p(x) = Σₖ πₖ·N(x; μₖ, Σₖ)，也就是「每一簇长什么样」加「每一簇占多大比重」。<b>所以 M2 T3 里反复出现的「responsibility（责任度）」其实就是这一页的 p(y|x) 经贝叶斯算出来的后验</b>——只不过那里的 y（簇编号）是<b>看不见的</b>，这里的 y（标签）是<b>给定的</b>。<b>把这条线索记牢：GDA 和 GMM 是同一个模型，差别只在 z 知不知道。</b>下一份讲义（notes7b）会把这句话写成正式命题。", "ng": "Ng 在 L5 开场 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=0s\" target=\"_blank\">00:00</a> 用的例子<b>不是大象和狗，是恶性/良性肿瘤</b>：判别式（逻辑回归）在两类之间画线；<a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=129s\" target=\"_blank\">02:09</a> 起他说生成式的做法是「<b>先只看所有恶性肿瘤，建一个恶性肿瘤长什么样的模型</b>」。⭐ 他在 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=159s\" target=\"_blank\">02:39</a> 给了一句很精炼的对照：<em>rather than looking at both classes <b>simultaneously</b> and searching for a way to separate them, a generative learning algorithm instead builds [a model of each class]</em>——<b>关键词是「同时看两类」vs「一次看一类」</b>。<span class=\"src\">CS229/transcripts/L5.txt · 本地已下载</span>", "exam": "⚠ <b>先说清楚本课的口径</b>：朴素贝叶斯写在 <b>M1T1 第 7 页的 Course Learning Outcomes</b> 里（与 KNN、决策树并列），正式内容来自<b>课程网页阅读材料</b>（已整理进 <b>M1T4 知识点整理第 9 章</b>，含 offer/win 手算例，题库里有 5 道选择题）。该章开头写明：<b>「这是概念性概述，课程不要求你实现或推导，但你应当认出主要思想、理解它们何时有用」</b>。⇒ <b>考的是概念与优缺点，不是推导。</b>⭐ 所以这份精读的用法是：<b>先把课程第 9 章那套结论背熟（那才是考点），再用讲义补「为什么」</b>——答概念题时多一句出处会很稳。⚠️ 别本末倒置去背 GDA 的 MLE 公式，那确实超纲。另外<b>「判别式 vs 生成式」这个区分是 M2 T3 GMM 的底层语言</b>，这一条学了直接有用。", "tip": {"t": "别把生成式和「生成式 AI」混为一谈", "v": "本课 M1T1 第 19 页说的 <b>Generative AI</b>（ChatGPT、Claude 那类）是<b>深度学习里的一个分支</b>，和这里的 generative learning algorithm <b>不是一个层级的概念</b>。相同的只有那个「能造出新东西」的内核；GDA 造的是一个二维特征向量，LLM 造的是一整段文字。<b>考试里看到 generative 要先看上下文。</b>"}}, {"r": [2, 2], "star": 3, "t": "★ 贝叶斯反推，以及那个「分母根本不用算」的技巧", "one": "要的只是哪一类概率大，p(x) 对两类是同一个数，直接丢掉。", "quote": "<em>Actually, if we were calculating p(y|x) in order to make a prediction, then we don't actually need to calculate the denominator</em>", "eq": "p(y|x) = p(x|y) p(y) / p(x)\n\n分母（全概率公式）：\np(x) = p(x|y=1)p(y=1) + p(x|y=0)p(y=0)\n\n但做预测时：\narg max_y p(y|x) = arg max_y [ p(x|y)p(y) / p(x) ]\n                 = arg max_y p(x|y)p(y)        ← 分母与 y 无关，可丢", "pts": ["⭐ <b>为什么能丢分母</b>：p(x) 里<b>没有 y</b>，所以比较 y=0 和 y=1 时它是<b>同一个正数</b>。比大小时同除一个正数不改变顺序，<b>argmax 不变</b>。⚠️ <b>但如果题目要的是「概率值是多少」而不是「哪一类」，分母就必须算。</b>", "<b>分母其实已经在手里了</b>：讲义点明 p(x) <em>can also be expressed in terms of the quantities p(x|y) and p(y) that we've learned</em>——用<b>全概率公式</b>把两类加起来即可，<b>不需要额外再学一个模型</b>。", "<b>GDA 登场</b>：第一个生成式算法是 <b>Gaussian discriminant analysis（高斯判别分析）</b>，它假设 <b>p(x|y) 服从多元正态分布</b>。", "⚠️ <b>名字极具误导性</b>：GDA 里带着「discriminant（判别）」三个字，<b>但它是生成式算法</b>。这里的 discriminant 是统计学里「判别分析」的老词（Fisher 那一脉），不是本讲义说的 discriminative。<b>这是最容易被考反的一个名词。</b>"], "tbl": [{"cap": "⚠️ 四个长得像的名词，别搞混", "head": ["名词", "是什么", "判别式还是生成式"], "rows": [["<b>discriminative</b> learning", "直接建 p(y|x) 的一类算法", "判别式"], ["<b>Gaussian discriminant analysis</b>", "本讲义的 GDA", "<b>生成式</b>（⚠ 名字骗人）"], ["<b>LDA</b>（线性判别分析）", "统计学里 GDA 的另一个名字", "生成式"], ["<b>QDA</b>（二次判别分析）", "GDA 但两类各有 Σ", "生成式，边界是<b>二次</b>的"]]}], "say": "⭐ <b>这一页的全概率公式，本课 M1T1 第 25 页正好列了</b>：课件的「Rules &amp; Formulas」栏里写着 <b>Bayes' theorem: P(A|B)=P(B|A)P(A)/P(B)</b> 和 <b>Total probability: P(A)=ΣᵢP(A|Bᵢ)P(Bᵢ)</b>——<b>和讲义这一页逐字对应</b>。更直接的是 **M1T1 Tutorial 的 Probability Q2：「apply total probability and Bayes' theorem to <b>screening</b>（筛查）」**。<b>医学筛查题就是这一页的数学：已知「有病时检测阳性的概率」p(x|y)，要反推「检测阳性时真有病的概率」p(y|x)。</b>所以这一页<b>不是超纲内容，是本课已经考过的数学换了个外衣</b>。", "ng": "Ng 在 L5 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=250s\" target=\"_blank\">04:10</a> 把两条路线的建模对象并排写出来，并在 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=311s\" target=\"_blank\">05:11</a> 预告了这一讲的结构：<b>「一个给连续值特征用（肿瘤分类那种），一个给离散特征用（可以拿来做垃圾邮件过滤）」</b>——分别就是 <b>GDA</b> 和<b>朴素贝叶斯</b>。⭐ <b>这句话是全讲最好的地图</b>：看到「特征是连续的」想 GDA，看到「特征是离散的/文本」想朴素贝叶斯。<span class=\"src\">CS229/transcripts/L5.txt · 本地已下载</span>", "exam": "⭐ <b>这一页最可能的考法是「用贝叶斯做一次数值反推」</b>，和 M1T1 Tutorial 的筛查题同型。拿分要点：① <b>把 p(x|y)、p(y) 和要求的 p(y|x) 用符号分清楚</b>（最常见的失分是把 p(阳性|有病) 当成 p(有病|阳性)）；② <b>分母用全概率公式展开成两项</b>并写出来；③ 若只问「判哪一类」，<b>明说「分母对两类相同，可以不算」也是得分点</b>——它证明你理解了结构，不是在盲算。", "tip": {"t": "基础率谬误", "v": "贝叶斯反推最反直觉的地方：即使检测很准，<b>如果这个病本身很罕见（p(y=1) 很小），阳性结果里大部分仍然是假阳性</b>。这正是 p(y) 这个「先验」存在的意义——<b>生成式模型显式地把它写了出来，判别式模型把它藏在参数里。</b>"}}, {"r": [3, 4], "star": 2, "t": "多元高斯：Σ 的每一项在控制什么形状", "one": "对角线控制各方向的胖瘦，非对角线控制椭圆往哪边斜。", "quote": "<em>as we increase the off-diagonal entry in Σ, the density becomes more “compressed” towards the 45° line (given by x₁ = x₂)</em>", "eq": "p(x; µ, Σ) = 1 / ( (2π)^{d/2} |Σ|^{1/2} ) · exp( −½ (x−µ)ᵀ Σ⁻¹ (x−µ) )\n\nE[X] = µ\nCov(X) = Σ\nCov(Z) = E[(Z−E[Z])(Z−E[Z])ᵀ] = E[ZZᵀ] − (E[Z])(E[Z])ᵀ", "pts": ["<b>Σ 的硬性要求</b>：讲义写的是 <em>Σ ≥ 0 is symmetric and positive semi-definite</em>——<b>对称且半正定</b>。|Σ| 是<b>行列式</b>，出现在归一化常数里；Σ⁻¹ 出现在指数里。", "<b>Σ = σ²I（各向同性）</b>：讲义给了三张图，Σ = I / 0.6I / 2I。⭐ 结论一句话：<b>Σ 越大越「摊开」，越小越「压紧」</b>。注意看纵轴——摊开的同时<b>峰值变矮</b>，因为总体积恒为 1。", "<b>非对角元 > 0</b>：Σ = [[1,0],[0,1]] → [[1,0.5],[0.5,1]] → [[1,0.8],[0.8,1]]，密度<b>越来越贴着 45° 线（x₁=x₂）</b>。含义是<b>两个特征正相关</b>：x₁ 大时 x₂ 也倾向于大。", "<b>非对角元 < 0</b>：[[1,−0.5],[−0.5,1]] 和 [[1,−0.8],[−0.8,1]]，<b>压向相反方向</b>（−45° 线），即<b>负相关</b>。", "<b>对角元不等</b>：[[3,0.8],[0.8,1]] —— <b>椭圆在 x₁ 方向更长</b>，因为那个方向方差是 3。⭐ <b>一般情况下等高线就是椭圆</b>，正圆只是 Σ=σ²I 的特例。", "<b>µ 只管平移</b>：最后三张图固定 Σ=I 只改 µ，<b>形状完全不变，整坨平移</b>。"], "tbl": [{"cap": "★ 看图识 Σ（给等高线反推协方差，是最常见的图形题）", "head": ["等高线长什么样", "Σ 的特征", "两特征的关系"], "rows": [["<b>正圆</b>", "Σ = σ²I（对角且相等）", "不相关、方差相同"], ["<b>轴对齐的椭圆</b>", "对角但不等，非对角为 0", "<b>不相关</b>，方差不同"], ["<b>向 45° 倾斜</b>", "非对角元 <b>为正</b>", "<b>正相关</b>"], ["<b>向 −45° 倾斜</b>", "非对角元 <b>为负</b>", "<b>负相关</b>"], ["<b>越扁越窄</b>", "非对角元<b>绝对值越大</b>", "相关性越强"]]}], "say": "⭐ <b>这两页和 M2 T3 是同一套东西</b>。GMM 里 sklearn 的 <code>covariance_type</code> 四个取值，本质就是在限制 Σ 的形状：<b>spherical</b>＝Σ=σ²I（正圆）· <b>diag</b>＝对角（轴对齐椭圆）· <b>tied</b>＝所有簇<b>共用一个</b> Σ · <b>full</b>＝每簇各有完整 Σ。<b>把这一页的图看熟，T3 那道「给四张聚类结果图反推用了哪种 covariance_type」的题就是送分。</b>⭐ 顺带把 GDA 也放进这个框架：<b>GDA 正是「tied」</b>——两类共用一个 Σ，所以两个高斯的等高线<b>形状和朝向完全一样，只是中心不同</b>（下一页的图就是这样画的）。", "ng": "⚠️ <b>Ng 在 L5 没有逐张讲这些图</b>，他在白板上画了几个等高线就过了——<b>这几页讲义比课堂细</b>。真要补这块基础，CS229 另外有两份专门的讲义，本地都有：<code>CS229/notes/gaussians.pdf</code>（多元高斯的性质）和 <code>CS229/notes/more_on_gaussians.pdf</code>（边缘分布与条件分布的闭式解）。⭐ <b>后一份里「高斯的条件分布还是高斯」那个结论，在 M2 T3 推导责任度时会用到。</b><span class=\"src\">CS229/transcripts/L5.txt · 本地已下载</span>", "exam": "本课 M2T3（GMM）直接用多元高斯，M1T2 第 20 页讲「同方差性」时也用到协方差的直觉。⭐ <b>最可能的考法是图形题</b>：给等高线图问「这组数据的两个特征是正相关还是负相关」「哪张图对应 Σ=σ²I」。⚠️ 高频失分：<b>把「椭圆更长的方向」说成「相关性更强」</b>——长短是<b>对角元</b>（各自的方差），倾斜才是<b>非对角元</b>（相关性）。<b>这两件事互相独立。</b>", "tip": {"t": "两个协方差定义等价", "v": "讲义给了两种写法并让你自己验证：<b>Cov(Z) = E[(Z−E[Z])(Z−E[Z])ᵀ]</b> 和 <b>Cov(Z) = E[ZZᵀ] − (E[Z])(E[Z])ᵀ</b>。展开第一式、用期望的线性性即可。⭐ 这就是<b>一维的 Var(X)=E[X²]−(E[X])²</b> 的矩阵版——<b>本课 M1T1 第 25 页正好列了这条一维公式。</b>"}}, {"r": [5, 5], "star": 3, "t": "★ GDA 模型：三行写完，但有一个关键的「共用」", "one": "两个均值、一个协方差——这个不对称的设计决定了边界是直线。", "quote": "<em>Note that while there're two different mean vectors µ₀ and µ₁, this model is usually applied using <b>only one</b> covariance matrix Σ.</em>", "eq": "y ~ Bernoulli(φ)\nx | y = 0 ~ N(µ₀, Σ)\nx | y = 1 ~ N(µ₁, Σ)\n\n参数共四个：φ, µ₀, µ₁, Σ\n\nℓ(φ,µ₀,µ₁,Σ) = log Π p(x⁽ⁱ⁾, y⁽ⁱ⁾)\n             = log Π p(x⁽ⁱ⁾|y⁽ⁱ⁾) p(y⁽ⁱ⁾)", "pts": ["<b>适用前提</b>：讲义第一句就划了范围——<em>when the input features x are <b>continuous-valued</b></em>。<b>特征是连续的才用 GDA</b>，离散的用后面的朴素贝叶斯。", "⭐ <b>两个 µ 一个 Σ 这件事不是笔误</b>，是刻意的设计。讲义只用一句话带过，<b>没说为什么</b>——Ng 在课堂上被学生问到了，答案见下面 ng 栏，<b>那是这一页最值钱的信息</b>。", "⚠️ <b>注意这里的似然是「联合」似然 ℓ = log Π p(x⁽ⁱ⁾, y⁽ⁱ⁾)</b>，不是 M1 里的条件似然 Π p(y⁽ⁱ⁾|x⁽ⁱ⁾)。<b>这正是生成式与判别式在数学上的分界线</b>：生成式<b>连 x 一起建模</b>，判别式只管给定 x 之后的 y。", "<b>第二行等号用了链式法则</b>：p(x,y) = p(x|y)·p(y)。<b>两个因子正好对应模型的两部分</b>——p(x|y) 是那两个高斯，p(y) 是伯努利。"], "tbl": [{"cap": "共用 Σ 与不共用 Σ · 四个后果", "head": ["", "共用一个 Σ（GDA / LDA）", "各用各的 Σ₀、Σ₁（QDA）"], "rows": [["决策边界", "<b>直线（超平面）</b>", "<b>二次曲线</b>"], ["参数量", "少", "<b>大约翻倍</b>"], ["两个高斯的等高线", "<b>形状朝向完全相同</b>，只平移", "可以各是各的形状"], ["p(y=1|x) 的形式", "<b>标准 sigmoid</b>", "sigmoid，但<b>里面带二次项</b>"], ["需要的数据量", "更少", "更多"]]}], "say": "⭐ 上表第一行值得想一层：<b>为什么共用 Σ 就能让边界变直？</b>决策边界是 p(y=1|x)=p(y=0|x)，取对数后两个高斯的指数项相减：−½(x−µ₁)ᵀΣ⁻¹(x−µ₁) + ½(x−µ₀)ᵀΣ⁻¹(x−µ₀)。<b>如果两边的 Σ 相同，展开后 xᵀΣ⁻¹x 这个二次项正好抵消</b>，只剩下 x 的一次项 ⇒ <b>线性边界</b>。<b>Σ 一旦不同，二次项消不掉，边界就弯了。</b>这个消去过程只有三行，值得自己推一遍——<b>它把「模型假设」和「边界形状」之间的因果关系说死了</b>，不是记忆性的结论。", "ng": "⭐ <b>学生在 L5 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=2287s\" target=\"_blank\">38:07</a> 之后正好问了「为什么两个均值却只有一个协方差矩阵」，这是课堂独有的内容。</b>Ng 的回答有三层：① <em>if you choose to build the model this way, the <b>decision boundary ends up being linear</b></em>——<b>为了要线性边界</b>；② <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=2381s\" target=\"_blank\">39:41</a> <em>you could choose to use two separate Σ₀ and Σ₁, and they'll actually work okay … but you <b>double the number of parameters</b> roughly and you end up with a decision boundary that <b>isn't linear anymore</b></em>；③ 他强调<b>那样做并非不合理</b>（<em>not an unreasonable algorithm</em>）。<b>讲义只写了「usually」两个字，课堂把理由补全了。</b><span class=\"src\">CS229/transcripts/L5.txt · 本地已下载</span>", "exam": "<b>GDA 本身不在本课考纲</b>（CLO 里点名的是 Naive Bayes，不是 GDA）。⭐ <b>但「共用参数 ⇒ 边界更简单、参数更少、需要的数据更少」这个权衡是通用考点</b>，M2 T3 的 <code>covariance_type='tied'</code> 用的是一模一样的逻辑。如果 M2/M3 大题问「为什么要限制协方差的形式」，<b>这一页的三条理由（参数量、边界形状、数据需求）直接可用</b>。"}, {"r": [6, 6], "star": 3, "t": "★ 四个 MLE 公式：每一个都是「数数」或「求平均」", "one": "没有迭代、没有梯度下降——全是闭式解，一遍数据就算完。", "quote": "<em>Note that the two Gaussians have contours that are the <b>same shape and orientation</b>, since they share a covariance matrix Σ, but they have different means µ₀ and µ₁.</em>", "eq": "φ  = (1/n) Σᵢ 1{y⁽ⁱ⁾ = 1}                        ← 正类占比\n\nµ₀ = Σᵢ 1{y⁽ⁱ⁾=0} x⁽ⁱ⁾ / Σᵢ 1{y⁽ⁱ⁾=0}            ← 负类样本的均值\nµ₁ = Σᵢ 1{y⁽ⁱ⁾=1} x⁽ⁱ⁾ / Σᵢ 1{y⁽ⁱ⁾=1}            ← 正类样本的均值\n\nΣ  = (1/n) Σᵢ (x⁽ⁱ⁾ − µ_{y⁽ⁱ⁾})(x⁽ⁱ⁾ − µ_{y⁽ⁱ⁾})ᵀ  ← 用各自的类均值去中心化，再一起平均", "pts": ["⭐ <b>四个公式全是闭式解，没有任何迭代</b>。这是 GDA 相对逻辑回归最大的实务优势：<b>扫一遍数据就训练完了</b>，没有学习率要调、没有收敛要等。", "<b>φ 就是正类的比例</b>：分子数有多少个 y=1，分母是 n。<b>它估的是先验 p(y=1)。</b>", "<b>µ₀ / µ₁ 就是各类样本的重心</b>：分子是「只把该类的 x 加起来」，分母是「该类有几个」。⭐ <b>这和 k-means 算质心是同一个式子</b>——差别只在 k-means 的「属于哪一类」是算出来的，这里是<b>标签给定的</b>。", "⚠️ <b>Σ 的下标最容易看漏</b>：是 µ<sub>y⁽ⁱ⁾</sub>，意思是「<b>第 i 个样本减去它自己那一类的均值</b>」。<b>不是统一减一个总均值。</b>这正是「共用 Σ 但两类各有中心」的实现方式：<b>先各自去中心化，再把两类的离差放在一起算一个协方差。</b>", "<b>那张图要会读</b>：两个椭圆<b>形状朝向完全一样</b>（因为共用 Σ），<b>中心不同</b>（µ₀≠µ₁），中间那条<b>直线</b>就是 p(y=1|x)=0.5 的地方。"], "tbl": [{"cap": "四个参数 · 它们各自在估什么", "head": ["参数", "估的是", "怎么算", "类比"], "rows": [["φ", "<b>先验 p(y=1)</b>", "正类占比", "硬币正面的概率"], ["µ₀, µ₁", "两类各自的<b>中心</b>", "各类样本均值", "<b>k-means 的质心</b>"], ["Σ", "<b>共用的</b>散布形状", "两类离差合并后的协方差", "GMM 的 <code>tied</code>"]]}], "say": "⭐ <b>把这四个公式和 M2 T3 的 M 步并排看，会发现它们几乎一样</b>：GMM 的 M 步是 πₖ←平均责任度、µₖ←责任度加权的均值、Σₖ←责任度加权的协方差。<b>这里的公式就是把「责任度」换成了指示函数 1{y⁽ⁱ⁾=k}</b>——也就是「责任度非 0 即 1」的情形。<b>这不是巧合</b>：标签给定时责任度退化成硬分配，EM 的 E 步无事可做，M 步一步到位，<b>所以 GDA 不需要迭代而 GMM 需要</b>。⭐ <b>这一句能把 M1 和 M2 T3 串成一条线，大题里写出来很有分量。</b>下一份讲义（notes7b）会把它写成正式的命题。", "ng": "Ng 在 L5 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=1129s\" target=\"_blank\">18:49</a> 讲模型设定时就点了共用 Σ：<em>we're going to assume that the two Gaussians, for the positive and negative classes, have the <b>same covariance matrix</b> but they have different [means]</em>。到 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=2287s\" target=\"_blank\">38:07</a> 他补了一个技术细节，纠正了一个容易产生的误解：<em>I described this <b>as if</b> we look at the two classes separately … we actually <b>don't quite</b> look at them totally separately</em>——⭐ <b>因为 Σ 是两类数据合起来估的，两类并非完全独立地各建各的模型。</b>这一点讲义的公式里看得出来（Σ 的求和跑遍全部 n 个样本），但没有用文字点明。<span class=\"src\">CS229/transcripts/L5.txt · 本地已下载</span>", "exam": "⭐ <b>这四个公式最适合的考法是「手算一遍」</b>，而且很容易出成小题：给 4–6 个带标签的二维点，要你算 φ、µ₀、µ₁。<b>φ 和两个 µ 都只是数数和求平均，考场计算器完全够用</b>；Σ 要算外积求和，题量大了不现实，所以<b>真要考多半只考前三个</b>。⚠️ 算 Σ 时最常见的错：<b>统一减总均值</b>。记住是<b>各减各类的均值</b>。"}, {"r": [7, 7], "star": 3, "t": "★★ GDA 推得出 logistic，反过来推不出——这个单向关系是全篇最重要的结论", "one": "强假设能推出弱结论，弱结论推不回强假设；强弱之差就是两者的全部取舍。", "quote": "<em>We just argued that if p(x|y) is multivariate gaussian (with shared Σ), then p(y|x) necessarily follows a logistic function. <b>The converse, however, is not true</b>; i.e., p(y|x) being a logistic function does not imply p(x|y) is multivariate gaussian. This shows that GDA makes <b>stronger</b> modeling assumptions about the data than does logistic regression.</em>", "eq": "p(y=1 | x; φ, Σ, µ₀, µ₁) = 1 / ( 1 + exp(−θᵀx) )\n\n其中 θ 是 φ, Σ, µ₀, µ₁ 的某个函数\n（右边的 x 按惯例补了 x₀ = 1 那一维）\n\n⇒ GDA（高斯假设）⟹ p(y|x) 是 logistic\n⇐ 但 p(y|x) 是 logistic ⟹̸ p(x|y) 是高斯", "pts": ["⭐ <b>整段的骨架就是一个单向箭头</b>：高斯 ⟹ logistic，但 logistic ⟹̸ 高斯。<b>从「能推出」到「推不回」，得出的结论是 GDA 的假设更强。</b>这个论证方式本身就值得学——<b>比较两个模型假设强弱，看谁能推出谁。</b>", "<b>讲义给了反例证明「推不回」</b>：如果 x|y=0 ~ Poisson(λ₀)、x|y=1 ~ Poisson(λ₁)，<b>p(y|x) 照样是 logistic</b>。⭐ <b>所以 logistic 形式能由很多不同的假设导出，它不挑食。</b>", "<b>假设对的时候 GDA 更好</b>：讲义说此时 GDA <b>asymptotically efficient（渐近有效）</b>——「在训练集极大的极限下，<b>没有算法能严格优于 GDA</b>」。而且 <em>even for small training set sizes, we would generally expect GDA to [do] better</em>。", "<b>假设错的时候逻辑回归更好</b>：<em>by making significantly weaker assumptions, logistic regression is also more <b>robust</b> and less sensitive to incorrect modeling assumptions</em>。数据确实非高斯时，<b>大样本下逻辑回归几乎总是赢</b>。", "⭐ <b>讲义的实务结论很干脆</b>：<em>for this reason, <b>in practice logistic regression is used more often than GDA</b></em>。"], "tbl": [{"cap": "★★ GDA vs 逻辑回归（这张表就是第 7–8 页的全部内容）", "head": ["", "GDA", "逻辑回归"], "rows": [["假设强度", "<b>强</b>（p(x|y) 必须是高斯）", "<b>弱</b>（只要 p(y|x) 是 logistic）"], ["假设对时", "<b>渐近有效</b>，没有算法严格更优", "也能用，但不如 GDA"], ["假设错时", "<b>结果不可预测</b>", "<b>稳健，大样本下几乎总赢</b>"], ["数据效率", "<b>高</b>（少量数据就能学好）", "低（需要更多数据）"], ["训练", "<b>闭式解，一遍数据</b>", "迭代（无闭式解）"], ["实践中", "用得少", "<b>用得多</b>"]]}], "say": "⭐ <b>「假设越强 ⇒ 数据需求越低，但错了代价越大」是机器学习的一条通则，不止用在这里。</b>同一条规律的其它化身：<b>线性模型 vs 神经网络</b>（线性假设更强，小数据上更稳）· <b>k-means vs GMM</b>（k-means 假设各簇球形等大，更强）· <b>GMM 的 spherical vs full</b>。<b>你可以把它当成一把尺子去量任何两个模型。</b>Ng 在课上把这条抽象成了一句更普适的话（见 ng 栏），<b>那句话值得抄下来，它适用于整门课</b>。", "ng": "Ng 在 L5 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=2747s\" target=\"_blank\">45:47</a> 和 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=2840s\" target=\"_blank\">47:20</a> 讲 GDA⇒sigmoid：<em>the shape of that turns out to be <b>exactly</b> a sigmoid function, and you prove this in the problem sets</em>，并点明 <b>两个算法最后都在用 sigmoid 算 p(y=1|x)，只是「到达方式」不同</b>。<br>⭐ <b>课堂独有、而且是整讲最该记的一句</b>（<a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=3651s\" target=\"_blank\">60:51</a>）：<em>when you have less data the algorithm needs to <b>rely more on assumptions you code in</b></em>，接着 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=3808s\" target=\"_blank\">63:28</a> 升级成 <em>this is one of the important principles of machine learning: <b>when you have less data your skill at coding and your knowledge matters much more</b></em>。<br>⭐ 还有一处<b>讲义没有的推广</b>（同在 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=3651s\" target=\"_blank\">60:51</a>）：<b>不只是泊松——只要 x|y=1 和 x|y=0 来自「同一个指数族分布、只差自然参数」，p(y|x) 就是 logistic。</b>这把讲义举的泊松例子一下子变成了一整类。<span class=\"src\">CS229/transcripts/L5.txt · 本地已下载</span>", "exam": "⭐ <b>这张对比表是典型的大题素材</b>，而且答题结构现成：先给<b>单向关系</b>（A 能推出 B，B 推不回 A ⇒ A 假设更强），再给<b>两种情形下的后果</b>（假设对 ⇒ 数据效率高；假设错 ⇒ 不稳健），最后给<b>实务结论</b>。⚠️ 别只写「GDA 假设数据是高斯的」——<b>那只说了假设内容，没说假设强弱带来的取舍</b>，而取舍才是问题要的。本课 M1T1 第 7 页的 CLO 第一条正是「describe key machine-learning concepts, <b>including their advantages and disadvantages</b> in different applications」——<b>「优缺点」就是在要这个。</b>", "tip": {"t": "怎么判断该不该用 GDA", "v": "有学生在 L5 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=3497s\" target=\"_blank\">58:17</a> 问「要不要先做个统计检验确认等方差再用 GDA」。⭐ Ng 的回答很实在：<b>「如果你的数据多到能做检验并且让人信服，那你的数据大概也多到可以直接用逻辑回归了」</b>；高维情况下 <b>人们就是把数据画出来看，明显不像高斯就别用 GDA</b>。<b>意思是：这个判断题在实践中通常不需要正式回答。</b>"}}, {"r": [8, 8], "star": 3, "t": "★ 朴素贝叶斯登场：50000 维的 x 怎么建模", "one": "2^50000 个参数显然不行——这个数字就是「朴素」假设的全部动机。", "quote": "<em>if we were to model x explicitly with a multinomial distribution over the 2^50000 possible outcomes, then we'd end up with a (2^50000 − 1)-dimensional parameter vector. <b>This is clearly too many parameters.</b></em>", "eq": "特征构造（词袋 / Bernoulli 事件模型）：\nx ∈ {0,1}^{|词表|}\nxⱼ = 1  若邮件中出现了词表里第 j 个词\nxⱼ = 0  否则\n\n词表大小 50000 ⇒ x 有 2^50000 种取值\n⇒ 朴素地建模需要 2^50000 − 1 个参数", "pts": ["<b>场景是垃圾邮件过滤</b>，属于更大的一类问题——<b>文本分类（text classification）</b>。", "⭐ <b>特征向量的构造要看清</b>：维数 = <b>词表大小</b>，不是邮件长度。讲义的例子里 x 的第 1 维对应「a」、第 2 维「aardvark」……最后一维「zygmurgy」。<b>某个词出现就置 1，不管出现了几次。</b>", "<b>词表（vocabulary）怎么来</b>——脚注说得很实际：<b>不是去查英语词典，而是扫一遍训练集，把出现过至少一次的词收进来</b>。好处有二：① 减少维数、省算力和内存；② <b>能收进「cs229」这种词典里查不到但邮件里会出现的词</b>。", "<b>停用词</b>：脚注还提到常常会<b>剔除极高频的词</b>（the、of、and），讲义管它们叫 <b>stop words</b>，理由是「出现在太多文档里，对判断是不是垃圾邮件几乎没有信息量」。", "⚠️ <b>2^50000 这个数要会解释</b>：x 是 50000 个 0/1，所以组合数是 2^50000；用多项分布建模要给<b>每一种组合</b>一个概率，减 1 是因为总和为 1 少一个自由度。<b>这个数比宇宙里的原子数大得多。</b>"], "tbl": [{"cap": "参数量爆炸 · 朴素假设前后对比", "head": ["", "不做任何假设", "<b>做了朴素贝叶斯假设</b>"], "rows": [["建模对象", "p(x₁,…,x_d | y) 的完整联合分布", "Π_j p(xⱼ | y)"], ["参数个数", "<b>2^50000 − 1</b>（每类）", "<b>50000</b>（每类）"], ["能不能学", "<b>完全不可能</b>", "轻松"]]}], "say": "⭐ <b>这一页的推理模式比结论更值钱</b>：<b>先算清楚「不做假设要多少参数」，发现天文数字，再引入一个假设把它砍下来。</b>这是机器学习里引入假设的标准动机——<b>假设不是为了优雅，是因为不做假设根本学不了</b>。同样的推理在本课别处也成立：M2 T3 限制 <code>covariance_type</code> 是为了把 Σ 的 d(d+1)/2 个参数砍成 d 个或 1 个；M1 的线性模型假设是把「任意函数」砍成 d+1 个权重。<b>看到「参数太多 ⇒ 加约束」这个套路，你就能预判下一步。</b>", "ng": "Ng 在 L5 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=3839s\" target=\"_blank\">63:59</a> 开始讲朴素贝叶斯，并说这是「<b>我们第一次涉足自然语言处理</b>」。<a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=3869s\" target=\"_blank\">64:29</a> 他讲特征构造：<b>「先把一封邮件映射成特征向量 X」</b>。⭐ 课堂多给了一个<b>讲义里没有的应用例子</b>：<b>eBay 早年的商品分类问题</b>——用户写一段文字描述（「我有一台二手 Roomba 想卖」），系统要判断这属于电子产品、电视还是服装。<b>说明这套方法不只用于垃圾邮件，任何「把一段文字分到几个类里」的任务都适用。</b><span class=\"src\">CS229/transcripts/L5.txt · 本地已下载</span>", "exam": "⭐ <b>朴素贝叶斯是本课 CLO 点名的五个算法之一</b>，而且课程已经给了现成的考点材料：<b>M1T4 知识点整理第 9 章</b>的「一览对比表」被标成<b>「最可能出选择题的地方」</b>，尤其是<b>「缩放重要吗」那一列：KNN 需要（依赖距离）· 决策树通常不需要（只比较阈值）· 朴素贝叶斯有时需要 · SVM 必须（也依赖距离）</b>。<b>这四个一组极可能直接出成一道选择题，先把它背下来。</b>⭐ 这一页的「2^50000 参数量」论证<b>课程没有</b>，是大题里解释「为什么需要这个假设」最有力的那一句。"}, {"r": [9, 9], "star": 3, "t": "★ 朴素贝叶斯假设：条件独立，不是独立", "one": "讲义专门用一整段区分这两者——这是本页唯一的难点，也是最常考的点。", "quote": "<em>(Note that this is <b>not</b> the same as saying that x₂₀₈₇ and x₃₉₈₃₁ are independent, which would have been written “p(x₂₀₈₇) = p(x₂₀₈₇|x₃₉₈₃₁)”; rather, we are only assuming that x₂₀₈₇ and x₃₉₈₃₁ are <b>conditionally independent given y</b>.)</em>", "eq": "p(x₁, …, x_d | y)\n = p(x₁|y) p(x₂|y,x₁) p(x₃|y,x₁,x₂) ⋯ p(x_d|y,x₁,…,x_{d−1})   ← 链式法则，恒等式\n = p(x₁|y) p(x₂|y) p(x₃|y) ⋯ p(x_d|y)                              ← 用了 NB 假设\n = Π_{j=1}^{d} p(xⱼ | y)", "pts": ["⭐ <b>第一个等号是恒等式，第二个等号才是假设</b>。讲义说得很清楚：<em>The first equality simply follows from the usual properties of probabilities, and the second equality used the NB assumption.</em> <b>答题时必须把这两步分开</b>，否则看不出你知道哪一步是假设。", "<b>讲义的具体例子</b>：y=1 表示垃圾邮件，「buy」是第 2087 个词，「price」是第 39831 个词。<b>NB 假设是说：一旦告诉你这封是垃圾邮件，「buy 出没出现」对「price 出没出现」的判断就没有任何额外帮助了。</b>", "⚠️ <b>条件独立 ≠ 独立，差别在那个「给定 y」</b>：<b>独立</b>写成 p(x₂₀₈₇) = p(x₂₀₈₇|x₃₉₈₃₁)；<b>条件独立</b>写成 p(x₂₀₈₇|y) = p(x₂₀₈₇|y, x₃₉₈₃₁)。<b>前者显然不成立</b>（buy 和 price 在所有邮件里明显相关），<b>后者是我们要假设的</b>。", "⭐ <b>这个假设几乎肯定是错的，讲义自己承认</b>：<em>even though the Naive Bayes assumption is an <b>extremely strong</b> assumption, the resulting algorithm works well on many problems</em>。<b>「假设明显错、效果却很好」是朴素贝叶斯最有名的特点。</b>", "<b>「朴素」就是指这个假设</b>——naive 的本义是「天真、过于简单」，不是褒义词。"], "tbl": [{"cap": "⚠️ 独立 vs 条件独立 · 用「买」和「价格」两个词举例", "head": ["", "式子", "在垃圾邮件场景里成立吗"], "rows": [["<b>独立</b>", "p(buy) = p(buy | price)", "<b>明显不成立</b>——两词常同时出现"], ["<b>条件独立</b>", "p(buy|y) = p(buy | y, price)", "<b>也不太成立</b>，但这是我们假设的"], ["差别在哪", "多了「给定 y」三个字", "<b>先按类别分组，组内再看独立</b>"]]}], "say": "⭐ <b>为什么「假设错了还管用」？</b>一个常被引用的解释是：<b>朴素贝叶斯的概率值常常算得很离谱（经常接近 0 或 1），但 argmax 往往仍然对</b>。因为分类只需要<b>比较两个数谁大</b>，不需要两个数本身准确——<b>相关性造成的误差常常对两类「同向放大」，比较的结果因此没变</b>。这也解释了另一件事：<b>朴素贝叶斯输出的「概率」不可信</b>，不能拿去当置信度用（要用就得做概率校准）。⚠️ <b>这一条是我补的解释、不是讲义原文</b>——讲义只写了「works well on many problems」，没有给原因。", "ng": "Ng 在 L5 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=4149s\" target=\"_blank\">69:09</a> 给出这个假设：<em>in the Naive Bayes algorithm, we're going to assume that the Xᵢ's are <b>conditionally independent given y</b></em>。⭐ 他在课上<b>特别强调了「given y」这三个字</b>，和讲义那一整段括号里的澄清是同一个用意——<b>两边都觉得这里最容易出错，说明它确实是难点。</b><span class=\"src\">CS229/transcripts/L5.txt · 本地已下载</span>", "exam": "⭐ <b>如果本课要考朴素贝叶斯，这一页是最可能的那一页。</b>最标准的问法是「<b>朴素贝叶斯做了什么假设？这个假设现实吗？</b>」。满分答案三句：① <b>给定类别后各特征条件独立</b>（要写出「给定类别」，只说「特征独立」是错的）；② <b>现实中几乎不成立</b>（举个例子，比如 buy 和 price）；③ <b>但算法在很多问题上仍然表现很好</b>。⚠️ 只答「假设特征之间相互独立」会被扣分，<b>因为那是另一个（更强、更错的）假设</b>。", "tip": {"t": "条件独立的直观图像", "v": "想象把所有邮件<b>先按垃圾/非垃圾分成两堆</b>。NB 假设说的是：<b>在同一堆之内</b>，各个词出不出现互不影响。<b>类别本身是那个「共同原因」</b>——buy 和 price 之所以一起出现，是因为<b>它们都由「这是垃圾邮件」引起</b>；把这个共同原因固定住之后，剩下的关联就被假设掉了。"}}, {"r": [10, 10], "star": 2, "t": "参数、MLE 与预测：又是数数", "one": "φⱼ|y=1 就是「垃圾邮件里有多少比例出现了第 j 个词」。", "quote": "<em>The parameters have a very natural interpretation. For instance, φ_{j|y=1} is just the <b>fraction of the spam (y=1) emails in which word j does appear</b>.</em>", "eq": "参数：φ_{j|y=1} = p(xⱼ=1 | y=1),  φ_{j|y=0} = p(xⱼ=1 | y=0),  φ_y = p(y=1)\n\nφ_{j|y=1} = Σᵢ 1{x⁽ⁱ⁾ⱼ=1 ∧ y⁽ⁱ⁾=1} / Σᵢ 1{y⁽ⁱ⁾=1}\nφ_{j|y=0} = Σᵢ 1{x⁽ⁱ⁾ⱼ=1 ∧ y⁽ⁱ⁾=0} / Σᵢ 1{y⁽ⁱ⁾=0}\nφ_y       = Σᵢ 1{y⁽ⁱ⁾=1} / n\n\n预测：p(y=1|x) = [Π_j p(xⱼ|y=1)] p(y=1) / { [Π_j p(xⱼ|y=1)] p(y=1) + [Π_j p(xⱼ|y=0)] p(y=0) }", "pts": ["<b>「∧」是「并且」</b>，讲义专门说明了这个符号。所以分子是「<b>既出现了第 j 个词、又是垃圾邮件</b>的样本个数」。", "⭐ <b>三个参数的含义都能用一句大白话说清</b>：φ_{j|y=1}＝<b>垃圾邮件中出现词 j 的比例</b>；φ_{j|y=0}＝<b>正常邮件中出现词 j 的比例</b>；φ_y＝<b>垃圾邮件的比例</b>。<b>没有任何需要推导的东西，全是数数再相除。</b>", "<b>预测公式就是第 2 页的贝叶斯公式，把 p(x|y) 换成了连乘</b>。分母是全概率展开成两项，和第 2 页一模一样。", "<b>推广到多值特征很直接</b>：xⱼ 取 {1,…,kⱼ} 时，<b>把 p(xⱼ|y) 从伯努利换成多项分布</b>就行，别的都不动。", "⭐ <b>连续特征也能用</b>——讲义说常见做法是<b>离散化（discretize）</b>：把连续值切成几个区间，每个区间给一个编号。"], "tbl": [{"cap": "一个最小例子（4 封邮件，看词 j 是否出现）", "head": ["邮件", "y（1=垃圾）", "xⱼ", "贡献给"], "rows": [["①", "1", "1", "分子 ✓、分母 ✓"], ["②", "1", "0", "只进分母"], ["③", "0", "1", "（算 φ_{j|y=0} 时才用）"], ["④", "0", "0", "—"], ["<b>结果</b>", "—", "—", "<b>φ_{j|y=1} = 1/2，φ_{j|y=0} = 1/2，φ_y = 2/4</b>"]]}], "say": "⭐ <b>实现上有个必踩的坑，讲义没提</b>：预测公式里是 <b>50000 个小于 1 的数连乘</b>，直接算会<b>下溢成 0</b>（双精度浮点在大约 10⁻³⁰⁸ 处就归零了）。实际代码一律<b>取对数把连乘变连加</b>：log p(y) + Σⱼ log p(xⱼ|y)，<b>比较两类的这个和即可</b>（因为 log 单增，argmax 不变）。⭐ 这也顺带解释了<b>为什么下一页的零概率问题那么致命</b>——<b>log 0 = −∞</b>，一个没见过的词会直接把整个和拖到负无穷，<b>而不只是「概率变小一点」</b>。", "ng": "Ng 在 L5 讲完参数估计后，在 <a href=\"https://www.youtube.com/watch?v=nt63k3bfXS0&t=4665s\" target=\"_blank\">77:45</a> <b>把零概率问题留到了下一讲</b>：<em>we'll come back to that when we talk about Laplace [smoothing] on Wednesday</em>。⚠️ <b>所以第 11–14 页的内容在 L5 里找不到，要看 L6 的前半段。</b>⭐ 同一处他还给了一句很直接的实务判断：<em>if you used <b>logistic regression</b> for spam classification you do <b>better than this almost all the time</b></em>——<b>连 Ng 自己都说逻辑回归做垃圾邮件分类几乎总是比朴素贝叶斯好。</b>讲义的措辞要客气得多（「a very good, very popular algorithm」）。<span class=\"src\">CS229/transcripts/L5.txt · 本地已下载</span>", "exam": "⭐ <b>手算题的标准形态</b>：给一张「5–6 封邮件 × 3–4 个词」的 0/1 表，要你算几个 φ，再对一封新邮件判类。拿分要点：① <b>把每个 φ 的分子分母写出来再代数</b>，别直接报数；② 判类时<b>说明「分母对两类相同，只比较分子」</b>；③ <b>如果某个词在训练集里没出现过，要指出会得到 0/0，并点名需要 Laplace 平滑</b>——这正是下一页的内容，<b>能在这里提前点到会很加分</b>。"}, {"r": [11, 11], "star": 2, "t": "离散化，以及那个会把算法整个搞崩的零概率", "one": "没见过的词 ⇒ 概率估成 0 ⇒ 连乘变 0 ⇒ 0/0，算法无法作答。", "quote": "<em>it is statistically a <b>bad idea</b> to estimate the probability of some event to be zero just because you haven't seen it before in your finite training set.</em>", "eq": "离散化的例子（把连续的居住面积切成 5 档）：\n面积 (sq ft):  <400 | 400–800 | 800–1200 | 1200–1600 | >1600\nxⱼ:              1  |    2    |    3     |     4     |   5\n（890 平方英尺 ⇒ xⱼ = 3）\n\n零概率：\nφ_{35000|y=1} = 0 ,  φ_{35000|y=0} = 0   ← 训练集里从没出现过 “neurips”", "pts": ["⭐ <b>离散化还有个超出「图方便」的理由</b>：讲义说 <em>when the original, continuous-valued attributes are <b>not well-modeled by a multivariate normal distribution</b>, discretizing the features and using Naive Bayes (instead of GDA) will often result in a <b>better classifier</b></em>——<b>数据明显不像高斯时，离散化 + 朴素贝叶斯常常比硬套 GDA 更好。</b>", "<b>讲义的故事很具体</b>：你上完 CS229、项目做得好，某年五月投稿 NeurIPS，于是邮件里开始出现「neurips」这个词。<b>但训练集里从来没有过这个词</b>，所以两个 φ 都被估成 0。", "⚠️ <b>后果不是「概率变小」，是「算不出来」</b>：分子里有 p(x₃₅₀₀₀|y=1)=0，分母两项里也各有一个 0，<b>于是得到 0/0</b>。讲义的原话是 <em>our algorithm obtains 0/0, and <b>doesn't know how to make a prediction</b></em>。", "⭐ <b>讲义把问题拔高成了一条统计学原则</b>（见 quote）：<b>「没见过」不等于「不可能」</b>。有限的训练集里没出现过某件事，就把它的概率估成 0，<b>在统计上是个坏主意</b>——这条原则比垃圾邮件这个具体场景通用得多。"], "tbl": [{"cap": "零概率为什么是毁灭性的（而不只是「有点偏」）", "head": ["环节", "发生了什么"], "rows": [["某个词没见过", "φ = 0"], ["算 Π_j p(xⱼ|y)", "<b>整个连乘被一个 0 清零</b>"], ["两类都清零", "分子 0，分母 0+0"], ["结果", "<b>0/0，无法判断</b>"], ["如果用对数实现", "<b>log 0 = −∞</b>，同样崩"]]}], "say": "⭐ <b>连乘的「一票否决」性质值得单独记</b>：加法里一个 0 只是少加一项，<b>乘法里一个 0 让全体归零</b>。朴素贝叶斯恰恰是把 50000 个概率<b>乘</b>起来，所以它对零概率<b>极度敏感</b>——<b>只要有一个词没见过，前面 49999 个词提供的全部证据都作废</b>。这个脆弱性不是朴素贝叶斯独有，<b>任何形式为连乘的似然都有</b>，解决思路也都一样：<b>给没观测到的事件留一点概率</b>（下一页的 Laplace 平滑），或者改用对数并做数值保护。", "ng": "⭐ Ng 在 L6 讲这一段时<b>换了一个和垃圾邮件完全无关的例子</b>（<a href=\"https://www.youtube.com/watch?v=lDwow4aOrtg&t=280s\" target=\"_blank\">04:40</a> 起，他说 <em>let me use a different example for now</em>）：<a href=\"https://www.youtube.com/watch?v=lDwow4aOrtg&t=596s\" target=\"_blank\">09:56</a> <b>他讲自己当年追斯坦福橄榄球队的战绩</b>——球队连输若干场，按最大似然估计，<b>下一场赢的概率就是 0/n = 0</b>。<b>但「连输 5 场」显然不等于「下一场必输」。</b><a href=\"https://www.youtube.com/watch?v=lDwow4aOrtg&t=989s\" target=\"_blank\">16:29</a> 他还补了个笑点：<em>I was actually following the Stanford football team that year so, you know, they lost</em>。⭐ <b>这个例子比 neurips 好用</b>，因为它把问题从「NLP 的特殊困难」还原成了<b>「用有限样本估计概率」这个一般问题</b>。<span class=\"src\">CS229/transcripts/L6.txt · 本地已下载</span>", "exam": "⭐ <b>「零概率问题」是非常标准的概念考点</b>，问法通常是「朴素贝叶斯有什么缺陷/怎么改进」。答案三段：① <b>现象</b>——训练集里没出现过的特征值会被估成 0；② <b>后果</b>——<b>连乘被清零，得到 0/0，无法预测</b>（⚠️ 一定要说出「连乘」，只说「概率是 0」没说到要害）；③ <b>解法</b>——Laplace 平滑。<b>这三段写全，这道题就满了。</b>"}, {"r": [12, 12], "star": 3, "t": "★ Laplace 平滑：分子加 1，分母加 k", "one": "给每个可能取值预先「送一票」，概率就永远不会是 0。", "quote": "<em>Here, we've added 1 to the numerator, and k to the denominator. Note that Σ_{j=1}^{k} φⱼ = 1 still holds (check this yourself!) … Also, φⱼ ≠ 0 for all values of j, solving our problem of probabilities being estimated as zero.</em>", "eq": "一般形式（z 取值于 {1,…,k}）：\n原来： φⱼ = Σᵢ 1{z⁽ⁱ⁾=j} / n\n平滑： φⱼ = ( 1 + Σᵢ 1{z⁽ⁱ⁾=j} ) / ( k + n )\n\n用到朴素贝叶斯（xⱼ 是 0/1，所以 k = 2）：\nφ_{j|y=1} = ( 1 + Σᵢ 1{x⁽ⁱ⁾ⱼ=1 ∧ y⁽ⁱ⁾=1} ) / ( 2 + Σᵢ 1{y⁽ⁱ⁾=1} )\nφ_{j|y=0} = ( 1 + Σᵢ 1{x⁽ⁱ⁾ⱼ=1 ∧ y⁽ⁱ⁾=0} ) / ( 2 + Σᵢ 1{y⁽ⁱ⁾=0} )", "pts": ["⭐ <b>分母加的是 k（取值个数），不是别的数</b>。道理是：<b>分子每一项都加了 1，k 个取值一共加了 k，分母必须同样加 k，总和才仍是 1。</b>讲义让你自己验证这件事——验证很简单：Σⱼ(1+cⱼ) = k + Σⱼcⱼ = k + n，正好等于分母。", "⚠️ <b>朴素贝叶斯这里 k = 2 不是 50000</b>。常见的错是把 k 当成词表大小。<b>k 是「这一个特征 xⱼ 有几种取值」</b>——xⱼ 只能是 0 或 1，所以 <b>k=2</b>。", "<b>效果</b>：再也不会有 0。讲义还说 <em>under certain (arguably quite strong) conditions, it can be shown that the Laplace smoothing actually gives the <b>optimal</b> estimator</em>——⭐ 注意那个括号里的自嘲：<b>「可以说相当强的」条件</b>，讲义自己对这个最优性不太当真。", "<b>φ_y 要不要平滑</b>：讲义说<em>通常无所谓</em>，因为垃圾/非垃圾两类的样本数一般都不少，<b>φ_y 本来就离 0 很远</b>。"], "tbl": [{"cap": "平滑前后对比（设垃圾邮件共 100 封）", "head": ["词 j 在垃圾邮件中出现次数", "不平滑 φ", "<b>Laplace 平滑后</b>"], "rows": [["0 次", "<b>0 ← 致命</b>", "<b>1/102 ≈ 0.0098</b>"], ["1 次", "0.01", "2/102 ≈ 0.0196"], ["50 次", "0.50", "51/102 = 0.50"], ["100 次", "<b>1.0 ← 也有问题</b>", "<b>101/102 ≈ 0.990</b>"]]}], "say": "⭐ <b>上表揭示了两件讲义没明说的事</b>。① <b>平滑同时解决了「概率估成 1」的对称问题</b>——某个词在所有垃圾邮件里都出现过时，不平滑会给出 p=1，意味着「正常邮件绝不可能含这个词」，同样过于武断。② <b>影响是不对称的：稀有事件被改动很大（0 → 0.0098），常见事件几乎不动（0.50 → 0.50）</b>。<b>这正是我们想要的行为——数据多的地方相信数据，数据少的地方才去纠正。</b>⭐ 从贝叶斯视角看，这叫「<b>加了一个均匀先验</b>」：相当于在真实数据之外，<b>先假装每个取值各观测到过一次</b>。所以 Laplace 平滑也叫 <b>add-one smoothing</b>，更一般的版本是分子加 α、分母加 αk（sklearn 的 <code>alpha</code> 参数，默认就是 1）。", "ng": "Ng 在 L6 <a href=\"https://www.youtube.com/watch?v=lDwow4aOrtg&t=0s\" target=\"_blank\">00:00</a> 开门见山：<em>today you see how <b>Laplace smoothing</b> is one other idea you need to add to the Naive Bayes algorithm we described on Monday</em>。<a href=\"https://www.youtube.com/watch?v=lDwow4aOrtg&t=280s\" target=\"_blank\">04:40</a> 他用斯坦福橄榄球队连输的例子引入，<a href=\"https://www.youtube.com/watch?v=lDwow4aOrtg&t=596s\" target=\"_blank\">09:56</a> 把结论搬回朴素贝叶斯。⭐ <b>橄榄球例子的好处是 k 很清楚</b>：输赢只有两种结果，<b>k=2</b>，所以平滑后「下一场赢」的概率是 (0+1)/(5+2) = 1/7，<b>而不是 0</b>。<b>这个数自己算一遍，k 该取几就不会错了。</b><span class=\"src\">CS229/transcripts/L6.txt · 本地已下载</span>", "exam": "⭐ <b>Laplace 平滑是极标准的手算题</b>，题型是「某词在 n 封垃圾邮件中出现了 c 次，求平滑后的 φ」。答案 <b>(c+1)/(n+2)</b>。⚠️ 两个高频失分：① <b>分母加成了词表大小</b>（那是下一页多项事件模型的做法，<b>两种模型加的数不一样</b>）；② <b>忘了说明为什么加 k 而不是加 1</b>——<b>「保证概率总和仍为 1」这句话本身就是得分点</b>。", "tip": {"t": "两种模型的平滑分母不同，别记混", "v": "<b>伯努利事件模型</b>（本页）：xⱼ ∈ {0,1} ⇒ <b>分母 +2</b>。<b>多项事件模型</b>（第 14 页）：每个位置的词取值于整个词表 ⇒ <b>分母 +|V|</b>。⭐ 一句话记法：<b>分母加的永远是「这个随机变量有几种可能取值」。</b>"}}, {"r": [13, 13], "star": 2, "t": "两种事件模型：同样一个公式，意思完全不同", "one": "一个问「每个词在不在」，一个问「每个位置是哪个词」。", "quote": "<em>Note that this formula <b>looks like</b> the one we had earlier for the probability of a message under the Bernoulli event model, but that the terms in the formula now mean <b>very different things</b>.</em>", "eq": "伯努利事件模型（前面一直在用的）：\n  xⱼ ∈ {0,1}，j 跑遍整个词表，x 的长度 = |V| 固定\n  生成过程：对词表里每个词，独立决定要不要放进邮件\n\n多项事件模型（本页新的）：\n  xⱼ ∈ {1,…,|V|}，j 跑遍邮件里的每个位置，x 的长度 = d（每封邮件不同）\n  生成过程：逐个位置，从同一个词表分布里独立抽一个词\n\n两者的概率都写成  p(y) Π_j p(xⱼ|y)   ← 形状一样，含义完全不同", "pts": ["⭐ <b>最关键的差别是「j 代表什么」</b>：伯努利模型里 <b>j 是词表里的第 j 个词</b>（所以 x 的长度恒为词表大小）；多项模型里 <b>j 是邮件里的第 j 个位置</b>（所以 <b>x 的长度 d 因邮件而异</b>）。", "<b>讲义的编码例子</b>：邮件以 “A NeurIPS …” 开头，则 <b>x₁ = 1</b>（「a」是词表第 1 个词），<b>x₂ = 35000</b>（「neurips」是第 35000 个）。<b>注意存的是词的编号，不是 0/1。</b>", "<b>两个模型的生成故事都要会讲</b>：伯努利——<b>发件人拿着整本词典，对每个词独立决定放不放</b>；多项——<b>发件人逐个位置写词，每次从同一个多项分布里抽</b>。", "⚠️ <b>多项模型丢掉了词序</b>：讲义明说 <em>we have assumed that p(xⱼ|y) is the <b>same for all values of j</b></em>——<b>词出现在哪个位置不影响它的概率</b>。所以它仍然是「词袋」，只是<b>记了次数</b>。", "⭐ <b>最实质的差别：伯努利模型完全不管一个词出现了几次</b>，出现 1 次和 20 次编码完全一样；<b>多项模型会把 20 次数进去</b>。对垃圾邮件来说，<b>「免费」出现 20 次显然比出现 1 次更可疑</b>——这就是多项模型更好的原因。"], "tbl": [{"cap": "★ 两种事件模型 · 五个维度对照", "head": ["", "伯努利事件模型", "多项事件模型"], "rows": [["xⱼ 的含义", "<b>第 j 个词在不在</b>", "<b>第 j 个位置是哪个词</b>"], ["xⱼ 的取值", "{0, 1}", "{1, …, |V|}"], ["x 的长度", "<b>|V|，固定</b>", "<b>d，随邮件变</b>"], ["词频", "<b>忽略</b>（出现 1 次=20 次）", "<b>计入</b>"], ["没出现的词", "<b>贡献 (1−φ) 因子</b>", "<b>完全不出现在式子里</b>"], ["文本分类效果", "好", "<b>更好</b>"]]}], "say": "⭐ <b>表格倒数第二行是个容易漏掉但很重要的差别</b>：伯努利模型的连乘跑遍<b>整个词表</b>，所以<b>「这封邮件里没有 viagra」这件事也会贡献一个 (1−φ) 因子</b>，是实打实的证据；多项模型的连乘只跑<b>邮件里实际出现的词</b>，<b>没出现的词根本不进式子</b>。<b>换句话说：伯努利模型把「缺席」当证据，多项模型不当。</b>⭐ <b>这解释了两者各自的适用场景</b>：短文本（标题、推文）里缺席信息相对可靠，伯努利不吃亏；长文本里绝大多数词都缺席，<b>一堆 (1−φ) 因子会淹没真正有信息的那几个词</b>，所以长文本上多项模型明显更好。", "ng": "Ng 在 L6 <a href=\"https://www.youtube.com/watch?v=lDwow4aOrtg&t=1437s\" target=\"_blank\">23:57</a> 引入这个对照，还顺手解释了<b>那两个名字为什么这么拗口</b>：<em>Bernoulli means coin tosses, so <b>multivariate</b> means there are 10,000 Bernoulli random variables in this model</em>——<b>「multi-variate Bernoulli」＝一万个独立的抛硬币</b>。⭐ 他对第二个名字的评价很直白（<a href=\"https://www.youtube.com/watch?v=lDwow4aOrtg&t=1512s\" target=\"_blank\">25:12</a>）：<em>this equation looks <b>cosmetically identical</b>, but with this new model, the <b>confusingly named</b> Multinomial [Event Model] …</em>——<b>连 Ng 都说这名字起得让人糊涂。</b>讲义写的是「the terms now mean very different things」，意思相同但没这么直率。<span class=\"src\">CS229/transcripts/L6.txt · 本地已下载</span>", "exam": "<b>事件模型这一层细节超出本课 CLO 的要求</b>（CLO 只说「demonstrate the principles of Naive Bayes」）。⭐ <b>按「知道有这回事」来读就够</b>：能说出「朴素贝叶斯做文本分类有两种特征表示，一种只看词在不在、一种计词频，后者通常更好」即可。<b>不用背两套 MLE 公式。</b>"}, {"r": [14, 14], "star": 2, "t": "多项事件模型的 MLE：分母从「几封邮件」变成「一共几个词」", "one": "计数单位变了——按词计，不是按邮件计。", "quote": "<em>While not necessarily the very best classification algorithm, the Naive Bayes classifier <b>often works surprisingly well</b>. It is often also a very good “first thing to try,” given its simplicity and ease of implementation.</em>", "eq": "φ_{k|y=1} = Σᵢ Σ_{j=1}^{dᵢ} 1{x⁽ⁱ⁾ⱼ = k ∧ y⁽ⁱ⁾=1} / Σᵢ 1{y⁽ⁱ⁾=1} dᵢ\nφ_{k|y=0} = Σᵢ Σ_{j=1}^{dᵢ} 1{x⁽ⁱ⁾ⱼ = k ∧ y⁽ⁱ⁾=0} / Σᵢ 1{y⁽ⁱ⁾=0} dᵢ\nφ_y       = Σᵢ 1{y⁽ⁱ⁾=1} / n\n\n加 Laplace 平滑（分母加的是 |V|）：\nφ_{k|y=1} = ( 1 + ΣᵢΣⱼ 1{x⁽ⁱ⁾ⱼ=k ∧ y⁽ⁱ⁾=1} ) / ( |V| + Σᵢ 1{y⁽ⁱ⁾=1} dᵢ )", "pts": ["⭐ <b>分子是双重求和</b>：外层跑遍所有邮件，内层跑遍<b>这封邮件的每一个词位</b>。所以它数的是「<b>词 k 在全部垃圾邮件中一共出现了多少次</b>」——<b>一封邮件里出现 5 次就算 5 次。</b>", "⚠️ <b>分母是 Σᵢ 1{y⁽ⁱ⁾=1}·dᵢ</b>，即「<b>所有垃圾邮件加起来一共有多少个词</b>」。<b>注意 dᵢ 带下标</b>——每封邮件长度不同，要各自的长度。", "⭐ <b>一句话总结这个改变</b>：伯努利模型的分母是「<b>有几封垃圾邮件</b>」，多项模型的分母是「<b>垃圾邮件里一共有几个词</b>」。<b>计数单位从「文档」变成了「词次」。</b>", "<b>Laplace 平滑分母加 |V|</b>，因为每个位置的词<b>可以是词表里任何一个</b>，取值个数就是 |V|。讲义说这个平滑 <em>is <b>needed in practice</b> for good performance</em>——<b>不是可选项。</b>", "<b>φ_y 的公式没变</b>，仍然是垃圾邮件占的比例（按<b>邮件</b>数，不是按词）。"], "tbl": [{"cap": "⚠️ 两种模型的 MLE 与平滑 · 并排对照", "head": ["", "伯努利事件模型", "多项事件模型"], "rows": [["分子数什么", "<b>出现过词 j 的垃圾邮件数</b>", "<b>词 k 在垃圾邮件中出现的总次数</b>"], ["分母", "<b>垃圾邮件的封数</b>", "<b>垃圾邮件的总词数</b>"], ["平滑分子", "+1", "+1"], ["平滑分母", "<b>+2</b>", "<b>+|V|</b>"]]}], "say": "⭐ <b>讲义最后那句评价值得照抄进答案</b>：朴素贝叶斯「<b>不一定是最好的分类算法，但常常好得出人意料</b>，而且由于简单、易实现，<b>是很好的「第一个该试的东西」</b>」。这句话给出了它在工具箱里的准确位置——<b>不是终点，是基线（baseline）</b>。⚠️ 但要和前面对齐着读：<b>Ng 在课上说得更直接，逻辑回归做垃圾邮件几乎总是更好</b>（L5 77:45）。<b>两句话并不矛盾</b>：朴素贝叶斯胜在<b>几分钟就能跑出一个结果</b>，用来确定「这个问题到底有多难」；真要上线，再换更强的模型。<b>「先拿它定一个基线」是它今天仍被用的主要理由。</b>", "ng": "⚠️ <b>Ng 在 L6 没有逐项推导这两个 MLE 公式</b>，他写出结果就转去讲下一个话题了（L6 后半是 SVM 的铺垫）。<b>这一页是讲义比课堂细的地方。</b>⭐ 不过他在 <a href=\"https://www.youtube.com/watch?v=lDwow4aOrtg&t=1512s\" target=\"_blank\">25:12</a> 强调过那个最容易骗人的点：<em>this equation looks <b>cosmetically identical</b></em>——<b>p(y)Πⱼp(xⱼ|y) 这个式子在两个模型里长得一模一样，但每个符号的含义都变了</b>。<b>看到相同的式子先确认符号定义，这是读这一页唯一需要的警觉。</b><span class=\"src\">CS229/transcripts/L6.txt · 本地已下载</span>", "exam": "⭐ <b>这一页按「了解」处理即可</b>，本课 CLO 要的是朴素贝叶斯的「principles」和「advantages and disadvantages」，不是两套参数估计公式。<b>真正值得带进考场的是讲义最后那句定位</b>：<b>简单、快、常常出人意料地好、是很好的第一个尝试</b>——如果大题问「什么时候会选朴素贝叶斯」，这就是答案的骨架，再配上第 7 页那套「强假设 vs 稳健」的权衡语言。", "tip": {"t": "整份讲义的一句话总结", "v": "<b>生成式 = 先学每一类长什么样，再用贝叶斯反推。</b>特征<b>连续</b>用 <b>GDA</b>（假设高斯、共用 Σ、边界是直线、闭式解）；特征<b>离散/文本</b>用<b>朴素贝叶斯</b>（假设条件独立、必须配 Laplace 平滑）。<b>共同的代价是假设强</b>——假设对时数据效率高，假设错时不如逻辑回归稳健。"}}];

      localStorage.removeItem("cs229-notes2quiz");
      localStorage.removeItem("cs229-notes2p");
    }
  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");
    b.title="第 "+p+" 页";
    if(map[p]!=null) b.className="has";
    b.onclick=(function(x){ return function(){ go(x); }; })(p);
    strip.appendChild(b); cells.push(b);
  }

  function navHtml(){
    return '<div class="nav"><button class="btn" id="p2">← 上一页</button>'+
           '<button class="btn" id="n2">下一页 →</button></div>';
  }
  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.quote) h+='<div class="quote"><span class="t">课件原话</span>'+n.quote+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl) h+=n.tbl.map(function(T){var s='<div class="tw">'+(T.cap?'<div class="tc">'+T.cap+'</div>':"")+'<table class="nt">';if(T.head) s+='<thead><tr>'+T.head.map(function(c){return '<th>'+c+'</th>';}).join("")+'</tr></thead>';s+='<tbody>'+T.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div>';return s;}).join("");
    if(n.say) h+='<div class="say"><span class="t">CS229 / 讲义补充</span>'+n.say+'</div>';
    if(n.ng) h+='<div class="ng"><span class="t">从零补基础 · Andrew Ng CS229</span>'+n.ng+'</div>';
    if(n.exam) h+='<div class="exam"><span class="t">与考试的联系</span>'+n.exam+'</div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**，所以加查询参数。
    frame.src=PDF+"?p="+p+"#page="+p+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    render(p);
    paintStrip();
    revPaint();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测与错题记录 ══════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {n:做过几次, w:错过几次, r:[最近 6 次 1/0]}
     全部存 localStorage，纯本地。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function rec(key, ok){
    var d = ST[key] || {n:0, w:0, r:[]};
    d.n++; if(!ok) d.w++;
    d.r.push(ok ? 1 : 0);
    if(d.r.length > 6) d.r = d.r.slice(-6);
    ST[key] = d; save();
  }
  /* 最近错次数 —— 薄弱点排序用的就是它，不是历史总错数：
     一个月前错过三次但最近三次全对，不该再排在最前面。 */
  function recentWrong(d){ return (d.r||[]).filter(function(x){ return x===0; }).length; }
  /* 「还算不算薄弱」：错过、且最近两次没有连对。
     用连对而不是「最近窗口里没有 0」，是为了让规则能一句话说清楚，
     用户看得见自己离毕业还差几次；也挡住了蒙对一次就算掌握。 */
  function isWeak(d){
    if(!d || !d.w) return false;
    var r = d.r || [];
    return !(r.length >= 2 && r[r.length-1] === 1 && r[r.length-2] === 1);
  }
  function unitWrong(start){
    var qs = Q[start] || [], rw = 0, w = 0, n = 0, qw = 0;
    qs.forEach(function(_,i){
      var d = ST[start+"#"+i]; if(!d) return;
      rw += recentWrong(d); w += d.w; n += d.n; if(isWeak(d)) qw++;
    });
    // rw 数的是最近错的**次数**（只用来排序，谁更该先复习）；
    // qw 数的是**还没毕业的题数**（给人看，也决定标红和进不进复习队列）。
    return {rw:rw, w:w, n:n, qw:qw};
  }
  function histHtml(d){
    var h = "";
    for(var i=0;i<6;i++){
      var v = d && d.r ? d.r[d.r.length-6+i] : undefined;
      h += '<i class="'+(v===1?"o":v===0?"x":"")+'"></i>';
    }
    return h;
  }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>自测 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key];
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        h += '<button class="opt" data-j="'+j+'">'+o+'</button>';
      });
      h += '<div class="why" style="display:none"></div>';
      h += '<div class="qhist">'+histHtml(d)+
           '<span style="margin-left:6px">'+
           (d ? "做过 "+d.n+" 次 · 错 "+d.w : "还没做过")+'</span>'+
           '<button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j, ok = (j === ans);
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(!ok){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          rec(key, ok);
          box.querySelector(".qhist").innerHTML =
            histHtml(ST[key]) + '<span style="margin-left:6px">做过 '+ST[key].n+
            ' 次 · 错 '+ST[key].w+'</span><button class="qagain">重做</button>';
          bindAgain(box); paintStrip(); revSync();
          var bd = document.querySelector('#card>h2 .qbadge');
          if(bd) bd.outerHTML = qBadge(+key.split('#')[0]);
          bindBadge();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){ render(cur); };
  }

  /* 页条上标红：这一单元最近还在错 */
  function paintStrip(){
    cells.forEach(function(c,k){
      var i = map[k+1];
      var cls = (i!=null ? "has" : "");
      if(i!=null){
        if(unitWrong(N[i].r[0]).qw > 0) cls += " err";
      }
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }


  /* ── 标题角标：不用滚到底就知道这页有没有题、错没错过 ── */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var st = unitWrong(start);
    return '<span class="qbadge'+(st.qw?" bad":"")+'" title="跳到自测">'+
      (st.qw ? "还错 "+st.qw+"/"+qs.length+" 题" : qs.length+" 题")+' ↓</span>';
  }

  /* ── 复习模式：前进/后退只在「最近还在错」的页之间跳 ──
     用户要的是「专项针对薄弱部分复习」。光有一张错题清单还得自己一条条点，
     所以把它接到翻页上：开了之后 ← → 就只在这些页里走。
     依据是**最近**错次，不是累计——早就改对的题不该再拦路。 */
  var rev = false, revList = [];
  function weakPages(){
    return N.filter(function(n){ return unitWrong(n.r[0]).qw > 0; })
            .map(function(n){ return n.r[0]; });
  }
  function revPaint(){
    var chip = document.getElementById("revChip");
    chip.classList.toggle("on", rev);
    if(!rev) return;
    var i = revList.indexOf(mapStart(cur));
    chip.querySelector("b").textContent =
      (i < 0 ? "?" : (i+1)) + " / " + revList.length + " 页";
  }
  function mapStart(p){ var i = map[p]; return i==null ? -1 : N[i].r[0]; }

  function step(d){
    if(!rev) return go(cur + d);
    if(!revList.length) return exitRev(true);
    var here = mapStart(cur), i = revList.indexOf(here);
    if(i < 0){                       // 当前不在清单里：跳到顺着方向最近的一页
      var t = null;
      for(var k=0;k<revList.length;k++){
        if(d > 0 ? revList[k] > cur : revList[k] < cur){ t = revList[k]; if(d>0) break; }
      }
      return go(t == null ? revList[d>0 ? 0 : revList.length-1] : t);
    }
    go(revList[(i + d + revList.length) % revList.length]);
  }
  function enterRev(){
    revList = weakPages();
    if(!revList.length){ alert("没有待复习的页——错过的题都连对两次毕业了。"); return; }
    rev = true; wp.classList.remove("on");
    go(revList.indexOf(mapStart(cur)) >= 0 ? cur : revList[0]);
    revPaint();
  }
  function exitRev(done){
    rev = false; revPaint();
    if(done) alert("待复习的页都毕业了，已退出复习模式。");
  }
  document.getElementById("revOff").onclick = function(){ exitRev(false); };

  /* 答完一题就重算一次清单：刚改对的页当场从复习队列里消失。 */
  function revSync(){
    if(!rev) return;
    revList = weakPages();
    if(!revList.length) exitRev(true); else revPaint();
  }

  /* 错题本 */
  var wp = document.getElementById("wrongPanel");
  function openWrong(){
    var list = [];
    N.forEach(function(n){
      var st = unitWrong(n.r[0]);
      if(st.n === 0 || st.w === 0) return;
      list.push({n:n, rw:st.rw, w:st.w, tot:st.n, qw:st.qw});
    });
    // 还没毕业的一律排前面；同样没毕业的，最近错得多的更靠前。
    list.sort(function(a,b){
      return (b.qw > 0) - (a.qw > 0) || (b.rw - a.rw) || (b.w - a.w); });
    var box = document.getElementById("wrongList");
    if(!list.length){
      box.innerHTML = '<div class="none">还没有错题。<br>做几道自测再回来看。</div>';
    } else {
      box.innerHTML = list.map(function(it){
        var qs = Q[it.n.r[0]] || [];
        // 每道题的六格单独成一组，多题的单元才不会连成一片看不出边界
        var h = qs.map(function(_,i){
          return "<u>"+histHtml(ST[it.n.r[0]+"#"+i])+"</u>"; }).join("");
        return '<div class="wrow'+(it.qw ? "" : " done")+'" data-p="'+it.n.r[0]+'">'+
          '<span class="p">p'+it.n.r[0]+'</span>'+
          '<span class="n2">'+it.n.t+'</span>'+
          '<span class="h">'+h+'</span>'+
          '<span class="s">'+(it.qw ? "还差 "+it.qw+" 题毕业" : "已毕业")+
          ' · 累计错 '+it.w+'/'+it.tot+'</span></div>';
      }).join("");
      box.querySelectorAll(".wrow").forEach(function(r){
        r.onclick = function(){ wp.classList.remove("on"); go(+r.dataset.p); };
      });
    }
    // 总账。三个数分工明确：做了多少、还有多少没过关、一共栽过几次。
    var done=0, tot=0, weak=0, wsum=0;
    Object.keys(Q).forEach(function(k){
      Q[k].forEach(function(_,i){
        tot++;
        var d = ST[k+"#"+i]; if(!d) return;
        done++; wsum += d.w; if(isWeak(d)) weak++;
      });
    });
    document.getElementById("wrongTally").innerHTML =
      '<span>做过 <b>'+done+'</b> / '+tot+' 题</span>'+
      '<span>没毕业 <b class="hot">'+weak+'</b> 题</span>'+
      '<span>累计错 <b>'+wsum+'</b> 次</span>'+
      '<span>待复习 <b>'+weakPages().length+'</b> 页</span>';
    document.getElementById("revOn").disabled = !weakPages().length;
    wp.classList.add("on");
  }
  document.getElementById("wrongBtn").onclick = openWrong;
  document.getElementById("revOn").onclick = enterRev;
  document.getElementById("wrongClose").onclick = function(){ wp.classList.remove("on"); };
  document.getElementById("wrongReset").onclick = function(){
    if(!confirm("清空全部自测记录？此操作不可撤销。")) return;
    ST = {}; save(); exitRev(false); paintStrip(); openWrong(); render(cur);
  };
  wp.onclick = function(e){ if(e.target === wp) wp.classList.remove("on"); };

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
