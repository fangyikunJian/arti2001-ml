<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS229 讲义精读 · 监督学习 · 线性回归 · 分类 · GLM（讲义 Part I–III） · 逐页精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}
.qbadge.bad{color:var(--warn)}
#wrongBox .tally{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
#wrongBox .tally span{border:1px solid var(--line);border-radius:8px;padding:5px 11px;
  font-size:12.5px;color:var(--dim);background:var(--sunken)}
#wrongBox .tally b{color:var(--ink);font-weight:650}
#wrongBox .tally b.hot{color:var(--warn)}
.wrow .h{gap:3px}
.wrow .h u{display:flex;gap:2px;text-decoration:none;
  padding-right:7px;margin-right:4px;border-right:1px solid var(--line)}
.wrow .h u:last-child{border-right:0;padding-right:0;margin-right:0}
#revChip{display:none;align-items:center;gap:9px;border:1px solid var(--warn);
  border-radius:8px;padding:5px 11px;font-size:12.5px;color:var(--warn);
  background:var(--tintwarn2);white-space:nowrap}
#revChip.on{display:inline-flex}
#revChip b{font:650 12px var(--mono)}
#revChip button{background:none;border:0;color:var(--dim);cursor:pointer;
  font:12px var(--cjk);text-decoration:underline;padding:0}
#revChip button:hover{color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default}
.btn:disabled:hover{border-color:var(--line)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qhist{font:11px var(--mono);color:var(--dim);margin-top:8px;display:flex;
  align-items:center;gap:5px}
.qhist i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.qhist i.o{background:var(--acc)} .qhist i.x{background:var(--warn)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
#strip b.err{background:var(--errdot)}
#strip b.err.on{background:var(--acc2)}
/* 错题本 */
#wrongPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#wrongPanel.on{display:flex}
#wrongBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(760px,100%);max-height:84vh;overflow:auto;padding:22px 24px}
#wrongBox h3{margin:0 0 4px;font-size:18px}
#wrongBox .sub{color:var(--dim);font-size:13px;margin:0 0 16px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;
  border:1px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--sunken)}
.wrow:hover{border-color:var(--acc2)}
.wrow .p{font:700 12px var(--mono);color:var(--acc2);flex:0 0 52px}
.wrow.done{opacity:.5}
.wrow.done .p{color:var(--acc)}
.wrow .n2{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.wrow .s{font:11.5px var(--mono);color:var(--dim);flex:0 0 auto}
.wrow .h{display:flex;gap:3px;flex:0 0 auto}
.wrow .h i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.wrow .h i.o{background:var(--acc)} .wrow .h i.x{background:var(--warn)}
#wrongBox .none{color:var(--dim);text-align:center;padding:30px 0;line-height:2}
#wrongFoot{display:flex;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line)}
#wrongFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ EXTRA_CSS:BEGIN ══ */
/* ══ 讲解区里的链接兜底 ══
   ⚠ 2026-10-03 查出来的：原先只给 .ng a 上了色，放在 tip / say / pts / exam 里的链接
   会退回浏览器默认的 #0000EE —— 浅色下还能看（8.47:1），**暗色下只有 1.95:1**。
   做 notes2 时第一次往 tip 里放时间码链接就撞上了。这条规则管住所有其它位置。 */
#card a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
#card a:hover{opacity:.75}

/* ══ 「从零补基础 · Andrew Ng」栏 ══ */
.ng{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintviolet)}
.ng .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--violet);
  letter-spacing:.4px;margin-bottom:5px}
/* ⚠ 要用 #card .ng a 而不是 .ng a —— 上面的兜底规则带了 #card 这个 id，
   光写 .ng a（0,1,1）会被 #card a（1,0,1）压过去，紫色链接会变蓝。 */
#card .ng a{color:var(--violet);text-decoration:none;border-bottom:1px solid var(--violet)}
#card .ng a:hover{opacity:.75}
.ng .src{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
:root:not([data-theme="dark"]) .ng{box-shadow:var(--shadow)}

/* ══ 「课件原话」栏：引官方英文 ══ */
.quote{border-left:3px solid var(--dim);background:var(--lift2);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;font-size:13px;line-height:1.7;color:var(--ink3)}
.quote .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--dim);
  letter-spacing:.4px;margin-bottom:5px}
.quote b{color:var(--ink2)}
.quote em{font-style:normal;color:var(--ink2);font-weight:560}

/* ══ 笔记表格：对比表 / 情况表 / 数值表 ══ */
.tw{margin:13px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tc{font-size:11.5px;font-family:var(--mono);color:var(--dim);letter-spacing:.3px;
  padding:7px 12px;background:var(--sunken);border-bottom:1px solid var(--line)}
table.nt{width:100%;border-collapse:collapse;font-size:12.8px;line-height:1.55}
table.nt th{text-align:left;font-weight:620;font-size:11.5px;color:var(--dim);
  background:var(--panel2);padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
table.nt td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.nt tbody tr:last-child td{border-bottom:none}
table.nt td:first-child{font-weight:560;color:var(--ink2)}
table.nt b{color:var(--ink2)}
:root:not([data-theme="dark"]) .tw{box-shadow:var(--shadow)}

/* ══ 「与考试的联系」栏 ══ */
.exam{border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintacc2)}
.exam .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--acc2);
  letter-spacing:.4px;margin-bottom:5px}
:root:not([data-theme="dark"]) .exam{box-shadow:var(--shadow)}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}
/* ══ EXTRA_CSS:END ══ */

</style>
</head>
<body data-key="cs234-2019-l01">

<div id="bar">
  <h1>CS229 讲义精读 · <span>监督学习 · 线性回归 · 分类 · GLM（讲义 Part I–III）</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 28</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <span id="revChip">复习模式 <b></b><button id="revOff">退出</button></span>
  <button class="btn" id="wrongBtn">错题本</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="wrongPanel"><div id="wrongBox">
  <h3>错题本</h3>
  <p class="sub">错过的题<b>连着答对两次就毕业</b>，自动从这里和复习模式里退出。<br>
  还没毕业的排在前面，最近错得多的更靠前。点任意一行跳到那一页重看。</p>
  <div class="tally" id="wrongTally"></div>
  <div id="wrongList"></div>
  <div id="wrongFoot">
    <button class="btn" id="revOn">只复习这些页</button>
    <button class="btn" id="wrongClose">关闭</button>
    <button class="btn" id="wrongReset">清空全部记录</button>
  </div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示课件？</b></p>
      <p>本页直接引用同目录下的 <code>slides/cs229-notes1.pdf</code>。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>精读</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/CS229-notes1-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say CS229 / 讲义补充（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {"1": [{"t": "讲义开篇的房价数据有 47 行，每行包含面积和价格。这个「每行都有一个已知的 price」的事实，直接决定了什么？", "o": ["这是无监督学习，因为只有两列", "无法判断，还要看用什么算法", "这是监督学习——有已知的目标值可供学习", "这是强化学习，因为要预测未来"], "a": 2, "w": "判据只看「训练时有没有给出正确答案 y」，和算法无关。M2 的 PCA/聚类/GMM 之所以是无监督，正是因为没有这一列。"}, {"t": "关于这份 2019 版讲义的记号，下面哪一句是对的？", "o": ["n 是特征维数，d 是样本个数", "n 是样本个数，d 是特征维数", "m 是样本个数，n 是特征维数", "讲义全程没有定义这两个符号"], "a": 1, "w": "封面写着「slightly updated by TM on June 28, 2019」，这次更新把样本数从 m 改成 n。老版讲义和 Ng 的课堂口述用的都是旧记号（m 个样本），混着看会乱。"}], "2": [{"t": "x⁽²⁾₃ 表示什么？", "o": ["第 2 个样本的第 3 次方", "第 3 个样本的第 2 个特征", "第 3 个特征的平方", "第 2 个样本的第 3 个特征"], "a": 3, "w": "上标括号里的是样本编号（讲义强调它「has nothing to do with exponentiation」），下标是特征编号。"}, {"t": "要判断一个问题是回归还是分类，依据是什么？", "o": ["目标变量 y 的取值形式：连续是回归，少数离散值是分类", "训练样本的数量", "用的是线性模型还是非线性模型", "输入特征 x 的维数"], "a": 0, "w": "只看输出。本课课件举过一个好例子：从照片预测年龄是回归（连续数值），但若改成分「儿童/青年/中年/老年」四档就变成分类——同样的输入，任务类型变了。"}], "3": [{"t": "引入 x₀ = 1 这个约定的目的是什么？", "o": ["把截距 θ₀ 吸收成普通权重，使模型能写成一个点积 θᵀx", "防止 XᵀX 不可逆", "让所有特征都归一化到 [0,1]", "让梯度下降收敛得更快"], "a": 0, "w": "θ₀ 本来是个孤立的加项，塞不进 Σθᵢxᵢ。补一列恒等于 1 的假特征后，θ₀·1 = θ₀，整个模型就成了一个点积，所有推导都能写短。"}, {"t": "讲义说 d 是「input variables 的个数（不含 x₀）」。那么参数向量 θ 有多少个分量？", "o": ["n 个", "d − 1 个", "d 个", "d + 1 个"], "a": 3, "w": "θ₀ 到 θ_d 共 d+1 个。这就是后面正规方程里设计矩阵写成「n-by-d+1, if we include the intercept term」的原因。"}], "4": [{"t": "代价函数 J(θ) = <b>½</b>Σ(hθ(x⁽ⁱ⁾)−y⁽ⁱ⁾)² 里的 ½ 起什么作用？", "o": ["纯粹为了求导时和平方的 2 相消，不影响最优解", "为了让 J 的值不超过 1", "为了取平均值", "为了保证 J 是凸函数"], "a": 0, "w": "取平均要除以 n 不是 2。任何正常数乘上去 argmin 都不变，所以 ½ 只是让 ∂J/∂θⱼ 的式子干净。"}, {"t": "梯度下降的更新式后面括号里写着「simultaneously performed for all values of j」。忽略这一点会怎样？", "o": ["先更新的 θ₀ 会污染后面 θ₁ 的梯度，算出来的就不是梯度下降了", "会导致 J 变成非凸", "只是慢一点，结果一样", "没有影响，顺序更新反而更快"], "a": 0, "w": "梯度必须在同一组旧参数上算完，再整体替换。用新 θ₀ 去算 θ₁ 的偏导，得到的方向不是 ∇J。"}], "5": [{"t": "LMS 规则 θⱼ := θⱼ + α(y−hθ(x))xⱼ 的「更新量正比于误差」这条性质意味着什么？", "o": ["所有样本的更新量相同", "误差大的样本会被丢弃", "学习率会自动随误差调整", "预测几乎正确的样本几乎不改参数，错得远的样本带来大幅修正"], "a": 3, "w": "讲义原话：预测接近真值时「there is little need to change the parameters」，误差大时「a larger change to the parameters will be made」。"}, {"t": "Ng 在课上解释 batch gradient descent 里「batch」的含义是什么？", "o": ["每次随机抽一小批样本", "把整个训练集当成一批来处理，每步都扫完全部样本", "按类别把样本分成几批", "深度学习里的 mini-batch 大小，比如 32"], "a": 1, "w": "Ng 原话是「you think of all 49 examples as one batch of data」。这和深度学习里说的 batch size=32（其实是 mini-batch）是两个概念，极易混淆。"}], "6": [{"t": "为什么线性回归的梯度下降不用担心局部最优？", "o": ["因为学习率足够小", "J 是凸二次函数，只有一个全局最优点", "因为数据做了标准化", "因为用了随机初始化"], "a": 1, "w": "J 是一堆平方项之和，每项都凸，和还是凸。讲义原话：「only one global, and no other local, optima」。⚠️ 注意这是线性回归这个问题的性质，不是梯度下降的性质。"}, {"t": "代价函数的等高线呈<b>细长椭圆</b>，通常说明什么、该怎么办？", "o": ["特征尺度差异大，梯度下降会之字形震荡——应做特征缩放", "学习率太小，应该调大", "数据有离群点，应该删掉", "模型欠拟合，应该加特征"], "a": 0, "w": "细长椭圆意味着不同方向曲率差很多，最陡下降方向会来回横跳。缩放后等高线接近正圆，几步就收敛。这正是本课 M1T2 第 17 页「特征缩放」的理由。"}], "7": [{"t": "关于随机梯度下降（SGD），讲义指出了什么代价？", "o": ["它会陷入局部最优", "它只能用于线性回归", "它需要比批量法更多的内存", "可能永远不真正收敛，参数会在最优点附近持续震荡"], "a": 3, "w": "讲义原话：「it may never converge to the minimum, and the parameters θ will keep oscillating」。讲义同时安慰说最优点附近的值通常够用，脚注还给了治本办法：让 α 慢慢衰减到 0。"}, {"t": "本课 M1T3 说感知机训练时「每个样本用的都是前一个样本刚更新出来的参数」，这个性质叫什么？", "o": ["收敛性（convergence）", "顺序性（sequential）", "批量性（batch）", "并行性（parallel）"], "a": 1, "w": "课件把它列为术语之一，并点名最常见的错误是「算完第 1 个样本的更新后，第 2 个样本还在用旧的 w」。手算题每一步都要把新参数抄下来。"}], "8": [{"t": "讲义引入矩阵导数记号的目的是什么？", "o": ["为了证明 J 是凸的", "为了处理非线性模型", "让正规方程的推导能压缩到几行，避免整页的代数", "因为梯度下降必须用矩阵形式"], "a": 2, "w": "讲义原话：避免「reams of algebra and pages full of matrices of derivatives」。Ng 说这套记号能让正规方程「in roughly four lines of linear algebra」推完。"}], "9": [{"t": "正规方程 θ = (XᵀX)⁻¹Xᵀy⃗ 成立的前提是什么？", "o": ["样本数必须大于 1000", "误差必须服从高斯分布", "XᵀX 可逆", "特征必须标准化"], "a": 2, "w": "讲义脚注明确说了这个隐含假设，并给了两种失效情形：线性无关的样本数少于特征数，或特征之间线性相关（多重共线性）。高斯假设是第 10 页才引入的，和正规方程本身无关。"}, {"t": "比较正规方程和梯度下降，下面哪一条是对的？", "o": ["梯度下降不需要调参，正规方程需要", "正规方程永远比梯度下降快", "正规方程不需要学习率也不需要特征缩放，但复杂度 O(d³)，d 很大时做不动", "两者都只适用于线性回归"], "a": 2, "w": "正规方程一步出解，省掉了 α 和缩放，但要求一个 (d+1)×(d+1) 矩阵的逆。而且它是线性回归独有的福利——逻辑回归就没有闭式解。"}, {"t": "用线性回归拟合 Y = ax² + bx + c。关于「这还算不算线性回归」，正确的说法是？", "o": ["不算，必须先把 x² 删掉", "算。「线性」指对参数 a、b、c 线性，不是对 x 线性", "不算，因为有 x² 项", "要看数据分布才能确定"], "a": 1, "w": "这正是本课 M1T2 Tutorial Q2 的题设：设计矩阵第 i 行写成 [xᵢ², xᵢ, 1]，模型对 [a,b,c] 仍是线性的，所以最小二乘照常适用。"}], "11": [{"t": "从「ε ~ IID N(0,σ²)」推到「最大似然 = 最小二乘」，最关键的一步是什么？", "o": ["因为样本数 n 足够大", "因为高斯分布的均值是 0", "因为 log 函数是单调递减的", "对数似然里 SSE 前的系数 −1/(2σ²) 是负的，所以最大化 ℓ 等于最小化 SSE"], "a": 3, "w": "本课 T2 Tutorial 答案把这一步标成「拿分的关键段落」，三句话论证：常数项与优化无关 / 系数为负 / 所以 argmax ℓ = argmin SSE。σ² > 0 这个条件是必需的，否则符号翻转。"}, {"t": "讲义特意写 p(y⁽ⁱ⁾|x⁽ⁱ⁾<b>;</b>θ) 而不是 p(y⁽ⁱ⁾|x⁽ⁱ⁾<b>,</b>θ)，原因是？", "o": ["因为 θ 是向量而 x 是标量", "θ 不是随机变量，不能被「条件」——分号表示它只是参数", "分号是手写体的习惯，没有含义", "为了和贝叶斯方法保持一致"], "a": 1, "w": "讲义原话：「we should not condition on θ, since θ is not a random variable」。这是频率派的立场；贝叶斯派把 θ 看成随机变量，才会写逗号。"}, {"t": "如果误差分布是重尾的（偶尔出现极端离群点），按这一节的逻辑应该怎么办？", "o": ["删掉所有特征重新选", "增大学习率", "换损失函数，比如 MAE 或 Huber——平方损失会被离群点牵着走", "改用正规方程求解"], "a": 2, "w": "平方损失是「高斯噪声」这个假设的产物。假设变了，损失就该跟着变。本课 T2 Tutorial 答案的 Interpretation 段落专门写了这一条，还提到异方差时该用加权最小二乘。"}], "13": [{"t": "局部加权线性回归（LWR）和普通线性回归的核心区别是什么？", "o": ["给每个样本加一个依赖于查询点的权重 w⁽ⁱ⁾，所以换一个查询点就要重新拟合", "它只能用于分类问题", "它用的是绝对值损失而不是平方损失", "它不需要训练数据"], "a": 0, "w": "式子只多了一个 w⁽ⁱ⁾，但 w⁽ⁱ⁾ = exp(−(x⁽ⁱ⁾−x)²/(2τ²)) 依赖于要预测的那个 x。离查询点近的样本权重接近 1，远的接近 0。"}, {"t": "讲义特别澄清：LWR 的权重公式虽然长得像高斯密度，但——", "o": ["它其实就是高斯分布的概率密度", "它等价于对数据做了高斯模糊", "w⁽ⁱ⁾ 和高斯分布没有直接关系，也不是随机变量", "它要求数据服从高斯分布"], "a": 2, "w": "讲义原话：「the w⁽ⁱ⁾'s do not directly have anything to do with Gaussians, and in particular the w⁽ⁱ⁾ are not random variables」。只是形状像，而且它不积分到 1。"}], "14": [{"t": "按讲义的判据，什么算「非参数」学习算法？", "o": ["不需要训练就能预测", "模型完全没有参数", "参数个数是无穷多", "为了表示 h 需要保存的东西随训练集大小线性增长"], "a": 3, "w": "LWR 每次预测也会算出一个 θ，它有参数。关键是预测时必须留着整个训练集。Ng 的说法更好记：参数化算法拟合完「可以把训练集从内存里删掉」。"}, {"t": "把这个判据用到 M2 的三个算法上，哪一个是非参数的？", "o": ["DBSCAN——没有「模型」可存，判定新点必须拿原始数据重做邻域查询", "三个都是参数化的", "k-means——只需存 k 个质心", "GMM——只需存 π、μ、Σ"], "a": 0, "w": "k-means 存 k 个质心、GMM 存一组分布参数，两者都是参数化的（可以丢掉原数据）。DBSCAN 没有参数化的模型，这正是它「不能直接 predict 新样本」这个常考弱点的根源。"}], "15": [{"t": "sigmoid 的导数恒等式是？", "o": ["g′(z) = g(z)(1 − g(z))", "g′(z) = g(z)·z", "g′(z) = 1 − g(z)", "g′(z) = g(z)²"], "a": 0, "w": "推导三步，精髓在第三步：把 e^{−z}/(1+e^{−z}) 拆成 1 − 1/(1+e^{−z})。这条恒等式是下一页逻辑回归求导能化简的全部原因。"}, {"t": "由 g′ = g(1−g) 可知，|z| 很大时 g′ 接近 0。这个事实在 M3 里对应什么问题？", "o": ["类别不平衡", "学习率太大导致发散", "过拟合", "梯度消失——堆多层 sigmoid 后前几层几乎学不动，所以改用 ReLU"], "a": 3, "w": "z=±6 时 g′≈0.0025，反向传播每经过一层 sigmoid 梯度就缩水一次。ReLU 在正半轴导数恒为 1，不衰减，这是它取代 sigmoid 作为隐藏层激活的直接原因。"}, {"t": "逻辑回归用 0.5 作阈值时，决策边界是什么？", "o": ["取决于数据分布", "θᵀx = 0 这个超平面（因为 g(0)=0.5 且 g 单调）", "θᵀx = 1", "θᵀx = 0.5"], "a": 1, "w": "p ≥ 0.5 ⟺ g(z) ≥ 0.5 ⟺ z ≥ 0。本课 M1T3 第 6–7 页反复用这个等价：z=0 就是决策边界本身，落在上面的点最没把握。"}], "16": [{"t": "p(y|x;θ) = h^y(1−h)^{1−y} 这个写法的作用是？", "o": ["这是伯努利分布的近似", "用指数位上的 y 当开关，把 y=1 和 y=0 两种情况合并成一个式子", "为了让概率归一化", "表示 h 的 y 次方乘以一个修正项"], "a": 1, "w": "y=1 时是 h¹(1−h)⁰=h，y=0 时是 h⁰(1−h)¹=1−h。第 25 页把这个技巧推广成指示函数 1{y=i}，用来处理 k 类。"}, {"t": "逻辑回归的对数似然 ℓ(θ) 和本课说的二元交叉熵（BCE）是什么关系？", "o": ["BCE 是 ℓ 的平方", "BCE 只用于多分类", "两者没有关系", "BCE = −ℓ/n；最大化对数似然就是最小化交叉熵"], "a": 3, "w": "同一个式子，一个加负号取平均。写 BCE 时三个常见错：忘负号、log 底不是自然对数、除不除 n 和题面不一致。"}], "17": [{"t": "逻辑回归的随机梯度上升规则 θⱼ := θⱼ + α(y−hθ(x))xⱼ 和线性回归的 LMS 规则形式完全相同。讲义怎么评价这件事？", "o": ["说明两者可以互换使用", "看起来一样但不是同一个算法，因为 hθ(x) 的定义不同；深层原因留到 GLM 回答", "这是巧合，没有深层原因", "说明逻辑回归其实就是线性回归"], "a": 1, "w": "讲义原话：「it looks identical; but this is not the same algorithm, because hθ(x) is now defined as a non-linear function of θᵀx」，并明确说答案在 GLM 那一节。"}, {"t": "逻辑回归为什么用「梯度<b>上升</b>」而不是下降？", "o": ["因为 sigmoid 是单调递增的", "因为 ℓ(θ) 是凸的", "因为标签是 0/1", "因为目标是最大化对数似然；若改成最小化交叉熵就写成下降，两者等价"], "a": 3, "w": "讲义点名「Note the positive rather than negative sign ... since we're maximizing」。本课课件用的是最小化 BCE 的写法，展开后符号一致。答题时按题面用的是哪种说法来定符号，并把这一步写出来。"}], "18": [{"t": "讲义对感知机最核心的判断是什么？", "o": ["它难以被赋予有意义的概率解释，也推不出是最大似然估计", "它比逻辑回归更准确", "它总能找到最大间隔的分隔面", "它是逻辑回归的特例"], "a": 0, "w": "阶跃函数的输出只有 0 和 1，没有「有多确定」这个量。Ng 的说法是「有几何直觉，没有概率解释」。找最大间隔的是 SVM，不是感知机。"}, {"t": "⚠️ 本课规定感知机在 y·s = 0（样本正好落在边界上）时要更新，而 CS229 讲义的 0/1 版本在这种情况下（y=正类时）不更新。做手算题应该按哪个来？", "o": ["按本课的 y·s ≤ 0（含等号）来", "两种都可以，改卷都给分", "跳过这个样本", "按讲义的来，CS229 更权威"], "a": 0, "w": "课件有明文警告：「本课程的更新触发条件是 y·s ≤ 0。别的教材可能写 < 0，做题按 ≤ 来」。CS229 讲义就是那个「别的教材」。"}, {"t": "本课感知机的损失 L = max(0, −y·s) 里，max(0,·) 起什么作用？", "o": ["让损失可导", "把损失归一化到 [0,1]", "让分对的样本零贡献——否则模型会一味把已分对的点推得更远，而不去修正错的", "防止梯度爆炸"], "a": 2, "w": "没有 max，分得特别对的点会给出很大的负损失。有了它，感知机只关心犯错的样本。⚠️ 课件还点了个矛盾：y·s=0 时损失是 0，但更新规则仍要更新，做题以更新规则为准。"}], "19": [{"t": "牛顿法相对梯度下降的主要代价是什么？", "o": ["需要更多训练样本", "需要仔细调学习率", "可能陷入局部最优", "每轮要求一个 (d+1)×(d+1) Hessian 的逆，复杂度 O(d³)"], "a": 3, "w": "牛顿法不需要学习率，迭代次数也少得多（约 10 次）。但 d³ 这个指数让它在高维上出局——Ng 给的门槛是：一万个参数就改用梯度下降。"}, {"t": "讲义留了道思考题：要用牛顿法求<b>极小</b>而不是极大，更新式要怎么改？", "o": ["把 Hessian 换成它的转置", "要加一个负的学习率", "完全不用改——它找的是 ℓ′=0 的点，本来就分不清极大极小", "把减号改成加号"], "a": 2, "w": "这既是答案也是牛顿法的一个真实缺陷：它收敛到驻点，是极大、极小还是鞍点要看 Hessian 的正负定性。"}], "20": [{"t": "把伯努利分布凑成指数族形式后，反解 φ 得到什么？", "o": ["φ = η", "φ = 1/(1+e^{−η})，正是 sigmoid 函数", "φ = e^η", "φ = log(1+e^η)"], "a": 1, "w": "η = log(φ/(1−φ)) 反解即得。讲义在这里用了个感叹号：「This is the familiar sigmoid function!」——第 15 页埋的伏笔在这里兑现。"}, {"t": "讲义在把高斯写成指数族时设 σ² = 1，理由是？", "o": ["因为 σ² 无法估计", "第 12 页已证 σ² 不影响最终的 θ，设成 1 只是为了推导简短", "因为数据已经标准化了", "因为高斯分布的方差必须是 1"], "a": 1, "w": "脚注给了完整版：σ² 留着的话 η 会变成二维向量，需要带 dispersion parameter τ 的更一般定义。这是「简化有代价、代价写在脚注里」的典型。"}], "22": [{"t": "构造 GLM 的三条假设里，讲义自己承认哪一条「更像设计选择而非假设」？", "o": ["第二条：预测 E[T(y)|x]", "第一条：y|x 服从某个指数族分布", "第三条：η = θᵀx", "三条都是严格的假设"], "a": 2, "w": "讲义原话：「might be better thought of as a design choice in our recipe」。Ng 在课上也用了同样的措辞「assumptions or design choices」。GLM 里的 Linear 就指这一条。"}, {"t": "Ng 在课上说，换一个分布做 GLM 时，学习的更新规则会怎样？", "o": ["完全不变——不管选哪个分布，更新规则都一样，可以直接拿来用", "更新规则会变，但形式相似", "每换一个分布都要重新推一遍梯度", "只有指数族内部的分布更新规则相同"], "a": 0, "w": "Ng 原话：「no matter which GLM you're doing, no matter which choice of distribution that you make, the learning update rule [is the same] ... You can go straight to the update rule」。这正是讲义第 17 页「是巧合吗」的答案。"}, {"t": "要为「预测每小时到店顾客数」建模，按 GLM 配方该选哪个分布？", "o": ["高斯分布", "泊松分布——计数型数据的标准选择", "多项分布", "伯努利分布"], "a": 1, "w": "这正是讲义第 22 页的开场例子。Ng 说这个选择通常「pretty obvious」：看 y 的类型就定了——连续实数用高斯，0/1 用伯努利，计数用泊松，非负连续（等待时间）用 gamma。"}], "24": [{"t": "「逻辑回归为什么用 sigmoid」最深的那个答案是什么？", "o": ["因为历史上第一个用的就是它", "因为它能把实数压到 (0,1)", "因为它的导数好算", "它是伯努利分布的正则响应函数，是 GLM 框架推出来的后果"], "a": 3, "w": "前两个都对但不构成理由——任何 S 形函数都能压到 (0,1)。讲义用的词是 consequence。不过讲义也只说这是「one answer」，最大熵是另一条同样正当的路径。"}, {"t": "关于 canonical response function 和 canonical link function，哪一句对？", "o": ["只有高斯分布才有这两个函数", "响应函数是期望 → η", "响应函数是 η → 期望，连接函数是它的逆；而且很多教科书的叫法和 CS229 相反", "两个是同一个东西的不同叫法"], "a": 2, "w": "讲义脚注专门提醒：「Many texts use g to denote the link function, and g⁻¹ to denote the response function」。CS229 沿用早期机器学习文献的约定。看别的资料时先确认方向。"}], "25": [{"t": "为什么 k 类的多项分布只用 k−1 个参数 φ₁…φ_{k−1}？", "o": ["为了减少计算量", "因为 T(y) 只有 k−1 维", "因为 Σφᵢ = 1，知道前 k−1 个最后一个就定死了", "因为第 k 类通常样本最少"], "a": 2, "w": "讲义明说 φ_k「is not a parameter」，它被前面那些完全决定。同样的「少一个」现象也出现在 η（约定 η_k=0）和 θ（约定 θ_k=0）上。"}], "27": [{"t": "softmax 把得分变成概率的三步是什么？", "o": ["取绝对值 → 排序 → 取最大", "算线性得分 → 取对数 → 减去最大值", "标准化 → 过 sigmoid → 归一化", "算线性得分 → 取指数 → 除以总和归一化"], "a": 3, "w": "φᵢ = e^{θᵢᵀx}/Σⱼe^{θⱼᵀx}。取指数把实数变正数并放大差距（得分差 1.0 对应概率差约 2.7 倍），除以总和保证加起来是 1。"}, {"t": "softmax 回归在 k = 2 时会退化成什么？", "o": ["逻辑回归——p(y=1|x) 化简后正是 1/(1+e^{−θ₁ᵀx})", "感知机", "不会退化，两者无关", "线性回归"], "a": 0, "w": "k=2 时只有 θ₁（因为约定 θ₂=0），p(y=1|x) = e^{θ₁ᵀx}/(e^{θ₁ᵀx}+e⁰) = 1/(1+e^{−θ₁ᵀx})。这个验算证明了「softmax 是逻辑回归的推广」名副其实。"}, {"t": "⚠️ Ng 在 L4 讲 softmax 时，和讲义的路线有什么不同？", "o": ["课堂讲得更详细", "完全一样", "课堂走交叉熵路线，讲义走 GLM 路线——这两页在视频里找不到对应", "课堂没有讲 softmax"], "a": 2, "w": "Ng 原话：「in the lecture notes, softmax regression is explained as yet another member of the GLM family. However, in today's lecture we'll be taking a non-GLM approach」。两条路线互补：GLM 说明形式从哪来，交叉熵说明损失从哪来。"}]};

var N = [{"r": [1, 1], "star": 2, "t": "监督学习开篇：47 套波特兰房子", "one": "整份讲义从一张只有两列的小表开始，但这张表定义了「监督」二字。", "quote": "<em>Suppose we have a dataset giving the living areas and prices of 47 houses from Portland, Oregon.</em>", "pts": ["<b>「监督」的定义就藏在这张表里</b>：每一行都是<b>一对</b>——左边是面积（输入），右边是价格（<b>已知的正确答案</b>）。有这个已知答案，才叫监督学习；M2 那三个算法（PCA / 聚类 / GMM）之所以叫<b>无</b>监督，就是因为右边那一列不存在。", "<b>只有 47 个样本</b>。这个数字小得有点意外，但讲义全篇的计算、Ng 课堂上手算的例子，都建立在这 47 行上。⭐ 它顺带说明一件事：<b>线性回归这类参数化模型在小样本上照样能用</b>，因为参数个数不随样本数增长。", "<b>散点图的纵轴是「price (in $1000)」</b>，横轴是平方英尺。图上点明显有上升趋势，但<b>没有任何一条直线能穿过全部点</b>——这就是后面「代价函数」存在的全部理由。", "<b>封面那行小字</b>：<em>slightly updated by TM on June 28, 2019</em>。TM 是助教 Tengyu Ma。⚠️ 这次更新改了<b>记号</b>（把样本数从 m 改成 n、把维数从 n 改成 d），网上找到的老版讲义记号是反的，混着看会乱。"], "tbl": [{"cap": "讲义开篇这张表的三个角色", "head": ["表里的东西", "讲义的叫法", "后面用的符号"], "rows": [["Living area 这一列", "input / <b>feature</b>（特征）", "x⁽ⁱ⁾"], ["Price 这一列", "output / <b>target</b>（目标）", "y⁽ⁱ⁾"], ["一整行", "<b>training example</b>（训练样本）", "(x⁽ⁱ⁾, y⁽ⁱ⁾)"], ["整张表", "<b>training set</b>（训练集）", "{(x⁽ⁱ⁾,y⁽ⁱ⁾); i=1..n}"]]}], "say": "⭐ 这一页值得停一下的，是<b>它没有说的东西</b>：讲义<b>没有</b>先讲「什么是机器学习」「有哪些流派」，<b>直接甩出一张数据表</b>。这是 CS229 的风格，也是它和本课课件最大的差别——本课 M1T2 第 4–5 页会先讲「为什么要预测一个数字」「回归在 ML 版图里的位置」，CS229 把这些全省了。<b>两边互补：课件给你地图，讲义给你算法。</b>考试考的是地图上的位置＋算法的细节，两样都得有。", "ng": "Ng 在 L2 开场 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=3s\" target=\"_blank\">00:03</a> 就把这节课的路线图说清楚了：<b>线性回归 → 批量/随机梯度下降 → 正规方程</b>，一节课讲完。⭐ 他特意强调这是「<em>the first in-depth discussion of a learning algorithm</em>」——L1 只是课程介绍，<b>真正的内容从 L2 开始</b>。所以想补 M1 的基础，L2/L3/L4 这三讲是最该看的，L1 可以跳。<span class=\"src\">CS229/transcripts/L2.txt · 本地已下载</span>", "exam": "本课 M1T2 用的也是房价数据（house size vs. price，10 个点，Size 1.0–3.5 千平方英尺、Price 145–325 千美元），但<b>比讲义的 47 套更小，是为了能手算</b>。考试里出现的房价手算题用的是课件那组数，<b>不是讲义这 47 套</b>，别记混。", "tip": {"t": "为什么叫 regression", "v": "和「回归到某处」没关系。本课课件专门提了：<b>来自 Galton 19 世纪研究身高的工作</b>——高个父母的孩子身高会「回归」到平均值。<b>纯历史遗留</b>，与方法本身无关，讲义里反而没提这一条。"}}, {"r": [2, 2], "star": 3, "t": "★ 记号体系：这一页跳过去后面全看不懂", "one": "x/y/n/d/h 五个符号在这一页定死，而且和本课课件对不上。", "quote": "<em>Note that the superscript “(i)” in the notation is simply an index into the training set, and has nothing to do with exponentiation.</em>", "eq": "训练集：{ (x⁽ⁱ⁾, y⁽ⁱ⁾) ; i = 1, …, n }\n目标：学一个 h : X ↦ Y，使 h(x) 是 y 的好预测\nX = Y = R（房价这个例子里）", "pts": ["⭐ <b>上标 (i) 是「第 i 个样本」，不是指数</b>。讲义专门用一整句话强调这件事，因为 x⁽²⁾ 和 x² 长得太像。<b>下标</b>才是「第几个特征」：x⁽ⁱ⁾₂ 是<b>第 i 套房子的第 2 个特征</b>。", "<b>h 叫 hypothesis（假设函数）</b>。讲义诚实地说了原因：<em>for historical reasons</em>——<b>纯属历史叫法</b>，它既不是统计学里的「假设检验」，也不是什么待验证的猜想，就是「模型」的意思。", "<b>回归 vs 分类的判据是「y 的取值形式」</b>：y 连续（房价）叫 regression；y 只取少数几个离散值（是房子还是公寓）叫 classification。⚠️ 判据<b>只看输出</b>，和输入是什么、模型是什么都无关。", "<b>那张流程图</b>（Training set → Learning algorithm → h → predicted y）是全课的骨架：<b>学习算法吐出来的不是预测，是 h；h 才吐预测。</b>这个两段式区分在后面讲参数/非参数时会变得很关键。"], "tbl": [{"cap": "⚠️ 记号对照：讲义 vs 本课课件（最容易翻车的地方）", "head": ["含义", "CS229 讲义（2019 版）", "<b>本课课件</b>"], "rows": [["样本个数", "<b>n</b>", "<b>m</b>（T3）／<b>N</b>（T2）"], ["特征维数", "<b>d</b>", "<b>d</b>（T3 的 z 式里用 w₁..w_d）"], ["参数", "θ（含截距 θ₀）", "<b>w 和 b 分开写</b>"], ["模型", "hθ(x) = θᵀx", "<b>z = wᵀx + b</b>"], ["正类标签", "y ∈ {0,1}", "感知机 <b>−1/+1</b>，逻辑回归 0/1"]]}], "say": "⭐ 这张对照表是本份精读里<b>最该先看一眼的东西</b>。讲义把截距吸收进 θ₀（下一页的 x₀=1 技巧），本课课件<b>始终把 b 单独写出来</b>。两种写法各有好处：θᵀx 写推导短，w 和 b 分开写<b>几何意义清楚</b>（课件原话「w 转，b 移」——改 w 边界旋转，改 b 边界平移）。<b>考试按课件的写法答</b>，看讲义时在心里做一次翻译就行。另一处坑：讲义 2019 版用 n 当样本数，<b>老版（m 当样本数）网上到处都是</b>，看到 m 先确认是哪一版。", "ng": "Ng 在 L2 里口头用的是<b>老记号</b>（m 个样本、n 维特征），和这份 2019 版讲义<b>正好相反</b>。⚠️ 所以看视频配讲义时要当场换一次。这不是我的推断——讲义封面就写着「slightly updated by TM on June 28, 2019」，而视频是 2018 年秋拍的。<span class=\"src\">CS229/transcripts/L2.txt · 本地已下载</span>", "exam": "本课 M1T3 第 5 页把记号单独列了一页，并标了「<b>m 是训练样本的数量（不是维度！）</b>」。<b>大题里写错记号会连带扣掉后面的过程分</b>，因为改卷看的是推导链条是否自洽。保险做法：<b>答题前先用一行把记号声明出来</b>（「设 N 为样本数，d 为特征数」），这一行本身也可能算过程分。"}, {"r": [3, 3], "star": 2, "t": "多特征与截距技巧：x₀ = 1", "one": "加一列恒为 1 的假特征，就能把 θ₀ 吸收进点积，整篇推导短一半。", "quote": "<em>To simplify our notation, we also introduce the convention of letting x₀ = 1 (this is the intercept term).</em>", "eq": "hθ(x) = θ₀ + θ₁x₁ + θ₂x₂\n约定 x₀ = 1 之后：\nh(x) = Σ_{i=0}^{d} θᵢxᵢ = θᵀx\n（d = 输入变量个数，不含 x₀）", "pts": ["<b>数据集扩成三列</b>：面积、卧室数、价格。于是 x 变成 R² 里的向量，x⁽ⁱ⁾₁ 是第 i 套房的面积，x⁽ⁱ⁾₂ 是卧室数。", "⭐ <b>x₀ = 1 这个技巧</b>：θ₀ 本来是个孤零零的加项，没法塞进 Σθᵢxᵢ。补一列恒等于 1 的「特征」之后，θ₀·x₀ = θ₀·1 = θ₀，<b>截距就变成了普通权重</b>，整个模型写成一个点积 θᵀx。", "<b>d 的定义要看清</b>：讲义说 d 是 <em>the number of input variables (<b>not counting</b> x₀)</em>。所以 θ 实际上有 <b>d+1</b> 个分量。后面正规方程里写「n-by-d+1 设计矩阵」就是这个缘故。", "<b>讲义在这里留了个口子</b>：<em>it will be up to you to decide what features to choose</em>——还举例说你可以加「有没有壁炉」「几个卫生间」。<b>特征工程是人的活，不是算法的活</b>，这一点贯穿全课。"], "tbl": [{"cap": "截距的两种写法 · 换算关系", "head": ["写法", "模型", "参数个数", "谁在用"], "rows": [["<b>吸收式</b>", "h(x) = θᵀx，x₀≡1", "d+1（含 θ₀）", "CS229 讲义全篇"], ["<b>分离式</b>", "z = wᵀx + b", "d 个 w ＋ 1 个 b", "<b>本课课件全篇</b>"]]}], "say": "⭐ 这个技巧有个<b>实际后果，而且是考点级别的</b>：一旦把 b 当成「x₀=1 那一维的权重」，<b>正则化时就要注意别把它一起罚了</b>。因为 b 控制的是边界的<b>位置</b>，把它往 0 拉没有「让模型简单一点」的含义，反而会强迫边界穿过原点附近。sklearn 的 <code>LogisticRegression</code> 默认<b>不</b>正则化截距，就是这个道理。讲义这里没说，但它是从这一页的约定直接推出来的。", "ng": "Ng 在 L2 讲模型设定时就用了 x₀=1 的约定，没有特别停下来解释——⭐ <b>这是 CS229 默认你有线性代数底子的地方之一</b>。如果觉得点积这一步跳得快，先看 <code>CS229/notes/cs229-linalg.pdf</code>（线性代数复习，本地已有），比硬啃讲义快。<span class=\"src\">CS229/transcripts/L2.txt · 本地已下载</span>", "exam": "本课 M1T2 第 15–16 页「从一个特征到多个 → 正规方程」就在做同一件事，而且 <b>Tutorial Q2 直接考</b>：给定 Y = ax² + bx + c，要你写出<b>设计矩阵 X 的第 i 行为 [xᵢ², xᵢ, 1]</b>——<b>最后那个 1 就是这一页的 x₀</b>。记住「<b>每个系数一列、常数项那一列全是 1</b>」，这题就不会错。"}, {"r": [4, 4], "star": 3, "t": "★ 代价函数 J(θ) 与梯度下降的第一步推导", "one": "½ 不是为了平均，是为了求导时把 2 约掉；偏导推导只有四行。", "quote": "<em>J(θ) = ½ Σᵢ (hθ(x⁽ⁱ⁾) − y⁽ⁱ⁾)²</em> … <em>θⱼ := θⱼ − α ∂J(θ)/∂θⱼ.  (This update is simultaneously performed for all values of j = 0, …, d.)</em>", "eq": "∂J/∂θⱼ = ∂/∂θⱼ · ½(hθ(x) − y)²\n       = 2 · ½ (hθ(x) − y) · ∂/∂θⱼ (hθ(x) − y)\n       = (hθ(x) − y) · ∂/∂θⱼ ( Σᵢ θᵢxᵢ − y )\n       = ( hθ(x) − y ) · xⱼ", "pts": ["⭐ <b>那个 ½ 的唯一作用是「求导时和平方的 2 约掉」</b>。它不是在取平均（取平均要除以 n），也不影响最优解——<b>任何正常数乘上去，argmin 都不变</b>。这是最常被问「为什么是 ½」的地方。", "<b>梯度下降的一句话直觉</b>：讲义说它 <em>repeatedly takes a step in the direction of steepest decrease of J</em>——<b>沿最陡下降方向走一小步</b>。α 叫 <b>learning rate</b>（学习率），控制步长。", "⚠️ <b>括号里那句「simultaneously」是实现上的真坑</b>：所有 θⱼ 必须<b>用同一组旧值算完梯度再一起更新</b>。先更新 θ₀ 再拿新 θ₀ 去算 θ₁ 的梯度，<b>算出来的就不是梯度下降了</b>。", "<b>推导为什么只对单个样本做</b>：讲义说「<em>let's first work it out for the case of if we have only one training example</em>」——<b>因为 J 是求和，求导可以逐项来，最后再把 Σ 加回去</b>。这是全篇反复用的套路。"], "tbl": [{"cap": "四行推导，每一行用的是什么", "head": ["步", "用到的规则", "结果"], "rows": [["①", "链式法则（外层平方）", "2·½(h−y)·∂(h−y)/∂θⱼ"], ["②", "常数 2 与 ½ 相消", "(h−y)·∂(h−y)/∂θⱼ"], ["③", "代入 h = Σθᵢxᵢ，<b>y 与 θ 无关导数为 0</b>", "(h−y)·∂(Σθᵢxᵢ)/∂θⱼ"], ["④", "Σ 里只有 j 那一项含 θⱼ", "<b>(h−y)·xⱼ</b>"]]}], "say": "⭐ 第 ④ 步是最值得记的：<b>Σᵢθᵢxᵢ 对 θⱼ 求偏导，结果就是 xⱼ</b>——因为其它项全是与 θⱼ 无关的常数。这一步在后面<b>逻辑回归、感知机、softmax 的推导里会一字不差地再用一遍</b>，所以它不是一次性的技巧。另外注意：<b>这四行完全没用到「线性」以外的任何假设</b>，也没用到高斯噪声——概率解释是第 10 页才补上的<b>事后正当化</b>，不是前提。", "ng": "Ng 在 L2 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=1448s\" target=\"_blank\">24:08</a> 引入 α「<em>which is called the learning rate</em>」，接着 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=1513s\" target=\"_blank\">25:13</a> 就被学生问「怎么确定学习率」。⭐ 他的回答很实在（<a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=2183s\" target=\"_blank\">36:23</a>）：<b>「试几个值，看哪个最有效」</b>——<em>usually you try a few values and see what value of the learning rate allows you to most efficiently…</em>。<b>没有公式，就是试</b>。另外他补了一条经验：按 <b>2 倍或 3 倍</b>的比例往上下试（0.01, 0.03, 0.1 …），别线性地试。<span class=\"src\">CS229/transcripts/L2.txt · 本地已下载</span>", "exam": "本课 M1T2 第 10 页代价函数、第 13 页梯度下降算法、第 14 页学习率各占一页，<b>和讲义这一页一一对应</b>。手算题常见形式：给 w、b、学习率和两三个样本，要你<b>算一步更新</b>。⚠️ 翻车点：课件的代价函数带不带 ½ / 带不带 1/N <b>要照着题面抄</b>——系数不同，算出来的数就不同，而改卷按题面的定义算。", "tip": {"t": "α 太大会怎样", "v": "不是「慢一点」而是<b>发散</b>：J 一步比一步大，参数飞掉变成 NaN。讲义第 6 页说梯度下降「<em>always converges (assuming the learning rate α is not too large)</em>」，<b>括号里这句才是重点</b>。实践中判断方法：画 J 对迭代次数的曲线，<b>只要它往上走就是 α 太大</b>。"}}, {"r": [5, 5], "star": 3, "t": "★ LMS 更新规则与批量梯度下降", "one": "更新量正比于误差——预测得准就几乎不动，错得离谱就大改。", "quote": "<em>the magnitude of the update is proportional to the error term (y⁽ⁱ⁾ − hθ(x⁽ⁱ⁾))</em>", "eq": "单样本（LMS / Widrow-Hoff 规则）：\nθⱼ := θⱼ + α ( y⁽ⁱ⁾ − hθ(x⁽ⁱ⁾) ) x⁽ⁱ⁾ⱼ\n\n批量梯度下降：\nRepeat until convergence {\n  θ := θ + α Σ_{i=1}^{n} ( y⁽ⁱ⁾ − hθ(x⁽ⁱ⁾) ) x⁽ⁱ⁾\n}", "pts": ["⭐ <b>符号从 − 变成 +，因为误差项掉了个个儿</b>：上一页推出的梯度是 (h−y)x，更新是 θ := θ − α(h−y)x。把负号吃进括号，就成了 θ := θ + α(<b>y−h</b>)x。<b>两个式子完全等价</b>，看到哪种都别慌，先确认括号里是 y−h 还是 h−y。", "<b>LMS = least mean squares</b>，也叫 <b>Widrow-Hoff 学习规则</b>。⚠️ 这两个名字讲义里有，<b>Ng 在课堂上没念过</b>（字幕里搜不到），所以只在讲义/习题里见得到。", "<b>「更新量正比于误差」这条性质的两面</b>：预测几乎对 → <em>little need to change the parameters</em>；预测错得远 → <b>大幅修正</b>。这让算法天然地「哪里错得多就先修哪里」。", "<b>batch gradient descent 的定义</b>：<em>looks at every example in the entire training set on every step</em>——<b>每走一步都要扫全部样本</b>。n 很大时这是致命缺点，下一页的随机梯度下降就是来解决它的。"], "tbl": [{"cap": "同一条式子的三种等价写法（考试里三种都可能出现）", "head": ["写法", "式子", "注意"], "rows": [["减误差式", "θⱼ := θⱼ − α(hθ(x)−y)xⱼ", "直接来自 ∂J/∂θⱼ"], ["加误差式", "θⱼ := θⱼ + α(y−hθ(x))xⱼ", "<b>讲义主用</b>，符号已翻转"], ["向量式", "θ := θ + α Σᵢ(y⁽ⁱ⁾−hθ(x⁽ⁱ⁾))x⁽ⁱ⁾", "x⁽ⁱ⁾ 是<b>列向量</b>"]]}], "say": "⭐ 有一个脚注值得单独看：讲义专门解释了 <b>「:=」和「=」的区别</b>——<em>a := b</em> 是<b>赋值</b>（把 a 覆盖成 b），<em>a = b</em> 是<b>陈述一个事实</b>（断言 a 等于 b）。看起来是小事，但在梯度下降这种「同一个符号前后值不同」的场合，<b>混用会让推导读不通</b>。本课课件用的是 <b>w ← w + …</b> 的箭头写法，含义和 := 一样。", "ng": "Ng 在 L2 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=2465s\" target=\"_blank\">41:05</a> 给 batch 这个名字做了个解释，和大多数人以为的<b>不一样</b>：<em>you think of all 49 examples as one batch of data</em>——<b>「batch」指的是「把整个训练集当成一批来处理」，不是深度学习里的「mini-batch 大小」</b>。⭐ 这个术语混淆非常常见：深度学习说的 batch size = 32 其实是 <b>mini-batch</b>，和这里的 batch gradient descent 是两个概念。<span class=\"src\">CS229/transcripts/L2.txt · 本地已下载</span>", "exam": "本课 M1T2 的梯度下降手算题就是在用这条式子。⚠️ 两个高频失分点：① <b>把 x⁽ⁱ⁾ⱼ 那个因子忘了</b>——更新 w₁ 要乘 x₁，更新 b（即 w₀）乘的是 <b>1</b>；② <b>batch 和逐样本混着算</b>——题目说「用全部样本做一步」就必须把 Σ 加完再更新一次，不是边加边更新。"}, {"r": [6, 6], "star": 3, "t": "★ 凸性：线性回归没有局部最优的烦恼", "one": "J 是凸二次函数，碗形，只有一个最低点——这是线性回归最大的「福利」。", "quote": "<em>the optimization problem we have posed here for linear regression has only one global, and no other local, optima; thus gradient descent always converges (assuming the learning rate α is not too large) to the global minimum. Indeed, J is a convex quadratic function.</em>", "pts": ["⭐ <b>「梯度下降可能陷进局部最优」这句话对线性回归不成立</b>。讲义先承认一般情况下 <em>gradient descent can be susceptible to local minima</em>，紧接着说<b>这里不会</b>，因为 J 是<b>凸二次函数</b>。", "<b>为什么是凸的</b>：J 是一堆<b>平方项的和</b>，每一项 (θᵀx⁽ⁱ⁾−y⁽ⁱ⁾)² 对 θ 都是凸的，<b>凸函数之和还是凸的</b>。所以不管数据长什么样，J 的形状永远是个碗。", "<b>等高线图怎么来的</b>：把碗横着切，切口投影到平面上就是一圈圈<b>椭圆</b>。图上那条折线是从 (48,30) 出发的梯度下降轨迹，<b>每一步都垂直于当前等高线</b>（最陡下降方向的几何含义）。", "<b>跑出来的结果</b>：只用面积一个特征，θ₀ = 71.27、θ₁ = 0.1345。⭐ θ₁ 的含义是<b>每多一平方英尺，房价多 0.1345 千美元（≈ 134.5 美元）</b>——<b>系数带单位，能解释</b>，这是线性模型相对神经网络最大的优势。"], "tbl": [{"cap": "等高线的形状告诉你什么", "head": ["等高线形状", "含义", "后果"], "rows": [["接近<b>正圆</b>", "各方向曲率相近（特征已缩放）", "梯度下降<b>几步就到</b>"], ["<b>细长椭圆</b>", "某个方向特别陡（特征尺度差很多）", "<b>之字形来回震荡</b>，收敛慢"], ["—", "—", "⇒ 这就是<b>特征缩放</b>存在的理由"]]}], "say": "⭐ 这一页其实回答了一个很值钱的问题：<b>「为什么本课的 M1 全在讲线性模型？」</b> 因为线性模型（线性回归、逻辑回归、SVM）的优化问题<b>全是凸的</b>——有唯一最优解、不依赖初始化、跑两次结果一样。<b>M3 的神经网络一旦来，这三条全没了</b>：非凸、有大量局部最优、初始化不同结果就不同。所以 M3 会花整整一段讲初始化和学习率调参，而 M1 完全不用操心这些。<b>把这条线索记住，M1 和 M3 的分界就清楚了。</b>", "ng": "Ng 在 L2 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=2026s\" target=\"_blank\">33:46</a> 画了那个著名的碗：<em>j of Theta will always look like a big bowl like this</em>，并明确说 <em>j of Theta does not have local optima, or the only local optima is also the global optimum</em>。⭐ 他还顺手解释了等高线怎么来的——<b>「把大碗横着切，看切口的边缘画在哪」</b>，这个说法比讲义的静态图直观得多。<span class=\"src\">CS229/transcripts/L2.txt · 本地已下载</span>", "exam": "本课 M1T2 第 11 页「代价曲面」、第 17 页「特征缩放」讲的就是这件事的两面。⚠️ 常见概念题：<b>「线性回归的梯度下降会陷入局部最优吗？」答：不会，因为平方误差代价函数是凸的。</b> 但要小心反过来问——<b>「所有梯度下降都不会陷入局部最优」是错的</b>，凸性是线性回归这个<b>特定问题</b>的性质，不是梯度下降的性质。"}, {"r": [7, 7], "star": 3, "t": "★ 随机梯度下降：不等扫完就先动", "one": "每看一个样本就更新一次；更快到最优附近，但永远在那儿打转。", "quote": "<em>stochastic gradient descent gets θ “close” to the minimum much faster than batch gradient descent. (Note however that it may never “converge” to the minimum, and the parameters θ will keep oscillating around the minimum of J(θ) …)</em>", "eq": "Loop {\n  for i = 1 to n {\n    θ := θ + α ( y⁽ⁱ⁾ − hθ(x⁽ⁱ⁾) ) x⁽ⁱ⁾\n  }\n}", "pts": ["<b>和批量版的唯一差别</b>：Σ 没了。批量要<b>扫完 n 个样本才更新一次</b>，随机版<b>每个样本更新一次</b>。一轮下来，随机版更新了 n 次，批量版只更新了 1 次。", "⭐ <b>代价是「永远不收敛」</b>：讲义坦白说 θ <em>will keep oscillating around the minimum</em>——参数会在最优点附近<b>一直抖</b>。但紧接着补了一句很实用的话：<em>most of the values near the minimum will be reasonably good approximations</em>，<b>抖在最优点附近，实践中够用了</b>。", "<b>脚注给了治本的办法</b>：<em>by slowly letting the learning rate α decrease to zero as the algorithm runs</em>，就能让参数<b>真正收敛</b>而不只是震荡。这就是<b>学习率衰减（learning rate decay）</b>，深度学习里是标配。", "<b>什么时候用哪个</b>：讲义的结论是 <em>particularly when the training set is large, stochastic gradient descent is often preferred</em>——<b>数据大就用随机版</b>。"], "tbl": [{"cap": "批量 vs 随机 · 四个维度的对比", "head": ["", "批量 Batch GD", "随机 SGD"], "rows": [["一次更新要看几个样本", "<b>全部 n 个</b>", "<b>1 个</b>"], ["路径", "平滑，直奔最低点", "<b>带噪声，曲折</b>"], ["终点", "停在最优点", "<b>在最优点附近震荡</b>"], ["适用", "n 小", "<b>n 很大</b>（讲义：era of big data）"]]}], "say": "⭐ 有一个<b>讲义没明说但很重要</b>的点：SGD 的「噪声」在非凸问题上<b>反而是好事</b>——随机抖动能把参数从浅的局部最优里<b>踢出来</b>。在线性回归这种凸问题上它纯粹是代价（因为本来就只有一个最优点），但到了 M3 的神经网络，<b>这个噪声变成了优点</b>。这解释了为什么深度学习几乎全用 SGD 系的方法，没人用全批量。另外，现在实际用的是<b>两者的折中：mini-batch</b>——每次看 32 或 256 个样本，既保留部分噪声又能用上向量化加速。<b>讲义写于 mini-batch 成为标配之前，所以只给了两个极端。</b>", "ng": "Ng 在 L2 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=2465s\" target=\"_blank\">41:05</a> 先讲批量的缺点：<em>every single step of gradient descent requires that you read through your entire dataset</em>，还举了<b>「假如你有一百万个样本」</b>的例子。接着 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=2762s\" target=\"_blank\">46:02</a> 画了 SGD 的路径：<em>it takes a slightly noisy, slightly random path</em>，并明说 <em>stochastic gradient descent will actually never quite converge</em>。⭐ 课堂比讲义多的一句：<b>「批量法到了全局最优就停下，随机法到了那儿也停不下来」</b>——这个对照句很好记。<span class=\"src\">CS229/transcripts/L2.txt · 本地已下载</span>", "exam": "本课 M1 的感知机训练（M1T3 第 10 页）用的<b>正是随机版的思路</b>：课件原话「<b>每个样本用的都是前一个样本刚更新出来的参数</b>」，术语叫 <b>sequential（顺序性）</b>。⚠️ 高频失分点：<b>算完第 1 个样本的更新后，第 2 个样本还在用旧的 w</b>——这是课件专门点名的最常见错误。<b>做手算题时每一步都把新参数抄下来。</b>", "tip": {"t": "名词辨析", "v": "<b>step（步）</b> = 对一个样本的一次更新机会；<b>epoch（轮）</b> = 把每个样本都处理一遍。本课 M1T3 第 10 页对这两个词有明确定义，<b>题干里出现「3 个 epoch」要换算成 3n 次 step</b>。"}}, {"r": [8, 8], "star": 1, "t": "矩阵导数记号：为了把推导压进四行", "one": "这一页纯粹是工具，目的是避免「reams of algebra」。", "quote": "<em>To enable us to do this without having to write reams of algebra and pages full of matrices of derivatives, let's introduce some notation for doing calculus with matrices.</em>", "eq": "对 f : R^{n×d} ↦ R，定义\n∇_A f(A) 是一个 n×d 矩阵，其 (i,j) 元为 ∂f/∂Aᵢⱼ\n\n例：f(A) = (3/2)A₁₁ + 5A₁₂² + A₂₁A₂₂\n∇_A f(A) = [ 3/2    10A₁₂ ]\n           [ A₂₂    A₂₁   ]", "pts": ["<b>定义只有一句话</b>：对矩阵求导，结果<b>和原矩阵同形</b>，每个位置放的是对那个元素的偏导。没有任何玄机。", "<b>那个 2×2 的例子要会自己算一遍</b>：对 A₁₁ 求导 → 3/2；对 A₁₂ 求导 → 10A₁₂（平方的导数）；对 A₂₁ 求导 → A₂₂；对 A₂₂ 求导 → A₂₁。<b>每一格各求各的，互不相干。</b>", "<b>这一页的 star 给 1 是有理由的</b>：它<b>不是考点</b>，是为了下一页正规方程推导能写得短。⚠️ 但别跳——跳了下一页的 ∇θ 那几步会看不懂为什么能那样化。", "<b>讲义坦白了动机</b>：不引入这套记号，正规方程的推导就要写<b>一堆代数和整页的导数矩阵</b>。有了它，整个推导只要 <b>5 行</b>。"], "say": "⭐ 这页真正要带走的，是<b>两条后面会直接用的恒等式</b>（讲义在第 10 页才点名，但用在第 9 页）：<b>∇ₓ(bᵀx) = b</b> 和 <b>∇ₓ(xᵀAx) = 2Ax（A 对称时）</b>。这两条和一元微积分里的 <b>d(bx)/dx = b</b>、<b>d(ax²)/dx = 2ax</b> <b>长得一模一样</b>——这不是巧合，矩阵求导的记号就是照着一元的样子设计的，<b>这样你能用一元的直觉去读矩阵的式子</b>。讲义把详细证明推给了 <code>cs229-linalg.pdf</code> 的 §4.3（本地已有这份 PDF）。", "ng": "Ng 在 L2 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=3119s\" target=\"_blank\">51:59</a> 介绍这一段时说得很明白：<em>what I wanna do is describe to you a matrix derivative notation that allows you to derive the normal equation in roughly <b>four lines</b> of linear algebra</em>。⭐ 他还承认了这是<b>一次性投资</b>——花十分钟学记号，换来后面所有推导都能写得短。<span class=\"src\">CS229/transcripts/L2.txt · 本地已下载</span>", "exam": "<b>本课不考矩阵求导的记号本身</b>（M1T2 Tutorial Q2 要的是「写出设计矩阵 + 给出 β̂=(XᵀX)⁻¹XᵀY」，不要求从头推）。所以这一页<b>读懂即可，不用背</b>。但下一页的<b>结论</b>要会用。"}, {"r": [9, 10], "star": 3, "t": "★ 正规方程：一步到最优的闭式解", "one": "θ = (XᵀX)⁻¹Xᵀy⃗ —— 不用迭代、不用调学习率，但要求 XᵀX 可逆。", "quote": "<em>XᵀXθ = Xᵀy⃗</em> … <em>Note that in the above step, we are implicitly assuming that XᵀX is an invertible matrix.</em>", "eq": "设计矩阵 X（n×d，含截距列则 n×(d+1)）：每一行是一个 (x⁽ⁱ⁾)ᵀ\n目标向量 y⃗（n×1）\n\n½(Xθ − y⃗)ᵀ(Xθ − y⃗) = J(θ)\n∇θJ(θ) = XᵀXθ − Xᵀy⃗\n令其为 0 ⇒ 正规方程 XᵀXθ = Xᵀy⃗\n⇒ θ = (XᵀX)⁻¹ Xᵀy⃗", "pts": ["⭐ <b>整个推导的枢纽是第一步：把 J 写成矩阵形式</b>。关键恒等式是 <b>zᵀz = Σᵢzᵢ²</b>——令 z = Xθ−y⃗，它的第 i 个分量正好是 hθ(x⁽ⁱ⁾)−y⁽ⁱ⁾，所以 ½zᵀz 就是 J(θ)。<b>这一步看懂，后面全是机械代数。</b>", "<b>第三步用了 aᵀb = bᵀa</b>（两个标量相等，所以能合并成 −2(Xᵀy⃗)ᵀθ）；<b>第五步用了上一页那两条恒等式</b>。讲义自己在第 10 页点名了这两处。", "⚠️ <b>XᵀX 什么时候不可逆</b>——脚注说得很清楚，两种情况：① <b>线性无关的样本数少于特征数</b>（n < d，数据不够）；② <b>特征之间线性相关</b>（多重共线性）。", "<b>脚注还说了「可以修」</b>：<em>it is possible to “fix” the situation with additional techniques, which we skip here</em>。⭐ 讲义没说是什么，<b>标准答案是岭回归（加 λI）或用伪逆</b>——加上 λI 之后 XᵀX+λI 必定可逆。"], "tbl": [{"cap": "★ 正规方程 vs 梯度下降（这张表几乎必考）", "head": ["", "正规方程", "梯度下降"], "rows": [["迭代", "<b>不用</b>，一步出解", "要，反复迭代"], ["学习率 α", "<b>不需要</b>", "要调，调不好不收敛"], ["特征缩放", "<b>不需要</b>", "<b>强烈建议</b>"], ["复杂度", "<b>O(d³)</b>（求逆）", "每轮 O(nd)"], ["d 很大时", "<b>很慢甚至做不动</b>", "仍可用"], ["适用范围", "<b>只有线性回归有</b>", "几乎所有模型"]]}], "say": "⭐ 表格最后一行是最该记的：<b>正规方程是线性回归独有的福利</b>。逻辑回归<b>没有</b>闭式解（下一节 Ng 会明说），神经网络更没有。所以「能不能一步求解」不是算法好坏的问题，而是<b>平方损失 + 线性模型这个特定组合</b>恰好让导数变成了<b>线性方程组</b>。另一个值得想的点：<b>XᵀX 不可逆意味着「有无穷多个 θ 都同样好」</b>——不是没有解，是<b>解不唯一</b>。几何上就是数据没能把所有方向都「钉住」。这和 PCA 里「某个方向特征值为 0」是同一件事的两种说法。", "ng": "Ng 在 L2 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=3119s\" target=\"_blank\">51:59</a> 说这是 <em>a way to solve for the optimal value of the parameters theta to just jump in one step to the global optimum without needing [to iterate]</em>，然后 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=3564s\" target=\"_blank\">59:24</a> 开始推，到 <a href=\"https://www.youtube.com/watch?v=4b4MUYve_U8&t=4430s\" target=\"_blank\">73:50</a> 落到 <em>this is called the normal equations</em>。⭐ 他在课上<b>跳过了部分代数</b>（<em>I want to leave the details to the lecture notes</em>），所以<b>这一段讲义比视频完整</b>——想看全推导就读讲义，想看动机就听视频。<span class=\"src\">CS229/transcripts/L2.txt · 本地已下载</span>", "exam": "<b>本课 M1T2 Tutorial Q2 原题</b>：给定 (x₁,y₁)…(xₙ,yₙ)，拟合 Y = ax²+bx+c，要求①写出矩阵形式②推导 β̂=(XᵀX)⁻¹XᵀY。答案要点：<b>Y 是 n×1、X 是 n×3、β 是 3×1，X 的第 i 行是 [xᵢ², xᵢ, 1]</b>。⭐ 拿分关键是<b>把每个矩阵的维度写出来并验证相乘合法</b>——课件答案专门强调「一次跟一步代数变换，并检查每个矩阵的维度」。⚠️ 另一个常考概念：<b>「多项式回归还算线性回归吗？」答：算。</b>因为「线性」指的是<b>对参数线性</b>（a、b、c 都是一次），不是对 x 线性。", "tip": {"t": "别把它叫「正规」", "v": "normal equations 里的 normal 是<b>「正交/法向」</b>的意思（残差向量与列空间<b>正交</b>），不是「正常」。中文定译是<b>正规方程</b>，但理解时按「法方程」想：<b>Xᵀ(Xθ−y⃗)=0 就是说残差和 X 的每一列都垂直。</b>"}}, {"r": [11, 12], "star": 3, "t": "★ 概率解释：为什么偏偏是平方误差", "one": "假设噪声是 IID 高斯，最大似然估计推出来的就是最小二乘。", "quote": "<em>Under the previous probabilistic assumptions on the data, least-squares regression corresponds to finding the maximum likelihood estimate of θ.</em>", "eq": "模型：y⁽ⁱ⁾ = θᵀx⁽ⁱ⁾ + ε⁽ⁱ⁾，  ε⁽ⁱ⁾ ~ IID N(0, σ²)\n⇒ p(y⁽ⁱ⁾|x⁽ⁱ⁾;θ) = (1/√(2πσ)) exp( −(y⁽ⁱ⁾−θᵀx⁽ⁱ⁾)² / (2σ²) )\n\nℓ(θ) = log L(θ) = n·log(1/√(2πσ)) − (1/σ²)·½ Σᵢ (y⁽ⁱ⁾−θᵀx⁽ⁱ⁾)²\n⇒ 最大化 ℓ(θ) ≡ 最小化 ½Σᵢ(y⁽ⁱ⁾−θᵀx⁽ⁱ⁾)² = J(θ)", "pts": ["⭐ <b>ε 捕捉的是两种东西</b>，讲义写得很清楚：<em>unmodeled effects</em>（<b>你没放进模型的特征</b>，比如房子有没有壁炉）＋ <em>random noise</em>（纯随机）。<b>不是「测量误差」这么窄。</b>", "⚠️ <b>分号不是逗号</b>：讲义专门强调写 p(y|x<b>;</b>θ) 而不是 p(y|x<b>,</b>θ)，因为 <em>θ is not a random variable</em>——<b>这是频率派的立场，θ 是待估的固定值，不能被「条件」</b>。贝叶斯派才写逗号。", "<b>为什么取 log</b>：<em>the derivations will be a bit simpler</em>。log 是<b>严格单增</b>的，所以 argmax 不变，但<b>连乘变连加</b>，求导立刻简单。", "⭐ <b>σ² 消失了</b>：讲义点名 <em>our final choice of θ did not depend on what was σ²</em>——σ² 只是个正的常数因子，<b>不影响 argmin</b>。所以<b>你不知道噪声多大也没关系</b>，照样能估 θ。这个事实在后面讲 GLM 时还会再用一次。", "<b>讲义留了个重要的口子</b>：<em>the probabilistic assumptions are by no means necessary for least-squares to be a perfectly good and rational procedure</em>——<b>最小二乘不需要高斯假设才合理，高斯假设只是「一种」正当化。</b>"], "tbl": [{"cap": "从假设到结论 · 五步链条（答题就按这个顺序写）", "head": ["步", "做了什么", "关键词"], "rows": [["①", "设 y = θᵀx + ε，ε ~ IID N(0,σ²)", "<b>independent, common variance</b>"], ["②", "写出单点密度 p(y⁽ⁱ⁾|x⁽ⁱ⁾;θ)", "高斯密度代入"], ["③", "独立 ⇒ 似然是<b>连乘</b> L(θ)=Πp", "<b>用到独立性</b>"], ["④", "取 log ⇒ 连加，常数项与 θ 无关", "log(ab)=log a+log b"], ["⑤", "系数 −1/(2σ²) 是<b>负</b>的 ⇒ max ℓ ≡ min SSE", "<b>σ²>0 是必需条件</b>"]]}], "say": "⭐ 这一节回答了全课最常被问的问题之一：<b>「MSE 是随手挑的吗？」不是</b>——它在「独立、等方差高斯噪声」下<b>就是最大似然估计</b>。但反过来也要看懂：<b>假设换了，损失就该换</b>。噪声是<b>重尾</b>的（偶尔有极端离群点）→ 平方会被离群点牵着走，应该用 <b>MAE 或 Huber</b>；噪声<b>方差不等</b>（异方差）→ 应该用<b>加权最小二乘</b>。<b>这正是本课 T2 Tutorial 答案专门写的那段 Interpretation</b>，也是大题里「解释你的选择」那部分的标准答法。", "ng": "Ng 在 L3 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=1534s\" target=\"_blank\">25:34</a> 说这是 <em>the <b>huge</b> assumption we're gonna make</em>——IID。接着 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=1989s\" target=\"_blank\">33:09</a> 给了为什么偏偏是高斯的理由：<em>because of <b>central limit theorem</b>, most error distributions are Gaussian</em>，并解释 <b>「误差由很多互不太相关的小噪声源叠加而成，中心极限定理就把它推向高斯」</b>。⭐ 他还半开玩笑地说 <em>the Gaussian has become a default noise distribution</em>——<b>某种程度上是习惯</b>。最后在 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=2363s\" target=\"_blank\">39:23</a> 收尾：<em>choosing the value of theta to minimize the least squares errors, that's just finding the maximum likelihood estimate</em>。<span class=\"src\">CS229/transcripts/L3.txt · 本地已下载</span>", "exam": "⭐ <b>本课 M1T2 Tutorial Q1 就是这整段推导</b>，题面是「化简 log L(w₀,w₁) 并解释为什么最大化它等价于最小化 SSE」。课件答案给的<b>第 0 步</b>是：<b>先定义残差 rᵢ = yᵢ − (w₀+w₁xᵢ)</b>，式子立刻短一半——<b>这是拿过程分的第一个动作</b>。答题必须写出的两个词：<b>independent</b>、<b>common variance</b>。⚠️ 最后那段三句话论证（常数项与优化无关／系数为负／所以 argmax ≡ argmin）<b>不能省</b>，课件答案把它标成「拿分的关键段落」。", "tip": {"t": "似然 ≠ 概率", "v": "同一个式子 p(y⃗|X;θ)，<b>把 y⃗ 当变量看就叫概率，把 θ 当变量看就叫似然</b>。讲义原话：<em>when we wish to explicitly view this as a function of θ, we will instead call it the likelihood function</em>。<b>式子没变，看的角度变了。</b>"}}, {"r": [13, 13], "star": 2, "t": "局部加权线性回归：让特征的选择不再那么要命", "one": "每次预测都就地重新拟合一条直线，只看查询点附近的样本。", "quote": "<em>the locally weighted linear regression (LWR) algorithm which, assuming there is sufficient training data, makes the choice of features less critical.</em>", "eq": "普通线性回归：\n  1. 选 θ 最小化 Σᵢ (y⁽ⁱ⁾ − θᵀx⁽ⁱ⁾)²\n  2. 输出 θᵀx\n\nLWR：\n  1. 选 θ 最小化 Σᵢ <b>w⁽ⁱ⁾</b>(y⁽ⁱ⁾ − θᵀx⁽ⁱ⁾)²\n  2. 输出 θᵀx\n\n权重：w⁽ⁱ⁾ = exp( −(x⁽ⁱ⁾ − x)² / (2τ²) )", "pts": ["⭐ <b>两个算法的差别只有一个 w⁽ⁱ⁾</b>。式子几乎一样，但含义完全变了：<b>w⁽ⁱ⁾ 依赖于「你现在要预测哪个点 x」</b>，所以<b>换一个查询点就要重新拟合一次</b>。", "<b>权重的直觉</b>：|x⁽ⁱ⁾ − x| 小 ⇒ w⁽ⁱ⁾ ≈ 1（<b>这个样本几乎全额计入</b>）；|x⁽ⁱ⁾ − x| 大 ⇒ w⁽ⁱ⁾ ≈ 0（<b>这个样本基本被忽略</b>）。于是拟合只被查询点<b>附近</b>的数据主导。", "⚠️ <b>讲义专门澄清的一个误解</b>：权重公式长得像高斯密度，<em>but the w⁽ⁱ⁾'s do not directly have anything to do with Gaussians, and in particular the w⁽ⁱ⁾ are not random variables</em>——<b>只是形状像，没有任何概率含义</b>，而且它不积分到 1。", "<b>前一页铺的垫子</b>：左图直线欠拟合、中图加 x² 好一些、右图五次多项式<b>穿过了每一个点却毫无用处</b>。⭐ 讲义对这两个词的定义很口语：欠拟合是 <em>the data clearly shows structure not captured by the model</em>。"], "tbl": [{"cap": "欠拟合 / 刚好 / 过拟合 · 讲义那三张图", "head": ["图", "模型", "现象", "名字"], "rows": [["左", "y = θ₀+θ₁x", "数据明显有弯曲，直线抓不住", "<b>欠拟合 underfitting</b>"], ["中", "y = θ₀+θ₁x+θ₂x²", "贴合得不错", "刚好"], ["右", "五次多项式", "<b>穿过每一个点</b>，但预测新房价会很离谱", "<b>过拟合 overfitting</b>"]]}], "say": "⭐ LWR 值得记的不是公式，是它<b>换了一个思路来对抗欠拟合/过拟合</b>：常规做法是「<b>挑更好的特征</b>」（加 x²、加交叉项），LWR 的做法是「<b>干脆只用局部的数据，局部总是近似线性的</b>」。讲义的措辞很克制——<em>makes the choice of features <b>less critical</b></em>，<b>不是不重要，是没那么要命</b>，而且前提是 <em>assuming there is sufficient training data</em>。<b>数据稀疏的地方，查询点附近根本没几个样本，LWR 会很不稳。</b>", "ng": "Ng 在 L3 开场 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=3s\" target=\"_blank\">00:03</a> 就点了它的定位：<em>a way to modify linear regression and make it fit very non-linear functions</em>，并在 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=321s\" target=\"_blank\">05:21</a> 说 <em>we'll sidestep all those problems with an algorithm called locally weighted regression</em>——⭐ <b>「sidestep（绕开）」这个词用得准</b>：它不是解决了选特征的问题，是绕过去了。另外他在 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=34s\" target=\"_blank\">00:34</a> 说明了<b>这部分只讲关键想法，细节留给作业</b>，讲义也是同一个态度（<em>This treatment will be brief</em>）。<span class=\"src\">CS229/transcripts/L3.txt · 本地已下载</span>", "exam": "⭐ <b>LWR 不在本课 M1 的考纲里</b>——M1T2 的课件从「从一个特征到多个」直接跳到正规方程，没有 LWR。<b>但它前一页的欠拟合/过拟合是 M1T2 第 18 页的正式内容</b>，而且那张「五次多项式穿过所有点」的图本课也用了同样的说法。<b>所以这一页按「过拟合的直观图解」来读就够，LWR 本身当课外延伸。</b>"}, {"r": [14, 14], "star": 2, "t": "带宽 τ、参数 vs 非参数，以及分类登场", "one": "τ 控制「局部」有多局部；非参数 = 预测时还得带着整个训练集。", "quote": "<em>The term “non-parametric” (roughly) refers to the fact that the amount of stuff we need to keep in order to represent the hypothesis h grows linearly with the size of the training set.</em>", "pts": ["<b>τ 叫 bandwidth（带宽）参数</b>，控制<b>权重随距离衰减得多快</b>。τ 小 ⇒ 只看很近的点 ⇒ 曲线很抖（<b>过拟合</b>）；τ 大 ⇒ 看很远的点 ⇒ 退化回普通线性回归（<b>欠拟合</b>）。", "⭐ <b>参数 vs 非参数的判据，讲义说得非常具体</b>：<b>参数化</b>算法有<b>固定、有限个</b>参数，<em>once we've fit the θᵢ's and stored them away, we no longer need to keep the training data around</em>——<b>拟合完可以把数据删了</b>。<b>非参数</b>算法做预测时<b>必须留着整个训练集</b>。", "<b>注意判据不是「有没有参数」</b>。LWR 每次预测也会算出一个 θ，它<b>有</b>参数。关键在于<b>「要存下来的东西随 n 线性增长」</b>。", "<b>Part II 在这一页开始</b>：分类问题，<b>y 只取少数离散值</b>。先只做<b>二分类</b>，y ∈ {0,1}。<b>0 叫 negative class，1 叫 positive class</b>，有时写成 − 和 +。y⁽ⁱ⁾ 叫这个样本的 <b>label（标签）</b>。"], "tbl": [{"cap": "参数化 vs 非参数化 · 本课里的例子", "head": ["类别", "判据", "本课出现的算法"], "rows": [["<b>参数化</b>", "参数个数固定，<b>预测时可丢掉数据</b>", "线性回归、逻辑回归、感知机、<b>GMM</b>、神经网络"], ["<b>非参数化</b>", "要存的东西<b>随 n 增长</b>", "LWR、<b>k-NN</b>、<b>DBSCAN</b>（要留着所有点）"], ["<b>介于之间</b>", "存质心而非全部数据", "<b>k-means</b>（存 k 个质心，参数化）"]]}], "say": "⭐ <b>这个区分在 M2 也要用</b>，而且是考点。把 M2 的三个算法套进这个判据：<b>k-means 是参数化的</b>（学完存 k 个质心，原数据可以扔）；<b>GMM 也是参数化的</b>（存 π、μ、Σ）；<b>DBSCAN 是非参数的</b>——它<b>没有「模型」可存</b>，给一个新点要判它属于哪簇，必须拿着原始数据重新做邻域查询。这解释了 DBSCAN 的一个常考弱点：<b>它不能直接 predict 新样本</b>。<b>这条线索把 M1 和 M2 串起来了。</b>", "ng": "Ng 在 L3 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=353s\" target=\"_blank\">05:53</a> 把这个区分讲得比讲义口语：<em>Locally weighted regression will be our first exposure to a non-parametric learning algorithm</em>，并给了一个很形象的判据——<b>「参数化算法拟合完，你可以把训练集从电脑内存里删掉」</b>（<em>you could erase a training set from your computer memory and make predictions just using the parameters</em>）。⭐ 这句比讲义的「stuff grows linearly」好记得多，<b>答题时可以直接用「能不能删掉训练集」来表述</b>。另外带宽 τ 在 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=930s\" target=\"_blank\">15:30</a>，他在 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=1061s\" target=\"_blank\">17:41</a> 明说 <em>the choice of the bandwidth tau has an effect on overfitting and underfitting</em>。<span class=\"src\">CS229/transcripts/L3.txt · 本地已下载</span>", "exam": "本课 M1T3 第 4 页用一张表区分回归和分类（预测什么／例子／输出／常用损失／问的问题），<b>和讲义这一页的分类定义对得上</b>。⚠️ 讲义用 <b>0/1</b>，本课课件<b>感知机用 −1/+1、逻辑回归用 0/1</b>，而且课件明确警告「<b>一旦选定不能中途换——这是最常见的失分点</b>」。<b>看讲义的感知机那一节时尤其要当心，讲义用的是 0/1 版本。</b>"}, {"r": [15, 15], "star": 3, "t": "★ sigmoid 与那条必背的导数恒等式", "one": "g′(z) = g(z)(1 − g(z)) —— 后面每一次求导都靠它。", "quote": "<em>g(z) = 1/(1 + e^{−z}) is called the logistic function or the sigmoid function.</em>", "eq": "hθ(x) = g(θᵀx) = 1 / (1 + e^{−θᵀx})\n\ng′(z) = d/dz [ (1+e^{−z})⁻¹ ]\n      = (1+e^{−z})⁻² · e^{−z}\n      = (1/(1+e^{−z})) · ( 1 − 1/(1+e^{−z}) )\n      = g(z)(1 − g(z))", "pts": ["⭐ <b>为什么要换掉线性模型</b>：讲义给了两个理由——① <em>it is easy to construct examples where this method performs very poorly</em>（一个远处的离群点能把整条回归线拽歪，决策阈值跟着全错）；② <b>它不合理</b>，<em>it doesn't make sense for hθ(x) to take values larger than 1 or smaller than 0 when we know that y ∈ {0,1}</em>。", "<b>sigmoid 的性质</b>：z→+∞ 时 g→1，z→−∞ 时 g→0，<b>永远夹在 (0,1) 之间</b>，而且 <b>g(0) = 0.5</b>。所以 h(x) 可以读成「y=1 的概率」。", "⭐ <b>那条导数恒等式的推导只有三步</b>，而且第三步是全部精髓：<b>把 e^{−z}/(1+e^{−z}) 拆成 1 − 1/(1+e^{−z})</b>。看到 e^{−z} 就想「加一减一」，这个凑项技巧值得单独记。", "<b>讲义在这里埋了个伏笔</b>：<em>for a couple of reasons that we'll see later (when we talk about GLMs, and when we talk about generative learning algorithms), the choice of the logistic function is a fairly natural one</em>——<b>第 24 页会兑现这个承诺</b>：sigmoid 不是拍脑袋选的，是<b>伯努利分布写成指数族后自动冒出来的</b>。"], "tbl": [{"cap": "g′ = g(1−g) 的几个直接后果", "head": ["z 的位置", "g(z)", "g′(z)", "含义"], "rows": [["z = 0", "0.5", "<b>0.25（最大）</b>", "最不确定处梯度最大"], ["z = ±2", "0.88 / 0.12", "≈ 0.105", "梯度已掉一半多"], ["z = ±6", "≈1 / ≈0", "<b>≈ 0.0025</b>", "<b>梯度几乎消失</b>"]]}], "say": "⭐ 上表最后一行就是 <b>M3 会专门讲的「梯度消失」</b>的源头：|z| 一大，g′ 就塌到接近 0，<b>反向传播经过一层 sigmoid 梯度就缩水一次</b>，堆几层之后前面几层几乎学不动。<b>这正是深度学习改用 ReLU 的直接原因</b>（ReLU 在正半轴导数恒为 1，不衰减）。所以这条恒等式在 M1 是「方便求导的工具」，到了 M3 变成「<b>为什么不能用 sigmoid 做隐藏层激活</b>」的论据——<b>同一个式子，两个模块各考一面。</b>", "ng": "Ng 在 L3 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=2719s\" target=\"_blank\">45:19</a> 引入它：<em>this is called the sigmoid, or the logistic function</em>，并在 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=2878s\" target=\"_blank\">47:58</a> 强调 <em>it can be called the sigmoid function, or the logistic function, it means <b>exactly the same thing</b></em>——⭐ <b>两个名字指同一个东西，考试里两种叫法都可能出现</b>。另外他在课上明说<b>当时不解释为什么选这个函数</b>，要等到 L4 的 GLM——和讲义的伏笔完全一致。<span class=\"src\">CS229/transcripts/L3.txt · 本地已下载</span>", "exam": "<b>本课 M1T3 第 13 页就是这一页</b>，课件给了一张 z = −6…+6 对应 p 的数值表（−6→0.002，0→0.5，+6→0.998）。⭐ <b>手算题常考 g(0)=0.5、g(2)≈0.88</b>，考场只能用非编程计算器，<b>这两三个值建议背下来</b>。⚠️ 课件专门标的易错点：<b>z 本身不是概率</b>，z 的范围是整个实轴（可以是 −7.3 或 +150），<b>要概率必须再套 sigmoid</b>。", "tip": {"t": "决策阈值在哪", "v": "p ≥ 0.5 判正类，<b>等价于 z ≥ 0</b>（因为 g(0)=0.5 且 g 单增）。所以<b>决策边界就是 z = 0 这条直线</b>——本课 M1T3 第 6–7 页反复用这个等价。⚠️ 阈值不一定是 0.5，<b>类别不平衡或代价不对称时要调</b>。"}}, {"r": [16, 16], "star": 3, "t": "★ 逻辑回归的似然：一行技巧把两种情况合并", "one": "p(y|x;θ) = h^y (1−h)^{1−y} —— 指数位上的 y 充当开关。", "quote": "<em>p(y | x; θ) = (hθ(x))^y (1 − hθ(x))^{1−y}</em>", "eq": "P(y=1|x;θ) = hθ(x)\nP(y=0|x;θ) = 1 − hθ(x)\n合并：p(y|x;θ) = h^y (1−h)^{1−y}\n\nL(θ) = Πᵢ (h(x⁽ⁱ⁾))^{y⁽ⁱ⁾} (1−h(x⁽ⁱ⁾))^{1−y⁽ⁱ⁾}\nℓ(θ) = Σᵢ [ y⁽ⁱ⁾ log h(x⁽ⁱ⁾) + (1−y⁽ⁱ⁾) log(1−h(x⁽ⁱ⁾)) ]", "pts": ["⭐ <b>那个合并技巧要看懂</b>：y=1 时式子变成 h¹(1−h)⁰ = h；y=0 时变成 h⁰(1−h)¹ = 1−h。<b>指数位上的 y 和 1−y 就是一对开关</b>，总有一个把对应的因子关成 1。<b>这个技巧在第 25 页的多项分布那里会被推广成指示函数 1{y=i}。</b>", "<b>和线性回归完全一样的三步套路</b>：① 写出 p(y|x;θ)；② 独立 ⇒ 连乘得 L(θ)；③ 取 log 得 ℓ(θ)。⭐ <b>Ng 在课上把这个套路明确总结成了「两个关键步骤」</b>，见下面 ng 栏。", "<b>ℓ(θ) 这个式子就是「二元交叉熵」的相反数</b>。本课课件把损失叫 <b>BCE（binary cross-entropy）</b>：BCE = −ℓ/n。<b>最大化对数似然 ≡ 最小化交叉熵</b>，<b>两个名字、一件事</b>。", "⚠️ <b>这里没有闭式解</b>。线性回归能解正规方程是因为导数是线性的；这里 h 里套了 sigmoid，<b>导数方程是超越方程，解不出来</b>，所以下一页只能迭代。"], "tbl": [{"cap": "线性回归 vs 逻辑回归 · 同一套流程的两次应用", "head": ["", "线性回归", "逻辑回归"], "rows": [["假设 y|x 服从", "<b>高斯</b> N(θᵀx, σ²)", "<b>伯努利</b> Bernoulli(h)"], ["ℓ(θ) 长什么样", "−常数·Σ(y−θᵀx)²", "Σ[y log h + (1−y)log(1−h)]"], ["等价于最小化", "<b>平方误差 SSE</b>", "<b>二元交叉熵 BCE</b>"], ["有闭式解吗", "<b>有</b>（正规方程）", "<b>没有</b>，必须迭代"]]}], "say": "⭐ 这张表是 M1 整块的<b>总纲</b>：两个算法<b>流程一模一样</b>，差别只在第一行「假设 y|x 服从什么分布」。<b>换一个分布，后面全部自动跟着变</b>——这正是第 20 页 GLM 要正式讲的事。<b>如果大题问「比较线性回归和逻辑回归」，照这张表的四行答，比零散地说「一个连续一个离散」得分高得多</b>，因为它展示了你看懂了<b>共同的框架</b>，而不只是记住了两个算法。", "ng": "Ng 在 L3 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=2503s\" target=\"_blank\">41:43</a> 把这个套路总结成了一句可以直接拿去答题的话：<em>the key steps are, one, make an assumption about <b>P of Y given X</b>, parameters theta, and then second is figure out [the maximum likelihood]</em>。⭐ <b>「先假设 P(y|x)，再做最大似然」——这两步就是 M1 后半段所有算法的统一配方</b>，逻辑回归、感知机（的对照）、GLM、softmax 全是它的实例。<span class=\"src\">CS229/transcripts/L3.txt · 本地已下载</span>", "exam": "本课 M1T3 把 BCE 作为逻辑回归的标准损失，<b>并要求能写出它</b>。⚠️ 写 BCE 时三个常见错：① <b>忘了负号</b>（损失是 −ℓ，要最小化）；② <b>log 的底</b>——机器学习里一律是<b>自然对数</b>；③ <b>除不除 n</b>——写成平均还是求和要跟题面一致。<b>答题时把定义式先写出来再代数，比直接报数安全。</b>"}, {"r": [17, 17], "star": 3, "t": "★ 梯度上升推导：和 LMS 长得一模一样，但不是同一个算法", "one": "θⱼ := θⱼ + α(y − hθ(x))xⱼ —— 和线性回归的式子逐字相同。", "quote": "<em>If we compare this to the LMS update rule, we see that it looks identical; but this is <b>not</b> the same algorithm, because hθ(x⁽ⁱ⁾) is now defined as a non-linear function of θᵀx⁽ⁱ⁾.</em>", "eq": "∂ℓ/∂θⱼ = ( y·1/g(θᵀx) − (1−y)·1/(1−g(θᵀx)) ) · ∂g(θᵀx)/∂θⱼ\n       = ( … ) · g(θᵀx)(1−g(θᵀx)) · ∂(θᵀx)/∂θⱼ      ← 用 g′=g(1−g)\n       = ( y(1−g(θᵀx)) − (1−y)g(θᵀx) ) · xⱼ\n       = ( y − hθ(x) ) xⱼ\n\n⇒ θⱼ := θⱼ + α ( y⁽ⁱ⁾ − hθ(x⁽ⁱ⁾) ) x⁽ⁱ⁾ⱼ", "pts": ["⭐ <b>第二步是整段的钥匙</b>：代入 g′ = g(1−g) 之后，分母上的 g 和 1−g <b>正好被约掉</b>，四项化成两项。<b>这就是上一页那条恒等式的全部用处</b>——没有它，这个导数会非常难看。", "<b>符号是 +（梯度上升）不是 −</b>：讲义点名 <em>Note the positive rather than negative sign in the update formula, since we're maximizing, rather than minimizing</em>。<b>最大化对数似然 ⇒ 上升；最小化交叉熵 ⇒ 下降。两者等价，符号别弄反。</b>", "⚠️ <b>「看起来一样 ≠ 是同一个算法」</b>——讲义把这句话加了粗体级别的强调。差别在 <b>hθ(x) 的定义</b>：线性回归里 h = θᵀx，逻辑回归里 h = g(θᵀx)。<b>同一个壳，里面装的东西不同。</b>", "<b>讲义自己提了问但没答</b>：<em>Is this coincidence, or is there a deeper reason behind this? We'll answer this when we get to GLM models.</em> ⭐ <b>答案在第 22–24 页：这不是巧合，所有 GLM 的更新规则都长这样。</b>"], "tbl": [{"cap": "三个算法的更新规则 · 形状相同，h 不同", "head": ["算法", "更新规则", "hθ(x) 是什么"], "rows": [["线性回归", "θⱼ += α(y−h)xⱼ", "<b>θᵀx</b>（恒等）"], ["逻辑回归", "θⱼ += α(y−h)xⱼ", "<b>g(θᵀx)</b>（sigmoid）"], ["感知机", "θⱼ += α(y−h)xⱼ", "<b>1{θᵀx ≥ 0}</b>（阶跃）"]]}], "say": "⭐ 这张表是整份讲义<b>最漂亮的一处</b>：三个算法共享<b>一条更新规则</b>，差别只在把 θᵀx 送进哪个函数。但要小心<b>别过度解读</b>——它们的<b>理论地位完全不同</b>：线性回归和逻辑回归都是<b>最大似然估计</b>（有概率模型撑着），<b>感知机不是</b>（下一页讲义会专门说它「难以赋予有意义的概率解释」）。所以<b>「更新规则相同」只是表面现象，不代表它们是一家人</b>。真正把前两个归成一家的是 GLM，<b>感知机被排除在外</b>。", "ng": "Ng 在 L3 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=3434s\" target=\"_blank\">57:14</a> 解释了为什么这里说「上升」：<em>gradient descent is trying to climb down this hill whereas gradient ascent has a concave function</em>，并在 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=3691s\" target=\"_blank\">61:31</a> 明确说逻辑回归的 ℓ(θ) <b>是凹函数</b>（<em>this is a concave function</em>）——⭐ <b>所以逻辑回归也没有局部最优问题</b>，梯度上升一定能到全局最大。同一处他还说了没有闭式解的事：<em>There is no known way to just have a closed form equation [for] the best value of theta, which is why you always have to use an algorithm</em>。<span class=\"src\">CS229/transcripts/L3.txt · 本地已下载</span>", "exam": "⚠️ <b>本课的写法和这里差一个负号的位置</b>：课件用 <b>梯度下降最小化 BCE</b>，更新写成 <b>w ← w − η·∇(BCE)</b>，而 ∇BCE = −(y−h)x，所以展开后还是 <b>w ← w + η(y−h)x</b>。<b>两边最终一致</b>，但答题时<b>要跟着题面用的是「最小化损失」还是「最大化似然」来定符号</b>，并把这一步写出来。⭐ 大题里<b>写出「因为要最大化所以用加号」这一句话本身就是过程分</b>。"}, {"r": [18, 18], "star": 3, "t": "★ 感知机：本课的重头戏，但讲义只给了半页", "one": "把 sigmoid 换成阶跃函数就成了感知机——但它不再是概率模型。", "quote": "<em>it is difficult to endow the perceptron's predictions with meaningful probabilistic interpretations, or derive the perceptron as a maximum likelihood estimation algorithm.</em>", "eq": "g(z) = 1  若 z ≥ 0\n       0  若 z < 0          ← 阶跃函数（讲义版，0/1 标签）\n\nhθ(x) = g(θᵀx)\nθⱼ := θⱼ + α ( y⁽ⁱ⁾ − hθ(x⁽ⁱ⁾) ) x⁽ⁱ⁾ⱼ", "pts": ["<b>讲义对它的定位很低</b>：<em>an algorithm that's of some historical interest</em>——<b>只有历史意义</b>，而且整节叫「Digression（题外话）」，<b>半页就讲完了</b>。", "<b>1960 年代的来历</b>：<em>this “perceptron” was argued to be a rough model for how individual neurons in the brain work</em>——<b>当年被当成单个神经元的粗糙模型</b>。这是神经网络这条线的真正起点。", "⭐ <b>讲义给的唯一「深刻」判断</b>：感知机<b>看起来</b>和前两个算法很像，<em>but it is actually a very different type of algorithm</em>——<b>它没有概率解释，也推不出是最大似然估计</b>。原因不难想：阶跃函数输出只有 0 和 1，<b>没有「有多确定」这个量</b>。", "<b>它还会在学习理论那一节回来</b>：讲义说 <em>it will also provide a starting point for our analysis when we talk about learning theory</em>——因为它足够简单，<b>能证出收敛定理（犯错次数有上界）</b>。"], "tbl": [{"cap": "⚠️ 讲义的感知机 vs 本课的感知机（标签约定不同，结论有一处真的不一样）", "head": ["", "CS229 讲义", "<b>本课 M1T3</b>"], "rows": [["标签", "y ∈ <b>{0, 1}</b>", "y ∈ <b>{−1, +1}</b>"], ["预测", "g(z)=1{z≥0}", "ŷ = <b>sign(s)</b>，s = wᵀx+b"], ["更新触发", "y ≠ h 时（隐含）", "<b>y·s ≤ 0 时</b>（课件明文规定含等号）"], ["更新量", "α(y−h)x", "<b>η·y·x</b>"], ["损失", "<b>没提</b>", "<b>L = max(0, −y·s)</b>（感知机准则）"]]}], "say": "⭐ <b>表格第三行是一个真实存在的差异，不是换个写法而已。</b>考虑 <b>y = 正类、z 正好 = 0</b> 这个样本：讲义的 g(0) = 1（因为 z≥0），预测正确，<b>y−h = 0，不更新</b>；本课规定 <b>y·s = 0 ≤ 0，要更新</b>。<b>手算题如果恰好出现 s = 0，两套规则给出的参数会不一样。</b>本课课件对此有明文警告：「<b>本课程的更新触发条件是 y·s ≤ 0（小于等于）。别的教材可能写 &lt; 0，做题按 ≤ 来</b>」。<b>CS229 讲义就是那个「别的教材」。</b>另外课件解释了为什么用 ±1 而不是 0/1：<b>乘积的符号能直接编码对错；若用 0/1，y=0 会把乘积压成 0，这个机制就失效</b>。", "ng": "Ng 把感知机放在 L4 开场 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=64s\" target=\"_blank\">01:04</a>，而且<b>只花了十分钟</b>，第一句就是泼冷水：<a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=95s\" target=\"_blank\">01:35</a> <em>the perceptron algorithm is <b>not something that is widely used in practice</b></em>。⭐ 他在 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=192s\" target=\"_blank\">03:12</a> 给了和讲义同样的观察：<em>the update rules for the perceptron and logistic regression, they look the same <b>except h theta of x means different things</b></em>。另外在 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=763s\" target=\"_blank\">12:43</a> 他总结感知机的性质：<em>You kinda have a geometrical feel of what's happening with the hyperplane but it <b>doesn't have a probabilistic interpretation</b></em>——<b>有几何直觉，没有概率解释</b>，和讲义完全一致。<span class=\"src\">CS229/transcripts/L4.txt · 本地已下载</span>", "exam": "⭐ <b>这是本课 M1T3 最核心的一块，占了课件第 8–12 页整整五页</b>，而讲义只给了半页——<b>这一页必须以课件为准</b>。课件要求掌握的、讲义没有的内容：<b>① 感知机损失 L=max(0,−y·s)</b>；<b>② 收敛定理</b>（线性可分 ⇒ 只会犯有限次错，但<b>不保证快、不保证最优</b>，经典反例 XOR）；<b>③ 五条局限</b>（类别重叠时可能永不停、路径依赖样本顺序、学习率只缩放不产生概率、输出是硬判定不是校准概率）；<b>④ 手算更新</b>（课件第 11 页有完整例题：w=[−0.5,0.2], b=0, x=[2,0], y=+1, η=0.5 ⇒ 更新后 w=[0.5,0.2], b=0.5, s 从 −1 变 +1.5）。⚠️ 课件点名的易错：<b>x 某一维为 0，该维权重就不会被更新</b>。", "tip": {"t": "为什么 max(0,·)", "v": "本课课件的解释很到位：<b>没有 max，分得特别对的点会给出很大的负损失，模型会一味把已分对的点推得更远而不去修正错的点</b>。有了 max，<b>分对的样本对损失零贡献——感知机只关心犯错的样本</b>。⚠️ 课件还点了一个矛盾：<b>y·s = 0 时损失是 0，但更新规则仍要更新，做题以更新规则为准。</b>"}}, {"r": [19, 19], "star": 2, "t": "牛顿法：十来次迭代就够，但 d 大了就别用", "one": "用二阶信息走大步；代价是每轮要求一个 d×d 矩阵的逆。", "quote": "<em>Newton's method typically enjoys faster convergence than (batch) gradient descent, and requires many fewer iterations … but so long as d is not too large, it is usually much faster overall.</em>", "eq": "求零点：θ := θ − f(θ)/f′(θ)\n求极值（令 f = ℓ′）：θ := θ − ℓ′(θ)/ℓ″(θ)\n\n多维（Newton-Raphson）：\nθ := θ − H⁻¹ ∇θℓ(θ)\nHᵢⱼ = ∂²ℓ(θ) / ∂θᵢ∂θⱼ          ← Hessian，(d+1)×(d+1)", "pts": ["⭐ <b>一句话几何直觉</b>：在当前点<b>作切线</b>，看切线和 0 交在哪，<b>跳过去</b>。讲义的三张图就是这个过程：从 θ=4.5 出发 → 2.8 → 1.8 → 很快到 1.3。", "<b>从「找零点」到「找极值」只换了一个对象</b>：极大值处 ℓ′ = 0，所以<b>令 f = ℓ′，对 ℓ′ 找零点</b>就是对 ℓ 找极值。于是分母从 f′ 变成 ℓ″。", "<b>讲义留了道思考题</b>：<em>How would this change if we wanted to use Newton's method to minimize rather than maximize a function?</em> ⭐ <b>答案：完全不变。</b>牛顿法找的是 ℓ′=0 的点，<b>它分不清极大还是极小</b>——这既是答案也是它的一个真实缺陷。", "<b>用在逻辑回归上有个专名</b>：<em>the resulting method is also called <b>Fisher scoring</b></em>。"], "tbl": [{"cap": "梯度下降 vs 牛顿法 · 什么时候选哪个", "head": ["", "梯度下降", "牛顿法"], "rows": [["用到几阶导数", "一阶（梯度）", "<b>二阶（Hessian）</b>"], ["迭代次数", "成百上千", "<b>约 10 次</b>"], ["单次代价", "O(nd)", "<b>O(d³)</b>（求逆）"], ["要调学习率吗", "<b>要</b>", "不要"], ["d = 10", "可以", "<b>更好</b>"], ["d = 10000", "<b>首选</b>", "<b>做不动</b>"]]}], "say": "⭐ <b>「二次收敛」这个名字不好，但含义很值钱</b>：Ng 的说法是<b>每迭代一次，正确的有效数字位数翻倍</b>——误差 0.01 → 0.0001 → 0.00000001。<b>这就是为什么只要十来次迭代。</b>但代价表最后两行才是实践中真正的决定因素：<b>d³ 这个指数让牛顿法在高维上直接出局</b>。Ng 在课上给了很具体的门槛（见 ng 栏）。⭐ 顺带一提，<b>深度学习里几乎没人用牛顿法</b>，正是因为参数量动辄上百万，Hessian 根本存不下——这又是一条 M1 通向 M3 的线索。", "ng": "Ng 在 L3 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=4416s\" target=\"_blank\">73:36</a> 讲二次收敛，举的例子就是<b>误差 0.01 → 0.0001 → 0.00000001</b>，并总结 <em>the number of significant digits that you have converged doubles on a single iteration</em>。⭐ 更实用的是 <a href=\"https://www.youtube.com/watch?v=het9HFqo1TQ&t=4572s\" target=\"_blank\">76:12</a> 之后那段<b>具体门槛</b>：<em>if theta is ten-dimensional, this involves inverting a 10 by 10 matrix, which is fine. But if theta was 10,000 or 100,000, then each iteration requires computing like a 100,000 by a 100,000 matrix and inverting that, which is very hard</em>，结论是 <b>「如果有一万甚至五万个参数，我就用梯度下降」</b>。<b>这个「一万」的量级比讲义含糊的「d not too large」有用得多。</b><span class=\"src\">CS229/transcripts/L3.txt · 本地已下载</span>", "exam": "<b>牛顿法不在本课 M1 的考纲里</b>——M1T2/T3 的课件只讲梯度下降。⭐ <b>但它是很好的「比较类」素材</b>：如果大题问「除了梯度下降还有什么优化方法、各有什么取舍」，<b>照上面那张表答能显著拉开分差</b>，因为它展示了你理解「<b>一阶 vs 二阶信息的取舍</b>」这个一般原则，而不只是会背一个算法。"}, {"r": [20, 21], "star": 2, "t": "指数族：把分布写成一个统一的模板", "one": "b(y)·exp(ηᵀT(y) − a(η)) —— 伯努利往里一套，sigmoid 自己冒出来了。", "quote": "<em>p(y; η) = b(y) exp(ηᵀT(y) − a(η))</em>", "eq": "伯努利：\np(y;φ) = φ^y (1−φ)^{1−y}\n       = exp( y log φ + (1−y) log(1−φ) )\n       = exp( log(φ/(1−φ))·y + log(1−φ) )\n\n⇒ η = log(φ/(1−φ))\n⇒ 反解：<b>φ = 1/(1 + e^{−η})</b>   ← sigmoid！\n  T(y) = y,  a(η) = log(1+e^η),  b(y) = 1", "pts": ["<b>四个零件各管一摊</b>：<b>η</b> 自然参数（natural / canonical parameter）；<b>T(y)</b> 充分统计量（<em>often T(y) = y</em>）；<b>a(η)</b> 对数配分函数；<b>b(y)</b> 底测度。<b>e^{−a(η)} 的作用是归一化，让分布积分到 1。</b>", "⭐ <b>整段最值钱的一行</b>：把伯努利凑成模板之后，η = log(φ/(1−φ))，<b>反解回来 φ = 1/(1+e^{−η}) 正是 sigmoid</b>。讲义用了个感叹号：<em>This is the familiar sigmoid function!</em> <b>第 15 页埋的伏笔在这里兑现：sigmoid 不是选的，是伯努利分布自带的。</b>", "<b>凑的手法只有两步</b>：① 用 a = exp(log a) 把乘幂搬到指数上；② 把 y 的项和不含 y 的项<b>分开</b>，含 y 的系数就是 η。<b>所有指数族的推导都是这两步。</b>", "<b>固定 T、a、b 就定义了「一族」分布</b>，<b>变动 η 就在这一族里换成员</b>。这是理解「family」这个词的关键。"], "tbl": [{"cap": "两个成员的零件对照", "head": ["", "伯努利(φ)", "高斯(µ)，设 σ²=1"], "rows": [["η", "<b>log(φ/(1−φ))</b>", "<b>µ</b>"], ["T(y)", "y", "y"], ["a(η)", "log(1+e^η)", "η²/2"], ["b(y)", "1", "(1/√(2π))e^{−y²/2}"], ["反解（响应函数）", "<b>φ = 1/(1+e^{−η})</b>（sigmoid）", "<b>µ = η</b>（恒等）"]]}], "say": "⭐ <b>为什么要设 σ² = 1</b>？讲义说得很坦白：第 12 页已经证过 <b>σ² 不影响最终的 θ</b>，所以<em>we can choose an arbitrary value for σ² without changing anything</em>，设成 1 只是<b>为了让推导短</b>。脚注补了完整版：σ² 留着的话 η 会变成<b>二维向量</b>，需要更一般的定义 p(y;η,τ) = b(a,τ)exp((ηᵀT(y)−a(η))/c(τ))，其中 <b>τ 叫 dispersion parameter（离散参数），对高斯而言 c(τ) = σ²</b>。<b>这个脚注不考，但知道「简化是有代价的、代价被明确记在脚注里」是读讲义的好习惯。</b>", "ng": "Ng 在 L4 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=858s\" target=\"_blank\">14:18</a> 给出定义，并在 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=1255s\" target=\"_blank\">20:55</a> 说了一句很实用的判据：<em>As long as the expression integrates to 1, you have a family in the exponential family</em>。⭐ 更有用的是 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=1721s\" target=\"_blank\">28:41</a> 他点明了<b>整个推导的套路</b>：<em>we start with the parameters that we are commonly used to — they are also called the <b>canonical parameters</b> — and then we set up a link between the canonical parameters and the natural parameters, that's part of the <b>massaging exercise</b> that we do</em>。<b>「massaging（揉）」这个词很准：整个过程就是把熟悉的参数揉成 η。</b>伯努利那一段在 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=1351s\" target=\"_blank\">22:31</a>–<a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=1655s\" target=\"_blank\">27:35</a>。<span class=\"src\">CS229/transcripts/L4.txt · 本地已下载</span>", "exam": "<b>指数族不在本课 M1 的考纲里</b>（课件没有这一段）。⭐ <b>但「sigmoid 是伯努利分布自带的，不是随便挑的」这个结论值得记</b>——如果大题问「为什么逻辑回归用 sigmoid 而不是别的 S 形函数」，<b>多数人只会答「因为它把实数压到 (0,1)」，而这个答案任何 S 形函数都满足</b>。能补一句「<b>它是伯努利分布的正则响应函数</b>」会明显更有分量。"}, {"r": [22, 23], "star": 3, "t": "★ 构造 GLM 的三条假设：一张配方卡", "one": "挑一个分布、预测它的期望、让 η 线性依赖 x —— 三步出一个新算法。", "quote": "<em>The third of these assumptions might seem the least well justified of the above, and it might be better thought of as a “<b>design choice</b>” in our recipe for designing GLMs, rather than as an assumption per se.</em>", "eq": "① y | x; θ ~ ExponentialFamily(η)\n② 目标是预测 E[T(y)|x]；多数情况 T(y)=y，即 h(x) = E[y|x]\n③ η = θᵀx   （η 是向量时 ηᵢ = θᵢᵀx）\n\n⇒ 线性回归（高斯）：h(x) = E[y|x] = µ = η = θᵀx\n⇒ 逻辑回归（伯努利）：h(x) = E[y|x] = φ = 1/(1+e^{−η}) = 1/(1+e^{−θᵀx})", "pts": ["⭐ <b>三条假设里只有第三条是「硬塞」的</b>，讲义自己承认：它<b>不太有正当理由，更像是设计选择</b>。前两条有理有据（分布假设、预测期望），<b>第三条是为了让模型「线性」而规定的</b>。<b>GLM 里的 Linear 就指这一条。</b>", "<b>第二条要注意是 E[T(y)|x] 不是 E[y|x]</b>。多数情况 T(y)=y 所以两者一样，<b>但 softmax 那里 T(y) 是个向量，就不一样了</b>（第 27 页）。", "<b>线性回归的推导只有四个等号</b>：h = E[y|x]（假设②）= µ（高斯的期望就是 µ）= η（上一页算出高斯的 η=µ）= θᵀx（假设③）。<b>四步各有出处，答题时逐步标出来。</b>", "⭐ <b>讲义举了个 Poisson 的开场例子</b>：预测<b>每小时到店顾客数</b>（或网页浏览量），特征是促销、广告、天气、星期几。<b>计数数据 ⇒ 泊松分布 ⇒ 泊松在指数族 ⇒ 套 GLM 配方就有算法了。</b>这就是 GLM 的实用价值：<b>遇到新类型的 y，不用重新发明算法。</b>"], "tbl": [{"cap": "★ GLM 配方卡：换一个 y 的类型，换一个分布", "head": ["y 是什么", "选的分布", "响应函数", "得到的算法"], "rows": [["<b>连续实数</b>", "高斯", "恒等", "<b>线性回归</b>"], ["<b>二元 0/1</b>", "伯努利", "<b>sigmoid</b>", "<b>逻辑回归</b>"], ["<b>k 选一</b>", "多项分布", "<b>softmax</b>", "<b>softmax 回归</b>"], ["<b>计数（0,1,2,…）</b>", "泊松", "exp", "泊松回归"], ["<b>非负连续（等待时间）</b>", "gamma / 指数", "—", "gamma 回归"], ["<b>概率值 (0,1)</b>", "beta / Dirichlet", "—", "beta 回归"]]}], "say": "⭐ <b>这张配方卡是整份讲义的最高点</b>。它把 M1 学过的两个算法<b>降格成了同一个框架的两个实例</b>，还顺带送了三四个你没学过的算法。<b>更重要的是它回答了第 17 页留下的那个问题</b>：为什么线性回归和逻辑回归的更新规则长得一模一样？<b>因为它们是同一个配方的两次实例化，而这个配方的更新规则只有一条。</b>Ng 在课上把这句话说得很直白（见 ng 栏）。<b>如果本课大题出现「比较/联系两个算法」这类开放题，把这个框架写出来是最高质量的答法。</b>", "ng": "Ng 在 L4 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=2138s\" target=\"_blank\">35:38</a> 列三条假设时，<b>用词和讲义一样谨慎</b>：<em>these are the <b>assumptions or design choices</b> that are gonna take us from [the exponential family to GLM]</em>，并在 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=2323s\" target=\"_blank\">38:43</a> 单独点名第三条：<em>the design choice that we are making here is that Eta is equal to Theta transpose x</em>。⭐ <b>最该记的是 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=2814s\" target=\"_blank\">46:54</a> 那一句</b>：<em>no matter which GLM you're doing, no matter which choice of distribution that you make, the learning update rule [is the same] … <b>You can go straight to the update rule and do your learning</b></em>——<b>换分布不用重推梯度，更新规则是现成的</b>。这正是讲义第 17 页那个「是巧合吗」的答案。<span class=\"src\">CS229/transcripts/L4.txt · 本地已下载</span>", "exam": "<b>GLM 不在本课 M1 的考纲里</b>（课件没有这一节）。⭐ <b>但有一个点可能直接用得上</b>：本课 M1T2 第 20 页讲「线性回归的五个假设」时，第①条是 <b>Linearity</b>，课件特意写了「<b>准确说是对参数线性</b>」。<b>GLM 的第三条假设 η = θᵀx 就是这句话的精确版本</b>——线性指的是 <b>η 对 θ 线性</b>，而不是 y 对 x 线性。理解了这一条，<b>「多项式回归为什么还算线性回归」就不用死记了。</b>", "tip": {"t": "两个名字别搞反", "v": "<b>canonical response function（正则响应函数）</b> g：<b>η → 期望</b>（高斯是恒等，伯努利是 sigmoid）。<b>canonical link function（正则连接函数）</b> g⁻¹：<b>期望 → η</b>（伯努利是 logit）。⚠️ 讲义脚注专门提醒：<b>很多教科书把 g 和 g⁻¹ 的叫法反过来用</b>，CS229 沿用的是早期机器学习文献的约定。<b>看别的资料时先确认方向。</b>"}}, {"r": [24, 24], "star": 3, "t": "★ 逻辑回归作为 GLM：sigmoid 的真正出处", "one": "「sigmoid 哪来的」这个问题在这一页有了正式答案。", "quote": "<em>If you are previously wondering how we came up with the form of the logistic function 1/(1+e^{−z}), this gives one answer: Once we assume that y conditioned on x is Bernoulli, it arises as a <b>consequence</b> of the definition of GLMs and exponential family distributions.</em>", "eq": "hθ(x) = E[y|x;θ]            （假设②）\n      = φ                    （伯努利的期望就是 φ）\n      = 1/(1 + e^{−η})       （第 21 页反解出来的）\n      = 1/(1 + e^{−θᵀx})     （假设③）", "pts": ["⭐ <b>这四行是本页的全部</b>，而且<b>每一行都标明了出处</b>——两条假设 + 一个分布性质 + 一个上一节的结论。<b>这种「每步标出处」的写法本身就是大题的模板。</b>", "<b>结论要读准</b>：sigmoid <b>不是</b>谁挑的一个好用的 S 形函数，<b>而是「假设 y|x 服从伯努利」这件事的数学后果</b>。讲义用的词是 <em>consequence</em>。", "<b>术语在这一页正式给出</b>：<b>g(η) = E[T(y);η]</b> 叫 <b>canonical response function（正则响应函数）</b>；<b>g⁻¹</b> 叫 <b>canonical link function（正则连接函数）</b>。<b>高斯的响应函数是恒等，伯努利的响应函数是逻辑函数。</b>", "<b>脚注的提醒别漏</b>：<em>Many texts use g to denote the link function, and g⁻¹ to denote the response function</em>——<b>很多书的叫法和这里正好相反</b>。"], "tbl": [{"cap": "「为什么用 sigmoid」的三个答案 · 从浅到深", "head": ["层次", "答案", "问题"], "rows": [["浅", "它把实数压到 (0,1)，能当概率", "<b>任何 S 形函数都做得到</b>"], ["中", "它的导数 g′=g(1−g) 好算", "方便，但不是理由"], ["<b>深</b>", "<b>它是伯努利分布的正则响应函数</b>", "<b>这才是出处</b>"]]}], "say": "⭐ 这张表值得单独记。<b>考试问「为什么用 sigmoid」时，绝大多数答案停在第一层</b>，而第一层<b>其实不构成理由</b>——tanh 映射后平移缩放也能到 (0,1)，arctan 也行。<b>第三层才是真正的答案。</b>但也别把话说满：<b>讲义自己用的是 “this gives <b>one</b> answer”（给出了一个答案），不是唯一答案</b>。<b>另一条同样正当的路径是最大熵</b>：在「只约束均值」的条件下熵最大的二元分布就是伯努利，对应的也是 sigmoid。<b>答题时写「这是 GLM 框架给出的答案」比写「这就是唯一原因」稳妥。</b>", "ng": "Ng 在 L4 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=3118s\" target=\"_blank\">51:58</a> 给出连接函数的说法：<em>you can go from Mu back to Eta with the inverse of this, and this is also called the canonical link function</em>。⭐ 另外他在 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=3186s\" target=\"_blank\">53:06</a> 把三族的「常用参数」并排列了一遍——<b>伯努利是 φ、高斯是 µ 和 σ²、泊松是 λ</b>，然后在 <a href=\"https://www.youtube.com/watch?v=iZTeva0WSTQ&t=3514s\" target=\"_blank\">58:34</a> 给了实践建议：<em>most of the times that choice is pretty obvious — if you want to model the number of visitors to a website which is like a count [use Poisson]</em>。<b>「选哪个分布」通常看 y 的类型就定了，不用纠结。</b><span class=\"src\">CS229/transcripts/L4.txt · 本地已下载</span>", "exam": "本课 M1T3 第 13 页引入 sigmoid 时<b>只给了「把得分压成概率」这个理由</b>（第一层）。⭐ <b>所以这一页是明确的「超纲加分项」</b>：在「解释逻辑回归为什么这样设计」类的大题里补一句「<b>sigmoid 是伯努利分布在 GLM 框架下的正则响应函数，不是任意选的</b>」，是能把答案和其他人拉开的那种句子。⚠️ <b>但别喧宾夺主</b>——先把课件要求的内容答完整（z 的含义、概率解释、BCE、决策阈值），<b>再补这一句</b>。"}, {"r": [25, 26], "star": 1, "t": "多项分布写成指数族：靠一个指示函数", "one": "k 个类只用 k−1 个参数；T(y) 变成 one-hot 向量。", "quote": "<em>However, these parameters would be redundant … (since knowing any k−1 of the φᵢ's uniquely determines the last one, as they must satisfy Σφᵢ = 1).</em>", "eq": "T(1)=[1,0,…,0]ᵀ, T(2)=[0,1,…,0]ᵀ, …, T(k−1)=[0,…,0,1]ᵀ, <b>T(k)=[0,0,…,0]ᵀ</b>\n(T(y))ᵢ = 1{y = i}\nE[(T(y))ᵢ] = P(y=i) = φᵢ\n\nηᵢ = log(φᵢ/φ_k),  i = 1..k−1   （并约定 η_k = 0）\n反解 ⇒ φᵢ = e^{ηᵢ} / Σⱼ e^{ηⱼ}", "pts": ["⭐ <b>为什么是 k−1 个参数不是 k 个</b>：因为 Σφᵢ = 1，<b>知道了前 k−1 个，最后一个就定死了</b>。讲义说 φ_k <em>is <b>not a parameter</b></em>，它是被前面那些<b>完全决定</b>的。", "<b>T(y) 不再等于 y</b>，这是全讲义<b>第一次</b> T(y) ≠ y。它是个 k−1 维的 <b>one-hot 向量</b>，而且 <b>T(k) 是全零向量</b>（第 k 类不单独占一位）。", "<b>指示函数 1{·}</b>：条件为真取 1，为假取 0。讲义举例 1{2=3}=0、1{3=5−2}=1。有了它，<b>(T(y))ᵢ = 1{y=i}</b> 一行写完。<b>这是第 16 页那个 h^y(1−h)^{1−y} 开关技巧的推广。</b>", "<b>反解那三行代数值得跟一遍</b>：从 e^{ηᵢ} = φᵢ/φ_k 出发，两边乘 φ_k 得 φᵢ = φ_k e^{ηᵢ}；<b>对 i 求和</b>，左边是 1，所以 φ_k Σe^{ηᵢ} = 1，<b>于是 φ_k = 1/Σe^{ηᵢ}</b>；代回去就得到 softmax。<b>关键动作是「求和用掉归一化条件」。</b>"], "tbl": [{"cap": "k 类问题里的「少一个」现象 · 三处表现", "head": ["对象", "总共", "<b>独立的只有</b>", "原因"], "rows": [["参数 φ", "k 个", "<b>k−1 个</b>", "Σφᵢ = 1"], ["自然参数 η", "k 个", "<b>k−1 个</b>", "约定 η_k = 0"], ["参数向量 θ", "k 个", "<b>k−1 个</b>", "约定 θ_k = 0"]]}], "say": "⭐ <b>这个「少一个」的现象有个实践上的后果</b>：实际的 softmax 实现（PyTorch、sklearn）<b>几乎都用 k 个 θ 而不是 k−1 个</b>，因为写起来对称、好向量化。代价是<b>参数不唯一</b>——给所有 θᵢ 同时加上同一个向量 c，所有 e^{θᵢᵀx} 都乘了 e^{cᵀx}，<b>分子分母同时变，概率完全不变</b>。这叫 <b>over-parameterization（过参数化）</b>。<b>讲义用 θ_k = 0 的约定就是为了把这个自由度钉死</b>。⚠️ <b>这也是逻辑回归不需要两组参数的原因
