<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M3 T1 · 神经网络：一个神经元、一次前向传播、一次学习步 · 逐页精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}
.qbadge.bad{color:var(--warn)}
#wrongBox .tally{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
#wrongBox .tally span{border:1px solid var(--line);border-radius:8px;padding:5px 11px;
  font-size:12.5px;color:var(--dim);background:var(--sunken)}
#wrongBox .tally b{color:var(--ink);font-weight:650}
#wrongBox .tally b.hot{color:var(--warn)}
.wrow .h{gap:3px}
.wrow .h u{display:flex;gap:2px;text-decoration:none;
  padding-right:7px;margin-right:4px;border-right:1px solid var(--line)}
.wrow .h u:last-child{border-right:0;padding-right:0;margin-right:0}
#revChip{display:none;align-items:center;gap:9px;border:1px solid var(--warn);
  border-radius:8px;padding:5px 11px;font-size:12.5px;color:var(--warn);
  background:var(--tintwarn2);white-space:nowrap}
#revChip.on{display:inline-flex}
#revChip b{font:650 12px var(--mono)}
#revChip button{background:none;border:0;color:var(--dim);cursor:pointer;
  font:12px var(--cjk);text-decoration:underline;padding:0}
#revChip button:hover{color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default}
.btn:disabled:hover{border-color:var(--line)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qhist{font:11px var(--mono);color:var(--dim);margin-top:8px;display:flex;
  align-items:center;gap:5px}
.qhist i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.qhist i.o{background:var(--acc)} .qhist i.x{background:var(--warn)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
#strip b.err{background:var(--errdot)}
#strip b.err.on{background:var(--acc2)}
/* 错题本 */
#wrongPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#wrongPanel.on{display:flex}
#wrongBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(760px,100%);max-height:84vh;overflow:auto;padding:22px 24px}
#wrongBox h3{margin:0 0 4px;font-size:18px}
#wrongBox .sub{color:var(--dim);font-size:13px;margin:0 0 16px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;
  border:1px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--sunken)}
.wrow:hover{border-color:var(--acc2)}
.wrow .p{font:700 12px var(--mono);color:var(--acc2);flex:0 0 52px}
.wrow.done{opacity:.5}
.wrow.done .p{color:var(--acc)}
.wrow .n2{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.wrow .s{font:11.5px var(--mono);color:var(--dim);flex:0 0 auto}
.wrow .h{display:flex;gap:3px;flex:0 0 auto}
.wrow .h i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.wrow .h i.o{background:var(--acc)} .wrow .h i.x{background:var(--warn)}
#wrongBox .none{color:var(--dim);text-align:center;padding:30px 0;line-height:2}
#wrongFoot{display:flex;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line)}
#wrongFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ EXTRA_CSS:BEGIN ══ */
/* ══ 讲解区里的链接兜底 ══
   ⚠ 2026-10-03 查出来的：原先只给 .ng a 上了色，放在 tip / say / pts / exam 里的链接
   会退回浏览器默认的 #0000EE —— 浅色下还能看（8.47:1），**暗色下只有 1.95:1**。
   做 notes2 时第一次往 tip 里放时间码链接就撞上了。这条规则管住所有其它位置。 */
#card a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
#card a:hover{opacity:.75}

/* ══ 「从零补基础 · Andrew Ng」栏 ══ */
.ng{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintviolet)}
.ng .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--violet);
  letter-spacing:.4px;margin-bottom:5px}
/* ⚠ 要用 #card .ng a 而不是 .ng a —— 上面的兜底规则带了 #card 这个 id，
   光写 .ng a（0,1,1）会被 #card a（1,0,1）压过去，紫色链接会变蓝。 */
#card .ng a{color:var(--violet);text-decoration:none;border-bottom:1px solid var(--violet)}
#card .ng a:hover{opacity:.75}
.ng .src{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
:root:not([data-theme="dark"]) .ng{box-shadow:var(--shadow)}

/* ══ 「课件原话」栏：引官方英文 ══ */
.quote{border-left:3px solid var(--dim);background:var(--lift2);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;font-size:13px;line-height:1.7;color:var(--ink3)}
.quote .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--dim);
  letter-spacing:.4px;margin-bottom:5px}
.quote b{color:var(--ink2)}
.quote em{font-style:normal;color:var(--ink2);font-weight:560}

/* ══ 笔记表格：对比表 / 情况表 / 数值表 ══ */
.tw{margin:13px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tc{font-size:11.5px;font-family:var(--mono);color:var(--dim);letter-spacing:.3px;
  padding:7px 12px;background:var(--sunken);border-bottom:1px solid var(--line)}
table.nt{width:100%;border-collapse:collapse;font-size:12.8px;line-height:1.55}
table.nt th{text-align:left;font-weight:620;font-size:11.5px;color:var(--dim);
  background:var(--panel2);padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
table.nt td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.nt tbody tr:last-child td{border-bottom:none}
table.nt td:first-child{font-weight:560;color:var(--ink2)}
table.nt b{color:var(--ink2)}
:root:not([data-theme="dark"]) .tw{box-shadow:var(--shadow)}

/* ══ 「与考试的联系」栏 ══ */
.exam{border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintacc2)}
.exam .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--acc2);
  letter-spacing:.4px;margin-bottom:5px}
:root:not([data-theme="dark"]) .exam{box-shadow:var(--shadow)}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}
/* ══ EXTRA_CSS:END ══ */

</style>
</head>
<body data-key="cs234-2019-l01">

<div id="bar">
  <h1>M3 T1 · <span>神经网络：一个神经元、一次前向传播、一次学习步</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 35</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <span id="revChip">复习模式 <b></b><button id="revOff">退出</button></span>
  <button class="btn" id="wrongBtn">错题本</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="wrongPanel"><div id="wrongBox">
  <h3>错题本</h3>
  <p class="sub">错过的题<b>连着答对两次就毕业</b>，自动从这里和复习模式里退出。<br>
  还没毕业的排在前面，最近错得多的更靠前。点任意一行跳到那一页重看。</p>
  <div class="tally" id="wrongTally"></div>
  <div id="wrongList"></div>
  <div id="wrongFoot">
    <button class="btn" id="revOn">只复习这些页</button>
    <button class="btn" id="wrongClose">关闭</button>
    <button class="btn" id="wrongReset">清空全部记录</button>
  </div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示课件？</b></p>
      <p>本页直接引用同目录下的 <code>slides/M3T1_NeuralNetworks.pdf</code>。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>精读</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/M3T1-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say CS229 / 讲义补充（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {"1": [{"q": "M3 T1 的副标题「one neuron, one forward pass, one learning step」说明了什么？", "o": ["每个网络只能有一个输出", "神经网络只需要训练一步就能收敛", "这一讲只讲一个神经元的网络，多层网络完全不涉及", "三个「one」对应课件的三节：神经元长什么样、怎么算出预测、怎么改一次参数"], "a": 3, "why": "副标题就是提纲：<b>one neuron</b>（01 节）、<b>one forward pass</b>（前向传播）、<b>one learning step</b>（03 节）。⚠ 注意 p11–p18 确实讲了多层和 XOR，所以第一个选项不对；它只是不讲多层的<b>训练</b>（那是 T2）。"}], "2": [{"q": "课件把「sensitivity（敏感度）」解释成什么？", "o": ["训练集和测试集的差距", "模型对噪声的鲁棒程度", "损失函数的最小值", "把一个权重轻轻推一下，看预测动了多少"], "a": 3, "why": "课件原话：<em>nudge a weight a little and see how much the prediction moves</em>。⭐ 这就是<b>导数</b>的大白话说法，p23 会把它写成 Δf ≈ (∂f/∂u)·Δu。"}, {"q": "贯穿整个 T1 的那个算例，初始设置是什么？", "o": ["x = (1, 2)，y = 1，w = (0.2, 0.4)，b = 0.1", "x = (1, 1)，y = 1，w = (0.5, 0.5)，b = 0", "x = (2, 1)，y = 0，w = (0.4, 0.2)，b = 0.5", "x = (0, 1)，y = 0，w = (0.1, 0.1)，b = 0.1"], "a": 0, "why": "课件 p2 给的是 <em>inputs x = (1, 2), target y = 1, weights 0.2 and 0.4, bias 0.1</em>。⭐ 后面二十多页所有数字（z=1.1、p=0.7503、L=0.2873、δ=−0.2497）都从这四个数算出来。"}], "4": [{"q": "一个神经元的三步配方是什么？", "o": ["前向传播、反向传播、更新参数", "每个输入乘权重、连同偏置求和、过激活函数", "初始化、训练、预测", "归一化、线性变换、输出"], "a": 1, "why": "课件 <em>The recipe</em>：① Multiply each input by its weight ② Add them up with the bias ③ Apply an activation function。⭐ 网络里每个神经元做的都是这三步。"}, {"q": "在一个神经元里，下面哪一组是「参数」？", "o": ["分数 z 和激活输出 a", "输入 x 和分数 z", "权重 w 和偏置 b", "激活函数 g 和阈值 0.5"], "a": 2, "why": "课件原话：<em>The weights and bias are parameters; everything else is computed.</em> ⚠ z 和 a 每次前向都重算，激活函数是<b>规则</b>不是参数，输入是数据。"}], "6": [{"q": "x=(1,2)、w=(0.2,0.4)、b=0.1，前向传播得到的分数 z 是多少？", "o": ["1.3", "1.1", "0.6", "0.7503"], "a": 1, "why": "z = 0.2×1 + 0.4×2 + 0.1 = 0.2 + 0.8 + 0.1 = <b>1.1</b>。⚠ 0.7503 是过了 sigmoid 之后的 p，不是 z——这两者混淆是最常见的错误。"}, {"q": "课件说「The chance and the label are different things」，指的是什么？", "o": ["概率必须大于 0.9 才能作出判断", "训练集的标签和测试集的标签不同", "标签只能取 0 或 1，概率可以取负数", "p = 0.7503 是模型估计的概率，而「类别 1」是把它与 0.5 比较后作出的决定"], "a": 3, "why": "⭐ 概率是模型的输出，标签是对概率施加阈值后的<b>决定</b>。这个区分是 p20（为什么不用准确率）和 T3（阈值与 ROC）的共同起点。"}], "8": [{"q": "把两个权重都设为 0、偏置设为 5，模型对任何输入都给出 p = 0.9933。这说明什么？", "o": ["偏置的值应该永远设为 0", "这个模型已经完美学会了任务", "高置信度可以在完全不看输入、也没有训练的情况下产生，所以置信度不是学习的证据", "sigmoid 函数有缺陷，应该换成 ReLU"], "a": 2, "why": "⭐ w = 0 意味着输出完全不依赖输入，模型退化成常数预测器。课件给的真正证据标准是：<b>参数从数据更新出来，且在模型没见过的数据上对照已知目标检验过</b>。"}], "11": [{"q": "为什么单个 sigmoid 神经元无法解决 XOR？", "o": ["因为 sigmoid 的输出范围只有 0 到 1", "因为 XOR 的输入必须是连续值", "因为训练时间不够长", "因为它的决策边界是一条直线，而 XOR 中同类的点位于对角线上，任何直线都会把它们混在一起"], "a": 3, "why": "课件原话：<em>opposite corners share a class: every straight line mixes them</em>。⚠ 这是<b>表达能力</b>的限制，训练再久也无法解决。"}, {"q": "课件说「Training changes which errors occur, not what the model can represent」，这句话的含义是？", "o": ["训练次数越多，错误类型越少", "训练只能移动和旋转那条决策直线，无法把它掰弯或增加一条", "训练会逐渐改变模型的结构", "模型的表达能力随训练轮数增长"], "a": 1, "why": "⭐ 训练改变的是 w 和 b，也就是直线的<b>位置和方向</b>；直线永远是直的、永远只有一条。要改变表达能力，必须改<b>结构</b>（加隐藏层）。"}], "13": [{"q": "课件约定 w_ji 的下标怎么读？", "o": ["第一个是行号，第二个是训练轮数", "第一个下标是输入方，第二个是接收方", "第一个下标是接收方，第二个是输入方", "两个下标都表示层号"], "a": 2, "why": "课件原话：<em>first index is the receiver, second the input</em>。⭐ 这个顺序来自矩阵乘法 h = Wx——W 的<b>行</b>对应接收方，<b>列</b>对应输入方。"}, {"q": "一个网络有 3 个输入、一个 4 单元的隐藏层、1 个输出单元（全连接），共有多少个参数？", "o": ["16", "21", "17", "12"], "a": 1, "why": "输入→隐藏：3×4 = 12 个权重 + 4 个偏置；隐藏→输出：4×1 = 4 个权重 + 1 个偏置。合计 <b>12+4+4+1 = 21</b>。⚠ 两个必错点：<b>漏掉偏置</b>，或<b>给输入层也加偏置</b>。"}], "14": [{"q": "关于 sigmoid 和 ReLU 的分工，哪一项是课件的说法？", "o": ["ReLU 只能用在输入层", "sigmoid 用在隐藏层造折弯，ReLU 用在输出层给概率", "sigmoid 用在输出层让答案能当概率读，ReLU 用在隐藏层廉价地造折弯", "两者可以随意互换，没有区别"], "a": 2, "why": "课件原表：Sigmoid <em>at the output, so the answer reads as a probability</em>；ReLU <em>in hidden layers, to create bends cheaply</em>。"}, {"q": "σ(0) 等于多少？这个值解释了什么？", "o": ["0.25，解释了 sigmoid 导数的最大值", "0.5，解释了为什么「p ≥ 0.5 判为类别 1」恰好等价于「z ≥ 0」", "0，解释了为什么负分会被截断", "1，解释了为什么概率有上界"], "a": 1, "why": "⭐ σ(0) = 0.5，所以阈值 0.5 这条线正好落在 z = 0 处，而 z = 0 就是方程 w₁x₁+w₂x₂+b = 0 画出的那条决策边界。⚠ 0.25 确实是 p(1−p) 的最大值，但那是另一件事。"}], "18": [{"q": "两层都不加激活：h = 2x + 1，s = 3h + 4。合起来是什么？", "o": ["一条抛物线 s = 6x² + 7", "无法合并，必须分两步算", "一个折线，在 x = −0.5 处折弯", "一条直线 s = 6x + 7，和单层没有区别"], "a": 3, "why": "代入展开：s = 3(2x+1) + 4 = 6x + 3 + 4 = <b>6x + 7</b>。⭐ 课件的结论：<em>Stacking weighted sums buys nothing new.</em> 无论堆多少层，没有非线性就等价于一层。"}, {"q": "把 h 换成 max(0, 2x + 1) 之后会发生什么？", "o": ["结果仍然是一条直线，只是斜率变了", "在 x = −0.5 处出现一个折点，产生任何单条直线都复制不了的形状", "输出被限制在 0 到 1 之间", "函数变得不连续"], "a": 1, "why": "⭐ 2x+1 在 x = −0.5 处由负转正，所以 ReLU 在那里从「恒为 0」转为「跟着 x 涨」，出现折点。课件：<em>Many bent units, combined by the next layer, draw flexible shapes.</em>"}], "20": [{"q": "y = 1、p = 0.750260 时，二元交叉熵损失 L 等于多少？", "o": ["0.750260", "0.187370", "0.287335", "0.250260"], "a": 2, "why": "y = 1 时第二项消失，L = −log p = −ln(0.750260) = <b>0.287335</b>。⚠ 用自然对数 ln，不是 log₁₀。0.187370 是 p(1−p)，0.250260 是 1−p，都是干扰项。"}, {"q": "为什么训练用损失而不用准确率作为目标？", "o": ["准确率计算太慢", "损失的数值范围更小", "准确率分不出 p=0.75 和 p=0.90 的好坏，而且它是阶梯函数、几乎处处导数为 0，无法提供梯度", "准确率只能用于二分类"], "a": 2, "why": "⭐ 两个理由缺一不可：① 分辨力（L(0.75)=0.287 vs L(0.90)=0.105）② <b>可导性</b>。课件：<em>Learning keeps a signal even when the label is already right.</em>"}], "22": [{"q": "w₂ 从 0.40 动到 0.41（动了 0.01），v = w₂x₂ 和 z 各动了多少？", "o": ["v 动 0.02，z 也动 0.02", "v 动 0.01，z 动 0.01", "v 动 0.01，z 动 0.02", "v 动 0.02，z 动 0.04"], "a": 0, "why": "乘法把扰动放大 x₂ = 2 倍，所以 v 动 0.02；加法不改变扰动大小，所以 z 也动 0.02。⭐ 这正是 p23 那两条规则的实例。"}, {"q": "计算图上的 u 和 v 是什么？", "o": ["两个隐藏层神经元", "算出来的中间乘积，训练不会直接修改它们", "输入数据的归一化版本", "两个新的可训练参数"], "a": 1, "why": "课件原话：<em>u and v are computed products, not new parameters.</em> ⭐ 呼应 p4：<b>只有 w 和 b 是参数</b>。"}], "23": [{"q": "sigmoid 的导数 ∂p/∂z 等于什么？课件为什么特别注明「needs p from the same forward pass」？", "o": ["等于 z(1−z)，只需要分数", "等于 p，因为它要重新算一次指数", "等于 p(1−p)，而这个 p 必须是同一次前向传播算出的那个值", "等于 1−p，与前向传播无关"], "a": 2, "why": "⭐ σ′(z) = p(1−p)，本例 = 0.750260 × 0.249740 = <b>0.187370</b>。⚠ 必须用同一次前向的 p，这正是「反向传播必须紧接前向传播」的原因。"}], "24": [{"q": "∂p/∂w₂ 沿路径 w₂ → v → z → p 相乘，结果是多少？", "o": ["0.374740", "0.499480", "0.249740", "0.187370"], "a": 0, "why": "三段：×x₂ = 2（乘法）、×1（加法）、×0.187370（sigmoid）。乘积 = 0.187370 × 1 × 2 = <b>0.374740</b>。验算：w₂ 动 0.01 预测让 p 动 0.003747，实测 0.003729，吻合。"}, {"q": "当一个量通过多条路径影响输出时，各条路径的贡献该怎么处理？", "o": ["把各条路径的贡献相乘", "取平均值", "取最大的那一条", "把各条路径的贡献相加"], "a": 3, "why": "课件：<em>When paths branch, add</em>——q 喂给 r = 2q 和 t = 3q 且 F = r + t 时，dF/dq = 2 + 3 = <b>5</b>。⚠ <b>沿一条路径相乘、不同路径相加</b>，这两条规则就是反向传播的全部数学。"}], "25": [{"q": "已知把 w₂ 调大会让 p 上升。这是好事还是坏事？", "o": ["无法判断，需要更多数据", "总是好事，因为预测更有把握", "总是坏事，因为会过拟合", "取决于目标值 y：y=1 时降低损失，y=0 时反而抬高损失"], "a": 3, "why": "⭐ 敏感度 ∂p/∂w₂ 只说「动多少」，方向要靠 ∂L/∂w₂ = (∂L/∂p)×(∂p/∂w₂) 里的<b>第一个因子</b>，而它携带目标 y 的信息。"}], "27": [{"q": "反向传播和梯度下降的分工是什么？", "o": ["两者是同一个算法的两个名字", "反向传播更新权重，梯度下降计算斜率", "反向传播用于训练，梯度下降用于预测", "反向传播计算梯度，梯度下降照着梯度迈出那一步"], "a": 3, "why": "课件原话：<em>Backpropagation computes the slope. Gradient descent takes the step. Computing a slope moves nothing by itself.</em> ⚠ 这是经典陷阱题——<b>反向传播本身不改任何参数</b>。"}], "29": [{"q": "sigmoid 配二元交叉熵时，δ = ∂L/∂z 化简后等于什么？", "o": ["p − y", "p(1−p)", "y − p", "−1/p"], "a": 0, "why": "⭐ (∂L/∂p)×(∂p/∂z) = (−1/p) × p(1−p) = −(1−p) = <b>p − y</b>（y=1 时）。本例 δ = 0.750260 − 1 = −0.249740。⚠ 注意是 p − y 不是 y − p，符号反了梯度方向就反了。"}, {"q": "本例中 ∂L/∂w₂ = −0.499480，恰好是 ∂L/∂w₁ 的两倍，原因是什么？", "o": ["因为 ∂L/∂wᵢ = δ·xᵢ，而 x₂ = 2 是 x₁ 的两倍", "因为 w₂ 的初始值是 w₁ 的两倍", "因为第二个权重更重要", "因为学习率对 w₂ 加倍了"], "a": 0, "why": "⭐ 梯度公式是 δ·xᵢ，δ 对所有参数相同，差别全在输入值。<b>输入越大的那个权重，梯度也越大</b>。⚠ 和权重自身的初始值无关。"}], "31": [{"q": "η = 0.1、∂L/∂w₁ = −0.249740 时，更新后的 w₁ 是多少？", "o": ["0.175026", "0.224974", "0.249740", "0.200000"], "a": 1, "why": "w₁ ← 0.2 − 0.1×(−0.249740) = 0.2 + 0.024974 = <b>0.224974</b>。⚠ 梯度是负的，<b>减去负数等于加上正数</b>，所以参数变大。0.175026 是错用加号的结果。"}, {"q": "课件说这次更新「improved, on this one example only」，强调的是什么？", "o": ["这次更新的改善幅度很小", "只有第一次更新有效", "梯度是按这一个样本的损失算的，不保证其他样本或整体平均损失也改善", "学习率太小导致改善有限"], "a": 2, "why": "⭐ 这正是「批量」存在的理由——真实训练对一批样本的<b>平均</b>损失求梯度（T2 的内容）。⚠ 扩展题答完计算后补这一句，往往是最后一个得分点。"}], "32": [{"q": "更新规则里为什么用减号？", "o": ["因为梯度指向损失升高的方向，减去它才是往损失降低的方向走", "因为梯度总是负数", "这是约定俗成，用加号也可以", "因为学习率是负数"], "a": 0, "why": "⭐ 课件：<em>the gradient points towards higher loss. Subtract it and you walk towards lower loss, at least locally.</em> 用加号时 w₁ 会变成 0.175026，p 下降，y=1 时损失反而上升。"}, {"q": "课件说「downhill is a local promise」，并指出什么风险？", "o": ["梯度可能计算错误", "损失函数可能没有最小值", "步子迈得太大可能跨过谷底、落到损失更高的地方", "局部最优一定不是全局最优"], "a": 2, "why": "⭐ 梯度只在当前点附近可信（p23 已经用 u² 的例子演示过）。课件结论：<em>Direction comes from the gradient; distance comes from η. Both matter.</em>"}], "34": [{"q": "一次训练步中，下面哪一项会被优化器更新？", "o": ["权重和偏置", "激活值和预测值", "输入数据和目标标签", "激活函数的形式"], "a": 0, "why": "课件三行表：<b>权重和偏置</b>被更新；激活和预测是<b>下次前向时重算</b>的；输入和目标<b>固定</b>；而激活函数是<b>规则</b>不是参数（p14 已强调）。"}], "35": [{"q": "课件最后那张总图把一次训练步分成哪五步？", "o": ["Predict → Target → Gradients → Update → Check", "采样 → 计算损失 → 求导 → 正则化 → 收敛", "数据划分 → 训练 → 验证 → 测试 → 部署", "初始化 → 前向 → 反向 → 更新 → 评估"], "a": 0, "why": "⭐ 这五格就是扩展题「描述一次训练步」的满分提纲。⚠ 很多人算完 Update 就停了，<b>漏掉 Check 会丢完整性分</b>——课件专门用 p31 一整页讲这一步。"}]};

var N = [{"r": [1, 1], "t": "这一讲的承诺就写在副标题里", "star": 1, "one": "一个神经元、一次前向传播、一次学习步 —— 整讲只围着这三件事转。", "quote": "<b>Neural networks</b> — <em>One neuron, one forward pass, one learning step</em>（M3 Topic 1）", "pts": ["<b>副标题是这一讲最好的提纲</b>：<em>one neuron</em>（一个神经元长什么样）、<em>one forward pass</em>（怎么从输入算到预测）、<em>one learning step</em>（怎么改一次参数）。课件后面正好分成 01/02/03 三节，一一对应。", "⚠️ <b>注意三个「one」都是单数</b>。这一讲<b>不讲多层网络怎么训练</b>（那是 T2），也<b>不讲怎么评估</b>（那是 T3）。它只把<b>一个</b>神经元、<b>一次</b>计算、<b>一步</b>更新讲到底。", "<b>为什么这样安排很聪明</b>：神经网络给人的压迫感来自「层数多、参数多」，但<b>每个神经元做的事完全一样</b>。把一个讲透，剩下的只是重复和连接。", "⚠️ <b>原课件第 36 页是纯校徽页</b>，裁页时已去掉，所以这份精读是 35 页，页码与原课件 1–35 页一一对应，<b>没有偏移</b>。"], "exam": "M3 测验 110 分钟、20 选择（每题 3 分）+ 4 道扩展题（每题 10 分），<b>开卷</b>。这一页本身不出题，但它定了 T1 的答题框架：问到「神经网络怎么学」，就按<b>前向 → 损失 → 梯度 → 更新 → 再检查</b>这条链写。", "tip": {"t": "开卷怎么用", "v": "开卷不等于不用背。<b>110 分钟做 24 题，平均每题不到 5 分钟</b>，翻书的时间很贵。这份精读的价值是让你知道<b>每个概念在课件第几页</b>，而不是考场上现读。", "w": 0}}, {"r": [2, 2], "t": "五个词串起整个学习过程", "star": 3, "one": "Neuron → Network → Sensitivity → Learning signal → Update，这五个词就是 T1 的全部骨架。", "quote": "<b>Neuron:</b> one small unit turns numbers into an output. <b>Weight, add bias, activate.</b> … <b>Sensitivity:</b> nudge a weight a little and see how much the prediction moves. … <b>Update:</b> take one small step, then check the new prediction.", "pts": ["<b>Neuron（神经元）</b>：一个小单元把一堆数变成一个输出。课件把它拆成三个动作——<em>Weight</em>（给每个输入配个权重乘上去）、<em>add bias</em>（加上偏置）、<em>activate</em>（过一个激活函数）。⭐ <b>这三个动作就是「神经元」的全部定义</b>，没有更玄的东西。", "<b>Network（网络）</b>：课件的说法是 <em>units connected in layers can draw shapes one unit cannot</em>——<b>连成层之后能画出单个单元画不出的形状</b>。⚠️ 注意它说的是「形状」（shapes），指的是<b>决策边界的形状</b>，这正是第 11、12、18 页要展开的。", "<b>Sensitivity（敏感度）</b>：<em>nudge a weight a little and see how much the prediction moves</em>——<b>把一个权重轻轻推一下，看预测动了多少</b>。⭐ <b>这就是「导数」的大白话定义</b>，而且课件一直用这个说法，不用「求导」吓人。", "<b>Learning signal（学习信号）</b>：<em>the target and the loss say which way each weight should move</em>——<b>目标值和损失告诉你每个权重该往哪边动</b>。⚠️ 关键在于<b>敏感度只说「动了多少」，不说「该往哪动」</b>；要知道方向，必须有目标 y。这是第 25 页的主题。", "<b>Update（更新）</b>：<em>take one small step, then check the new prediction</em>——<b>迈一小步，然后检查新的预测</b>。⚠️ <b>「检查」这一步常被忽略</b>，但课件第 31 页专门用一页做这件事。"], "tbl": [{"cap": "五个词 ↔ 它在课件哪一节展开", "head": ["词", "大白话", "展开在"], "rows": [["Neuron", "乘权重、加偏置、过激活", "01 节（p4–p7）"], ["Network", "连成层能画出更复杂的边界", "p11–p13、p18"], ["Sensitivity", "推一下看动多少 = 导数", "02 节（p22–p24）"], ["Learning signal", "有了目标才知道往哪动", "p25、p29–p30"], ["Update", "迈一小步再检查", "03 节（p31–p35）"]]}], "say": "<b>这一页还埋了一个贯穿全讲的算例，务必记住</b>：<em>inputs x = (1, 2), target y = 1, weights 0.2 and 0.4, bias 0.1</em>。⭐ <b>后面 20 多页所有的数字都是从这四个数算出来的</b>——z=1.1、p=0.7503、L=0.2873、δ=−0.2497、更新后 p=0.7773。<b>把这个算例从头到尾手算一遍，T1 就通了一大半。</b>", "exam": "⭐ <b>这一页几乎一定会以某种形式出现在扩展题里</b>。扩展题常见问法是「描述一次训练步里发生了什么」，<b>按这五个词分五段写</b>，每段点出它用到的量，就是满分结构。⚠️ 考纲原话：<em>A correct final number alone may not demonstrate the required understanding</em>——<b>只给对数字不够，要写出中间步骤和理由</b>。"}, {"r": [3, 3], "t": "第 01 节：一个神经元，一次预测", "star": 1, "one": "分节页。接下来 p4–p9 只做一件事：把「一个神经元怎么算出一个预测」讲到底。", "pts": ["<b>这是分节页</b>，本身没有知识点，但它标出了课件的三段式结构：<b>01 一个神经元一次预测</b>（p3–p9）、<b>02 从敏感度到梯度</b>（p19–p25）、<b>03 一次学习步</b>（p26–p35）。", "⚠️ <b>中间 p10–p18 不属于任何编号节</b>，是插在 01 和 02 之间的一段「为什么需要多个神经元」。做笔记时容易漏掉这一段，但 <b>XOR 和「层为什么需要非线性」几乎必考</b>。", "<b>记住这个三段结构的好处</b>：扩展题问「神经网络如何从数据中学习」，你可以直接按 <b>预测（01）→ 算敏感度（02）→ 更新（03）</b> 三段展开，结构天然完整。"], "exam": "分节页不出题。但<b>这三节的标题就是扩展题的三个小标题</b>，照抄能让阅卷人一眼看到结构。"}, {"r": [4, 5], "t": "神经元只有三个动作：乘、加、激活", "star": 3, "one": "a = g(w₁x₁ + w₂x₂ + w₃x₃ + b)：先加权求和得到分数 z，再过一个激活函数。", "quote": "<b>The recipe:</b> 1. Multiply each <b>input</b> by its <b>weight</b> 2. Add them up with the <b>bias</b> 3. Apply an <b>activation function</b>. … <b>The weights and bias are parameters; everything else is computed.</b>", "eq": "z = w₁x₁ + w₂x₂ + b\na = g(z)", "pts": ["<b>三步配方（the recipe）</b>：① 每个输入乘上它自己的权重 ② 连同偏置一起加起来 ③ 过一个激活函数。⭐ <b>整个神经网络里，每一个神经元做的都是这三步，一个例外都没有。</b>", "<b>中间那个和叫「分数」z</b>（课件用 score 这个词）。<b>z 是线性的</b>——它就是输入的加权和。⚠️ <b>非线性全部来自第三步那个 g</b>，这一点在第 18 页会变成一个关键论证。", "⭐ <b>这一页最该记住的是最后那句话</b>：<em>The weights and bias are parameters; everything else is computed.</em>——<b>权重和偏置是参数，其余一切都是算出来的</b>。", "<b>为什么这句话重要？</b>因为它划清了「什么会被训练改变」和「什么只是中间结果」。<b>训练只动 w 和 b</b>；z、a、p 这些每次前向传播都会重新算一遍，<b>不存储、也不被直接修改</b>（第 34 页会把这件事做成一张表）。", "<b>偏置 b 为什么单独列出来</b>：它不乘任何输入，是一个「无条件加上去的量」。⭐ 几何上它<b>决定决策边界离原点多远</b>——权重决定边界的方向，偏置决定它的位置。", "<b>p5 是同一件事的干净版</b>：三个输入、三个权重、一个偏置、一个 Σ、一个 g(·)，最后输出 a。课件在图下方标了三个标签 <em>Weight / Add bias / Activate</em>，和配方的三步严格对齐。"], "tbl": [{"cap": "一个神经元里，哪些是参数、哪些是算出来的", "head": ["符号", "是什么", "训练时会变吗"], "rows": [["x₁, x₂, …", "输入（数据）", "不变，数据是参照物"], ["<b>w₁, w₂, …</b>", "<b>权重，参数</b>", "<b>会被更新</b>"], ["<b>b</b>", "<b>偏置，参数</b>", "<b>会被更新</b>"], ["z", "加权和（分数）", "每次前向重算"], ["a 或 p", "激活后的输出", "每次前向重算"]]}], "say": "<b>把它和 M1 学过的东西接上</b>：<em>z = w₁x₁ + w₂x₂ + b</em> <b>就是 M1 T3 里那个线性得分</b>，一模一样。感知机在它外面套一个符号函数，逻辑回归在它外面套 sigmoid。⭐ <b>所以「一个用 sigmoid 的神经元」和「逻辑回归」在数学上是同一个东西</b>——这不是巧合，课件第 12 页会直接用这一点来论证单个神经元的局限。<b>神经网络的新东西不在单个神经元，而在把它们连起来。</b>", "exam": "⭐ <b>选择题高频</b>：给一组 w、b、x 让你算 z 或 a；或者问「下面哪个是参数」（答案是 w 和 b，不是 z、不是 a、不是 x）。⚠️ <b>扩展题里写「神经元做了什么」时，必须三步都写全</b>，只写「加权求和」会丢激活那一步的分。", "tip": {"t": "最容易丢分的一点", "v": "⚠️ <b>别把 z 和 a 混为一谈</b>。z 是加权和（可以是任意实数），a 是激活后的输出（sigmoid 之后一定在 0 到 1 之间）。课件后面算梯度时，<b>δ 定义成 ∂L/∂z 而不是 ∂L/∂a</b>，搞混就全错。", "w": 1}}, {"r": [6, 7], "t": "前向传播：把算例从头走一遍", "star": 3, "one": "x=(1,2)、w=(0.2,0.4)、b=0.1 ⇒ z = 1.1 ⇒ p = σ(1.1) = 0.7503 ⇒ 预测类别 1。", "quote": "<b>Predict first:</b> weights 0.2 and 0.4, inputs 1 and 2. Which input pushes the score harder? … <b>The chance and the label are different things.</b>", "eq": "z = 0.2×1 + 0.4×2 + 0.1 = 0.2 + 0.8 + 0.1 = 1.1\np = σ(1.1) = 1 / (1 + e^(−1.1)) = 0.750260", "pts": ["<b>① 加权</b>：0.2×1 = 0.2，0.4×2 = 0.8。⭐ 课件特意问了一句 <em>Which input pushes the score harder?</em>——<b>第二个输入推得更狠，是 4 倍</b>。注意这 4 倍是<b>权重比（2 倍）× 输入值比（2 倍）</b>来的，两个因素都算数。", "<b>② 加偏置</b>：z = 0.2 + 0.8 + 0.1 = <b>1.1</b>。", "<b>③ 激活</b>：p = σ(1.1) = <b>0.750260</b>。课件右上角给了 sigmoid 的定义 σ(x) = 1/(1+e⁻ˣ)。", "<b>④ 决策</b>：<em>predict class 1 when p ≥ 0.5</em>——<b>p ≥ 0.5 就判为类别 1</b>。", "⭐ <b>这一页最该记的一句</b>：<em>The chance and the label are different things.</em>——<b>概率和标签是两件事</b>。p = 0.7503 是「模型估计属于类别 1 的机会」，而「类别 1」是把它跟 0.5 比之后的一个决定。⚠️ <b>这两者的区别是第 20 页（为什么用损失而不用准确率）和 T3（阈值与 ROC）的共同起点。</b>", "<b>右图还标了一个后面要用的数</b>：在 z = 1.1 处，sigmoid 的<b>局部斜率是 p(1−p) = 0.1874</b>。⚠️ 这个数在第 23、24 页算链式法则时会原样出现，<b>不是新算的</b>。", "<b>p7 把同一个过程画成五个方块</b>：Inputs → Multiply by weights → Add bias → Activate → Classify。⭐ <b>这五个方块就是前向传播的标准答题顺序</b>，扩展题照着写即可。"], "tbl": [{"cap": "前向传播五步，每步的输入与输出", "head": ["步", "做什么", "这个算例里"], "rows": [["1", "每个输入乘权重", "0.2×1=0.2，0.4×2=0.8"], ["2", "求和并加偏置", "z = 0.2+0.8+0.1 = <b>1.1</b>"], ["3", "过 sigmoid", "p = σ(1.1) = <b>0.750260</b>"], ["4", "和 0.5 比", "0.7503 ≥ 0.5 ⇒ <b>类别 1</b>"], ["—", "顺带记下斜率", "p(1−p) = <b>0.187370</b>"]]}], "say": "<b>为什么阈值恰好是 0.5？</b>因为 <b>σ(0) = 0.5</b>（第 14 页会明说这一点）。⭐ 所以「p ≥ 0.5」等价于「<b>z ≥ 0</b>」——判别条件可以完全写在分数这一侧，不必先算 sigmoid。<b>这也解释了为什么决策边界是方程 w₁x₁ + w₂x₂ + b = 0 画出的那条直线</b>（第 12 页的主角）。⚠️ 但<b>只有当阈值是 0.5 时两者才等价</b>；T3 讲 ROC 时阈值会变，那时就必须用 p 来判断了。", "exam": "⭐⭐ <b>这是 T1 最可能出手算题的一页</b>。考纲 Topic 1 明写「前向传播」。⚠️ 扩展题要<b>写出中间步骤</b>：先列加权结果，再写 z，再写 p，最后写判定——<b>四行都要有</b>。只写「p=0.75，所以是类别 1」会被扣中间步骤的分。", "tip": {"t": "手算 sigmoid 的办法", "v": "考场只能用普通科学计算器。σ(1.1) 的算法是：按 <b>1.1 → ± → e^x → +1 → 1/x</b>，得 0.7503。⚠️ <b>别忘了那个负号</b>，σ 的定义里是 e 的<b>负</b> z 次方。", "w": 0}}, {"r": [8, 9], "t": "⚠ 置信度高不等于学到了东西", "star": 3, "one": "把权重全设为 0、偏置设为 5，任何输入都给出 p = 0.9933 —— 没有训练，也没看特征。", "quote": "<b>Confidence proves nothing:</b> set both <b>weights</b> to <b>0</b> and the <b>bias</b> to <b>5</b>. Every input gives p = σ(5) = 0.9933, with no training and without even looking at the features.", "pts": ["<b>第一个小实验</b>：把偏置从 0.1 提到 0.6。加权部分仍是 1.0，所以 z = 1.0 + 0.6 = 1.6，p = σ(1.6) = <b>0.8320</b>。<b>p 上升了</b>，原因是 <em>sigmoid always rises with the score</em>——<b>sigmoid 随分数单调上升</b>。", "⚠️ <b>第二问才是重点</b>：<em>Higher is better? only if the target is 1.</em>——<b>p 变高是好是坏，取决于目标值</b>。如果这个样本的真实标签 y = 0，同样的改动让预测<b>更糟</b>。⭐ <b>这就是「需要目标才有方向」的第一次出现</b>，第 25 页会把它写成公式。", "⭐⭐ <b>第三个实验是全讲最有力的反例</b>：把两个权重都设成 0、偏置设成 5。那么无论输入是什么，z 恒等于 5，p 恒等于 σ(5) = <b>0.9933</b>。<b>模型对每一个样本都给出 99.33% 的把握——而它根本没看输入。</b>", "⚠️ <b>如果真实标签是 0，这个模型就是「自信地错着」</b>（课件 p9 用了 <em>CONFIDENTLY WRONG</em> 这个标签）。", "<b>那什么才算真的学到了？</b>课件给了判据：<em>the parameters were updated from data, and the predictions were checked against known targets on data that the model <b>has not seen</b></em>——<b>① 参数是从数据更新出来的 ② 预测在模型没见过的数据上、拿已知目标检验过</b>。", "<b>p9 用一张对照图总结</b>：左边是正常模型（同一张哈士奇图，b=0.1 给 p=0.75，b=0.6 给 p=0.83），右边是 w=0、b=5 的「无学习」模型给出 p=0.993。底部一句话：<b>High confidence ≠ learning</b>。"], "tbl": [{"cap": "三个实验，三个结论", "head": ["实验", "结果", "说明了什么"], "rows": [["b: 0.1 → 0.6", "p: 0.7503 → 0.8320", "sigmoid 随分数单调上升"], ["同样的改动，但 y = 0", "预测变<b>差</b>", "⚠ 好坏取决于目标值"], ["<b>w = 0, b = 5</b>", "<b>所有输入都给 p = 0.9933</b>", "<b>置信度可以完全凭空而来</b>"]]}], "say": "<b>这一页其实在讲一件比神经网络更一般的事</b>：<b>模型输出的「把握」和「它是否真的学到规律」是两回事</b>。⭐ 第三个实验之所以有杀伤力，是因为 <b>w = 0 意味着输出完全不依赖输入</b>——它退化成了一个常数预测器。<b>而常数预测器在类别极不平衡的数据上，准确率还可以很高</b>（比如 99% 的样本都是类别 1 时，永远猜 1 就有 99% 准确率）。⚠️ <b>这正是 T3 要用混淆矩阵和 ROC 来替代准确率的根本原因</b>，两个 Topic 在这里是连着的。", "exam": "⭐⭐ <b>这一页非常适合出扩展题</b>，典型问法：「某同学说他的模型预测概率都在 0.99 以上，所以模型很好。评价这个说法。」<b>标准答法</b>：① 指出高置信度可以由一个不看输入的模型凭空产生（举 w=0、b=5 的例子）② 指出置信度高低对不对要看目标值 ③ 给出真正的证据标准——<b>参数从数据更新、且在未见过的数据上对照已知目标检验过</b>。", "tip": {"t": "和 T3 的连接", "v": "⭐ 「<b>在模型没见过的数据上检验</b>」这句话就是 <b>T3 第 1 节「数据划分」</b>的动机。T1 在这里埋了伏笔，T3 负责展开。扩展题如果把两边连起来写，是加分的。", "w": 0}}, {"r": [10, 10], "t": "一个提问页：训练得久一点能救吗", "star": 2, "one": "「一个神经元总是分错 —— 训练久一点能解决吗？」答案是不能，这一页在给 p11–p12 设问。", "quote": "<b>One neuron keeps misclassifying. Will training it for longer fix that?</b>", "pts": ["<b>这是一个纯提问页</b>，没有内容，但它设的问题是接下来两页的主线。", "⭐ <b>先把答案记住：不能。</b>理由在第 12 页——<b>训练只能移动和旋转那条直线，永远不能把它掰弯，也不能再加一条</b>。", "⚠️ <b>这里要分清两件事</b>：「<b>模型能表示什么</b>」（表达能力）和「<b>训练找到了哪一个</b>」（优化）。<b>训练久一点改善的是后者，而这里的问题出在前者。</b>", "<b>这个区分在整个机器学习里反复出现</b>：M1 讲感知机时「线性不可分」是同一回事；CS229 的误差分解里，这叫<b>近似误差</b>（假设类太窄），加数据、加训练时间都补不回来。"], "say": "<b>这种提问页在这套课件里出现了好几次</b>（第 6、8、18、22 页都有 <em>Predict first</em> / <em>Think first</em> 的黄框）。⭐ <b>它们是课件作者刻意设计的「先猜后验」节奏</b>——让你先给一个答案，再看正确答案，这样错误的直觉会被明确地纠正，而不是默默滑过去。<b>复习时别跳过这些框，先遮住下面自己答一遍，效果比顺着读好得多。</b>", "exam": "⭐ 「训练更久能不能解决欠拟合/线性不可分」是<b>很典型的选择题陷阱</b>。答案永远是：<b>不能，这是表达能力的问题，不是优化的问题</b>。"}, {"r": [11, 12], "t": "★★★ XOR：一条直线为什么不够", "star": 3, "one": "XOR 的四个点里，对角的两个属于同一类，任何一条直线都分不开 —— 必须加隐藏层。", "quote": "<b>A sigmoid neuron says class 1 on one side of the line w₁x₁ + w₂x₂ + b = 0 and class 0 on the other. Training can move and turn that line. It can never bend it or add a second one.</b>", "pts": ["<b>XOR（异或）是什么</b>：两个输入，<b>相同时输出 0，不同时输出 1</b>。课件 p11 画成 2×2 的方格：左上 1、右上 0、左下 0、右下 1。⭐ <b>注意 1 在对角线上，0 在另一条对角线上。</b>", "⚠️ <b>为什么一条直线分不开</b>：课件 p12 说得极准——<em>opposite corners share a class: every straight line mixes them</em>（<b>对角的两个角属于同一类，任何直线都会把它们混在一起</b>）。你可以试着画：任何一条直线把平面分成两半，两个对角点必然被分到不同的半边，或者把异类点拉进同一边。", "⭐⭐ <b>p12 那句话是整页的核心</b>：<b>一个 sigmoid 神经元在直线 w₁x₁ + w₂x₂ + b = 0 的一侧说「类别 1」，另一侧说「类别 0」。训练可以移动和旋转这条线，但永远不能把它掰弯，也不能再加一条。</b>", "<b>把这句话拆开看，它说了三件事</b>：① 单个神经元的决策边界<b>就是一条直线</b>（高维里是一个超平面）② 训练能改变的只有这条线的<b>位置和方向</b>（由 b 和 w 决定）③ <b>线的「形状」是固定的</b>——永远是直的、永远只有一条。", "<b>解法是加隐藏层</b>。p11 右边画了结构：x₁、x₂ → 两个隐藏单元 → y。底下一句 <em>nonlinear bends solve XOR</em>——<b>非线性的「折弯」解决了 XOR</b>。", "⭐ <b>p12 底部那句话值得抄下来</b>：<em>Training changes which errors occur, not what the model can represent.</em>——<b>训练改变的是「犯哪些错」，不是「模型能表示什么」。</b>"], "tbl": [{"cap": "XOR 的四个点（输入相同输出 0，不同输出 1）", "head": ["x₁", "x₂", "XOR 输出", "在图上"], "rows": [["0", "0", "0", "左下"], ["0", "1", "<b>1</b>", "左上"], ["1", "0", "<b>1</b>", "右下"], ["1", "1", "0", "右上"]]}], "say": "<b>这件事在历史上很有名</b>：1969 年 Minsky 和 Papert 在《Perceptrons》里正是用 XOR 指出了单层感知机的局限，这个结论让神经网络研究沉寂了十几年。<b>而解法——加一层隐藏层——其实在当时就已经知道，真正缺的是「怎么训练隐藏层」，也就是反向传播</b>（1986 年才被广泛推广）。⭐ 所以这一讲的结构正好复刻了这段历史：<b>先指出单个神经元不够（p11–p12），再讲清楚多层为什么有用（p18），最后给出训练的办法（02、03 节）。</b>", "exam": "⭐⭐⭐ <b>XOR 是 T1 最经典的考点</b>。<b>选择题</b>常问「下面哪个问题单个神经元解决不了」或「为什么需要隐藏层」。<b>扩展题</b>可能给你一个线性不可分的数据集让你说明原因并提出解法。⚠️ <b>标准答法三句</b>：① 单个 sigmoid 神经元的决策边界是一条直线 ② XOR 的同类点在对角线上，任何直线都分不开 ③ <b>加隐藏层后可以产生折弯，组合出非线性边界</b>。", "tip": {"t": "⚠ 别答错方向", "v": "问「训练更久能不能解决」时，<b>不要答「可以，只要学习率合适」</b>。这是表达能力的硬限制，<b>和优化无关</b>。课件原话：<em>Training changes which errors occur, not what the model can represent.</em>", "w": 1}}, {"r": [13, 13], "t": "把神经元连成网络：层、隐藏特征、前馈", "star": 3, "one": "输入层进、隐藏层算中间值、输出层决定；w_ji 的第一个下标是接收方，第二个是输入方。", "quote": "<b>Reading w_ji: first index is the receiver, second the input.</b> … <b>Hidden features:</b> computed with learned weights, fresh for every observation. They do not need a human readable meaning.", "pts": ["<b>三种层</b>：<em>inputs come in, a hidden layer computes in between values, the output layer decides</em>——<b>输入层进数据，隐藏层算中间值，输出层做决定</b>。", "⭐⭐ <b>隐藏特征那一条最值得琢磨</b>：<em>computed with learned weights, fresh for every observation. They do not need a human readable meaning.</em>——<b>隐藏层的值是用学到的权重算出来的，每来一个样本就重算一次；它们不需要有人能读懂的含义。</b>", "<b>「不需要有人能读懂」这句话要正确理解</b>：它不是说隐藏层是玄学，而是说<b>你不必事先规定「第一个隐藏单元代表什么」</b>。⚠️ 对比 M1 里你要手工设计特征（面积、房龄），<b>这里是让网络自己决定中间表示</b>——这正是神经网络省事的地方，也是它难解释的地方。", "<b>前馈（feed forward）</b>：<em>values flow from input to output, never backwards in a loop</em>——<b>值从输入流向输出，不会倒回去形成环</b>。⭐ <em>Deep just means more layers stacked.</em>——<b>「深度」不过就是层数更多</b>，没有别的含义。", "⚠️⚠️ <b>下标约定必须记牢</b>：<b>w_ji 的第一个下标 j 是接收方（它流向哪个单元），第二个下标 i 是输入方（它从哪来）</b>。所以 w₁₂ 是「从第 2 个输入流向第 1 个隐藏单元」的权重。", "<b>为什么这个顺序看起来是反的？</b>因为写成矩阵乘法 <b>h = Wx</b> 时，W 的第 j 行第 i 列正好乘上 x 的第 i 个分量、贡献给 h 的第 j 个分量。<b>「行是接收方、列是输入方」是矩阵乘法天然的排法</b>，不是课件故意绕人。"], "tbl": [{"cap": "图上每个符号是什么", "head": ["符号", "含义", "个数"], "rows": [["x₁, x₂", "输入层，两个特征", "2"], ["w₁₁, w₁₂, w₂₁, w₂₂", "输入→隐藏的权重", "2×2 = <b>4</b>"], ["h₁, h₂", "隐藏层，两个 ReLU 单元", "2"], ["v₁, v₂", "隐藏→输出的权重", "2"], ["（红箭头）", "每个隐藏单元和输出各有一个偏置", "<b>3</b>"], ["p", "输出层，sigmoid，类别 1 的概率", "1"]]}], "say": "<b>顺着这张表可以把参数个数数出来</b>：4 个输入→隐藏权重 + 2 个隐藏偏置 + 2 个隐藏→输出权重 + 1 个输出偏置 = <b>9 个参数</b>。⭐ <b>考纲 Topic 1 明写「网络结构与参数维度」，数参数个数是标准题型。</b><b>通用公式</b>：一个从 n 个输入到 m 个单元的全连接层，有 <b>n×m 个权重 + m 个偏置</b>。⚠️ <b>偏置最容易被漏掉</b>，每个单元一个，输入层没有。", "exam": "⭐⭐⭐ <b>「数参数个数」几乎必考</b>。给你一个网络结构（比如 3 个输入、一个 4 单元隐藏层、1 个输出），问总参数量：<b>3×4 + 4 + 4×1 + 1 = 21</b>。⚠️ <b>两个必错点</b>：① 忘了偏置 ② 把输入层也算上偏置。<b>另一个高频选择题是 w_ji 的下标读法。</b>", "tip": {"t": "矩阵维度怎么对", "v": "⭐ 如果写成矩阵形式：输入 x 是 n×1，第一层权重 <b>W 是 m×n</b>（行 = 接收方个数，列 = 输入个数），偏置 b 是 m×1，于是 <b>h = g(Wx + b)</b> 是 m×1。<b>检查维度时记住「W 的列数必须等于输入的行数」</b>。", "w": 0}}, {"r": [14, 15], "t": "两个激活函数：sigmoid 与 ReLU", "star": 3, "one": "sigmoid 把分数压进 0~1 当概率用在输出层；ReLU 把负数变 0，用在隐藏层造折弯。", "quote": "<b>An activation is a rule applied to the score, not a stored number.</b> … <b>Same neuron recipe everywhere; only this last rule differs between layers.</b>", "eq": "σ(z) = 1 / (1 + e^(−z))\nReLU(z) = max(0, z)", "pts": ["⭐ <b>开头那句定义很关键</b>：<em>An activation is a rule applied to the score, not a stored number.</em>——<b>激活是作用在分数上的一条规则，不是一个存起来的数</b>。它不是参数，训练不会改变它，是你选定的。", "<b>sigmoid σ(z) = 1/(1+e⁻ᶻ)</b>：<em>squashes any score into 0 to 1, smoothly</em>——<b>把任意分数平滑地压进 0 到 1</b>。用在<b>输出层</b>，<em>so the answer reads as a probability</em>（<b>这样答案可以当概率读</b>）。", "<b>ReLU max(0, z)</b>：<em>negative scores become 0, positive scores pass through</em>——<b>负分变成 0，正分原样通过</b>。用在<b>隐藏层</b>，<em>to create bends cheaply</em>（<b>廉价地制造折弯</b>）。", "⭐ <b>课件给了三个速查值，背下来</b>：<b>ReLU(−2) = 0</b>、<b>ReLU(2) = 2</b>、<b>σ(0) = 0.5</b>。", "⚠️ <b>σ(0) = 0.5 这个值解释了一件事</b>：<em>which is why the 0.5 decision happens exactly where z = 0</em>——<b>这正是「0.5 判别」恰好发生在 z = 0 处的原因</b>。所以决策边界方程才是 z = 0，也就是 w₁x₁ + w₂x₂ + b = 0。", "⭐ <b>最后一句统一了全局</b>：<em>Same neuron recipe everywhere; only this last rule differs between layers.</em>——<b>每一层的神经元配方完全相同，层与层之间只差最后这条规则</b>。", "<b>p15 把两者画成对照图</b>：sigmoid 是一条 S 形曲线把 z 变成 p（下方还画了 0 到 1 的概率条）；ReLU 画成一个「负的打叉、正的通过」的漏斗。"], "tbl": [{"cap": "两个激活函数的对照（课件原表）", "head": ["激活", "对分数 z 做什么", "用在哪、为什么"], "rows": [["<b>Sigmoid σ(z)</b>", "平滑地压进 0 到 1", "<b>输出层</b>，让答案能当概率读"], ["<b>ReLU max(0, z)</b>", "负分变 0，正分原样通过", "<b>隐藏层</b>，廉价地造折弯"]]}], "say": "<b>为什么 ReLU 「便宜」？</b>两层意思。⭐ <b>计算便宜</b>：max(0, z) 只要一次比较，而 sigmoid 要算指数，慢得多。⭐ <b>梯度也「便宜」</b>：ReLU 的导数非 0 即 1，不会衰减；而 <b>sigmoid 的导数 p(1−p) 最大只有 0.25</b>（在 z=0 处），一旦 z 很大或很小，导数接近 0。<b>多层堆起来后，这些小于 1 的数连乘，梯度会越来越小——这就是「梯度消失」</b>，也是深层网络改用 ReLU 的主要原因。⚠️ <b>这个话题 T2 会展开</b>，T1 只要知道「ReLU 在隐藏层、sigmoid 在输出层」这个分工即可。", "exam": "⭐⭐ <b>选择题高频</b>：给 z 值算 ReLU 或 sigmoid（<b>ReLU(−2)=0、ReLU(2)=2、σ(0)=0.5 直接背</b>）；或问「哪个激活用在输出层」「为什么隐藏层用 ReLU」。⚠️ <b>扩展题</b>若问「把隐藏层的 ReLU 换成恒等函数会怎样」，答案见第 18 页——<b>整个网络塌回一条直线</b>。", "tip": {"t": "激活不是参数", "v": "⚠️ 课件第一句就强调 <em>an activation is a rule … not a stored number</em>。<b>训练不会「学出」一个激活函数</b>，它是你在设计网络时选定的。选择题会拿这个设陷阱。", "w": 1}}, {"r": [16, 17], "t": "还有很多别的激活函数（了解即可）", "star": 1, "one": "课件展示了 ReLU/GELU/Sigmoid/Tanh/Swish 五条曲线，以及一整张 18 种激活函数的表 —— 这两页是「开阔眼界」，不是考点。", "pts": ["<b>p16 并排画了五条曲线</b>：ReLU、GELU、Sigmoid、Tanh、Swish。⭐ 看形状就够了：<b>ReLU 是折线，其余四个都是平滑曲线</b>；<b>Sigmoid 的输出在 0 到 1，Tanh 在 −1 到 1</b>（注意纵轴标的是 −1）。", "<b>p17 是一张 18 格的大表</b>（ReLU、GELU、PReLU、ELU、Swish、SELU、SoftPlus、Mish、RReLU、HardSwish、Sigmoid、SoftSign、Tanh、Hard tanh、Hard Sigmoid、Tanh Shrink、Soft Shrink、Hard Shrink），每格配曲线和公式。", "⚠️ <b>这两页几乎肯定不是考点</b>。考纲 Topic 1 列的是「网络结构与参数维度、前向传播、计算图」，没有提到各种激活函数的具体公式。<b>课件放这两页的用意是让你知道「ReLU 和 sigmoid 只是常见的两个，不是全部」。</b>", "⭐ <b>真要从这两页带走一点东西的话</b>：看一眼就会发现<b>大多数激活函数长得都像 ReLU 或 sigmoid 的变体</b>——要么是「负半边压平、正半边放过」的折线族，要么是「两端饱和」的 S 形族。<b>它们的设计目标基本都是：保留 ReLU 的梯度优势，同时把那个尖角磨平</b>。"], "exam": "⚠️ <b>不要在这两页上花时间背公式。</b>如果真出选择题，最多问「tanh 的输出范围是什么」（<b>−1 到 1</b>）或「哪个不是激活函数」。<b>把时间留给 p14–p15 那两个。</b>", "tip": {"t": "复习优先级", "v": "T1 共 35 页，但权重极不均匀。⭐ <b>真正高频的是</b>：p6–p7（前向传播手算）、p11–p12（XOR）、p13（数参数）、p18（为什么要非线性）、p22–p24（计算图与链式法则）、p29–p31（δ 与一次更新）。<b>p16–p17 属于可以快速翻过的那一类。</b>", "w": 0}}, {"r": [18, 18], "t": "★★★ 为什么层之间必须有非线性", "star": 3, "one": "h = 2x+1 再 s = 3h+4，代入展开得 s = 6x+7 —— 还是一条直线。两层线性叠起来等于一层。", "quote": "<b>Think first:</b> two stacked lines, h = 2x + 1 then s = 3h + 4. Is the result more than a line? <b>No:</b> substitute and expand: s = 3(2x + 1) + 4 = 6x + 7, still one line. <b>Stacking weighted sums buys nothing new.</b>", "eq": "s = 3(2x + 1) + 4 = 6x + 3 + 4 = 6x + 7\nh = max(0, 2x + 1) ⇒ 在 x = −0.5 处出现折点", "pts": ["⭐⭐⭐ <b>这一页是整个 T1 里论证最漂亮的一页</b>，而且它只用了一次代入展开。", "<b>设想两层都不加激活</b>：第一层算 h = 2x + 1，第二层算 s = 3h + 4。把第一层代进第二层：<b>s = 3(2x+1) + 4 = 6x + 3 + 4 = 6x + 7</b>。⭐ <b>结果还是一条直线</b>，只不过斜率和截距变了。", "⚠️ <b>课件的结论一针见血</b>：<em>Stacking weighted sums buys nothing new.</em>——<b>把加权和叠起来，什么新东西都买不到</b>。无论你堆 2 层还是 200 层，只要中间没有非线性，整个网络等价于<b>一层</b>。", "⭐ <b>再看插入 ReLU 之后</b>：h = max(0, 2x + 1)。<b>在 x = −0.5 处，2x+1 由负转正</b>，所以 h 在那里从「恒为 0」变成「跟着 x 涨」——<b>图上出现一个折点</b>。课件原话：<em>a bend appears that no single line can copy</em>（<b>出现了一个任何单条直线都复制不了的折弯</b>）。", "<b>右图把两种情况并排画了</b>：左边「没有隐藏激活」是一条笔直的线（标着 <em>collapses to s = 6x + 7</em>）；右边「层间有 ReLU」在 x = −0.5 处明显折了一下。", "⭐ <b>最后一句说清了多层为什么强大</b>：<em>Many bent units, combined by the next layer, draw flexible shapes.</em>——<b>很多个折弯的单元，被下一层组合起来，就能画出灵活的形状</b>。"], "tbl": [{"cap": "有没有非线性，差别在哪", "head": ["", "两层线性", "中间插 ReLU"], "rows": [["第一层", "h = 2x + 1", "h = max(0, 2x + 1)"], ["第二层", "s = 3h + 4", "s = 3h + 4"], ["合起来", "<b>s = 6x + 7（一条直线）</b>", "<b>在 x = −0.5 处折弯</b>"], ["表达能力", "⚠ 和单层完全一样", "<b>超出任何单条直线</b>"]]}], "say": "<b>把这一页和 p11–p12 的 XOR 连起来，整条逻辑就闭合了</b>：⭐ <b>p12 说「单个神经元只能画一条直线」；p18 说「不加非线性的话，多层还是一条直线」；所以 XOR 这种需要非线性边界的问题，<b>既需要多层，也需要层间的非线性，缺一不可</b>。</b><br>⚠️ <b>这也解释了一件容易被忽略的事</b>：<b>网络「深」本身不产生能力，是「深 + 非线性」才产生能力</b>。课件 p13 那句 <em>Deep just means more layers stacked</em> 要配着这一页读——<b>光堆层数是没用的</b>。", "exam": "⭐⭐⭐ <b>这是扩展题的热门素材</b>。典型问法：「如果把隐藏层的激活函数去掉（或换成恒等函数），网络的表达能力会怎样？请说明理由。」<b>满分答法</b>：① 写出两层线性的复合并代入展开，得到仍是线性的结论 ② 点出课件那句「堆叠加权和买不到新东西」③ 说明无论多少层都等价于单层 ④ <b>补一句 ReLU 插入后产生折点，多个折点组合可以逼近复杂形状</b>。⚠️ <b>一定要真的把代入展开那一步写出来</b>，这是「写出中间步骤」的得分点。", "tip": {"t": "一句话记住", "v": "⭐ <b>线性 ∘ 线性 = 线性。</b>非线性必须插在层与层之间才有用；插在最外面（只在输出层加 sigmoid）救不了内部的塌陷。", "w": 1}}, {"r": [19, 19], "t": "第 02 节：从敏感度到梯度", "star": 1, "one": "分节页。接下来 p20–p25 回答一个问题：怎么知道某个权重该往哪边动、动多少。", "pts": ["<b>01 节解决了「怎么算出预测」，02 节要解决「怎么知道该怎么改」。</b>", "⭐ <b>这一节的推进顺序很讲究</b>：先讲<b>损失</b>（p20–p21，有了它才有「好坏」）→ 再讲<b>计算图</b>（p22，把计算路径画出来）→ 再讲<b>导数就是敏感度</b>（p23）→ 再讲<b>链式法则</b>（p24，沿路径相乘）→ 最后点明<b>敏感度需要目标才有方向</b>（p25）。", "⚠️ <b>别把「敏感度」和「梯度」混用</b>。课件在 p25 说得很清楚：<b>敏感度 ∂p/∂w 只说「改 w 会让 p 动多少」；而梯度 ∂L/∂w 还带着目标的信息，才知道该往哪边动。</b>"], "exam": "分节页不出题，但<b>这五步的顺序本身就是扩展题「解释反向传播」的提纲</b>。"}, {"r": [20, 21], "t": "★★ 损失给学习一个方向", "star": 3, "one": "二元交叉熵 L = −[y log p + (1−y) log(1−p)]；y=1 时退化成 L = −log p，本例 = 0.287335。", "quote": "<b>Why not just accuracy:</b> p = 0.75 and p = 0.90 both say class 1, so accuracy cannot tell them apart. But the <b>loss</b> can: with y = 1 it prefers 0.90. <b>Learning</b> keeps a signal even when the label is already right.", "eq": "L = −[ y·log p + (1−y)·log(1−p) ]\ny = 1 时：L = −log p = −log(0.750260) = 0.287335", "pts": ["<b>损失是什么</b>：课件用了一个好比喻——<em>think of a game score: the loss is a score where lower is better</em>（<b>像游戏分数，但越低越好</b>）。它<b>把预测的概率和已知的目标比较，每个样本给出一个数</b>。", "<b>这门课用的损失叫二元交叉熵（binary cross entropy, BCE）</b>：L = −[y log p + (1−y) log(1−p)]。⭐ <b>注意它的结构：两项里永远只有一项活着。</b>y = 1 时第二项的系数 (1−y) = 0，只剩 <b>L = −log p</b>；y = 0 时第一项消失，只剩 <b>L = −log(1−p)</b>。", "<b>代入本例</b>：y = 1、p = 0.750260，所以 <b>L = −log(0.750260) = 0.287335</b>。⚠️ <b>这里的 log 是自然对数 ln</b>（计算器上的 ln 键，不是 log₁₀）。", "⭐⭐ <b>「为什么不直接用准确率」是这一页最该理解的一段</b>：p = 0.75 和 p = 0.90 都判为类别 1，<b>准确率完全分不出这两者的好坏</b>；而损失分得出来——y = 1 时它<b>偏好 0.90</b>（L(0.90) = 0.105 < L(0.75) = 0.287）。", "<b>课件把结论说成一句很好的话</b>：<em>Learning keeps a signal even when the label is already right.</em>——<b>即使标签已经判对了，学习仍然保有一个信号</b>。这正是梯度下降能持续改进的原因：准确率是台阶函数（要么对要么错，导数处处为 0），<b>而损失是连续的，处处有坡度</b>。", "⭐ <b>目标决定方向</b>：<em>with y = 1, raising p lowers the loss. With y = 0, the same change raises it.</em>——<b>y=1 时抬高 p 会降低损失；y=0 时同样的改动反而抬高损失</b>。", "⚠️⚠️ <b>最后那句警告必须记住</b>：<em>Always use the prob in the loss, never the rounded label.</em>——<b>损失里永远用概率 p，不要用四舍五入之后的标签</b>。用了标签就退化成准确率，梯度全是 0，学不动。", "<b>p21 把这些画成一张图</b>：左边两行（p=0.75→类别1、p=0.90→类别1，标着 <em>same label</em>），中间是靶心 y=1，右边两个损失值 0.287 和 0.105（标着 <em>lower is better</em>）。底下两个方块：<b>y=1 时 p 升 → 损失降</b>；<b>y=0 时 p 升 → 损失升</b>。"], "tbl": [{"cap": "准确率 vs 损失：同样两个预测，谁分得出好坏", "head": ["预测 p", "判成哪类（阈值 0.5）", "准确率看法", "损失 L（y=1）"], "rows": [["0.75", "类别 1 ✓", "对", "<b>0.287</b>"], ["0.90", "类别 1 ✓", "对（<b>完全一样</b>）", "<b>0.105</b>（更好）"], ["—", "—", "⚠ 分不出好坏", "<b>分得出，而且连续可导</b>"]]}], "say": "<b>为什么交叉熵长这个样子？</b>一个直观的理解是：<b>−log p 是「模型给正确答案分配的概率」的惩罚</b>。p 越接近 1，−log p 越接近 0（没惩罚）；<b>p 越接近 0，−log p 冲向无穷大</b>（极重的惩罚）。⭐ 所以交叉熵<b>对「自信地错」惩罚得极狠</b>——这恰好接上了 p8「置信度不等于学习」那一页：一个 w=0、b=5 的模型对 y=0 的样本给出 p=0.9933，损失是 −log(1−0.9933) = −log(0.0067) ≈ <b>5.0</b>，比典型值大一个数量级。<b>损失函数天生就在惩罚那种模型。</b><br>⚠️ <b>T2 会专门用一整节讲损失函数</b>，T1 这里只需要掌握 BCE 的形式、y=0/y=1 的退化、以及「为什么不用准确率」。", "exam": "⭐⭐⭐ <b>必考。</b><b>选择题</b>：给 p 和 y 算 L；或问「为什么训练用损失不用准确率」。<b>扩展题</b>：「解释为什么准确率不适合作为训练目标」——<b>标准答法</b>：① 准确率只看判别结果，p=0.75 和 p=0.90 得分相同 ② 它是阶梯函数，<b>几乎处处导数为 0，无法提供梯度</b> ③ 损失连续可导，即使已判对仍保有改进信号 ④ 举出 L(0.75)=0.287 与 L(0.90)=0.105 的对比。", "tip": {"t": "⚠ 算 L 的两个坑", "v": "① <b>用 ln 不是 log₁₀</b>。② <b>先看 y 再决定用哪一项</b>：y=1 用 −log p，y=0 用 −log(1−p)。把 y=0 的样本代进 −log p 是最常见的计算错误。", "w": 1}}, {"r": [22, 22], "t": "★★ 计算图：把计算过程画成路线", "star": 3, "one": "w₂ 从 0.40 动到 0.41，v 从 0.80 动到 0.82，z 从 1.10 动到 1.12 —— 0.01 的扰动放大成 0.02，倍数正是 x₂ = 2。", "quote": "<b>Predict first:</b> w₂ moves from 0.40 to 0.41. What happens to v = w₂x₂, and then to z? <b>Check it:</b> v goes 0.80 to 0.82 and z goes 1.10 to 1.12. A 0.01 nudge became 0.02: the ratio is x₂ = 2. … <b>u and v are computed products, not new parameters.</b>", "pts": ["<b>计算图是什么</b>：把一次前向传播拆成一串基本运算，每个运算画成一个方块，用箭头连起来。课件图上标着 <em>forward: every later value is built from earlier ones</em>——<b>每个靠后的值都由靠前的值搭出来</b>。", "<b>本例的图</b>：(x₁=1, w₁=0.2) → 乘法得 <b>u = 0.2</b>；(x₂=2, w₂=0.4) → 乘法得 <b>v = 0.8</b>；u、v、b=0.1 → 加法得 <b>z = 1.1</b>；z → sigmoid 得 <b>p = 0.750260</b>。", "⭐ <b>那个小实验是全页的重点</b>：把 w₂ 从 0.40 推到 0.41（<b>动了 0.01</b>）。那么 v = w₂x₂ 从 0.80 变成 0.82（<b>动了 0.02</b>），z 从 1.10 变成 1.12（<b>也动了 0.02</b>）。", "⚠️ <b>关键观察</b>：<b>0.01 的扰动变成了 0.02，放大了 2 倍，而这个 2 正好是 x₂</b>。⭐ <b>这就是「乘法这一步的敏感度等于另一个因子」的第一次现身</b>，p23 的表会把它写成规则。", "<b>再注意 z 的变化也是 0.02，没有再被放大</b>——因为从 v 到 z 是<b>加法</b>，而加法不改变扰动的大小。⭐ <b>这就是「加法的敏感度是 1」</b>。", "⚠️ <b>最后那句话避免一个常见误解</b>：<em>u and v are computed products, not new parameters.</em>——<b>u 和 v 是算出来的乘积，不是新的参数</b>。它们在图上有自己的方块，但<b>训练不会直接去改它们</b>（呼应 p4 那句「权重和偏置是参数，其余都是算出来的」）。"], "tbl": [{"cap": "w₂ 动 0.01，沿路径逐步追踪", "head": ["量", "原值", "新值", "变化", "被放大了多少"], "rows": [["w₂", "0.40", "0.41", "+0.01", "—（起点）"], ["v = w₂x₂", "0.80", "0.82", "+0.02", "<b>×2（= x₂）</b>"], ["z = u+v+b", "1.10", "1.12", "+0.02", "<b>×1（加法）</b>"], ["p = σ(z)", "0.750260", "0.753989", "+0.003729", "<b>×0.1874（sigmoid 斜率）</b>"]]}], "say": "<b>计算图为什么值得单独一页？</b>因为它把「求导」从一件需要代数技巧的事，变成了<b>一件沿着图走路的事</b>。⭐ <b>你不需要把 p 写成 w₂ 的显式函数再求导</b>——只要知道每个方块的局部敏感度，然后沿路径乘起来就行。<b>这正是深度学习框架（PyTorch、TensorFlow）能自动求导的原理</b>：它们在前向传播时悄悄把这张图记下来，反向时按图乘回去。⚠️ <b>考纲 Topic 1 明确列了「计算图」，所以这一页不是背景知识，是考点。</b>", "exam": "⭐⭐ <b>考纲明列「计算图」。</b><b>选择题</b>可能问「图上哪些是参数」（<b>只有 w₁、w₂、b</b>，u、v、z、p 都是算出来的）或「w₂ 动 0.01，z 动多少」。<b>扩展题</b>可能让你<b>画出计算图并标注每个节点</b>——⚠️ <b>画的时候要把 u、v 这些中间乘积单独画成方块</b>，这正是计算图区别于普通示意图的地方。"}, {"r": [23, 23], "t": "★★ 导数就是敏感度：推一下，看动多少", "star": 3, "one": "Δf ≈ (∂f/∂u)·Δu。三条规则：加法传 1、乘法传另一个因子、sigmoid 传 p(1−p)。", "quote": "<b>Nudge and watch:</b> a derivative answers one question: if this input moves a tiny bit, how much does the output move? It is the <b>exchange rate</b> of a nudge. Δf ≈ (∂f/∂u) Δu.", "eq": "Δf ≈ (∂f/∂u) · Δu", "pts": ["⭐ <b>课件用「汇率」（exchange rate）来解释导数，非常贴切</b>：<b>导数回答一个问题——这个输入动一点点，输出会动多少？</b>就像汇率告诉你 1 块钱能换多少外币。", "<b>课件让你亲手感受一次</b>：f(u) = u²，在 u = 3 处斜率是 6。<b>把 u 改成 3.01</b>，f 从 9 变成 <b>9.0601</b>，实际动了 0.0601；而斜率预测的是 6 × 0.01 = <b>0.06</b>。", "⚠️ <b>课件诚实地指出了差别</b>：<em>Close, not exact, because the slope itself changes along a curve.</em>——<b>很接近，但不精确，因为斜率本身沿着曲线在变</b>。⭐ <b>这正是「局部」两个字的含义：导数只在那一点附近准，走远了就不准了。</b>这一点在 p32 讲步长时会再次出现。", "<b>然后是那张三行的规则表</b>，这是后面算梯度的全部工具：", "<b>① r = a + b ⇒ ∂r/∂a = 1</b>：<em>an added nudge passes straight through</em>（<b>加法让扰动原样通过</b>）。", "<b>② r = ab ⇒ ∂r/∂a = b</b>：<em>the other factor scales the nudge</em>（<b>另一个因子把扰动放大</b>）。⭐ 这正是 p22 里「放大 2 倍，而 2 = x₂」的规则版。", "<b>③ p = σ(z) ⇒ ∂p/∂z = p(1−p)</b>，本例 = <b>0.187370</b>。⚠️ <b>课件特意注了一句</b>：<em>needs p from the same forward pass</em>——<b>要用同一次前向传播算出的那个 p</b>。这是反向传播必须先做前向传播的原因。"], "tbl": [{"cap": "三条局部敏感度规则（课件原表）", "head": ["运算", "汇率（局部导数）", "大白话"], "rows": [["r = a + b", "<b>∂r/∂a = 1</b>", "加法让扰动原样通过"], ["r = ab", "<b>∂r/∂a = b</b>", "另一个因子把扰动放大"], ["p = σ(z)", "<b>∂p/∂z = p(1−p) = 0.187370</b>", "⚠ 要用同一次前向的 p"]]}], "say": "<b>σ′(z) = p(1−p) 这个式子值得单独记住，因为它太方便了</b>：⭐ <b>你不需要重新算指数，只要用前向传播已经算出来的 p 就行</b>。本例 p = 0.750260，所以斜率 = 0.750260 × 0.249740 = 0.187370。<br>⚠️ <b>顺带一个有用的事实</b>：p(1−p) 在 <b>p = 0.5 时取最大值 0.25</b>，在 p 趋近 0 或 1 时趋于 0。<b>这意味着模型「很有把握」的时候，梯度反而很小</b>——好的一面是已经对了不用大改，坏的一面是如果它自信地错了，<b>纠正起来会很慢</b>。这就是 sigmoid 的「饱和」问题，T2 讲激活函数时还会碰到。", "exam": "⭐⭐ <b>那张三行表几乎一定要用到</b>（p24 的链式法则、p29 的 δ 都靠它）。<b>选择题</b>可能直接问「σ 的导数是什么」（<b>p(1−p)</b>）或「乘法节点的局部导数是什么」（<b>另一个因子</b>）。⚠️ <b>扩展题算梯度时，建议把这三条规则先列出来再代入</b>，这既是「写出中间步骤」，也能防止自己记混。", "tip": {"t": "为什么是「局部」", "v": "⭐ u² 那个例子里，斜率预测 0.06、实际 0.0601，差了 0.0001。<b>扰动越小，预测越准</b>。所以梯度只在很小的步长内可信——<b>这直接决定了学习率不能太大</b>（p32 的主题）。", "w": 0}}, {"r": [24, 24], "t": "★★★ 链式法则：沿着路径把敏感度乘起来", "star": 3, "one": "∂p/∂w₂ = 0.187370 × 1 × 2 = 0.374740；路径分叉时各算一条再相加。", "quote": "<b>Gears in a row:</b> a nudge to w₂ passes through each operation on its way to p, and each one scales it. Multiply the scalings: ∂p/∂w₂ = 0.187370 × 1 × 2 = 0.374740. … <b>When paths branch, add:</b> if q feeds r = 2q and t = 3q with F = r + t, dF/dq = 2 + 3 = 5.", "eq": "∂p/∂w₂ = (∂p/∂z)·(∂z/∂v)·(∂v/∂w₂) = 0.187370 × 1 × 2 = 0.374740", "pts": ["⭐ <b>课件的比喻是「一排齿轮」（gears in a row）</b>：<b>w₂ 的一个扰动在通往 p 的路上要穿过每一个运算，每个运算都给它一个缩放。把这些缩放乘起来，就是总的敏感度。</b>", "<b>本例的路径是 w₂ → v → z → p</b>，三段缩放分别是：<b>×2</b>（乘法，另一个因子是 x₂ = 2）、<b>×1</b>（加法）、<b>×0.187370</b>（sigmoid 斜率）。<br>⭐ <b>乘起来：0.187370 × 1 × 2 = 0.374740。</b>", "<b>课件立刻做了验算</b>：按这个敏感度，w₂ 动 0.01 应该让 p 动大约 <b>0.374740 × 0.01 = 0.003747</b>；而<b>实际测出来是 0.003729</b>。⭐ <b>两者吻合到小数点后 4 位</b>，差别来自前面说的「斜率沿曲线在变」。", "<b>图上是从右往左读的</b>：从 p（∂p/∂p = 1）出发，经过 z（0.187370）、v（0.187370）、到 w₂（0.374740）。⚠️ <b>注意 ∂p/∂z 和 ∂p/∂v 都是 0.187370</b>——因为中间那一段是加法，乘了个 1，没变。", "⭐⭐ <b>第二条规则同样重要</b>：<em>When paths branch, add.</em>——<b>路径分叉时，各算一条再相加</b>。课件的例子：q 同时喂给 r = 2q 和 t = 3q，而 F = r + t，那么 <b>dF/dq = 2 + 3 = 5</b>。<b>一条路径一个贡献，加起来。</b>", "⚠️ <b>这两条规则（沿路径相乘、分叉处相加）就是反向传播的全部数学</b>。多层网络之所以能算梯度，靠的只是把这两条反复用。"], "tbl": [{"cap": "从 w₂ 到 p 的三段路径，每段乘多少", "head": ["这一段", "运算", "局部敏感度", "来自哪条规则"], "rows": [["w₂ → v", "v = w₂·x₂（乘法）", "<b>x₂ = 2</b>", "另一个因子"], ["v → z", "z = u+v+b（加法）", "<b>1</b>", "原样通过"], ["z → p", "p = σ(z)", "<b>0.187370</b>", "p(1−p)"], ["<b>合计</b>", "三段相乘", "<b>0.374740</b>", "<b>链式法则</b>"]]}], "say": "<b>为什么图是「从右往左」读？</b>因为那正是<b>反向传播</b>的方向。⭐ 前向传播从输入算到输出，<b>反向传播从输出的损失出发，沿着同一张图倒着走回每个参数</b>。课件图下方那句 <em>read right to left: multiply the local sensitivities along the path</em> 就是在描述这件事。<br>⚠️ <b>为什么不干脆正着算？</b>因为参数通常很多而输出只有一个。<b>倒着走一遍，一次就能拿到所有参数的梯度</b>；正着算则要对每个参数单独走一遍。<b>这就是反向传播比「逐个扰动试一遍」高效的根本原因</b>——后者要走 n 遍，前者只走 1 遍。", "exam": "⭐⭐⭐ <b>链式法则是 T1 最核心的计算考点。</b><b>扩展题</b>很可能给你一个小计算图，让你算某个参数的梯度。<b>满分写法</b>：① 先把路径写出来（w₂ → v → z → p）② 逐段列出局部敏感度并注明依据 ③ 相乘得到结果 ④ <b>如果有分叉，明确写出「两条路径相加」</b>。⚠️ <b>最容易丢分的是只写最终数字不写路径。</b>", "tip": {"t": "分叉要相加，别漏", "v": "⚠️ 多层网络里，<b>一个隐藏单元通常会喂给下一层的多个单元</b>，这就是分叉。算它的梯度时<b>必须把所有下游路径的贡献加起来</b>。只算一条是最常见的推导错误。", "w": 1}}, {"r": [25, 25], "t": "★★ 敏感度必须配一个目标才有方向", "star": 3, "one": "∂L/∂w₂ = (∂L/∂p)×(∂p/∂w₂)：第一个因子携带目标，第二个是已经算出的敏感度。", "quote": "<b>What we know:</b> increasing w₂ raises p. Good or bad? That depends on the target: it helps when y = 1 and hurts when y = 0. … <b>A gradient gives a local direction. It does not choose the step size.</b>", "eq": "∂L/∂w₂ = (∂L/∂p) · (∂p/∂w₂)", "pts": ["<b>到 p24 为止我们知道的是</b>：把 w₂ 调大，p 会上升（敏感度 0.374740 是正的）。⚠️ <b>但这是好事还是坏事？课件的回答是：取决于目标值。</b><em>it helps when y = 1 and hurts when y = 0</em>。", "⭐ <b>解法是在链条前面再接一节</b>：∂L/∂w₂ = (∂L/∂p) × (∂p/∂w₂)。<b>第一个因子携带目标信息，第二个因子就是我们已经算出来的敏感度。</b>", "<b>本例里</b>：y = 1，抬高 p 会降低损失，所以 ∂L/∂p 是<b>负</b>的；乘上正的 ∂p/∂w₂，<b>整个乘积为负</b>。⭐ <b>负的梯度意味着「把 w₂ 调大会降低损失」</b>——所以这个方向是对的。", "⚠️⚠️ <b>这一页最后那两句话是整个 03 节的引子</b>：<em>A gradient gives a local direction. It does not choose the step size.</em>——<b>梯度给的是一个局部的方向，它不决定步子迈多大。</b>", "<b>把这两句话拆开</b>：「<b>局部</b>」呼应 p23（斜率沿曲线在变，只在附近准）；「<b>不决定步长</b>」预告 p32–p33（步长由学习率 η 决定，是另一个独立的选择）。"], "tbl": [{"cap": "敏感度 vs 梯度：差在哪一个因子", "head": ["", "回答什么", "需要目标 y 吗"], "rows": [["敏感度 ∂p/∂w₂", "改 w₂，预测 p 会动多少", "<b>不需要</b>"], ["<b>梯度 ∂L/∂w₂</b>", "<b>改 w₂，损失会动多少</b>", "<b>需要（藏在 ∂L/∂p 里）</b>"]]}], "say": "<b>这一页其实在回答一个很根本的问题：模型凭什么知道「对」是什么？</b>⭐ 答案是<b>它自己不知道，是目标值告诉它的</b>。神经网络本身只是一台计算机器，<b>所有的「方向感」都来自损失函数里那个 y</b>。<br>⚠️ <b>这也解释了无监督学习为什么难</b>——<b>没有 y，就没有这个 ∂L/∂p，也就没有方向</b>。M2 整个模块（PCA、聚类）都在处理「没有裁判时怎么办」，根子就在这里。", "exam": "⭐⭐ <b>扩展题可能问</b>：「把某个权重调大会让预测概率上升，这是否意味着应该调大它？」<b>标准答法</b>：① 不一定 ② 预测上升是好是坏取决于目标值 y ③ 写出 ∂L/∂w = (∂L/∂p)(∂p/∂w)，指出第一个因子携带目标 ④ y=1 时该因子为负、y=0 时为正，所以同一个敏感度会给出相反的更新方向。", "tip": {"t": "两句话必须分开记", "v": "⭐ <b>「梯度给方向，学习率给距离」</b>——课件在 p32 用几乎一样的话又说了一遍（<em>Direction comes from the gradient; distance comes from η</em>）。<b>一页说一次，说明它很重要。</b>", "w": 0}}, {"r": [26, 26], "t": "第 03 节：一次学习步", "star": 1, "one": "分节页。p27–p35 把「算梯度 → 更新 → 检查」走完整一遍。", "pts": ["<b>这一节终于要动参数了。</b>前两节分别解决了「怎么预测」和「怎么知道该往哪动」，这一节解决「怎么动、动完怎么验」。", "⭐ <b>这一节的高潮是 p29 的 δ = p − y</b>——一个把前面所有链式计算一笔勾销的捷径。", "<b>节内顺序</b>：p27 梯度的定义 → p28 三面板回顾 → p29–p30 学习信号 δ → p31 检查新预测 → p32–p33 为什么是减号 → p34 一次训练步里什么变了 → p35 完整总结图。"], "exam": "分节页不出题。"}, {"r": [27, 28], "t": "梯度就是「每个参数一个汇率」的清单", "star": 2, "one": "一个参数一个偏导数，排成一张清单就是梯度；本例只有 3 个数（w₁、w₂、b）。", "quote": "<b>Backpropagation</b> computes the slope. <b>Gradient descent</b> takes the step. Computing a <b>slope</b> moves nothing by itself.", "eq": "∇L = [ ∂L/∂w₁ , ∂L/∂w₂ , ∂L/∂b ]", "pts": ["<b>偏导数的定义</b>：<em>Change one parameter a tiny bit, hold everything else still, and watch the loss.</em>——<b>只动一个参数，其余全部按住不动，看损失怎么变</b>。这个单独的汇率就是<b>一个偏导数</b>。", "⭐ <b>梯度就是把它们排成清单</b>：<em>the full list, one exchange rate per parameter</em>。<b>本例的神经元有 3 个参数，所以梯度就是 3 个数。</b>", "⚠️⚠️ <b>这一页最该记的是那组分工</b>：<b>Backpropagation（反向传播）负责算出斜率；Gradient descent（梯度下降）负责迈出那一步。</b>", "⭐ <b>而最后一句是点睛之笔</b>：<em>Computing a slope moves nothing by itself.</em>——<b>光算出斜率，什么都不会动</b>。<b>这两件事必须分清楚</b>，它们是两个独立的步骤，连名字都不一样。", "<b>p28 是一张三面板的回顾图</b>，把前面的内容压缩成一屏：左上「损失给方向」（p=0.75→L=0.287、p=0.90→L=0.105）、右上「减号是下降方向」（含更新公式 w ← w − α ∂L/∂w）、下方「梯度」的五步流程（改一个参数 → 看损失变化 → 这是偏导数 → 梯度是一列 → 梯度下降迈一步 → 重复）。", "⚠️ <b>注意 p28 用的符号是 α 而不是 η</b>，而 p32–p33 用的是 η。<b>两者是同一个东西——学习率</b>。不同教材符号不同，课件里两个都出现了。"], "tbl": [{"cap": "两件常被混为一谈的事", "head": ["名字", "做什么", "结果是"], "rows": [["<b>反向传播</b>", "沿计算图倒着算出每个参数的偏导数", "一张梯度清单（本例 3 个数）"], ["<b>梯度下降</b>", "照着梯度和学习率去改参数", "<b>参数真的变了</b>"]]}], "say": "⭐ <b>「反向传播 ≠ 梯度下降」这个区分值得认真对待</b>，因为日常说话里它们经常被混用。<b>反向传播是一个求导算法</b>——它可以配任何优化器（SGD、Adam、RMSProp 都要先靠它拿到梯度）；<b>梯度下降是一个优化策略</b>——它可以用任何方式拿到梯度（甚至可以用数值差分，只是慢得多）。<b>两者是正交的。</b><br>⚠️ <b>考纲 Topic 1 写的是「计算图」，T2 才正式讲训练</b>，所以 T1 对这两者只要求能说清分工，不要求展开优化器细节。", "exam": "⭐ <b>选择题</b>：「反向传播做的是什么」（<b>计算梯度，不更新参数</b>）。⚠️ <b>这是一个经典陷阱题</b>，很多人会选「更新权重」。<b>另一个考点是「梯度有几个分量」</b>——<b>等于参数个数</b>，和 p13 数参数那一题是同一个知识点。"}, {"r": [29, 30], "t": "★★★ 学习信号 δ = p − y：一个漂亮的捷径", "star": 3, "one": "L=−log p 与 sigmoid 复合之后几乎全约掉，只剩 δ = p − y = −0.249740；然后 ∂L/∂wᵢ = δ·xᵢ、∂L/∂b = δ。", "quote": "<b>Differentiate the loss:</b> L = −log p gives ∂L/∂p = −1/p, and sigmoid gives ∂p/∂z = p(1 − p). Multiply them and almost everything cancels, leaving a famous shortcut for sigmoid with BCE: <b>δ = ∂L/∂z = p − y</b>", "eq": "δ = ∂L/∂z = p − y = 0.750260 − 1 = −0.249740\n∂L/∂wᵢ = δ · xᵢ      ∂L/∂b = δ", "pts": ["⭐⭐⭐ <b>这是全讲最该背下来的一页。</b>", "<b>推导只有两步</b>：L = −log p 给出 <b>∂L/∂p = −1/p</b>；sigmoid 给出 <b>∂p/∂z = p(1−p)</b>。把两者相乘：<b>(−1/p) × p(1−p) = −(1−p) = p − 1</b>。⭐ <b>当 y = 1 时这正是 p − y。</b>（一般情形下对 y=0 也成立，课件直接给了统一式子。）", "⚠️ <b>课件用了 <em>almost everything cancels</em>（几乎全约掉）来形容</b>——<b>分母的 p 和分子的 p 消掉了</b>，剩下一个极其简洁的结果。", "⭐ <b>δ = p − y 的含义非常直观</b>：<b>它就是「预测减目标」，也就是预测错了多少、朝哪个方向错</b>。本例 δ = 0.750260 − 1 = <b>−0.249740</b>（负号表示<b>预测偏低了</b>）。", "⭐⭐ <b>有了 δ，所有参数的梯度就是一行乘法</b>：<b>∂L/∂wᵢ = δ · xᵢ</b>，<b>∂L/∂b = δ</b>。<br>⚠️ <b>偏置的梯度就是 δ 本身</b>，因为 b 相当于乘了一个恒为 1 的输入。", "<b>代入本例的三个梯度</b>：<b>∂L/∂w₁ = δ×1 = −0.249740</b>；<b>∂L/∂w₂ = δ×2 = −0.499480</b>；<b>∂L/∂b = δ = −0.249740</b>。", "⭐ <b>课件对每个数都给了一句「怎么读」</b>：w₁ 和 b 是「<b>小幅调大会降低损失</b>」；w₂ 是「<b>效果是两倍，因为 x₂ = 2</b>」。<b>输入越大的那个权重，梯度也越大</b>——这是 δ·xᵢ 这个式子的直接后果。", "<b>p30 把整条链画成三步流程图</b>：① 前向传播算出 p ② 在输出处算损失梯度 δ = p − y ③ 反向传播到各参数（δ×x₁、δ×x₂、δ）。右侧还给了 δ 的数值和一张参数梯度表，<b>w₂ 那一行的箭头画得最粗</b>——因为它的梯度最大。"], "tbl": [{"cap": "三个参数的梯度（课件原表）", "head": ["参数", "损失梯度", "怎么读"], "rows": [["w₁", "δ × x₁ = <b>−0.249740</b>", "小幅调大会降低损失"], ["w₂", "δ × x₂ = <b>−0.499480</b>", "<b>两倍的效果，因为 x₂ = 2</b>"], ["b", "δ = <b>−0.249740</b>", "调大会抬高分数、降低损失"]]}], "say": "<b>为什么这个约分不是巧合？</b>⭐ 因为 <b>sigmoid 和交叉熵是「配套设计」的</b>。交叉熵的 −1/p 恰好抵消掉 sigmoid 导数里的 p，留下一个干净的 p − y。<b>这不是运气，是选择 BCE 作为 sigmoid 配套损失的主要理由之一。</b><br>⚠️ <b>反过来说</b>：如果你给 sigmoid 配上<b>平方损失</b>（L = (p−y)²），这个约分就不会发生，梯度里会多出一个 p(1−p) 因子。<b>而 p(1−p) 在模型自信时接近 0，于是「自信地错」的样本几乎得不到梯度，学习会卡住</b>。<b>这正是分类任务不用平方损失的根本原因</b>——T2 讲损失函数时会正式展开。", "exam": "⭐⭐⭐ <b>这一页是 T1 扩展题最可能的落点。</b><b>典型题</b>：给出 x、y、w、b，要求算出三个参数的梯度。<b>满分写法五行</b>：① z = … ② p = σ(z) = … ③ <b>δ = p − y = …</b> ④ ∂L/∂w₁ = δx₁ = …，∂L/∂w₂ = δx₂ = …，∂L/∂b = δ = … ⑤ 一句解读（哪个参数该往哪动）。⚠️ <b>δ 一定要单独写成一行并标出来</b>，这是评分点。", "tip": {"t": "⚠ δ 是对 z 求导，不是对 p", "v": "<b>δ ≝ ∂L/∂z</b>（对<b>分数</b>求导），不是 ∂L/∂p。这就是为什么它能直接乘上 xᵢ 得到权重的梯度——因为 ∂z/∂wᵢ = xᵢ。<b>搞混 z 和 p 这一步，后面全错。</b>", "w": 1}}, {"r": [31, 31], "t": "★★ 迈一步之后：检查新的预测", "star": 3, "one": "η=0.1 更新一次后：z 1.100000→1.249844、p 0.750260→0.777273、L 0.287335→0.251964，全都朝好的方向动了。", "quote": "<b>The probability and the loss improved, on this one example only.</b>", "eq": "w₁ ← 0.2 − 0.1×(−0.249740) = 0.224974\nw₂ ← 0.4 − 0.1×(−0.499480) = 0.449948\nb  ← 0.1 − 0.1×(−0.249740) = 0.124974", "pts": ["<b>更新规则是 θ ← θ − η·(∂L/∂θ)</b>。本例学习率 η = 0.1，三个梯度都是负的，所以<b>减去一个负数 = 加上一个正数</b>，三个参数都变大了。", "<b>算出来的新参数</b>：w₁ = <b>0.224974</b>（≈0.2250）、w₂ = <b>0.449948</b>（≈0.4499）、b = <b>0.124974</b>（≈0.1250）。", "<b>再做一次前向传播</b>：z = 0.224974×1 + 0.449948×2 + 0.124974 = <b>1.249844</b>；p = σ(1.249844) = <b>0.777273</b>；L = −log(0.777273) = <b>0.251964</b>。", "⭐ <b>三个量全都朝好的方向动了</b>：分数升高、概率更接近目标 1、损失下降。课件画了一条 0 到 1 的数轴，蓝点（before 0.7503）和红点（after 0.7773）紧挨着，右边是金色星星标的目标 y = 1。", "⚠️⚠️ <b>但课件立刻加了一句限制</b>：<em>The probability and the loss improved, <b>on this one example only</b>.</em>——<b>改善只发生在这一个样本上</b>。", "⭐ <b>这句限制非常重要</b>：<b>这一步是照着「这一个样本的损失」算的梯度</b>，它<b>不保证</b>别的样本也变好，更不保证整个数据集的平均损失下降。<b>真实训练里要对一批样本的平均损失求梯度</b>——这正是 T2 要讲的「批量」。"], "tbl": [{"cap": "一次更新前后（课件原表）", "head": ["量", "更新前", "更新后", "变化"], "rows": [["分数 z", "1.100000", "<b>1.249844</b>", "↑"], ["概率 p", "0.750260", "<b>0.777273</b>", "↑（更靠近 y=1）"], ["BCE 损失 L", "0.287335", "<b>0.251964</b>", "<b>↓ 更好</b>"]]}], "say": "<b>注意 p 只动了 0.027，看起来很小。</b>⭐ 这是<b>正常</b>的：梯度下降<b>本来就是一小步一小步走的</b>。真实训练要走成千上万步（T2 会讲 epoch）。<br>⚠️ <b>那能不能一步到位，把 η 设得很大？</b>不能，原因在 p23 和 p32：<b>梯度只是局部信息，步子大了就跨出了它准确的范围</b>，可能直接跳过最低点、落到更高的地方。<b>p33 右侧那张「小 η vs 大 η」的对照图画的就是这件事。</b>", "exam": "⭐⭐⭐ <b>「做一次完整的学习步」是扩展题的标准题型</b>，而且分值高（10 分）。<b>完整答法七行</b>：① z ② p ③ L ④ <b>δ = p − y</b> ⑤ 三个梯度 ⑥ <b>三个更新后的参数（写出 θ − η·grad 的代入过程）</b> ⑦ <b>重算 z、p、L 并说明改善</b>。⚠️ <b>最后一句务必补上「只在这一个样本上改善」</b>——这往往是最后一个得分点。", "tip": {"t": "符号不要搞反", "v": "⚠️ <b>梯度是负的，减去它 = 参数变大</b>。很多人看到「梯度下降」就以为参数一定变小，这是错的。<b>参数往哪边动，取决于梯度的符号。</b>", "w": 1}}, {"r": [32, 33], "t": "★★ 为什么是减号：梯度指向上坡", "star": 3, "one": "用加号试一次：0.2 + 0.1×(−0.249740) = 0.175026，分数和概率都降了，y=1 时损失反而升高。", "quote": "<b>Why minus works:</b> the gradient points towards higher loss. Subtract it and you walk towards lower loss, at least locally. <b>The caveat:</b> downhill is a local promise. A step that is too large can jump past the valley and land higher.", "eq": "θ ← θ − η·(∂L/∂θ)\n（用加号会得到 0.2 + 0.1×(−0.249740) = 0.175026，方向错了）", "pts": ["<b>课件先故意走错一次</b>：如果用加号，w₁ = 0.2 + 0.1×(−0.249740) = <b>0.175026</b>。参数变小了，<b>分数和概率都会下降</b>，而目标是 1，所以<b>损失反而上升</b>。", "⭐ <b>为什么减号对？</b><em>the gradient points towards higher loss</em>——<b>梯度指向损失升高的方向</b>。所以<b>减去它，就是往损失降低的方向走</b>。", "⚠️ <b>课件加了「at least locally」（至少在局部）</b>，这个限定词很关键，紧接着的 <em>caveat</em> 就在讲它。", "⭐⭐ <b>那条警告值得记</b>：<em>downhill is a local promise. A step that is too large can jump past the valley and land higher.</em>——<b>「下坡」只是一个局部的承诺。步子迈太大，可能一步跨过谷底，落到更高的地方。</b>", "⭐ <b>最后一句把两件事分开</b>：<em>Direction comes from the gradient; distance comes from η. Both matter.</em>——<b>方向来自梯度，距离来自学习率，两者都要紧。</b>（这正是 p25 末尾那句话的回声。）", "<b>p33 用三个面板把这一页画出来</b>：左「走错方向（+）」给出 0.2000 + 0.1×(−0.2497) = <b>0.1750</b>，并标 <em>p down, loss up</em>；中「为什么减号管用」画了一条损失曲线，红箭头标「梯度指向上坡」、绿箭头标「减去它往下走」；右「步长 η」画了同一条谷，<b>小 η 稳稳走到谷底，大 η 一步跨到对岸更高处</b>。"], "tbl": [{"cap": "两个独立的决定", "head": ["决定什么", "由谁给", "搞错了会怎样"], "rows": [["<b>往哪个方向走</b>", "梯度的符号（再取负）", "⚠ 用加号 ⇒ 损失越走越高"], ["<b>走多远</b>", "学习率 η", "⚠ 太大 ⇒ 跨过谷底落得更高；太小 ⇒ 走得极慢"]]}], "say": "<b>为什么梯度指向「上坡」？</b>⭐ 按定义，<b>∂L/∂w 是「w 增加一点，L 增加多少」</b>。如果这个数是正的，说明<b>增大 w 会让损失上升</b>——那么要降低损失就该<b>减小</b> w，正好是 w − η×(正数)。如果它是负的（本例就是），<b>增大 w 会让损失下降</b>，而 w − η×(负数) = w + 正数，确实是增大 w。<b>两种情况下减号都给出正确方向，这就是为什么公式里永远写减号。</b><br>⚠️ <b>「局部」这个词在 T1 里出现了三次</b>（p23 斜率沿曲线变、p25 梯度给局部方向、p32 下坡是局部承诺）。<b>这不是啰嗦，是在反复提醒：梯度只在当前点附近可信。</b>", "exam": "⭐⭐ <b>扩展题可能问</b>：「某同学把更新规则写成 θ ← θ + η∇L，会发生什么？」<b>答法</b>：① 梯度指向损失升高的方向 ② 加号意味着朝损失升高的方向走 ③ <b>代入本例算一次给出具体数字</b>（w₁ 从 0.2 变成 0.175026，p 下降，y=1 时 L 上升）④ 结论：必须用减号。<br>⭐ <b>另一个高频点是「学习率太大会怎样」</b>——<b>跨过最低点，损失反而上升甚至发散</b>。", "tip": {"t": "两个符号别混", "v": "⚠️ 课件在 p28 用 <b>α</b>、在 p32–p33 用 <b>η</b>，<b>都是学习率</b>。考试时用哪个都行，但<b>同一份答卷里要统一</b>。", "w": 0}}, {"r": [34, 34], "t": "一次训练步里，什么变了什么没变", "star": 3, "one": "权重和偏置被优化器更新；激活和预测下次前向时重算；输入和目标固定不动。", "quote": "<b>Weights and biases:</b> updated by the optimiser, using the gradients. <b>Activations and predictions:</b> recomputed on the next forward pass, not stored &amp; edited. <b>Inputs and targets:</b> fixed; the data is the reference, not a parameter.", "pts": ["⭐ <b>这一页用一张三行表回答了一个容易糊涂的问题：训练到底在改什么？</b>", "<b>① 权重和偏置</b>：<em>updated by the optimiser, using the gradients</em>——<b>由优化器根据梯度更新</b>。<b>这是训练唯一真正改动的东西。</b>", "<b>② 激活值和预测</b>：<em>recomputed on the next forward pass, not stored &amp; edited</em>——<b>下一次前向传播时重新算出来，不是存起来再去改它</b>。⚠️ <b>这一条纠正了一个很常见的误解</b>：以为训练是在「调整预测值」。不是——<b>预测是参数的结果，参数变了预测自然跟着变。</b>", "<b>③ 输入和目标</b>：<em>fixed; the data is the reference, not a parameter</em>——<b>固定不动；数据是参照物，不是参数</b>。⭐ <b>这一条呼应 p4 那句「权重和偏置是参数，其余一切都是算出来的」</b>，而数据连「算出来的」都不是，它是外部给定的。", "⚠️ <b>把三条连起来读，就是一次训练步的因果链</b>：<b>数据不动 → 参数被改 → 于是激活和预测重算 → 损失变了</b>。"], "tbl": [{"cap": "一次训练步里各类量的命运（课件原表）", "head": ["这类量", "发生什么"], "rows": [["<b>权重与偏置</b>", "<b>被优化器用梯度更新</b>"], ["激活值与预测", "下次前向时重算，<b>不是存起来再编辑</b>"], ["输入与目标", "<b>固定</b>；数据是参照物，不是参数"]]}], "say": "<b>这一页看着平淡，但它解释了一个实践上的要点</b>：⭐ <b>为什么反向传播必须紧接着一次前向传播？</b>因为算梯度要用到这一次前向的中间值——<b>p23 那张表里就写着「needs p from the same forward pass」</b>。如果参数已经更新过，而你用的还是旧的 p，梯度就是错的。<b>「前向 → 反向 → 更新」这个顺序不能打乱</b>。<br>⚠️ <b>顺带澄清</b>：虽然激活值「不被编辑」，但它们在反向传播期间<b>会被临时保存</b>（框架里叫 activation cache），用完即弃。<b>保存是为了算梯度，不是为了修改它们</b>——课件那句 <em>not stored &amp; edited</em> 强调的是后半句。", "exam": "⭐⭐ <b>选择题高频</b>：「训练过程中下面哪一项会被更新？」答案是<b>权重和偏置</b>。⚠️ <b>干扰项通常是「预测值」「输入数据」「激活函数」</b>——三个都不对。<b>激活函数是规则不是参数</b>（p14 已经强调过），<b>数据是参照物</b>，<b>预测是结果</b>。"}, {"r": [35, 35], "t": "★★★ 完整的一张图：五步走完整个流程", "star": 3, "one": "Predict → Target → Gradients → Update → Check，课件把整讲压成这五格。", "quote": "<b>1 Predict</b>（p = 0.7503, L = 0.2873）→ <b>2 Target</b>（y = 1）→ <b>3 Gradients</b>（δ = −0.2497）→ <b>4 Update</b>（θ ← θ − η·gradient, η = 0.1）→ <b>5 Check</b>（p = 0.7773, L = 0.2520）· <em>lower loss, better prediction</em>", "pts": ["⭐⭐⭐ <b>这一页是整个 T1 的浓缩，考前只看一页的话就看它。</b>", "<b>① Predict（预测）</b>：x₁=1、x₂=2 经过 Σ 和 sigmoid，得到 <b>p = 0.7503</b>、<b>L = 0.2873</b>。", "<b>② Target（目标）</b>：<b>y = 1</b>。⚠️ <b>它被单独画成一格，不是凑数</b>——没有它就没有方向（p25 的主题）。", "<b>③ Gradients（梯度）</b>：<b>δ = p − y = −0.2497</b>，于是 ∂L/∂w₁ = −0.2497、∂L/∂w₂ = −0.4995、∂L/∂b = −0.2497。", "<b>④ Update（更新）</b>：<b>θ ← θ − η·gradient，η = 0.1</b>。表里给了前后对照：w₁ 0.2000→<b>0.2250</b>、w₂ 0.4000→<b>0.4499</b>、b 0.1000→<b>0.1250</b>。", "<b>⑤ Check（检查）</b>：重新前向一次，<b>p = 0.7773</b>、<b>L = 0.2520</b>。底部标语：<em>lower loss, better prediction</em>。", "⭐ <b>注意第 1 格和第 5 格画的是同一个网络结构图</b>——这不是重复，而是在强调：<b>检查这一步就是「再做一次前向传播」</b>，用的还是那台机器，只是参数换了。"], "tbl": [{"cap": "五步速查（考前背这张）", "head": ["步", "做什么", "本例的数"], "rows": [["1 Predict", "前向传播到 p，算损失", "z=1.1, p=0.7503, L=0.2873"], ["2 Target", "取出已知标签", "y = 1"], ["3 Gradients", "<b>δ = p − y</b>，再乘各自的 x", "δ=−0.2497 ⇒ −0.2497 / −0.4995 / −0.2497"], ["4 Update", "θ ← θ − η·grad", "w=(0.2250, 0.4499), b=0.1250"], ["5 Check", "重做前向，看损失", "p=0.7773, <b>L=0.2520 ↓</b>"]]}], "say": "<b>把这张图和 p2 那五个词对照一下，会发现它们是同一件事的两种写法</b>：⭐ p2 说 <b>Neuron → Network → Sensitivity → Learning signal → Update</b>；p35 说 <b>Predict → Target → Gradients → Update → Check</b>。<b>课件开头铺的五个词，结尾用五格兑现了。</b><br>⚠️ <b>唯一的差别是 p35 多了「Check」这一步，而 p2 多了「Network」这一节</b>——前者是实践纪律（改完要验），后者是 p11–p18 那一大段关于多层的内容。<b>两张图合起来，T1 就没有遗漏了。</b>", "exam": "⭐⭐⭐ <b>这五格就是扩展题「描述一次训练步」的满分提纲</b>，照着写五段，每段带上本例的数字即可。⚠️ <b>务必写到第 5 步</b>——很多人算完更新就停了，<b>漏掉「重新检查」会丢掉完整性分</b>，而课件专门用一整页（p31）讲这一步，说明它是被看重的。", "tip": {"t": "考前十分钟看什么", "v": "⭐ 如果只剩十分钟，按这个顺序过：<b>p35（五步总图）→ p29（δ = p − y）→ p6（前向四步）→ p13（数参数）→ p18（为什么要非线性）</b>。这五页覆盖了 T1 绝大部分分值。", "w": 0}}];
