<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS229 讲义精读 · 主成分分析（讲义 Part XI） · 逐页精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}
.qbadge.bad{color:var(--warn)}
#wrongBox .tally{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
#wrongBox .tally span{border:1px solid var(--line);border-radius:8px;padding:5px 11px;
  font-size:12.5px;color:var(--dim);background:var(--sunken)}
#wrongBox .tally b{color:var(--ink);font-weight:650}
#wrongBox .tally b.hot{color:var(--warn)}
.wrow .h{gap:3px}
.wrow .h u{display:flex;gap:2px;text-decoration:none;
  padding-right:7px;margin-right:4px;border-right:1px solid var(--line)}
.wrow .h u:last-child{border-right:0;padding-right:0;margin-right:0}
#revChip{display:none;align-items:center;gap:9px;border:1px solid var(--warn);
  border-radius:8px;padding:5px 11px;font-size:12.5px;color:var(--warn);
  background:var(--tintwarn2);white-space:nowrap}
#revChip.on{display:inline-flex}
#revChip b{font:650 12px var(--mono)}
#revChip button{background:none;border:0;color:var(--dim);cursor:pointer;
  font:12px var(--cjk);text-decoration:underline;padding:0}
#revChip button:hover{color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default}
.btn:disabled:hover{border-color:var(--line)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qhist{font:11px var(--mono);color:var(--dim);margin-top:8px;display:flex;
  align-items:center;gap:5px}
.qhist i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.qhist i.o{background:var(--acc)} .qhist i.x{background:var(--warn)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
#strip b.err{background:var(--errdot)}
#strip b.err.on{background:var(--acc2)}
/* 错题本 */
#wrongPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#wrongPanel.on{display:flex}
#wrongBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(760px,100%);max-height:84vh;overflow:auto;padding:22px 24px}
#wrongBox h3{margin:0 0 4px;font-size:18px}
#wrongBox .sub{color:var(--dim);font-size:13px;margin:0 0 16px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;
  border:1px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--sunken)}
.wrow:hover{border-color:var(--acc2)}
.wrow .p{font:700 12px var(--mono);color:var(--acc2);flex:0 0 52px}
.wrow.done{opacity:.5}
.wrow.done .p{color:var(--acc)}
.wrow .n2{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.wrow .s{font:11.5px var(--mono);color:var(--dim);flex:0 0 auto}
.wrow .h{display:flex;gap:3px;flex:0 0 auto}
.wrow .h i{width:9px;height:9px;border-radius:2px;font-style:normal;background:var(--dot)}
.wrow .h i.o{background:var(--acc)} .wrow .h i.x{background:var(--warn)}
#wrongBox .none{color:var(--dim);text-align:center;padding:30px 0;line-height:2}
#wrongFoot{display:flex;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line)}
#wrongFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ EXTRA_CSS:BEGIN ══ */
/* ══ 讲解区里的链接兜底 ══
   ⚠ 2026-10-03 查出来的：原先只给 .ng a 上了色，放在 tip / say / pts / exam 里的链接
   会退回浏览器默认的 #0000EE —— 浅色下还能看（8.47:1），**暗色下只有 1.95:1**。
   做 notes2 时第一次往 tip 里放时间码链接就撞上了。这条规则管住所有其它位置。 */
#card a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
#card a:hover{opacity:.75}

/* ══ 「从零补基础 · Andrew Ng」栏 ══ */
.ng{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintviolet)}
.ng .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--violet);
  letter-spacing:.4px;margin-bottom:5px}
/* ⚠ 要用 #card .ng a 而不是 .ng a —— 上面的兜底规则带了 #card 这个 id，
   光写 .ng a（0,1,1）会被 #card a（1,0,1）压过去，紫色链接会变蓝。 */
#card .ng a{color:var(--violet);text-decoration:none;border-bottom:1px solid var(--violet)}
#card .ng a:hover{opacity:.75}
.ng .src{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
:root:not([data-theme="dark"]) .ng{box-shadow:var(--shadow)}

/* ══ 「课件原话」栏：引官方英文 ══ */
.quote{border-left:3px solid var(--dim);background:var(--lift2);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;font-size:13px;line-height:1.7;color:var(--ink3)}
.quote .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--dim);
  letter-spacing:.4px;margin-bottom:5px}
.quote b{color:var(--ink2)}
.quote em{font-style:normal;color:var(--ink2);font-weight:560}

/* ══ 笔记表格：对比表 / 情况表 / 数值表 ══ */
.tw{margin:13px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tc{font-size:11.5px;font-family:var(--mono);color:var(--dim);letter-spacing:.3px;
  padding:7px 12px;background:var(--sunken);border-bottom:1px solid var(--line)}
table.nt{width:100%;border-collapse:collapse;font-size:12.8px;line-height:1.55}
table.nt th{text-align:left;font-weight:620;font-size:11.5px;color:var(--dim);
  background:var(--panel2);padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
table.nt td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.nt tbody tr:last-child td{border-bottom:none}
table.nt td:first-child{font-weight:560;color:var(--ink2)}
table.nt b{color:var(--ink2)}
:root:not([data-theme="dark"]) .tw{box-shadow:var(--shadow)}

/* ══ 「与考试的联系」栏 ══ */
.exam{border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;font-size:13.5px;line-height:1.72;background:var(--tintacc2)}
.exam .t{display:block;font-size:11.5px;font-family:var(--mono);color:var(--acc2);
  letter-spacing:.4px;margin-bottom:5px}
:root:not([data-theme="dark"]) .exam{box-shadow:var(--shadow)}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}
/* ══ EXTRA_CSS:END ══ */

</style>
</head>
<body data-key="cs234-2019-l01">

<div id="bar">
  <h1>CS229 讲义精读 · <span>主成分分析（讲义 Part XI）</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 6</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <span id="revChip">复习模式 <b></b><button id="revOff">退出</button></span>
  <button class="btn" id="wrongBtn">错题本</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="wrongPanel"><div id="wrongBox">
  <h3>错题本</h3>
  <p class="sub">错过的题<b>连着答对两次就毕业</b>，自动从这里和复习模式里退出。<br>
  还没毕业的排在前面，最近错得多的更靠前。点任意一行跳到那一页重看。</p>
  <div class="tally" id="wrongTally"></div>
  <div id="wrongList"></div>
  <div id="wrongFoot">
    <button class="btn" id="revOn">只复习这些页</button>
    <button class="btn" id="wrongClose">关闭</button>
    <button class="btn" id="wrongReset">清空全部记录</button>
  </div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示课件？</b></p>
      <p>本页直接引用同目录下的 <code>slides/cs229-notes10.pdf</code>。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>精读</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/CS229-PCA-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say CS229 / 讲义补充（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {"1": [{"q": "讲义开篇说 PCA 相对因子分析「更直接」，直接在哪里？", "o": ["PCA 不需要预处理", "PCA 只要一次特征向量计算，不必像因子分析那样用迭代的 EM", "PCA 可以处理非线性结构", "PCA 不需要指定降到几维"], "a": 1, "why": "原文：<em>PCA will do so more directly, and will require only an eigenvector calculation, and does not need to resort to EM</em>。两者目标相同（找数据近似所在的低维子空间），差别在于<b>因子分析是概率模型、要用 EM 迭代，PCA 一次特征分解就完事</b>。"}], "2": [{"q": "按讲义的说法，什么情况下可以<b>省略</b>「除以标准差」这一步？", "o": ["特征数超过样本数时", "样本量很大时", "任何时候都不能省", "事先知道各个属性本来就在同一尺度上，例如灰度图像的像素值都取 0–255"], "a": 3, "why": "原文：<em>This rescaling may be omitted if we had a priori knowledge that the different attributes are all on the same scale</em>，举的例子正是灰度图像。⚠️ 另一步「减均值」也可省——条件是<b>已知数据零均值</b>（如语音时间序列）。但<b>本课把中心化当作标准推导的前提</b>，答题按本课口径。"}, {"q": "CS229 讲义里 σ²ⱼ 的分母是 1/n，本课用的是 S/(n−1)。这个差别的后果是？", "o": ["会导致投影得分的符号相反", "两者算出的结果完全一样", "特征向量完全相同、解释方差比也相同，只有特征值差一个常数倍", "特征向量会不同，所以主方向不同"], "a": 2, "why": "两者只差一个<b>正常数倍</b>：Σ 与 cΣ 的<b>特征向量完全相同</b>，特征值差 c 倍；而解释方差比 λⱼ/Σλ 里分子分母同时乘 c，<b>比值不变</b>。所以主方向和解释方差比都不受影响。"}], "3": [{"q": "讲义把「找主轴」这个模糊说法收紧成了什么可优化的量？", "o": ["投影后数据的方差——选一个单位向量 u 使它最大", "原始数据的总方差", "投影后数据到原点的平均距离", "重构误差的绝对值之和"], "a": 0, "why": "原文：<em>finding the unit vector u so that when the data is projected onto the direction corresponding to u, the variance of the projected data is maximized</em>。⚠️ 注意第 4 页用「点离原点远」来描述方差大——<b>这个等价只在数据已中心化时成立</b>。"}], "5": [{"q": "把 (1/n)Σ(x⁽ⁱ⁾ᵀu)² 展开后，中间露出来的那个矩阵是什么？", "o": ["数据矩阵本身", "数据的经验协方差矩阵 Σ = (1/n)Σ x⁽ⁱ⁾x⁽ⁱ⁾ᵀ（在零均值前提下）", "投影矩阵 uuᵀ", "单位矩阵"], "a": 1, "why": "把 u 提到括号外：(1/n)Σ uᵀx⁽ⁱ⁾x⁽ⁱ⁾ᵀu = uᵀ[(1/n)Σ x⁽ⁱ⁾x⁽ⁱ⁾ᵀ]u = <b>uᵀΣu</b>。中间那一坨正是<b>经验协方差矩阵</b>——前提是数据已零均值。"}, {"q": "讲义的脚注 1 说，用什么方法可以证明最优的 u 必须满足 Σu = λu？", "o": ["牛顿法", "奇异值分解的定义", "梯度下降", "拉格朗日乘子法——在约束 uᵀu = 1 下最大化 uᵀΣu"], "a": 3, "why": "脚注原文：<em>try using the method of Lagrange multipliers to maximize uᵀΣu subject to uᵀu = 1. You should be able to show that Σu = λu</em>。⭐ 所以<b>「主方向必须是特征向量」是解出来的结论，不是定义</b>。"}, {"q": "讲义的脚注 2 说 uᵢ 们两两正交，理由是什么？", "o": ["因为 Σ 是对称矩阵，而对称矩阵的特征向量（总可以选成）相互正交", "因为 u 都是单位向量", "因为数据已经中心化", "PCA 算法额外强制要求正交"], "a": 0, "why": "脚注原文：<em>Because Σ is symmetric, the uᵢ's will (or always can be chosen to be) orthogonal to each other</em>。⭐ <b>正交性来自线性代数的性质，不是 PCA 外加的约束。</b>"}], "6": [{"q": "讲义说 PCA 还可以用另一个目标推出来，是哪一个？", "o": ["选一组基使「把数据投影到该 k 维子空间所造成的近似误差」最小", "最大化类别之间的间隔", "最大化似然", "最小化训练误差"], "a": 0, "why": "原文：<em>PCA can also be derived by picking the basis that minimizes the approximation error arising from projecting the data onto the k-dimensional subspace</em>（习题集 4）。⭐ <b>「最大化投影方差」与「最小化正交重构误差」是同一件事</b>——总方差固定，保住的多、丢掉的就少。"}, {"q": "讲义第 6 页说降维能「帮助避免过拟合（VC 维更小）」，但 Ng 在同一门课的课堂上怎么说这个用法？", "o": ["他没有提到这个用法", "完全同意，这是他最推荐的用法", "把它点名为「可疑」，说一半时间有用一半没用，文献里成功率高是发表偏倚，他自己改用正则化", "他说这个用法只适用于图像数据"], "a": 2, "why": "⚠️ <b>讲义与课堂在这一点上不一致</b>。Ng 在 L15 的 38:00 起把「用 PCA 降过拟合」归入 <em>questionable</em>，理由是有效与无效各半，而<b>只有有效的那一半被写成论文</b>（发表偏倚）。<b>答题按课堂与本课课件的口径</b>：PCA 不看 y，抗过拟合用正则化更直接。"}]};

var N = [{"r": [1, 1], "star": 2, "t": "PCA 要解决什么：自动发现并去掉冗余", "one": "和因子分析目标相同，但 PCA 更直接——只要一次特征向量计算，不用 EM。", "quote": "<em>PCA will do so more directly, and will require only an eigenvector calculation …, and does not need to resort to EM.</em>", "pts": ["<b>开篇先和因子分析对照</b>：两者都想找「数据近似所在的低维子空间」。因子分析是<b>概率模型</b>，参数估计要用<b>迭代的 EM</b>；<b>PCA 更直接</b>——一次特征向量计算就完事。", "⭐ <b>这句对照解释了 PCA 在整幅地图里的位置</b>：它是<b>非概率</b>的那一格。Ng 后来在课上用一张 2×2 把四个无监督算法摆开，PCA 和因子分析同在「低维子空间」那一行，差别就是建不建模 P(x)。", "<b>第一个例子：mph 与 km/h</b>。一份汽车数据里有两列其实是<b>同一个最高速度的两种单位</b>，除了四舍五入的小差别之外<b>几乎线性相关</b>。所以数据实际上住在一个低一维的子空间里。<b>问题：怎么自动检测并去掉这种冗余？</b>", "<b>第二个例子：遥控直升机飞手</b>。x₁ 是<b>飞行技术</b>，x₂ 是<b>喜欢飞的程度</b>。因为遥控直升机很难飞，<b>只有真正享受飞行的人才会投入到成为好飞手</b>——所以这两个属性强相关。"], "tbl": [{"cap": "两个动机例子的性质不同", "head": ["例子", "两列的关系", "背后是什么"], "rows": [["mph / km/h", "<b>几乎严格线性相关</b>", "单位冗余，没有新信息"], ["技术 / 乐趣", "强相关但不严格", "<b>一个没被直接测量的量</b>（下一页叫它 karma）"]]}], "say": "⭐ 两个例子的<b>性质差别</b>值得想一层：第一个例子里，去掉冗余是<b>无损的</b>——两列本来就是同一个数。第二个例子里，提炼出的那根主轴<b>对应一个你事先说不出、也没有直接测量的量</b>，这既是 PCA 最诱人的地方，<b>也是最容易过度解读的地方</b>。Ng 后来在课堂上会专门警告：<b>不要去解读单个特征向量</b>。", "ng": "Ng 在课上把这两个例子讲得更细：<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=129s\" target=\"_blank\">02:09</a> 起他先讲厘米/英寸（讲义里写的是 mph/km/h，同一个意思），再讲<b>工厂机器上的两个振动传感器</b>（讲义没有这个例子），最后才是直升机飞手。⭐ 课堂比讲义多的那个传感器例子很有用——它说明压缩的不一定是<b>单位</b>，也可以是<b>同一个物理量的两次带噪观测</b>。<span class=\"src\">CS229/transcripts/L15.txt · 本地已下载</span>", "exam": "本课 T1 第一页就是「无监督在问什么」。这里的 mph/km/h 例子正是备考包里那道「两列分别以 mph 和 km/h 记录」选择题的原型：<b>严格成比例 ⇒ 对应特征值≈0 ⇒ 丢掉几乎无损</b>。", "tip": {"t": "记号差别", "v": "讲义用 <b>d</b> 表示特征维数、<b>n</b> 表示样本数（写作 x∈R^d, i=1..n）。⚠️ 本课课件用的是 <b>n 维 / m 个样本</b>的写法，两边<b>恰好相反</b>，读的时候要换过来。"}}, {"r": [2, 2], "star": 3, "t": "★ 预处理：两步，而且各自可以省", "one": "减均值、除以标准差——但讲义明确说了各自在什么情况下可以省略。", "quote": "<em>Subtracting µⱼ zeros out the mean and <b>may be omitted</b> for data known to have zero mean</em> … <em>This rescaling <b>may be omitted</b> if we had a priori knowledge that the different attributes are all on the same scale.</em>", "eq": "x⁽ⁱ⁾ⱼ ← ( x⁽ⁱ⁾ⱼ − µⱼ ) / σⱼ\nµⱼ = (1/n) Σᵢ x⁽ⁱ⁾ⱼ\nσ²ⱼ = (1/n) Σᵢ ( x⁽ⁱ⁾ⱼ − µⱼ )²", "pts": ["<b>先出现的是 u₁ 这根轴的含义</b>：讲义说它捕捉的是一个人<b>内在的飞行「karma」</b>，偏离这根轴的只是<b>少量噪声</b>。⚠️ 注意「噪声」这个词——<b>这是 PCA 的假设，不是数据自带的事实</b>。", "<b>减均值</b>：把均值归零。<b>什么时候可以省</b>——<em>已知数据本来就零均值</em>时（讲义举的例子是<b>语音等声学信号的时间序列</b>）。", "<b>除以标准差</b>：让每个坐标方差为 1，<b>确保不同属性在同一「尺度」上</b>。讲义的例子：x₁ 是汽车最高时速（几十到上百），x₂ 是座位数（2–4），不缩放的话前者独占一切。", "⭐ <b>什么时候可以省缩放</b>——<em>事先知道各属性本来就同尺度</em>时。讲义举的例子是<b>灰度图像</b>：每个像素都取 0–255，本来就可比。"], "tbl": [{"cap": "两步预处理 · 各自的作用与可省条件", "head": ["步骤", "作用", "<b>什么时候可以省</b>"], "rows": [["减去 µⱼ", "把均值归零", "<b>已知数据零均值</b>（如语音时间序列）"], ["除以 σⱼ", "各坐标方差变 1，尺度可比", "<b>已知各属性同尺度</b>（如灰度图像 0–255）"]]}, {"cap": "⚠ 方差的分母：讲义与本课不同", "head": ["", "CS229 讲义", "ARTI2001 本课"], "rows": [["σ² 的分母", "<b>1/n</b>", "S/(n−1)（样本协方差）"], ["影响特征向量吗", "<b>不影响</b>", "<b>不影响</b>"], ["影响特征值吗", "影响（差常数倍）", "影响（差常数倍）"], ["影响解释方差比吗", "<b>不影响</b>", "<b>不影响</b>"]]}], "say": "⭐ 这一页最值钱的是<b>「可省」那两句</b>——它把预处理从「固定流程」变成了<b>有条件的决定</b>。本课讲义的措辞其实一致：<em>centre features; standardise <b>if units differ</b></em>。<br>⚠️ 但两边的<b>地位</b>略有不同：CS229 说<b>两步都可省</b>（零均值数据可以不减均值）；<b>本课把中心化当作标准推导的前提</b>，只有标准化是有条件的。<b>答题按本课口径</b>：中心化必须，标准化要论证。", "ng": "课堂上 Ng 讲这段在 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=408s\" target=\"_blank\">06:48</a>，一句话带过（<em>common pre-processing is to zero out the mean and standard deviation</em>），<b>没有展开「什么时候可以省」</b>——那两句只在讲义里。⭐ <b>这是讲义比课堂细的地方</b>，值得记下来。<span class=\"src\">CS229/transcripts/L15.txt · 本地已下载</span>", "exam": "本课 T1 第 13 页专讲缩放与泄漏。两条都要会：<b>①「PCA 自己会中心化但不会标准化」②缩放是建模决定不是化妆</b>。这一页给了「什么时候可以不标准化」的两个具体情形，答题时举得出例子更有说服力。", "tip": {"t": "高频失分点", "v": "<b>把「可省」读成「不重要」。</b> 讲义说的是<b>在特定条件下</b>可省（已知零均值 / 已知同尺度）。条件不成立时，<b>省了就会出错</b>——大量纲特征会独占第一主方向。"}}, {"r": [3, 4], "star": 2, "t": "把问题提成：哪个方向投影后方差最大", "one": "数据本来带着一定的方差/信息；选一个方向，使投影后尽量多地保住它。", "quote": "<em>finding the unit vector u so that when the data is projected onto the direction corresponding to u, <b>the variance of the projected data is maximized</b></em>", "pts": ["<b>问题的提法</b>：找一个<b>单位向量 u</b>，使数据投影到它上面之后，<b>投影数据的方差最大</b>。", "⭐ <b>讲义给的直觉很准</b>：数据<b>一开始就带着一定量的方差/信息</b>；我们想选一个方向，使得<em>如果</em>把数据近似成只住在这个方向/子空间上，<b>尽可能多的方差仍被保住</b>。", "<b>第 4 页用两张图做对比</b>：选对方向时，<b>投影后的方差相当大，点离原点较远</b>；选错方向时，<b>投影的方差明显更小、点都挤在原点附近</b>。", "⚠️ <b>「离原点远」这个描述只在已中心化的前提下才等于「方差大」</b>——这正是上一页要先减均值的原因。两页是连着的。"], "tbl": [{"cap": "第 4 页那两张图的对比", "head": ["", "好的方向", "差的方向"], "rows": [["投影后的方差", "<b>较大</b>", "明显更小"], ["投影点的位置", "离原点<b>远</b>", "挤在原点附近"], ["保住了多少信息", "多", "少"]]}], "say": "这一页把 PCA 的目标从「找主轴」这种模糊说法，收紧成了一个<b>可优化的量</b>：<b>投影后的方差</b>。⭐ 值得注意的是<b>讲义到这里还没有写任何公式</b>——它先把问题说清楚，下一页才形式化。<b>这个顺序值得模仿</b>：答大题时先用一句话说清「在最大化什么」，再写式子。", "ng": "课堂上对应 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=914s\" target=\"_blank\">15:14</a>：Ng 写下 <em>maximize the variance of the projections</em> 这个记号，然后立刻展开成平方和。⭐ 他在 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=851s\" target=\"_blank\">14:11</a> 先讲清了「投影长度就是内积 xᵀu」——<b>讲义把这一步放到了下一页</b>，课堂的顺序更自然。<span class=\"src\">CS229/transcripts/L15.txt · 本地已下载</span>", "exam": "本课 T1 第 7 页「PCA 找最大方差方向」就是这一步。大题若问「PCA 在最大化什么」，答<b>投影后的方差</b>，并补一句「等价于最小化正交重构误差」（见第 6 页）。"}, {"r": [5, 5], "star": 3, "t": "★★ 核心推导：三行从目标到特征向量", "one": "投影长度是 xᵀu；最大化投影平方平均 = uᵀΣu；配上 ‖u‖=1 就逼出 Σu=λu。", "quote": "<em>maximizing this subject to ‖u‖₂ = 1 gives the <b>principal eigenvector of Σ</b></em> … 脚注：<em>try using the method of <b>Lagrange multipliers</b> … You should be able to show that <b>Σu = λu</b></em>", "eq": "投影长度 = xᵀu\n(1/n) Σᵢ (x⁽ⁱ⁾ᵀu)²  =  uᵀ [ (1/n) Σᵢ x⁽ⁱ⁾x⁽ⁱ⁾ᵀ ] u  =  uᵀ Σ u\n约束 ‖u‖² = 1  ⇒  Σu = λu\ny⁽ⁱ⁾ = ( u₁ᵀx⁽ⁱ⁾, u₂ᵀx⁽ⁱ⁾, …, u_kᵀx⁽ⁱ⁾ )ᵀ ∈ R^k", "pts": ["<b>第一步：投影长度就是内积。</b> 给一个单位向量 u 和一个点 x，<b>x 在 u 上投影的长度是 xᵀu</b>——图上那些圆圈到原点的距离。", "<b>第二步：把平方和的 u 提到外面。</b> (1/n)Σ(x⁽ⁱ⁾ᵀu)² = (1/n)Σ uᵀx⁽ⁱ⁾x⁽ⁱ⁾ᵀu = <b>uᵀ[(1/n)Σx⁽ⁱ⁾x⁽ⁱ⁾ᵀ]u</b>。中间那一坨<b>就是数据的经验协方差矩阵 Σ</b>（在零均值的前提下）。", "⭐ <b>第三步：加上约束就出结论。</b> 在 ‖u‖²=1 下最大化 uᵀΣu，<b>答案是 Σ 的主特征向量</b>。讲义把推导放进了<b>脚注 1</b>：<em>用拉格朗日乘子法，你应该能证出 Σu = λu</em>——也就是 <b>u 是特征向量、λ elp avoid overfitting</b> (e.g., … smaller VC dimension)</em>", "pts": ["⭐ <b>第一句给出等价形式</b>：在所有可能的正交基里，我们选的这一组<b>最大化 Σ‖y⁽ⁱ⁾‖²</b>——也就是保住了尽可能多的变化。而习题集 4 会让你证明：<b>PCA 也可以用「最小化投影造成的近似误差」推出来</b>。<b>两个目标是同一件事。</b>", "<b>应用一：压缩</b>——用低维 y⁽ⁱ⁾ 代替高维 x⁽ⁱ⁾。<b>应用二：可视化</b>——降到 2 或 3 维就能画出来，比如把汽车数据降到二维，看哪些车型相似、哪些聚成一簇。", "<b>应用三：喂给监督学习之前先降维</b>。讲义给的理由有两条：<b>计算上的好处</b>，以及<b>降低假设类的复杂度、帮助避免过拟合</b>（举例：低维输入上的线性分类器 <b>VC 维更小</b>）。", "<b>应用四：去噪</b>——回到飞手的例子，PCA 从带噪的「技术」和「乐趣」里估计出内在的 karma。课堂上还讲了它在人脸图像上的应用，<b>得到 eigenfaces 方法</b>：每张 100×100 的脸是一个 10000 维向量，用 PCA 降到低维后再比距离。"], "tbl": [{"cap": "四类应用 · 讲义的说法 vs Ng 课堂上的态度", "head": ["应用", "讲义怎么说", "<b>Ng 课堂上怎么说</b>"], "rows": [["压缩", "显而易见的应用", "<b>背书</b>（内存/带宽/速度）"], ["可视化", "降到 2–3 维就能画", "<b>背书</b>"], ["降维防过拟合", "VC 维更小，<b>帮助避免过拟合</b>", "⚠ <b>点名为「可疑」</b>，说一半时间有用一半没用"], ["人脸匹配 / eigenfaces", "<b>效果出奇地好</b>", "⚠ <b>「这不是一个好方法」</b>，现在几乎没人用"]]}], "say": "⭐ <b>上表后两行是这一页最值得讲的东西：讲义和课堂自相矛盾。</b><br>讲义（2018 年整理，内容更老）说降维能降 VC 维、帮助避免过拟合，还说 eigenfaces 做人脸检索<b>「效果出奇地好」</b>。但 Ng 在<b>同一门课的课堂上</b>把这两条都点名为 <b>questionable（可疑）</b>——他说防过拟合这招<b>一半时间有用、一半时间没用</b>，而文献里看起来成功率高是因为<b>发表偏倚</b>（有效的被写成论文，无效的没人发），他自己遇到过拟合<b>改用正则化</b>；至于 eigenfaces，他说那些解读<b>「至少一半是研究者的想象」</b>，根源是<b>单个特征向量在数值上不稳定</b>。<br>⚠️ <b>怎么用这个矛盾</b>：答题时<b>别引讲义那句「帮助避免过拟合」</b>，按课堂的口径写——<b>PCA 只最大化输入方差、从不看 y，要判断降维有没有伤到任务只能用验证数据比较</b>。", "ng": "课堂上对应两段，<b>都比讲义的立场保守得多</b>：<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=2280s\" target=\"_blank\">38:00</a> 起讲「可疑的应用」——降维防过拟合、以及人脸匹配；<a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=2504s\" target=\"_blank\">41:44</a> 讲 eigenfaces 的解读<b>至少一半是研究者的想象</b>。另外 <a href=\"https://www.youtube.com/watch?v=dyb_cFywuik&t=2661s\" target=\"_blank\">44:21</a> 他给了一条很实用的经验法则：<b>用 PCA 之前，先试试直接用原始数据会怎么样</b>，并把默认加降维类比成<b>过早优化</b>。<span class=\"src\">CS229/transcripts/L15.txt · 本地已下载</span>", "exam": "本课 T1 第 9 页「保方差不等于保意义」讲的就是这件事。备考包那道「PCA 降维后分类变差」的选择题，正确答法是：<b>PCA 只最大化输入方差、不看标签 y，被丢掉的低方差方向可能正是判别关键；要判断只能用验证数据比较有无 PCA</b>。<b>若目的是抗过拟合，正则化是更直接的手段</b>——这正是 Ng 的说法，不是讲义的说法。", "tip": {"t": "⚠ 材料内部不一致", "v": "<b>讲义第 6 页说 PCA「帮助避免过拟合」，Ng 在课堂上把这个用法点名为「可疑」。</b> 两者出自同一门课。<b>答题按课堂口径</b>（也是本课课件的口径）：PCA 不看 y，抗过拟合应该用正则化。", "w": 1}}];

    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl) h+=n.tbl.map(function(T){var s='<div class="tw">'+(T.cap?'<div class="tc">'+T.cap+'</div>':"")+'<table class="nt">';if(T.head) s+='<thead><tr>'+T.head.map(function(c){return '<th>'+c+'</th>';}).join("")+'</tr></thead>';s+='<tbody>'+T.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div>';return s;}).join("");
    if(n.say) h+='<div class="say"><span class="t">CS229 / 讲义补充</span>'+n.say+'</div>';
    if(n.ng) h+='<div class="ng"><span class="t">从零补基础 · Andrew Ng CS229</span>'+n.ng+'</div>';
    if(n.exam) h+='<div class="exam"><span class="t">与考试的联系</span>'+n.exam+'</div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**，所以加查询参数。
    frame.src=PDF+"?p="+p+"#page="+p+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    render(p);
    paintStrip();
    revPaint();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测与错题记录 ══════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {n:做过几次, w:错过几次, r:[最近 6 次 1/0]}
     全部存 localStorage，纯本地。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function rec(key, ok){
    var d = ST[key] || {n:0, w:0, r:[]};
    d.n++; if(!ok) d.w++;
    d.r.push(ok ? 1 : 0);
    if(d.r.length > 6) d.r = d.r.slice(-6);
    ST[key] = d; save();
  }
  /* 最近错次数 —— 薄弱点排序用的就是它，不是历史总错数：
     一个月前错过三次但最近三次全对，不该再排在最前面。 */
  function recentWrong(d){ return (d.r||[]).filter(function(x){ return x===0; }).length; }
  /* 「还算不算薄弱」：错过、且最近两次没有连对。
     用连对而不是「最近窗口里没有 0」，是为了让规则能一句话说清楚，
     用户看得见自己离毕业还差几次；也挡住了蒙对一次就算掌握。 */
  function isWeak(d){
    if(!d || !d.w) return false;
    var r = d.r || [];
    return !(r.length >= 2 && r[r.length-1] === 1 && r[r.length-2] === 1);
  }
  function unitWrong(start){
    var qs = Q[start] || [], rw = 0, w = 0, n = 0, qw = 0;
    qs.forEach(function(_,i){
      var d = ST[start+"#"+i]; if(!d) return;
      rw += recentWrong(d); w += d.w; n += d.n; if(isWeak(d)) qw++;
    });
    // rw 数的是最近错的**次数**（只用来排序，谁更该先复习）；
    // qw 数的是**还没毕业的题数**（给人看，也决定标红和进不进复习队列）。
    return {rw:rw, w:w, n:n, qw:qw};
  }
  function histHtml(d){
    var h = "";
    for(var i=0;i<6;i++){
      var v = d && d.r ? d.r[d.r.length-6+i] : undefined;
      h += '<i class="'+(v===1?"o":v===0?"x":"")+'"></i>';
    }
    return h;
  }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>自测 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key];
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        h += '<button class="opt" data-j="'+j+'">'+o+'</button>';
      });
      h += '<div class="why" style="display:none"></div>';
      h += '<div class="qhist">'+histHtml(d)+
           '<span style="margin-left:6px">'+
           (d ? "做过 "+d.n+" 次 · 错 "+d.w : "还没做过")+'</span>'+
           '<button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j, ok = (j === ans);
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(!ok){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          rec(key, ok);
          box.querySelector(".qhist").innerHTML =
            histHtml(ST[key]) + '<span style="margin-left:6px">做过 '+ST[key].n+
            ' 次 · 错 '+ST[key].w+'</span><button class="qagain">重做</button>';
          bindAgain(box); paintStrip(); revSync();
          var bd = document.querySelector('#card>h2 .qbadge');
          if(bd) bd.outerHTML = qBadge(+key.split('#')[0]);
          bindBadge();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){ render(cur); };
  }

  /* 页条上标红：这一单元最近还在错 */
  function paintStrip(){
    cells.forEach(function(c,k){
      var i = map[k+1];
      var cls = (i!=null ? "has" : "");
      if(i!=null){
        if(unitWrong(N[i].r[0]).qw > 0) cls += " err";
      }
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }


  /* ── 标题角标：不用滚到底就知道这页有没有题、错没错过 ── */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var st = unitWrong(start);
    return '<span class="qbadge'+(st.qw?" bad":"")+'" title="跳到自测">'+
      (st.qw ? "还错 "+st.qw+"/"+qs.length+" 题" : qs.length+" 题")+' ↓</span>';
  }

  /* ── 复习模式：前进/后退只在「最近还在错」的页之间跳 ──
     用户要的是「专项针对薄弱部分复习」。光有一张错题清单还得自己一条条点，
     所以把它接到翻页上：开了之后 ← → 就只在这些页里走。
     依据是**最近**错次，不是累计——早就改对的题不该再拦路。 */
  var rev = false, revList = [];
  function weakPages(){
    return N.filter(function(n){ return unitWrong(n.r[0]).qw > 0; })
            .map(function(n){ return n.r[0]; });
  }
  function revPaint(){
    var chip = document.getElementById("revChip");
    chip.classList.toggle("on", rev);
    if(!rev) return;
    var i = revList.indexOf(mapStart(cur));
    chip.querySelector("b").textContent =
      (i < 0 ? "?" : (i+1)) + " / " + revList.length + " 页";
  }
  function mapStart(p){ var i = map[p]; return i==null ? -1 : N[i].r[0]; }

  function step(d){
    if(!rev) return go(cur + d);
    if(!revList.length) return exitRev(true);
    var here = mapStart(cur), i = revList.indexOf(here);
    if(i < 0){                       // 当前不在清单里：跳到顺着方向最近的一页
      var t = null;
      for(var k=0;k<revList.length;k++){
        if(d > 0 ? revList[k] > cur : revList[k] < cur){ t = revList[k]; if(d>0) break; }
      }
      return go(t == null ? revList[d>0 ? 0 : revList.length-1] : t);
    }
    go(revList[(i + d + revList.length) % revList.length]);
  }
  function enterRev(){
    revList = weakPages();
    if(!revList.length){ alert("没有待复习的页——错过的题都连对两次毕业了。"); return; }
    rev = true; wp.classList.remove("on");
    go(revList.indexOf(mapStart(cur)) >= 0 ? cur : revList[0]);
    revPaint();
  }
  function exitRev(done){
    rev = false; revPaint();
    if(done) alert("待复习的页都毕业了，已退出复习模式。");
  }
  document.getElementById("revOff").onclick = function(){ exitRev(false); };

  /* 答完一题就重算一次清单：刚改对的页当场从复习队列里消失。 */
  function revSync(){
    if(!rev) return;
    revList = weakPages();
    if(!revList.length) exitRev(true); else revPaint();
  }

  /* 错题本 */
  var wp = document.getElementById("wrongPanel");
  function openWrong(){
    var list = [];
    N.forEach(function(n){
      var st = unitWrong(n.r[0]);
      if(st.n === 0 || st.w === 0) return;
      list.push({n:n, rw:st.rw, w:st.w, tot:st.n, qw:st.qw});
    });
    // 还没毕业的一律排前面；同样没毕业的，最近错得多的更靠前。
    list.sort(function(a,b){
      return (b.qw > 0) - (a.qw > 0) || (b.rw - a.rw) || (b.w - a.w); });
    var box = document.getElementById("wrongList");
    if(!list.length){
      box.innerHTML = '<div class="none">还没有错题。<br>做几道自测再回来看。</div>';
    } else {
      box.innerHTML = list.map(function(it){
        var qs = Q[it.n.r[0]] || [];
        // 每道题的六格单独成一组，多题的单元才不会连成一片看不出边界
        var h = qs.map(function(_,i){
          return "<u>"+histHtml(ST[it.n.r[0]+"#"+i])+"</u>"; }).join("");
        return '<div class="wrow'+(it.qw ? "" : " done")+'" data-p="'+it.n.r[0]+'">'+
          '<span class="p">p'+it.n.r[0]+'</span>'+
          '<span class="n2">'+it.n.t+'</span>'+
          '<span class="h">'+h+'</span>'+
          '<span class="s">'+(it.qw ? "还差 "+it.qw+" 题毕业" : "已毕业")+
          ' · 累计错 '+it.w+'/'+it.tot+'</span></div>';
      }).join("");
      box.querySelectorAll(".wrow").forEach(function(r){
        r.onclick = function(){ wp.classList.remove("on"); go(+r.dataset.p); };
      });
    }
    // 总账。三个数分工明确：做了多少、还有多少没过关、一共栽过几次。
    var done=0, tot=0, weak=0, wsum=0;
    Object.keys(Q).forEach(function(k){
      Q[k].forEach(function(_,i){
        tot++;
        var d = ST[k+"#"+i]; if(!d) return;
        done++; wsum += d.w; if(isWeak(d)) weak++;
      });
    });
    document.getElementById("wrongTally").innerHTML =
      '<span>做过 <b>'+done+'</b> / '+tot+' 题</span>'+
      '<span>没毕业 <b class="hot">'+weak+'</b> 题</span>'+
      '<span>累计错 <b>'+wsum+'</b> 次</span>'+
      '<span>待复习 <b>'+weakPages().length+'</b> 页</span>';
    document.getElementById("revOn").disabled = !weakPages().length;
    wp.classList.add("on");
  }
  document.getElementById("wrongBtn").onclick = openWrong;
  document.getElementById("revOn").onclick = enterRev;
  document.getElementById("wrongClose").onclick = function(){ wp.classList.remove("on"); };
  document.getElementById("wrongReset").onclick = function(){
    if(!confirm("清空全部自测记录？此操作不可撤销。")) return;
    ST = {}; save(); exitRev(false); paintStrip(); openWrong(); render(cur);
  };
  wp.onclick = function(e){ if(e.target === wp) wp.classList.remove("on"); };

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
