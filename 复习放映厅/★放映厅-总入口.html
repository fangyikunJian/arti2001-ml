KP("1 · 为什么预测数字（S4–5）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);boxNode(150,240,300,100,"回归","b");boxNode(830,240,300,100,"分类","y");note("目标：连续的数",300,400,"b");note("目标：离散的类别",980,400,"y");note("价格 · 年龄 · 温度 · 时长",300,438,"");note("垃圾/正常 · 猫/狗",980,438,"");setCap("<b>课件：很多真实问题要预测一个连续的数。</b>");},"T2 的第一问是「<b>为什么要预测一个数</b>」。很多现实任务的答案本身就是连续量——房价、年龄、气温、销量、学习时长。这类<b>监督学习</b>问题叫<em>回归</em>，和<em>分类</em>（预测离散类别）并列，是监督学习的两大分支。判据只有一条：<b>目标变量是不是连续量</b>。课件的 Study check 很典型——「从照片预测一个人的年龄」是回归（年龄连续），「考试及格还是不及格」是分类（两个类别）。这条判据 T1、T2 都会考。");
  S(0,function(){clearScene();setCap(null);setEq(null);setBig("连续 vs 离散","目标变量的类型决定用回归还是分类");},"为什么要先分清回归和分类？因为它<b>决定你后面用什么损失、怎么评估</b>。回归用平方误差、用 RMSE/R² 评估；分类用交叉熵、用准确率/召回率。一个常见陷阱：<s>输出是数字不等于回归</s>——用 1/2/3 编码三个城市那是分类，因为数字间的大小没有意义。判断永远看<b>目标本身</b>是不是有序的连续量。T2 整个 Topic 讲的就是最基础的回归模型：一条直线。");
  SUM(0,1,{h:"回归：预测一个连续的数（S4–5）",k:"当目标变量是<b>连续量</b>（价格、年龄、时长）时，这类监督学习叫<em>回归</em>；目标离散则是分类。判据只有一条：目标变量连续还是离散。",m:"这个区别决定下游：回归用平方误差、RMSE/R²；分类用交叉熵、准确率。T2 讲最基础的回归模型——一条直线。",w:"<s>输出是数字 ≠ 回归</s>。用 1/2/3 编码类别仍是分类。判断看目标变量本身有没有大小/顺序意义。",e:"T1、T2 都考「回归 vs 分类」。「从照片预测年龄」=回归；「及格/不及格」=分类。记住判据是目标变量连续还是离散。"});
  QUIZ(0,1,{t:"课件 Study check：从一张照片预测一个人的年龄，是回归还是分类？",o:["分类，因为年龄有很多可能","<b>回归——年龄是连续量，可以是 23.5、47 岁，数值间大小有意义</b>","分类，因为要分年龄段","两者都不是"],a:1,w:"年龄是<b>连续量</b>：可以是 23.5 岁、47 岁，数值之间的大小和差距都有意义，所以是<em>回归</em>。<s>若把年龄切成「青年/中年/老年」几档再预测，那才是分类</s>——但题目问的是直接预测年龄这个数，是回归。判据永远看目标变量本身连续还是离散。"});
});
KP("2 · 训练集与记号（S6）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);matrix({rows:6,cols:3,cw:150,ch:48,y:170,cell:function(i,j){var t=[["i","面积 x","价格 y"],["1","1.0","145"],["2","1.5","185"],["3","2.0","224"],["4","2.5","260"],["5","3.0","290"]];return t[i][j];},dim:function(i,j){return i===0;},hl:function(i,j){return i===3?"hl":"";}});note("m = 样本数（行）· n = 特征数（列，不含目标）",640,470,"y");},"回归从一张<b>训练集</b>开始：每行是一个样本，一对 (x, y)——输入特征 x 和正确答案 y。记号要记死：<b>m 是样本数</b>（有多少行），<b>n 是特征数</b>（每个样本用几个数描述）。上标带括号的 <b>x⁽ⁱ⁾</b> 指第 i 个样本（一整行），下标 xⱼ 指第 j 个特征。课件 Study check 问「x⁽³⁾ 和 y⁽³⁾ 是什么」——就是表里<em>第 3 行</em>的面积和价格（2.0 和 224）。<s>上标不是指数</s>，别和幂搞混。");
  S(0,function(){clearScene();setBig("目标是泛化","不是背下这张表，是对没见过的 x 给出好预测");},"训练集的用途不是「记住」这五行，而是<b>学出一个规律</b>，对<em>没出现在表里</em>的房子给出合理估价。这就是<b>泛化</b>——训练集上的表现只是手段，真正要的是新数据上的表现。这条贯穿全 Module：T1 的 train/test 划分、T2 的过拟合、都是围绕「别只在训练集上好看」。所以我们要一个能<i>外推</i>的模型（一条直线或曲线），而不是一张查找表。");
  SUM(0,2,{h:"训练集与记号：m、n、上标下标（S6）",k:"训练集每行一个样本 (x,y)。<b>m=样本数（行）</b>，<b>n=特征数（列）</b>。<b>x⁽ⁱ⁾</b>=第 i 个样本（一整行），xⱼ=第 j 个特征（一个数）。",m:"目标是<b>泛化</b>：学出规律、对没见过的 x 给好预测，而不是背下训练表。这是全 Module 的主线（对应 T1 划分、T2 过拟合）。",w:"<s>上标 x⁽ⁱ⁾ 不是指数</s>，是第 i 个样本。<s>m 和 n 别搞反</s>：m 行数、n 列数。MNIST 的 (60000,784) 就是 m=60000、n=784。",e:"Study check「x⁽³⁾、y⁽³⁾ 是什么」=第 3 行的输入和目标。记号是 T2/T3/T4 所有计算题的基础，务必分清上标（样本）下标（特征）。"});
  QUIZ(0,2,{t:"课件 Study check（S6）：表格中 x⁽³⁾ 和 y⁽³⁾ 指什么？",o:["x 的 3 次方和 y 的 3 次方","<b>第 3 个训练样本的输入特征 x 和目标值 y（那一整行）</b>","第 3 个特征","前 3 个样本"],a:1,w:"<b>上标带括号</b>的 (i) 表示<em>第 i 个样本</em>，不是指数。所以 x⁽³⁾、y⁽³⁾ 是训练集<b>第 3 行</b>的输入面积和目标价格（本例是 2.0 和 224）。<s>把上标当成幂</s>是最常见的记号错误。下标 xⱼ 才是第 j 个特征。"});
});
KP("3 · ★ 模型 f(x)=wx+b（S7）",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$f_{w,b}(x)=wx+b$$","top");var P={l:360,r:940,t:150,b:430};axes(P);note("面积 x",930,455,"");note("价格 y",350,160,"");var pts=[[420,410],[520,350],[620,300],[720,255],[820,205]];dots(pts,"b",7);curve([[400,430],[900,180]],"fit");note("w = 斜率",760,300,"y");note("b = 截距",420,445,"g");},"回归最简单的模型就是一条<b>直线</b>：f(x)=wx+b。这其实就是你早就学过的 y=mx+c，只是把字母换了名字——<i>说破这一点能消掉一大半焦虑</i>。两个参数各管一件事：<b>w 是斜率</b>（房价随面积每增加一单位涨多少），<b>b 是截距</b>（面积为 0 时的基准值）。课件 Study check 让你先猜再看：<b>增大 w</b> 会让直线<em>更陡</em>（绕着转），<b>增大 b</b> 会让直线<em>整体上移</em>（平移）。分清这两个作用，是理解后面所有拟合的前提。");
  S(0,function(){clearScene();setEq("$$f(x)=w_1x_1+w_2x_2+\\dots+w_nx_n+b=w^{\\top}x+b$$","top");setCap("<b>多特征时每个特征配一个自己的权重，写成向量内积。</b>");},"特征不止一个时（面积、卧室数、楼层……），每个特征配<b>一个自己的权重</b> wⱼ，加起来再加截距：f(x)=w₁x₁+…+wₙxₙ+b，紧凑写成 <b>wᵀx+b</b>。这就是你课程 T3、T4 反复出现的那个<em>线性打分</em>——回归里直接当预测值，分类里取符号或过 sigmoid。<s>一个术语细节</s>：严格说带常数项 b 的叫「仿射函数」，但机器学习圈一律叫「线性」，考试不考这个区别，知道有这回事即可。");
  SUM(0,3,{h:"★ 线性模型 f(x)=wx+b（S7）",k:"模型是一条<b>直线</b> f(x)=wx+b，就是 y=mx+c 换了字母。<b>w=斜率</b>（每单位 x 预测涨多少），<b>b=截距</b>（x=0 的基准）。多特征写成 <b>wᵀx+b</b>。",m:"增大 w → 直线更陡（旋转）；增大 b → 直线整体上移（平移）。这个 wᵀx+b 就是 T3/T4 的线性打分核心，全 Module 通用。",w:"<s>严格说带 b 的是仿射函数</s>，但 ML 里一律叫线性，考试不考这个区别。多特征时每个特征各有一个权重，别只给一个。",e:"Study check：w 让线更陡、b 让线平移。会写单特征 wx+b 和多特征 wᵀx+b，是 T2 所有拟合和 T3/T4 打分的基础。"});
  QUIZ(0,3,{t:"课件 Study check（S7）：在 f(x)=wx+b 中，增大 w 和增大 b 分别对直线做什么？",o:["增大 w 平移、增大 b 变陡","<b>增大 w 让直线更陡（旋转）；增大 b 让直线整体上移（平移）</b>","两者都让直线变陡","两者都让直线平移"],a:1,w:"<b>w 是斜率</b>：增大它，直线绕着转、变得更陡。<b>b 是截距</b>：增大它，整条直线<em>向上平移</em>，斜率不变。两个参数各管一个自由度——一个管「倾斜程度」、一个管「高低位置」，合起来才能拟合任意一条直线。"});
});
KP("4 · ★ 残差 = 竖直误差（S9）",function(){
  S(0,function(){clearScene();setBig(null);setEq(null);var P={l:360,r:940,t:150,b:430};axes(P);note("x",930,455,"");note("y",350,160,"");curve([[400,420],[900,190]],"fit");var pts=[[470,400],[560,330],[660,320],[760,240],[840,230]];dots(pts,"b",7);pts.forEach(function(p){var yl=420-(p[0]-400)*(230/500);E.link(p[0],yl,p[0],p[1]);});note("残差 = 竖直距离",640,470,"c");},"怎么衡量一条线拟合得好不好？先看单个样本的误差——<b>残差</b>（residual）：真实值和预测值之间的<em>竖直</em>距离，e = y − f(x)。课件的算例：如果 f(1.0)=78+72×1.0=150，但真实价是 145，残差 = 145−150 = <b>−5</b>。<b>读符号</b>：负数表示模型<i>高估</i>了（预测比真实高），正数表示低估。Study check 让你算 x=1.5 的残差，就是同样代入相减。为什么是<b>竖直</b>而不是点到线的垂直距离？因为回归的目标是<em>预测 y</em>，我们关心的正是 y 方向的差。");
  S(0,function(){clearScene();setEq("$$e^{(i)}=y^{(i)}-f(x^{(i)})$$","top");setBig(null);setCap("<b>残差有正有负</b>：正=低估，负=高估。直接加会互相抵消。");},"残差是后面一切的基石，但它<b>有正有负</b>——高估的样本残差为负、低估的为正。如果直接把所有残差加起来衡量总误差，<s>正负会互相抵消</s>，一条烂线也可能得零。所以下一步要<b>平方</b>再求和：平方既消掉符号，又对大误差罚得更重。这就引出「代价函数」。记住残差的定义 y−f(x) 和它的符号含义，Tutorial 手算残差、代价、梯度都从它开始。");
  SUM(0,4,{h:"★ 残差：真实值−预测值的竖直距离（S9）",k:"残差 <b>e = y − f(x)</b>，是单个样本上真实值与预测值的<em>竖直</em>差。算例 f(1.0)=150、真实 145 → 残差 −5。<b>负=高估，正=低估</b>。",m:"用竖直距离（不是点到线的垂直距离）因为回归要预测 y、关心 y 方向的差。残差有正负，直接相加会抵消，所以下一步要平方。",w:"<s>符号别读反</s>：y−f<0 表示预测偏高（高估）。<s>别用垂直距离</s>——那把 x 的误差也算进来了，与预测任务不符。",e:"Study check 让你算 x=1.5 的残差：代入 f 求预测、再 y−f。Tutorial 手算代价/梯度都从残差起步，务必练熟代入相减。"});
  QUIZ(0,4,{t:"某样本真实价 y=145，模型预测 f(x)=150。它的残差是多少？说明什么？",o:["+5，模型低估了","<b>−5，模型高估了（预测比真实高）</b>","5，无法判断方向","0，因为很接近"],a:1,w:"残差 = 真实 − 预测 = 145 − 150 = <b>−5</b>。<b>负号表示模型高估</b>——它预测的 150 比真实的 145 高了 5。正残差才表示低估。读准符号很重要：它告诉你模型在这个点是偏高还是偏低。残差有正有负，所以衡量总误差要先平方（下一个知识点）。"});
});
KP("5 · ★ 代价函数 J（S10）",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$J(w,b)=\\frac{1}{2m}\\sum_{i=1}^{m}\\big(f_{w,b}(x^{(i)})-y^{(i)}\\big)^2$$","top");setCap("<b>把整条线的好坏，压成一个数。</b>越小越好。");},"有了残差，就能定义<b>代价函数</b> J：把每个样本的残差<em>平方</em>再<b>求平均</b>，得到一个衡量「整条线有多差」的单一数字。本课用的是 <b>½·MSE</b>：J = 1/(2m)·Σ(f−y)²。<b>平方</b>做两件事——消掉正负号、并且<i>对大误差罚得更重</i>（差 10 罚 100，差 2 只罚 4，所以最小二乘对离群点敏感）。<b>那个 ½ 是为了后面求导好看</b>：求导时平方的 2 掉下来，正好和 ½ 约掉。学习的目标就变成一句话：<b>选 w、b 让 J 最小</b>。");
  S(0,function(){clearScene();setEq(null);setBig("min J(w,b)","学习 = 最小化代价");setCap("<b>½·MSE 与 MSE 最优解相同</b>，但手算梯度的系数不同——按本课的 1/2m 写。");},"这一步把「找一条好线」<b>翻译成一个优化问题</b>：最小化 J(w,b)。这是机器学习最核心的套路——把学习变成最小化某个数。<s>注意系数约定</s>：本课用 1/(2m)（½·MSE），CS229 用 ½·SSE（不除 m），有些书用 1/m（MSE）。<b>它们的最优解 w、b 完全相同</b>（乘正常数不改变最小值位置），但<em>手算梯度时前面的系数不一样</em>——考试和 Tutorial 按你课程的 1/(2m) 写。下一步就是怎么找到这个最小值：梯度下降，或正规方程。");
  SUM(0,5,{h:"★ 代价函数 J = ½·MSE（S10）",k:"代价 <b>J(w,b)=1/(2m)·Σ(f−y)²</b>：残差平方求平均，把整条线的好坏压成一个数，<em>越小越好</em>。学习 = <b>最小化 J</b>。",m:"平方消符号、且重罚大误差（对离群点敏感）。那个 <b>½ 是为求导方便</b>——导数里平方的 2 会和它约掉。最小化 J 是机器学习的通用套路。",w:"<s>系数约定要一致</s>：本课 1/(2m)、CS229 ½·SSE、有的书 1/m。最优解相同，但<em>手算梯度系数不同</em>，按本课 1/(2m) 写。",e:"Study check 要能指出「预测/残差/目标/参数更新」四件事。会写 J 的公式、解释 ½ 的作用、说明为何最小化它，是 T2 核心。"});
  QUIZ(0,5,{t:"代价函数 J=1/(2m)·Σ(f−y)² 里的那个 ½（即 1/2）主要是为了什么？",o:["让代价变小一半","<b>求导方便——导数里平方产生的 2 正好和 ½ 约掉，式子干净</b>","惩罚大误差","让 J 变成概率"],a:1,w:"½ 纯粹是<b>为后面求导好看</b>：对 (f−y)² 求导会掉出一个 2，正好和 ½ 相乘得 1，梯度式子就干净了。<s>它不改变最优解的位置</s>——乘一个正常数只改变 J 的高度和梯度尺度，最小值在哪不变。所以 ½·MSE 和 MSE 学出同样的 w、b，只是手算梯度的系数差一个 2。"});
});
KP("6 · 代价曲面：一个碗（S11）",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);var P={l:340,r:960,t:160,b:440};axes(P);note("参数 w",950,465,"");note("J",330,170,"");var pts=[];for(var k=0;k<=60;k++){var x=340+620*k/60;var t=(k-30)/30;pts.push([x,200+t*t*220]);}curve(pts,"fit b");dots([[650,200]],"g",8);note("最低点 = 最优参数",650,180,"g");},"把 J 画成参数的函数，形状是一个<b>碗</b>（对单参数是抛物线）。<b>横轴是参数（w），纵轴是 J（这组参数有多差）</b>——<s>注意这不是数据图</s>，是「参数的地形图」。<em>数据空间里的一整条直线，在这张图上只是一个点</em>。碗底就是使 J 最小的最优参数。线性回归的代价函数是<b>凸的（碗形）</b>，这个性质极好：只有一个最低点，<i>局部最优即全局最优</i>，从任何起点出发都能滚到同一个底。");
  S(0,function(){clearScene();setEq(null);setCap(null);var P={l:360,r:940,t:150,b:440};axes(P);note("θ₀",930,465,"");note("θ₁",350,160,"");var cx=650,cy=290;for(var r=40;r<=170;r+=40){var e=[];for(var a=0;a<=48;a++){var t=a/48*6.283;e.push([cx+r*1.5*Math.cos(t),cy+r*0.75*Math.sin(t)]);}curve(e,"fit");}dots([[cx,cy]],"g",8);note("细长椭圆 = 特征尺度差异大",640,470,"y");},"两个参数时，碗是三维的；从正上方压平看就是一圈圈<b>等高线</b>（同一圈上 J 相同）。这里的等高线常是<b>细长的斜椭圆</b>而不是同心圆——原因是两个参数<i>高度相关</i>，或者<b>特征尺度差异大</b>。椭圆越细长，梯度下降走起来越会<em>之字形</em>震荡、收敛越慢（后面「特征缩放」会回到这一点）。记住这张图：优化就是在这张参数地形上<b>往碗底走</b>。");
  SUM(0,6,{h:"代价曲面：凸的碗，参数的地形图（S11）",k:"把 J 画成参数的函数是一个<b>碗（凸函数）</b>。横轴是<em>参数</em>、纵轴是 J。数据里的一整条直线，在这图上只是<b>一个点</b>。碗底=最优参数。",m:"凸性保证<b>局部最优=全局最优</b>，从任何起点都滚到同一个底（线性回归、逻辑回归都有；神经网络没有）。等高线细长椭圆=参数相关/特征尺度差异大→梯度下降之字形慢。",w:"<s>别把它当数据图</s>：横纵轴是参数不是 x、y。Ng 专门强调 get the axes right——数据空间的一条线=参数空间的一个点。",e:"理解「凸→只有一个最低点」和「细长椭圆→收敛慢」为特征缩放埋伏笔。T2 Tutorial 里「Hessian 半正定⇒J 凸」说的就是这个碗。"});
  QUIZ(0,6,{t:"线性回归的代价函数是凸的（碗形），这带来什么保证？",o:["训练一定很快","<b>只有一个最低点，局部最优即全局最优，从任何起点都能收敛到同一个解</b>","不需要学习率","一定不会过拟合"],a:1,w:"<b>凸函数（碗形）只有一个最低点</b>，所以梯度下降只要学习率合适，从<em>任何</em>起点出发都会滚到同一个全局最优——<s>不存在会卡住的坏局部最优</s>。逻辑回归也有这个性质；神经网络<b>没有</b>（损失面坑坑洼洼，起点和随机种子会影响结果）。凸性也是正规方程有唯一解的基础。"});
});
KP("7 · ★ 梯度下降（S12–13）",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$w:=w-\\alpha\\frac{\\partial J}{\\partial w},\\qquad b:=b-\\alpha\\frac{\\partial J}{\\partial b}$$","top");setCap("<b>不知道碗底在哪，就往最陡的下坡迈一小步，重复。</b>");},"梯度下降的直觉：<b>站在雾里的山坡上，看不到谷底，就环顾四周、往最陡的下坡方向迈一步</b>，重复。数学上，<b>梯度 ∂J/∂w 指向 J 增长最快的方向</b>，所以下山要走它的<em>反方向</em>——这就是更新式里<b>减号</b>的全部作用。规则：w := w − α·∂J/∂w，b 同理。<b>「:=」是赋值</b>（重新算、覆盖旧值）。梯度的<i>长度</i>也有意义：地形越陡梯度越长、步子越大，接近谷底时梯度变短、步子自动变小。");
  S(0,function(){clearScene();setEq(null);setBig("同时更新","先用旧 w,b 算完两个偏导，再一起写回");setCap("<b>易错：必须用同一批旧参数算完所有偏导，再同时覆盖。</b>");},"有个<b>必须踩准的细节：同时更新</b>。正确做法是：先用<i>当前的</i> w、b 把两个偏导 ∂J/∂w、∂J/∂b <b>都算完</b>、暂存，然后<em>一次性写回</em>。<s>如果算完 ∂J/∂w 就立刻更新 w，再拿新的 w 去算 ∂J/∂b，那就不是梯度下降了</s>——虽然有时也能跑通，但它不再沿真正的负梯度方向。对线性回归，代入 J 求导后梯度是 <b>(1/m)Σ(f−y)x</b> 的形式——「误差×特征」，和逻辑回归 (p−y)x、感知机 y·x 同一个形状，这不是巧合（广义线性模型）。");
  SUM(0,7,{h:"★ 梯度下降：往负梯度方向走（S12–13）",k:"更新 <b>w := w − α·∂J/∂w</b>、b 同理。梯度指向 J 增长最快方向，<em>减号</em>让我们走下坡。α 是步长，「:=」是赋值覆盖。反复迭代直到收敛。",m:"梯度长度自适应步子（越陡走越大、近底越小）。<b>必须同时更新</b>：用同一批旧参数算完所有偏导再一起写回。线性回归梯度形如 (1/m)Σ(f−y)x=「误差×特征」。",w:"<s>非同时更新是高频错误</s>：算完 ∂J/∂w 就更新 w、再用新 w 算 ∂J/∂b，就不再沿负梯度了。别忘减号（走的是负梯度）。",e:"会写更新式、解释减号（负梯度=下坡）、强调同时更新。「误差×特征」的梯度形状 T3 Tutorial Q2（逻辑回归 (p−y)x）会再用。"});
  QUIZ(0,7,{t:"梯度下降更新参数时，为什么是<b>减去</b>梯度？",o:["为了让参数变小","<b>梯度指向 J 增长最快的方向，减去它就是朝 J 下降最快的方向走</b>","为了收敛更快","随便加减都行"],a:1,w:"<b>梯度 ∇J 指向函数<em>增长</em>最快的方向</b>（上坡）。我们要最小化 J，所以要走它的<em>反方向</em>（下坡）——这就是更新式里减号的全部含义：w := w − α·∇J。加号会让你往山上爬、J 越来越大。另外记得<b>同时更新</b> w 和 b（用同一批旧值算完再一起覆盖）。"});
});
KP("8 · ★ 学习率 α（S14）",function(){
  S(0,function(){clearScene();setBig(null);setEq(null);var P={l:200,r:1080,t:160,b:440};boxNode(150,200,300,100,"α 太小","b");boxNode(520,200,240,100,"α 合适","g");boxNode(830,200,300,100,"α 太大","r");note("收敛，但极慢、浪费算力",300,340,"b");note("又快又稳",640,340,"g");note("越过谷底、震荡甚至发散",980,340,"r");setCap("<b>α 是你手动定的超参数，不是学出来的。</b>");},"学习率 <b>α 控制每步走多大</b>，而且它是<b>你手动选的超参数</b>，不是从数据学出来的——<s>选错 α 是「代码明明对却像坏了」的最常见原因</s>。<b>太小</b>：能收敛、J 也在降，但慢得浪费算力，典型症状是 J 曲线一直缓缓下降、半天不到底。<b>太大</b>：会<em>越过谷底</em>冲到对面更高处，来回震荡甚至发散（J 反而上升）。<b>合适</b>：又快又稳。没有万能值，通常试几个数量级（0.001、0.01、0.1）看哪个 J 降得又快又稳。");
  S(0,function(){clearScene();setBig(null);setEq(null);var P={l:300,r:980,t:150,b:430};axes(P);note("迭代次数",950,455,"");note("J",300,160,"");var pts=[];for(var k=0;k<=60;k++){pts.push([300+680*k/60,160+270*Math.exp(-k/12)]);}curve(pts,"fit g");note("画 J-迭代曲线来诊断",640,250,"y");},"怎么判断 α 好不好？<b>画一条 J 随迭代次数的曲线</b>——这是工程上最常用的诊断法。<b>J 一直缓慢下降、走不平</b>→α 太小，调大。<b>J 上下乱跳或往上翘</b>→α 太大，调小。<b>J 平滑下降然后走平</b>→收敛了，可以停。注意课件 Study check 的陷阱：「J 降得很好，然后<em>在一个仍然很高的值上走平了</em>——这是学习率问题吗？」<s>不一定</s>——走平说明<b>收敛了</b>，值高可能是<i>模型太简单（欠拟合）或特征不够</i>，不是 α 的错。");
  SUM(0,8,{h:"★ 学习率 α：超参数，太小慢太大炸（S14）",k:"α 控制步长，是<b>手动选的超参数</b>。<b>太小</b>→收敛但极慢；<b>太大</b>→越过谷底、震荡/发散；<b>合适</b>→又快又稳。选错是「代码对却像坏了」的头号原因。",m:"诊断法：<b>画 J-迭代曲线</b>。一直缓降→α 太小；上下跳/上翘→α 太大；平滑降后走平→收敛。常试 0.001/0.01/0.1 几个数量级。",w:"<s>Study check 陷阱</s>：J 降完在一个高值走平，<b>不一定是 α 问题</b>——走平=收敛了，值高多半是欠拟合/特征不足。α 太大反而 J 上升。",e:"会区分 α 太小（慢）vs 太大（发散），会用 J-迭代曲线诊断。T4 的 C、γ 也是「太小/太大各有毛病」的超参数，同一套思路。"});
  QUIZ(0,8,{t:"课件 Study check（S14）：J 先降得很好，然后在一个<b>仍然偏高</b>的值上走平不动了。这是学习率问题吗？",o:["是，α 太大了","是，α 太小了","<b>不一定——「走平」说明已收敛；值偏高多半是欠拟合/特征不足，不是 α 的错</b>","是，必须换模型"],a:2,w:"J <b>平滑下降然后走平</b>，说明梯度下降<em>已经收敛</em>到了这个模型能达到的最低代价。<s>停在高值不是学习率的锅</s>——α 太大时 J 会震荡或上升，不是平稳走平。停在高处更可能是<b>模型太简单（欠拟合、高偏差）或特征没抓住规律</b>。对策是加特征/提高模型复杂度，而不是调 α。"});
});
KP("9 · 从一个特征到多个（S15）",function(){
  S(0,function(){clearScene();setEq("$$f(x)=w_1x_1+w_2x_2+\\dots+w_nx_n+b$$","top");setBig(null);matrix({rows:4,cols:3,cw:200,ch:52,y:250,cell:function(i,j){var t=[["特征","权重","含义"],["面积 x₁","w₁","每 +1 面积涨多少"],["卧室 x₂","w₂","每 +1 卧室涨多少"],["楼层 x₃","w₃","每 +1 楼层涨多少"]];return t[i][j];},dim:function(i,j){return i===0;},hl:function(i,j){return false;}});},"真实问题很少只用一个特征。加特征很简单：<b>每个特征配一个自己的权重 wⱼ</b>，全部加起来再加截距。每个 wⱼ 的含义是「<i>其它特征不变时，这个特征每增加一单位，预测涨多少</i>」。课件 Study check 问得很到位：<b>只加一间卧室、其它不变，预测怎么变？</b>——答案是<em>加上 w₂</em>（卧室的权重），因为 f 里只有 w₂x₂ 那一项受影响。这就是线性模型好解释的地方：<b>每个权重是该特征的「边际效应」</b>。");
  S(0,function(){clearScene();setEq("$$f(x)=w^{\\top}x+b$$","top");setCap("<b>几何上：一维是直线、二维是平面、更高维是超平面。</b>");},"多特征在几何上意味着<b>升维</b>：一个特征时拟合的是<i>平面上的一条直线</i>，两个特征是<i>三维空间里的一个平面</i>，n 个特征是<b>超平面</b>（画不出来，但代数形式 wᵀx+b 完全一样）。<s>维度再高道理不变</s>。这也是为什么线性代数是这门课的先修——把一堆样本堆成矩阵 X，预测就是一次矩阵乘法 Xw+b，为下一步的「正规方程」铺路。");
  SUM(0,9,{h:"多特征：每特征一个权重，wᵀx+b（S15）",k:"多特征时 f(x)=w₁x₁+…+wₙxₙ+b=<b>wᵀx+b</b>，每个特征配<em>一个自己的权重</em>。每个 wⱼ = 该特征的<b>边际效应</b>（其它不变时每 +1 单位预测涨多少）。",m:"几何上升维：一维直线→二维平面→n 维超平面，代数形式不变。堆成矩阵 X，预测是矩阵乘法 Xw+b，为正规方程铺路。",w:"<s>加一个特征只影响它自己那一项</s>：只加一间卧室、其它不变，预测就加上 w₂。别以为会牵动别的权重（那些项没变）。",e:"Study check「加一间卧室预测怎么变」= 加上该特征的权重 w₂。理解权重=边际效应、多特征=超平面，是正规方程和 T3/T4 的基础。"});
  QUIZ(0,9,{t:"课件 Study check（S15）：其它特征都不变，只把卧室数 x₂ 增加 1，预测值怎么变？",o:["不变","<b>增加 w₂（卧室对应的权重）</b>","增加 w₁","翻倍"],a:1,w:"f(x)=w₁x₁+w₂x₂+…+b。只有 x₂ 变了（+1），其它项都不动，所以预测<b>增加 w₂×1 = w₂</b>。这正是线性模型的可解释性：<b>每个权重就是对应特征的「边际效应」</b>——该特征每增加一单位、其它不变时预测的变化量。"});
});
KP("10 · ★ 正规方程（S16）",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$\\theta=(X^{\\top}X)^{-1}X^{\\top}y$$","top");note("X：设计矩阵（行=样本，列=特征）",640,270,"b");note("y：目标向量",640,330,"g");note("一步解出最优参数，不用迭代",640,400,"y");},"除了迭代的梯度下降，线性回归还有一条<b>一步到位</b>的路：<b>正规方程</b> θ=(XᵀX)⁻¹Xᵀy。既然 J 是个碗，直接令梯度为零、解方程就能得到碗底坐标，不用一步步走。<b>X 是设计矩阵</b>（每行一个样本、每列一个特征，第一列常补全 1 吸收截距），<b>y 是目标向量</b>。这个式子的前提是 <b>XᵀX 可逆</b>（要求特征列线性无关）。<s>实际数值软件很少真的求逆</s>——直接求逆又慢又不稳，库用 QR 分解或 SVD（更稳，且 XᵀX 不可逆时能用伪逆给合理解）。");
  S(0,function(){clearScene();setEq(null);setBig(null);matrix({rows:4,cols:3,cw:250,ch:54,y:200,cell:function(i,j){var t=[["","梯度下降","正规方程"],["方式","迭代逼近","一步闭式解"],["要选 α？","要","不要"],["特征很多时","更划算","(XᵀX)⁻¹ 太贵"]];return t[i][j];},dim:function(i,j){return i===0||j===0;},hl:function(i,j){return false;}});setCap("<b>怎么选？</b>特征少用正规方程；特征极多用梯度下降。");},"<b>梯度下降 vs 正规方程</b>的取舍：正规方程<i>一步到位、不用选 α</i>，但要算 (XᵀX)⁻¹——当特征数 n 很大时，求逆是 O(n³)，<s>完全不可行</s>；梯度下降每步便宜、适合大规模。所以经验是：<b>特征不多（几十到几千）用正规方程省事；特征极多或数据海量用梯度下降</b>。还有一点边界：正规方程只有线性回归等少数模型有闭式解——<em>逻辑回归、SVM、神经网络都没有</em>，只能靠梯度方法。所以梯度下降才是通用的那个。");
  SUM(0,10,{h:"★ 正规方程 θ=(XᵀX)⁻¹Xᵀy（S16）",k:"闭式解 <b>θ=(XᵀX)⁻¹Xᵀy</b>：令梯度为零直接解出碗底，不用迭代、不用选 α。X=设计矩阵（行样本列特征），y=目标向量。前提 <b>XᵀX 可逆</b>（特征列线性无关）。",m:"取舍：正规方程一步到位但要算 (XᵀX)⁻¹（O(n³)），特征极多不可行；梯度下降每步便宜、适合大规模。<b>只有线性回归等少数模型有闭式解</b>，逻辑回归/SVM/神经网络都没有。",w:"<s>实际软件不直接求逆</s>：又慢又不稳，用 QR/SVD（更稳，不可逆时用伪逆）。特征列线性相关时 XᵀX 不可逆——这是 Tutorial Q3 的条件。",e:"<b>T2 Tutorial Q2/Q3</b>：写出设计矩阵、代入 θ=(XᵀX)⁻¹Xᵀy、说明列满秩时可逆。会答「GD vs 正规方程怎么选」（特征多用 GD）。"});
  QUIZ(0,10,{t:"正规方程 θ=(XᵀX)⁻¹Xᵀy 相比梯度下降，什么时候<b>不该</b>用它？",o:["数据有噪声时","<b>特征数 n 非常大时——求 (XᵀX)⁻¹ 是 O(n³)，太贵</b>","需要高精度时","目标是连续值时"],a:1,w:"正规方程要计算 <b>(XᵀX)⁻¹</b>，这是一个 n×n 矩阵求逆，代价约 <b>O(n³)</b>。当特征数 n 很大（上万）时，求逆<s>又慢又占内存</s>，完全不划算，这时该用<em>梯度下降</em>（每步便宜、可扩展）。反过来，特征不多时正规方程一步到位、还不用调 α，更省事。另外逻辑回归/SVM/神经网络<b>根本没有闭式解</b>，只能用梯度方法。"});
});
KP("11 · 特征缩放（S17）",function(){
  S(0,function(){clearScene();setBig(null);setEq(null);var P={l:360,r:940,t:150,b:440};axes(P);note("θ₀",930,465,"");note("θ₁",350,160,"");var cx=650,cy=290;for(var r=1;r<=4;r++){var e=[];for(var a=0;a<=48;a++){var t=a/48*6.283;e.push([cx+r*40*2.0*Math.cos(t),cy+r*40*0.5*Math.sin(t)]);}curve(e,"fit");}note("未缩放：细长椭圆 → 之字形、慢",640,470,"r");},"当不同特征的<b>数值范围差异很大</b>（比如面积 0–2000、卧室 0–5），梯度下降会变慢。原因回到那张等高线图：尺度差异让代价曲面变成一条<b>又长又窄的山谷</b>，梯度在大部分位置<em>不指向谷底</em>，于是算法先横穿峡谷冲到对面、再一点点折回——<b>之字形</b>震荡，收敛很慢。课件 Study check 的直觉题：<b>把长度从米换成厘米，那个特征的权重会怎样？</b>——数值放大 100 倍，对应<em>权重缩小 100 倍</em>（乘积不变），但优化路径会变难走。");
  S(0,function(){clearScene();setEq(null);var P={l:360,r:940,t:150,b:440};axes(P);note("θ₀",930,465,"");note("θ₁",350,160,"");var cx=650,cy=290;for(var r=1;r<=4;r++){var e=[];for(var a=0;a<=48;a++){var t=a/48*6.283;e.push([cx+r*38*Math.cos(t),cy+r*38*Math.sin(t)]);}curve(e,"fit g");}note("缩放后：接近同心圆 → 直奔谷底",640,470,"g");},"解法很便宜：<b>特征缩放</b>——把每个特征标准化到相近范围（常用标准化 (x−μ)/σ 或归一化到 [0,1]）。缩放后等高线接近<b>同心圆</b>，梯度处处指向谷底，梯度下降<em>直奔碗底</em>、收敛快得多。<s>关键工程纪律</s>：缩放的参数（μ、σ）必须<b>只在训练集上计算</b>、装进 Pipeline，绝不能用到测试集的统计量——否则就是<i>预处理泄漏</i>（T1、T4 practical 的固定考点）。注意：正规方程<b>不需要</b>缩放（它不迭代），缩放主要是为梯度下降提速。");
  SUM(0,11,{h:"特征缩放：让梯度下降不再之字形（S17）",k:"特征数值范围差异大 → 代价曲面是<b>细长山谷</b> → 梯度下降<em>之字形</em>震荡、慢。<b>特征缩放</b>（标准化/归一化）让等高线接近同心圆，直奔谷底。",m:"换单位（米→厘米）数值×100 则权重÷100（乘积不变），但优化路径变难走。缩放不改变模型能力，只加速梯度下降。正规方程不需要缩放。",w:"<s>缩放参数只在训练集上算、装进 Pipeline</s>——用到测试集统计量就是预处理泄漏（T1/T4 考点）。缩放主要为 GD 提速，不影响正规方程。",e:"Study check「换单位权重怎样」：数值放大 k 倍则权重缩小 k 倍。会解释「尺度差异→之字形→缩放」的几何链，并强调缩放放进 Pipeline 防泄漏。"});
  QUIZ(0,11,{t:"课件 Study check（S17）：把某个长度特征从「米」换成「厘米」（数值×100），它对应的权重会怎样？",o:["也变成 100 倍","<b>变成原来的 1/100——数值放大 100 倍，权重缩小 100 倍，乘积（对预测的贡献）不变</b>","不变","无法确定"],a:1,w:"预测里是 <b>w×x</b> 这一项。把 x 的数值放大 100 倍（米→厘米），要保持这一项对预测的贡献不变，<b>w 必须缩小到 1/100</b>。所以换单位不改变模型的预测能力，只改变权重的数值。<s>但它会改变优化路径</s>：不同特征尺度差异大时代价曲面变细长、梯度下降之字形变慢——这就是要做特征缩放的原因。"});
});
KP("12 · ★ 过拟合与欠拟合（S18）",function(){
  S(0,function(){clearScene();setBig(null);setEq(null);var base=[[0,0],[1,0]];[[160,"欠拟合·高偏差","y",function(t){return 400-70*t;}],[500,"刚好","g",function(t){return 400-95*Math.sin(t*2.4);}],[840,"过拟合·高方差","r",function(t){return 400-95*Math.sin(t*2.4)-60*Math.sin(t*11);}]].forEach(function(cfg){var x0=cfg[0],w=280;E.link(x0,410,x0+w,410);var d=[];for(var i=0;i<7;i++){var t=(i+.5)/7;d.push([x0+t*w,400-95*Math.sin(t*2.4)-(((i*37)%23)-11)*3]);}dots(d,"b",5);curve(fn(function(x){var t=(x-x0)/w;return cfg[3](t);},x0,x0+w,60),"fit "+cfg[2]);note(cfg[1],x0+w/2,465,cfg[2]);});},"模型复杂度是一场<b>平衡</b>：太简单会<em>错过真实规律</em>，太复杂会<em>把噪声也背下来</em>。<b>欠拟合（高偏差）</b>：用直线拟合本来就弯的数据，系统性地错——而且<s>在训练集上就已经很差</s>。<b>过拟合（高方差）</b>：模型太灵活，把训练点连噪声一起完美穿过，<i>训练误差极低但测试误差很高</i>。<b>刚好</b>：抓住主趋势、忽略噪声。判据是<b>比较训练误差和测试误差</b>：两个都高=欠拟合；训练低测试高=过拟合；两个都低且接近=刚好。");
  S(0,function(){clearScene();setEq(null);setBig("训练好 · 测试差","= 过拟合（高方差）");setCap("<b>对策：简化模型 / 加正则化 / 增加数据。</b>与欠拟合相反。");},"两种病的<b>处方正好相反</b>，所以先诊断再动手。<b>过拟合</b>（训练好测试差）：简化模型、加<em>正则化</em>（惩罚过大的权重）、增加训练数据、做特征选择。<b>欠拟合</b>（两个都差）：加特征、提高模型复杂度、减小正则化。<s>用错方向会越治越糟</s>。课件 Study check 的送分题：「三个模型里哪个在<b>训练</b>数据上误差最低？」——<em>最复杂的那个</em>（过拟合的），因为训练误差随复杂度单调下降。<b>但训练误差低不代表好</b>，要看测试。这条直接对应 T1 大题。");
  SUM(0,12,{h:"★ 过拟合 vs 欠拟合（S18）",k:"复杂度平衡：<b>欠拟合（高偏差）</b>训练测试都差；<b>过拟合（高方差）</b>训练极好、测试差；<b>刚好</b>两者都低且接近。判据是比较<em>训练误差与测试误差</em>。",m:"处方相反：过拟合→简化/加正则/加数据；欠拟合→加特征/提复杂度/减正则。训练误差随复杂度<b>单调下降</b>，所以最复杂的模型训练误差最低——但这正是过拟合。",w:"<s>训练误差低 ≠ 模型好</s>：它永远推荐最复杂的模型。必须看测试/验证。用错处方（给过拟合加复杂度）会越治越糟。",e:"<b>T1 大题</b>：训练 1.00、测试 0.62 → 诊断过拟合，给两个方向（简化/正则、加数据）。Study check「谁训练误差最低」=最复杂的那个。"});
  QUIZ(0,12,{t:"课件 Study check（S18）：欠拟合、刚好、过拟合三个模型里，哪个在<b>训练</b>数据上误差最低？",o:["欠拟合的","刚好的","<b>过拟合（最复杂）的——训练误差随复杂度单调下降</b>","三个一样"],a:2,w:"<b>训练误差随模型复杂度单调下降</b>：模型越灵活越能贴合（甚至记住）训练点，所以<em>最复杂的过拟合模型训练误差最低</em>（甚至接近 0）。<s>但这恰恰是陷阱</s>——训练误差低不代表泛化好，过拟合模型在<b>测试</b>集上很差。所以绝不能用训练误差选模型，要用留出的验证/测试集。"});
});
KP("13 · 评估回归模型（S19）",function(){
  S(0,function(){clearScene();setBig(null);setEq(null);matrix({rows:4,cols:2,cw:330,ch:56,y:210,cell:function(i,j){var t=[["指标","含义"],["MAE 平均绝对误差","平均差多少（同单位、抗离群）"],["RMSE 均方根误差","平均差多少（重罚大误差）"],["R² 决定系数","解释了多少比例的方差（0–1）"]];return t[i][j];},dim:function(i,j){return i===0;},hl:function(i,j){return false;}});},"训练完要用<b>指标</b>判断模型好不好，而且必须在<em>留出的测试集</em>上算。三个常用指标：<b>MAE</b>（平均绝对误差）——预测平均差多少，单位和 y 一样、对离群点不敏感；<b>RMSE</b>（均方根误差）——也是平均差多少，但因为先平方所以<i>对大误差罚得更重</i>（和训练用的平方损失一致）；<b>R²</b>（决定系数）——模型解释了目标变量多少比例的方差，通常 0–1，越接近 1 越好，R²=0 相当于「只会预测平均值」的基线。选哪个看你更在意「典型误差」（MAE）还是「大误差」（RMSE）。");
  S(0,function(){clearScene();setBig("永远和基线比","R² 或与「预测均值」比，别只看一个数");setCap("<b>单个指标会骗人</b>：一定要和一个简单基线对照。");},"一个反复被强调的纪律：<b>任何指标都要和一个基线比较</b>，别孤立地看一个数。回归里最自然的基线是「<i>无论输入都预测目标的平均值</i>」——R² 正是相对这个基线定义的（R²>0 才说明模型比「猜平均」强）。你课程的 practical feedback 反复要求：<b>报出指标 → 和相关基线/备选比较 → 解释指标含义 → 只下证据支持的结论</b>。RMSE 说「500 元」是好是坏？<s>脱离基线无法判断</s>——房价均值 20 万时 500 元很小，均值 2000 元时就很大。");
  SUM(0,13,{h:"评估：MAE / RMSE / R²，且要比基线（S19）",k:"在<b>测试集</b>上用指标评估：<b>MAE</b>（平均绝对误差、抗离群）、<b>RMSE</b>（重罚大误差、与平方损失一致）、<b>R²</b>（解释了多少比例方差，0–1，1 最好）。",m:"MAE 看典型误差、RMSE 看大误差。R² 相对「预测均值」基线定义：R²>0 才说明比猜平均强，R²=0 等于基线。选指标看你更在意典型还是大误差。",w:"<s>单个指标脱离基线会骗人</s>：RMSE=500 是好是坏取决于目标的量级。必须和相关基线/备选比较，再下结论。",e:"practical feedback 固定要求：报指标→比基线→解释含义→只下证据支持的结论。会区分 MAE/RMSE/R² 的侧重，R² 的基线是「预测均值」。"});
  QUIZ(0,13,{t:"某回归模型报告 <b>RMSE = 500</b>。能据此判断它好不好吗？",o:["能，500 很小所以很好","能，500 很大所以很差","<b>不能——脱离目标的量级和基线无法判断；需和「预测均值」等基线比较</b>","能，RMSE 越大越好"],a:2,w:"RMSE=500 <b>脱离上下文无意义</b>：如果房价均值是 20 万，差 500 元微不足道；如果目标均值只有 2000，差 500 就很糟。<s>单个指标必须和基线比较</s>——回归的自然基线是「无论输入都预测目标均值」，R² 正是相对它定义的。这也是你课程反复强调的：报指标要同时给出比较对象和解释。"});
});
KP("14 · 线性回归的假设（S20）",function(){
  S(0,function(){clearScene();setBig(null);setEq(null);matrix({rows:5,cols:2,cw:340,ch:52,y:180,cell:function(i,j){var t=[["假设","含义"],["线性","特征与目标是线性关系"],["独立","样本之间互不影响"],["同方差","误差方差处处相同"],["正态","误差服从正态分布"]];return t[i][j];},dim:function(i,j){return i===0;},hl:function(i,j){return false;}});},"线性回归背后有一组<b>经典统计假设</b>：<b>线性</b>（特征与目标是线性关系）、<b>独立</b>（样本互不影响）、<b>同方差</b>（误差方差处处相同）、<b>正态</b>（误差服从正态分布）。为什么讲它们？——<b>如果目标只是预测，可以违反其中几条还能用</b>；但如果要做<em>统计推断</em>（置信区间、假设检验），这些假设就很重要。这也正是 T2 Tutorial Q1 的背景：<i>在 IID 正态噪声假设下，最大化似然等价于最小化平方误差</i>——平方损失不是随便选的，是这组假设的数学推论。");
  S(0,function(){clearScene();setBig("假设可能被违反","时间序列不独立 · 波动随规模变大=异方差");setCap("<b>Study check：同一条街十年的房价，最可能违反哪条？</b>");},"这些假设在现实里<b>经常被违反</b>，要能识别。课件 Study check：「<b>同一条街、十年的房价</b>，最可能违反哪条假设？」——<b>独立性</b>：同一条街的房子彼此影响（学区、地段共享），十年的价格还有时间上的自相关，样本远非独立。另一个常见的是<b>异方差</b>：贵房子的价格波动比便宜房子大，违反「同方差」。<s>违反了会怎样？</s>——最小二乘<b>仍能算出参数</b>，但它不再是最优的极大似然估计，置信区间和显著性检验会失真。所以 Tutorial Q1 答案要补一句：<i>噪声假设改变时，可能需要不同的损失或加权</i>。");
  SUM(0,14,{h:"线性回归的四条假设（S20）",k:"经典假设：<b>线性、独立、同方差、正态</b>。纯预测时可违反几条仍能用；做<em>统计推断</em>（置信区间、检验）时它们才关键。",m:"IID 正态噪声假设下，<b>极大似然 ⟺ 最小二乘</b>（T2 Tutorial Q1）——平方损失是这组假设的推论。违反后 OLS 仍能算，但不再是最优 MLE，推断会失真。",w:"<s>假设常被违反</s>：时间序列/同街样本不独立；波动随规模变大是异方差。识别哪条被违反是考点。违反不等于不能用，取决于目标是预测还是推断。",e:"Study check「同街十年房价违反哪条」→<b>独立性</b>（也涉异方差）。T2 Tutorial Q1 从 IID 正态假设推出最小二乘，答案要补「假设变则损失/加权可能要变」。"});
  QUIZ(0,14,{t:"课件 Study check（S20）：对「同一条街、连续十年」的房价建模，最可能违反哪条假设？",o:["线性","<b>独立性——同街房屋互相影响、十年价格有时间自相关，样本远非独立</b>","正态","以上都不会"],a:1,w:"<b>独立性</b>最危险：同一条街的房子共享学区、地段、周边环境，彼此高度相关；同一批房子十年的价格还有<em>时间上的自相关</em>（今年贵明年也贵）。所以这些样本远不是相互独立的。（<i>异方差</i>也常见——贵房子波动更大。）违反独立性时最小二乘仍能拟合，但标准误、置信区间会失真，不能直接用于统计推断。"});
});
KP("15 · Tutorial 三题：似然·设计矩阵·正规方程（S23–25）",function(){
  S(0,function(){clearScene();setBig(null);setEq(null);boxNode(120,180,380,80,"Q1 · 似然论证","g");boxNode(120,300,380,80,"Q2 · 多项式设计矩阵","b");boxNode(120,420,380,80,"Q3 · 正规方程推导","y");note("MLE ⇒ 最小二乘（IID 正态）",760,220,"g","start");note("每行一样本、每列一系数；先查维度",760,340,"b","start");note("定义 J → 展开 → 对 θ 求导 → 令为零",760,460,"y","start");},"T2 的 Tutorial 有<b>三道连环题</b>，都是「先想清楚再动手」型。<b>Q1 似然论证</b>：从 y=wᵀx+ε、ε~IID 正态出发，写出似然、取对数、扔掉与参数无关的常数项，<em>证明最大化对数似然 = 最小化平方误差</em>（这题和 CS229 L3 前半完全一致）。<b>Q2 多项式设计矩阵</b>：把多项式回归写成线性形式——<b>每行一个观测、每列一个系数</b>（基函数如 [xᵢ², xᵢ, 1]），相乘前<s>先检查 X、θ、y 的维度对不对</s>。<b>Q3 正规方程推导</b>：定义目标 → 小心展开 → 对 θ 求导 → 令为零，并说明可解的矩阵条件。");
  S(0,function(){clearScene();setEq("$$\\theta=(X^{\\top}X)^{-1}X^{\\top}y\\quad(\\text{列满秩时可逆})$$","top");setBig(null);setCap("<b>Q3 的落点：这个式子，加上「列线性无关 ⇒ XᵀX 可逆」。</b>");},"Q3 的<b>标准答案骨架</b>要能默写：① 目标 J(θ)=½‖Xθ−y‖²；② 展开成 ½(θᵀXᵀXθ − 2θᵀXᵀy + yᵀy)；③ 对 θ 求梯度得 XᵀXθ − Xᵀy；④ 令梯度为零得<b>正规方程 XᵀXθ=Xᵀy</b>，解出 θ=(XᵀX)⁻¹Xᵀy；⑤ 补两句限定——<i>当 X 的列线性无关时 XᵀX 可逆</i>；<i>实际用 QR/SVD 更稳，不直接求逆</i>。因为 J 的 Hessian 是 XᵀX（半正定），J 是<b>凸二次函数</b>，所以这个驻点就是全局最小，不需二阶检验。每步给理由，是拿满分的关键。");
  SUM(0,15,{h:"Tutorial 三题：似然/设计矩阵/正规方程（S23–25）",k:"<b>Q1</b>：IID 正态下 MLE⟺最小二乘（写似然→取 log→扔常数项）。<b>Q2</b>：多项式写成线性，行=观测列=系数，先查维度。<b>Q3</b>：定义 J→展开→对 θ 求导→令零→正规方程。",m:"Q3 骨架：J=½‖Xθ−y‖²→梯度 XᵀXθ−Xᵀy→令零→θ=(XᵀX)⁻¹Xᵀy。Hessian=XᵀX 半正定⇒J 凸⇒驻点即全局最小，无需二阶检验。",w:"<s>每步都要给理由</s>，不能只写结果。Q3 结尾必补：列满秩⇒XᵀX 可逆；实际用 QR/SVD 不直接求逆。Q2 相乘前先对维度。",e:"这是 T2 的必考手算三连。Q1=MLE⇒最小二乘（同 CS229 L3），Q2=多项式设计矩阵，Q3=正规方程推导。会默写骨架 + 每步理由 = 满分。"});
  QUIZ(0,15,{t:"T2 Tutorial Q3 推正规方程，令梯度 XᵀXθ−Xᵀy=0 解出 θ 后，<b>必须补充</b>的关键条件是？",o:["学习率要足够小","<b>当 X 的列线性无关时 XᵀX 可逆，θ=(XᵀX)⁻¹Xᵀy 才有唯一解</b>","样本必须服从正态","特征必须先缩放"],a:1,w:"要写出 θ=(XᵀX)⁻¹Xᵀy，前提是 <b>XᵀX 可逆</b>，其充要条件是 <em>X 的列线性无关（列满秩）</em>——否则 XᵀX 奇异、无唯一解。<s>正规方程不需要特征缩放</s>（它不迭代），也不需要正态假设（那是 Q1 似然论证的前提）。答题时还应补一句：实际数值软件用 QR/SVD 求解更稳定，不直接求逆。"});
});

KP("1 · AI 与机器学习的区别（S19）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);boxNode(300,180,680,90,"人工智能 AI（大伞）","v");boxNode(430,320,420,80,"机器学习 ML","b");boxNode(500,430,280,70,"深度学习","g");link(640,270,640,320);link(640,400,640,430);note("AI 还包括：基于规则的系统、搜索、逻辑推理",640,540,"");setCap("<b>AI 是大范畴；机器学习是其中「从数据学习」的一支。</b>");},"第一个考点是<b>把 AI 和机器学习分清</b>。<b>智能</b>是「一个体能学习、推理、适应、用知识达成目标」的能力；<b>AI（人工智能）</b>是让机器表现出这种智能的<em>大范畴</em>，它<i>包括</i>基于规则的专家系统、搜索、逻辑推理等等。<b>机器学习（ML）</b>只是 AI 里的<b>一支</b>——它的特点是「<em>从数据里学出规律，而不是人把规则显式写死</em>」。深度学习又是 ML 里用神经网络的一支。所以是<b>包含关系</b>：AI ⊃ ML ⊃ 深度学习。");
  S(0,function(){clearScene();setBig("从数据学 vs 写死规则","这是 ML 区别于传统 AI 的分水岭");},"考试常问「AI 与 ML 的区别」。标准答法：<b>AI 是更大的范畴</b>，涵盖所有让机器显得智能的方法，<i>包括不学习的、基于规则的系统</i>；<b>机器学习是其中「从数据中归纳规律、而非显式编码规则」的那一支</b>。举例：手写一条「闰年判定」的 if-else 是传统编程/规则系统（不是 ML，因为它不会因见过更多数据而变准）；用一万张标注图片训练模型识别猫是 ML。<s>并非所有自动化或 AI 都是机器学习</s>——判据是「有没有从数据中学习」。");
  SUM(0,1,{h:"AI vs 机器学习：包含关系（S19）",k:"<b>AI ⊃ ML ⊃ 深度学习</b>。AI 是让机器显得智能的大范畴（含规则系统、搜索、推理）；<b>ML 是其中「从数据学规律、非显式写规则」的一支</b>；深度学习是 ML 里用神经网络的一支。",m:"ML 的分水岭是<em>从数据归纳 vs 人写死规则</em>。传统 AI 可以完全基于规则、不学习；ML 靠数据、见得越多越准。",w:"<s>并非所有 AI/自动化都是 ML</s>。手写 if-else 规则（如闰年判定）是编程/规则系统，不是 ML——它不会因数据增多而改进。",e:"T1 常考「AI 与 ML 的区别」：AI 更大、含规则系统；ML 是从数据学习那一支。判据永远是「有没有从数据中学习」。"});
  QUIZ(0,1,{t:"下面哪个最准确地描述 AI 与机器学习的关系？",o:["AI 和 ML 是同义词","<b>AI 是大范畴（含规则系统等），ML 是其中「从数据学规律而非写死规则」的一支</b>","ML 比 AI 更大","AI 是 ML 的一种算法"],a:1,w:"<b>AI ⊃ ML</b>：AI 是让机器显得智能的<em>整个范畴</em>，包括基于规则的专家系统、搜索、逻辑推理（这些不一定「学习」）；<b>机器学习是其中专门「从数据中归纳规律」的分支</b>。深度学习又是 ML 的子集。所以三者是层层包含。判断某方法是不是 ML，看它<s>是否从数据中学习</s>，而不是是否「智能」。"});

KP("2 · ★ 三种学习范式（S20）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);boxNode(120,240,320,110,"监督学习","b");boxNode(490,240,300,110,"无监督学习","g");boxNode(840,240,320,110,"强化学习","y");note("每个样本都带答案（标签）",280,400,"b");note("只有数据，没有答案",640,400,"g");note("只有好坏反馈（奖励）",1000,400,"y");setCap("<b>判据：你能拿到什么形式的反馈。</b>");},"第二个考点是<b>三种学习范式</b>，区分它们的判据只有一条：<b>你能拿到什么形式的反馈</b>。<b>监督学习</b>——每个样本都<em>带正确答案（标签）</em>，学「输入→输出」的映射；分类预测类别、回归预测连续值。<b>无监督学习</b>——<em>只有数据、没有标签</em>，让算法自己发现结构（聚类、降维）。<b>强化学习</b>——<em>没有正确答案，只有好坏评价（奖励）</em>，通过反复试错学一个策略。你课程的三个 Module 正好对应前两类：<b>M1 监督</b>、<b>M2 无监督</b>；M3 神经网络是一种<i>模型</i>，不是第四类问题。");
  S(0,function(){clearScene();setBig("标签的有无","监督=有标签 · 无监督=无标签 · 强化=只有奖励");},"把三者的分界记死。<b>监督 vs 无监督的唯一判据是「训练数据有没有标签」</b>——同一堆数据，给了正确答案就是监督，没给就是无监督。<s>易错点</s>：① 别把「神经网络」当成与监督并列的一类——它是<b>模型</b>，既能做监督也能做无监督；问「属于哪类学习问题」要答监督/无监督/强化，不是答模型名。② 监督内部再按目标<b>连续还是离散</b>分回归/分类，这是<i>二级划分</i>，层级不同别混。强化学习不在你三个 Module 里，但三分法本身会考。");
  SUM(0,2,{h:"★ 三种学习范式（S20）",k:"判据=<b>反馈形式</b>：<b>监督</b>（每样本带标签，学输入→输出）、<b>无监督</b>（无标签，找结构）、<b>强化</b>（只有奖励，试错学策略）。M1 监督、M2 无监督。",m:"监督 vs 无监督唯一判据=<em>训练数据有没有标签</em>。监督内部再按目标连续/离散分回归/分类（二级划分）。神经网络是模型，不是第四类问题。",w:"<s>别把神经网络当一类学习问题</s>——它是模型，能做监督也能做无监督。问「哪类学习」答监督/无监督/强化，别答模型名。",e:"T1 必考三范式。判据是「能拿到什么反馈」：完整答案/什么都没有/只有好坏。回归 vs 分类是监督内部的二级划分，别和三分法混。"});
  QUIZ(0,2,{t:"课件 Study check（S20 类）：区分监督、无监督、强化学习，最本质的判据是？",o:["用的算法不同","数据量大小","<b>能拿到什么形式的反馈：完整正确答案 / 什么都没有 / 只有好坏评价</b>","输出连续还是离散"],a:2,w:"三分法的依据是<b>监督信号的形式</b>：监督学习每样本有<em>完整正确答案</em>（标签）；无监督<s>完全没有答案</s>，只挖数据结构；强化只有<b>好坏评价（奖励）</b>且常延迟。选项 D「输出连续还是离散」是<em>监督学习内部</em>回归 vs 分类的判据，层级不同，别混。"});
});
KP("3 · 数学基础：线代与微积分（S23–24）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setEq("$$x^{\\top}y=\\sum_i x_iy_i,\\quad (AB)_{ij}=\\sum_k A_{ik}B_{kj},\\quad \\lVert x\\rVert=\\sqrt{x^{\\top}x}$$","top");setCap("<b>线性代数：内积、矩阵乘法、转置、范数——全课通用。</b>");},"本学期反复用到的数学，课件做了 recap。<b>线性代数</b>最常用的几件：<b>内积（点积）</b> xᵀy=Σxᵢyᵢ——线性打分 wᵀx 就是它；<b>矩阵乘法</b> (AB)ᵢⱼ=ΣₖAᵢₖBₖⱼ——<i>先检查维度：A 的列数=B 的行数</i>；<b>转置</b> 把行列互换；<b>范数</b> ‖x‖=√(xᵀx)——SVM 的间隔 1/‖w‖ 就用它。还有<b>矩阵可逆、秩、特征值</b>——正规方程 (XᵀX)⁻¹ 要求列满秩、XᵀX 可逆。这些不会单独考，但 T2/T4 的计算题全建立在它们上。");
  S(0,function(){clearScene();setEq("$$\\frac{d(x^n)}{dx}=nx^{n-1},\\quad [f(g(x))]'=f'(g(x))g'(x),\\quad \\nabla J=\\Big[\\tfrac{\\partial J}{\\partial\\theta_1},\\dots\\Big]$$","top");setCap("<b>微积分：幂法则、链式法则、梯度=偏导组成的向量。</b>");},"<b>微积分</b>最常用的：<b>幂法则</b> d(xⁿ)/dx=nxⁿ⁻¹；<b>链式法则</b> [f(g(x))]'=f'(g(x))·g'(x)——推逻辑回归梯度、反向传播全靠它；<b>指数对数</b> d(eˣ)=eˣ、d(ln x)=1/x；<b>梯度</b>∇J 是「J 对每个参数的偏导<em>组成的向量</em>」，指向 J 增长最快的方向。<b>T1 Tutorial Q1-Q2 就是用这些法则做求导练习</b>——比如对平方损失、对 sigmoid 求导。把幂法则和链式法则练熟，T2/T3 的手算梯度就是套公式。");
  SUM(0,3,{h:"数学基础：线代 + 微积分 recap（S23–24）",k:"<b>线代</b>：内积 xᵀy=Σxᵢyᵢ（=线性打分）、矩阵乘法（先查维度）、转置、范数 ‖x‖=√(xᵀx)、可逆/秩（正规方程要列满秩）。<b>微积分</b>：幂法则、链式法则、梯度=偏导向量。",m:"这些是 T2/T3/T4 所有计算题的工具：wᵀx 是内积、1/‖w‖ 是范数、(XᵀX)⁻¹ 要可逆、手算梯度靠幂法则+链式法则。",w:"<s>矩阵乘法先查维度</s>（A 列数=B 行数），否则乘不了。梯度是<em>向量</em>（每个参数一个偏导），不是一个数。",e:"T1 Tutorial Q1-Q2 是用幂法则/链式法则做求导练习。这些数学不单独深考，但是 T2 正规方程、T3 梯度、T4 间隔的基础，必须熟。"});
  QUIZ(0,3,{t:"用链式法则对 L=(σ(z)−y)² 中的 z 求导（σ 是 sigmoid），最外层先做什么？",o:["直接得 0","<b>先对平方求导得 2(σ(z)−y)，再乘内层 σ'(z)——由外往里逐层剥</b>","先对 y 求导","幂法则不适用"],a:1,w:"链式法则<b>由外往里剥</b>：最外层是平方，先对它求导（保持内层不动）得 2(σ(z)−y)，再乘上内层 σ(z) 对 z 的导数 σ'(z)=σ(z)(1−σ(z))。<s>不能跳过中间层</s>。这套「幂法则+链式法则」正是 T2 推最小二乘梯度、T3 推逻辑回归梯度 (p−y)x 的方法，T1 的 Tutorial 就在练它。"});
});
KP("4 · 优化基础：损失·凸性·梯度下降（S26）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);matrix({rows:4,cols:2,cw:340,ch:54,y:190,cell:function(i,j){var t=[["概念","要点"],["损失/目标函数","衡量预测有多差，越小越好"],["凸性","碗形 → 局部最优=全局最优"],["梯度下降","θ ← θ − α∇L，反复迭代"]];return t[i][j];},dim:function(i,j){return i===0;},hl:function(i,j){return false;}});setEq("$$\\theta\\leftarrow\\theta-\\alpha\\nabla L(\\theta)$$","top");},"机器学习的训练本质是<b>优化</b>：定义一个<b>损失/目标函数</b>衡量预测有多差，再<b>最小化</b>它。几个关键概念：<b>凸性</b>——损失面是不是「碗形」，凸函数<em>局部最优即全局最优</em>（线性回归、逻辑回归都凸；神经网络不凸）；<b>梯度下降</b> θ←θ−α∇L 是通用的最小化方法，α 是学习率；<b>收敛</b>——J 走平就停。课件也列了两个具体损失：<b>MSE</b>=(1/n)Σ(y−ŷ)²（回归）和<b>二元交叉熵</b> L=−[y·log p+(1−y)·log(1−p)]（分类）——正好是 T2 和 T3 的损失。");
  S(0,function(){clearScene();setBig("学习 = 最小化损失","定义损失 → 求梯度 → 梯度下降 → 收敛");},"把整个 Module 1 的统一骨架记住：<b>学习 = 定义损失 + 最小化它</b>。不同模型只是换了损失和假设：<i>回归用 MSE、分类用交叉熵、SVM 用 hinge</i>；最小化的方法要么<b>梯度下降</b>（通用）、要么<b>闭式解</b>（只有线性回归等少数有）。<b>局部 vs 全局最优</b>是关键区分：凸问题（M1 的回归、逻辑回归、SVM）没有坏局部最优，随便从哪起步都到同一个底；非凸（神经网络）会卡在局部最优，起点和随机种子影响结果。理解这个骨架，T2/T3/T4 就是同一套推导的不同实例。");
  SUM(0,4,{h:"优化：损失、凸性、梯度下降（S26）",k:"训练=<b>最小化损失</b>。关键概念：<b>凸性</b>（碗形→局部最优=全局最优）、<b>梯度下降</b> θ←θ−α∇L、收敛。具体损失：回归 MSE、分类二元交叉熵。",m:"统一骨架：定义损失→求梯度→梯度下降/闭式解→收敛。不同模型只换损失和假设（MSE/交叉熵/hinge）。凸问题无坏局部最优，非凸（神经网络）会卡住。",w:"<s>凸 vs 非凸区别很大</s>：M1 的回归/逻辑回归/SVM 都凸（唯一最优）；神经网络非凸（起点影响结果）。闭式解只有少数模型有，梯度下降才通用。",e:"这是 M1 的统一主线。会写梯度下降式、区分凸/非凸、认得 MSE 和 BCE 两个损失。T2/T3 就是「换个损失、同一套优化」的实例。"});
  QUIZ(0,4,{t:"「凸函数」这个性质为什么重要？",o:["让训练更快","<b>凸函数局部最优即全局最优——梯度下降从任何起点都能到全局最优，不会卡在坏局部最优</b>","不需要学习率","保证不过拟合"],a:1,w:"<b>凸（碗形）函数只有一个最低点</b>，所以梯度下降只要 α 合适，从<em>任何</em>起点都滚到同一个全局最优，<s>不存在会卡住的坏局部最优</s>。线性回归、逻辑回归、SVM 的目标都是凸的。神经网络<b>非凸</b>——损失面坑坑洼洼，起点和随机种子会影响最终结果，这也是深度学习难调的原因之一。"});
});
KP("5 · ★ ML 端到端流程（S29）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);boxNode(80,150,300,70,"① 数据与准备","b");boxNode(80,258,300,70,"② 训练/选模型","");boxNode(80,366,300,70,"③ 评估","y");boxNode(80,474,300,70,"④ 部署与监控","g");note("收集有代表性的数据、清洗、探索",760,185,"","start");note("拟合参数、选超参",760,293,"","start");note("在留出数据上量化，比基线",760,401,"","start");note("上线后监控输入分布，必要时重训",760,509,"","start");link(230,220,230,258);link(230,328,230,366);link(230,436,230,474);},"第三块考点是 <b>ML 端到端流程</b>：①<b>数据与准备</b>（收集有代表性的数据、清洗、探索）→ ②<b>训练</b>（拟合参数、选模型/超参）→ ③<b>评估</b>（在<em>留出数据</em>上量化表现、和基线比）→ ④<b>部署与监控</b>（上线后盯着输入分布，必要时重训）。课件强调这条流程<b>也是诊断工具</b>：训练好测试差→过拟合；两个都差→欠拟合；上线后掉点→数据分布偏移（data shift）。<s>每一步都可能出问题</s>，T1 大题就是「识别流程中的问题并给对策」。");
  S(0,function(){clearScene();setBig("流程也是诊断表","训练好测试差=过拟合 · 都差=欠拟合 · 上线掉点=分布偏移");},"把「流程即诊断」这张表记熟，是 T1 大题的骨架。<b>训练误差低、测试误差高</b> → <em>过拟合（高方差）</em>：简化模型/加正则/加数据。<b>训练测试都高</b> → <em>欠拟合（高偏差）</em>：加特征/提高复杂度。<b>部署后准确率下降</b>（代码没改）→ <em>数据分布偏移</em>：调查输入变了什么、收集有代表性的新数据、必要时重训重评。<s>常见错误答案</s>：用模型自己的预测当标签继续训练（会固化并放大错误）、或在原训练集上重评（发现不了新数据的问题）。");
  SUM(0,5,{h:"★ ML 流程 = 也是诊断表（S29）",k:"流程：<b>①数据准备 →②训练/选模型 →③评估（留出数据、比基线）→④部署与监控</b>。它<em>也是诊断工具</em>：训练好测试差=过拟合、都差=欠拟合、上线掉点=分布偏移。",m:"每步都可能出问题。过拟合→简化/正则/加数据；欠拟合→加特征/提复杂度；分布偏移→查输入变化、收新数据、重训重评。",w:"<s>别用模型自己的预测当标签继续训</s>（固化错误）；<s>别只在原训练集上重评</s>（发现不了新数据问题）。",e:"T1 大题「识别流程问题并给对策」照这张诊断表答：命名问题（过拟合/欠拟合/分布偏移）+给两个针对性方向。"});
  QUIZ(0,5,{t:"一个 2020–2023 数据训练的模型，代码没改，2026 年准确率明显下降。最恰当的第一步是？",o:["继续用，当初训练准确率很高","在原训练集上重新评估确认还能用","<b>调查输入数据发生了什么变化，收集有代表性的近期样本，必要时重训并重新评估</b>","用模型自己的预测给新数据打标签再继续训练"],a:2,w:"这是典型的<b>数据分布偏移（data shift）</b>：部署环境和训练数据不再一致。正确第一步是<em>调查输入变了什么</em>、收集近期有代表性的数据、必要时重训并重评。<s>选项 B 在原训练集上评估什么都发现不了</s>（问题在新数据）；<s>选项 D 用模型预测当标签会把自身错误固化放大</s>。这道题是 T1 示例选择题的原型。"});
});
KP("6 · ★★ 数据准备不泄漏（S30）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);boxNode(300,140,680,66,"① 先划分 train / validation / test","g");boxNode(300,236,680,66,"② 预处理只在训练集上 fit（装进 Pipeline）","g");boxNode(300,332,680,66,"③ 训练集拟合、验证集选超参","");boxNode(300,428,680,66,"④ 测试集只用一次，报告","r");[206,302,398].forEach(function(y){link(640,y,640,y+30);});setCap("<b>顺序不能乱：划分必须先于任何预处理。</b>");},"这是 T1 <b>最核心的考点</b>：<b>准备数据时别把答案泄漏进去</b>。关键一句——<b>先划分，再预处理</b>。因为<s>数据预处理是模型训练的一部分，不是中性的操作</s>：填补缺失值的 imputer、编码器、标准化的 scaler、特征选择规则，都<em>从数据里学到了信息</em>。这些对象<b>必须只在训练集上 fit</b>，然后原封不动地用到验证、测试和未来数据上——正确做法是把它们<b>装进 Pipeline</b>。如果在划分前用<i>全部</i>数据 fit scaler，测试集的统计量就泄漏进了模型，评估会<b>虚高</b>。这叫<em>预处理泄漏</em>。");
  S(0,function(){clearScene();setBig("两种泄漏","预处理泄漏（划分前 fit）· 选择泄漏（用测试集选超参）");},"两种泄漏都要能识别，是 T1 大题的固定失分点。<b>预处理泄漏</b>：切分前用全量数据 fit scaler/imputer——修法是<i>先切分、预处理装进 Pipeline 只在训练折 fit</i>。<b>选择泄漏</b>：用<em>测试集</em>比较多组超参并选最好的——一旦测试集参与了选择，它就<b>变成了第二个验证集</b>、成绩不再干净；而且「N 次尝试的最大值」本身系统性偏高。修法是<i>用验证集选超参、测试集只用一次</i>。<s>必背句</s>：重复查看测试结果并据此调整，会把测试集变成另一个验证集，产生过于乐观的估计。这条几乎每年考。");
  SUM(0,6,{h:"★★ 数据准备防泄漏（S30）",k:"<b>先划分、再预处理</b>。预处理（imputer/scaler/编码/特征选择）会从数据学信息，<em>必须只在训练集上 fit、装进 Pipeline</em>，原样用到验证/测试。划分前用全量 fit = 预处理泄漏 → 评估虚高。",m:"两种泄漏：<b>预处理泄漏</b>（划分前 fit 预处理）；<b>选择泄漏</b>（用测试集选超参→测试集变成第二个验证集，N 次最大值系统偏高）。修法：验证集选超参、测试集只用一次。",w:"<s>预处理不是中性操作</s>，它是训练的一部分。<s>测试集碰一次就脏</s>——重复看测试结果调参会把它变成验证集，估计过于乐观。",e:"<b>T1 大题核心考点</b>。必背句：重复看测试结果并调整设置，会把测试集变成第二个验证集、产生过于乐观的估计。答「修正流程」照：先划分→Pipeline 防泄漏→验证集选→测试集只用一次。"});
  QUIZ(0,6,{t:"某流程：① 用全部数据 fit StandardScaler ② 切分 train/test ③ 在测试集上比较 8 组超参选最优 ④ 报告该测试准确率。有<b>几处</b>关键错误？",o:["没有错误","一处：超参调得不够细","<b>至少两处：预处理泄漏（切分前 fit scaler）+ 选择泄漏（用测试集选超参）</b>","一处：测试集太小"],a:2,w:"两个独立的泄漏同时发生：① <b>预处理泄漏</b>——切分前用全量 fit scaler，测试集统计量进了模型；正确做法是<em>先切分</em>、scaler 装进 Pipeline 只在训练折 fit。② <b>选择泄漏</b>——在测试集上比较 8 组取最优，测试集变成第二个验证集，且 8 次最大值系统性偏高。修正：切成 train/validation/test，验证集选超参，测试集<b>只用一次</b>。这是 T1 大题的原型。"});
});

  S(0,function(){clearScene();setBig(null);setCap("每一行是一套房子：面积 x、成交价 y。");matrix({rows:6,cols:3,cw:150,ch:46,y:180,cell:function(i,j){var t=[["i","面积 x","价格 y"],["1","2104","400"],["2","1600","330"],["3","2400","369"],["4","1416","232"],["5","3000","540"]];return t[i][j];},dim:function(i,j){return i===0;}});},"先立记号。这张表是<b>训练集</b>：每一行是一个<b>训练样本</b>，一对 (x, y)。<b>x 是输入特征</b>（这里是面积），<b>y 是目标/输出</b>（价格）。我们要从这些成交记录里，学出「面积→价格」的规律。");

  S(0,function(){clearScene();setBig(null);setCap("假设函数 h：把输入映到预测。");boxNode(220,250,240,90,"训练集","b");boxNode(540,250,240,90,"学习算法","");boxNode(860,250,240,90,"假设 h","g");link(460,295,540,295);link(780,295,860,295);note("x →",180,295,"","end");note("→ 预测 y",1120,295,"g","start");},"<b>符号</b>：学习算法吃进训练集，吐出一个函数 <b>h（hypothesis，假设）</b>。<b>直觉</b>：h 就是学到的规律——给它一个新面积 x，它算出预测价格 h(x)。<b>训练</b>阶段调 h 的参数，<b>预测</b>阶段 h 已固定、直接用。这正是 sklearn 里 fit 和 predict 的分工。");
  S(0,function(){clearScene();setBig(null);setCap("最简单的 h：线性。θ 是参数（权重）。");setEq("$$h_\\theta(x)=\\theta_0+\\theta_1x_1+\\theta_2x_2$$","top");},"<b>符号</b>：取最简单的 h——线性函数 hθ(x)=θ₀+θ₁x₁+θ₂x₂（两个特征时）。<b>θ 是参数</b>（也叫权重）：θ₁、θ₂ 是各特征的斜率，θ₀ 是截距。<b>直觉</b>：学习就是<em>调这些 θ</em>，让 h 尽量贴合数据。下标 j 的 θⱼ 配第 j 个特征。");
  S(0,function(){clearScene();setBig(null);setCap("补一个 x₀=1，把截距也塞进求和号。");setEq("$$x_0=1\\;\\Rightarrow\\;h(x)=\\sum_{i=0}^{d}\\theta_ix_i=\\theta^{\\top}x$$","top");},"<b>符号</b>：约定一个<b>哑特征 x₀=1</b>。<b>为什么这么做</b>：这样 θ₀=θ₀·x₀ 就能和 θ₁x₁、θ₂x₂… 一起进求和号，假设塌缩成一个干净的<b>内积 h(x)=θᵀx</b>。<b>直觉</b>：不是真加信息（x₀ 恒为 1），纯是记号便利，让后面的矩阵推导不用单独伺候截距。d 是特征数。");
  SUM(0,1,{h:"记号：训练集、上标、假设 h、θᵀx",k:"训练集 {(x⁽ⁱ⁾,y⁽ⁱ⁾)}，<b>上标 (i)=第 i 个样本</b>（非次方）。假设 hθ(x)=θ₀+θ₁x₁+…，约定 <b>x₀=1</b> 后写成内积 <b>h(x)=θᵀx</b>。θ 是参数。",m:"补 x₀=1 让截距进求和号。之后一切用向量表达。训练调 θ、预测用固定的 h（=fit/predict）。",w:"<s>x⁽ⁱ⁾ 不是 x 的 i 次方</s>，是第 i 个样本。θᵀx 里已含截距（靠 x₀=1）。",e:"T2/T3 所有计算题的记号基础。θᵀx（含 x₀=1）↔ 本课 wᵀx+b 的换算要熟。"});
  QUIZ(0,1,{t:"h(x)=θᵀx 里为什么要约定 x₀=1？",o:["提高精度","<b>把截距 θ₀ 吸收进求和号，让假设写成纯内积 θᵀx</b>","归一化","消除过拟合"],a:1,w:"补一个恒为 1 的哑特征 x₀，θ₀·x₀=θ₀ 就能和别的项一起进求和号，于是 h(x)=Σθᵢxᵢ=<b>θᵀx</b> 是干净的内积。<s>不是加信息</s>，纯记号便利，方便后面矩阵推导。"});
});
KP("2 · 代价函数 J：一步步搭出来",function(){
  S(0,function(){clearScene();setBig(null);setCap("先看单个样本的误差：预测 − 真实。");var P={l:360,r:940,t:150,b:430};axes(P);note("面积",930,455,"");note("价格",350,160,"");var pts=[[470,400],[560,340],[660,300],[760,250],[840,220]];dots(pts,"b",7);curve([[400,420],[900,190]],"fit");pts.forEach(function(p){var yl=420-(p[0]-400)*(230/500);E.link(p[0],yl,p[0],p[1]);});},"怎么衡量一条线好不好？<b>先看一个样本</b>。<b>符号</b>：hθ(x⁽ⁱ⁾) 是模型对第 i 套房的预测，y⁽ⁱ⁾ 是真实价，两者的<b>竖直差 hθ(x⁽ⁱ⁾)−y⁽ⁱ⁾</b> 就是这个样本的误差（残差）。<b>直觉</b>：图上每条竖线就是一个残差，我们想让所有竖线整体最短。");
  S(0,function(){clearScene();setBig(null);setCap("平方它：消符号、且重罚大误差。");setEq("$$\\big(h_\\theta(x^{(i)})-y^{(i)}\\big)^2$$","top");},"<b>符号</b>：把残差<b>平方</b>。<b>为什么平方</b>：① 残差有正有负（预测偏高为正、偏低为负），直接加会<s>互相抵消</s>，平方消掉符号；② 平方对<em>大误差罚得更重</em>（差 2 罚 4、差 10 罚 100）。<b>代价</b>：也因此对离群点敏感。");
  S(0,function(){clearScene();setBig(null);setCap("对所有样本求和，再乘 ½。");setEq("$$J(\\theta)=\\frac12\\sum_{i=1}^{n}\\big(h_\\theta(x^{(i)})-y^{(i)}\\big)^2$$","top");},"<b>符号</b>：把每个样本的平方残差<b>加起来</b>，前面乘 ½，得到<b>代价函数 J(θ)</b>。<b>它是什么</b>：一个衡量「整条线有多差」的<em>单一数字</em>，越小越好。这就是<b>最小二乘（OLS）</b>的代价。");
  S(0,function(){clearScene();setBig(null);setCap("那个 ½ 是为后面求导好看——先记着。");setBig("½","求导时平方的 2 会和它约掉");},"<b>那个 ½ 干嘛的</b>？<b>直觉</b>：纯粹为了<em>后面求导好看</em>——对平方求导会掉出一个 2，正好和 ½ 相乘得 1，梯度式子就干净了。<s>它不改变最优解的位置</s>（乘正常数只改高度、不改最低点在哪）。<b>换算</b>：CS229 用 ½·SSE（不除 n），你课程用 1/(2n)·MSE——最优 θ 相同，手算梯度系数差个 n。");
  S(0,function(){clearScene();setBig(null);setCap("于是问题变成一句话：最小化 J。");setBig("min J(θ)","学习 = 找让 J 最小的 θ");},"<b>结果</b>：找一条好线，<em>翻译成了一个优化问题</em>——<b>最小化 J(θ)</b>。<b>直觉</b>：这是机器学习最核心的套路，把「学习」变成「最小化某个数」。接下来两条路解它：<b>梯度下降</b>（迭代着走）和<b>正规方程</b>（一步到位）。");
  SUM(0,2,{h:"代价函数 J=½Σ(hθ−y)²",k:"单样本残差 hθ(x⁽ⁱ⁾)−y⁽ⁱ⁾ → 平方（消符号+重罚大误差）→ 求和 → 乘 ½ → <b>J(θ)=½Σ(hθ(x⁽ⁱ⁾)−y⁽ⁱ⁾)²</b>。学习=<b>min J</b>。",m:"½ 为求导方便（平方的 2 约掉），不改最优解。平方对离群点敏感。最小化 J 是通用套路。",w:"<s>系数约定</s>：CS229 ½·SSE、本课 1/(2n)·MSE——最优 θ 同、梯度系数差 n。",e:"T2 核心。会一步步搭出 J、解释 ½、说明为何最小化它。"});
  QUIZ(0,2,{t:"代价 J 里的 ½ 主要作用是？",o:["让代价小一半","<b>求导方便——平方产生的 2 与 ½ 约掉，且不改变最优解位置</b>","惩罚大误差","变成概率"],a:1,w:"½ 为<b>求导好看</b>：对 (hθ−y)² 求导掉出 2，和 ½ 相乘得 1。<s>不改最优解</s>——乘正常数只改 J 的高度、不改最低点位置。所以 ½·MSE 和 MSE 学出同样的 θ。"});
});
KP("3 · ★ 梯度下降：逐行求出 LMS 规则",function(){
  S(0,function(){clearScene();setBig(null);setCap("梯度下降的更新式：往负梯度走一步。");setEq("$$\\theta_j:=\\theta_j-\\alpha\\frac{\\partial}{\\partial\\theta_j}J(\\theta)$$","top");},"怎么最小化 J？<b>梯度下降</b>。<b>符号</b>：θⱼ:=θⱼ−α·∂J/∂θⱼ。<b>「:=」是赋值</b>（重算并覆盖旧值），<b>α 是学习率</b>（步长），<b>∂J/∂θⱼ 是梯度</b>（指向 J 增大最快的方向）。<b>直觉</b>：站在山坡上，往最陡的<em>下坡</em>迈一步——下坡就是<b>负</b>梯度，所以是减号。");
  S(0,function(){clearScene();setBig(null);setCap("先只看一个样本，把 Σ 去掉，好算。");setEq("$$\\frac{\\partial}{\\partial\\theta_j}\\,\\tfrac12\\big(h_\\theta(x)-y\\big)^2$$","top");},"现在算 ∂J/∂θⱼ。<b>技巧</b>：先<em>只处理一个样本</em>（把求和号 Σ 去掉），代数走通了最后再加回 Σ。<b>符号</b>：要对 ½(hθ(x)−y)² 关于 θⱼ 求偏导。<b>直觉</b>：这是个「平方套着一个含 θ 的括号」的复合函数，用链式法则。");
  S(0,function(){clearScene();setBig(null);setCap("链式法则第一步：把平方的 2 提下来。");setEq("$$=2\\cdot\\tfrac12\\big(h_\\theta(x)-y\\big)\\cdot\\frac{\\partial}{\\partial\\theta_j}\\big(h_\\theta(x)-y\\big)$$","top");},"<b>符号</b>：链式法则「由外往里剥」。外层是平方 u²，先对它求导得 2u——即 <b>2·½(hθ(x)−y)</b>，再乘上<b>内层的导数</b> ∂/∂θⱼ(hθ(x)−y)。<b>直觉</b>：先保持括号不动、对平方求导，再单独处理括号里的东西。这一步只完成了一半。");
  S(0,function(){clearScene();setBig(null);setCap("½ 和 2 相乘正好是 1，消掉。");setEq("$$=\\big(h_\\theta(x)-y\\big)\\cdot\\frac{\\partial}{\\partial\\theta_j}\\big(h_\\theta(x)-y\\big)$$","top");},"<b>符号</b>：前面的 <b>½ 和 2 相乘=1</b>，一起消失，只剩 (hθ(x)−y)·∂/∂θⱼ(hθ(x)−y)。<b>直觉</b>：<s>这就是当初在 J 里加 ½ 的全部动机</s>——让这一步干净。没加的话这里会一路拖着一个 2，最终梯度变成 2(hθ−y)x，也对，只是难看。");
  S(0,function(){clearScene();setBig(null);setCap("展开 h，看括号里谁含 θⱼ。");setEq("$$\\frac{\\partial}{\\partial\\theta_j}\\Big(\\textstyle\\sum_{i=0}^{d}\\theta_ix_i-y\\Big)$$","top");},"<b>符号</b>：处理内层导数。把 hθ(x) 按定义展开成 θ₀x₀+θ₁x₁+…+θ_dx_d，再减 y。<b>直觉</b>：现在要对 θⱼ 求偏导，得看这个求和式里<em>哪些项和 θⱼ 有关</em>。");
  S(0,function(){clearScene();setBig(null);setCap("关键：只有第 j 项含 θⱼ，其余全是常数。");setEq("$$=x_j\\quad(\\text{只有 }\\theta_jx_j\\text{ 那一项留下})$$","top");},"<b>关键观察</b>：在 Σθᵢxᵢ−y 里，<b>只有第 j 项 θⱼxⱼ 含 θⱼ</b>；其余每一项（以及 −y）对 θⱼ 而言都是<em>常数</em>，求导后全归零。<b>符号</b>：所以整个括号的偏导只剩 θⱼxⱼ 的导数，也就是 <b>xⱼ</b>。<b>直觉</b>：偏导就是「只让 θⱼ 动、别的不动」，自然只留下它那一项。");
  S(0,function(){clearScene();setBig(null);setCap("合起来：误差 × 该特征。");setEq("$$\\frac{\\partial}{\\partial\\theta_j}J=\\big(h_\\theta(x)-y\\big)\\,x_j$$","top");},"<b>符号</b>：两半合起来，单样本梯度 = <b>(hθ(x)−y)·xⱼ</b>。<b>直觉</b>：形状极有意义——<b>「误差 × 该特征」</b>。误差 (hθ(x)−y) 决定「要调多少」，特征值 xⱼ 决定「这个参数该负多少责任」。");
  S(0,function(){clearScene();setBig(null);setCap("代回更新式，得 LMS / Widrow-Hoff 规则。");setEq("$$\\theta_j:=\\theta_j+\\alpha\\big(y^{(i)}-h_\\theta(x^{(i)})\\big)x_j^{(i)}$$","top");},"<b>符号</b>：代回梯度下降（注意讲义把负号并进去、写成 y−hθ，成了加号）：<b>θⱼ:=θⱼ+α(y−hθ(x))xⱼ</b>。这叫 <b>LMS 规则</b>（least mean squares）/ Widrow-Hoff 规则。<b>直觉</b>：某特征在这个样本取值为 0，它就不为这次误差负责，更新量里 xⱼ=0 那项确实是 0。<s>记住这个「误差×特征」的形状</s>——逻辑回归会得到一模一样的形式。");
  SUM(0,3,{h:"★ 逐行推出 LMS：θⱼ:=θⱼ+α(y−hθ)xⱼ",k:"对 ½(hθ−y)² 用链式法则：①提下 2 ②½·2=1 ③展开 h ④只有第 j 项含 θⱼ→导数 xⱼ ⑤合并得 <b>(hθ−y)xⱼ</b>。代回得 <b>LMS：θⱼ:=θⱼ+α(y−hθ)xⱼ</b>。",m:"梯度形状=<b>误差×特征</b>：误差定「调多少」、特征定「谁负责」。特征为 0 该项不更新。½ 的作用就是让 ½·2=1。",w:"<s>负号并进 y−hθ 成了加号</s>（等价）。这个形状 T3 逻辑回归会重现，不是巧合（GLM）。",e:"T2 手算梯度的核心链。每一步（链式、只留第 j 项）都要会。"});
  QUIZ(0,3,{t:"求 ∂/∂θⱼ(Σθᵢxᵢ−y) 时，为什么结果是 xⱼ？",o:["因为所有项都含 θⱼ","<b>因为只有第 j 项 θⱼxⱼ 含 θⱼ，其余项和 −y 都是常数、导数为 0</b>","因为 x₀=1","因为用了链式法则"],a:1,w:"对 θⱼ 求偏导=「只让 θⱼ 变」。求和式 Σθᵢxᵢ 里<b>只有 θⱼxⱼ 那一项含 θⱼ</b>，它的导数是 xⱼ；其余项（θᵢxᵢ, i≠j）和 −y 对 θⱼ 都是常数，导数为 0。所以整个偏导=<b>xⱼ</b>。这一步是「误差×特征」里那个特征的来源。"});
});
KP("4 · 批量与随机：加回求和号",function(){
  S(0,function(){clearScene();setBig(null);setCap("把 Σ 加回来：批量梯度下降。");setEq("$$\\theta_j:=\\theta_j+\\alpha\\sum_{i=1}^{n}\\big(y^{(i)}-h_\\theta(x^{(i)})\\big)x_j^{(i)}$$","top");},"刚才只用一个样本。<b>把求和号加回来</b>——每步用<em>全部 n 个</em>样本的贡献之和，这就是<b>批量梯度下降（batch）</b>。<b>符号</b>：Σ 从 1 到 n。<b>直觉</b>：这个和正好等于真正的 ∂J/∂θⱼ，方向最准；代价是数据大时每走一步要扫一遍全表，很贵。");
  S(0,function(){clearScene();setBig(null);setCap("每次只用一个样本：随机梯度下降。");setEq("$$\\text{for }i=1..n:\\ \\theta_j:=\\theta_j+\\alpha\\big(y^{(i)}-h_\\theta(x^{(i)})\\big)x_j^{(i)}$$","top");},"<b>另一条路</b>：每看<em>一个</em>样本就立刻更新一次——<b>随机梯度下降（SGD）</b>。<b>符号</b>：内层遍历每个 i，各更新一次。<b>直觉</b>：数据大时它能<b>立刻开始进步</b>、往往快得多；代价是路径抖、可能<s>不真正停在最优</s>，只在附近震荡（让 α 随时间衰减能让它收敛）。");
  S(0,function(){clearScene();setBig(null);setCap("为什么线性回归随便走都能到底？J 是凸的。");setBig("J 是凸的","碗形 · 局部最优即全局最优");},"<b>为什么梯度下降对线性回归总有效</b>？<b>符号/事实</b>：J 是关于 θ 的<b>凸二次函数</b>（碗形），只有一个最低点。<b>直觉</b>：<b>局部最优即全局最优</b>，只要 α 不太大，从任何起点出发都滚到同一个底、不会卡住。逻辑回归也凸；神经网络<s>不凸</s>，起点会影响结果。");
  SUM(0,4,{h:"批量 vs 随机梯度下降",k:"加回 Σ=<b>批量 GD</b>（每步用全部 n 个、方向准但贵）。每次用 1 个=<b>SGD</b>（快、能立刻进步、但抖、可能只在最优附近震荡）。",m:"J 凸（碗形）⟹ 局部最优=全局最优，随便起点都收敛。让 α 衰减可让 SGD 真正收敛。数据大时 SGD 更划算。",w:"<s>SGD 不保证停在最优</s>：单样本梯度在最优点一般非零、会推走参数。批量在最优点梯度为零、能停。",e:"对应 T2 batch vs SGD。同贡献、不同组合；权衡稳定 vs 速度。"});
  QUIZ(0,4,{t:"随机梯度下降（SGD）相比批量，一个固有代价是？",o:["方向永远错","<b>可能不真正收敛、只在最优附近震荡（除非 α 衰减）</b>","无法用于大数据","一定更慢"],a:1,w:"SGD 每步只用一个样本，是真梯度的高方差估计。即使到了最优，某个单样本梯度通常非零、会把参数<b>推走</b>，于是在最优附近<b>持续震荡</b>。让 α 随迭代<em>衰减</em>可收敛。批量没这问题（最优点全体梯度为零），但 SGD 在大数据上进步快。"});
});
KP("5 · 换成矩阵语言：设计矩阵",function(){
  S(0,function(){clearScene();setBig(null);setCap("矩阵求导：结果和被求的矩阵同形。");setEq("$$\\big(\\nabla_A f\\big)_{ij}=\\frac{\\partial f}{\\partial A_{ij}}$$","top");},"第二条路：不迭代、直接解。先备一个工具——<b>矩阵求导</b>。<b>符号</b>：f 对矩阵 A 的梯度 ∇_A f，是一个<em>和 A 同形</em>的矩阵，第 (i,j) 元放 ∂f/∂A_{ij}。<b>直觉</b>：就是「逐个元素求偏导，摆回原位置」。同形是检查有没有算错的第一关。");
  S(0,function(){clearScene();setBig(null);setCap("把训练集堆成设计矩阵 X：每行一个样本。");setEq("$$X=\\begin{bmatrix}-\\,(x^{(1)})^{\\top}\\,-\\\\ \\vdots\\\\ -\\,(x^{(n)})^{\\top}\\,-\\end{bmatrix},\\quad \\vec y=\\begin{bmatrix}y^{(1)}\\\\ \\vdots\\\\ y^{(n)}\\end{bmatrix}$$","top");},"<b>符号</b>：把训练集堆成<b>设计矩阵 X</b>——<em>每行是一个样本 (x⁽ⁱ⁾)ᵀ</em>（含 x₀=1 那列），y⃗ 是所有目标堆成的向量。<b>直觉/查形状</b>：X 是 n×(d+1)、θ 是 (d+1)×1，所以 Xθ 是 n×1，和 y⃗ 同形，能相减。");
  S(0,function(){clearScene();setBig(null);setCap("Xθ 一次算出所有预测；Xθ−y 是残差向量。");setEq("$$X\\theta-\\vec y=\\begin{bmatrix}h_\\theta(x^{(1)})-y^{(1)}\\\\ \\vdots\\\\ h_\\theta(x^{(n)})-y^{(n)}\\end{bmatrix}$$","top");},"<b>符号</b>：因为 hθ(x⁽ⁱ⁾)=(x⁽ⁱ⁾)ᵀθ，所以 <b>Xθ 一次算出全部 n 个预测</b>，<b>Xθ−y⃗ 就是残差向量</b>（每个分量是一个样本的残差）。<b>直觉</b>：前面那 n 条竖线，现在装进了一个向量。");
  S(0,function(){clearScene();setBig(null);setCap("用 zᵀz=Σzᵢ²，把 J 写成矩阵形式。");setEq("$$J(\\theta)=\\tfrac12(X\\theta-\\vec y)^{\\top}(X\\theta-\\vec y)$$","top");},"<b>符号</b>：利用「向量 zᵀz=Σzᵢ²」这个事实，残差平方和就写成 <b>J(θ)=½(Xθ−y⃗)ᵀ(Xθ−y⃗)</b>。<b>直觉</b>：这和带 Σ 的定义<em>是同一个数</em>，只是换成了矩阵语言——<s>没换模型，只换写法</s>，为的是能套矩阵求导公式。");
  SUM(0,5,{h:"矩阵化：设计矩阵 X 与 J 的矩阵形式",k:"矩阵求导 ∇_A f 与 A 同形、逐元素偏导。<b>设计矩阵 X</b> 每行一个样本 → <b>Xθ−y⃗=残差向量</b> → <b>J=½(Xθ−y⃗)ᵀ(Xθ−y⃗)</b>（用 zᵀz=Σzᵢ²）。",m:"把 Σ 翻成矩阵语言，为的是能机械套矩阵求导公式推正规方程。同值、不同写法。",w:"<s>先查维度</s>：X 是 n×(d+1)、θ (d+1)×1、Xθ n×1。形状不对就是写错了。",e:"T2 Tutorial Q2/Q3 前置：会写设计矩阵、J 的矩阵形式、相乘前查维度。"});
  QUIZ(0,5,{t:"设计矩阵 X 的每一行是什么？",o:["一个特征","<b>一个训练样本 (x⁽ⁱ⁾)ᵀ（含 x₀=1 那列）</b>","一个参数","目标向量"],a:1,w:"<b>设计矩阵每行是一个样本</b> (x⁽ⁱ⁾)ᵀ、每列一个特征（第一列常是全 1 的截距列），所以 X 是 n×(d+1)。于是 Xθ 一次算出全部预测、Xθ−y⃗ 是残差向量。和 sklearn 的 X 形状 (n_samples, n_features) 一致。"});
});
KP("6 · ★ 正规方程：逐行求梯度、令为零",function(){
  S(0,function(){clearScene();setBig(null);setCap("目标：对 J 求梯度。");setEq("$$\\nabla_\\theta J=\\nabla_\\theta\\,\\tfrac12(X\\theta-\\vec y)^{\\top}(X\\theta-\\vec y)$$","top");},"既然 J 是碗，直接<b>令梯度为零</b>解碗底。<b>符号</b>：要算 ∇_θ J，即对 ½(Xθ−y⃗)ᵀ(Xθ−y⃗) 关于 θ 求梯度。<b>直觉</b>：接下来把括号乘开，再逐项求导。");
  S(0,function(){clearScene();setBig(null);setCap("乘开：像 (a−b)ᵀ(a−b) 展成四项。");setEq("$$=\\tfrac12\\nabla_\\theta\\big(\\theta^{\\top}X^{\\top}X\\theta-\\theta^{\\top}X^{\\top}\\vec y-\\vec y^{\\top}X\\theta+\\vec y^{\\top}\\vec y\\big)$$","top");},"<b>符号</b>：把 (Xθ−y⃗)ᵀ(Xθ−y⃗) 像 (a−b)ᵀ(a−b) 一样展开成四项。<b>注意</b>：矩阵乘法<s>不交换</s>，展开时因子的先后顺序要保持。<b>直觉</b>：得到 θᵀXᵀXθ、两个交叉项、和 y⃗ᵀy⃗。");
  S(0,function(){clearScene();setBig(null);setCap("中间两项是标量、互为转置，相等 → 合并。");setEq("$$=\\tfrac12\\nabla_\\theta\\big(\\theta^{\\top}X^{\\top}X\\theta-2\\theta^{\\top}X^{\\top}\\vec y+\\vec y^{\\top}\\vec y\\big)$$","top");},"<b>符号</b>：中间两项 θᵀXᵀy⃗ 和 y⃗ᵀXθ 都是 <b>1×1 的标量</b>，而且互为转置；标量的转置等于自己，所以两者<em>相等</em>，合并成 <b>−2θᵀXᵀy⃗</b>。<b>直觉</b>：一个数和它的转置当然一样，于是两项并作一项。");
  S(0,function(){clearScene();setBig(null);setCap("逐项求导：用 ∇xᵀAx=2Ax 和 ∇bᵀx=b。");setEq("$$=\\tfrac12\\big(2X^{\\top}X\\theta-2X^{\\top}\\vec y\\big)$$","top");},"<b>符号</b>：逐项求导。二次项用 <b>∇_x(xᵀAx)=2Ax</b>（A=XᵀX 对称）得 2XᵀXθ；线性项用 <b>∇_x(bᵀx)=b</b> 得 2Xᵀy⃗；常数项 y⃗ᵀy⃗ 不含 θ、导数为 0。<b>直觉</b>：和标量 (ax²)'=2ax、(bx)'=b 一个道理，只是矩阵版。");
  S(0,function(){clearScene();setBig(null);setCap("½ 和 2 约掉，得到梯度。");setEq("$$\\nabla_\\theta J=X^{\\top}X\\theta-X^{\\top}\\vec y$$","top");},"<b>符号</b>：外面的 ½ 把两个 2 约掉，梯度就是 <b>∇_θ J=XᵀXθ−Xᵀy⃗</b>。<b>查形状</b>：它是 (d+1)×1、和 θ 同形，符合梯度定义——又一次自检通过。");
  S(0,function(){clearScene();setBig(null);setCap("令梯度为零 → 正规方程。");setEq("$$X^{\\top}X\\theta=X^{\\top}\\vec y\\quad(\\text{正规方程})$$","top");},"<b>符号</b>：碗底处梯度为零，令 XᵀXθ−Xᵀy⃗=0，移项得 <b>正规方程 XᵀXθ=Xᵀy⃗</b>。<b>直觉/名字</b>：normal（正规=正交）——最优时残差向量与 X 的所有列正交，数据里剩的误差已无法再用特征的线性组合解释。");
  S(0,function(){clearScene();setBig(null);setCap("两边左乘逆，解出 θ。前提：XᵀX 可逆。");setEq("$$\\theta=(X^{\\top}X)^{-1}X^{\\top}\\vec y$$","top");},"<b>符号</b>：两边左乘 (XᵀX)⁻¹，解出 <b>θ=(XᵀX)⁻¹Xᵀy⃗</b>——一步闭式解、不用迭代、不用选 α。<b>前提</b>：XᵀX 可逆，其充要条件是 <em>X 的列线性无关</em>（特征不冗余、样本够）。<b>直觉</b>：因为 J 凸，这个驻点就是全局最小，不必二阶检验。<s>实际软件用 QR/SVD，不直接求逆</s>（更稳）。");
  SUM(0,6,{h:"★ 逐行推正规方程 θ=(XᵀX)⁻¹Xᵀy",k:"∇½(Xθ−y⃗)ᵀ(Xθ−y⃗)：①展成四项 ②中间两项标量相等→−2θᵀXᵀy⃗ ③用 ∇xᵀAx=2Ax、∇bᵀx=b 求导 ④½·2 约掉→<b>XᵀXθ−Xᵀy⃗</b> ⑤令零→<b>θ=(XᵀX)⁻¹Xᵀy⃗</b>。",m:"名字 normal=正交（残差⊥X 的列）。J 凸 ⟹ 驻点即全局最小，无需二阶检验。",w:"<s>前提 XᵀX 可逆 ⟺ X 列线性无关</s>。实际用 QR/SVD 不直接求逆。矩阵不交换，展开保持顺序。",e:"<b>T2 Tutorial Q3 原题</b>：定义 J→展开→求导→令零→正规方程，补「列满秩⇒可逆」「用 QR/SVD」，每步给理由。"});
  QUIZ(0,6,{t:"θ=(XᵀX)⁻¹Xᵀy 成立需要 XᵀX 可逆，其条件是？",o:["样本服从正态","<b>X 的列线性无关（列满秩）</b>","学习率够小","特征已标准化"],a:1,w:"<b>XᵀX 可逆 ⟺ X 列线性无关（列满秩）</b>——没有冗余/共线特征、样本数不少于特征数。否则 XᵀX 奇异、无唯一解，要用伪逆。<s>正态是概率解释（Q1）的前提，不是正规方程的</s>；正规方程也不需要特征缩放。"});
});
KP("7 · ★★ 极大似然 ⇒ 最小二乘（逐行）",function(){
  S(0,function(){clearScene();setBig(null);setCap("为什么偏偏是平方误差？给个硬理由。");setBig("?","平方误差从哪来");},"上面我们<em>假设</em>用平方误差。<b>为什么是平方</b>、不是绝对值、不是四次方？<b>直觉</b>：讲义要给一个<b>硬理由</b>——在一组明确的<em>概率假设</em>下，最小二乘不是随便选的，而是<b>极大似然的必然结果</b>。这也正是你 T2 Tutorial Q1 那道题。接下来一步步推。");
  S(0,function(){clearScene();setBig(null);setCap("第①步：给数据一个生成故事。");setEq("$$y^{(i)}=\\theta^{\\top}x^{(i)}+\\varepsilon^{(i)}$$","top");},"<b>符号</b>：假设真实值 = <b>线性部分 θᵀx⁽ⁱ⁾ 加上一个误差项 ε⁽ⁱ⁾</b>。<b>直觉</b>：假设世界本身是线性的，我们看到的偏差全来自 ε。这是整段推导的起点。");
  S(0,function(){clearScene();setBig(null);setCap("ε 是什么？没被特征捕捉的一切 + 测量噪声。");setBig("ε","未建模因素 + 测量误差");},"<b>ε 装的是什么</b>？<b>直觉</b>：所有<em>没被特征捕捉到的因素</em>（朝向、卖家心态、当天行情）加上测量误差。太多太杂、无法一一建模，就打包成一个随机变量。<s>它不是「模型算错、可调没」的东西</s>——即使 θ 最优，ε 依然在。");
  S(0,function(){clearScene();setBig(null);setCap("第②步：假设 ε 是 IID 高斯。");setEq("$$\\varepsilon^{(i)}\\sim\\mathcal N(0,\\sigma^2)\\ \\text{IID}$$","top");},"<b>符号</b>：假设各 ε⁽ⁱ⁾ <b>独立同分布（IID）</b>、服从<b>均值 0、方差 σ² 的正态分布</b>。<b>为什么这么假设</b>：① 中心极限定理——ε 是许多独立小因素之和，趋向正态；② 数学上方便。均值 0 表示<em>误差没有系统性偏向</em>（否则那部分应吸进 θ₀）。");
  S(0,function(){clearScene();setBig(null);setCap("第③步：写出一个 ε 的概率密度。");setEq("$$p(\\varepsilon^{(i)})=\\frac{1}{\\sqrt{2\\pi}\\,\\sigma}\\exp\\!\\Big(-\\frac{(\\varepsilon^{(i)})^2}{2\\sigma^2}\\Big)$$","top");},"<b>符号</b>：正态分布的密度公式——这就是 ε⁽ⁱ⁾ 的概率密度。<b>直觉</b>：指数里是 <em>−ε²/2σ²</em>，ε 越接近 0 密度越高（钟形）。<b>记住这个平方</b>——它待会儿会变成平方损失。");
  S(0,function(){clearScene();setBig(null);setCap("第④步：把 ε=y−θᵀx 代进去，得 y 的密度。");setEq("$$p(y^{(i)}|x^{(i)};\\theta)=\\frac{1}{\\sqrt{2\\pi}\\,\\sigma}\\exp\\!\\Big(-\\frac{(y^{(i)}-\\theta^{\\top}x^{(i)})^2}{2\\sigma^2}\\Big)$$","top");},"<b>符号</b>：因为 ε=y−θᵀx，把它代进去，就得到<b>给定 x 时 y 的密度</b> p(y⁽ⁱ⁾|x⁽ⁱ⁾;θ)。<b>直觉</b>：给定 x，y 也是正态的，只是<em>中心从 0 移到了 θᵀx</em>。<b>分号</b>：p(y|x;θ) 的分号表示 θ 是<b>参数、不是随机变量</b>（频率学派写法）。");
  S(0,function(){clearScene();setBig(null);setCap("第⑤步：所有样本的密度连乘 = 似然。");setEq("$$L(\\theta)=\\prod_{i=1}^{n}p(y^{(i)}|x^{(i)};\\theta)$$","top");},"<b>符号</b>：把所有样本的密度<b>连乘</b>，得到<b>似然函数 L(θ)</b>。<b>为什么能连乘</b>：正因为假设了样本<em>独立</em>——独立事件的联合概率=各自概率之积。<b>直觉</b>：似然问的是「哪个 θ 最可能<em>生成</em>这组已观测到的数据」，变量是 θ、数据固定。");
  S(0,function(){clearScene();setBig(null);setCap("第⑥步：取对数——连乘变连加，好求导。");setEq("$$\\ell(\\theta)=\\log L(\\theta)=\\sum_{i=1}^{n}\\log p(y^{(i)}|x^{(i)};\\theta)$$","top");},"<b>符号</b>：取对数得<b>对数似然 ℓ(θ)</b>。<b>为什么取对数</b>：① log 单调递增，最大化 log L 和 L 得<em>同一个 θ</em>；② log 把<b>连乘变连加</b>，求导立刻变简单；③ 几百个小于 1 的概率连乘会数值下溢，取 log 变加法就没事。");
  S(0,function(){clearScene();setBig(null);setCap("第⑦步：代入密度，log 剥掉 exp、留下平方。");setEq("$$\\ell(\\theta)=n\\log\\frac{1}{\\sqrt{2\\pi}\\sigma}-\\frac{1}{\\sigma^2}\\cdot\\frac12\\sum_{i=1}^{n}(y^{(i)}-\\theta^{\\top}x^{(i)})^2$$","top");},"<b>符号</b>：代入正态密度，<b>log 把 exp 直接剥掉</b>，指数里的平方项掉下来。得到两部分：<b>第一项 n·log(1/√2πσ) 是常数</b>（不含 θ）；<b>第二项前面是负系数 −1/σ²</b>，乘着 ½Σ(y−θᵀx)²。<b>直觉</b>：这正是「正态假设」和「平方损失」的接头处——指数里的平方现在露出来了。");
  S(0,function(){clearScene();setBig(null);setCap("第⑧步：丢常数、系数为负 → 结论。");setEq("$$\\max_\\theta\\ \\ell(\\theta)\\;\\Longleftrightarrow\\;\\min_\\theta\\ \\tfrac12\\sum_{i=1}^{n}(y^{(i)}-\\theta^{\\top}x^{(i)})^2$$","top");},"<b>符号</b>：第一项与 θ 无关、丢掉；第二项系数是负常数——所以<b>最大化 ℓ(θ) ⟺ 最小化 ½Σ(y−θᵀx)²</b>，右边正是最小二乘代价 J！<b>结论</b>：在 IID 高斯噪声假设下，<em>最小二乘就是极大似然估计</em>。平方损失是这组假设的<b>数学推论</b>，不是任意选择。<s>换个噪声分布（拉普拉斯）就导出绝对值损失</s>。");
  SUM(0,7,{h:"★★ 逐行推 MLE ⇒ 最小二乘",k:"①y=θᵀx+ε ②ε~N(0,σ²) IID ③写 ε 密度 ④代 ε=y−θᵀx 得 p(y|x;θ) ⑤独立⇒似然连乘 L ⑥取 log 变连加 ℓ ⑦log 剥 exp 留平方 ⑧丢常数、系数负 ⟹ <b>max ℓ = min ½Σ(y−θᵀx)²</b>。",m:"能连乘=独立；正态让指数出平方；均值 0 无系统偏移。平方损失是 IID 高斯的推论。最优 θ 与 σ² 无关。",w:"<s>条件结论</s>：噪声非高斯（拉普拉斯）→绝对值损失。p(y|x;θ) 分号=θ 是参数非随机变量。",e:"<b>T2 Tutorial Q1 整道题</b>。四大步（模型+IID高斯 / 独立⇒连乘 / log剥exp / 丢常数），每步给理由，结尾补「假设变则损失可能要变」。"});
  QUIZ(0,7,{t:"在什么假设下，最小化平方误差等价于极大似然估计？",o:["特征已标准化","<b>误差 IID 且服从均值 0 的正态分布（高斯噪声）</b>","模型含二次项","α 够小"],a:1,w:"假设 <b>y=θᵀx+ε，ε 独立同分布、服从 N(0,σ²)</b>。三条各有用：<i>独立</i>让似然连乘；<i>正态</i>让 log 剥 exp 后留下平方；<i>均值 0</i> 无系统偏移。于是 max 对数似然 ⟺ min ½Σ(y−θᵀx)²=最小二乘。<s>换拉普拉斯噪声就导出绝对值损失</s>——平方损失是这组假设的推论。这是 T2 Tutorial Q1。"});
});
KP("8 · ★ 逻辑回归：逐行到 (y−h)x",function(){
  S(0,function(){clearScene();setBig(null);setCap("换到分类：y 只取 0 或 1。");var P={l:380,r:900,t:200,b:460};axes(P);note("x",890,485,"");var r=rng(17),a=[],b=[];for(var i=0;i<7;i++)a.push([410+r()*180,460]);for(var j=0;j<7;j++)b.push([650+r()*210,200]);dots(a,"c",7);dots(b,"b",7);note("y=0",480,500,"g");note("y=1",800,180,"b");},"转到<b>分类</b>：y 只取 <b>0 或 1</b>（二分类）。<b>为什么不用线性回归硬套</b>：直线输出会跑到 0 以下、1 以上，没法当概率；而且远处样本会把直线拽歪。<b>直觉</b>：需要一个函数，把线性打分<em>压进 (0,1)</em>、当成概率——这就是 sigmoid。");
  S(0,function(){clearScene();setBig(null);setCap("sigmoid：把任意实数挤进 (0,1)。");var P={l:340,r:940,t:170,b:450};axes(P);note("z",930,475,"");var pts=[];for(var k=0;k<=60;k++){var z=-6+12*k/60;var p=1/(1+Math.exp(-z));pts.push([340+(z+6)/12*600,450-p*280]);}curve(pts,"fit b");dots([[640,310]],"y",7);note("g(0)=0.5",640,290,"y");setEq("$$g(z)=\\frac{1}{1+e^{-z}}$$","top");},"<b>符号</b>：<b>sigmoid</b> g(z)=1/(1+e⁻ᶻ)，S 形曲线，把任意实数挤进 <b>(0,1)</b>。<b>直觉</b>：z 很大→接近 1、很小→接近 0、<b>z=0→恰好 0.5</b>。所以它天然适合当「属于正类的概率」。关键性质后面要用：<b>g′(z)=g(z)(1−g(z))</b>。");
  S(0,function(){clearScene();setBig(null);setCap("假设 h=g(θᵀx)，读成 P(y=1|x)。");setEq("$$h_\\theta(x)=g(\\theta^{\\top}x),\\quad P(y=1|x;\\theta)=h_\\theta(x)$$","top");},"<b>符号</b>：把线性打分 θᵀx 送进 sigmoid，得 hθ(x)=g(θᵀx)，解释成 <b>P(y=1|x;θ)=hθ(x)</b>。<b>直觉</b>：模型输出的是「这个样本是正类的概率」，不是硬标签。决策边界在 θᵀx=0（那里 g=0.5）。");
  S(0,function(){clearScene();setBig(null);setCap("y=0 的概率就是 1−h。");setEq("$$P(y=0|x;\\theta)=1-h_\\theta(x)$$","top");},"<b>符号</b>：既然 P(y=1)=h，那 <b>P(y=0)=1−h</b>（两者相加=1）。<b>直觉</b>：这就是一个<b>伯努利分布</b>（只有两种结果的试验），参数是 h(x)。和线性回归假设「y 是正态」完全平行——只是换了个分布。");
  S(0,function(){clearScene();setBig(null);setCap("两句压成一个式子：用指数当开关。");setEq("$$p(y|x;\\theta)=h_\\theta(x)^{y}\\,(1-h_\\theta(x))^{1-y}$$","top");},"<b>符号</b>：把上面两种情况压成一个式子 <b>p(y|x)=h^y(1−h)^(1−y)</b>。<b>怎么做到的</b>：靠「任何数的 0 次方=1」当<em>开关</em>——y=1 时后半 (…)^0=1、只留 h；y=0 时前半 h^0=1、只留 1−h。<b>直觉</b>：这么写是为了能对整个式子<em>统一求导</em>，不用分情况。");
  S(0,function(){clearScene();setBig(null);setCap("连乘取对数 → 对数似然（= 交叉熵的相反数）。");setEq("$$\\ell(\\theta)=\\sum_{i}\\Big[y^{(i)}\\log h_\\theta(x^{(i)})+(1-y^{(i)})\\log(1-h_\\theta(x^{(i)}))\\Big]$$","top");},"<b>符号</b>：所有样本连乘得似然、取对数得<b>对数似然 ℓ(θ)=Σ[y log h+(1−y)log(1−h)]</b>。<b>直觉/换算</b>：<s>这个式子你一定见过</s>——它就是你课程的<b>二元交叉熵</b>，只差一个负号和 1/N。CS229「最大化 ℓ」= 你课程「最小化平均交叉熵」，同一件事。");
  S(0,function(){clearScene();setBig(null);setCap("求导要用 sigmoid 的性质 g′=g(1−g)。");setEq("$$g'(z)=g(z)\\big(1-g(z)\\big)$$","top");},"<b>符号</b>：现在对 ℓ 求偏导，会用到 sigmoid 的漂亮性质 <b>g′(z)=g(z)(1−g(z))</b>——导数能用自身表达。<b>直觉</b>：正是这个性质，让下一步的求导里一堆分母<em>神奇地约掉</em>，只剩极简结果。");
  S(0,function(){clearScene();setBig(null);setCap("求导后，一堆项约掉，只剩 (y−h)x。");setEq("$$\\frac{\\partial\\ell}{\\partial\\theta_j}=\\big(y-h_\\theta(x)\\big)x_j$$","top");},"<b>符号</b>：代入 g′=g(1−g) 求导，分母上的东西全约掉，只剩 <b>∂ℓ/∂θⱼ=(y−hθ(x))xⱼ</b>。<b>直觉/震撼点</b>：<b>这和线性回归的 LMS 一模一样！</b>唯一差别是 hθ 从 θᵀx 换成了 σ(θᵀx)。讲义特意问：巧合吗？");
  S(0,function(){clearScene();setBig(null);setCap("和 LMS 同形——不是巧合。换成本课写法。");boxNode(120,200,470,90,"线性回归 (y−θᵀx)·x","b");boxNode(120,330,470,90,"逻辑回归 (y−σ(θᵀx))·x","g");note("形状完全相同 · 只有 h 变了",760,270,"y","start");note("→ 本课：(p−y)x，最小化、梯度下降",760,375,"","start");},"<b>结论</b>：线性回归和逻辑回归的梯度<b>形状完全相同</b>——都是「(真实−预测)×特征」，只有预测 h 不同（θᵀx vs σ(θᵀx)）。<b>为什么不是巧合</b>：两者都是<em>指数族的广义线性模型（GLM）</em>（下一节）。<b>换算</b>：本课写成 ∂J/∂w=(1/N)Σ(pᵢ−yᵢ)xᵢ，差个负号是因为本课最小化、做梯度<em>下降</em>——手算用这一版。");
  SUM(0,8,{h:"★ 逐行推逻辑回归梯度 (y−h)x",k:"y∈{0,1}→sigmoid h=g(θᵀx)=P(y=1)→P(y=0)=1−h→压成 h^y(1−h)^(1−y)→对数似然 ℓ=Σ[y log h+(1−y)log(1−h)]（=交叉熵）→用 g′=g(1−g) 求导→<b>(y−h)x</b>，和 LMS 同形。",m:"对数似然=你课程二元交叉熵的相反数（max ℓ=min 平均 BCE）。g′=g(1−g) 是约掉复杂项的关键。同形因两者都是指数族 GLM。",w:"<s>逻辑回归 y∈{0,1}</s>（非 ±1）。<s>符号换算</s>：CS229 max ℓ 梯度上升 +；本课 min BCE 梯度下降 −、除 N。手算用本课 (p−y)x。",e:"<b>T3 Tutorial Q2</b>：∂J/∂w=(1/N)Σ(pᵢ−yᵢ)xᵢ。会一步梯度更新并验证 BCE 下降。"});
  QUIZ(0,8,{t:"逻辑回归梯度 (y−h)x 和线性回归 LMS 的 (y−h)x 形状相同，讲义说这是？",o:["纯属巧合","<b>不是巧合——两者都是指数族的广义线性模型（GLM）</b>","因为都用 sigmoid","因为都是分类"],a:1,w:"讲义特意点出<b>不是巧合</b>：正态（线性回归）和伯努利（逻辑回归）都属<em>指数族</em>，都是<b>广义线性模型 GLM</b> 的实例，所有 GLM 的极大似然梯度都是「(真实−预测)×特征」。区别只在预测 h 用什么函数（恒等 vs sigmoid）。"});
});
KP("9 · ★ GLM：为什么两者同形（简）",function(){
  S(0,function(){clearScene();setBig(null);setCap("指数族：正态和伯努利都是它的成员。");setEq("$$p(y;\\eta)=b(y)\\exp\\big(\\eta^{\\top}T(y)-a(\\eta)\\big)$$","top");},"<b>符号</b>：讲义最后给统一——<b>指数族</b> p(y;η)=b(y)exp(ηᵀT(y)−a(η))，η 叫<b>自然参数</b>。<b>关键事实</b>：<em>正态分布</em>（线性回归的噪声）和<em>伯努利分布</em>（逻辑回归的标签）<b>都是指数族成员</b>。<b>直觉</b>：一个大家庭，换 η 就换出不同的成员。");
  S(0,function(){clearScene();setBig(null);setCap("把伯努利写成指数族，sigmoid 自己冒出来。");setEq("$$\\eta=\\log\\frac{\\phi}{1-\\phi}\\;\\Rightarrow\\;\\phi=\\frac{1}{1+e^{-\\eta}}$$","top");},"<b>符号</b>：把伯努利分布套进指数族形式，自然参数 η=log(φ/(1−φ))。<b>反解</b> φ 关于 η，得到 <b>φ=1/(1+e⁻η)——正是 sigmoid！</b><b>直觉/为什么重要</b>：<s>逻辑函数不是硬凑的</s>——一旦假设 y 是伯努利，sigmoid 是 GLM 的<em>必然产物</em>。这回答了「逻辑函数从哪来」。");
  S(0,function(){clearScene();setBig(null);setCap("三条 GLM 假设 → 通用的「误差×特征」梯度。");boxNode(200,180,880,60,"① y|x 服从某指数族分布（自然参数 η）","v");boxNode(200,262,880,60,"② 预测 h(x)=E[y|x]","b");boxNode(200,344,880,60,"③ η 与输入线性相关：η=θᵀx","g");note("正态→线性回归 · 伯努利→逻辑回归 · 梯度都是 (y−h)x",640,460,"y");},"<b>符号</b>：GLM 靠三条假设——① y|x 服从某<b>指数族</b>分布；② 预测 <b>h(x)=E[y|x]</b>（期望）；③ <b>η=θᵀx</b>（自然参数与输入线性）。<b>直觉</b>：选<b>正态</b>就得到线性回归、选<b>伯努利</b>就得到逻辑回归；而因为都是指数族，它们的极大似然梯度都是 <b>(y−h(x))x</b>——<em>这就是前面两处「误差×特征」一模一样的根本原因</em>。<s>softmax（多分类）</s>是选多项分布的又一个 GLM，不在你考纲。");
  SUM(0,9,{h:"★ GLM：一个骨架统一回归与分类",k:"指数族 p(y;η)=b(y)exp(ηᵀT(y)−a(η))；正态、伯努利都是成员。把伯努利写成指数族 ⟹ φ=1/(1+e⁻η)=<b>sigmoid</b>。三假设：y|x 指数族、h=E[y|x]、<b>η=θᵀx</b>。",m:"正态→线性回归、伯努利→逻辑回归；都是指数族 ⟹ MLE 梯度都是 <b>(y−h)x</b>——两者同形的根因。sigmoid 是伯努利 GLM 的必然产物。",w:"<s>sigmoid 不是硬凑</s>：假设 y 伯努利后它自动冒出来。softmax 是多项分布的 GLM（多分类），不在 M1 考纲。",e:"不直接考 GLM，但它把 T2（正态→最小二乘）和 T3（伯努利→交叉熵）串成同一套推导，帮你把两块公式当一个记。"});
  QUIZ(0,9,{t:"按 GLM，假设「y|x 服从伯努利分布」会导出哪个模型？sigmoid 从哪来？",o:["线性回归；sigmoid 硬凑","<b>逻辑回归；把伯努利写成指数族、反解自然参数就得到 φ=1/(1+e⁻η)=sigmoid</b>","SVM；来自核","softmax；无关"],a:1,w:"GLM：<b>y 的分布决定模型</b>。选正态→线性回归；选<em>伯努利</em>→<b>逻辑回归</b>。sigmoid <s>不是硬凑</s>：把伯努利写成指数族时 η=log(φ/(1−φ))，反解出 <b>φ=1/(1+e⁻η)</b>=sigmoid。所以假设 y 伯努利后逻辑函数是必然产物。这也解释了两者梯度为何同形（都是指数族 GLM）。"});
});

KP("1 · 特征映射 φ：把非线性变线性",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$\\phi(x)=[\\,1,\\;x,\\;x^2,\\;x^3\\,]^{\\top},\\qquad \\theta_3x^3+\\theta_2x^2+\\theta_1x+\\theta_0=\\theta^{\\top}\\phi(x)$$","top");setCap("<b>三次函数 = 在 φ(x) 上的线性函数。</b>");},"核方法的起点：<b>把「属性」x 映射成「特征」φ(x)</b>。例子——想拟合三次曲线 θ₃x³+θ₂x²+θ₁x+θ₀，它<em>不是 x 的线性函数</em>，但如果定义 φ(x)=[1, x, x², x³]ᵀ，它就是 <b>θᵀφ(x)</b>——在<i>新特征空间</i>里是线性的！讲义把原始输入叫<b>属性（attributes）</b>，映射后的量叫<b>特征（features）</b>，映射函数 φ 叫<b>特征映射（feature map）</b>。核心思想：<b>在 φ 空间里做线性模型，映射回原空间就是非线性</b>。SVM、核回归全靠这一步。");
  SUM(0,1,{h:"特征映射 φ：非线性 → 高维线性（notes3 §1.1）",k:"把属性 x 映射成特征 <b>φ(x)</b>（如 [1,x,x²,x³]）。三次函数就成了 <b>θᵀφ(x)</b>——在新特征空间里是<em>线性</em>的。在 φ 空间做线性、回原空间即非线性。",m:"术语：原始输入=属性，映射后=特征，φ=特征映射。这是核方法/SVM 处理非线性的通用手段。",w:"<s>φ 空间线性 ≠ 原空间线性</s>：原空间里边界是曲线。加高次项/交叉项就能拟合弯的边界。",e:"T4 Tutorial Q3 就从 φ(x₁,x₂)=(x₁²,√2x₁x₂,x₂²) 起步。理解「φ 空间线性=原空间非线性」是核方法的入口。"});
  QUIZ(0,1,{t:"把 x 映射成 φ(x)=[1,x,x²,x³] 后，三次多项式 θ₃x³+…+θ₀ 变成什么？",o:["还是非线性的","<b>θᵀφ(x)——在 φ 特征空间里是线性函数</b>","一个常数","无法表示"],a:1,w:"三次多项式关于 <b>x</b> 是非线性的，但关于<b>特征向量 φ(x)=[1,x,x²,x³]</b> 是<em>线性</em>的：θ₃x³+θ₂x²+θ₁x+θ₀=θᵀφ(x)。这就是特征映射的威力——<b>在高维特征空间用线性模型，映射回原空间得到非线性</b>。代价是维度会爆炸（下一个知识点），核技巧正是来解决这个的。"});
});
KP("2 · 维度爆炸：直接算 φ 太贵",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$x\\in\\mathbb R^{d}\\;\\xrightarrow{\\text{所有}\\le 3\\text{次单项式}}\\;\\phi(x)\\in\\mathbb R^{O(d^3)}$$","top");setBig(null);note("d=1000 → φ 约 10⁹ 维 → 每次更新比原来慢 10⁶ 倍",640,320,"r");note("θ 本身就是 O(d³) 维，存都存不下",640,390,"");},"特征映射的想法很好，但<b>直接实现会维度爆炸</b>。若 x∈ℝ^d，把 φ(x) 取成「所有次数 ≤3 的单项式」（1, xᵢ, xᵢxⱼ, xᵢxⱼxₖ…），维度是 <b>O(d³)</b>。d=1000 时 φ 有约 <b>10⁹ 维</b>——每次梯度更新要算并存一个十亿维向量，比普通最小二乘慢 <b>10⁶ 倍</b>，θ 本身都存不下。看起来这种 d³ 的开销<em>不可避免</em>，因为 θ 就是 O(d³) 维。<s>但下一步会看到：其实根本不用显式构造 φ、也不用存 θ</s>——这就是核技巧。");
  SUM(0,2,{h:"维度爆炸：φ 的维数 O(d³)（notes3 §1.3）",k:"把 φ 取成「所有 ≤3 次单项式」，维度是 <b>O(d³)</b>。d=1000 → 约 10⁹ 维，每步比 OLS 慢 10⁶ 倍，θ 都存不下。",m:"看似 d³ 开销不可避免（θ 本身 O(d³) 维）。但核技巧让我们<em>既不显式构造 φ、也不存 θ</em>，把开销降回来。",w:"<s>「升维有用」不等于「升维可行」</s>：显式做 φ 会爆炸。这正是核技巧存在的动机（下一 KP）。",e:"T4 Tutorial Q3 第 3 问「核技巧避免了什么」的背景就是这个爆炸。理解爆炸，才懂核技巧省的是「构造 φ」。"});
  QUIZ(0,2,{t:"把 x∈ℝ^d 映射成「所有 ≤3 次单项式」时，φ(x) 的维数大约是？",o:["O(d)","O(d²)","<b>O(d³)——d=1000 就约 10⁹ 维</b>","O(1)"],a:2,w:"次数 ≤3 的单项式包括 1、xᵢ（d 个）、xᵢxⱼ（约 d² 个）、xᵢxⱼxₖ（约 d³ 个），总数由最高次项主导，是 <b>O(d³)</b>。d=1000 → 约 10⁹ 维，显式构造和存储都不可行。<s>这不是因为算法笨</s>，而是特征空间本身巨大。核技巧的意义就是：<em>用得上这个空间，却从不真的构造它</em>。"});
});
KP("3 · ★ 核技巧：θ 是 φ 的线性组合，只需内积",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$\\theta=\\sum_{i=1}^{n}\\beta_i\\,\\phi(x^{(i)})\\;\\Rightarrow\\;\\beta_i:=\\beta_i+\\alpha\\Big(y^{(i)}-\\sum_j\\beta_j\\langle\\phi(x^{(j)}),\\phi(x^{(i)})\\rangle\\Big)$$","top");setCap("<b>关键观察：θ 永远是训练样本 φ 的线性组合</b>，于是只需内积。");},"讲义的关键观察：如果从 θ=0 开始跑梯度下降，<b>θ 在任何时刻都是训练样本特征的线性组合</b> θ=Σβᵢφ(x⁽ⁱ⁾)（归纳可证：每步加的都是 φ(x⁽ⁱ⁾) 的倍数）。于是不去更新 O(d³) 维的 θ，而<em>只更新 n 个系数 βᵢ</em>！代入更新式，φ 只以<b>两两内积 ⟨φ(x⁽ʲ⁾),φ(x⁽ⁱ⁾)⟩ 的形式出现</b>，从不单独出现。预测也一样：θᵀφ(x)=Σβᵢ⟨φ(x⁽ⁱ⁾),φ(x)⟩。<s>这是核技巧的逻辑起点</s>——既然算法只需要这个内积的<b>数值</b>，那我们根本不必知道 φ 长什么样。");
  SUM(0,3,{h:"★ 核技巧的起点：只需内积（notes3 §1.3）",k:"从 θ=0 出发，<b>θ=Σβᵢφ(x⁽ⁱ⁾)</b>（永远是样本 φ 的线性组合）。于是只更新 n 个系数 βᵢ，而 φ <em>只以两两内积 ⟨φ(x⁽ʲ⁾),φ(x⁽ⁱ⁾)⟩ 出现</em>。",m:"训练和预测（θᵀφ(x)=Σβᵢ⟨φ(x⁽ⁱ⁾),φ(x)⟩）都只用内积。既然只需要内积的<b>数值</b>，就不必知道 φ 本身——这是核化的资格。",w:"<s>参数从 θ（O(d³) 维）换成 β（n 维）</s>：样本少特征多时大赚。前提是初始化 θ=0（否则 θ 不一定是 φ 的组合）。",e:"这是「SVM 只通过内积接触数据」的通用版。理解它，才懂为什么能把内积换成核 K（下一 KP）。"});
  QUIZ(0,3,{t:"为什么梯度下降中「θ 始终是训练样本 φ(x⁽ⁱ⁾) 的线性组合」这个观察如此关键？",o:["因为它让 θ 变小","<b>因为于是 φ 只以两两内积出现，只要能算内积就不必知道 φ 本身——为核技巧打开大门</b>","因为它保证凸性","因为它减少样本数"],a:1,w:"若 θ=Σβᵢφ(x⁽ⁱ⁾)，代入更新和预测后，<b>φ 只以内积 ⟨φ(·),φ(·)⟩ 出现</b>，从不单独出现。既然算法只需要这个内积的<em>数值</em>，我们就可以<s>绕过 φ</s>、用一个函数直接算出这个数——这就是核技巧的逻辑起点。参数也从 O(d³) 维的 θ 变成 n 维的 β。"});
});
KP("4 · ★ 核函数 K(x,z)=⟨φ(x),φ(z)⟩",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$K(x,z)\\triangleq\\langle\\phi(x),\\phi(z)\\rangle,\\qquad K(x,z)=(x^{\\top}z)^2\\;\\Leftrightarrow\\;\\phi=[x_ix_j]$$","top");setCap("<b>定义核 = φ 的内积</b>；(xᵀz)² 对应所有二次项 φ，但算它只要 O(d)。");},"定义<b>核函数 K(x,z)≜⟨φ(x),φ(z)⟩</b>——φ 的内积。神奇的例子：取 <b>K(x,z)=(xᵀz)²</b>，展开它 = Σᵢⱼ(xᵢxⱼ)(zᵢzⱼ)，正好等于 φ(x)·φ(z)，其中 φ 是<em>所有二次交叉项</em> [xᵢxⱼ]（d² 维）。<b>左边</b>：先造两个 d² 维向量再内积，O(d²)；<b>右边</b>：算一次原始内积 xᵀz 再平方，<b>只要 O(d)</b>。<s>结果完全相同，代价天差地别</s>。更一般地 <b>(xᵀz+c)^k</b> 对应所有 ≤k 次单项式的 φ（O(d^k) 维），但算它仍只要 O(d)。这就是核技巧：<b>用 K 代替显式 φ</b>。");
  SUM(0,4,{h:"★ 核函数 K(x,z)=⟨φ(x),φ(z)⟩（notes3 §1.4）",k:"定义<b>核 K(x,z)=⟨φ(x),φ(z)⟩</b>。例子 <b>K=(xᵀz)²</b> 对应 φ=所有二次项 [xᵢxⱼ]（d² 维），但<em>算 K 只要 O(d)</em>（先内积再平方）。",m:"一般 <b>(xᵀz+c)^k</b> 对应所有 ≤k 次单项式（O(d^k) 维特征），c 调一次项与高次项的权重；算它始终 O(d)。用 K 代替显式 φ = 核技巧。",w:"<s>核技巧省的是「构造 φ」不是「计算量随样本」</s>（下面 Mercer 后再说）。(xᵀz)² 与 (xᵀz+c)^k 的 φ 不同——后者多了低次项。",e:"T4 Tutorial Q3 第 2 问：展开 φ(x)·φ(y) 证明 =(xᵀy)²。会算 (xᵀz)² 展开、说明它 = 二次特征的内积、代价 O(d)。"});
  QUIZ(0,4,{t:"核 K(x,z)=(xᵀz)² 对应把 x 映到「所有二次项」φ。直接算 K 的代价是？",o:["O(d²)，要先构造 φ","<b>O(d)——先算原始内积 xᵀz（O(d)）再平方，从不构造 φ</b>","O(d³)","和构造 φ 一样贵"],a:1,w:"<b>K(x,z)=(xᵀz)²</b>：先算原始内积 xᵀz（O(d)），再平方（O(1)），总共 <b>O(d)</b>。而它对应的 φ 是所有二次交叉项 [xᵢxⱼ]（d² 维），显式构造+内积要 O(d²)。<s>核技巧让我们用得上 d² 维空间，却只花 O(d)</s>、从不写下 φ。高斯核甚至对应无穷维 φ。"});
});
KP("5 · 多项式核与高斯核（RBF）",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$K_{\\text{poly}}(x,z)=(x^{\\top}z+c)^k,\\qquad K_{\\text{RBF}}(x,z)=\\exp\\!\\Big(-\\frac{\\lVert x-z\\rVert^2}{2\\sigma^2}\\Big)$$","top");var P={l:340,r:960,t:250,b:440};var pts=[];for(var k=0;k<=60;k++){var dd=(k/60-0.5)*8;pts.push([340+(dd+4)/8*620,440-280*Math.exp(-dd*dd/2)]);}curve(pts,"fit g");note("高斯核：钟形，两点越近 K 越接近 1",640,470,"g");},"两个最常用的核。<b>多项式核 (xᵀz+c)^k</b>：对应所有 ≤k 次单项式的特征空间（O(d^k) 维），c 控制低次项权重。<b>高斯核 / RBF K(x,z)=exp(−‖x−z‖²/2σ²)</b>：这个对应的 φ 是<b>无穷维</b>的——却依然能算！读它最直观的角度是<b>相似度</b>：两点越近 K 越接近 1，越远越接近 0（钟形）。sklearn 里的 <b>gamma=1/(2σ²)</b>：γ 大 ⟺ σ 小 ⟺ 衰减快 ⟺ 每个点影响范围<em>局部</em>（易过拟合）；γ 小 ⟺ 影响范围广、边界平滑（易欠拟合）。<s>这正是你 T4 Practical 要调的 γ</s>。");
  SUM(0,5,{h:"多项式核与高斯核 RBF（notes3 §1.4）",k:"<b>多项式核 (xᵀz+c)^k</b>→所有 ≤k 次单项式（O(d^k) 维）。<b>RBF K=exp(−‖x−z‖²/2σ²)</b>→<em>无穷维</em>特征、却可算；读成相似度（近→1、远→0）。",m:"RBF 的 <b>gamma=1/(2σ²)</b>：γ 大→影响局部→边界细碎→过拟合；γ 小→影响广→边界平滑→欠拟合。这是 T4 Practical 调的超参。",w:"<s>γ 和 C 是两个不同旋钮</s>：γ 管「每点影响范围」，C 管「违反的惩罚」。都调大→又窄又碎→过拟合组合。",e:"T4 Practical Q4 要搜 C×γ 网格。会解释 γ 大/小各造成什么、RBF 对应无穷维 φ、核=相似度。"});
  QUIZ(0,5,{t:"RBF（高斯）核的 gamma 调大，决策边界会怎样？",o:["变平滑，趋向欠拟合","<b>每个点影响范围变局部、边界更细碎，趋向过拟合</b>","等价于增大 C","与边界无关"],a:1,w:"gamma=1/(2σ²) 越大，exp(−γ‖x−z‖²) 衰减越快，<b>每个训练点的影响半径越小</b>，边界被雕成贴着数据点的小岛——训练好、泛化差，即<em>过拟合</em>。γ 小则影响广、边界平滑、可能欠拟合。<s>别把 γ 和 C 混</s>：C 管违反间隔的惩罚，γ 管影响范围；两者都调大是典型过拟合组合。"});
});
KP("6 · ★ Mercer 定理：有效核 ⟺ 核矩阵半正定",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$K\\text{ 是有效核}\\;\\Longleftrightarrow\\;\\forall\\{x^{(i)}\\},\\ \\text{核矩阵 }K_{ij}=K(x^{(i)},x^{(j)})\\text{ 对称半正定}$$","top");setCap("<b>不必写出 φ</b>：只要核矩阵对称 PSD，就存在对应的 φ。");},"既然算法全程只用 K、不碰 φ，能不能<b>直接设计一个 K</b>、不管它对应什么 φ？问题是：什么样的函数 K 才「合法」（真的对应某个 φ）？<b>Mercer 定理</b>给出充要条件：<b>K 是有效核 ⟺ 对任意有限点集 {x⁽ⁱ⁾}，核矩阵 K_{ij}=K(x⁽ⁱ⁾,x⁽ʲ⁾) 都对称、半正定（PSD）</b>。<b>必要性</b>好证：若 K=⟨φ,φ⟩，则 K 对称（内积对称），且对任意 z，zᵀKz=Σₖ(Σᵢzᵢφₖ(x⁽ⁱ⁾))²≥0（PSD）。Mercer 说这也充分。<b>意义</b>：验一个候选核只需检查<em>核矩阵对称 PSD</em>，<s>不必费力构造 φ</s>——把「选特征映射」换成了「选核函数」。");
  SUM(0,6,{h:"★ Mercer 定理：有效核 ⟺ 核矩阵对称 PSD（notes3 §1.4）",k:"<b>K 是有效核（存在对应 φ）⟺ 对任意有限点集，核矩阵 K_{ij}=K(x⁽ⁱ⁾,x⁽ʲ⁾) 对称且半正定（PSD）</b>。于是验核只需查核矩阵，不必写出 φ。",m:"必要性：K=⟨φ,φ⟩⟹对称、且 zᵀKz=Σₖ(Σᵢzᵢφₖ)²≥0。Mercer 证它也充分。把「选特征映射 φ」的接口换成「选核函数 K」。",w:"<s>不是随便一个二元函数都是核</s>：必须核矩阵 PSD。也别把核矩阵 K（n×n）和核函数 K(x,z) 混——记号重载但含义相关。",e:"T4 可能考「什么是有效核 / 为什么核矩阵要半正定」。答：Mercer——有效核 ⟺ 任意点集的核矩阵对称 PSD。"});
  QUIZ(0,6,{t:"按 Mercer 定理，一个函数 K(x,z) 是「有效核」（对应某个特征映射 φ）的充要条件是？",o:["K 处处为正","<b>对任意有限点集，核矩阵 K_{ij}=K(x⁽ⁱ⁾,x⁽ʲ⁾) 都对称且半正定（PSD）</b>","K 可导","K 有界"],a:1,w:"<b>Mercer 定理</b>：K 是有效（Mercer）核 ⟺ 对<em>任意</em>有限点集 {x⁽ⁱ⁾}，其核矩阵（第 (i,j) 元 = K(x⁽ⁱ⁾,x⁽ʲ⁾)）<b>对称且半正定</b>。这样就不必构造 φ，只需验核矩阵 PSD 即可确认 K 合法。<s>正/可导/有界都不是条件</s>。这把「选 φ」变成了更方便的「选 K」。"});
});
KP("7 · ★ 函数间隔与几何间隔",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$\\hat\\gamma^{(i)}=y^{(i)}(w^{\\top}x^{(i)}+b),\\qquad \\gamma^{(i)}=\\frac{y^{(i)}(w^{\\top}x^{(i)}+b)}{\\lVert w\\rVert}$$","top");setCap("<b>函数间隔</b>（可被缩放放大）÷‖w‖ = <b>几何间隔</b>（真实距离）。<span class='sub'>SVM 用 y∈{−1,+1}</span>");},"转到 SVM。讲义换记号：<b>y∈{−1,+1}</b>，分类器 f(x)=g(wᵀx+b)（g 取符号），截距 b 单独写。定义两种间隔。<b>函数间隔</b> γ̂⁽ⁱ⁾=y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b)：符号表示分对（>0）还是分错，大小表示置信度。<s>缺陷</s>：把 (w,b) 同乘 2，函数间隔翻倍但分类器不变——<b>可以被随意放大</b>。<b>几何间隔</b> γ⁽ⁱ⁾=y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b)/‖w‖：除以 ‖w‖ 之后，<em>就是点到超平面的真实欧氏距离</em>（带标签调整），且<b>对缩放不变</b>。w 垂直于决策边界（几何推导用到）。全集的间隔 = 所有样本里<em>最小</em>的那个。");
  SUM(0,7,{h:"★ 函数间隔 vs 几何间隔（notes3 §4）",k:"<b>函数间隔 γ̂=y(wᵀx+b)</b>：符号=对错、大小=置信；但可被缩放 (w,b)→(2w,2b) 随意放大。<b>几何间隔 γ=y(wᵀx+b)/‖w‖</b>：真实欧氏距离、<em>对缩放不变</em>。",m:"除以 ‖w‖ 消除缩放自由度。w⊥决策边界。若 ‖w‖=1 则函数间隔=几何间隔。全集间隔=所有样本的最小几何间隔。",w:"<s>函数间隔单看没意义</s>（能被放大）。<s>SVM 用 y∈{−1,+1}</s>（不是 0/1）。判对错看 y·f 的符号，不看距离大小。",e:"T4 Tutorial Q1：算 f、带符号距离 f/‖w‖、y·f 并判定。理解「函数间隔可缩放、几何间隔不变」为下一步规范化铺路。"});
  QUIZ(0,7,{t:"把 (w,b) 同时乘以 2，函数间隔 y(wᵀx+b) 和几何间隔 y(wᵀx+b)/‖w‖ 分别怎样？",o:["都翻倍","<b>函数间隔翻倍；几何间隔不变（分子分母同乘 2，比值不变）</b>","都不变","几何间隔翻倍、函数间隔不变"],a:1,w:"<b>函数间隔</b> y(wᵀx+b) 里 (w,b)→(2w,2b) 直接<em>翻倍</em>——所以它能被随意放大、单看无意义。<b>几何间隔</b> y(wᵀx+b)/‖w‖：分子翻倍、分母 ‖w‖ 也翻倍，<b>比值不变</b>——它是真实的欧氏距离，对缩放不变。正因为函数间隔可缩放，SVM 才能规范化（令最近点函数间隔=1）来消掉这个自由度。"});
});
KP("8 · ★★ 最优间隔分类器 min ½‖w‖²",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$\\max_{\\gamma,w,b}\\gamma\\ \\text{s.t.}\\ y^{(i)}(w^{\\top}x^{(i)}+b)\\ge\\gamma,\\ \\lVert w\\rVert=1$$","top");setCap("<b>目标：最大化间隔</b>。但 ‖w‖=1 是非凸约束，难解。");},"SVM 的目标：<b>找几何间隔最大的分界</b>——离两类都最远，对扰动最稳。直接写成 max γ s.t. 每个样本几何间隔 ≥γ、且 ‖w‖=1。但 <b>‖w‖=1 是非凸约束</b>，塞不进标准优化器。讲义用<b>规范化技巧</b>化解：既然函数间隔可以随意缩放，就<em>规定最近点的函数间隔 = 1</em>（γ̂=1）。于是约束变成 y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b)≥1，而最大化几何间隔 1/‖w‖ ⟺ <b>最小化 ½‖w‖²</b>。");
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$\\min_{w,b}\\tfrac12\\lVert w\\rVert^2\\quad \\text{s.t.}\\quad y^{(i)}(w^{\\top}x^{(i)}+b)\\ge 1$$","top");note("单侧间隔 = 1/‖w‖ · 全宽 = 2/‖w‖",640,320,"y");note("凸二次目标 + 线性约束 → QP，可高效求解",640,390,"g");},"这就是<b>最优间隔分类器</b>的标准形式：<b>min ½‖w‖² s.t. y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b)≥1</b>。它是<b>凸二次目标 + 线性约束</b>，可以用现成的二次规划（QP）高效求解。规范化的直接后果、也是你 <b>T4 必背的两个式子</b>：支持面上 y·f=1 代入几何间隔得<b>单侧间隔 = 1/‖w‖</b>，上下各一条所以<b>全宽 = 2/‖w‖</b>。<s>常见失分：把这两个记反</s>——问 margin width 答 <b>2/‖w‖</b>。最大化 2/‖w‖ ⟺ 最小化 ½‖w‖²，这就是目标函数长这样的原因。");
  SUM(0,8,{h:"★★ 最优间隔分类器（notes3 §5）",k:"规范化（令最近点函数间隔=1）后，最大间隔问题变成 <b>min ½‖w‖² s.t. y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b)≥1</b>——凸二次目标+线性约束，可用 QP 高效求解。",m:"最大化几何间隔 1/‖w‖ ⟺ 最小化 ½‖w‖²。必背：<b>单侧间隔=1/‖w‖，全宽=2/‖w‖</b>（支持面 y·f=1 代入几何间隔）。",w:"<s>‖w‖=1 是非凸约束</s>，所以改用规范化。<s>单侧/全宽别记反</s>：1 是一侧、2 是两侧；margin width=2/‖w‖。",e:"<b>T4 Tutorial Q2 原题</b>：w=(3,4)→‖w‖=5→单侧 1/5=0.2、全宽 2/5=0.4。会写 min ½‖w‖² 的约束优化形式。"});
  QUIZ(0,8,{t:"规范化下 SVM 的最优化目标是 min ½‖w‖²。若 w=(6,8)，间隔的<b>全宽</b>是？",o:["0.1","<b>0.2</b>","10","0.05"],a:1,w:"‖w‖=√(6²+8²)=√100=<b>10</b>。单侧间隔=1/‖w‖=<i>0.1</i>；<b>全宽=2/‖w‖=0.2</b>。<s>0.1 是单侧的陷阱答案</s>——问 width（宽度）是两侧之和。最大化 2/‖w‖ ⟺ 最小化 ½‖w‖²，这就是 SVM 目标函数的来历。"});
});
KP("9 · ★ 对偶、KKT 与支持向量",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$\\mathcal L(w,b,\\alpha)=\\tfrac12\\lVert w\\rVert^2-\\sum_i\\alpha_i\\big[y^{(i)}(w^{\\top}x^{(i)}+b)-1\\big]$$","top");setCap("<b>拉格朗日</b>：每个不等式约束配一个乘子 αᵢ≥0。");},"为把 SVM 核化，讲义转到<b>拉格朗日对偶</b>。给每个约束 y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b)≥1 配一个乘子 αᵢ≥0，写出拉格朗日 L=½‖w‖²−Σαᵢ[y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b)−1]。对 w、b 求偏导置零，解出一个关键结论：<b>w=Σαᵢy⁽ⁱ⁾x⁽ⁱ⁾</b>——<em>最优 w 是训练样本的线性组合</em>。因为 f、g 凸且约束线性可行，强对偶成立，最优解满足 <b>KKT 条件</b>，其中<b>对偶互补</b>：αᵢ·gᵢ(w)=0。");
  S(0,function(){clearScene();setBig(null);setCap(null);setEq("$$\\alpha_i>0\\;\\Rightarrow\\;y^{(i)}(w^{\\top}x^{(i)}+b)=1\\;(\\text{在支持面上})$$","top");note("只有支持向量 αᵢ>0；其余 αᵢ=0，删掉边界不变",640,300,"y");note("对偶问题只含内积 ⟨x⁽ⁱ⁾,x⁽ʲ⁾⟩ → 可换成核 K",640,370,"g");},"KKT 对偶互补 αᵢgᵢ=0 有个漂亮推论：<b>只有函数间隔恰好=1（落在支持面上）的点，αᵢ 才可能>0</b>；其余点 αᵢ=0。这些 αᵢ>0 的点就是 <b>支持向量</b>——<em>唯一决定边界的少数点</em>；删掉其它点边界不变，移动一个支持向量边界就动。而且对偶问题的目标<b>只依赖样本的两两内积 ⟨x⁽ⁱ⁾,x⁽ʲ⁾⟩</b>，预测 f(x)=Σαᵢy⁽ⁱ⁾⟨x⁽ⁱ⁾,x⟩+b 也只用内积——<s>于是可以直接把内积换成核 K</s>，SVM 就能在无穷维特征空间里高效工作。软间隔（有噪声/不可分时）加松弛 ξ，约束变 0≤αᵢ≤C，用 C 平衡间隔宽度与违反。");
  SUM(0,9,{h:"★ 对偶、KKT 与支持向量（notes3 §6–7）",k:"拉格朗日 L=½‖w‖²−Σαᵢ[y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b)−1]。∂L/∂w=0 ⟹ <b>w=Σαᵢy⁽ⁱ⁾x⁽ⁱ⁾</b>。KKT 对偶互补 αᵢgᵢ=0 ⟹ 只有支持面上的点 <b>αᵢ>0（支持向量）</b>。",m:"支持向量=唯一决定边界的少数点（删其它点边界不变）。对偶目标与预测<b>只用内积 ⟨x⁽ⁱ⁾,x⁽ʲ⁾⟩</b> ⟹ 可换成核 K，SVM 进入无穷维。软间隔加 ξ、约束 0≤αᵢ≤C。",w:"<s>不是所有点都决定边界</s>：大多数 αᵢ=0。移动支持向量→边界动；移动远处点→边界不变。",e:"T4：支持向量（.n_support_）、w=Σαᵢy⁽ⁱ⁾x⁽ⁱ⁾、「只用内积⇒可核化」、0≤αᵢ≤C（软间隔 extension）。Workflow「移动支持向量边界才动」是原题。"});
  QUIZ(0,9,{t:"SVM 训练后，把一个<b>远离边界</b>、αᵢ=0 的点删掉重训，边界会怎样？",o:["明显改变","<b>几乎不变——它 αᵢ=0，对 w=Σαᵢy⁽ⁱ⁾x⁽ⁱ⁾ 没有贡献</b>","无法收敛","支持向量翻倍"],a:1,w:"因为 <b>w=Σαᵢy⁽ⁱ⁾x⁽ⁱ⁾</b>，αᵢ=0 的点对 w <em>没有贡献</em>，删掉它 w 一项没少、边界几乎不变。这就是 SVM 的<b>稀疏性</b>：只有支持向量（αᵢ>0、落在支持面上的少数点）决定边界。反过来<s>移动一个支持向量，边界就会跟着动</s>。KKT 对偶互补 αᵢgᵢ=0 是这一切的来源。"});
});

function b64utf8(b){return new TextDecoder().decode(Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);}));}

function makeCard(f){
  var isLink=!!f.href, isLec=!!f.lec, tagName=isLink?"a":(f.soon?"div":"button");
  var c=document.createElement(tagName);c.className="filmcard"+(f.soon?" soon":"")+(isLink?" link":"");

  var badge=f.soon?'<span class="fsoon">即将上线</span>':(isLink?'<span class="fsoon">新标签 ↗</span>':'');
  c.innerHTML='<span class="ftag">'+f.tag+'</span><span class="ftitle">'+f.title+'</span>'
    +'<span class="fsub">'+f.sub+'</span>'+badge;
  if(isLink){c.href=f.href;c.target="_blank";c.rel="noopener";}
  else if(isLec)c.addEventListener("click",function(){window.__openLecture(f.lec);});
