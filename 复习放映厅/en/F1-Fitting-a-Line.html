<!--
  ═══════════════════════════════════════════════════════════════════════════
   Reusable "Projector" teaching template  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  A reusable frame for turning any topic into a shot-by-shot animated lesson.
  Everything below the content script -- projector loop, caption layer, summary
  card, mandatory quiz, SVG drawing toolbox, caption-collision handling -- is
  already built. You only ever edit one place:

     the LAST <script> in the file, between the "content starts / ends" markers

  ── How to use it ─────────────────────────────────────────────────────────
  1. Edit CFG: title, subtitle, optional video link.
  2. Build each concept out of four calls, always in this order:
        KP("concept name", function(){
          S(seconds, sceneFn, "narration paragraph (optional, toggled with N)");
          SUM(seconds, conceptNo, {h:heading, k:result, m:mechanism,
                                   w:misreading, e:relevance to assessment});
          QUIZ(seconds, conceptNo, {t:question, o:[options...], a:correctIndex,
                                    w:explanation});
        });
     A concept may have many S() shots; it ends with exactly one SUM and one QUIZ.
  3. Drawing toolbox available inside a scene function:
        clearScene()                     clear the canvas
        setTitle(eyebrow, h1, sub)       title card
        setBig(big, small)               centred display text (a number, a verdict)
        setCap(html)                     one line at the top (<b><i><em><s> allowed)
        setEq("$$...$$", "top")          MathJax formula ("top" = align to top)
        flip("...<span data-id=x>..")    term-level morph animation between formulas
        T(id, text, "hl/res/ded")        a token for flip() to track
        note(text, x, y, "g/y/b/r/v", anchor)   label on the canvas
        dots([[x,y]...], "a/b/c", r)     scatter points
        curve(points, "fit/fit g/...")   polyline or curve (draws itself on)
        boxNode(x, y, w, h, label, cls)  a labelled box
        link(x1, y1, x2, y2)             a connector
        matrix({rows,cols,cw,ch,x,y,cell,dim,hl,label,labelCls})  table or matrix
        The canvas is 1280x720 (16:9), origin at the top left.
        Layout rule: keep every drawn element within y = 90..470. Below that is
        where the caption band sits, and a long narration grows upward into it.
  4. Colour semantics (keep them consistent -- learners come to rely on them):
        blue   = model / input        yellow = attention / conclusion
        green  = correct / answer     coral  = error / failure
        violet = emphasis
  5. Interaction (built in, nothing to change): SPACE or arrow-right advances,
     arrow-left goes back, number keys jump to a concept, N toggles the narration.
     A quiz must be answered before the film continues. Summary cards and quizzes
     deliberately carry no narration -- the card is the message.

  ── Three worked concepts are included below as a live example of the format.
     Replace that whole block with your own.
-->

<style>
:root{
  --bg:#080B11; --ink:#F0F4FA; --dim:#93A1B5; --dimmer:#3D4658; --edge:#1B2230;
  --blue:#54A9F7; --yellow:#FFD36E; --green:#5BDDA8; --coral:#FF7C87; --violet:#B48BF5;
  --sans:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
mjx-container{color:inherit!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);margin:auto}
svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}

#eqBox{font-size:clamp(16px,2.5vw,36px);text-align:center;line-height:1.5;max-width:92%;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
#eqBox.off{opacity:0;transform:translateY(13px) scale(.97)}
#eqBox.top{align-self:flex-start;margin-top:4.5vh}

#big{font-family:var(--mono);font-size:clamp(30px,5.6vw,82px);font-weight:500;letter-spacing:-.03em;
  color:var(--yellow);text-shadow:0 0 44px rgba(255,211,110,.3);text-align:center;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
#big.off{opacity:0;transform:scale(.86)}
/* lifted out of the caption band: the layer centres it, 9% puts it in the upper middle */
#big{margin-bottom:9%}
#big small{display:block;font-family:var(--sans);font-size:.22em;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);text-shadow:none;margin-top:.55em;font-weight:400}

/* caption band — pinned into the lower third, clears the strip, scrolls if long */
#capL{align-items:flex-end;pointer-events:none}
#capL::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46vh;
  background:linear-gradient(to top,var(--bg) 30%,rgba(8,11,17,.72) 62%,transparent);pointer-events:none}
#capWrap{max-width:min(84ch,94%);width:100%;max-height:34%;overflow-y:auto;margin-bottom:44px;
  display:flex;flex-direction:column;align-items:center;pointer-events:auto;position:relative;z-index:2}
#cap{text-align:center;font-size:clamp(13.5px,1.56vw,22px);font-weight:400;line-height:1.55;
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#cap.off{opacity:0;transform:translateY(12px)}
#cap b{font-weight:600;color:var(--yellow)}
#cap i{font-style:normal;color:var(--blue);font-weight:600}
#cap em{font-style:normal;color:var(--green);font-weight:600}
#cap s{text-decoration:none;color:var(--coral);font-weight:600}
#narr{margin:.7em 0 0;max-width:min(90ch,100%);text-align:left;
  font-size:clamp(12px,1.02vw,14.5px);font-weight:400;line-height:1.6;color:#D9E1ED;
  background:rgba(8,11,17,.86);border:1px solid rgba(46,58,82,.7);border-radius:12px;
  padding:12px 17px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:1}
#narr.off{opacity:0}
#narr[hidden]{display:none}
#narr b{color:#C6D2E2;font-weight:500}
#narr i{font-style:normal;color:var(--blue)}
#narr em{font-style:normal;color:var(--green)}
#narr s{text-decoration:none;color:var(--coral)}

#sum{max-width:min(1180px,94%);width:100%;max-height:96%;overflow:auto;
  background:rgba(17,23,33,.975);border:1px solid #303D52;border-radius:18px;padding:16px 26px 16px;
  box-shadow:0 28px 74px rgba(0,0,0,.62);
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#sum.off{opacity:0;transform:translateY(16px) scale(.985)}
#sum[hidden]{display:none}
#sum .sh{font-family:var(--mono);font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--green);margin:0 0 9px}
#sum h3{font-size:clamp(16.5px,1.7vw,22px);font-weight:800;margin:0 0 9px;letter-spacing:-.02em;line-height:1.25;color:#F6F9FE}
#sum .rows{display:flex;flex-direction:column;gap:6px}
#sum .row{border-left:3px solid #3C4A61;padding:7px 15px;background:rgba(255,255,255,.03);border-radius:0 12px 12px 0}
#sum .rk{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#9EABBE;margin:0 0 2px;line-height:1.3}
#sum .rv{font-size:clamp(13px,1.05vw,15.5px);font-weight:400;line-height:1.5;color:#E3EAF5;margin:0}
#sum .rv b{color:#FFFFFF;font-weight:700}
#sum .rv i{font-style:normal;color:#7CC0FF;font-weight:600}
#sum .rv em{font-style:normal;color:#6FE3B4;font-weight:600}
#sum .rv s{text-decoration:none;color:#FF97A0;font-weight:600}
#sum .row.k{border-left-color:var(--green)}
#sum .row.w{border-left-color:var(--coral)}
#sum .row.e{border-left-color:var(--yellow)}
#sum .row.m{border-left-color:var(--blue)}

#quizL{align-items:center;pointer-events:none}
#quiz{max-width:min(72ch,91%);pointer-events:auto;background:rgba(13,18,26,.95);
  border:1px solid #253044;border-radius:14px;padding:23px 27px;
  transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.3,1)}
#quiz.off{opacity:0;transform:translateY(14px);pointer-events:none}
#quiz[hidden]{display:none}
#quiz .qh{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--yellow);margin:0 0 10px}
#quiz .qq{font-size:clamp(13.5px,1.5vw,20px);font-weight:600;margin:0 0 15px;line-height:1.45}
#quiz .qo{display:flex;flex-direction:column;gap:7px}
#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;
  color:var(--ink);background:rgba(255,255,255,.045);border:1px solid #2A3546;
  border-radius:8px;padding:10px 15px;cursor:pointer;text-align:left;line-height:1.5;transition:background .2s,border-color .2s}
#quiz button:hover:not(.lk){border-color:var(--blue);background:rgba(84,169,247,.13)}
#quiz button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#quiz button.lk{cursor:default}
#quiz button.ok{border-color:var(--green);background:rgba(91,221,168,.15);color:var(--green)}
#quiz button.no{border-color:var(--coral);background:rgba(255,124,135,.13);color:var(--coral)}
#quiz button.off2{opacity:.32}
#quiz .why{margin:15px 0 0;font-size:clamp(11.5px,1.15vw,15px);font-weight:300;color:#93A1B5;line-height:1.7;border-top:1px solid #1E2634;padding-top:12px}
#quiz .why[hidden]{display:none}
#quiz .why b{color:#C6D2E2;font-weight:500}
#quiz .why em{font-style:normal;color:var(--green)}
#quiz .why s{text-decoration:none;color:var(--coral)}
#quiz .why i{font-style:normal;color:var(--blue)}

#titleL{flex-direction:column}
#titleL h1{font-size:clamp(25px,4.7vw,68px);font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.07;text-align:center;text-shadow:0 0 70px rgba(84,169,247,.25)}
#titleL p{font-size:clamp(12px,1.32vw,18px);color:var(--dim);font-weight:300;margin:2vh 0 0;letter-spacing:.05em;text-align:center;max-width:62ch}
#titleL .act{font-family:var(--mono);font-size:clamp(11px,1.18vw,15px);color:var(--blue);letter-spacing:.28em;margin:0 0 2.2vh;text-transform:uppercase}
#titleL .rule{width:60px;height:2px;background:var(--blue);margin:3.2vh auto 0;box-shadow:0 0 18px rgba(84,169,247,.7)}
.fade{transition:opacity .6s ease;display:flex;flex-direction:column;align-items:center}
.fade.off{opacity:0}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}
.tok.hl{color:var(--yellow);text-shadow:0 0 24px rgba(255,211,110,.5)}
.tok.res{color:var(--green);text-shadow:0 0 24px rgba(91,221,168,.45)}
.tok.ded{color:var(--coral);opacity:.5}

#strip{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:6}
#kps{display:flex;gap:3px;flex:1}
.kpbar{display:flex;gap:2px;flex:1;min-width:0;position:relative;cursor:pointer}
.pip{height:2px;flex:1;background:var(--edge);border-radius:2px;transition:background .4s}
.pip.seen{background:#2E3B50}
.pip.now{background:var(--blue);box-shadow:0 0 9px rgba(84,169,247,.85)}
.pip.sum{background:#1D3A30} .pip.sum.seen{background:#2C5C4A}
.pip.quiz{background:#3A3218} .pip.quiz.seen{background:#5C4E22}
.kplbl{position:absolute;top:-15px;left:0;right:6px;font-family:var(--mono);font-size:8px;color:var(--dimmer);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s,background .3s}
.kpbar:hover .kplbl{right:auto;overflow:visible;z-index:3;color:var(--ink);background:var(--bg);padding-right:6px}
.kpbar.active .kplbl{color:var(--blue)}
#hint{font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#tc{position:fixed;top:18px;left:20px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.1em;text-decoration:none;pointer-events:auto}
#tc:hover{color:var(--blue)}
#tc[hidden]{display:none}
#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}
.navbtn{position:fixed;top:0;bottom:44px;width:14%;background:none;border:0;cursor:pointer;opacity:0;z-index:4}
#prev{left:0} #next{right:0}
.navbtn:focus-visible{opacity:1;outline:2px solid var(--blue);outline-offset:-6px}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}
.pt{fill:var(--ink)}
.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}
.box.r{stroke:var(--coral)} .box.v{stroke:var(--violet)}
.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.link.r{stroke:var(--coral);stroke-width:2.2} .link.g{stroke:var(--green);stroke-width:2.2}
.link.y{stroke:var(--yellow);stroke-width:2.2} .link.b{stroke:var(--blue);stroke-width:2.2}
.link.d{stroke-dasharray:7 6}
.link.q{stroke:#4A5A75;stroke-width:2}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}
.cellbg.hl3{fill:#3A1A1E;stroke:var(--coral);stroke-width:1.6}
.celltx{font-family:var(--mono);font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.celltx.d{fill:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* fix: an .off panel must become invisible immediately */
#big.off,#cap.off,#eqBox.off,#titleBox.off,#sum.off,#quiz.off{visibility:hidden}
</style>

<div id="stage"><div id="frame">
  <svg id="scene" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="layer" id="titleL"><div class="fade" id="titleBox"></div></div>
  <div class="layer"><div id="eqBox" class="off"></div></div>
  <div class="layer"><div id="big" class="off"></div></div>
  <div class="layer" id="capL"><div id="capWrap">
    <div id="cap" class="off"></div><p id="narr" class="off"></p>
  </div></div>
  <div class="layer"><div id="sum" class="off" hidden></div></div>
  <div class="layer" id="quizL"><div id="quiz" class="off" hidden></div></div>
</div></div>

<button class="navbtn" id="prev" aria-label="Previous shot"></button>
<button class="navbtn" id="next" aria-label="Next shot"></button>
<a id="tc" href="#" target="_blank" rel="noopener">▶ 0:00</a>
<div id="kbd">SPACE advance · ← back · N narration</div>
<div id="strip"><div id="kps"></div><span id="hint"></span></div>

</script>
<script src="../lib/tex-svg.js"></script>
<script>window.MathJax&&MathJax.version||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"><\/script>');</script>
<script src="../lib/d3.min.js"></script>
<script>window.d3||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"><\/script>');</script>
<script>
/* ════════════════ ENGINE (no need to edit) ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2,cls){gS.append("path").attr("class","link "+(cls||"")).attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}
  var b={};eqBox.querySelectorAll("[data-id]").forEach(function(e){b[e.dataset.id]=e.getBoundingClientRect();});
  eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");
  if(!eqBox.animate)return;
  eqBox.querySelectorAll("[data-id]").forEach(function(e){
    var r=b[e.dataset.id];
    if(r){var a=e.getBoundingClientRect(),dx=r.left-a.left,dy=r.top-a.top;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5)
        e.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],
          {duration:780,easing:"cubic-bezier(.35,0,.15,1)"});}
    else e.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],
      {duration:520,delay:250,easing:"cubic-bezier(.3,.7,.3,1)",fill:"backwards"});});}
function T(id,t,c){return '<span class="tok '+(c||"")+'" data-id="'+id+'">'+t+'</span>';}
function setTitle(a,h,p){titleBox.classList.remove("off");
  titleBox.innerHTML='<p class="act">'+(a||"")+'</p><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'<div class="rule"></div>';}
function noTitle(){titleBox.classList.add("off");}
function setNarr(t){if(!t||!narrOn){narrEl.hidden=true;return;}
  narrEl.hidden=false;narrEl.innerHTML=t;narrEl.classList.remove("off");}
function clearSum(){sumEl.hidden=true;sumEl.classList.add("off");sumEl.innerHTML="";}
function showSum(kp,s){
  var ord=[["k","The result"],["m","Why it works"],["w","Common misreading"],["e","In your exam"]];
  sumEl.innerHTML='<p class="sh">Concept '+kp+' · Summary</p><h3>'+s.h+'</h3><div class="rows">'+
    ord.filter(function(o){return s[o[0]];}).map(function(o){
      return '<div class="row '+o[0]+'"><p class="rk">'+o[1]+'</p><p class="rv">'+s[o[0]]+'</p></div>';}).join("")+'</div>';
  sumEl.hidden=false;void sumEl.offsetWidth;sumEl.classList.remove("off");}
function clearQuiz(){quizEl.hidden=true;quizEl.classList.add("off");quizEl.innerHTML="";locked=false;}
function askQ(kp,q){
  if(FAST){clearQuiz();return;}
  locked=true;
  quizEl.innerHTML='<p class="qh">Concept '+kp+' · Check yourself</p><p class="qq">'+q.t+'</p><div class="qo">'+
    q.o.map(function(o,i){return '<button data-i="'+i+'">'+o+'</button>';}).join("")+
    '</div><p class="why" hidden>'+q.w+'</p>';
  quizEl.hidden=false;void quizEl.offsetWidth;quizEl.classList.remove("off");
  var bs=[].slice.call(quizEl.querySelectorAll("button"));
  bs.forEach(function(b,i){b.addEventListener("click",function(){
    if(b.classList.contains("lk"))return;
    bs.forEach(function(x,k){x.classList.add("lk");x.classList.add(k===q.a?"ok":(k===i?"no":"off2"));});
    quizEl.querySelector(".why").hidden=false;locked=false;
    document.getElementById("hint").textContent=(cur+1)+" / "+SHOTS.length+"  ·  SPACE to continue";});});}

var SHOTS=[],KPS=[];
function S(t,fn,narr){SHOTS.push({t:t,enter:fn,n:narr});}
function KP(name,build){var from=SHOTS.length;build();KPS.push({name:name,from:from,len:SHOTS.length-from});}
function SUM(t,kp,s){SHOTS.push({t:t,sum:{kp:kp,s:s},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}
function QUIZ(t,kp,q){SHOTS.push({t:t,quiz:{kp:kp,q:q},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}

/* expose the engine to the content script */
function axes(P){gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.r).attr("y1",P.b).attr("y2",P.b);
  gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.l).attr("y1",P.t).attr("y2",P.b);}
window.__engine={clearScene:clearScene,note:note,dots:dots,curve:curve,fn:fn,boxNode:boxNode,
  link:link,matrix:matrix,rng:rng,axes:axes,setCap:setCap,setBig:setBig,setEq:setEq,flip:flip,T:T,
  setTitle:setTitle,noTitle:noTitle,S:S,KP:KP,SUM:SUM,QUIZ:QUIZ,W:W,H:H};

/* ════════════════ PROJECTOR (no need to edit) ════════════════ */
function startProjector(CFG){
  var cur=-1,kpsEl=document.getElementById("kps"),pipEls=[];
  KPS.forEach(function(k){
    var bar=document.createElement("div");bar.className="kpbar";
    var lb=document.createElement("span");lb.className="kplbl";lb.textContent=k.name;bar.appendChild(lb);
    for(var i=0;i<k.len;i++){var p=document.createElement("span"),sh=SHOTS[k.from+i];
      p.className="pip"+(sh.sum?" sum":(sh.quiz?" quiz":""));bar.appendChild(p);pipEls[k.from+i]=p;}
    bar.addEventListener("click",function(){go(k.from,true);});
    kpsEl.appendChild(bar);});
  function hhmmss(s){s=Math.round(s);var m=Math.floor(s/60);
    return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
  var tcEl=document.getElementById("tc");
  if(!CFG.video)tcEl.hidden=true;
  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));
    if(n===cur)return;
    if(locked&&n>cur&&!force)return;
    FAST=true;clearScene();
    for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}
    FAST=false;
    cur=n;clearQuiz();clearSum();
    var sh=SHOTS[n];
    noTitle();clearScene();setBig(null);setEq(null);setCap(null);
    if(sh.enter)sh.enter();
    setNarr(sh.n);
    if(sh.sum){setNarr(null);showSum(sh.sum.kp,sh.sum.s);}
    if(sh.quiz){setNarr(null);askQ(sh.quiz.kp,sh.quiz.q);}
    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
    [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});
    document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  answer first":"");
    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1,true);});
  window.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();narrOn=!narrOn;
      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="SPACE advance · ← back · N "+(narrOn?"narration":"show narration");}});
  go(0);
}
window.__startProjector=startProjector;
})();
</script>

<script>
(function(){
var E=window.__engine;
var S=E.S,KP=E.KP,SUM=E.SUM,QUIZ=E.QUIZ,W=E.W,H=E.H,rng=E.rng;
var clearScene=E.clearScene,setTitle=E.setTitle,setBig=E.setBig,setCap=E.setCap,
    setEq=E.setEq,flip=E.flip,T=E.T,note=E.note,dots=E.dots,curve=E.curve,fn=E.fn,
    boxNode=E.boxNode,link=E.link,matrix=E.matrix,axes=E.axes,noTitle=E.noTitle;
var CFG={title:"Fitting a line · from residuals to the normal equations",
  subtitle:"residuals → cost → convexity → gradient descent → learning rate → closed form · SPACE to advance",video:""};

/* the worked dataset used throughout: x = 1,2,3,4 and y = 2,6,5,10.
   the candidate line f(x) = 1.8x + 1.2 gives residuals -1.0, +1.2, -1.6, +1.6
   (the least-squares answer for this data is y = 2.3x, so the candidate is close
   but deliberately not optimal -- and the residuals are large enough to draw).
   the plot band is 196..385: clear of a one-line equation at the top, and clear
   of the caption panel, whose top can fall to y = 407 in a small window. */
var PX=[1,2,3,4], PY=[2,6,5,10];
var AX={l:380,r:920,t:196,b:385};
function px(x){return 420+(x-1)*140;}
function py(y){return 385-(y-2)*22;}
function LINE(x){return 1.8*x+1.2;}
function plot(){ axes(AX);
  note("x",934,382,"");note("y",368,190,"");
  var p=[];for(var i=0;i<4;i++)p.push([px(PX[i]),py(PY[i])]);
  return p; }
/* blue = the data, yellow = the candidate under examination, coral = the error */
function candidate(){ curve([[px(0.85),py(LINE(0.85))],[px(4.25),py(LINE(4.25))]],"fit y"); }

KP("Opening",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);
    setTitle("Fitting a line","From residuals to the normal equations",
      "One question, six steps: what does the best line even mean?");},
    "Every idea in this film comes from one ordinary question: <b>given a cloud of points, which straight line is the best one?</b> The interesting part is that the question is not well posed until we <em>define</em> what \"best\" means, and once we do, the rest is calculus and linear algebra you already have. Six steps: <b>measure the error on one point (residual) &rarr; compress the whole line into one number (cost) &rarr; look at the shape of that number (convexity) &rarr; walk downhill on it (gradient descent) &rarr; choose the step size (learning rate) &rarr; and finally solve it in one shot (normal equations)</b>. Press N at any time to toggle this narration.");
});
KP("1 · The residual: error at a single point",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);var p=plot();dots(p,"a",5);candidate();note("a candidate line",600,246,"y");setCap("<b>Four data points and one candidate line. How wrong is it?</b>");},"Here are four measurements and one candidate straight line. Before we can ask which line is <em>best</em>, we need to say how wrong a given line is -- and the honest place to start is a single point. <b>The residual of point i is the vertical gap between the value we observed and the value the line predicts</b>: e&#7522; = y&#7522; &minus; f(x&#7522;). Notice the word <b>vertical</b>. We are not measuring the shortest distance from the point to the line; we are measuring the error <em>in the thing we are trying to predict</em>, which is y.");
  S(0,function(){clearScene();setEq("$$e_i = y_i - f(x_i)$$","top");var p=plot();dots(p,"a",5);candidate();for(var i=0;i<4;i++){var q=p[i];link(q[0],py(LINE(PX[i])),q[0],q[1],"r");}note("residual",716,306,"r","start");},"Drawn in, the residuals are the little vertical bars. <b>The sign carries information</b>: a positive residual means the observation sits <em>above</em> the line, so the model <b>under-predicted</b>; a negative residual means the model <b>over-predicted</b>. With f(x) = 1.8x + 1.2 on this data the four residuals are &minus;1.0, +1.2, &minus;1.6 and +1.6. <s>A common slip is to read the sign backwards</s> -- it is observed minus predicted, so negative means the prediction was too high.");
  S(0,function(){clearScene();setEq(null);setBig("Vertical, not perpendicular","because the quantity we predict is y");note("perpendicular distance would charge us for error in x as well -- but x is given",640,392,"y");},"Why the vertical gap rather than the perpendicular distance to the line? Because of what the model is <em>for</em>. We are handed x and asked to produce y; the x value is not in question. <b>Perpendicular distance would charge the model for error in x too</b>, which is not the task. (There is a genuine technique that does exactly that -- total least squares -- and it is the right tool when both variables are measured with noise. It is a different problem from ordinary regression.)");
  SUM(0,1,{h:"The residual: how wrong one point is",k:"The residual is the <b>vertical</b> gap between observation and prediction: <b>e&#7522; = y&#7522; &minus; f(x&#7522;)</b>. Positive means the model under-predicted; negative means it over-predicted.",m:"Vertical rather than perpendicular because the model's job is to produce y from a given x. Perpendicular distance would also charge for error in x, which is a different problem (total least squares).",w:"<s>Do not read the sign backwards.</s> It is observed minus predicted, so a negative residual means the prediction was too <em>high</em>.",e:"Everything downstream is built on this one quantity: the cost function squares it, the gradient is proportional to it, and the normal equations set its weighted sum to zero."});
  QUIZ(0,1,{t:"An observation has y = 145 while the line predicts 150. What is the residual, and what does it say?",o:["+5, the model under-predicted","<b>&minus;5, the model over-predicted</b>","5, with no direction","0, because the two are close"],a:1,w:"The residual is observed minus predicted: 145 &minus; 150 = <b>&minus;5</b>. <b>The negative sign says the prediction was too high</b> -- the line sits above this point. A positive residual would mean the point sits above the line and the model under-predicted. Reading this sign correctly matters, because the gradient inherits it."});
});
KP("2 · ★ From many residuals to one number",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);boxNode(140,150,460,80,"residuals: +3 and −3","b");boxNode(700,150,440,80,"their sum: 0","r");link(600,190,700,190);note("a badly wrong line can score a perfect zero",640,290,"r");note("so we cannot simply add the residuals up",640,344,"y");},"To compare whole lines we need <em>one</em> number per line, not a list of residuals. The obvious move -- add them up -- fails immediately. <b>Residuals carry signs, so they cancel.</b> A line that misses one point by +3 and another by &minus;3 scores a sum of exactly zero, tying with a line that passes through both perfectly. Any honest measure of total error has to remove the signs first.");
  S(0,function(){clearScene();setEq("$$J(w,b)=\\frac{1}{2m}\\sum_{i=1}^{m}\\big(f(x_i)-y_i\\big)^2$$","top");setCap("<b>Square each residual, then average. Smaller is better.</b>");note("squaring kills the sign AND punishes big misses harder",640,300,"g");note("miss by 10 → charged 100.   miss by 2 → charged 4.",640,350,"");},"Squaring fixes it, and does something extra worth noticing. <b>It removes the sign, and it punishes large errors disproportionately</b>: a miss of 10 is charged 100 while a miss of 2 is charged only 4. That is a real modelling choice, not a neutral one -- it is why least squares is <em>sensitive to outliers</em>. If a single wild point should not dominate the fit, absolute error or a robust loss is the better tool. We average over the m points so the number does not grow simply because the dataset is larger.");
  S(0,function(){clearScene();setEq("$$\\tfrac{d}{du}\\Big[\\tfrac{1}{2}u^2\\Big]=u$$","top");setBig(null);setCap("<b>The one-half is bookkeeping: it cancels the 2 that differentiation produces.</b>");note("it changes the height of J, never the location of its minimum",640,330,"y");},"The factor of one-half in front looks arbitrary and is purely cosmetic. <b>Differentiating a square produces a factor of 2, and the one-half absorbs it</b>, leaving clean gradients later. Multiplying an objective by any positive constant <em>changes its height but never the location of its minimum</em>, so the fitted line is identical with or without it. Different textbooks make different choices here; only the constant in front of the gradient changes.");
  SUM(0,2,{h:"★ The cost function: one number per line",k:"Residuals cancel if you add them, so we <b>square and average</b>: J(w,b) = (1/2m)&Sigma;(f(x&#7522;) &minus; y&#7522;)&sup2;. Smaller is better, and learning becomes <b>minimise J</b>.",m:"Squaring removes the sign <em>and</em> charges large misses disproportionately (10 costs 100, 2 costs 4) -- which is exactly why least squares is sensitive to outliers. The &frac12; is bookkeeping: it cancels the 2 that differentiation produces.",w:"<s>The &frac12; is not a modelling decision.</s> Scaling an objective by a positive constant moves its height, never its minimiser -- the fitted line is unchanged.",e:"This is the template for the whole subject: define a loss, then minimise it. Only the loss changes from model to model."});
  QUIZ(0,2,{t:"Why square the residuals instead of just adding them?",o:["Squaring makes the arithmetic easier","<b>Because residuals have signs and would cancel -- a line missing by +3 and &minus;3 would score zero</b>","To make J differentiable, which addition is not","Because it guarantees the fit is unique"],a:1,w:"The decisive reason is <b>cancellation</b>: a plain sum lets a badly wrong line score zero, so it cannot rank lines at all. Squaring removes the sign and, as a side effect, <em>weights large errors more heavily</em>. Taking absolute values would also fix the cancellation, and is used when outliers should not dominate -- squares are preferred here largely because they are smooth and easy to differentiate."});
});
KP("3 · ★ The shape of J: a bowl",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);var P={l:340,r:960,t:120,b:340};axes(P);note("parameter w",950,364,"");note("J(w)",332,132,"");var pts=[];for(var k=0;k<=60;k++){var x=340+620*k/60,t=(k-32)/30;pts.push([x,150+t*t*180]);}curve(pts,"fit b");dots([[671,150]],"g",9);note("the minimum: the best parameter",671,132,"g");},"Now change what the axes mean. <b>The horizontal axis is no longer data -- it is a parameter</b>, and the vertical axis is J, the cost that parameter produces. This is a map of parameter space, not of the data. <b>A whole line in the data picture is a single point on this curve.</b> Getting this straight is the single most useful mental move in the topic: fitting is <em>navigating this surface</em>, and every candidate line is one location on it.");
  S(0,function(){clearScene();setEq(null);setBig("Convex: exactly one minimum","a local minimum is therefore the global one");note("from any starting point, walking downhill arrives at the same place",640,392,"g");},"For squared error with a linear model this bowl is <b>convex</b> -- it curves upward everywhere and has a single lowest point. That is a strong guarantee: <b>any local minimum is automatically the global minimum</b>, so a downhill walk from <em>any</em> starting point ends at the same answer. The initial guess and the random seed cannot change the result. This is emphatically not true in general; a neural network's cost surface is riddled with dips, which is one reason those models are harder to train reliably.");
  S(0,function(){clearScene();setEq(null);setBig(null);var P={l:360,r:940,t:110,b:350};axes(P);note("w",930,374,"");note("b",352,122,"");var cx=650,cy=228;for(var r=34;r<=140;r+=34){var e=[];for(var a=0;a<=48;a++){var t=a/48*6.283;e.push([cx+r*1.92*Math.cos(t),cy+r*0.40*Math.sin(t)]);}curve(e,"fit");}dots([[cx,cy]],"g",9);note("long thin contours → downhill zig-zags → slow going",640,392,"y");},"With two parameters the bowl lives in three dimensions, and we usually draw it flattened, as <b>contours</b> -- each ring is a set of parameters giving the same cost. When the rings come out as long thin ellipses rather than circles, it tells you the parameters are strongly coupled, often because the <em>features live on very different scales</em>. The practical consequence appears in the next step: <b>a downhill walk across a narrow valley zig-zags across it instead of running along it</b>, and convergence crawls. Rescaling the features rounds the contours out and fixes this.");
  SUM(0,3,{h:"★ Convexity: the cost surface is a bowl",k:"Plot J against the <b>parameters</b> and you get a bowl. The axes are parameter space, not data space: <b>an entire line in the data picture is one point here</b>.",m:"Squared error with a linear model is <b>convex</b>, so there is exactly one minimum and any local minimum is the global one -- a downhill walk from any starting point lands on the same answer. Non-convex surfaces (neural networks) give no such guarantee.",w:"<s>Do not read this as a plot of the data.</s> Mixing up data space and parameter space makes every later picture confusing.",e:"Convexity is why the closed-form solution and the iterative one agree, and why long thin contours predict slow convergence."});
  QUIZ(0,3,{t:"What does convexity of the cost surface actually guarantee?",o:["That training will be fast","<b>That there is a single minimum, so a downhill walk from any starting point reaches the same optimum</b>","That the model will not overfit","That no learning rate is needed"],a:1,w:"Convexity is a statement about <b>shape</b>, not speed. One lowest point means <em>no bad local minima to be trapped in</em>, so the starting point cannot change the answer. Speed is governed by the learning rate and the shape of the contours; overfitting is about model capacity versus data, an entirely separate question."});
});
KP("4 · ★★ The gradient, and why we subtract it",function(){
  S(0,function(){clearScene();setEq("$$\\nabla J=\\Big[\\frac{\\partial J}{\\partial w},\\ \\frac{\\partial J}{\\partial b}\\Big]$$","top");setCap("<b>One partial derivative per parameter, collected into a vector.</b>");note("each partial answers: if I nudge THIS parameter and hold the rest still, how fast does J change?",640,300,"");note("the vector points in the direction of steepest INCREASE",640,352,"y");},"A partial derivative answers a narrow question: <b>if I nudge this one parameter and hold the others fixed, how fast does J change?</b> Collect one per parameter into a vector and you have the <b>gradient</b>. Its direction is the key fact: <b>the gradient points in the direction of steepest <em>increase</em></b>. Its length says how steep the slope is there. On a flat plateau it is near zero; on a cliff it is long.");
  S(0,function(){clearScene();setEq("$$w := w-\\alpha\\frac{\\partial J}{\\partial w}, \\qquad b := b-\\alpha\\frac{\\partial J}{\\partial b}$$","top");setBig(null);setCap("<b>We want to go down, so we step against the gradient. That is the whole of the minus sign.</b>");note("α sets how far to step; := means compute, then overwrite",640,320,"");},"We want J smaller, and the gradient points the way it gets <em>bigger</em> -- so we step in the opposite direction. <b>That is the entire meaning of the minus sign</b>, and it is worth being able to say out loud in one breath. The step size &alpha; is ours to choose. One quiet virtue of the rule: because the gradient shortens as the surface flattens, <b>the steps shrink automatically near the bottom</b> without anyone arranging it.");
  S(0,function(){clearScene();setEq(null);setBig("Update both at once","compute every partial from the OLD values, then overwrite");note("updating w first and then using the new w to compute ∂J/∂b is a different algorithm",640,392,"r");},"One detail that is easy to get wrong in code. <b>Evaluate every partial derivative using the current parameters, store the results, and only then write them all back.</b> If you update w and immediately use that new w while computing the partial for b, you are no longer stepping along the gradient of J at the point you started from. It often still converges, which is exactly what makes the bug hard to notice.");
  S(0,function(){clearScene();setEq("$$\\frac{\\partial J}{\\partial w}=\\frac{1}{m}\\sum_{i=1}^{m}\\big(f(x_i)-y_i\\big)\\,x_i$$","top");setCap("<b>Work it through and the gradient reads: error × feature, averaged.</b>");note("large error on a large feature value moves that weight most",640,306,"g");note("the same shape reappears in logistic regression and the perceptron",640,358,"v");},"Differentiating the cost with the chain rule gives something pleasingly interpretable: <b>the gradient is the average of (error &times; feature)</b>. A point the model gets badly wrong contributes a lot; a point it already fits contributes nothing. And the contribution is weighted by the feature value, so <em>a large error on a large input moves that weight the most</em>. This shape -- error times input -- is not an accident of squared loss. The same form appears in logistic regression and the perceptron, because all three sit inside the same family of models.");
  SUM(0,4,{h:"★★ The gradient and the minus sign",k:"The gradient collects one partial derivative per parameter and <b>points in the direction of steepest increase</b>. We want a decrease, so we step against it: <b>w := w &minus; &alpha;&part;J/&part;w</b>.",m:"For squared error the gradient works out to <b>the average of (error &times; feature)</b>: badly-fitted points contribute most, well-fitted points contribute nothing. Steps shrink automatically near the minimum because the gradient shortens there.",w:"<s>Update the parameters simultaneously.</s> Computing one partial, writing it back, then using the new value for the next partial is a different algorithm -- and it often still converges, which hides the bug.",e:"The error-times-feature form recurs across the linear family, so recognising it here pays off later."});
  QUIZ(0,4,{t:"Why does the update rule subtract the gradient rather than add it?",o:["To keep the parameters small","<b>The gradient points towards steepest increase, so the opposite direction is steepest decrease</b>","To make the algorithm converge faster","Either sign works; the convention is arbitrary"],a:1,w:"The gradient is the direction of steepest <em>ascent</em>. Minimising means going the other way, so the update steps against it. <b>Adding the gradient would climb the bowl</b> and drive the cost up -- which is precisely what gradient <em>ascent</em> does when the goal is to maximise something instead."});
});
KP("5 · ★ Choosing the step size",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);boxNode(90,140,320,96,"α too small","b");boxNode(480,140,300,96,"α about right","g");boxNode(850,140,320,96,"α too large","r");note("converges, but wastes enormous effort",250,272,"b");note("fast and stable",630,272,"g");note("overshoots, oscillates, may diverge",1010,272,"r");note("α is chosen by you -- it is not learned from the data",640,352,"y");},"The step size &alpha; is a <b>hyper-parameter</b>: you pick it, the data does not. Too small and the method still converges, but takes far more iterations than it needs. Too large and each step <em>jumps past</em> the minimum and lands higher on the far wall, so the cost oscillates and can grow without bound. There is no universal value; sensible practice is to try a few orders of magnitude -- 0.001, 0.01, 0.1 -- and watch what happens.");
  S(0,function(){clearScene();setEq(null);setBig(null);var P={l:300,r:980,t:110,b:330};axes(P);note("iteration",968,354,"");note("J",292,122,"");var a=[];for(var k=0;k<=60;k++)a.push([300+680*k/60,120+200*Math.exp(-k/9)]);curve(a,"fit g");var b=[];for(var k=0;k<=60;k++)b.push([300+680*k/60,120+200*Math.exp(-k/70)]);curve(b,"fit");note("healthy: drops fast, then flattens",640,372,"g");note("barely moving: α too small",640,392,"b");},"The practical diagnostic is to <b>plot J against the iteration count</b> and read the shape. A healthy run falls steeply and then flattens. A curve that descends almost imperceptibly says &alpha; is too small. A curve that jumps around or trends upward says &alpha; is too large -- and that one is unambiguous, because with a correct implementation and a sensible step size <b>the cost should never increase</b>.");
  S(0,function(){clearScene();setEq(null);setBig("Flat but high is not α","the walk has converged; the model is the limitation");note("a line simply cannot fit a curve, however long you train it",640,392,"y");},"One trap worth naming. If the cost falls, flattens, and settles at a value that still seems large, it is tempting to blame &alpha;. <b>Flattening means the optimiser has arrived</b> -- it has found the bottom of the bowl it was given. A high floor says the bowl itself is high: the model is too simple for the data, or the features do not carry the information. <em>A straight line cannot fit a curve no matter how patiently you descend.</em> That is a modelling problem, not an optimisation one.");
  SUM(0,5,{h:"★ The learning rate",k:"&alpha; is a <b>hyper-parameter you choose</b>. Too small converges but wastes iterations; too large overshoots the minimum, oscillates and can diverge. Try a few orders of magnitude and compare.",m:"Diagnose by <b>plotting J against iteration</b>: a steep fall then a flattening is healthy; a barely-moving curve means &alpha; is too small; a rising or jumping curve means it is too large. With a correct implementation the cost should never rise.",w:"<s>Flat but high is not a learning-rate fault.</s> Flattening means the optimiser converged; a high floor points at the model or the features.",e:"Long thin contours from the previous concept are the other cause of slow progress -- and the fix there is rescaling the features, not changing &alpha;."});
  QUIZ(0,5,{t:"Training cost falls quickly, flattens, and stays at a value you consider too high. What does this most likely indicate?",o:["The learning rate is too small","The learning rate is too large","<b>The optimiser has converged; the model or the features are the limitation</b>","The gradient was computed with the wrong sign"],a:2,w:"<b>Flattening is the signature of convergence</b> -- the walk has reached the bottom of its bowl. If that bottom is high, the bowl is high: the model is too simple to represent the pattern, or the inputs do not carry the necessary information. Too small an &alpha; produces a curve that is <em>still descending</em>, and too large produces one that jumps or rises."});
});
KP("6 · ★★ Solving it in one step",function(){
  S(0,function(){clearScene();setEq("$$\\nabla J(\\theta)=0$$","top");setBig(null);setCap("<b>The bowl has one bottom, and at the bottom the slope is zero.</b>");note("so instead of walking downhill, solve for the flat point directly",640,300,"g");note("this works because the cost is quadratic in the parameters",640,352,"y");},"Descending step by step is not the only option. The surface is a bowl with exactly one lowest point, and <b>at that point the slope in every direction is zero</b>. So rather than walking, we can set the gradient to zero and <em>solve</em> for the parameters. This shortcut exists because the cost is <b>quadratic</b> in the parameters, which makes setting the gradient to zero a system of <em>linear</em> equations -- and linear systems we know how to solve exactly.");
  S(0,function(){clearScene();setEq("$$X^{\\top}X\\,\\theta = X^{\\top}y \\;\\Longrightarrow\\; \\theta=(X^{\\top}X)^{-1}X^{\\top}y$$","top");setCap("<b>The normal equations: one matrix expression, no iteration, no step size.</b>");note("X stacks the inputs one row per observation, with a column of ones for the intercept",640,300,"");note("needs X to have full column rank, so that X^T X can be inverted",640,352,"r");},"Writing the data as a matrix X -- one row per observation, plus a column of ones so the intercept comes along for the ride -- the stationarity condition becomes <b>X<sup>T</sup>X&theta; = X<sup>T</sup>y</b>, and hence &theta; = (X<sup>T</sup>X)<sup>&minus;1</sup>X<sup>T</sup>y. <b>No iterations, no learning rate, no convergence to monitor.</b> There is a condition: X<sup>T</sup>X must be invertible, which requires the columns of X to be <b>linearly independent</b>. Duplicate a feature, or include one that is an exact combination of others, and the inverse does not exist -- the geometric reading being that the data cannot distinguish those parameters.");
  S(0,function(){clearScene();setEq(null);setBig(null);matrix({rows:4,cols:3,cw:330,ch:58,x:105,y:120,cell:function(i,j){var t=[["","Closed form","Gradient descent"],["Cost","one matrix inverse","many cheap iterations"],["Scales to many features","poorly","well"],["Needs a step size","no","yes"]];return t[i][j];},hl:function(i,j){return i===0?"hl":"";},dim:function(i,j){return i===0||j===0;}});note("few features → solve it. many features, or no closed form → descend.",640,368,"y");},"So which one should you use? <b>With a modest number of features, solve it directly</b> -- it is exact and there is nothing to tune. Inverting X<sup>T</sup>X costs roughly the cube of the number of features, so as that number grows into the thousands the direct route becomes unattractive and <b>iteration wins</b>. And the deeper reason gradient descent is the method worth learning: <em>most models have no closed form at all</em>. Logistic regression does not. Neural networks do not. Linear regression is the unusually generous case where both roads lead to the same place.");
  SUM(0,6,{h:"★★ The normal equations",k:"At the bottom of the bowl the gradient vanishes. Setting <b>&nabla;J = 0</b> gives a linear system, <b>X<sup>T</sup>X&theta; = X<sup>T</sup>y</b>, so &theta; = (X<sup>T</sup>X)<sup>&minus;1</sup>X<sup>T</sup>y -- exact, with no iteration and no step size.",m:"This works only because the cost is <b>quadratic</b> in the parameters. It needs X<sup>T</sup>X invertible, i.e. the columns of X <b>linearly independent</b>: a duplicated or perfectly collinear feature destroys the inverse, because the data cannot separate those parameters.",w:"<s>The closed form is not simply the better method.</s> Inversion costs about the cube of the feature count, and <b>most models have no closed form at all</b> -- logistic regression and neural networks among them.",e:"Few features: solve directly. Many features, or a model without a closed form: descend. Both give the same answer here because the surface is convex."});
  QUIZ(0,6,{t:"Two of the columns of X are identical. What goes wrong with &theta; = (X<sup>T</sup>X)<sup>&minus;1</sup>X<sup>T</sup>y?",o:["Nothing; duplicated columns are harmless","<b>X<sup>T</sup>X is singular and cannot be inverted -- the data cannot distinguish the two parameters</b>","The answer is correct but takes longer to compute","The cost function stops being convex"],a:1,w:"Identical columns are <b>linearly dependent</b>, so X<sup>T</sup>X is singular and has no inverse. The reading behind the algebra: if two inputs are indistinguishable, then shifting weight from one to the other changes nothing, so <em>infinitely many parameter vectors achieve the same minimum cost</em> and no unique solution exists. The surface stays convex -- it simply has a flat valley floor rather than a single lowest point. Gradient descent will still return one of the equally-good answers."});
});
KP("End · the six steps",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("Fitting a line · complete","One question answered six ways",
      "residual → cost → bowl → gradient → step size → closed form");},
    "Six steps, and every one of them recurs far beyond straight lines. <b>(1)</b> The <b>residual</b> y &minus; f(x) measures one point, vertically, because y is what we predict. <b>(2)</b> Squaring and averaging turns a list of residuals into a single <b>cost</b>, at the price of sensitivity to outliers; the &frac12; is bookkeeping. <b>(3)</b> Seen as a function of the parameters that cost is a <b>convex bowl</b>, so a local minimum is the global one -- and long thin contours warn of slow progress. <b>(4)</b> The <b>gradient</b> points uphill, so we step against it, updating all parameters together; for squared error it reduces to <em>error times feature</em>. <b>(5)</b> The <b>learning rate</b> is yours to choose -- diagnose it from the cost-versus-iteration curve, and remember that flat-but-high indicts the model, not the step size. <b>(6)</b> Because the cost is quadratic we can set the gradient to zero and solve the <b>normal equations</b> outright, provided the columns of X are independent. Linear regression is the rare model where walking and solving both arrive at the same point.");
