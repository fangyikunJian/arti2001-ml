<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>

  --bg:#080B11; --ink:#F0F4FA; --dim:#93A1B5; --dimmer:#3D4658; --edge:#1B2230;
  --blue:#54A9F7; --yellow:#FFD36E; --green:#5BDDA8; --coral:#FF7C87; --violet:#B48BF5;

}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;

mjx-container{color:inherit!important}

svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}

#big.off{opacity:0;transform:scale(.86)}

  text-transform:uppercase;color:var(--dim);text-shadow:none;margin-top:.55em;font-weight:400}

/* caption band — pinned into the lower third, clears the strip, scrolls if long */
#capL{align-items:flex-end;pointer-events:none}
#capL::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46vh;

#capWrap{max-width:min(84ch,94%);width:100%;max-height:62vh;overflow-y:auto;margin-bottom:50px;

#cap{text-align:center;font-size:clamp(13.5px,1.56vw,22px);font-weight:400;line-height:1.55;

#cap.off{opacity:0;transform:translateY(12px)}
#cap b{font-weight:600;color:var(--yellow)}

#narr[hidden]{display:none}

#sum{max-width:min(1200px,94%);width:100%;max-height:90vh;overflow:auto;

#sum.off{opacity:0;transform:translateY(16px) scale(.985)}

#quizL{align-items:center;pointer-events:none}

#quiz .qh{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--yellow);margin:0 0 10px}
#quiz .qq{font-size:clamp(13.5px,1.5vw,20px);font-weight:600;margin:0 0 15px;line-height:1.45}
#quiz .qo{display:flex;flex-direction:column;gap:7px}
#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;
  color:var(--ink);background:rgba(255,255,255,.045);border:1px solid #2A3546;
  border-radius:8px;padding:10px 15px;cursor:pointer;text-align:left;line-height:1.5;transition:background .2s,border-color .2s}
#quiz button:hover:not(.lk){border-color:var(--blue);background:rgba(84,169,247,.13)}

#quiz button.ok{border-color:var(--green);background:rgba(91,221,168,.15);color:var(--green)}
#quiz button.no{border-color:var(--coral);background:rgba(255,124,135,.13);color:var(--coral)}
#quiz button.off2{opacity:.32}
#quiz .why{margin:15px 0 0;font-size:clamp(11.5px,1.15vw,15px);font-weight:300;color:#93A1B5;line-height:1.7;border-top:1px solid #1E2634;padding-top:12px}
#quiz .why[hidden]{display:none}
#quiz .why b{color:#C6D2E2;font-weight:500}
#quiz .why em{font-style:normal;color:var(--green)}
#quiz .why s{text-decoration:none;color:var(--coral)}

#titleL{flex-direction:column}
#titleL h1{font-size:clamp(25px,4.7vw,68px);font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.07;text-align:center;text-shadow:0 0 70px rgba(84,169,247,.25)}
#titleL p{font-size:clamp(12px,1.32vw,18px);color:var(--dim);font-weight:300;margin:2vh 0 0;letter-spacing:.05em;text-align:center;max-width:62ch}
#titleL .act{font-family:var(--mono);font-size:clamp(11px,1.18vw,15px);color:var(--blue);letter-spacing:.28em;margin:0 0 2.2vh;text-transform:uppercase}
#titleL .rule{width:60px;height:2px;background:var(--blue);margin:3.2vh auto 0;box-shadow:0 0 18px rgba(84,169,247,.7)}
.fade{transition:opacity .6s ease;display:flex;flex-direction:column;align-items:center}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}

#strip{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:6}
#kps{display:flex;gap:3px;flex:1}
.kpbar{display:flex;gap:2px;flex:1;position:relative;cursor:pointer}
.pip{height:2px;flex:1;background:var(--edge);border-radius:2px;transition:background .4s}
.pip.seen{background:#2E3B50}
.pip.now{background:var(--blue);box-shadow:0 0 9px rgba(84,169,247,.85)}
.pip.sum{background:#1D3A30} .pip.sum.seen{background:#2C5C4A}
.pip.quiz{background:#3A3218} .pip.quiz.seen{background:#5C4E22}
.kplbl{position:absolute;top:-15px;left:0;font-family:var(--mono);font-size:8px;color:var(--dimmer);letter-spacing:.06em;white-space:nowrap;transition:color .3s}

#tc{position:fixed;top:18px;left:20px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.1em;text-decoration:none;pointer-events:auto}
#tc:hover{color:var(--blue)}
#tc[hidden]{display:none}
#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}
.navbtn{position:fixed;top:0;bottom:44px;width:14%;background:none;border:0;cursor:pointer;opacity:0;z-index:4}
#prev{left:0} #next{right:0}
.navbtn:focus-visible{opacity:1;outline:2px solid var(--blue);outline-offset:-6px}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}
.pt{fill:var(--ink)}
.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}
.box.r{stroke:var(--coral)} .box.v{stroke:var(--violet)}
.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}
.cellbg.hl3{fill:#3A1A1E;stroke:var(--coral);stroke-width:1.6}
.celltx{font-family:var(--mono);font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.celltx.d{fill:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* fix: 面板 .off 立即不可见 */

</style>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

function startProjector(CFG){
  var cur=-1,kpsEl=document.getElementById("kps"),pipEls=[];

    var bar=document.createElement("div");bar.className="kpbar";
    var lb=document.createElement("span");lb.className="kplbl";lb.textContent=k.name;bar.appendChild(lb);

      p.className="pip"+(sh.sum?" sum":(sh.quiz?" quiz":""));bar.appendChild(p);pipEls[k.from+i]=p;}
    bar.addEventListener("click",function(){go(k.from,true);});
    kpsEl.appendChild(bar);});
  function hhmmss(s){s=Math.round(s);var m=Math.floor(s/60);
    return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
  var tcEl=document.getElementById("tc");
  if(!CFG.video)tcEl.hidden=true;
  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));
    if(n===cur)return;
    if(locked&&n>cur&&!force)return;
    FAST=true;clearScene();
    for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}

    cur=n;clearQuiz();clearSum();

    if(sh.quiz){setNarr(null);askQ(sh.quiz.kp,sh.quiz.q);}
    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
    [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});
    document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  先回答":"");
    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1,true);});

    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();narrOn=!narrOn;
      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});
  go(0);
}

KP("开场",function(){

      "九讲的第 5 讲 · 约 107 分钟");},
    "第五讲，而它的位置很特别 —— <b>讲者开场就说：期末考考 L5 到 L9，也就是「从今天这一讲开始」。</b><br><b>先把这一讲挂到流水线上。</b><b>L4 讲了两步：<u>预训练</u>（学语言是怎么回事）和 <u>SFT 微调</u>（学该生成什么）。</b><b>而这一讲讲第三步：<u>偏好调优</u>（preference tuning）—— SFT 与它合起来叫 alignment，所以这一讲是 alignment 的后半段。</b><br><b>★★★ 这一讲有一把总钥匙，讲者直到最后一分钟才明说，但我建议你从开场就带着它听</b>：<b>「<u>我们不想学新的事实。我们要做的是聚焦在已有的 completion 分布上，并把模型该返回的东西，向人类所偏好的那一边对齐</u>。」</b><br><b>⇒ 这句话能解释这一讲几乎每一个设计</b>：<b>为什么要约束「别离原模型太远」（因为你不是要换一个模型）、为什么数据是<u>成对</u>的而不是标准答案（因为你在表达偏好，不是在教内容）、为什么 Best-of-N 这种<u>一个权重都不改</u>的办法也算一种偏好调优（因为你只需要在已有候选里挑）。</b><br><br><b>⭐ 这一讲的结构值得先知道，因为它是一条很干净的「问题驱动」的线</b>：<b>先给出标准答案 <u>RLHF / PPO</u>，然后把它的代价一笔一笔算清（<u>要四个模型、五个挑战</u>），再给两个「不想付这个代价」的方案 —— <u>Best-of-N</u>（完全不训，把成本挪到推理）和 <u>DPO</u>（把两段变一段，四个模型变两个）。</b><br><b>★ 所以你听的时候可以一直问一个问题：<u>这一步在省什么、又为此付了什么</u>。本讲没有免费的午餐，但每一笔交易都说得很清楚。</b><br><b>⚠ 最后提个醒：这一讲有<u>三个符号陷阱</u>，讲者自己都主动点了出来（他说当初也把他搞糊涂了）。到那一条我会专门标出来。</b>");

    stack(1030,214,[["③ Best-of-N","y"],["一个权重都不训","d"],["⚠ 成本挪到推理端","r"],["④ DPO ⇒ 两个模型","g"]],340,32,6);
    note("⇒ 听的时候一直问：这一步省了什么、又为此付了什么",640,386,"y");},
    "<b>把路线先摆出来，因为这一讲的方法是「一个比一个更省」地排开的，而顺序本身就是论证。</b><br><b>① 偏好数据怎么来。</b><b>这一段表面上在讲数据收集，<u>其实只有一条判断，而它被用了三次</u>：产出答案 → 改成比较答案；pointwise → 改成 pairwise；细粒度刻度 → 改成二元。<u>三次都是主动放弃信息量，去换标注的可靠性</u>。</b><br><b>② RLHF / PPO。</b><b>标准答案。先训一个<u>奖励模型</u>（它有一条漂亮的性质：训练时成对、使用时逐点），再用 RL 把策略对齐。</b><b>⚠ 代价是：<u>显存里要同时养四个模型</u>，而且有五个实打实的工程挑战。</b><br><b>③ Best-of-N。</b><b>最省事的路：<u>一个权重都不训</u>，生成 N 条用奖励模型挑最好的。</b><b>⚠ 代价是把成本<u>全推到推理端</u> —— 而且讲者给了一个很漂亮的论证：<u>就算钱无限，延迟也救不回来</u>。</b><br><b>④ DPO。</b><b>把两段变一段、四个模型变两个，<u>而且式子里再没有奖励</u>。</b><b>⚠ 代价是分布漂移，<u>而这是内在的，不是实现问题</u>。</b><br><b>★★ 我特别建议你留意第 ④ 段的推导（四步，没有任何额外假设）。</b><b>它的关键一步用到了前面一条看起来只是注解的性质 —— <u>Bradley-Terry 只看分数的差</u>。<u>一个顺带提到的性质，后来成了一个方法能不能成立的承重点</u>，这种事在研究里非常常见，值得体会。</b>");

  stack(640,218,["第二步通常叫 finetuning，或者 SFT（supervised fine tuning）","⇒ 我们拿我们的预训练模型，「为特定的任务」去训它","⇒ 比如如今你有 ChatGPT 和所有这些聊天助手 —— 这可以是一个应用","⭐ 而这里的目标，是「教这个模型怎么表现（how to behave）」"],760,32,6);
  note("★★ 请把「怎么表现」和第一步的「关于语言」对照：一个教内容，一个教行为",640,380,"r");},"<b>第二步教的东西，和第一步性质完全不同。</b><br><b>讲者的话</b>：<b>「<u>而我们在这里看到，它通常被叫做 finetuning，或者 SFT，也就是 supervised fine tuning。所以这里我们做的，是拿我们的预训练模型，然后为特定的任务去训练它。所以如今，你有 ChatGPT 和所有这些聊天助手。所以这可以是一个应用 —— 把你的模型变成一个助手。而所以这里，目标是教这个模型怎么表现</u>。」</b><br><b>★★★ 把两步教的东西并排，这个对照是这一讲的地基</b>：<b>⇒ <u>预训练</u>：教「<u>关于语言、关于代码</u>」的事 —— <u>内容</u>。</b><b>⇒ <u>SFT</u>：教「<u>怎么表现</u>」—— <u>行为</u>。</b><br><b>★★ 而这个区分有一个很实际的推论（<u>L4 里算过</u>）</b>：<b>⇒ SFT 的数据量比预训练<u>小几千倍</u>。</b><b>⇒ 那点数据<u>塞不进新知识</u>，但<u>足够改变行为</u>。</b><b>⇒ <u>因为行为是一个简单得多的东西</u>。</b><br><b>⇒ <u>而这一讲的第三步会把这条线再往前推一格：它连行为都不教，只教「两个里哪个更好」</u>。</b><br><b>⚠ 「<u>把你的模型变成一个助手</u>」只是 SFT 的<u>一种</u>应用 —— <u>他接着就会说，你也可以把它调向你自己的任务</u>。</b>");

  stack(640,218,["模型已经知道语言是什么、代码是什么 —— 你只是在让它「表现得像你要调的那个用例」","⇒ 你这里的数据集「规模小得多，但质量高得多」","⇒ 你拿你的预训练模型，用「预测下一个 token」这个任务，「准确地教它该预测哪些 token」","⭐ 而我们看了 LoRA —— 一个「参数高效」的方法"],760,32,6);
  note("★★ 它「不去调全部权重」，而是「用一种聪明的方式引入低秩矩阵」，被调的就是那些矩阵",640,380,"g");},"<b>SFT 的两条具体做法，以及那个让它变便宜的技术。</b><br><b>讲者的话</b>：<b>「<u>所以这个模型已经知道语言是什么、代码是什么等等。而你只是在试着让它表现得像你想为之调优的那个用例。所以典型地这里，你有的是一个规模小得多、但质量高得多的数据集。而你基本上是拿你的模型、你的预训练模型，用「预测下一个 token」这个任务，准确地教它该预测哪些 token。而我们看了 LoRA，一个参数高效的方法，它不去调全部权重，而是用一种聪明的方式引入低秩矩阵，被调的就是那些矩阵</u>。」</b><br><b>★★★ 「<u>准确地教它该预测哪些 token</u>」这句话里藏着 L4 那个最实在的细节</b>：<b>⇒ 它指的是：<u>损失只在「回答」那一段上算</u>。</b><b>⇒ 用户的提问<u>照样喂进模型（它是条件），但那些位置不计入损失</u>。</b><b>⇒ <u>否则模型学会的是「怎么像用户一样提问」—— 也就是鹦鹉学舌</u>。</b><br><b>★★ 而 <u>LoRA</u> 一句话复述</b>：<b>⇒ <u>W = W₀ + BA</u>，W₀ <u>冻住</u>，只训 B 和 A。</b><b>⇒ 秩 r 取<u>很小</u>（4 到 8）⇒ <u>可训参数降到原来的 0.1% 到 1%</u>。</b><br><b>⇒ <u>而它省的主要是显存：冻住的那部分不需要梯度和优化器状态</u>。</b><br><b>⚠ 记住 LoRA，<u>因为这一讲 10:20 就会有学生问「偏好调优这边的 LoRA 是什么」</u>。</b>");
  SUM(0,3,{h:"⭐ 回顾二：SFT",k:"<b>第二步通常叫 finetuning 或 SFT（supervised fine tuning）</b>：<b>拿预训练模型「为特定的任务」去训它 —— 比如把模型变成一个助手（ChatGPT 这类聊天助手就是一个应用）；而这里的目标是「教这个模型怎么表现」</b>。做法：<b>模型已经知道语言是什么、代码是什么，你只是在让它「表现得像你要调的那个用例」；你的数据集「规模小得多，但质量高得多」；你用「预测下一个 token」这个任务，「准确地教它该预测哪些 token」</b>。以及 <b>LoRA —— 一个参数高效的方法，它「不去调全部权重」，而是「用一种聪明的方式引入低秩矩阵」，被调的就是那些矩阵</b>。",m:"★★★ 把两步教的东西并排，这个对照是这一讲的地基：<b>预训练教「关于语言、关于代码」的事 —— 内容；SFT 教「怎么表现」—— 行为</b> ⇒ 一个很实际的推论（L4 里算过）：<b>SFT 的数据量比预训练小几千倍，那点数据塞不进新知识，但足够改变行为 —— 因为行为是一个简单得多的东西</b> ⇒ <b>而这一讲的第三步会把这条线再往前推一格：它连行为都不教，只教「两个里哪个更好」</b>。",w:"★★★ 「准确地教它该预测哪些 token」里藏着 L4 那个最实在的细节：<b>损失只在「回答」那一段上算；用户的提问照样喂进模型（它是条件），但那些位置不计入损失 —— 否则模型学会的是「怎么像用户一样提问」，也就是鹦鹉学舌</b>。",r:"⇒ <b>LoRA</b> 一句话复述：<b>W = W₀ + BA，W₀ 冻住，只训 B 和 A；秩 r 取很小（4 到 8）⇒ 可训参数降到原来的 0.1% 到 1%，而它省的主要是显存（冻住的那部分不需要梯度和优化器状态）</b>。⚠ <b>记住 LoRA，因为这一讲 10:20 就会有学生问「偏好调优这边的 LoRA 是什么」</b>。而「把你的模型变成一个助手」只是 SFT 的<b>一种</b>应用 —— 他接着就会说你也可以把它调向你自己的任务。"});
  QUIZ(0,3,{t:"预训练和 SFT 各教模型什么？",o:["SFT 教的是新知识","两步教的是同一件事，只是数据量不同","预训练教行为，SFT 教内容","预训练教「关于语言、关于代码」的内容；SFT 教「怎么表现」的行为 —— 所以 SFT 的数据可以少几千倍"],a:3,w:"⇒ 而这一讲的第三步把这条线再推一格：它连行为都不教，只教「两个里哪个更好」。"});

  SUM(0,6,{h:"⭐⭐ 为什么还要第三步",k:"理由一：<b>SFT 阶段要构造「非常高质量」的数据集，而攒这样一个数据集「非常耗时、而且其实非常难」；而第三步我们做的「并不真的是在教模型它该生成什么，而是告诉模型它该偏好什么样的输出」—— 少了一点「请生成那个」的味道，多了一点「我更喜欢这个选项」的味道</b>；对照：<b>让你「从头写一首很棒的诗」通常困难得多，相比之下只是给你两首诗、一好一坏、让你说哪首更好 ⇒ 要拿到这些数据集已经容易多了</b>。理由二：<b>SFT 时有一件事我们真的很努力想做对 —— prompt 的分布；如果某类 prompt 太多，模型就会更偏向用那种方式回答 ⇒ 所以假如模型表现不好而我们想往 SFT 数据里加一个例子，我们就得「非常小心加的是哪个 prompt」、以及它会不会「把模型往那个方向带偏太多」</b>。理由三：<b>SFT 的数据典型地是非常高质量的 ⇒ 如果你盯着模型犯的所有小毛病、想把它们都塞进 SFT 数据里，你「只会很吃力」，那要花很多时间</b>。",m:"★★★ 把三步教的东西排成一条线，每一步都在「要求更少」：<b>预训练教「语言长什么样」（要海量文本）；SFT 教「该生成什么」（要人写的标准答案）；偏好调优教「该偏好什么」（只要人做选择）</b> ⇒ 而「要求更少」直接等于「便宜得多、也可靠得多」：<b>写一个好回答需要专业写手、慢、而且两个人写的不一样；在两个回答里挑一个任何人都能做、快、一致性高得多 ⇒ 这就是整个偏好调优范式能成立的经济学基础</b>。",w:"★★★ 那个不对称在认知上是真实的，而它有名字：<b>生成比识别难 —— 生成需要你在一个巨大的空间里搜索，识别只需要在两个给定的点之间比较，而人在比较上比在搜索上强得多</b>；这个不对称在机器学习里到处都是（<b>写排序算法 vs 判断序列排好没有；画一张图 vs 说哪张更好看</b>）⇒ <b>整个 GAN、整个 RLHF、整个「验证比生成容易」的推理范式都建在这个不对称上 —— 所以这不只是一个标注技巧，它是一类方法的共同地基</b>（也是为什么 L4 说「让另一个 LLM 去审」比「让它写」可靠）。",r:"★★★ 理由二的厉害之处：<b>它说明「补数据」这个最直觉的办法有副作用 —— 你想修的是一个具体的毛病，但往数据里加样本改变的是整个数据分布，于是你修好一处、可能在别处造出新问题</b>；而偏好调优没有这个问题：<b>偏好数据不改变模型「见到什么 prompt」的分布感，它只在已有的输出之间调整排序 ⇒ SFT 是在「加一个点」，偏好调优是在「调两个点之间的高低」</b>（这条和 L4 的 81:27 是同一件事的两面）。⇒ 三条理由不是并列而是递进：<b>① 标注成本 ② 会扰动分布 ③ 逐条修补不可行 —— 而第三条是前两条的后果：既然每条都贵又都要小心，修一条的成本就很高，而模型的毛病有成百上千条，这条路算术上就走不通</b>；⚠ <b>这三条都是成本上的理由，不是原理上的 —— 原理上的那一条他放在最后单独讲（负向信号）</b>。"});

  SUM(0,8,{h:"⭐⭐⭐ 负向信号",k:"<b>我这里要补的最后一件事，是和 SFT 阶段的「另一个差别」：偏好调优「让我们能够注入一些负向信号」—— 因为 SFT 全部都是在「教模型它该预测什么」，但它「并不教模型它『不』该预测什么」</b>。然后转入数据：<b>要开始，我们当然需要先有偏好对，所以先看「数据收集」这一步 —— 设定是：你有一个 prompt（比如「写一首诗」），你有一个给定的回答（模型生成的那首诗）⇒ 而「你有好几种办法去构造你的偏好数据」</b>。",m:"★★★ 从损失函数的形状上看，这是一个结构性限制：<b>SFT 的损失是 −log P(y | x)，最小化它就是「把 y 的概率推高」—— 这个式子里没有任何位置可以放「把 z 的概率推低」</b>；你可能会想「把概率推高，别的不就自动变低了吗」：<b>是会变低，但「所有别的」一起等比例变低，你没法指定「我特别想让这一个变低」—— 而很多你最想消除的行为（不安全的回答、谄媚、编造）恰恰需要被特别指定</b> ⇒ <b>而偏好损失同时包含 y_w 和 y_l，一个往上推、一个往下压 —— 这就是「负向信号」四个字的全部含义</b>。⚠ <b>请把这一条和前三条分开记：前三条说「SFT 做这件事太贵」，这一条说「SFT 根本做不了这件事」</b>。",w:"★★ 讲者把「数据」放在所有方法之前，这个顺序是有意的：<b>后面所有方法（RLHF、PPO、Best-of-N、DPO）吃的都是同一种数据 ⇒ 数据的格式一旦定下来，方法就只是「怎么用这份数据」的不同答案</b> ⇒ <b>所以这一段看起来只是「数据收集」这种脏活，但数据格式的每一个选择都会在后面的公式里留下痕迹 —— 比如「只记谁赢」这个选择，直接决定了 Bradley-Terry 能被用上</b>。",r:"⚠ 下一段那三种形态（<b>pointwise / pairwise / listwise</b>）里，讲者会连续做三次同一个判断 —— <b>而那个判断本身比三种形态更值得记</b>。"});

  note("★★ 而我跟你们说过，生成这件事「有点贵、也有点难」—— 但这也是可行的",640,380,"r");},"<b>造偏好对的第二条路，而它正是泰迪熊那个例子的做法。</b><br><b>讲者的话</b>：<b>「<u>好，所以另一种拿到那份数据的办法，是在你的日志里找到一条你不喜欢的回答，拿那条回答，然后把它改写掉 —— 这基本上就是我们刚才在这里做的事。所以这里，当我们有这条回答时，我们做的就是拿那条回答、然后改写出一个好的。所以这也是人们会做的事。但当然，它更费事一点，因为你需要去生成。而我跟你们说过，生成这件事有点贵、也有点难，不过这也是可行的</u>。」</b><br><b>★★★ 把两条路并排，它们的性质很不一样</b>：<b>⇒ <u>路一（采样两次 + 评判）</u>：<u>两个回答都是模型自己生成的</u> ⇒ <u>on-policy</u>。</b><b>⇒ <u>路二（找差的 + 人改写）</u>：好的那个<u>是人写的</u> ⇒ <u>off-policy</u>。</b><br><b>★★ 这个差别在后面会变得重要</b>：<b>⇒ <u>on-policy 的数据反映模型当前真实会犯的错 ⇒ 训练信号更贴切</u>。</b><b>⇒ <u>off-policy 的好回答可能「好得模型根本到不了」⇒ 学起来更难</u>。</b><br><b>⇒ <u>而讲者在 DPO 那一段会专门讲「分布漂移」—— 根子就在这里</u>。</b><br><b>★★★ 但路二有一个路一没有的好处：<u>它是「有的放矢」的</u></b>：<b>⇒ 路一是<u>随机采两个，看哪个好</u> —— <u>你修不到你真正在意的那个毛病</u>。</b><b>⇒ 路二是<u>先挑出你讨厌的那条，再针对它造对照</u>。</b><br><b>⚠ 「<u>生成有点贵、也有点难</u>」这句话呼应的是 07:36 那条「写比挑难」—— <u>讲者在提醒你路二的成本正是你前面刚被说服要避开的那个</u>。</b>");
  SUM(0,11,{h:"⭐⭐ 谁来评判、用什么刻度",k:"评判者：<b>LLM as a judge（你可能听说过，几讲之后会看到）—— 它也典型地被用来比较「一个观测比另一个好多少」；也可以用规则类的指标像 BLEU、ROUGE，「虽然如今它们已经没那么常用了」</b>。刻度：<b>最简单的是「二元」—— 回答 1 比回答 2 好还是差；但你也可以想一个更细致的刻度：好得多 / 好 / 稍好 / 稍差 / 差 / 差得多</b> ⇒ <b>但「那个做法有一些挑战」—— 因为如果你考虑人工评分，「很多任务都有点主观」⇒ 所以很多情况下人们做的是「一个二元刻度上的成对偏好数据集」，只有「更好还是更差」</b>。第二条路：<b>在你的日志里找到一条你不喜欢的回答，拿那条回答把它「改写」掉（这就是泰迪熊那个例子的做法）—— 当然它「更费事一点，因为你需要去生成」</b>。",m:"★★★ 「主观」在这里具体是：<b>两个标注者可能都同意 A 比 B 好，但一个说「稍好」、另一个说「好得多」⇒ 「好多少」这一维全是噪声，而「谁更好」那一维是干净的</b> ⇒ 所以砍掉那一维<b>不是因为它没信息，而是信息被噪声淹了：保留它就是在往模型里灌噪声，砍掉它则损失一点信息但剩下的全是信号</b> ⇒ <b>请把这三次放在一起看，它是这一段真正的收获：① 产出答案 → 改成比较答案 ② pointwise → 改成 pairwise ③ 细粒度刻度 → 改成二元 —— 三次都是「主动放弃信息量，换标注的可靠性」</b>。",w:"★★★ 两条路的性质很不一样：<b>路一（采样两次 + 评判）两个回答都是模型自己生成的 ⇒ on-policy；路二（找差的 + 人改写）好的那个是人写的 ⇒ off-policy</b> ⇒ 这个差别后面会变得重要：<b>on-policy 的数据反映模型当前真实会犯的错，训练信号更贴切；off-policy 的好回答可能「好得模型根本到不了」，学起来更难 —— 而讲者在 DPO 那一段会专门讲「分布漂移」，根子就在这里</b>。但路二有一个好处：<b>它是「有的放矢」的 —— 路一是随机采两个看哪个好（你修不到你真正在意的毛病），路二是先挑出你讨厌的那条再针对它造对照</b>。",r:"⇒ 「LLM as a judge」是这整条流水线能规模化的关键：<b>人工标一对要几十秒到几分钟还要付钱，让一个强模型判一对只要几秒、成本几分之一美分 ⇒ 偏好数据的量可以从几万条涨到几百万条</b>；但它有个必须知道的问题（L4 铺过）：<b>评委模型自己也有偏好偏差（偏好长回答、偏好自己风格的回答）⇒ 你训出来的模型会向「评委模型的口味」收敛而不是向人的口味 ⇒ 实践中通常是 LLM 判大头、人抽样校准</b>。而 <b>BLEU / ROUGE</b> 为什么「没那么常用了」：<b>它们比的是「和参考答案的字面重合度」，而偏好调优根本没有参考答案 —— 两个意思完全相同但措辞不同的回答，BLEU 会给很低的分，这显然不对</b>。"});
  QUIZ(0,11,{t:"偏好标注为什么最后用「二元」而不是六档细刻度？",o:["因为「好多少」那一维全是噪声（都同意 A 更好，但一个说「稍好」一个说「好得多」），而「谁更好」那一维是干净的","二元训练更快","因为模型只能处理二元标签","因为六档刻度需要更多标注者"],a:0,w:"⇒ 这是这一段第三次做同一个判断：① 产出答案→比较答案 ② pointwise→pairwise ③ 细刻度→二元，三次都是放弃信息量换可靠性。"});

  note("★★ 注意目标被写成了「两件事」：抬高赢的那个、压低输的那个 —— 正是「负向信号」",640,380,"r");},"<b>目标被写成了两件事，而第二件正是上一段说的那个负向信号。</b><br><b>讲者的话</b>：<b>「<u>好，所以现在我们有了我们的偏好数据。而我们想要的，是把我们的模型对齐到：更偏好那些被评分所偏好的回答，并且，我想，下调那些不被偏好的回答。而为了做到那件事，我们会看一个叫做 RLHF 的方法</u>。」</b><br><b>★★★ 请注意这个目标的<u>形状</u>，它是对称的两半</b>：<b>⇒ <u>上调</u>（up weight）：让赢的那个回答概率变大。</b><b>⇒ <u>下调</u>（down weight）：让输的那个回答概率变小。</b><b>⇒ <u>而 SFT 只有上半句 —— 这就是 11:23 那条「负向信号」的具体样子</u>。</b><br><b>★★ 所以从这里开始，你可以用一个很简单的标准去看后面每一个方法</b>：<b>⇒ 它<u>怎么实现「上调」</u>？</b><b>⇒ 它<u>怎么实现「下调」</u>？</b><br><b>⇒ <u>RLHF 的答案是绕一圈：先学一个奖励模型，再用 RL 去优化它</u>。</b><b>⇒ <u>而 DPO 的答案是直接写进损失里 —— 这也是它为什么更简单</u>。</b><br><b>⚠ 「<u>RLHF</u>」这个缩写接下来会一直出现，<u>而讲者稍后会专门拆开它的每个字母</u>。</b>");

  stack(640,194,["如名字所示，RLHF 依赖的是 RL（强化学习）","⇒ 所以我先从一些「RL 的基础」讲起","⇒ 讲者问：我们这儿有 RL 专家吗？有吗？没有？（笑）","⭐ 那就「不需要是 RL 专家」—— 别担心，我们会「讲得非常慢」"],740,32,6);
  note("★★ 这是这门课第七次「用一个概念前先确认听众有没有」",640,356,"v");
  note("⚠ 这次的回答是「没有」⇒ 所以他从 agent、state、action 这些最基本的词开始",640,380,"r");},"<b>又一次先确认底子，而这次的回答决定了接下来的讲法。</b><br><b>讲者的话</b>：<b>「<u>但如名字所示，RLHF 依赖的是 RL。所以我就先从一些 RL 的基础开始讲。所以我们这儿有 RL 专家吗？有吗？没有？（笑）所以不需要是 RL 专家。所以别担心。我们会在那上面讲得非常慢</u>。」</b><br><b>★★★ 这个动作在这门课里已经是第七次了，<u>而它每次都在决定「从哪一层开始讲」</u></b>：<b>⇒ <u>L2</u>：三角公式、空间旋转、蒸馏。</b><b>⇒ <u>L3</u>：FLOPS、温度。</b><b>⇒ <u>L4</u>：Adam、Chatbot Arena。</b><b>⇒ <u>这里</u>：RL。</b><br><b>★★ 而这一次的回答是「<u>没有</u>」，所以他做了一个很重要的决定</b>：<b>⇒ <u>从 agent、environment、state、action、policy、reward 这些最基本的词开始</u>。</b><b>⇒ <u>而不是假设你知道马尔可夫决策过程、贝尔曼方程那一套</u>。</b><br><b>⇒ <u>对你来说这是好消息：接下来这一段不需要任何 RL 背景</u>。</b><br><b>★★★ 而我想提醒你一件事：<u>这一段的 RL 讲得非常简化，它只够你看懂 RLHF，不够你做 RL</u></b>：<b>⇒ <u>比如他完全不会讲「折扣因子」「回合」「探索与利用」</u>。</b><b>⇒ <u>因为 LLM 这个场景把那些都退化掉了 —— 这件事本身很值得注意</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("18:54","which interacts with an environment");
  note("⭐⭐ RL 的基本图景：一个 agent 和一个 environment 在来回",640,172,"y");
  seq(185,200,["agent（智能体）","environment（环境）"],["g","b"],450,44);
  note("在 RL 的术语里",410,266,"g");
  note("它和这个东西「交互」",865,266,"b");

  note("★★ 它可以在时刻 t「采取一个动作（action）」—— 而它是「按照某个策略（policy）」去采取那个动作的",640,348,"v");},"<b>RL 的基本图景只有两个角色，而它们在来回。</b><br><b>讲者的话</b>：<b>「<u>所以在 RL 的世界里，人们做的是：他们有一个 agent —— 这里我指的是 RL 术语里的 agent —— 它和一个 environment 交互。所以它做什么？它在一个给定的状态上，比如说在时刻 t，它可以在时刻 t 采取一个动作。而它采取那个动作，是按照某个 policy（策略）来的</u>。」</b><br><b>★★★ 这四个词先摆在这里，<u>因为下一段整段都是在给它们找对应物</u></b>：<b>⇒ <u>agent</u>：做决定的那一方。</b><b>⇒ <u>environment</u>：它所处、并会对它作出反应的那个世界。</b><b>⇒ <u>state</u>：此刻的处境。</b><b>⇒ <u>action</u>：它可以做的事。</b><br><b>★★ 最经典的例子是下棋</b>：<b>⇒ <u>agent</u> 是棋手，<u>environment</u> 是棋盘和对手。</b><b>⇒ <u>state</u> 是当前局面，<u>action</u> 是走哪一步。</b><br><b>⇒ <u>而「按某个策略去采取动作」意思是：给定局面，它有一套规则（或概率）决定走哪一步</u>。</b><br><b>★★★ 请先在脑子里记住这个「<u>来回</u>」的结构：<u>agent 做动作 ⇒ environment 给反馈 ⇒ agent 再做动作</u></b>：<b>⇒ <u>因为接下来最让人不适应的一点，正是「这个来回在 LLM 里长什么样」</u>。</b><br><b>⚠ 讲者特意说「<u>我指的是 RL 术语里的 agent</u>」—— <u>因为今天「agent」这个词已经被 LLM 圈用成别的意思了（那是 L7 的内容）</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("★★ 讲者说完就问了一句：很简单，对吧？",640,262,"v");},"<b>策略就是一个条件概率，而讲者说完就确认了一句。</b><br><b>讲者的话</b>：<b>「<u>那个 policy 典型地记作 pi，pi 下标 theta，括号里是「给定状态的那个动作」。所以那个策略的意思，就只是给你「给定一个状态、你采取某个动作的概率」。很简单，对吧？</u>」</b><br><b>★★★ 请把这个式子的三个部分认清楚，<u>因为它在这一讲里会出现几十次</u></b>：<b>⇒ <u>π</u>：策略本身，一个<u>函数</u>。</b><b>⇒ <u>θ</u>（下标）：这个策略的<u>参数</u> —— <u>而在 LLM 里，它就是模型的全部权重</u>。</b><b>⇒ <u>(a | s)</u>：<u>给定状态 s，采取动作 a 的概率</u>。</b><br><b>★★ 「<u>策略是一个概率</u>」这一点很关键，<u>它不是一个确定的选择</u></b>：<b>⇒ 所以策略<u>不说「在这个局面下走这一步」</u>。</b><b>⇒ 它说「<u>在这个局面下，每一步各有多大概率被走</u>」。</b><br><b>⇒ <u>而这正好对上了 LLM：模型输出的不是一个 token，是整个词表上的一个分布</u>。</b><br><b>★★★ 所以「<u>训练一个策略</u>」这件事，在 LLM 里就等于「<u>调整模型的权重 θ，让那个分布变成我们想要的样子</u>」</b>：<b>⇒ <u>而这句话就是这一整讲在做的事</u>。</b><br><b>⚠ 「<u>很简单，对吧</u>」—— <u>这里确实简单，而难的部分在后面的 advantage 和 PPO-Clip</u>。</b>");

  stack(640,218,["而既然 agent 采取了某个动作，它「也会收到一些奖励」","⇒ 有时候是「好的奖励」","⇒ 有时候是「坏的奖励」","⭐ 所以我们要做的，是「把这套心态挪到我们的偏好调优这件事上来」"],780,32,6);
  note("★★ 请记住「有时候好、有时候坏」—— 奖励是可以为负的，而这又是一个负向信号的入口",640,380,"r");},"<b>第四个词，而讲者立刻宣布要把这套心态整个搬过去。</b><br><b>讲者的话</b>：<b>「<u>而所以，既然 agent 采取了某个动作，它也会收到一些奖励。所以有时候，它是好的奖励。有时候，它是坏的奖励。所以我们要做的，是把这套心态挪到我们的偏好调优这件事上来</u>。」</b><br><b>★★★ 「<u>有时候好、有时候坏</u>」这句话里藏着一个重要的性质：<u>奖励可以是负的</u></b>：<b>⇒ 这是 RL 框架<u>天然自带</u>的负向信号能力。</b><b>⇒ <u>而这正是为什么偏好调优会选 RL 这个框架 —— 它要的那个「下调」，RL 本来就有</u>。</b><br><b>★★ 所以你可以这样理解这个选择</b>：<b>⇒ SFT 的框架（<u>最大似然</u>）<u>结构上只能说「要这个」</u>。</b><b>⇒ RL 的框架（<u>最大化期望奖励</u>）<u>天然能说「要这个、不要那个」</u>。</b><br><b>⇒ <u>所以换框架不是为了赶时髦，是为了拿到一个 SFT 给不了的表达能力</u>。</b><br><b>★★★ 不过也要先说清楚代价：<u>RL 带来的表达能力，是用「训练难度」换的</u></b>：<b>⇒ <u>最大似然是凸的、稳定的、一步到位的</u>。</b><b>⇒ <u>而 RL 是出了名的难训、不稳定、对超参敏感 —— 后面那「五个挑战」讲的就是这个</u>。</b><br><b>⚠ 讲者用「<u>挪这套心态</u>」而不是「用 RL 算法」—— <u>这个措辞很准确：被搬过去的主要是那套看问题的方式</u>。</b>");
  SUM(0,12,{h:"⭐ RLHF 与 RL 的基本词",k:"目标：<b>现在我们有了偏好数据，而我们想要的是把模型对齐到「更偏好那些被评分者偏好的回答」，并且「下调那些不被偏好的回答」⇒ 为此我们会看一个方法，它叫 RLHF</b>。<b>如名字所示，RLHF 依赖 RL ⇒ 先讲一些 RL 基础</b>（讲者问「这儿有 RL 专家吗」—— 没有 ⇒ <b>那就不需要是 RL 专家，我们会讲得非常慢</b>）。四个基本词：<b>一个 agent 和一个 environment 交互；它在某个「状态」上（比如时刻 t），可以采取一个「动作」，而它是按某个「策略」去采取的 —— 策略典型地记作 π_θ(a | s)，意思就是「给定一个状态、你采取某个动作的概率」</b>；<b>而既然 agent 采取了动作，它「也会收到一些奖励」—— 有时候是好的奖励，有时候是坏的 ⇒ 我们要把这套心态挪到偏好调优上来</b>。",m:"★★★ 请注意那个目标的形状，它是对称的两半：<b>上调（让赢的回答概率变大）和下调（让输的回答概率变小）—— 而 SFT 只有上半句，这就是「负向信号」的具体样子</b> ⇒ 从这里起你可以用一个很简单的标准去看后面每个方法：<b>它怎么实现「上调」、怎么实现「下调」—— RLHF 的答案是绕一圈（先学奖励模型，再用 RL 优化它），而 DPO 的答案是直接写进损失里，这也是它为什么更简单</b>。",w:"★★★ 「有时候好、有时候坏」里藏着一个重要性质：<b>奖励可以是负的 —— 这是 RL 框架天然自带的负向信号能力，而这正是偏好调优选 RL 这个框架的原因：它要的那个「下调」，RL 本来就有</b> ⇒ <b>SFT 的框架（最大似然）结构上只能说「要这个」；RL 的框架（最大化期望奖励）天然能说「要这个、不要那个」—— 所以换框架不是为了赶时髦，是为了拿到一个 SFT 给不了的表达能力</b>；但代价要先说清：<b>RL 带来的表达能力是用「训练难度」换的 —— 最大似然是凸的、稳定的、一步到位的，而 RL 出了名地难训、不稳定、对超参敏感，后面那「五个挑战」讲的就是这个</b>。",r:"★★★ π_θ(a | s) 的三个部分要认清（它在这一讲出现几十次）：<b>π 是策略本身（一个函数）；θ 是它的参数 —— 在 LLM 里就是模型的全部权重；(a | s) 是「给定状态 s 采取动作 a 的概率」</b> ⇒ 「策略是一个概率」很关键：<b>它不说「在这个局面下走这一步」，而说「每一步各有多大概率被走」—— 这正好对上 LLM：模型输出的不是一个 token，是整个词表上的一个分布</b> ⇒ <b>所以「训练一个策略」在 LLM 里就等于「调整权重 θ，让那个分布变成我们想要的样子」—— 这句话就是这一整讲在做的事</b>。⚠ 讲者特意说「我指的是 RL 术语里的 agent」，<b>因为今天「agent」这个词已经被 LLM 圈用成别的意思了（那是 L7 的内容）</b>；而这一段的 RL 讲得非常简化：<b>它只够你看懂 RLHF、不够你做 RL —— 他完全不讲折扣因子、回合、探索与利用，因为 LLM 这个场景把那些都退化掉了</b>。"});
  QUIZ(0,12,{t:"偏好调优为什么要借用 RL 这个框架？",o:["因为 RL 不需要标注数据","因为 RL 训得更快","因为 RL 可以并行","因为 RL 的奖励「有时候好、有时候坏」—— 它天然能表达「要这个、不要那个」，而最大似然结构上只能说「要这个」"],a:3,w:"⇒ 代价是训练难度：最大似然凸、稳定、一步到位，而 RL 出了名地难训、对超参敏感 —— 后面那「五个挑战」讲的就是这个。"});

KP("13 · ⭐⭐ 把 RL 的词翻译到 LLM 上",function(){

  note("⚠ 注意 state 的定义：它不是「模型的内部状态」，而是「到目前为止的那段文本」",640,354,"d");},"<b>一张对照表，而其中 state 那一行最容易被误解。</b><br><b>讲者的话</b>：<b>「<u>所以让我们一起看看，我们怎么把这些量搬到 LLM 的世界里。所以 agent 是什么？agent 就是这个 LLM。所以就它所处的状态而言，它就只是它目前为止拿到的那个输入。所以它想做的动作，是预测下一个 token。所以它基本上总是在想：好，给定这个输入，下一个 token 是什么？</u>」</b><br><b>★★★ 「<u>state = 目前为止的输入</u>」这个定义要特别留意，<u>它和你直觉里的「状态」不一样</u></b>：<b>⇒ 它<u>不是</u>模型的隐藏层、不是 KV cache、不是任何内部变量。</b><b>⇒ 它就是「<u>到此刻为止的那一串 token</u>」。</b><b>⇒ <u>也就是说：状态是「外部可见的文本」，而不是「模型内部的东西」</u>。</b><br><b>★★ 这个定义带来一个很好的性质：<u>这个 RL 问题是完全可观测的</u></b>：<b>⇒ 下棋时你能看到整个棋盘 ⇒ <u>完全可观测</u>。</b><b>⇒ 而生成文本时你能看到整段已生成的文本 ⇒ <u>也完全可观测</u>。</b><br><b>⇒ <u>所以这是 RL 里最简单的那一类问题，没有隐藏状态的麻烦</u>。</b><br><b>⚠ 还有一点很特别：<u>状态是「只增不减」的</u> —— <u>每走一步，状态就变长一个 token，而且从不回退</u>。</b><b>⇒ <u>这和下棋完全不同，而它正是后面「没有回溯」那个性质的来源</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("20:45","the environment can be the set of tokens of your vocabulary",166);
  note("⭐ 第四个对应：environment ⇒ 词表",640,194,"y");
  stack(640,218,["而这个动作、也就是这个下一个 token，是「在外面那一整套 token 之中」选的","⭐ 所以如果你愿意的话：environment「可以是你词表里的那套 token」","⇒ 也就是说：模型每一步面对的「世界」，就是它可以选的那几万个 token"],780,32,6);
  note("★★ 讲者说「如果你愿意的话」—— 他自己也知道这个对应有点勉强",640,350,"v");
  note("⚠ 而这确实是整张对照表里最牵强的一格，值得专门想一想",640,380,"r");},"<b>第四个对应，而讲者自己的措辞就透露出它有点勉强。</b><br><b>讲者的话</b>：<b>「<u>而这个动作、或者说这个下一个 token，是在外面那一整套 token 之中的。所以如果你愿意的话 —— environment 可以是你词表里的那套 token</u>。」</b><br><b>★★★ 请注意「<u>如果你愿意的话</u>」这个限定词，<u>它说明讲者自己也觉得这一格不太自然</u></b>：<b>⇒ 在标准 RL 里，<u>environment 是「会对你的动作作出反应」的那个东西</u>。</b><b>⇒ 它<u>有自己的动力学</u>：你走一步，<u>它变一个样子</u>。</b><b>⇒ <u>而「词表」只是一个固定的集合，它什么也不做</u>。</b><br><b>★★ 更准确的说法其实是：<u>在 LLM 这个场景里，environment 退化了</u></b>：<b>⇒ 状态转移是<u>完全确定的</u>：<u>旧状态 + 新 token = 新状态</u>，没有任何随机性。</b><b>⇒ <u>也没有对手、没有外部世界会打断你</u>。</b><br><b>⇒ <u>所以这是一个「环境几乎不存在」的 RL 问题 —— 全部的复杂度都在策略和奖励上</u>。</b><br><b>★★★ 这个退化是好事：<u>它让 RL 里最难的那部分（环境建模、探索）在这里都不成问题</u></b>：<b>⇒ <u>而这也解释了为什么 LLM 的 RL 能用 PPO 这种相对简单的算法做</u>。</b><br><b>⚠ 不过到了 L7 的智能体那一讲，<u>environment 会「活过来」—— 那时候模型要和真实的工具、网页交互</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("21:15","our policy here is simply equal to the output of the LLM given the input",166);
  note("⭐⭐⭐ 最关键的一格：policy 就是模型输出的那个概率分布",640,194,"y");
  stack(640,218,["而为了决定下一个 token 该是哪个，LLM 是用「下一个 token 的概率」来定的","⇒ 那个概率是「你做前向传播、看输出那个概率分布」时得到的","⭐ 而那「基本上就是我们的 policy」","⇒ 所以我们这里的策略，就「只等于：给定输入时 LLM 的那个输出」—— 用来决定下一个 token"],780,32,6);
  note("★★ 这一格是整张表的承重点：它意味着「训练策略」= 「训练这个 LLM」",640,380,"r");},"<b>这一格是整张对照表的承重点。</b><br><b>讲者的话</b>：<b>「<u>而为了决定接下来该是哪个 token，LLM 是用「下一个 token 的概率」来确定的，而那个概率是你做前向传播、并把输出的那个概率分布看一眼时得到的 —— 而那基本上就是我们的 policy。所以我们这里的策略，就只等于：给定输入时 LLM 的那个输出，用来确定下一个 token。到目前为止还好吗？</u>」</b><br><b>★★★ 为什么说这一格是承重点</b>：<b>⇒ 因为它让「<u>策略</u>」和「<u>模型</u>」变成了<u>同一个东西</u>。</b><b>⇒ 于是「<u>优化策略的参数 θ</u>」就等于「<u>训练这个 LLM</u>」。</b><b>⇒ <u>整套 RL 的机器，就这样被接到了一个普通的神经网络训练上</u>。</b><br><b>★★ 而这个对应之所以成立得这么干净，<u>是因为 LLM 本来就输出一个分布</u></b>：<b>⇒ 它<u>不是</u>先算出一个 token 再加随机性。</b><b>⇒ 它<u>天生就输出整个词表上的概率</u>。</b><br><b>⇒ <u>也就是说：LLM 在结构上本来就是一个随机策略，不需要任何改造</u>。</b><br><b>★★★ 这解释了一个常被问的问题：<u>为什么 RL 能这么自然地用在 LLM 上</u></b>：<b>⇒ <u>因为这个对应不是「硬套」，而是「本来就是」</u>。</b><br><b>⚠ 请记住 <u>π_θ(y | x)</u> 这个记号：<u>从现在起，它指的就是「模型在 prompt x 下生成回答 y 的概率」</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("21:44","we're going to use that for our reward",166);
  note("⭐ 最后一格：reward ⇒ 从偏好数据里来",640,194,"y");
  stack(640,218,["而现在我们要再加一样东西","⇒ 我跟你们说过，我们正在组建我们的偏好数据集","⇒ 而我们想知道「哪一个输出比另一个输出更好」","⭐ 所以我们要「拿那个来做我们的奖励」—— 而我们会看到我们要怎么用它"],780,32,6);
  note("★★ 注意他这里说得很含糊：「以某种方式拿它来做奖励」—— 因为中间还缺一步",640,380,"r");},"<b>最后一格，而讲者在这里说得特别含糊 —— 因为中间确实还缺一步。</b><br><b>讲者的话</b>：<b>「<u>而现在，我们要再加一样额外的东西。所以我跟你们说过，我们正在组建我们的偏好数据集。而我们想知道哪一个输出比另一个输出更好。所以我们要拿那个来做我们的奖励。我们要以某种方式拿那个来做我们的奖励。而我们会看到我们要怎么用它</u>。」</b><br><b>★★★ 他为什么要说两遍「<u>以某种方式</u>」：<u>因为偏好数据不能直接当奖励用</u></b>：<b>⇒ 偏好数据给的是「<u>A 比 B 好</u>」—— 这是一个<u>成对的、相对的</u>判断。</b><b>⇒ 而 RL 要的奖励是「<u>这个回答值多少分</u>」—— 一个<u>单个的、绝对的</u>数。</b><b>⇒ <u>两者的类型根本对不上</u>。</b><br><b>★★ 所以中间必须插一步，<u>而那一步就是「奖励模型」</u></b>：<b>⇒ 用偏好数据<u>训一个模型</u>，让它学会给<u>单个</u>回答打分。</b><b>⇒ 然后 RL 就可以<u>管这个模型要奖励</u>了。</b><br><b>⇒ <u>这就是为什么 RLHF 是「两段式」的 —— 而讲者在 26:35 就会说这件事</u>。</b><br><b>★★★ 请把这个缺口记住，<u>因为它正是 DPO 后来要消掉的那个东西</u></b>：<b>⇒ <u>DPO 的卖点就是：绕过奖励模型，直接从偏好对训策略</u>。</b><br><b>⚠ 讲者此刻还没说这个缺口，<u>但他的措辞已经把它透出来了</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  seq(120,222,["LLM 拿到输入","想预测下一个 token","用它输出的概率分布","生成的输出收到奖励"],["g","b","v","y"],265,44);
  note("⇒ 而那个奖励「会反馈回去，用来调这个 agent」—— 而这里的 agent 就是 LLM",640,312,"r");
  note("★★ 这是一个闭环：模型生成 ⇒ 被打分 ⇒ 用分数改模型 ⇒ 再生成",640,342,"v");
  note("⚠ 请对照 SFT：那里没有闭环，数据是固定的、模型不参与造数据",640,372,"d");},"<b>整个回路连起来，而它和 SFT 最大的差别就在「闭环」两个字。</b><br><b>讲者的话</b>：<b>「<u>所以我就把那一部分再总结一下。所以我们有我们的 LLM 拿到某个输入，然后它想预测下一个 token。它想采取这个动作。所以为了做到那一点，它用它输出的那个概率分布。然后，它预测出的那个 token、或者它生成出的那个输出，就会收到某个奖励 —— 而那个奖励会反馈回去，用来调这个 agent。而这里的 agent 就是那个 LLM</u>。」</b><br><b>★★★ 请把这个回路和 SFT 并排看，<u>差别一眼就出来了</u></b>：<b>⇒ <u>SFT</u>：数据是<u>固定的</u>，模型<u>不参与造数据</u> ⇒ <u>开环</u>。</b><b>⇒ <u>RL</u>：模型<u>自己生成</u> ⇒ 被打分 ⇒ 用分数改模型 ⇒ <u>再生成</u> ⇒ <u>闭环</u>。</b><br><b>★★ 这个闭环带来一个 SFT 没有的好处</b>：<b>⇒ 模型<u>每一步都在被它「当下真正会犯的错」纠正</u>。</b><b>⇒ 而 SFT 纠正的是「<u>当初造数据时它会犯的错</u>」—— <u>训着训着就不对版了</u>。</b><br><b>⇒ <u>这就是 on-policy 的价值，而后面会专门讲它</u>。</b><br><b>★★★ 但闭环也带来一个 SFT 没有的麻烦：<u>它可能跑偏，而且会越跑越偏</u></b>：<b>⇒ <u>因为模型在优化一个「代理指标」（奖励模型给的分），而不是真正的目标</u>。</b><b>⇒ <u>这就是 reward hacking —— 后面会专门讲</u>。</b><br><b>⚠ 讲者这里只画了回路，<u>而奖励从哪来这个缺口他要到 26:35 才补上</u>。</b>");
  SUM(0,13,{h:"⭐⭐ RL 的词翻译到 LLM",k:"对照表：<b>agent 就是这个 LLM；state 是「它目前为止拿到的输入」；action 是「预测下一个 token」（它总在想：给定这个输入，下一个 token 是什么）；而这个 token 是在「外面那一整套 token」里选的 ⇒ environment「可以是你词表里的那套 token」</b>；<b>而 LLM 用「下一个 token 的概率」来决定 —— 那个概率是你做前向传播、看输出那个概率分布时得到的，而那「基本上就是我们的 policy」</b>。还要加一样：<b>我们在组建偏好数据集、想知道哪个输出更好 ⇒ 我们要「以某种方式拿那个来做我们的奖励」</b>。整个回路：<b>LLM 拿到输入 ⇒ 想预测下一个 token ⇒ 用它输出的概率分布 ⇒ 生成的输出收到奖励 ⇒ 而那个奖励「会反馈回去，用来调这个 agent」</b>。",m:"★★★ 「policy = 模型输出的那个概率分布」是整张表的承重点：<b>它让「策略」和「模型」变成同一个东西 ⇒ 「优化策略的参数 θ」就等于「训练这个 LLM」—— 整套 RL 的机器就这样被接到了一个普通的神经网络训练上</b>；而这个对应之所以成立得这么干净：<b>因为 LLM 本来就输出一个分布 —— 它不是先算出一个 token 再加随机性，它天生就输出整个词表上的概率 ⇒ LLM 在结构上本来就是一个随机策略，不需要任何改造</b> ⇒ <b>这解释了「为什么 RL 能这么自然地用在 LLM 上」：这个对应不是「硬套」，而是「本来就是」</b>。",w:"★★★ 「state = 目前为止的输入」要特别留意，它和直觉里的「状态」不一样：<b>它不是隐藏层、不是 KV cache、不是任何内部变量，就是「到此刻为止的那一串 token」—— 状态是「外部可见的文本」而不是「模型内部的东西」</b> ⇒ 好处是<b>这个 RL 问题完全可观测（没有隐藏状态的麻烦）</b>；而且<b>状态是「只增不减」的：每走一步就变长一个 token，而且从不回退 —— 这和下棋完全不同，正是「没有回溯」那个性质的来源</b>。而 environment 那一格最牵强（讲者自己说「如果你愿意的话」）：<b>标准 RL 里 environment 是「会对你的动作作出反应」的东西、有自己的动力学，而「词表」只是一个固定集合、什么也不做 ⇒ 更准确的说法是「在 LLM 这个场景里 environment 退化了」：状态转移完全确定（旧状态 + 新 token = 新状态），没有随机性、没有对手 ⇒ 全部复杂度都在策略和奖励上，这也解释了为什么 LLM 的 RL 能用 PPO 这种相对简单的算法做</b>（到 L7 的智能体那一讲，environment 会「活过来」）。",r:"★★★ 他为什么两遍说「以某种方式」拿偏好来做奖励：<b>因为偏好数据不能直接当奖励用 —— 偏好数据给的是「A 比 B 好」（成对的、相对的判断），而 RL 要的奖励是「这个回答值多少分」（单个的、绝对的数），两者类型根本对不上</b> ⇒ 所以中间必须插一步，<b>而那一步就是「奖励模型」：用偏好数据训一个模型、让它学会给单个回答打分，然后 RL 就可以管它要奖励 —— 这就是 RLHF 为什么是「两段式」的</b>；⚠ <b>请把这个缺口记住，它正是 DPO 后来要消掉的东西（DPO 的卖点就是绕过奖励模型，直接从偏好对训策略）</b>。⇒ 而那个回路和 SFT 的差别在「闭环」：<b>SFT 的数据固定、模型不参与造数据（开环）；RL 是模型自己生成 ⇒ 被打分 ⇒ 用分数改模型 ⇒ 再生成（闭环）</b> ⇒ <b>好处是模型每一步都在被它「当下真正会犯的错」纠正（这就是 on-policy 的价值）；麻烦是它可能跑偏而且越跑越偏，因为它在优化一个代理指标而不是真正的目标 —— 这就是 reward hacking</b>。"});
  QUIZ(0,13,{t:"RL 的 policy 对应到 LLM 里的什么？为什么这个对应特别重要？",o:["对应模型的隐藏层；重要是因为它可训练","对应词表","对应「前向传播输出的那个概率分布」—— 它让「策略」和「模型」成了同一个东西，于是优化 θ 就等于训练这个 LLM","对应解码策略（贪心/采样）"],a:2,w:"⇒ 这个对应成立得这么干净，是因为 LLM 天生就输出整个词表上的概率 —— 它在结构上本来就是一个随机策略，不需要任何改造。"});

  note("⚠ 而「加了一些部件」这句话，正是后面那个「要养四个模型」的伏笔",640,382,"r");},"<b>他给的参照系是「和别的训练比」，而最后一句是整讲最大的伏笔之一。</b><br><b>讲者的话</b>：<b>「<u>但你可以把这件事想成一种训练过程，它可以被看成和其它某些训练过程一样贵。并没有什么东西让这件事更贵，不过我们会看得更准确一些。所以我觉得你触到的那几个点都是对的。相比常规的有监督 —— 比如说，有监督微调的设定，这里确实加了一些部件。而我们马上就会看到那个</u>。」</b><br><b>★★★ 这个回答有两层，<u>而第二层比第一层重要得多</u></b>：<b>⇒ <u>第一层</u>（安慰）：单步的训练开销<u>和普通训练同一个量级</u>。</b><b>⇒ <u>第二层</u>（实话）：「<u>相比 SFT，这里确实加了一些部件</u>」。</b><br><b>★★ 而那些「<u>部件</u>」具体是什么，讲者在 <u>40 分钟左右</u>会一个个摆出来</b>：<b>⇒ <u>策略模型</u>（在训的那个）。</b><b>⇒ <u>参考模型</u>（算 KL 用，冻住）。</b><b>⇒ <u>奖励模型</u>（打分用，冻住）。</b><b>⇒ <u>价值模型</u>（估 advantage 用，在训）。</b><br><b>⇒ <u>四个模型同时在显存里 —— 这才是 RLHF 真正贵的地方，而不是单步的计算量</u>。</b><br><b>★★★ 所以准确的说法是：<u>RLHF 不是「每一步更贵」，而是「要同时养更多东西」</u></b>：<b>⇒ <u>而这正是 DPO 后来能大幅省钱的原因：它把四个砍到两个</u>。</b><br><b>⚠ 请记住这句伏笔 —— <u>它在这一讲里会被兑现两次（讲四个模型时、讲 DPO 时）</u>。</b>");

  note("★★ 这个对比可以量化：SFT 每条样本给几百上千个信号，RLHF 只给一个",640,380,"r");},"<b>这个追问问到了 RLHF 最根本的一个弱点。</b><br><b>讲者的话</b>：<b>「<u>所以问题是，你从这里拿到的那个奖励，强到足以让 LLM 改变吗？嗯，你在网上会看到一些说法，把这个训练过程形容成：它的信号几乎远不如你在 SFT 里拿到的那么多。因为对 SFT 来说，你字面上一直在拿一个部分输入，并让 LLM 学会怎么生成下一个 token。但在这里，你每一条 completion 大概只拿到一个信号</u>。」</b><br><b>★★★ 把这个对比量化，<u>差距大得惊人</u></b>:<b>⇒ <u>SFT</u>：一条 500 token 的回答 ⇒ <u>500 个位置，每个位置都有一个交叉熵损失</u> ⇒ <u>500 个信号</u>。</b><b>⇒ <u>RLHF</u>：同一条回答 ⇒ <u>整条给一个标量奖励</u> ⇒ <u>1 个信号</u>。</b><br><b>★★ 所以同样是「生成 500 个 token」，<u>两边拿到的监督量差了 500 倍</u></b>：<b>⇒ 这意味着 RLHF <u>需要多得多的样本</u>才能学到东西。</b><b>⇒ <u>而每个样本都要真的让模型生成一遍 —— 这才是它贵的另一半原因</u>。</b><br><b>★★★ 而更麻烦的是「<u>功劳分配</u>」这个问题</b>：<b>⇒ 一条回答得了低分 ⇒ <u>是哪个 token 错了？</u></b><b>⇒ <u>这一个标量不告诉你</u>。</b><b>⇒ <u>而这正是后面 advantage 和 value function 要解决的事</u>。</b><br><b>⚠ 讲者说「<u>你在网上会看到一些说法</u>」—— <u>他在引用社区共识，而不是给自己的论断</u>。</b>");

  note("⚠ 顺带他又复述了一遍：s_t 是你所处的状态，a_t 是你想采取的动作",640,374,"d");},"<b>一个词定性，外加第三个追问的答案 —— 而讲者把它说了两遍。</b><br><b>讲者的话</b>：<b>「<u>所以对，它确实更稀疏。而这就是为什么你会看到，RLHF 被看成一种更像是信号稀疏的方法。……所以问题是，你是对每一个 token 施加奖励，还是对整条？我们会更详细地看这个，但它是对整条的。它是对整条的。不过我们马上就会看到</u>。」</b><br><b>★★★ 「<u>奖励是给整条的</u>」这个事实，<u>后面会被反复用到</u></b>：<b>⇒ 它直接导致了<u>功劳分配</u>问题（哪个 token 该为这个分数负责）。</b><b>⇒ 它是 <u>advantage 和 value function 存在的理由</u>。</b><b>⇒ <u>它也是 DPO 能成立的前提 —— 因为整条一个分数，才能和「整条的概率」对上</u>。</b><br><b>★★ 顺带，讲者还回答了一个关于符号的追问，<u>并复述了一遍</u></b>：<b>⇒ <u>s_t</u> 是「<u>你所处的那个状态</u>」—— 在 LLM 里就是<u>目前为止的输入</u>。</b><b>⇒ <u>a_t</u> 是「<u>你想采取的那个动作</u>」—— 在 LLM 里就是<u>你想生成哪个 token</u>。</b><br><b>⇒ <u>他复述得这么仔细，是因为接下来的公式全是用这两个符号写的</u>。</b><br><b>★★★ 把这三个追问放在一起看，它们正好问出了 RLHF 的三个真实弱点</b>：<b>⇒ <u>贵</u>（要多养几个模型）· <u>信号稀疏</u>（每条只有一个标量）· <u>功劳分配难</u>（奖励给的是整条）。</b><br><b>⚠ 而这三条，正是后面那「五个挑战」里的三条。</b>");
  SUM(0,14,{h:"⭐⭐ 贵不贵、信号够不够",k:"追问一：<b>对所有的对都这么做不会很贵吗？⇒ 人们会「用批」；不过「它确实是贵的」—— 但你可以把它想成一种训练过程，「可以被看成和其它某些训练过程一样贵」，「并没有什么东西让这件事更贵」；⚠ 不过「相比常规的有监督微调设定，这里确实加了一些部件」</b>。追问二：<b>这个奖励强到足以让 LLM 改变吗？⇒ 你在网上会看到说法，把它形容成「信号远不如 SFT 那么多」—— 因为 SFT 里你「字面上一直在拿一个部分输入、让 LLM 学会生成下一个 token」，而「这里你每一条 completion 大概只拿到一个信号」⇒ 它「确实更稀疏」，所以 RLHF 被看成「一种信号稀疏的方法」</b>。追问三：<b>奖励是每个 token 一个还是整条一个？⇒ 「是对整条的。是对整条的。」</b>",m:"★★★ 把信号量的对比量化，差距大得惊人：<b>SFT 一条 500 token 的回答有 500 个位置、每个位置一个交叉熵损失 ⇒ 500 个信号；RLHF 同一条回答整条只给一个标量奖励 ⇒ 1 个信号</b> ⇒ <b>同样生成 500 个 token，两边拿到的监督量差 500 倍 —— 这意味着 RLHF 需要多得多的样本才能学到东西，而每个样本都要真的让模型生成一遍，这才是它贵的另一半原因</b>；而更麻烦的是<b>功劳分配：一条回答得了低分，是哪个 token 错了？这一个标量不告诉你 —— 而这正是后面 advantage 和 value function 要解决的事</b>。",w:"★★★ 「贵不贵」那个回答有两层，而第二层比第一层重要得多：<b>第一层（安慰）单步训练开销和普通训练同一个量级；第二层（实话）「相比 SFT，这里确实加了一些部件」</b> ⇒ 那些「部件」讲者在 40 分钟左右会一个个摆出来：<b>策略模型（在训）、参考模型（算 KL，冻住）、奖励模型（打分，冻住）、价值模型（估 advantage，在训）—— 四个模型同时在显存里，这才是 RLHF 真正贵的地方，而不是单步的计算量</b> ⇒ <b>准确的说法是：RLHF 不是「每一步更贵」，而是「要同时养更多东西」—— 而这正是 DPO 后来能大幅省钱的原因：它把四个砍到两个</b>。",r:"★★★ 「奖励是给整条的」这个事实后面会被反复用到：<b>它直接导致功劳分配问题（哪个 token 该为这个分数负责）；它是 advantage 和 value function 存在的理由；它也是 DPO 能成立的前提 —— 因为整条一个分数，才能和「整条的概率」对上</b>。⇒ 把三个追问放在一起看，它们正好问出了 RLHF 的三个真实弱点：<b>贵（要多养几个模型）· 信号稀疏（每条只有一个标量）· 功劳分配难（奖励给的是整条）—— 而这三条正是后面那「五个挑战」里的三条</b>。⚠ <b>「用批」这个回答有点避重就轻（batch 是任何训练都会做的事，不解决 RLHF 特有的开销），而讲者自己也意识到了，所以紧接着补了「它确实是贵的」</b>。"});
  QUIZ(0,14,{t:"为什么说 RLHF 是「信号稀疏」的方法？",o:["因为只有一部分 token 参与训练","因为 SFT 的一条 500-token 回答给 500 个位置的损失，而 RLHF 整条只给一个标量奖励 —— 差 500 倍","因为偏好数据太少","因为奖励常常是 0"],a:1,w:"⇒ 而「奖励给的是整条」还带来功劳分配问题（哪个 token 错了？这一个标量不告诉你）—— 这正是后面 advantage 和 value function 要解决的。"});

  note("⇒ 到这里都还好吗？好的，完美。",640,374,"d");},"<b>一个符号上的追问，而讲者复述得特别仔细 —— 这是有原因的。</b><br><b>讲者的话</b>：<b>「<u>所以问题是，AT 和 ST 是什么。所以提醒一下：ST 是你所处的那个状态，而 AT 是你想采取的那个动作。所以在一个 LLM 的语境下，对 LLM 来说你所处的状态，就是你目前为止拿到的那个输入。而动作就是：给定那个输入，你想生成哪一个 token。到这里都还好吗？好的，完美</u>。」</b><br><b>★★★ 他复述得这么细，<u>是因为接下来的每一条公式都是用这两个符号写的</u></b>：<b>⇒ <u>π_θ(a_t | s_t)</u> —— 策略。</b><b>⇒ <u>r(s_t, a_t)</u> —— 奖励。</b><b>⇒ <u>V(s_t)</u> —— 价值函数（后面会讲）。</b><b>⇒ <u>一个符号没对上，后面整段就看不懂了</u>。</b><br><b>★★ 而这里有一个对自学者特别有用的翻译：<u>把 RL 的符号换成 LLM 的说法</u></b>：<b>⇒ <u>s_t</u> ⇒ 「<u>prompt 加上已经生成的那部分</u>」。</b><b>⇒ <u>a_t</u> ⇒ 「<u>下一个 token</u>」。</b><b>⇒ <u>一个「轨迹」（trajectory）⇒ 「一整条生成出来的回答」</u>。</b><br><b>⇒ <u>你只要把这三条记住，后面所有 RL 公式都能直接读成 LLM 的话</u>。</b><br><b>⚠ 这一讲的 RL 符号用得很克制，<u>但它确实是整讲里门槛最高的一段</u>。</b>");

  stack(640,218,["既然我们大致知道了「LLM 版 RL」的心智模型长什么样","⭐ 我想再强调一次：我们试图达成的，是「学会怎么把这个策略和奖励对齐」","⇒ 所以我们想学的是 θ —— 而 θ 就是「我们 LLM 的那些参数」","⇒ 使得 π_θ「和偏好对齐」"],780,32,6);
  note("★★ 而「这就是 RLHF 登场的地方」—— RLHF = Reinforcement Learning from Human Feedback",640,380,"r");},"<b>目标被写成了一句可执行的话，而名字也终于被拆开了。</b><br><b>讲者的话</b>：<b>「<u>所以既然我们稍微知道了「基于 LLM 的 RL」的心智模型可能是什么样，我只想再强调一次：我们试图达成的，是学会怎么把这个策略和奖励对齐。所以我们想学 theta，而 theta 是我们 LLM 的参数，使得 pi of theta 和偏好对齐。而这就是 RLHF 登场的地方。所以 RLHF 代表 Reinforcement Learning from Human Feedback</u>。」</b><br><b>★★★ 请注意这句话把一个模糊的愿望变成了一个<u>可执行的优化问题</u></b>：<b>⇒ <u>模糊的愿望</u>：「让模型的回答更符合人的偏好」。</b><b>⇒ <u>可执行的问题</u>：「<u>找一组参数 θ，使 π_θ 和偏好对齐</u>」。</b><br><b>★★ 这正是 L4 下半场那条主线的又一次出现：<u>把一个模糊的要求变成可优化的东西</u></b>：<b>⇒ 「<u>预测下一个 token</u>」⇒ 完全可优化。</b><b>⇒ 「<u>当个有用的助手</u>」⇒ 用示范数据变得可优化。</b><b>⇒ 「<u>符合人的偏好</u>」⇒ <u>用偏好对 + 奖励模型变得可优化</u>。</b><br><b>⇒ <u>而每往前一步，「可优化」这件事都要多绕一个弯 —— 这一讲绕的弯最多</u>。</b><br><b>⚠ 「<u>Reinforcement Learning from Human Feedback</u>」这个全称里，<u>每一个词在接下来都会被单独拆开讲 —— 包括最后那个 Feedback</u>。</b>");

  note("★★ 请注意这一步把「成对的偏好」变成了「单条的分数」—— 这正是前面那个缺口被补上的地方",640,380,"r");},"<b>第一段，而它正是前面那个缺口被补上的地方。</b><br><b>讲者的话</b>：<b>「<u>而它典型地由两个阶段组成。所以第一个阶段是你搞清楚怎么把好的输出和坏的输出区分开。所以这里，你收集的所有那些偏好对，其实就是用来让你学会什么是好、什么是坏的。所以这里的输入，是 prompt 和 response 的拼接。而输出是一个分数。所以你想知道的是：给定一个 prompt 和一个回答，它有多好</u>。」</b><br><b>★★★ 请注意这一步在做的<u>类型转换</u>，而它正是 21:44 那个缺口</b>：<b>⇒ <u>进去的</u>：成对的、相对的判断（<u>A 比 B 好</u>）。</b><b>⇒ <u>出来的</u>：单条的、绝对的分数（<u>这条值 r 分</u>）。</b><b>⇒ <u>而 RL 需要的正是后者</u>。</b><br><b>★★ 所以奖励模型的角色可以写成一句话：<u>它是「把偏好翻译成奖励」的那个翻译器</u></b>：<b>⇒ <u>没有它，RL 就接不上偏好数据</u>。</b><b>⇒ <u>而正因为它是一个「中间物」，DPO 后来才能想办法把它消掉</u>。</b><br><b>★★★ 还要注意输入是「<u>prompt 和 response 拼接</u>」而不是只有 response</b>：<b>⇒ 这呼应了 14:54 那一镜说的：<u>一个回答离开提问就无从判断好坏</u>。</b><b>⇒ <u>所以奖励模型吃的是一整条序列</u>。</b><br><b>⚠ 「<u>两个阶段</u>」这件事很关键：<u>RLHF 不是一个算法，它是一条两段式的流水线</u>。</b>");

  note("★★ 这里的输入是那些 prompt，而你想做的是「生成一个更对齐那些奖励的 ŷ」",640,374,"r");},"<b>第二段才是真正的 RL，而两段的分工非常清楚。</b><br><b>讲者的话</b>：<b>「<u>然后第二步是 RL 那一步，强化学习那一步。而这就是你用那些奖励，把你的模型对齐到偏好上的地方。所以这里作为输入，你有那些 prompt。而你想以某种方式做到的，是能够生成一个更对齐那些奖励的 y hat</u>。」</b><br><b>★★★ 把两段的分工写清楚，<u>这是理解 RLHF 的骨架</u></b>：<b>⇒ <u>第一段（奖励建模）</u>：输入<u>偏好对</u> ⇒ 输出<u>一个会打分的模型</u>。</b><b>⇒ <u>第二段（RL）</u>：输入<u>prompt + 那个打分模型</u> ⇒ 输出<u>一个被对齐过的策略</u>。</b><br><b>★★ 注意第二段的输入里<u>没有「标准答案」</u></b>：<b>⇒ 它只有 <u>prompt</u>。</b><b>⇒ 回答是<u>模型自己生成的</u>。</b><b>⇒ 然后<u>奖励模型给它打分</u>，分数再回过头改模型。</b><br><b>⇒ <u>这就是为什么 RL 这一步是「闭环」的，而 SFT 是「开环」的</u>。</b><br><b>★★★ 而这也解释了为什么第一段必须先做完：<u>没有打分器，第二段的闭环就转不起来</u></b>：<b>⇒ <u>两段是严格串行的，不能同时训</u>。</b><br><b>⚠ 「<u>更对齐那些奖励</u>」这个说法要留个心眼：<u>它说的是「对齐奖励」，不是「对齐人的偏好」</u>。</b><b>⇒ <u>这两者之间的缝隙，正是 reward hacking 钻进来的地方</u>。</b>");
  SUM(0,15,{h:"⭐⭐ RLHF 的两段式",k:"符号复述：<b>s_t 是「你所处的那个状态」—— 在 LLM 里是「你目前为止拿到的那个输入」；a_t 是「你想采取的那个动作」—— 在 LLM 里是「给定那个输入，你想生成哪一个 token」</b>。目标：<b>我们试图达成的是「学会怎么把这个策略和奖励对齐」—— 我们想学 θ（我们 LLM 的那些参数），使得 π_θ「和偏好对齐」⇒ 而这就是 RLHF（Reinforcement Learning from Human Feedback）登场的地方</b>。两段式：<b>第一阶段是「你搞清楚怎么把好的输出和坏的输出区分开」—— 你收集的那些偏好对就是用来学「什么是好、什么是坏」的；输入是「prompt 和 response 拼接」，输出是「一个分数」；第二步是「RL 那一步」—— 这是「你用那些奖励，把你的模型对齐到偏好上」的地方，输入是那些 prompt，而你想生成「一个更对齐那些奖励的 ŷ」</b>。",m:"★★★ 第一段在做一个<b>类型转换</b>，而它正是前面那个缺口：<b>进去的是成对的、相对的判断（A 比 B 好），出来的是单条的、绝对的分数（这条值 r 分）—— 而 RL 需要的正是后者</b> ⇒ <b>奖励模型的角色可以写成一句话：它是「把偏好翻译成奖励」的那个翻译器 —— 没有它 RL 就接不上偏好数据；而正因为它是一个「中间物」，DPO 后来才能想办法把它消掉</b>。还要注意输入是「prompt 和 response 拼接」而不是只有 response：<b>一个回答离开提问就无从判断好坏，所以奖励模型吃的是一整条序列</b>。",w:"★★★ 两段的分工是理解 RLHF 的骨架：<b>第一段（奖励建模）输入偏好对 ⇒ 输出一个会打分的模型；第二段（RL）输入 prompt + 那个打分模型 ⇒ 输出一个被对齐过的策略</b> ⇒ 注意第二段的输入里<b>没有标准答案</b>：<b>它只有 prompt，回答是模型自己生成的，然后奖励模型给它打分、分数再回头改模型 —— 这就是为什么 RL 这一步是「闭环」而 SFT 是「开环」</b> ⇒ <b>这也解释了为什么第一段必须先做完：没有打分器，第二段的闭环就转不起来，两段是严格串行的</b>。⚠ 「更对齐那些奖励」要留心眼：<b>它说的是「对齐奖励」而不是「对齐人的偏好」—— 这两者之间的缝隙，正是 reward hacking 钻进来的地方</b>。",r:"★★★ 「找一组参数 θ 使 π_θ 和偏好对齐」把一个模糊的愿望变成了一个<b>可执行的优化问题</b>，而这正是 L4 下半场那条主线的又一次出现：<b>「预测下一个 token」完全可优化；「当个有用的助手」用示范数据变得可优化；「符合人的偏好」用偏好对 + 奖励模型变得可优化 —— 每往前一步，「可优化」都要多绕一个弯，而这一讲绕的弯最多</b>。⇒ 对自学者有用的符号翻译：<b>s_t ⇒「prompt 加上已经生成的那部分」；a_t ⇒「下一个 token」；一个「轨迹」⇒「一整条生成出来的回答」—— 记住这三条，后面所有 RL 公式都能直接读成 LLM 的话</b>。"});
  QUIZ(0,15,{t:"RLHF 的「两段式」各做什么？",o:["两段可以同时训练","第一段做 SFT，第二段做偏好调优","第一段训策略，第二段训奖励","第一段用偏好对训一个「会给单条回答打分」的奖励模型；第二段用那个分数去调策略 —— 而两段严格串行"],a:3,w:"⇒ 第一段做的是类型转换：把「A 比 B 好」这种成对相对判断，变成 RL 需要的「这条值 r 分」。而正因为它是中间物，DPO 后来才能消掉它。"});

KP("16 · ⭐ Human Feedback 指的是什么，以及奖励模型要做的事",function(){

  note("★★ 请注意：那个 H 不在 RL 那一步，而在「奖励模型的标签」那一步",640,380,"r");},"<b>这个澄清很有用：名字里那个 H，指的不是你以为的那一步。</b><br><b>讲者的话</b>：<b>「<u>而顺带，我只想点出一件事。所以 RLHF 是 Reinforcement Learning from Human Feedback。那个 Human Feedback 的部分，指的是奖励模型被训练时所用的那些标签。所以如果那些偏好对是基于人工评分的，那我们就是在依赖人类偏好，那我们就处在 RLHF 里</u>。」</b><br><b>★★★ 很多人会以为那个 H 指的是「<u>训练过程中有人在环里</u>」，<u>而那是错的</u></b>：<b>⇒ <u>RL 那一步里完全没有人</u> —— 它是一个全自动的优化循环。</b><b>⇒ 人只出现在<u>更早的那一步</u>：<u>给偏好对打标签</u>。</b><b>⇒ <u>而那些标签早就标完了、冻在数据集里了</u>。</b><br><b>★★ 所以准确的说法是：<u>人类反馈是「离线」的，不是「在线」的</u></b>：<b>⇒ 它<u>在训练开始前就已经全部收集好</u>。</b><b>⇒ <u>训练时模型面对的是奖励模型，而不是人</u>。</b><br><b>⇒ <u>这件事很重要，因为它意味着：训练中的模型可以学会「骗过奖励模型」，而没有人会当场发现</u>。</b><br><b>★★★ 这就是 reward hacking 的结构性原因：<u>人退场了，而代理留了下来</u>。</b><br><b>⚠ 顺带也说明了为什么实践中要「<u>定期重新收集偏好数据</u>」—— <u>让人周期性地回到环里</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("28:10","a Reinforcement Learning from AI Feedback",166);
  note("⭐ 换一个字母，就是另一类方法：RLAIF",640,194,"y");
  boxNode(60,222,560,44,"RLHF：Human Feedback","g");
  note("偏好对「基于人工评分」",340,292,"g");

  note("★★ 讲者：因为你在外面也会看到 RL —— 比如说 —— AIF",640,336,"v");
  note("⚠ 所以这两个名字的差别只在「标签是谁给的」，而框架完全一样",640,374,"r");},"<b>换一个字母就是另一类方法，而它们的框架完全一样。</b><br><b>讲者的话</b>：<b>「<u>因为你在外面也会看到，还有 RL，比如说，AIF，也就是 Reinforcement Learning from AI Feedback。而那一个依赖的是非人类的偏好</u>。」</b><br><b>★★★ 这两个名字的差别<u>只在「标签是谁给的」</u>，而 RL 那一整套机器完全一样</b>：<b>⇒ <u>RLHF</u>：人标的偏好对 ⇒ 训奖励模型 ⇒ RL。</b><b>⇒ <u>RLAIF</u>：<u>另一个模型</u>标的偏好对 ⇒ 训奖励模型 ⇒ RL。</b><b>⇒ <u>第二段一个字都不用改</u>。</b><br><b>★★ 而 RLAIF 为什么重要：<u>它是唯一能把这件事做到「百万条量级」的办法</u></b>：<b>⇒ 人标一对：<u>几十秒、要付钱</u>。</b><b>⇒ 模型标一对：<u>几秒、几分之一美分</u>。</b><br><b>⇒ <u>而这正好接回 15:25 那一镜说的 LLM as a judge —— RLAIF 就是把它用在了偏好标注上</u>。</b><br><b>★★★ 但它有一个绕不开的问题：<u>谁来保证那个 AI 评委的偏好是对的</u></b>：<b>⇒ 一个常见的做法是 <u>Constitutional AI</u>：<u>给评委模型写一份明文的原则清单，让它照着判</u>。</b><b>⇒ <u>于是「人的意志」从「标每一条」变成了「写一份宪法」</u>。</b><br><b>⚠ 讲者这里只是点一句名字，<u>但这条线今天已经是主流了</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,218,["好，既然我们知道了 RLHF 是什么、也知道它有两步，我们就「很自然地先过第一步」","⭐ 这里的想法是：我们想「造一个知道哪个输出好、哪个输出坏的模型」","⚠ 而我们当然想要的，是「不只考虑输出，也要考虑输入」","⇒ 因为「你得以某种方式给那个回答一个上下文」"],780,32,6);
  note("★★ 「给那个回答一个上下文」—— 这是这一镜唯一真正新的信息，而它决定了模型的输入格式",640,380,"r");},"<b>进入第一段，而唯一真正新的信息是「要带上下文」。</b><br><b>讲者的话</b>：<b>「<u>酷。好，所以既然我们知道了 RLHF 是什么、也知道有两个步骤，我们就很自然地先过第一步。所以这里的想法是，我们想造一个知道哪个输出是好的、哪个输出是坏的模型。而当然，这里我们想要的，是不只考虑那个输出，也要考虑那个输入 —— 因为你得以某种方式给那个回答一个上下文</u>。」</b><br><b>★★★ 「<u>给回答一个上下文</u>」这件事在实现上是实打实的</b>：<b>⇒ 奖励模型的输入是 <u>把 prompt 和 response 拼成一整条序列</u>。</b><b>⇒ 它<u>不是</u>「只看回答」。</b><b>⇒ <u>所以同一句回答配不同的 prompt，分数可以完全不同</u>。</b><br><b>★★ 举个极端的例子就清楚了</b>：<b>⇒ 回答「<u>不行，你应该手洗</u>」。</b><b>⇒ 配 prompt「<u>泰迪熊能机洗吗</u>」⇒ <u>高分</u>。</b><b>⇒ 配 prompt「<u>给我写一首诗</u>」⇒ <u>低分</u>。</b><br><b>⇒ <u>所以奖励模型学的根本不是「什么是好句子」，而是「什么是对这个问题的好回答」</u>。</b><br><b>⚠ 这也是为什么奖励模型必须是一个<u>语言模型</u>（而不是一个简单的分类器）：<u>它得读懂 prompt 和 response 之间的关系</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("29:30","we want to somehow have a model that takes in the prompts and the good response and say it's good",166);
  note("⭐⭐ 奖励模型要做的事，用泰迪熊说一遍",640,194,"y");

  note("★★ prompt 是：「建议一个我能和我的泰迪熊一起做的新活动」",640,336,"y");
  note("⚠ 接着的问题就是：「那你怎么造出这样一个模型？」",640,374,"v");},"<b>用泰迪熊把奖励模型要做的事说了一遍，然后抛出那个关键问题。</b><br><b>讲者的话</b>：<b>「<u>所以我们还是用我们最喜欢的那个例子。所以假设你有下面这个 prompt：建议一个我能和我的泰迪熊一起做的新活动。所以你想要的，是有一个奖励模型 —— 这里我们记作 RM —— 它告诉你，我们改写出来的那个好答案是好的。而我们也想有那个模型告诉我们，我们看到的那个坏输出是坏的。所以我们想以某种方式有一个模型，它吃进 prompt 和那个好回答，然后说它是好的；再吃进 prompt 和那个坏回答，然后说它是坏的。所以现在的问题是，你怎么造出这样一个模型？</u>」</b><br><b>★★★ 请注意这个需求的描述里<u>还没有任何数字</u></b>：<b>⇒ 他只说「<u>说它是好的</u>」「<u>说它是坏的</u>」。</b><b>⇒ <u>没有说「好的给 8 分、坏的给 2 分」</u>。</b><b>⇒ <u>因为那个分数的「绝对值」根本不重要 —— 重要的只是「好的那个比坏的那个高」</u>。</b><br><b>★★ 这一点在下一段会被 Bradley-Terry 正式地利用</b>：<b>⇒ BT 公式里<u>只出现 r_i − r_j</u>。</b><b>⇒ <u>也就是说：你把所有分数同时加 100，公式的值一点不变</u>。</b><br><b>⇒ <u>奖励模型的分数只有「相对意义」，没有「绝对意义」—— 这是一个很容易被误解的点</u>。</b><br><b>★★★ 所以如果你看到一个奖励模型给某条回答打了 <u>3.7 分</u>，<u>那个 3.7 本身什么也不说明</u></b>：<b>⇒ <u>只有和另一条比，它才有意义</u>。</b><br><b>⚠ 而这又一次是「<u>放弃绝对量、保留相对量</u>」那条判断 —— <u>这一讲第四次</u>。</b>");
  SUM(0,16,{h:"⭐ Human Feedback 与奖励模型要做的事",k:"名字：<b>RLHF 是 Reinforcement Learning from Human Feedback，而那个 Human Feedback 的部分「指的是奖励模型被训练时所用的那些标签」—— 如果那些偏好对「是基于人工评分的」，那我们就在依赖人类偏好，就处在 RLHF 里</b>；<b>因为你在外面也会看到 RLAIF（Reinforcement Learning from AI Feedback），「那一个依赖的是非人类的偏好」</b>。第一步：<b>我们想「造一个知道哪个输出好、哪个输出坏的模型」—— 而我们想要的是「不只考虑输出，也要考虑输入」，因为「你得以某种方式给那个回答一个上下文」</b>；用泰迪熊说一遍：<b>一个奖励模型（记作 RM），吃进 prompt 和那个好回答说它好、吃进 prompt 和那个坏回答说它坏 ⇒ 那问题就是：你怎么造出这样一个模型？</b>",m:"★★★ 很多人以为那个 H 指的是「训练过程中有人在环里」，<b>而那是错的</b>：<b>RL 那一步里完全没有人（它是一个全自动的优化循环），人只出现在更早的那一步 —— 给偏好对打标签，而那些标签早就标完、冻在数据集里了</b> ⇒ <b>准确的说法是：人类反馈是「离线」的不是「在线」的 —— 训练时模型面对的是奖励模型而不是人 ⇒ 这意味着训练中的模型可以学会「骗过奖励模型」，而没有人会当场发现，这就是 reward hacking 的结构性原因：人退场了，而代理留了下来</b>（也说明了为什么实践中要定期重新收集偏好数据，让人周期性地回到环里）。",w:"★★★ 请注意那个需求的描述里<b>还没有任何数字</b>：<b>他只说「说它是好的」「说它是坏的」，没说「好的给 8 分、坏的给 2 分」—— 因为分数的「绝对值」根本不重要，重要的只是「好的那个比坏的那个高」</b> ⇒ 这在下一段会被 Bradley-Terry 正式利用：<b>BT 公式里只出现 r_i − r_j ⇒ 你把所有分数同时加 100，公式的值一点不变 ⇒ 奖励模型的分数只有「相对意义」没有「绝对意义」</b> ⇒ <b>所以你看到一个奖励模型打了 3.7 分，那个 3.7 本身什么也不说明，只有和另一条比才有意义</b>（而这又是「放弃绝对量、保留相对量」那条判断 —— 这一讲第四次）。",r:"⇒ RLHF 和 RLAIF 的差别<b>只在「标签是谁给的」</b>，RL 那一整套机器完全一样：<b>RLHF 是人标的偏好对，RLAIF 是另一个模型标的 —— 第二段一个字都不用改</b>；RLAIF 为什么重要：<b>它是唯一能把这件事做到「百万条量级」的办法（人标一对几十秒还要付钱，模型标一对几秒、几分之一美分）—— 这正好接回 LLM as a judge</b>；但它有个绕不开的问题：<b>谁来保证那个 AI 评委的偏好是对的？一个常见做法是 Constitutional AI：给评委模型写一份明文的原则清单让它照着判 ⇒ 于是「人的意志」从「标每一条」变成了「写一份宪法」</b>。⇒ 而「给回答一个上下文」在实现上是实打实的：<b>奖励模型的输入是把 prompt 和 response 拼成一整条序列 —— 同一句回答配不同 prompt 分数可以完全不同（「不行，你应该手洗」配「泰迪熊能机洗吗」是高分，配「给我写一首诗」是低分）⇒ 奖励模型学的根本不是「什么是好句子」，而是「什么是对这个问题的好回答」—— 这也是为什么它必须是一个语言模型而不是一个简单分类器</b>。"});
  QUIZ(0,16,{t:"RLHF 名字里那个「Human Feedback」指的是哪一步？",o:["指「奖励模型被训练时所用的那些标签」—— 人只在更早的标注那步出现，RL 那步里完全没有人","指人工设计的奖励函数","RL 训练过程中有人实时打分","指用户在产品里的点赞点踩"],a:0,w:"⇒ 所以人类反馈是「离线」的：训练时模型面对的是奖励模型而不是人 —— 这意味着它可以学会骗过奖励模型而没人当场发现，这正是 reward hacking 的结构性原因。"});

KP("17 · ⭐⭐⭐ Bradley-Terry：把「谁更好」写成一个概率",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,218,["所以现在的问题是：「你怎么造出这样一个模型？」","⭐ 为了做到那一点，我们用的是一个叫做 Bradley-Terry 表述的东西","⇒ 「那是一条重要的公式」","⇒ 「所以我们就在这里停一会儿」"],780,32,6);
  note("★★ 这一讲里他只对两处说过「停一会儿」—— 而这是第一处",640,380,"r");},"<b>讲者少见地说「我们在这儿停一会儿」—— 这是一个信号。</b><br><b>讲者的话</b>：<b>「<u>所以现在的问题是，你怎么造出这样一个模型？嗯，为了做到那一点，我们用的是一个叫做 Bradley-Terry 表述的东西。所以那一条是一条重要的公式。所以我们就在这里停一会儿</u>。」</b><br><b>★★★ 「<u>停一会儿</u>」这种话在一门 107 分钟的课里是很贵的，<u>而他值得这么花</u></b>：<b>⇒ 因为 Bradley-Terry 是<u>这一讲的数学地基</u>。</b><b>⇒ 奖励模型的损失<u>从它推出来</u>。</b><b>⇒ <u>而 DPO 的整个推导，也建在它的一条性质上</u>。</b><br><b>★★ 先说一句它的来历，因为这个名字听起来很唬人</b>：<b>⇒ 它是 <u>1952 年</u>的一个统计模型，<u>比深度学习早了半个多世纪</u>。</b><b>⇒ 它原本是用来<u>排体育比赛名次</u>的：<u>给每支队伍一个实力分，用它预测谁会赢</u>。</b><br><b>⇒ <u>而国际象棋的 Elo 评分（L4 讲 Chatbot Arena 时出现过）和它是近亲</u>。</b><br><b>★★★ 所以这件事的形状是：<u>一个七十年前为了排名次发明的模型，今天在给大语言模型做对齐</u></b>：<b>⇒ <u>因为「从两两比较里反推出每个个体的分数」这个问题，两处是同一个</u>。</b><br><b>⚠ 接下来三镜会把这个公式拆透，<u>请跟着走 —— 它不难，但每一步都有用</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  setEq("$$P(y_i \\succ y_j) = \\frac{e^{r_i}}{e^{r_i} + e^{r_j}}$$","top");
  says("30:09","to have an output yi be better than an output yj",204);
  note("⇒ 读法：「输出 y_i 比输出 y_j 更好」的概率",640,234,"g");
  note("★★ 分子是 r_i 的指数，分母是「r_i 的指数 + r_j 的指数」—— 这就是一个两项的 softmax",640,262,"v");},"<b>公式本身，而它其实就是一个两项的 softmax。</b><br><b>讲者的话</b>：<b>「<u>所以它说的是：让输出 yi 比输出 yj 更好的那个概率，等于某个分数的指数 —— 也就是相对于 i 的那个分数 —— 除以「相对于 i 的那个分数的指数，加上相对于 j 的某个分数的指数」。所以那就叫做 Bradley-Terry 表述。而这就是我们将要用来造我们模型的那个表述</u>。」</b><br><b>★★★ 这个式子你其实<u>已经见过很多次了</u>，只是在别的名字下</b>：<b>⇒ 它就是一个<u>只有两项的 softmax</u>。</b><b>⇒ 也就是 L1 讲注意力、L3 讲解码时那个一模一样的东西。</b><b>⇒ <u>softmax 把一组任意实数变成一组和为 1 的概率，而这里只是「那组」只有两个元素</u>。</b><br><b>★★ 所以它的性质你也已经知道</b>：<b>⇒ <u>r_i 比 r_j 大很多</u> ⇒ 概率<u>接近 1</u>。</b><b>⇒ <u>两者相等</u> ⇒ 概率<u>正好是 0.5</u>。</b><b>⇒ <u>r_i 小很多</u> ⇒ 概率<u>接近 0</u>。</b><br><b>⇒ <u>也就是说：它把「分数的差距」平滑地映射成了「赢的概率」</u>。</b><br><b>★★★ 而这个映射正是我们需要的那座桥：<u>左边是「可观测的偏好标签」，右边是「看不见的分数」</u></b>：<b>⇒ <u>有了它，我们就能从「谁赢了」反推出「分数该是多少」</u>。</b><br><b>⚠ 注意它假设了一件事：<u>偏好是由一个「潜在的分数」决定的，而且这个分数是一维的</u>。</b><b>⇒ <u>这是一个很强的假设 —— 它意味着「好」可以被排成一条线</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  setEq("$$P(y_i \\succ y_j) = \\sigma(r_i - r_j), \\qquad \\sigma(x) = \\frac{1}{1 + e^{-x}}$$","top");
  says("30:53","sigmoid is 1 over 1 plus exponential of minus x",204);

  note("★★⭐ 关键的改写：那个两项 softmax，「也等于 σ(r_i − r_j)」—— 只剩「差」",640,262,"r");},"<b>一步代数改写，而它的后果一直影响到这一讲的最后一段。</b><br><b>讲者的话</b>：<b>「<u>所以这里，它也等于 sigma of ri minus rj。所以谁知道 sigma 是什么？……对，完全正确。所以它是一个 sigmoid。所以提醒一下，sigmoid 是 1 除以「1 加上负 x 的指数」。所以这个图长这个样子</u>。」</b><br><b>★★★ 这一步改写只是把分子分母同除以 <u>e^{r_i}</u>，<u>但它的后果非常大</u></b>：<b>⇒ 改写前：式子里有 <u>r_i 和 r_j 两个量</u>。</b><b>⇒ 改写后：式子里<u>只剩 r_i − r_j 这一个量</u>。</b><b>⇒ <u>也就是说：Bradley-Terry 只看分数的「差」，不看分数本身</u>。</b><br><b>★★★ 请把这句话单独记下来，<u>因为它是这一讲最重要的一条注解</u></b>：<b>⇒ 它意味着奖励模型的分数<u>可以整体平移任意一个常数</u>，<u>而一切预测都不变</u>。</b><b>⇒ <u>所以「r = 3.7」这个数本身毫无意义</u>。</b><br><b>★★ 而这条看似只是注解的性质，<u>后来成了 DPO 能成立的承重点</u></b>：<b>⇒ DPO 推导里会冒出一个<u>算不出来的配分函数 Z(x)</u>。</b><b>⇒ <u>而因为 BT 只用差，那个 Z(x) 在做差时正好消掉了</u>。</b><br><b>⇒ <u>一个顺带提到的性质，后来成了一个方法能不能成立的承重点 —— 这种事在研究里非常常见</u>。</b><br><b>⚠ 所以这一镜值得你多看两遍。</b>");

  stack(640,218,["sigmoid 的形状：在负无穷处「趋向 0」，在正无穷处「趋向 1」","⭐ 所以换句话说：如果 i 比 j 好，我们想要的是「让 σ 的输入尽可能高」","⇒ 因为你希望那个概率「尽可能接近 1」","⇒ 于是：如果输出 i 是好的，你想让 r_i「高」；如果输出是坏的，你想让 r_j「低」"],780,32,6);
  note("★★ 注意这正好是「抬高赢的、压低输的」—— 负向信号在公式里的第一次露面",640,380,"r");},"<b>sigmoid 的形状决定了我们该往哪个方向推，而那个方向正是「负向信号」。</b><br><b>讲者的话</b>：<b>「<u>所以当它是负无穷时，它趋向 0；而到正无穷时，它趋向 1。所以换句话说，如果 i 比 j 好，我们想要的是让 sigma 的输入尽可能高，因为你希望那个概率尽可能接近 1。所以你想以某种方式让 ri 高（如果输出 i 是好的），并让 rj 低（如果那个输出是坏的）。到这里还好吗？</u>」</b><br><b>★★★ 请注意这里出现了什么：<u>「抬高赢的、压低输的」第一次以公式的形式出现了</u></b>：<b>⇒ 我们要最大化 <u>σ(r_w − r_l)</u>。</b><b>⇒ 最大化它 = <u>最大化 r_w − r_l</u>。</b><b>⇒ <u>而增大这个差，既可以靠「把 r_w 抬高」，也可以靠「把 r_l 压低」—— 两个方向同时被鼓励</u>。</b><br><b>★★ 这就是 18:00 那句目标（<u>上调赢的、下调输的</u>）在数学上的实现</b>：<b>⇒ <u>一个减号，就把两件事装进了同一个式子</u>。</b><b>⇒ <u>而 SFT 的 −log P(y) 里没有这个减号，所以它只有一半</u>。</b><br><b>⇒ <u>请体会这个对比：负向信号不是加了一个新机制，它只是因为式子里出现了「差」</u>。</b><br><b>★★★ 还有一个很实际的推论：<u>这个损失永远不会被「完全满足」</u></b>：<b>⇒ 因为 σ <u>永远到不了 1</u>，差再大也只是<u>更接近</u>。</b><b>⇒ <u>所以这个目标会一直推着差变大 —— 而这正是后面要加约束的原因之一</u>。</b>");
  SUM(0,17,{h:"⭐⭐⭐ Bradley-Terry",k:"<b>怎么造这样一个模型？我们用一个叫 Bradley-Terry 表述的东西 —— 「那是一条重要的公式，所以我们在这里停一会儿」</b>。公式：<b>「输出 y_i 比输出 y_j 更好」的概率 = e^{r_i} /（e^{r_i} + e^{r_j}）</b>；而它<b>「也等于 σ(r_i − r_j)」—— σ 是 sigmoid，σ(x) = 1/(1 + e^{−x})</b>。形状：<b>负无穷处趋向 0、正无穷处趋向 1 ⇒ 所以如果 i 比 j 好，我们想要「让 σ 的输入尽可能高」（因为你希望那个概率尽可能接近 1）⇒ 于是：输出 i 好就让 r_i 高，输出坏就让 r_j 低</b>。",m:"★★★ 那一步改写只是把分子分母同除以 e^{r_i}，<b>但后果非常大</b>：<b>改写前式子里有 r_i 和 r_j 两个量，改写后只剩 r_i − r_j 一个 ⇒ Bradley-Terry 只看分数的「差」，不看分数本身</b> ⇒ <b>它意味着奖励模型的分数可以整体平移任意常数而一切预测不变，所以「r = 3.7」这个数本身毫无意义</b>；而这条看似只是注解的性质<b>后来成了 DPO 能成立的承重点：DPO 推导里会冒出一个算不出来的配分函数 Z(x)，而因为 BT 只用差，那个 Z(x) 在做差时正好消掉了 —— 一个顺带提到的性质，后来成了一个方法能不能成立的承重点，这种事在研究里非常常见</b>。",w:"★★★ 请注意 sigmoid 那一镜出现了什么：<b>「抬高赢的、压低输的」第一次以公式的形式出现了 —— 我们要最大化 σ(r_w − r_l)，也就是最大化 r_w − r_l，而增大这个差既可以靠「把 r_w 抬高」也可以靠「把 r_l 压低」，两个方向同时被鼓励</b> ⇒ <b>这就是那句目标在数学上的实现：一个减号，就把两件事装进了同一个式子；而 SFT 的 −log P(y) 里没有这个减号，所以它只有一半 —— 负向信号不是加了一个新机制，它只是因为式子里出现了「差」</b>。还有一个实际推论：<b>这个损失永远不会被「完全满足」，因为 σ 永远到不了 1 —— 所以这个目标会一直推着差变大，而这正是后面要加约束的原因之一</b>。",r:"⇒ 这个式子你其实已经见过很多次，只是在别的名字下：<b>它就是一个只有两项的 softmax</b>（L1 的注意力、L3 的解码里那个一模一样的东西）⇒ 性质你也已经知道：<b>r_i 比 r_j 大很多则概率接近 1；两者相等则正好 0.5；小很多则接近 0 —— 它把「分数的差距」平滑地映射成「赢的概率」</b> ⇒ <b>而这正是我们需要的那座桥：左边是「可观测的偏好标签」，右边是「看不见的分数」—— 有了它就能从「谁赢了」反推出「分数该是多少」</b>；⚠ 它假设了一件事：<b>偏好是由一个「潜在的分数」决定的，而且这个分数是一维的 —— 这是一个很强的假设，它意味着「好」可以被排成一条线</b>。⇒ 来历：<b>Bradley-Terry 是 1952 年的统计模型，比深度学习早半个多世纪，原本用来排体育比赛名次（给每支队伍一个实力分、用它预测谁会赢），而国际象棋的 Elo 评分和它是近亲 ⇒ 一个七十年前为了排名次发明的模型，今天在给大语言模型做对齐 —— 因为「从两两比较里反推出每个个体的分数」这个问题，两处是同一个</b>。"});
  QUIZ(0,17,{t:"Bradley-Terry 改写成 σ(r_i − r_j) 之后，最重要的后果是什么？",o:["式子里只剩「分数的差」—— 分数可以整体平移任意常数而预测不变，而这后来成了 DPO 推导里消掉配分函数的承重点","可以处理多于两个候选","计算更快","不再需要指数运算"],a:0,w:"⇒ 所以奖励模型的「r = 3.7」本身毫无意义，只有和另一条比才有意义。而那个减号也正是「负向信号」在公式里的第一次露面。"});

  note("★★ 学生答对了 —— 而讲者接着要他把这个答案说得更明确",640,380,"r");},"<b>讲者把损失函数交给学生去想，而学生答对了。</b><br><b>讲者的话</b>：<b>「<u>而现在，你想以某种方式有一个把这两个分数都考虑进去的损失函数。所以基于这个表述，你们对该用哪个损失函数有什么建议吗？所以这里，我们的损失函数会是成对的。……所以提出的答案是 binary cross entropy</u>。」</b><br><b>★★★ 为什么二元交叉熵是对的答案，<u>这一步其实很自然</u></b>：<b>⇒ BT 给了我们一个<u>概率</u>：P(y_w 赢) = σ(r_w − r_l)。</b><b>⇒ 而我们的数据<u>告诉我们这个事件「确实发生了」</u>（标签 = 1）。</b><b>⇒ <u>「模型预测一个概率、数据给一个 0/1 标签」—— 这就是二元分类的标准设定</u>。</b><br><b>★★ 所以奖励模型的训练，<u>本质上是一个二分类问题</u></b>：<b>⇒ 分类的对象不是「这条回答好不好」。</b><b>⇒ 而是「<u>这一对里，是前一个赢还是后一个赢</u>」。</b><br><b>⇒ <u>而那个「分数 r」只是这个分类器内部的一个中间量 —— 它从来没有被直接监督过</u>。</b><br><b>★★★ 这一点很值得体会：<u>我们想要的是分数，但我们能观测的只有胜负 ⇒ 于是我们训一个胜负分类器，然后把它内部的那个量拿出来当分数用</u>。</b><br><b>⚠ 这是一种很常见的手法：<u>想要 A，只能观测 B，于是训一个 B 的模型，把 A 作为它的内部结构逼出来</u>。</b>");

  note("★★ 这就是「最大似然」—— 而下一段他会从这里一步步把损失推出来",640,380,"r");},"<b>讲者把学生的答案换成了一个更根本的说法，而下一段整段都从这里出发。</b><br><b>讲者的话</b>：<b>「<u>所以我想，你的答案是：有某种这个量的负对数似然 —— 而交叉熵可以被看成这个的一种特例。所以为了确保我们拿到这一部分 —— 为了就得到那个表述，我想我们可以有的一个想法是：给定我们的数据、以及我们看到的那个 Bradley-Terry 表述，去找那些参数 theta，让那份数据发生的概率最大化。而这基本上就引向了你提到的那个</u>。」</b><br><b>★★★ 这一步的替换很重要：<u>从「用二元交叉熵」换成「做最大似然」</u></b>：<b>⇒ 「<u>用交叉熵</u>」是一个<u>配方</u> —— 告诉你拿哪个公式。</b><b>⇒ 「<u>做最大似然</u>」是一条<u>原理</u> —— 告诉你为什么是那个公式。</b><b>⇒ <u>而讲者接下来要做的，是从原理把配方推出来</u>。</b><br><b>★★ 他为什么要多走这一步，<u>而不是直接写出损失</u></b>：<b>⇒ 他在 36:48 会自己说出来：「<u>我在这里做的，只是从第一性原理重建这个损失</u>」。</b><b>⇒ <u>也就是说，这一段的目的不是得到公式，而是演示「公式是怎么来的」</u>。</b><br><b>⇒ <u>而这对你做研究比记住公式有用得多</u>。</b><br><b>★★★ 最大似然这条原理本身只有一句话：<u>在所有可能的参数里，选那个「让我们实际观测到的数据最可能发生」的</u></b>：<b>⇒ <u>它是整个统计学最基本的一条估计原理，而它在这里一步步长出了一个偏好损失</u>。</b><br><b>⚠ 下一段是四步推导，<u>而它每一步都只用一个很朴素的理由</u>。</b>");
  SUM(0,18,{h:"⭐⭐ 奖励模型怎么训",k:"目标：<b>训一个模型，让它能用这个表述输出分数 r_i 和 r_j —— 而这个表述「涉及两个量」，因为「我们有的是一个成对的数据集」</b>。训练设定：<b>你有某个初始化好的模型；一方面输入 prompt x 和「赢的」输出 ŷ_w，放进模型产出分数 r(x, ŷ_w)；另一方面输入 x 和「输的」输出 ŷ_l，产出第二个分数</b>。损失：<b>现在你想要一个「把这两个分数都考虑进去」的损失函数 —— 基于这个表述，你们有什么建议？（提示：我们这里的损失函数会是成对的）⇒ 学生答：binary cross entropy</b> ⇒ <b>讲者：你的答案是「这个量的负对数似然」，而「交叉熵可以被看成这个的一种特例」；为了得到那个表述，一个想法是：给定我们的数据和 BT 表述，「去找那些参数 θ，让『那份数据发生的概率』最大化」</b>。",m:"★★★ 请把「同一个模型跑两遍」记清楚，这是最容易误解的地方：<b>不是两个模型，也不是一个吃两条拼起来的序列的模型 —— 是同一组权重分别前向两次、得到两个标量</b> ⇒ 实现上就是<b>把两条序列放进同一个 batch 一次前向算完，然后在损失那一层把它们配成对 ⇒ 「成对」是一个损失函数的性质，不是模型架构的性质</b>（而这正是后面「成对训练、逐点使用」那条漂亮性质的来处）。⚠ 「你初始化好的模型」在实践中通常不是随机初始化：<b>奖励模型一般从 SFT 模型初始化，把语言模型头换成一个输出单个标量的线性头 —— 因为它需要先懂语言，才能判断回答好不好</b>。",w:"★★★ 为什么二元交叉熵是对的答案：<b>BT 给了我们一个概率 P(y_w 赢) = σ(r_w − r_l)，而数据告诉我们这个事件「确实发生了」（标签 = 1）⇒ 「模型预测一个概率、数据给一个 0/1 标签」就是二元分类的标准设定</b> ⇒ <b>所以奖励模型的训练本质上是一个二分类问题 —— 分类的对象不是「这条回答好不好」，而是「这一对里是前一个赢还是后一个赢」；而那个「分数 r」只是这个分类器内部的一个中间量，它从来没有被直接监督过</b> ⇒ <b>我们想要的是分数，但我们能观测的只有胜负 ⇒ 于是我们训一个胜负分类器，然后把它内部的那个量拿出来当分数用 —— 这是一种很常见的手法：想要 A、只能观测 B，于是训一个 B 的模型，把 A 作为它的内部结构逼出来</b>。",r:"★★★ 从「用二元交叉熵」换成「做最大似然」这一步替换很重要：<b>「用交叉熵」是一个配方（告诉你拿哪个公式），「做最大似然」是一条原理（告诉你为什么是那个公式）—— 而讲者接下来要做的，是从原理把配方推出来</b>；他为什么要多走这一步：<b>他在 36:48 会自己说出来 —— 「我在这里做的只是从第一性原理重建这个损失」⇒ 这一段的目的不是得到公式，而是演示「公式是怎么来的」，而这对你做研究比记住公式有用得多</b>。⇒ 最大似然这条原理只有一句话：<b>在所有可能的参数里，选那个「让我们实际观测到的数据最可能发生」的 —— 它是整个统计学最基本的一条估计原理，而它在这里一步步长出了一个偏好损失</b>。"});

  note("★★ 读法：让「赢的分数减输的分数」尽可能大，而 log σ 把它变成一个可以最小化的量",640,262,"v");},"<b>最终形态，而把求和写成期望只是一个书写习惯。</b><br><b>讲者的话</b>：<b>「<u>而典型地，我们写成期望。而这就是我们的损失函数。所以我们的损失函数是：负的、log sigma 的期望 —— 里面是 r of x and y hat w，减去输的那个的奖励。听起来还行吗？</u>」</b><br><b>★★★ 「<u>求和</u>」换成「<u>期望</u>」是什么意思</b>：<b>⇒ 求和写的是「<u>我手上这 n 条数据</u>」。</b><b>⇒ 期望写的是「<u>从偏好数据分布里抽一条</u>」。</b><b>⇒ <u>后者是前者的「总体版本」—— 而我们用样本均值去估计它</u>。</b><br><b>★★ 这个写法在理论上更干净，<u>因为它把「有限样本」这件事抽掉了</u></b>：<b>⇒ 于是你可以讨论「<u>这个损失的最优解是什么</u>」而不用管样本量。</b><b>⇒ <u>而 DPO 的推导正是在这个「总体」层面上做的</u>。</b><br><b>★★★ 最后把这个式子读一遍，确认你真的看懂了</b>：<b>⇒ <u>r_θ(x, y_w) − r_θ(x, y_l)</u>：赢的分数减输的分数，<u>我们希望它大</u>。</b><b>⇒ <u>σ(·)</u>：把它压到 0 和 1 之间，<u>越大越接近 1</u>。</b><b>⇒ <u>log(·)</u>：越接近 1，log <u>越接近 0</u>。</b><b>⇒ <u>加负号取期望</u>：<u>于是「差越大，损失越接近 0」—— 这正是我们要的</u>。</b><br><b>⚠ 这个式子请记住，<u>因为 DPO 的损失和它长得几乎一模一样 —— 只是把 r 换成了别的东西</u>。</b>");
  SUM(0,19,{h:"⭐⭐⭐ 损失的四步推导",k:"前提：<b>假设你有一个偏好数据集（赢的例子配输的例子），有一堆这样的对，而假设「这些对彼此独立发生」</b>。① <b>你想找参数让「你看到那些例子的概率」最大化 ⇒ 最大化这 n 个偏好对的乘积，而每一项用 Bradley-Terry 展开就是 σ(奖励之差)</b>。② <b>「我在这里做的只是从第一性原理重建这个损失」—— 每当你看到一堆概率的乘积，第一件该想的是「取 log」（因为它可能变得非常小、造成不稳定；而最大化乘积和最大化它的对数是一回事）</b>。③ <b>取完对数：它等于「log σ(赢的 r − 输的 r)」的求和，而我们想最大化它</b>。④ <b>「但搞 ML 的人喜欢最小化东西」⇒ 在前面放一个负号 ⇒ 这就是我们的损失函数</b>；<b>而典型地我们写成期望：L = −E[log σ(r(x,y_w) − r(x,y_l))]</b>。",m:"★★★ 「从第一性原理重建这个损失」说明了这一整段的目的：<b>不是让你记住那个公式，而是让你看到「一个损失函数是怎么从一个假设长出来的」—— 而后者是可以迁移到你自己问题上的能力</b>。把这四步记成一个标准结构：<b>① 写出模型对数据的概率（这里用 BT）② 假设独立，连乘 ③ 取 log，变求和 ④ 加负号，变最小化 —— 而这四步你会在交叉熵、均方误差、对比学习里反复看到，它们都是同一条路走出来的</b> ⇒ <b>注意：只有第一步（独立）是一个假设，后三步都是恒等变形</b>。",w:"★★★ 取对数的两个理由都值得记：<b>工程上，几千个小于 1 的数连乘会数值下溢变成 0；数学上，log 严格单调递增所以不改变极值点的位置 ⇒ 这一步是「免费的」：只改变数值性质、不改变答案</b>；而求和还有一个巨大的实际好处：<b>它可以被拆成小批、分批回传梯度，而连乘不行（你必须把所有项算完才能得到那个数）⇒ 「取对数」这一步顺带让随机梯度下降成为可能</b>。⇒ <b>「看到概率连乘就取 log」这条反射值得养成：它在最大似然、EM、变分推断、扩散模型里会出现无数次</b>。",r:"★★★ 把最终式子读一遍确认看懂：<b>r_θ(x, y_w) − r_θ(x, y_l) 是赢的分数减输的分数，我们希望它大；σ(·) 把它压到 0 和 1 之间，越大越接近 1；log(·) 则越接近 1 时越接近 0；加负号取期望 ⇒ 「差越大，损失越接近 0」—— 正是我们要的</b> ⇒ <b>这个式子请记住，因为 DPO 的损失和它长得几乎一模一样，只是把 r 换成了别的东西</b>。⇒ 「求和」换成「期望」的含义：<b>求和写的是「我手上这 n 条数据」，期望写的是「从偏好数据分布里抽一条」—— 后者是前者的「总体版本」，而我们用样本均值去估计它；这个写法在理论上更干净，因为它把「有限样本」抽掉了，而 DPO 的推导正是在这个「总体」层面上做的</b>。⚠ 「独立」这个假设在现实里不完全成立（<b>同一个标注者标的几百条会带着同一种口味，同一个 prompt 的多条比较也不独立</b>），<b>但它是一个标准的、代价很小的近似</b>。"});
  QUIZ(0,19,{t:"那四步推导里，哪一步是「假设」，哪些是恒等变形？",o:["四步都是假设","四步都是恒等变形","只有第一步（偏好对彼此独立）是假设；连乘、取 log、加负号都是恒等变形，不改变答案","只有取 log 是假设"],a:2,w:"⇒ 取 log 的两个理由：工程上防数值下溢，数学上 log 单调不改变极值点；而它顺带让随机梯度下降成为可能（和可以拆批，连乘不行）。"});
});

  note("★★ 学生答错了 —— 而这个错很自然，因为整段推导里到处都是「一对」",640,380,"r");},"<b>讲者自己抛出的一个好问题，而学生答错了 —— 这个错很自然。</b><br><b>讲者的话</b>：<b>「<u>所以这里，那个损失函数是成对的。但那个奖励模型呢，它是成对的还是逐点的？我想，你需要一对才能做出一个预测吗，还是你只需要一个？你需要一对吗？一对？</u>」</b><br><b>★★★ 为什么这个错很自然</b>：<b>⇒ 整段推导里，<u>到处都是「一对」</u>：数据是成对的、公式里有两个 r、损失是成对的。</b><b>⇒ <u>所以你很容易以为「模型也得是成对的」</u>。</b><br><b>★★ 而这正是讲者故意要点破的那个混淆</b>：<b>⇒ 「<u>训练时怎么组织数据</u>」和「<u>模型本身的输入输出签名</u>」<u>是两回事</u>。</b><b>⇒ <u>前者可以很复杂，而后者可以很简单</u>。</b><br><b>⇒ <u>这个区分在很多地方都成立 —— 比如对比学习的模型也是「成对训练、单个使用」</u>。</b><br><b>★★★ 请注意讲者的提问方式：<u>他把判断标准说得非常具体</u></b>：<b>⇒ 不是问「<u>它是什么</u>」。</b><b>⇒ 而是问「<u>你需要一对才能做出一个预测吗</u>」。</b><br><b>⇒ <u>把抽象的分类问题，换成一个可以直接检验的操作问题 —— 这是一个很好的提问习惯</u>。</b>");

  stack(640,218,["讲者：嗯，「这就是事情美妙的地方」—— 「你不需要一对」","⭐ 「所以你只是在成对地训练它，但它其实是逐点的」","⇒ 他说：我觉得「这是我意识到的一件事」—— 我看着这个损失，然后……","⇒ 到头来，你有的是一个「吃进一个 prompt 和它的输出，然后只输出一个数」的奖励模型"],780,32,6);
  note("★★ 而我们看到，它「会试着给赢的例子高分、给输的例子低分」",640,380,"g");},"<b>答案，而讲者用了「美妙」这个词 —— 它当得起。</b><br><b>讲者的话</b>：<b>「<u>嗯，这就是事情美妙的地方。你不需要一对，所以你只是在成对地训练它，但它其实是逐点的。所以我想那是我意识到的一件事。我看着这个损失，而这是一个 —— 所以你是在以一种成对的方式训练。但到头来，你有的是一个奖励模型，它吃进一个 prompt 和它的输出，然后就只输出一个数。而我们看到，它会试着给赢的例子输出一个高分，给输的例子输出一个低分</u>。」</b><br><b>★★★ 这条性质为什么是整条流水线的关键</b>：<b>⇒ 因为 RL 那一步<u>拿不到「一对」</u> —— 模型生成一条回答，<u>只有这一条</u>。</b><b>⇒ 如果奖励模型<u>必须成对才能用</u>，<u>整个 RLHF 就接不上了</u>。</b><b>⇒ <u>正因为它是逐点的，RL 那一步才能直接问它「这条值多少分」</u>。</b><br><b>★★ 而这条性质是怎么「白得」的</b>：<b>⇒ 看损失的形状：<u>r_θ(x, y_w) 和 r_θ(x, y_l) 是同一个函数在两个点上的取值</u>。</b><b>⇒ 那个函数 <u>r_θ(x, y)</u> <u>本来就只吃一条</u>。</b><b>⇒ <u>成对只发生在「把两个取值相减」这一步，而那是损失干的事，不是模型干的</u>。</b><br><b>⇒ <u>所以这不是一个巧妙的设计，而是「把成对放在损失层」这个选择的自然后果</u>。</b><br><b>★★★ 请把这个手法记住：<u>你想要一个单输入的打分器，但你只有成对的标签 ⇒ 那就把成对放进损失里，模型本身保持单输入</u></b>：<b>⇒ <u>这在排序学习、对比学习、度量学习里都是标准做法</u>。</b><br><b>⚠ 讲者说「<u>这是我意识到的一件事</u>」—— <u>他在分享一个他自己读论文时的领悟，而不是复述教材</u>。</b>");
  SUM(0,20,{h:"⭐⭐⭐ 成对训练，逐点使用",k:"提问：<b>这里那个「损失函数」是成对的 —— 但那个「奖励模型」呢，它是成对的还是逐点的？（你需要一对才能做出一个预测吗，还是只需要一个？）</b> 学生答「需要一对」。答案：<b>「这就是事情美妙的地方 —— 你不需要一对，所以你只是在成对地训练它，但它其实是逐点的」</b>；<b>到头来你有的是一个奖励模型，它「吃进一个 prompt 和它的输出，然后就只输出一个数」—— 而它会试着「给赢的例子输出一个高分、给输的例子输出一个低分」</b>。",m:"★★★ 这条性质为什么是整条流水线的关键：<b>因为 RL 那一步拿不到「一对」—— 模型生成一条回答就只有这一条；如果奖励模型必须成对才能用，整个 RLHF 就接不上了 ⇒ 正因为它是逐点的，RL 那一步才能直接问它「这条值多少分」</b>。而这条性质是怎么「白得」的：<b>看损失的形状 —— r_θ(x, y_w) 和 r_θ(x, y_l) 是同一个函数在两个点上的取值，而那个函数 r_θ(x, y) 本来就只吃一条；成对只发生在「把两个取值相减」这一步，而那是损失干的事、不是模型干的 ⇒ 这不是一个巧妙的设计，而是「把成对放在损失层」这个选择的自然后果</b>。",w:"★★★ 学生那个错很自然：<b>整段推导里到处都是「一对」（数据成对、公式里两个 r、损失成对），所以你很容易以为「模型也得是成对的」</b> ⇒ 而这正是讲者故意要点破的混淆：<b>「训练时怎么组织数据」和「模型本身的输入输出签名」是两回事 —— 前者可以很复杂，后者可以很简单</b>（这个区分在很多地方成立，比如对比学习的模型也是「成对训练、单个使用」）。⇒ <b>请把这个手法记住：你想要一个单输入的打分器，但你只有成对的标签 ⇒ 那就把成对放进损失里，模型本身保持单输入 —— 这在排序学习、对比学习、度量学习里都是标准做法</b>。",r:"⇒ 注意讲者的提问方式：<b>他不是问「它是什么」，而是问「你需要一对才能做出一个预测吗」—— 把抽象的分类问题换成一个可以直接检验的操作问题，这是一个很好的提问习惯</b>。⚠ 而他说「这是我意识到的一件事」，<b>说明他在分享一个自己读论文时的领悟，而不是复述教材</b>。"});
  QUIZ(0,20,{t:"奖励模型是「成对的」还是「逐点的」？",o:["训练时逐点，使用时成对","逐点的：它吃一个 prompt 加一个回答、输出一个数；「成对」只发生在损失那一层","成对的 —— 它必须同时看两条回答","取决于数据格式"],a:1,w:"⇒ 这条性质是整条流水线的关键：RL 那一步只有一条回答，如果奖励模型必须成对就接不上了。而它是「把成对放在损失层」这个选择的自然后果。"});

  SUM(0,22,{h:"⭐⭐ 奖励相对于某个维度",k:"追问：<b>在有些任务上人类偏好会是一回事，但在另一些任务上可能是另一回事 ⇒ 完全正确：「那些奖励是相对于某一个给定的维度」的 —— 比如这个输出「有用吗」、「不友好吗」、「安全吗」⇒ 所有这些都是不同的维度，「所以它们可以是不同的奖励模型」；你「也可以有一个综合的分数」</b> ⇒ <b>所以你需要「定义一个维度」，你实际上就是沿着那个维度在量化你的回答有多好</b>。顺带一条：<b>「人工评分对你所给出的那些指南非常敏感」—— 人类偏好数据的一个重要方面是「确保你告诉标注者的那些指南尽可能地客观」；有时候你没法让它们超级客观，但你的任务是「让它们足够清楚」，这样「你的人类偏好就不会太嘈杂」</b>。",m:"★★★ 这个追问戳到了 Bradley-Terry 那个隐含假设的软肋：<b>BT 假设偏好来自一个「一维的潜在分数」，也就是「好」可以被排成一条线；而现实中「有用」和「安全」常常是互相冲突的两条轴，它们排不进同一条线</b> ⇒ 实践做法：<b>每个维度训一个奖励模型（一个管有用、一个管无害、一个管事实性），然后在 RL 时加权合成一个数 —— 而「权重怎么定」本质上就是产品决策，它决定了你的模型在「有用」和「安全」之间站在哪</b> ⇒ <b>这正是 L4 那段「三个 H 之间有张力」的工程实现</b>。",w:"★★★ 「你需要先定义一个维度」和 L4 结尾那句是同一件事的两种说法：<b>L4 说「并不是某一个数字就能告诉你你关心的东西」（讲评估），这里说「你需要先定义一个维度」（讲训练）—— 困难是同一个</b> ⇒ 而这在训练这一侧更要命：<b>评估时量错维度，后果是「你以为它好，其实不好」；训练时定错维度，后果是「它真的会朝那个方向变」⇒ 在训练里，一个错的目标不只是测不准，它会被实现出来</b> ⇒ <b>建议把这条当成做任何对齐工作的第一步：在写任何代码之前，先把「我要沿着哪个维度变好」写成一句话 —— 写不出来，说明你还不知道自己要什么</b>。",r:"★★★ 「指南」这件事的分量可能比模型本身还重：<b>你的模型最终学到的是「指南里写的那种好」，而不是「抽象意义上的好」⇒ 写指南的那个人，才是真正在定义模型价值观的人</b>；而 L4 里那个细节在这里对上了：<b>L4 说早期 SFT 数据是「专家语言学家按一套规范写的」，这里说偏好标注也要「一套尽可能客观的指南」⇒ 两处合起来说明：这整条流水线的质量，最终取决于一份写在文档里的规范</b>。⇒ 而「尽可能客观」是有极限的，讲者也承认（<b>「有时候你没法让它们超级客观」</b>）⇒ <b>所以目标退一步：不求客观，但求「清楚到两个人读了会做出同样的判断」—— 这就是标注里的「一致性」指标，而它是衡量一份指南好不好的真正标准</b>。"});
  QUIZ(0,22,{t:"为什么说奖励「是相对于某一个给定的维度」的？",o:["因为不同任务的奖励尺度不同","因为「有用」和「安全」常常是互相冲突的两条轴，排不进 Bradley-Terry 假设的那一条线 ⇒ 实践中每个维度一个奖励模型，再加权","因为人类偏好是主观的","因为奖励模型只能输出一个数"],a:1,w:"⇒ 而「权重怎么定」本质上是产品决策。另外：训练里定错维度比评估里量错维度更要命 —— 一个错的目标会被真的实现出来。"});

  note("⚠ 注意好的是正数、坏的是负数 —— 但那个零点在哪，纯粹是归一化定出来的",640,374,"d");},"<b>最后一个追问，而这个具体的数字让前面所有抽象的讨论落了地。</b><br><b>讲者的话</b>：<b>「<u>问题是，你能多跟我们讲讲奖励模型的输出是什么吗？所以我们稍后会看到，但你可以把好的输出想成，比如说，1；把坏的输出想成，比如说，负 2、负 3。所以它基本上就是在一个连续的刻度上，如果你愿意这么说的话。我们待会儿会看一个例子。所以希望这能 —— 你有问题吗？完美。我们会看一个例子。所以希望那会清楚</u>。」</b><br><b>★★★ 这几个具体的数字很有用，<u>因为它们让前面抽象的讨论落了地</u></b>：<b>⇒ 奖励<u>不是 0 到 1 之间的概率</u>。</b><b>⇒ 它是<u>可正可负的实数</u>，典型地在<u>个位数范围</u>。</b><b>⇒ <u>而「好的为正、坏的为负」是归一化之后的自然结果</u>。</b><br><b>★★ 请注意那个<u>零点</u>在哪，是归一化定出来的</b>：<b>⇒ 在 batch 上减均值之后，<u>「平均水平」就落在了 0</u>。</b><b>⇒ 于是<u>正数 = 比平均好，负数 = 比平均差</u>。</b><br><b>⇒ <u>这个解释很重要，因为它让「奖励」有了一个可读的含义：它是「相对于当前这一批的平均水平」的好坏</u>。</b><br><b>★★★ 而这个「相对于平均」的思路，正是下一段 <u>advantage</u> 要正式化的东西</b>：<b>⇒ <u>advantage = 实际得到的 − 本来预期的</u>。</b><b>⇒ <u>而归一化其实已经是它的一个粗糙版本了</u>。</b><br><b>⚠ 讲者说「<u>我们待会儿会看一个例子</u>」—— <u>而那个例子在 47:33 出现：一条坏回答拿到 −2 分</u>。</b>");
  SUM(0,23,{h:"⭐ 回归还是分类、要不要归一化",k:"追问：<b>这里的奖励是回归还是分类？⇒ 「这个很难说」—— 因为「那个奖励可以是某种能被解释成分数的东西」，但「我们有的是一个概率式的表述」⇒ 我大概会「把它框成一个分类任务」，因为你有的是偏好数据：更好还是更差，「所以是 1 或 0」</b>；但<b>「到最后你用的是那些奖励」⇒ 「它不纯粹是一个分类任务」；而「这些奖励所处的尺度本身通常是被缩放过的」—— 「在推理时你有某种归一化流程，把它在你的 batch 上归一化」⇒ 我大概会「把这个表述更多地刻画成一个概率式的」</b>。再追问：<b>我们会归一化分数吗？⇒ 「我们通常会归一化」—— 如果你在回归设定里，你是在某个给定的刻度上预测一个分数，「而你在这里并不是」，「这里是自由形式的」⇒ 「确实有一些重新缩放在发生」</b>。输出长什么样：<b>好的输出「比如说 1」，坏的输出「比如说 −2、−3」⇒ 「它基本上就是在一个连续的刻度上」</b>。",m:"★★★ 这个问题难回答是因为这个模型确实横跨两边：<b>像分类（标签是 0/1 谁赢，损失是交叉熵），像回归（模型吐出一个连续标量，而我们后面就拿这个标量当数用）</b> ⇒ <b>准确的说法是「它是一个带隐变量的分类问题」：被监督的是分类（谁赢），被使用的是那个隐变量（分数）—— 而这正是「成对训练、逐点使用」的另一个说法，两个追问问的其实是同一件事的两面</b>；而讲者给的最终定性「概率式的」比「分类」或「回归」都准：<b>这个模型真正在做的是「给『A 赢』这件事估一个概率」，那个分数只是这个概率模型的内部参数</b>。",w:"★★★ 归一化这个实现细节直接来自 BT 的那条性质：<b>BT 只看差 ⇒ 分数的绝对值没有被任何东西钉住 ⇒ 训出来的分数可能整体漂到 +50 或 −30 去；而 RL 那一步对奖励的尺度很敏感（奖励太大会让梯度爆掉）⇒ 实践中要在 batch 上做归一化（减均值、除标准差）把尺度拉回来</b> ⇒ <b>请把这条因果链记住：BT 只用差 ⇒ 分数没有绝对标尺 ⇒ 必须在用之前归一化 —— 一个数学性质，直接逼出了一个工程步骤</b>。而「自由形式」和「某个给定的刻度」的对比说清了它和回归的差别：<b>普通回归预测房价，刻度是「美元」（外部给定）；奖励模型预测「好」，而「好」没有单位 —— 刻度是模型自己长出来的 ⇒ 两次训练可能给出完全不同量级的分数而排序完全一样，于是下游的 RL 超参（比如 KL 系数）就没法固定，除非先把尺度标准化</b>。",r:"⇒ 那几个具体数字让抽象讨论落了地：<b>奖励不是 0 到 1 之间的概率，而是可正可负的实数、典型地在个位数范围；而「好的为正、坏的为负」是归一化之后的自然结果</b> ⇒ 那个<b>零点</b>在哪是归一化定出来的：<b>在 batch 上减均值之后「平均水平」就落在 0 ⇒ 正数 = 比平均好、负数 = 比平均差 —— 这让「奖励」有了一个可读的含义：它是「相对于当前这一批的平均水平」的好坏</b> ⇒ <b>而这个「相对于平均」的思路，正是下一段 advantage 要正式化的东西（advantage = 实际得到的 − 本来预期的），归一化其实已经是它的一个粗糙版本了</b>。⚠ 做实验时的实用提醒：<b>任何「只有相对意义」的量，在跨实验比较前都必须先归一化 —— 否则你比较的是尺度，不是质量</b>。"});
  QUIZ(0,23,{t:"奖励模型的分数为什么必须归一化？",o:["因为 Bradley-Terry 只看「差」⇒ 分数的绝对值没有被任何东西钉住，可能整体漂走，而 RL 对奖励尺度很敏感","因为人类评分是 1 到 5 分","为了加快训练","为了让它落在 0 到 1 之间"],a:0,w:"⇒ 一个数学性质直接逼出了一个工程步骤。归一化后「平均水平落在 0」，于是正数 = 比平均好 —— 这已经是 advantage 的粗糙版本。"});

  note("⚠ 一个直接的后果：模型可以学会钻奖励模型的空子，而奖励模型不会跟着变聪明",640,374,"v");},"<b>一个讲者自己说「重要」的提醒，而它的后果比听起来大。</b><br><b>讲者的话</b>：<b>「<u>所以提醒一下，那个奖励模型是我们作为第一步训练出来的那个模型。而它是一个冻住的模型。我们不在训练那个奖励模型。那个奖励模型已经被训好了。我们正在训练的那个模型，是这个 LLM。所以我觉得这是一个重要的、要记住的点</u>。」</b><br><b>★★★ 「<u>奖励模型冻住</u>」有一个很直接、也很要命的后果</b>：<b>⇒ 策略模型<u>每一步都在变强、变聪明</u>。</b><b>⇒ 而裁判<u>一动不动</u>。</b><b>⇒ <u>于是迟早，选手会学会钻裁判的空子 —— 而裁判永远不会察觉</u>。</b><br><b>★★ 这就是 reward hacking 的<u>结构性根源</u>，<u>而下一段讲者会专门讲它</u></b>：<b>⇒ 不是因为奖励模型训得不好。</b><b>⇒ 而是因为「<u>一个固定的代理，对上一个会进化的优化者</u>」。</b><br><b>⇒ <u>这个对局的结果是注定的：只要优化得够久，代理一定会被钻穿</u>。</b><br><b>★★★ 所以实践中有两条对策</b>：<b>⇒ ① <u>不要优化太久</u>（早停、限制 KL）—— <u>这是这一讲要讲的那条</u>。</b><b>⇒ ② <u>周期性地重新训奖励模型</u>（让裁判也跟上）—— <u>这叫「迭代式 RLHF」</u>。</b><br><b>⚠ 讲者只讲了第一条，<u>但第二条在实践中同样常见</u>。</b>");
  SUM(0,24,{h:"⭐⭐ 第二步的回路",k:"<b>我们训了一个奖励模型；现在第二步是「用那个奖励模型去对齐我们的模型」—— 我说模型指的是那个 LLM，那个「走过预训练阶段、又走过 SFT 阶段」的 LLM</b>；<b>我们要用强化学习来做，用刚造出来的那个奖励模型（它让我们能区分好输出和坏输出）</b>。配方：<b>① 你把 prompt 作为输入 ② 你的 LLM 生成一个 completion（= 模型给出的一整条回答；顺带，人们也用 roll-out 这个词）③ 那一整条回答连同 prompt 进入奖励模型 —— 它知道这是好是坏；假设是坏的，而实践中「它并不会生成一个倒赞，它生成的是某种分数」，比如说 −2 ④ 我们把那个奖励纳入考虑，「用这个信息去调那个 LLM」</b> ⇒ <b>「它比这要复杂，我们会看到怎么着手，但这是大致的想法」</b>。提醒：<b>奖励模型「是一个冻住的模型」—— 我们不训它，它已经训好了；「我们正在训练的那个模型，是这个 LLM」—— 这是一个重要的点</b>。",m:"★★★ 「奖励模型冻住」有一个很要命的后果：<b>策略模型每一步都在变强变聪明，而裁判一动不动 ⇒ 迟早选手会学会钻裁判的空子，而裁判永远不会察觉</b> ⇒ <b>这就是 reward hacking 的结构性根源：不是因为奖励模型训得不好，而是因为「一个固定的代理，对上一个会进化的优化者」—— 这个对局的结果是注定的，只要优化得够久，代理一定会被钻穿</b> ⇒ 两条对策：<b>① 不要优化太久（早停、限制 KL）—— 这是这一讲要讲的那条 ② 周期性地重新训奖励模型让裁判跟上 —— 这叫「迭代式 RLHF」</b>（讲者只讲了第一条）。",w:"★★★ 从这里开始同时有两个模型在场，<b>混淆它们是最常见的错误</b>：<b>奖励模型（RM）是裁判 —— 已经训好、冻住、只打分；策略模型（LLM）是选手 —— 正在被训、会生成</b>；而它们还有一个容易混的共同点：<b>两者都是从同一个 SFT 模型初始化来的（奖励模型是 SFT 模型 + 一个标量头再用偏好数据训，策略模型就是 SFT 模型本身）⇒ 同源，但训练目标和角色完全不同</b> ⇒ <b>后面还会冒出两个模型（参考模型、价值模型），到时一共四个 —— 所以从现在起，每出现一个模型请立刻问：它在训吗？它干什么用？</b>",r:"⇒ 「roll-out」这个词来自 RL：<b>在 RL 里它指「按当前策略从头跑完一整条轨迹」，而在 LLM 里一条轨迹就是「生成一整条回答」⇒ completion、roll-out、trajectory、一整条回答，这四个词在这里是同一个东西</b>；而「一整条」决定了这个 RL 问题的粒度：<b>奖励不是每个 token 给一次，而是整条生成完之后给一次 ⇒ 一次「交互」很长：几百个动作换一个奖励</b> ⇒ <b>在下棋里一步棋就是一个动作，而这里几百个 token 才换来一次反馈 —— 这是「信号稀疏」最具体的样子，也是 RLHF 难训的根本原因之一</b>。⇒ 「它并不会生成一个倒赞」是在纠正幻灯上的图示：<b>幻灯为了直观画了个大拇指向下，但真实输出是一个连续的数 —— 二元的只知道方向不知道程度，连续的则「有多坏」也带着信息，而那正是 Bradley-Terry 那个隐变量的价值：二元的标签，长出了一个连续的打分器</b>（而 −2 的含义是「比这一批的平均水平差两个单位」，因为分数在 batch 上归一化过）。⇒ 「它比这要复杂」后面跟着的是接下来二十分钟的全部内容：<b>怎么保证不跑太远（KL 惩罚）、怎么把一条的分数分配到几百个 token 上（advantage 和 value function）、怎么让更新稳定（PPO-Clip）、要为此养几个模型（四个）</b>。"});
  QUIZ(0,24,{t:"RLHF 第二步里，奖励模型「冻住」带来什么后果？",o:["训练更快","奖励会越来越准","不需要归一化了","策略每步变聪明而裁判一动不动 ⇒ 只要优化得够久，选手一定会学会钻裁判的空子 —— 这是 reward hacking 的结构性根源"],a:3,w:"⇒ 两条对策：① 不要优化太久（限制 KL，这一讲讲的）② 周期性重训奖励模型让裁判跟上（迭代式 RLHF）。"});

  note("⚠ 「灾难性遗忘」是一个标准术语，但说出术语不等于理解它",640,380,"d");},"<b>学生答出了一个标准术语，而讲者没有立刻点头。</b><br><b>讲者的话</b>：<b>「<u>我们为什么会想要不偏离那个基座模型太多？……所以一个被提出的答案是：它会灾难性地遗忘掉它学过的东西。那为什么那会是一个问题？</u>」</b><br><b>★★★ 讲者这个追问做得很好：<u>他要的不是术语，而是术语背后的那个后果</u></b>：<b>⇒ 「<u>灾难性遗忘</u>」（catastrophic forgetting）是一个标准术语。</b><b>⇒ 但说出一个术语<u>不等于理解它</u>。</b><b>⇒ <u>而他想听的是：「忘掉了，然后呢？」</u></b><br><b>★★ 「<u>灾难性遗忘</u>」本身指的是什么</b>：<b>⇒ 一个神经网络在<u>新任务上训练</u>时，<u>会把旧任务上学到的东西覆盖掉</u>。</b><b>⇒ 它不是慢慢退化，<u>而是可能很快地、大面积地丢失</u>。</b><b>⇒ <u>「灾难性」这个词说的就是这个「快而大面积」</u>。</b><br><b>⇒ <u>而在 RLHF 里，「新任务」就是「让奖励变高」，「旧任务」就是「会说话、懂知识」</u>。</b><br><b>★★★ 所以这个风险的形状是：<u>模型为了拿高分，可以把「它本来会的一切」都牺牲掉</u></b>：<b>⇒ <u>最极端的情况：它学会反复输出一句奖励模型特别喜欢的话，别的什么都不会了</u>。</b><br><b>⚠ 这在 RLHF 的实践里真的会发生，<u>而且是最常见的失败模式之一</u>。</b>");

  note("⚠ 而讲者接着问：「那另一个理由会是什么？」—— 他还要第二个",640,380,"d");},"<b>学生说清楚了，而这个理由的实质是「那是一笔很贵的资产」。</b><br><b>讲者的话</b>：<b>「<u>所以这里被提出的答案是：你的初始模型里有所有这些知识 —— 它是被预训练过、然后又被指令调过或者调过的 —— 而你不想离它太远。完全就是这样。所以那是一个理由。那另一个理由会是什么？所以那肯定是一个，它是一个非常非常好的理由。那另一个理由会是什么？</u>」</b><br><b>★★★ 这个理由的实质，用成本来说最清楚</b>：<b>⇒ 那个初始模型是<u>几千万美元的预训练</u> + <u>几百万美元的 SFT</u> 堆出来的。</b><b>⇒ 而偏好调优这一步<u>可能只花几万美元</u>。</b><b>⇒ <u>你不应该让一个几万美元的步骤，毁掉一笔几千万美元的资产</u>。</b><br><b>★★ 所以「<u>别跑太远</u>」这个约束可以这样理解</b>：<b>⇒ 它不是在<u>限制模型变好</u>。</b><b>⇒ 它是在<u>保护已有的投资</u>。</b><br><b>⇒ <u>而这也呼应了这一讲的总钥匙：我们不想学新事实，我们只想调整已有分布上的偏好</u>。</b><br><b>★★★ 换句话说：<u>如果模型跑远了，那说明它在学新东西 —— 而学新东西本来就不是这一步该做的事</u></b>：<b>⇒ <u>所以「跑太远」本身就是一个「做错了」的信号</u>。</b><br><b>⚠ 讲者连说了两次「<u>那另一个理由会是什么</u>」—— <u>他明确知道还有第二个，而且在等学生说出来</u>。</b>");

  SUM(0,25,{h:"⭐⭐⭐ 别离初始模型太远",k:"目标有两半：<b>「优化更高的奖励，但同时不要离那个初始模型太远」—— 第一半「大家都同意」，而第二半讲者专门问了一句「那为什么会那样呢？」</b> 理由一（学生答）：<b>「它会灾难性地遗忘掉它学过的东西」⇒ 讲者追问「那为什么那会是一个问题？」⇒ 「你的初始模型里有所有这些知识」（它被预训练过、又被指令调过），「而你不想离它太远」⇒ 「完全就是这样，所以那是一个理由」</b>。理由二（学生答）：<b>「在那份数据上过拟合」⇒ 「你可能会在那些『不是超级干净』的数据上过拟合」—— 而我会再详细讲讲那是什么意思</b>。",m:"★★★ 第一半显然、第二半需要被论证，<b>这正是讲者停下来问的原因</b>：<b>一个天真的想法是「奖励越高越好，那就一直优化下去」—— 而这一整段要说明的是这个想法是错的</b> ⇒ <b>这是这一讲最重要的一个判断，而它在别的地方也成立：当你的目标是一个代理指标时，优化得越狠不一定越好，因为代理和真实目标之间的缝隙会随着优化强度被放大 ⇒ 解法不是「换一个更好的代理」，而是「限制优化的强度」</b> ⇒ <b>限制优化强度是对付代理指标的根本办法，而它在 RLHF 里的具体形式就是 KL 惩罚</b>。",w:"★★★ 理由一的实质用成本说最清楚：<b>那个初始模型是几千万美元的预训练 + 几百万美元的 SFT 堆出来的，而偏好调优这一步可能只花几万美元 ⇒ 你不应该让一个几万美元的步骤，毁掉一笔几千万美元的资产</b> ⇒ <b>所以「别跑太远」不是在限制模型变好，而是在保护已有的投资 —— 这也呼应了这一讲的总钥匙：我们不想学新事实，只想调整已有分布上的偏好 ⇒ 如果模型跑远了，那说明它在学新东西，而学新东西本来就不是这一步该做的事，所以「跑太远」本身就是一个「做错了」的信号</b>。而「灾难性遗忘」指的是：<b>神经网络在新任务上训练时会把旧任务学到的东西覆盖掉，而且不是慢慢退化，是可能很快地、大面积地丢失 —— 在 RLHF 里「新任务」就是「让奖励变高」，「旧任务」就是「会说话、懂知识」⇒ 最极端的情况：它学会反复输出一句奖励模型特别喜欢的话，别的什么都不会了（这在实践里真的会发生，是最常见的失败模式之一）</b>。",r:"★★★ 理由二里的「数据」指的不是偏好数据，<b>而是奖励模型给出的那些分数</b>：<b>因为 RL 这一步根本不直接看偏好数据，它看到的只有奖励模型吐出的那些数 —— 而那些数是「一个不完美的模型的输出」，也就是「不够干净」</b> ⇒ 所以「过拟合」的含义也和平常不同：<b>平常的过拟合是「模型记住了训练集的噪声」，这里的是「策略学会了迎合奖励模型的偏差」—— 它过拟合的不是一个数据集，而是另一个模型</b> ⇒ <b>而讲者接着会把这件事正式命名：它叫 reward hacking，是下一段的主角，而他还会用一个「鼓掌」的例子把它讲透</b>。⚠ 学生给的两个理由其实指向同一个方向：<b>一个说「别弄坏已有的」，一个说「别太信那个裁判」—— 而讲者接下来会说这两点「其实是同一条线上的」</b>。"});

  says("54:37","measuring how far the distribution of the policy that we're training is to the reference model",204);
  note("⇒ 左边：「一个我们想最大化的奖励模型」的部分",640,234,"g");
  note("★★ 右边：「衡量『我们正在训的那个策略的分布』离『参考模型 / 基座模型』有多远」",640,262,"v");},"<b>两项被写出来了，而右边那个「参考模型」就是你的 SFT 模型。</b><br><b>讲者的话</b>：<b>「<u>所以这大致就是我们的损失函数会长的样子。所以我们会有一部分，是一个我们想最大化的奖励模型。然后另一部分，是围绕「衡量我们正在训练的那个策略的分布，离那个参考模型、或者说基座模型有多远」。所以这里，那个参考模型就会是你的 SFT 模型。所以你有这两部分</u>。」</b><br><b>★★★ 把式子里每个符号认清楚，<u>因为 DPO 后面会从同一个式子出发</u></b>：<b>⇒ <u>π_θ</u>：<u>正在训的策略</u>（会变）。</b><b>⇒ <u>π_ref</u>：<u>参考策略 = 你的 SFT 模型</u>（冻住）。</b><b>⇒ <u>r(x, y)</u>：<u>奖励模型给的分</u>。</b><b>⇒ <u>β</u>：<u>一个权衡系数 —— 你有多在乎「别跑远」</u>。</b><br><b>★★ <u>β</u> 这个系数是实践中最关键的超参之一</b>：<b>⇒ <u>β 太小</u> ⇒ 约束太松 ⇒ <u>reward hacking</u>。</b><b>⇒ <u>β 太大</u> ⇒ 约束太紧 ⇒ <u>模型几乎不动，白训</u>。</b><br><b>⇒ <u>而它没有理论上的最优值，只能调 —— 这也是 RLHF 难用的原因之一</u>。</b><br><b>★★★ 请特别记住这个式子，<u>因为它就是 DPO 推导的起点</u></b>：<b>⇒ <u>DPO 做的第一件事，就是把这个带约束的最大化问题「解出来」—— 而它有一个闭式解</u>。</b><br><b>⚠ 注意 <u>π_ref 就是 SFT 模型</u>，而这一讲前面说过：<u>SFT 模型在这里有两个身份，既是起点、又是那个锚</u>。</b>");
  SUM(0,28,{h:"⭐⭐ 损失的两部分与 PPO",k:"<b>那个损失函数会是某种「既想让你最大化奖励、又不让你偏离基座模型太多」的东西 —— 「它会有这两部分」</b>。名字：<b>为了做到这件事，「你可能听说过一个非常流行的 RL 算法，叫 PPO」—— proximal policy optimization；而「它之所以叫 proximal，正是因为我们不想我们的模型偏离基座模型太多」</b>。两部分：<b>一部分是「一个我们想最大化的奖励模型」；另一部分是「衡量『我们正在训的那个策略的分布』离『参考模型 / 基座模型』有多远」—— 而「这里那个参考模型就会是你的 SFT 模型」</b>。",m:"★★★ 「目标项 + 正则项」这个形状是机器学习里最常见的结构之一：<b>岭回归是「拟合误差 + 权重平方和」，Lasso 是「拟合误差 + 权重绝对值和」，这里是「奖励 − β × 和参考模型的距离」</b> ⇒ 正则项在三处的作用是同一个：<b>限制「你能走多远」—— 岭回归限制「权重能有多大」，这里限制「策略能离起点多远」，而动机也一样：防止在一个不完美的目标上过拟合</b> ⇒ <b>所以如果你已经理解「为什么线性回归要加正则」，你就已经理解了这里的 KL 项 —— 只是「远」的度量从「权重的模」换成了「两个概率分布的差异」</b>。",w:"★★★ 这里要分清两个不同的「近」，它们很容易混：<b>① 离 SFT 模型近（KL 惩罚）—— 这是「别忘了你是谁」；② 离上一步的自己近（PPO 的 clip）—— 这是「别一步迈太大」</b> ⇒ <b>讲者这里说的是 ①，而 PPO 原论文里的 proximal 其实指的是 ②；两者在 RLHF 里都用上了，而后面讲 PPO-Clip 时会看到 ②</b> ⇒ <b>请注意这个细微差别，它是读 PPO 相关论文时最容易绊倒的地方：同一个「别跑太远」在 RLHF 里有两层，作用在两个不同的参照物上</b>（讲者在这个层次上把两者说成了一个，这样讲是合适的，但你要知道它们是两回事）。",r:"★★★ 把式子里每个符号认清楚（<b>DPO 后面会从同一个式子出发</b>）：<b>π_θ 是正在训的策略（会变）；π_ref 是参考策略 = 你的 SFT 模型（冻住）；r(x, y) 是奖励模型给的分；β 是一个权衡系数 —— 你有多在乎「别跑远」</b> ⇒ <b>β 是实践中最关键的超参之一：太小则约束太松（reward hacking），太大则约束太紧（模型几乎不动，白训）—— 而它没有理论上的最优值，只能调，这也是 RLHF 难用的原因之一</b> ⇒ <b>请特别记住这个式子，因为它就是 DPO 推导的起点：DPO 做的第一件事，就是把这个带约束的最大化问题「解出来」—— 而它有一个闭式解</b>。"});
  QUIZ(0,28,{t:"PPO 名字里的 proximal（近端）指的是什么？要小心哪个细节？",o:["指模型参数要接近 0","指 batch 要小","指「别跑太远」—— 但要分清两层：离 SFT 模型近（KL 惩罚）和离上一步的自己近（clip），PPO 原论文的 proximal 指的是后者","指学习率要低"],a:2,w:"⇒ 两者在 RLHF 里都用上了，作用在两个不同的参照物上 —— 这是读 PPO 相关论文时最容易绊倒的地方。"});
