KP("29 · ⭐⭐ KL 散度：两个分布有多远",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("55:33","it's some measure of how far two probability distributions are",166);
  note("⭐⭐ 讲者在用这个词之前，先把它定义清楚",640,194,"y");
  stack(640,218,["「我只是一直在说 KL 散度，但我不想就假设你知道那是什么」","⭐ 「KL 散度是某种『度量』」","⚠ 「我不想说『距离』—— 因为『距离』这个词带着很多含义」","⭐ 「它不是一个距离，但它是『两个概率分布有多远』的某种度量」"],780,32,6);
  note("★★ 这个澄清非常值得记：KL 不是距离 —— 它不对称，也不满足三角不等式",640,380,"r");},"<b>讲者在用这个词之前先把它定义清楚，而其中那个澄清非常重要。</b><br><b>讲者的话</b>：<b>「<u>KL 散度。所以我只是一直在说 KL 散度，但我不想就那样假设你知道那是什么。所以 KL 散度是某种度量。我不想说距离，因为距离这个词带着很多含义。它不是一个距离，但它是某种「两个概率分布有多远」的度量</u>。」</b><br><b>★★★ 「<u>它不是一个距离</u>」这个澄清很重要，<u>而原因很具体</u></b>：<b>⇒ 数学上的「<u>距离</u>」要满足三条：<u>非负</u>、<u>对称</u>、<u>三角不等式</u>。</b><b>⇒ KL <u>满足第一条</u>。</b><b>⇒ 但它<u>不对称</u>：<u>D(P‖Q) ≠ D(Q‖P)</u>。</b><b>⇒ 它也<u>不满足三角不等式</u>。</b><br><b>★★ 「<u>不对称</u>」这件事在实践中有真实的后果</b>：<b>⇒ <u>D(π_θ ‖ π_ref)</u>：惩罚「<u>策略去了参考模型不会去的地方</u>」⇒ 行为上<u>保守</u>。</b><b>⇒ <u>D(π_ref ‖ π_θ)</u>：惩罚「<u>策略丢掉了参考模型会去的地方</u>」⇒ 行为上<u>求全</u>。</b><br><b>⇒ <u>RLHF 用的是前者 —— 所以它倾向于让模型「不敢乱走」，而不是「什么都保留」</u>。</b><br><b>★★★ 所以写 <u>D(A‖B)</u> 时，<u>A 和 B 的顺序是有意义的，不能随便换</u></b>：<b>⇒ <u>这也是讲者坚持说「不是距离」的实际理由</u>。</b><br><b>⚠ 「<u>散度（divergence）</u>」这个词就是为这种「像距离但不是距离」的量准备的。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  setEq("$$D_{\\mathrm{KL}}(P\\,\\|\\,Q)=\\sum_i p_i\\,\\log\\frac{p_i}{q_i}$$","top");
  says("55:51","the sum of p i log of p i over q i",204);
  note("⇒ 你拿一个概率分布 P，和另一个概率分布 Q，然后算这条公式",640,234,"g");
  note("★★ 「它就给你一个数，说这两个概率分布有多远」⇒ 你想最小化损失 = 想最小化它们有多远",640,262,"v");},"<b>公式本身，而它读起来比看起来简单。</b><br><b>讲者的话</b>：<b>「<u>所以你拿一个概率分布，比如说 P，和另一个概率分布 Q。然后你算这条公式，也就是「p i 乘以 log of p i 除以 q i」的求和。它就给你一个数，说这两个概率分布有多远、有多不同。所以你想最小化那个损失。所以我想，你想最小化它们有多远</u>。」</b><br><b>★★★ 把这条公式读成一句人话</b>：<b>⇒ 对每一个可能的结果 <u>i</u>，看两个分布给它的概率之比 <u>p_i / q_i</u>。</b><b>⇒ 取对数（<u>比值为 1 时是 0</u>）。</b><b>⇒ 然后<u>按 P 的概率加权平均</u>。</b><b>⇒ <u>所以它是「在 P 看来，Q 和自己有多不一样」的平均程度</u>。</b><br><b>★★ 「<u>按 P 加权</u>」这件事正是它不对称的来源</b>：<b>⇒ <u>P 几乎不会产生的那些 i，就算 Q 在那里差很多，也几乎不被罚</u>。</b><b>⇒ <u>而 P 常产生的那些 i，Q 一旦差了就罚得很重</u>。</b><br><b>⇒ <u>换句话说：KL 只在「P 关心的地方」计较</u>。</b><br><b>★★★ 把它接回 RLHF：<u>D(π_θ ‖ π_ref) 只在「新策略真的会生成的那些地方」计较它和原模型的差别</u></b>：<b>⇒ <u>这恰好是我们想要的：我们在乎的是「它实际会说什么」，而不是「它理论上可能说什么」</u>。</b><br><b>⚠ 一个有用的性质：<u>KL ≥ 0，而且等于 0 当且仅当两个分布完全相同 —— 下一段讲者会专门问这件事</u>。</b>");
  SUM(0,29,{h:"⭐⭐ KL 散度",k:"<b>「我只是一直在说 KL 散度，但我不想就假设你知道那是什么」—— KL 散度是某种「度量」；「我不想说『距离』，因为距离这个词带着很多含义」⇒ 「它不是一个距离，但它是『两个概率分布有多远』的某种度量」</b>。公式：<b>你拿一个概率分布 P 和另一个 Q，算「p_i log(p_i / q_i)」的求和 ⇒ 「它就给你一个数，说这两个概率分布有多远」；而你想最小化损失，也就是想最小化它们有多远</b>。",m:"★★★ 「它不是一个距离」这个澄清很重要，原因很具体：<b>数学上的「距离」要满足非负、对称、三角不等式三条；KL 满足第一条，但它不对称（D(P‖Q) ≠ D(Q‖P)），也不满足三角不等式</b> ⇒ 「不对称」有真实后果：<b>D(π_θ ‖ π_ref) 惩罚「策略去了参考模型不会去的地方」⇒ 行为上保守；D(π_ref ‖ π_θ) 惩罚「策略丢掉了参考模型会去的地方」⇒ 行为上求全 —— RLHF 用的是前者，所以它倾向于让模型「不敢乱走」而不是「什么都保留」</b> ⇒ <b>所以写 D(A‖B) 时 A 和 B 的顺序是有意义的，不能随便换 —— 这也是讲者坚持说「不是距离」的实际理由</b>（而「散度」这个词就是为这种「像距离但不是距离」的量准备的）。",w:"★★★ 把公式读成一句人话：<b>对每一个可能的结果 i，看两个分布给它的概率之比 p_i / q_i，取对数（比值为 1 时是 0），然后按 P 的概率加权平均 ⇒ 它是「在 P 看来，Q 和自己有多不一样」的平均程度</b> ⇒ 「按 P 加权」正是它不对称的来源：<b>P 几乎不会产生的那些 i，就算 Q 在那里差很多也几乎不被罚；而 P 常产生的那些 i，Q 一旦差了就罚得很重 ⇒ KL 只在「P 关心的地方」计较</b> ⇒ <b>接回 RLHF：D(π_θ ‖ π_ref) 只在「新策略真的会生成的那些地方」计较它和原模型的差别 —— 这恰好是我们想要的：我们在乎的是「它实际会说什么」，而不是「它理论上可能说什么」</b>。",r:"⚠ 一个有用的性质：<b>KL ≥ 0，而且等于 0 当且仅当两个分布完全相同 —— 下一段讲者会专门问这件事（以及怎么证）</b>。"});
  QUIZ(0,29,{t:"为什么讲者坚持说 KL 散度「不是一个距离」？",o:["因为它不对称（D(P‖Q) ≠ D(Q‖P)）也不满足三角不等式 —— 所以两个分布写在前写在后是有分别的","因为它只对离散分布有定义","因为它没有单位","因为它可能是负的"],a:0,w:"⇒ 实践后果：RLHF 用的 D(π_θ ‖ π_ref) 只在「新策略真的会生成的那些地方」计较差别 —— 这恰好是我们想要的。"});
});

  note("★★ 他又一次没有满足于正确答案 —— 他要的是理由",640,380,"r");},"<b>一个小问题，而讲者又一次不满足于正确答案。</b><br><b>讲者的话</b>：<b>「<u>所以就一个小问题。所以，好。KL 散度是正的、还是负的，或者说关于 KL 散度你能告诉我什么？你见过 —— 对。它是正的。为什么它是正的？</u>」</b><br><b>★★★ 「<u>KL ≥ 0</u>」这件事为什么值得问</b>：<b>⇒ 因为从公式上看<u>一点也不显然</u>。</b><b>⇒ 式子里有 <u>log(p_i / q_i)</u>，而这个 log <u>既可以是正的，也可以是负的</u>。</b><b>⇒ <u>所以「它们加权求和之后总是非负」需要一个证明</u>。</b><br><b>★★ 而这个性质在这里是<u>必需</u>的，不只是好看</b>：<b>⇒ 损失里那一项是 <u>−β · KL</u>。</b><b>⇒ 如果 KL <u>可以是负的</u> ⇒ <u>模型可以靠「让 KL 变成负数」来免费赚取目标值</u>。</b><b>⇒ <u>那整个约束就失效了</u>。</b><br><b>⇒ <u>所以「KL ≥ 0」是这个正则项能起作用的前提</u>。</b><br><b>★★★ 这也是一个很好的习惯：<u>当你往损失里加一项时，先确认它的符号是不是被钉死的</u></b>:<b>⇒ <u>一个可正可负的惩罚项，不是惩罚项，是一个新的捷径</u>。</b><br><b>⚠ 讲者问「<u>为什么是正的</u>」而不是「<u>是不是正的</u>」—— <u>他这一讲里反复在做这件事</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,218,["讲者：「但为什么？」⇒ 「也许我们可以稍后再说」—— 但很好、很好","⇒ 「我想那个结论就在这里，但我想要的是『为什么』」","⭐ 学生答出来了 ⇒ 讲者：「完全正确」","⚠ 「因为当你看这个公式时，log 可以取正值也可以取负值 —— 它不是超级清楚」"],780,32,6);
  note("★★ 所以「你证明它总是正的、或者等于 0 的那个办法，是用 Jensen 不等式」",640,380,"r");},"<b>答案是 Jensen 不等式，而讲者先承认了「从公式上看不清楚」。</b><br><b>讲者的话</b>：<b>「<u>对。但为什么？所以也许我们可以稍后再说，但很好、很好。我想那个结论就在这里，但我想要的是「为什么」。是的。完全正确。所以对，如果你用 Jensen 不等式 —— 因为当你看这个公式时，我是说，log 可以取正值也可以取负值，它不是超级清楚。但对，你证明它总是正的、或者等于 0 的那个办法，是用 Jensen 不等式</u>。」</b><br><b>★★★ Jensen 不等式一句话：<u>对一个凸函数，「期望的函数值」不小于「函数值的期望」</u></b>：<b>⇒ 用在这里：<u>−log 是凸函数</u>。</b><b>⇒ 于是 <u>Σ p_i log(p_i/q_i) = −Σ p_i log(q_i/p_i) ≥ −log(Σ p_i · q_i/p_i)</u>。</b><b>⇒ 而右边 <u>= −log(Σ q_i) = −log 1 = 0</u>。</b><br><b>★★ 所以整个证明只有三步，<u>而关键在最后那个「概率加起来等于 1」</u></b>：<b>⇒ <u>正是因为 Q 是一个概率分布，Σq_i 才等于 1</u>。</b><b>⇒ <u>而 log 1 = 0 —— 这就是那个下界的来处</u>。</b><br><b>★★★ 这个证明值得你自己推一遍，<u>因为它只用了两件事：凸性，和概率归一</u></b>：<b>⇒ <u>而这两件事在机器学习里到处都是</u>。</b><br><b>⚠ 讲者说「<u>也许我们可以稍后再说</u>」—— <u>他想往下走，但学生答出来了，所以他还是确认了一下</u>。</b>");

  note("⇒ 酷。带着这个，我们就要「再深入一点那个损失函数」了",640,276,"y");
  note("★★ 这两个性质合起来，才让它成为一个合格的正则项：非负，且只在「不动」时为 0",640,314,"r");
  note("⚠ 「当且仅当」很关键 —— 它保证了「KL 为 0」等价于「策略一点没变」",640,352,"v");},"<b>第二个性质，而它和第一个合起来才让 KL 成为一个合格的正则项。</b><br><b>讲者的话</b>：<b>「<u>而所以，是的，这个量等于 0，当且仅当 P 和 Q 相等。酷。所以带着这个，我们就要再深入一点那个损失函数了</u>。」</b><br><b>★★★ 把两个性质放在一起，<u>你就看到它为什么适合做正则项</u></b>：<b>⇒ ① <u>KL ≥ 0</u> ⇒ <u>它只会扣分，不会白送分</u>。</b><b>⇒ ② <u>KL = 0 当且仅当两个分布相同</u> ⇒ <u>只有「一点没动」才不扣分</u>。</b><b>⇒ <u>合起来：任何偏离都要付出代价，而代价随偏离的程度增长</u>。</b><br><b>★★ 「<u>当且仅当</u>」这四个字是关键，<u>而不是可有可无的严谨</u></b>：<b>⇒ 如果只有「<u>P=Q 时 KL=0</u>」（单向）⇒ <u>可能存在「不同但 KL 也为 0」的分布对</u>。</b><b>⇒ <u>那模型就能找到一个「跑远了但不被罚」的方向</u>。</b><br><b>⇒ <u>而双向成立，就堵死了这条路</u>。</b><br><b>★★★ 请体会这个模式：<u>一个正则项要管用，需要「非负」和「零点唯一」两条一起成立</u></b>：<b>⇒ <u>这两条也正是「距离」这个概念最有用的那两条性质 —— 而 KL 虽然不是距离，却保留了它们</u>。</b><br><b>⚠ 讲者说「<u>酷，带着这个</u>」就走了 —— <u>接下来是这一讲里最烧脑的一段</u>。</b>");
  SUM(0,30,{h:"⭐ KL 为什么总是非负",k:"提问：<b>「KL 散度是正的、还是负的，或者说关于 KL 散度你能告诉我什么？」⇒ 「它是正的」⇒ 讲者追问「为什么它是正的？」</b> 答案：<b>「如果你用 Jensen 不等式 —— 因为当你看这个公式时，log 可以取正值也可以取负值，它不是超级清楚；但你证明它总是正的、或者等于 0 的那个办法，是用 Jensen 不等式」</b>；第二个性质：<b>「这个量等于 0，当且仅当 P 和 Q 相等」</b>。",m:"★★★ 「KL ≥ 0」值得问，是因为<b>从公式上看一点也不显然：式子里有 log(p_i / q_i)，而这个 log 既可以是正的也可以是负的 ⇒ 「它们加权求和之后总是非负」需要一个证明</b>；而这个性质在这里是<b>必需</b>的：<b>损失里那一项是 −β · KL，如果 KL 可以是负的，模型就可以靠「让 KL 变成负数」来免费赚取目标值，整个约束就失效了 ⇒ 「KL ≥ 0」是这个正则项能起作用的前提</b> ⇒ <b>好习惯：当你往损失里加一项时，先确认它的符号是不是被钉死的 —— 一个可正可负的惩罚项不是惩罚项，是一个新的捷径</b>。",w:"★★★ Jensen 不等式一句话：<b>对一个凸函数，「期望的函数值」不小于「函数值的期望」</b> ⇒ 用在这里：<b>−log 是凸函数，于是 Σ p_i log(p_i/q_i) = −Σ p_i log(q_i/p_i) ≥ −log(Σ p_i · q_i/p_i) = −log(Σ q_i) = −log 1 = 0</b> ⇒ <b>整个证明只有三步，而关键在最后那个「概率加起来等于 1」：正是因为 Q 是一个概率分布，Σq_i 才等于 1，而 log 1 = 0 —— 这就是那个下界的来处</b> ⇒ <b>这个证明值得自己推一遍，因为它只用了两件事：凸性，和概率归一 —— 而这两件事在机器学习里到处都是</b>。",r:"★★★ 把两个性质放在一起，<b>你就看到 KL 为什么适合做正则项</b>：<b>① KL ≥ 0 ⇒ 它只会扣分不会白送分；② KL = 0 当且仅当两个分布相同 ⇒ 只有「一点没动」才不扣分 ⇒ 合起来：任何偏离都要付出代价，而代价随偏离的程度增长</b>；「当且仅当」是关键而不是可有可无的严谨：<b>如果只有单向（P=Q 时 KL=0），可能存在「不同但 KL 也为 0」的分布对，那模型就能找到一个「跑远了但不被罚」的方向 —— 而双向成立堵死了这条路</b> ⇒ <b>一个正则项要管用，需要「非负」和「零点唯一」两条一起成立 —— 这也正是「距离」这个概念最有用的那两条性质，而 KL 虽然不是距离却保留了它们</b>。"});
  QUIZ(0,30,{t:"「KL ≥ 0」这个性质在 RLHF 里为什么是必需的？",o:["为了让梯度稳定","为了让损失有界","因为损失里那一项是 −β·KL —— 如果 KL 可以是负的，模型就能靠「让 KL 变负」免费赚目标值，约束就失效了","因为概率必须非负"],a:2,w:"⇒ 再加上「KL = 0 当且仅当两个分布相同」，才堵死了「跑远了但不被罚」那条路。证明用 Jensen 不等式，只用到凸性和概率归一。"});
});

  note("★★ 请把这个替换记住：目标项里那个 r，其实要换成 A",640,380,"r");},"<b>讲者主动承认前面说得不准确，而这个替换很重要。</b><br><b>讲者的话</b>：<b>「<u>所以我提到过，那个损失函数试图最大化奖励，但同时也让模型不要偏离基座模型太多。嗯，不过有件事我也稍微撒了点谎，就是：我们并不想最大化奖励。我们其实想最大化一个叫做 advantage 的量。那么 advantage 是什么？</u>」</b><br><b>★★★ 这是讲者在这一讲里第二次主动纠正自己，<u>而这种讲法值得学</u></b>：<b>⇒ 他先给一个<u>简化但好懂</u>的版本（最大化奖励）。</b><b>⇒ 等你接受了那个框架，<u>再把不准确的地方补上</u>。</b><br><b>★★ 这比一上来就给精确版本有效得多</b>：<b>⇒ 一上来就说「<u>我们最大化广义优势估计</u>」⇒ <u>你什么都接不住</u>。</b><b>⇒ 先说「<u>最大化奖励</u>」⇒ <u>你有了一个可以挂东西的钩子</u>。</b><br><b>⇒ <u>然后再说「其实是 advantage」⇒ 你只需要换掉一个零件</u>。</b><br><b>★★★ 请把这个替换记清楚：<u>损失里那一项的 r，要换成 A</u></b>：<b>⇒ <u>r</u>：这条回答<u>得了多少分</u>。</b><b>⇒ <u>A</u>：这条回答<u>比「预期」好了多少</u>。</b><br><b>⚠ 「<u>我撒了点谎</u>」这种说法在这一讲里出现了两次 —— <u>讲者很愿意承认自己先前说得粗糙</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 而我们用一个叫 value function（价值函数）的函数来「估计」那个 advantage",640,374,"r");},"<b>advantage 的定义只有一句话，而它解决的是一个很实际的问题。</b><br><b>讲者的话</b>：<b>「<u>所以你可以把 advantage 想成：你的输出，和你本来会预期的相比，好了多少。所以人们典型地用 advantage，是为了让整个过程、让训练更稳定。而我们用一个叫做 value function 的函数来估计那个 advantage —— 我们过一会儿会看到</u>。」</b><br><b>★★★ 为什么「<u>比预期好多少</u>」比「<u>得了多少分</u>」更有用</b>：<b>⇒ 假设某个 prompt<u>本来就很容易拿高分</u>（比如「你好」）。</b><b>⇒ 模型答得<u>平平无奇，也拿了 8 分</u>。</b><b>⇒ 如果你直接用 <u>r = 8</u> 当信号 ⇒ <u>模型会以为自己做得很好，于是强化这个平庸的回答</u>。</b><br><b>★★ 而用 advantage 就不会</b>：<b>⇒ 这个 prompt 的<u>预期分数是 8.5</u>。</b><b>⇒ 于是 <u>A = 8 − 8.5 = −0.5</u> ⇒ <u>模型知道「这次其实略低于我的正常水平」</u>。</b><br><b>⇒ <u>也就是说：advantage 把「这个题本来有多好拿分」这个因素扣掉了</u>。</b><br><b>★★★ 这就是「<u>降低方差</u>」的直观含义：<u>不同 prompt 的难度差异，不再被当成模型的好坏</u></b>：<b>⇒ <u>信号变干净了，训练自然更稳</u>。</b><br><b>⚠ 这个「<u>减去一个基线</u>」的思路非常通用 —— <u>讲者在 62:47 会专门再说一遍它为什么降方差</u>。</b>");
  SUM(0,31,{h:"⭐⭐⭐ 最大化的是 advantage",k:"<b>「我提到过那个损失函数试图最大化奖励、同时让模型别偏离基座太多 —— 嗯，不过有件事我也稍微撒了点谎：我们并不想最大化『奖励』，我们其实想最大化一个叫 advantage 的量」</b>。定义：<b>「你可以把 advantage 想成：你的输出，和你本来会预期的相比，好了多少」</b>；为什么：<b>「人们典型地用 advantage，是为了让整个过程、让训练更稳定」</b>；而<b>「我们用一个叫 value function 的函数来估计那个 advantage」</b>。",m:"★★★ 为什么「比预期好多少」比「得了多少分」更有用：<b>假设某个 prompt 本来就很容易拿高分（比如「你好」），模型答得平平无奇也拿了 8 分 —— 如果直接用 r = 8 当信号，模型会以为自己做得很好、于是强化这个平庸的回答</b> ⇒ 而用 advantage 就不会：<b>这个 prompt 的预期分数是 8.5，于是 A = 8 − 8.5 = −0.5，模型知道「这次其实略低于我的正常水平」⇒ advantage 把「这个题本来有多好拿分」这个因素扣掉了</b> ⇒ <b>这就是「降低方差」的直观含义：不同 prompt 的难度差异不再被当成模型的好坏 —— 信号变干净了，训练自然更稳</b>。",w:"★★★ 这是讲者第二次主动纠正自己，<b>而这种讲法值得学</b>：<b>他先给一个简化但好懂的版本（最大化奖励），等你接受了那个框架，再把不准确的地方补上</b> ⇒ <b>这比一上来就给精确版本有效得多：一上来说「我们最大化广义优势估计」你什么都接不住；先说「最大化奖励」你有了一个可以挂东西的钩子，然后再说「其实是 advantage」—— 你只需要换掉一个零件</b>。",r:"⇒ 请把这个替换记清楚：<b>损失里那一项的 r 要换成 A —— r 是「这条回答得了多少分」，A 是「这条回答比预期好了多少」</b>。⚠ <b>「我撒了点谎」这种说法在这一讲里出现了两次 —— 讲者很愿意承认自己先前说得粗糙</b>；而「减去一个基线」的思路非常通用，<b>讲者在 62:47 会专门再说一遍它为什么降方差</b>。"});
  QUIZ(0,31,{t:"为什么 RL 这一步最大化的是 advantage 而不是奖励本身？",o:["因为奖励需要归一化","因为奖励可能是负的","因为 advantage 更容易计算","因为 advantage 把「这个题本来有多好拿分」扣掉了 —— 不同 prompt 的难度差异不再被当成模型的好坏，于是信号更干净、训练更稳"],a:3,w:"⇒ 例子：一个本来就容易拿 8.5 分的 prompt，模型拿了 8 分 —— 用 r 会以为自己很好，用 A = −0.5 才知道其实略低于正常水平。"});
});

  note("⚠ 而 value function 正是用来把那一个分数「摊」到几百个 token 上去的",640,374,"v");},"<b>两个量，而它们的粒度完全不同 —— 这正是整件事的要点。</b><br><b>讲者的话</b>：<b>「<u>所以我们有两个量。我们有那个奖励，我们前面看到了它怎么算：给定一个 prompt、给定一条 completion，这个 prompt 和 completion 有多好？然后那个 value function 是另一个估计，但这个估计不在 completion 的层面。它其实是在 token 的层面</u>。」</b><br><b>★★★ 这个粒度差正是 24:58 那个追问留下的问题</b>：<b>⇒ 奖励<u>只在整条生成完之后给一次</u>。</b><b>⇒ 但策略<u>做了几百个决定（每个 token 一个）</u>。</b><b>⇒ <u>那这一个分数，该算在哪个决定头上</u>？</b><br><b>★★ 这就是 RL 里的经典难题：<u>功劳分配（credit assignment）</u></b>：<b>⇒ 一盘棋输了，<u>是哪一步走错了</u>？</b><b>⇒ 一条回答得了低分，<u>是哪个 token 害的</u>？</b><br><b>⇒ <u>而 value function 就是用来回答这个问题的工具</u>。</b><br><b>★★★ 它的思路很巧妙：<u>既然我不知道「哪一步错了」，那我就估计「每一步之后，预期还能得多少分」</u></b>：<b>⇒ 某一步之后预期<u>掉了一截</u> ⇒ <u>那一步就是坏的</u>。</b><b>⇒ 某一步之后预期<u>升了一截</u> ⇒ <u>那一步就是好的</u>。</b><br><b>⇒ <u>于是「一个最终分数」被转化成了「每一步的得失」</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,218,["我们这里做的，是「拿那个 prompt、连同『部分生成出来的内容』作为输入」","⭐ 然后「试着估计：如果我们按照那个策略继续把输出生成下去，那个奖励会是多少」","⇒ 讲者：「我再重复一遍这句话，因为它含义很重」","⭐ 「value function 是『奖励』的一个 token 级估计 —— 它吃一个部分输入，然后预测那个奖励」"],780,32,6);
  note("★★ 关键词是「如果你按那个策略继续生成下去」—— 它估的是未来，不是现在",640,380,"r");},"<b>讲者说这句话「含义很重」，所以他把它重复了一遍。</b><br><b>讲者的话</b>：<b>「<u>所以我们这里做的，是拿那个 prompt 连同那部分已经生成出来的内容作为输入。然后我们试着估计：如果我们按照那个策略继续把输出生成下去，那个奖励会是多少。所以我要把这句再重复一遍，因为它含义很重。那个 value function 是「奖励」的一个 token 级估计，它吃一个部分输入，然后预测那个奖励 —— 也就是，如果你在生成时遵循那个策略的话，它预测那个奖励</u>。」</b><br><b>★★★ 这句话里有三个要素，<u>缺一不可</u></b>：<b>⇒ ① <u>输入是「部分的」</u>：prompt + 已经生成的前半截。</b><b>⇒ ② <u>输出是「最终的奖励」</u>：不是当前的，是<u>整条写完之后的那个</u>。</b><b>⇒ ③ <u>前提是「按当前策略继续生成」</u>：<u>换一个策略，这个估计就不对了</u>。</b><br><b>★★ 第 ③ 点特别重要，<u>它说明 value function 是「依附于某个策略」的</u></b>：<b>⇒ 策略一变 ⇒ <u>同一个半句话的「预期最终得分」就变了</u>。</b><b>⇒ <u>所以 value function 必须跟着策略一起更新 —— 这就是下一镜「联合训练」的原因</u>。</b><br><b>★★★ 用一个比喻：<u>它像一个在棋局中途估「现在这个局面大概能赢多少」的评估函数</u></b>：<b>⇒ <u>棋还没下完，但它给你一个预判</u>。</b><b>⇒ <u>而这个预判是「假设双方都按现在的水平继续下」</u>。</b><br><b>⚠ 讲者重复了一遍 —— <u>这在整讲里只发生过三四次，都是在最关键的句子上</u>。</b>");

  note("★★ 注意和奖励模型的对比：奖励模型是「概率式的分类」，而价值头是「真正的回归」",640,380,"r");},"<b>实现上它只是一个头，而它和奖励模型那个头的性质正好相反。</b><br><b>讲者的话</b>：<b>「<u>所以换句话说，你有你的 LLM，它被初始化成那个 SFT 模型，它生成预测。所以你典型地做的，是还有一个 value head，它也 —— 所以这一次，它不是一个分类问题。它是一个回归问题。你试着估计：如果你按照策略继续生成，那个最终的奖励会是多少。所以这典型地也是你需要和策略联合训练的东西</u>。」</b><br><b>★★★ 请把这个头和奖励模型那个头对照一下，<u>它们的性质正好相反</u></b>：<b>⇒ <u>奖励模型的头</u>：训练时<u>只有「谁赢」的 0/1 标签</u> ⇒ 是一个<u>概率式的分类</u>。</b><b>⇒ <u>价值头</u>：训练时<u>有真实的数值目标</u>（那条回答最终拿到的奖励）⇒ <u>是一个真正的回归</u>。</b><br><b>★★ 价值头的训练目标是什么，<u>讲者没说，但很直接</u></b>：<b>⇒ 一条 roll-out 生成完了 ⇒ <u>你知道它最终的奖励是多少</u>。</b><b>⇒ 于是对这条回答的<u>每一个前缀</u>，<u>价值头都该预测出那个最终奖励</u>。</b><b>⇒ <u>用均方误差去拟合 —— 这就是一个标准的回归</u>。</b><br><b>★★★ 而「<u>value head</u>」这个说法说明了一个省钱的实现技巧</b>：<b>⇒ 它<u>可以和策略共享主干</u>，只是多一个输出头。</b><b>⇒ <u>于是第四个「模型」其实不一定是完整的第四份权重</u>。</b><br><b>⚠ 不过实践中也常常用一个独立的价值模型 —— <u>因为共享主干会让两个目标互相干扰</u>。</b>");

  stack(640,218,["高层来说：我们想要的是「最大化奖励、但不偏离基座模型太多」","⭐ 而我们还想「找一个办法，让那些奖励相对于『你本来会预期的』更相对一些」","⇒ 「你想把你拿到的那些奖励，和一个『平均的回答』去比」","⭐ 想法是：如果你拿到了一个很好的奖励，那「在平均情况下奖励会是多少」？—— 而你想最大化那个差"],780,32,6);
  note("★★ 而人们用「奖励减基线」的原因，是「它降低了这些估计的方差」⇒ 「训练通常就跑得更快」",640,380,"r");},"<b>这一段的收口，而它把 advantage 的理由说得最清楚。</b><br><b>讲者的话</b>：<b>「<u>所以换句话说，我们想要的是最大化奖励、但不偏离基座模型太多。但我们想要的，其实是找一个办法，让那些奖励相对于「你实际上会预期的」更相对一些。所以你想把你拿到的那些奖励，和一个平均的回答去比，如果你愿意这么说的话。这个想法是：好，如果你拿到了一个很棒的奖励，那在平均情况下奖励会是多少？而你想最大化那个。而人们之所以用「奖励减基线」，是因为它降低了这些估计的方差，而且它通常就让训练跑得更快</u>。」</b><br><b>★★★ 「<u>减去一个基线会降低方差</u>」这件事有一个很漂亮的性质，<u>值得知道</u></b>：<b>⇒ 只要那个基线<u>不依赖于你当前采取的那个动作</u>。</b><b>⇒ 那么减掉它<u>不会改变梯度的期望</u>（也就是<u>不引入偏差</u>）。</b><b>⇒ <u>但它会减小梯度的方差</u>。</b><br><b>★★ 所以这是一笔「<u>白赚</u>」的交易</b>：<b>⇒ <u>期望不变</u>（还是朝着正确的方向）。</b><b>⇒ <u>方差变小</u>（每一步的噪声更小）。</b><b>⇒ <u>于是同样的步数能走得更远，训练更快也更稳</u>。</b><br><b>⇒ <u>这在 RL 里叫「基线方法」，而 value function 就是最常用的那个基线</u>。</b><br><b>★★★ 直观地说：<u>如果所有回答都能拿 8 分，那「拿到 8 分」这件事不含任何信息</u></b>：<b>⇒ <u>减去 8 之后，剩下的才是「这一条到底比别的强在哪」</u>。</b><b>⇒ <u>而梯度应该只对那部分有反应</u>。</b><br><b>⚠ 这个思路你在别处也会见到：<u>任何时候你发现「信号里有一大块是所有样本共有的」，减掉它通常都是对的</u>。</b>");
  SUM(0,33,{h:"⭐ GAE 与「减去基线」",k:"边界：<b>「我是有意地不去太深入『那个 advantage 究竟是怎么被表述出来的』—— 它就是超出这门课的范围了」；但万一你有兴趣，「我会强烈推荐读这篇在数学上相当繁重的论文」：High-Dimensional Continuous Control Using Generalized Advantage Estimation（GAE）—— 「这典型地就是人们用来估计这些 advantage 的方法」</b>。收口：<b>高层来说，我们想「最大化奖励但不偏离基座模型太多」，而我们还想「找一个办法，让那些奖励相对于『你本来会预期的』更相对一些」—— 「你想把你拿到的那些奖励，和一个平均的回答去比」；而人们用「奖励减基线」，是因为「它降低了这些估计的方差」，而且「通常让训练跑得更快」</b>。",m:"★★★ 「减去一个基线会降低方差」有一个很漂亮的性质：<b>只要那个基线不依赖于你当前采取的那个动作，减掉它就不会改变梯度的期望（不引入偏差），但会减小梯度的方差</b> ⇒ <b>所以这是一笔「白赚」的交易：期望不变（还是朝正确方向），方差变小（每步噪声更小）⇒ 同样的步数能走得更远，训练更快也更稳 —— 这在 RL 里叫「基线方法」，而 value function 就是最常用的那个基线</b> ⇒ <b>直观地说：如果所有回答都能拿 8 分，那「拿到 8 分」这件事不含任何信息；减去 8 之后，剩下的才是「这一条到底比别的强在哪」—— 而梯度应该只对那部分有反应</b>（这个思路你在别处也会见到：<b>任何时候你发现「信号里有一大块是所有样本共有的」，减掉它通常都是对的</b>）。",w:"★★ 这是这一讲第三次明确划掌握边界，而三次的尺度不一样：<b>L4 的模型并行是「细节不需要知道」；L4 的 FlashAttention 缩放因子是「不必去背那个公式」；这里是「超出这门课的范围」—— 这是最重的一次</b> ⇒ 所以这一条的掌握程度只需要到：<b>知道 advantage 是「比预期好多少」、知道它靠 value function 估计、知道那个具体公式叫 GAE 而且它有超参 —— 不需要知道 GAE 的递推式长什么样</b>。",r:"⇒ <b>GAE</b> 的核心思路其实可以一句话说完（虽然讲者没说）：<b>它在「只看下一步」（偏差大、方差小）和「看到底」（偏差小、方差大）之间，用一个超参 λ 做指数加权的插值</b>。⚠ <b>那篇论文是 2015 年的，作者是 John Schulman —— 也正是 PPO 的作者</b>。"});
  QUIZ(0,33,{t:"「奖励减去一个基线」为什么是一笔「白赚」的交易？",o:["只要基线不依赖当前动作，减掉它不改变梯度的期望（无偏），但会减小方差 ⇒ 训练更快更稳","因为它让奖励变小了","因为它消掉了 KL 项","因为它让奖励变成非负"],a:0,w:"⇒ 直观上：如果所有回答都能拿 8 分，「拿到 8 分」就不含信息 —— 减去 8 之后剩下的才是「这一条强在哪」。value function 就是最常用的那个基线。"});
});

  note("★★ 「所以就知道：我们想最大化它。我们不想最小化。」",640,380,"r");},"<b>第一个陷阱：那个 L 不是要最小化的 —— 尽管它写成 L。</b><br><b>讲者的话</b>：<b>「<u>所以在我们进细节之前，我只想点出几件可能看起来让人困惑的事 —— 因为它当初也把我搞糊涂了。所以首先，那个公式被表述成「L 等于」，但它其实不是某个我们想最小化的东西，而是某个我们想最大化的东西。所以人们说 L 时，典型地指的是 loss。所以对，就知道我们想最大化那个。我们不想最小化</u>。」</b><br><b>★★★ 这个陷阱为什么会存在，<u>追溯一下很有意思</u></b>：<b>⇒ 在监督学习里，<u>L 一律是「损失」，一律最小化</u> —— 这是一个很深的条件反射。</b><b>⇒ 而在 RL 里，<u>人们习惯写「目标函数」，而目标函数是要最大化的</u>。</b><b>⇒ <u>两个传统撞在一起，而 PPO 论文用了 RL 那边的习惯，却沿用了 L 这个字母</u>。</b><br><b>★★ 所以读 PPO 相关代码时，<u>你会看到一个很怪的写法</u></b>：<b>⇒ 代码里通常写 <u>loss = -policy_objective</u>。</b><b>⇒ <u>那个负号就是在把「要最大化的 L」转成「可以喂给优化器最小化的 loss」</u>。</b><br><b>⇒ <u>看到那个负号时，别以为是 bug</u>。</b><br><b>★★★ 这一条值得记，<u>因为它是读 RL 代码最常见的第一个绊脚石</u></b>：<b>⇒ <u>先确认手上这个 L，到底是要往上还是往下</u>。</b><br><b>⚠ 讲者说「<u>它当初也把我搞糊涂了</u>」—— <u>一个讲者承认自己被符号绊过，这对学生是很大的宽慰</u>。</b>");

  note("⚠ KL 惩罚参照 SFT 模型；而 clip 参照「上一步的自己」",640,374,"d");},"<b>第三个陷阱，而讲者把那句话连说了两遍。</b><br><b>讲者的话</b>：<b>「<u>所以这里我们说 old 的时候，它不是那个 SFT 模型。它不是那个 SFT 模型。它是 RL 阶段中上一次迭代的那个模型 —— 因为这里我们想要的，是让那个策略不要有太宽的更新。到这里还好吗？</u>」</b><br><b>★★★ 这就是 54:05 那里埋下的那个区分，<u>现在被明确点破了</u></b>：<b>⇒ <u>参照物一：π_ref</u> = <u>SFT 模型</u>，<u>整个训练过程中固定不动</u>。</b><b>⇒ <u>参照物二：π_old</u> = <u>上一次迭代的策略</u>，<u>每一轮都在变</u>。</b><br><b>★★ 两者管的事也完全不同</b>：<b>⇒ <u>离 π_ref 太远</u> ⇒ <u>你变成了另一个模型</u>（忘了知识、被 reward hack）。</b><b>⇒ <u>离 π_old 太远</u> ⇒ <u>这一步迈太大</u>（训练不稳、可能直接崩）。</b><br><b>⇒ <u>一个管「终点别跑偏」，一个管「每步别太急」</u>。</b><br><b>★★★ 用一个比喻：<u>π_ref 是家，π_old 是你上一秒站的地方</u></b>：<b>⇒ 「<u>别离家太远</u>」和「<u>别一步跨太大</u>」是两条独立的约束。</b><b>⇒ <u>你可以每步都很小，却慢慢走到天边；也可以一步就跳出家门</u>。</b><b>⇒ <u>所以两条都要有</u>。</b><br><b>⚠ 讲者连说两遍「<u>它不是 SFT 模型</u>」—— <u>这是整讲里他重复得最急的一句</u>。</b>");
  SUM(0,35,{h:"⭐⭐⭐ 三个符号陷阱",k:"讲者：<b>在进细节之前，我想点出几件「可能看起来让人困惑」的事 —— 「因为它当初也把我搞糊涂了」</b>。① <b>「那个公式被写成 L 等于……，但它其实不是我们想最小化的东西，而是我们想最大化的东西」—— 因为人们说 L 时通常指 loss ⇒ 「就知道我们想最大化它，我们不想最小化」</b>。② <b>「我们引入了一个叫 R of theta 的项 —— 这不是那个奖励模型」；人们通常用 R 表示 reward，但这里不是 —— 「它其实是我们的策略和上一步的策略之间在概率上的比值」（上一步记作 π_old），「它量化的是：你当前阶段的策略和你的旧策略有多不同」</b>。③ <b>「这里我们说 old 时，它不是 SFT 模型。它不是 SFT 模型。」—— 它是「RL 阶段中上一次迭代的那个模型」，因为这里我们想要的是「策略不要有太宽的更新」</b>。",m:"★★★ 陷阱一为什么存在，追溯一下很有意思：<b>在监督学习里 L 一律是「损失」、一律最小化（一个很深的条件反射）；而在 RL 里人们习惯写「目标函数」，目标函数是要最大化的 ⇒ 两个传统撞在一起，而 PPO 论文用了 RL 那边的习惯却沿用了 L 这个字母</b> ⇒ 所以读 PPO 代码时你会看到一个怪写法：<b>loss = -policy_objective —— 那个负号是在把「要最大化的 L」转成「可以喂给优化器最小化的 loss」，看到它别以为是 bug</b> ⇒ <b>这是读 RL 代码最常见的第一个绊脚石：先确认手上这个 L 到底是要往上还是往下</b>。",w:"★★★ 陷阱二最要命，<b>因为这一讲里 r 和 R 同时存在而它们毫无关系</b>：<b>r(x, y) 是奖励模型给的分（前面一直在用）；R(θ) 是两个策略的概率比值（这里新引入）—— 一个是「这条回答好不好」，一个是「策略变了多少」</b> ⇒ R(θ) 用三个值就看清：<b>R = 1 表示新旧策略给这个动作的概率一样（没变）；R 大于 1 表示新策略更愿意做这个动作了；R 小于 1 表示更不愿意了 ⇒ R 就是「这一步你把这个动作的概率推了多少」的度量</b> ⇒ <b>于是裁剪 [1−ε, 1+ε] 的含义就清楚了：不许一步把某个动作的概率推得太多 —— 推得太狠就超出带子、梯度被削平、这一步不再获得额外收益</b>；⚠ <b>实用建议：读 PPO 的论文或代码时，先把 R(θ) 在脑子里改名叫 ratio，混淆立刻消失</b>。",r:"★★★ 陷阱三就是 54:05 埋下的那个区分，现在被明确点破：<b>参照物一 π_ref = SFT 模型，整个训练过程中固定不动；参照物二 π_old = 上一次迭代的策略，每一轮都在变</b> ⇒ 两者管的事完全不同：<b>离 π_ref 太远 ⇒ 你变成了另一个模型（忘了知识、被 reward hack）；离 π_old 太远 ⇒ 这一步迈太大（训练不稳、可能直接崩）—— 一个管「终点别跑偏」，一个管「每步别太急」</b> ⇒ <b>比喻：π_ref 是家，π_old 是你上一秒站的地方 —— 「别离家太远」和「别一步跨太大」是两条独立的约束：你可以每步都很小却慢慢走到天边，也可以一步就跳出家门，所以两条都要有</b>。⚠ <b>讲者连说两遍「它不是 SFT 模型」—— 这是整讲里他重复得最急的一句</b>。"});

  stack(640,218,["「如果那个 advantage 是正的，意思是我们某种程度上想去『强化』刚才被生成出来的东西」","⇒ 那我们的目标函数「会长成这样」：","⭐ 「如果 A 是正的，那个 L_CLIP 关于 R 会是某种线性函数」—— 因为它是 R 乘以 A","⚠ 「然后在 1 加 ε 之后，它就只是平的了」"],780,32,6);

  note("★★ 「这就是为什么我们有这个裁剪机制」—— 两句话，一个机制",640,380,"r");},"<b>为什么要这个形状 —— 回到 R 的含义，两句话就说清了。</b><br><b>讲者的话</b>：<b>「<u>那我们为什么想让我们的图是这样一个形状？嗯，我们需要再想一下 R 意味着什么。所以如果 A 是正的，意思是某种我们想强化的东西，那我们通常想让「刚才发生的那件事」的概率增大。所以我们想让 R 更高。但我们不想让它太高。所以这就是为什么我们有这个裁剪机制</u>。」</b><br><b>★★★ 这两句话之间的张力，<u>正是 PPO 要解决的全部问题</u></b>：<b>⇒ 「<u>我们想让 R 更高</u>」—— 因为这一步是好的，<u>应该多做</u>。</b><b>⇒ 「<u>但我们不想让它太高</u>」—— 因为<u>一步推太猛，训练会崩</u>。</b><br><b>★★ 为什么「<u>推太猛会崩</u>」，这件事在 RL 里有具体的原因</b>：<b>⇒ 那个 advantage <u>A 是在「旧策略」下估出来的</u>。</b><b>⇒ 一旦新策略离旧策略太远 ⇒ <u>A 的估计就不再适用了</u>。</b><b>⇒ <u>你在用一个过期的估计，去做一个很大的更新 —— 那当然危险</u>。</b><br><b>⇒ <u>所以裁剪的真正理由是：「我对这个方向的信心，只在旧策略附近有效」</u>。</b><br><b>★★★ 这也解释了为什么参照物必须是 <u>π_old</u> 而不是 π_ref</b>：<b>⇒ <u>因为「估计是否还有效」取决于「离采样时的那个策略有多远」，而不是「离家有多远」</u>。</b><br><b>⚠ 讲者没有展开这个理由 —— <u>但它是 PPO 名字里 proximal 真正的技术含义</u>。</b>");

  note("★★ 所以 R 的分子分母都是「同一个 token 在同一个前缀下的概率」，只是来自两个不同的权重",640,380,"r");},"<b>最后一个追问，而答案把 R 落到了一个你每天都在看的东西上。</b><br><b>讲者的话</b>：<b>「<u>所以问题是，你怎么量化 R？R 是什么？它意味着什么？所以它典型地是一个 token 相对于那些输入发生的概率。所以你可以想一想你的 LLM 在输出端得到的那个概率分布。所以你会用那个</u>。」</b><br><b>★★★ 把 R 落到实处，<u>它就是两个 softmax 输出里的两个数相除</u></b>：<b>⇒ 拿当前策略跑一遍 ⇒ <u>在位置 t 得到词表上的一个分布</u> ⇒ <u>取出真实生成的那个 token 的概率</u>。</b><b>⇒ 拿旧策略跑一遍 ⇒ <u>同样取出那个 token 的概率</u>。</b><b>⇒ <u>两者相除，就是 R</u>。</b><br><b>★★ 注意一个很重要的实现细节：<u>分子分母用的是「同一个 token、同一个前缀」</u></b>：<b>⇒ 也就是说：<u>两个策略在评价「同一条已经生成好的回答」</u>。</b><b>⇒ <u>旧策略不需要重新生成，它只需要「打分」</u>。</b><br><b>⇒ <u>这就是为什么保留一份旧策略的代价是可以接受的：它只做前向，不做生成</u>。</b><br><b>★★★ 而这也解释了 21:08 那条性质为什么重要：<u>policy 就是模型输出的概率分布</u></b>：<b>⇒ <u>正因为如此，R 才能被直接算出来 —— 不需要任何额外的模型</u>。</b><br><b>⚠ 实现上通常算的是 <u>log 概率之差再取指数</u>，<u>因为直接相除容易数值不稳</u>。</b>");

  note("★★ 于是实际的损失里同时有：ratio 的裁剪（对上一轮）＋ KL 惩罚（对基座）",640,380,"r");},"<b>今天的真实做法是两个混着用，而这正好对上前面那两条约束。</b><br><b>讲者的话</b>：<b>「<u>另一件我要说的是，如今当有人想用 PPO 训一个策略时，他们典型地会用那个 KL 散度，而他们可能还会把它和「跟旧迭代做裁剪」那件事混起来。他们基本上会把两者混在一起</u>。」</b><br><b>★★★ 混起来之后，那个损失里同时有三块，<u>而它们各管各的</u></b>：<b>⇒ <u>ratio × advantage</u> ⇒ <u>往对的方向推</u>。</b><b>⇒ <u>clip（对 π_old）</u> ⇒ <u>一步别跨太大</u>。</b><b>⇒ <u>KL 惩罚（对 π_ref）</u> ⇒ <u>别离家太远</u>。</b><br><b>★★ 这正好把前面那两条约束都装进去了</b>：<b>⇒ <u>速度的上限</u>（clip）。</b><b>⇒ <u>位移的上限</u>（KL）。</b><br><b>⇒ <u>而这也解释了 71:13 那个追问的答案：「在我们典型用于 LLM 的那个表述里，我们有（考虑基座模型）」</u>。</b><br><b>★★★ 所以如果你去读一份真实的 RLHF 代码，<u>你会看到的是这个三块的混合版，而不是论文里任何一个纯变体</u></b>：<b>⇒ <u>这件事对读代码很重要：论文和实现之间有一层「社区约定」</u>。</b><br><b>⚠ 而 KL 那一项在实现上还有一个细节：<u>它常常不是作为损失项，而是直接「从奖励里减掉」—— 两种写法等价，但代码看起来很不一样</u>。</b>");

  SUM(0,39,{h:"⭐⭐ KL penalty 与混用",k:"<b>「这是 PPO 论文提到的第一个变体 —— PPO-Clip；而我们有的第二个变体，是用 KL 散度的那一个，它叫 KL penalty」—— 它是「ratio 乘以 advantage，减去『旧策略（上一次迭代）和当前迭代之间的 KL 散度』」</b>。历史错位：<b>「事实上 old 指的是『上一次 RL 迭代』，但如今人们用的是『参考』—— 因为这篇论文发表在 2017 年，而在 2025 年 LLM 更多地变成了 2020 年代才流行起来的东西；所以在『你会放进那个 KL 散度里的是什么』这件事上就有了这个差别」</b>。今天的做法：<b>「如今当有人想用 PPO 训一个策略时，他们典型地会用那个 KL 散度，而他们可能还会把它和『跟旧迭代做裁剪』那件事混起来 —— 他们基本上会把两者混在一起」</b>；免责：<b>「损失可以有很多很多不同的表述，所以我说的并不总是对的」</b>。",m:"★★★ 两个变体做的是同一件事但手段不同：<b>Clip 是「一旦走太远就不再给收益」（削平目标）；KL penalty 是「走多远就扣多少分」（直接减一项）</b> ⇒ 性格也不一样：<b>Clip 是「硬」的（带子之内完全不管，之外完全不给）；KL penalty 是「软」的（走一点罚一点，连续可调）—— 硬的更容易调（只有一个 ε 而且含义直观），软的更灵活（但 β 不好定）</b> ⇒ <b>PPO 原论文的结论是 Clip 在实践中更好、也更好调，所以通常的 RL 里 PPO 基本就是指 PPO-Clip；但在 LLM 这个场景里情况反过来了</b>。",w:"★★★ 那个历史错位很值得体会：<b>2017 年的 PPO 是为机器人、游戏设计的 —— 那里没有「基座模型」这个东西，所以它唯一能参照的就是「上一轮的自己」；而 LLM 场景里多了一个很宝贵的东西：一个已经很好的起点</b> ⇒ 于是那个 KL 项的参照物自然就该换：<b>参照上一轮只能防「步子太大」，参照基座还能防「走着走着忘了自己是谁」—— 在 LLM 这里后者是更紧要的风险，所以换得有道理</b> ⇒ <b>请记住这个模式：借用一个成熟算法时，要问「它原本的场景和我的场景差在哪」—— 而差别最大的那个地方，往往就是你该改的那个零件</b>（这也解释了为什么 LLM 这边反而是 KL penalty 更常用：只有它能参照基座）。",r:"★★★ 混起来之后那个损失里同时有三块，各管各的：<b>ratio × advantage（往对的方向推）、clip 对 π_old（一步别跨太大）、KL 惩罚对 π_ref（别离家太远）⇒ 正好把「速度的上限」和「位移的上限」都装进去了</b>，<b>这也解释了 71:13 那个追问的答案</b> ⇒ <b>所以读一份真实的 RLHF 代码，你看到的是这个三块的混合版，而不是论文里任何一个纯变体 —— 论文和实现之间有一层「社区约定」</b>；⚠ <b>KL 那一项在实现上还有个细节：它常常不是作为损失项，而是直接「从奖励里减掉」—— 两种写法等价，但代码看起来很不一样</b>。⇒ 而「我说的并不总是对的」这个免责本身是一条有用的信息：<b>这个领域里不存在「唯一正确的损失函数」，每份实现每篇论文都可能有自己的变体</b> ⇒ <b>读 RLHF 论文的正确姿态：先认那几个不变的零件（奖励、advantage、比值、两种约束），再看这一篇把它们怎么拼 —— 不要指望找到一个「标准的 RLHF 损失」，那个东西不存在</b>。"});
  QUIZ(0,39,{t:"PPO 论文里 KL 的参照物是「上一次迭代」，为什么 LLM 这边换成了「参考模型」？",o:["因为上一次迭代不好保存","因为计算更快","因为 2017 年的 PPO 是为机器人、游戏设计的，那里没有「基座模型」；而 LLM 多了一个很好的起点，「忘了自己是谁」才是更紧要的风险","因为 KL 必须对冻住的模型算"],a:2,w:"⇒ 而今天人们把两者混着用：clip 对 π_old（管步长）+ KL 对 π_ref（管位移）。读真实代码时看到的是这个混合版，不是论文里的纯变体。"});

  SUM(0,40,{h:"⭐⭐⭐ 四个模型",k:"<b>「但问题是：对 PPO 来说，你需要很多模型」—— 你需要你的策略（正在训的那个 LLM）、你还需要那个 value function（用于 advantage 估计）、你当然还需要那个奖励模型、然后你需要那个基座模型（「基座模型是冻住的，就是那个 SFT 模型，为的是能和当前策略做比较」）⇒ 「所以这是很多模型」</b>。关键问题：<b>「你真的需要有所有这些模型，才能表现得好吗？⇒ 而答案是：也许不。也许要，但也许不」—— 「如今有一堆别的方法正在变得更流行，所以你可能在『推理模型』的语境下听说过 GRPO」</b>；<b>我们下周第 6 讲会更详细看 GRPO；如果你想预习，可以看 DeepSeek 团队那篇引入 GRPO 的论文</b>。",m:"★★★ 四个模型，两个在训两个冻住，算一笔账（<b>都用 7B、fp16</b>）：<b>两个在训的各约 84 GB（L4 算过：权重 + 梯度 + 优化器状态）⇒ 168 GB；两个冻住的各 14 GB ⇒ 28 GB；合计约 200 GB，而 SFT 只要 84 GB ⇒ RLHF 的显存开销大约是 SFT 的两倍半</b> ⇒ <b>而这还没算「生成」的开销：RL 每一步都要让策略真的生成一整条回答，而那很慢 —— 所以时间上的开销比显存更吓人</b>。",w:"★★★ 「你真的需要全部吗」这个问题<b>组织起了这一讲剩下的所有内容</b>：<b>GRPO（下一讲）去掉价值模型 —— 用一组采样的平均分当基线；Best-of-N（马上讲）去掉策略训练本身 —— 一个权重都不改；DPO（后半场）去掉奖励模型和价值模型 —— 只剩两个</b> ⇒ <b>所以后半段是一条很清楚的「减法」线：四个模型 → 三个（GRPO）→ 两个（DPO）→ 零个在训（Best-of-N），每一步都在问「这个零件真的必要吗」</b> ⇒ <b>这是一个值得记住的研究范式：当一个方法需要很多部件时，最有价值的问题往往是「哪一个可以去掉」—— 而答案常常是「有好几个都可以」</b>。",r:"⇒ <b>GRPO</b> 的核心想法可以先剧透：<b>价值模型的作用是给出一个基线（「这个 prompt 预期能得多少分」），而 GRPO 说：那我对同一个 prompt 采样一组回答，用这一组的平均分当基线不就行了？⇒ 价值模型整个被去掉，四个变三个</b> ⇒ 它在 LLM 上可行是<b>因为采样很便宜</b>：<b>在机器人上「把同一个局面重跑十遍」往往做不到，而在 LLM 上同一个 prompt 采十条回答是家常便饭 ⇒ GRPO 又是一个「因为场景变了，所以零件可以换掉」的例子</b>；<b>那篇论文是 DeepSeekMath（2024），而 GRPO 后来成了 DeepSeek-R1 的核心算法 —— 讲者在 2025 年春说「你可以先看看」，而几个月后它成了整个领域最热的东西</b>。⇒ 这也是 23:26 那句伏笔的兑现（隔了整整五十分钟）：<b>那时学生问「这会不会很贵」，讲者答「单步差不多，但相比 SFT 确实加了一些部件」—— 而现在那些部件被一个个点名了</b>。"});
  QUIZ(0,40,{t:"PPO 做 RLHF 时要同时养哪四个模型？",o:["策略、旧策略、奖励模型、价值函数","策略（在训）、价值函数（在训）、奖励模型（冻住）、基座/参考模型（冻住）","策略、奖励模型、分词器、评估器","两个策略和两个奖励模型"],a:1,w:"⇒ 7B 下合计约 200 GB（SFT 只要 84 GB）。而「你真的都需要吗」这个问题组织起了后半段：GRPO 去掉价值模型，DPO 去掉奖励和价值，Best-of-N 一个都不训。"});

  note("★★ 而且「光是这个训练配方本身，就不是最简单的那种」",640,380,"r");},"<b>第一个挑战是流程上的，而它是任何多阶段流水线的通病。</b><br><b>讲者的话</b>：<b>「<u>所以我也想讲讲基于 RL 的方法会碰到的一些挑战。所以第一个是：你需要有这个两阶段的流程。你需要先训练你的奖励模型，然后你需要用那个奖励模型去训练你的策略。但问题是，你做完第一步、你做完第二步，然后你意识到 —— 噢，等等，第一步有问题。那你就需要把一切都重做一遍。所以有一堆依赖，会让你的日子真的更难过。而光是这个训练配方本身，就不是最简单的那种</u>。」</b><br><b>★★★ 这个问题的本质是「<u>反馈环太长</u>」</b>：<b>⇒ 你改一个奖励模型的细节。</b><b>⇒ 要等<u>奖励模型训完 + 策略训完</u>，才能看到效果。</b><b>⇒ <u>而那可能是好几天</u>。</b><br><b>★★ 长反馈环在工程上的后果非常具体</b>：<b>⇒ 你一天只能做<u>一两次实验</u>。</b><b>⇒ 于是你<u>不敢乱试</u>，只能靠猜。</b><b>⇒ <u>而猜错一次的代价是好几天</u>。</b><br><b>⇒ <u>这就是为什么「流程简单」本身是一个巨大的优势，而不只是审美问题</u>。</b><br><b>★★★ 请记住这一条，<u>因为它是 DPO 最大的卖点</u></b>：<b>⇒ <u>DPO 把两阶段压成了一阶段 —— 于是那个反馈环短了一半</u>。</b><br><b>⚠ 「<u>训练配方不是最简单的那种</u>」是一句很克制的话 —— <u>RLHF 在业界是出了名的难复现</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("77:13","the number of hyper-parameters that you need to tune",166);

  stack(640,218,["「第二个缺点，是关于『你需要调的超参数的数量』」","⇒ 「我们看到了 KL 表述里的那个 β」—— 那是一个","⇒ 「我们有 PPO-Clip 版本里的那个 ε」—— 那是另一个","⭐ 「GAE 我们没看它的公式，但我想至少有两个超参是我能想到的」⇒ 「总之，你有一堆」"],780,32,6);
  note("★★ 而「当然，有些超参的表现比别的好 —— 而如果你需要重训，那你又得全做一遍」",640,380,"r");},"<b>第二个挑战是超参太多，而它和第一个挑战叠在一起才要命。</b><br><b>讲者的话</b>：<b>「<u>第二个缺点，是关于你需要调的超参数的数量。所以我们看到了 KL 表述里的那个 beta。所以那是一个。我们有 PPO-Clip 版本里的那个 epsilon。那是另一个。那个 generalized advantage estimation，我们没有看它的公式，但我想至少有两个超参是我能想到的。总之，你有一堆。所以当然，有些超参的表现比别的好。而如果你需要重训，那么，你又需要把一切都做一遍</u>。」</b><br><b>★★★ 把这一讲出现过的超参数一遍，<u>你会发现它们都没有默认值</u></b>：<b>⇒ <u>β</u>（KL 系数）：太小会 reward hack，太大白训。</b><b>⇒ <u>ε</u>（裁剪带宽）：典型 0.1 到 0.2。</b><b>⇒ <u>GAE 的 γ 和 λ</u>：两个。</b><b>⇒ 再加上<u>学习率、batch、每个 prompt 采几条</u>……</b><br><b>★★ 而「<u>超参多</u>」和「<u>反馈环长</u>」叠在一起，才是真正的噩梦</b>：<b>⇒ 超参多 ⇒ <u>搜索空间大</u>。</b><b>⇒ 反馈环长 ⇒ <u>每试一个点都很贵</u>。</b><br><b>⇒ <u>大空间 + 高单价 = 你根本搜不动</u>。</b><br><b>★★★ 所以实践中人们做的是：<u>照抄一份别人跑通过的配置，然后尽量少动</u></b>：<b>⇒ <u>这也是为什么开源的 RLHF 实现（TRL、OpenRLHF 这些）那么重要 —— 它们提供的是「一组能跑通的超参」</u>。</b><br><b>⚠ 请对照一下 DPO：<u>它基本上只有一个超参 β —— 这是它另一个巨大的卖点</u>。</b>");

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⭐⭐ 挑战四：你连「怎么监控训练」都没有好办法",640,194,"y");
  stack(640,218,["「说到你可以用来监控训练的那个指标 —— 嗯，你会用什么指标？」","⇒ 「我们某种意义上是在最大化奖励，所以典型地你会用的监控指标，是『平均奖励』」","⚠ 「但这不是一个很好的 —— 我是说，这是一种监控方式，但不一定是最好的那种」","⭐ 对照：「至少在预训练和 SFT 时，你有那个交叉熵损失可以监控」"],780,32,6);
  note("★★ 「它真的在告诉你：你的模型复现『你想让它输出的那个行为』的能力如何」",640,380,"r");},"<b>第四个挑战最隐蔽：你连「怎么知道训得好不好」都没有好办法。</b><br><b>讲者的话</b>：<b>「<u>所以说到你可以用来监控训练的那个指标 —— 嗯，你会用什么指标？所以我们某种意义上是在试着最大化奖励。所以典型地，你会用来监控训练的那个指标，会是平均奖励。但这不是一个很好的 —— 我是说，这是一种监控你训练的方式，但不一定是最好的那种。所以至少在预训练和 SFT 的时候，你有那个交叉熵损失可以监控，它真的在告诉你：你的模型复现「你想让它输出的那个行为」的能力如何。所以对，这是另一个挑战</u>。」</b><br><b>★★★ 为什么「<u>平均奖励</u>」不是一个好的监控指标</b>：<b>⇒ 它涨 ⇒ <u>可能是模型变好了</u>。</b><b>⇒ 它涨 ⇒ <u>也可能是模型学会了刷奖励模型</u>。</b><b>⇒ <u>而你从这条曲线上，分辨不出是哪一种</u>。</b><br><b>★★ 而交叉熵好在哪：<u>它直接对着一个「我们真的想要的行为」</u></b>：<b>⇒ SFT 的交叉熵低 ⇒ <u>模型真的在复现那些人写的好回答</u>。</b><b>⇒ <u>它没有被代理过一道手</u>。</b><br><b>⇒ <u>而 RL 的平均奖励是「隔着一个奖励模型」看到的 —— 多了一层，就多了一层失真</u>。</b><br><b>★★★ 这一条和 L4 结尾那段完全对上了：<u>当你要量的那个东西只能通过代理看到时，你就失去了可靠的仪表盘</u></b>：<b>⇒ <u>而没有仪表盘的训练，本质上是在盲飞</u>。</b><br><b>⚠ 实践中人们的对策是：<u>同时盯 KL 值、输出长度、熵，以及定期人工读样本 —— 没有一个单一指标够用</u>。</b>");

  stack(640,218,["「在 RL 的世界里，为了让你知道『哪些 completion 不该做、哪些该多做』，你在生成时需要有一些多样性」","⚠ 「所以如果在 RL 训练循环里，每次你有一个 prompt 就生成一个东西，然后你再试一次，生成的东西又太接近……」","⇒ 「……那就不好，因为你没有在探索『可能的 completion 的集合』」","⭐ 「所以这是另一个你要记在心里的挑战：你需要『强迫你的模型去做一些探索』」"],780,32,6);
  note("★★ 而这正好解释了为什么造偏好数据时温度不能太低（14:23 那一镜）",640,380,"r");},"<b>第五个挑战，而它和这一讲开头那个温度的细节接上了。</b><br><b>讲者的话</b>：<b>「<u>然后另一件事是，在 RL 的世界里，为了让你知道哪些 completion 你不该做、哪些你该多做，你在生成的时候需要有一些多样性。所以如果在 RL 训练循环里，每次你有一个 prompt，你生成一个东西，然后你再试一次，生成的东西又太接近了 —— 嗯，那就不好，因为你没有在探索那个「可能的 completion 的集合」。所以这是另一个你需要记在心里的挑战，就是：你需要强迫你的模型去做一些探索，去看看什么可能是好的</u>。」</b><br><b>★★★ 「<u>探索</u>」是 RL 里最经典的话题之一，<u>而它在 LLM 上有一个特别的形态</u></b>：<b>⇒ 传统 RL 里，探索是「<u>要不要试一个没试过的动作</u>」。</b><b>⇒ 在 LLM 里，<u>动作空间是整个词表，而一条回答是几百个动作的组合</u>。</b><b>⇒ <u>所以「探索」在这里就是「生成的回答要足够不一样」</u>。</b><br><b>★★ 而这正好解释了 <u>14:23</u> 那个细节：<u>造偏好数据时温度不能太低</u></b>：<b>⇒ 温度低 ⇒ <u>两条回答几乎一样</u> ⇒ <u>比不出东西</u>。</b><b>⇒ 在 RL 循环里同样：<u>采样太集中 ⇒ 你永远看不到「更好的那条路」</u>。</b><br><b>⇒ <u>所以温度在这一讲里第二次成了关键参数</u>。</b><br><b>★★★ 但探索也有代价：<u>温度太高 ⇒ 生成的全是垃圾 ⇒ 梯度全是噪声</u></b>：<b>⇒ <u>这就是 RL 里经典的「探索与利用」权衡，在 LLM 上的具体样子</u>。</b><br><b>⚠ 而「<u>熵崩塌</u>」（上一镜提到的那个失败模式）正是「<u>探索彻底消失</u>」的极端情况。</b>");
  SUM(0,41,{h:"⭐⭐ RL 的五个挑战",k:"① <b>两阶段流程：你得先训奖励模型再训策略，「但问题是你做完第一步、做完第二步，然后意识到『噢等等，第一步有问题』—— 那你就得把一切重做一遍」；「有一堆依赖会让你的日子真的更难过」，而且「光这个训练配方本身就不是最简单的那种」</b>。② <b>超参太多：KL 表述里的 β、PPO-Clip 里的 ε、GAE 里「至少两个」…… 「总之你有一堆」，而「如果你需要重训，你又得全做一遍」</b>。③ <b>不稳定：「你可以约束你的迭代不要太宽来控制这件事，但有时候那是不够的」</b>。④ <b>监控难：「你会用什么指标？」—— 典型地是「平均奖励」，「但这不一定是最好的那种」；对照之下「预训练和 SFT 时你有交叉熵损失，它真的在告诉你模型复现那个行为的能力如何」</b>。⑤ <b>探索：「为了知道哪些 completion 不该做、哪些该多做，你在生成时需要有一些多样性」⇒ 「你需要强迫你的模型去做一些探索」</b>。",m:"★★★ 挑战一的本质是「反馈环太长」：<b>你改一个奖励模型的细节，要等奖励模型训完 + 策略训完才能看到效果，而那可能是好几天</b> ⇒ 后果非常具体：<b>你一天只能做一两次实验，于是不敢乱试只能靠猜，而猜错一次的代价是好几天 ⇒ 「流程简单」本身是一个巨大的优势，而不只是审美问题</b> ⇒ <b>请记住这一条，因为它是 DPO 最大的卖点：DPO 把两阶段压成一阶段，反馈环短了一半</b>。而挑战二和挑战一叠在一起才要命：<b>超参多 ⇒ 搜索空间大；反馈环长 ⇒ 每试一个点都很贵 ⇒ 大空间 + 高单价 = 你根本搜不动 ⇒ 所以实践中人们照抄一份别人跑通过的配置然后尽量少动（这也是开源 RLHF 实现那么重要的原因：它们提供的是「一组能跑通的超参」）</b>；⚠ <b>对照 DPO：它基本上只有一个超参 β —— 这是它另一个巨大的卖点</b>。",w:"★★★ 挑战四最隐蔽：<b>为什么「平均奖励」不是好的监控指标 —— 它涨可能是模型变好了，也可能是模型学会了刷奖励模型，而你从这条曲线上分辨不出是哪一种</b> ⇒ 而交叉熵好在<b>它直接对着一个「我们真的想要的行为」：SFT 的交叉熵低就说明模型真的在复现那些人写的好回答，它没有被代理过一道手；而 RL 的平均奖励是「隔着一个奖励模型」看到的，多了一层就多了一层失真</b> ⇒ <b>这和 L4 结尾完全对上：当你要量的东西只能通过代理看到时，你就失去了可靠的仪表盘 —— 而没有仪表盘的训练本质上是在盲飞</b>（实践对策：<b>同时盯 KL 值、输出长度、熵，并定期人工读样本 —— 没有一个单一指标够用</b>）。⇒ 挑战三那句承认也很重要：<b>前面花了很多时间讲 clip 和 KL 惩罚，它们的目的正是稳定，而讲者在这里说「有时候不够」</b>；不稳定的典型表现：<b>奖励突然崩塌、熵崩塌（模型变得极度确定，对所有 prompt 给几乎一样的回答）、输出退化（生成重复无意义但奖励很高的片段）—— 而这三种往往没有预警</b>。",r:"⇒ 挑战五里的「探索」在 LLM 上有特别的形态：<b>传统 RL 里探索是「要不要试一个没试过的动作」，而 LLM 的动作空间是整个词表、一条回答是几百个动作的组合 ⇒ 「探索」在这里就是「生成的回答要足够不一样」</b> ⇒ <b>这正好解释了 14:23 那个细节：造偏好数据时温度不能太低（温度低则两条回答几乎一样、比不出东西）；在 RL 循环里同样 —— 采样太集中你就永远看不到「更好的那条路」，所以温度在这一讲里第二次成了关键参数</b> ⇒ <b>但探索也有代价：温度太高则生成的全是垃圾、梯度全是噪声 —— 这就是 RL 经典的「探索与利用」权衡在 LLM 上的具体样子；而「熵崩塌」正是「探索彻底消失」的极端情况</b>。"});
  QUIZ(0,41,{t:"RL 那五个挑战里，哪两个叠在一起最要命？",o:["监控难 + 探索不足","不稳定 + 探索不足","「超参多」+「反馈环长」—— 搜索空间大而每试一个点都要好几天，所以你根本搜不动","两阶段 + 不稳定"],a:2,w:"⇒ 所以实践中是照抄一份别人跑通的配置然后尽量少动。而 DPO 基本上只有一个超参 β，还把两阶段压成一阶段 —— 这是它最大的两个卖点。"});

  note("⚠ 「这里我们是在让模型生成东西，而 SFT 我们只是在用一些不一定由我们模型生成的数据」",640,374,"r");},"<b>on-policy 的含义，而它和 SFT 的差别只有一句话。</b><br><b>讲者的话</b>：<b>「<u>所以这和 SFT 不一样的地方在于：在 SFT 时，我们有一些 prompt 和一些我们想让我们的模型去生成、去模仿的回答。但在这里，我们做的是在每一次迭代里，让我们的模型生成一个输出，然后用「那个输出有多好」来更新我们的模型。所以两者之间有一个核心的差别，因为在这里，我们是在让模型生成东西；而对 SFT 来说，我们只是在用一些不一定由我们的模型生成的数据</u>。」</b><br><b>★★★ 这个差别决定了一件很根本的事：<u>训练数据从哪来</u></b>：<b>⇒ <u>SFT</u>：数据<u>来自外部</u>（人写的），<u>训练前就固定了</u>。</b><b>⇒ <u>RL</u>：数据<u>来自模型自己</u>，<u>每一步都在变</u>。</b><br><b>★★ 而「<u>数据来自自己</u>」有一个很大的好处</b>：<b>⇒ 模型被纠正的，<u>永远是它「此刻真的会犯」的错</u>。</b><b>⇒ 而 SFT 纠正的，<u>是「造数据时它可能会犯」的错</u>。</b><b>⇒ <u>训练到后期，SFT 的数据可能早就和模型的实际行为脱节了</u>。</b><br><b>⇒ <u>这就是 on-policy 最核心的价值</u>。</b><br><b>★★★ 但它也有一个很大的坏处：<u>你没法复用数据</u></b>：<b>⇒ 模型一更新 ⇒ <u>之前生成的那些样本就「过期」了</u>。</b><b>⇒ <u>所以每一步都要重新生成 —— 这就是 RL 慢的根本原因</u>。</b><br><b>⚠ 而 DPO 用的是「<u>事先准备好的偏好对</u>」—— <u>所以它是 off-policy 的，这既是它的优点也是它的缺点</u>。</b>");

  note("★★ 判据很简单：那条被打分的回答，是不是「此刻这个模型自己生成的」",640,380,"r");},"<b>两个词的正式定义，而判据其实只有一句话。</b><br><b>讲者的话</b>：<b>「<u>所以 on policy 训练指的是：涉及「模型从它当前的策略生成、并在那上面做优化」的训练。而这和 off policy 训练相对 —— 后者依赖的是那些不是由你正在训练的那个模型做出的生成。这说得通吗？对。所以这是一个你会经常看到的词，这就是为什么我告诉你。而对，PPO 是一个 on policy 的算法</u>。」</b><br><b>★★★ 判据只有一句话：<u>那条被打分的回答，是不是「此刻这个模型自己生成的」</u></b>：<b>⇒ 是 ⇒ <u>on-policy</u>。</b><b>⇒ 不是（人写的、别的模型写的、或者自己很久以前写的）⇒ <u>off-policy</u>。</b><br><b>★★ 把这一讲里出现过的方法按这个判据分一下</b>：<b>⇒ <u>SFT</u>：<u>off-policy</u>（数据是人写的）。</b><b>⇒ <u>PPO</u>：<u>on-policy</u>（每一步重新生成）。</b><b>⇒ <u>DPO</u>：<u>off-policy</u>（用事先准备好的偏好对）。</b><b>⇒ <u>Best-of-N</u>：<u>不训练，所以不适用</u>。</b><br><b>★★★ 而这个分类直接解释了各自的代价</b>：<b>⇒ on-policy <u>贵</u>（每步都要生成），但<u>信号贴切</u>。</b><b>⇒ off-policy <u>便宜</u>（数据可复用），但<u>有分布漂移</u>。</b><br><b>⇒ <u>而「分布漂移」正是讲者后面批评 DPO 时用的那个词</u>。</b><br><b>⚠ 所以这两个词不是术语堆砌 —— <u>它们是理解「为什么 DPO 更便宜但也有代价」的钥匙</u>。</b>");
  SUM(0,42,{h:"⭐⭐ on-policy 与 off-policy",k:"一句坦率的话：<b>「你们很多人不熟悉 RL，我当时也不熟，而『我们为什么一定需要 RL 来做这个阶段』并不是超级清楚」</b>。然后：<b>「这种基于 RL 的训练，你会经常听到 on policy training 这个词」—— 它和 SFT 的差别是：「SFT 时我们有一些 prompt 和一些我们想让模型去模仿的回答；但在这里，我们在每一次迭代里让模型生成一个输出，然后用『那个输出有多好』来更新模型」⇒ 「这里我们是在让模型生成东西，而 SFT 我们只是在用一些不一定由我们模型生成的数据」</b>。定义：<b>「on policy 训练指的是：涉及『模型从它当前的策略生成、并在那上面做优化』的训练；而这和 off policy 训练相对 —— 后者依赖的是『不是由你正在训练的那个模型做出的生成』」⇒ 「而 PPO 是一个 on policy 的算法」</b>。",m:"★★★ 「我们为什么一定需要 RL，并不是超级清楚」这句话分量很大：<b>它是一个讲者在讲完 RL 一整段之后，对这整段方法本身的质疑 —— 而这个质疑在 2023 年之后被证明是对的</b> ⇒ <b>因为 DPO 的核心主张正是「你不需要 RL」：它用一个监督式的损失达到了类似效果，于是四个模型变两个、五个挑战去掉一大半 —— 而讲者在 82:11 会说「十分钟后我们会看到一个用监督方式做 RL 那件事的办法」</b> ⇒ <b>所以这一条其实是整讲最大的那一条「挑战」：这整套机器，可能根本不必要 —— 而讲者把它放在最后</b>。",w:"★★★ 判据只有一句话：<b>那条被打分的回答，是不是「此刻这个模型自己生成的」—— 是就是 on-policy，不是（人写的、别的模型写的、或自己很久以前写的）就是 off-policy</b> ⇒ 把这一讲的方法分一下：<b>SFT 是 off-policy（数据是人写的）；PPO 是 on-policy（每步重新生成）；DPO 是 off-policy（用事先准备好的偏好对）；Best-of-N 不训练所以不适用</b> ⇒ <b>而这个分类直接解释了各自的代价：on-policy 贵（每步都要生成）但信号贴切；off-policy 便宜（数据可复用）但有分布漂移 —— 而「分布漂移」正是讲者后面批评 DPO 时用的那个词 ⇒ 这两个词不是术语堆砌，它们是理解「为什么 DPO 更便宜但也有代价」的钥匙</b>。",r:"⇒ 那个差别决定了一件很根本的事：<b>训练数据从哪来 —— SFT 的数据来自外部（人写的）、训练前就固定了；RL 的数据来自模型自己、每一步都在变</b> ⇒ 「数据来自自己」的好处：<b>模型被纠正的永远是它「此刻真的会犯」的错，而 SFT 纠正的是「造数据时它可能会犯」的错 —— 训练到后期，SFT 的数据可能早就和模型的实际行为脱节了，这就是 on-policy 最核心的价值</b> ⇒ 坏处：<b>你没法复用数据 —— 模型一更新，之前生成的那些样本就「过期」了，所以每一步都要重新生成，这是 RL 慢的根本原因</b>。⚠ <b>讲者第二次承认自己在这一块是现学的（「我当时也不熟」）</b>。"});

  note("★★ 这是 11:23 那条「负向信号」的第二次出现 —— 而这次是作为一个追问的答案",640,380,"r");},"<b>一个很自然的追问，而答案又回到了那条结构性限制。</b><br><b>讲者的话</b>：<b>「<u>所以问题是，我们为什么不在这份偏好数据上做 SFT？嗯，SFT 里你告诉模型：给定这个输入你该生成这个，然后给定那个输入你该生成那个。但你没有在告诉它那些你不该生成的东西。假设你有某个你不希望发生的东西 —— 除非你把它改写成完美的句子，否则在传统的 SFT 框架里，你没有办法告诉你的模型不要生成那个</u>。」</b><br><b>★★★ 这是 <u>11:23</u> 那条「负向信号」的第二次出现，<u>而这次它是作为一个追问的答案</u></b>：<b>⇒ 第一次是讲者<u>主动</u>说的（「偏好调优能注入负向信号」）。</b><b>⇒ 这一次是学生<u>撞上了它</u>：「那我把偏好数据当 SFT 数据用不行吗」。</b><b>⇒ <u>答案是：你只能用上「赢的那一半」，输的那一半完全用不上</u>。</b><br><b>★★ 「<u>除非你把它改写成完美的句子</u>」这个限定很精确</b>：<b>⇒ 你<u>能</u>做的：把那条好回答当 SFT 样本训。</b><b>⇒ 你<u>不能</u>做的：告诉模型「<u>别说那条坏的</u>」。</b><br><b>⇒ <u>于是偏好数据里有一半的信息被扔掉了 —— 而那一半恰恰是「负向」的那一半</u>。</b><br><b>★★★ 这个追问其实很有价值：<u>它逼出了「为什么要 RL」最干净的那个理由</u></b>：<b>⇒ <u>不是因为 RL 更强，而是因为 SFT 的损失函数表达不了「不要」</u>。</b><br><b>⚠ 而讲者接下来马上要说：<u>其实有办法用监督的方式表达「不要」—— 那就是 DPO</u>。</b>");

  SUM(0,43,{h:"⭐⭐ 为什么不直接 SFT 偏好数据",k:"追问：<b>「我们为什么不在这份偏好数据上做 SFT？」⇒ 「SFT 里你告诉模型：给定这个输入你该生成这个 —— 但你没有在告诉它『你不该生成什么』；假设你有某个你不希望发生的东西，除非你把它改写成完美的句子，否则在传统 SFT 框架里，你没有办法告诉你的模型别生成那个」</b>。预告：<b>「不过话说回来，这是一个很好的引子 —— 因为稍后，比如说十分钟后，我们会看到一个『用监督的方式去做我们刚才用 RL 做的那件事』的办法」</b>。",m:"★★★ 这是 11:23 那条「负向信号」的第二次出现，<b>而这次它是作为一个追问的答案</b>：<b>第一次是讲者主动说的，这一次是学生撞上了它 —— 答案是：你只能用上「赢的那一半」，输的那一半完全用不上</b> ⇒ 「除非你把它改写成完美的句子」这个限定很精确：<b>你能做的是把那条好回答当 SFT 样本训；你不能做的是告诉模型「别说那条坏的」⇒ 于是偏好数据里有一半的信息被扔掉了，而那一半恰恰是「负向」的那一半</b> ⇒ <b>这个追问逼出了「为什么要 RL」最干净的那个理由：不是因为 RL 更强，而是因为 SFT 的损失函数表达不了「不要」</b>。",w:"★★★ 但那个答案的完整版比第一眼看到的微妙：<b>「传统 SFT 框架」确实表达不了「不要」，但这不等于「监督学习表达不了」—— 只要你换一个损失函数，监督学习完全可以表达「不要」，那就是 DPO</b> ⇒ <b>所以这里有一个很重要的区分：「监督 vs 强化学习」不是关键的分界，「损失里有没有一个『负例』项」才是关键 —— 而 DPO 的损失里就有，它长得和奖励模型那个损失几乎一样（都是 log σ 的差）</b> ⇒ <b>于是这一讲下半场可以预判了：它要证明「RL 那一整套机器，可以被一个监督损失替代」，而那个监督损失正是从 RLHF 的目标函数推出来的 —— 不是另起炉灶</b>。",r:"⚠ 讲者说「这是一个很好的引子」—— <b>学生无意中问到了他接下来正要讲的东西</b>。"});

  note("★★ 三步：生成 N 条 ⇒ 全部打分 ⇒ 返回最高的那条。没有任何一步在改权重",640,380,"r");},"<b>名字的来历，以及完整的三步 —— 没有任何一步在改权重。</b><br><b>讲者的话</b>：<b>「<u>而你做的，是给每一个 prompt-completion 一个分数，然后你就返回最好的那一个、评分最高的那一个 —— 这就是为什么它叫 best of N。所以你有 N 条 completion。你给它们全部打分，然后你只返回最好的那一条</u>。」</b><br><b>★★★ 三步，<u>而它们都发生在你按下回车之后</u></b>：<b>⇒ ① <u>生成 N 条</u>（用非零温度，否则 N 条一样）。</b><b>⇒ ② <u>每条都送进奖励模型打分</u>。</b><b>⇒ ③ <u>返回分数最高的那一条</u>。</b><br><b>★★ 这个方法的一个很大的优点，<u>讲者没提但值得知道</u></b>：<b>⇒ <u>它是完全可控的</u>：你想要更好的结果 ⇒ <u>把 N 调大</u>。</b><b>⇒ 而 RLHF 训完之后，<u>质量就定死在那里了</u>。</b><br><b>⇒ <u>于是 Best-of-N 给了你一个「临时加钱买质量」的旋钮 —— 这在产品上很有用</u>。</b><br><b>★★★ 而它还有一个理论上的性质：<u>N 越大，期望质量越高，但提升是对数级的</u></b>：<b>⇒ <u>N 从 1 到 4 提升明显；从 64 到 256 几乎看不出来</u>。</b><b>⇒ <u>所以实践中 N 很少超过几十</u>。</b><br><b>⚠ 这个方法今天还有一个更响亮的名字：<u>它是「测试时扩展（test-time scaling）」最朴素的那一种，而 L6 讲推理模型时会回到这个主题</u>。</b>");
  SUM(0,44,{h:"⭐⭐ Best-of-N",k:"<b>「接下来几分钟我们会看一个『其实更常被用』的方法 —— 这是给那些『有一个奖励模型、但不想做 RL』的人的；你为什么不想做 RL？因为它贵，你需要很多模型……而有时候那个训练就是太难调了」</b>。方法：<b>「你有这些叫 best of N、或者 BoN 的方法 —— 想法是『利用你已经得到的那个奖励模型，去挑选你将要返回给用户的那个输出』：你有一个 prompt，告诉你的模型『我其实想要好几个生成』，所以你生成比如 4 次、5 次；而你做的是给每一个 prompt-completion 一个分数，然后返回最好的那一个、评分最高的那一个 —— 这就是为什么它叫 best of N」</b> ⇒ <b>「你有 N 条 completion，你给它们全部打分，然后只返回最好的那一条」</b>。",m:"★★★ 请注意这个方法在「什么时候发生」上的根本不同：<b>RLHF 在训练时用奖励模型改权重 ⇒ 推理时和普通模型一样快；Best-of-N 权重完全不动 ⇒ 在推理时用奖励模型挑</b> ⇒ <b>两者成本结构完全相反：RLHF 训练一次很贵、之后每次推理都便宜；Best-of-N 训练零成本、但每次推理都要贵 N 倍 —— 而哪个划算完全取决于你有多少推理流量，这正是讲者最后要说的那条建议</b> ⇒ <b>这是一个典型的「把成本从一端挪到另一端」的设计：省的是训练，花的是推理</b>。",w:"★★ 「其实更常被用」这个说法很有意思：<b>RLHF 在论文和新闻里最出名，但在真实工程里用得更多的是这个更简单的东西 —— 因为它不需要你搞定那五个挑战中的任何一个</b>；而它的前提是<b>你仍然需要那个奖励模型 —— 它省掉的是第二阶段（RL 训练），第一阶段还是要做，所以它是「两段式里砍掉后一段」而不是「完全不训」</b> ⇒ <b>讲者给的理由只有两条而且都是工程上的（贵、太难调）—— 注意没有一条是「RL 效果不好」：它效果是好的，只是代价大 ⇒ 一个方法被放弃，常常不是因为它不行，而是因为它不划算</b>。",r:"⇒ 三步都发生在你按下回车之后：<b>① 生成 N 条（用非零温度，否则 N 条一样）② 每条送进奖励模型打分 ③ 返回分数最高的那条</b> ⇒ 一个讲者没提但值得知道的优点：<b>它是完全可控的 —— 你想要更好的结果就把 N 调大，而 RLHF 训完之后质量就定死在那里了 ⇒ Best-of-N 给了你一个「临时加钱买质量」的旋钮，这在产品上很有用</b>；理论性质：<b>N 越大期望质量越高，但提升是对数级的 —— N 从 1 到 4 提升明显，从 64 到 256 几乎看不出来，所以实践中 N 很少超过几十</b>。⚠ <b>这个方法今天还有一个更响亮的名字：它是「测试时扩展（test-time scaling）」最朴素的那一种，而 L6 讲推理模型时会回到这个主题</b>。"});

  note("⚠ 这里省的是「训练的复杂度」，花的是「每一次推理的钱」",640,374,"d");},"<b>一句话概括了这个权衡，而它正是这一讲反复用的那个判断方法。</b><br><b>讲者的话</b>：<b>「<u>所以你确实跳过了 RL 训练，但你基本上是把所有的活都推到了你的推理、推到了推理阶段。而这就让一切变得超级贵</u>。」</b><br><b>★★★ 请把这句话和 L4 那条判断连起来：<u>看到一个优化，先问它省了什么、又多花了什么</u></b>：<b>⇒ <u>省了</u>：RL 训练的全部复杂度（四个模型、五个挑战、一堆超参）。</b><b>⇒ <u>花了</u>：每一次推理的 N 倍成本。</b><br><b>★★ 而这个交易有一个很特别的性质：<u>它把一笔「一次性的固定成本」换成了「持续的可变成本」</u></b>：<b>⇒ 这在财务上<u>不是同一类东西</u>。</b><b>⇒ <u>固定成本可以被摊销，可变成本不能</u>。</b><br><b>⇒ <u>所以这个选择本质上取决于「你预计要服务多久、多少量」—— 它是一个商业判断，不只是技术判断</u>。</b><br><b>★★★ 这也是为什么同一个技术，在不同团队手里会有完全不同的评价</b>：<b>⇒ 一个做研究原型的人：<u>BoN 太好了，五分钟就能用上</u>。</b><b>⇒ 一个跑亿级流量的人：<u>BoN 完全不可接受</u>。</b><br><b>⇒ <u>两个人说的都对</u>。</b><br><b>⚠ 「<u>超级贵</u>」这个说法很口语，<u>但它说的是一件非常具体的事：你的每一次 API 调用都要乘以 N</u>。</b>");

  stack(640,218,["「那它什么时候会很糟？」","⚠ 「比如说，如果你处在一个『需要把你的模型服务给一大堆流量』的情况下，那从成本角度看，它可能就说不通」","⭐ 「所以我会说，在走那条路之前，先去评估一下：你的推理流量会是多少、你的训练成本会是多少」","⇒ 「然后从那里去判断」"],780,32,6);
  note("★★ 这是整讲里最可操作的一条建议：它不是一个技术判断，而是一个「先算账」的判断",640,380,"r");},"<b>一条非常可操作的建议，而它不是一个技术判断。</b><br><b>讲者的话</b>：<b>「<u>所以它什么时候会很糟？所以比如说，如果你处在一个需要把你的模型服务给一大堆流量的情况下，那从成本的角度看，它对你来说可能就说不通。所以我会说，在走那条路之前，先去评估一下：你的推理流量会是多少、你的训练成本会是多少，然后从那里去判断。而对，我想差不多就是这样。关于那一部分我们有任何问题吗？</u>」</b><br><b>★★★ 这条建议的形状值得学：<u>它把一个「用哪个方法」的技术问题，转成了一个「算两笔账」的问题</u></b>：<b>⇒ <u>账一</u>：RLHF 的训练成本（一次性）。</b><b>⇒ <u>账二</u>：Best-of-N 的推理增量（流量 × N × 单次成本）。</b><b>⇒ <u>哪笔小就选哪个</u>。</b><br><b>★★ 而这个判断有一个很清楚的「<u>盈亏平衡点</u>」</b>：<b>⇒ 流量<u>低于</u>某个阈值 ⇒ <u>Best-of-N</u>。</b><b>⇒ 流量<u>高于</u>那个阈值 ⇒ <u>RLHF</u>。</b><br><b>⇒ <u>而那个阈值可以被真的算出来，不需要靠感觉</u>。</b><br><b>★★★ 我建议你把这个思路带到自己的课题上：<u>当两个方案各有优劣时，先看能不能把它们化成同一个单位（钱、时间、显存）</u></b>：<b>⇒ <u>化得成，判断就变成算术；化不成，才需要靠判断力</u>。</b><br><b>⚠ 讲者在这里收口了 —— <u>而下半场 Shervine 一上来就会给出一个更锋利的论证：连钱无限都救不了 Best-of-N</u>。</b>");
  SUM(0,46,{h:"⭐⭐⭐ Best-of-N 的两个问题",k:"问题一（学生答）：<b>「如果那个模型差，那它就会差」⇒ 「这很公道 —— 但我想，如果你用一个足够高的温度做足够多的 completion，你会有一些多样性；所以这是一个公道的点，不过我们先假设它不是问题」</b>。问题二（学生答）：<b>「你要查询那个模型很多次」⇒ 「是的，这确实就是那个问题 —— 你是在推理时，你想要的是不要花一堆钱和算力，但这里你做的是把你的 prompt 补全很多次，而这确实是这个办法的主要挑战」</b> ⇒ <b>「你确实跳过了 RL 训练，但你基本上是把所有的活都推到了推理阶段 —— 而这就让一切变得超级贵」</b>。建议：<b>「如果你需要把模型服务给一大堆流量，那从成本角度看它可能就说不通 ⇒ 在走那条路之前，先去评估一下你的推理流量会是多少、你的训练成本会是多少，然后从那里去判断」</b>。",m:"★★★ 为什么「在推理时多花」比「在训练时多花」更要命：<b>训练是花一次、之后无限次使用；推理是每一个用户的每一次请求都要再花一遍</b> ⇒ 算一下：<b>N = 8 则推理成本直接变成 8 倍（生成）+ 奖励模型打 8 次分，而且这是「每一次请求」都要付的 —— 一天一亿次请求就是一亿次 × 8 倍</b> ⇒ <b>这就是为什么「它更常被用」和「它很贵」可以同时成立：流量小的时候（内部工具、研究原型）BoN 完胜；流量大的时候（面向公众的产品）RLHF 完胜</b>。",w:"★★★ 这个交易有一个很特别的性质：<b>它把一笔「一次性的固定成本」换成了「持续的可变成本」—— 这在财务上不是同一类东西：固定成本可以被摊销，可变成本不能 ⇒ 所以这个选择本质上取决于「你预计要服务多久、多少量」，它是一个商业判断，不只是技术判断</b> ⇒ <b>这也是为什么同一个技术在不同团队手里评价完全不同：做研究原型的人说「BoN 太好了，五分钟就能用上」，跑亿级流量的人说「BoN 完全不可接受」—— 两个人说的都对</b>。而那条建议的形状值得学：<b>它把「用哪个方法」的技术问题转成了「算两笔账」的问题 —— 账一是 RLHF 的训练成本（一次性），账二是 BoN 的推理增量（流量 × N × 单次成本），哪笔小选哪个 ⇒ 而这个判断有一个清楚的盈亏平衡点，它可以被真的算出来、不需要靠感觉</b> ⇒ <b>把这个思路带到自己的课题上：当两个方案各有优劣时，先看能不能把它们化成同一个单位（钱、时间、显存）—— 化得成判断就变成算术，化不成才需要靠判断力</b>。",r:"⇒ 问题一的实质是：<b>Best-of-N 不能创造出模型本来不会说的东西 —— 它只能从「模型会生成的那些东西」里挑，如果那 N 条全都很差，挑出最好的一条还是差的</b> ⇒ 讲者的回应是说<b>这个问题可以靠「温度 + 数量」缓解但不能根治：温度高 + N 大则覆盖的输出空间更广、碰到好回答的概率更高；但如果模型根本不具备那个能力，采一万次也采不到</b> ⇒ <b>这正是这一讲总钥匙的另一个说法：你只能在已有的分布上挑，变不出新东西 —— 而这个限制对偏好调优的所有方法都成立，不只是 BoN（RLHF 也只能放大已有的好行为，它不教新知识）</b>。⚠ <b>讲者在这里收口，而下半场 Shervine 一上来就会给出一个更锋利的论证：连钱无限都救不了 Best-of-N</b>。"});
  QUIZ(0,46,{t:"Best-of-N 最根本的问题是什么？",o:["它把所有的活推到了推理端 —— 一笔「一次性固定成本」被换成了「每次请求都要付的可变成本」","它只能用在短回答上","奖励模型不准","它需要训练四个模型"],a:0,w:"⇒ 所以讲者的建议是「先算两笔账」：RLHF 的训练成本（一次性）vs BoN 的推理增量（流量 × N）—— 这是一个商业判断，不只是技术判断。"});

  note("★★ 因为「取最大值」这个操作，对任何单调的变换都是不变的",640,380,"r");},"<b>一个很漂亮的小结论：取最大值这件事，对单调变换免疫。</b><br><b>讲者的话</b>：<b>「<u>这是个很好的问题。你对那个尺度有任何约束吗？嗯，取决于你的缩放是怎么做的，你其实不在乎那个尺度 —— 只要你取的是最好的那一个、最高的那一个。如果你想一想，假设你用一个正态的分数去缩放它，那最高的那一个还是会保持最高。所以在这种情况下，你其实不在乎那个尺度</u>。」</b><br><b>★★★ 这个结论背后是一个很一般的性质：<u>argmax 对单调递增的变换是不变的</u></b>：<b>⇒ 你把所有分数<u>加一个常数</u> ⇒ <u>排名不变</u>。</b><b>⇒ 你把所有分数<u>乘一个正数</u> ⇒ <u>排名不变</u>。</b><b>⇒ 你对所有分数<u>取一个递增函数</u> ⇒ <u>排名还是不变</u>。</b><br><b>★★ 所以 Best-of-N 对奖励模型的要求<u>比 RL 低得多</u></b>：<b>⇒ BoN 只需要奖励模型<u>把顺序排对</u>。</b><b>⇒ RL 还需要那些<u>数值本身有意义</u>（因为它们要进损失、要和 KL 项比大小）。</b><br><b>⇒ <u>这是 BoN 的一个被低估的优点：它对奖励模型的质量要求更宽松</u>。</b><br><b>★★★ 而这也再一次回到 Bradley-Terry 那条性质：<u>分数本来就只有相对意义</u></b>：<b>⇒ <u>BoN 恰好只用了那个相对意义，所以它用得很干净</u>。</b><br><b>⚠ 下一镜讲者会说明「<u>那什么时候尺度才要紧</u>」。</b>");

  note("★★ 一句话分清了两种用法：排序用相对值就够，进损失就必须管绝对值",640,380,"r");},"<b>一句话分清了两种用法，然后上半场结束。</b><br><b>讲者的话</b>：<b>「<u>但典型地，那个缩放要紧，是在它进入一个损失函数的时候 —— 而那正是 RL 的情况。所以那就是人们用某种缩放机制的地方。那才是要紧的那部分。酷。而带着这个，我要把它交给 Shervin 了</u>。」</b><b>⇒ Shervine：<u>谢谢你，Afshin。</u></b><br><b>★★★ 这句话把「<u>要不要归一化</u>」这个问题彻底讲清楚了</b>：<b>⇒ <u>只排序</u>（Best-of-N）⇒ <u>不需要归一化</u>。</b><b>⇒ <u>进损失函数</u>（RL）⇒ <u>必须归一化</u>。</b><br><b>★★ 为什么进损失就必须管</b>：<b>⇒ 因为损失里<u>还有别的项</u>（那个 KL 惩罚）。</b><b>⇒ 两项要<u>相加</u> ⇒ <u>它们必须在可比的量级上</u>。</b><b>⇒ <u>奖励整体漂移 10 倍 ⇒ 那个 β 的含义就完全变了</u>。</b><br><b>⇒ <u>所以归一化真正的理由是「为了让两项能对话」，而不是为了好看</u>。</b><br><b>★★★ 上半场到这里结束，<u>而它留下的是一个很明确的问题</u></b>：<b>⇒ <u>RLHF 要四个模型、五个挑战；BoN 省了训练但推理贵</u>。</b><b>⇒ <u>有没有第三条路</u>？</b><br><b>⚠ 下半场 Shervine 一上来就会先把这两条抱怨复述一遍，<u>然后给出那个更锋利的延迟论证</u>。</b>");
  SUM(0,47,{h:"⭐ 三个收尾追问与交棒",k:"追问一：<b>BoN 里那个 sigma 还成对吗？⇒ 「在那个算法里你是假设奖励模型已经训好了的；我想这里的 sigma 是成对的，因为你是以成对的方式训你的模型的 —— 但在 best of N 的情况下，你做的只是『用你的奖励模型打 N 次分，然后挑最高的那一个』」</b>。追问二：<b>如果所有回答都很差呢？⇒ 「这绝对是一个公道的担忧，而这确实是一个担忧 —— 所以你的模型至少得有一点点好」</b>。追问三：<b>对尺度有约束吗？⇒ 「只要你取的是最好的那一个，你其实不在乎尺度 —— 假设你用一个正态分数去缩放，最高的那一个还是最高的」；但「典型地，尺度要紧是在它进入一个损失函数的时候 —— 而那正是 RL 的情况」</b>。然后交棒给 Shervine。",m:"★★★ 追问三背后是一个很一般的性质：<b>argmax 对单调递增的变换是不变的 —— 加常数、乘正数、取递增函数，排名都不变</b> ⇒ <b>所以 Best-of-N 对奖励模型的要求比 RL 低得多：BoN 只需要它把顺序排对，而 RL 还需要那些数值本身有意义（它们要进损失、要和 KL 项比大小）⇒ 这是 BoN 一个被低估的优点：它对奖励模型的质量要求更宽松</b>；而「什么时候尺度才要紧」那句话把问题彻底讲清了：<b>只排序不需要归一化，进损失函数就必须归一化 —— 因为损失里还有别的项（KL 惩罚），两项要相加就必须在可比的量级上；奖励整体漂移 10 倍，那个 β 的含义就完全变了 ⇒ 归一化真正的理由是「为了让两项能对话」，而不是为了好看</b>。",w:"★★★ 「你的模型至少得有一点点好」是这一讲总钥匙的另一种说法：<b>偏好调优（包括 BoN）只能「挑」不能「造」—— 它在已有的输出分布上重新排序，而那个分布本身是 SFT 模型给的，分布里根本没有的东西再怎么挑也挑不出来</b> ⇒ <b>这条边界很实际：如果模型完全不会某件事，你需要的是 SFT 或 mid-training 而不是偏好调优；如果模型会但经常做不好，偏好调优才是对的工具</b>（讲者在最后一分钟会把这句话说成「我们不想学新的事实」）。",r:"⇒ 追问一正好再次印证「成对训练、逐点使用」：<b>那个 sigma 只存在于「训练奖励模型」那一步的损失里；训练完之后奖励模型就是一个「吃一条、吐一个数」的函数，sigma 已经不在了 ⇒ BoN 的流程里根本不出现 sigma：打 N 次分、比大小、挑最高，连一次 sigmoid 都不用算</b> ⇒ <b>记成一句话：损失函数的形状，不决定模型的使用方式 —— 训练时怎么组织数据是一回事，推理时模型吃什么吐什么是另一回事</b>。⚠ 注意讲者对「全都很差」这个担忧的态度变了：<b>85:22 时他说「我们先假设它不是问题」，这次他说「这确实是一个担忧」—— 因为这次他没有别的点要赶着讲了</b>。"});
  QUIZ(0,47,{t:"Best-of-N 为什么「不在乎奖励分数的尺度」，而 RL 在乎？",o:["因为 BoN 不用奖励模型","因为 argmax 对单调变换不变（只需排序对）；而 RL 里奖励要进损失、和 KL 项相加，两项必须在可比的量级上","因为 BoN 的分数都是正的","因为 RL 的奖励是负的"],a:1,w:"⇒ 所以 BoN 对奖励模型的质量要求更宽松，这是它一个被低估的优点。而归一化真正的理由是「让损失里的两项能对话」。"});

  note("⚠ 具体是四个：当前策略、旧策略或参考模型、advantage 里藏着的奖励模型、以及 value function",640,380,"d");},"<b>Shervine 的开场很讲究：先不讲 DPO 是什么，先把抱怨摆足。</b><br><b>讲者的话</b>：<b>「<u>所以这最后一部分，我们要讲 DPO。但我还不打算告诉你 DPO 是什么意思。我们先来听一听我们在 RL 世界里的那些抱怨，然后看看我们能对它做什么、以及人们是怎么补救的。所以第一件我要从 Afshin 讲过的内容里重复的是：在 PPO 的 RL 表述里，你在做损失优化时必须扛着一堆模型权重。所以当你看这个损失函数时，你首先有「你要优化的当前模型」的策略、「旧模型或者参考模型」的策略；然后你有你的 advantage，它里面藏着奖励模型，以及我们讨论过的那个 value function。所以这全部四个 —— 很多</u>。」</b><br><b>★★★ 「<u>先听抱怨，再给方法</u>」这个讲法值得学</b>：<b>⇒ 如果先讲 DPO 是什么 ⇒ <u>它只是「又一个算法」</u>。</b><b>⇒ 先把痛点摆足，再讲 ⇒ <u>它变成了「那个痛点的答案」</u>。</b><br><b>★★ 而「<u>藏着</u>」这个词用得很准</b>：<b>⇒ 你在 PPO 的损失里<u>看不到奖励模型</u>。</b><b>⇒ 它<u>藏在 advantage 里面</u>。</b><b>⇒ <u>所以光看公式，你会以为只有两三个模型 —— 而实际上是四个</u>。</b><br><b>★★★ 这就是为什么 Shervine 要重新数一遍：<u>他要让你「看见」那四个</u></b>：<b>⇒ <u>而看见了，DPO 的价值才立得住</u>。</b><br><b>⚠ 他说「<u>我还不打算告诉你 DPO 是什么意思</u>」—— <u>这个悬念一直吊到 92:46</u>。</b>");

  stack(640,218,["抱怨二：「假设你走 best of N 的路，你不做 RL，你只是生成很多次然后挑最好的 completion」","⇒ 「如 Afshin 提到的，你有这个『延迟和成本』的问题」","⭐ 「而为了思考一下 —— 做个思想实验：假设我们有『无限的钱』，那还可以吗？」","⇒ 「假设你把所有这些『并行地』生成」"],780,32,6);
  note("★★ 这个思想实验设计得极好：它把「成本」这个因素整个拿掉，只留下「延迟」",640,380,"r");},"<b>一个设计得极好的思想实验：先把「钱」这个因素整个拿掉。</b><br><b>讲者的话</b>：<b>「<u>而第二件事是，假设你走 best of N 的那条路，你不做 RL，你只是生成很多次然后挑最好的 completion。如 Afshin 提到的，你有这个延迟和成本的问题。而就为了思考一下，做一个思想实验：假设我们有无限的钱，那还可以吗？所以假设你把所有这些并行地生成</u>。」</b><br><b>★★★ 这个思想实验为什么设计得好</b>：<b>⇒ 它<u>主动把对方最强的反驳先接下来</u>：「<u>钱不是问题</u>」。</b><b>⇒ 然后在<u>那个最有利的假设下</u>，证明问题依然存在。</b><b>⇒ <u>这比「它很贵」有力得多，因为「贵」是可以用钱解决的，而他要证明的是「有些东西钱解决不了」</u>。</b><br><b>★★ 「<u>并行地生成</u>」是这个论证的关键前提</b>：<b>⇒ 有无限的钱 ⇒ 你可以<u>买 N 台机器</u>。</b><b>⇒ 于是 N 条回答<u>同时开始生成</u>。</b><b>⇒ <u>总耗时不再是 N 倍，而是「其中最慢的那一条」</u>。</b><br><b>⇒ <u>听起来问题解决了 —— 但下一镜会说明它没有</u>。</b><br><b>★★★ 请注意这是一个标准的论证技巧：<u>先给对方最好的条件，再证明结论依然成立</u></b>：<b>⇒ <u>这样的论证最难被反驳</u>。</b><br><b>⚠ 而这个论证是整个下半场最漂亮的一段 —— <u>它只用了一个关于概率分布的常识</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("91:51","the probability distribution of the max of, let's say, N answers, it will tend to be shifted to the right",166);

  stack(640,218,["「你仍然需要等『生成一个答案所需的那个最长时间』，才能给你一个最终答案」","⭐ 「而如果你看延迟的分布，它通常是某种『不集中在单个点上』的形状」","⭐ 「而当你看『N 个答案里那个最大值』的概率分布时，它会倾向于『往右移』」","⇒ 「所以假设你有无限的钱、无限的算力 —— 你仍然得比『单次前向』等更久」"],780,32,6);
  note("★★ 这是一个纯粹的概率事实：取 N 个样本的最大值，期望一定比单个样本的期望大",640,380,"r");},"<b>论证的核心只用了一个概率常识，而结论是钱救不了的。</b><br><b>讲者的话</b>：<b>「<u>所以你仍然需要等「生成一个答案所需的那个最长时间」，才能给你一个最终的答案。而如果你看延迟的分布，它通常是某种不集中在单个点上的形状。而当你看「N 个答案里那个最大值」的概率分布时，它会倾向于往右移。所以假设你有无限的钱、无限的算力 —— 你仍然得比在单次前向上等更久。这些顾虑说得通吗？</u>」</b><br><b>★★★ 这个论证的全部内容是一个概率常识：<u>N 个样本的最大值，期望比单个样本大</u></b>：<b>⇒ 单次生成的延迟<u>不是一个固定的数</u>，它是一个<u>分布</u>（有时快、有时慢）。</b><b>⇒ 你并行生成 N 条 ⇒ <u>你必须等最慢的那一条</u>。</b><b>⇒ <u>而「N 个里最慢的那个」，平均一定比「随便一个」更慢</u>。</b><br><b>★★ 而且 N 越大，<u>这个偏移越明显</u></b>：<b>⇒ N = 1 ⇒ <u>就是原来的分布</u>。</b><b>⇒ N = 8 ⇒ <u>你基本上每次都踩到那个分布的「慢尾巴」</u>。</b><b>⇒ <u>N = 100 ⇒ 你几乎总是在等那条最糟的</u>。</b><br><b>⇒ <u>所以延迟的恶化是「免不掉」的，它不取决于你有多少机器</u>。</b><br><b>★★★ 这一条对做产品的人非常实在：<u>用户感知的是延迟，而不是你花了多少钱</u></b>：<b>⇒ <u>钱可以加，延迟加不回来</u>。</b><br><b>⚠ 这个论证在今天更重要了：<u>所有「测试时扩展」的方法都有同一个问题 —— 而这是它们共同的天花板</u>。</b>");
  SUM(0,48,{h:"⭐⭐ 两条抱怨与延迟论证",k:"Shervine 的开场：<b>「这最后一部分我们要讲 DPO，但我还不打算告诉你 DPO 是什么意思 —— 我们先来听一听我们在 RL 世界里的那些抱怨」</b>。抱怨一：<b>「在 PPO 的 RL 表述里，你在做损失优化时必须扛着一堆模型权重」—— 当前模型的策略、旧模型或参考模型的、advantage 里「藏着」的奖励模型、以及那个 value function ⇒ 「所有这四个，很多」</b>。抱怨二：<b>假设你走 best of N 的路，「你有这个延迟和成本的问题」⇒ 「做个思想实验：假设我们有无限的钱，那还可以吗？假设你把所有这些并行地生成」⇒ 「你仍然需要等『生成一个答案所需的那个最长时间』；而如果你看延迟的分布，它通常是某种不集中在单点上的形状，而当你看『N 个答案里那个最大值』的概率分布时，它会倾向于往右移」⇒ 「所以假设你有无限的钱、无限的算力，你仍然得比单次前向等更久」</b>。",m:"★★★ 这个思想实验设计得极好：<b>它主动把对方最强的反驳先接下来（「钱不是问题」），然后在那个最有利的假设下证明问题依然存在 —— 这比「它很贵」有力得多，因为「贵」可以用钱解决，而他要证明的是「有些东西钱解决不了」</b> ⇒ 论证的全部内容是一个概率常识：<b>单次生成的延迟不是固定的数而是一个分布（有时快有时慢）；你并行生成 N 条就必须等最慢的那条；而「N 个里最慢的那个」平均一定比「随便一个」更慢</b> ⇒ <b>而且 N 越大偏移越明显：N = 1 就是原分布，N = 8 你基本每次都踩到「慢尾巴」，N = 100 你几乎总在等最糟的那条 ⇒ 延迟的恶化是免不掉的，它不取决于你有多少机器</b> ⇒ <b>对做产品的人非常实在：用户感知的是延迟而不是你花了多少钱 —— 钱可以加，延迟加不回来</b>。",w:"★★ 「先听抱怨，再给方法」这个讲法值得学：<b>如果先讲 DPO 是什么，它只是「又一个算法」；先把痛点摆足再讲，它就变成了「那个痛点的答案」</b>。而「藏着」这个词用得很准：<b>你在 PPO 的损失里看不到奖励模型，它藏在 advantage 里面 ⇒ 光看公式你会以为只有两三个模型，而实际上是四个 —— 这就是为什么 Shervine 要重新数一遍：他要让你「看见」那四个，而看见了 DPO 的价值才立得住</b>。",r:"⚠ 这个延迟论证在今天更重要了：<b>所有「测试时扩展」的方法（BoN、自洽性投票、树搜索）都有同一个问题 —— 而这是它们共同的天花板</b>。⇒ 而「先给对方最好的条件，再证明结论依然成立」是一个标准的论证技巧，<b>这样的论证最难被反驳 —— 值得你在写论文时用</b>。"});
  QUIZ(0,48,{t:"「就算钱无限，Best-of-N 的延迟也救不回来」—— 为什么？",o:["因为奖励模型打分也要时间","因为模型不能并行","因为网络带宽不够","因为并行生成 N 条后你必须等最慢的那条，而「N 个里的最大值」其分布一定比单个样本右移"],a:3,w:"⇒ N 越大偏移越明显：N = 8 你基本每次都踩到延迟分布的「慢尾巴」。而用户感知的是延迟，钱可以加，延迟加不回来。"});

  QUIZ(0,50,{t:"DPO 那篇论文的标题「你的语言模型其实偷偷是一个奖励模型」在说什么？",o:["一个会生成的模型内部已经隐含了一个打分器 —— 那个分数就是 β log(π_θ / π_ref)，所以奖励和策略是同一个东西的两种写法","两个模型可以共享权重","奖励模型其实也会生成文本","语言模型可以被改造成奖励模型"],a:0,w:"⇒ 含义很直观：新策略比参考模型更愿意说某条回答 ⇒ 比值大于 1 ⇒ 隐式奖励为正。所以训练 DPO 就是在直接雕刻那个隐式奖励函数。"});

  note("★★ 关键动作就在最后一句：不是「提出一个新损失」，而是「把旧目标解出来」",640,380,"r");},"<b>推导的起点就是前面那个 PPO 目标，而关键动作在最后一句。</b><br><b>讲者的话</b>：<b>「<u>所以你回忆一下几张幻灯之前我们有的那个 PPO 目标。所以我们想最大化奖励、并最小化「得到的那个策略相对于参考策略的距离」—— 也就是「最大化奖励」和「KL 散度项」之间的这个权衡。然后你有那个 beta 系数出现在那里，它控制你想对「离基座模型更远」惩罚多少。而这篇论文做的，是把这个公式写下来，然后解出最优解会是什么</u>。」</b><br><b>★★★ 请注意这个动作的性质：「<u>把旧目标解出来</u>」，<u>而不是「提出一个新目标</u>」</b>：<b>⇒ 大多数论文做的是：<u>我提出一个新的损失，它在实验上更好</u>。</b><b>⇒ DPO 做的是：<u>你们那个老目标，我给你解出来了 —— 它有闭式解</u>。</b><br><b>★★ 这个区别决定了 DPO 的说服力</b>：<b>⇒ 如果是<u>新目标</u> ⇒ 你要问「<u>凭什么你这个更好</u>」。</b><b>⇒ 而因为是<u>同一个目标的解</u> ⇒ <u>它在数学上就和 RLHF 等价，不需要额外辩护</u>。</b><br><b>⇒ <u>这就是为什么 DPO 一出来就被广泛接受 —— 它不是在和 RLHF 竞争，它是在说「我就是 RLHF」</u>。</b><br><b>★★★ 请记住这个研究形状：<u>与其提出新方法，不如把一个已有方法「解出来」</u></b>：<b>⇒ <u>后者的说服力强得多，而且几乎没有反对的余地</u>。</b><br><b>⚠ 接下来四步，<u>而讲者会强调「没有任何额外假设」</u>。</b>");

  note("★★ 注意「两个 r 之差」这五个字 —— 那个算不出来的 β log Z(x) 就是在这里消掉的",640,380,"r");},"<b>第三步才是论文真正的关键一步，而那个障碍就在这里消失了。</b><br><b>讲者的话</b>：<b>「<u>而这篇论文做的那个关键部分，是把这一项辨认成某种奖励，然后把它表达成 Bradley-Terry 表述的一部分。所以你记得，你有那个「一条 completion、一条赢的 completion 比一条输的 completion 更大」的概率。而你有那个「两个 r 之差的 sigmoid」</u>。」</b><br><b>★★★ 请盯住「<u>两个 r 之差</u>」这五个字，<u>那个障碍就是在这里消失的</u></b>：<b>⇒ <u>r(x, y_w) = β log(π/π_ref)|_w + β log Z(x)</u>。</b><b>⇒ <u>r(x, y_l) = β log(π/π_ref)|_l + β log Z(x)</u>。</b><b>⇒ 两者<u>相减</u> ⇒ <u>β log Z(x) 完全抵消掉了</u>。</b><br><b>★★ 为什么能抵消：<u>因为 Z(x) 只依赖于 x，不依赖于 y</u></b>：<b>⇒ 同一个 prompt 下的两条回答，<u>共用同一个 Z(x)</u>。</b><b>⇒ <u>所以它在做差时必然消失</u>。</b><br><b>⇒ <u>而这正是 30:53 那条「Bradley-Terry 只看分数的差」的性质 —— 它在这里救了场</u>。</b><br><b>★★★ 请体会这件事的分量：<u>一个 70 年前的统计模型的一个顺带性质，让一个 2023 年的算法成为可能</u></b>：<b>⇒ <u>如果 Bradley-Terry 需要分数的绝对值，DPO 就不存在</u>。</b><br><b>⚠ 这就是这一讲开场说的那句话：「<u>一个顺带提到的性质，后来成了一个方法能不能成立的承重点</u>」。</b>");

  stack(640,218,["「而最后一步，和 Afshin 提到的那一步是同一个」","⭐ 「一旦你有了这个『你想最大化的概率』，你就可以把它『变成一个损失函数』」","⇒ 「而这个损失函数，正是这篇论文提议去优化、以便调策略权重、让它和这份偏好数据对齐的那个」","⇒ 讲者：「所以我把这篇论文相当繁重的那些步骤，大大简化成了这几步 —— 它们说得通吗？」"],780,32,6);
  note("★★ 所以第四步就是 37:52 那一招：取 log、加负号、写成期望",640,380,"r");},"<b>第四步和奖励模型那次完全一样 —— 整个推导到这里就收口了。</b><br><b>讲者的话</b>：<b>「<u>而最后一步，和 Afshin 提到的那一步是同一个：一旦你有了这个你想最大化的概率，你就可以把它变成一个损失函数。而这个损失函数，正是这篇论文提议去优化、以便调策略权重、让它和这份偏好数据对齐的那个。所以我把这篇论文相当繁重的那些步骤，大大简化成了这几步。它们说得通吗？</u>」</b><br><b>★★★ 把四步连起来复述一遍，<u>这是你真正需要带走的</u></b>：<b>⇒ ① <u>把 PPO 的带 KL 约束的目标解出来</u> ⇒ 得到 π* 的闭式解（含一个算不出的 Z）。</b><b>⇒ ② <u>反解</u>：把 r 写成 π* 的函数（Z 还在）。</b><b>⇒ ③ <u>代回 Bradley-Terry</u> ⇒ <u>做差时 Z 消掉</u>，奖励也消失了。</b><b>⇒ ④ <u>取 log、加负号、写成期望</u> ⇒ 得到 DPO 的损失。</b><br><b>★★ 而第四步正是 <u>37:52</u> 那一招 —— <u>这一讲里第二次用它</u></b>：<b>⇒ <u>讲者说「和 Afshin 提到的是同一个」—— 两位讲者在用同一套工具</u>。</b><br><b>★★★ 请注意整个推导里<u>没有任何近似</u></b>：<b>⇒ <u>所以 DPO 的损失和 PPO 的目标在数学上是等价的</u>。</b><b>⇒ <u>而它们在实践中表现不同 —— 那是因为「优化同一个目标的不同路径，会落在不同的地方」</u>。</b><br><b>⚠ 「<u>相当繁重的那些步骤</u>」—— <u>原论文的附录确实长，而讲者只取了骨架</u>。</b>");
  SUM(0,51,{h:"⭐⭐⭐ DPO 的四步推导",k:"起点：<b>「你回忆几张幻灯之前那个 PPO 目标：我们想最大化奖励、并最小化『得到的策略相对于参考策略的距离』—— 而那个 β 系数控制『你想对离基座模型更远惩罚多少』；而这篇论文做的，是把这个公式写下来，然后『解出最优解会是什么』」</b>。① <b>它表达出了最优策略 π*，而「当你推导这个表达式时，你得到的是 R 的一个函数」—— 「所有这些步骤没有任何额外的假设，它只是一堆被做出来的推导」</b>。② <b>那个 Z 项「代表一个配分函数，它只是把东西归一化 —— 但它不是什么新东西，它是那些本来就在里面的项的一个函数」；而「当你重排这些项时，你可以等价地把 r 表达成 π* 的函数」</b>。③ <b>「这篇论文做的那个关键部分，是把这一项辨认成某种奖励，然后把它表达成 Bradley-Terry 表述的一部分」⇒ 「把那个最优奖励的表达式代进去……到最后你就再也没有奖励了，只剩别的参数的一个函数 —— 你那里面只有那个 β 和那个策略」</b>。④ <b>「最后一步和 Afshin 提到的是同一个：一旦你有了这个你想最大化的概率，你就可以把它变成一个损失函数」</b>。",m:"★★★ 第一步那个式子本身就是这一讲总钥匙的数学形式：<b>最优策略 = 参考策略 × exp(奖励/β) ÷ 归一化 —— 也就是「在参考策略上，按奖励高低做一个指数加权的重新调整」</b> ⇒ 特别注意那个<b>乘法</b>的后果：<b>如果 π_ref(y|x) = 0（参考模型根本不会说这句话），那么无论奖励多高，π*(y|x) 还是 0 —— 因为 0 乘任何指数还是 0 ⇒ 这就是「偏好调优变不出参考模型本来不会说的东西」的严格证明</b> ⇒ <b>还能看出 β 的作用：它是那个指数的温度 —— β 小则分布被奖励拉得很偏，β 大则 π* 几乎就是 π_ref</b>。",w:"★★★ 那个 Z 讲者说得很轻松，<b>但它其实是算不出来的</b>：<b>要让 π* 是合法概率分布，所有可能的 y 加起来必须等于 1，所以 Z(x) = Σ_y π_ref(y|x)·exp(r(x,y)/β) —— 而那个 Σ 要遍历「所有可能的回答」，数量是天文数字</b> ⇒ <b>于是这个闭式解有一个尴尬的性质：它在数学上完全正确，但你没法真的拿它算出一个概率 —— 你知道最优解长什么样，却算不出它的值</b> ⇒ <b>而 DPO 全部的聪明之处，就在于它找到了一条「不需要算 Z 也能用这个解」的路</b>：<b>r(x,y_w) 和 r(x,y_l) 都带着同一个 β log Z(x)（因为 Z 只依赖 x 不依赖 y），两者相减时它完全抵消 —— 这正是 30:53 那条「Bradley-Terry 只看分数的差」的性质在救场</b> ⇒ <b>一个 70 年前的统计模型的顺带性质，让一个 2023 年的算法成为可能：如果 Bradley-Terry 需要分数的绝对值，DPO 就不存在</b>。",r:"★★★ 请注意第一步那个动作的性质：「把旧目标解出来」而不是「提出一个新目标」<b>—— 大多数论文做的是「我提出一个新损失，它实验上更好」，而 DPO 做的是「你们那个老目标，我给你解出来了」</b> ⇒ <b>这个区别决定了它的说服力：新目标要回答「凭什么你更好」，而同一个目标的解在数学上就和 RLHF 等价、不需要额外辩护 ⇒ DPO 不是在和 RLHF 竞争，它是在说「我就是 RLHF」—— 这就是它一出来就被广泛接受的原因</b> ⇒ <b>研究形状：与其提出新方法，不如把一个已有方法「解出来」—— 后者说服力强得多，而且几乎没有反对的余地</b>。⇒ 四步连起来：<b>① 解出 π* 的闭式解（含算不出的 Z）② 反解把 r 写成 π* 的函数 ③ 代回 Bradley-Terry，做差时 Z 消掉、奖励也消失 ④ 取 log、加负号、写成期望</b>（第四步正是 37:52 那一招，这一讲第二次用它）⇒ <b>整个推导里没有任何近似，所以 DPO 的损失和 PPO 的目标在数学上等价 —— 而它们实践中表现不同，是因为「优化同一个目标的不同路径，会落在不同的地方」</b>。⇒ 第二步在数学上只是取对数移项，<b>但在视角上是彻底的翻转：之前问「给定奖励，最优策略是什么」，现在问「给定策略，它对应的奖励是什么」—— 而这很重要，因为我们本来就不知道真实的 r（那是要学的），但我们可以直接参数化 π（它就是我们的模型）⇒ 把 r 写成 π 的函数，等于「用一个我们能控制的东西，表达一个我们不知道的东西」，这就是「你的语言模型偷偷是一个奖励模型」的出处</b>。"});

  SUM(0,52,{h:"⭐⭐ PPO vs DPO",k:"<b>「我们这里看到的那个 β，和 PPO 表述里的是『同一个 β』—— 典型地取在 0.1 左右；所以 β 是一个超参数，而你唯一想优化的就是那个策略，至于那些偏好对，你把它们作为输入」</b>。对比：<b>「RLHF 是这个两阶段训练流程：先拟合一个奖励函数，再用它做策略更新 —— 它相当重，你需要很多模型在内存里，训练稳定性是一个顾虑，你没有直接的监督，你依赖当前模型的策略去生成下一次更新」；而「这个 DPO 表述给了一个用监督的方式去思考偏好调优的办法：你就拿这些偏好对，直接在它们上面拟合一个损失函数 —— 而不是四个模型，你只需要两个（π_θ 和 π_ref），不需要任何别的模型副本」</b> ⇒ <b>「如果它容易那么多，为什么不是所有人都用 DPO？⇒ 它没那么容易」：「总体来说 PPO 的表现比 DPO 好」，而 DPO 那个「直接监督」的好处是有代价的 —— 「它有时候会去拟合『不是模型在训练时见过的那个确切分布』的东西」，而「这个分布的漂移是 DPO 内在的挑战」</b>。",m:"★★★ 「你没有直接的监督」这一句<b>是 RLHF 所有复杂度的总根源</b>：<b>没有直接监督 ⇒ 你得自己造监督信号 ⇒ 要有奖励模型；奖励信号太稀疏 ⇒ 要有 advantage 和价值模型；自己生成自己训 ⇒ 训练会漂会崩 ⇒ 要有 clip 和 KL</b> ⇒ <b>反过来看就很清楚：那四个模型、五个挑战，全都是从「没有直接监督」这一个源头长出来的 —— 所以如果能恢复「直接监督」，那些东西就会一起消失，而这正是 DPO 做的事</b> ⇒ <b>分析方法：当一个系统很复杂时，去找那个「让它必须这么复杂」的根源 —— 常常只有一个，拔掉它复杂度就塌了</b>。",w:"★★★ 「分布漂移」就是 on-policy 和 off-policy 的那个差别：<b>PPO 每一步的训练数据都是当前模型刚生成的（完全贴合）；DPO 的偏好对是事先准备好的，可能来自别的模型或早期的自己 ⇒ 模型被要求去「拟合一个它自己不会产生的分布」</b> ⇒ 为什么这降低效果：<b>那些偏好对里的回答模型本来就很少生成，于是梯度大部分花在「调整一些几乎不会发生的事件的概率」上，而真正会发生的那些输出反而没被有效改到</b> ⇒ <b>讲者用了「内在的（intrinsic）」这个词：它不是实现 bug、也不是调参没调好，而是「用离线数据训在线行为」这件事本身带来的 ⇒ 这是一笔很干净的交易：DPO 用「一点性能」换「大量的简单」</b>。",r:"★★★ 那个讽刺的形状值得记：<b>DPO 最吸引人的卖点是「拿一份现成的公开偏好数据集就能用」，而那正是分布漂移的来源（那份数据不是你的模型生成的）⇒ 「省事」和「有效」在这里直接冲突</b> ⇒ 两条补救都在把省掉的成本加回来：<b>① 先在那份偏好数据上做一遍 SFT，让模型分布先靠过去 ② 自己生成、自己评分 —— 而那就又需要一个奖励模型了（等于把 DPO 省掉的那个又请了回来）</b> ⇒ <b>所以完整的判断是：DPO 省事，但「真正做好的 DPO」并不省事 —— 便宜的那个版本有漂移，而修掉漂移就要付回成本</b>。⇒ 把两边的显存账并排（都用 7B）：<b>PPO 两个在训 + 两个冻住 ≈ 200 GB；DPO 一个在训 + 一个冻住 ≈ 98 GB —— 差不多减半，而且不需要在线生成</b>；<b>再加上 LoRA 还能再掉一个数量级：用 LoRA 训策略则在训的那个只要十几 GB，而 π_ref 可以就是「把 LoRA 关掉的同一个底座」—— 连第二份权重都不用存</b>（这就是 10:52「两者不冲突」在这里兑现的样子）。⚠ <b>β ≈ 0.1 请记住，它是今天 DPO 实践里最常见的默认值</b>。"});

  note("★★ 有人接着说：如果你换了参考模型，那可以被看成「你模型的另一个 SFT 版本」⇒ 讲者：「我想是的」",640,380,"g");},"<b>讲者的谨慎值得注意：他没有给一个一概而论的答案。</b><br><b>讲者的话</b>：<b>「<u>所以如果你从一个不同的模型出发，然后去偏好调优一个不同的概率分布，你可能在做一些从损失的角度看不那么说得通的事。不过我想那个方向 —— 我是说，我没法在那里给一个一概而论的答案。也许它能带来有意思的行为，但我的直觉会告诉你：这一切的要点，是从你手上最后那个训练检查点出发，然后进一步偏好调优你那些 completion 的分布</u>。」</b><b>⇒ 有人补充：<u>如果你换了参考模型，那可以被看成你模型的另一个 SFT 版本。</u></b><b>⇒ 讲者：<u>我想是的。</u></b><br><b>★★★ 「<u>从你手上最后那个训练检查点出发</u>」这句话，<u>把整条流水线的逻辑收紧了</u></b>：<b>⇒ <u>预训练 → SFT → 偏好调优</u>，每一步都从<u>上一步的终点</u>出发。</b><b>⇒ <u>而不是从某个别的地方</u>。</b><b>⇒ <u>这条链不能断，断了那些 KL 约束就失去了意义</u>。</b><br><b>★★ 而学生那个补充其实很聪明</b>：<b>⇒ 「换一个参考模型」= 「<u>假装你的 SFT 阶段产出的是另一个模型</u>」。</b><b>⇒ <u>那你为什么不干脆真的用那个模型做 SFT 呢</u>？</b><br><b>⇒ <u>所以那个想法要么退化成「换个底座」，要么就不是偏好调优了</u>。</b><br><b>★★★ 请注意讲者说「<u>我没法给一个一概而论的答案</u>」—— <u>这是一个很负责任的回答</u></b>：<b>⇒ <u>他给了直觉和理由，但明确标注了「这是直觉」</u>。</b><br><b>⚠ 这一讲里他做过两次这种标注（<u>PPO 那两条经验性质、这里</u>）。</b>");
  SUM(0,53,{h:"⭐ 两个收尾追问",k:"追问一：<b>「你是在相对于那个基座模型优化那些参数」⇒ 「是的 —— 但它不是那个基座模型，它是当前这个；你有一个基座模型，它在那些迭代中保持固定、而它出现在损失函数里；而你确实在更新参数，那个会是『被偏好调优过的』那一个」⇒ 「所以你有两套权重 —— 一套冻住，一套你在更新」</b>。追问二：<b>「能不能不用那个参考模型，而用另一个模型、另一个大模型？」⇒ 「那是个有意思的点，我想那会是一个『不同的算法』；而你可能会有点失去你在试图做的那件事的意义 —— 因为这个偏好调优阶段是在把你的回答对齐到『你所偏好的东西』上，而你希望它们是相对于『你到目前为止学到的东西』去对齐的」⇒ 「我的直觉会告诉你：这一切的要点，是从你手上最后那个训练检查点出发，然后进一步偏好调优你那些 completion 的分布」</b>。",m:"★★★ 第二个追问逼出了「参考模型到底在那里干什么」的答案：<b>π_ref 不是「榜样」，它是「起点」—— 那个 KL 项的意思不是「向它靠拢」，而是「别离你自己原来的样子太远」⇒ 换一个别的模型当参考，就是在要求模型「向另一个模型靠拢」，那是蒸馏，不是偏好调优</b> ⇒ <b>而「从你手上最后那个训练检查点出发」把整条流水线的逻辑收紧了：预训练 → SFT → 偏好调优，每一步都从上一步的终点出发而不是从别的地方 —— 这条链不能断，断了那些 KL 约束就失去意义</b>；学生那个补充也很聪明：<b>「换一个参考模型」= 「假装你的 SFT 阶段产出的是另一个模型」—— 那你为什么不干脆真的用那个模型做 SFT？所以那个想法要么退化成「换个底座」，要么就不是偏好调优了</b>。",w:"★★★ 第一个追问那个混淆很常见，<b>它来自 DPO 损失里那个比值</b>：<b>式子里是 π_θ / π_ref，两个都在那里，但只有 π_θ 带着梯度 —— π_ref 只是一把「参照的尺子」，一个参数都不动</b> ⇒ 实现上很直白：<b>两条序列各前向两遍（一遍过 π_θ，一遍过 π_ref），π_ref 那遍关掉梯度（no_grad），于是反向传播只会流回 π_θ</b> ⇒ <b>而「它是当前这个」这个纠正也关键：被优化的不是基座，是那个正在变的副本；训完之后你得到的是第三个东西（被偏好调优过的模型），而基座原封不动地还在那里 —— 这也意味着你随时可以退回那个基座</b>。",r:"⇒ 「两套权重」还有一个很省的实现技巧：<b>如果你用 LoRA 训策略，底座权重是共享的 —— 算 π_θ 时 LoRA 开着，算 π_ref 时把 LoRA 关掉 ⇒ 「两套权重」在显存里其实只有一套底座加一小撮 LoRA 参数</b> ⇒ <b>这就是 10:52「两者不冲突」最漂亮的兑现：LoRA 不只省了训练参数，还顺带省掉了那第二份权重 —— 所以今天一张 24 GB 的消费级显卡，真的可以做一个 7B 模型的偏好调优</b>。⚠ 请注意讲者说「我没法给一个一概而论的答案」—— <b>这是一个很负责任的回答：他给了直觉和理由，但明确标注了「这是直觉」（这一讲里他做过两次这种标注）</b>。"});

    "<b>★★ 四笔交易，每一笔都写清了价码。</b><br><span class='w'><b>交易一（数据）</b>：放弃信息量，换标注可靠性。产出→比较、pointwise→pairwise、细刻度→二元，<u>同一条判断用了三次</u>。⚠ 但这个方向不是无条件的 —— <b>放弃信息量是为了避噪声，评判者本身可靠时就不必放弃</b>。</span><br><span class='w'><b>交易二（RLHF/PPO）</b>：拿<u>四个模型 + 五个挑战</u>，换<u>最高的性能上限</u>。而「别跑太远」不是正则，是目标的另一半 —— 它有三个理由：灾难性遗忘、<b>reward hacking</b>、训练不稳。</span><br><span class='w'><b>交易三（Best-of-N）</b>：拿<u>每次服务都变贵</u>，换<u>一个权重都不用训</u>。⭐ 而讲者那个论证最漂亮：<b>就算钱无限，N 条里最慢那条的延迟也救不回来</b> —— 最大值的分布比单个样本右移。</span><br><span class='k'><b>交易四（DPO）</b>：拿<u>分布漂移</u>，换<u>两段变一段、四个模型变两个</u>。而这个漂移是 off-policy 这个选择的必然后果，<b>不是实现缺陷</b>。</span>");

    "<b>★ 三个符号陷阱（讲者自己主动点的，他说当初也把他搞糊涂了）</b>：<b>① PPO-Clip 写成 L = …，但它是要<u>最大化</u>的；② 那个 r_θ <u>不是奖励</u>，是新旧策略的概率比值；③ 公式里的 old <u>不是 SFT 模型</u>，是 RL 阶段的上一轮。</b><br><br><b>★★ 而「别跑太远」这件事在本讲里出现了两层，参照物不同，很容易混</b>：<b>KL 惩罚参照 <u>π_ref</u>（你的 SFT 模型，固定不动）—— 管「位移的上限」；而 clip 参照 <u>π_old</u>（上一次 RL 迭代）—— 管「速度的上限」。两条约束并存，不是二选一。</b>");

    "<b>★★★ 对你的课题，这一讲我认为有三条是能直接用的。</b><br><span class='k'><b>① reward hacking 是你最该防的那个失败模式。</b>你用代理的可行性/代价模型去引导搜索，<u>搜索越强，越会找到「骗过代理」的配置</u> —— 报出来的「最便宜可行配置」可能只在代理眼里可行。⇒ 而本讲给的对策是成套的：<b>限制偏离参考策略（KL / clip），并保留一条用精确求解器复核 top-k 的通道</b>。注意讲者说得很清楚：<u>解法不是换一个更好的代理（代理永远不完美），而是限制优化的强度</u>。</span><br><span class='k'><b>② Best-of-N 就是你要打败的那个 baseline。</b>它的结构是「<u>把预算均匀分给 N 个候选，再取 argmax</u>」—— 这正是 best-arm identification 的 naive 基线。<u>successive halving 之类的方法在同样预算下显著更好</u>，因为它们把预算挪给还没分清的候选。⇒ 所以你的实验里应该<b>同时报一个 BoN 式均匀分配的对照</b>，这个对比本身就是你方法价值的说明。</span><br><span class='k'><b>③ value function 就是你要的那个东西。</b>「<u>给一段部分生成，估计按策略写完后的最终奖励</u>」—— 把「部分生成」换成「部分配置」，这就是 MCTS 的节点价值，<b>也正是 dominance 剪枝需要的那个对部分解的估计</b>。⇒ 而「减基线降方差」也照搬得上：不同实例的代价基准不同，减掉同条件下的期望能把与实例难度无关的共同成分消掉。</span>");
