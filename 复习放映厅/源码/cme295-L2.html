<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>
:root{
  --bg:#080B11; --ink:#F0F4FA; --dim:#93A1B5; --dimmer:#3D4658; --edge:#1B2230;
  --blue:#54A9F7; --yellow:#FFD36E; --green:#5BDDA8; --coral:#FF7C87; --violet:#B48BF5;
  --sans:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
mjx-container{color:inherit!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);margin:auto}
svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}

#eqBox{font-size:clamp(16px,2.5vw,36px);text-align:center;line-height:1.5;max-width:92%;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
#eqBox.off{opacity:0;transform:translateY(13px) scale(.97)}
#eqBox.top{align-self:flex-start;margin-top:4.5vh}

#big{font-family:var(--mono);font-size:clamp(30px,5.6vw,82px);font-weight:500;letter-spacing:-.03em;
  color:var(--yellow);text-shadow:0 0 44px rgba(255,211,110,.3);text-align:center;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
#big.off{opacity:0;transform:scale(.86)}
#big small{display:block;font-family:var(--sans);font-size:.22em;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);text-shadow:none;margin-top:.55em;font-weight:400}

/* caption band — pinned into the lower third, clears the strip, scrolls if long */
#capL{align-items:flex-end;pointer-events:none}
#capL::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46vh;
  background:linear-gradient(to top,var(--bg) 30%,rgba(8,11,17,.72) 62%,transparent);pointer-events:none}
#capWrap{max-width:min(84ch,94%);width:100%;max-height:62vh;overflow-y:auto;margin-bottom:50px;
  display:flex;flex-direction:column;align-items:center;pointer-events:auto;position:relative;z-index:2}
#cap{text-align:center;font-size:clamp(13.5px,1.56vw,22px);font-weight:400;line-height:1.55;
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#cap.off{opacity:0;transform:translateY(12px)}
#cap b{font-weight:600;color:var(--yellow)}
#cap i{font-style:normal;color:var(--blue);font-weight:600}
#cap em{font-style:normal;color:var(--green);font-weight:600}
#cap s{text-decoration:none;color:var(--coral);font-weight:600}
#narr{margin:.7em 0 0;max-width:min(90ch,100%);text-align:left;

  background:rgba(8,11,17,.86);border:1px solid rgba(46,58,82,.7);border-radius:12px;
  padding:12px 17px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:1}
#narr.off{opacity:0}
#narr[hidden]{display:none}
#narr b{color:#C6D2E2;font-weight:500}
#narr i{font-style:normal;color:var(--blue)}
#narr em{font-style:normal;color:var(--green)}
#narr s{text-decoration:none;color:var(--coral)}

#sum{max-width:min(1200px,94%);width:100%;max-height:90vh;overflow:auto;
  background:rgba(17,23,33,.975);border:1px solid #303D52;border-radius:18px;padding:34px 46px 34px;
  box-shadow:0 28px 74px rgba(0,0,0,.62);
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#sum.off{opacity:0;transform:translateY(16px) scale(.985)}
#sum[hidden]{display:none}
#sum .sh{font-family:var(--mono);font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--green);margin:0 0 9px}
#sum h3{font-size:clamp(24px,2.7vw,38px);font-weight:800;margin:0 0 26px;letter-spacing:-.02em;line-height:1.25;color:#F6F9FE}
#sum .rows{display:flex;flex-direction:column;gap:15px}
#sum .row{border-left:4px solid #3C4A61;padding:17px 24px;background:rgba(255,255,255,.03);border-radius:0 12px 12px 0}
#sum .rk{font-family:var(--mono);font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:#9EABBE;margin:0 0 8px}
#sum .rv{font-size:clamp(16px,1.45vw,21px);font-weight:400;line-height:1.88;color:#E3EAF5;margin:0}
#sum .rv b{color:#FFFFFF;font-weight:700}
#sum .rv i{font-style:normal;color:#7CC0FF;font-weight:600}
#sum .rv em{font-style:normal;color:#6FE3B4;font-weight:600}
#sum .rv s{text-decoration:none;color:#FF97A0;font-weight:600}
#sum .row.k{border-left-color:var(--green)}
#sum .row.w{border-left-color:var(--coral)}
#sum .row.e{border-left-color:var(--yellow)}
#sum .row.m{border-left-color:var(--blue)}
#sum .row.r{border-left-color:var(--violet)}

#quizL{align-items:center;pointer-events:none}
#quiz{max-width:min(72ch,91%);pointer-events:auto;background:rgba(13,18,26,.95);
  border:1px solid #253044;border-radius:14px;padding:23px 27px;
  transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.3,1)}
#quiz.off{opacity:0;transform:translateY(14px);pointer-events:none}
#quiz[hidden]{display:none}
#quiz .qh{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--yellow);margin:0 0 10px}
#quiz .qq{font-size:clamp(13.5px,1.5vw,20px);font-weight:600;margin:0 0 15px;line-height:1.45}
#quiz .qo{display:flex;flex-direction:column;gap:7px}
#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;
  color:var(--ink);background:rgba(255,255,255,.045);border:1px solid #2A3546;
  border-radius:8px;padding:10px 15px;cursor:pointer;text-align:left;line-height:1.5;transition:background .2s,border-color .2s}
#quiz button:hover:not(.lk){border-color:var(--blue);background:rgba(84,169,247,.13)}
#quiz button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#quiz button.lk{cursor:default}
#quiz button.ok{border-color:var(--green);background:rgba(91,221,168,.15);color:var(--green)}
#quiz button.no{border-color:var(--coral);background:rgba(255,124,135,.13);color:var(--coral)}
#quiz button.off2{opacity:.32}
#quiz .why{margin:15px 0 0;font-size:clamp(11.5px,1.15vw,15px);font-weight:300;color:#93A1B5;line-height:1.7;border-top:1px solid #1E2634;padding-top:12px}
#quiz .why[hidden]{display:none}
#quiz .why b{color:#C6D2E2;font-weight:500}
#quiz .why em{font-style:normal;color:var(--green)}
#quiz .why s{text-decoration:none;color:var(--coral)}
#quiz .why i{font-style:normal;color:var(--blue)}

#titleL{flex-direction:column}
#titleL h1{font-size:clamp(25px,4.7vw,68px);font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.07;text-align:center;text-shadow:0 0 70px rgba(84,169,247,.25)}
#titleL p{font-size:clamp(12px,1.32vw,18px);color:var(--dim);font-weight:300;margin:2vh 0 0;letter-spacing:.05em;text-align:center;max-width:62ch}
#titleL .act{font-family:var(--mono);font-size:clamp(11px,1.18vw,15px);color:var(--blue);letter-spacing:.28em;margin:0 0 2.2vh;text-transform:uppercase}
#titleL .rule{width:60px;height:2px;background:var(--blue);margin:3.2vh auto 0;box-shadow:0 0 18px rgba(84,169,247,.7)}
.fade{transition:opacity .6s ease;display:flex;flex-direction:column;align-items:center}
.fade.off{opacity:0}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}
.tok.hl{color:var(--yellow);text-shadow:0 0 24px rgba(255,211,110,.5)}
.tok.res{color:var(--green);text-shadow:0 0 24px rgba(91,221,168,.45)}
.tok.ded{color:var(--coral);opacity:.5}

#strip{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:6}
#kps{display:flex;gap:3px;flex:1}
.kpbar{display:flex;gap:2px;flex:1;position:relative;cursor:pointer}
.pip{height:2px;flex:1;background:var(--edge);border-radius:2px;transition:background .4s}
.pip.seen{background:#2E3B50}
.pip.now{background:var(--blue);box-shadow:0 0 9px rgba(84,169,247,.85)}
.pip.sum{background:#1D3A30} .pip.sum.seen{background:#2C5C4A}
.pip.quiz{background:#3A3218} .pip.quiz.seen{background:#5C4E22}
.kplbl{position:absolute;top:-15px;left:0;font-family:var(--mono);font-size:8px;color:var(--dimmer);letter-spacing:.06em;white-space:nowrap;transition:color .3s}
.kpbar.active .kplbl{color:var(--blue)}
#hint{font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#tc{position:fixed;top:18px;left:20px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.1em;text-decoration:none;pointer-events:auto}
#tc:hover{color:var(--blue)}
#tc[hidden]{display:none}
#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}
.navbtn{position:fixed;top:0;bottom:44px;width:14%;background:none;border:0;cursor:pointer;opacity:0;z-index:4}
#prev{left:0} #next{right:0}
.navbtn:focus-visible{opacity:1;outline:2px solid var(--blue);outline-offset:-6px}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}
.pt{fill:var(--ink)}
.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}
.box.r{stroke:var(--coral)} .box.v{stroke:var(--violet)}
.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}
.cellbg.hl3{fill:#3A1A1E;stroke:var(--coral);stroke-width:1.6}
.celltx{font-family:var(--mono);font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.celltx.d{fill:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* fix: 面板 .off 立即不可见 */
#big.off,#cap.off,#eqBox.off,#titleBox.off,#sum.off,#quiz.off{visibility:hidden}
</style>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

function stack(cx,ytop,items,bw,bh,gap){

  SUM(0,2,{h:"⭐ 为什么要注入位置",k:"<b>「令人惊讶的是，这个 2017 年被引入的 transformer 架构，实际上是一个这些年里一直保持着相关性的架构」⇒ 「有一些轻微的变体，但整体上今天的模型都多少是基于最初那个 transformer 架构的」</b>;分工：<b>「第一部分是我要讲的，也就是 transformer 里哪些部分是重要的、而且发生过一些变动；第二部分里 Shervine 会讲今天这些模型的命名法，以及它们和最初那个 transformer 的关系」</b>。<br>⭐ 缺口：<b>「我们让 token 以一种直接的方式和所有其它 token 交互⋯⋯但和 RNN 相反，RNN 里你有一个顺序依赖，你一次处理一个 token；而在这里你基本上丢掉了『一个 token 在另一个之前被处理』这个概念」⇒ 「你丢了这个位置信息。作为这件事的结果，我们需要以某种方式去量化每个位置上的 token，并且在 transformer 处理这些输入时，试着把那个信息注入进去」</b>。<br>第一代：<b>「最初那篇论文的作者们选择了有一个专属的嵌入 —— 每一个位置都有一个嵌入⋯⋯而他们选择做的是，把那个嵌入加到输入 token 的嵌入上」</b>;一个提问：<b>「位置嵌入是学出来的还是静态的？」——「两个都是，意思是作者两种都试过了」</b>;两个局限：<b>「你非常依赖你的训练集里有什么⋯⋯如果你的文本总是在位置 2 号上发生某件事，那你学出来的嵌入就会把那个偏置也学进去」; 「你只能学到你训练集里出现的那个最大位置数为止的位置」</b>;而好处是「<b>你就只是让你的模型去学 —— 而梯度下降在这件事上创造奇迹</b>」。",m:"⭐ 「<b>量化</b>」和「<b>注入</b>」这两个动词是<b>两个独立的设计决定</b>:<b>量化用什么形式（学出来的向量 / 一条公式 / 一个偏置）· 注入送到哪里（加在输入上 / 直接改 softmax 里那个分数）⇒ 这一讲后面四代方案的差别，全都可以用这两个维度定位</b>。<br>⭐ 而顺序这个缺口的<b>因果</b>要想清楚：<b>RNN 知道顺序，是因为它的计算本身就是按顺序做的 —— 顺序是免费的副产品；而 transformer 一次性算完，于是顺序必须被显式加回去 ⇒ 最大的长处直接造成了最大的缺口</b>。<br>⭐ 两个局限有<b>同一个根源</b>:<b>「学」只能从「见过的东西」里学 —— 位置嵌入表的第 k 行，只有训练数据里真出现过长度 ≥ k 的句子时才有梯度流过去</b>。",w:" 局限二是<b>硬限制，不是精度下降</b>:<b>位置嵌入表就是一个 512 行的矩阵 —— 不是「第 513 行学得不好」,而是根本没有第 513 行 ⇒ 你连「凑合着用」都做不到</b>。<br>⚠ 而局限一之所以隐蔽：<b>位置嵌入本该只编码「第几个」这件纯结构信息，但自由学出来的东西会把内容上的统计规律一起吸进去</b>。<br>⚠ 另外「<b>作者两种都试过、结果相当</b>」说明在 2017 年这两种做法谁更好并不显然 —— <b>真正把它们分出高下的是这些局限</b>。",r:"⇒ 「<b>一直保持着相关性</b>」这句话有一个很实用的推论：<b>你看懂了 L1，就看懂了今天绝大多数模型的骨架 —— 而这一讲要补的，正是那些「轻微的变体」</b>。<br>⇒ 而最朴素的做法（直接把位置号 m 当成一个数接上去）为什么不行，正好解释了后面所有设计的动机：<b>m 没有上界（会把其它特征淹掉）,而归一化成 m/L 又会让同一个位置在不同长度的句子里数值不同</b>。<br>⇒ 「任意的公式」里那个「<b>任意</b>」带着挑衅：<b>凭什么是这条公式？—— 而讲者接下来花了九分钟专门回答它</b>。<br>⇒ 更多（八年没换这件事的对照、位置嵌入表的参数量、占位行没被填到会怎样）见<b>深度笔记</b>。"});

  note("⚠ 而「更可能」是统计先验，不是硬规律：隔了九个词的主语照样该被关注",640,374,"r");},"<b>推导开始，而讲者的走法本身就是这一段最大的价值。</b><br>⭐⭐⭐ 他分两步，<b>而顺序是关键</b>:<b>① 先问「我们到底想要位置表示有什么性质」（完全不看公式，纯粹从任务出发）; ② 再去验证「这条公式给不给我们那个性质」。反过来做，你得到的永远只是事后解释 —— 因为任何公式你都能编出一套说法</b>。<br>⭐ 而他要的那个性质只有一句话：「<b>靠在一起的词，比离得更远的词更可能是相关的 —— 所以差一个位置的那一对，要比差一万个位置的那一对更相似</b>」。<br>⚠ 注意「<b>更可能</b>」这个词：<b>这是统计性先验，不是绝对规律（「The man who I met yesterday in Berlin is tall」里 is 的主语隔了九个词）—— 位置编码只给倾向，不给限制，最终还是内容说话</b>。");
  SUM(0,3,{h:"⭐ 第二代：算出来的位置嵌入",k:"<b>「第一个方法是：你每个位置有一个嵌入，然后你就学它。第二个方法是：你每个位置有一个嵌入，但你不打算学它 —— 你会有某个预先定好的东西，拿来直接用」; 「而作者选的是用正弦和余弦的一种表述。所以它可以感觉很怪 —— 他们为什么选这个？但我们会看到为什么这说得通」</b>。<br>⭐ 公式骨架：<b>「对一个给定的位置 m，有一个 d_model 大小的向量。所以 d 需要匹配你的 token 嵌入的维度，因为你当然是要把它们加起来的。而你要做的是，对每一个索引，按照这些公式去计算对应的那个值」⇒ 偶数维 2i 用 sin，奇数维 2i+1 用 cos</b>;记号：<b>「我们先把记号简化一下⋯⋯而你把 omega i 记作这个量，也就是 10000 的负 2i 除以 d_model 次方」</b>;而目标性质是：<b>「你想要的是以一种反映下面这个事实的方式去表示位置 —— 靠在一起的词，比离得更远的词更可能是相关的」</b>。",m:"⭐ 两代的对比干净得惊人：<b>形状完全一样（最大长度 × d_model 的一张表、加到 token 嵌入上）,唯一变的是表里的数是训出来的还是算出来的 ⇒ 而这一个区别让两个局限同时消失：没有参数所以不吸偏置、可以算任意行所以能外推</b>。<br>⭐ 「<b>d 必须匹配因为要相加</b>」把上一段那个决定的后果说出来了：<b>选了相加，维度就被锁死 —— 换来「不增加宽度」,付出「不能单独调维度」</b>。<br>⭐ 而 <b>ω_i = 10000^(−2i/d) 在 1 到 0.0001 之间几何式递减，而 ω 就是角频率 ⇒ 低维编码细粒度差别、高维编码大尺度差别</b>。",w:" 「谁还记得三角函数公式」不是寒暄：<b>接下来九分钟全靠 cos(a−b) 这一条恒等式 —— 如果班上一半人不记得，推导的节奏就断了</b>。<br>⚠ 而那个两步法的顺序不能反：<b>先看公式再找理由，得到的永远是事后解释；先定性质再验证，才有「不通过」的可能，验证才有意义</b>。<br>⚠ 「<b>更可能</b>」是统计先验不是硬规律：<b>位置编码让近的更相似，但注意力权重最终由内容决定 —— 模型完全有能力越过这个倾向</b>。",r:"⇒ 这个两步法是通用的：<b>看到一个你不理解的设计（一个损失、一个归一化、一个采样策略）,先别问「它怎么算」,先问「它想保证什么」—— 多数时候一旦说出那个性质，设计本身就显然了</b>。<br>⇒ 「给先验而不给硬约束」是整个深度学习里反复出现的设计哲学。<br>⇒ 更多（相加 vs 拼接的参数账、ω_i 的几何递减与二进制计数器的类比）见<b>深度笔记</b>。"});
  QUIZ(0,3,{t:"第二代「算出来的」位置嵌入，和第一代相比到底变了什么？",o:["它把 softmax 换成了别的归一化函数","维度从 512 变成了 32，所以更省显存","它不再加到 token 嵌入上，而是改成拼接","形状完全一样（最大长度 × d_model 的一张表、仍然加到 token 嵌入上）,唯一变的是表里的数是训出来的还是用公式算出来的 ⇒ 没有参数（不吸训练集偏置）且可以算任意行（能外推），两个局限同时消失"],a:3,w:"⇒ 代价是你必须自己想出那条公式 —— 而「什么样的公式才是对的」,正是接下来九分钟要回答的问题。"});
});
KP("4 · ⭐⭐⭐ 用 cos(a−b) 证明：点积只依赖相对距离",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$\\cos(a-b)=\\cos a\\,\\cos b+\\sin a\\,\\sin b$$");
  says("18:36","So let us suppose you have two position embeddings, so one at position m and the other one at position n",166);
  says("18:59","cosine of a minus b is equal to cosine of a cosine of b, plus sine a sine b",192);
  note("⭐⭐⭐ 整段推导唯一要用的工具 —— 请盯着右边的形状",640,224,"y");
  note("⇒ cos·cos ＋ sin·sin —— 而位置嵌入偶数维是 sin、奇数维是 cos",640,256,"g");
  note("⭐ 所以点积里第 2i 维和第 2i+1 维那两项，恰好凑成这个右边",640,288,"r");},"<b>验证开始。要算的是 PE(m) 和 PE(n) 的点积，而整段推导唯一要用的工具就是这一条恒等式。</b><br>⭐ 「<b>假设你有两个位置嵌入，一个在位置 m、另一个在位置 n⋯⋯如果你记得你的三角函数公式，cos(a−b) 等于 cos a cos b 加 sin a sin b</b>」。<br>⭐⭐⭐ 请盯着右边看：<b>cos(某角)×cos(另一角) ＋ sin(某角)×sin(另一角)。而位置嵌入偶数维是 sin(ω_i m)、奇数维是 cos(ω_i m) ⇒ 做点积时，第 2i 维贡献 sin(ω_i m)·sin(ω_i n)、第 2i+1 维贡献 cos(ω_i m)·cos(ω_i n) —— 这两项加起来正是 cos(a−b) 的右边，于是合成 cos(ω_i(m−n))</b>。<br>⚠ <b>这就是全部的魔法：「sin 和 cos 成对放在相邻两维」这个看起来任意的设计，目的就是让点积自动完成这个合并</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("19:12","if you express cosine of omega i, factor of m minus n, this is something that you obtain",166);
  says("19:43","when you do the dot product of position m and position n, what you do is you take the first position, you multiply them",192);
  note("⭐ 注意他的推导方向：不是化简点积，是先写出目标形式再去认出它",640,222,"y");
  boxNode(80,254,500,50,"① 用 sin / cos：为了用上 cos(a−b)","g");
  boxNode(700,254,500,50,"② 奇偶维成对：凑齐那两项","y");
  note("③ 同一对共用一个 ω_i：角度才能相减",330,328,"b");
  note("⇒ 三个看起来任意的决定，现在都有理由了",950,328,"v");
  note("⚠ 只剩「为什么是 10000」还没解释 —— 那个在 24:28",640,374,"r");},"<b>这一镜是转折点，而关键在于「认出来」这个动作的方向。</b><br>⭐ 「<b>如果你把 cos(ω_i 乘以 m 减 n) 展开，你得到的就是这个东西 —— 它就只是我刚提到的那条恒等式。而这个量恰好就是你做这两个位置嵌入的点积时会出现的一个分量</b>」 ⇒ <b>他不是从点积出发去化简，而是先写下目标形式、再在点积里「认出」这个形状 —— 逻辑上等价，但教学上路是明的；而这也是做推导的实用技巧：知道想得到什么形式时，先把它写出来，再去源头找零件</b>。<br>⭐ 于是公式里三个看起来任意的决定都有了理由：<b>① 用 sin/cos（为了用上 cos(a−b)）; ② 奇偶维成对（点积是逐维相乘求和，必须一维放 sin、一维放 cos，那两项才会相遇）; ③ 同一对共用一个 ω_i（角度才能相减）</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("20:14","you end up with a sum of cosine that are a function of the relative distance between m and n",166);
  says("21:01","So the question is, so the closer they are, the more similar they are",192);
  note("⭐⭐⭐ 结论比「近的更相似」还要强：点积只依赖 m−n",640,222,"y");
  boxNode(80,254,500,50,"位置 3 与 5 的点积","g");
  boxNode(700,254,500,50,"＝ 位置 1003 与 1005 的点积","g");
  note("也等于 50 万与 50 万零 2 的 —— 只要差是 2",330,328,"g");
  note("⚠ 第一代凭什么相等？没有任何机制保证",950,328,"r");
  note("⚠ 而讲者用词是「逼近 / 模仿」而不是「保证」—— 因为余弦是周期的",640,374,"r");},"<b>这是整段推导的结论，而它比那条直觉强得多。</b><br>⭐ 「<b>当你做这些嵌入的点积时，你最终得到的是一堆余弦之和，而它们是 m 和 n 之间相对距离的函数</b>」—— 学生确认「<b>所以它们越近就越相似？</b>」,讲者答「<b>正是如此</b>」。<br>⭐⭐⭐ 把结论说准：<b>点积只依赖 m−n，和 m、n 各自是多少完全无关 ⇒ 位置 3 和 5 的点积严格等于 1003 和 1005 的、也等于 50 万和 50 万零 2 的。这叫平移不变性 —— 而第一代那两个独立学出来的向量，凭什么相等？没有任何机制保证</b>。<br>⚠ 但他接着用的词是「<b>逼近</b>」和「<b>模仿</b>」而不是「保证」,这个分寸是对的：<b>余弦是周期函数，cos(ω_i·d) 并不随 d 单调递减</b>。");
  SUM(0,4,{h:"⭐⭐⭐ 那个三角恒等式的证明",k:"<b>「假设你有两个位置嵌入，一个在位置 m，另一个在位置 n⋯⋯如果你记得你的三角函数公式，cos(a−b) 等于 cos a cos b 加 sin a sin b」; 「如果你把 cos(ω_i 乘以 m 减 n) 展开，你得到的就是这个东西 —— 它就只是我刚提到的那条恒等式。而这个量恰好就是你做这两个位置嵌入的点积时会出现的一个分量」; 「因为基本上，当你做位置 m 和位置 n 的点积时，你做的是：你取第一个位置，把它们相乘，然后加上第二个位置，把它们相乘，等等。然后你走到这里，它是 sin 乘 sin 加 cos 乘 cos —— 而这就正是那个量」</b>。<br>⭐ 结论：<b>「所以到最后，你意识到的是：当你做这些嵌入的点积时，你最终得到的是一堆余弦之和，而它们是 m 和 n 之间相对距离的函数」</b>;学生问「<b>所以它们越近，就越相似？</b>」—— 讲者：「<b>正是如此</b>」,并补一句「<b>这种构造嵌入的方式是在试着逼近它、或者说试着模仿它</b>」。",m:"⭐⭐⭐ 魔法在一个形状的匹配上：<b>恒等式右边是 cos·cos ＋ sin·sin，而位置嵌入偶数维放 sin(ω_i m)、奇数维放 cos(ω_i m) ⇒ 点积逐维相乘求和时，第 2i 与第 2i+1 维那两项恰好凑成这个右边，合成 cos(ω_i(m−n))</b>。<br>⭐ 于是三个看起来任意的决定都有了理由：<b>① 用 sin/cos 是为了用上 cos(a−b); ② 奇偶维成对是为了让那两项在求和里相遇；③ 同一对共用一个 ω_i 是为了让角度能相减</b>。<br>⭐ 而推导<b>方向</b>也值得学：<b>先写下目标形式、再在源头认出它的零件，比盲目化简省力得多</b>。",w:" 结论要说准：<b>点积只依赖 m−n（平移不变），和绝对位置无关 —— 这比「近的更相似」强得多，而第一代完全不保证这一点</b>。<br>⚠ 而「<b>逼近 / 模仿</b>」这个用词是精确的：<b>点积严格地只依赖相对距离（这是保证的）; 而「越远越不相似」只在一定范围内近似成立（这是逼近的）—— 把这两者分开，才是真的懂了这条公式</b>。",r:"⇒ 一旦你看懂那一步形状匹配，整条公式就不再任意了 —— <b>它是为了让 cos(a−b) 能用上而设计的</b>。<br>⇒ 而这正是读论文时最值钱的一种能力：<b>遇到一条看起来任意的公式，先问它想保证什么性质，然后去找那个性质是怎么被凑出来的</b>。<br>⇒ 只剩「为什么是 10000」还没解释 —— 那个在下一个知识点。更多（逐项展开的完整写法、平移不变性和 RoPE 的关系）见<b>深度笔记</b>。"});
  QUIZ(0,4,{t:"正弦位置编码为什么要把 sin 和 cos 分到相邻的奇偶两维，而且共用同一个 ω_i？",o:["为了让向量的范数恒等于 1，便于做余弦相似度","纯粹是实现上的习惯，全用 sin 也完全一样","因为恒等式 cos(a−b)=cos a cos b + sin a sin b 需要两项（一项 cos·cos、一项 sin·sin）;点积是逐维相乘再求和，所以必须一维放 sin、另一维放 cos 且共用同一个 ω_i，这两项才会在求和里相遇并合成 cos(ω_i(m−n))","因为 sin 和 cos 的梯度互补，训练更稳定"],a:2,w:"⇒ 合成之后点积只依赖 m−n（平移不变）。而「越远越不相似」只是在一定范围内近似成立 —— 因为余弦是周期的。"});
});
KP("5 · ⭐ 为什么是点积、周期性的坦白、热力图与结论",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("21:31","in the embedding world when we try to quantify the similarity between two embeddings",166);
  says("22:02","if you remember your trigonometry class, cosine of 0 is 1",192);
  note("⭐ 那个被推迟的解释：为什么我一直在算点积",640,222,"y");
  boxNode(80,254,500,50,"余弦相似度 ＝ 点积 / 两个范数","b");
  boxNode(700,254,500,50,"⇒ 所以它基本上就是一个点积","g");
  note("L1 用它说明 one-hot 不行",330,328,"b");

  note("⚠ 而他立刻自己打补丁：它是周期的，过了 π 就反着走了",640,374,"r");},"<b>讲者在这里补上了那个被推迟的解释，而它直接接回 L1。</b><br>⭐ 「<b>我为什么在乎点积？因为在嵌入的世界里，当我们试着量化两个嵌入之间的相似度时，我们做的典型是某种涉及这两者点积的东西 —— 你典型地会有余弦相似度，而余弦相似度就只是点积除以每个嵌入的范数</b>」 ⇒ <b>L1 里他用同一把尺子证明了「one-hot 下所有词两两正交」,所以我们才需要稠密嵌入；现在同一把尺子量出了正弦编码的成功 —— 先量出一个失败、再量出一个成功，这就是一门课的连贯性</b>。<br>⭐ 然后是这一镜最该学的动作：「<b>cos 0 等于 1，而这个数越高 cos 的值就越低。当然，它是周期的，所以我说的不一定是真的 —— 过了 π 它就反着走了</b>」 ⇒ <b>给一个直觉，同时标注它的适用范围</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("22:38","for m equal to n, you have basically a sum of cosine of 0",166);
  says("23:10","And so now when you plot the values of the embeddings, this is what you obtain",192);
  says("23:41","if you take, let us say, the first row, you are looking at the first or number 0 position",218);
  note("⭐ 唯一能严格断言的那一点，以及这张图的两条轴",640,250,"y");
  boxNode(80,282,500,50,"m = n ⇒ 每一项都取到最大值 1","g");
  boxNode(700,282,500,50,"纵轴＝位置 0..49，横轴＝维度编号 i","b");
  note("⚠ 这张图在网上有两种画法 —— 轴认反了，结论就全反了",640,358,"r");},"<b>这一镜给出了唯一能严格断言的那一点，而它恰好是最该断言的那一点。</b><br>⭐ 「<b>对 m 等于 n，你基本上有一堆 cos(0) 之和 —— 而那是这个量取到最大的值⋯⋯这意味着如果你看的是那个位置本身，它是最相似的</b>」 ⇒ <b>为什么这一点能严格说：cos 的最大值是 1 且只在角度为 0 时取到 ⇒ m=n 时每一项都取到各自的最大值，一个和里每项都最大，这个和当然最大 —— 不需要任何额外假设</b>。<br>⭐ 然后图来了，而第一件事是认轴：「<b>y 轴上我表示的是比如 50 个位置、每一个位置的所有嵌入；而 x 轴上是跨越一个向量若干个维度的那些值</b>」 ⇒ <b>纵向是位置 0 到 49、横向是维度编号 i、每格颜色是那一维的值；而取第一行就是在看位置 0 那个嵌入的全部值</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("23:55","for low dimensions, this value goes up and down very frequently",166);

  says("25:15","it can extend to any sequence length, not just a sequence length that you saw at training time",218);
  note("⭐ 低维高频、高维低频 —— 一个连续版的二进制计数器",640,250,"y");
  boxNode(80,282,500,50,"i=0 ⇒ ω=1 ⇒ 周期约 6.3 个位置","y");
  boxNode(700,282,500,50,"i=d/2 ⇒ ω=0.0001 ⇒ 周期约 6.3 万","b");
  note("⭐ 两个方案指标打平、其中一个多一个性质 ⇒ 选那个多一个性质的",640,358,"g");},"<b>这就是那张图要告诉你的全部内容，而它最后把论文的那个决策模式讲完整了。</b><br>⭐ 「<b>对低的维度这个值上上下下非常频繁，所以它更高频；而维度高的时候要花很长时间才上下一次⋯⋯omega i 对低的 i 非常高、对高的 i 非常低，所以这就决定了你的 cos 和 sin 变化得有多快</b>」 ⇒ <b>它就是一个连续版的二进制计数器：低维像低位快速翻转、高维像高位缓慢变化。只有低频分不清位置 3 和 4，只有高频分不清 3 和 1003 —— 叠在一起才能既辨细微又辨大尺度；而 10000 这个常数决定最慢那一维的周期有多长（约 6 万），也就是能唯一区分的最大跨度</b>。<br>⭐ 结论：「<b>它能延伸到任何序列长度，而不只是你在训练时见到的那个长度</b>」 ⇒ <b>指标打平、其中一个多一个性质，就选多那个性质的</b>。");
  SUM(0,5,{h:"⭐ 热力图与第二代的结论",k:"<b>「我为什么在乎点积？因为如果你记得，在嵌入的世界里，当我们试着量化两个嵌入之间的相似度时，我们做的典型是某种涉及这两者点积的东西。你典型地会有余弦相似度。而余弦相似度就只是点积除以每个嵌入的范数 —— 所以它基本上就是一个点积」; 「如果你记得你的三角课：cos 0 等于 1，而这个数越高，cos 这个数的值就越低。当然，它是周期的，所以我说的不一定是真的 —— 过了 π 它就反着走了」; 「但对 m 等于 n，你基本上有一堆 cos(0) 之和 —— 而那是这个量取到最大的值⋯⋯它符合我们的直觉」</b>。<br>⭐ 热力图：<b>「y 轴上我基本上表示的是比如说 50 个位置、每一个位置的所有嵌入；而 x 轴上基本上是沿着某一条给定向量、跨越一个向量若干个维度的那些值」; 「对低的维度，这个值上上下下非常频繁 —— 所以它更高频。而当维度高的时候，这个值基本上要花很长时间才上下一次」; 「omega i 对低的 i 值非常高，而对高的 i 值非常低。所以这基本上就决定了你的 cos 和 sin 变化得有多快」</b>;结论：<b>「用这些方法导致和学出来那个相当的结果。但这里我们有一个很大的优势，因为它能延伸到任何序列长度，而不只是你在训练时见到的那个序列长度」</b>。",m:"⭐ 为什么一直在算点积：<b>余弦相似度 ＝ 点积 / 两个范数 ⇒ 它基本上就是一个点积。而 L1 用这同一把尺子证明了 one-hot 下所有词两两正交（所以才需要稠密嵌入）—— 同一把尺子先量出一个失败、再量出一个成功</b>。<br>⭐ <b>m=n 时每一项都取到各自的最大值 1 ⇒ 这个和当然最大。只要 m≠n 就至少有一项不是 1 ⇒ 「自己和自己最相似」是严格成立的，而「远的比近的更不相似」只是大致成立</b>。<br>⭐ 热力图的结构是一个<b>连续版的二进制计数器</b>:<b>低维像低位（快速振荡）、高维像高位（缓慢变化）; 只有低频分不清位置 3 和 4，只有高频分不清 3 和 1003 —— 叠起来才能既辨细微差别又辨大尺度距离</b>。",w:" 读热力图先认轴：<b>纵向是位置（0..49）、横向是维度编号 i、每格颜色是第 m 个位置嵌入的第 i 维的值 —— 这张图在网上有两种画法，轴认反了「低维高频」这个结论就对不上</b>。<br>⚠ 「第一个、或者说 0 号，取决于你怎么索引」—— <b>原论文公式里 pos 从 0 开始、讲者口头从 1 开始、不同实现也不一样；差一位在这里不会错得很离谱，但在对照公式和代码时会让你怀疑自己</b>。<br>⚠ 而周期性的实际影响：<b>低维周期很短，稍远就绕回来了；高维周期长达六万多 ⇒ 「越远越不相似」主要是靠高维那些低频分量撑起来的</b>。",r:"⇒ 10000 这个常数的含义现在清楚了：<b>它设定了最慢那一维的周期有多长（约 6 万），而那大致就是这套编码能唯一区分的最大跨度 —— 所以后来做长上下文的人会去调它，这正是 RoPE 时代那些 NTK 缩放、调 base 的核心思路</b>。<br>⇒ 而那个决策模式比「选指标高的那个」更重要：<b>指标是在当前数据分布上测的，而性质是结构性的 —— 2017 年没人需要 512 以上的长度，而今天所有人都需要；作者当时选的那个「暂时没用」的性质，八年后成了刚需</b>。<br>⇒ 更多（m=n 严格性的完整论证、索引从 0 还是从 1 带来的实现 bug、10000 的频率跨度算法）见<b>深度笔记</b>。"});
  QUIZ(0,5,{t:"正弦位置编码的热力图上，为什么要让不同维度有不同的频率（低维高频、高维低频）？",o:["为了让位置嵌入和词嵌入的范数匹配，相加时不互相淹没","因为只有低频你分不清位置 3 和位置 4（值几乎一样）,只有高频你分不清位置 3 和位置 1003（绕回来了）—— 两者叠在一起才能既分辨细微差别又分辨大尺度距离，就像一个连续版的二进制计数器","为了让每一维的数值范围都落在 −1 到 1 之间","因为高维的梯度更小，所以要用更低的频率补偿"],a:1,w:"⇒ 而 10000 这个常数决定最慢那一维的周期有多长（约 6 万），也就是能唯一区分的最大跨度 —— 所以做长上下文的人会去调它。"});
});

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 而第一代的问题就一个词：间接 —— 中间隔着 W_q 和 W_k 两次投影",640,356,"r");},"<b>这就是整条演化线的转折点，而讲者对第一代的批评只用了一个词：间接。</b><br>⭐ 「<b>当你在输入处做这件事的时候，它大致会是某个要进到这个注意力层里的东西，但它是有点间接的。所以我们想要的，是直接去对注意力公式做点什么</b>」 ⇒ <b>位置信息加在输入嵌入上之后，就和词义混在同一个向量里，然后被 W_q、W_k 各揉一遍才间接地影响到分数 —— 而那两个矩阵是学出来的，没有任何机制保证它们会把位置信息完好地带过去</b>。<br>⭐ 于是做法变成：「<b>自注意力层基本上就是 softmax(QKᵀ 除以根号 d) 乘 V。所以我们想要的，是在那个 softmax 里面加一点小东西</b>」 ⇒ <b>注意力分数 ＝ 内容的相似度 ＋ 位置的亲疏</b>。");
  SUM(0,6,{h:"⭐⭐ 搬进 softmax 里",k:"<b>「现在，快进到 2025 年。我想你可能会问我：我们还在用那个吗？而答案是 —— 算是吧。所以我们还在用这个想法：我们想要远的 token 比近的 token 更不相似。但我们不再像他们那样去注入那个嵌入了」</b>;错配：<b>「你在乎的是确定「在自注意力的计算里，token 有多相似」。而自注意力的计算发生在哪里？在注意力层。但这里我说的是什么？我说，我们来算这些嵌入，然后把它们加在这里。而实际上我们想要的，是在注意力层里反映这个相似度」</b>。<br>⭐ 纲领：<b>「我们主要想让这个直觉在多头注意力层里成立。所以这就是人们尝试过不同变体的原因之一 —— 而特别是，让这些位置嵌入直接在注意力层里介入，而不是在输入处」</b>;批评：<b>「当你在输入处做这件事的时候，它大致会是某个要进到这个注意力层里的东西，但它是有点间接的」</b>;做法：<b>「自注意力层基本上就是 softmax(QKᵀ 除以根号 d) 乘 V。所以我们想要的，是在那个 softmax 里面加一点小东西 —— 而那里基本上就是你量化「一个 token 和另一个 token 有多相似」的地方」</b>。",m:"⭐⭐ 「<b>算是吧</b>」的结构：<b>目标保留（近的更相似、远的更不相似）,手段换掉 ⇒ 量化那一半基本没变，注入那一半被整个重做</b>。<br>⭐ 而「间接」的技术内容是：<b>位置信息加在输入嵌入上后和词义混在同一个向量里，要先被 W_q、W_k 各投影一次，才间接影响到注意力分数 —— 而这两个矩阵是学出来的，没有机制保证位置信息被完好带过去</b>。<br>⭐ 那个加号的位置就是全部的设计：<b>它在 softmax 里面（影响权重分配）,它和 QKᵀ/√d 并列（和内容相似度同量级、同一个舞台）⇒ 注意力分数 ＝ 内容的相似度 ＋ 位置的亲疏</b>。",w:" 「<b>是的。是的，就是加。</b>」这个近乎好笑的简短回答是在打消一种怀疑：<b>位置信息这么重要，处理方式居然就是算一个同维向量加上去 —— 没有门控、没有拼接、没有专门的层</b>。<br>⚠ 而要加的那个 b 的形状要钉死：<b>QKᵀ 是 n×n，所以 b 也必须是 n×n；而它的第 (m,n) 个元素只依赖这一对位置，不依赖这两个位置上是什么词 ⇒ 于是「设计一个位置偏置」就变成了「给定一对位置输出一个数」这个很具体的问题</b>。",r:"⇒ 这个方向有一个很干净的说法：<b>如果你想影响一个量，就去改那个量，而不是去改它上游的某个东西然后祈祷影响能传过去</b>。<br>⇒ 而这个思路在深度学习里到处都是：<b>想要稀疏就在损失里加 L1，而不是指望权重自己变稀疏；想要某个层的输出有某种分布，就直接在那里归一化</b>。<br>⇒ 更多（W_q / W_k 到底会不会破坏位置信息、b 的 n×n 形状与显存代价）见<b>深度笔记</b>。"});
  QUIZ(0,6,{t:"为什么后来的位置编码方案要从「加在输入嵌入上」改成「直接在注意力层里介入」？",o:["因为输入层加法在推理时不能缓存，太慢","因为 d_model 太大，在输入层加位置向量太占显存","因为输入层的加法会破坏词嵌入的范数","因为你真正想影响的量（token i 该多关注 token j）就在注意力层里，而加在输入上要先被 W_q、W_k 两次投影才间接传到那里 —— 讲者的词是「间接」; 直接改那个量，而不是改它上游然后祈祷影响传得过去"],a:3,w:"⇒ 而这成了接下来三代的共同纲领：T5 和 ALiBi 加在注意力分数上，RoPE 乘进 Q 和 K 里 —— 区别只在介入的方式。"});
});

  note("⚠ 论文标题就是动机：Train Short, Test Long",640,374,"g");},"<b>一个很好的提问，而回答的那一句是整个注意力机制里最实用的直觉之一。</b><br>⭐ 学生问：偏置加在这里，不会给「<b>最后那个要和为 1 的概率</b>」带来问题吗？讲者答：「<b>在 softmax 里面你想干什么都行，因为 softmax 反正会把它归一化掉。所以你可以把这个偏置想成：对离得远的东西它可能更负一些，而对离得近的东西没那么负</b>」 ⇒ <b>这句话解释了注意力里一大类操作为什么合法：causal mask 给未来位置加 −∞、padding mask 给填充位加 −∞、T5 的相对偏置、ALiBi 的线性罚 —— 全都是「在 softmax 里面动手」</b>。<br>⭐ 而第四代的名字是「<b>Attention with Linear Bias</b>」,出自那篇《<b>Train Short, Test Long</b>》—— <b>标题把问题和承诺一起说了</b>。");

  note("⚠ 而讲者很诚实：论文里的胜负和实践中的采纳，是两件不同的事",640,374,"r");},"<b>ALiBi 的做法和 T5 刚好相反，而这个对立你已经见过一次了。</b><br>⭐ 「<b>与其去学那些偏置，不如我们真的有一条确定性的公式 —— 它是那两个位置之间相对差的一个函数</b>」 ⇒ <b>把四代排一下，那个模式就跳出来了：① 学出来的向量加在输入；② 固定公式的向量加在输入（正弦）; ③ 学出来的标量加在分数（T5）; ④ 固定公式的标量加在分数（ALiBi）—— 一个漂亮的 2×2，两个维度是「学 vs 不学」和「加在输入 vs 加在分数」,而四代正好把四个格子填满了</b>。<br>⭐ 然后是一个很诚实的转折：「<b>所有这些论文总是互相比较，来看哪一个更强。但现实是：在今天的模型里，大多数模型实际上用的是另一种位置嵌入方法</b>」。");
  SUM(0,7,{h:"⭐ T5 / ALiBi 与那个 2×2",k:"<b>「你想加一点小东西，来反映这样一个事实：某些 token 相比其它 token，本该是更相似的」; 「T5 那篇论文⋯⋯他们尝试了这些相对位置偏置，做法是把上面那条公式里的那个偏置项学出来」; 「我们把所有的 m 减 n 分桶到一些桶里，然后就让模型去学这些量 —— 而这些量接着会被注入到 softmax 里」</b>。<br>⭐ 学生问「偏置会不会破坏那个和为 1 的概率」,回答是：<b>「在 softmax 里面你想干什么都行，因为 softmax 反正会把它归一化掉。所以你可以把这个偏置想成：对离得远的东西，它可能更负一些；而对离得近的东西，没那么负」</b>。<br>⭐ 第四代：<b>「我想是那篇《Train Short, Test Long》,它引入了这个叫 ALiBi 的方法。ALiBi 的意思，我相信是 Attention with Linear Bias」; 「与其去学那些偏置，不如我们真的有一条确定性的公式 —— 它是那两个位置之间相对差的一个函数」</b>;而转折是：<b>「所有这些论文，它们总是互相比较，来看哪一个更强一些。但现实是：在今天的模型里，大多数模型实际上用的是另一种位置嵌入方法」</b>。",m:"⭐⭐⭐ 四代填满一个 2×2：<b>两个维度是「学 vs 不学」和「加在输入 vs 加在分数」⇒ ① 学出来的向量/输入；② 固定公式的向量/输入（正弦）; ③ 学出来的标量/分数（T5）; ④ 固定公式的标量/分数（ALiBi）</b>。<br>⭐ 而「<b>softmax 反正会归一化</b>」解释了注意力里一大类操作为什么合法：<b>causal mask（给未来加 −∞）· padding mask · T5 的相对偏置 · ALiBi 的线性罚 —— 全都是在 softmax 里面动手，而归一化会把绝对数值的影响吸收掉，只留下相对大小</b>。<br>⭐ T5 的「相对」是<b>设计上免费拿到的</b>:<b>它的输入本来就是 m−n；而第二代费了九分钟三角推导才让点积变成相对距离的函数</b>。",w:" 必须分桶，不是为了省参数：<b>m−n 的取值范围无界 ⇒ 若每个距离配一个可学参数，训练时没见过的距离就没有参数，又回到第一代的局限二。而 T5 的桶是对数式的不均匀划分：近处精细（距离 1/2/3/4 各一桶）、远处粗糙（100 到 200 共用一桶）—— 因为近处的差别要紧，远处「很远」就够了</b>。<br>⚠ 而论文里的胜负和实践中的采纳是两件事：<b>论文的对比总是在作者自己选的设置上做的，而实践还要考虑实现复杂度、生态与 KV cache 的兼容</b>。",r:"⇒ 「Train Short, Test Long」这个标题把第一代的局限二当成了卖点：<b>在 512 上训练、推理时跑 2048 甚至 4096 而性能不塌 —— 而在 2021 年，把训练长度拉长的代价是平方级的，所以「短训练、长推理」是实打实的省钱</b>。<br>⇒ 而「大多数模型用的是另一种」指的就是下一段的 <b>RoPE</b> —— 它恰好跳出了这个 2×2：<b>既不是加在输入、也不是加在分数，而是乘进 Q 和 K 里</b>。<br>⇒ 更多（T5 分桶的具体对数公式、ALiBi 每个头不同斜率的设计）见<b>深度笔记</b>。"});
  QUIZ(0,7,{t:"T5 的相对位置偏置为什么必须把 m−n 分桶，而且分得不均匀？",o:["因为 m−n 的取值范围无界：若每个距离配一个可学参数，训练时没见过的距离就没有参数（又回到第一代的局限二）;而不均匀（对数式）是因为近处的差别要紧、远处只要知道「很远」就够了","为了让偏置矩阵保持对称，满足 softmax 的要求","为了省显存，因为 n×n 的偏置矩阵太大","因为分桶之后才能用整数索引，GPU 查表更快"],a:0,w:"⇒ 而 ALiBi 的做法恰好相反：不学了，换一条关于相对差的确定性公式 —— 四代正好填满「学 vs 不学 × 加在输入 vs 加在分数」这个 2×2。"});
});

KP("9 · ⭐⭐ 两行证明：乘上旋转矩阵，就是转那个角",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$R(\\theta)\\,v \\;=\\; R\\,\\big(\\cos(\\theta+\\varphi),\\ \\sin(\\theta+\\varphi)\\big)$$","top");
  says("34:05","You can also write v as R with vector cosine of phi and sine of phi",192);
  says("34:42","you can show that rotation times this v can be expressed as R of cosine of theta plus phi",218);
  note("⭐ 请看结论的形状：角度加了 θ，长度一点没动",640,254,"y");
  note("⇒ 把向量拆成「长度 R」＋「纯方向 (cos φ, sin φ)」,后者是单位向量",640,288,"g");
  note("⚠⚠ 记号坑：这里的 R 是范数，而 R(θ) 是旋转矩阵 —— 同一个字母两个意思",640,322,"r");
  note("⭐ 那个乘法他留给你：展开用的就是 cos(a+b) 和 sin(a+b) 两条和角公式",640,356,"v");},"<b>翻译完成，结论出来了 —— 而请看它的形状。</b><br>⭐ 「<b>这些就是向量的范数、以及 φ（它相对于 x 轴的夹角）。你也可以把 v 写成 R 乘以向量 (cos φ, sin φ)⋯⋯而你可以证明：旋转矩阵乘以这个 v，可以表达成 R 乘以 (cos(θ+φ), sin(θ+φ))。我就把那个乘法留给你们</b>」。<br>⭐ 把那个乘法真做一遍（讲者留的练习）,用的就是和角公式：<b>第一行 cosθ·(R cos φ) − sinθ·(R sin φ) = R cos(θ+φ); 第二行 sinθ·(R cos φ) + cosθ·(R sin φ) = R sin(θ+φ) ⇒ 角度加了 θ，长度一点没动</b>。<br>⚠⚠ 记号上有个坑：<b>这里的 R 是「范数」,而上一镜那个 R(θ) 是「旋转矩阵」—— 同一个字母两个意思，看公式时要靠上下文分辨</b>。");

  SUM(0,11,{h:"⭐⭐⭐ RoPE 的两个好处",k:"<b>「如果你记得你的注意力公式 —— 你有 query 乘 key 转置。那么如果你把 query 旋转一个角度 m、把 key 旋转一个角度 n，你最终得到的是一条公式，它有角度 θ 和 n 减 m 的旋转矩阵。而这很棒，因为这是这两个位置之间相对距离的函数」; 「我为什么要讲这么细？事实是今天大多数模型都用 RoPE，而这就是它为什么重要」; 「由 query 和 key 给出的注意力权重的上界，是这样的：我们观察到一个长程衰减。意思是，当 n 减 m 很大时，我们确实看到那个上界变得越来越小。嗯，你看到这些小的振荡，它也不是完美的」</b>。<br>⭐ 三个提问：<b>「相对距离是被捕获在那个旋转矩阵里的？」——「正是如此」; 「theta 是什么？」——「theta 其实是固定的。你们还记得我讲过的那个 omega 吗？它基本上就是 i 和 d 的某个函数」; 「你扩展这个方法的办法，是按块来拥有这些 2 维空间⋯⋯你会看到这个 theta 大致就等于 omega i」</b>;收口：<b>「我在这上面花了不少时间，因为我觉得这确实相当重要 —— 很多模型都用它⋯⋯那么，这就是位置嵌入」; 「在 RoFormer 那篇论文里，有一个附录，他们在那里数学上证明了它被某个量上界住」</b>。",m:"⭐⭐⭐ 好处一比第二代那个结论更强：<b>第二代的结果是一个标量（PE(m)·PE(n) 的那堆余弦之和），还要和内容信息混在一起；而 RoPE 得到的 R(θ(n−m)) 是一个夹在 q 和 k 之间的算子 —— 绝对位置在点积里自己消掉了</b>。<br>⭐ 位置信息「存放在哪里」,五代各不相同：<b>一、二代存在一个向量里 · 三、四代存在一个标量里 · RoPE 存在一个算子（变换）里</b>。<br>⭐ d 维的做法：<b>把向量切成 d/2 个 2 维块，第 i 块配一个自己的角度 θ_i = ω_i = 10000^(−2i/d) ⇒ 和第二代那张热力图是同一个频率谱：低频块转得慢、高频块转得快</b>。<br>⭐ 而 <b>θ 是固定的，不是学出来的</b>——<b>若它是学的，RoPE 就掉回「会过拟合」那一边，整个卖点就没了</b>。",w:" 好处二说的是「<b>上界</b>」而不是注意力权重本身，这个区别是实质性的：<b>权重本身不单调下降（有「小的振荡」）; 上界给出的是「远的最多只能有这么相似」,而不是「远的一定不相似」—— 模型仍然可以关注远处的词，只是要在内容上更有说服力</b>。<br>⚠ 而前面全部推导都是 <b>2 维</b>的：<b>一个 2×2 矩阵、一个角度、一个范数；而 query 和 key 是 64 或 128 维 —— 这个缺口由「按块」的构造补上，块对角矩阵尺寸必须是 d_k × d_k，所以 i 的范围必须是 1 到 d/2</b>。",r:"⇒ 那九分钟的 sin/cos 推导不是在讲一个过时方法：<b>它是在给 RoPE 铺直觉地基 —— 讲者自己点明了这件事</b>。<br>⇒ RoPE 原论文是《<b>RoFormer: Enhanced Transformer with Rotary Position Embedding</b>》,而那条长程衰减曲线在它的<b>附录</b>里 —— <b>想看严格推导就去那里，而讲者坦白「公式有点复杂，我们不打算把它写下来」</b>。<br>⇒ 位置嵌入占了这一讲三分之一的时间（32 / 107 分钟）,<b>而这个时间分配本身就是一个值得相信的判断</b>。<br>⇒ 更多（上界曲线的形状、θ 固定与 NTK 缩放、块对角实现细节）见<b>深度笔记</b>。"});
  QUIZ(0,11,{t:"RoPE 的「长程衰减」这个好处，讲者说的到底是什么在衰减？",o:["衰减的是注意力权重的「上界」——当 n−m 很大时上界越来越小，而权重本身还有「小的振荡」;所以它说的是「远的最多只能有这么相似」,不是「远的一定不相似」,模型仍可关注远处的词，只是要在内容上更有说服力","注意力权重本身单调下降，所以远的 token 一定不被关注","衰减的是梯度，所以远距离的依赖学不到","衰减的是 q 和 k 的范数，因为旋转会压缩长度"],a:0,w:"⇒ 而这条曲线的严格证明在 RoFormer 那篇论文的附录里 —— 讲者坦白公式有点复杂，没有写下来。"});

  note("⇒ add = 残差（让梯度有一条直路）；norm = 归一化（让数值别跑飞）",640,386,"g");},"<b>这个名字就是字面意思，而它其实装了两件不同的事。</b><br><b>讲者的话</b>：<b>「<u>所以基本上，这里我们做的是：我们取这个子层的输入、以及这个子层的输出，我们把它们加起来，然后我们归一化。所以这是作者做的一个小技巧。而它在实践中被证明能改善收敛、并且就是让收敛更快一些</u>。」</b><br><b>★★★ 请注意 <u>Add & Norm</u> 这个方块里装的是<u>两个独立的机制</u>，而它们解决的是两个不同的问题</b>：<b>⇒ <u>Add（加）＝ 残差连接</u>。它把输入直接搭到输出上，<u>于是梯度有一条不经过子层的直路可以回传</u> —— 这是能把网络堆到几十上百层的前提。</b><b>⇒ <u>Norm（归一化）</u>。它把数值拉回一个合适的范围，<u>于是各层的激活不会越传越离谱</u>。</b><br><b>★★ 很多人（包括很多教程）把这两件事混着说，<u>但它们是可以分开讨论的</u>。</b><b>⇒ 证据就是：<u>后来的改动动的只是「Norm 放在哪」和「Norm 怎么算」，而「Add」从头到尾没变过</u>。</b><br><b>⇒ <u>残差连接是整个深度学习里最稳的一个设计 —— 2015 年的 ResNet 提出来，十年没人动过它</u>。</b>");

  note("★ 注意这里说的是「一个向量内部」的分量 —— 这正是 LayerNorm 和 BatchNorm 的分界",640,364,"r");},"<b>问题陈述很朴素，但请盯住一个词：它说的是「一个向量内部」的分量。</b><br><b>讲者的话</b>：<b>「<u>所以想法是这样的 —— 如果你有一个向量，有时候这个向量的分量可以超级大，有时候它们可以超级小。这里的想法是把你这个向量的分量归一化到某个范围里、某个归一化后的范围</u>。」</b><br><b>★★★ 「<u>你这个向量的分量</u>」这几个字就是 <u>LayerNorm</u> 的定义核心，而它正是和 BatchNorm 的分界线</b>：<b>⇒ <u>LayerNorm</u>：对<u>同一个向量内部</u>的那 d 个分量求均值和标准差。</b><b>⇒ <u>BatchNorm</u>：对<u>一个 batch 里不同样本的同一个分量</u>求均值和标准差。</b><br><b>⇒ 两者归一化的「方向」是垂直的。<u>而讲者在 49:49 那镜会被学生问到这件事，到时候可以回头对照</u>。</b><br><b>★★ 先把这个区别记住一个最实用的后果：<u>LayerNorm 对每个样本独立计算，所以它和 batch size 无关，甚至 batch size = 1 也能算</u>。</b><b>⇒ 而这对<u>推理</u>极其重要 —— 推理时常常就是一个样本一个样本地来。</b>");

  SUM(0,12,{h:"第二个变过的部件：层归一化",k:"架构图上那些写着 <b>add and norm</b> 的方块是什么意思？⇒ 字面意思：<b>取这个子层的「输入」和「输出」，加起来，然后归一化</b>。这是作者做的一个小技巧，<b>实践中被证明能改善收敛、让收敛更快</b>。归一化本身：<b>把向量减掉算出来的均值，再用它的标准差去归一化</b>。",m:"★★★ 这个方块里装的是<b>两个独立的机制</b>：<b>Add ＝ 残差连接</b>（把输入直接搭到输出上 ⇒ 梯度有一条不经过子层的直路，这是能堆几十上百层的前提）；<b>Norm ＝ 归一化</b>（把数值拉回合适范围 ⇒ 各层激活不会越传越离谱）。⇒ 证据是它们可以分开：<b>后来的改动动的只是「Norm 放哪」和「Norm 怎么算」，Add 从头到尾没变过</b>（残差是整个深度学习里最稳的设计，2015 年 ResNet 提出来十年没人动）。",w:"★★★ 「<b>你这个向量的分量</b>」这几个字就是 LayerNorm 的定义核心，也是和 BatchNorm 的分界：<b>LayerNorm 对同一个向量内部的 d 个分量求均值方差；BatchNorm 对一个 batch 里不同样本的同一个分量求</b> —— 两者方向垂直。⇒ 最实用的后果：<b>LayerNorm 对每个样本独立计算，和 batch size 无关，batch size = 1 也能算</b>，而这对推理极其重要。",r:"★ 他的切入点很好：从「<b>架构图上那个你早就见过、但可能一直没想过的方块</b>」出发，而不是从定义出发 ⇒ 通用教学模式：<b>找到学习者已经见过但没理解的东西，从那里开始</b> —— 它天然带着一个你自己早就挂好的钩子。⇒ 归一化的两个动作要记住：<b>减均值（中心化，均值→0）＋ 除标准差（缩放，标准差→1）</b>，因为 <b>RMSNorm 恰好砍掉了第一个</b>。"});

KP("15 · 两个很好的提问：为什么要归一化、和 BatchNorm 的区别",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("48:12","So the question is, what is the intuition behind normalizing?");
  note("提问一（讲者：好问题）：归一化背后的直觉是什么？",640,186,"v");
  boxNode(130,214,1020,44,"答：看你的模型 —— 你有好几层","g");
  note("⇒ 在某些层里，你的向量 —— 更准确地说，你的「激活（activation）」—— ",640,292,"y");
  note("★ 讲者顺手补了个术语：从这里到那里的那个向量，基本上就叫做 activation",640,324,"g");
  note("⚠ 他的教法很一致：用到一个词之前先把它铺出来（L1 里也是这样）",640,362,"r");},"<b>这个提问讲者评为好问题，而他的回答里顺手铺了一个术语。</b><br><b>学生的问题</b>：<b><u>归一化背后的直觉是什么？</u></b><br><b>讲者的回答开头</b>：<b>「<u>所以这个直觉是：如果你看你的模型，你有好几层。在某些层里，你的向量 —— 更准确地说是你的激活 —— 所以你们知道吗，你看到的那个从这里走到那里的向量，基本上就叫做 activation（激活）</u>。」</b><br><b>★★ 请注意他在半句话中间停下来，<u>先把「activation」这个词定义了一遍</u>。</b><br><b>⇒ 这和他在 L1 里的做法完全一致：<u>用到一个术语之前先把它铺出来</u>。</b><b>⇒ L1 里他也是这样处理 <u>proxy task、OOV、perplexity</u> 的。</b><br><b>★★★ 而「<u>从这里走到那里的那个向量</u>」这个定义方式特别好</b>：<b>⇒ 他没有给一个抽象定义（「激活是神经元的输出值」），<u>而是指着架构图上的一段箭头说「就是这个」</u>。</b><b>⇒ <u>在一个有图的场合，指着图定义术语，比用文字定义准确得多</u>。</b><br><b>⇒ 顺带把这个词钉死：<u>激活 = 层与层之间流动的那些向量</u>，不是权重、不是梯度。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("48:45","the model is typically having trouble in learning the weights in each of these layers if these activations, they vary too much");
  note("⭐⭐ 这就是归一化的直觉，一句话",640,186,"y");
  boxNode(130,214,1020,44,"如果这些激活「变化太大」，模型在学每一层的权重时通常会有困难","g");
  note("⇒ 有时激活在它的某一部分分量上有极端值，有时在另一部分",640,292,"y");
  note("★ 所以想法是：把激活各分量的值带到「某个不太偏向任何方向」的范围里",640,324,"g");
  note("⚠ 关键词是「vary too much（变化太大）」—— 不是「太大」，是「变化太大」",640,362,"r");},"<b>这就是归一化的直觉，而关键词是「变化太大」而不是「太大」。</b><br><b>讲者的话</b>：<b>「<u>有时候激活在它某一部分分量上有极端值，有时候在另一部分。而如果这些激活变化太大，模型在学习这些层里每一层的权重时，通常会有困难。所以想法是把激活各分量的值带到某个不会在某个方向上偏太远的范围里</u>。」</b><br><b>★★★ 为什么是「<u>变化太大</u>」而不是「太大」—— 这个区别是实质性的</b>：<b>⇒ 如果所有激活都稳定地很大（比如都在 100 左右），<u>模型只要学一组相应小一点的权重就能适应</u>。</b><b>⇒ 麻烦在于<u>它不稳定</u>：这一步激活在 100，下一步在 0.01。<u>那模型该把权重调到多大？</u></b><br><b>★★ 这正好解释了为什么归一化能加速收敛</b>：<b>⇒ <u>每一层看到的输入分布被稳住了，于是它要学的那个函数不再是一个「移动的靶子」</u>。</b><b>⇒ 没有归一化时，第 10 层每一步都在适应前 9 层变化带来的新分布 —— <u>它学到的东西下一步就过时了</u>。</b><br><b>⇒ <u>而这个「移动的靶子」现象，就是下一镜那个术语说的事</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("49:09","there is this key word, internal covariate shift");
  note("⭐ 讲者给了一个可以自己去查的关键词",640,186,"y");
  boxNode(130,214,1020,44,"internal covariate shift（内部协变量偏移）","g");
  note("⇒ 讲者：这基本上就是给我这里描述的这个现象起的那个名字",640,292,"y");
  note("★ 「万一你感兴趣，有这个关键词」—— 这种给法很实用",640,324,"g");
  note("⚠ 但要知道：这个解释后来被相当有力地质疑过（下面说）",640,362,"r");},"<b>讲者给了一个关键词，而关于这个关键词有一段值得知道的后续。</b><br><b>他的话</b>：<b>「<u>所以万一你感兴趣，有这么一个关键词 —— internal covariate shift（内部协变量偏移）—— 它基本上就是给我在这里描述的这个现象起的那个名字。所以是的，这就是那个直觉</u>。」</b><br><b>★★ 这个词出自 2015 年 BatchNorm 那篇论文，<u>它是归一化最初被提出时给的解释</u>：</b><b>⇒ 「<u>内部</u>」= 网络内部；「<u>协变量偏移</u>」= 输入分布发生变化。<u>合起来就是「每一层的输入分布在训练过程中不断漂移」</u>。</b><br><b>⚠⚠ 但这个解释后来被相当有力地质疑了</b>：<b>⇒ 2018 年有一篇很有影响的工作（<u>How Does Batch Normalization Help Optimization?</u>）做了实验：<u>人为地在归一化之后再注入噪声、把分布偏移重新制造出来 —— 结果训练依然又快又稳</u>。</b><b>⇒ 他们的结论是：<u>归一化的真正好处是「让损失曲面更平滑」，而不是消除了协变量偏移</u>。</b><br><b>★★★ 所以这是一个「<u>解释被推翻、但技术依然有效</u>」的经典例子</b>：<b>⇒ <u>BatchNorm 和 LayerNorm 一直都管用，只是当初说的那个原因可能不对</u>。</b><b>⇒ 讲者说的是「这是给这个现象起的名字」，这个措辞是安全的。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("49:32","batch normalization is normalization across the other dimension, which is the dimension of the batch");
  note("提问二（讲者：很好很好的问题）：这个和 batch normalization 有什么区别？",640,186,"v");
  boxNode(70,214,520,44,"LayerNorm","g");
  note("沿着「一个向量内部的各分量」归一化",330,284,"g");
  boxNode(690,214,520,44,"BatchNorm","b");
  note("沿着「另一个维度」—— batch 那一维",950,284,"b");
  note("⇒ 讲者：假设你有一堆向量，你把每个分量相对「其它向量的同一个分量」去归一化",640,326,"y");
  note("★ 所以两者的方向是垂直的 —— 一个横着归一化，一个竖着",640,364,"r");},"<b>这个提问讲者连说了两次「很好的问题」，而答案的关键就一个字：方向。</b><br><b>学生的问题</b>：<b><u>这个和 batch normalization 有什么区别？</u></b><br><b>讲者的回答</b>：<b>「<u>所以 batch normalization 是沿着另一个维度做的归一化，也就是 batch 那个维度。所以假设你有一堆向量 —— 你做的是：把每一个分量，相对于「同一个维度上、但属于其它那些向量的」所有分量去归一化。所以你可以把它想成只是另一种归一化的方式</u>。」</b><br><b>★★★ 画一张表就最清楚了。设你有一个 batch，形状是 <u>（B 个样本 × d 个维度）</u></b>：<b>⇒ <u>LayerNorm：沿着 d 这一行算均值方差</u>（每个样本自己算一组）。</b><b>⇒ <u>BatchNorm：沿着 B 这一列算均值方差</u>（每个维度算一组，跨所有样本）。</b><br><b>★★ 而「<u>只是另一种归一化的方式</u>」这个说法很到位：<u>它们在数学上是对称的，没有哪个天生更对</u>。</b><b>⇒ 决定用哪个的<u>不是数学，是你的数据形状和使用场景</u>。</b><b>⇒ <u>CNN 的图像任务里 BatchNorm 一直是主流；而序列模型里是 LayerNorm</u>。下一镜说为什么。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:10","because BatchNorm, you are basically also dependent on the batch");
  note("⭐⭐ 为什么 transformer 用 LayerNorm 而不用 BatchNorm",640,188,"y");
  boxNode(70,216,520,44,"理由一","g");
  note("可能因为经验上它效果更好",330,286,"d");
  boxNode(690,216,520,44,"理由二（更硬的那个）","b");
  note("BatchNorm 让你「依赖于那个 batch」",950,286,"r");
  note("⇒ 而这会引入「训练时和推理时之间的差异」",640,328,"r");
  note("★★ 这就是那个硬理由 —— 推理时常常只有一个样本，哪来的 batch 统计量？",640,366,"y");},"<b>这一镜给出了两个理由，而第二个是真正硬的那个。</b><br><b>讲者的话</b>：<b>「<u>不过话说回来，当涉及到这些基于 transformer 的模型时，人们典型地用 LayerNorm —— 可能是因为经验上它效果更好。但也因为 BatchNorm，你基本上也依赖于那个 batch。而它可以引入、我想是、训练和推理之间的差异。所以这基本上就是原因</u>。」</b><br><b>★★★ 把第二个理由展开，它是一个很具体的工程问题</b>：<b>⇒ BatchNorm 要用<u>整个 batch</u>的统计量。训练时 batch 有 32、256 个样本，<u>统计量算得出来</u>。</b><b>⇒ 但<u>推理时你常常只有一个样本</u> —— 用户发来一句话，你就得回答。<u>一个样本的「跨样本均值」是什么？没有意义</u>。</b><br><b>⇒ 所以 BatchNorm 必须在训练时<u>额外维护一组滑动平均的统计量</u>，推理时拿它们来用。</b><b>⚠ 而这就是那个「<u>训练和推理之间的差异</u>」：<u>训练用的是当前 batch 的真实统计量，推理用的是历史平均 —— 两者不是同一个函数</u>。</b><br><b>★★ 而 <u>LayerNorm 完全没有这个问题：它只看当前这一个向量</u>。</b><b>⇒ <u>训练和推理算的是同一件事，batch size 是 1 还是 1000 毫无区别</u>。</b><b>⇒ 对一个要服务线上请求的模型，<u>这个性质几乎是必需的</u>。</b>");
  SUM(0,15,{h:"两个很好的提问：为什么归一化、与 BatchNorm 的区别",k:"① <b>归一化的直觉</b>：模型有好几层，<b>而如果这些「激活」变化太大，模型在学每一层的权重时通常会有困难</b> ⇒ 想法是把激活各分量带到某个不会偏太远的范围。关键词：<b>internal covariate shift（内部协变量偏移）</b>。② <b>与 BatchNorm 的区别</b>：<b>BatchNorm 是沿「另一个维度」—— batch 那一维 —— 归一化</b>，把每个分量相对「其它向量的同一个分量」去归一化。",m:"★★★ 关键词是「<b>变化太大</b>」而不是「太大」：所有激活都稳定地很大，模型学一组小权重就能适应；<b>麻烦在于它不稳定 —— 这一步 100、下一步 0.01，那权重该调到多大？</b>⇒ 这正解释了为什么归一化加速收敛：<b>每一层看到的输入分布被稳住了，它要学的函数不再是一个「移动的靶子」</b>。⇒ 画表最清楚（B 个样本 × d 维）：<b>LayerNorm 沿 d 这一行算（每样本一组），BatchNorm 沿 B 这一列算（每维一组、跨样本）—— 方向垂直</b>。",w:"⭐⭐ 为什么 transformer 用 LayerNorm：<b>理由一，可能因为经验上效果更好；理由二（更硬），BatchNorm 让你「依赖于那个 batch」，而这会引入「训练时和推理时之间的差异」</b>。★★★ 展开：<b>推理时常常只有一个样本，一个样本的「跨样本均值」没有意义</b> ⇒ BatchNorm 必须额外维护滑动平均统计量，<b>于是训练用当前 batch 的真实统计量、推理用历史平均 —— 不是同一个函数</b>。而 <b>LayerNorm 只看当前这一个向量，训练和推理算的是同一件事</b>，对要服务线上请求的模型几乎是必需的。",r:"⚠⚠ 关于 internal covariate shift 有一段后续值得知道：它出自 2015 年 BatchNorm 那篇论文，<b>但 2018 年《How Does Batch Normalization Help Optimization?》做了实验 —— 人为在归一化后注入噪声、把分布偏移重新造出来，训练依然又快又稳</b>，结论是<b>归一化的真正好处是「让损失曲面更平滑」而不是消除了协变量偏移</b>。★★★ 所以这是「<b>解释被推翻、但技术依然有效</b>」的经典例子。⇒ 另外讲者顺手铺了术语：<b>激活 = 层与层之间流动的那些向量</b>（不是权重、不是梯度），而他指着架构图上那段箭头说「就是这个」—— <b>在有图的场合，指着图定义术语比文字定义准确得多</b>。"});
  QUIZ(0,15,{t:"transformer 用 LayerNorm 而不用 BatchNorm，那个「更硬」的理由是什么？",o:["BatchNorm 不支持变长序列","LayerNorm 的参数更少","BatchNorm 无法并行","BatchNorm 依赖整个 batch ⇒ 推理时常只有一个样本，必须改用历史滑动平均，于是训练和推理不是同一个函数"],a:3,w:"⇒ 而 LayerNorm 只看当前这一个向量，训练和推理算的是同一件事，batch size 是 1 还是 1000 毫无区别。"});
});
KP("16 · ⚠ 第三个部件：注意力，以及那个 O(n²)",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:51","letting every token interact with all other tokens");
  note("三个部件里的第三个",640,186,"v");
  seq(100,214,["位置嵌入 ✓","层归一化 ✓","注意力 ← 现在"],["d","d","g"],340,44);
  note("⇒ 讲者：现在我们要看 transformer 第三个重要的部件 —— 注意力",640,290,"y");
  note("★ 而他的切入句很诚实：有件事我其实一直没真正强调",640,322,"g");
  note("⚠ 那件事就是：自注意力的「代价」",640,360,"r");},"<b>第三个部件，而讲者的切入方式是承认自己漏讲了一件事。</b><br><b>他的话</b>：<b>「<u>好，所以我们看了位置嵌入，我们看了层归一化。那么现在我们要看 transformer 第三个重要的部件 —— 它是注意力。而特别是，我想有一件事我其实并没有真正强调过</u>。」</b><br><b>★★ 「<u>有件事我其实没真正强调过</u>」—— 而那件事是自注意力的代价。</b><br><b>⇒ 回想 L1 和这一讲前面：<u>每一次讲自注意力，强调的都是它的好处</u> —— 每个 token 能直接看到所有 token、完全并行、GPU 爱矩阵。</b><br><b>★★★ 而这一镜开始讲的是账单的另一面：<u>「每个 token 看所有 token」这件事，本身就是 O(n²)</u>。</b><br><b>⇒ 其实这个代价一直在眼前：<u>01:38 那镜他复述自注意力时说的就是「每个 token 关注序列里所有其它 token」</u>。</b><b>⇒ 当时我就标注过：<u>「所有其它 token」这几个字正是 O(n²) 的来源</u>。</b><br><b>⇒ 现在它要被正式结账了。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:57","a matrix that shows all the interactions");
  note("那个 n×n 的交互矩阵",640,186,"v");
  var M=[["q₁·k₁","q₁·k₂","⋯"],["q₂·k₁","q₂·k₂","⋯"],["⋮","⋮","⋱"]];
  matrix({rows:3,cols:3,cw:120,ch:42,x:460,y:206,cell:function(i,j){return M[i][j];}});
  note("⇒ 行是 query 的位置，列是 key 的位置",640,346,"y");
  note("★ n 是序列长度 ⇒ 这张表有 n×n 个格子，每个格子都要算一次点积",640,378,"g");},"<b>把那张表画出来，代价就一目了然了。</b><br><b>讲者的话</b>：<b>「<u>但当你做自注意力时，你基本上让每一个 token 和所有其它 token 交互。所以当你看一个显示所有这些交互的矩阵时 —— 你有 n，序列长度</u>。」</b><br><b>★★ 这就是 L1 里那个 <u>QKᵀ</u></b>：<b>⇒ <u>行 = query 的位置</u>（谁在问）；<u>列 = key 的位置</u>（问谁）。</b><b>⇒ 第 (i,j) 个格子 = <u>token i 的 query 和 token j 的 key 的点积</u>。</b><br><b>★★★ 而「<u>每个 token 和所有其它 token 交互</u>」就是说<u>这张表每个格子都要填</u></b>：<b>⇒ 格子数 = <u>n × n</u>。</b><b>⇒ 每个格子要算一次 d_k 维的点积。<u>所以总计算量是 n²·d_k</u>。</b><br><b>⇒ 而更要命的往往不是计算量，是<u>存储</u>：<u>这张 n×n 的矩阵要存下来做 softmax</u>。</b><b>⇒ n = 1000 时是 100 万个数（还要乘头数和 batch）；<u>n = 100000 时是 100 亿个数 —— 一张显卡根本放不下</u>。</b><br><b>★ 这是 L4 讲 FlashAttention 时真正要解决的问题，<u>而今天这镜是它的起点</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("51:06","you basically have o of n squared complexity, which is a lot, especially as n grows longer");
  note("⭐⭐ 结论：O(n²) 的复杂度",640,186,"y");
  boxNode(130,214,1020,44,"讲者：而这「很多」—— 尤其是当 n 变得更长的时候","g");

  SUM(0,19,{h:"★ 感受野：滑动窗口为什么还能看得远",k:"具体例子：<b>Mistral 在「每一层」都用滑动窗口注意力</b>（不交错、全是局部的）。那远处信息怎么传？⇒ <b>这个 token 能关注到那个 token，而那个 token 又能关注到更远的那个，等等等等</b> —— <b>这就类似计算机视觉里「感受野（receptive field）」那个想法</b>。标准问法：<b>拿一个 token，去想它「实际上（effectively）」和哪些别的 token 交互过</b>。",m:"★★★ 接力说清楚：<b>第 1 层位置 10000 只能直接看到 [5904, 14096]，但它看到的「位置 5904 的表示」已经吸收了 [1808, 10000] ⇒ 到第 2 层，位置 10000 就间接接触到了位置 1808</b>。⇒ 粗算：<b>L 层、窗口 w ⇒ 有效视野约 L×w</b>；Mistral 7B 有 32 层、窗口 4096 ⇒ <b>约 131000，所以宣传的 32K 完全够</b>。⇒ CNN 里一样：<b>3×3 卷积核第 L 层感受野是 (2L+1)×(2L+1)，堆 10 层就有 21×21</b>。",w:"⚠ 但这个视野是「<b>间接</b>」的，而间接有代价：<b>信息每经过一层都会被混合、稀释（和几千个其它 token 一起平均）⇒ 远距离信息能传过来，但传过来的是一个被反复揉过的版本</b>。★ 这就是为什么<b>交错一个全局层仍然有价值 —— 全局层给的是「原汁原味的直连」</b>。⚠ 而和卷积的区别仍要记住：<b>卷积权重位置无关且共享，注意力权重是每一对现场算的 ⇒ 滑动窗口注意力可以看成「权重由内容决定的卷积」</b>。",r:"★★★ 「<b>实际上（effectively）</b>」这个副词把两件事分开了：<b>直接交互（这一层的注意力真把两者连起来了吗 —— 看窗口）vs 实际交互（经过若干层后，这个 token 的表示里有没有那个的成分 —— 看感受野）</b>。⇒ 两者答案常差很远，<b>这正是「有效上下文长度」这个概念存在的原因</b>：一个模型可以声称支持 128K，<b>但如果架构让远处信息被稀释到几乎没有，那个 128K 就是名义上的</b>。⇒ 所以今天评测长上下文<b>不看它接受多长输入，而看它能不能真的用上</b>（needle-in-a-haystack 那类测试），而那类评测背后的思路就是这个问法。"});

  note("⚠ 而 MHA 就是 g = h 这个特例 —— 它不是「另一种机制」，是这个连续谱的端点",640,386,"r");},"<b>这一镜把那三个缩写从「名字」变成「一个可以算的数」。</b><br><b>讲者的话</b>：<b>「<u>你有中间的情形：你共享 g 个 —— g 是组数 —— g 组用于 v 和 k 的投影矩阵。然后你有大小为 h 除以 g 的那些组。所以这个叫 Group Query Attention，GQA</u>。」</b><br><b>★★★ 把三个数摆出来，整件事就只是一个比例</b>：<b>⇒ <u>query 的投影矩阵：h 个</u>，每个头一个，<u>五代里从来没动过</u>。</b><b>⇒ <u>K、V 的投影矩阵：g 个</u>。</b><b>⇒ <u>每组含 h/g 个头</u>，它们共用同一套 K、V。</b><br><b>★★ 代入真实的数字（Llama 3 8B）：<u>h = 32，g = 8</u></b>：<b>⇒ <u>每 4 个头共用一套 K、V</u>。</b><b>⇒ 于是 KV 缓存从「32 套」降到「8 套」—— <u>只剩 1/4</u>。</b><b>⇒ 而那个 17 GB 的例子就变成约 <u>4 GB</u>。</b><br><b>★★★ 而最该看清的是：<u>MQA 和 MHA 都只是 g 的两个端点</u></b>：<b>⇒ <u>g = 1 ⇒ MQA</u>（全部头共用一套）。</b><b>⇒ <u>g = h ⇒ MHA</u>（每头一套，也就是原来的多头注意力）。</b><br><b>⇒ 所以这<u>不是三种不同的机制</u>，<u>而是同一个机制上的一个可调参数</u>。</b><b>⇒ <u>把三个名字还原成一个数（g），你要记的东西就从三样变成了一样</u>。</b>");
  SUM(0,20,{h:"⭐⭐ MQA / GQA / MHA",k:"第二个变体（和第一个<b>正交</b>）：<b>不要每个头一个投影矩阵，而是跨多个头「共享」投影矩阵</b> —— 具体是 <b>query 保留若干个投影矩阵，而把 key 和 value 的投影矩阵分组、跨几个头共享</b>。三档：<b>MQA（全部 h 个头共享同一组 K、V）、GQA（分成 g 组，每组 h/g 个头）、MHA（每头自己的 Q/K/V —— 标准多头）</b>。",m:"★★★ 真正的理由（硬的那个）来自生成过程的不对称：<b>解码时你在「当前词」和「之前所有词」之间做注意力，每生成一个新词都要再做一次 ⇒ K 和 V 会反复出现</b>。⇒ 看清楚：<b>生成第 t 个词只需要第 t 个位置的 query（一个向量），却需要前面全部 t−1 个位置的 key 和 value（两个 (t−1)×d 矩阵）</b> ⇒ <b>Q 是 O(1)，K 和 V 是 O(t)，而 t 一直在增长</b> ⇒ 要省就该省那个会增长的。",w:"⭐⭐ 关键词 <b>KV cache</b>（下一讲讲）：<b>把 key 和 value 的值存下来，而我们想要的是让那个 cache 不要变得太大 —— 跨头共享投影矩阵就能省下空间和内存，这就是那个「为什么」</b>。⇒ 算一下：缓存大小 = <b>层数 × 头数 × 序列长度 × d_head × 2</b>；一个 7B 模型、32 层、32 头、d_head 128、序列 32000 ⇒ <b>约 17 GB（fp16），比模型权重本身还大</b>。而 GQA 把 K/V 头数从 32 降到 8 ⇒ <b>缓存降到约 4 GB</b>。★★ <b>所以 GQA 不是为了更快算，是为了放得下</b>，收益在<b>长上下文、大 batch 的推理服务</b>里最明显。",r:"★ 「正交」是数学借词，意思是<b>两个变体互不干涉、可以同时用</b>：<b>滑动窗口省「序列方向」的计算，共享投影省「头方向」的内存</b>（Mistral 7B 就是两个一起用）。⇒ 值得学的判断：面对一堆优化手段时<b>先问「它们省的是同一样东西吗」—— 是，就只能选一个；正交，就能叠加</b>。⇒ 软理由（讲者自己说只是「可能说得通」，还坦白「人们做事就是去试试行不行」）：<b>query 代表「问法」而不同的头该有不同问法，K/V 代表「被问的东西是什么」，这件事相对客观、不太需要多个版本</b>。⇒ 三个名字都在说「query 有几种」，因为变化的那一半恰恰是 K、V 共享了多少。"});
  QUIZ(0,20,{t:"为什么共享 K 和 V 的投影矩阵，而不共享 Q 的？",o:["因为 Q 必须保持精度","解码时每生成一个词只需要 1 个 query，却需要全部历史的 K 和 V ⇒ Q 是 O(1)、K/V 是 O(t) 且 t 在增长，所以要省就省会增长的那个","因为 Q 的参数更多","因为 K 和 V 在数学上是等价的"],a:1,w:"⇒ 具体地：7B 模型 32 层 32 头、序列 32000 的 KV cache 约 17 GB（比权重还大）；GQA 把 K/V 头数降到 8 ⇒ 约 4 GB。所以 GQA 不是为了更快算，是为了放得下。"});
});

  note("★ 他还列了：你的模型多大、你想在算力上省多少、你的输入长度如何",640,360,"g");},"<b>这是最后一个提问，而它问的恰好是最实用的那件事。</b><br><b>学生的问题</b>：<b><u>你怎么知道你该用哪一个？</u></b><br><b>讲者的回答</b>：<b>「<u>我会说这个选择永远是由几个因素驱动的。一个是它表现得多好。第二个是你有多在乎延迟、成本这类东西。所以它真的取决于你的模型有多大、你想在比如算力上省多少、你的输入长度如何 —— 比如说如果你有一个比较短的输入长度</u>。」</b><br><b>★★ 把他列的因素整理成一个可用的判断表</b>：<b>⇒ <u>输入很短</u> ⇒ KV cache 本来就不大 ⇒ <u>GQA 的收益小，用 MHA 就行</u>。</b><b>⇒ <u>输入很长 / batch 很大</u> ⇒ cache 是瓶颈 ⇒ <u>GQA 甚至 MQA</u>。</b><b>⇒ <u>模型很大</u>（层数多、头数多）⇒ cache 乘起来很可怕 ⇒ <u>必须共享</u>。</b><b>⇒ <u>追求极致质量、不在乎成本</u> ⇒ <u>MHA</u>。</b><br><b>★★★ 而讲者自己总结了那句最该记的话：「<u>这里我们想做的是，避免为整个那个 O(n²) 的东西做所有这些事情</u>。」</b><b>⇒ 一切优化的出发点都是那个平方项。</b><br><b>⚠ 然后他说：「<u>我会说这不是那么直截了当的，答案应该是什么</u>。」—— 又一次的诚实。</b>");

  SUM(0,21,{h:"两个收尾提问：用在哪些层、怎么选",k:"① <b>要用到自注意力和交叉注意力上吗？</b>⇒ <b>典型是在 decoder 里的「带掩码自注意力」那里起作用，但这个技术可以用在所有注意力层</b>；而<b>现代 LLM 是 decoder-only 模型，基本上只有 transformer 的 decoder 部分</b>。② <b>怎么知道该用哪一个？</b>⇒ <b>这个选择永远由几个因素驱动：表现多好、你多在乎延迟和成本、模型多大、想省多少算力、输入长度如何</b>。",m:"⚠⚠ 讲者本想推给 Shervine，但漏了下半场最重要的那个结论：<b>「我们在如今的模型里其实放弃了 encoder」</b>。⇒ 回想 03:12：<b>transformer 最初为机器翻译设计所以有两半，而今天的 LLM 只有一个序列（给 prompt、往下写），所以 encoder 没有事情可做</b>。★★ 这个剧透有价值 —— <b>它让你带着一个明确的问题去听下半场：为什么是 decoder 赢了？</b>",w:"★★★ GQA 的收益只在「带掩码自注意力 + 自回归生成」这个组合里才成立，值得想清楚：<b>GQA 省的是 KV cache，而 KV cache 只在「一个词一个词往下生成」时才存在</b> ⇒ <b>如果你只做分类（BERT 那样一次过完整个句子），根本没有 cache 要省</b>。⚠ 所以 GQA 是一个「<b>为生成式推理而生</b>」的技术 —— 这也是它在 2023 年之后才普及的原因。",r:"把因素整理成判断表：<b>输入很短 ⇒ cache 本来不大、MHA 就行；输入很长或 batch 很大 ⇒ GQA 甚至 MQA；模型很大（层多头多）⇒ 必须共享；追求极致质量不在乎成本 ⇒ MHA</b>。⇒ 讲者那句最该记的总结：「<b>这里我们想做的是，避免为整个那个 O(n²) 的东西做所有这些事情</b>」—— 一切优化的出发点都是那个平方项。★★ 而他的回答顺序值得学：<b>先说「没有标准答案、取决于一堆因素」（诚实），再说「但典型来说你会看到 GQA」（有用）</b> —— 两句都说才完整，只说第一句是推诿、只说第二句是过度简化。⇒ 事实对得上：<b>Llama 2 70B、Llama 3 全系、Mistral、Qwen 2、Gemma 都是 GQA；MQA 用得少（质量损失大），纯 MHA 基本只在小模型和老模型里</b>。"});
  QUIZ(0,21,{t:"为什么 GQA 是一个「为生成式推理而生」的技术？",o:["因为它在训练时会降低质量","因为它需要 RoPE 配合","它省的是 KV cache，而 KV cache 只在「一个词一个词往下生成」时才存在 —— 做分类时根本没有 cache 要省","因为它只在 encoder 里有效"],a:2,w:"⇒ 默认值可以直接拿走：「典型来说你会看到 GQA」—— Llama 3 全系、Mistral、Qwen 2、Gemma 都是 GQA。"});

  SUM(0,22,{h:"Shervine 接手：三类架构，先看 T5 家族",k:"下半场两件事：<b>① 深入看 transformer 格局里「有哪些种类的模型」；② 深入一个「对分类场景特别有用」的具体架构</b>。先看 <b>T5 家族</b>：<b>T5 = 多个 T 的缩写 —— Transfer Text-to-Text Transformer</b>（不是「第 5 版」）。变体：<b>mT5（m = multilingual，在数据和「词表在什么上面算出来」这两件事上做了更多工作）</b>；<b>ByT5（By = byte，一种「免 tokenizer」的方法 —— 放弃 tokenization，在字节层面操作，词表从约 3 万降到 2⁸ = 256）</b>。",m:"★★ 名字里最重要的是中间那段 <b>Text-to-Text</b>：T5 的核心主张是「<b>把所有 NLP 任务都写成「输入一段文本、输出一段文本」</b>」（分类就输出类别名、翻译就输出译文、甚至回归就输出数字的文本形式）⇒ <b>这个想法在 2019 年相当激进，今天已是常识 —— 所有 LLM 都是这么用的</b>。",w:"★★★ mT5 改的是<b>数据 + 词表，不是架构</b>，而「词表」是多语言最实际的难题：<b>如果语料 95% 是英文，学出来的词表几乎全是英文子词 ⇒ 一个中文词被切成五六个 token，而同义的英文词只占一个</b> ⇒ <b>中文用户为同样内容付更多 token 费、更快撞到上下文上限</b>（今天所有 LLM 上都真实存在）。所以 mT5 做的是<b>在语言分布更均衡的语料上重学词表</b> —— 比「加几层」要紧得多。",r:"ByT5 解决了 tokenization 的全部麻烦：<b>没有 OOV、没有语言偏见、没有拼写盲区</b>（能看到每个字符 ⇒ 能数字母、能处理错别字，这是今天 LLM 的著名弱点）。⇒ 参数也省：<b>嵌入矩阵从 30000×d 降到 256×d —— d=768 时从 2300 万降到 20 万</b>，输出层同样。⚠ 但代价很大：<b>一个英文词平均 4–5 字节、子词切法下约 1.3 个 token ⇒ 序列长三四倍，而注意力 O(n²) ⇒ 计算量涨十倍以上，省下的参数远远补不上</b>。⇒ 这就是<b>字节级方法至今仍是少数派</b>的原因，但这条路没死 —— <b>tokenization 一直是 LLM 里最不优雅的那个部件</b>。"});

  stack(640,200,["从一个「标示第一个被损坏 span」的 token 开始","一直解码，直到它预测出「下一个 sentinel token」","两个连续 sentinel 之间解出的 token = 被恢复的那一段"],620,32,8);
  note("⇒ 一直这样走到第 n+1 个",640,328,"y");
  note("★★ 所以 sentinel token 在输出里起的是「分隔符」的作用",640,356,"g");
  note("⚠ 讲者的定性：这基本上是对 next token prediction 目标函数的一个「转变」",640,386,"r");},"<b>这是 span corruption 最精巧的一半：输出端怎么组织。</b><br><b>讲者的话</b>：<b>「<u>所以你们在 encoder 里有它们。然后 decoder 的工作就是按序把这些 span 一个个找出来。所以你从一个标示第一个被损坏 span 的 token 开始，然后你开始解码过程，直到它碰到一个预测出「下一个 sentinel token」的预测，一直到第 n+1 个 —— 其中两个连续的 sentinel token 之间被解码出来的那些 token，就对应着被恢复的那些损坏片段</u>。」</b><br><b>★★★ 用那个例句走一遍，整件事就清楚了</b>：<b>⇒ <u>encoder 输入</u>：<u>my ⟨id_0⟩ is reading</u>。</b><b>⇒ <u>decoder 目标输出</u>：<u>⟨id_0⟩ teddy bear cute and ⟨id_1⟩</u>。</b><br><b>★★ 请注意输出的形式：<u>它不是完整的原句，而是「每个 sentinel 后面跟着它该填的内容」</u>。</b><b>⇒ 为什么这样设计：<u>因为这样输出序列只包含被挖掉的部分，而不用重复抄一遍没被挖的部分</u>。</b><b>⇒ <u>于是训练效率高得多</u> —— 一个句子挖掉 15%，输出就只有 15% 那么长。</b><br><b>⚠ 而 sentinel token 在这里有<u>两个</u>角色：<u>在输入里它是占位符，在输出里它是分隔符</u>。</b><b>⇒ 一个符号干两件事，<u>这是很漂亮的设计</u>。</b>");
  SUM(0,23,{h:"⭐ span corruption：T5 换掉了训练目标",k:"关于 T5 家族最该知道的一件事：<b>目标函数变了</b>。<b>原始 transformer：next token prediction；T5 家族：span corruption</b> —— 句子进 encoder，但<b>不是把全部都放进去，而是留下一些「空白」</b>，而被损坏的 span <b>可以是一个也可以是多个 token 缺失</b>。例：<b>my teddy bear is cute and reading → my ⟦span⟧ is reading</b>。",m:"⭐⭐ 关键术语 <b>sentinel token（哨兵 token）</b>：n 是被损坏 span 的数量，<b>输入里放 n 个这样的 token，而「一个 sentinel 代表一整段被损坏的 token」</b>。⇒ decoder 的工作是<b>按序把每个 span 找出来</b>：从标示第一段的 token 开始解码，<b>直到预测出下一个 sentinel，而两个连续 sentinel 之间解出的 token 就是被恢复的那一段</b>。走一遍：<b>encoder 输入 my ⟨id_0⟩ is reading ⇒ decoder 输出 ⟨id_0⟩ teddy bear cute and ⟨id_1⟩</b>。",w:"★★★ 「<b>span（片段）</b>」是 T5 和 BERT 的分界：<b>BERT 的 MLM 挑单个 token 遮住，模型知道要填一个词；T5 挖连续一段，而且一个 sentinel 换一整段 ⇒ 长度信息被丢掉，模型得自己决定填几个词</b>。⇒ 所以 span corruption <b>更难、更接近生成</b>，而这也解释了三类架构的分工 —— <b>任务决定架构</b>：T5 的任务要生成所以留着 decoder，BERT 只要分类所以能扔掉 decoder。⇒ 输出形式的妙处：<b>只包含被挖掉的部分，不用重抄没挖的 ⇒ 挖 15% 输出就只有 15% 长，训练效率高得多</b>；而 sentinel 在输入里是占位符、在输出里是分隔符，<b>一个符号干两件事</b>。",r:"★★ 记牢这个对比，它是 71:14 那个结论的核心论据：讲者后面会说<b>人们的投入流向了「最容易 scale up 和泛化」的 next-word prediction，而不是 T5 那个「更定制、更复杂」的任务</b>。⇒ 所以这是一场<b>关于「预训练任务该有多复杂」的路线之争</b>：<b>T5 的立场是精心设计的任务学到更好的表示；GPT 的立场是最简单的任务 + 最多的数据和算力</b> —— 而历史给出的答案是后者。⇒ 另：挑 <b>teddy bear</b> 挖是好示范，因为它是<b>复合名词</b> —— 只遮「bear」模型靠搭配就猜出来了（学得很浅），<b>遮整段才迫使它从「my ___ is reading」推断出一个合理主语</b>。"});
  QUIZ(0,23,{t:"T5 的 span corruption 和 BERT 的 MLM 最本质的区别是什么？",o:["一个 sentinel 换一整段（长度信息被丢掉，模型得自己决定填几个词），而 BERT 一个 [MASK] 换一个 token","BERT 的遮罩是确定性的","T5 只在 decoder 里遮","T5 遮的 token 更多"],a:0,w:"⇒ 所以 span corruption 更接近生成，而这解释了架构分工：T5 的任务要生成所以留着 decoder，BERT 只要分类所以能扔掉。"});
});
KP("24 · 一个关于解码过程的提问，与 teacher forcing",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:03","So these parentheses is basically a shift from the next token prediction objective function");
  note("讲者给 span corruption 的定性",640,186,"v");
  boxNode(130,214,1020,44,"这基本上是对「next token prediction」这个目标函数的一个「转变（shift）」","g");
  note("⇒ 他用的词是 shift，不是 improvement（改进）",640,292,"y");
  note("★ 这个用词很中性 —— 它不预判哪个更好",640,324,"g");
  note("⚠ 而四分钟后他会说：历史选了 next-word prediction",640,362,"r");},"<b>这一镜很短，但讲者的用词值得留意。</b><br><b>他的话</b>：<b>「<u>所以这些括号基本上是对 next token prediction 这个目标函数的一个转变</u>。」</b><br><b>★★ 「<u>转变（shift）</u>」这个词是中性的</b>：<b>⇒ 他没有说 <u>improvement（改进）</u>，也没有说 <u>complication（复杂化）</u>。</b><b>⇒ <u>只是「不一样了」</u>。</b><br><b>★★★ 而这个中性在这里是对的，因为<u>在 2019 年，T5 的这个选择看起来是很有道理的</u></b>：<b>⇒ T5 论文本身做了大量的消融实验，<u>比较了各种预训练目标，而 span corruption 在他们的实验里确实最好</u>。</b><b>⇒ 所以这不是一个拍脑袋的决定，<u>它是有实验支持的</u>。</b><br><b>⚠ 但四分钟后（70:44）讲者会说：<u>人们的算力投向了「最容易 scale up」的那个任务</u>。</b><b>⇒ <u>也就是说，T5 在「同等规模下哪个目标更好」这个问题上赢了，而在「哪个目标更能扩大规模」这个问题上输了</u>。</b><br><b>⇒ <u>这两个问题不一样，而后者才决定了历史</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:34","So you have sentinel tokens that denote some missing text");
  note("提问：能把「解码过程」再说详细点吗？",640,186,"v");
  boxNode(130,214,1020,44,"讲者：你刚说的关于「重建」那部分「完全正确」","g");
  note("⇒ 你有 sentinel token，它们标示某些「缺失的文本」",640,292,"y");
  note("★ 所以你想解码出来的就是那段缺失的文本",640,324,"g");
  note("⇒ 于是 decoder 的输出就恰好是「每一个 span 被重建出来」的样子",640,362,"d");},"<b>学生要求把解码过程再说一遍，而讲者的复述把这件事钉死了。</b><br><b>学生的问题</b>：<b><u>你能把解码过程再说详细一点吗？</u></b><br><b>讲者的回答</b>：<b>「<u>所以你刚才说的关于重建那部分完全正确。所以你有 sentinel token，它们标示某些缺失的文本。所以你想要解码出来的就是那段缺失的文本。所以 decoder 的输出就会恰好是「每一个 span 被重建出来」的样子</u>。」</b><br><b>★★ 这个复述值得停一下，因为它排除了一个很自然的误解</b>：<b>⇒ <u>误解</u>：decoder 输出<u>完整的原句</u>（my teddy bear is cute and reading）。</b><b>⇒ <u>正解</u>：decoder 只输出<u>被挖掉的那些段</u>，用 sentinel 隔开。</b><br><b>★★★ 为什么这个区别要紧</b>：<b>⇒ 如果输出完整原句，<u>那模型大部分的工作是在抄写 encoder 已经看到的内容</u>。</b><b>⇒ 抄写是一个很容易学的任务，<u>它会把梯度和容量都浪费掉</u>。</b><br><b>⇒ 而只输出缺失部分，<u>每一个被预测的 token 都是真正需要推断的</u>。</b><b>⇒ <u>这是一个关于「如何设计训练目标」的普遍原则：让模型只为「它真正需要学会的东西」付出预测</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:50","you do a teacher-forcing mechanism where you input everything in the decoder");
  note("⭐ 训练时怎么跑：teacher forcing",640,186,"y");
  stack(640,200,["把「全部」都输入到 decoder 里","然后试着「一次性」把全部重建出来","⇒ 这叫 teacher forcing（教师强制）"],560,32,8);
  note("⇒ 讲者：如果你想知道训练是怎么工作的 —— 你做一个 teacher-forcing 机制",640,328,"y");
  note("★★ 关键在「一次性（all at once）」—— 训练时不是一个词一个词生成的",640,356,"g");
  note("⚠ 这是训练和推理的一个根本差异，很多人在这里卡住",640,386,"r");},"<b>这是一个很重要的机制，而它解释了训练和推理为什么看起来完全不同。</b><br><b>讲者的话</b>：<b>「<u>然后如果你想知道训练是怎么工作的 —— 你做一个 teacher-forcing 机制，在那里你把所有东西都输入到 decoder 里，然后试着一次性把所有东西重建出来</u>。」</b><br><b>★★★ 把训练和推理并排看，差别很大</b>：<b>⇒ <u>推理时</u>：生成第 1 个词 ⇒ 把它接到输入上 ⇒ 生成第 2 个词 ⇒ …… <u>完全串行，n 个词要跑 n 次</u>。</b><b>⇒ <u>训练时（teacher forcing）</u>：<u>把正确答案整个塞进 decoder</u>，配上因果掩码，<u>一次前向就同时得到所有位置的预测</u>。</b><br><b>★★ 为什么能这样：<u>因为因果掩码保证了第 t 个位置看不到第 t 之后的内容</u>。</b><b>⇒ 所以虽然你把完整答案都塞进去了，<u>每个位置的预测仍然只依赖它之前的部分</u> —— <u>和串行生成在数学上等价</u>。</b><br><b>⚠ 而「<u>教师强制</u>」这个名字说的是：<u>每一步喂给模型的都是「正确答案」，而不是模型上一步自己的输出</u>。</b><b>⇒ 这带来一个著名的问题，叫 <u>exposure bias</u>：<u>训练时它从来没见过自己的错误，而推理时它必须接着自己的错误往下写</u>。</b>");
  SUM(0,24,{h:"解码过程，与 teacher forcing",k:"讲者给 span corruption 的定性：<b>这基本上是对 next token prediction 这个目标函数的一个「转变（shift）」</b>。提问「能把解码过程再说详细点」⇒ <b>sentinel token 标示缺失的文本，你要解码出来的就是那段缺失文本，所以 decoder 的输出恰好是「每一个 span 被重建出来」的样子</b>。训练：<b>做一个 teacher-forcing 机制 —— 把全部输入到 decoder 里，然后试着「一次性」把全部重建出来</b>。",m:"★★ 这个复述排除了一个自然的误解：<b>误解是 decoder 输出完整原句，正解是只输出被挖掉的那些段、用 sentinel 隔开</b>。⇒ 为什么要紧：<b>输出完整原句时模型大部分工作是在抄写 encoder 已经看到的内容，而抄写很容易学、会把梯度和容量都浪费掉</b>；只输出缺失部分则<b>每个被预测的 token 都是真正需要推断的</b>。⇒ 普遍原则：<b>让模型只为「它真正需要学会的东西」付出预测</b>。",w:"★★★ teacher forcing 解释了训练和推理为什么看起来完全不同：<b>推理时完全串行（生成一个接上去再生成下一个，n 个词跑 n 次）；训练时把正确答案整个塞进 decoder、配因果掩码，一次前向就得到所有位置的预测</b>。⇒ 能这样是因为<b>因果掩码保证第 t 个位置看不到 t 之后的内容 ⇒ 和串行生成在数学上等价</b>。⚠ 而「教师强制」这个名字说的是<b>每一步喂的都是「正确答案」而不是模型自己上一步的输出</b> ⇒ 带来著名的 <b>exposure bias</b>：<b>训练时它从来没见过自己的错误，推理时却必须接着自己的错误往下写</b>。",r:"★★ 「<b>转变（shift）</b>」这个用词是中性的 —— 他没说 improvement 也没说 complication，<b>只是「不一样了」</b>。而这个中性是对的：<b>T5 论文本身做了大量消融实验比较各种预训练目标，而 span corruption 在他们的实验里确实最好</b> —— 不是拍脑袋的决定。★★★ 但四分钟后讲者会说算力投向了「最容易 scale up」的那个 ⇒ <b>T5 在「同等规模下哪个目标更好」上赢了，而在「哪个目标更能扩大规模」上输了 —— 这两个问题不一样，而后者才决定了历史</b>。"});
  QUIZ(0,24,{t:"训练 T5 时用 teacher forcing，关键在哪一点？",o:["它让训练更准确","它避免了梯度消失","它让 encoder 不必参与训练","把正确答案整个塞进 decoder、配因果掩码 ⇒ 一次前向同时得到所有位置的预测，而不用串行生成"],a:3,w:"⚠ 代价是著名的 exposure bias：训练时模型从来没见过自己的错误，推理时却必须接着自己的错误往下写。"});
});
KP("25 · 第二类：encoder-only —— 它不能生成，而那正是重点",function(){

  note("⚠ 这句回答值得记住，它把一个「缺陷」翻成了「设计」",640,362,"r");},"<b>这段对话很漂亮，而它翻转了一个判断。</b><br><b>讲者的话</b>：<b>「<u>然后现在我们要讲另一类 transformer —— 基本上你有这个 encoder/decoder 结构，而你干脆忘掉 decoder，只处理 encoder。所以你可能会跟我说：好，嘿，你这样没法做生成啊。而我会回答你：是的，那正是重点</u>。」</b><br><b>★★★ 「<u>是的，那正是重点</u>」—— 这句话把一个看起来的缺陷翻成了一个设计选择，而它的理由是实在的</b>：<b>⇒ 如果你的任务是<u>情感分类</u>，你根本不需要生成能力。</b><b>⇒ 而<u>带着一个用不上的 decoder，意味着一半的参数在白吃显存</u>。</b><br><b>★★ 但「那正是重点」还有一层更深的意思，<u>这一层才是真正的理由</u></b>：<b>⇒ <u>去掉 decoder 之后，你可以让注意力「双向」</u>。</b><b>⇒ 因为 decoder 必须用因果掩码（不能看未来），<u>而 encoder 没有这个限制</u>。</b><br><b>⇒ <u>所以 encoder-only 不只是「砍掉一半更省」，它换来了一个 decoder 永远做不到的能力 —— 每个 token 都能看到整个句子</u>。</b><b>⇒ 而这正是 BERT 名字里那个 <u>Bidirectional</u> 的来源（71:45 那镜）。</b>");

  note("⚠ 「过去要用专门模型」—— 这就是 BERT 当年带来的那场变化",640,386,"r");},"<b>这一镜给出了 encoder-only 的用途，而讲者那句定位最值得记。</b><br><b>他的话</b>：<b>「<u>所以它有 encoder 的表示，这些表示可以用在那些可能更偏向分类的任务上。所以情感抽取、token 分类、所有这些过去要用专门的语言模型来做的事情 —— 它们都能用 transformer 的 encoder 部分来做</u>。」</b><br><b>★★★ 「<u>过去要用专门的语言模型来做</u>」这几个字，说的是 BERT 当年带来的那场变化，而它的分量值得交代</b>：<b>⇒ <u>BERT 之前</u>（2018 年以前）：每个 NLP 任务都有自己的一套模型。<u>情感分析一个、命名实体识别一个、句法分析一个</u>。</b><b>⇒ 每个都要<u>从头设计特征、从头训练、从头调参</u>。</b><br><b>★★ <u>BERT 之后</u>：<u>一个预训练好的 encoder + 一个小小的分类头</u>，就能在几乎所有这些任务上刷新纪录。</b><b>⇒ 而那个分类头<u>往往只是一层线性映射</u>。</b><br><b>⇒ <u>这就是「预训练 + 微调」这个范式的诞生，而它彻底改变了 NLP 的工作方式</u>。</b><br><b>⚠ 而今天我们已经走到了下一步：<u>连微调都不需要了，直接用 prompt</u>。<u>但 BERT 那一步是关键的中间环节</u>。</b>");

  SUM(0,25,{h:"第二类：encoder-only —— 不能生成，而那正是重点",k:"做法：<b>有 encoder/decoder 结构，而你干脆忘掉 decoder，只处理 encoder</b>。⇒ 讲者模拟学生「<b>你这样没法做生成啊</b>」，而他的回答是「<b>是的 —— 那正是重点</b>」。它能干什么：<b>有 encoder 的「表示」，用在更偏向分类的任务上 —— 情感抽取、token 分类，所有这些「过去要用专门的语言模型来做」的事</b>。下半场要深入三个：<b>BERT（这个格局里最中心的那个）、DistilBERT、RoBERTa（在若干条「改进的轴」上做探索）</b>。",m:"★★★ 「那正是重点」还有一层更深的理由：<b>去掉 decoder 之后，你可以让注意力「双向」</b> —— 因为 <b>decoder 必须用因果掩码（不能看未来），而 encoder 没有这个限制</b>。⇒ 所以 encoder-only 不只是「砍掉一半更省」，<b>它换来了一个 decoder 永远做不到的能力：每个 token 都能看到整个句子</b> —— 而这正是 BERT 名字里那个 <b>Bidirectional</b> 的来源。",w:"★★★ 「<b>过去要用专门的语言模型来做</b>」说的是 BERT 当年带来的那场变化：<b>BERT 之前每个 NLP 任务都有自己一套模型（情感分析一个、NER 一个、句法分析一个），每个都要从头设计特征、从头训练、从头调参</b>；<b>BERT 之后一个预训练好的 encoder + 一个往往只是一层线性映射的分类头，就能在几乎所有这些任务上刷新纪录</b>。⇒ <b>这就是「预训练 + 微调」范式的诞生</b>，而今天我们已走到下一步（连微调都不要、直接 prompt），但 BERT 那一步是关键的中间环节。",r:"★★ 「<b>改进的轴</b>」预告了整段结构，而那两条轴在 103:02 会被明确说出：<b>轴一是延迟/成本（BERT base 有 1.1 亿参数，能更小更快吗 ⇒ DistilBERT）；轴二是预训练目标（MLM 和 NSP 真的都有用吗、能简化吗 ⇒ RoBERTa）</b>。⇒ 这个讲法值得学：<b>先讲一个基准模型，再用「它有什么毛病」来组织后续的模型</b> —— 比按时间顺序讲一串论文好得多，<b>因为你记住的是「每个模型解决了什么问题」而不是「它叫什么、哪年发的」</b>。⇒ 也是一个读论文的办法：<b>任何一篇「改进了 X」的论文，先去找它认为 X 的毛病是什么</b>。"});

  SUM(0,27,{h:"⭐ BERT 这个名字拆开来",k:"<b>BERT = Bidirectional Encoder Representations from Transformers</b>，而讲者用这个缩写当大纲。<b>Encoder</b>（最容易把握）：<b>我们就是把 decoder 扔了，这个「来自 transformer 的 encoder」就是字面意思</b>。<b>Bidirectional</b>：<b>从一个给定输入，能得到「每个 token 都关注过一切」的输出表示</b> —— 因为只有 encoder，<b>这个自注意力层「真正地」关注每一个别的 token</b>；对照<b>带掩码的自注意力：掩码让注意力机制变成「因果的」，每个 token 只能关注它自己和它之前的</b>。",m:"★★★ 那个 <b>truly</b> 是在说 <b>GPT</b>：<b>作者在论文里讨论了很多 —— GPT 出来了，而 GPT 不是真正双向的；而这些能用于分类任务的编码，它们真的是</b>。⇒ 时间线：<b>2018 年 6 月 GPT-1（decoder-only、单向、next-word）、2018 年 10 月 BERT（encoder-only、双向、MLM+NSP）</b> —— 一场同期的路线之争，而 <b>BERT 在 GLUE 等理解类基准上大幅超过 GPT-1</b>。⚠⚠ 但 <b>BERT 赢了战役、输了战争</b>：它统治了 2018–2020 的理解类任务，而 <b>GPT 那条路长成了今天的一切</b>（原因正是那三条：更好扩大规模、更通用、和聊天对齐）。",w:"★★ 技术内容要钉死：<b>BERT 里位置 3 的输出表示由整个句子（1 到 n）加权得到；GPT 里只能由位置 1、2、3 加权得到</b> ⇒ 理解类任务上 BERT 每个 token 的表示信息量更大（<b>它看过全文</b>）。⚠ 代价是 <b>BERT 没法生成</b> —— 生成时「未来」还不存在，<b>双向和生成在结构上是互斥的</b>。⇒ 「<b>causal（因果的）</b>」从物理借来且借得准：<b>一个事件只能被它之前发生的事影响</b>。为什么生成必须因果：<b>训练时若允许位置 t 看到 t+1，模型会学会「抄答案」—— 损失降到近 0 而推理完全不work</b>。",r:"★★★ 一个很有启发的事实：<b>BERT 的 encoder 就是 2017 年那个 encoder，一行都没改</b>（同样的多头自注意力、FFN、残差、LayerNorm）⇒ BERT 的全部创新都<b>不在架构上</b>，而在三处：<b>① 怎么训（MLM + NSP）② 怎么用（预训练 + 微调）③ 输入怎么组织（CLS、SEP、segment embedding）</b>。⇒ 所以<b>这篇 NLP 史上影响最大的论文之一（17 万引用）没有提出任何新的网络结构 —— 它只是把一个已有结构用对了</b>。⇒ 另外「用名字本身当大纲」这个讲法值得学：<b>学完既懂模型也永远记得名字，而名字的顺序往往就是重要性的顺序</b>。"});

  note("⇒ 所以对我来说，ELMo 和 BERT 就只是论文名字 —— 我觉得这挺有意思的",640,362,"d");},"<b>这是这一讲里最轻松的一段，而它顺带说了一件关于学术文化的事。</b><br><b>讲者的话</b>：<b>「<u>而我想你们很多人想到 ELMo 和 BERT 时，第一反应不是这两篇论文 —— 因为它们是《芝麻街》里的角色。而我长大的地方，我并不知道《芝麻街》。所以对我来说，ELMo 和 BERT 就只是论文名字。但对你们来说，它可能首先代表的是别的东西。所以我觉得这挺有意思的</u>。」</b><br><b>★★ 这段八卦是真的，而且这个梗在 2018–2019 年失控过一阵</b>：<b>⇒ <u>ELMo</u>（2018）⇒ <u>BERT</u>（2018）⇒ 然后研究者们开始刻意往这个主题上凑：</b><b>⇒ <u>ERNIE</u>（百度，2019）、<u>Big BIRD</u>（Google，2020）、<u>KERMIT</u>、<u>Grover</u>…… <u>全是《芝麻街》角色</u>。</b><br><b>★★★ 而讲者那句「<u>我长大的地方不知道芝麻街</u>」很诚实，<u>它也提醒了一件事</u></b>：<b>⇒ <u>学术圈的很多「有趣」是文化特定的</u>。</b><b>⇒ 一个美国长大的人看到 BERT 会笑，<u>而一个法国或中国长大的人只看到四个字母</u>。</b><br><b>⇒ 这不影响理解，<u>但知道这些名字的来处，会让你读文献时少一点隔膜感</u>。</b>");

  note("⚠ 比如 ALiBi = Attention with Linear Bias，名字直接把方法说完了",640,362,"r");},"<b>这条观察看着是消遣，其实有实用价值。</b><br><b>讲者的话</b>：<b>「<u>而研究者们，他们普遍挺爱玩的。他们会试着把自己的缩写套进某些主题里。所以如果你去看论文的名字，你会被娱乐到</u>。」</b><br><b>★★★ 而这件事的实用面是：<u>一个好的缩写往往就是方法的摘要</u></b>：<b>⇒ <u>ALiBi</u> = Attention with <u>Li</u>near <u>Bi</u>as —— <u>名字就把方法说完了</u>（30:30 那镜）。</b><b>⇒ <u>RoPE</u> = <u>Ro</u>tary <u>P</u>osition <u>E</u>mbedding —— 同样。</b><b>⇒ <u>BERT</u> = Bidirectional Encoder Representations from Transformers —— <u>这一整段就是在拆这个名字</u>。</b><br><b>★★ 所以读论文时的一个小技巧：<u>先把标题里那个缩写展开</u>。</b><b>⇒ 很多时候展开之后，<u>你已经知道这篇论文在做什么了</u>。</b><br><b>⚠ 反过来也成立：<u>一个展开后什么都没说的缩写（纯粹为了好听），往往意味着作者自己也没能把贡献概括成一句话</u>。</b><br><b>⇒ 这不是什么硬规律，<u>但作为一个快速筛选的启发式，它意外地好用</u>。</b>");
  SUM(0,28,{h:"掩码的确认，与 ELMo 那段八卦",k:"确认型提问：<b>没有掩码时每个 token 就能互相关注？⇒ 对，完全正确；而那个掩码就恰恰是用来「阻止从一个 token 到它后面那些 token 的链接」</b>。然后讲者把 BERT 放进语境：<b>当时 NLP 正在「爆发」，同一年还有另一篇里程碑论文 ELMo = Embeddings from Language Models</b>，<b>基于一个「双向 LSTM」、多层堆叠，能为每个词建双向表示</b>；<b>但它没有 BERT 那么流行 —— 因为有和之前那些模型一样的缺点：因为这个「递推」，它很难 scale</b>。",m:"★★★ 两种「双向」的区别（BERT 论文自己强调的）：<b>ELMo 是「拼接式」—— 跑一个从左到右的 LSTM、再跑一个从右到左的，然后把两个方向的隐状态拼起来；BERT 是「融合式」—— 一个自注意力层里每个 token 同时看左右</b>。⇒ 为什么要紧：<b>ELMo 里每一层内部左向和右向彼此隔离（左向算第 3 个词时不知道右向算出了什么），只在最后拼接时相遇；而 BERT 里第 3 个词的表示在每一层都是左右信息的真正混合</b>。⚠ BERT 论文把前者叫「<b>shallow 双向</b>」、自己叫「<b>deep 双向</b>」—— <b>这正是那个 truly 的技术内容</b>。",w:"★★ 「<b>时机有点不幸</b>」这个评价说的是科研里反复发生的事：<b>ELMo 的核心洞见是对的（词的表示应依赖上下文且双向），而 BERT 得到同一个洞见但用了更好的载体（transformer 而非 LSTM）</b> ⇒ <b>想法被证明是对的，而功劳归给了后来者</b>（ELMo 拿了 2018 NAACL 最佳论文，几个月后被 BERT 盖住）。★★★ 而「难以 scale」是这门课第三次用同一个理由解释历史结果（L1 的 RNN、02:41 的硬件、这里的 ELMo）：<b>LSTM 算第 t 个词必须等 t−1 算完，长度 512 就要串行 512 步；而 transformer 一次矩阵乘法全算完</b> ⇒ <b>不能扩大规模就等于输</b>。",r:"⭐ 小八卦：<b>ELMo 和 BERT 是《芝麻街》里的角色</b>，而讲者说「<b>我长大的地方不知道芝麻街，所以对我它们就只是论文名字</b>」。这个梗在 2018–2019 失控过一阵：<b>ERNIE、Big BIRD、KERMIT、Grover 全是芝麻街角色</b>。⇒ 而他顺手给的那条建议有实用价值：<b>研究者普遍爱玩，会把缩写套进主题 —— 而一个好的缩写往往就是方法的摘要</b>（ALiBi = Attention with Linear Bias、RoPE = Rotary Position Embedding、BERT 这一整段就是在拆名字）⇒ <b>读论文先把标题里的缩写展开，很多时候展开后你已经知道它在做什么</b>；反过来，<b>展开后什么都没说的缩写往往意味着作者自己也没能把贡献概括成一句话</b>。⇒ 另：掩码实现上就是<b>在 softmax 前把那些位置的分数加上 −∞</b>，和位置偏置用的是同一个机制。"});

  note("★ 留意 placeholder（占位）这个词 —— 它本身不含任何文本信息",640,382,"g");},"<b>这是 BERT 最聪明的那个设计，而关键在「占位」这个词。</b><br><b>讲者的话</b>：<b>「<u>所以你首先有 CLS token，它代表 classification。而它基本上是一个占位 token，被放在序列的开头 —— 它接着会在走完整个注意力、然后投影、以及整个 encoder 机制之后，被投影成一个我们可以用来做分类的嵌入</u>。」</b><br><b>★★★ 为什么这个设计聪明：<u>它解决了一个形状上的问题</u></b>：<b>⇒ encoder 的输出是 <u>n 个向量</u>（每个 token 一个）。</b><b>⇒ 而分类任务需要 <u>一个</u> 向量（然后接一个分类头）。</b><b>⇒ <u>怎么从 n 个变成 1 个？</u></b><br><b>★★ 朴素的办法是<u>取平均</u>（mean pooling），但那样每个 token 的权重是固定相等的。</b><b>⇒ 而 CLS 的办法是：<u>加一个本身没有内容的 token，让注意力机制自己决定从哪些 token 吸收多少信息</u>。</b><br><b>⇒ <u>换句话说：怎么汇总这 n 个向量，这件事本身也是学出来的</u>。</b><br><b>⚠ 而「<u>占位、本身不含文本信息</u>」正是它能干这个活的原因：<u>它没有自己的词义偏好，所以它是一块干净的画布</u>。</b>");

  note("⚠ 如果是因果掩码，放在开头的 token 什么都看不到 —— CLS 就废了",640,362,"r");},"<b>这句总结里藏着一个很关键的依赖关系。</b><br><b>讲者的话</b>：<b>「<u>所以 CLS 只是某种占位符，它会携带你整个输入的双向信息</u>。」</b><br><b>★★★ 请想清楚这件事：<u>CLS 放在序列的「开头」，而它要「携带整个输入的信息」</u>。</b><br><b>⇒ <u>这只有在双向注意力下才可能</u>。</b><b>⇒ 如果用的是因果掩码，<u>位置 1 的 token 只能看到位置 1</u> —— 也就是它自己。<u>它什么信息都汇总不了</u>。</b><br><b>★★ 所以 <u>CLS 这个设计和「双向」是绑死的</u>，这两件事不能分开</b>：<b>⇒ <u>双向</u>让「在开头放一个汇总器」变得可行；</b><b>⇒ 而<u>把汇总器放在固定的开头</u>，让提取那个向量变得极其简单（永远取第 0 个位置）。</b><br><b>⇒ <u>两个设计互相成全</u>。</b><br><b>⚠ 顺带：<u>这也解释了为什么 GPT 那类模型做分类时不用「开头的 token」，而是用「最后一个 token」</u>。</b><b>⇒ 因为在因果注意力下，<u>只有最后那个位置看到了全文</u>。</b><b>⇒ <u>同一个需求（汇总全文），不同的结构，答案就反过来了</u>。</b>");

  note("⚠ 而那正是 NSP（下一句预测）这个目标要用的东西",640,362,"r");},"<b>第二个结构性 token，而它的存在本身就透露了 BERT 的训练任务。</b><br><b>讲者的话</b>：<b>「<u>而另一个可能有用去看的 token，是这个 SEP token。所以它就像 separator（分隔符）。而你很快就会看到 —— 我们马上会看它操作的那些目标函数。它的目标是分开两个句子</u>。」</b><br><b>★★★ 「<u>分开两个句子</u>」这几个字透露了一件事：<u>BERT 的输入经常不是一个句子，而是一对</u>。</b><br><b>⇒ 为什么会这样，有两个原因</b>：<b>⇒ ① <u>预训练时</u>：NSP 这个任务就是「判断这两句是不是连着的」（78:25 那镜），<u>所以必须一次喂两句</u>。</b><b>⇒ ② <u>微调时</u>：很多下游任务本身就是「一对输入」—— <u>句子相似度、自然语言推理、问答（问题 + 文档）</u>。</b><br><b>★★ 于是 BERT 的标准输入格式是：<u>[CLS] 句子A [SEP] 句子B [SEP]</u>。</b><b>⇒ 注意<u>末尾也有一个 SEP</u>，它标示输入的结束。</b><br><b>⚠ 而单句任务（比如情感分类）就只有：<u>[CLS] 句子 [SEP]</u>。</b><b>⇒ <u>同一个格式同时覆盖单句和双句任务，这是 BERT 能用一套模型打所有分类任务的原因之一</u>。</b>");
  SUM(0,29,{h:"CLS 和 SEP：两个「结构性」的 token",k:"encoder-only 的目标：<b>做那些「把某个表示投影到某处」的任务，典型就是分类</b>。而 BERT 的工作方式非常特定：<b>有两种 token 在这里是「结构性的」</b>。<b>CLS = classification</b>：一个<b>「占位 token」放在序列开头</b>，走完全部注意力 + 投影 + 整个 encoder 机制之后<b>被投影成一个能用来做分类的嵌入</b> —— 它<b>携带你整个输入的「双向」信息</b>。<b>SEP = separator</b>：目标是<b>分开两个句子</b>。",m:"★★★ CLS 为什么聪明 —— 它解决一个形状问题：<b>encoder 输出 n 个向量，而分类需要 1 个</b>。朴素办法是取平均（每个 token 权重固定相等），<b>而 CLS 的办法是加一个本身没有内容的 token，让注意力机制自己决定从哪些 token 吸收多少 ⇒ 「怎么汇总这 n 个向量」本身也是学出来的</b>。⚠ 而「<b>占位、本身不含文本信息</b>」正是它能干这活的原因：<b>它没有自己的词义偏好，是一块干净的画布</b>。",w:"★★★ 一个关键依赖：<b>CLS 放在「开头」却要携带整个输入的信息 —— 这只有在双向注意力下才可能</b>（因果掩码下位置 1 只能看到它自己，什么都汇总不了）⇒ <b>CLS 和「双向」是绑死的，两个设计互相成全</b>（双向让「开头放汇总器」可行，而固定在开头让提取那个向量极其简单 —— 永远取第 0 个位置）。⚠ 这也解释了<b>为什么 GPT 那类模型做分类用「最后一个 token」而不是开头</b> —— 因果注意力下只有最后那个位置看到了全文。<b>同一个需求、不同结构，答案就反过来了</b>。",r:"⚠ 「结构性 token」这个概念在今天的 LLM 里用得更多：<b>你和聊天模型对话时，背后输入里塞满了 ⟨|im_start|⟩、⟨|im_end|⟩、system、user、assistant 这类标记</b> —— 它们和你打的字一样进入模型，<b>但作用是「告诉模型这段是谁说的、到哪结束」</b>。⇒ <b>BERT 的 CLS 和 SEP 是这整套做法的起点</b>。⇒ 而「分开两个句子」透露了 <b>BERT 的输入经常是一对句子</b>：预训练时 NSP 要判断两句是否相连，微调时很多任务本身就是一对（句子相似度、自然语言推理、问答）。标准格式：<b>[CLS] 句子A [SEP] 句子B [SEP]</b>，单句任务就是 <b>[CLS] 句子 [SEP]</b> —— <b>同一格式覆盖单句和双句，这是 BERT 能用一套模型打所有分类任务的原因之一</b>。"});
  QUIZ(0,29,{t:"CLS 这个设计为什么必须依赖「双向」注意力？",o:["CLS 放在开头却要汇总整个输入 —— 而因果掩码下位置 1 只能看到它自己，什么都汇总不了","因为 SEP 必须在双向下才起作用","因为分类头需要双向梯度","因为双向的参数更多"],a:0,w:"⇒ 这也解释了为什么 GPT 那类模型做分类用「最后一个 token」—— 因果注意力下只有最后那个位置看到了全文。同一个需求、不同结构，答案反过来了。"});
});

KP("31 · 一个好提问：NSP 不是 decoder 的活吗？",function(){

  note("★★ 这个怀疑很合理 —— 名字里有 prediction，而且带着「下一个」",640,324,"g");
  note("⚠ 讲者的回应：其实我马上就要详细讲这个",640,362,"d");},"<b>这个提问很敏锐，而它被名字误导了 —— 但那个误导本身值得分析。</b><br><b>学生的问题</b>：<b><u>这里还是只有一个 encoder 吗？因为「下一句预测」可以被看成是一个 decoder 的任务。</u></b><br><b>★★★ 为什么这个怀疑很合理，有两层</b>：<b>⇒ ① 名字里有 <u>prediction（预测）</u>，而预测听起来像生成。</b><b>⇒ ② 名字里有 <u>Next（下一个）</u>，而「下一个」在这门课里一直和 <u>next token prediction</u>（自回归生成）绑在一起。</b><br><b>★★ 所以一个很自然的读法是：<u>NSP = 给第一句，生成第二句</u>。</b><b>⇒ 而那确实需要 decoder。</b><br><b>⚠ 但那不是 NSP 做的事（下一镜揭晓）。</b><br><b>★ 这是一个很好的例子，说明<u>术语的命名会误导理解</u></b>：<b>⇒ <u>Next Sentence Prediction</u> 这个名字，如果叫 <u>Sentence Pair Classification</u>（句对分类），<u>学生根本不会有这个疑问</u>。</b><b>⇒ 而它的实际内容就是后者。</b><br><b>⇒ <u>所以读论文时，别太信名字 —— 去看它的输入和输出是什么</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,200,["我们把「两个句子」一前一后放进去","然后预测它们「是不是真的连续」","⇒ 所以它是一个「分类任务」"],560,32,8);
  note("⇒ 讲者说得很干脆：so it is a classification task",640,328,"y");
  note("★★ 输出不是文本，是一个「是 / 不是」",640,356,"g");
  note("⚠ 而一个二分类任务，encoder + 一个分类头就够了",640,386,"r");},"<b>答案很干脆，而它把那个误导彻底消除了。</b><br><b>讲者的话</b>：<b>「<u>所以实际上我要详细讲一下。下一句预测这个任务，实际上是我们把两个句子一前一后放进去，然后预测它们是不是真的连续的。所以它是一个分类任务</u>。」</b><br><b>★★★ 把输入输出写清楚，疑问就消失了</b>：<b>⇒ <u>输入</u>：<u>[CLS] 句子A [SEP] 句子B [SEP]</u> —— 两个句子<u>都已经给了</u>。</b><b>⇒ <u>输出</u>：<u>一个二分类标签</u>（IsNext / NotNext）。</b><br><b>★★ 所以它<u>什么都不生成</u>。</b><b>⇒ 它只是在 CLS 的输出嵌入上接一个二分类头，<u>和情感分类的结构完全一样</u>。</b><br><b>⇒ <u>于是不需要 decoder</u>。encoder + 一个分类头就够了。</b><br><b>⚠ 而名字里的「<u>Next</u>」说的不是「要生成下一句」，而是「<u>要判断它是不是下一句</u>」。</b><b>⇒ <u>一个字的差别（generate vs judge），决定了需不需要半个模型</u>。</b><br><b>★ 顺带：<u>这个任务的训练数据是白拿的</u>。<u>你从语料里取相邻两句标 IsNext，随机取两句标 NotNext</u> —— <u>一条标注都不用人工做</u>。</b>");

  note("★ 所以接下来的顺序是：先讲优劣，再回来讲 MLM 和 NSP 的细节",640,324,"g");
  note("⚠ 这个顺序其实挺好 —— 先知道这套做法值不值，再看它怎么做",640,362,"d");},"<b>这一镜是过渡，但讲者选的顺序值得说一句。</b><br><b>他的话</b>：<b>「<u>对，很好的点。而我们很快就会详细看到那个。所以在我们详细看那个之前，我要先讨论一下这个方法通常有的好处和坏处</u>。」</b><br><b>★★ 他选的顺序是：<u>① 范式的优劣 ⇒ ② 架构的细节 ⇒ ③ MLM 和 NSP 的具体做法</u>。</b><br><b>★★★ 而「<u>先讲优劣</u>」这个顺序比「先讲细节」好，理由是实在的</b>：<b>⇒ 如果你先学了 MLM 的 80/10/10 规则、segment embedding 的细节，<u>然后才知道「哦这套方法原来不能生成」</u> —— <u>那些细节对你来说就是无根的</u>。</b><b>⇒ 而<u>先知道这套做法能干什么、不能干什么、代价是什么</u>，后面每一个细节你都能挂上去。</b><br><b>★★ 这是一个通用的学习顺序建议：<u>学任何一个方法，先问「它适用于什么、它的代价是什么」，再问「它怎么实现」</u>。</b><b>⇒ <u>前者决定了你会不会用它，后者只决定你会不会写它</u>。</b><b>⇒ 而前者的价值在实践中大得多。</b>");
  SUM(0,31,{h:"NSP 不是 decoder 的活",k:"一个敏锐的提问：<b>这里还是只有一个 encoder 吗？因为「下一句预测」看起来像是一个 decoder 的任务</b>。⇒ 答：<b>NSP 实际上是我们把两个句子一前一后放进去，然后预测它们是不是真的连续 —— 所以它是一个「分类任务」</b>。",m:"★★★ 把输入输出写清楚疑问就消失了：<b>输入是 [CLS] 句子A [SEP] 句子B [SEP]（两个句子都已经给了），输出是一个二分类标签（IsNext / NotNext）</b> ⇒ <b>它什么都不生成</b>，只是在 CLS 的输出嵌入上接一个二分类头，<b>和情感分类的结构完全一样 ⇒ 不需要 decoder</b>。⚠ 名字里的「<b>Next</b>」说的不是「要生成下一句」，而是「<b>要判断它是不是下一句</b>」—— <b>一个字的差别（generate vs judge）决定了需不需要半个模型</b>。",w:"★ 这个怀疑之所以合理有两层：<b>① 名字里有 prediction，而预测听起来像生成；② 名字里有 Next，而「下一个」在这门课里一直和 next token prediction（自回归生成）绑在一起</b>。⇒ 很好的例子说明<b>术语的命名会误导理解</b>：如果它叫 <b>Sentence Pair Classification（句对分类）</b>，学生根本不会有这个疑问 —— <b>而它的实际内容就是后者</b>。⇒ 所以<b>读论文别太信名字，去看它的输入和输出是什么</b>。",r:"⇒ 顺带：<b>NSP 的训练数据是白拿的</b> —— 从语料里取相邻两句标 IsNext、随机取两句标 NotNext，<b>一条标注都不用人工做</b>。★★ 而讲者接下来选的顺序值得说：<b>① 范式的优劣 ⇒ ② 架构的细节 ⇒ ③ MLM 和 NSP 的具体做法</b>。「先讲优劣」比「先讲细节」好的理由很实在：<b>如果你先学了 MLM 的 80/10/10、segment embedding 的细节，然后才知道「哦原来这套不能生成」，那些细节对你就是无根的</b>。⇒ 通用建议：<b>学任何方法先问「它适用于什么、代价是什么」，再问「怎么实现」—— 前者决定你会不会用它，后者只决定你会不会写它</b>。"});
  QUIZ(0,31,{t:"NSP（下一句预测）为什么不需要 decoder？",o:["因为 encoder 也能自回归生成","因为它在预训练阶段不反向传播","因为它只用第一句","两个句子都已经给了，输出只是一个「是不是连续」的二分类标签 —— 它什么都不生成"],a:3,w:"⚠ 名字误导了：如果它叫 Sentence Pair Classification，根本不会有这个疑问。⇒ 读论文别太信名字，去看输入和输出。"});
});
KP("32 · 这套「预训练 + 微调」的好处与坏处",function(){

  note("⚠ 而这正是整个预训练范式成立的基础",640,362,"r");},"<b>这是好处里最根本的那一条，而它的论证方式值得体会。</b><br><b>讲者的话</b>：<b>「<u>那么在好处这一面：这个预训练机制可以在相当没有标注的数据上做。所以你仍然有这个下一句预测的任务，但这是某个你控制的东西，因为你知道哪些句子是彼此相接的。所以它是某个你知道它是自监督的东西</u>。」</b><br><b>★★★ 「<u>因为你知道哪些句子是彼此相接的</u>」—— 这就是自监督的全部诀窍</b>：<b>⇒ 你拿到的是一段<u>没有任何标注</u>的文本。</b><b>⇒ 但这段文本<u>自带结构</u>：句子有顺序、词有位置。</b><b>⇒ <u>而你可以把这个结构「藏起来一部分」，然后让模型把它猜回来</u>。</b><br><b>★★ 于是标签是免费的：<u>它不是人标的，是从数据本身的结构里抽出来的</u>。</b><b>⇒ 相邻两句 ⇒ 标签 IsNext。随机两句 ⇒ 标签 NotNext。<u>一行人工都没有</u>。</b><br><b>⇒ <u>这就是「自监督（self-supervised）」这个词的意思：监督信号来自数据自己</u>。</b><br><b>⚠ 而这是整个现代 AI 的地基，不只是 BERT：<u>GPT 的 next-word prediction 是自监督，图像的对比学习是自监督，掩码自编码也是</u>。</b><b>⇒ <u>因为只有自监督能用上「全部的数据」，而标注永远只能覆盖很小一块</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 注意他用了两个词：self-supervised（NSP）和 unsupervised（MLM）",640,362,"r");},"<b>这一镜把 MLM 也归进来，而讲者用词上有一个小小的不一致值得指出。</b><br><b>他的话</b>：<b>「<u>而掩码语言模型这个任务 —— 我们会看它是怎么构成的 —— 但它也是某种无监督的东西。所以这是一个从未标注数据里学到有意思嵌入的非常有趣的方式。而实践中我们看到，这些未标注的数据确实导向了有用的表示被学到</u>。」</b><br><b>★★ 用词上的小不一致：<u>他把 NSP 叫 self-supervised（自监督），把 MLM 叫 unsupervised（无监督）</u>。</b><br><b>⇒ 按今天通用的说法，<u>两个都是自监督</u>。</b><b>⇒ <u>无监督</u>一般指「完全没有预测目标」的方法（聚类、降维、密度估计）；<u>而 MLM 明明有一个预测目标（被遮住的那个词）</u>。</b><br><b>★★★ 不过这个用词混用在 2018–2020 年非常普遍，<u>而讲者的实质判断是对的</u>：<u>两者都不需要人工标注</u>。</b><br><b>⇒ 所以不必在术语上纠结，<u>但知道这个区别能让你读文献时不被绕晕</u>。</b><br><b>★ 而他那句实证补充很重要：「<u>实践中我们看到这些未标注数据确实导向了有用的表示</u>」。</b><b>⇒ <u>这件事在 2018 年之前是存疑的</u>。<u>「在无关的任务上训练能帮上忙」听起来不太可信，而 BERT 把它证实了</u>。</b>");

  note("⚠ 当时它是「设计选择」，这里它是「坏处」—— 同一件事的两种说法",640,362,"d");},"<b>第一个坏处，而它和十三分钟前那句话恰好是同一件事的两面。</b><br><b>讲者的话</b>：<b>「<u>然后关于坏处 —— 我们当然有所有那些文本生成任务是够不着的，因为我们没有 decoder</u>。」</b><br><b>★★★ 回想 <u>68:07</u> 那一镜：学生说「你这样没法做生成」，讲者答「<u>是的，那正是重点</u>」。</b><br><b>⇒ 而现在同一件事被列为<u>坏处</u>。</b><b>⇒ <u>这不矛盾</u> —— 它取决于你站在哪里看：</b><b>⇒ <u>如果你的任务是分类</u>：不能生成是「省掉了无用的一半」⇒ <u>优点</u>。</b><b>⇒ <u>如果你想要一个通用模型</u>：不能生成是「永远只能做一类事」⇒ <u>缺点</u>。</b><br><b>★★ 而历史选了后一个视角，<u>这正是 BERT 这条路最终被边缘化的根本原因</u></b>：<b>⇒ 2018 年大家要的是「<u>把每个 NLP 任务都做好</u>」⇒ BERT 完美。</b><b>⇒ 2023 年大家要的是「<u>一个能对话、能写代码、能推理的东西</u>」⇒ <u>BERT 做不到，而且永远做不到</u>。</b><br><b>⇒ <u>需求变了，而一个结构性的限制没法靠改进来绕过</u>。</b>");
