  note("⇒ 讲者接着说：我这里有一些变体的名字，待会儿会深入其中两个",640,362,"d");},"<b>第二个坏处常被忽略，但它在实践中很真实。</b><br><b>讲者的话</b>：<b>「<u>而且我们也可以把这个两阶段的流程、以及「我们需要进一步去调那些嵌入」这件事，看成是某种需要被跨过去的障碍。所以当你把这种方法论和那些更传统的、可以一次搞定的方法相比时 —— 这可能可以被看成一个缺点</u>。」</b><br><b>★★ 「<u>一次搞定（one shot）</u>」指的是传统做法：<u>拿到数据，训一个模型，完事</u>。</b><br><b>★★★ 而两阶段带来的实际麻烦有几样，<u>它们都不是学术问题而是工程问题</u></b>：<b>⇒ ① <u>你得先搞到一个预训练模型</u>。自己训要几百张 GPU 几周 —— <u>所以你实际上依赖别人发布的权重</u>。</b><b>⇒ ② <u>微调本身也要调参</u>：学习率、冻不冻结、训几轮。<u>调坏了会「灾难性遗忘」</u>。</b><b>⇒ ③ <u>两个阶段的数据分布不一致时，效果会打折</u>（比如用通用语料预训练、拿去做医学文本）。</b><br><b>★★ 不过历史给了这条「坏处」一个有意思的回应：<u>今天这个门槛反而更高了（预训练一个 LLM 要上千万美元），但它被彻底外部化了</u>。</b><b>⇒ <u>你不再自己预训练，你调 API 或者下载权重 —— 于是那道门槛对使用者消失了</u>。</b>");
  SUM(0,32,{h:"这套「预训练 + 微调」的好处与坏处",k:"<b>好处</b>：① <b>预训练机制可以在「相当没有标注」的数据上做</b> —— <b>NSP 是「你控制的」，因为你知道哪些句子彼此相接 ⇒ 它是自监督的</b>；而 <b>MLM 也是无监督的 ⇒ 这是从未标注数据里学到有意思嵌入的一个非常有趣的方式</b>，且<b>实践中这些未标注数据确实导向了有用的表示</b>。② <b>你只需要很少的数据就能在它上面搭东西 —— 微调时从那些非常好的嵌入出发、只有少量几个权重要调，而这通常导向超过当时 SOTA 的性能</b>。<b>坏处</b>：① <b>所有文本生成任务都够不着，因为没有 decoder</b>；② <b>两阶段流程、以及还要进一步调嵌入这件事，可被看成一道要跨过去的障碍</b>（和「一次搞定」的传统方法相比）。",m:"★★★ 「<b>因为你知道哪些句子是彼此相接的</b>」就是自监督的全部诀窍：<b>文本自带结构（句子有顺序、词有位置），而你可以把这个结构藏起来一部分、让模型猜回来 ⇒ 标签不是人标的，是从数据本身的结构里抽出来的</b>。⇒ 这是整个现代 AI 的地基，不只是 BERT（GPT 的 next-word、图像的对比学习、掩码自编码都是）—— <b>因为只有自监督能用上「全部的数据」，而标注永远只覆盖很小一块</b>。",w:"★★★ 把两个好处拼成一句话就是 BERT 的价值主张：<b>用海量无标注数据学通用能力（便宜、量大）＋ 用少量标注数据学具体任务（贵、量小）⇒ 超过那些「只用标注数据从头训」的方法</b>。配上数字才有体感：<b>1.1 亿参数的主干 + 1536 个参数的分类头 ⇒ 几千条标注就够训那 1536 个，而从头训 1.1 亿需要几百万条</b>。⚠ 用词上的小不一致：<b>他把 NSP 叫 self-supervised、MLM 叫 unsupervised，而按今天的说法两个都是自监督</b>（无监督一般指「完全没有预测目标」的方法）—— 这个混用在 2018–2020 很普遍，实质判断是对的。",r:"★★★ 坏处一和 68:07 那句「<b>是的，那正是重点</b>」恰好是同一件事的两面，<b>不矛盾，取决于你站哪里看</b>：<b>任务是分类 ⇒ 不能生成是「省掉了无用的一半」（优点）；想要通用模型 ⇒ 不能生成是「永远只能做一类事」（缺点）</b>。⇒ 而历史选了后一个视角，<b>这正是 BERT 这条路被边缘化的根本原因</b>：2018 年大家要「把每个 NLP 任务都做好」⇒ BERT 完美；2023 年要「一个能对话、能写代码、能推理的东西」⇒ <b>BERT 做不到而且永远做不到 —— 需求变了，而结构性限制没法靠改进绕过</b>。⇒ 坏处二的实际麻烦都是工程问题：<b>① 你得先搞到一个预训练模型（所以实际依赖别人发布的权重）② 微调本身要调参，调坏了会灾难性遗忘 ③ 两阶段数据分布不一致时效果打折</b>。而历史的回应很有意思：<b>今天这道门槛更高了（预训练 LLM 要上千万美元），但它被彻底外部化了 —— 你调 API 或下载权重，于是门槛对使用者消失了</b>。"});

  SUM(0,33,{h:"BERT 的改动清单，与 WordPiece",k:"讲者的讲法：<b>从原始 transformer「一步一步」走到 BERT</b>。改动清单一共三项：<b>① 把 encoder 部分抽出来 ② 接上那些新的目标函数（MLM + NSP）③ 外加一套「表示 token」的新技巧</b>。第三项之一：<b>WordPiece —— 一个「在你的训练集上学习」的 tokenizer，基于「最大化似然」的合并规则，把原子 token 合并起来搭出你的目标词表</b>。词表量级：<b>BERT 约 3 万；这类论文一般在 10⁴–10⁵；唯一例外是免 token 的方法（ByT5 的 2⁸ = 256）</b>。",m:"★★★ 三项改动的性质完全不同：<b>① 抽出 encoder = 架构上的删减（唯一动了网络结构的一项，而它只是「删掉一半」）② 新目标函数 = 训练方式的改动（网络没变，变的是损失）③ 新技巧 = 输入格式的改动</b>。⇒ 第三项其实有三样：<b>WordPiece、CLS/SEP、segment encoding</b>，而<b>只有 segment encoding 是 BERT 原创的</b>（WordPiece 之前就有，特殊 token 的思路也不新鲜）。",w:"★★★ 「<b>最大化似然的合并规则</b>」是 WordPiece 和 BPE 的分界：<b>BPE（GPT 那边）每步合并「出现频率最高」的那一对；WordPiece 每步合并「能让语言模型似然提升最多」的那一对</b> ⇒ 区别是 <b>BPE 只看「这一对一起出现多少次」，WordPiece 还看「它们单独出现的频率」</b> —— 所以 A、B 都很常见但只是偶然挨在一起时，<b>BPE 可能合并而 WordPiece 不会</b>。⚠ 实践中差别不大，但知道它能帮你读懂不同模型的 tokenizer 配置。",r:"★★ 这个量级能让你快速估算「词表侧」参数量（<b>嵌入矩阵 = 词表大小 × d_model</b>）：<b>BERT base 是 30000 × 768 ≈ 2300 万，而总共 1.1 亿 ⇒ 词表嵌入占约 21%</b>。★★★ 而对今天的大模型这个比例反过来了：<b>Llama 3 词表 128256（比 BERT 大四倍，为多语言和代码）、d_model 4096 ⇒ 嵌入约 5.2 亿，但模型总共 80 亿 ⇒ 词表只占 6.5%</b> ⇒ <b>模型越大，「词表要不要省」就越不重要</b> —— 这也是今天敢把词表开到十几万的原因。⇒ 另：「改动清单」这个讲法值得搬去读论文 —— <b>读一篇「在 X 基础上改进」的论文，第一件事是列出它改了哪几处</b>，多数时候那个清单短得出人意料。"});

  SUM(0,38,{h:"NSP 的做法，与论文记号和量级",k:"<b>NSP</b>：<b>从语料选两个句子，50% 的时候按原顺序并排放、另一部分按随机顺序；目标是让 CLS 之上的某个分类头判断 A 和 B 是不是连续的 —— 「这就是它做的全部」</b>，而「<b>假设</b>是它也有助于学到有用的嵌入」。<b>记号对照</b>（BERT 论文换了套字母）：<b>L = 原来的 n（层数）、H = 原来的 d_model（嵌入维度）、A = 原来的小 h（头数）</b>。<b>量级</b>：<b>原始 transformer 有 12 个堆叠的 encoder/decoder；参数量级 1 亿</b>。",m:"★★★ 问题恰恰在于 NSP <b>太</b>简单（这是 RoBERTa 后来指出的）：<b>随机配的两个句子往往来自完全不同的文档、讲完全不同的主题 ⇒ 模型只要判断「这两句主题一致吗」就能做对，根本不需要理解「顺序」或「连贯性」</b> ⇒ <b>一个能靠浅层特征解决的任务，提供的学习压力很小</b>。这就是「假设」这个词第四次出现的原因（78:25、78:58、86:26、这里）。",w:"⚠ 记号对照表很实用，因为<b>同一个字母在两篇论文里意思不同</b>：<b>transformer 论文里 h 是头数，BERT 论文里 H 是嵌入维度（头数叫 A）</b> ⇒ 看到 <b>H = 768</b> 那是维度、<b>h = 12</b> 那是头数，<b>大小写差一点意思完全不同</b>。⇒ BERT 的两个配置值得记：<b>base（L=12, H=768, A=12）1.1 亿参数；large（L=24, H=1024, A=16）3.4 亿参数</b>，而 <b>base 的规模是为了和 GPT-1 可比而选的</b>（要论证「双向比单向好」就得让两边规模一样，否则比的是规模不是架构）。",r:"⭐ 读论文建议（这一讲第二次）：<b>BERT 这篇「读起来非常好」，和《Attention is All You Need》并列的里程碑，17 万引用</b>。★★★ 对照 Afshine 说 transformer 那篇「<b>非常密、只有几页长</b>」—— 差别是真实的：<b>Attention is All You Need 要在 9 页里提出一整个新架构，每句压缩到极限；而 BERT 是在已有架构上改，所以有篇幅解释动机、做消融、讨论对比</b> ⇒ <b>只读一篇的话先读 BERT</b>。⇒ 实用小知识：<b>cased / uncased 表示对数据做了什么预处理</b> —— <b>NER 必须用 cased</b>（Apple 和 apple 是公司和水果的关键线索），<b>情感分类 uncased 更好</b>（THIS IS AMAZING 和 this is amazing 意思一样），而 uncased 还顺带<b>提高词表利用率</b>。⚠ 这类「选哪个预训练版本」的决定<b>在实践中对效果的影响常常比调参更大</b>。⇒ 量级放到今天小得惊人（GPT-3 是 BERT large 的 500 倍），<b>但 BERT base 至今仍被大量使用 —— 1.1 亿参数能在普通显卡上跑、延迟毫秒级，对一个情感分类服务这比「更聪明」要紧得多</b>。"});
  QUIZ(0,38,{t:"RoBERTa 后来指出 NSP 的问题在哪？",o:["它太简单：随机配的两句往往来自不同文档/主题 ⇒ 只要判断「主题一致吗」就能做对，不需要理解顺序或连贯性","它需要额外的标注","它和 MLM 的梯度冲突","它的正负样本比例不对"],a:0,w:"⚠ 记号别混：transformer 论文里 h 是头数，BERT 论文里 H 是嵌入维度（头数叫 A）。BERT base 是 L=12, H=768, A=12，1.1 亿参数。"});

  note("⇒ 所以你有某个长度的隐藏层 ⇒ 典型地两个矩阵：一个投到隐藏层、一个从隐藏层到输出",640,364,"d");},"<b>这个提问问的是那个分类头的内部结构，而答案把形状说清楚了。</b><br><b>学生的问题</b>：<b><u>这个 FFN 对应的是什么？</u></b><br><b>讲者的回答</b>：<b>「<u>所以基本上你有一个「输出嵌入的维度」和「你感兴趣的那个任务」之间的映射。所以它可能是分成正面或者负面这样的分类。所以你有某个长度的隐藏层。所以你典型地有两个矩阵，来学从一个到那个隐藏层、然后从隐藏层到输出的投影。然后你学这些权重，来基于它在这里学到的那些嵌入去做那个分类任务</u>。」</b><br><b>★★ 所以这个分类头不一定只是一层线性，<u>它可以是「两层 + 一个隐藏层」</u></b>：<b>⇒ <u>768 → 隐藏层 → 2</u>。</b><b>⇒ 两个矩阵，中间一个非线性激活。</b><br><b>★★★ 注意这和 79:29 那镜说的「<u>典型是一个线性投影</u>」有一点出入，<u>而两者都对</u></b>：<b>⇒ <u>最简单的做法是一层线性</u>（768 × 类别数）。</b><b>⇒ 而<u>实际的 BERT 实现（以及 Hugging Face 的默认）在 CLS 上先过一个「pooler」</u>：<u>768 → 768 的线性层 + tanh</u>，<u>然后才是分类层</u>。</b><br><b>⇒ <u>所以确实是两个矩阵，讲者说的是对的</u>。</b><b>⚠ 而这个 pooler 是在预训练时（为 NSP）就训好的，<u>微调时继续用</u>。</b>");
  SUM(0,40,{h:"⭐ teddy bear 端到端走查（上）",k:"例句第三次登场：<b>this teddy bear is so cute</b>。走查步骤：<b>① uncased 设置下预处理 —— 全部变小写，然后施加 WordPiece ② 开头加 [CLS]、加 [SEP] ③ 还有 PAD token 把序列填满到末尾（因为按 batch 训练，而 batch 是固定长度的矩阵）④ 三样嵌入叠起来：词嵌入（索引↔表示的巨大查表）＋ 位置嵌入 ＋ 新的 segment 嵌入 ⑤ 过整个 encoder 架构 ⑥ 对情感抽取：不在乎非 CLS 的输出嵌入，只取 CLS 的输出嵌入、在那里插一个线性层</b>。",m:"★★★ 讲者在 97:02 做了一次<b>重要的自我更正</b>：「现在你有某个位置感知的、以及上下文感知的 —— <b>所以还不是上下文感知的，但这里是 segment 感知的</b>」。⇒ 把这个区别钉死：<b>进 encoder 之前每个位置的向量知道「我是什么词、我在第几位、我属于哪一句」，但不知道「我周围有什么词」</b>；<b>「上下文感知」是自注意力的产物，不是输入嵌入的性质</b> —— 过了 12 层之后每个位置的向量才是整句话的一个函数。⇒ 这是 L1 那条线的回声：<b>word2vec 的嵌入是静态的（一个词永远一个向量），transformer 的输出是上下文相关的</b>。",w:"★★★ <b>PAD 和 CLS、SEP 有本质区别</b>：<b>CLS 和 SEP 携带功能（汇总器、分隔符），模型要学会用它们；而 PAD 什么都不携带，它存在的唯一理由是让 batch 里长短不同的句子能拼成矩形张量</b> ⇒ 正因如此<b>你必须让模型忽略它</b>：做法是 <b>attention mask —— softmax 之前把 PAD 位置的分数设成 −∞</b>。⚠ 实践中很常见的 bug：<b>忘记传 attention mask</b> —— 模型把 PAD 当真实词去关注，句子越短污染越严重，<b>而这个 bug 不会报错，只会让效果莫名其妙地差</b>。",r:"★★ 一个有意思的推论：<b>对单句任务（像这个例句），全部 token 都用 segment A，而 segment 嵌入就是「加在所有位置上的同一个常数向量」—— 它不改变任何两个 token 之间的差异，所以对注意力几乎没有影响</b> ⇒ <b>在单句任务上 segment 嵌入基本是个摆设</b>，它只在双句任务里真正起作用（这也解释了 RoBERTa 删掉 NSP 后很多人连 segment 嵌入也一起简化掉）。⇒ WordPiece 的记号值得知道：<b>teddy 不在词表时被切成 ted + ##dy，而 ## 表示「这一片接在前一片后面、中间没有空格」</b> —— 没有这个标记就<b>没法从 token 序列无损还原原文</b>；<b>BPE（GPT 那边）用相反的约定：Ġ 或空格字符标记「词首」</b>。⇒ 那个 FFN：<b>输出嵌入维度和你的任务之间的映射，典型是两个矩阵（到隐藏层、隐藏层到输出）</b> —— 而实际 BERT 实现在 CLS 上先过一个 <b>pooler（768→768 线性 + tanh，预训练时为 NSP 训好的）</b>，然后才是分类层。"});
  QUIZ(0,40,{t:"进 encoder 之前，BERT 的输入嵌入「不知道」什么？",o:["不知道自己属于哪一句","不知道「我周围有什么词」—— 上下文感知是自注意力的产物，不是输入嵌入的性质","不知道自己在第几个位置","不知道自己是什么词"],a:1,w:"★★★ 讲者当场自我更正了这一点（「所以还不是上下文感知的，但这里是 segment 感知的」）—— 它确实是入门时最常被混淆的一点。"});
});

  note("⚠ 关键词：mixed（混进去了）—— 信息没有被丢掉，它被搬家了",640,386,"r");},"<b>这是真正的答案，而关键词是「混进去了」。</b><br><b>讲者的话</b>：<b>「<u>而这个 token 的魔法在于：encoder 里那些自注意力机制已经把每一个别的 token 的表示混进了那个表示里，使得那些输出嵌入是上下文感知的。所以基本上，它是一个面向分类的嵌入。而这就是我们说会插进那个线性层的东西</u>。」</b><br><b>★★★ 「<u>混进去了（mixed）</u>」这个词把那个「浪费」的疑虑彻底解掉了</b>：<b>⇒ 你丢掉的不是<u>信息</u>，而是<u>信息的其它副本</u>。</b><br><b>★★ 把 CLS 走过的路数一遍，这个「混」才具体</b>：<b>⇒ <u>第 1 层</u>：CLS 对全部 n 个 token 做注意力 ⇒ 它的向量成了 n 个输入嵌入的加权和。</b><b>⇒ <u>第 2 层</u>：CLS 再对全部 token 做注意力，<u>而那些 token 的表示本身已经是第 1 层混合过的</u>。</b><b>⇒ ⋯⋯ <u>第 12 层</u>：CLS 的向量是整句话的一个<u>十二重嵌套的</u>非线性函数。</b><br><b>⇒ <u>所以 CLS 的那 768 个数，确实「见过」每一个 token，而且见过很多次</u>。</b><br><b>⚠ 而「<u>面向分类的（geared towards classification）</u>」这个说法也值得留意：<u>CLS 的表示不是通用的，它是被 NSP 训出来的「适合做句子级分类」的那种表示</u>。</b>");

  SUM(0,41,{h:"⭐⭐ 为什么能把其它输出嵌入全丢掉",k:"讲者：<b>这就是我一直在等的那个问题</b>。答：<b>我们这里不需要它们 —— 我们在做分类，而「在某个 token（比如 CLS）之上操作」是我们定的一个「约定」</b>。而这个 token 的<b>魔法</b>在于：<b>encoder 里那些自注意力机制已经把「每一个别的 token 的表示」混进了那个表示里，使得输出嵌入是「上下文感知的」⇒ 它基本上是一个「面向分类」的嵌入</b>。⚠ 补丁：<b>「扔掉其它嵌入」只是分类这个情形下做的事 —— 如果在 token 层面做分类，它们每一个都可能被用到</b>。",m:"★★★ 「<b>混进去了（mixed）</b>」这个词把「浪费」的疑虑彻底解掉：<b>你丢掉的不是信息，而是信息的其它副本</b>。⇒ 把 CLS 走过的路数一遍：<b>第 1 层 CLS 对全部 n 个 token 做注意力 ⇒ 它的向量成了 n 个输入嵌入的加权和；第 2 层再做一次，而那些 token 的表示本身已经被第 1 层混合过；⋯⋯第 12 层 CLS 的向量是整句话的一个十二重嵌套的非线性函数</b> ⇒ <b>CLS 那 768 个数确实「见过」每一个 token，而且见过很多次</b>。",w:"★★ 「<b>约定</b>」这个词承认了这<b>不是唯一做法</b>：你也可以 mean pooling、max pooling、或用最后一个 token（GPT 那边就是）。⇒ 而这几种效果差距不大，<b>这本身说明信息在 12 层之后已高度混合 —— 从哪个位置读都能读到整句信息</b>（有研究发现句子相似度任务上 <b>mean pooling 实际比 CLS 更好</b>）。⇒ <b>CLS 不是「正确答案」而是「BERT 选的答案」—— 它有效是因为预训练时 NSP 就在 CLS 上做，这个位置被专门训练过</b>。",r:"★★★ 这个补丁揭示了 BERT 架构真正的通用性：<b>同一个预训练模型、同一套权重，接不同的头就能做两类完全不同形状的任务 —— 句子级取 1 个向量、token 级取 n 个向量</b>，而 <b>encoder 本身完全不知道你要做哪一类，它只负责把每个位置都编码好</b>。⇒ 这是「通用表示」的具体含义：<b>不是「一个向量能干所有事」，而是「一组向量，让你按需取用」</b>。⇒ 问答的形状：<b>两个 FFN（起始头、结束头）各 768×1，施加到每个嵌入上 ⇒ n 个起始分数、n 个结束分数，取 argmax（约束 start ≤ end）</b> —— <b>加 1536 个参数就会做抽取式问答</b>。⚠ 经典缺陷：<b>没有「无答案」选项</b>，文档里没答案时模型还是会划一段（SQuAD 2.0 专门加了无答案样本，通常让 CLS 代表「没有答案」）。"});

  SUM(0,43,{h:"BERT 的好处与三个局限",k:"<b>好处</b>：<b>你有的是「上下文的（contextual）」嵌入</b> —— 基于这些学到的嵌入，<b>学任何你想要的分类任务都非常容易</b>，这个灵活性在当时被大大赞赏；而<b>它在工业界被广泛使用 —— 任何涉及情感检测或其它分类任务的事，今天用一个「BERT 类」模型非常常见</b>。<b>三个局限</b>：<b>① 上下文长度只有 512 ② 延迟可能被看成高（BERT base 还有 1.1 亿参数，相当多）—— 有办法更小更快吗？③ MLM 和 NSP 这两个目标函数真的都有帮助吗？能简化预训练吗？</b>",m:"★★★ 「<b>上下文的</b>」是对 L1 那条线的最终回答：<b>word2vec 一个词永远一个向量（「bank」在 river bank 和 bank account 里相同），而 BERT 里一个词的向量取决于它出现在哪句话 ⇒ 两个 bank 得到两个不同向量</b> —— 这就是从「词嵌入」到「上下文嵌入」那一步，它解决的是<b>一词多义</b>。⇒ 讲者把 ELMo 并列提出来是对的：<b>contextual embedding 这个概念确实是 ELMo 先提的</b>（论文标题就是 Deep contextualized word representations），BERT 做得更好但首创不在它。",w:"★★★ 为什么 LLM 时代 BERT 没过时，理由非常实在：<b>成本（1.1 亿参数在便宜显卡上几千条每秒，让 LLM 做同样分类成本高几个数量级）、延迟（BERT 一次前向毫秒级，LLM 逐 token 生成是秒级）、确定性（BERT 输出概率分布、稳定可复现，LLM 要解析文本而且可能不按格式回答）</b>。⇒ 今天一个常见的工程选择：<b>用 LLM 标注数据，然后蒸馏一个 BERT 上线 —— LLM 负责「贵但聪明」，BERT 负责「便宜且稳定」</b>。⚠ 更一般的结论：<b>任务形状固定而且量很大时，专用小模型几乎总是比通用大模型划算</b>。",r:"⚠ 关于 512 还有一个比算力更硬的原因讲者没提：<b>BERT 用的是「学出来的」位置嵌入，所以表只有 512 行 —— 第 513 行根本不存在</b>（正是 13:51 那个局限二）⇒ <b>BERT 的 512 是双重限制：算力上 O(n²) 太贵，而结构上位置表没有更多行；后者是硬的 —— 哪怕有无限算力，BERT 也处理不了 513 个 token</b>。★★ 而局限二、三正好对应 69:10 预告的那两条「改进的轴」：<b>局限二 ⇒ DistilBERT，局限三 ⇒ RoBERTa</b>。⇒ 这个讲法结构值得当模板：<b>① 讲一个基准模型 ② 列出它的局限 ③ 每个局限对应一个后续模型</b> ⇒ <b>于是你记住的不是「三个模型的名字」而是「三个问题和三个答案」</b>。"});

  note("⇒ 讲者的评价：这非常有意思（which is very interesting）",640,336,"d");
  note("⚠ 所以蒸馏不是「另一种损失」—— 它是交叉熵的「推广」",640,368,"r");},"<b>这是整段最漂亮的一个观察，而它改变了你看蒸馏的方式。</b><br><b>讲者的话</b>：<b>「<u>而一个有意思的点，你在这里会看到的是：如果你那个 y_T 分布就只是一个硬标签，你就找回了交叉熵损失。所以如果你只有一个位置上是 1、其余地方全是 0，你就有 −log(y_S) —— 这非常有意思</u>。」</b><br><b>★★★ 把这个代换做一遍，它确实只有一行</b>：<b>⇒ KL(T‖S) = Σᵢ y_T⁽ⁱ⁾ · log(y_T⁽ⁱ⁾ / y_S⁽ⁱ⁾)。</b><b>⇒ 如果 y_T 在第 k 个位置是 1、其余是 0 ⇒ <u>只有 i = k 那一项不为零</u>。</b><b>⇒ 那一项 = <u>1 · log(1 / y_S⁽ᵏ⁾) = −log y_S⁽ᵏ⁾</u>。</b><b>⇒ <u>而这正是交叉熵</u>。</b><br><b>★★ 所以结论是：<u>蒸馏不是「另一种损失」，它是交叉熵的推广</u></b>：<b>⇒ <u>普通训练</u>：用一个 one-hot 的目标 ⇒ 交叉熵。</b><b>⇒ <u>蒸馏</u>：用一个「软」的目标 ⇒ KL 散度。</b><b>⇒ <u>两者是同一条公式，区别只在目标分布有多「尖」</u>。</b><br><b>⚠ 而这立刻解释了 L1 那个 <u>label smoothing</u> 在这条谱上的位置：<u>它把 one-hot 稍微抹平一点（0.9 / 0.1 之类）—— 介于两者之间</u>。</b><b>⇒ <u>one-hot、label smoothing、蒸馏 —— 一条连续的谱，差别只是目标分布的软硬程度</u>。</b>");
  SUM(0,44,{h:"⭐⭐ 知识蒸馏：软目标、teacher/student、KL",k:"Hinton / Vinyals / Jeff Dean 那句引言：<b>「soft targets（软目标）包含了几乎全部的知识」</b> —— 讲者的解读是<b>一个模型「输出的那个分布」其实非常有助于知道它学到了什么</b>。两个角色：<b>teacher（更复杂的模型）和 student（更小的模型）</b>，目标是<b>把输出「分布」映射过去，而不是去学硬标签</b>；<b>实践中你很快看到，学一个模型的分布比直接学硬标签更有帮助</b>。目标函数：<b>KL 散度 —— 「在 teacher T 描述的那个世界里，用 student S 去建模有多糟」</b>。⭐⭐⭐ 而<b>如果 y_T 就是一个硬标签（一个位置 1、其余 0），你就找回了交叉熵损失 −log y_S</b>。",m:"★★★ 「软目标包含几乎全部知识」用一个例子就懂：<b>硬标签说「是狗」，软目标说「狗 0.85、狼 0.10、猫 0.03、汽车 0.0001」</b> —— 后者多了<b>「狼和狗很像、而汽车完全不像」这个「类别之间的相似结构」，而硬标签把它整个抹掉了</b> ⇒ <b>模型真正学到的不只是「答案」，而是「整个相似度地图」</b>，而<b>让学生去学这张地图，比让它从头自己画一张容易得多</b>。",w:"★★★ 那个特例是整段最漂亮的观察，代换只有一行：<b>KL = Σ y_T log(y_T/y_S)，y_T 在第 k 位是 1 其余 0 ⇒ 只剩 1·log(1/y_S⁽ᵏ⁾) = −log y_S⁽ᵏ⁾ = 交叉熵</b>。⇒ 结论：<b>蒸馏不是「另一种损失」，它是交叉熵的推广 —— 两者是同一条公式，区别只在目标分布有多「尖」</b>。⚠ 而这立刻定位了 L1 那个 <b>label smoothing</b>：<b>one-hot、label smoothing、蒸馏是一条连续的谱，差别只是目标分布的软硬程度</b>。",r:"⚠ 留意 <b>KL 不对称</b>：这里是 <b>KL(T‖S)</b>，对「T 认为可能的那些结果」加权 ⇒ <b>T 说某类 0.3 而 S 说 0.001 惩罚很重；T 说某类 0 则 S 说什么都不罚</b> ⇒ 效果是<b>强迫 student 覆盖 teacher 认为可能的一切（mode-covering）</b>，而反方向是 mode-seeking。<b>蒸馏要的正是覆盖 —— 你希望小模型把大模型的整张相似度地图都学下来</b>。⇒ 为什么比直接用硬标签训小模型好：<b>① 信息量（每个样本的监督从「1 个类别」变成「一整个分布」，多几千倍）② 平滑性（teacher 的分布连续、带不确定性，天然起正则化作用，而 one-hot 迫使模型过度自信）</b>。★★ 另：这是讲者第三次确认前置知识，而<b>这次回答是「几个人」（前两次是「所有人」「答对了」）⇒ 他跟着改了讲法：不从定义或公式开始，而从一句引言建立直觉</b> —— 这就是「先确认前置再决定讲法」的实际价值：<b>它决定了起点放在哪</b>。"});
  QUIZ(0,44,{t:"为什么说「蒸馏不是另一种损失，而是交叉熵的推广」？",o:["把 y_T 代成 one-hot，KL(T‖S) 就化简成 −log y_S，正是交叉熵 ⇒ 同一条公式，区别只在目标分布有多「尖」","因为两者都用 softmax","因为 teacher 的输出也是 one-hot","因为蒸馏的梯度和交叉熵相同"],a:0,w:"⇒ 于是 one-hot、label smoothing、蒸馏构成一条连续的谱，差别只是目标分布的软硬程度。"});

  SUM(0,45,{h:"DistilBERT 与 RoBERTa，与整讲收尾",k:"<b>DistilBERT</b>（「一篇非常干净的论文，只有四页左右，但影响力超大」）：<b>把层数减半，你有很多收益而且性能几乎一样 —— 这非常了不起</b>；而他们<b>用蒸馏作为保住那个性能的办法 —— 这就是关键，连同减少层数</b>。<b>RoBERTa</b>：① <b>研究了「去掉 NSP 几乎没带来性能下降」这个事实 ⇒ 他们就把它删了</b>；② <b>动态地做掩码 —— 对一段给定文本，每个 epoch 都换一次掩码</b>；③ <b>一个数据策略：他们看到模型「被大大地训练不足（vastly undertrained）」⇒ 大幅增加数据的多样性和规模 ⇒ 基准性能在同样基准上提升相当多</b>。",m:"★★★ DistilBERT 两件事的分工别混：<b>减半层数是「目标」（12→6 层，1.1 亿→6600 万参数，推理快约 60%），蒸馏是「手段」—— 如果只是把一个 6 层 BERT 从头训一遍，效果会明显变差</b>。「性能几乎一样」的具体数字：<b>保留了 BERT base 约 97% 的 GLUE 分数 —— 用 60% 的参数、40% 更快的推理，换 3% 的性能损失</b>。⚠ 两个讲者没提的实现细节：<b>① 学生的初始化是从老师那里「隔层取」的 ② 损失是三项加权：蒸馏 KL + 自己的 MLM 交叉熵 + 让学生和老师隐藏状态对齐的余弦损失</b>。",w:"★★★ <b>vastly undertrained</b> 这四个字是整段最重要的发现，含义是：<b>BERT 的局限不在架构，而在它没被训够</b>。RoBERTa 具体做了什么：<b>数据从 16GB 到 160GB（10 倍）、batch 从 256 到 8000、训练步数大幅增加 —— 架构一个字没改，结果在所有基准上大幅超过 BERT</b>。⇒ 这在 2019 年是震动，<b>而它预告了整个领域的方向：如果一个模型「只是没训够」，那继续加数据、加算力就能变好 —— 这正是 scaling law 那条路的起点</b>（GPT-3、Chinchilla、今天所有前沿模型走的都是这个方向；Chinchilla 2022 把它量化了）。",r:"★★ 那条伏笔的<b>五次</b>铺垫终于收口，这是整讲叙事最漂亮的一条线：<b>78:25「可以被看成」→ 78:58「作者假定」→ 86:26「我们会看到它被质疑了」→ 90:44「假设是」→ 103:02「那两个真的都有帮助吗」→ 106:17 删掉它性能几乎没降</b>。⇒ 而 RoBERTa 用什么代替 NSP？<b>什么都不用 —— 只做 MLM，但把每条输入填满到 512 个连续 token，省下的算力全用在 MLM 上</b>。⇒ 动态掩码解决的问题很真实：<b>原始 BERT 在预处理阶段就把掩码定好存起来，训 40 个 epoch 就是同一句话被看 40 次、每次遮同一批词 ⇒ 模型有机会「记住」这个特定遮法而不是学会「填空」</b>；改成每次取数据时现场做 ⇒ <b>40 种不同遮法，相当于把数据量放大，而代价几乎为零（只是把一行代码从预处理挪到训练循环）</b>。⇒ 整讲三条主线：<b>① 位置编码演化（同一目标、五代手段，注入位置一路搬进注意力内部，终点 RoPE）② 「变了哪三个零件」的框架 ③ 三类架构与路线之争（decoder-only 赢的理由不是更聪明，是最容易扩大规模且和聊天对齐）</b>。而 BERT 那一大段的价值在于<b>它让你看清了那条没被走下去的路 —— 双向、填空、分类每一样都做得很好，而每一样都通不到 ChatGPT</b>。"});

    "收一下这一讲。<br><b>★★★ 一句话总结：骨架八年没换，但三个零件各换了一遍 —— 而每一次更换都能说出具体理由。</b><br><b>先把占了全讲三分之一时间（10:44–42:43）的那条线列完整，这是最该带走的东西</b>：<br><span class='w'><b>① 学出来的嵌入</b> —— 毛病有两个：<b>依赖训练集</b>（会把「位置 2 通常是什么」这种统计规律一起吸进去），而且<b>只能学到训练时见过的最大位置</b>（第 513 行根本不存在）。</span><br><span class='w'><b>② 正弦余弦</b> —— 治好了外推，而且用 cos(a−b) 证明了<b>点积只依赖相对距离</b>；但它是加在<b>输入</b>上的，而我们真正想影响的是<b>注意力层</b>。</span><br><span class='w'><b>③ T5 的相对位置偏置</b> —— 直接加进 softmax 里（把 m−n 分桶），但<b>要学</b>，于是又带回了过拟合。</span><br><span class='w'><b>④ ALiBi</b> —— 不学了，用确定性公式，<b>但太简单、太受限</b>（只是 n 和 m 的线性差）。</span><br><span class='k'><b>⑤ RoPE</b> —— 回到正弦余弦的世界，但改成<b>旋转 query 和 key</b>，于是 QKᵀ 天然只依赖 n−m，还多一个<b>长程衰减的上界</b>。今天多数模型用它。</span><br><b>⚠ 认准这条线的真正剧情：<u>量化的办法基本没变（一直是三角函数），变的是「注入的地方」—— 它一路从输入端搬进了注意力内部</u>。</b>");

    setTitle("CME295 L2 · 完 ②","归一化两处，注意力两个正交方向",

    "<b>② 归一化，换了两处 —— 一处是位置，一处是形式。</b><br><span class='w'><b>位置：post-norm → pre-norm</b>。原来是 Norm(x + Sublayer(x))，现在是 x + Sublayer(Norm(x))。<b>差别在那条残差路径上：post-norm 里相加之后还要过一次 Norm，把「那条直路」挡住了；pre-norm 里 x 原封不动加上去 ⇒ 从最后一层到第一层有一条完全畅通的恒等路径</b>，于是能训深得多、几乎不需要 warmup。</span><br><span class='w'><b>形式：LayerNorm → RMSNorm</b>。砍掉了「减均值」和偏置 β，只剩「除以均方根 × 一个学出来的 γ」。<b>收敛性质相当，但少学一半参数、而且省掉一次全向量求和 ⇒ 更快</b>。</span><br><br><b>③ 注意力，两个方向，而讲者明说它们是「<u>正交的</u>」—— 意思是可以同时用。</b><br><span class='w'><b>滑动窗口</b>治 O(n²) 的<b>计算</b>：每个 token 只看左右各几千个邻居，而<b>感受野随层数累积（L 层 × 窗口 w）</b>，所以 Mistral 全是局部注意力也能撑 32K。</span><br><span class='w'><b>共享 K/V 投影（MQA / GQA / MHA）</b>治 KV 缓存的<b>显存</b>：三档其实只是一个参数 g（组数）的三个取值，<b>g=1 是 MQA、g=h 是 MHA</b>。</span><br><b>⚠ 这两件事常被混为一谈，但它们治的是<u>不同的资源</u> —— 而 Mistral 7B 正是两个一起用。</b>");

    "<b>★★ 下半场那条线同样值得单独记：三类架构里，<u>赢的那一类不是因为更聪明，而是因为更好扩展</u>。</b><b>讲者的原话是：人们意识到<u>算力预算最好全部投在 decoder 上</u>；而 next-word prediction「是你能做的最简单的事情」，却被证明效果惊人、而且和「当一个有用的聊天助手」天然对齐。</b><br><b>⭐ 把它和 T5 的 span corruption 对比就清楚了</b>：<b>span corruption 更<u>精巧</u></b>（要挖空、要 sentinel token、要按序重建、要定挖多长），<b>而 next-word prediction 更<u>笨</u></b>（任何一段文本不经任何处理就是训练数据）。<b>⚠ 结果是笨的那个赢了 —— 因为规模的敌人正是预处理。</b><br><b>而 BERT 那一大段的价值，在于它让你看清了<u>那条没被走下去的路</u>：双向、填空、分类 —— 每一样都做得很好，而每一样都通不到 ChatGPT。</b><span class='w'>（不过它也没过时：1.1 亿参数、毫秒级延迟、输出稳定可复现，今天工业界做分类仍然大量在用。）</span><br><br><b>★ 这条教训对你的课题是直接可用的：一个更精巧的目标或判据，如果代价是「难以扩展」或「需要额外的构造步骤」，那它在大规模下很可能输给一个更朴素但更容易扩展的方案。</b><b>⇒ 所以比较方法时，<u>把扩展性当成一个和精度并列的轴</u>来报，而不是只报固定预算下的精度。</b><br><b>⇒ 下一讲 L3 是 Transformers & Large Language Models：正式进入 LLM，而上半场提到的 KV 缓存就在那一讲。</b>");
