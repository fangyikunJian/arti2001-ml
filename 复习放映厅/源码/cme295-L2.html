<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>
:root{
  --bg:#080B11; --ink:#F0F4FA; --dim:#93A1B5; --dimmer:#3D4658; --edge:#1B2230;
  --blue:#54A9F7; --yellow:#FFD36E; --green:#5BDDA8; --coral:#FF7C87; --violet:#B48BF5;
  --sans:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
mjx-container{color:inherit!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);margin:auto}
svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}

#eqBox{font-size:clamp(16px,2.5vw,36px);text-align:center;line-height:1.5;max-width:92%;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
#eqBox.off{opacity:0;transform:translateY(13px) scale(.97)}
#eqBox.top{align-self:flex-start;margin-top:4.5vh}

#big{font-family:var(--mono);font-size:clamp(30px,5.6vw,82px);font-weight:500;letter-spacing:-.03em;
  color:var(--yellow);text-shadow:0 0 44px rgba(255,211,110,.3);text-align:center;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
#big.off{opacity:0;transform:scale(.86)}
#big small{display:block;font-family:var(--sans);font-size:.22em;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);text-shadow:none;margin-top:.55em;font-weight:400}

/* caption band — pinned into the lower third, clears the strip, scrolls if long */
#capL{align-items:flex-end;pointer-events:none}
#capL::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46vh;
  background:linear-gradient(to top,var(--bg) 30%,rgba(8,11,17,.72) 62%,transparent);pointer-events:none}
#capWrap{max-width:min(84ch,94%);width:100%;max-height:62vh;overflow-y:auto;margin-bottom:50px;
  display:flex;flex-direction:column;align-items:center;pointer-events:auto;position:relative;z-index:2}
#cap{text-align:center;font-size:clamp(13.5px,1.56vw,22px);font-weight:400;line-height:1.55;
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#cap.off{opacity:0;transform:translateY(12px)}
#cap b{font-weight:600;color:var(--yellow)}
#cap i{font-style:normal;color:var(--blue);font-weight:600}
#cap em{font-style:normal;color:var(--green);font-weight:600}
#cap s{text-decoration:none;color:var(--coral);font-weight:600}
#narr{margin:.7em 0 0;max-width:min(90ch,100%);text-align:left;

  background:rgba(8,11,17,.86);border:1px solid rgba(46,58,82,.7);border-radius:12px;
  padding:12px 17px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:1}
#narr.off{opacity:0}
#narr[hidden]{display:none}
#narr b{color:#C6D2E2;font-weight:500}
#narr i{font-style:normal;color:var(--blue)}
#narr em{font-style:normal;color:var(--green)}
#narr s{text-decoration:none;color:var(--coral)}

#sum{max-width:min(1200px,94%);width:100%;max-height:90vh;overflow:auto;
  background:rgba(17,23,33,.975);border:1px solid #303D52;border-radius:18px;padding:34px 46px 34px;
  box-shadow:0 28px 74px rgba(0,0,0,.62);
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#sum.off{opacity:0;transform:translateY(16px) scale(.985)}
#sum[hidden]{display:none}
#sum .sh{font-family:var(--mono);font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--green);margin:0 0 9px}
#sum h3{font-size:clamp(24px,2.7vw,38px);font-weight:800;margin:0 0 26px;letter-spacing:-.02em;line-height:1.25;color:#F6F9FE}
#sum .rows{display:flex;flex-direction:column;gap:15px}
#sum .row{border-left:4px solid #3C4A61;padding:17px 24px;background:rgba(255,255,255,.03);border-radius:0 12px 12px 0}
#sum .rk{font-family:var(--mono);font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:#9EABBE;margin:0 0 8px}
#sum .rv{font-size:clamp(16px,1.45vw,21px);font-weight:400;line-height:1.88;color:#E3EAF5;margin:0}
#sum .rv b{color:#FFFFFF;font-weight:700}
#sum .rv i{font-style:normal;color:#7CC0FF;font-weight:600}
#sum .rv em{font-style:normal;color:#6FE3B4;font-weight:600}
#sum .rv s{text-decoration:none;color:#FF97A0;font-weight:600}
#sum .row.k{border-left-color:var(--green)}
#sum .row.w{border-left-color:var(--coral)}
#sum .row.e{border-left-color:var(--yellow)}
#sum .row.m{border-left-color:var(--blue)}
#sum .row.r{border-left-color:var(--violet)}

#quizL{align-items:center;pointer-events:none}
#quiz{max-width:min(72ch,91%);pointer-events:auto;background:rgba(13,18,26,.95);
  border:1px solid #253044;border-radius:14px;padding:23px 27px;
  transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.3,1)}
#quiz.off{opacity:0;transform:translateY(14px);pointer-events:none}
#quiz[hidden]{display:none}
#quiz .qh{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--yellow);margin:0 0 10px}
#quiz .qq{font-size:clamp(13.5px,1.5vw,20px);font-weight:600;margin:0 0 15px;line-height:1.45}
#quiz .qo{display:flex;flex-direction:column;gap:7px}
#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;
  color:var(--ink);background:rgba(255,255,255,.045);border:1px solid #2A3546;
  border-radius:8px;padding:10px 15px;cursor:pointer;text-align:left;line-height:1.5;transition:background .2s,border-color .2s}
#quiz button:hover:not(.lk){border-color:var(--blue);background:rgba(84,169,247,.13)}
#quiz button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#quiz button.lk{cursor:default}
#quiz button.ok{border-color:var(--green);background:rgba(91,221,168,.15);color:var(--green)}
#quiz button.no{border-color:var(--coral);background:rgba(255,124,135,.13);color:var(--coral)}
#quiz button.off2{opacity:.32}
#quiz .why{margin:15px 0 0;font-size:clamp(11.5px,1.15vw,15px);font-weight:300;color:#93A1B5;line-height:1.7;border-top:1px solid #1E2634;padding-top:12px}
#quiz .why[hidden]{display:none}
#quiz .why b{color:#C6D2E2;font-weight:500}
#quiz .why em{font-style:normal;color:var(--green)}
#quiz .why s{text-decoration:none;color:var(--coral)}
#quiz .why i{font-style:normal;color:var(--blue)}

#titleL{flex-direction:column}
#titleL h1{font-size:clamp(25px,4.7vw,68px);font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.07;text-align:center;text-shadow:0 0 70px rgba(84,169,247,.25)}
#titleL p{font-size:clamp(12px,1.32vw,18px);color:var(--dim);font-weight:300;margin:2vh 0 0;letter-spacing:.05em;text-align:center;max-width:62ch}
#titleL .act{font-family:var(--mono);font-size:clamp(11px,1.18vw,15px);color:var(--blue);letter-spacing:.28em;margin:0 0 2.2vh;text-transform:uppercase}
#titleL .rule{width:60px;height:2px;background:var(--blue);margin:3.2vh auto 0;box-shadow:0 0 18px rgba(84,169,247,.7)}
.fade{transition:opacity .6s ease;display:flex;flex-direction:column;align-items:center}
.fade.off{opacity:0}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}
.tok.hl{color:var(--yellow);text-shadow:0 0 24px rgba(255,211,110,.5)}
.tok.res{color:var(--green);text-shadow:0 0 24px rgba(91,221,168,.45)}
.tok.ded{color:var(--coral);opacity:.5}

#strip{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:6}
#kps{display:flex;gap:3px;flex:1}
.kpbar{display:flex;gap:2px;flex:1;position:relative;cursor:pointer}
.pip{height:2px;flex:1;background:var(--edge);border-radius:2px;transition:background .4s}
.pip.seen{background:#2E3B50}
.pip.now{background:var(--blue);box-shadow:0 0 9px rgba(84,169,247,.85)}
.pip.sum{background:#1D3A30} .pip.sum.seen{background:#2C5C4A}
.pip.quiz{background:#3A3218} .pip.quiz.seen{background:#5C4E22}
.kplbl{position:absolute;top:-15px;left:0;font-family:var(--mono);font-size:8px;color:var(--dimmer);letter-spacing:.06em;white-space:nowrap;transition:color .3s}
.kpbar.active .kplbl{color:var(--blue)}
#hint{font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#tc{position:fixed;top:18px;left:20px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.1em;text-decoration:none;pointer-events:auto}
#tc:hover{color:var(--blue)}
#tc[hidden]{display:none}
#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}
.navbtn{position:fixed;top:0;bottom:44px;width:14%;background:none;border:0;cursor:pointer;opacity:0;z-index:4}
#prev{left:0} #next{right:0}
.navbtn:focus-visible{opacity:1;outline:2px solid var(--blue);outline-offset:-6px}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}
.pt{fill:var(--ink)}
.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}
.box.r{stroke:var(--coral)} .box.v{stroke:var(--violet)}
.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}
.cellbg.hl3{fill:#3A1A1E;stroke:var(--coral);stroke-width:1.6}
.celltx{font-family:var(--mono);font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.celltx.d{fill:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* fix: 面板 .off 立即不可见 */
#big.off,#cap.off,#eqBox.off,#titleBox.off,#sum.off,#quiz.off{visibility:hidden}
</style>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

function stack(cx,ytop,items,bw,bh,gap){

  SUM(0,2,{h:"⭐ 为什么要注入位置",k:"<b>「令人惊讶的是，这个 2017 年被引入的 transformer 架构，实际上是一个这些年里一直保持着相关性的架构」⇒ 「有一些轻微的变体，但整体上今天的模型都多少是基于最初那个 transformer 架构的」</b>;分工：<b>「第一部分是我要讲的，也就是 transformer 里哪些部分是重要的、而且发生过一些变动；第二部分里 Shervine 会讲今天这些模型的命名法，以及它们和最初那个 transformer 的关系」</b>。<br>⭐ 缺口：<b>「我们让 token 以一种直接的方式和所有其它 token 交互⋯⋯但和 RNN 相反，RNN 里你有一个顺序依赖，你一次处理一个 token；而在这里你基本上丢掉了『一个 token 在另一个之前被处理』这个概念」⇒ 「你丢了这个位置信息。作为这件事的结果，我们需要以某种方式去量化每个位置上的 token，并且在 transformer 处理这些输入时，试着把那个信息注入进去」</b>。<br>第一代：<b>「最初那篇论文的作者们选择了有一个专属的嵌入 —— 每一个位置都有一个嵌入⋯⋯而他们选择做的是，把那个嵌入加到输入 token 的嵌入上」</b>;一个提问：<b>「位置嵌入是学出来的还是静态的？」——「两个都是，意思是作者两种都试过了」</b>;两个局限：<b>「你非常依赖你的训练集里有什么⋯⋯如果你的文本总是在位置 2 号上发生某件事，那你学出来的嵌入就会把那个偏置也学进去」; 「你只能学到你训练集里出现的那个最大位置数为止的位置」</b>;而好处是「<b>你就只是让你的模型去学 —— 而梯度下降在这件事上创造奇迹</b>」。",m:"⭐ 「<b>量化</b>」和「<b>注入</b>」这两个动词是<b>两个独立的设计决定</b>:<b>量化用什么形式（学出来的向量 / 一条公式 / 一个偏置）· 注入送到哪里（加在输入上 / 直接改 softmax 里那个分数）⇒ 这一讲后面四代方案的差别，全都可以用这两个维度定位</b>。<br>⭐ 而顺序这个缺口的<b>因果</b>要想清楚：<b>RNN 知道顺序，是因为它的计算本身就是按顺序做的 —— 顺序是免费的副产品；而 transformer 一次性算完，于是顺序必须被显式加回去 ⇒ 最大的长处直接造成了最大的缺口</b>。<br>⭐ 两个局限有<b>同一个根源</b>:<b>「学」只能从「见过的东西」里学 —— 位置嵌入表的第 k 行，只有训练数据里真出现过长度 ≥ k 的句子时才有梯度流过去</b>。",w:" 局限二是<b>硬限制，不是精度下降</b>:<b>位置嵌入表就是一个 512 行的矩阵 —— 不是「第 513 行学得不好」,而是根本没有第 513 行 ⇒ 你连「凑合着用」都做不到</b>。<br>⚠ 而局限一之所以隐蔽：<b>位置嵌入本该只编码「第几个」这件纯结构信息，但自由学出来的东西会把内容上的统计规律一起吸进去</b>。<br>⚠ 另外「<b>作者两种都试过、结果相当</b>」说明在 2017 年这两种做法谁更好并不显然 —— <b>真正把它们分出高下的是这些局限</b>。",r:"⇒ 「<b>一直保持着相关性</b>」这句话有一个很实用的推论：<b>你看懂了 L1，就看懂了今天绝大多数模型的骨架 —— 而这一讲要补的，正是那些「轻微的变体」</b>。<br>⇒ 而最朴素的做法（直接把位置号 m 当成一个数接上去）为什么不行，正好解释了后面所有设计的动机：<b>m 没有上界（会把其它特征淹掉）,而归一化成 m/L 又会让同一个位置在不同长度的句子里数值不同</b>。<br>⇒ 「任意的公式」里那个「<b>任意</b>」带着挑衅：<b>凭什么是这条公式？—— 而讲者接下来花了九分钟专门回答它</b>。<br>⇒ 更多（八年没换这件事的对照、位置嵌入表的参数量、占位行没被填到会怎样）见<b>深度笔记</b>。"});

  note("⚠ 而「更可能」是统计先验，不是硬规律：隔了九个词的主语照样该被关注",640,374,"r");},"<b>推导开始，而讲者的走法本身就是这一段最大的价值。</b><br>⭐⭐⭐ 他分两步，<b>而顺序是关键</b>:<b>① 先问「我们到底想要位置表示有什么性质」（完全不看公式，纯粹从任务出发）; ② 再去验证「这条公式给不给我们那个性质」。反过来做，你得到的永远只是事后解释 —— 因为任何公式你都能编出一套说法</b>。<br>⭐ 而他要的那个性质只有一句话：「<b>靠在一起的词，比离得更远的词更可能是相关的 —— 所以差一个位置的那一对，要比差一万个位置的那一对更相似</b>」。<br>⚠ 注意「<b>更可能</b>」这个词：<b>这是统计性先验，不是绝对规律（「The man who I met yesterday in Berlin is tall」里 is 的主语隔了九个词）—— 位置编码只给倾向，不给限制，最终还是内容说话</b>。");
  SUM(0,3,{h:"⭐ 第二代：算出来的位置嵌入",k:"<b>「第一个方法是：你每个位置有一个嵌入，然后你就学它。第二个方法是：你每个位置有一个嵌入，但你不打算学它 —— 你会有某个预先定好的东西，拿来直接用」; 「而作者选的是用正弦和余弦的一种表述。所以它可以感觉很怪 —— 他们为什么选这个？但我们会看到为什么这说得通」</b>。<br>⭐ 公式骨架：<b>「对一个给定的位置 m，有一个 d_model 大小的向量。所以 d 需要匹配你的 token 嵌入的维度，因为你当然是要把它们加起来的。而你要做的是，对每一个索引，按照这些公式去计算对应的那个值」⇒ 偶数维 2i 用 sin，奇数维 2i+1 用 cos</b>;记号：<b>「我们先把记号简化一下⋯⋯而你把 omega i 记作这个量，也就是 10000 的负 2i 除以 d_model 次方」</b>;而目标性质是：<b>「你想要的是以一种反映下面这个事实的方式去表示位置 —— 靠在一起的词，比离得更远的词更可能是相关的」</b>。",m:"⭐ 两代的对比干净得惊人：<b>形状完全一样（最大长度 × d_model 的一张表、加到 token 嵌入上）,唯一变的是表里的数是训出来的还是算出来的 ⇒ 而这一个区别让两个局限同时消失：没有参数所以不吸偏置、可以算任意行所以能外推</b>。<br>⭐ 「<b>d 必须匹配因为要相加</b>」把上一段那个决定的后果说出来了：<b>选了相加，维度就被锁死 —— 换来「不增加宽度」,付出「不能单独调维度」</b>。<br>⭐ 而 <b>ω_i = 10000^(−2i/d) 在 1 到 0.0001 之间几何式递减，而 ω 就是角频率 ⇒ 低维编码细粒度差别、高维编码大尺度差别</b>。",w:" 「谁还记得三角函数公式」不是寒暄：<b>接下来九分钟全靠 cos(a−b) 这一条恒等式 —— 如果班上一半人不记得，推导的节奏就断了</b>。<br>⚠ 而那个两步法的顺序不能反：<b>先看公式再找理由，得到的永远是事后解释；先定性质再验证，才有「不通过」的可能，验证才有意义</b>。<br>⚠ 「<b>更可能</b>」是统计先验不是硬规律：<b>位置编码让近的更相似，但注意力权重最终由内容决定 —— 模型完全有能力越过这个倾向</b>。",r:"⇒ 这个两步法是通用的：<b>看到一个你不理解的设计（一个损失、一个归一化、一个采样策略）,先别问「它怎么算」,先问「它想保证什么」—— 多数时候一旦说出那个性质，设计本身就显然了</b>。<br>⇒ 「给先验而不给硬约束」是整个深度学习里反复出现的设计哲学。<br>⇒ 更多（相加 vs 拼接的参数账、ω_i 的几何递减与二进制计数器的类比）见<b>深度笔记</b>。"});
  QUIZ(0,3,{t:"第二代「算出来的」位置嵌入，和第一代相比到底变了什么？",o:["它把 softmax 换成了别的归一化函数","维度从 512 变成了 32，所以更省显存","它不再加到 token 嵌入上，而是改成拼接","形状完全一样（最大长度 × d_model 的一张表、仍然加到 token 嵌入上）,唯一变的是表里的数是训出来的还是用公式算出来的 ⇒ 没有参数（不吸训练集偏置）且可以算任意行（能外推），两个局限同时消失"],a:3,w:"⇒ 代价是你必须自己想出那条公式 —— 而「什么样的公式才是对的」,正是接下来九分钟要回答的问题。"});
});
KP("4 · ⭐⭐⭐ 用 cos(a−b) 证明：点积只依赖相对距离",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$\\cos(a-b)=\\cos a\\,\\cos b+\\sin a\\,\\sin b$$");
  says("18:36","So let us suppose you have two position embeddings, so one at position m and the other one at position n",166);
  says("18:59","cosine of a minus b is equal to cosine of a cosine of b, plus sine a sine b",192);
  note("⭐⭐⭐ 整段推导唯一要用的工具 —— 请盯着右边的形状",640,224,"y");
  note("⇒ cos·cos ＋ sin·sin —— 而位置嵌入偶数维是 sin、奇数维是 cos",640,256,"g");
  note("⭐ 所以点积里第 2i 维和第 2i+1 维那两项，恰好凑成这个右边",640,288,"r");},"<b>验证开始。要算的是 PE(m) 和 PE(n) 的点积，而整段推导唯一要用的工具就是这一条恒等式。</b><br>⭐ 「<b>假设你有两个位置嵌入，一个在位置 m、另一个在位置 n⋯⋯如果你记得你的三角函数公式，cos(a−b) 等于 cos a cos b 加 sin a sin b</b>」。<br>⭐⭐⭐ 请盯着右边看：<b>cos(某角)×cos(另一角) ＋ sin(某角)×sin(另一角)。而位置嵌入偶数维是 sin(ω_i m)、奇数维是 cos(ω_i m) ⇒ 做点积时，第 2i 维贡献 sin(ω_i m)·sin(ω_i n)、第 2i+1 维贡献 cos(ω_i m)·cos(ω_i n) —— 这两项加起来正是 cos(a−b) 的右边，于是合成 cos(ω_i(m−n))</b>。<br>⚠ <b>这就是全部的魔法：「sin 和 cos 成对放在相邻两维」这个看起来任意的设计，目的就是让点积自动完成这个合并</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("19:12","if you express cosine of omega i, factor of m minus n, this is something that you obtain",166);
  says("19:43","when you do the dot product of position m and position n, what you do is you take the first position, you multiply them",192);
  note("⭐ 注意他的推导方向：不是化简点积，是先写出目标形式再去认出它",640,222,"y");
  boxNode(80,254,500,50,"① 用 sin / cos：为了用上 cos(a−b)","g");
  boxNode(700,254,500,50,"② 奇偶维成对：凑齐那两项","y");
  note("③ 同一对共用一个 ω_i：角度才能相减",330,328,"b");
  note("⇒ 三个看起来任意的决定，现在都有理由了",950,328,"v");
  note("⚠ 只剩「为什么是 10000」还没解释 —— 那个在 24:28",640,374,"r");},"<b>这一镜是转折点，而关键在于「认出来」这个动作的方向。</b><br>⭐ 「<b>如果你把 cos(ω_i 乘以 m 减 n) 展开，你得到的就是这个东西 —— 它就只是我刚提到的那条恒等式。而这个量恰好就是你做这两个位置嵌入的点积时会出现的一个分量</b>」 ⇒ <b>他不是从点积出发去化简，而是先写下目标形式、再在点积里「认出」这个形状 —— 逻辑上等价，但教学上路是明的；而这也是做推导的实用技巧：知道想得到什么形式时，先把它写出来，再去源头找零件</b>。<br>⭐ 于是公式里三个看起来任意的决定都有了理由：<b>① 用 sin/cos（为了用上 cos(a−b)）; ② 奇偶维成对（点积是逐维相乘求和，必须一维放 sin、一维放 cos，那两项才会相遇）; ③ 同一对共用一个 ω_i（角度才能相减）</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("20:14","you end up with a sum of cosine that are a function of the relative distance between m and n",166);
  says("21:01","So the question is, so the closer they are, the more similar they are",192);
  note("⭐⭐⭐ 结论比「近的更相似」还要强：点积只依赖 m−n",640,222,"y");
  boxNode(80,254,500,50,"位置 3 与 5 的点积","g");
  boxNode(700,254,500,50,"＝ 位置 1003 与 1005 的点积","g");
  note("也等于 50 万与 50 万零 2 的 —— 只要差是 2",330,328,"g");
  note("⚠ 第一代凭什么相等？没有任何机制保证",950,328,"r");
  note("⚠ 而讲者用词是「逼近 / 模仿」而不是「保证」—— 因为余弦是周期的",640,374,"r");},"<b>这是整段推导的结论，而它比那条直觉强得多。</b><br>⭐ 「<b>当你做这些嵌入的点积时，你最终得到的是一堆余弦之和，而它们是 m 和 n 之间相对距离的函数</b>」—— 学生确认「<b>所以它们越近就越相似？</b>」,讲者答「<b>正是如此</b>」。<br>⭐⭐⭐ 把结论说准：<b>点积只依赖 m−n，和 m、n 各自是多少完全无关 ⇒ 位置 3 和 5 的点积严格等于 1003 和 1005 的、也等于 50 万和 50 万零 2 的。这叫平移不变性 —— 而第一代那两个独立学出来的向量，凭什么相等？没有任何机制保证</b>。<br>⚠ 但他接着用的词是「<b>逼近</b>」和「<b>模仿</b>」而不是「保证」,这个分寸是对的：<b>余弦是周期函数，cos(ω_i·d) 并不随 d 单调递减</b>。");
  SUM(0,4,{h:"⭐⭐⭐ 那个三角恒等式的证明",k:"<b>「假设你有两个位置嵌入，一个在位置 m，另一个在位置 n⋯⋯如果你记得你的三角函数公式，cos(a−b) 等于 cos a cos b 加 sin a sin b」; 「如果你把 cos(ω_i 乘以 m 减 n) 展开，你得到的就是这个东西 —— 它就只是我刚提到的那条恒等式。而这个量恰好就是你做这两个位置嵌入的点积时会出现的一个分量」; 「因为基本上，当你做位置 m 和位置 n 的点积时，你做的是：你取第一个位置，把它们相乘，然后加上第二个位置，把它们相乘，等等。然后你走到这里，它是 sin 乘 sin 加 cos 乘 cos —— 而这就正是那个量」</b>。<br>⭐ 结论：<b>「所以到最后，你意识到的是：当你做这些嵌入的点积时，你最终得到的是一堆余弦之和，而它们是 m 和 n 之间相对距离的函数」</b>;学生问「<b>所以它们越近，就越相似？</b>」—— 讲者：「<b>正是如此</b>」,并补一句「<b>这种构造嵌入的方式是在试着逼近它、或者说试着模仿它</b>」。",m:"⭐⭐⭐ 魔法在一个形状的匹配上：<b>恒等式右边是 cos·cos ＋ sin·sin，而位置嵌入偶数维放 sin(ω_i m)、奇数维放 cos(ω_i m) ⇒ 点积逐维相乘求和时，第 2i 与第 2i+1 维那两项恰好凑成这个右边，合成 cos(ω_i(m−n))</b>。<br>⭐ 于是三个看起来任意的决定都有了理由：<b>① 用 sin/cos 是为了用上 cos(a−b); ② 奇偶维成对是为了让那两项在求和里相遇；③ 同一对共用一个 ω_i 是为了让角度能相减</b>。<br>⭐ 而推导<b>方向</b>也值得学：<b>先写下目标形式、再在源头认出它的零件，比盲目化简省力得多</b>。",w:" 结论要说准：<b>点积只依赖 m−n（平移不变），和绝对位置无关 —— 这比「近的更相似」强得多，而第一代完全不保证这一点</b>。<br>⚠ 而「<b>逼近 / 模仿</b>」这个用词是精确的：<b>点积严格地只依赖相对距离（这是保证的）; 而「越远越不相似」只在一定范围内近似成立（这是逼近的）—— 把这两者分开，才是真的懂了这条公式</b>。",r:"⇒ 一旦你看懂那一步形状匹配，整条公式就不再任意了 —— <b>它是为了让 cos(a−b) 能用上而设计的</b>。<br>⇒ 而这正是读论文时最值钱的一种能力：<b>遇到一条看起来任意的公式，先问它想保证什么性质，然后去找那个性质是怎么被凑出来的</b>。<br>⇒ 只剩「为什么是 10000」还没解释 —— 那个在下一个知识点。更多（逐项展开的完整写法、平移不变性和 RoPE 的关系）见<b>深度笔记</b>。"});
  QUIZ(0,4,{t:"正弦位置编码为什么要把 sin 和 cos 分到相邻的奇偶两维，而且共用同一个 ω_i？",o:["为了让向量的范数恒等于 1，便于做余弦相似度","纯粹是实现上的习惯，全用 sin 也完全一样","因为恒等式 cos(a−b)=cos a cos b + sin a sin b 需要两项（一项 cos·cos、一项 sin·sin）;点积是逐维相乘再求和，所以必须一维放 sin、另一维放 cos 且共用同一个 ω_i，这两项才会在求和里相遇并合成 cos(ω_i(m−n))","因为 sin 和 cos 的梯度互补，训练更稳定"],a:2,w:"⇒ 合成之后点积只依赖 m−n（平移不变）。而「越远越不相似」只是在一定范围内近似成立 —— 因为余弦是周期的。"});
});
KP("5 · ⭐ 为什么是点积、周期性的坦白、热力图与结论",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("21:31","in the embedding world when we try to quantify the similarity between two embeddings",166);
  says("22:02","if you remember your trigonometry class, cosine of 0 is 1",192);
  note("⭐ 那个被推迟的解释：为什么我一直在算点积",640,222,"y");
  boxNode(80,254,500,50,"余弦相似度 ＝ 点积 / 两个范数","b");
  boxNode(700,254,500,50,"⇒ 所以它基本上就是一个点积","g");
  note("L1 用它说明 one-hot 不行",330,328,"b");

  note("⚠ 而他立刻自己打补丁：它是周期的，过了 π 就反着走了",640,374,"r");},"<b>讲者在这里补上了那个被推迟的解释，而它直接接回 L1。</b><br>⭐ 「<b>我为什么在乎点积？因为在嵌入的世界里，当我们试着量化两个嵌入之间的相似度时，我们做的典型是某种涉及这两者点积的东西 —— 你典型地会有余弦相似度，而余弦相似度就只是点积除以每个嵌入的范数</b>」 ⇒ <b>L1 里他用同一把尺子证明了「one-hot 下所有词两两正交」,所以我们才需要稠密嵌入；现在同一把尺子量出了正弦编码的成功 —— 先量出一个失败、再量出一个成功，这就是一门课的连贯性</b>。<br>⭐ 然后是这一镜最该学的动作：「<b>cos 0 等于 1，而这个数越高 cos 的值就越低。当然，它是周期的，所以我说的不一定是真的 —— 过了 π 它就反着走了</b>」 ⇒ <b>给一个直觉，同时标注它的适用范围</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("22:38","for m equal to n, you have basically a sum of cosine of 0",166);
  says("23:10","And so now when you plot the values of the embeddings, this is what you obtain",192);
  says("23:41","if you take, let us say, the first row, you are looking at the first or number 0 position",218);
  note("⭐ 唯一能严格断言的那一点，以及这张图的两条轴",640,250,"y");
  boxNode(80,282,500,50,"m = n ⇒ 每一项都取到最大值 1","g");
  boxNode(700,282,500,50,"纵轴＝位置 0..49，横轴＝维度编号 i","b");
  note("⚠ 这张图在网上有两种画法 —— 轴认反了，结论就全反了",640,358,"r");},"<b>这一镜给出了唯一能严格断言的那一点，而它恰好是最该断言的那一点。</b><br>⭐ 「<b>对 m 等于 n，你基本上有一堆 cos(0) 之和 —— 而那是这个量取到最大的值⋯⋯这意味着如果你看的是那个位置本身，它是最相似的</b>」 ⇒ <b>为什么这一点能严格说：cos 的最大值是 1 且只在角度为 0 时取到 ⇒ m=n 时每一项都取到各自的最大值，一个和里每项都最大，这个和当然最大 —— 不需要任何额外假设</b>。<br>⭐ 然后图来了，而第一件事是认轴：「<b>y 轴上我表示的是比如 50 个位置、每一个位置的所有嵌入；而 x 轴上是跨越一个向量若干个维度的那些值</b>」 ⇒ <b>纵向是位置 0 到 49、横向是维度编号 i、每格颜色是那一维的值；而取第一行就是在看位置 0 那个嵌入的全部值</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("23:55","for low dimensions, this value goes up and down very frequently",166);

  says("25:15","it can extend to any sequence length, not just a sequence length that you saw at training time",218);
  note("⭐ 低维高频、高维低频 —— 一个连续版的二进制计数器",640,250,"y");
  boxNode(80,282,500,50,"i=0 ⇒ ω=1 ⇒ 周期约 6.3 个位置","y");
  boxNode(700,282,500,50,"i=d/2 ⇒ ω=0.0001 ⇒ 周期约 6.3 万","b");
  note("⭐ 两个方案指标打平、其中一个多一个性质 ⇒ 选那个多一个性质的",640,358,"g");},"<b>这就是那张图要告诉你的全部内容，而它最后把论文的那个决策模式讲完整了。</b><br>⭐ 「<b>对低的维度这个值上上下下非常频繁，所以它更高频；而维度高的时候要花很长时间才上下一次⋯⋯omega i 对低的 i 非常高、对高的 i 非常低，所以这就决定了你的 cos 和 sin 变化得有多快</b>」 ⇒ <b>它就是一个连续版的二进制计数器：低维像低位快速翻转、高维像高位缓慢变化。只有低频分不清位置 3 和 4，只有高频分不清 3 和 1003 —— 叠在一起才能既辨细微又辨大尺度；而 10000 这个常数决定最慢那一维的周期有多长（约 6 万），也就是能唯一区分的最大跨度</b>。<br>⭐ 结论：「<b>它能延伸到任何序列长度，而不只是你在训练时见到的那个长度</b>」 ⇒ <b>指标打平、其中一个多一个性质，就选多那个性质的</b>。");
  SUM(0,5,{h:"⭐ 热力图与第二代的结论",k:"<b>「我为什么在乎点积？因为如果你记得，在嵌入的世界里，当我们试着量化两个嵌入之间的相似度时，我们做的典型是某种涉及这两者点积的东西。你典型地会有余弦相似度。而余弦相似度就只是点积除以每个嵌入的范数 —— 所以它基本上就是一个点积」; 「如果你记得你的三角课：cos 0 等于 1，而这个数越高，cos 这个数的值就越低。当然，它是周期的，所以我说的不一定是真的 —— 过了 π 它就反着走了」; 「但对 m 等于 n，你基本上有一堆 cos(0) 之和 —— 而那是这个量取到最大的值⋯⋯它符合我们的直觉」</b>。<br>⭐ 热力图：<b>「y 轴上我基本上表示的是比如说 50 个位置、每一个位置的所有嵌入；而 x 轴上基本上是沿着某一条给定向量、跨越一个向量若干个维度的那些值」; 「对低的维度，这个值上上下下非常频繁 —— 所以它更高频。而当维度高的时候，这个值基本上要花很长时间才上下一次」; 「omega i 对低的 i 值非常高，而对高的 i 值非常低。所以这基本上就决定了你的 cos 和 sin 变化得有多快」</b>;结论：<b>「用这些方法导致和学出来那个相当的结果。但这里我们有一个很大的优势，因为它能延伸到任何序列长度，而不只是你在训练时见到的那个序列长度」</b>。",m:"⭐ 为什么一直在算点积：<b>余弦相似度 ＝ 点积 / 两个范数 ⇒ 它基本上就是一个点积。而 L1 用这同一把尺子证明了 one-hot 下所有词两两正交（所以才需要稠密嵌入）—— 同一把尺子先量出一个失败、再量出一个成功</b>。<br>⭐ <b>m=n 时每一项都取到各自的最大值 1 ⇒ 这个和当然最大。只要 m≠n 就至少有一项不是 1 ⇒ 「自己和自己最相似」是严格成立的，而「远的比近的更不相似」只是大致成立</b>。<br>⭐ 热力图的结构是一个<b>连续版的二进制计数器</b>:<b>低维像低位（快速振荡）、高维像高位（缓慢变化）; 只有低频分不清位置 3 和 4，只有高频分不清 3 和 1003 —— 叠起来才能既辨细微差别又辨大尺度距离</b>。",w:" 读热力图先认轴：<b>纵向是位置（0..49）、横向是维度编号 i、每格颜色是第 m 个位置嵌入的第 i 维的值 —— 这张图在网上有两种画法，轴认反了「低维高频」这个结论就对不上</b>。<br>⚠ 「第一个、或者说 0 号，取决于你怎么索引」—— <b>原论文公式里 pos 从 0 开始、讲者口头从 1 开始、不同实现也不一样；差一位在这里不会错得很离谱，但在对照公式和代码时会让你怀疑自己</b>。<br>⚠ 而周期性的实际影响：<b>低维周期很短，稍远就绕回来了；高维周期长达六万多 ⇒ 「越远越不相似」主要是靠高维那些低频分量撑起来的</b>。",r:"⇒ 10000 这个常数的含义现在清楚了：<b>它设定了最慢那一维的周期有多长（约 6 万），而那大致就是这套编码能唯一区分的最大跨度 —— 所以后来做长上下文的人会去调它，这正是 RoPE 时代那些 NTK 缩放、调 base 的核心思路</b>。<br>⇒ 而那个决策模式比「选指标高的那个」更重要：<b>指标是在当前数据分布上测的，而性质是结构性的 —— 2017 年没人需要 512 以上的长度，而今天所有人都需要；作者当时选的那个「暂时没用」的性质，八年后成了刚需</b>。<br>⇒ 更多（m=n 严格性的完整论证、索引从 0 还是从 1 带来的实现 bug、10000 的频率跨度算法）见<b>深度笔记</b>。"});
  QUIZ(0,5,{t:"正弦位置编码的热力图上，为什么要让不同维度有不同的频率（低维高频、高维低频）？",o:["为了让位置嵌入和词嵌入的范数匹配，相加时不互相淹没","因为只有低频你分不清位置 3 和位置 4（值几乎一样）,只有高频你分不清位置 3 和位置 1003（绕回来了）—— 两者叠在一起才能既分辨细微差别又分辨大尺度距离，就像一个连续版的二进制计数器","为了让每一维的数值范围都落在 −1 到 1 之间","因为高维的梯度更小，所以要用更低的频率补偿"],a:1,w:"⇒ 而 10000 这个常数决定最慢那一维的周期有多长（约 6 万），也就是能唯一区分的最大跨度 —— 所以做长上下文的人会去调它。"});
});

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 而第一代的问题就一个词：间接 —— 中间隔着 W_q 和 W_k 两次投影",640,356,"r");},"<b>这就是整条演化线的转折点，而讲者对第一代的批评只用了一个词：间接。</b><br>⭐ 「<b>当你在输入处做这件事的时候，它大致会是某个要进到这个注意力层里的东西，但它是有点间接的。所以我们想要的，是直接去对注意力公式做点什么</b>」 ⇒ <b>位置信息加在输入嵌入上之后，就和词义混在同一个向量里，然后被 W_q、W_k 各揉一遍才间接地影响到分数 —— 而那两个矩阵是学出来的，没有任何机制保证它们会把位置信息完好地带过去</b>。<br>⭐ 于是做法变成：「<b>自注意力层基本上就是 softmax(QKᵀ 除以根号 d) 乘 V。所以我们想要的，是在那个 softmax 里面加一点小东西</b>」 ⇒ <b>注意力分数 ＝ 内容的相似度 ＋ 位置的亲疏</b>。");
  SUM(0,6,{h:"⭐⭐ 搬进 softmax 里",k:"<b>「现在，快进到 2025 年。我想你可能会问我：我们还在用那个吗？而答案是 —— 算是吧。所以我们还在用这个想法：我们想要远的 token 比近的 token 更不相似。但我们不再像他们那样去注入那个嵌入了」</b>;错配：<b>「你在乎的是确定「在自注意力的计算里，token 有多相似」。而自注意力的计算发生在哪里？在注意力层。但这里我说的是什么？我说，我们来算这些嵌入，然后把它们加在这里。而实际上我们想要的，是在注意力层里反映这个相似度」</b>。<br>⭐ 纲领：<b>「我们主要想让这个直觉在多头注意力层里成立。所以这就是人们尝试过不同变体的原因之一 —— 而特别是，让这些位置嵌入直接在注意力层里介入，而不是在输入处」</b>;批评：<b>「当你在输入处做这件事的时候，它大致会是某个要进到这个注意力层里的东西，但它是有点间接的」</b>;做法：<b>「自注意力层基本上就是 softmax(QKᵀ 除以根号 d) 乘 V。所以我们想要的，是在那个 softmax 里面加一点小东西 —— 而那里基本上就是你量化「一个 token 和另一个 token 有多相似」的地方」</b>。",m:"⭐⭐ 「<b>算是吧</b>」的结构：<b>目标保留（近的更相似、远的更不相似）,手段换掉 ⇒ 量化那一半基本没变，注入那一半被整个重做</b>。<br>⭐ 而「间接」的技术内容是：<b>位置信息加在输入嵌入上后和词义混在同一个向量里，要先被 W_q、W_k 各投影一次，才间接影响到注意力分数 —— 而这两个矩阵是学出来的，没有机制保证位置信息被完好带过去</b>。<br>⭐ 那个加号的位置就是全部的设计：<b>它在 softmax 里面（影响权重分配）,它和 QKᵀ/√d 并列（和内容相似度同量级、同一个舞台）⇒ 注意力分数 ＝ 内容的相似度 ＋ 位置的亲疏</b>。",w:" 「<b>是的。是的，就是加。</b>」这个近乎好笑的简短回答是在打消一种怀疑：<b>位置信息这么重要，处理方式居然就是算一个同维向量加上去 —— 没有门控、没有拼接、没有专门的层</b>。<br>⚠ 而要加的那个 b 的形状要钉死：<b>QKᵀ 是 n×n，所以 b 也必须是 n×n；而它的第 (m,n) 个元素只依赖这一对位置，不依赖这两个位置上是什么词 ⇒ 于是「设计一个位置偏置」就变成了「给定一对位置输出一个数」这个很具体的问题</b>。",r:"⇒ 这个方向有一个很干净的说法：<b>如果你想影响一个量，就去改那个量，而不是去改它上游的某个东西然后祈祷影响能传过去</b>。<br>⇒ 而这个思路在深度学习里到处都是：<b>想要稀疏就在损失里加 L1，而不是指望权重自己变稀疏；想要某个层的输出有某种分布，就直接在那里归一化</b>。<br>⇒ 更多（W_q / W_k 到底会不会破坏位置信息、b 的 n×n 形状与显存代价）见<b>深度笔记</b>。"});
  QUIZ(0,6,{t:"为什么后来的位置编码方案要从「加在输入嵌入上」改成「直接在注意力层里介入」？",o:["因为输入层加法在推理时不能缓存，太慢","因为 d_model 太大，在输入层加位置向量太占显存","因为输入层的加法会破坏词嵌入的范数","因为你真正想影响的量（token i 该多关注 token j）就在注意力层里，而加在输入上要先被 W_q、W_k 两次投影才间接传到那里 —— 讲者的词是「间接」; 直接改那个量，而不是改它上游然后祈祷影响传得过去"],a:3,w:"⇒ 而这成了接下来三代的共同纲领：T5 和 ALiBi 加在注意力分数上，RoPE 乘进 Q 和 K 里 —— 区别只在介入的方式。"});
});

  note("⚠ 论文标题就是动机：Train Short, Test Long",640,374,"g");},"<b>一个很好的提问，而回答的那一句是整个注意力机制里最实用的直觉之一。</b><br>⭐ 学生问：偏置加在这里，不会给「<b>最后那个要和为 1 的概率</b>」带来问题吗？讲者答：「<b>在 softmax 里面你想干什么都行，因为 softmax 反正会把它归一化掉。所以你可以把这个偏置想成：对离得远的东西它可能更负一些，而对离得近的东西没那么负</b>」 ⇒ <b>这句话解释了注意力里一大类操作为什么合法：causal mask 给未来位置加 −∞、padding mask 给填充位加 −∞、T5 的相对偏置、ALiBi 的线性罚 —— 全都是「在 softmax 里面动手」</b>。<br>⭐ 而第四代的名字是「<b>Attention with Linear Bias</b>」,出自那篇《<b>Train Short, Test Long</b>》—— <b>标题把问题和承诺一起说了</b>。");

  note("⚠ 而讲者很诚实：论文里的胜负和实践中的采纳，是两件不同的事",640,374,"r");},"<b>ALiBi 的做法和 T5 刚好相反，而这个对立你已经见过一次了。</b><br>⭐ 「<b>与其去学那些偏置，不如我们真的有一条确定性的公式 —— 它是那两个位置之间相对差的一个函数</b>」 ⇒ <b>把四代排一下，那个模式就跳出来了：① 学出来的向量加在输入；② 固定公式的向量加在输入（正弦）; ③ 学出来的标量加在分数（T5）; ④ 固定公式的标量加在分数（ALiBi）—— 一个漂亮的 2×2，两个维度是「学 vs 不学」和「加在输入 vs 加在分数」,而四代正好把四个格子填满了</b>。<br>⭐ 然后是一个很诚实的转折：「<b>所有这些论文总是互相比较，来看哪一个更强。但现实是：在今天的模型里，大多数模型实际上用的是另一种位置嵌入方法</b>」。");
  SUM(0,7,{h:"⭐ T5 / ALiBi 与那个 2×2",k:"<b>「你想加一点小东西，来反映这样一个事实：某些 token 相比其它 token，本该是更相似的」; 「T5 那篇论文⋯⋯他们尝试了这些相对位置偏置，做法是把上面那条公式里的那个偏置项学出来」; 「我们把所有的 m 减 n 分桶到一些桶里，然后就让模型去学这些量 —— 而这些量接着会被注入到 softmax 里」</b>。<br>⭐ 学生问「偏置会不会破坏那个和为 1 的概率」,回答是：<b>「在 softmax 里面你想干什么都行，因为 softmax 反正会把它归一化掉。所以你可以把这个偏置想成：对离得远的东西，它可能更负一些；而对离得近的东西，没那么负」</b>。<br>⭐ 第四代：<b>「我想是那篇《Train Short, Test Long》,它引入了这个叫 ALiBi 的方法。ALiBi 的意思，我相信是 Attention with Linear Bias」; 「与其去学那些偏置，不如我们真的有一条确定性的公式 —— 它是那两个位置之间相对差的一个函数」</b>;而转折是：<b>「所有这些论文，它们总是互相比较，来看哪一个更强一些。但现实是：在今天的模型里，大多数模型实际上用的是另一种位置嵌入方法」</b>。",m:"⭐⭐⭐ 四代填满一个 2×2：<b>两个维度是「学 vs 不学」和「加在输入 vs 加在分数」⇒ ① 学出来的向量/输入；② 固定公式的向量/输入（正弦）; ③ 学出来的标量/分数（T5）; ④ 固定公式的标量/分数（ALiBi）</b>。<br>⭐ 而「<b>softmax 反正会归一化</b>」解释了注意力里一大类操作为什么合法：<b>causal mask（给未来加 −∞）· padding mask · T5 的相对偏置 · ALiBi 的线性罚 —— 全都是在 softmax 里面动手，而归一化会把绝对数值的影响吸收掉，只留下相对大小</b>。<br>⭐ T5 的「相对」是<b>设计上免费拿到的</b>:<b>它的输入本来就是 m−n；而第二代费了九分钟三角推导才让点积变成相对距离的函数</b>。",w:" 必须分桶，不是为了省参数：<b>m−n 的取值范围无界 ⇒ 若每个距离配一个可学参数，训练时没见过的距离就没有参数，又回到第一代的局限二。而 T5 的桶是对数式的不均匀划分：近处精细（距离 1/2/3/4 各一桶）、远处粗糙（100 到 200 共用一桶）—— 因为近处的差别要紧，远处「很远」就够了</b>。<br>⚠ 而论文里的胜负和实践中的采纳是两件事：<b>论文的对比总是在作者自己选的设置上做的，而实践还要考虑实现复杂度、生态与 KV cache 的兼容</b>。",r:"⇒ 「Train Short, Test Long」这个标题把第一代的局限二当成了卖点：<b>在 512 上训练、推理时跑 2048 甚至 4096 而性能不塌 —— 而在 2021 年，把训练长度拉长的代价是平方级的，所以「短训练、长推理」是实打实的省钱</b>。<br>⇒ 而「大多数模型用的是另一种」指的就是下一段的 <b>RoPE</b> —— 它恰好跳出了这个 2×2：<b>既不是加在输入、也不是加在分数，而是乘进 Q 和 K 里</b>。<br>⇒ 更多（T5 分桶的具体对数公式、ALiBi 每个头不同斜率的设计）见<b>深度笔记</b>。"});
  QUIZ(0,7,{t:"T5 的相对位置偏置为什么必须把 m−n 分桶，而且分得不均匀？",o:["因为 m−n 的取值范围无界：若每个距离配一个可学参数，训练时没见过的距离就没有参数（又回到第一代的局限二）;而不均匀（对数式）是因为近处的差别要紧、远处只要知道「很远」就够了","为了让偏置矩阵保持对称，满足 softmax 的要求","为了省显存，因为 n×n 的偏置矩阵太大","因为分桶之后才能用整数索引，GPU 查表更快"],a:0,w:"⇒ 而 ALiBi 的做法恰好相反：不学了，换一条关于相对差的确定性公式 —— 四代正好填满「学 vs 不学 × 加在输入 vs 加在分数」这个 2×2。"});
});

KP("9 · ⭐⭐ 两行证明：乘上旋转矩阵，就是转那个角",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$R(\\theta)\\,v \\;=\\; R\\,\\big(\\cos(\\theta+\\varphi),\\ \\sin(\\theta+\\varphi)\\big)$$","top");
  says("34:05","You can also write v as R with vector cosine of phi and sine of phi",192);
  says("34:42","you can show that rotation times this v can be expressed as R of cosine of theta plus phi",218);
  note("⭐ 请看结论的形状：角度加了 θ，长度一点没动",640,254,"y");
  note("⇒ 把向量拆成「长度 R」＋「纯方向 (cos φ, sin φ)」,后者是单位向量",640,288,"g");
  note("⚠⚠ 记号坑：这里的 R 是范数，而 R(θ) 是旋转矩阵 —— 同一个字母两个意思",640,322,"r");
  note("⭐ 那个乘法他留给你：展开用的就是 cos(a+b) 和 sin(a+b) 两条和角公式",640,356,"v");},"<b>翻译完成，结论出来了 —— 而请看它的形状。</b><br>⭐ 「<b>这些就是向量的范数、以及 φ（它相对于 x 轴的夹角）。你也可以把 v 写成 R 乘以向量 (cos φ, sin φ)⋯⋯而你可以证明：旋转矩阵乘以这个 v，可以表达成 R 乘以 (cos(θ+φ), sin(θ+φ))。我就把那个乘法留给你们</b>」。<br>⭐ 把那个乘法真做一遍（讲者留的练习）,用的就是和角公式：<b>第一行 cosθ·(R cos φ) − sinθ·(R sin φ) = R cos(θ+φ); 第二行 sinθ·(R cos φ) + cosθ·(R sin φ) = R sin(θ+φ) ⇒ 角度加了 θ，长度一点没动</b>。<br>⚠⚠ 记号上有个坑：<b>这里的 R 是「范数」,而上一镜那个 R(θ) 是「旋转矩阵」—— 同一个字母两个意思，看公式时要靠上下文分辨</b>。");

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⭐ 位置嵌入这一整段收口 —— 而值得看一眼它占了多少时间",640,222,"y");

  SUM(0,11,{h:"⭐⭐⭐ RoPE 的两个好处",k:"<b>「如果你记得你的注意力公式 —— 你有 query 乘 key 转置。那么如果你把 query 旋转一个角度 m、把 key 旋转一个角度 n，你最终得到的是一条公式，它有角度 θ 和 n 减 m 的旋转矩阵。而这很棒，因为这是这两个位置之间相对距离的函数」; 「我为什么要讲这么细？事实是今天大多数模型都用 RoPE，而这就是它为什么重要」; 「由 query 和 key 给出的注意力权重的上界，是这样的：我们观察到一个长程衰减。意思是，当 n 减 m 很大时，我们确实看到那个上界变得越来越小。嗯，你看到这些小的振荡，它也不是完美的」</b>。<br>⭐ 三个提问：<b>「相对距离是被捕获在那个旋转矩阵里的？」——「正是如此」; 「theta 是什么？」——「theta 其实是固定的。你们还记得我讲过的那个 omega 吗？它基本上就是 i 和 d 的某个函数」; 「你扩展这个方法的办法，是按块来拥有这些 2 维空间⋯⋯你会看到这个 theta 大致就等于 omega i」</b>;收口：<b>「我在这上面花了不少时间，因为我觉得这确实相当重要 —— 很多模型都用它⋯⋯那么，这就是位置嵌入」; 「在 RoFormer 那篇论文里，有一个附录，他们在那里数学上证明了它被某个量上界住」</b>。",m:"⭐⭐⭐ 好处一比第二代那个结论更强：<b>第二代的结果是一个标量（PE(m)·PE(n) 的那堆余弦之和），还要和内容信息混在一起；而 RoPE 得到的 R(θ(n−m)) 是一个夹在 q 和 k 之间的算子 —— 绝对位置在点积里自己消掉了</b>。<br>⭐ 位置信息「存放在哪里」,五代各不相同：<b>一、二代存在一个向量里 · 三、四代存在一个标量里 · RoPE 存在一个算子（变换）里</b>。<br>⭐ d 维的做法：<b>把向量切成 d/2 个 2 维块，第 i 块配一个自己的角度 θ_i = ω_i = 10000^(−2i/d) ⇒ 和第二代那张热力图是同一个频率谱：低频块转得慢、高频块转得快</b>。<br>⭐ 而 <b>θ 是固定的，不是学出来的</b>——<b>若它是学的，RoPE 就掉回「会过拟合」那一边，整个卖点就没了</b>。",w:" 好处二说的是「<b>上界</b>」而不是注意力权重本身，这个区别是实质性的：<b>权重本身不单调下降（有「小的振荡」）; 上界给出的是「远的最多只能有这么相似」,而不是「远的一定不相似」—— 模型仍然可以关注远处的词，只是要在内容上更有说服力</b>。<br>⚠ 而前面全部推导都是 <b>2 维</b>的：<b>一个 2×2 矩阵、一个角度、一个范数；而 query 和 key 是 64 或 128 维 —— 这个缺口由「按块」的构造补上，块对角矩阵尺寸必须是 d_k × d_k，所以 i 的范围必须是 1 到 d/2</b>。",r:"⇒ 那九分钟的 sin/cos 推导不是在讲一个过时方法：<b>它是在给 RoPE 铺直觉地基 —— 讲者自己点明了这件事</b>。<br>⇒ RoPE 原论文是《<b>RoFormer: Enhanced Transformer with Rotary Position Embedding</b>》,而那条长程衰减曲线在它的<b>附录</b>里 —— <b>想看严格推导就去那里，而讲者坦白「公式有点复杂，我们不打算把它写下来」</b>。<br>⇒ 位置嵌入占了这一讲三分之一的时间（32 / 107 分钟）,<b>而这个时间分配本身就是一个值得相信的判断</b>。<br>⇒ 更多（上界曲线的形状、θ 固定与 NTK 缩放、块对角实现细节）见<b>深度笔记</b>。"});
  QUIZ(0,11,{t:"RoPE 的「长程衰减」这个好处，讲者说的到底是什么在衰减？",o:["衰减的是注意力权重的「上界」——当 n−m 很大时上界越来越小，而权重本身还有「小的振荡」;所以它说的是「远的最多只能有这么相似」,不是「远的一定不相似」,模型仍可关注远处的词，只是要在内容上更有说服力","注意力权重本身单调下降，所以远的 token 一定不被关注","衰减的是梯度，所以远距离的依赖学不到","衰减的是 q 和 k 的范数，因为旋转会压缩长度"],a:0,w:"⇒ 而这条曲线的严格证明在 RoFormer 那篇论文的附录里 —— 讲者坦白公式有点复杂，没有写下来。"});
});
KP("12 · ⭐ 第二个变过的部件：层归一化（add & norm）",function(){

  says("43:47","And that component is the layer normalization",166);
  says("44:17","We add them together, and then we normalize",192);
  note("⭐ Add & Norm 这一个方块里，装的是两个独立的机制",640,222,"y");
  boxNode(80,254,500,50,"Add ＝ 残差连接","b");
  boxNode(700,254,500,50,"Norm ＝ 层归一化","g");
  note("解决梯度在深网络里传不回去",330,328,"b");
  note("解决激活的尺度到处乱跑",950,328,"g");
  note("⚠ 它们被画在同一个方块里，但解决的是两个完全不同的问题",640,374,"r");},"<b>第二个部件登场，而讲者的切入点选得很好。</b><br>⭐ 「<b>位置嵌入是 transformer 里变了一点的一个部分⋯⋯现在我们要看另一个也变了一点点的部件 —— 而那个部件就是层归一化。如果你记得，你有那些写着 add and norm 的方块</b>」; 做法是：「<b>我们取这个子层的输入、以及这个子层的输出，我们把它们加起来，然后我们归一化。这是作者做的一个小技巧，而它在实践中被证明能改善收敛</b>」。<br>⭐⭐ 请注意 <b>Add & Norm 这一个方块里装的是两个独立的机制</b>:<b>Add 是残差连接，解决的是梯度在深网络里传不回去；Norm 是层归一化，解决的是激活的尺度到处乱跑 —— 它们被画在一起，但针对的是两个完全不同的问题</b>。");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$\\hat{x}=\\frac{x-\\mu}{\\sigma}$$");
  says("44:48","if you have a vector, sometimes the components of the vector can be super large, sometimes they can be super small",166);
  says("45:05","you are going to take your vector, and then subtract it by the computed mean",192);
  note("⭐⭐⭐ 盯住一个词：它说的是「你这个向量的分量」",640,224,"y");
  note("⇒ 均值和方差是在一个样本自己的 d 个分量上算的 —— 和别的样本完全无关",640,256,"g");
  note("⚠ 这就是 Layer 这个字的全部含义，也是它和 BatchNorm 的唯一区别",640,288,"r");},"<b>问题陈述很朴素，但请盯住一个词：它说的是「一个向量内部」的分量。</b><br>⭐ 「<b>如果你有一个向量，有时候这个向量的分量可以超级大，有时候可以超级小。这里的想法是把你这个向量的分量归一化到某个范围里⋯⋯你要取你的向量，然后把它减掉算出来的均值，然后基本上用它的标准差去归一化它</b>」。<br>⭐⭐⭐ 「<b>你这个向量的分量</b>」这几个字就是 LayerNorm 的定义核心：<b>均值 μ 和标准差 σ 是在「这一个样本自己的 d 个分量」上算出来的，和 batch 里别的样本完全无关 ⇒ 这就是 Layer 这个字的含义，也是它和 BatchNorm 的唯一区别</b>。<br>⭐ 两个动作两个作用：<b>减均值去掉整体偏移、除标准差把尺度拉成 1</b>。");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$y=\\gamma\\cdot\\frac{x-\\mu}{\\sigma}+\\beta$$","top");
  says("45:20","you are going to learn two quantities-- one, gamma, which is going to be the rescaling factor",192);
  says("45:43","what this does is it helps with training stability and with convergence time",218);
  note("⭐ 一个自然的疑问：归一化完又学 γ、β 缩放回去，不是白做了吗？",640,254,"y");

  note("⚠ 两个好处要分开：稳定性＝不会炸；收敛时间＝同样步数走得更远",640,356,"r");},"<b>公式补完了，而这里有一个值得想一想的设计。</b><br>⭐ 「<b>你要学两个量 —— 一个是 gamma，它是那个重新缩放的因子；然后是 beta，它是另一个你也要学的项⋯⋯而这个东西做的事是：它帮助训练的稳定性、以及收敛的时间</b>」。<br>⭐⭐ 一个很自然的疑问：<b>你费劲把它归一化成均值 0、方差 1，然后又学 γ 和 β 把它缩放平移回去 —— 这不是白做了吗？不是：归一化改的是优化的「起点」,而 γ 和 β 让模型自己决定「终点」—— 从一个良态的分布出发去调整，比从一个尺度乱跑的分布出发容易得多</b>。<br>⚠ 而那两个好处要分开看：<b>稳定性是「不会炸、不会死」,收敛时间是「同样的步数走得更远」—— 前者关乎能不能训，后者关乎要花多少钱</b>。");
  SUM(0,12,{h:"⭐ Add & Norm 与 γ、β",k:"<b>「所以位置嵌入是 transformer 里变了一点的一个部分⋯⋯那么现在我们要看 transformer 的另一个部件，它也变了一点点 —— 而那个部件就是层归一化⋯⋯你有那些写着 add and norm 的方块」; 「这里我们做的是：我们取这个子层的输入、以及这个子层的输出，我们把它们加起来，然后我们归一化。所以这是作者做的一个小技巧。而它在实践中被证明能改善收敛」</b>。<br>⭐ 做法：<b>「如果你有一个向量，有时候这个向量的分量可以超级大，有时候它们可以超级小。这里的想法是把你这个向量的分量归一化到某个范围里」; 「你要取你的向量，然后把它减掉算出来的均值 —— 那基本上就是它各个分量的和 —— 然后基本上用它的标准差去归一化它」; 「而你要做的是，你要学两个量 —— 一个是 gamma，它会是那个重新缩放的因子；然后是 beta，它是另一个你也要学的项」; 「这个东西做的事是：它帮助训练的稳定性、以及收敛的时间」</b>。",m:"⭐⭐ <b>Add & Norm 这一个方块里装的是两个独立的机制</b>:<b>Add 是残差连接（解决梯度在深网络里传不回去）, Norm 是层归一化（解决激活的尺度到处乱跑）—— 画在一起，但针对两个完全不同的问题</b>。<br>⭐⭐⭐ 「<b>你这个向量的分量</b>」是 LayerNorm 的定义核心：<b>μ 和 σ 是在这一个样本自己的 d 个分量上算的，和 batch 里别的样本完全无关 ⇒ 这就是 Layer 这个字的含义</b>。<br>⭐ 而 γ、β 不是白做：<b>归一化改的是优化的起点，γ 和 β 让模型自己决定终点 —— 从一个良态分布出发去调整，比从一个乱跑的分布出发容易得多</b>。",w:" 两个好处要分开理解：<b>稳定性是「不会炸、不会死」（没有归一化时，某一层的激活爆大会让后面所有层的梯度一起爆）; 收敛时间是「同样的步数走得更远」—— 前者关乎能不能训，后者关乎要花多少钱</b>。<br>⚠ 而减均值和除标准差也是两个动作：<b>前者去掉这个向量的整体偏移（归一化后均值为 0）,后者把尺度拉成 1 —— 下一段 RMSNorm 砍掉的正是前者</b>。",r:"⇒ 残差和归一化虽然画在同一个方块里，但在后来的架构演化里<b>各自走了不同的路</b>:<b>残差连接八年没动过，而归一化既换了位置（post→pre）又换了算式（LayerNorm→RMSNorm）</b>。<br>⇒ 更多（残差为什么能救梯度、γ/β 的参数量、归一化与学习率的互动）见<b>深度笔记</b>。"});
  QUIZ(0,12,{t:"LayerNorm 里的均值 μ 和标准差 σ 是在什么范围上算出来的？",o:["在整个 batch 的同一个维度上算的，所以依赖 batch 大小","在整个训练集上算一次，然后固定下来","在前一层的权重矩阵上算的","在一个样本自己的 d 个分量上算的，和 batch 里别的样本完全无关 —— 这就是 Layer 这个字的含义，也是它和 BatchNorm 的唯一区别"],a:3,w:"⇒ 而归一化之后又学 γ 和 β 并不是白做：归一化改的是优化的起点，γ 和 β 让模型自己决定终点。"});
});
KP("13 · ⭐ 两处改动：post-norm → pre-norm，LayerNorm → RMSNorm",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("46:21","what we have done is to change where the normalization is located",166);
  says("46:40","which basically consists of having the LayerNorm right before the vector goes into the sublayer",192);
  note("⭐ 第一处改动：只是把一个操作挪了个位置 —— 而差别只在括号",640,222,"y");
  boxNode(80,254,500,50,"post-norm：Norm(x ＋ 子层(x))","r");
  boxNode(700,254,500,50,"pre-norm：x ＋ 子层(Norm(x))","g");
  note("原论文的版本",330,328,"r");
  note("⇒ 残差这条路上再没有归一化挡着",950,328,"g");
  note("⚠ 子层既可以是注意力层也可以是 FFN ⇒ 一个 block 里有两处归一化",640,374,"v");},"<b>这是第一处改动，而它只是把一个操作挪了个位置。</b><br>⭐ 「<b>我们从「归一化（输入 ＋ 子层的输出）」变成了「输入 ＋ 子层(归一化后的输入)」的和。换句话说，我们做的是改变归一化所处的位置 —— 在 transformer 论文里它是我们现在叫做 post-norm 的版本，而如今我们用 pre-norm 版本</b>」; 而 pre-norm 就是「<b>把 LayerNorm 放在向量进入子层之前，而这里的子层可以是注意力层，也可以是 FFN</b>」。<br>⭐⭐ 请把两条式子对齐看，差别只在括号：<b>post-norm 的残差路径上压着一个归一化，梯度回传时每一层都要穿过它；而 pre-norm 的残差是一条干净的直路 —— 这就是为什么深层模型几乎全都转向了 pre-norm</b>。");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$y=\\gamma\\cdot\\frac{x}{\\sqrt{\\frac{1}{d}\\sum_j x_j^2}}$$","top");
  says("46:56","nowadays, people, they do not use LayerNorm. They use something else called RMSNorm",192);
  says("47:19","they just normalize x by the root mean square of the components of x, and they learn gamma, only gamma",218);
  note("⭐ RMSNorm 砍掉了两样东西：减均值 μ，和偏置 β",640,254,"y");
  note("⇒ 所以它不做中心化（均值不一定是 0）,也没有平移，只有缩放",640,288,"g");
  note("⭐ 而理由是那个熟悉的模式：收敛性质相当，但参数更少、更快",640,322,"b");
  note("⚠ 第三次见这个模式了 —— 两个方案打平时，选结构上更干净的那个",640,356,"r");},"<b>第二处改动，而这次变的是算式本身。</b><br>⭐ 「<b>如今人们不用 LayerNorm 了。他们用另一个东西，叫 RMSNorm —— Root Mean Square Normalization，均方根归一化⋯⋯与其算那个，他们就用 x 各分量的均方根去归一化 x，而且他们学 gamma —— 只学 gamma</b>」 ⇒ <b>对照 LayerNorm，被砍掉的是：① 减均值 μ（所以不做中心化，归一化后均值不一定为 0）; ② 偏置 β（所以只有缩放、没有平移）</b>。<br>⭐ 理由很干脆：「<b>他们展示了收敛性质基本上是相当的。但这里你要学的参数更少，所以它基本上更快</b>」 ⇒ <b>这是今天第三次见这个模式了：两个方案指标打平时，选那个结构上更干净的 —— 而 LLaMA、Mistral、Qwen 全都用 RMSNorm</b>。");
  SUM(0,13,{h:"⭐ pre-norm 与 RMSNorm",k:"<b>「所以我们从「归一化（输入 ＋ 子层的输出）」,变成了「输入 ＋ 子层(归一化后的输入)」的和。所以换句话说，我们做的是改变归一化所处的位置。所以这里在 transformer 论文里，它是我们现在叫做 post-norm 的版本。而如今我们用 pre-norm 版本」; 「它基本上就是把 LayerNorm 放在向量进入子层之前。而这里的子层，可以是注意力层，也可以是 FFN」</b>。<br>⭐ 第二处：<b>「但不只是那个，还有另一个变化。所以如今，人们不用 LayerNorm 了。他们用另一个东西，叫 RMSNorm —— RMS，Root Mean Square，Normalization」; 「与其算这个，人们基本上做的是：他们就用 x 各分量的均方根去归一化 x，而且他们学 gamma —— 只学 gamma」; 「那他们为什么这么做？基本上，他们展示了收敛性质基本上是相当的。但这里你要学的参数更少，所以它基本上更快」</b>。",m:"⭐⭐ post-norm 和 pre-norm 的差别只在括号，但后果很大：<b>post-norm 的残差路径上压着一个归一化，梯度回传时每一层都要穿过它；而 pre-norm 的残差是一条干净的直路 ⇒ 深层模型几乎全都转向了 pre-norm</b>。<br>⭐ RMSNorm 砍掉的正是 LayerNorm 的两样东西：<b>减均值 μ（不做中心化）和偏置 β（没有平移，只有缩放）</b>。<br>⭐ 而那个决策模式今天第三次出现：<b>第二代位置编码（效果相当但多一个外推性质）· ALiBi 之后的 RoPE · RMSNorm（收敛相当但参数更少）⇒ 两个方案打平时，选结构上更干净的那个</b>。",w:" 「子层」这个词决定了归一化在一个 block 里出现几次：<b>子层一是多头注意力、子层二是 FFN ⇒ 每个 block 里有两处归一化、两处残差加法</b>。<br>⚠ 而「人们不用 LayerNorm 了」听起来绝对，但对今天的主流 LLM 基本成立：<b>LLaMA、Mistral、Qwen 这些都用 RMSNorm；而 BERT、GPT-2 那一代用的还是 LayerNorm</b>。",r:"⇒ 这两处改动合起来说明了一件事：<b>八年里 transformer 的骨架没动，而动的全是这种「同样功能、更干净的实现」—— 位置编码从加在输入换成旋转 Q/K，归一化从 post 搬到 pre、从 LayerNorm 砍成 RMSNorm</b>。<br>⇒ 更多（pre-norm 为什么对深层更友好、RMSNorm 省下的参数量实测、各模型用哪种归一化）见<b>深度笔记</b>。"});
  QUIZ(0,13,{t:"RMSNorm 相比 LayerNorm 砍掉了什么？为什么大家都换过去了？",o:["砍掉了 γ，只保留 β；因为 γ 容易梯度爆炸","砍掉了可学参数，整个变成无参数操作","砍掉了减均值 μ（不做中心化）和偏置 β（只有缩放、没有平移）;因为收敛性质和 LayerNorm 基本相当，而要学的参数更少、算得更快 —— 两个方案打平时选结构上更干净的那个","砍掉了除标准差这一步，只保留减均值；因为方差估计不稳"],a:2,w:"⇒ 而另一处改动是位置：post-norm 的残差路径上压着一个归一化，pre-norm 的残差是一条干净的直路 —— 所以深层模型几乎全都转向了 pre-norm。"});

KP("14 · ⭐ 两个很好的提问：为什么要归一化、和 BatchNorm 的区别",function(){

  says("47:35","they show that the convergence properties, they are basically comparable",166);

  says("48:45","the model is typically having trouble in learning the weights in each of these layers if these activations, they vary too much",218);
  note("⭐⭐⭐ 关键词是「变化太大」,而不是「太大」",640,250,"y");
  boxNode(80,282,500,50,"太大：缩一下就行","d");

  note("⚠ 上一层的权重刚适应一种尺度，下一批数据又换了一种 —— 这才是真正的麻烦",640,358,"r");},"<b>这个提问讲者评为好问题，而他的回答里顺手铺了一个术语。</b><br>⭐ 先把 RMSNorm 的理由补完：「<b>他们展示了收敛性质基本上是相当的</b>」—— <b>打平而更便宜，所以换</b>。然后学生问「<b>归一化背后的直觉是什么？</b>」,回答从一个名词开始：「<b>你看到的那个从这里走到那里的向量，基本上就叫做 activation（激活）</b>」。<br>⭐ 正题是：「<b>有时候激活在它某一部分分量上有极端值，有时候在另一部分。而如果这些激活变化太大，模型在学习这些层里每一层的权重时，通常会有困难</b>」。<br>⭐⭐⭐ 关键词是「<b>变化太大</b>」而不是「太大」:<b>如果激活一直很大，那缩一下就行；而问题是它一会儿大一会儿小、这个样本大那个样本小 —— 于是上一层的权重刚适应了一种尺度，下一批数据又换了一种</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("49:09","there is this key word, internal covariate shift",166);
  says("49:32","batch normalization is normalization across the other dimension, which is the dimension of the batch",192);
  says("50:10","because BatchNorm, you are basically also dependent on the batch",218);
  note("⭐⭐ 和 BatchNorm 的区别就一个字：方向",640,250,"y");
  boxNode(80,282,500,50,"LayerNorm：在一个样本的 d 个分量上","g");
  boxNode(700,282,500,50,"BatchNorm：在 batch 里同一个分量上","b");

  SUM(0,14,{h:"⭐ 归一化的直觉与 BatchNorm 的区别",k:"学生问「归一化背后的直觉是什么」,回答：<b>「这个直觉是：如果你看你的模型，你有好几层。在某些层里，你的向量 —— 更准确地说是你的激活⋯⋯你看到的那个从这里走到那里的向量，基本上就叫做 activation」; 「有时候激活在它某一部分分量上有极端值，有时候在另一部分。而如果这些激活变化太大，模型在学习这些层里每一层的权重时，通常会有困难。所以想法是把激活各分量的值带到某个不会在某个方向上偏太远的范围里」; 「万一你感兴趣，有这么一个关键词 —— internal covariate shift —— 它基本上就是给我在这里描述的这个现象起的那个名字」</b>。<br>⭐ 第二个提问：<b>「batch normalization 是沿着另一个维度做的归一化，也就是 batch 那个维度。所以假设你有一堆向量 —— 你做的是：把每一个分量，相对于「同一个维度上、但属于其它那些向量的」所有分量去归一化」; 「当涉及到这些基于 transformer 的模型时，人们典型地用 LayerNorm —— 可能是因为经验上它效果更好。但也因为 BatchNorm，你基本上也依赖于那个 batch。而它可以引入训练和推理之间的差异」</b>。",m:"⭐⭐⭐ 关键词是「<b>变化太大</b>」而不是「太大」:<b>如果激活一直很大，缩一下就行；而问题是它一会儿大一会儿小、这个样本大那个样本小 ⇒ 上一层的权重刚适应了一种尺度，下一批数据又换了一种</b>。<br>⭐⭐ 而 LayerNorm 和 BatchNorm 的区别只有一个字：<b>方向</b>。<b>同样一个数值矩阵，LayerNorm 横着归一化（一个样本自己的 d 个分量）, BatchNorm 竖着归一化（batch 里所有样本的同一个分量）</b>。<br>⭐ transformer 选 LayerNorm 的硬理由是：<b>BatchNorm 依赖 batch ⇒ 推理时常常只有一个样本，必须改用训练期攒的滑动平均，于是训练和推理的行为不一致；而对变长序列，它还要面对「这个位置上有几个样本有值」的麻烦</b>。",w:" internal covariate shift 出自 2015 年 BatchNorm 那篇论文，<b>它是归一化最初被提出时给的解释 —— 而后来的研究质疑过这个解释（有工作认为真正起作用的是让损失曲面更平滑）。但不管解释是哪一个，归一化确实有效，而这个词仍然是最常见的说法</b>。<br>⚠ 而 LayerNorm 和别的样本无关这件事有一个很实际的好处：<b>batch 多大都一样，batch 为 1 也一样 —— 这对推理极其重要</b>。",r:"⇒ 「<b>activation（激活）</b>」这个名词值得记住：<b>它就是层与层之间传的那些向量 —— 而显存里占最多的那一块通常就是它们（为反传而缓存的 activation）</b>。<br>⇒ 更多（internal covariate shift 的争议、BatchNorm 在变长序列上的具体麻烦、归一化与损失曲面平滑性）见<b>深度笔记</b>。"});
  QUIZ(0,14,{t:"为什么 transformer 用 LayerNorm 而不是 BatchNorm？",o:["因为 BatchNorm 只能用在卷积网络上，数学上不适用于序列","因为经验上 LayerNorm 效果更好，而且 BatchNorm 依赖 batch ⇒ 推理时常常只有一个样本，必须改用训练期攒的滑动平均，于是训练和推理的行为不一致；对变长序列它还要面对「这个位置上有几个样本有值」的麻烦","因为 BatchNorm 没有可学参数，表达力不够","因为 LayerNorm 的计算量更小"],a:1,w:"⇒ 两者的区别只有一个字：方向。LayerNorm 横着归一化（一个样本自己的 d 个分量）, BatchNorm 竖着归一化（batch 里所有样本的同一个分量）。"});
});

  note("⚠ 省不省，取决于实现 —— 不取决于那张图上画了几个格子",640,374,"v");},"<b>这是整个 L2 里最尖锐的一个提问，而它直指一个真实的矛盾。</b><br>⭐ 学生问「<b>你是在注意力矩阵算完之后才做这件事的吗？</b>」,讲者答「<b>你是说 softmax 对吧？所以你提了一个很好的点 —— 那就是：如果你要对所有东西做 softmax，那你为什么要做这件事？</b>」 ⇒ <b>如果实现是「先算完整的 n×n，再把窗口外的位置加上 −∞」,那你一分钱都没省</b>。<br>⭐ 而回答点出了一个关键词：「<b>在实践中，有一堆实现做了一些聪明的 —— 它叫 tiling —— 一堆聪明的操作，它们不涉及你在 softmax 里看到的那个巨大的矩阵运算</b>」 ⇒ <b>tiling（分块）就是 L4 FlashAttention 那一段的主角 —— 而这里要记住的是：省不省取决于实现</b>。");
  SUM(0,15,{h:"⚠ 注意力的 O(n²)",k:"<b>「我们看了位置嵌入，我们看了层归一化。那么现在我们要看 transformer 第三个重要的部件 —— 它是注意力。而特别是，我想有一件事我其实并没有真正强调过」; 「当你做自注意力时，你基本上让每一个 token 和所有其它 token 交互。所以当你看一个显示所有这些交互的矩阵时 —— 你有 n，序列长度」; 「你基本上有 O(n 平方) 的复杂度，而这很多，尤其是当 n 变得更长的时候」</b>。<br>⭐ 第一个变体：<b>「所以 2020 年出了这么一篇论文 —— LongFormer。它做的就是试了不同版本的注意力，办法是限制它作用的那个窗口」</b>;而那个尖锐的提问：<b>「你是在注意力矩阵算完之后才做这件事的吗？」——「你是说 softmax，对吧？所以你提了一个很好的点 —— 那就是：如果你要对所有东西做 softmax，那你为什么要做这件事？」; 「在实践中有一堆实现做了一些聪明的 —— 它叫 tiling —— 一堆聪明的操作，它们不涉及你在 softmax 里看到的那个巨大的矩阵运算」</b>。",m:"⭐⭐ 把平方算一遍，「很多」就具体了：<b>n 从 512 到 1024 翻一倍 ⇒ 计算量和显存都变 4 倍；而 128k 上下文相对 512 是 256 倍的 n、6 万多倍的注意力矩阵 ⇒ 长上下文从来不是「多开点显存」就行的事</b>。<br>⭐ 而视角在这里换了：<b>L1 把「每个 token 和所有 token 直接交互」当成能力来讲（相对 RNN 的长处）, 而这一段开始把同一件事当成账单来讲</b>。<br>⭐⭐⭐ 那个尖锐提问的要害是：<b>如果实现是「先算完整的 n×n，再把窗口外加 −∞」,那你一分钱都没省 ⇒ 省不省取决于实现，不取决于图上画了几个格子</b>。",w:" 「tiling（分块）」这个词要记住：<b>它是 L4 FlashAttention 那一段的主角 —— 真正把注意力的显存和计算省下来的，是「怎么算」这一层的工程，而不是「算哪些格子」这一层的设计</b>。<br>⚠ 而 LongFormer 这类设计的价值也不在省钱本身：<b>它把「哪些交互是必要的」这个问题提了出来，而这个问题的答案（局部为主、少量全局）后来被证明基本是对的</b>。",r:"⇒ 这段的三件事在今天的模型里全都还在：<b>滑动窗口（Mistral）· 局部与全局交错（Gemma、Llama 的部分版本）· tiling（FlashAttention，几乎所有人）</b>。<br>⇒ 更多（n² 的具体显存账、LongFormer 的三种注意力模式）见<b>深度笔记</b>。"});
  QUIZ(0,15,{t:"学生问「既然还是要对所有东西做 softmax，限制注意力窗口到底省了什么」—— 这个提问为什么尖锐？",o:["因为注意力矩阵其实不占显存，占显存的是 FFN","因为 softmax 本身是 O(n³)，窗口不影响它","因为限窗会让模型性能下降，所以不值得","因为如果实现是「先算完整的 n×n、再把窗口外的位置加上 −∞」,那一分钱都没省；真正省下来要靠 tiling（分块）这类「怎么算」层面的工程 ⇒ 省不省取决于实现，不取决于图上画了几个格子"],a:3,w:"⇒ 讲者当场承认这是个很好的点，并点出了 tiling 这个关键词 —— 而它就是 L4 FlashAttention 那一段的主角。"});
});

  note("⭐ 所以「cross-attention 怎么办」这个问题，在今天的主流模型里根本不出现",640,374,"r");},"<b>这个提问讲者本想推给 Shervine，但他还是把它正面回答了。</b><br>⭐ 「<b>我们要把这个用到自注意力和交叉注意力上吗？我不想剧透⋯⋯我们最在乎的是 decoder 里的东西</b>」; 而答案是：「<b>这个典型地是在 decoder 里的带掩码自注意力那里起作用的。但这个技术可以被应用在所有的注意力层里。不过我要告诉你们的是：现代的 LLM 是 decoder-only 模型，它基本上只有 transformer 的 decoder 那一部分</b>」。<br>⭐⭐ 两层答案要分开：<b>技术上所有注意力层都能用；而实践上主要用在 decoder 的带掩码自注意力，因为瓶颈在自回归生成那一侧 —— 而既然现代 LLM 是 decoder-only，「cross-attention 怎么办」这个问题在主流模型里根本不出现</b>。");

  SUM(0,19,{h:"⭐ 两个收尾提问",k:"<b>「所以问题是：我们要把这个用到自注意力和交叉注意力上吗？我不想剧透⋯⋯如果你看一下 transformer 架构 —— 我们很快会看到，我们最在乎的是 decoder 里的东西」; 「所以这个典型地是在 decoder 里的带掩码自注意力那里起作用的。但这个技术可以被应用在所有的注意力层里。不过我想我要告诉你们的是：现代的 LLM 是 decoder-only 模型，它基本上只有 transformer 的 decoder 那一部分」</b>。<br>⭐ 最后一问：<b>「你怎么知道你该用哪一个？」——「我会说这个选择永远是由几个因素驱动的。一个是它表现得多好。第二个是你有多在乎延迟、成本这类东西。所以它真的取决于你的模型有多大、你想在比如算力上省多少」; 「但我会说很多近期的模型，它们倾向于共享投影矩阵。所以典型来说，我会说 GQA 是你会看到的那个。但对所有模型来说不一定都是这样。好。我们时间不够了。所以我要请 Shervine 来讲第二部分。谢谢」</b>。",m:"⭐ 第一问的答案有两层：<b>技术上所有注意力层都能用；实践上主要用在 decoder 的带掩码自注意力，因为瓶颈在自回归生成那一侧 ⇒ 而既然现代 LLM 是 decoder-only，「cross-attention 怎么办」在主流模型里根本不出现</b>。<br>⭐ 第二问的答案是两个因素：<b>效果，以及你多在乎延迟和成本 ⇒ 模型越大、推理量越大，越值得用更激进的共享</b>。<br>⭐ 而实际默认值是 <b>GQA</b>——<b>它恰好是那个 2×2 里的中间档：既不是完全不共享（MHA），也不是全共享（MQA）</b>。",w:" 「现代 LLM 是 decoder-only」这句顺带的剧透其实很重要：<b>L1 和 L2 上半场一直在讲 encoder-decoder 的完整架构，而今天的主流模型只用了它的一半 —— 下半场专门讲这件事</b>。<br>⚠ 而「没有直截了当的答案」在这一段出现了第二次：<b>架构超参（窗口宽度、局部/全局配比、g 的取值）都属于这一类 —— 它们由实验和成本决定，不由理论决定</b>。",r:"⇒ 上半场的三件事可以这样收：<b>位置编码（五代，收在 RoPE）· 层归一化（两处改动，收在 pre-norm ＋ RMSNorm）· 注意力（两个正交变体，收在滑动窗口 ＋ GQA）—— 而这三件事就是「八年里那些轻微的变体」的全部内容</b>。<br>⇒ 更多（decoder-only 为什么赢了、各模型的具体配置表）见<b>深度笔记</b>。"});
  QUIZ(0,19,{t:"讲者给的实际默认值是哪一档共享？他的理由是什么？",o:["MHA，因为质量最高，而显存不是真问题","取决于序列长度：短序列用 MQA，长序列用 MHA","GQA ——「很多近期的模型倾向于共享投影矩阵，典型来说 GQA 是你会看到的那个」; 而选择由两个因素驱动：效果，以及你多在乎延迟和成本，所以没有直截了当的答案","MQA，因为 KV cache 最小，推理最便宜"],a:2,w:"⇒ 而这个技术主要用在 decoder 的带掩码自注意力上 —— 既然现代 LLM 是 decoder-only，cross-attention 的问题在主流模型里根本不出现。"});
});

  note("⭐⭐ 这个数字对比很有冲击力，而它顺带解释了参数量去哪儿了",640,222,"y");
  boxNode(80,254,500,50,"词表 3 万 × d_model","b");
  boxNode(700,254,500,50,"⇒ 变成 256 × d_model","g");
  note("嵌入表动辄上千万参数",330,328,"b");
  note("⇒ 几乎可以忽略",950,328,"g");
  note("⚠ 代价是序列变长好几倍 —— 而注意力是 n² ⇒ 省下的参数用算力还回去了",640,374,"r");},"<b>这个数字对比很有冲击力，而它顺带解释了参数量去哪儿了。</b><br>⭐ 「<b>你有一个小得多的词表大小。所以与其有 3 万这个量级，你有 2 的 8 次方 —— 因为一个字节是 8 比特。然后你可以把每一个字符都表示成字节</b>」 ⇒ <b>嵌入表的大小是「词表 × d_model」,3 万词表动辄上千万参数；而 256 行的表几乎可以忽略</b>。<br>⚠ 但代价很实在：<b>一个字节一个 token，序列长度要变长好几倍 —— 而注意力是 n² ⇒ 省下来的参数，用算力还回去了。这就是为什么免 tokenizer 的路线至今没有成为主流</b>。<br>⭐ 然后是关于 T5 最该记住的一件事：「<b>目标函数和原始 transformer 做的那个有一点变化</b>」。");
  SUM(0,20,{h:"⭐ T5 家族",k:"<b>「所以我们要继续这一讲，对 transformer 格局里我们有的那些种类的模型做一些更深的深入。然后我们要对一个特定的、对分类场景非常有用的架构做一次深入」; 「所以这里我们讲 T5 这个模型家族。T5 是一篇论文，它是多个 T 的缩写。所以第一个是 transfer，然后是 text-to-text，transformers。所以这就是 T5 这个命名的来处」</b>。<br>⭐ 两个派生：<b>「然后它有了 mT5 —— m 代表 multilingual，那里在它被训练的数据上做了更多工作，以及在词表是在什么上面被计算出来的这件事上」; 「然后你有 ByT5，它是某种免 tokenizer 的方法 —— 在这里你放弃了「做 tokenization」这件事。而取而代之，你基本上在字节的层面上操作。所以 By 就是 byte」; 「而基本上，你有一个小得多的词表大小。所以与其有 3 万这个量级，你有 2 的 8 次方 —— 因为一个字节是 8 比特」</b>;以及：<b>「关于 T5 家族我想提的一件事是：目标函数和原始 transformer 做的那个有一点变化」</b>。",m:"⭐ T5 的名字拆开是 <b>Transfer Text-to-Text Transformer</b>——<b>那个 5 只是数 T 的个数，不是「第五代」; 而 Text-to-Text 是真正的卖点：翻译、分类、摘要、问答全都改写成「文本进、文本出」,一个模型一套流程做所有任务</b>。<br>⭐⭐ ByT5 的账要两边一起算：<b>嵌入表从「3 万 × d_model」（上千万参数）降到「256 × d_model」（几乎可忽略）; 但一个字节一个 token，序列长好几倍，而注意力是 n² ⇒ 省下的参数用算力还回去了</b>。<br>⭐ 而 mT5 说明了那几年一个典型的做法：<b>同一个架构，换数据、换词表，就是一个新模型</b>。",w:" ByT5 正好回答了 L1 那整段关于 tokenization 的讨论：<b>BPE、OOV、拼写错误这些麻烦全都来自那一层 —— 而 ByT5 的回答是「那一层可以整个拿掉」。但它至今没成主流，原因就是上面那笔算力账</b>。<br>⚠ 而嵌入表的大小是「<b>词表 × d_model</b>」这件事值得记住：<b>它解释了为什么多语言模型的参数量看起来虚高 —— 很大一块在嵌入表里</b>。",r:"⇒ 「一个模型做所有任务」这个思路在今天已经是常识（所有任务都写成 prompt）,<b>而 T5 是最早把它当成架构卖点的那一批</b>。<br>⇒ 更多（T5 各尺寸的参数分布、ByT5 的实测长度膨胀、mT5 的词表构造）见<b>深度笔记</b>。"});
  QUIZ(0,20,{t:"ByT5 的「免 tokenizer」路线省下了什么、代价是什么？",o:["省下了位置编码，因为字节天然有序","省下了嵌入表（词表从 3 万降到 256，上千万参数变成几乎可忽略）;代价是一个字节一个 token、序列长好几倍，而注意力是 n² ⇒ 省下的参数用算力还回去了，所以这条路至今不是主流","省下了注意力的计算，代价是嵌入表变大","两边都省，所以它应该早就取代 BPE 了"],a:1,w:"⇒ 而 T5 这个名字拆开是 Transfer Text-to-Text Transformer —— 那个 5 只是数 T 的个数。"});
});
KP("21 · ⭐ span corruption：T5 换掉了训练目标",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("65:33","instead of putting everything to the encoder, you would leave blanks",166);
  says("65:44","so for example, my teddy bear is cute and reading",192);
  note("⭐⭐ 关键在那个「片段」:缺的不是一个词，是一整段",640,222,"y");
  boxNode(80,254,500,50,"原始 transformer：next token prediction","d");
  boxNode(700,254,500,50,"T5：span corruption（挖空重建）","y");
  note("⇒ 挖掉 my teddy bear，留下 is reading",330,328,"y");
  note("⚠ 一个空位可以对应任意长度的内容",950,328,"r");
  note("⭐ 而这个难度是刻意的：猜一个词靠局部搭配，补一整段要理解整句",640,374,"g");},"<b>做法本身很直观，而关键在那个「片段」上。</b><br>⭐ 「<b>你会有你的句子作为 encoder 的输入。而不是把所有东西都放进 encoder，你会留下一些空白。而这就是我们叫做 span corruption 的东西。然后这个 span corruption 可以是一个、也可以是多个 token 缺失</b>」; 例子还是那句招牌：「<b>比如说 my teddy bear is cute and reading，那么你可以把「my teddy bear」这段 span corrupted 掉，然后留下「is reading」</b>」。<br>⭐⭐ 挖掉的是<b>一整段</b>而不是一个词，<b>而这个难度是刻意的：猜一个被挖掉的词往往靠局部搭配就够了，而补一整段必须理解整句在说什么 —— 一个空位可以对应任意长度的内容</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("66:14","And then the T5 families calls them sentinel tokens",166);
  says("66:26","to find each of these spans in series",192);
  note("⭐⭐ 术语，以及 span corruption 最精巧的那一半：输出端",640,222,"y");
  boxNode(80,254,500,50,"输入：<X> is reading","b");
  boxNode(700,254,500,50,"输出：<X> my teddy bear <Y>","g");
  note("一个符号代表一整段",330,328,"b");
  note("⇒ decoder 只输出缺的部分，不重复原文",950,328,"g");
  note("⚠ 而下一个 sentinel token 就是「这一段讲完了」的信号 —— 长度由模型自己决定",640,374,"r");},"<b>这是该记住的那个术语，而它的妙处在于「一个符号代表一整段」。</b><br>⭐ 「<b>n 是「被损坏的 span 的数量」那个参数化⋯⋯T5 家族把它们叫做 sentinel tokens</b>」; 而输出端是：「<b>decoder 的工作就是按序把这些 span 一个个找出来 —— 你从一个标示第一个被损坏 span 的 token 开始，然后开始解码过程，直到它碰到一个预测出「下一个 sentinel token」的预测</b>」。<br>⭐⭐ 这一半很精巧：<b>decoder 只输出缺掉的那些片段，不重复原文 —— 而每一段的结束信号就是「下一个 sentinel token」, 于是每段的长度由模型自己决定。这比「告诉模型这里缺 3 个词」难得多，也更接近真实的理解</b>。");
  SUM(0,21,{h:"⭐ span corruption",k:"<b>「所以基本上你会有你的句子作为 encoder 的输入。而不是把所有东西都放进 encoder，你会留下一些空白。而这就是我们叫做 span corruption 的东西。然后这个 span corruption 可以是一个、也可以是多个 token 缺失」; 「所以如果我想举个例子 —— 比如说，my teddy bear is cute and reading。那么你可以把「my teddy bear」这段 span corrupted 掉，然后留下「is reading」」; 「然后 T5 家族把它们叫做 sentinel tokens」; 「然后 decoder 的工作就是按序把这些 span 一个个找出来。所以你从一个标示第一个被损坏 span 的 token 开始，然后你开始解码过程，直到它碰到一个预测出「下一个 sentinel token」的预测」</b>。",m:"⭐⭐ 关键在「<b>片段</b>」:<b>挖掉的是一整段而不是一个词 ⇒ 猜一个被挖掉的词往往靠局部搭配就够，而补一整段必须理解整句在说什么；而且一个空位可以对应任意长度的内容</b>。<br>⭐⭐ 输出端是最精巧的那一半：<b>decoder 只输出缺掉的片段、不重复原文，而每段的结束信号就是「下一个 sentinel token」⇒ 每段的长度由模型自己决定，这比「告诉它这里缺 3 个词」难得多</b>。<br>⭐ 而 sentinel token 的妙处是<b>一个符号代表一整段</b>:<b>输入 <X> is reading、输出 <X> my teddy bear <Y> —— 输入和输出用同一套符号对齐</b>。",w:" 这个目标函数的难度是<b>刻意的</b>:<b>它强迫模型去用双向的上下文（左边和右边都在），而这正是 encoder 的长处 —— 所以 span corruption 和 encoder-decoder 架构是配套的设计，不是随便换的</b>。<br>⚠ 而 next token prediction 只能看左边：<b>所以 decoder-only 模型不可能用这个目标函数训练</b>。",r:"⇒ 这件事在八分钟后会变成一个关键论据：<b>decoder-only 赢了的理由之一，就是 next-word prediction 比 span corruption「更容易扩大规模」—— 而那正是因为后者需要你去设计「怎么损坏」</b>。<br>⇒ 更多（T5 的损坏比例与片段长度超参、BERT 的 MLM 与它的区别）见<b>深度笔记</b>。"});
  QUIZ(0,21,{t:"T5 的 span corruption 和「下一个 token 预测」比，难在哪里？",o:["难在 decoder 必须把原文也一起重复输出一遍","难在 sentinel token 不在词表里，需要额外训练","难在挖掉的是一整段而不是一个词：补一整段必须理解整句在说什么，而且一个空位可以对应任意长度的内容 —— 每段何时结束由模型自己决定（信号是下一个 sentinel token）","难在要预测的 token 更多，所以算得更慢"],a:2,w:"⇒ 而这个难度是刻意的：它强迫模型用双向上下文，而那正是 encoder 的长处 —— 所以 span corruption 和 encoder-decoder 架构是配套设计。"});
});
KP("22 · ⭐ 那个括号、teacher forcing，与「忘掉 decoder」",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:03","So these parentheses is basically a shift from the next token prediction objective function",166);
  says("67:34","So you have sentinel tokens that denote some missing text",192);
  note("⭐ 他用的词是「转变」,而不是「改进」—— 这个中性很准确",640,222,"y");
  boxNode(80,254,500,50,"没说 improvement","d");
  boxNode(700,254,500,50,"也没说 complication","d");
  note("⇒ 只是「不一样」",330,328,"v");
  note("⚠ 而历史给了答案：换掉的这一步后来被放弃了",950,328,"r");
  note("⭐ 学生要求复述解码过程，而讲者当场确认：你说的完全正确",640,374,"g");},"<b>这一镜很短，但讲者的用词值得留意。</b><br>⭐ 「<b>所以这些括号基本上是对 next token prediction 这个目标函数的一个转变</b>」 ⇒ <b>「转变（shift）」是中性的：他没说 improvement（改进）, 也没说 complication（复杂化）, 只是「不一样」—— 而在一门课里，对一个后来被主流放弃的设计保持这种中性，是很专业的态度</b>。<br>⭐ 然后学生要求把解码过程再说一遍，而讲者的复述把这件事钉死了：「<b>你刚才说的关于重建那部分完全正确。所以你有 sentinel token，它们标示某些缺失的文本。所以你想要解码出来的就是那段缺失的文本</b>」 ⇒ <b>decoder 的任务不是重建整句，只是把那些洞填上</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:50","you do a teacher-forcing mechanism where you input everything in the decoder",166);
  says("68:18","you just forget about the decoder and then just deal with the encoder",192);
  note("⭐⭐⭐ teacher forcing 解释了训练和推理为什么看起来完全不同",640,222,"y");
  boxNode(80,254,500,50,"训练：把正确答案整段喂进 decoder","g");
  boxNode(700,254,500,50,"推理：只能一个个往外吐","r");
  note("⇒ 所有位置并行算，一次重建全部",330,328,"g");
  note("⇒ 上一步错了，后面就顺着错下去",950,328,"r");
  note("⭐ 而第二类架构：干脆忘掉 decoder ——「你这样没法做生成啊」「是的，那正是重点」",640,374,"v");},"<b>这是一个很重要的机制，而它解释了训练和推理为什么看起来完全不同。</b><br>⭐ 「<b>如果你想知道训练是怎么工作的 —— 你做一个 teacher-forcing 机制，在那里你把所有东西都输入到 decoder 里，然后试着一次性把所有东西重建出来</b>」 ⇒ <b>训练时把正确答案整段喂进 decoder（配上因果掩码）, 所有位置并行算；而推理时没有正确答案，只能一个个往外吐，上一步错了后面就顺着错下去 —— 这个差距叫 exposure bias</b>。<br>⭐ 然后是第二类架构，而这段对话很漂亮：「<b>你有这个 encoder/decoder 结构，而你干脆忘掉 decoder，只处理 encoder。所以你可能会跟我说：好，嘿，你这样没法做生成啊。而我会回答你：是的，那正是重点</b>」。");
  SUM(0,22,{h:"⭐ teacher forcing 与「忘掉 decoder」",k:"<b>「所以这些括号基本上是对 next token prediction 这个目标函数的一个转变」</b>;学生要求复述解码过程，回答：<b>「所以你刚才说的关于重建那部分完全正确。所以你有 sentinel token，它们标示某些缺失的文本」</b>;训练机制：<b>「然后如果你想知道训练是怎么工作的 —— 你做一个 teacher-forcing 机制，在那里你把所有东西都输入到 decoder 里，然后试着一次性把所有东西重建出来」</b>。<br>⭐ 第二类架构：<b>「然后现在我们要讲另一类 transformer —— 基本上你有这个 encoder/decoder 结构，而你干脆忘掉 decoder，只处理 encoder。所以你可能会跟我说：好，嘿，你这样没法做生成啊。而我会回答你：是的，那正是重点」</b>。",m:"⭐⭐⭐ <b>teacher forcing</b> 解释了训练和推理为什么看起来完全不同：<b>训练时把正确答案整段喂进 decoder（配因果掩码）,所有位置并行算、一次重建全部；推理时没有正确答案，只能一个个往外吐，上一步错了后面顺着错下去 ⇒ 这个差距叫 exposure bias</b>。<br>⭐ 而「<b>转变（shift）</b>」这个中性用词很准确：<b>他没说 improvement 也没说 complication —— 而历史给了答案：这一步后来被主流放弃了</b>。<br>⭐ 「<b>是的，那正是重点</b>」这句翻转很漂亮：<b>不能生成不是缺陷，它是分工 —— encoder-only 的目标从来不是生成</b>。",w:" decoder 的任务不是重建整句，<b>只是把那些洞填上</b>——<b>所以输出序列比输入短得多，而这也是 span corruption 效率上的一个好处</b>。<br>⚠ 而 teacher forcing 不是 T5 独有的：<b>所有自回归模型的训练都这么做 —— 它是「训练能并行、推理不能并行」这个根本不对称的来源</b>。",r:"⇒ exposure bias 这个词值得记住：<b>它是后来一大批工作（scheduled sampling、强化学习微调）要解决的问题 —— 而今天 RLHF 之所以有效，一部分原因也在这里</b>。<br>⇒ 更多（因果掩码与并行训练的细节、exposure bias 的缓解手段）见<b>深度笔记</b>。"});
  QUIZ(0,22,{t:"teacher forcing 是什么，它造成了什么后果？",o:["它是一种让老师模型指导学生模型的蒸馏方法","它是训练时把正确答案整段喂进 decoder（配因果掩码）、所有位置并行算；而推理时没有正确答案、只能一个个往外吐，上一步错了后面顺着错下去 —— 这个训练与推理的差距叫 exposure bias","它只在 T5 这类 encoder-decoder 模型里出现，decoder-only 不用","它是在损失里强制对齐 encoder 和 decoder 的表示"],a:1,w:"⇒ 而它是「训练能并行、推理不能并行」这个根本不对称的来源 —— 所有自回归模型的训练都这么做。"});
});

  note("⭐ 那个假设是「encoder 那部分对拿到 decoder 的表示非常有用」",640,374,"y");},"<b>第三类架构，而它的结构简洁到让人意外。</b><br>⭐ 「<b>今天的 LLM 把 encoder 那部分整个去掉了。而当你没有 encoder 时，你在你那堆叠起来的 encoder 的末端就没有 encoder 嵌入可以喂给 cross-attention。所以这个模块整个消失了</b>」 ⇒ <b>于是每个 block 只剩两样：带掩码自注意力 ＋ FFN。L1 里那个三层 block（自注意力、交叉注意力、FFN）在今天的模型里只剩两层</b>。<br>⭐⭐ 而那场转向的本质是一个<b>假设被推翻</b>:「<b>你过去有这种类似 transformer 的架构，它在一开始很流行，那时主要的假设是：encoder 那部分对于得到 decoder 的表示非常有用。但随着时间过去，人们意识到⋯⋯</b>」。");

  SUM(0,23,{h:"⭐⭐ decoder-only 为什么赢了",k:"<b>「所以它有 encoder 的表示，这些表示可以用在那些可能更偏向分类的任务上。所以情感抽取、token 分类、所有这些过去要用专门的语言模型来做的事情 —— 它们都能用 transformer 的 encoder 部分来做」; 「所以 BERT —— 我会说它是这个格局里最中心的那个 —— 然后另外两个架构，DistilBERT 和 RoBERTa，它们是在若干条改进的轴上做探索的」</b>。<br>⭐ 第三类：<b>「就像 Afshine 刚提到的，今天的 LLM 把 encoder 那部分整个去掉了。而当你没有 encoder 时，你在你那堆叠起来的 encoder 的末端就没有 encoder 嵌入可以喂给 cross-attention。所以这个模块整个消失了」; 「那时主要的假设是：encoder 那部分对于得到 decoder 的表示非常有用。但随着时间过去，人们意识到⋯⋯」; 「然后有更多的投入流向了那种我会说「最容易扩大规模和泛化」的任务 —— next-word prediction —— 而不是我刚刚为 T5 提到的那个任务，那个可能更定制。所以你得去损坏一些东西」; 「而它被证明创造了奇迹，而且和「做一个有帮助的那种聊天机器人」这个任务高度对齐 —— 而那基本上就是今天主要的应用」</b>。",m:"⭐⭐ decoder-only 的结构简洁到让人意外：<b>没有 encoder ⇒ 没有 encoder 嵌入 ⇒ cross-attention 整个消失 ⇒ 每个 block 只剩「带掩码自注意力 ＋ FFN」—— L1 里那个三层 block 在今天只剩两层</b>。<br>⭐⭐⭐ 第一个理由比「简单就是好」要深：<b>next-word prediction 不需要任何设计，任何一段文本都是现成的训练样本；而 span corruption 要你先决定损坏什么、损坏多少、片段多长 ⇒ 那是超参，而超参是扩规模的摩擦</b>。<br>⭐ 第二个理由是运气成分：<b>「和做一个有帮助的聊天机器人这个任务高度对齐」—— 这件事在 2018 年几乎不可能预料到</b>。",w:" encoder-only 的价值在那句「<b>过去要用专门的语言模型来做的事情</b>」里：<b>在 BERT 之前每个任务都要自己训一个模型；BERT 之后，一个预训练 encoder 加一个小分类头就够了 —— 这才是那一代的真正贡献</b>。<br>⚠ 而「那正是重点」这句翻转要记住：<b>不能生成不是缺陷，它是分工</b>。",r:"⇒ 这一讲的收口很清楚：<b>上半场讲了八年里变过的三个部件（位置编码、归一化、注意力）, 下半场讲了三类架构，而赢的那一类是结构最简单、训练目标最不需要设计的那一类</b>。<br>⇒ 而 decoder-only 的细节是后面几讲的核心内容，<b>这里只需要带走那两个理由</b>。<br>⇒ 更多（那个假设被推翻的实证过程、三类架构的流行度曲线）见<b>深度笔记</b>。"});
  QUIZ(0,23,{t:"讲者给的「decoder-only 赢了」的两个理由是什么？",o:["① next-word prediction「最容易扩大规模和泛化」——任何一段文本都是现成样本，而 span corruption 要你先决定损坏什么、多少、多长（超参是扩规模的摩擦）;② 它恰好和「做一个有帮助的聊天机器人」这个任务高度对齐","① decoder 可以用 KV cache 而 encoder 不能；② 它支持更长的上下文","① encoder 在数学上被证明是冗余的；② 分类任务不再重要了","① 参数更少所以更便宜；② 不需要位置编码"],a:0,w:"⇒ 而被推翻的那个假设是「encoder 那部分对于得到 decoder 的表示非常有用」; 结构上，cross-attention 整个消失，每个 block 只剩带掩码自注意力 ＋ FFN。"});

  note("⚠ 所以 BERT 的全部创新都在「怎么训」那一侧，不在结构上",640,374,"r");},"<b>BERT 开讲，而讲者选了一个很好的大纲：名字本身。</b><br>⭐ 「<b>首先我们要从「BERT 是什么意思」开始看。BERT 是一个缩写，表示 Bidirectional Encoder Representations from Transformers。而我们要一起看这个缩写的每一部分各自对应什么</b>」 ⇒ <b>用名字当大纲是个好办法，而这个名字恰好把设计全写进去了：双向 · 只要 encoder · 产出表示 · 基于 transformer</b>。<br>⭐ 先从最容易的那个词开始：「<b>我们就从 encoder 那部分开始，它是最容易把握的。就像我们说的，我们就是把 decoder 扔了。所以这个「来自 transformer 的 encoder」基本上就是它字面上的意思</b>」 ⇒ <b>BERT 在结构上什么都没改，它的全部创新都在「怎么训」那一侧</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("72:39","we are able from a given input to get output representations that have attended to everything",166);

  note("⭐⭐ 这就是双向的全部内容，而对照项是「因果」",640,222,"y");
  boxNode(80,254,500,50,"BERT：每个 token 关注过一切","g");
  boxNode(700,254,500,50,"decoder：只能关注自己和之前","r");

  note("⚠ causal 这个词是借来的：它说的是「结果不能影响原因」—— 未来不能影响现在",640,374,"v");},"<b>这就是双向的全部内容，而讲者选的对照项很有意思。</b><br>⭐ 「<b>这篇论文的结果是了不起的，因为我们能够从一个给定的输入，得到那种「每一个 token 都关注过一切」的输出表示。而这确实是这样的，因为既然我们只有 encoder，我们就有这个真正的双向性</b>」。<br>⭐ 对照是：「<b>这和你有的那种带掩码的自注意力形成对比 —— 那个掩码是让注意力机制变成因果的，所以每个 token 都能关注它自己、以及它之前的那些 token</b>」 ⇒ <b>「因果（causal）」这个词是从物理和统计里借来的：它说的是「结果不能影响原因」—— 在序列里就是「未来不能影响现在」。而 BERT 不做生成，所以它可以把这个限制整个去掉</b>。");

  says("73:25","saying that GPT came out, GPT they are not truly bidirectional",166);
  says("73:56","the mask is exactly there to prevent links from tokens to those that come after them",192);
  note("⭐⭐ 那个 truly 终于点名了 —— 这是一场同期的路线之争",640,222,"y");
  boxNode(80,254,500,50,"2018 年 6 月：GPT-1","b");

  note("⚠ 而这场争论的赢家在当时很清楚（BERT 刷榜）,在今天完全反过来了",640,374,"r");},"<b>那个 truly 终于点名了，而这是一场同期的路线之争。</b><br>⭐ 「<b>这也是作者在论文里讨论了很多的一件事 —— 他们说 GPT 出来了，而 GPT 它们不是真正双向的。而这些能被用于分类任务的编码，它们真的是双向的</b>」 ⇒ <b>时间线很紧：GPT-1 是 2018 年 6 月，BERT 是同年 10 月 —— 两条路线几乎同时出手，而当时的赢家很清楚（BERT 在十一个任务上刷新了纪录）; 但今天完全反过来了</b>。<br>⭐ 而学生确认了一次掩码的作用，讲者的措辞很干净：「<b>那个掩码就恰恰是在那里，用来阻止从一个 token 到它后面那些 token 的链接</b>」 ⇒ <b>「阻止链接」比「加负无穷」更准确地说出了它在做什么</b>。");
  SUM(0,24,{h:"⭐ BERT 这个名字",k:"<b>「所以首先我们要从「BERT 是什么意思」开始看。所以 BERT，它是一个缩写，表示 Bidirectional Encoder Representations from Transformers。而我们要一起看这个缩写的每一部分各自对应什么」; 「那么我们就从 encoder 那部分开始，它是最容易把握的。所以就像我们说的，我们就是把 decoder 扔了。所以这个「来自 transformer 的 encoder」基本上就是它字面上的意思」</b>。<br>⭐ 双向：<b>「这篇论文的结果是了不起的，因为我们能够从一个给定的输入，得到那种「每一个 token 都关注过一切」的输出表示。而这确实是这样的，因为既然我们只有 encoder，我们就有这个真正的双向性」; 「而这和你有的那种带掩码的自注意力形成对比 —— 那个掩码是让注意力机制变成因果的。所以每个 token 都能关注它自己、以及它之前的那些 token」; 「他们说 GPT 出来了，而 GPT 它们不是真正双向的。而这些能被用于分类任务的编码，它们真的是双向的」; 「而那个掩码就恰恰是在那里，用来阻止从一个 token 到它后面那些 token 的链接」</b>。",m:"⭐ 名字当大纲是个好办法，而这个名字把设计全写进去了：<b>Bidirectional（双向）· Encoder（只要 encoder）· Representations（产出表示而不是文本）· Transformers（底座）</b>。<br>⭐ 而 <b>BERT 在结构上什么都没改</b>:<b>它就是 transformer 的 encoder 堆叠 ⇒ 全部创新都在「怎么训」那一侧（MLM + NSP + 微调）</b>。<br>⭐⭐ 「<b>因果（causal）</b>」这个词是从物理和统计里借来的：<b>它说的是「结果不能影响原因」—— 在序列里就是「未来不能影响现在」; 而 BERT 不做生成，所以可以把这个限制整个去掉</b>。",w:" 这是一场同期的路线之争，时间线很紧：<b>GPT-1 是 2018 年 6 月、BERT 是同年 10 月 —— 当时的赢家很清楚（BERT 在十一个任务上刷新纪录）,而今天完全反过来了</b>。<br>⚠ 而「<b>阻止链接</b>」这个说法比「加负无穷」更准确地说出了掩码在做什么：<b>它改的是图的连通性，而不只是一个数值技巧</b>。",r:"⇒ 那个 <b>truly</b> 值得记住：<b>它是一个有针对性的词 —— 论文作者在用它区分自己和 GPT，而这类措辞在论文里通常都指向一场正在进行的争论</b>。<br>⇒ 更多（GPT-1 与 BERT 的指标对照、双向性在分类任务上的具体优势）见<b>深度笔记</b>。"});
  QUIZ(0,24,{t:"BERT 的「真正双向」具体指什么？它和 decoder 的差别在哪里？",o:["指它同时从左到右和从右到左各跑一遍，然后把两个结果拼起来","指它的位置编码是双向对称的","指它既能做分类又能做生成","指它没有因果掩码 ⇒ 每个 token 都关注过一切（左边和右边都在）; 而 decoder 的掩码让注意力变成「因果的」,每个 token 只能关注自己和之前的 —— BERT 不做生成，所以可以把这个限制整个去掉"],a:3,w:"⇒ 而这是一场同期的路线之争：GPT-1 是 2018 年 6 月、BERT 是同年 10 月，当时 BERT 赢了，今天反过来了。"});
});

  note("⭐ 两个方向各跑一遍再拼起来 ≠ 每个位置同时看到两边",640,374,"g");},"<b>讲者把 BERT 放进语境，而他对 ELMo 的评价带着一点惋惜。</b><br>⭐ 「<b>当时 NLP 这个领域正在爆发。所以同一年你还有另一篇里程碑论文，它叫 ELMo —— 也就是 Embeddings from Language Models。而我会说那篇论文的时机有点不幸</b>」; 做法是：「<b>它基于一个双向 LSTM，你有多个层，一层堆在另一层上面。而多亏这个架构，你能够为每一个词构建一个双向的表示</b>」。<br>⭐⭐ 但两种「双向」不是同一种东西：<b>ELMo 是两个单向 LSTM 各跑一遍再把结果拼起来 —— 每个方向内部仍然只看一边；而 BERT 的每个位置在每一层都同时看到两边。前者是「拼接的双向」,后者是「融合的双向」</b>。");

  note("⭐ 而那两个名字是《芝麻街》的角色 —— 研究者挺爱玩，缩写往往就是方法的摘要",640,358,"g");},"<b>这就是答案，而它又一次回到了那条贯穿全课的线。</b><br>⭐ 「<b>那么为什么它没有变得像 BERT 那样流行？是因为你有和之前那些模型一样的缺点 —— 基本上，因为这个递推，它很难 scale</b>」 ⇒ <b>这是这门课第三次用同一个理由解释一个历史结果：RNN 输给 transformer 是因为它、ELMo 输给 BERT 是因为它，而 L1 里 word2vec 之后的那一段也是它</b>。<br>⭐ 然后是最轻松的一段：「<b>你们很多人想到 ELMo 和 BERT 时，第一反应不是这两篇论文 —— 因为它们是《芝麻街》里的角色⋯⋯而研究者们普遍挺爱玩的，他们会试着把自己的缩写套进某些主题里</b>」 ⇒ <b>而这件事的实用面是：一个好的缩写往往就是方法的摘要</b>。");
  SUM(0,25,{h:"⭐ ELMo 与那个第三次的理由",k:"<b>「所以我只想把这篇论文放进语境里。而当时 NLP 这个领域正在爆发。所以同一年你还有另一篇里程碑论文，它叫 ELMo —— 也就是 Embeddings from Language Models。而我会说那篇论文的时机有点不幸」; 「所以 ELMo —— 就给个大概的脉络 —— 它基于一个双向 LSTM，你有多个层，一层堆在另一层上面。而基本上，多亏了这个架构，你能够为每一个词构建一个双向的表示」; 「那么为什么它没有变得像 BERT 那样流行？是因为你有和之前那些模型一样的缺点 —— 基本上，因为这个递推，它很难 scale」</b>。<br>⭐ 那段八卦：<b>「而我想你们很多人想到 ELMo 和 BERT 时，第一反应不是这两篇论文 —— 因为它们是《芝麻街》里的角色」; 「而研究者们，他们普遍挺爱玩的。他们会试着把自己的缩写套进某些主题里。所以如果你去看论文的名字，你会被娱乐到」</b>。",m:"⭐⭐ 两种「双向」不是同一种东西：<b>ELMo 是两个单向 LSTM 各跑一遍再把结果拼起来（每个方向内部仍只看一边）; 而 BERT 的每个位置在每一层都同时看到两边 ⇒ 前者是「拼接的双向」,后者是「融合的双向」</b>。<br>⭐⭐⭐ 而这门课第三次用同一个理由解释历史结果：<b>「因为这个递推，它很难 scale」——RNN 输给 transformer、ELMo 输给 BERT、L1 里那一段也是它 ⇒ 可并行性是这个领域里最硬的那条约束</b>。",w:" 「时机有点不幸」这个评价要公允地读：<b>ELMo 不是方法不好，它是在同一年遇到了一个可并行的对手 —— 而在那之后，所有基于递推的路线都很难再被投入资源</b>。<br>⚠ 而缩写的实用面：<b>ALBERT（A Lite BERT）· RoBERTa（Robustly optimized BERT approach）· DistilBERT（蒸馏）—— 名字本身就是方法的摘要，看名字能省很多时间</b>。",r:"⇒ 「可并行性」这条线值得单独记住：<b>它解释了 L1 的 RNN→transformer、L2 的 ELMo→BERT、以及后面 decoder-only 赢在「最容易扩大规模」—— 同一条约束在三个不同的地方给出了同一个答案</b>。<br>⇒ 更多（ELMo 的具体做法、拼接式双向的局限、《芝麻街》那串论文名）见<b>深度笔记</b>。"});
  QUIZ(0,25,{t:"ELMo 为什么没有像 BERT 那样流行？",o:["因为它没有开源，社区用不上","因为它的「双向」是两个单向 LSTM 拼起来的，而 BERT 是融合的","因为它的名字取自《芝麻街》,不够严肃","因为它基于递推（LSTM）——讲者的原话是「因为这个递推，它很难 scale」; 而这是这门课第三次用同一个理由解释历史结果：RNN 输给 transformer、ELMo 输给 BERT，都是因为可并行性"],a:3,w:"⇒ 它的「双向」确实也和 BERT 不同（拼接 vs 融合），但讲者给出的理由是 scale —— 而「时机有点不幸」说的是它遇到了一个可并行的对手。"});
});

  SUM(0,27,{h:"⭐ 多阶段训练",k:"<b>「关于这个模型有一件非常有意思的事可以看 —— 就是你有这个「多阶段训练」的概念。所以你不是一次就把模型训好的，你是分多个阶段做的」; 「而这个预训练 —— 我们会详细看 —— 是用两个目标函数做的，它们分别是 MLM 和 NSP。所以 MLM 代表 Masked Language Model。而 NSP 是 Next Sentence Prediction」; 「所以掩码语言模型，它是让模型去学输入的内部结构的一种方式。然后 NSP，它可以被看成是一种去看「句子的排序说不说得通」的方式」; 「所以我们会稍微深入看每一个，但它是作者假定对「学到高质量的通用嵌入」有帮助的一个目标函数的组合」; 「你保留你已经学到的那些嵌入，然后在它上面附上某个别的网络，典型是一个线性投影，来把你学到的那些嵌入微调到某个目标任务上。这就是我们叫做 fine tuning 的东西」</b>。",m:"⭐⭐⭐ 「多阶段训练」是 BERT 留给整个领域最重要的遗产：<b>第一阶段昂贵、一次性、在海量无标注数据上；第二阶段便宜、按任务做、只加一个线性投影 ⇒ 这就是今天「预训练 ＋ 微调」范式的原型</b>。<br>⭐⭐ 两个目标各管一层：<b>MLM 管词与词（学输入的内部结构）, NSP 管句与句（看排序说不说得通）—— 而讲者对两者的语气不同：一个说「它是」,一个说「它可以被看成是」</b>。<br>⭐⭐ 而那个动词是「<b>假定</b>」而不是「证明」:<b>BERT 论文没有证明 MLM+NSP 是最优组合 —— 后来 RoBERTa 把 NSP 整个去掉，效果更好</b>。",w:" 第二阶段最该注意的是<b>新加的部分有多小</b>:<b>典型只是一个线性投影 ⇒ 你不是在重新训一个模型，你是在一个已经理解语言的表示之上接一个很小的读出头</b>。<br>⚠ 而「假定」这个措辞值得学：<b>当一篇论文说「我们假定这个组合有帮助」时，它其实在告诉你这里还没被验证 —— 而那往往就是下一篇论文的入口</b>。",r:"⇒ 这套范式今天还在，只是名字换了：<b>预训练 → 指令微调 → 偏好对齐，还是同一个「一次昂贵、多次便宜」的结构</b>。<br>⇒ 更多（MLM 的 15% 掩码细节、NSP 的构造方式、RoBERTa 去掉 NSP 的实证）见<b>深度笔记</b>。"});

  SUM(0,34,{h:"NSP 的做法，与论文记号和量级",k:"<b>NSP</b>：<b>从语料选两个句子，50% 的时候按原顺序并排放、另一部分按随机顺序；目标是让 CLS 之上的某个分类头判断 A 和 B 是不是连续的 —— 「这就是它做的全部」</b>，而「<b>假设</b>是它也有助于学到有用的嵌入」。<b>记号对照</b>（BERT 论文换了套字母）：<b>L = 原来的 n（层数）、H = 原来的 d_model（嵌入维度）、A = 原来的小 h（头数）</b>。<b>量级</b>：<b>原始 transformer 有 12 个堆叠的 encoder/decoder；参数量级 1 亿</b>。",m:"★★★ 问题恰恰在于 NSP <b>太</b>简单（这是 RoBERTa 后来指出的）：<b>随机配的两个句子往往来自完全不同的文档、讲完全不同的主题 ⇒ 模型只要判断「这两句主题一致吗」就能做对，根本不需要理解「顺序」或「连贯性」</b> ⇒ <b>一个能靠浅层特征解决的任务，提供的学习压力很小</b>。这就是「假设」这个词第四次出现的原因（78:25、78:58、86:26、这里）。",w:"⚠ 记号对照表很实用，因为<b>同一个字母在两篇论文里意思不同</b>：<b>transformer 论文里 h 是头数，BERT 论文里 H 是嵌入维度（头数叫 A）</b> ⇒ 看到 <b>H = 768</b> 那是维度、<b>h = 12</b> 那是头数，<b>大小写差一点意思完全不同</b>。⇒ BERT 的两个配置值得记：<b>base（L=12, H=768, A=12）1.1 亿参数；large（L=24, H=1024, A=16）3.4 亿参数</b>，而 <b>base 的规模是为了和 GPT-1 可比而选的</b>（要论证「双向比单向好」就得让两边规模一样，否则比的是规模不是架构）。",r:"⭐ 读论文建议（这一讲第二次）：<b>BERT 这篇「读起来非常好」，和《Attention is All You Need》并列的里程碑，17 万引用</b>。★★★ 对照 Afshine 说 transformer 那篇「<b>非常密、只有几页长</b>」—— 差别是真实的：<b>Attention is All You Need 要在 9 页里提出一整个新架构，每句压缩到极限；而 BERT 是在已有架构上改，所以有篇幅解释动机、做消融、讨论对比</b> ⇒ <b>只读一篇的话先读 BERT</b>。⇒ 实用小知识：<b>cased / uncased 表示对数据做了什么预处理</b> —— <b>NER 必须用 cased</b>（Apple 和 apple 是公司和水果的关键线索），<b>情感分类 uncased 更好</b>（THIS IS AMAZING 和 this is amazing 意思一样），而 uncased 还顺带<b>提高词表利用率</b>。⚠ 这类「选哪个预训练版本」的决定<b>在实践中对效果的影响常常比调参更大</b>。⇒ 量级放到今天小得惊人（GPT-3 是 BERT large 的 500 倍），<b>但 BERT base 至今仍被大量使用 —— 1.1 亿参数能在普通显卡上跑、延迟毫秒级，对一个情感分类服务这比「更聪明」要紧得多</b>。"});
  QUIZ(0,34,{t:"RoBERTa 后来指出 NSP 的问题在哪？",o:["它需要额外的标注","它和 MLM 的梯度冲突","它的正负样本比例不对","它太简单：随机配的两句往往来自不同文档/主题 ⇒ 只要判断「主题一致吗」就能做对，不需要理解顺序或连贯性"],a:3,w:"⚠ 记号别混：transformer 论文里 h 是头数，BERT 论文里 H 是嵌入维度（头数叫 A）。BERT base 是 L=12, H=768, A=12，1.1 亿参数。"});

  note("⇒ 所以你有某个长度的隐藏层 ⇒ 典型地两个矩阵：一个投到隐藏层、一个从隐藏层到输出",640,364,"d");},"<b>这个提问问的是那个分类头的内部结构，而答案把形状说清楚了。</b><br><b>学生的问题</b>：<b><u>这个 FFN 对应的是什么？</u></b><br><b>讲者的回答</b>：<b>「<u>所以基本上你有一个「输出嵌入的维度」和「你感兴趣的那个任务」之间的映射。所以它可能是分成正面或者负面这样的分类。所以你有某个长度的隐藏层。所以你典型地有两个矩阵，来学从一个到那个隐藏层、然后从隐藏层到输出的投影。然后你学这些权重，来基于它在这里学到的那些嵌入去做那个分类任务</u>。」</b><br><b>★★ 所以这个分类头不一定只是一层线性，<u>它可以是「两层 + 一个隐藏层」</u></b>：<b>⇒ <u>768 → 隐藏层 → 2</u>。</b><b>⇒ 两个矩阵，中间一个非线性激活。</b><br><b>★★★ 注意这和 79:29 那镜说的「<u>典型是一个线性投影</u>」有一点出入，<u>而两者都对</u></b>：<b>⇒ <u>最简单的做法是一层线性</u>（768 × 类别数）。</b><b>⇒ 而<u>实际的 BERT 实现（以及 Hugging Face 的默认）在 CLS 上先过一个「pooler」</u>：<u>768 → 768 的线性层 + tanh</u>，<u>然后才是分类层</u>。</b><br><b>⇒ <u>所以确实是两个矩阵，讲者说的是对的</u>。</b><b>⚠ 而这个 pooler 是在预训练时（为 NSP）就训好的，<u>微调时继续用</u>。</b>");
  SUM(0,36,{h:"⭐ teddy bear 端到端走查（上）",k:"例句第三次登场：<b>this teddy bear is so cute</b>。走查步骤：<b>① uncased 设置下预处理 —— 全部变小写，然后施加 WordPiece ② 开头加 [CLS]、加 [SEP] ③ 还有 PAD token 把序列填满到末尾（因为按 batch 训练，而 batch 是固定长度的矩阵）④ 三样嵌入叠起来：词嵌入（索引↔表示的巨大查表）＋ 位置嵌入 ＋ 新的 segment 嵌入 ⑤ 过整个 encoder 架构 ⑥ 对情感抽取：不在乎非 CLS 的输出嵌入，只取 CLS 的输出嵌入、在那里插一个线性层</b>。",m:"★★★ 讲者在 97:02 做了一次<b>重要的自我更正</b>：「现在你有某个位置感知的、以及上下文感知的 —— <b>所以还不是上下文感知的，但这里是 segment 感知的</b>」。⇒ 把这个区别钉死：<b>进 encoder 之前每个位置的向量知道「我是什么词、我在第几位、我属于哪一句」，但不知道「我周围有什么词」</b>；<b>「上下文感知」是自注意力的产物，不是输入嵌入的性质</b> —— 过了 12 层之后每个位置的向量才是整句话的一个函数。⇒ 这是 L1 那条线的回声：<b>word2vec 的嵌入是静态的（一个词永远一个向量），transformer 的输出是上下文相关的</b>。",w:"★★★ <b>PAD 和 CLS、SEP 有本质区别</b>：<b>CLS 和 SEP 携带功能（汇总器、分隔符），模型要学会用它们；而 PAD 什么都不携带，它存在的唯一理由是让 batch 里长短不同的句子能拼成矩形张量</b> ⇒ 正因如此<b>你必须让模型忽略它</b>：做法是 <b>attention mask —— softmax 之前把 PAD 位置的分数设成 −∞</b>。⚠ 实践中很常见的 bug：<b>忘记传 attention mask</b> —— 模型把 PAD 当真实词去关注，句子越短污染越严重，<b>而这个 bug 不会报错，只会让效果莫名其妙地差</b>。",r:"★★ 一个有意思的推论：<b>对单句任务（像这个例句），全部 token 都用 segment A，而 segment 嵌入就是「加在所有位置上的同一个常数向量」—— 它不改变任何两个 token 之间的差异，所以对注意力几乎没有影响</b> ⇒ <b>在单句任务上 segment 嵌入基本是个摆设</b>，它只在双句任务里真正起作用（这也解释了 RoBERTa 删掉 NSP 后很多人连 segment 嵌入也一起简化掉）。⇒ WordPiece 的记号值得知道：<b>teddy 不在词表时被切成 ted + ##dy，而 ## 表示「这一片接在前一片后面、中间没有空格」</b> —— 没有这个标记就<b>没法从 token 序列无损还原原文</b>；<b>BPE（GPT 那边）用相反的约定：Ġ 或空格字符标记「词首」</b>。⇒ 那个 FFN：<b>输出嵌入维度和你的任务之间的映射，典型是两个矩阵（到隐藏层、隐藏层到输出）</b> —— 而实际 BERT 实现在 CLS 上先过一个 <b>pooler（768→768 线性 + tanh，预训练时为 NSP 训好的）</b>，然后才是分类层。"});
  QUIZ(0,36,{t:"进 encoder 之前，BERT 的输入嵌入「不知道」什么？",o:["不知道自己是什么词","不知道自己属于哪一句","不知道「我周围有什么词」—— 上下文感知是自注意力的产物，不是输入嵌入的性质","不知道自己在第几个位置"],a:2,w:"★★★ 讲者当场自我更正了这一点（「所以还不是上下文感知的，但这里是 segment 感知的」）—— 它确实是入门时最常被混淆的一点。"});
});

  note("⚠ 关键词：mixed（混进去了）—— 信息没有被丢掉，它被搬家了",640,386,"r");},"<b>这是真正的答案，而关键词是「混进去了」。</b><br><b>讲者的话</b>：<b>「<u>而这个 token 的魔法在于：encoder 里那些自注意力机制已经把每一个别的 token 的表示混进了那个表示里，使得那些输出嵌入是上下文感知的。所以基本上，它是一个面向分类的嵌入。而这就是我们说会插进那个线性层的东西</u>。」</b><br><b>★★★ 「<u>混进去了（mixed）</u>」这个词把那个「浪费」的疑虑彻底解掉了</b>：<b>⇒ 你丢掉的不是<u>信息</u>，而是<u>信息的其它副本</u>。</b><br><b>★★ 把 CLS 走过的路数一遍，这个「混」才具体</b>：<b>⇒ <u>第 1 层</u>：CLS 对全部 n 个 token 做注意力 ⇒ 它的向量成了 n 个输入嵌入的加权和。</b><b>⇒ <u>第 2 层</u>：CLS 再对全部 token 做注意力，<u>而那些 token 的表示本身已经是第 1 层混合过的</u>。</b><b>⇒ ⋯⋯ <u>第 12 层</u>：CLS 的向量是整句话的一个<u>十二重嵌套的</u>非线性函数。</b><br><b>⇒ <u>所以 CLS 的那 768 个数，确实「见过」每一个 token，而且见过很多次</u>。</b><br><b>⚠ 而「<u>面向分类的（geared towards classification）</u>」这个说法也值得留意：<u>CLS 的表示不是通用的，它是被 NSP 训出来的「适合做句子级分类」的那种表示</u>。</b>");

  SUM(0,37,{h:"⭐⭐ 为什么能把其它输出嵌入全丢掉",k:"讲者：<b>这就是我一直在等的那个问题</b>。答：<b>我们这里不需要它们 —— 我们在做分类，而「在某个 token（比如 CLS）之上操作」是我们定的一个「约定」</b>。而这个 token 的<b>魔法</b>在于：<b>encoder 里那些自注意力机制已经把「每一个别的 token 的表示」混进了那个表示里，使得输出嵌入是「上下文感知的」⇒ 它基本上是一个「面向分类」的嵌入</b>。⚠ 补丁：<b>「扔掉其它嵌入」只是分类这个情形下做的事 —— 如果在 token 层面做分类，它们每一个都可能被用到</b>。",m:"★★★ 「<b>混进去了（mixed）</b>」这个词把「浪费」的疑虑彻底解掉：<b>你丢掉的不是信息，而是信息的其它副本</b>。⇒ 把 CLS 走过的路数一遍：<b>第 1 层 CLS 对全部 n 个 token 做注意力 ⇒ 它的向量成了 n 个输入嵌入的加权和；第 2 层再做一次，而那些 token 的表示本身已经被第 1 层混合过；⋯⋯第 12 层 CLS 的向量是整句话的一个十二重嵌套的非线性函数</b> ⇒ <b>CLS 那 768 个数确实「见过」每一个 token，而且见过很多次</b>。",w:"★★ 「<b>约定</b>」这个词承认了这<b>不是唯一做法</b>：你也可以 mean pooling、max pooling、或用最后一个 token（GPT 那边就是）。⇒ 而这几种效果差距不大，<b>这本身说明信息在 12 层之后已高度混合 —— 从哪个位置读都能读到整句信息</b>（有研究发现句子相似度任务上 <b>mean pooling 实际比 CLS 更好</b>）。⇒ <b>CLS 不是「正确答案」而是「BERT 选的答案」—— 它有效是因为预训练时 NSP 就在 CLS 上做，这个位置被专门训练过</b>。",r:"★★★ 这个补丁揭示了 BERT 架构真正的通用性：<b>同一个预训练模型、同一套权重，接不同的头就能做两类完全不同形状的任务 —— 句子级取 1 个向量、token 级取 n 个向量</b>，而 <b>encoder 本身完全不知道你要做哪一类，它只负责把每个位置都编码好</b>。⇒ 这是「通用表示」的具体含义：<b>不是「一个向量能干所有事」，而是「一组向量，让你按需取用」</b>。⇒ 问答的形状：<b>两个 FFN（起始头、结束头）各 768×1，施加到每个嵌入上 ⇒ n 个起始分数、n 个结束分数，取 argmax（约束 start ≤ end）</b> —— <b>加 1536 个参数就会做抽取式问答</b>。⚠ 经典缺陷：<b>没有「无答案」选项</b>，文档里没答案时模型还是会划一段（SQuAD 2.0 专门加了无答案样本，通常让 CLS 代表「没有答案」）。"});

  SUM(0,39,{h:"BERT 的好处与三个局限",k:"<b>好处</b>：<b>你有的是「上下文的（contextual）」嵌入</b> —— 基于这些学到的嵌入，<b>学任何你想要的分类任务都非常容易</b>，这个灵活性在当时被大大赞赏；而<b>它在工业界被广泛使用 —— 任何涉及情感检测或其它分类任务的事，今天用一个「BERT 类」模型非常常见</b>。<b>三个局限</b>：<b>① 上下文长度只有 512 ② 延迟可能被看成高（BERT base 还有 1.1 亿参数，相当多）—— 有办法更小更快吗？③ MLM 和 NSP 这两个目标函数真的都有帮助吗？能简化预训练吗？</b>",m:"★★★ 「<b>上下文的</b>」是对 L1 那条线的最终回答：<b>word2vec 一个词永远一个向量（「bank」在 river bank 和 bank account 里相同），而 BERT 里一个词的向量取决于它出现在哪句话 ⇒ 两个 bank 得到两个不同向量</b> —— 这就是从「词嵌入」到「上下文嵌入」那一步，它解决的是<b>一词多义</b>。⇒ 讲者把 ELMo 并列提出来是对的：<b>contextual embedding 这个概念确实是 ELMo 先提的</b>（论文标题就是 Deep contextualized word representations），BERT 做得更好但首创不在它。",w:"★★★ 为什么 LLM 时代 BERT 没过时，理由非常实在：<b>成本（1.1 亿参数在便宜显卡上几千条每秒，让 LLM 做同样分类成本高几个数量级）、延迟（BERT 一次前向毫秒级，LLM 逐 token 生成是秒级）、确定性（BERT 输出概率分布、稳定可复现，LLM 要解析文本而且可能不按格式回答）</b>。⇒ 今天一个常见的工程选择：<b>用 LLM 标注数据，然后蒸馏一个 BERT 上线 —— LLM 负责「贵但聪明」，BERT 负责「便宜且稳定」</b>。⚠ 更一般的结论：<b>任务形状固定而且量很大时，专用小模型几乎总是比通用大模型划算</b>。",r:"⚠ 关于 512 还有一个比算力更硬的原因讲者没提：<b>BERT 用的是「学出来的」位置嵌入，所以表只有 512 行 —— 第 513 行根本不存在</b>（正是 13:51 那个局限二）⇒ <b>BERT 的 512 是双重限制：算力上 O(n²) 太贵，而结构上位置表没有更多行；后者是硬的 —— 哪怕有无限算力，BERT 也处理不了 513 个 token</b>。★★ 而局限二、三正好对应 69:10 预告的那两条「改进的轴」：<b>局限二 ⇒ DistilBERT，局限三 ⇒ RoBERTa</b>。⇒ 这个讲法结构值得当模板：<b>① 讲一个基准模型 ② 列出它的局限 ③ 每个局限对应一个后续模型</b> ⇒ <b>于是你记住的不是「三个模型的名字」而是「三个问题和三个答案」</b>。"});

  note("⇒ 讲者的评价：这非常有意思（which is very interesting）",640,336,"d");
  note("⚠ 所以蒸馏不是「另一种损失」—— 它是交叉熵的「推广」",640,368,"r");},"<b>这是整段最漂亮的一个观察，而它改变了你看蒸馏的方式。</b><br><b>讲者的话</b>：<b>「<u>而一个有意思的点，你在这里会看到的是：如果你那个 y_T 分布就只是一个硬标签，你就找回了交叉熵损失。所以如果你只有一个位置上是 1、其余地方全是 0，你就有 −log(y_S) —— 这非常有意思</u>。」</b><br><b>★★★ 把这个代换做一遍，它确实只有一行</b>：<b>⇒ KL(T‖S) = Σᵢ y_T⁽ⁱ⁾ · log(y_T⁽ⁱ⁾ / y_S⁽ⁱ⁾)。</b><b>⇒ 如果 y_T 在第 k 个位置是 1、其余是 0 ⇒ <u>只有 i = k 那一项不为零</u>。</b><b>⇒ 那一项 = <u>1 · log(1 / y_S⁽ᵏ⁾) = −log y_S⁽ᵏ⁾</u>。</b><b>⇒ <u>而这正是交叉熵</u>。</b><br><b>★★ 所以结论是：<u>蒸馏不是「另一种损失」，它是交叉熵的推广</u></b>：<b>⇒ <u>普通训练</u>：用一个 one-hot 的目标 ⇒ 交叉熵。</b><b>⇒ <u>蒸馏</u>：用一个「软」的目标 ⇒ KL 散度。</b><b>⇒ <u>两者是同一条公式，区别只在目标分布有多「尖」</u>。</b><br><b>⚠ 而这立刻解释了 L1 那个 <u>label smoothing</u> 在这条谱上的位置：<u>它把 one-hot 稍微抹平一点（0.9 / 0.1 之类）—— 介于两者之间</u>。</b><b>⇒ <u>one-hot、label smoothing、蒸馏 —— 一条连续的谱，差别只是目标分布的软硬程度</u>。</b>");
  SUM(0,40,{h:"⭐⭐ 知识蒸馏：软目标、teacher/student、KL",k:"Hinton / Vinyals / Jeff Dean 那句引言：<b>「soft targets（软目标）包含了几乎全部的知识」</b> —— 讲者的解读是<b>一个模型「输出的那个分布」其实非常有助于知道它学到了什么</b>。两个角色：<b>teacher（更复杂的模型）和 student（更小的模型）</b>，目标是<b>把输出「分布」映射过去，而不是去学硬标签</b>；<b>实践中你很快看到，学一个模型的分布比直接学硬标签更有帮助</b>。目标函数：<b>KL 散度 —— 「在 teacher T 描述的那个世界里，用 student S 去建模有多糟」</b>。⭐⭐⭐ 而<b>如果 y_T 就是一个硬标签（一个位置 1、其余 0），你就找回了交叉熵损失 −log y_S</b>。",m:"★★★ 「软目标包含几乎全部知识」用一个例子就懂：<b>硬标签说「是狗」，软目标说「狗 0.85、狼 0.10、猫 0.03、汽车 0.0001」</b> —— 后者多了<b>「狼和狗很像、而汽车完全不像」这个「类别之间的相似结构」，而硬标签把它整个抹掉了</b> ⇒ <b>模型真正学到的不只是「答案」，而是「整个相似度地图」</b>，而<b>让学生去学这张地图，比让它从头自己画一张容易得多</b>。",w:"★★★ 那个特例是整段最漂亮的观察，代换只有一行：<b>KL = Σ y_T log(y_T/y_S)，y_T 在第 k 位是 1 其余 0 ⇒ 只剩 1·log(1/y_S⁽ᵏ⁾) = −log y_S⁽ᵏ⁾ = 交叉熵</b>。⇒ 结论：<b>蒸馏不是「另一种损失」，它是交叉熵的推广 —— 两者是同一条公式，区别只在目标分布有多「尖」</b>。⚠ 而这立刻定位了 L1 那个 <b>label smoothing</b>：<b>one-hot、label smoothing、蒸馏是一条连续的谱，差别只是目标分布的软硬程度</b>。",r:"⚠ 留意 <b>KL 不对称</b>：这里是 <b>KL(T‖S)</b>，对「T 认为可能的那些结果」加权 ⇒ <b>T 说某类 0.3 而 S 说 0.001 惩罚很重；T 说某类 0 则 S 说什么都不罚</b> ⇒ 效果是<b>强迫 student 覆盖 teacher 认为可能的一切（mode-covering）</b>，而反方向是 mode-seeking。<b>蒸馏要的正是覆盖 —— 你希望小模型把大模型的整张相似度地图都学下来</b>。⇒ 为什么比直接用硬标签训小模型好：<b>① 信息量（每个样本的监督从「1 个类别」变成「一整个分布」，多几千倍）② 平滑性（teacher 的分布连续、带不确定性，天然起正则化作用，而 one-hot 迫使模型过度自信）</b>。★★ 另：这是讲者第三次确认前置知识，而<b>这次回答是「几个人」（前两次是「所有人」「答对了」）⇒ 他跟着改了讲法：不从定义或公式开始，而从一句引言建立直觉</b> —— 这就是「先确认前置再决定讲法」的实际价值：<b>它决定了起点放在哪</b>。"});
  QUIZ(0,40,{t:"为什么说「蒸馏不是另一种损失，而是交叉熵的推广」？",o:["因为蒸馏的梯度和交叉熵相同","把 y_T 代成 one-hot，KL(T‖S) 就化简成 −log y_S，正是交叉熵 ⇒ 同一条公式，区别只在目标分布有多「尖」","因为两者都用 softmax","因为 teacher 的输出也是 one-hot"],a:1,w:"⇒ 于是 one-hot、label smoothing、蒸馏构成一条连续的谱，差别只是目标分布的软硬程度。"});
