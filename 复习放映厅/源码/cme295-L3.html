<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>

.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}

.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

        e.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],
          {duration:780,easing:"cubic-bezier(.35,0,.15,1)"});}
    else e.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],

function startProjector(CFG){
  var cur=-1,kpsEl=document.getElementById("kps"),pipEls=[];
  KPS.forEach(function(k){
    var bar=document.createElement("div");bar.className="kpbar";
    var lb=document.createElement("span");lb.className="kplbl";lb.textContent=k.name;bar.appendChild(lb);
    for(var i=0;i<k.len;i++){var p=document.createElement("span"),sh=SHOTS[k.from+i];
      p.className="pip"+(sh.sum?" sum":(sh.quiz?" quiz":""));bar.appendChild(p);pipEls[k.from+i]=p;}
    bar.addEventListener("click",function(){go(k.from,true);});
    kpsEl.appendChild(bar);});
  function hhmmss(s){s=Math.round(s);var m=Math.floor(s/60);
    return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
  var tcEl=document.getElementById("tc");
  if(!CFG.video)tcEl.hidden=true;
  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));
    if(n===cur)return;
    if(locked&&n>cur&&!force)return;
    FAST=true;clearScene();
    for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}

    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
    [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});
    document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  先回答":"");
    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1,true);});

    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();narrOn=!narrOn;
      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});
  go(0);
}
window.__startProjector=startProjector;

function stack(cx,ytop,items,bw,bh,gap){

/* ── 概率柱状图（画温度、top-k、top-p）──

function bars(x0,base,vals,bw,maxh,cls,labs){
  var i,gap=12;

  return x0+vals.length*(bw+gap)-gap;}

/* ── 一棵两层的搜索树（画 beam search / 贪心）── */
function tree(rootx,rooty,kids,dy,bw,bh){
  var i,n=kids.length,span=190,x0=rootx-(n-1)*span/2;
  boxNode(rootx-bw/2,rooty,bw,bh,"BOS","y");

    link(rootx,rooty+bh,x,rooty+dy);

  note("⚠ 所以这段回顾不是复习，它是「定义 LLM」的第一步",640,364,"r");},"<b>固定环节又来了，而这一次的回顾有一个明确的目的。</b><br><b>讲者的话</b>：<b>「<u>好。那么说到这里，我们开始吧。而照例，我们要回顾一下上周那几集</u>。」</b><br><b>★★ 前两讲都有这个环节（L2 在 01:06 说的是「<u>像往常一样</u>」），<u>而这次的回顾不是单纯的复习</u>。</b><br><b>★★★ 它的目的是：<u>把 L2 的「三类架构」这个分类，接到「什么叫 LLM」这个定义上</u>。</b><b>⇒ 回顾完三类之后，讲者会说：<u>而 LLM 就是第三类（decoder-only）里「足够大」的那些</u>。</b><b>⇒ <u>于是定义就有了着落，而不是凭空给一个说法</u>。</b><br><b>★★ 这个讲法值得学：<u>给一个新概念下定义时，先把它要安放的那个分类体系摆出来</u>。</b><b>⇒ 否则「大语言模型是在大量文本上训练的大型语言模型」这种循环定义，<u>听完等于没听</u>。</b><br><b>⇒ 而接下来五镜就是那个分类体系。</b>");
  SUM(0,1,{h:"开场：今天终于要讲 LLM 了",k:"讲者开场：<b>今天是非常令人激动的一天，因为我们「终于」要引入大语言模型了</b>。后勤一条（对自学者实打实有用）：<b>幻灯片现在就在网站上，而且会争取每周四晚上定期发布，让你能下载、做批注</b>。然后照例<b>回顾上周那几集</b>。",m:"★★ 「<b>终于</b>」说明前两讲是铺垫：<b>L1 从 one-hot 推到自注意力和 transformer，L2 讲八年换了哪三个零件、三类架构为什么只剩 decoder-only</b> —— 两讲加起来回答的是「<b>LLM 的骨架是什么</b>」。⇒ 现在骨架有了，<b>从这一讲起讲的是「在这个骨架上大语言模型怎么长出来」</b>，而后面六讲（训练、偏好调优、推理、接外部世界、Agent）全挂在这条线上。",w:"★★★ 这次的回顾不是复习，<b>它的目的是把 L2 的「三类架构」接到「什么叫 LLM」这个定义上</b> —— 回顾完三类之后，讲者会说 <b>LLM 就是第三类（decoder-only）里「足够大」的那些</b>，<b>于是定义有了着落，而不是凭空给一个说法</b>。⇒ 这个讲法值得学：<b>给新概念下定义时，先把它要安放的那个分类体系摆出来</b> —— 否则「大语言模型是在大量文本上训练的大型语言模型」这种循环定义，听完等于没听。",r:"⇒ 幻灯片这条对你的实际意义：<b>这门课的材料是完整公开的 —— 幻灯片 + 录像 + 人工字幕，三样齐了</b>（对照 L2 开场那两条后勤：换录音设备、期末考日期，对自学者没有直接用处）。★ 而「课前就能拿到」这个请求本身说明了一个有效的学习方式：<b>先快速翻一遍幻灯片建立骨架，再带着问题去听讲解</b> —— 因为<b>讲课是线性的，而你只有知道「它要走到哪」，才能判断当前这一段的位置</b>。"});
  QUIZ(0,1,{t:"这一讲开头那段「回顾三类架构」的真正目的是什么？",o:["凑时间","把 L2 的分类体系摆出来，好让「LLM = decoder-only 里足够大的那些」这个定义有着落","为了引出 BERT","单纯复习上周内容"],a:1,w:"⇒ 通用讲法：给新概念下定义时先摆出它要安放的分类体系，否则「大语言模型是大型语言模型」这种循环定义听完等于没听。"});

KP("2 · 回顾：transformer 长出来的三类模型",function(){

  note("⇒ 而那里有三大类（three main categories）",640,364,"y");},"<b>两句话把前两讲概括完了。</b><br><b>讲者的话</b>：<b>「<u>所以如果你记得，第 1 讲和第 2 讲讲的全是引入自注意力这个概念，并把它们接到 transformer 这个构造上。而我们上一讲做的，是去看外面有哪些种类的模型、以及它们怎么全都基于 transformer。所以有三个类别、三个主要的类别</u>。」</b><br><b>★★ 请注意这个概括的层次：<u>「概念 → 构造 → 种类」</u></b>：<b>⇒ <u>概念</u>：自注意力（一个计算机制）。</b><b>⇒ <u>构造</u>：transformer（把那个机制组装成一个可训练的网络）。</b><b>⇒ <u>种类</u>：encoder-decoder / encoder-only / decoder-only（同一个构造的三种裁剪）。</b><br><b>★★★ 这三层的关系值得记住，因为它解释了为什么三类模型「<u>全都基于 transformer</u>」</b>：<b>⇒ <u>它们不是三种不同的架构，而是同一个架构的三种取法</u> —— 留两半、留左半、留右半。</b><br><b>⇒ 而 L2 里那个发现也在这里回响：<u>decoder-only 的 block 其实和 encoder block 几乎一样，只差一个因果掩码</u>。</b>");

  note("⚠ 注意「文本进文本出」这个描述 —— 它和第三类是一样的",640,386,"r");},"<b>第一类，而这里有一个值得留意的细节：它的任务描述和第三类一样。</b><br><b>讲者的话</b>：<b>「<u>我们看到的第一个是 encoder-decoder 模型，它基本上依赖于 transformer。它有 transformer 的 encoder、transformer 的 decoder。而典型地，那里的任务是输入文本 —— 所以是文本进，文本出。所以我们看到一个例子就是 T5 以及所有那些变体</u>。」</b><br><b>★★ 请注意：<u>第一类和第三类的任务描述都是「text in, text out」</u>（03:15 那镜会看到）。</b><br><b>⇒ 既然任务形状一样，<u>那为什么要两套架构？</u></b><b>⇒ 这正是 L2 下半场那个问题，<u>而答案是：不需要，所以 encoder 被淘汰了</u>。</b><br><b>★★★ 不过有一个区别要说清楚：<u>encoder-decoder 处理的是「两个独立的序列」</u>（源句、译句），<u>而 decoder-only 处理的是「一个连续的序列」</u>（prompt 接着往下写）。</b><br><b>⇒ 两者都能表达「文本进文本出」，<u>但 decoder-only 的做法更简单：不区分输入和输出，全当一个序列</u>。</b><br><b>⚠ 而「更简单」在这个领域里几乎总是赢 —— <u>这是 L2 那条教训的另一个例子</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⇒ 于是有了分类、情感抽取那些例子 —— 特别是取 CLS 那个 token 的编码嵌入",640,362,"d");},"<b>第二类，而讲者对 BERT 的概括抓住了最要紧的那一点。</b><br><b>讲者的话</b>：<b>「<u>第二种模型是我们把 decoder 从 transformer 里拿掉，于是我们得到一个 encoder-only 模型。所以我们深入看了 BERT，它是典型的 encoder-only 模型。而我想，我们也看到 BERT 有这样一个很好的性质：它编码出的那些嵌入非常有意义、非常能表达输入。所以我们看了分类、情感抽取的例子。而我们特别做的，是把 CLS 这个 token 的编码嵌入考虑进来</u>。」</b><br><b>★★ 「<u>非常有意义、非常能表达输入（very meaningful and expressive of the inputs）</u>」—— 这句话把 BERT 的价值压缩成了一句</b>：<b>⇒ BERT 的产出<u>不是文本，是表示</u>。</b><b>⇒ 而那个表示的好坏，决定了所有下游任务的上限。</b><br><b>★★★ 回想 L2 讲的那条链：<u>只有 encoder ⇒ 双向 ⇒ 每个 token 看过全句 ⇒ MLM 迫使它真正编码语言结构 ⇒ 表示足够通用</u>。</b><b>⇒ 而 <u>CLS</u> 是读出这个表示的那个接口 —— <u>自注意力已经把全句信息混进了它</u>。</b><br><b>⚠ 一个小提醒：<u>讲者这里说 CLS 的嵌入，而实践中做句子相似度时 mean pooling 常常更好</u>（L2 里提过）。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("02:45","in real life, BERT is used to encode documents to encode sentences");
  note("⭐ BERT 在现实里实际被用来干什么",640,186,"y");
  boxNode(130,214,1020,44,"编码文档、编码句子","g");
  note("⇒ 讲者预告：我们会在这门课后面看到这些模型怎么有用",640,292,"y");
  note("★★ 这个预告指向的是「检索」—— 而那是 RAG 的地基",640,324,"g");
  note("⚠ 所以 BERT 没有退场，它换了一个位置继续工作",640,362,"r");},"<b>这一镜的预告很重要，因为它说明 BERT 会在后面的课里回来。</b><br><b>讲者的话</b>：<b>「<u>所以我想在现实生活里，BERT 是被用来编码文档、编码句子的。而我们会在这门课的后面看到这些模型是怎么有用的</u>。」</b><br><b>★★★ 「<u>编码文档、编码句子</u>」指向的是一个具体的应用：<u>向量检索</u></b>：<b>⇒ 把每个文档编码成一个向量，存进向量库。</b><b>⇒ 用户的问题也编码成一个向量。</b><b>⇒ <u>然后找最相似的几个文档</u> —— 而「相似」就是 L1 和 L2 反复用的那个<u>余弦相似度</u>。</b><br><b>★★ 而这正是 <u>RAG（检索增强生成）</u>的第一步，<u>也是 L7「把 LLM 接到外部世界」那一讲的基础</u>。</b><br><b>⇒ 所以这门课的结构在这里露出来了：<u>BERT 不是一段被淘汰的历史，它是 RAG 这条线上的一个关键部件</u>。</b><br><b>⚠ 实际的系统里，今天用的是 BERT 的后代（sentence-transformers、E5、BGE 这类专门训练过的嵌入模型），<u>但它们的架构仍然是 encoder-only</u>。</b><b>⇒ <u>生成归 decoder-only，检索归 encoder-only —— 两条线各司其职</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("03:06","we also do a little bit of a modification. So we remove the cross-attention");
  note("第三类：decoder-only，以及那处「小改动」",640,186,"v");
  stack(640,200,["只保留 transformer 的 decoder 部分","⚠ 而且还做一点改动：把 cross-attention 去掉","理由：不再需要它了 —— 我们没有 encoder"],620,32,8);
  note("⇒ 这类模型也是「文本进，文本出」",640,328,"y");
  note("★ 而 GPT 是这类模型非常好的一个例子",640,350,"g");
  note("⚠ 讲者补了一句：而且事实上，如今大多数模型都是 decoder-only",640,382,"r");},"<b>第三类，而那处「小改动」其实不小。</b><br><b>讲者的话</b>：<b>「<u>然后最后但同样重要的，我们有第三类模型，也就是 decoder only。所以我们只保留 transformer 的 decoder 部分。而所以这里，我们也做一点点改动 —— 我们把 cross-attention 去掉，因为我们不再需要它了，我们没有 encoder。而这类模型是文本进、文本出。所以 GPT 是这类模型非常好的一个例子。而实际上，如今大多数模型都是 decoder-only</u>。」</b><br><b>★★ 「<u>一点点改动</u>」这个说法谦虚了 —— <u>去掉 cross-attention 意味着每个 block 少了整整一个子层</u>。</b><br><b>⇒ 原始 decoder block 有<u>三个</u>子层（带掩码自注意力、交叉注意力、FFN）。</b><b>⇒ 去掉一个 ⇒ <u>剩两个</u>，而这正好和 encoder block 的结构一样。</b><br><b>★★★ 所以 L2 那个反直觉的事实在这里又出现了：<u>今天 LLM 的 block 长得像 encoder block，只是多了因果掩码</u>。</b><b>⇒ 「decoder-only」这个名字说的是<u>功能</u>（自回归解码），<u>不是结构的来处</u>。</b><br><b>⚠ 而「去掉它因为不再需要」这个理由很干净：<u>cross-attention 的 K 和 V 来自 encoder 的输出，而 encoder 没了，那两个张量根本不存在</u>。</b>");
  SUM(0,2,{h:"回顾：transformer 长出来的三类模型",k:"前两讲：<b>L1 和 L2 引入「自注意力」这个概念并把它接到「transformer」这个构造上；L2 下半看了外面有哪些种类的模型、它们怎么全都基于 transformer</b> —— 三大类：<b>① encoder-decoder（有 encoder 有 decoder，文本进文本出，例子 T5 及其变体）② encoder-only（把 decoder 拿掉，典型是 BERT —— 它编码出的嵌入「非常有意义、非常能表达输入」，取 CLS 做分类/情感抽取）③ decoder-only（只留 decoder，而且把 cross-attention 去掉，因为没有 encoder 了；文本进文本出，GPT 是好例子，而今天大多数模型都是这类）</b>。",m:"★★ 概括的层次是「<b>概念 → 构造 → 种类</b>」：自注意力是一个计算机制、transformer 是把它组装成可训练网络的构造、三类是同一个构造的三种裁剪 ⇒ <b>它们不是三种不同的架构，而是同一个架构的三种取法</b>。⚠ 「一点点改动」谦虚了：<b>去掉 cross-attention 意味着每个 block 从三个子层变成两个，而这正好和 encoder block 一样</b> —— 「decoder-only」说的是<b>功能（自回归解码）而不是结构的来处</b>。理由很干净：<b>cross-attention 的 K、V 来自 encoder 输出，encoder 没了那两个张量根本不存在</b>。",w:"★★★ 留意第一类和第三类的任务描述<b>都是「text in, text out」</b> —— 既然任务形状一样，为什么要两套架构？⇒ 区别在于：<b>encoder-decoder 处理「两个独立的序列」（源句、译句），decoder-only 处理「一个连续的序列」（prompt 接着往下写）</b> —— 两者都能表达文本进文本出，<b>但 decoder-only 更简单：不区分输入输出，全当一个序列</b>，而「更简单」在这个领域几乎总是赢。",r:"⭐ BERT 在现实里被用来<b>编码文档、编码句子</b>，而讲者预告「后面会看到这些模型怎么有用」—— 指向的是<b>向量检索</b>：<b>把文档编码成向量存进向量库，问题也编码成向量，然后找最相似的几个（而「相似」就是那个余弦相似度）</b> ⇒ <b>这正是 RAG 的第一步，也是 L7「把 LLM 接到外部世界」的基础</b>。⇒ 所以<b>BERT 不是一段被淘汰的历史，它是 RAG 这条线上的关键部件</b>；今天用的是它的后代（sentence-transformers、E5、BGE），<b>但架构仍然是 encoder-only —— 生成归 decoder-only，检索归 encoder-only，两条线各司其职</b>。"});
  QUIZ(0,2,{t:"decoder-only 模型为什么要去掉 cross-attention？",o:["cross-attention 的 K 和 V 来自 encoder 的输出，而 encoder 没了，那两个张量根本不存在","因为它和 RoPE 不兼容","为了减少参数量","因为它会破坏因果性"],a:0,w:"⇒ 于是每个 block 从三个子层变成两个，正好和 encoder block 一样 —— 「decoder-only」说的是功能（自回归解码），不是结构的来处。"});
});
KP("3 · ⭐ LLM 这个词：M 在哪，两个 L 又在哪",function(){

  says("04:01","a language model is a model that assigns probability to sequences of tokens");

  boxNode(130,214,1020,44,"语言模型 = 一个「给 token 序列赋概率」的模型","g");
  note("⇒ 而在我们这个情形里，模型总是在预测「下一个 token 的概率」",640,292,"y");
  note("★★ 所以从这个意义上说，它是一个语言模型",640,324,"g");
  note("⚠ 注意这个定义比「会说话的 AI」精确得多 —— 它是一个概率分布",640,362,"r");},"<b>先把定义里最不起眼的那个词钉死，而它其实是最精确的一个。</b><br><b>讲者的话</b>：<b>「<u>所以 LLM 代表 large language model。那么什么是大语言模型？首先，一个大语言模型是一个语言模型。而语言模型是一个给 token 序列赋概率的模型。所以在我们这个情形里，我们的模型总是在预测下一个 token 的概率。所以从那个意义上说，它是一个语言模型</u>。」</b><br><b>★★★ 「<u>给 token 序列赋概率</u>」—— 这是一个完全数学化的定义，<u>它比任何关于「理解」「智能」的说法都准确</u></b>：<b>⇒ 给一串 token，<u>模型输出一个数：这串话有多可能</u>。</b><b>⇒ 而这等价于<u>逐个预测下一个 token 的条件概率，然后连乘</u>：P(w₁…wₙ) = ∏ P(wᵢ | w₁…wᵢ₋₁)。</b><br><b>★★ 所以「预测下一个词」和「给整句赋概率」<u>是同一件事的两种说法</u>。</b><b>⇒ 而这就是为什么一个自回归模型天然是一个语言模型。</b><br><b>⚠ 请记住这个定义，因为它能帮你祛魅：<u>ChatGPT 在做的，从数学上说，就是在一个 token 序列上做条件概率估计</u>。</b><b>⇒ <u>它所有惊人的能力，都是从这一件事里涌现出来的</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  SUM(0,3,{h:"⭐ LLM 这个词拆开",k:"<b>LLM = large language model</b>。<b>M（语言模型）</b>：<b>一个「给 token 序列赋概率」的模型</b> —— 我们的模型总是在预测<b>下一个 token 的概率</b>。<b>L（大）有三条</b>：<b>① 模型尺寸 —— 今天几千亿参数不罕见，但叫 LLM 典型至少是「十亿」量级 ② 数据量 —— 用「预训练用了多少 token」来量，几千亿到几万亿，最大的几十万亿 ③ 算力 —— 典型要一堆 GPU（不过如今有很多优化让它们能在消费级 GPU 上跑）</b>。",m:"★★★ 「<b>给 token 序列赋概率</b>」是完全数学化的定义，<b>比任何关于「理解」「智能」的说法都准确</b>：给一串 token 输出一个数（这串话有多可能），而这<b>等价于逐个预测下一个 token 的条件概率然后连乘</b>：P(w₁…wₙ)=∏P(wᵢ|w₁…wᵢ₋₁) ⇒ <b>「预测下一个词」和「给整句赋概率」是同一件事的两种说法</b>。⚠ 记住它能祛魅：<b>ChatGPT 从数学上说就是在一个 token 序列上做条件概率估计，所有惊人的能力都从这一件事里涌现出来</b>。",w:"★★ 把尺寸的跨度摆出来才有体感：<b>BERT base 1.1 亿（按门槛连门都没进）、GPT-2 15 亿（刚过线）、Llama 3 8B 80 亿、GPT-3 1750 亿、DeepSeek-V3 6710 亿</b>。⚠ 但参数量今天要小心看 —— <b>MoE 模型的「总参数」和「每次推理激活的参数」差很多</b>（DeepSeek-V3 总 6710 亿、每 token 只激活 370 亿），<b>而这正是这一讲接下来第一个要讲的东西</b>。⇒ 数据量为什么用 token 而不是 GB：<b>模型看到的就是 token，而且训练成本和 scaling law 的公式全用 token 数算</b>；具体化一下：<b>1 万亿 token ≈ 190 个英文维基百科</b>，而<b>整个可爬取互联网大约就在几十万亿 token 量级 —— 前沿模型已经快读完了</b>（这就是合成数据变重要的原因）。",r:"★★★ 三条不是独立的，<b>它们被 scaling law 绑在一起</b>：Chinchilla 的经验规律是<b>最优训练 token 数约为参数量的 20 倍</b>（70B 模型该用约 1.4 万亿 token），而算力大致正比于「参数量 × token 数」⇒ <b>定了一个，另外两个就大致定了 —— 「大」不是三个独立的形容词，而是一个资源配比问题</b>（L2 结尾 RoBERTa 的 vastly undertrained 说的正是当年这个配比全配错了）。⇒ 「能在消费级 GPU 上跑」背后是<b>量化（16 位→4 位，显存降到 1/4）、GQA/PagedAttention、MoE、FlashAttention</b> —— 叠起来<b>一个 8B 模型 4 位量化后约 5 GB，一张消费级显卡就能跑</b>。⚠ 所以「LLM 很大」要分两面看：<b>训练仍只有少数机构做得起，而推理已经民主化了</b>。"});

  note("⚠ 而 L2 讲过：如今是 pre-norm + RMSNorm，不是原论文那套",640,386,"r");},"<b>这是整个 LLM 的骨架，而它简单到可以背下来。</b><br><b>讲者的话</b>：<b>「<u>而正如我们之前看到的，这些模型是 decoder-only 的。所以这里我们做的是把 encoder 去掉，我们只保留带掩码的自注意力、前馈神经网络、以及相加和归一化。所以我们只保留这些。而这就是 LLM 的骨架</u>。」</b><br><b>★★★ 把一个 LLM 的 block 完整写出来（按今天的实践）</b>：<b>⇒ <u>x → RMSNorm → 带掩码的多头注意力（GQA + RoPE）→ 加回 x</u></b><b>⇒ <u>→ RMSNorm → FFN（或 MoE）→ 再加回</u></b><br><b>⇒ 然后这个 block <u>重复 L 次</u>（32 层、80 层……），最后接一个到词表的投影。</b><br><b>★★ <u>就这些</u>。一个几千亿参数、能写代码能推理的系统，结构上就是这个 block 堆了几十遍。</b><br><b>⚠ 而讲者这里说的 add & norm 是<u>原论文的说法</u>，L2 里讲过它已经变了两处：<u>位置挪到了子层前面（pre-norm），形式换成了 RMSNorm</u>。</b><b>⇒ 所以更准确的骨架是上面那个写法。</b><br><b>★ 这件事值得反复强调：<u>LLM 的复杂性不在结构里，在规模和训练里</u>。</b>");
  SUM(0,4,{h:"⚠ BERT 算不算 LLM，与 LLM 的骨架",k:"讲者的提醒：<b>所有这些术语都「相对很新」—— 2018、19 年并没有一个真正的 LLM 定义，当时实际上没人在谈 LLM</b>。<b>BERT 算不算？</b>⇒ <b>一开始有人把它算进去，但 BERT 是 encoder-only、它「不产出文本」，所以按现在已经确立得相当好的定义，BERT 不是 LLM</b>。完整判据：<b>① 做 text to text ② 尺寸非常大 ③ 数据量和算力也非常大</b>。LLM 的<b>骨架</b>：去掉 encoder，<b>只保留 masked self-attention、FFN、add & norm</b>。",m:"★★★ 排除 BERT 的理由<b>不是「它太小」而是「它不产出文本」</b> —— 这是一个关于<b>能力形状</b>的判据、不是关于规模的 ⇒ <b>哪怕把 BERT 放大到 1000 亿参数、训 10 万亿 token，它仍然不是 LLM</b>。而这和 L2 那条线完全吻合：<b>双向和生成在结构上互斥 ⇒ BERT 选了双向 ⇒ 它永远不能生成 ⇒ 永远不是 LLM</b>，所以这不是任意的术语约定，<b>它反映的是一个真实的结构性分界</b>。⚠ 顺带：<b>「LLM」这个名字其实有点名不副实 —— 它强调 large，而真正的分界在「能不能生成」</b>。",w:"★★ 三条判据性质不同：<b>第一条（text to text）是「质」的判据、是非题、由架构决定、硬门槛；后两条（大）是「量」的判据、程度问题、门槛会随时间上移</b>（GPT-2 在 2019 年是大模型，今天 15 亿已算小）。⇒ 推论：<b>「LLM」这个词的外延会随时间收缩</b> —— 今天下限是 1B，几年后可能是 10B，<b>于是今天的某些 LLM 将来会被重新归类成「小语言模型」（SLM），而这个词现在已经在用了</b>。",r:"★★★ 完整写出今天一个 LLM 的 block：<b>x → RMSNorm → 带掩码的多头注意力（GQA + RoPE）→ 加回 x → RMSNorm → FFN（或 MoE）→ 再加回</b>，然后<b>重复 L 次</b>，最后接一个到词表的投影。<b>就这些</b> —— 一个几千亿参数、能写代码能推理的系统，结构上就是这个 block 堆了几十遍 ⇒ <b>LLM 的复杂性不在结构里，在规模和训练里</b>。⚠ 讲者说的 add & norm 是原论文说法，L2 讲过已经变了两处（<b>pre-norm、RMSNorm</b>）。⇒ 而「术语很新」对读文献很有用：<b>同一个词在不同年份意思可能不同</b>（fine-tuning 在 2019/2023/今天各指不同的事；prompt 在 2020 年几乎还不是技术词）—— <b>读论文除了看它说什么，还要看它是哪一年写的</b>。"});
  QUIZ(0,4,{t:"按今天的定义，BERT 为什么不算 LLM？",o:["因为它只有 1.1 亿参数，太小","因为它是 2018 年的模型","因为它是 encoder-only、「不产出文本」—— 这是关于能力形状的判据，放大到 1000 亿也仍然不算","因为它用的是 LayerNorm"],a:2,w:"⇒ 这和 L2 那条线吻合：双向和生成结构上互斥 ⇒ BERT 选了双向就永远不能生成。所以这不是任意的术语约定，而是一个真实的结构性分界。"});

  note("⇒ 讲者：我现在只是在引入「专家（experts）」这个想法",640,362,"d");},"<b>转折来了，而它只有一句话。</b><br><b>讲者的话</b>：<b>「<u>嗯，现在，我们就是在问所有人。我们要求模型的所有参数都参与到生成的计算里。而所以这里的想法是：给定一个输入，也许没有必要让所有人都参与计算。所以想法是，我们实际上只让模型的一个子集参与到下一个 token 的计算里。所以我现在只是在引入专家这个想法</u>。」</b><br><b>★★★ 「<u>我们就是在问所有人</u>」—— 把这件事对回技术</b>：<b>⇒ 一个稠密模型生成一个 token 时，<u>要把全部 N 个参数都读进计算单元、都乘一遍</u>。</b><b>⇒ 对一个 700 亿参数的模型，<u>每生成一个 token 就是 1400 亿次浮点乘加</u>（每个参数一次乘一次加）。</b><br><b>★★ 而 MoE 的主张是：<u>只用其中一个子集</u>。</b><b>⇒ 比如 DeepSeek-V3：<u>总共 6710 亿参数，但每个 token 只激活 370 亿</u> —— <u>约 5.5%</u>。</b><b>⇒ <u>于是你有一个 6710 亿参数的模型的「知识容量」，而只付 370 亿参数的「计算代价」</u>。</b><br><b>⇒ <u>这就是 MoE 的全部卖点：把「容量」和「计算量」解耦</u>。</b><br><b>⚠ 代价是显存 —— <u>那 6710 亿参数还是都得存着</u>，因为你不知道下一个 token 会用到哪些。</b>");

  note("⚠ 「router」这个名字更形象：它在给输入「选路」",640,362,"d");},"<b>那个网络有两个名字，而它们各自强调了一个侧面。</b><br><b>讲者的话</b>：<b>「<u>我们要把它叫做 G，像 gates（门控）一样，但它有时候也被叫做 router（路由器）。所以假设我们有一些门控，它告诉我们哪些专家该参与到推理里。所以如果我们有那个 —— 假设这里，门控告诉我们：好，其实 2 号专家很适合回答你的问题</u>。」</b><br><b>★★ 两个名字各自强调一个侧面</b>：<b>⇒ <u>gates（门控）</u>：强调「<u>开关</u>」—— 每个专家前面有一道门，门开了信息才进得去。</b><b>⇒ <u>router（路由器）</u>：强调「<u>选路</u>」—— 像网络路由一样，把数据包送到该去的地方。</b><br><b>★★★ 而实际的实现更接近第一个：<u>门控输出的不是一个「选哪个」的硬判断，而是 n 个权重</u>。</b><b>⇒ 具体做法：<u>一个线性层把输入 x 映射成 n 个分数，过 softmax 得到 n 个权重</u>。</b><b>⇒ 然后<u>只保留最大的 k 个（通常 k=1 或 2），其余置零</u>。</b><br><b>⇒ <u>所以「门」是软的（有权重），而「稀疏」是靠 top-k 截断做出来的</u>。</b><br><b>⚠ 这个 top-k 截断是 MoE 全部效率的来源 —— <u>它也是训练时最麻烦的地方（因为截断不可导）</u>。</b>");

  SUM(0,6,{h:"⭐⭐ 房间里的四个专家：MoE 的比喻",k:"核心问题：<b>模型几千亿参数、一次推理要很多算力 —— 但为了做一个简单的预测，你「真的需要」让所有这些参数都在前向传播里被「激活」吗？</b>⇒ 比喻：<b>你走进一个房间，里面有数学家、物理学家、化学家、历史学家，而你有一个数学问题 —— 你会问谁？问数学家？问化学家？还是问所有人？</b>⇒ 转折：<b>而现在，我们就是在问所有人</b> —— 我们要求模型的全部参数都参与生成的计算。⇒ 想法：<b>只让模型的「一个子集」参与下一个 token 的计算</b>。记号：<b>n 个专家 + 另一个网络 G（gates，也叫 router）告诉我们哪些专家该参与</b>；<b>输入只流进被选中的那个专家 ⇒ 这叫 mixture of experts，记作 MoE</b>。",m:"★★★ 盯住「<b>被激活</b>」这个词：<b>「存在」是参数在显存里，「被激活」是参数参与了这次前向计算</b> —— 而在普通 transformer 里这两件事是一样的（每生成一个 token，每个权重都被乘一遍，700 亿参数就是 1400 亿次乘加）。⇒ 为什么值得怀疑：<b>你问「2+2 等于几」和「普鲁士首都是哪」用到的知识完全不重叠，但稠密模型里这两个问题走完全同一条计算路径</b>。⇒ MoE 的卖点：<b>把「容量」和「计算量」解耦</b> —— DeepSeek-V3 总 6710 亿、每 token 只激活 370 亿（约 5.5%），<b>你有 6710 亿的知识容量，只付 370 亿的计算代价</b>。⚠ 代价是显存：<b>那 6710 亿还是都得存着，因为你不知道下一个 token 会用到哪些</b>。",w:"★★★ 这个比喻为什么高明：<b>① 答案显然到不需要思考 ② 而「问所有人」这个选项被明确列出来，于是你意识到它荒谬</b> —— 然后下一句告诉你「<b>而现在我们就是在问所有人</b>」。⇒ 值得学：<b>要让人接受一个改进，最有效的办法不是说明新方案多好，而是让现状显得不合理</b>。⚠ 但这个比喻会误导：<b>真实的 MoE 专家并不对应「学科」—— 它们只是 n 组权重，各自擅长什么是训练中自己分化出来的</b>，研究发现分化往往是<b>按 token 类型、语法角色、甚至语言</b>来的。",r:"★★ 两个名字各强调一个侧面：<b>gates 强调「开关」（每个专家前有道门），router 强调「选路」</b>。而实际实现更接近前者：<b>一个线性层把 x 映射成 n 个分数、过 softmax 得到 n 个权重，然后只保留最大的 k 个（通常 k=1 或 2）、其余置零</b> ⇒ <b>「门」是软的（有权重），而「稀疏」是靠 top-k 截断做出来的</b>；⚠ 这个截断是 MoE 全部效率的来源，<b>也是训练时最麻烦的地方（截断不可导）</b>。⇒ 「人人都在谈 MoE」有具体原因：<b>2023 年底 Mixtral 8×7B、2024 年底 DeepSeek-V3 证明 MoE 能做到前沿水平而且训练成本低得多</b>。★★★ 但 MoE 不是新东西 —— <b>1991 年就有（Jacobs/Jordan/Hinton），2021 年 Switch Transformer 用到 transformer 上</b> ⇒ 又是那个模式：<b>老想法等到规模足够大、问题足够痛时才被大规模采用</b>（和 RMSNorm 1019→2023、MoE 1991→2024 一样）。"});

  note("⚠ 关键在「联合」：路由器不是先训好再用，它和专家一起从随机初始化长出来",640,362,"r");},"<b>这个提问问的是训练方式，而答案里最要紧的是「联合」两个字。</b><br><b>讲者的话</b>：<b>「<u>所以问题是：你怎么训练 G？你怎么训练 E？所以典型地，你联合地训练它们。所以我们也许稍后会看到这个。但你可以就把它想成像平常那样训练 —— 你做你的前向传播，你算损失，然后你反向传播</u>。」</b><br><b>★★★ 「<u>联合（jointly）</u>」这件事比听起来深刻，<u>因为它意味着一个先有鸡还是先有蛋的问题被同时解决了</u></b>：<b>⇒ <u>路由器要学会「把什么样的输入送给哪个专家」</u> —— 但一开始专家什么都不会，<u>送给谁都一样</u>。</b><b>⇒ <u>专家要学会「成为某方面的行家」</u> —— 但一开始路由器是随机的，<u>它收到的输入是随机的一堆</u>。</b><br><b>★★ 而这个死结是怎么解开的：<u>靠随机初始化带来的微小差异 + 正反馈</u>。</b><b>⇒ 一开始路由器随机地偏向某个专家一点点 ⇒ <u>那个专家在那类输入上多训了一点 ⇒ 它在那类输入上变好一点 ⇒ 路由器更愿意把那类输入给它</u>。</b><br><b>⇒ <u>分工就这样自己长出来了</u>。</b><br><b>⚠ 但这个正反馈也正是「<u>routing collapse</u>」的成因（20:56 那镜）—— <u>它可能让一两个专家吃掉全部流量</u>。</b>");

  note("⚠ 这个「先挂起来」的处理值得学：先把结构讲清楚，再填具体的零件",640,362,"r");},"<b>这个提问被讲者有意挂起来了，而这个处理方式值得学。</b><br><b>学生的问题</b>：<b><u>这些 E 是什么？这些 E 的架构是什么？</u></b><br><b>讲者的回答</b>：<b>「<u>所以我们现在先假设它就是某个网络。我们暂时不指定它们是什么，但我们马上就会看到这个。所以现在先假设它是某个网络</u>。」</b><br><b>★★★ 为什么「先挂起来」是对的</b>：<b>⇒ 因为 MoE 的<u>结构</u>（n 个专家 + 一个路由器 + 加权求和）<u>和专家具体是什么无关</u>。</b><b>⇒ 你可以把专家换成任何东西：<u>FFN、整个 transformer 层、甚至一整个模型</u> —— <u>MoE 这个框架都成立</u>。</b><br><b>★★ 所以讲者先把框架讲完（公式、稠密 vs 稀疏、FLOPS），<u>再回头用一笔参数账论证「专家应该是 FFN」</u>（16:37–18:15）。</b><br><b>⇒ 这个顺序让那个结论是<u>推出来的</u>，而不是<u>给定的</u>。</b><br><b>⚠ 对照一下反过来讲的效果：如果一上来就说「MoE 就是把 FFN 换成 8 个 FFN」，<u>你会记住这个事实，但不知道为什么是 FFN 而不是注意力</u>。</b><b>⇒ <u>而那个「为什么」才是可迁移的知识</u>。</b>");
  SUM(0,7,{h:"MoE 的公式与两个提问",k:"那条公式：<b>ŷ = Σᵢ Gᵢ(x)·Eᵢ(x)</b> —— <b>输出是各专家输出按「某个量」加权求和，而那个量是门控的输出，它告诉你每个专家的输出有多重要</b>。两个提问：① <b>G 和 E 怎么训？⇒ 典型地「联合地」训，就当成平常那样：前向、算损失、反传</b>（而讲者补了一句：<b>训 MoE 是带着一些挑战的，马上就会看到</b>）；② <b>这些 E 是什么？⇒ 先假设它就是「某个网络」，暂时不指定，马上会看到</b>。",m:"★★★ 公式里埋了伏笔：<b>求和号的范围是 1 到 n —— 所有专家都被算了一遍，而这和「不让所有人参与」这个卖点是矛盾的</b>。讲者自己会在 12:24 点出，<b>而那正是「稠密 MoE / 稀疏 MoE」这个区分的来由</b> ⇒ 读这条公式时留心：<b>它描述的其实是稠密版本</b>。",w:"★★★ 「<b>联合</b>」解开了一个先有鸡还是先有蛋的死结：<b>路由器要学会「把什么输入送给谁」，但一开始专家什么都不会；专家要学会「成为行家」，但一开始路由器是随机的</b>。⇒ 怎么解开的：<b>靠随机初始化的微小差异 + 正反馈</b> —— 路由器随机偏向某专家一点点 ⇒ 它在那类输入上多训一点、变好一点 ⇒ 路由器更愿意给它 ⇒ <b>分工自己长出来</b>。⚠ 而这个正反馈<b>也正是 routing collapse 的成因</b> —— 它可能让一两个专家吃掉全部流量。",r:"★★ 「就当平常那样训」和「有挑战」看似矛盾，其实是两个层次：<b>机制上确实就是前向/损失/反传，没有特殊算法；但目标函数上不是 —— 你必须额外加一项「负载均衡损失」，否则训出来的 MoE 大概率是废的</b>。⇒ 一般化：<b>一个架构的「训练流程」可以完全标准，而它的「训练目标」必须定制 —— 后者往往才是能不能工作的关键</b>（MoE 论文里负载均衡损失占了相当篇幅，架构本身几行就说完）。⇒ 「先挂起来」也值得学：<b>MoE 的结构和专家具体是什么无关</b>（专家可以是 FFN、整个 transformer 层、甚至一整个模型），所以讲者先讲完框架、<b>再用一笔参数账把「专家应该是 FFN」推出来</b> —— <b>这个顺序让结论是推出来的而不是给定的，而那个「为什么」才是可迁移的知识</b>。"});
  QUIZ(0,7,{t:"MoE 里路由器和专家的「分工」是怎么长出来的？",o:["靠随机初始化的微小差异 + 正反馈：路由器偏向某专家一点 ⇒ 它变好一点 ⇒ 路由器更偏向它","先训好路由器，再训专家","人为给每个专家指定一个领域","用聚类算法把输入分组"],a:0,w:"⚠ 而这个正反馈也正是 routing collapse 的成因 —— 它可能让一两个专家吃掉全部流量，所以必须额外加一项负载均衡损失。"});

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⇒ 因为我们要的是「不让所有人参与」，从而在算力上省下来",640,386,"d");},"<b>比喻又回来了，而它把稠密 MoE 的性质说得很形象。</b><br><b>讲者的话</b>：<b>「<u>所以回到我刚才那个例子，假设我有一个数学问题。所以我会去问数学家、化学家、历史学家。所以我多半会给数学家说的话加一个更高的权重，相比于比如说历史学家。所以这就是那个想法。但接着有意思的事情是，当我们去约束被激活的专家数量时 —— 因为这里，正如我们之前提到的，我们感兴趣的是不让所有人都参与进来，从而在我们做的计算量上省下一些</u>。」</b><br><b>★★★ 这个比喻版本把问题暴露得很清楚：<u>你还是把所有四个人都问了一遍</u></b>：<b>⇒ 你占用了历史学家的时间去回答一个数学问题，<u>然后给他的答案打了很低的分</u>。</b><b>⇒ <u>浪费的是「问」这个动作，而不是「听」这个动作</u>。</b><br><b>★★ 而在模型里，「问」就是前向传播的计算，「听」只是乘一个权重。</b><b>⇒ <u>所以成本全在「问」上 —— 而稠密 MoE 一个都没省</u>。</b><br><b>⇒ <u>于是真正的方案必须是：连问都不问</u>。而这就是稀疏 MoE。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$\\hat{y}=\\sum_{i\\in\\mathrm{top}\\text{-}k}G_i(x)\\,E_i(x)$$","top");

  note("⇒ 这正是稠密和稀疏的全部差别 —— 不在加权，在「算不算」",640,368,"d");},"<b>公式只改了一个地方，而那一处就是全部的节省。</b><br><b>讲者的话</b>：<b>「<u>而所以这里，输出的表达式变成了：对所有被选中的专家，求 G(x) 乘 E(x) 的和</u>。」</b><br><b>★★★ 把两条公式并排看，差别只在求和号下面那一行</b>：<b>⇒ <u>稠密</u>：<u>Σ_{i=1}^{n}</u> —— 所有 n 个。</b><b>⇒ <u>稀疏</u>：<u>Σ_{i ∈ top-k}</u> —— 只有 k 个。</b><br><b>★★ 而这个区别在<u>实现</u>上才是关键的</b>：<b>⇒ 数学上你可以说「把没选中的权重设成 0，再对所有 i 求和」—— <u>结果一样</u>。</b><b>⇒ 但那样做<u>一分钱都省不下</u>，因为你还是算了所有 E_i(x)。</b><br><b>⇒ <u>真正的节省来自「根本不去调用那些专家的网络」</u> —— 这是一个控制流上的决定，不是一个数学上的。</b><br><b>⚠ 这和 L2 那个「滑动窗口到底省不省」是<u>同一类问题</u>：<u>概念上的稀疏，只有落到实现上「真的跳过计算」，才变成真实的节省</u>。</b><b>⇒ <u>而 MoE 的实现也确实很讲究（专家并行、token 重排、容量因子），这是它工程上最复杂的部分</u>。</b>");
  SUM(0,8,{h:"⭐ 两种 MoE：稠密的和稀疏的",k:"讲者主动点出矛盾：<b>我说的是「只激活一个子集」，但那条公式其实假设把所有专家的输出都考虑了</b> ⇒ 区分两种。<b>dense MoE</b>：<b>对参与的专家数量没有任何约束，权重可以是 0 到 1 之间任何值（想成一个概率分布），它只是给某些专家更多权重</b>（比喻版：数学问题还是问了数学家、化学家、历史学家，只是给数学家更高权重）。<b>sparse MoE</b>：<b>只选「top k」个专家，k 可以是 1 也可以是 2 —— 是你自己选的超参数</b>；公式的求和范围从「全部 n 个」变成「<b>被选中的那些</b>」。",m:"★★★ 请想清楚：<b>稠密 MoE 不省任何计算</b> —— 要算 Σ Gᵢ(x)Eᵢ(x) 就<b>必须先把每一个 Eᵢ(x) 都算出来，哪怕某个权重是 0.001</b> ⇒ <b>它的计算量比普通 FFN 还大 n 倍</b>。它的价值在<b>表达力</b>不在效率（n 个专家的加权组合比单个同样大小的网络能表达更复杂的函数，而且组合随输入变化 —— 这叫「条件计算」），<b>但在 LLM 这个语境下我们要的恰恰是效率</b>。⇒ 比喻版把问题暴露得很清楚：<b>你占用了历史学家的时间去回答数学问题，然后给他的答案打了低分 —— 浪费的是「问」这个动作，而成本全在「问」上</b>。",w:"★★ k 的取值小得出人意料：<b>Switch Transformer k=1；Mixtral 8×7B 是 8 选 2；DeepSeek-V3 是 256 个路由专家选 8（3%）外加 1 个总是激活的共享专家</b> —— 这就是「稀疏」的字面含义（<b>权重向量里只有极少数非零</b>）。⚠ k 的选择是真实权衡：<b>k 越小越省算力但每个 token 能调用的知识越少；k=1 还有个麻烦 —— 梯度只流向那一个专家、训练更不稳定</b>，所以 <b>k=2 成了常见折中（至少两个专家竞争同一个 token，分工更容易形成）</b>。",r:"★★★ 公式只改了求和号下面那一行，<b>而这个区别在「实现」上才是关键</b>：数学上你可以说「把没选中的权重设成 0，再对所有 i 求和」，结果一样，<b>但那样一分钱都省不下 —— 真正的节省来自「根本不去调用那些专家的网络」，这是一个控制流上的决定而不是数学上的</b>。⚠ 这和 L2 那个「滑动窗口到底省不省」是<b>同一类问题</b>：<b>概念上的稀疏，只有落到实现上「真的跳过计算」才变成真实节省</b>（而 MoE 的实现也确实讲究：专家并行、token 重排、容量因子，是它工程上最复杂的部分）。⇒ 另：讲者主动点出自己刚埋的矛盾值得学 —— <b>让每一个新概念都去回答一个刚刚暴露出来的问题</b>。"});

  note("⇒ 所以它基本上量化「你这个任务有多吃算力」",640,362,"d");},"<b>这是该记住的那个单位，而讲者先问了一句「你们见过这个词吗」。</b><br><b>讲者的话</b>：<b>「<u>所以我要说的一件事是：我们有一个量度单位，用来量这些模型每一次传播产生的计算量。所以你会看到 FLOPS 这个词。你们在外面见过 FLOPS 这个词吗？没有，不太见过。所以它代表 floating-point operations（浮点运算）。所以它量化有多少次运算 —— 把它想成加法、乘法，比如在一次前向传播里涉及的。而它基本上量化你这个任务有多吃算力</u>。」</b><br><b>★★ 这又是那个动作：<u>用一个术语之前先确认听众有</u>（这门课第四次了）。</b><b>⇒ 而这次的回答是「<u>不太见过</u>」⇒ 于是他给了完整的展开和定义。</b><br><b>★★★ 一个容易混的地方值得说清楚</b>：<b>⇒ <u>FLOPs</u>（小写 s）= floating-point operation<u>s</u>，<u>运算的「总数」</u>。</b><b>⇒ <u>FLOPS</u>（大写 S）= floating-point operations per <u>second</u>，<u>每秒的运算数，是「速度」</u>。</b><br><b>⇒ 讲者这里说的是<u>前者</u>（一次前向有多少次运算）。</b><b>⚠ 而文献里这两个经常混用，<u>只能靠上下文分辨：论「模型多大/训练多贵」用前者，论「显卡多快」用后者</u>。</b>");

  SUM(0,9,{h:"FLOPS：量算力的那个单位",k:"<b>FLOPS = floating-point operations（浮点运算）</b> —— <b>它量化「有多少次运算」（想成加法、乘法，比如一次前向传播里涉及的），基本上量化你这个任务有多吃算力</b>。而结论：<b>走稀疏 MoE 而不是稠密 MoE，你有「更低的」FLOPS</b>。讲者顺带指路：<b>这里面还有多得多的内容，有兴趣就看幻灯片底部的资源</b>。",m:"★★★ 用 FLOPS 这个单位，MoE 的价值能被精确说出来：<b>参数量上 MoE 比同等稠密模型大很多（n 份 FFN），而 FLOPS 上它和一个小得多的稠密模型差不多（只跑 k 份）</b> ⇒ 一句话：<b>MoE 让「参数量」和「FLOPS」脱钩</b>。而在这之前这两个数基本绑定（模型大一倍、算一次贵一倍），<b>MoE 打破了这个绑定，这就是它的全部意义</b>。⚠ 但第三个数没有脱钩：<b>显存 —— 全部 n 份专家都得驻留（你不知道下一个 token 路由到哪）</b> ⇒ <b>MoE 的真实画像是「FLOPS 便宜、显存昂贵」，所以它适合有大量显存的服务器而不适合单张消费级显卡</b>。",w:"⚠ 一个容易混的地方：<b>FLOPs（小写 s）是 operations 的「总数」，FLOPS（大写 S）是 per second、是「速度」</b> —— 讲者这里说的是前者。文献里两者常混用，<b>靠上下文分辨：论「模型多大/训练多贵」用前者，论「显卡多快」用后者</b>。⇒ 这也是这门课第四次「用术语前先确认听众有」，而这次回答是「不太见过」⇒ 他给了完整展开和定义。",r:"★★ 「<b>这里面还有多得多的内容</b>」是在<b>划边界</b>，而划边界本身有价值：<b>它告诉你现在学到的是简化版，而且讲者知道它是简化版 —— 于是你不会误以为「MoE 就这么点东西」</b>。⇒ 被省掉的东西值得知道「它们存在」：<b>容量因子（每个专家一次最多处理多少 token，超了就 token dropping）、专家并行（专家分布在不同 GPU 上，于是路由变成一次跨卡通信）、共享专家（DeepSeek 留一个总是激活的装通用知识）、无辅助损失的负载均衡（DeepSeek-V3 用偏置项代替额外损失项）</b> —— <b>知道它们存在，你读 MoE 论文时就不会迷路</b>。"});
  QUIZ(0,9,{t:"用 FLOPS 这个单位，MoE 的价值该怎么精确表述？",o:["它让参数量和显存同时下降","它让每秒能处理的 token 数翻倍","它让「参数量」和「FLOPS」脱钩 —— 参数很多但每次只算 k 份；而显存没有脱钩","它把 FLOPS 降到和注意力同一量级"],a:2,w:"⇒ MoE 的真实画像是「FLOPS 便宜、显存昂贵」—— 所以它适合有大量显存的服务器，而不适合单张消费级显卡。"});

  note("⚠ 对比：d_model 是 O(100)–O(1000)，而 D_FF 是 O(1000)–O(10000)",640,362,"r");},"<b>账的另一半，而对比一算出来，结论就显然了。</b><br><b>讲者的话</b>：<b>「<u>而注意力层，如果你记得，它基本上由那些投影矩阵组成。那些投影矩阵的维度是什么？所以是 d_model 乘 key 的维度、query 的维度、value 的维度。而这个维度典型地低得多 —— 所以把它想成 100 这个量级。所以你的 d_model 典型是 100 这个量级、1000 这个量级。而这里的投影，那个 D_FF 是 1000 这个量级、10000 这个量级</u>。」</b><br><b>★★★ 把两边的量级并排写</b>：<b>⇒ <u>注意力的投影</u>：<u>d_model × d_k</u>，而 <u>d_k ≈ 100</u>（Llama 3 是 128）。</b><b>⇒ <u>FFN</u>：<u>d_model × D_FF</u>，而 <u>D_FF ≈ 10000</u>（Llama 3 是 14336）。</b><b>⇒ ⇒ <u>FFN 的每个矩阵比注意力的每个矩阵大约 100 倍</u>。</b><br><b>★★ 不过要公平一点：<u>注意力有 4 个投影矩阵（W_q、W_k、W_v、W_o），而且 W_q 和 W_o 是 d_model × d_model 级别的</u>。</b><b>⇒ 算下来 Llama 3 8B 的注意力部分每层约 <u>0.42 亿</u>，<u>FFN 约 1.76 亿（SwiGLU 三矩阵）</u>。</b><b>⇒ <u>比例大约 1 : 4</u>。</b><br><b>⚠ 所以讲者说「低得多」是对的，<u>虽然实际比例没有 100 倍那么夸张</u>。</b><b>⇒ <u>但 4 倍已经足够让答案显然了：要省，就省 FFN</u>。</b>");

  SUM(0,10,{h:"⭐⭐ MoE 该放在哪：三个候选与那笔账",k:"问题：<b>假设我们想在 LLM 里放一些 MoE —— 放在哪？三个选择：masked self-attention 层、feedforward neural network、那个归一化</b>。提示：<b>你觉得网络里「最复杂」的部分在哪？哪里有大量的运算？</b>⇒ 学生答 <b>Feedforward</b>，讲者：<b>很好的回答，确实就是前馈神经网络</b>。然后他用一笔参数账证给你看：<b>FFN 是 D → D_FF → D（D_FF 典型比输入维度大），参数量约 2·d_model·D_FF（+偏置）；而注意力层由投影矩阵组成、维度是 d_model × d_k，而 d_k 典型低得多</b>（<b>d_model 是 O(100)–O(1000)，D_FF 是 O(1000)–O(10000)</b>）。",m:"★★★ 这段最该学的不是结论，是<b>判据</b>：<b>MoE 的目的是省 FLOPS ⇒ 它应该放在 FLOPS 最多的那个部件上</b>。归一化可以立刻排除（<b>只是减均值除标准差，运算量 O(d)，差好几个数量级</b>），真正的竞争在注意力和 FFN 之间。⇒ 代入真实的数（Llama 3 8B，d_model=4096、D_FF=14336）：<b>FFN 每层 2×4096×14336 ≈ 1.17 亿，32 层约 37.6 亿；而模型总共 80 亿 ⇒ FFN 占约 47%（SwiGLU 三矩阵时约 70%）</b> —— <b>「FFN 是最大的那块」在参数账上是字面成立的</b>。",w:"⚠ 公平一点：<b>注意力有 4 个投影矩阵（W_q/W_k/W_v/W_o），而 W_q 和 W_o 是 d_model × d_model 级别</b>，算下来 Llama 3 8B 每层<b>注意力约 0.42 亿、FFN 约 1.76 亿，比例约 1:4</b> —— 讲者说「低得多」是对的，<b>虽然实际没有 100 倍那么夸张，但 4 倍已足够让答案显然</b>。⇒ FFN 的形状「先放大再压回来」（原论文 512→2048→512，放大 4 倍；Llama 3 是 4096→14336→4096）：<b>中间层越宽能表达的函数越复杂，而且它是唯一有非线性的地方（注意力层除了 softmax 基本是线性的）</b> ⇒ <b>FFN 是 transformer 里主要的「非线性计算」和「知识存储」的地方</b>（有研究把它看成「键值记忆」：第一个矩阵是键、第二个是值，事实知识主要存这里）。",r:"★★★ 收口时讲者用的是「<b>信服（convinced）</b>」而不是「记住（remember）」—— 他完全可以在学生答对后就往下走，<b>但他花了三镜算参数量，于是你是被「说服」的</b>。⇒ 差别在<b>可迁移性</b>：「记住 MoE 放在 FFN」换个架构就不知道放哪了；而「<b>MoE 该放在参数量/计算量最大的那个部件上</b>」这个判据到哪都能用（换成视觉 transformer 你立刻知道还是放 FFN，换成 CNN 你会去找最宽的卷积层）⇒ <b>这一整段的价值不在「MoE 放在 FFN」这个事实，而在那笔账的算法</b>。⇒ 另：答案对了他还是要证一遍，这也是这门课的态度 —— <b>一个结论被答对了，不等于它被理解了</b>。"});
  QUIZ(0,10,{t:"决定「MoE 该放在哪个部件」的判据是什么？",o:["放在参数最少的部件上以免影响质量","MoE 的目的是省 FLOPS ⇒ 放在 FLOPS/参数量最大的那个部件上，而那是 FFN","放在归一化之后","放在最靠近输出的那一层"],a:1,w:"★★★ 这个判据可迁移：换成视觉 transformer 你立刻知道还是放 FFN，换成 CNN 你会去找最宽的卷积层。而「记住 MoE 放在 FFN」换个架构就不知道了。"});
});

  SUM(0,11,{h:"专家就是 FFN，路由在 token 层面做",k:"12:24 那个挂起来的问题有答案了：<b>这些专家其实就是「前馈神经网络」—— 你有好几个可以训练的网络，但只激活其中一个（典型 k=1，也可以 2，但只会是一个子集）</b>；所以现代 LLM 里 <b>MoE 就放在 FFN 的位置，而且典型是稀疏的</b>。而<b>这个路由是在「token 层面」做的</b>：decoder 接收一堆 token，<b>每一个 token 都会被一个「可能和别的 token 不同」的专家处理</b>；<b>路由器拿这个 token 的「表示」作输入，判断它该流向哪个专家</b>。",m:"★★★ 结构其实很简单：<b>原来一个 block 里有「一个」FFN，MoE 之后同一位置上有「n 个」FFN（每个和原来一样大）外加一个很小的路由器，每个 token 只走其中 k 个</b> ⇒ <b>参数量约 n 倍，而 FLOPS 只有 k 倍</b>。⚠ Mixtral 8×7B 的名字容易算错：<b>「8×7B=56B」是错的 —— 只有 FFN 被复制了 8 份，注意力层是共用的，所以实际总参数 47B，每 token 激活约 13B</b>。",w:"★★★ 「token 层面」最容易想错，<b>因为那个「房间里的专家」比喻暗示的是「一个问题找一个专家」</b> —— 你会以为输入一个数学问题就整句交给数学家，<b>但实际不是</b>：「求 3 的平方根」这句话里<b>「求」可能去 2 号、「3」去 7 号、「平方根」去 2 号、「的」去 5 号 —— 每个 token 独立路由，而且每一层的路由都是独立的</b>（同一 token 第 3 层去 2 号、第 4 层可能去 11 号）。⚠ 这就是为什么<b>专家不对应学科</b>：一个只处理单 token、每层重选一次的机制，<b>分化出来的不可能是人类的知识门类</b>（研究发现更多是按标点、数字、某种语法角色这类表层特征分化）。",r:"★★ 「这个 token 的<b>表示</b>」不是「这个词」：<b>在第 L 层，它已经过了 L−1 层自注意力、吸收了整句话的信息</b> ⇒ 「bank」在 river bank 和 bank account 里<b>到第 5 层已经是两个不同的向量，于是可以被路由到不同专家</b> —— <b>这个性质让「按 token 路由」不像听起来那么粗糙</b>。⚠ 但也有个后果：<b>第 1 层的路由几乎没有上下文可用（表示只是词嵌入+位置）</b>，所以有些模型<b>在最前面几层不用 MoE</b>，等表示「熟」了再稀疏化。⇒ 另：讲者在这里把 11:51 那个训练问题重新捡起来 —— 这种「<b>先给简短答案、推迟细节、在合适时回来展开</b>」的讲法有道理：<b>学生当时还不知道专家是 FFN、路由在 token 层面，那时候讲 routing collapse 是讲不清的</b>，所以<b>「推迟」不是回避，是在等前提齐备</b>。"});

  note("⇒ 而那正是缓解 routing collapse 这个现象的东西",640,292,"y");

  note("⚠ 字幕里 writer 是 router 的转写错误",640,362,"d");},"<b>讲者第二次把这一段收到同一句话上，而他的用词一直很一致。</b><br><b>讲者的话</b>：<b>「<u>而我想我希望你记住的是：这个激励了路由器的选择在各个专家之间更均匀，而那正是缓解这个 routing collapse 现象的东西</u>。」</b><br><br><b>（字幕里的 writer 是 router 的转写错误。）</b><br><b>★★ 把他在这一段用过的三个动词并排看，它们是一致的</b>：<b>⇒ <u>mitigate（缓解）</u>、<u>allows ... to converge more towards（让…更趋向于）</u>、<u>incentivizes（激励）</u>。</b><b>⇒ <u>没有一个是「保证」「强制」「确保」</u>。</b><br><b>★★★ 这个一致性说明他对这件事的性质是清楚的：<u>负载均衡是一个软约束</u></b>：<b>⇒ 它在损失里给不均匀<u>标了一个价</u>。</b><b>⇒ 而模型<u>可以付这个价</u> —— 如果不均匀能在主任务上赚回更多。</b><br><b>⇒ <u>所以训练完之后，专家的使用率并不会真的均匀，只是不会坍缩到一两个</u>。</b><br><b>⚠ 实践中人们会<u>监控专家使用率的分布</u>，而一个健康的 MoE 大致是「<u>有差异但没有极端</u>」。</b><b>⇒ <u>这正是 35:06 那张 Mistral 图要展示的东西</u>。</b>");
  SUM(0,13,{h:"⭐ 负载均衡损失：f_i 和 P_i",k:"那个额外的损失项：<b>一个超参数 α × 专家数量 n × 一个求和（求和里的量取决于 token 有没有去到某个专家 i）</b>。⭐⭐⭐ 而讲者明说「<b>你不必完全弄懂这条公式怎么运作 —— 我认为你该从这一页带走的唯一一件事，就是这个额外的损失让这些量更趋向于均匀分布</b>」。两个量：<b>f_i = 被路由到专家 i 的 token 占比；P_i = 专家 i 的平均路由概率</b>。算的时机：<b>就当成常规训练流程 —— 走一个 mini batch、过模型、算出这些量、基于它反向传播</b>。",m:"★★★ 两个量的区别是「<b>实际</b>」和「<b>意愿</b>」：<b>f_i 是这批 token 里实际有多少比例去了专家 i（一个计数，经过了 top-k 的硬截断）；P_i 是门控给它的 softmax 概率的平均（连续量，没有截断）</b>。⇒ 为什么相乘：<b>因为 f_i 不可导而 P_i 可导 —— f_i 是数出来的、梯度传不回去，而 f_i·P_i 这个乘积里梯度可以通过 P_i 流回路由器</b> ⇒ <b>f_i 起的是「权重」作用：某个专家实际收得多，就把它的 P_i 往下压得更狠</b>。",w:"★★ 讲者在这一段用的三个动词是一致的：<b>mitigate（缓解）、converge more towards（更趋向于）、incentivizes（激励）—— 没有一个是「保证」「强制」「确保」</b> ⇒ <b>负载均衡是一个软约束：它在损失里给不均匀标了一个价，而模型可以付这个价（如果不均匀能在主任务上赚回更多）</b> ⇒ <b>训练完之后专家使用率并不会真的均匀，只是不会坍缩到一两个</b>。实践中人们会监控这个分布，<b>健康的 MoE 大致是「有差异但没有极端」</b>。",r:"★★★ 「<b>唯一一件事</b>」这种说法在教学里很有价值 —— 一页上有公式、记号、超参数，<b>看起来每样都要学，而他替你做了取舍：公式的形式不重要，它造成的效果才重要</b>。而形式确实不重要：<b>这条公式有很多变体（Switch 用 f_i·P_i，别的用方差、用熵），形式各异但目标完全一样 —— 惩罚不均匀</b>，所以记住「有一项额外损失在推着流量变均匀」就够读懂任何 MoE 论文的这一节。⇒ α 很小（典型 0.01 量级）：<b>太大会压过主任务（为分匀而牺牲预测质量），太小又拦不住坍缩 —— 取值区间很窄</b>。⇒ 「mini batch」是关键：<b>均匀性只在一批 token 的统计意义上才有定义</b>，所以 <b>batch 越小 f_i 噪声越大</b>（8 个 token、64 个专家时大部分 f_i 都是 0，信号几乎是噪声）⇒ <b>MoE 训练需要足够大的 batch</b>；而分布式下 <b>f_i 要全局统计，那需要一次跨卡通信</b>。"});
  QUIZ(0,13,{t:"负载均衡损失里为什么要把 f_i 和 P_i 相乘？",o:["为了让数值更稳定","因为两者都是概率，相乘得到联合概率","f_i 是数出来的、不可导，P_i 可导 ⇒ 乘积里梯度通过 P_i 流回路由器，而 f_i 起「权重」作用","为了归一化到 0-1 之间"],a:2,w:"⭐ 而讲者明说这一页唯一要带走的是：这个额外损失让那些量「更趋向于均匀分布」—— 公式的形式有很多变体，目标都一样。"});
});

  note("⚠ 这个提问的直觉其实很对 —— Dropout 和负载均衡在做同一类事",640,362,"r");},"<b>这个提问的直觉很对，而讲者的回答是开放式的。</b><br><b>学生的问题</b>：<b><u>我们能用 Dropout 吗？</u></b><b>讲者：<u>当然。你总是可以把它和某些别的技术捆在一起用。所以人们只是发现这个（负载均衡损失）非常有帮助。</u></b><br><b>★★★ 为什么这个提问的直觉很对：<u>Dropout 和负载均衡损失在做同一类事 —— 都是在对抗「过度依赖少数单元」</u></b>：<b>⇒ <u>Dropout</u>：随机把一些神经元置零 ⇒ <u>网络不能只依赖某几个神经元，因为它们随时可能消失</u>。</b><b>⇒ <u>负载均衡损失</u>：惩罚流量集中 ⇒ <u>路由器不能只依赖某几个专家</u>。</b><br><b>★★ 两者的机制不同（一个靠随机，一个靠惩罚），<u>但要对付的病是同一个：少数单元垄断</u>。</b><br><b>⇒ 所以学生想到 Dropout 是完全合理的类比。</b><br><b>⚠ 而讲者说「<u>人们只是发现这个很有帮助</u>」是一句很实在的话：<u>两种都能用，而实践选了后者，因为它更直接地针对路由这件事</u>。</b><b>⇒ <u>Dropout 是一个通用的正则，而负载均衡损失是一个专门的度量</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("24:28","So it is called noisy gating");

  boxNode(130,214,1020,44,"说到别的技术 —— 有一个我没讲过的，它和 Dropout 的想法「非常像」","g");
  note("⇒ noisy gating（带噪声的门控）：你有门控的预测，然后你往上「加一点噪声」",640,292,"y");
  note("★★ 于是「纯靠偶然」，它让别的专家也能参与到计算里",640,324,"g");
  note("⚠ 注意这是在「选 top-k 之前」加噪 —— 噪声改变的是排名",640,362,"r");},"<b>学生的提问引出了一个讲者本来没打算讲的技术，而它很值得知道。</b><br><b>讲者的话</b>：<b>「<u>所以说到别的技术 —— 有一样我没有讲过的东西，它和 Dropout 这个想法非常像。所以它叫 noisy gating。Noisy gating 基本上就是：你有你从门控来的那些预测，但接着你往它上面加一些噪声。所以基本上，纯靠偶然，它就让别的专家也能参与到计算里</u>。」</b><br><b>★★★ 这个技术的要害在于「<u>加噪的位置</u>」：<u>在 top-k 选择之前</u></b>：<b>⇒ 门控算出 n 个分数 ⇒ <u>每个分数上加一个小的随机扰动</u> ⇒ 再取 top-k。</b><b>⇒ 于是一个本来排第 3 的专家，<u>有机会靠噪声挤进前 2</u>。</b><br><b>★★ 为什么这能治坍缩：<u>它强行打断了那个正反馈</u></b>：<b>⇒ 正反馈的链条是「A 排第一 ⇒ A 被选 ⇒ A 变好 ⇒ A 更稳地排第一」。</b><b>⇒ <u>而噪声让「排第一」不等于「被选中」</u> —— 排第二第三的也有机会。</b><b>⇒ <u>于是它们也能拿到训练信号，不至于饿死</u>。</b><br><b>⚠ 而「<u>和 Dropout 非常像</u>」这个类比是准确的：<u>两者都是「用随机性打断确定性的垄断」</u>。</b><b>⇒ 这是正则化里一个非常通用的手法。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("24:53","There is a bunch of techniques");
  note("讲者的收口，以及一句很通用的话",640,186,"v");
  boxNode(130,214,1020,44,"所以它也是另一种技术 —— 技术有一大堆","g");
  note("⇒ 但是的，Dropout 对「过拟合」这类问题确实挺有用",640,292,"y");
  note("★★ 而他补的那一句最值得记：这个想法可以在不同的场景里被「复用」",640,324,"g");
  note("⚠ 「同一个想法换个场景再用一次」—— 这是读文献时最该培养的眼光",640,362,"r");},"<b>这一镜的收口里有一句很通用的话，值得单独拎出来。</b><br><b>讲者的话</b>：<b>「<u>所以它也是某种别的技术。技术有一大堆。不过是的，Dropout 对于像过拟合这样的问题确实相当有用。而这个想法可以在不同的场景里被复用</u>。」</b><br><b>★★★ 「<u>这个想法可以在不同的场景里被复用</u>」—— 这句话说的是一个很有用的眼光</b>：<b>⇒ 把 Dropout 的<u>想法</u>剥出来：<u>用随机性防止系统过度依赖某个部件</u>。</b><b>⇒ 然后你会发现它到处都是：</b><br><b>⇒ <u>Dropout</u>：随机丢神经元 ⇒ 防止依赖某些神经元。</b><b>⇒ <u>noisy gating</u>：给路由分数加噪 ⇒ 防止依赖某些专家。</b><b>⇒ <u>DropPath / Stochastic Depth</u>：随机跳过整层 ⇒ 防止依赖某些层。</b><b>⇒ <u>数据增强</u>：随机扰动输入 ⇒ 防止依赖某些像素/词。</b><br><b>★★ 四个名字，<u>一个想法</u>。</b><b>⇒ 而一旦你认出这个模式，<u>读到一个新名字时你不用从头学 —— 你只需要问「它在哪一层加随机性、防止依赖什么」</u>。</b><br><b>⚠ 这正是讲者说「<u>可以在不同场景里复用</u>」的实际含义。</b>");
  SUM(0,14,{h:"Dropout 与 noisy gating",k:"提问：<b>能用 Dropout 吗？⇒ 当然，你总是可以把它和别的技术捆在一起用 —— 人们只是发现「这个（负载均衡损失）」非常有帮助</b>。而讲者顺势补了一个没讲过的技术：<b>noisy gating —— 你有门控的预测，然后往上加一些噪声，于是「纯靠偶然」，它让别的专家也能参与到计算里</b>。收口：<b>技术有一大堆；Dropout 对过拟合确实挺有用，而这个想法可以在不同的场景里被「复用」</b>。",m:"★★★ 这个提问的直觉很对，因为 <b>Dropout 和负载均衡损失在做同一类事 —— 都是在对抗「过度依赖少数单元」</b>：Dropout 随机把神经元置零 ⇒ 网络不能只依赖某几个；负载均衡损失惩罚流量集中 ⇒ 路由器不能只依赖某几个专家。<b>机制不同（一个靠随机、一个靠惩罚），但要对付的病是同一个</b>。⇒ 而实践选了后者，因为<b>Dropout 是通用正则，负载均衡损失是专门针对路由的度量</b>。",w:"★★★ noisy gating 的要害在<b>加噪的位置：在 top-k 选择之前</b> —— 门控算出 n 个分数 ⇒ 每个加一个小随机扰动 ⇒ 再取 top-k ⇒ <b>一个本来排第 3 的专家有机会靠噪声挤进前 2</b>。为什么这能治坍缩：<b>它强行打断了那个正反馈</b>（链条是「A 排第一 ⇒ 被选 ⇒ 变好 ⇒ 更稳地排第一」，<b>而噪声让「排第一」不等于「被选中」，于是排第二第三的也能拿到训练信号、不至于饿死</b>）。",r:"★★★ 「<b>这个想法可以在不同场景里被复用</b>」说的是一个很有用的眼光：把 Dropout 的<b>想法</b>剥出来 —— <b>用随机性防止系统过度依赖某个部件</b> —— 然后它到处都是：<b>Dropout（随机丢神经元，防依赖某些神经元）、noisy gating（给路由分数加噪，防依赖某些专家）、DropPath/Stochastic Depth（随机跳过整层，防依赖某些层）、数据增强（随机扰动输入，防依赖某些像素/词）</b> ⇒ <b>四个名字，一个想法</b>。一旦认出这个模式，<b>读到新名字时不用从头学 —— 只需问「它在哪一层加随机性、防止依赖什么」</b>。"});
  QUIZ(0,14,{t:"noisy gating 治 routing collapse 的机制是什么？",o:["它在损失里加一个惩罚项","在 top-k 选择「之前」给分数加噪 ⇒ 「排第一」不再等于「被选中」，打断了那个正反馈","它让门控输出更平滑","它随机丢弃一些专家的参数"],a:1,w:"★★★ 把这个想法剥出来就是「用随机性防止系统过度依赖某个部件」—— Dropout、noisy gating、DropPath、数据增强，四个名字一个想法。"});
});

  note("⚠⚠ 这个坦白值得专门记一镜 —— 它比一个编出来的答案有价值得多",640,386,"r");},"<b>讲者当场承认答不上来，而这件事值得专门留一镜。</b><br><b>讲者的话</b>：<b>「<u>所以我想，对这个问题 —— 那个平均路由概率，那个是门控输出的函数，那个（没问题）。所以我想你的问题是关于 f_i。关于 f_i，好。我脑子里没有一个好的答案，但我想人们是有一些技术的。而如今，你甚至都不用自己手动去做这件事 —— 你有内置的现成实现。所以也许我可以课后再跟你聊 f_i 这个</u>。」</b><br><b>★★★ 三件事他做对了</b>：<b>⇒ ① <u>先把能答的答了</u>：P_i 没问题，它是门控输出的函数，可导。</b><b>⇒ ② <u>精确地定位了答不上的那一部分</u>：是 f_i。</b><b>⇒ ③ <u>承诺后续跟进</u>，而不是含糊过去。</b><br><b>★★ 而正确答案其实不复杂，<u>这里补上</u></b>：<b>⇒ <u>f_i 确实不可导 —— 但它不需要可导</u>。</b><b>⇒ 在 Switch Transformer 的实现里，<u>f_i 被当成一个「常数」处理（detach / stop-gradient）</u>。</b><b>⇒ 梯度<u>只通过 P_i 那一侧流回去</u>。</b><br><b>⇒ 所以 <u>∂(f_i·P_i)/∂θ = f_i · ∂P_i/∂θ</u> —— <u>f_i 只是一个系数</u>。</b><br><b>⚠ 讲者那句「<u>有内置的现成实现</u>」也是对的：<u>框架里 detach 一下就行，不用手推</u>。</b>");

  stack(640,200,["门控：把输入向量投影到一个「n 维」的空间（n = 专家数）","过一次 softmax ⇒ 所以输出加起来等于 1","每一维对应「那个专家会被用到的程度」"],620,32,8);
  note("⇒ 比如第一维对应专家 1、第二维对应专家 2，等等",640,328,"y");
  note("★★ 而 P_i 就是「把这个取平均」—— 所以它能用全部参数表达出来",640,356,"g");
  note("⚠ 所以 P_i 这一侧完全可导：投影 → softmax → 平均，全是光滑运算",640,386,"r");},"<b>P_i 这一半讲者讲得很干净，而它正好解释了为什么只有 f_i 有问题。</b><br><b>讲者的话</b>：<b>「<u>所以基本上那个概率 —— 门控输出的概率，你可以把它想成就是那个向量被投影到一个 n 维的空间上，其中 n 对应你的专家数量。然后它过了一次 softmax。所以你的输出基本上加起来等于 1。而每一个这些维度，它们代表对应着「专家 i 会被用到什么程度」的那个值。比如第一维会是给专家 1 的、第二维会是给专家 2 的，等等。所以你就取这个的平均，而这一个你可以用所有的参数表达出来</u>。」</b><br><b>★★★ 把整条路径写出来，可导性就一目了然</b>：<b>⇒ <u>x</u>（token 的表示，d 维）<u>→ 乘一个 d×n 的矩阵 → n 个分数 → softmax → n 个概率</u>。</b><b>⇒ <u>再对一个 batch 里所有 token 求平均 ⇒ P_i</u>。</b><br><b>★★ 而这条路径上的每一步 —— <u>矩阵乘法、softmax、求平均</u> —— <u>全都是光滑可导的</u>。</b><b>⇒ 所以讲者说「<u>这一个你可以用所有的参数表达出来</u>」，意思就是：<u>它是参数的一个显式可导函数</u>。</b><br><b>⚠ 对比 f_i：<u>它中间夹了一个 top-k，而那一步是「取最大的 k 个」—— 一个排序加截断的操作，没有导数</u>。</b><b>⇒ <u>这就是两者的全部差别</u>。</b>");
  SUM(0,15,{h:"一个可导性提问，与讲者的诚实",k:"提问：<b>这东西怎么求导？</b>讲者先确认问题（<b>你是说「可导」吗？你能再解释一下你担心的是什么吗？</b>），然后：<b>平均路由概率 P_i 是门控输出的函数，那个没问题；而对 f_i —— 我脑子里没有一个好答案，但我想人们是有一些技术的；如今你甚至不用自己手动做，有内置的现成实现；也许我可以课后再跟你聊 f_i</b>。而 P_i 那一半他讲得很清楚：<b>门控把输入向量投影到一个 n 维空间、过 softmax（所以加起来为 1），每一维对应一个专家；P_i 就是取这个的平均</b>。",m:"★★★ 学生的担心有道理：<b>f_i 是「被路由到专家 i 的 token 占比」，这个量是数出来的、涉及 top-k 这个硬选择，而硬选择是阶跃的、不可导的</b> ⇒ 那 ∂L_aux/∂(路由器参数) 怎么算？⇒ 正确答案其实不复杂（这里补上）：<b>f_i 确实不可导 —— 但它不需要可导。Switch Transformer 的实现里把 f_i 当成「常数」处理（detach / stop-gradient），梯度只通过 P_i 那一侧流回去 ⇒ ∂(f_i·P_i)/∂θ = f_i · ∂P_i/∂θ，f_i 只是一个系数</b>。讲者那句「有内置的现成实现」也是对的。",w:"★★ P_i 的完整路径：<b>x（d 维）→ 乘一个 d×n 矩阵 → n 个分数 → softmax → n 个概率 → 对 batch 里所有 token 求平均 ⇒ P_i</b>，而这条路径上<b>每一步（矩阵乘法、softmax、求平均）全都是光滑可导的</b> —— 所以「这一个你可以用所有参数表达出来」意思就是<b>它是参数的一个显式可导函数</b>。⚠ 对比 f_i：<b>中间夹了一个 top-k，那是「取最大的 k 个」—— 排序加截断，没有导数</b>。这就是两者的全部差别。",r:"⚠⚠ 这个坦白值得专门记一镜 —— <b>它比一个编出来的答案有价值得多</b>。而讲者做对了三件事：<b>① 先把能答的答了（P_i 没问题）② 精确地定位了答不上的那一部分（是 f_i）③ 承诺课后跟进，而不是含糊过去</b>。⇒ 另：「<b>先确认问题</b>」这个动作在这门课里出现得很频繁（L2 的 51:55 也是「你是说 softmax 吧？」），值得学 —— <b>课堂提问往往是模糊的，而答错一个问题比承认没听清更糟：学生会以为疑惑被回应了，然后带着没解决的疑惑往下走</b>。"});
  QUIZ(0,15,{t:"负载均衡损失里 f_i 不可导，实际是怎么处理的？",o:["对 f_i 做平滑后再求导","用一个可导的近似替代 top-k","改用强化学习训练路由器","把 f_i 当成常数处理（detach / stop-gradient），梯度只通过 P_i 那一侧流回去"],a:3,w:"⚠⚠ 讲者当场承认「我脑子里没有一个好答案」—— 这个坦白比一个编出来的答案有价值得多。而他做对了三件事：先答能答的、精确定位答不上的、承诺课后跟进。"});

KP("16 · ⭐ MoE 会增加参数量吗？会 —— 而这正是重点",function(){

  note("⇒ 那个想法就是：你可以「把模型 scale 上去」",640,292,"y");
  note("★★ 而不必承担「推理时显著更多算力」的那个代价",640,324,"g");
  note("⚠ 所以答案是「会增加」—— 但那不是副作用，那是目的",640,362,"r");},"<b>这个提问的答案很干脆：会增加，而那正是重点。</b><br><b>讲者的话</b>：<b>「<u>所以问题是，如果我们增加 MoE 的数量，它会增加模型参数的数量吗？所以这是个很好的问题。所以这其实正是基于 MoE 的模型背后的想法之一 —— 那就是你可以把模型 scale 上去，而不必承担「推理时显著更多算力」的那个代价</u>。」</b><br><b>★★★ 这个回答把问题整个翻转了</b>：<b>⇒ 学生问的语气像是在担心一个<u>副作用</u>（「加了 MoE，参数会不会变多？」）。</b><b>⇒ 而讲者说：<u>参数变多恰恰是目的</u>。</b><br><b>★★ 为什么你会「想要」参数变多</b>：<b>⇒ 因为<u>参数量大致决定了模型能记住多少、能表达多复杂的函数</u>。</b><b>⇒ 而 scaling law 说：<u>参数越多，损失越低</u>（在数据跟得上的前提下）。</b><br><b>⇒ 所以<u>每个人都想要更多参数</u> —— 拦着他们的是<u>算力</u>。</b><br><b>⇒ <u>而 MoE 恰好把这两件事拆开了：参数可以涨，算力可以不涨</u>。</b><br><b>⚠ 所以这个问答的真正价值在于：<u>它把 MoE 从一个「省算力的技巧」重新定位成了「突破规模上限的手段」</u>。</b><b>⇒ <u>两种说法指的是同一件事，但第二种才说出了动机</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("★★ 这两个词值得背下来 —— 读 MoE 模型的规格表时全靠它们",640,366,"r");},"<b>这两个词是读懂任何 MoE 模型规格表的钥匙。</b><br><b>讲者的话</b>：<b>「<u>所以你可以增加 —— 人们说 capacity（容量）。你可以增加你模型的容量，但你仍然会保持某个、我想、受控的活跃参数量。而活跃参数就是那些在一次前向传播里被用到的参数</u>。」</b><br><b>★★★ 把这两个数配到真实模型上，规格表就读得懂了</b>：<b>⇒ <u>Mixtral 8×7B</u>：总参数 <u>47B</u>，活跃参数 <u>13B</u>。</b><b>⇒ <u>DeepSeek-V3</u>：总参数 <u>671B</u>，活跃参数 <u>37B</u>。</b><b>⇒ <u>Llama 3 70B</u>（稠密）：总参数 <u>70B</u>，活跃参数 <u>70B</u> —— <u>两者相等</u>。</b><br><b>★★ 于是你可以用这两个数快速判断一个模型的性价比</b>：<b>⇒ <u>质量</u>大致跟着<u>总参数</u>走。</b><b>⇒ <u>推理速度和成本</u>大致跟着<u>活跃参数</u>走。</b><b>⇒ <u>显存</u>跟着<u>总参数</u>走。</b><br><b>⇒ 所以 DeepSeek-V3 的画像是：<u>质量对标 671B，速度对标 37B，而显存要求是 671B</u>。</b><br><b>⚠ 这就是为什么 MoE 是「<u>数据中心的技术</u>」：<u>它用你有的（显存）去换你缺的（算力）</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 而那是 2021 年的事 —— 在 GPT-3（1750 亿）之后不久",640,362,"r");},"<b>这是那个主张的证据，而它的时间点值得注意。</b><br><b>讲者的话</b>：<b>「<u>所以这就是为什么你会看到一些基于 MoE 的模型，甚至比我们之前说的那些几千亿量级的还要大。我们甚至有万亿参数这个量级的。所以比如这里，我推荐的一个读物是 Switch Transformer，它 scale 到了一点几万亿参数。所以是的，它确实更多</u>。」</b><br><b>★★★ 时间点很关键：<u>Switch Transformer 是 2021 年 1 月的工作</u>。</b><b>⇒ 而 GPT-3（1750 亿）是 <u>2020 年 5 月</u>。</b><b>⇒ 所以在 GPT-3 发布后半年多，<u>就有人把参数量推到了它的 8 倍</u>。</b><br><b>★★ 但这件事当年<u>没有引起 GPT-3 那样的轰动</u>，原因值得想</b>：<b>⇒ 因为 <u>1.6 万亿的 Switch Transformer，能力并不比 1750 亿的 GPT-3 强 8 倍</u>。</b><b>⇒ <u>甚至在很多任务上更弱</u>。</b><br><b>⇒ 原因是：<u>MoE 的「等效参数量」远小于它的总参数量</u>。</b><b>⇒ 一个粗略的经验是：<u>一个总参 N、活跃参 A 的 MoE，质量大约相当于一个 √(N·A) 的稠密模型</u>（几何平均）。</b><br><b>⚠ 所以读 MoE 的参数量时要有这个折扣意识 —— <u>「万亿参数」听起来惊人，但它不等于一个万亿参数的稠密模型</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("28:47","these models, there are more what they call sample efficient");

  note("★ 如果你把训练曲线画成训练时间的函数，就能看出来",640,326,"g");
  note("⚠ 而讲者最后那句话最该记：「这里的一切都是权衡」",640,364,"r");},"<b>这是 MoE 的另一个好处，而讲者的收尾那句话值得当成整段的总结。</b><br><b>讲者的话</b>：<b>「<u>不过话说回来，如果你读那篇论文，你还会看到这些模型更 sample efficient。所以它们花更少的时间，就能达到一个参数量更低的模型本来会达到的水平。所以如果你把训练曲线画成训练时间的函数，你会看到这些模型典型地更样本高效</u>。」</b><b>⇒ 而后面那句：<u>这里的一切都是一个权衡</u>。</b><br><b>★★★ 「<u>sample efficient（样本高效）</u>」的准确含义是：<u>达到同样的损失，需要更少的训练 token</u>。</b><b>⇒ 这很合理：<u>更多参数 ⇒ 更强的拟合能力 ⇒ 同样的数据能学到更多</u>。</b><b>⇒ 而 MoE 用<u>很低的计算代价</u>买到了这些参数。</b><br><b>★★ 所以 MoE 在训练上的账是双赢的：<u>每一步更便宜（FLOPS 低），而且需要的步数更少（样本高效）</u>。</b><br><b>⚠ 但「<u>一切都是权衡</u>」这句话是必要的平衡，<u>因为代价确实存在</u></b>：<b>⇒ <u>显存</u>：全部专家都要驻留。</b><b>⇒ <u>通信</u>：专家分布在多卡上，路由意味着跨卡传输。</b><b>⇒ <u>训练稳定性</u>：routing collapse、负载均衡损失要调。</b><b>⇒ <u>微调更难</u>：稀疏模型对小数据集的微调比稠密模型敏感。</b>");
  SUM(0,16,{h:"⭐ MoE 会增加参数量吗？会 —— 那正是目的",k:"提问：<b>增加 MoE 的数量会增加模型参数量吗？</b>⇒ <b>这正是 MoE 背后的想法之一：你可以把模型 scale 上去，而不必承担「推理时显著更多算力」的代价</b>。两个要分开的概念：<b>capacity（容量）可以提上去，而 active parameters（活跃参数 —— 一次前向传播用到的那些）仍然保持在一个「受控的量」</b>。证据：<b>有万亿参数量级的 MoE 模型，推荐读 Switch Transformer，它 scale 到了 1.x 万亿</b>。另一个好处：<b>这些模型更「sample efficient」—— 花更少时间就能达到一个参数量更低的模型的水平</b>。而收尾那句：<b>这里的一切都是一个权衡</b>。",m:"★★★ 这个回答把问题整个翻转了：<b>学生问的语气像是在担心一个副作用，而讲者说「参数变多恰恰是目的」</b>。为什么你会想要参数变多：<b>参数量大致决定模型能记住多少、能表达多复杂的函数，而 scaling law 说参数越多损失越低 —— 所以每个人都想要更多参数，拦着他们的是算力，而 MoE 恰好把这两件事拆开了</b> ⇒ 这个问答<b>把 MoE 从「省算力的技巧」重新定位成了「突破规模上限的手段」—— 同一件事，但第二种说法才说出了动机</b>。",w:"★★★ 这两个词是读懂 MoE 规格表的钥匙：<b>Mixtral 8×7B 总 47B / 活跃 13B；DeepSeek-V3 总 671B / 活跃 37B；Llama 3 70B（稠密）总 70B / 活跃 70B（两者相等）</b>。⇒ 快速判断：<b>质量大致跟着总参数走、推理速度和成本跟着活跃参数走、显存跟着总参数走</b> ⇒ DeepSeek-V3 的画像是「<b>质量对标 671B、速度对标 37B、显存要求 671B</b>」⇒ 所以 <b>MoE 是「数据中心的技术」：它用你有的（显存）去换你缺的（算力）</b>。",r:"⚠ 读 MoE 参数量要有折扣意识：<b>Switch Transformer（2021 年 1 月）1.6 万亿，在 GPT-3（2020 年 5 月，1750 亿）之后半年就把参数推到 8 倍，但它没引起同样的轰动 —— 因为能力并不强 8 倍，甚至在很多任务上更弱</b>。粗略经验：<b>一个总参 N、活跃参 A 的 MoE，质量大约相当于一个 √(N·A) 的稠密模型（几何平均）</b> ⇒ <b>「万亿参数」不等于一个万亿参数的稠密模型</b>。⇒ 「sample efficient」的准确含义是<b>达到同样损失需要更少训练 token</b>（更多参数 ⇒ 同样数据能学到更多），所以 <b>MoE 训练上是双赢：每步更便宜而且需要的步数更少</b>。⚠ 但「一切都是权衡」是必要的平衡，代价确实存在：<b>显存（全部专家驻留）、通信（跨卡路由）、训练稳定性（routing collapse、α 要调）、微调更难（稀疏模型对小数据集更敏感）</b>。"});
  QUIZ(0,16,{t:"读 MoE 模型规格表时，哪两个数必须分开看？",o:["总参数（capacity，决定质量和显存）和活跃参数（一次前向用到的，决定速度和成本）","专家数 n 和超参数 α","训练 token 数和 batch size","层数和头数"],a:0,w:"⚠ 而「万亿参数」要打折看：一个总参 N、活跃参 A 的 MoE，质量大约相当于一个 √(N·A) 的稠密模型。"});
});

  SUM(0,19,{h:"有几个路由器：每层一个，和头无关",k:"提问：<b>不同的头会有不同的（路由）判断吗？⇒ 不会，只有「一个」路由器</b>。理由：<b>注意力层里确实有这些不同的头，但在它的末尾，它把每个头的全部结果「拼接」起来、然后再投影一次回 d_model 空间</b>。再问：<b>有不同的 G 吗？⇒ 我能告诉你的唯一一件事是 —— G 是「层特定的」、是可训练的：第一层一个 G、第二层另一个 G，等等</b>。",m:"★★★ 学生的推理第一步就错了：<b>他以为「注意力层输出 h 个头各自的结果 ⇒ 那是 h 个东西 ⇒ FFN 要处理 h 个 ⇒ 要 h 个路由器」</b>。而走一遍形状就显然了：<b>h 个头各输出 n×d_k ⇒ 拼接成 n×(h·d_k) = n×d_model ⇒ 乘 W_o ⇒ n×d_model</b> ⇒ <b>走出注意力层的是 n 个 token、每个一个 d_model 向量，头在这一步已被合并掉</b> ⇒ FFN 和路由器面对的只是一个普通向量、和有没有多头完全无关。⚠ 这正是 L1 那个 <b>W_o</b> 的作用显出价值的地方：<b>它把多头这个内部细节「封装」起来，使下游部件不需要知道它的存在</b>。",w:"这个问题其实可以答得更满（分三个层面）：<b>① 不同层之间？是的，每层一个独立的 G ② 同一层的不同头之间？没有，头已经合并掉了 ③ 同一层里有多个 G 吗？没有，一层一个</b>。⚠ 例外值得知道：<b>有些 MoE 变体在同一层里对注意力和 FFN 各放一套专家，那就会有两个 G —— 但这不是主流</b>。",r:"★★★ 「每层一个独立路由器」意味着<b>不同层可以学出完全不同的分工逻辑</b>，而研究确实发现了：<b>浅层的路由更多按「表层特征」分（标点、数字、空格），深层的路由更多按「语义或任务」分</b> ⇒ 这和「表示越深越上下文化」一致（<b>浅层向量还接近原始词、只能按词的表层性质分；深层向量已高度抽象、能按更深的东西分</b>）⇒ <b>所以「每层独立」不是浪费，它让每层能按自己那一层的表示特点去组织分工</b>。⇒ 代价可以忽略：<b>32 个路由器 × 32768 参数 ≈ 105 万，在一个 470 亿参数的模型里几乎免费</b>。⇒ 另：讲者说「<b>我能告诉你的唯一一件事</b>」，和 26:15 那句「我脑子里没有好答案」是同一类 —— <b>在划自己知识的边界，而不是把能说的都说成确定的</b>。"});
  QUIZ(0,19,{t:"为什么多头注意力不需要配多个路由器？",o:["因为路由器可以并行处理多个头","因为路由在注意力之前做","注意力层末尾把各头结果拼接、再乘 W_o 投回 d_model ⇒ 走出来的是一个向量，头已经被合并掉了","因为每个头的输出都一样"],a:2,w:"⇒ 这正是 L1 那个 W_o 的价值：它把「多头」这个内部细节封装起来，使下游部件不需要知道它的存在。"});

  SUM(0,20,{h:"⭐ Mistral 那张图：每个 token 去了哪个专家",k:"讲者在确认时间还够之后，给你看一个「很酷的东西」（<b>相信是 Mistral 团队在某篇论文里展示的</b>）：<b>对一段给定的文本，显示每一个 token 被路由到了哪个专家</b>（而<b>专家在不同层之间是不同的，所以这是对某一个给定的层 —— 这里是第 0 层</b>）。结论：<b>我们确实看到，大致上这些 token 用到了「差不多均匀」数量的专家</b>。而真正的读法：<b>你「不希望」看到的是每一个 token 都是同一个颜色 —— 而幸运的是它不是</b>。",m:"★★★ 这张图的地位值得强调：<b>前面二十多分钟讲的全是机制（MoE 是什么、公式、放哪、怎么训、会坍缩、怎么治）—— 全是「设计上应该怎样」，而这张图回答的是「实际上到底怎样」</b>。⇒ 这正好是 L2 那个 attention map 的同类：<b>当一个机制的行为说不清时，去看它实际上在干什么</b> —— L2 用 attention map 回答「多头各自在学什么」，L3 用这张图回答「专家真的被均匀使用了吗」，<b>同一个套路，而它在两讲里都用在了最需要证据的地方</b>。",w:"★★★ 「<b>你不希望看到什么</b>」这个讲法比「你希望看到什么」有用得多：「希望看到均匀」是模糊的（多均匀算均匀？），<b>而「全是同一个颜色就坏了」是一个清晰的失败判据</b> ⇒ 于是这张图从「一个展示」变成「<b>一个可操作的诊断</b>」：<b>训完画一张，满屏一个颜色 ⇒ routing collapse，去调 α 或加 noisy gating；颜色杂乱但有结构 ⇒ 健康</b>，<b>五秒看一眼就能判断，不需要算任何指标</b>。⚠ 一般经验：<b>一个好的可视化，不是让你看出「它对不对」，而是让你一眼看出「它有没有坏」—— 前者需要专业判断，后者只需要注意力</b>。",r:"⚠ 留意那两个限定词「<b>大致上</b>」「<b>多多少少</b>」—— 它呼应 23:33 的「激励而不是强制」：<b>分布不是完美均匀的，它只是没有坍缩，而「没有坍缩」正是这项损失的目标，它从来不是要达到完美均匀</b>。⇒ 实际上<b>完美均匀反而是坏事</b>：<b>如果每个专家收到完全一样多的 token，说明路由器根本没在做任何有意义的区分（一个随机路由器就能做到完美均匀）</b> ⇒ <b>健康的状态是「有差异，但没有极端」</b>。⇒ 另：「<b>它是对某一个给定的层</b>」这个限定必要 —— <b>不存在「这个 token 的专家」，只存在「这个 token 在第 L 层的专家」，所以这张图必须每层画一张</b>；而讲者选的第 0 层恰好是路由信息最少的一层（表示还没怎么上下文化），<b>所以它展示的主要是「流量分布是否均匀」而不是「分工是否有语义」</b>。"});

  note("⚠ 注意这是一个视角的切换：从「模型长什么样」切到「它怎么被用」",640,362,"r");},"<b>这一讲的第二个主题开始了，而它是一个视角上的切换。</b><br><b>讲者的话</b>：<b>「<u>而现在我们要做的是，在知道我们有一个 LLM 的前提下，我们要聚焦在 —— 别担心 —— 我们要聚焦在「一个回答是怎么被生成的」。所以记得吗，当我跟你们说这些现代 LLM 做的事是：它们拿一些文本进来、然后有一些文本出去。所以它典型地就是 next token prediction 这个任务</u>。」</b><br><b>★★★ 这个切换值得标注清楚，<u>因为前后两半讲的是完全不同层面的东西</u></b>：<b>⇒ <u>上半场</u>：<u>模型内部长什么样</u>（MoE、专家、路由）。这是<u>架构</u>。</b><b>⇒ <u>下半场</u>：<u>给定一个训好的模型，怎么用它产出文本</u>。这是<u>解码（decoding）</u>。</b><br><b>★★ 而这两件事是<u>正交</u>的，这一点很重要</b>：<b>⇒ <u>同一个模型，可以用不同的解码策略</u>。</b><b>⇒ 你用 greedy 还是 sampling、温度设多少 —— <u>这些完全不改模型的任何一个参数</u>。</b><br><b>⇒ <u>所以解码策略是「免费的旋钮」：不用重训，改一行配置就换了</u>。</b><br><b>⚠ 而这也是为什么它值得专门讲一节：<u>很多人以为输出质量全靠模型，其实解码策略对体感的影响极大</u>。</b>");

  SUM(0,21,{h:"过渡：从「模型长什么样」到「回答怎么生成」",k:"MoE 收口：<b>刚才看到的是现代 LLM 改动架构的「一种方式」—— 为了容纳「我们可能想把模型 scale 上去，但不想增加一次前向的计算复杂度」这件事；而你会在外面看到很多基于 MoE 的 LLM</b>。然后切换主题：<b>现在聚焦「一个回答是怎么被生成的」</b> —— 现代 LLM 做的是文本进文本出，典型就是 <b>next token prediction</b>（BOS → A → teddy → bear → is …）。<b>但到目前为止，我们从来没真正挖过「我们到底是怎么选下一个 token 的」</b>。",m:"★★★ 这是一个视角切换，前后两半是完全不同层面的东西：<b>上半场讲「模型内部长什么样」（架构），下半场讲「给定一个训好的模型，怎么用它产出文本」（解码）</b>。而这两件事是<b>正交</b>的：<b>同一个模型可以用不同的解码策略 —— 用 greedy 还是 sampling、温度设多少，完全不改模型的任何一个参数</b> ⇒ <b>解码策略是「免费的旋钮」：不用重训，改一行配置就换了</b>。⚠ 这也是它值得专门讲一节的原因：<b>很多人以为输出质量全靠模型，其实解码策略对体感的影响极大</b>。",w:"★★★ 自回归循环的形状（<b>输出被追加到输入上，整件事重来一遍</b>）有三个重要后果：<b>① 生成是串行的 —— 第 100 个 token 必须等前 99 个生成完，这是 LLM 推理慢的根本原因（而训练是并行的，就是 L2 那个 teacher forcing）② 错误会累积 —— 第 10 个选错了，后面 90 个都建立在这个错误上 ③ 重复计算 —— 每生成一个新 token，前面所有 token 的 K 和 V 都要重算，除非你缓存它们</b>。⚠ 第③点正是 <b>KV 缓存</b>存在的理由（L2 里 Afshine 预告过它在「下一讲」）。",r:"★★ 这个问题被欠了整整两讲半：<b>L1 的端到端走查里 Shervine 走到输出层说「取概率最高的那个」然后继续；L2 整讲讲架构、生成一笔带过；这一讲前半讲 MoE，仍然假设「输出就那么出来了」</b>。而「取概率最高的那个」这个简化正是接下来要被推翻的 —— <b>它不是错的（它是一种合法策略，叫 greedy decoding），但它不是实践中用的那种</b> ⇒ <b>这一段的价值在于把一个你以为已经懂了的环节重新打开了</b>，而这是这门课反复做的事：<b>先给一个能往下走的简化，等前提齐备了再回来拆开它</b>。⇒ 另：「改动架构的一种方式」里的「一种」暗示还有别的（量化、蒸馏、稀疏注意力），<b>而 MoE 的特别之处是它唯一一个「让模型变大的同时让计算变小」—— 别的方案都是「在不太损失质量的前提下变小」，MoE 是扩张性的，其余是收缩性的</b>。"});

  SUM(0,22,{h:"输出概率分布，与那个最自然的答案",k:"讲者先把中间盖起来：<b>假设中间发生的一切（先不管），我们只拿到「输出概率」</b> —— <b>给定一个或一串 token 作输入，你有一个输出概率分布，表示模型认为「下一个 token 是 A / airplane / fluffy …」的可能性</b>。然后问：<b>你会怎么基于这个选下一个 token？</b>⇒ 学生答<b>概率最大的那个</b>，讲者：<b>是的，第一个想法 —— 这是一个非常自然的做法</b>。但紧接着反驳：<b>你用 ChatGPT 或 Gemini 时，每次问点什么它回答的总是稍微不一样；而如果你总选最高概率、又鉴于这里的计算全都是确定性的……</b>",m:"★★★ 「盖起来」在这里是<b>准确</b>而不是简化：<b>解码策略真的不关心中间是什么 —— 它只需要一个输入：词表上的一个概率分布</b>，而这个分布来自 7B 稠密模型、671B 的 MoE、还是一张 n-gram 统计表，<b>解码策略完全一样</b> ⇒ 这是一个真正的<b>窄接口：模型和解码器之间只通过「一个概率分布」通信</b>，而正因为接口窄，<b>两边才能独立演化</b>（beam search 是 1970 年代语音识别里的东西，今天还能直接用在 LLM 上）。⚠ <b>认出一个系统里的「窄接口」，是理解它结构的有效办法</b>。",w:"★★★ 「<b>整个词表</b>」这一点要钉死：<b>模型输出的不是「一个词」，是一个长度等于词表大小的向量</b>（Llama 3 是 128256 个数、加起来为 1），<b>而每一个数都严格大于 0（softmax 的输出永远为正）</b> ⇒ 在「a cute teddy bear is」后面，<b>「airplane」的概率不是 0，只是极小（可能 10⁻⁹）</b>，<b>而极小的概率乘上足够多的采样次数，迟早会被抽到</b> ⇒ <b>top-k / top-p 这些「截断」方法存在的全部理由，就是这个性质</b>。",r:"★★ 那个反驳是一个<b>反证</b>：<b>假设真实系统用 greedy ⇒ 同输入必定同输出 ⇒ 但你每天都观察到输出不一样 ⇒ 假设错了</b>。而「<b>计算全都是确定性的</b>」这个前提值得单独确认：<b>神经网络前向传播没有任何随机性（同权重同输入 ⇒ 同 logits）⇒ 随机性不可能来自模型，只可能来自解码</b> ⇒ <b>你看到的「每次不一样」，全部来自那个选 token 的步骤</b>。⚠ 严格说有个微小例外：<b>GPU 浮点运算的非确定性（并行归约顺序）会带来极小差异，但不足以造成明显不同的回答</b>。⇒ 另：这个策略有个名字（讲者 48:27 才说）：<b>greedy decoding</b>，而「贪心」来自算法里的贪心法 —— <b>每步做当下最好的选择、不回头不考虑未来</b>，<b>它的经典毛病正是接下来要讲的：不保证全局最优</b>。"});
  QUIZ(0,22,{t:"怎么论证真实的 LLM 服务没有用 greedy decoding？",o:["因为 greedy 的质量太差","反证：神经网络前向是确定性的 ⇒ greedy 下同输入必定同输出；但你每天看到回答都不一样","因为 greedy 不能处理长文本","因为 greedy 太慢"],a:1,w:"⇒ 这把问题定位得很准：随机性不可能来自模型，只可能来自那个选 token 的步骤。"});

  note("⚠ 注意这条线的方向：从「找最优」一路走向「随机抽」",640,362,"r");},"<b>第三个方法登场，而值得先看一眼这条线的方向。</b><br><b>讲者的话</b>：<b>「<u>但实际上，人们用的是第三个方法。而这个方法也叫做 sampling 方法</u>。」</b><br><b>★★★ 三个方法排开，方向很有意思</b>：<b>⇒ <u>greedy</u>：确定性地取最优。</b><b>⇒ <u>beam search</u>：确定性地搜索一个更好的最优。</b><b>⇒ <u>sampling</u>：<u>干脆不求最优，按概率随机抽</u>。</b><br><b>★★ 请注意前两个是在<u>同一条路上越走越远</u>（都在求「最可能」），<u>而第三个是换了一条路</u>。</b><b>⇒ 它放弃了「找最优」这个目标本身。</b><br><b>⇒ <u>而放弃它的理由，正是上一镜说的：「最可能」本来就不是你想要的东西</u>。</b><br><b>★ 这是一个很值得记的模式：<u>当你在一条优化路线上越走越难时，先回头检查一下「这个优化目标对不对」</u>。</b><b>⇒ <u>beam search 比 greedy 复杂得多、贵得多，换来的是在一个错误目标上做得更好 —— 而 sampling 用一个更简单的做法换掉了目标</u>。</b>");
  SUM(0,26,{h:"⚠ 为什么人们其实不用 beam search",k:"<b>问题一</b>：<b>我们需要跟踪这些最可能的路径、需要做这一整套保存等等 —— 而它需要「大量的计算」</b>。<b>问题二（更根本）</b>：<b>我们仍然在追求「最可能的路径」，那会导向一个模型认为「非常可能」的序列；但有时候你想要的是输出「更多样」或「更有创造力」—— 所以 beam search 其实不是人们典型会用的东西</b>。但它没死：<b>人们在像机器翻译这样的事情上用它 —— 那里你确实需要一个接近「非常可能」的东西</b>。而实际用的是<b>第三个方法：sampling（采样）</b>。",m:"★★★ 成本对 LLM 比对传统模型严重得多：<b>计算是 k 倍前向，显存是 k 倍 KV 缓存</b>。而 L2 算过<b>一个 7B 模型、32K 上下文的 KV 缓存约 17 GB（GQA 后约 4 GB）⇒ k=5 就是 20 GB，而这还只是一个用户的一个请求 —— 一个同时服务几百请求的推理服务根本付不起</b>。⇒ <b>beam search 在 LLM 时代变贵不是因为算法变了，是模型和上下文变大了 —— 一个 2016 年完全合理的方法在 2025 年变得不划算，这类事经常发生</b>。",w:"★★★ 第二个反对意见更根本：<b>它说的不是「beam search 做得不好」，而是「它做的那件事本身不是你要的」</b> —— beam search 非常擅长找高概率序列，<b>但「高概率」和「好」不是一回事</b>。原因很具体：<b>模型是在海量文本上训的，而文本里最常见的句式是最平庸的那些 ⇒ 「模型认为最可能的回答」往往是最套路、最安全、最无聊的那个</b>（这有个名字叫「<b>likelihood trap（似然陷阱）</b>」）。⚠ 实际表现：<b>用 beam search 让 LLM 写开放性文字，它会不停重复同一句话 —— 因为「重复刚说过的话」在统计上概率确实很高</b>。",r:"★★ 判据可以直接拿去用：<b>你的任务有没有一个「标准答案」？有（翻译、摘要、语音转写、代码补全、结构化抽取）⇒ 要最可能的那个 ⇒ beam search 或 greedy；没有（写作、对话、头脑风暴、角色扮演）⇒ 要多样 ⇒ sampling</b>。而翻译特别适合还有个额外理由：<b>翻译输出长度相对固定（大致和源句成比例），所以「偏好短序列」那个毛病在翻译里好治得多；而开放式生成长度完全自由，长度惩罚几乎没法调</b> ⇒ <b>beam search 退守到翻译不是妥协而是正确的归位 —— 它本来就是为那类任务设计的（出身于语音识别）</b>。⇒ 三个方法排开方向很有意思：<b>greedy 确定性取最优 → beam search 确定性搜索更好的最优 → sampling 干脆不求最优、按概率随机抽</b>，<b>前两个在同一条路上越走越远，第三个换了一条路、放弃了「找最优」这个目标本身</b> ⇒ 值得记的模式：<b>当你在一条优化路线上越走越难时，先回头检查「这个优化目标对不对」</b>。"});
  QUIZ(0,26,{t:"对 beam search 更根本的那个反对意见是什么？",o:["它做的那件事本身不是你要的 —— 「模型认为最可能」的文本往往最套路最无聊（likelihood trap）","它无法处理长序列","它的实现太复杂","它需要重新训练模型"],a:0,w:"⇒ 判据：任务有标准答案（翻译、摘要、代码补全）⇒ 用 beam search/greedy；没有标准答案（写作、对话）⇒ 用 sampling。"});
});

  SUM(0,27,{h:"⭐ 第三个方法：直接按那个分布采样",k:"<b>sampling</b>：<b>我们有一个关于「下一个 token 该是什么」的概率分布 —— 而人们做的就是「用那个概率分布去采样下一个 token」</b>。例子：<b>fluffy、gentle、kind、smart 被抽中的概率更高，而 airplane 更低 —— 非零的概率，但它们是有概率出现的</b>。一个澄清提问：<b>这不是训练用的，是推理用的？⇒ 是的，正确 —— 把它想成「回答生成」</b>；而训练那一侧是：<b>你关心输出概率，然后和「真实标签」比，而那大多数时候是你的「硬标签」</b>。",m:"★★★ 这个做法有多「顺」：<b>前两种方法都是把分布当成一个排序榜（取第一、取前 k 名），而 sampling 是把分布当成一个「真的概率分布」用</b> ⇒ 于是一个漂亮的性质：<b>如果模型估计的概率是准的，那 sampling 生成的文本分布就和训练数据的分布一致；而 greedy 生成的分布和训练数据完全不一样（它永远只取众数）</b> ⇒ <b>从「模仿人类语言」的角度看，sampling 才是那个「忠实」的做法</b>。⇒ 而 38:55 那个问题（为什么每次回答不一样）在这里有了答案：<b>随机性就来自这一次抽签 —— 模型是确定性的，抽签不是</b>。",w:"★★★ 「<b>非零的概率，但它们是有概率出现的</b>」说的是一件很要紧的事：「a cute teddy bear is airplane」是荒谬的句子，<b>而模型给它的概率可能是 10⁻⁸ —— 听起来等于不可能，但它不是 0</b>。而「不是 0」在大规模下是真实问题：<b>一次生成 500 个 token 就抽 500 次签，一天 1 亿次请求 ⇒ 500 亿次抽签，而 10⁻⁸ 的事件在 500 亿次里会发生几百次</b> ⇒ <b>每天会有几百次，某个回答里突然蹦出一个完全不相干的词</b>。更糟的是：<b>词表有 12 万个词、每一个荒谬的词都有一点点概率，加起来尾部的总质量其实不小</b> —— <b>而这正是 top-k / top-p 要砍掉的东西</b>。",r:"★★ 训练/推理这个区分要紧，因为<b>训练时根本不存在「选一个 token」这件事</b>：训练时你有正确答案（teacher forcing），<b>你做的是「看模型给正确答案打了多少分，然后推高它」—— 你从来不需要「选」</b>；而推理时没有正确答案，所以必须自己选 ⇒ <b>「怎么选」这个问题只在推理时存在，解码策略在训练代码里完全不出现</b>。⇒ 推论：<b>同一个训好的模型今天用 greedy、明天用 sampling，模型本身一个字节都没变 —— 这正是「免费的旋钮」</b>。⇒ 而「硬标签」接回 L2 的蒸馏：<b>「和硬标签比」= 用交叉熵训（KL 在硬标签下退化成交叉熵）</b>。两侧并排这个模型的一生就完整了：<b>训练是「输出分布 → 和硬标签算交叉熵 → 反传」，推理是「输出分布 → 按某策略抽一个 → 接上去重来」—— 同一个前向、同一个分布，区别只在「拿它干什么」</b>。"});
  QUIZ(0,27,{t:"sampling 的一个漂亮性质是什么？",o:["它保证输出语法正确","如果模型估计的概率准，生成文本的分布就和训练数据一致；而 greedy 永远只取众数、分布完全不一样","它生成速度最快","它不需要 softmax"],a:1,w:"⚠ 但「每个 token 概率都非零」在大规模下是真实问题：10⁻⁸ 的事件在每天 500 亿次抽签里会发生几百次 —— 这正是 top-k/top-p 要砍掉的。"});
});

  note("⇒ 而 exp 还顺带放大了差距 —— 这是下面温度那段的前提",640,368,"d");},"<b>第二步，而 softmax 做的其实是两件事。</b><br><b>讲者的话</b>：<b>「<u>而当然，你想要的是概率。所以你会有一个 softmax 层，它基本上把一切都转换成概率，使得一切加起来等于 1。而为了算出那些概率，这就是你会用的那条公式，也就是那个 softmax 层</u>。」</b><br><b>★★ 把 softmax 拆成两步看</b>：<b>⇒ ① <u>取指数</u>：<u>e^{x_i}</u>。这把任意实数变成<u>严格正数</u>（负的 logit 也变成一个小正数）。</b><b>⇒ ② <u>归一化</u>：除以所有指数的和。这让它们<u>加起来等于 1</u>。</b><br><b>★★★ 而第①步还有一个不显然的后果，<u>它是下面温度那一整段的前提</u></b>：<b>⇒ <u>exp 是凸的、增长极快的</u>。</b><b>⇒ 所以 logit 上的一个<u>小差距</u>，在 exp 之后会变成一个<u>大比例</u>。</b><b>⇒ 比如 logit 差 <u>3</u> ⇒ <u>e³ ≈ 20 倍</u>的概率比。</b><b>⇒ 而 logit 差 <u>10</u> ⇒ <u>22000 倍</u>。</b><br><b>⚠ 所以 softmax 不是一个「中性」的归一化 —— <u>它会系统性地放大领先者的优势</u>。</b><b>⇒ <u>而温度 T 正是用来调节「放大多少」的那个旋钮</u>。</b>");
  SUM(0,29,{h:"那些概率到底从哪来",k:"讲者回头补那个被跳过的部分：<b>你一开始是「怎么得到这些概率」的？</b>⇒ <b>这些基于 transformer 的架构算出输入的一个「编码表示」，而在图的最顶上有一些「最后的层」，目标是把那个向量「投影到词表的空间」里</b>。具体两步：<b>① 过一个「线性层」，把 d_model 向量投到一个「维度等于词表大小」的空间 ② 过一个 softmax 层，把一切变成概率、使全部加起来等于 1</b>。",m:"★★★ 这个顺序（<b>先假设有 → 讲怎么用 → 再回来讲怎么造</b>）在这一讲里用了至少三次（MoE 的「专家是什么？先假设是某个网络」、训练的「就当平常那样训」、这里的「假设我们有概率」）。⇒ 为什么好：<b>因为「怎么用」决定了「造成什么样才合适」</b> —— 你先知道要采样、要调温度、要 top-p 截断，<b>然后才明白为什么输出必须是一个「归一化的概率分布」而不是别的什么</b>；<b>反过来讲，softmax 就只是一个「不知道为什么要有」的步骤</b>。",w:"★★ 「<b>投影到词表的空间</b>」是整个模型里最后一次、也是最大的一次维度变换：<b>进来 d_model 维（Llama 3 是 4096），出去 |V| 维（128256）—— 放大了 31 倍</b>。它的含义：<b>前面 32 层一直在「语义空间」里折腾（每个位置一个 4096 维向量，这些数没有直接的语言含义），而这一层第一次把它映射回「具体的词」⇒ 这是模型内部表示和外部词汇之间的那个出口</b>。⇒ 出来的数叫 <b>logits</b>（还不是概率，可以是任何实数）；<b>「logit」是 log-odds 的简称，二分类里 logit = log(p/(1−p))，而 softmax 是它多分类的逆</b>。⚠ <b>温度公式里的 x_i 指的就是 logit，而温度是除在 logit 上、不是除在概率上 —— 这个区别在推导里是关键</b>。",r:"★★★ softmax 拆成两步：<b>① 取指数（把任意实数变成严格正数）② 归一化（除以总和，加起来为 1）</b>。而第①步有个不显然的后果，<b>它是温度那一整段的前提</b>：<b>exp 是凸的、增长极快的 ⇒ logit 上的一个小差距在 exp 之后变成一个大比例</b>（logit 差 3 ⇒ e³ ≈ 20 倍；差 10 ⇒ 22000 倍）⇒ <b>softmax 不是一个「中性」的归一化，它会系统性地放大领先者的优势 —— 而温度 T 正是用来调节「放大多少」的那个旋钮</b>。⇒ 顺带：L2 讲过 <b>weight tying</b> —— 这个输出矩阵常和输入词嵌入矩阵共享权重（<b>一个「词→向量」、一个「向量→词」，互为逆向</b>）。"});
  QUIZ(0,29,{t:"模型最顶上那个线性层做了什么？",o:["把 d_model 维向量投到 |V| 维（Llama 3 是 4096 → 128256）—— 这是「语义空间」通向「具体的词」的出口","把多头结果拼接起来","对输出做归一化","把 logits 变成概率"],a:0,w:"⚠ 出来的数叫 logits，还不是概率。而 softmax 的 exp 会系统性放大领先者优势（logit 差 3 ⇒ 20 倍概率比）—— 温度就是调节「放大多少」的旋钮。"});
});

  note("⚠ 这是这门课第五次「用一个概念之前先确认听众有」",640,362,"r");},"<b>这又是那个固定动作，而这次的回答影响了他接下来的讲法。</b><br><b>讲者的话</b>：<b>「<u>而现在我们要看的是，那个 T 是用来干什么的、或者说那个 T 在实践中实际做了什么。所以在我们进到那个之前，就一个问题：有人听说过「回答生成方面的温度」这件事吗？有。好</u>。」</b><br><b>★★ 把这门课里这个动作的五次出现列一下，<u>它确实是一个固定习惯</u></b>：<b>⇒ <u>L2 17:02</u>：「谁还记得三角函数公式？」⇒ 所有人 ⇒ 直接推导。</b><b>⇒ <u>L2 32:06</u>：「谁做过空间里的旋转？」⇒ 答对了 ⇒ 直接给矩阵。</b><b>⇒ <u>L2 103:37</u>：「谁听过蒸馏？」⇒ 几个人 ⇒ 从引言开始建直觉。</b><b>⇒ <u>L3 15:00</u>：「见过 FLOPS 这个词吗？」⇒ 不太见过 ⇒ 完整定义。</b><b>⇒ <u>L3 53:06</u>：「听过温度吗？」⇒ 有 ⇒ <u>于是他可以直接问「那它有什么影响」</u>。</b><br><b>★★★ 而这次「有」这个回答，<u>让他跳过了定义、直接进到了下一个层次</u>（下一镜他问的是「低温和高温各有什么影响」）。</b><br><b>⇒ <u>如果回答是「没听过」，他多半得先解释一遍温度是什么</u>。</b><br><b>⚠ 所以这个动作的实际作用是：<u>决定从哪一层开始讲</u>。</b>");

  SUM(0,30,{h:"⭐⭐ 温度 T 出场",k:"<b>有一个「相当重要」的超参数：温度 T</b>，而它<b>就在 softmax 公式里冒出来</b>：<b>P(w_i) = e^{x_i/T} / Σ_j e^{x_j/T}</b> —— <b>下一个 token 是某个词的概率 = exp(那个词对应的输入 ÷ 温度)，再用「所有其它 exp(量÷T)」之和去归一化</b>。然后讲者问全班：<b>听过「回答生成里的温度」吗？（有）⇒ 那低温和高温各会有什么影响？</b>",m:"★★★ 「它冒出来的地方」是 softmax 的<b>内部</b>，而这个位置决定了它的全部行为：<b>温度不是在概率算完之后再调整，它是除在 logit 上、然后才取 exp 才归一化</b>。为什么位置重要：<b>在概率上乘一个系数再归一化，相对比例完全不变（什么都没发生）；而在 logit 上除一个数再过 exp，比例会被整体拉伸或压缩</b> ⇒ 具体地：<b>logit 差 d 时概率比是 e^d，除以 T 之后变成 e^{d/T} —— T 小 ⇒ 比例被拉开，T 大 ⇒ 比例被压平</b>。整段数学就是这一行。",w:"★★ 两个细节：<b>① T 出现在分子和分母的每一项上，所以它是对整个 logit 向量做同一个缩放 ② T=1 时退回成普通 softmax，所以「不设温度」就等于 T=1</b>。⇒ 「温度」这个名字来自统计物理的<b>玻尔兹曼分布</b>：<b>一个系统处在能量 E 的状态的概率正比于 e^{−E/kT}，形式一模一样（logit 相当于负能量）</b>，而物理直觉完全对得上：<b>温度低 ⇒ 系统塌缩到最低能量态（最确定）；温度高 ⇒ 各态被热运动搅匀（最随机）</b> ⇒ <b>「低温确定、高温随机」不是比喻，它就是同一条公式在两个领域里的同一个行为</b>。",r:"⇒ 自己推一遍只要盯住「<b>T 在分母上</b>」：<b>T=0.1 ⇒ x_i/T 放大 10 倍 ⇒ 原本差 1 的两个 logit 现在差 10 ⇒ 概率比从 e¹≈2.7 倍变成 e¹⁰≈22000 倍 ⇒ 第一名把其余全压死、分布极尖</b>；<b>T=10 ⇒ 压缩 10 倍 ⇒ 差 1 变成差 0.1 ⇒ 概率比从 2.7 变成 1.1 倍 ⇒ 几乎没差别、趋向均匀</b> ⇒ <b>低温尖/确定/保守，高温平/随机/有创造力</b>。★ 另：「用概念前先确认听众有」这是第五次（L2 的三角公式/旋转/蒸馏、L3 的 FLOPS、这里的温度），<b>而这次「有」这个回答让他跳过定义、直接问「那它有什么影响」—— 这个动作的实际作用是「决定从哪一层开始讲」</b>。"});

  SUM(0,35,{h:"⚠⚠ 唯一的随机性来自采样",k:"⭐⭐⭐ 这一讲最该记住的一句话之一：<b>transformer 架构里「没有任何东西是概率性的」—— 一切都是确定性的；唯一不确定的东西，是「你怎么采样下一个 token」</b>。那怎么拿确定性输出？<b>把 T 设成 0 —— 你就确定知道输出只会是一个东西</b>。⚠ 但：<b>那是「理论上的性质」—— 实践中计算里有一些东西引入了「非确定性的运算」（比这门课范围高级得多），所以 T=0 可能导致不同的结果</b>。推荐读物：<b>一篇很新的文章《击败 LM 推理里的非确定性》</b>；根子：<b>GPU 在做归约时，有时归约的是「尺度非常不同」的数，所以这些运算发生的「顺序」相当重要 —— 顺序不同可能导致不同结果</b>。",m:"★★★ 那句话解掉一大批误解：<b>很多人以为神经网络「本身就是随机的」—— 不是。它输出的是一个概率分布，但算出这个分布的过程是纯粹的矩阵运算、一个确定性的函数</b>：<b>同权重 + 同输入 ⇒ 同 logits（一位不差）⇒ 同概率分布 ⇒ 然后抽签，这一步才有随机</b> ⇒ <b>随机性被完全隔离在最后那一步里，而且那一步你可以关掉</b>。⚠ 实际用途：<b>调试 LLM 应用时先把温度设成 0 —— 这样你看到的任何变化都来自你改的东西而不是抽签，把随机性关掉是调试的第一步</b>。",w:"★★★ 非确定性的根子是一件很基础的事：<b>浮点数加法不满足结合律</b>。极端例子：<b>(1e20 + 1) − 1e20 = 0（1 被精度吃掉），而 1e20 + (1 − 1e20) = 1 —— 同样三个数、不同顺序，一个得 0 一个得 1</b>。而 GPU 做归约时<b>为了并行会把数据分块、各块并行求和再合并，而分块方式取决于当时的线程调度、batch 大小、甚至别的进程在占用什么</b> ⇒ <b>加法顺序会变 ⇒ 结果最后几位会变 ⇒ argmax 偶尔会翻</b> —— 这就是「理论上确定」和「实践中确定」是两回事的原因。",r:"★★ 讲者说了两遍「<b>比这门课范围高级得多</b>」却仍然提了这件事，<b>这个取舍是对的</b>：他没展开（会花十分钟且超出定位），<b>但也没装作不存在</b> ⇒ 价值在于<b>它给了你一个「已知的未知」—— 将来遇到时你不会以为是自己的 bug，而这比「完全理解它」有用得多，因为你多半不需要修它，只需要知道它不是你的错</b>。⇒ 一般建议：<b>讲一个主题时，对那些不打算展开的坑至少报一下名字 —— 「知道有这么回事」成本极低，而省掉的排查时间可能是几小时</b>。⇒ 另：这门课给过的课外读物性质各异（<b>Attention is All You Need 经典奠基、BERT 经典好读、Switch Transformer 规模证据、这篇是 2025 年解决具体工程问题的博客</b>）⇒ <b>LLM 领域里很多最有用的材料不是论文而是工程博客 —— 读文献别只盯 arXiv</b>。"});

  note("⚠ 而有时候允许的下一个 token「不止一个」—— 那时你就回到我们那套「下一个 token 策略」",640,364,"r");},"<b>第二个做法从根上解决了问题，而它的机制很优雅。</b><br><b>讲者的话</b>：<b>「<u>嗯，有第二个做法叫做 guided decoding。而它做的是，在生成过程当中，它过滤掉它所谓的「非法的下一个 token」。所以这里，假设我想生成这个 JSON。我确定知道我的第一个 token 必须是某个打开那个 —— 我忘了这个的英文词是什么了，但它就是打开那个括号。对，打开括号。所以你只能有这个，然后你只能有属性名，等等等等。而有时候你可以有不止一个被允许的下一个 token，那种情况下你就回到我们那套「下一个 token 策略」</u>。」</b><br><b>★★★ 把机制说清楚：<u>它在每一步都给词表加一个掩码</u></b>：<b>⇒ 模型算出 <u>|V| 个 logits</u>。</b><b>⇒ 然后一个「<u>格式检查器</u>」告诉你：<u>在当前这个位置，哪些 token 是语法上合法的</u>。</b><b>⇒ 把不合法的那些 logit 设成 <u>−∞</u>。</b><b>⇒ <u>然后照常 softmax、照常用你的采样策略抽</u>。</b><br><b>★★ 注意最后那一句：「<u>你就回到我们那套下一个 token 策略</u>」。</b><b>⇒ <u>guided decoding 不替代 sampling / top-p / 温度 —— 它是加在它们前面的又一层过滤</u>。</b><br><b>⇒ <u>和 top-k / top-p 完全是同一个位置、同一个手法，只是依据从「概率」换成了「语法」</u>。</b><br><b>⚠ 而它给的保证是硬的：<u>输出必定是合法的 JSON，一次都不用重试</u>。</b>");

  note("★★ 关键词：finite state machine、FSM、context grammar",640,324,"g");
  note("⚠ 又一次「不展开但报名字」—— 和 63:24 那个非确定性是同一个处理",640,362,"r");},"<b>这个提问问到了实现，而讲者又一次用了「不展开但报名字」的处理。</b><br><b>讲者的话</b>：<b>「<u>所以问题是，你怎么限制那些其它的 token？所以有一堆论文深入讲这个。我们不会覆盖它。但我可以给你一些线索。就去搜 finite state machine、FSM、context grammar。所以有一堆论文在做那个。我们这里不会覆盖它</u>。」</b><br><b>★★★ 这三个关键词指向的是同一套思路：<u>把「合法格式」写成一个自动机，然后用它来掩码</u></b>：<b>⇒ <u>有限状态机（FSM）</u>：JSON 的语法可以被编译成一张状态转移图。</b><b>⇒ 在任何一个状态下，<u>只有有限几种字符是合法的下一步</u>。</b><b>⇒ 而你可以<u>预先</u>算出：在每个状态下，<u>词表里哪些 token 是允许的</u>。</b><br><b>★★ 关键的工程技巧在「<u>预先</u>」这两个字</b>：<b>⇒ 如果每生成一个 token 都要现场跑一遍语法检查，<u>那太慢了</u>。</b><b>⇒ 而把「<u>状态 → 允许的 token 掩码</u>」这张表预先算好并缓存起来，<u>运行时就只是一次查表</u>。</b><br><b>⇒ <u>这就是 Outlines 这类库的核心做法，而它的开销几乎可以忽略</u>。</b><br><b>⚠ 「<u>context grammar</u>」指的是<u>上下文无关文法（CFG）</u>，<u>它比 FSM 更强，能描述嵌套结构（比如 JSON 里的嵌套对象）</u>。</b>");
  SUM(0,36,{h:"⭐ guided decoding：保证输出合法",k:"最后一个话题：<b>假设你想生成一个「非常特定格式」的输出，比如 JSON</b>。<b>朴素做法</b>：<b>跟 LLM 说「请用 JSON 生成」⇒ 它产出点什么 ⇒ 你看它是不是合法的 JSON ⇒ 不是就重复，让它再生成一次直到做对</b>。<b>第二个做法：guided decoding</b> —— <b>在「生成过程当中」过滤掉它所谓的「非法的下一个 token」</b>（我确定知道第一个 token 必须是「开大括号」，然后只能是属性名，等等；<b>而有时允许的下一个 token 不止一个，那就回到我们那套「下一个 token 策略」</b>）。怎么实现？<b>有一堆论文，我们不覆盖，但给你线索：finite state machine、FSM、context grammar</b>。",m:"★★★ guided decoding 的机制：<b>它在每一步给词表加一个掩码</b> —— <b>模型算出 |V| 个 logits ⇒ 一个「格式检查器」告诉你当前位置哪些 token 语法上合法 ⇒ 把不合法的 logit 设成 −∞ ⇒ 然后照常 softmax、照常用你的采样策略抽</b>。⇒ 注意讲者最后那句：<b>guided decoding 不替代 sampling / top-p / 温度，它是加在它们前面的又一层过滤 —— 和 top-k/top-p 完全是同一个位置、同一个手法，只是依据从「概率」换成了「语法」</b>。而它给的保证是硬的：<b>输出必定是合法的 JSON，一次都不用重试</b>。",w:"★★★ 朴素做法的问题不在「能不能用」而在「<b>代价不可控</b>」：<b>你不知道要重试几次，而每次重试都是一次完整的生成 ⇒ 延迟和成本整数倍地涨</b>。而对线上服务来说<b>不可控的延迟比高延迟更糟</b>（「平均 1 秒」可以接受，「平均 1 秒但 1% 的请求 8 秒」是运维噩梦），<b>而重试机制恰好产生后一种分布</b>。⚠ 更麻烦的：<b>如果模型在某输入上「总是」生成不合法 JSON，重试会无限循环 ⇒ 必须设上限，而达到上限后你还是没结果 ⇒ 这个方案不保证成功</b>。",r:"⇒ 三个关键词指向同一套思路：<b>把「合法格式」写成一个自动机，然后用它来掩码</b> —— <b>JSON 语法可编译成一张状态转移图，任何状态下只有有限几种字符合法，而你可以「预先」算出每个状态下词表里哪些 token 被允许</b>。关键技巧在「预先」：<b>每生成一个 token 现场跑语法检查太慢，而把「状态 → 允许的 token 掩码」预先算好缓存起来，运行时就只是一次查表 —— 这是 Outlines 这类库的核心做法，开销几乎可忽略</b>。⚠ 「<b>context grammar</b>」指<b>上下文无关文法（CFG），比 FSM 更强，能描述嵌套结构（如 JSON 里的嵌套对象）</b>。⇒ 另：这个「最后一件事」其实是后面几讲的地基 —— <b>LLM 输出是自由文本而程序需要结构化数据，而 L7 的「接到外部世界」、L8/L9 的 Agent（工具调用要的就是函数名+参数的 JSON）全建立在它上面</b>。"});
  QUIZ(0,36,{t:"guided decoding 和 top-k / top-p 的关系是什么？",o:["它只能和 greedy 一起用","它在模型内部实现","完全同一个位置、同一个手法（在 softmax 前把不合法的 logit 设成 −∞），只是依据从「概率」换成了「语法」","它替代了采样策略"],a:2,w:"⇒ 而它给的保证是硬的：输出必定合法，一次都不用重试。对比朴素的「生成→校验→重来」：代价不可控，而且不保证成功。"});
});
KP("37 · Shervine 接手：先立一个词 —— context length",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:08","now, together, we are going to look at different prompting strategies");

  note("★ 又是那个固定分工：Afshine 讲机制，Shervine 讲怎么用",640,364,"r");},"<b>换人了，而这次的分工有一点新意思。</b><br><b>讲者的话</b>：<b>「<u>太好了。谢谢你，Afshine。所以现在，我们一起来看不同的提示策略。所以既然（我们知道了）回答是怎么被生成的，我们接下来要看的是：怎么拿到回答、以及怎么拿到很好的回答</u>。」</b><br><b>★★ 把上下半场并排看，这个分工比前两讲更清楚</b>：<b>⇒ <u>Afshine</u>：模型内部怎么算（MoE）、输出怎么变成文本（解码）。</b><b>⇒ <u>Shervine</u>：<u>你在外面怎么跟它说话</u>（提示）、以及怎么让它跑得快（推理优化）。</b><br><b>★★★ 而「<u>怎么拿到回答</u>」和「<u>怎么拿到好的回答</u>」这个区分值得留意</b>：<b>⇒ 前者是<u>能不能用</u>的问题 —— 格式对不对、解析得出来吗。</b><b>⇒ 后者是<u>好不好</u>的问题 —— 而这正是 prompting 的全部内容。</b><br><b>⇒ <u>有意思的是：这两件事都不需要动模型的任何一个参数</u>。</b><b>⇒ <u>解码策略是免费的旋钮，而 prompt 更是 —— 它连配置都不用改，改的只是你打的字</u>。</b><br><b>⚠ 所以下半场讲的是「<u>在完全不碰模型的前提下，你能做到多少</u>」。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:34","you have the length of your inputs measured in number of tokens");
  note("⭐ 先立一个词汇",640,186,"y");
  boxNode(130,214,1020,44,"当你有某种输入时，你的输入有一个「长度」—— 用 token 的个数来衡量","g");
  note("⇒ 讲者：我只想先引入一个词汇",640,292,"d");
  note("★ 而他又回到了那个招牌例子：我们可爱的泰迪熊",640,324,"y");
  note("⚠ 注意单位又一次是 token，不是字符、不是词",640,362,"r");},"<b>先立一个词，而这个词你每天都在用。</b><br><b>讲者的话</b>：<b>「<u>所以我们回到我们最喜欢的那个关于可爱泰迪熊的例子。所以我只想引入一个词汇：当你有某种输入时，你有你输入的长度 —— 用 token 的数量来衡量</u>。」</b><br><b>★★ 「<u>用 token 的个数来衡量</u>」这个单位又一次出现了，<u>而这一讲已经第三次强调它</u></b>：<b>⇒ <u>04:53</u>：训练数据量用 token 数衡量。</b><b>⇒ <u>19:48</u>：路由在 token 层面做。</b><b>⇒ <u>这里</u>：输入长度用 token 数衡量。</b><br><b>★★★ 为什么反复是 token 而不是别的单位</b>：<b>⇒ 因为<u>模型的世界里只有 token</u>。</b><b>⇒ 它不知道什么是「字」，不知道什么是「词」，<u>只知道一串整数 id</u>。</b><br><b>⇒ 所以所有的成本、限制、计量，<u>都必须用 token 表达才准确</u>。</b><br><b>⚠ 一个实际的提醒：<u>token 和「字数」的换算因语言而异</u>。</b><b>⇒ <u>英文大约 1 个 token ≈ 0.75 个词；中文大约 1 个汉字 ≈ 1 到 2 个 token</u>（取决于 tokenizer）。</b><b>⇒ <u>所以同样一段话，中文版可能要多付一倍的 token</u>（L2 讲 mT5 时说过这件事）。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:39","you can see it called context length, context size, window size");
  note("⭐⭐ 同一个东西的三个名字",640,188,"y");
  boxNode(60,216,350,44,"context length","g");
  boxNode(465,216,350,44,"context size","y");
  boxNode(870,216,350,44,"window size","b");
  note("⇒ 讲者：你会在文献里看到它有不同的名字",640,290,"y");
  note("★ 而最新的工具 —— 如果你在 Cursor 或别的代码助手上写代码 —— 我想它们更多叫 context length",640,322,"g");
  note("⚠ 所有这些词都是「等价的」，指的是同一件事",640,360,"r");},"<b>三个名字指同一件事，而知道这一点能省不少困惑。</b><br><b>讲者的话</b>：<b>「<u>而你会在文献里看到它可以有不同的名字。所以你会看到它被叫做 context length、context size、window size。而我想最新的那些工具 —— 如果你在 Cursor 或者任何别的代码辅助工具上写代码 —— 我想它们更多地叫它 context length。但所有这些词都是等价的，指的是同一件事</u>。」</b><br><b>★★ 术语的这种「<u>一物多名</u>」在这个领域里非常普遍，<u>而它是一个真实的学习障碍</u></b>：<b>⇒ 你读三篇论文，看到三个词，<u>以为学了三个概念</u>。</b><b>⇒ <u>而其实是同一个</u>。</b><br><b>★★★ 这一讲和 L2 里，讲者已经做过好几次这种「同义词对齐」了</b>：<b>⇒ <u>L2</u>：gates = router；sliding window attention = local attention。</b><b>⇒ <u>L2</u>：BERT 的 L / H / A 对应 transformer 的 n / d_model / h。</b><b>⇒ <u>L3</u>：最高的值 = 最高的 logit = 最高的激活。</b><b>⇒ <u>这里</u>：context length = context size = window size。</b><br><b>⚠ 而 <u>window size</u> 这个名字其实有一点危险：<u>它和 L2 那个「滑动窗口注意力」的「窗口」是两回事</u>。</b><b>⇒ <u>前者是「模型一次能吃多少」，后者是「每个 token 能看左右几个」</u>。</b><b>⇒ <u>所以看到 window 这个词时，要看清它指的是哪一个</u>。</b>");
  SUM(0,37,{h:"Shervine 接手：先立 context length 这个词",k:"换人，下半场讲<b>提示策略</b>：「<b>既然我们知道了回答是怎么生成的，接下来看怎么拿到回答、以及怎么拿到很好的回答</b>」。先立一个词汇：<b>当你有某种输入时，你输入的「长度」用 token 的个数来衡量</b>；而<b>它在文献里有不同的名字：context length、context size、window size —— 最新的工具（Cursor 这类）更多叫 context length，而所有这些词都是等价的</b>。",m:"★★ 分工比前两讲更清楚：<b>Afshine 讲模型内部怎么算（MoE）、输出怎么变成文本（解码）；Shervine 讲你在外面怎么跟它说话（提示）、怎么让它跑得快（推理优化）</b>。而「怎么拿到回答」和「怎么拿到<b>好的</b>回答」这个区分值得留意：<b>前者是「能不能用」（格式对不对、解析得出来吗），后者是「好不好」—— 而这正是 prompting 的全部内容</b>。⇒ 有意思的是：<b>这两件事都不需要动模型的任何一个参数 —— 解码策略是免费的旋钮，而 prompt 更是：它连配置都不用改，改的只是你打的字</b> ⇒ <b>下半场讲的是「在完全不碰模型的前提下，你能做到多少」</b>。",w:"★★★ 「用 token 个数来衡量」这一讲已第三次强调（<b>04:53 训练数据量、19:48 路由粒度、这里输入长度</b>）⇒ 为什么反复是 token：<b>因为模型的世界里只有 token —— 它不知道什么是「字」、什么是「词」，只知道一串整数 id，所以所有成本、限制、计量都必须用 token 表达才准确</b>。⚠ 实际提醒：<b>token 和字数的换算因语言而异（英文约 1 token ≈ 0.75 词，中文约 1 汉字 ≈ 1–2 token）⇒ 同样一段话中文版可能多付一倍 token</b>（L2 讲 mT5 时说过）。",r:"⚠ 「一物多名」在这个领域非常普遍，<b>而它是一个真实的学习障碍 —— 你读三篇论文看到三个词，以为学了三个概念，其实是同一个</b>。讲者已做过好几次这种对齐：<b>L2 的 gates = router、sliding window = local attention、BERT 的 L/H/A 对应 n/d_model/h；L3 的「最高的值 = 最高的 logit = 最高的激活」；这里的 context length = context size = window size</b>。⚠ 而 <b>window size 这个名字有点危险：它和 L2 那个「滑动窗口注意力」的「窗口」是两回事 —— 前者是「模型一次能吃多少」，后者是「每个 token 能看左右几个」</b>，看到 window 时要看清指哪一个。"});
  QUIZ(0,37,{t:"context length、context size、window size 这三个词的关系是什么？",o:["分别指输入、输出和总长度","window size 是 context length 的一半","分别对应三种不同的注意力","完全等价，指同一件事（输入长度，用 token 数衡量）—— 而工具里更多叫 context length"],a:3,w:"⚠ 但 window size 有点危险：它和「滑动窗口注意力」的窗口是两回事 —— 前者是「一次能吃多少」，后者是「每个 token 能看左右几个」。"});
});
KP("38 · 上下文长度的量级，以及一个必须泼的冷水",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("68:13","they tend to be in the order of magnitude of tens of thousands, hundreds of thousands or millions");

  boxNode(60,216,350,44,"几万","g");
  boxNode(465,216,350,44,"几十万","y");
  boxNode(870,216,350,44,"几百万","b");
  note("⇒ 现代 LLM 的输入 token 数，大致落在这三档里",640,290,"y");
  note("★ 讲者：有时你听到某个新 LLM 吹某个数字 —— 那个数字说的就是这个",640,322,"g");
  note("⚠ 它说的是「在一次传递里，它能容纳多少 token」",640,360,"r");},"<b>这是今天的量级，而讲者顺手解释了那些宣传数字是什么。</b><br><b>讲者的话</b>：<b>「<u>所以现代的 LLM，它们倾向于落在几万、几十万、或者几百万个输入 token 这个量级上。所以这就是它能接收的那种输入。所以有时候你听到某个新的 LLM 吹嘘某个数字，而那个 context length 的数字说的就是这个 —— 它在一次传递里能容纳多少 token</u>。」</b><br><b>★★★ 「<u>在一次传递里能容纳多少 token</u>」这个定义要钉准，<u>因为它常被误解</u></b>：<b>⇒ 它<u>不是</u>「模型能记住多久的对话」。</b><b>⇒ 它是「<u>一次前向传播，输入张量最长能有多长</u>」。</b><br><b>★★ 而「一次」这个词意味着：<u>它既包括你的输入，也包括模型已经生成的输出</u>。</b><b>⇒ 因为自回归生成时，<u>已生成的 token 会被追加到输入上</u>（36:45 那镜）。</b><b>⇒ <u>所以 128K 的上下文，不是「输入 128K + 输出任意」，而是「输入 + 输出 ≤ 128K」</u>。</b><br><b>⚠ 把量级和实际内容对一下，这些数字就有体感了</b>：<b>⇒ <u>几万（如 32K）</u>：约一本中篇小说的几章、一个中等规模的代码文件。</b><b>⇒ <u>几十万（如 200K）</u>：一整本书。</b><b>⇒ <u>几百万（如 1M）</u>：<u>一整个代码仓库，或者十几本书</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("69:00","If we have more context length, is it going to solve everything? Actually not");
  note("⭐⭐ 讲者在这里泼了一盆必要的冷水",640,186,"y");
  boxNode(130,214,1020,44,"问：那这是不是就一切都美好了？上下文更长，是不是就能解决一切？","b");
  note("⇒ 答：其实不是（Actually not）",640,292,"r");

  note("★★ 所以那些技巧，正是用来「管理 context length 增长时的计算复杂度」的",640,324,"g");
  note("⚠ 讲者：这个点提得非常好 —— 它正好就是这件事",640,362,"d");},"<b>这个提问把这一讲和上一讲接上了，而讲者说它提得非常好。</b><br><b>讲者的话</b>：<b>「<u>所以问题是，context length 是不是正好就是在自注意力期间被展示的那些？是的。而接着我们会看到 —— 我想我们上次看到，有时候会用一些技巧，让自注意力机制的复杂度不是 n 平方。所以这就是被用来管理「随着 context length 增长时计算复杂度」的那些东西。是的。但这个点提得非常好。它正好就是这件事</u>。」</b><br><b>★★★ 这个连接把两讲串起来了，<u>而它澄清了一件很要紧的事</u></b>：<b>⇒ <u>context length 就是自注意力里那个 n</u>。</b><b>⇒ 而 L2 讲过：<u>注意力的复杂度是 O(n²)</u>。</b><b>⇒ ⇒ <u>context length 翻倍 ⇒ 注意力的计算翻四倍</u>。</b><br><b>★★ 所以「百万上下文」这件事的代价是巨大的：<u>从 32K 到 1M 是 31 倍，而注意力的计算是 31² ≈ 970 倍</u>。</b><b>⇒ <u>没有任何模型会真的付这个代价</u>。</b><br><b>⇒ <u>所以凡是宣传百万上下文的模型，背后必定用了 L2 讲的那些技巧</u>（滑动窗口、局部/全局交错、tiling）。</b><br><b>⚠ 而这正好解释了 context rot 的一个可能成因：<u>那些近似技巧本身就会损失远距离的信息</u>。</b><b>⇒ <u>「能放下 1M」和「对 1M 做完整的注意力」是两回事</u>。</b>");
  SUM(0,39,{h:"⚠ context rot 的两个结论",k:"<b>结论一</b>：<b>随着 context length 增加，那个「把信息和上下文里那个答案对上（ground）」的能力下降</b>。<b>结论二</b>：论文还控制了「上下文里还有别的什么」——<b>有一个词叫 distractors（干扰项），他们往里面放噪声，而干扰项确实「贡献于降低检索能力」⇒ 你上下文里有什么，也是重要的</b>。实践建议：<b>当你有一个检索问题想用 LLM 解决，你有很好的理由去「尽可能精准地瞄准」那一段「对的」上下文</b>。而一个连接型提问：<b>context length 是不是正好就是自注意力时被看到的那些？⇒ 是的</b>，而<b>上一讲那些「让复杂度不是 n²」的技巧，正是用来管理 context length 增长时的计算复杂度的</b>。",m:"★★★ 注意结论一的<b>形状</b>：如果是阈值效应（「超过 50K 就不行」），你待在阈值内就安全；<b>但它是单调下降的 —— 从 1K 到 2K 就已经差了一点 ⇒ 没有一个「安全长度」，任何额外内容都在付出代价</b> ⇒ 这意味着「<b>多给一点上下文反正没坏处</b>」这个常见做法<b>是错的：每多给一句话，就让别的所有信息被找到的概率低一点</b>。⚠ 「ground」在 LLM 语境里是专门术语（<b>grounded = 回答有上下文里的依据而不是编的</b>）⇒ <b>这句话说的不只是「找不到」，而是「越长越容易编」</b>。",w:"★★★ 两个结论性质完全不同：<b>结论一是模型的固有性质，你改不了（除非换模型）；结论二是你能控制的 —— 你决定往上下文里放什么</b>。而「干扰项」的定义要说清：<b>它不是「错误的信息」，而是「和问题相关但不是答案的信息」</b>（你问披萨配料，上下文里还有十段在讲披萨的其它事 —— 都是真的、都相关，<b>但它们让模型更难锁定那一句</b>）⇒ <b>「相关」不等于「有用」</b>，而实践中最常见的错误正是<b>把所有「可能相关」的都塞进去，以为多多益善</b>。",r:"★★ 那条建议背后的取舍很清楚：<b>塞得多 ⇒ 答案在里面的概率高、但找到的概率低；塞得准 ⇒ 在里面的概率低一点、但一旦在里面找到的概率高</b>，而 context rot 告诉你<b>后者的收益通常更大</b> ⇒ <b>RAG 的设计重心不在「召回更多」而在「排得更准」—— 这就是「重排序（reranking）」这一步这么重要的原因</b>。⚠ 对「长上下文能不能取代 RAG」这个争论的直接回应：<b>不能 —— 问题从来不是「放不放得下」，而是「找不找得到」，而把 1M 塞进去恰恰让找到变得更难</b>。⇒ 而那个连接提问澄清了：<b>context length 就是自注意力里那个 n，而注意力是 O(n²) ⇒ 从 32K 到 1M 是 31 倍，注意力计算是 970 倍 —— 没有模型会真的付这个代价</b> ⇒ <b>凡是宣传百万上下文的模型背后必定用了 L2 那些技巧，而这正好解释了 context rot 的一个可能成因：那些近似技巧本身就会损失远距离信息</b>。"});
  QUIZ(0,39,{t:"context rot 里「干扰项（distractors）」指的是什么？",o:["被截断的 token","上下文里的错误信息","和问题「相关但不是答案」的信息 —— 它们都是真的，却让模型更难锁定那一句","模型自己生成的幻觉"],a:2,w:"⇒ 所以「相关」不等于「有用」。而实践建议是「尽可能精准地瞄准对的那段上下文」—— 这直接否定了「把所有可能相关的都塞进去」。"});

  note("⚠ 这个坦白很重要 —— prompt 工程里充斥着被包装成规则的经验",640,362,"r");},"<b>讲者先把话说在前面，而这个坦白在 prompt 这个话题上尤其必要。</b><br><b>讲者的话</b>：<b>「<u>那么现在，我们来定义一下 prompt 通常长什么样。所以关于怎么去组织一个给定的 prompt，并没有正式的理论。但这些是在呈给模型的那些 prompt 里通常会找到的主要脉络</u>。」</b><br><b>★★★ 为什么这个坦白在 prompt 这个话题上尤其必要</b>：<b>⇒ prompt 工程是整个 LLM 领域里<u>最缺理论的部分</u>。</b><b>⇒ 而正因为缺理论，<u>它充斥着被包装成规则的经验</u>：「必须用 XML 标签」「必须说请」「必须给角色设定」。</b><b>⇒ <u>这些说法有的有效，有的是迷信，而且随模型版本变化</u>。</b><br><b>★★ 所以讲者说「<u>没有正式的理论，但有通常会找到的脉络</u>」是一个诚实的定位</b>：<b>⇒ 他给的是一个「<u>观察到的结构</u>」，<u>不是一个「必须遵守的格式」</u>。</b><br><b>⇒ <u>而一个「观察到的结构」的用处是：它给你一个检查清单，而不是一套咒语</u>。</b><br><b>⚠ 判断任何 prompt 建议时都可以用这个标准：<u>它是在描述一个结构，还是在规定一套咒语？</u></b><b>⇒ <u>前者可迁移，后者会过时</u>。</b>");

  note("⇒ ① 搭起情境：你把设定放进去，让模型清楚你要发什么样的查询",640,290,"g");
  note("⇒ ② 如果有任务要模型做，你就有指令；而指令是「以某物为输入」的函数",640,322,"y");
  note("⇒ ③ 所以你加上一些输入；④ 而为了拿到你想要的，你可能要加一些约束",640,360,"b");},"<b>这是那四个部分，而它们之间的关系比列表更有意思。</b><br><b>讲者的话</b>：<b>「<u>所以你可以区分出一个部分是在搭建情境 —— 你就把那个设定放进去，让模型清楚你想发出什么样的查询。然后，比如说，如果你有一些任务想让模型执行，你就有指令。而这些指令，它们中的一些是以某个东西为输入的函数。所以你加上一些输入。而为了从模型的回答里拿到你想要的东西，你可能想加上一些约束</u>。」</b><br><b>★★★ 请注意讲者用的那个比喻：「<u>指令是以某物为输入的函数</u>」</b>：<b>⇒ 这把 prompt 的结构说成了一个<u>函数调用</u>：<u>指令是函数名，输入是参数</u>。</b><b>⇒ 而这个类比很准 —— <u>同一条指令配不同的输入，就是同一个函数的不同调用</u>。</b><br><b>★★ 于是四个部分的角色可以写成</b>：<b>⇒ <u>context</u>：运行环境（模型是谁、现在什么情况）。</b><b>⇒ <u>instructions</u>：函数体（要做什么）。</b><b>⇒ <u>inputs</u>：参数（对什么做）。</b><b>⇒ <u>constraints</u>：返回值的类型约束（输出要满足什么）。</b><br><b>⚠ 这个「把 prompt 当成函数」的视角很有用：<u>它告诉你哪一部分该固定（context、instructions、constraints），哪一部分该变（inputs）</u>。</b><b>⇒ <u>而这正是「prompt 模板」这个工程做法的依据</u>。</b>");

  note("★ 四个部分各填一句，一个完整的 prompt 就成形了",640,382,"g");},"<b>招牌例子又回来了，而这次它用来演示 prompt 的结构。</b><br><b>讲者的话</b>：<b>「<u>所以这里，我们拿了我们最喜欢的那个关于泰迪熊的例子。那个 context 是「泰迪熊是什么」—— 基本上，泰迪熊的心情是什么？我们想做什么来让我们的泰迪熊开心？然后我们给出一些关于「我们想生成的那个故事在哪里」的输入。然后我们给出一些约束</u>。」</b><br><b>★★ 这个例句这一讲已经出现第四次了（<u>L2 三次、L3 一次之前</u>），<u>而每次用途都不同</u></b>：<b>⇒ <u>L2 12:18</u>：讲位置嵌入相加。</b><b>⇒ <u>L2 65:33</u>：讲 span corruption。</b><b>⇒ <u>L2 95:26</u>：BERT 端到端走查。</b><b>⇒ <u>L3 47:19</u>：讲采样（fluffy / gentle / kind）。</b><b>⇒ <u>这里</u>：讲 prompt 的四个部分。</b><br><b>★★★ 用<u>同一个例子</u>贯穿不同主题，是一个很有效的教学选择</b>：<b>⇒ 听众<u>不需要每次重新理解一个新场景</u>。</b><b>⇒ 于是全部的注意力都在<u>新概念</u>上，而不是在「这次又是什么例子」上。</b><br><b>⚠ 这个做法你写文档时也能用：<u>一份文档里反复用同一个示例，比每节换一个要好得多</u>。</b>");

  note("⇒ 比如：安全指令 ——「不要生成任何可能导致伤害的内容」之类",640,350,"r");
  note("★★ 所以你和 ChatGPT 的每一次对话，前面都挂着一段你看不见的文字",640,382,"y");},"<b>这个例子把抽象的四部分落到了你每天的使用上，而它揭开了一件你看不见的事。</b><br><b>讲者的话</b>：<b>「<u>如果你想要你每天查询的那些 LLM 里的另一个例子 —— 那么 context 可能是某句话，说「你是 ChatGPT。我们是 10 月 10 日。现在是下午 4:44。」所以你搭好那个设定。而 instructions 基本上可以是用户查询的那些东西，连同输入。然后 constraints 可能是一些你作为用户看不到、但可能存在于给 LLM 的那个 prompt 里的东西 —— 比如安全指令。比如说，不要生成任何可能导致伤害的内容，或者类似这样的东西</u>。」</b><br><b>★★★ 这段揭开的是「<u>系统提示（system prompt）</u>」这件事</b>：<b>⇒ 你打的字<u>不是</u>模型收到的全部。</b><b>⇒ 在它前面，<u>还挂着一段你看不见的文字</u>：身份设定、当前日期、安全规则、工具说明、格式要求。</b><br><b>★★ 而「<u>我们是 10 月 10 日</u>」这个细节特别值得注意</b>：<b>⇒ 模型本身<u>不知道今天几号</u> —— 它的权重冻结在训练那一刻。</b><b>⇒ <u>它知道日期，是因为有人在 prompt 里告诉了它</u>。</b><br><b>⇒ <u>这是一个很好的提醒：模型「知道」的很多东西，其实是上下文告诉它的，不是它学到的</u>。</b><br><b>⚠ 而这也解释了为什么同一个模型在不同产品里「<u>性格</u>」不同：<u>权重一样，系统提示不一样</u>。</b>");
