  note("★★ 用来看清「哪一块对应那个结构里的哪个目标」",640,324,"g");
  note("⚠ 注意他说的是 mental model（心智模型），不是 template（模板）",640,362,"r");},"<b>讲者给这四部分的定位很准，而他用的那个词很关键。</b><br><b>讲者的话</b>：<b>「<u>所以每一次你看到一个输入被喂给一个 LLM，我想这些投影、这四个维度，可以是一个很好的心智模型，用来看清哪些片段对应着那个结构里的哪个目标。这说得通吗？</u>」</b><br><b>★★★ 「<u>心智模型（mental model）</u>」而不是「<u>模板（template）</u>」—— 这个区别是实质性的</b>：<b>⇒ <u>模板</u>：一个你要照着填的格式。<u>它规定你怎么写</u>。</b><b>⇒ <u>心智模型</u>：一个你用来<u>分析</u>的框架。<u>它帮你看清一个已有的 prompt 在做什么</u>。</b><br><b>★★ 所以这四个维度最有用的时候，<u>其实不是你写 prompt 的时候，而是你调试 prompt 的时候</u></b>：<b>⇒ 输出不对 ⇒ 问：<u>是 context 没给够？是 instruction 不清楚？是 input 有歧义？还是 constraint 缺了？</u></b><b>⇒ <u>把问题定位到一个维度上，比盲目改写整个 prompt 有效得多</u>。</b><br><b>⚠ 而这也回应了开头那句「<u>没有正式的理论</u>」：<u>他给的不是理论，是一个分析工具</u>。</b><b>⇒ <u>而在一个缺理论的领域里，一个好的分析工具往往比一套规则更有价值</u>。</b>");
  SUM(0,40,{h:"⭐ 一个 prompt 的四个组成部分",k:"⚠ 先把话说在前面：<b>关于「怎么组织一个 prompt」没有正式的理论，但这些是通常会找到的主要脉络</b>。四部分：<b>① context（搭起情境 —— 放进设定，让模型清楚你要发什么样的查询）② instructions（有任务要模型做时的指令，而指令是「以某物为输入的函数」）③ inputs（所以你加上一些输入）④ constraints（为了拿到你想要的，你可能要加一些约束）</b>。泰迪熊例：<b>context = 泰迪熊的心情；instructions = 我们想做什么让它开心；inputs = 故事发生在哪；constraints = 一些约束</b>。",m:"★★★ 讲者那个比喻很准：「<b>指令是以某物为输入的函数</b>」—— 它把 prompt 说成了一个<b>函数调用</b>（指令是函数名、输入是参数），<b>而同一条指令配不同输入就是同一个函数的不同调用</b>。于是四部分的角色是：<b>context = 运行环境（模型是谁、现在什么情况）；instructions = 函数体（要做什么）；inputs = 参数（对什么做）；constraints = 返回值的类型约束（输出要满足什么）</b> ⇒ 这个视角<b>告诉你哪部分该固定（context/instructions/constraints）、哪部分该变（inputs）—— 而这正是「prompt 模板」这个工程做法的依据</b>。",w:"⭐⭐ ChatGPT 那个例子揭开的是「<b>系统提示（system prompt）</b>」：<b>你打的字不是模型收到的全部 —— 在它前面还挂着一段你看不见的文字：身份设定、当前日期、安全规则、工具说明、格式要求</b>。而「我们是 10 月 10 日」这个细节特别值得注意：<b>模型本身不知道今天几号（权重冻结在训练那一刻），它知道日期是因为有人在 prompt 里告诉了它</b> ⇒ <b>模型「知道」的很多东西其实是上下文告诉它的，不是它学到的</b>；这也解释了<b>为什么同一个模型在不同产品里「性格」不同 —— 权重一样，系统提示不一样</b>。",r:"★★★ 「<b>心智模型</b>」而不是「<b>模板</b>」这个区别是实质性的：<b>模板规定你怎么写；心智模型帮你分析一个已有的 prompt 在做什么</b> ⇒ <b>这四个维度最有用的时候其实不是写 prompt 时，而是调试 prompt 时</b>：输出不对就问「<b>是 context 没给够？instruction 不清楚？input 有歧义？还是 constraint 缺了？</b>」—— <b>把问题定位到一个维度上，比盲目改写整个 prompt 有效得多</b>。⚠ 开头那句坦白在 prompt 这个话题上尤其必要：<b>它是整个领域里最缺理论的部分，而正因为缺理论，它充斥着被包装成规则的经验（「必须用 XML 标签」「必须说请」）—— 有的有效、有的是迷信，而且随模型版本变化</b> ⇒ 判断任何 prompt 建议的标准：<b>它是在描述一个结构，还是在规定一套咒语？前者可迁移，后者会过时</b>。"});
  QUIZ(0,40,{t:"讲者把这四个维度定位成「心智模型」而不是「模板」，差别在哪？",o:["心智模型不需要遵守","模板规定你怎么写；心智模型帮你分析一个已有 prompt 在做什么 ⇒ 它在「调试 prompt」时最有用","心智模型更简单","模板只适用于 ChatGPT"],a:1,w:"⇒ 输出不对时就问「是 context 没给够？instruction 不清楚？input 有歧义？还是 constraint 缺了？」—— 定位到一个维度，比盲目改写整个 prompt 有效得多。"});
});

  note("⚠ 回想 L2：微调要改 1536 个参数；而这里是「0 个」",640,362,"r");},"<b>这一段的主题是一个很强的主张：不动任何权重。</b><br><b>讲者的话</b>：<b>「<u>所以既然我们知道了对一个 LLM 的输入我们可以有什么样的心态，那我们来看看怎么让一个 LLM 做我们想要的事。而让我们看看怎么在不调任何权重的情况下做到。而我们可以用一个叫做 in-context learning 的概念来做到</u>。」</b><br><b>★★★ 把这条线接到 L2，整个趋势就很清楚了</b>：<b>⇒ <u>BERT 之前</u>：每个任务<u>从头训一个模型</u>（几千万参数全要训）。</b><b>⇒ <u>BERT（微调）</u>：训一个<u>分类头</u> —— 二分类只要 <u>1536 个参数</u>。</b><b>⇒ <u>LoRA</u>：训一个<u>低秩增量</u> —— 更少。</b><b>⇒ <u>in-context learning</u>：<u>0 个参数</u>。</b><br><b>★★ L2 那一讲我说过「<u>要调多少参数才能换一个任务，这个数字一路降到了 0</u>」—— <u>而这里就是那个 0</u>。</b><br><b>⇒ 所以这不是一个孤立的技巧，<u>它是一条七年趋势的终点</u>。</b><br><b>⚠ 而到了 0 之后，「换一个任务」的成本就<u>不再是计算问题，而是写字问题</u>。</b><b>⇒ <u>这正是「prompt 工程」这个职业出现的原因</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("74:31","where the learning is a bit of a term that is overloaded");

  boxNode(130,214,1020,44,"「learning（学习）」这个词在这里「有点被过载了」","b");
  note("⇒ 因为你其实「并没有学到任何东西」—— 就 LLM 的权重而言",640,292,"r");
  note("★★ 但你可以把一些知识「蒸进（distill into）」它里面 —— 作为上下文的一部分",640,324,"y");
  note("⚠ 这个澄清很要紧：in-context learning 里没有任何「学习」发生",640,362,"g");},"<b>这个保留很要紧，因为这个名字确实会误导。</b><br><b>讲者的话</b>：<b>「<u>在那里，「学习」这个词有点被过载了 —— 因为你其实并没有就 LLM 的权重而言学到任何东西，但你可以把一些知识蒸进它里面，作为上下文的一部分，来做你想做的事</u>。」</b><br><b>★★★ 「<u>并没有学到任何东西</u>」这件事必须想清楚，<u>因为它推翻了这个名字的字面意思</u></b>：<b>⇒ <u>「学习」在机器学习里有一个明确的含义：参数被更新</u>。</b><b>⇒ 而 in-context learning <u>一个参数都没动</u>。</b><b>⇒ <u>推理结束，一切回到原样 —— 模型不记得刚才发生过什么</u>。</b><br><b>★★ 所以更准确的说法是：<u>模型没有「学会」什么，它只是「被告知」了什么</u>。</b><b>⇒ 一个类比：<u>给一个人看一份说明书，让他照着做</u> —— <u>他并没有「学会」这件事，他只是在照着看</u>。</b><b>⇒ 说明书拿走，<u>他就不会了</u>。</b><br><b>⚠ 这个区分有实际后果：<u>in-context learning 的效果不会累积</u>。</b><b>⇒ 你今天给它十个例子，<u>明天它还是什么都不记得</u>。</b><b>⇒ <u>而微调是会累积的 —— 权重改了就留在那里</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("74:50","there is one category that is very simple. In mindset, it is called zero-shot");
  note("⭐ 第一类：zero-shot",640,186,"y");
  boxNode(130,214,1020,44,"它在心态上非常简单","g");

  note("★★ 你就直接让 LLM 去做你想让它做的事",640,324,"g");
  note("⚠ 而这正是你每天用 ChatGPT 的方式 —— 它有一个专门的名字",640,362,"r");},"<b>第一类，而它正是你每天在做的事。</b><br><b>讲者的话</b>：<b>「<u>所以你可以区分出 in-context learning 的两个主要类别。所以有一个类别非常简单 —— 在心态上，它叫做 zero-shot。基本上就是你除了你的输入、你的查询之外什么都不给。你就直接让 LLM 去做你想做的事</u>。」</b><br><b>★★ 「<u>zero-shot</u>」这个名字的来历值得说一下：<u>shot 指的是「示例」</u>。</b><b>⇒ <u>zero-shot = 给零个示例</u>。</b><b>⇒ <u>few-shot = 给几个示例</u>。</b><b>⇒ <u>one-shot = 给一个</u>。</b><br><b>★★★ 而「<u>zero-shot 能工作</u>」这件事本身在 2020 年之前是不可想象的</b>：<b>⇒ 传统的机器学习里，<u>你不给模型任何训练样本，它不可能做一个它没训过的任务</u>。</b><b>⇒ <u>而 GPT-3 那篇论文的标题就是《Language Models are Few-Shot Learners》</u> —— <u>它第一次系统地展示了这件事</u>。</b><br><b>⇒ <u>于是「不用训练就能做新任务」从一个不可能，变成了默认</u>。</b><br><b>⚠ 为什么能工作：<u>因为模型在预训练时已经见过无数个「指令 + 回答」的模式</u>。</b><b>⇒ <u>所以它不是在「学会这个任务」，而是在「认出这是哪一类任务」</u>。</b>");
  SUM(0,41,{h:"⭐ in-context learning：不动任何权重",k:"这一段的主题：<b>怎么让一个 LLM 做我们想要的事，而且「不调任何权重」—— 用一个叫 in-context learning 的概念</b>。⚠ 但讲者对这个名字提了保留：<b>「learning」这个词有点被过载了 —— 你其实并没有就 LLM 的权重而言学到任何东西，但你可以把一些知识「蒸进」它里面，作为上下文的一部分</b>。第一类：<b>zero-shot —— 心态上非常简单，你除了输入和查询之外什么都不给，直接让 LLM 去做</b>。",m:"★★★ 把这条线接到 L2，趋势就很清楚：<b>BERT 之前每个任务从头训一个模型 → BERT 微调只训一个分类头（二分类 1536 个参数）→ LoRA 训一个低秩增量 → in-context learning 是 0 个参数</b>。L2 那讲说过「<b>要调多少参数才能换一个任务，这个数字一路降到了 0</b>」—— <b>而这里就是那个 0</b> ⇒ 这不是孤立的技巧，<b>它是一条七年趋势的终点</b>；而到了 0 之后，<b>换任务的成本不再是计算问题而是写字问题 —— 这正是「prompt 工程」出现的原因</b>。",w:"★★★ 「<b>并没有学到任何东西</b>」推翻了这个名字的字面意思：<b>「学习」在机器学习里有明确含义 —— 参数被更新，而 in-context learning 一个参数都没动，推理结束一切回到原样、模型不记得刚才发生过什么</b> ⇒ 更准确的说法是<b>模型没有「学会」什么，它只是「被告知」了什么</b>（类比：<b>给一个人看说明书让他照着做 —— 他没「学会」，说明书拿走他就不会了</b>）。⚠ 实际后果：<b>in-context learning 的效果不会累积 —— 今天给它十个例子，明天它还是什么都不记得；而微调是会累积的，权重改了就留在那里</b>。",r:"⇒ 名字的来历：<b>shot 指「示例」—— zero-shot 给零个、one-shot 给一个、few-shot 给几个</b>。★★★ 而「zero-shot 能工作」在 2020 年之前不可想象：<b>传统机器学习里你不给任何训练样本，模型不可能做一个它没训过的任务</b>；<b>而 GPT-3 那篇论文的标题就是《Language Models are Few-Shot Learners》—— 它第一次系统展示了这件事</b> ⇒ <b>「不用训练就能做新任务」从一个不可能变成了默认</b>。⚠ 为什么能工作：<b>模型在预训练时已经见过无数个「指令 + 回答」的模式 ⇒ 它不是在「学会这个任务」，而是在「认出这是哪一类任务」</b>。"});
  QUIZ(0,41,{t:"为什么说 in-context learning 里其实没有「学习」？",o:["因为例子太少","因为模型太小学不会","「学习」在机器学习里指参数被更新，而这里一个参数都没动 —— 推理结束模型不记得发生过什么","因为它只在推理时发生"],a:2,w:"⇒ 实际后果：in-context learning 的效果不会累积（今天给十个例子，明天它什么都不记得），而微调会累积。"});

  SUM(0,42,{h:"few-shot：给几个例子，与它的代价",k:"<b>few-shot learning</b>：<b>在你问那个你感兴趣的输入之前，先给 LLM 一些「输入 → 输出」的例子</b>（泰迪熊例：给几个「某只熊 ⇒ 某个故事」的例子，然后问「为 Bob 生成一个故事」）。为什么有用：<b>给例子「倾向于」把 LLM 很好地「导向」你感兴趣的任务 —— 只是因为你给了模型一个「你在找什么」的概念，然后它能用训练时学到的东西「把点连起来」、照着复现</b>。代价三样：<b>① 你需要去收集这样的例子，这是有成本的 ② 它会在上下文窗口里放进更多 token ③ 所以你需要更多算力</b>。",m:"★★★ 「<b>输入和输出的例子</b>」这个形状要钉死 —— <b>必须成对</b>：只给输出模型只知道「要写得像这样」，<b>给输入输出对模型才能推断出那个「映射关系」</b>。而这正是「learning」这个词虽然过载但不完全是胡说的地方：<b>模型确实在从例子里归纳出一个规则，只不过这个归纳发生在前向传播里而不是在权重里</b>（有研究认为 <b>transformer 在上下文里做的事，数学上类似于「在激活空间里跑了几步梯度下降」</b>）。⚠ 实践提醒：<b>few-shot 的例子格式要完全一致 —— 模型对格式的模仿比对内容的理解更强</b>。",w:"★★★ 「<b>把点连起来</b>」把机制说得很准：<b>模型「已经」知道怎么写睡前故事（预训练见过无数个），它不知道的是「你现在要的是哪一种」—— 而例子做的是「指出方向」，不是「传授能力」</b> ⇒ 作用边界很清楚：<b>它只能唤起模型已有的能力，不能创造新能力</b>（给三个例子教它一门没见过的语言 ⇒ 没用；给三个例子让它按某种格式输出 ⇒ 非常有效）。⇒ 结构细节：<b>例子在前、问题在最后，而这不是任意的 —— decoder-only 是因果的，每个位置只能看左边，所以例子必须在问题之前问题才能「看到」它们</b>；而最后那个问题要<b>留白</b>，<b>于是模型面对的是「模式补全」而不是「回答问题」—— 这正是 few-shot 对基座模型（没做过指令微调的）特别有效的原因，也是 GPT-3 那个时代 few-shot 是主流的原因</b>。",r:"★★★ 三条代价性质不同：<b>① 收集例子是人力成本、一次性的 ② 占上下文是每次调用都要付 ③ 更多算力是 ② 的直接后果，而且因为注意力是 O(n²)，它涨得比线性快</b>。而讲者没说完的那个后果正是他十分钟前刚讲过的 <b>context rot</b>：70:18 说过<b>干扰项会降低检索能力、你该尽可能精准地瞄准对的上下文</b> —— <b>而 few-shot 的例子恰恰就是一大段「和问题相关但不是答案」的内容 ⇒ few-shot 的例子本身就是干扰项</b> ⇒ <b>它的真实代价不只是「贵一点慢一点」，还可能让模型更难抓住真正的问题</b>，而这正好解释了下一段那个反转。⇒ 另：留意「<b>倾向于</b>」这个克制的限定，它马上会被兑现。"});

  SUM(0,43,{h:"⚠ 一个反转：给例子不一定更好",k:"⭐⭐ 讲者承认他<b>在幻灯上把那个「一般来说」用斜体标了出来</b>：<b>近来的模型在获得越来越多的「推理能力」，所以它们「一般来说」在 few-shot 下更好 —— 但「不总是」</b>。核心论证：<b>当你提供例子时，你把模型「约束」进了一组「有限的」例子里 ⇒ 推理时如果要在一个「没见过的数据分布」上执行任务，模型会更难泛化，因为它会试着去「对齐」它在上下文里看到的那些</b>。替代方案：<b>把指令变成「更基于推理」的东西 —— 用自然语言解释「怎么做这个任务」，于是它能用推理能力去真的做</b>；论文线索：<b>plan and solve —— 让 LLM 先自己做计划再去解决，能有非常好的表现</b>。",m:"★★★ 这里对例子做了<b>重新定位：从「指路」变成了「设限」</b> —— 上一段说例子<b>把模型导向</b>你想要的任务（正面），这里说例子<b>把模型约束</b>在那几个例子的范围内（负面），<b>而这两个其实是同一件事的两面 —— 「导向」就是「限制方向」</b>。⇒ 判据很清楚：<b>真实输入和例子很像 ⇒ 限制在正确范围内 ⇒ 有益；真实输入和例子不像 ⇒ 模型被拖向错误范围 ⇒ 有害</b>，而<b>「不像」在真实应用里是常态 —— 你收集的几个例子覆盖不了用户会问的全部情况</b>。",w:"★★★ 一句话说清例子和指令的区别：<b>例子给的是「样本」，指令给的是「方法」</b> —— <b>样本只能覆盖你给的那几个，方法可以推广到你没想到的情况</b>（这就是「泛化」在这里的具体含义）。⚠ 但替代方案有前提：<b>模型要有足够推理能力去执行一个用自然语言描述的方法 —— 而这正是「有了这些更好的模型」的意思；在 GPT-3 时代你写一段方法它执行不了，所以当时只能给样本</b> ⇒ <b>整件事的因果是：模型变强了 ⇒ 最优的 prompt 策略跟着变了</b>。",r:"⇒ 「<b>我把那个「一般来说」用斜体标了出来</b>」是一个很小但很能说明问题的动作：<b>一个讲者愿意在幻灯上为一个副词加排版强调，说明他认为这个限定本身就是内容而不是修辞</b>。而它要推翻的是一个几乎所有人都默认的信念（「<b>给例子总比不给好</b>」）—— <b>这个信念在 2020–2022 年基本成立（GPT-3 论文标题就叫 Few-Shot Learners），而在 2025 年不再总是成立</b> ⇒ 这门课反复出现的模式：<b>一个在某个时期正确的经验，会因为模型能力的变化而失效 —— 而讲者每次都会标注这种时效性</b>。⇒ plan-and-solve 的指令大致是「<b>让我们先理解问题、制定一个计划，然后一步步执行</b>」—— <b>里面没有任何例子、全是方法描述，而效果可以和 few-shot 相当甚至更好，却便宜得多（few-shot 要几百上千 token，它就二十个）</b>。"});

  note("⇒ 你想要的是某个「更可解释的、以 token 形式出来的东西」",640,362,"g");},"<b>这是 CoT 的第二个好处，而它改变了「调试」这个动作的含义。</b><br><b>讲者的话</b>：<b>「<u>而是的，我还想说另一件事：假设你想做一个任务、而且想把它做好，你总会有一些样本是不work的。而对那些，你想要有调试的能力。而通常当你用 LLM 调试时，你不像过去那样调试 —— 你不去看权重、不去看 LLM 的内在机理。你想要的是某个更可解释的、以 token 形式出来的东西</u>。」</b><br><b>★★★ 「<u>你不像过去那样调试</u>」—— 这个对比值得展开，<u>因为它是一个真实的方法论转变</u></b>：<b>⇒ <u>传统神经网络调试</u>：看梯度、看激活分布、看权重的范数、画 loss 曲线。</b><b>⇒ 这些对一个 7B 的黑箱<u>几乎没用</u> —— <u>你看到 32 层的激活值，然后呢？</u></b><br><b>★★ 而 CoT 提供的是一个完全不同的调试界面：<u>模型用自然语言把它的中间步骤写了出来</u>。</b><b>⇒ <u>你读它，就像读一个同事的草稿纸</u>。</b><b>⇒ <u>哪一步错了，一眼就能看见</u>。</b><br><b>⇒ <u>这是「可解释性」在实践中真正落地的少数形式之一 —— 而它不需要任何特殊工具</u>。</b><br><b>⚠ 一个重要的保留：<u>模型写出来的推理，不一定是它真正的计算过程</u>。</b><b>⇒ 它可能先有了答案、再编一段看起来合理的理由。<u>这叫「不忠实的推理」，是一个真实的研究问题</u>。</b>");

  SUM(0,44,{h:"⭐⭐ chain of thought",k:"<b>chain of thought</b>：<b>研究者看到，如果你「强迫」模型在真正给出答案之前先给出某种「理由」，它会给出更高的表现 —— 它基本上就是「是什么把你引向那个答案的」</b>。例：<b>问「这只泰迪熊多大了」，如果强迫它直接回一个数字，它可能做不出那个连接；而给出完整推理链，是什么导向那个回答就清楚了</b>。它<b>可以用在 in-context learning 里</b>（few-shot 例子里连推理一起给）。第二个好处：<b>可调试 —— 用 LLM 调试时你不像过去那样看权重、看内部机理，你想要的是「更可解释的、以 token 形式出来的东西」</b>。代价：<b>当然会花更多时间推理，因为要生成更多 token —— 但典型地我们能接受</b>。",m:"★★★ 这件事值得惊讶：<b>你没给模型任何新信息、也没改任何参数，只是要求它换一个输出格式，而准确率上去了</b>。一个很物理的解释：<b>更多的 token = 更多的计算</b> —— <b>transformer 对每个 token 的计算量是固定的，所以答案只有一个 token 时模型就只有一个 token 的计算量来想这件事；而让它先写五十个 token 的推理，它就有了五十倍的计算量</b> ⇒ <b>CoT 本质上是在「给模型更多思考时间」，而思考时间在这里就是 token 数</b>（这解释了为什么它对需要多步的任务效果最好、对查事实类几乎没用）。⇒ 泰迪熊那题其实是三步（<b>找出它哪年做的 → 找出今年哪年 → 相减</b>），<b>直接输出一个数字就要在一次前向里做完三步，而允许它写出来就是三次独立的计算 ⇒ CoT 不是让模型更聪明，是让它「有地方把中间结果放下来」—— 就像心算和在纸上算的区别</b>。",w:"⭐ CoT 和 few-shot 叠加叫 <b>few-shot CoT</b>（原始 CoT 论文用的就是这个）：<b>每个例子里给「输入 ⇒ 推理过程 ⇒ 答案」，于是模型模仿的不只是答案格式，还有「怎么想」的格式</b>。而后来有个更惊人的发现：<b>连例子都不用给 —— 只要在问题后加一句「Let us think step by step」，效果就有大幅提升</b>（这叫 <b>zero-shot CoT</b>，2022 年的论文；<b>一句话七个词，换来数学题准确率从 17% 到 78% 的量级</b>）⇒ 这也印证了上一段那个反转：<b>一句好的指令可以顶一堆例子</b>。",r:"★★★ 「<b>你不像过去那样调试</b>」是一个真实的方法论转变：<b>传统神经网络调试看梯度、激活分布、权重范数、loss 曲线 —— 这些对一个 7B 黑箱几乎没用（你看到 32 层的激活值，然后呢？）；而 CoT 提供的是完全不同的界面：模型用自然语言把中间步骤写了出来，你读它就像读同事的草稿纸</b> ⇒ <b>这是「可解释性」在实践中真正落地的少数形式之一，而且不需要任何特殊工具</b>。⇒ 那个调试例子的 bug 位置很有代表性：<b>推理链说「我们现在是 2019 年」⇒ 模型的推理完全正确，错的是那个前提，而前提是你放进去的</b>；<b>而没有 CoT 你只看到一个错数字，会去怀疑模型不会算数、去换模型调温度加例子 —— 全没用，因为问题不在那里</b> ⇒ <b>一个系统的可调试性很大程度取决于它愿意暴露多少中间状态</b>。⚠ 两个保留：① <b>模型写出来的推理不一定是它真正的计算过程（可能先有答案再编理由，叫「不忠实的推理」，是真实的研究问题）</b>；② 「我们能接受」只在 CoT 还是几十个 token 的尺度上成立 —— <b>后来的推理模型（o1、DeepSeek-R1）会生成几千几万个 token，那就不是 20 倍而是几百倍，而 L6 专门处理这件事</b>。"});
  QUIZ(0,44,{t:"CoT 为什么能在不给新信息、不改参数的情况下提升表现？",o:["transformer 每个 token 的计算量是固定的 ⇒ 多生成 token 就是多给计算量，等于「给模型更多思考时间」","因为推理过程会被加入训练数据","因为它降低了温度","因为推理链会触发更多专家"],a:0,w:"⇒ 所以 CoT 不是让模型更聪明，是让它「有地方把中间结果放下来」—— 就像心算和在纸上算的区别。而它对多步任务效果最好、对查事实几乎没用。"});
});

  note("⚠ 注意前提：只有「采样是随机的」，多采几次才会得到不同答案",640,386,"r");},"<b>这是把 CoT 再往前推一步，而它有一个前提条件。</b><br><b>讲者的话</b>：<b>「<u>所以现在让我们再往前走一步。所以我想引入 —— 为了让 CoT 变得更强 —— 你可以把你的模型采样好几次，看它生成的那些答案，然后做某种多数投票，来选出被某个给定 LLM 预测次数最多的那个答案</u>。」</b><br><b>★★★ 这个方法的前提是：<u>每次采样会得到不同的答案</u></b>：<b>⇒ 而这只有在<u>温度严格为正</u>时才成立（62:21 那镜）。</b><b>⇒ <u>如果你用 greedy（T=0），采十次会得到十个一模一样的答案，投票毫无意义</u>。</b><br><b>★★ 所以 self-consistency <u>必须和 sampling 配套</u>，<u>它不能和 greedy 一起用</u>。</b><b>⇒ 这是一个很有意思的反转：<u>前面说采样的随机性是一个「要管理的东西」，而这里它变成了一个「资源」</u>。</b><br><b>⇒ <u>随机性让你能从同一个模型里拿到多个独立的尝试，而多个尝试可以互相校验</u>。</b><br><b>⚠ 而这也解释了为什么这个方法叫「<u>self-consistency（自洽）</u>」：<u>它在检查模型「自己和自己是否一致」</u>。</b><b>⇒ <u>如果十次里有九次给出同一个答案，那这个答案多半靠谱；如果十次给出十个不同的答案，那模型其实不知道</u>。</b>");

  SUM(0,45,{h:"⭐ self-consistency：多采几次再投票",k:"把 CoT 再推一步：<b>你可以把你的模型「采样好几次」，看它生成的那些答案，然后做某种「多数投票」，选出被预测次数最多的那个答案 —— 这就是 self-consistency</b>。流程两步：<b>① 把回答采样多次 ② 「解析出」那个真正的答案 —— 基本上把「整个推理」因式分解掉，然后锁定那个答案</b>。效果：<b>通过多数投票，你能以一个「更稳健」的方式得到一个答案</b>。",m:"★★★ 前提是<b>每次采样会得到不同答案，而这只有在温度严格为正时才成立</b> —— <b>用 greedy（T=0）采十次会得到十个一模一样的，投票毫无意义 ⇒ self-consistency 必须和 sampling 配套</b>。⇒ 一个有意思的反转：<b>前面说采样的随机性是一个「要管理的东西」，而这里它变成了一个「资源」—— 随机性让你能从同一个模型拿到多个独立尝试，而多个尝试可以互相校验</b>。这也解释了名字：<b>它在检查模型「自己和自己是否一致」—— 十次里九次同一个答案多半靠谱，十次十个不同说明模型其实不知道</b>。",w:"★★★ 为什么必须「<b>把推理因式分解掉</b>」：<b>采样十次会得到十段不同的推理文字（措辞、步骤顺序、详略全不同）—— 拿整段去投票，十段全不同、没有任何「多数」</b> ⇒ <b>你必须只看最后那个答案：十段推理可能都不同，但结论可能都是「6 岁」，于是「6 岁」拿 10 票</b>。「因式分解」这个词很准：<b>把「推理 × 答案」里的推理那一项除掉，只留答案</b>。⚠ 而这立刻带来一个实际问题：<b>怎么从一段自由文本里「解析出」那个答案？</b>",r:"★★★ 「<b>稳健（robust）</b>」而不是「准确（accurate）」—— 这个用词划出了能力边界：<b>随机错误（某次采样走岔了一步）每次都不一样 ⇒ 投票能滤掉；系统错误（模型对这类问题根本就理解错了）每次都一样 ⇒ 投十次错十次</b> ⇒ <b>self-consistency 是在消除「采样噪声」而不是在增加「知识」</b>。⇒ 这也解释了它在哪类任务上最有效：<b>多步推理 —— 任何一步走岔都会导致错误答案，而走岔哪一步是随机的，于是十次里总有几次每步都走对，那几次给出同一个正确答案、形成多数</b>。⚠ 反过来：<b>对事实性问题（「法国首都是哪」）完全没用 —— 模型要么知道要么不知道，十次是同一个结果</b>。"});
  QUIZ(0,45,{t:"self-consistency 为什么必须和 sampling 配套，不能和 greedy 一起用？",o:["greedy 不支持并行","greedy 不输出推理链","greedy（T=0）下采十次得到十个一模一样的答案，投票毫无意义 —— 随机性在这里从「要管理的东西」变成了「资源」","greedy 太慢"],a:2,w:"⇒ 而「稳健」不等于「准确」：投票能滤掉随机错误（某次走岔了一步），但滤不掉系统错误（模型对这类问题根本理解错了）。"});

  note("⚠ 注意这三个办法的「可靠度」依次递减、成本依次递增",640,386,"r");},"<b>讲者自己把这个追问提了出来，而他给的三个办法各有取舍。</b><br><b>讲者的话</b>：<b>「<u>而我想，和你的问题相切的一个问题是：你怎么能定位那个答案、然后在它上面做多数投票？所以典型地，你可以在上下文里放一句指令说「把真正的答案放在最后」。所以你就可以只抽取最后那个。我想人们还用基于正则的技术来抽取答案。或者你甚至可以想到用某个别的 LLM 来抽取答案。所以总是有办法做到的</u>。」</b><br><b>★★★ 三个办法的取舍</b>：<b>⇒ ① <u>要求格式（「答案放最后」）</u>：<u>最便宜</u>，但<u>依赖模型听话</u> —— 而它不总是听话。</b><b>⇒ ② <u>正则抽取</u>：<u>确定、快、免费</u>，但<u>脆</u> —— 输出格式稍变就抽错。</b><b>⇒ ③ <u>用另一个 LLM 抽</u>：<u>最稳健</u>，但<u>要多一次调用</u> —— 而你本来就已经调了十次了。</b><br><b>★★ 而最可靠的其实是讲者没提的第四个：<u>guided decoding</u>（66:03 那镜）。</b><b>⇒ 用一个语法约束<u>强制</u>最后输出 <u>&lt;answer&gt;…&lt;/answer&gt;</u> 这样的结构。</b><b>⇒ <u>那样抽取是百分之百可靠的，而不是「希望它听话」</u>。</b><br><b>⚠ 这是这一讲里前后两段可以接上的一个地方：<u>Afshine 讲的 guided decoding，正好解决 Shervine 这里的问题</u>。</b>");

  note("⇒ 然后你在最后把答案解析出来",640,330,"y");

  note("⚠ 所以它们是真正独立的 —— 这正是「投票」能成立的前提",640,386,"g");},"<b>这个追问问到了实现，而答案里有一个关键的性质。</b><br><b>讲者的话</b>：<b>「<u>所以这里的请求 —— 所以问题是，它是不是会被发到和示例同一个请求里？所以典型地，你是并行地采样它。所以基本上你就是让你的模型做 Afshine 刚提到的那件事：你从 BOS 和你已有的那些 token 的概率分布里采下一个 token。而你在其它好几个分支里也做这件事。而你把所有这些并行地做。然后你在最后把答案解析出来</u>。」</b><br><b>★★★ 最关键的一句在下一句：「<u>它们谁都不进入谁的上下文</u>」</b>：<b>⇒ 也就是说，<u>十次生成是完全独立的十次</u>。</b><b>⇒ <u>第三次生成不知道第一次生成说了什么</u>。</b><br><b>★★ 而这个独立性正是「<u>投票</u>」能成立的前提</b>：<b>⇒ 投票假设每一票是<u>独立的证据</u>。</b><b>⇒ <u>如果第二次能看到第一次的答案，它就会被带偏 —— 那十票就不是十个独立证据，而是一个证据被复述了十遍</u>。</b><br><b>⇒ <u>所以「互不可见」不是一个实现细节，它是这个方法在统计上成立的条件</u>。</b><br><b>⚠ 对比一下：<u>如果让模型看到前面的答案再给一个，那叫「self-refine」或者「反思」—— 那是另一种方法，而且它的统计性质完全不同</u>。</b>");

  note("⚠ 这个区分在生产环境里非常要紧 —— 成本可以买，延迟不能",640,362,"r");},"<b>这是并行带来的那个好处，而「成本」和「延迟」的区分在生产里非常要紧。</b><br><b>讲者的话</b>：<b>「<u>所以基本上，这个过程的延迟，大致等于那几个并行生成里最大的那个延迟。因为你可以把所有这些都并行地做。所以它们谁都不进入谁的上下文。它们全都是并行完成的。然后你拿到最终的答案</u>。」</b><br><b>★★★ 把账算清楚（假设采样 10 次）</b>：<b>⇒ <u>成本</u>：<u>10 倍</u>（十次完整的生成，十份算力）。</b><b>⇒ <u>延迟</u>：<u>约 1 倍</u>（十次同时跑，等最慢的那个）。</b><br><b>★★ 而这个区分之所以要紧：<u>在生产环境里，这两样东西的性质完全不同</u></b>：<b>⇒ <u>成本</u>是可以用钱买的 —— <u>多买几张卡就行</u>。</b><b>⇒ <u>延迟</u>买不到 —— <u>用户等 10 秒就是等 10 秒，加多少卡都没用</u>。</b><br><b>⇒ <u>所以一个「10 倍成本、1 倍延迟」的方法，在很多场景下是完全可以接受的</u>。</b><br><b>⚠ 但有一个前提：<u>你得真的有闲置的并行容量</u>。</b><b>⇒ 如果服务器已经满载，<u>那十个并行请求就会排队 —— 于是延迟也变成了 10 倍</u>。</b><b>⇒ <u>所以「并行不增加延迟」只在负载不饱和时成立</u>。</b>");
  SUM(0,46,{h:"三个追问：基准、抽答案、并行",k:"① <b>你需要有某个基准才能知道它更好吗？⇒ 是的，绝对需要</b>（那篇论文是在算术和数学相关的基准上做的；<b>我们需要基准和「真实标签」来断言它确实更好</b>）。② <b>怎么定位那个答案？⇒ 在上下文里加一句「把真正的答案放在最后」然后只取最后那截；人们也用基于正则的技术；或者甚至用另一个 LLM 来抽 —— 总是有办法做到的</b>。③ <b>这十次是发到同一个请求里吗？⇒ 典型地你是「并行」采样的，而它们「谁都不进入谁的上下文」；所以这个过程的延迟大致等于那几个并行生成里最慢的那一个</b>。",m:"★★★ 第一个提问重要，因为 <b>prompt 技巧是整个 LLM 领域里最容易「看起来有效」的东西</b>：<b>你改一个 prompt、跑三个例子、感觉好像好了一点 —— 而这完全可能是采样的随机性，或者你自己的确认偏误</b> ⇒ 所以<b>基准（一组固定、足够多到统计上有意义的题目）+ 真实标签（这样「对不对」是客观的）</b>两样都必须。⇒ 这也解释了<b>为什么 CoT 和 self-consistency 的论文都用数学题：答案唯一、可自动校验</b>；⚠ 反过来，<b>对「写得好不好」这类任务你很难建立这样的基准 —— 所以那个领域的 prompt 建议质量要差得多</b>。",w:"★★★ 「<b>它们谁都不进入谁的上下文</b>」是最关键的一句：<b>十次生成是完全独立的十次，第三次不知道第一次说了什么</b>，<b>而这个独立性正是「投票」能成立的前提</b> —— 投票假设每一票是独立证据，<b>如果第二次能看到第一次的答案它就会被带偏，那十票就不是十个独立证据而是一个证据被复述了十遍</b> ⇒ <b>「互不可见」不是实现细节，它是这个方法在统计上成立的条件</b>。⚠ 对比：<b>让模型看到前面的答案再给一个，那叫「self-refine」或「反思」—— 是另一种方法，统计性质完全不同</b>。",r:"★★ 抽答案那三个办法的取舍：<b>① 要求格式最便宜但依赖模型听话（它不总是听话）② 正则确定、快、免费但脆（格式稍变就抽错）③ 用另一个 LLM 最稳健但要多一次调用（而你已经调了十次）</b>。而最可靠的是讲者没提的第四个：<b>guided decoding —— 用语法约束强制输出 &lt;answer&gt;…&lt;/answer&gt; 结构，抽取百分之百可靠而不是「希望它听话」</b> ⇒ <b>Afshine 讲的 guided decoding 正好解决 Shervine 这里的问题</b>。★★★ 并行那个好处要算清楚（采样 10 次）：<b>成本 10 倍，延迟约 1 倍</b> —— 而这个区分在生产里很要紧：<b>成本可以用钱买（多买几张卡），延迟买不到（用户等 10 秒就是 10 秒）</b> ⇒ <b>「10 倍成本、1 倍延迟」在很多场景下完全可接受</b>；⚠ 前提是<b>你真的有闲置并行容量 —— 服务器满载时十个请求会排队，延迟也变成 10 倍</b>。"});
  QUIZ(0,46,{t:"self-consistency 的十次采样为什么必须「互不可见」？",o:["投票假设每一票是独立证据；若后面的能看到前面的答案就会被带偏 —— 那十票变成一个证据被复述十遍","为了避免 context rot","为了节省上下文","为了让它们能并行"],a:0,w:"⇒ 并行带来的好处要算清：成本 10 倍、延迟约 1 倍。而生产里这两样性质不同 —— 成本能用钱买，延迟买不到。"});

  note("⚠ 问题就是：你怎么用「最高效的方式」做到？",640,362,"r");},"<b>这一讲最后一块开始了，而它的处境描述很简洁。</b><br><b>讲者的话</b>：<b>「<u>所以既然我们看了几种提示技术，我想和你们一起讲一下人们在推理时想出来的、让生成尽可能高效的那些技巧。而基本上，是的，在现代的模型里，你有很多参数。你想生成很多 token。你怎么以最高效的方式做到？</u>」</b><br><b>★★ 「<u>很多参数</u> × <u>很多 token</u>」这两个因子相乘，就是推理成本的全部来源</b>：<b>⇒ 每生成一个 token，<u>都要把全部（或激活的）参数过一遍</u>。</b><b>⇒ 生成 1000 个 token，<u>就是把模型跑 1000 遍</u>。</b><br><b>★★★ 而这件事和<u>训练</u>的成本结构很不一样，<u>这个对比值得专门说</u></b>：<b>⇒ <u>训练</u>：一次性的巨大支出。<u>训完就不用再训了</u>。</b><b>⇒ <u>推理</u>：<u>每一个用户的每一次请求都要付一次</u>。</b><br><b>⇒ <u>所以对一个有大量用户的产品，推理的总成本很快就会超过训练</u>。</b><br><b>⚠ 这就是为什么推理优化是今天最热的工程方向之一：<u>训练优化省的是一次性的钱，推理优化省的是每天都在流的钱</u>。</b>");

  note("③ 看看能不能「重新表述 LLM 内部的那些方程」，让生成在实践中被简化",640,362,"g");},"<b>第一类的定义很严格，而三条线索正好对应后面三个技术。</b><br><b>讲者的话</b>：<b>「<u>所以我想把这个思考过程分成两部分。所以我们要看的是：有哪些方法能在一个「精确」的层面上给我们提升效率 —— 所以你完全照样做你本来该做的那些计算，只是用一个更高效的方式。而我放了一些提示，关于我们要探索哪些种类的技术。所以让我们找那些避免冗余的技术。让我们看看我们能做什么来最好地管理内存。而且让我们看看能不能重新表述 LLM 内部的那些方程，让生成在实践中被简化</u>。」</b><br><b>★★★ 「<u>精确</u>」的定义很严格：<u>输出和不优化时「一模一样」</u></b>：<b>⇒ 不是「几乎一样」，是<u>逐位相同</u>（在浮点误差范围内）。</b><b>⇒ <u>所以这类优化是「免费的午餐」—— 你不牺牲任何东西</u>。</b><br><b>★★ 而三条线索正好对应后面要讲的三个技术</b>：<b>⇒ ① <u>避免冗余</u> ⇒ <u>KV cache</u>（87:19 之后）。</b><b>⇒ ② <u>管理内存</u> ⇒ <u>PagedAttention</u>（94:22）。</b><b>⇒ ③ <u>重新表述方程</u> ⇒ <u>MLA / multi-latent attention</u>（96:55）。</b><br><b>⇒ <u>所以这不是三句泛泛的提示，它是一个目录</u>。</b><br><b>⚠ 而这个讲法很好：<u>先给分类框架，再往格子里填东西 —— 听的时候你知道自己在哪一格</u>。</b>");

  note("⚠ 而他还报了时间：我们大概有 22 分钟，要把它们全过一遍",640,366,"r");},"<b>讲者立刻说他讲的时候不按这个分类走，而这个决定是对的。</b><br><b>讲者的话</b>：<b>「<u>这听起来还行吗？所以我们大概有 22 分钟。我们要试着在这里把它们全都过一遍。好。所以我把这些技术的类别分成了精确的和近似的技术。但实际上，我们要以一种分组的方式去看它们 —— 首先看注意力层，看我们在那里能有哪些种类的技术。然后在第二部分，我们会看输出层，然后看在 token 生成的层面上我们能做什么，让事情尽可能地好</u>。」</b><br><b>★★★ 这是一个很有意思的处理：<u>给了一个分类，然后说「讲的时候不按它走」</u></b>：<b>⇒ 听起来像是自相矛盾，<u>但其实两个维度都有用</u>。</b><br><b>★★ 两个维度的作用不同</b>：<b>⇒ <u>精确 / 近似</u>：这是一个<u>判断维度</u> —— 它告诉你「<u>用这个技术要不要担心质量</u>」。</b><b>⇒ <u>注意力层 / 输出层</u>：这是一个<u>定位维度</u> —— 它告诉你「<u>这个技术动的是模型的哪一块</u>」。</b><br><b>⇒ <u>而讲课必须按「定位」走，因为同一个部位的技术互相关联（KV cache 和 PagedAttention 和 MLA 都在讲同一块东西）</u>。</b><br><b>⇒ <u>但「精确 / 近似」这个标签要一直挂在那里，因为它影响你用不用</u>。</b><br><b>⚠ 这是一个很好的组织方式：<u>一个维度决定讲的顺序，另一个维度作为贯穿的标签</u>。</b>");
  SUM(0,47,{h:"⭐ 推理效率：精确的与近似的",k:"最后一块：<b>人们在「推理时」想出的、让生成尽可能高效的技巧</b>（处境：<b>现代模型有很多参数，而你想生成很多 token</b>）。<b>第一类「精确」</b>：<b>你完全照样做本来该做的计算，只是用一个更高效的方式</b> —— 三条线索：<b>① 避免冗余 ② 最好地管理内存 ③ 重新表述 LLM 内部的方程</b>。<b>第二类「近似」</b>：<b>哪些近似是「做了也还行」的 —— 用更低成本拿到高质量回答，但是近似的</b> —— 三条线索：<b>① 架构上的变体 ② 嵌入上能做什么 ③ token 预测那一侧能做什么</b>。而讲的时候<b>按「部位」分组：先注意力层，再输出层</b>（并报了时间：<b>大概 22 分钟要全过一遍</b>）。",m:"★★★ 三条「精确」线索不是泛泛的提示，<b>它是一个目录</b>：<b>① 避免冗余 ⇒ KV cache ② 管理内存 ⇒ PagedAttention ③ 重新表述方程 ⇒ MLA（multi-latent attention）</b>；三条「近似」线索同样：<b>① 架构变体 ⇒ GQA ② 嵌入 ⇒ MLA 的低秩压缩 ③ token 预测 ⇒ speculative decoding 和 multi-token prediction</b>。⚠ 不过有个有意思的例外：<b>speculative decoding 其实是「精确」的 —— 它有一个数学保证，输出分布和原模型完全一致</b>。",w:"★★ 「<b>精确</b>」的定义很严格：<b>输出和不优化时「一模一样」—— 不是「几乎一样」，是逐位相同（在浮点误差内）⇒ 这类优化是「免费的午餐」，你不牺牲任何东西</b>。而「<b>近似</b>」的定义里那个让步是<b>输出会不一样 ⇒ 必须回答「差多少？值不值？」</b>；「<b>做了也还行</b>」这个措辞很诚实：<b>它承认这是一个判断而不是定理 —— 什么叫「还行」取决于你的应用，聊天机器人能接受的近似医疗诊断系统可能不能</b>。",r:"★★ 「很多参数 × 很多 token」这两个因子相乘就是推理成本的全部来源：<b>每生成一个 token 都要把全部（或激活的）参数过一遍，生成 1000 个 token 就是把模型跑 1000 遍</b>。而这和训练的成本结构很不一样：<b>训练是一次性的巨大支出、训完不用再训；推理是每个用户的每次请求都要付一次 ⇒ 对一个有大量用户的产品，推理的总成本很快超过训练</b> ⇒ <b>这就是推理优化是今天最热工程方向之一的原因：训练优化省的是一次性的钱，推理优化省的是每天都在流的钱</b>。★★★ 而讲者「给了分类却说讲的时候不按它走」是个好处理：<b>两个维度作用不同 —— 精确/近似是「判断维度」（用这个技术要不要担心质量），注意力层/输出层是「定位维度」（动的是哪一块）</b>；<b>讲课必须按定位走（同一部位的技术互相关联），但「精确/近似」这个标签要一直挂着，因为它影响你用不用</b> ⇒ <b>一个维度决定讲的顺序，另一个作为贯穿的标签</b>。"});
  QUIZ(0,47,{t:"「精确」类推理优化的定义是什么？",o:["只在推理时生效的优化","输出和不优化时「一模一样」（逐位相同，在浮点误差内）—— 所以它是免费的午餐，不牺牲任何东西","误差小于 1% 的优化","不改变参数量的优化"],a:1,w:"⇒ 而三条线索其实是一个目录：避免冗余 ⇒ KV cache；管理内存 ⇒ PagedAttention；重新表述方程 ⇒ MLA。"});

KP("48 · ⭐⭐ KV cache：把算过的 K 和 V 存下来",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  boxNode(130,214,1020,44,"我们看到过：在带掩码的自注意力里，每个 token 都需要「当前 token 去关注之前那些」","g");
  note("⇒ 假设你在生成序列，你已经生成了 a cute teddy bear",640,292,"y");
  note("★ 而现在你到了 is ⇒ 所以你有了 is 的那个 query",640,324,"g");
  note("⚠ 你会算 is 的 key 表示和 value 表示 —— 当然要算，它是你当前的 token",640,362,"d");},"<b>先把场景摆清楚，冗余才看得见。</b><br><b>讲者的话</b>：<b>「<u>那我们从注意力这一层开始。所以我们看到过，对每一个 token，你需要当前这个 token 在这个带掩码的自注意力里去关注之前那些。所以假设你在生成你的序列。你在某个给定的 token 上。所以假设你已经生成了 a cute teddy bear。而现在你到了 is。现在你有了 is 这个 query。你会去计算 is 的 key 表示和 value 表示。因为当然你必须这么做 —— 它是你当前的 token</u>。」</b><br><b>★★ 把这一步的计算量摆出来</b>：<b>⇒ 当前 token「is」：要算它的 <u>q、k、v</u> 三个投影。<u>这是必须的</u>。</b><b>⇒ 然后 <u>q_is</u> 要和<u>前面所有 token 的 k</u> 做点积 —— 也就是 <u>a、cute、teddy、bear</u> 的 k。</b><b>⇒ 再用得到的权重去加权<u>前面所有 token 的 v</u>。</b><br><b>★★★ 而问题就在这里：<u>a、cute、teddy、bear 的 k 和 v，在前面几步里已经算过了</u></b>：<b>⇒ 生成「cute」时算过 a 的 k、v。</b><b>⇒ 生成「teddy」时又算了一遍 a 和 cute 的。</b><b>⇒ <u>生成到第 n 个 token 时，前面 n−1 个的 k、v 已经被重复算了很多遍</u>。</b><br><b>⚠ 总计算量：<u>如果不缓存，生成 n 个 token 要算 1+2+…+n = O(n²) 次 k、v 投影</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("88:10","we want to have a way to reuse the past computations we had done");
  note("⭐⭐ 目标，一句话",640,186,"y");
  boxNode(130,214,1020,44,"我们想要有一个办法，「复用我们过去做过的那些计算」","g");
  note("⇒ 具体是：之前那些 token 的「key 表示」和「value 表示」",640,292,"y");
  note("★ 讲者连问了两遍：这个目标说得通吗？大家都同意吗？",640,324,"d");
  note("⚠ 而更精确地说：我们想找一个办法，让那些「key 和 value 矩阵被保存下来」",640,362,"g");},"<b>目标很直白，而讲者连确认了两遍。</b><br><b>讲者的话</b>：<b>「<u>但我们想要有一个办法，去复用我们过去做过的那些计算 —— 去计算之前那些 token 的 key 表示、和之前那些 token 的 value 表示。这作为一个目标说得通吗？大家都同意吗？好。而更精确地说，基本上我们想找一个办法，让那些 key 和 value 矩阵被保存下来</u>。」</b><br><b>★★★ 这个优化之所以成立，依赖一个关键性质：<u>之前那些 token 的 k、v 不会变</u></b>：<b>⇒ 为什么不会变？<u>因为因果掩码</u>。</b><b>⇒ 第 3 个 token 的表示<u>只依赖第 1、2、3 个 token</u> —— <u>它不会因为你后来生成了第 4 个而改变</u>。</b><br><b>★★ 所以「<u>算一次，存下来，以后直接用</u>」是完全安全的 —— <u>存下来的东西永远是对的</u>。</b><br><b>⇒ <u>而这正是 decoder-only 架构带来的一个附加好处</u>：如果是双向的（像 BERT），<u>加一个新 token 会改变所有已有 token 的表示 ⇒ 缓存就完全不成立了</u>。</b><br><b>⚠ 所以 KV cache 不是一个可以随便搬去别处的技巧 —— <u>它是因果注意力的一个专属红利</u>。</b><b>⇒ <u>而这又是一条「decoder-only 为什么赢」的理由，L2 那一讲没提到</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("88:44","I am not underlining the Q part here because of course, the query corresponding to the previous tokens are not going to be of interest");
  note("⭐⭐⭐ 为什么只存 K 和 V，不存 Q",640,186,"y");
  boxNode(130,214,1020,44,"讲者特地说：我「没有」把 Q 那部分划线","g");
  note("⇒ 因为当然 —— 之前那些 token 对应的 query，对「当前这个 token」来说是不感兴趣的",640,292,"y");
  note("★★ 所以它就是 key 和 value 那部分",640,324,"g");
  note("⚠ 这正好回答了 L2 里那个「为什么共享 K/V 不共享 Q」的问题的另一面",640,362,"r");},"<b>这一句把「为什么只存 K 和 V」说清楚了，而它和 L2 那个问题是同一件事的两面。</b><br><b>讲者的话</b>：<b>「<u>而我在这里没有把 Q 那部分划线，因为当然，之前那些 token 对应的 query，对当前这个 token 来说是不会感兴趣的。所以它就是 key 和 value 那部分</u>。」</b><br><b>★★★ 把不对称说清楚：<u>生成第 t 个 token 时，你需要什么</u></b>：<b>⇒ <u>query</u>：<u>只需要第 t 个</u>。因为注意力的计算是「<u>我（第 t 个）去问所有人</u>」。</b><b>⇒ <u>key 和 value</u>：<u>需要第 1 到第 t 个全部</u>。因为「所有人」要被问到。</b><br><b>★★ 而前面那些 token 的 query？<u>它们在自己那一步已经用过了，用完就没用了</u>。</b><b>⇒ 第 3 个 token 的 query 在生成第 3 个 token 时用过，<u>生成第 4 个时它完全无关</u>。</b><br><b>⇒ <u>所以存它纯属浪费</u>。</b><br><b>⚠ 而 L2 里 Afshine 讲 GQA 时说的是同一件事的另一面：<u>「K 和 V 会反复出现很多次，所以要共享它们来省缓存」</u>。</b><b>⇒ <u>这里说的是「K 和 V 要被缓存」，那里说的是「缓存太大所以要共享 K、V 的投影」—— 两件事严丝合缝地接上了</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("89:01","So there is this concept of KV cache");
  note("⭐⭐⭐ 名字公布：KV cache",640,188,"y");
  stack(640,202,["目标：把那些 key 和 value 矩阵「存在某个地方」","然后「直接从缓存里复用它们」","⇒ 当你要算某个给定 token 时，你从缓存里直接拿 key 和 value，而不是「再算一次」"],620,32,8);
  note("⇒ 讲者：所以这基本上就是我们刚才说的那件事的一个表示",640,330,"y");
  note("★★ 于是计算量从 O(n²) 次投影降到 O(n) 次",640,358,"g");
  note("⚠ 但代价是显存：你要一直持有那些 K 和 V",640,386,"r");},"<b>名字公布，而这是 L2 里 Afshine 预告过的那个东西。</b><br><b>讲者的话</b>：<b>「<u>所以有这么一个 KV cache 的概念，它的目标是把这些 key 和 value 矩阵存在某个地方，然后直接从缓存里复用它们。所以我刚刚在这里提到的那件事 —— 当你想计算某个给定的 token 时，你会直接从缓存里复用那个 key 和那个 value，而不是再计算一次。所以这基本上就是我们刚才说的那件事的一个表示</u>。」</b><br><b>★★★ 把收益和代价都算清楚</b>：<b>⇒ <u>收益</u>：k、v 投影的计算从 <u>O(n²)</u> 降到 <u>O(n)</u> —— 每个 token 只算一次。</b><b>⇒ <u>代价</u>：要持有 <u>层数 × 头数 × 序列长度 × d_head × 2</u> 个数（L2 算过，一个 7B 模型 32K 上下文约 17 GB）。</b><br><b>★★ 所以 KV cache 是一个<u>典型的「拿空间换时间」</u>，而且换得非常划算</b>：<b>⇒ 没有它，<u>长对话根本不可能 —— 每生成一个字都要把整段历史重算一遍</u>。</b><br><b>⇒ <u>所以它不是一个「优化」，它是让自回归生成在实践中可用的前提</u>。</b><br><b>⚠ 而这个「代价」正好引出后面两个技术：<u>PagedAttention 管它怎么放，MLA 管它怎么变小</u>。</b><b>⇒ <u>也就是说：KV cache 解决了一个问题，然后制造了下一个问题</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("★★ 所以「KV 缓存这个概念根本就不会冒出来」",640,324,"g");
  note("⚠ 讲者评价：但这是个很好的问题",640,362,"d");},"<b>这个提问很好，而答案把训练和推理的差别又钉了一遍。</b><br><b>讲者的话</b>：<b>「<u>很好的问题。所以问题是，在训练期间我们做 KV 缓存吗？我会说在训练期间，你有 teacher forcing 这个概念 —— 在那里你把你的全部输入一次性全都放进去、一起传过去。所以 KV 缓存这个概念根本就不会冒出来</u>。」</b><br><b>★★★ 为什么训练时不需要缓存：<u>因为根本没有「重复计算」这回事</u></b>：<b>⇒ 训练时，<u>整个序列一次性进去</u>（L2 的 teacher forcing）。</b><b>⇒ 所有位置的 k、v <u>在同一次前向里被算出来，一次性</u>。</b><b>⇒ <u>每个 token 的 k、v 只算了一遍 —— 没有冗余可省</u>。</b><br><b>★★ 所以缓存这件事，<u>完全是「串行生成」这个形态带来的</u></b>：<b>⇒ 训练并行 ⇒ 一次算完 ⇒ 无冗余。</b><b>⇒ 推理串行 ⇒ 一步一步算 ⇒ <u>前面的被反复用到</u> ⇒ 才需要缓存。</b><br><b>⇒ <u>这是这一讲里第三次回到「训练并行、推理串行」这个对比了</u>（36:45 那镜、47:50 那镜、这里）。</b><br><b>⚠ 而它确实是理解 LLM 工程的一把钥匙：<u>几乎所有推理优化的问题，根子都在「推理是串行的」这件事上</u>。</b>");

  note("⚠ 这个确认值得留一镜 —— 因为「一句话说清一个机制的意义」本身是一种能力",640,362,"r");},"<b>这个确认很短，但它值得留一镜。</b><br><b>对话</b>：<b>学生：<u>这一整套的意义，就是我们想复用那些已经做过的计算？</u></b><b>讲者：<u>而你的答案是：是的。完全说中（Spot on）。</u></b><br><b>★★ 「<u>Spot on</u>」这个评价讲者在这一讲里只用了这一次，<u>而这个学生确实说到了点上</u>。</b><br><b>★★★ 为什么「一句话说清一个机制的意义」本身是一种能力</b>：<b>⇒ 讲者刚花了三分钟讲 KV cache：<u>场景、冗余、为什么不存 Q、名字、缓存的内容</u>。</b><b>⇒ 而学生用一句话把它收成了：「<u>复用已经做过的计算</u>」。</b><br><b>⇒ <u>这句话丢掉了全部细节，但它抓住了唯一要紧的那件事</u>。</b><br><b>★★ 而这正是检验「是否真懂」的一个好办法：<u>能不能用一句话说出它的意义，而不是复述它的步骤</u>。</b><b>⇒ 复述步骤只需要记忆，<u>而概括意义需要理解</u>。</b><br><b>⚠ 所以你学完每一个技术之后，<u>可以试着给自己做这个测试</u>：<u>如果只能说一句话，你会说什么？</u></b>");
  SUM(0,48,{h:"⭐⭐ KV cache",k:"先指出冗余：<b>在带掩码的自注意力里，每个 token 都需要「当前 token 去关注之前那些」</b> —— 生成到 is 时你要算 is 的 key 和 value（<b>当然要算，它是当前 token</b>），<b>但我们想要有一个办法去复用我们过去做过的那些计算 —— 之前那些 token 的 key 表示和 value 表示</b>。⭐ 为什么不存 Q：<b>我没有把 Q 那部分划线，因为之前那些 token 对应的 query 对当前 token 来说是不感兴趣的</b>。⇒ <b>KV cache：把这些 key 和 value 矩阵存在某个地方，然后直接从缓存里复用，而不是再算一次</b>。提问：<b>训练时也做 KV 缓存吗？⇒ 训练时有 teacher forcing，你把全部输入一次性放进去一起过，所以这个概念根本不会冒出来</b>。",m:"★★★ 这个优化依赖一个关键性质：<b>之前那些 token 的 k、v 不会变 —— 因为因果掩码，第 3 个 token 的表示只依赖第 1、2、3 个，不会因为你后来生成了第 4 个而改变</b> ⇒ <b>「算一次、存下来、以后直接用」是完全安全的</b>。而这正是 decoder-only 的一个附加好处：<b>如果是双向的（像 BERT），加一个新 token 会改变所有已有 token 的表示 ⇒ 缓存完全不成立</b> ⇒ <b>KV cache 是因果注意力的专属红利，又是一条「decoder-only 为什么赢」的理由（L2 没提到）</b>。",w:"★★★ 不对称要说清：<b>生成第 t 个 token 时，query 只需要第 t 个（注意力是「我去问所有人」），而 key 和 value 需要第 1 到第 t 个全部（「所有人」要被问到）</b>；<b>而前面那些 token 的 query 在自己那一步用过就没用了 ⇒ 存它纯属浪费</b>。⇒ 这和 L2 里 Afshine 讲 GQA 是同一件事的两面：<b>这里说「K 和 V 要被缓存」，那里说「缓存太大所以要共享 K/V 的投影」—— 严丝合缝地接上了</b>。⇒ 账：<b>收益是 k/v 投影从 O(n²) 降到 O(n)；代价是要持有 层数×头数×序列长度×d_head×2 个数（7B 模型 32K 上下文约 17 GB）</b> ⇒ <b>典型的「拿空间换时间」而且换得极划算 —— 没有它长对话根本不可能，所以它不是「优化」而是让自回归生成可用的前提</b>；⚠ 而这个代价正好引出后面两个技术（<b>PagedAttention 管怎么放，MLA 管怎么变小</b>）—— <b>KV cache 解决了一个问题，然后制造了下一个问题</b>。",r:"⇒ 训练时不需要缓存是因为<b>根本没有「重复计算」这回事</b>：<b>整个序列一次性进去，所有位置的 k、v 在同一次前向里算出来，每个只算一遍、没有冗余可省</b> ⇒ <b>缓存完全是「串行生成」这个形态带来的</b>，而这是这一讲<b>第三次</b>回到「训练并行、推理串行」这个对比 —— <b>它确实是理解 LLM 工程的一把钥匙：几乎所有推理优化的问题，根子都在「推理是串行的」上</b>。★★ 最后那个确认值得留意：学生用一句话把三分钟的内容收成「<b>复用已经做过的计算</b>」，而讲者给了全场唯一一个「<b>Spot on</b>」⇒ <b>「能用一句话说出它的意义而不是复述它的步骤」是检验是否真懂的好办法 —— 复述步骤只需要记忆，概括意义需要理解</b>。"});

  note("⚠ 而讲者的观察是：这导致「大量的浪费」",640,386,"r");},"<b>这就是那个朴素做法，而它浪费的原因很具体。</b><br><b>讲者的话</b>：<b>「<u>一个朴素的存 key 和 value 矩阵的方式，会是在一开始就预留一块内存，它对应着整个 context length —— 因为你不知道你会在哪里停。你停止你的解码，是在你撞到 EOS token 的时候。所以你会有这一整块「context length 那么大、最大 context length」的区域可能被预留出来。所以一个观察是：它导致了大量的浪费</u>。」</b><br><b>★★★ 为什么必须预留：<u>因为你不知道这次回答会生成多长</u></b>：<b>⇒ 用户问「<u>1+1 等于几</u>」⇒ 可能回答 5 个 token。</b><b>⇒ 用户问「<u>写一篇论文</u>」⇒ 可能回答 4000 个 token。</b><b>⇒ <u>而你在开始生成之前，完全不知道是哪一种</u>。</b><br><b>★★ 而传统的内存分配要求<u>连续的一整块</u></b>：<b>⇒ 你没法「<u>先要 100 个，不够了再续</u>」—— <u>因为中间那块地方可能已经被别人占了</u>。</b><b>⇒ <u>所以只能一上来就按最坏情况要</u>。</b><br><b>⇒ <u>于是那个「1+1 等于几」的请求，占了和「写一篇论文」一样多的显存</u>。</b><br><b>⚠ 这正是 L2 讲 PAD token 时那个问题的放大版：<u>为了让形状规整，你按最长的那个来，然后浪费掉剩下的</u>。</b>");

  SUM(0,50,{h:"⚠ 朴素地存缓存会浪费大量显存",k:"场景切换到硬件侧：<b>我是一台推理服务器，从多个用户那里收到查询</b>。朴素做法：<b>一开始就预留一块内存，大小对应「整个 context length」—— 因为你不知道会在哪里停（你撞到 EOS 才停止解码）</b> ⇒ <b>于是有一整块「最大 context length」那么大的区域被预留，而这导致「大量的浪费」</b>。具体：<b>context length 是 2k ⇒ 每个请求预留 2k ⇒ 想服务更多请求时，内存会「非常快地」没有足够空间</b>。",m:"★★★ 这个场景切换很关键，<b>因为前面所有讨论都是「单个请求」视角</b>：<b>KV cache 省计算在单请求里就成立，而占显存在单请求里不严重（17 GB 一张 A100 装得下）</b>；<b>但一台服务器要同时服务几十上百个请求，每个各有一份自己的缓存 ⇒ 显存压力乘以并发数，而显存是硬上限 —— 装不下就是装不下，没有「慢一点」这个选项</b> ⇒ <b>「一张卡能同时服务多少用户」几乎完全由 KV cache 的显存效率决定，而这直接等于单位成本 —— 不是学术问题，是账本问题</b>。",w:"★★ 为什么必须预留：<b>你不知道这次回答会生成多长</b>（「1+1 等于几」可能 5 个 token，「写一篇论文」可能 4000 个，<b>而你在开始生成前完全不知道是哪一种</b>）；而<b>传统内存分配要求连续的一整块 —— 你没法「先要 100 个不够再续」，因为中间那块可能已被别人占了 ⇒ 只能一上来按最坏情况要</b> ⇒ <b>「1+1」那个请求占了和「写一篇论文」一样多的显存</b>。⚠ 这正是 L2 讲 PAD token 时那个问题的放大版：<b>为了让形状规整，你按最长的来，然后浪费掉剩下的</b>。",r:"⇒ 浪费率算一下大得吓人：<b>预留 2048 个 token，而典型回答只有 200 个 ⇒ 浪费率约 90%</b> ⇒ <b>一张卡本来能服务 100 个用户，实际只能服务 10 个 —— 直接意味着十倍的成本</b> ⇒ <b>这不是「优化一下更好」，是「成本相差十倍」</b>。⚠ 「<b>非常快地</b>」也是对的：<b>显存的下降是阶梯式的 —— 每接一个新请求就少一大块，很快就接不下了</b> ⇒ <b>于是服务器明明还有大量空闲算力，却因为显存满了而拒绝新请求 —— 这种「算力闲着、显存爆了」的状态正是 PagedAttention 要治的</b>。"});
  QUIZ(0,50,{t:"为什么朴素的 KV cache 分配要「一上来就按最大上下文长度预留」？",o:["你不知道这次会生成多长（撞到 EOS 才停），而传统分配要求连续一整块、不能「不够了再续」⇒ 只能按最坏情况要","因为 PyTorch 不支持动态分配","为了让 GPU 能并行","为了对齐内存地址"],a:0,w:"⇒ 浪费率算一下：预留 2048 而典型回答只有 200 ⇒ 约 90% 浪费 ⇒ 一张卡本来能服务 100 个用户实际只能服务 10 个，直接十倍成本。"});

KP("51 · ⭐⭐ PagedAttention：把缓存切成小块来放",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("94:22","there is this paper that is called PagedAttention. And it defines several quantities");

  note("⇒ 讲者：它定义了好几个量 —— 预留量、内部碎片、外部碎片",640,290,"y");
  note("★★ 而这三个词正好把「浪费」拆成了可以分别处理的几块",640,328,"g");
  note("⚠ 给浪费起名字，是治理它的第一步",640,366,"r");},"<b>这篇论文做的第一件事是给浪费起名字，而这一步很重要。</b><br><b>讲者的话</b>：<b>「<u>而接着有这么一篇论文叫做 PagedAttention。而它定义了好几个量。所以有这个 reserved 量、internal fragmentation、以及 external fragmentation</u>。」</b><br><b>★★★ 「<u>给浪费起名字</u>」这件事为什么重要</b>：<b>⇒ 在这之前，大家只知道「<u>显存不够用</u>」。</b><b>⇒ 而这是一个笼统的抱怨，<u>没法针对性地解决</u>。</b><br><b>★★ 而一旦你把它拆成三类，<u>每一类都有各自的治法</u></b>：<b>⇒ <u>reserved</u>（预留了但还没用到的，将来会用）⇒ 这个<u>不算真浪费</u>。</b><b>⇒ <u>internal fragmentation</u>（预留了、而且永远不会用到的）⇒ <u>这是最大的那块</u>。</b><b>⇒ <u>external fragmentation</u>（块与块之间的空隙）⇒ 这是分配器造成的。</b><br><b>⚠ 这是一个很一般的工程方法：<u>要优化一个东西，先把它分解成可以分别度量的部分</u>。</b><b>⇒ <u>「显存浪费了 90%」没法行动；「内部碎片占 70%、外部碎片占 20%」就可以了</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("94:36","Internal fragmentation is basically the space that is being reserved by the model to complete the request");
  note("⭐ 内部碎片：预留了，但里面什么都没有",640,186,"y");
  boxNode(130,214,1020,44,"internal fragmentation：模型为了完成这个请求而「预留」的那块空间","g");
  note("⇒ 而那个 reserved 的位置，是它里面「真正被用到的那些 token」对应的那个子集",640,292,"y");
  note("★★ 讲者的描述很直白：那里面什么都没有，但它被预留了",640,324,"r");
  note("⚠ 这就是上一镜那个「预留 2048、只用 200」里被浪费的那 1848 个位置",640,362,"g");},"<b>内部碎片就是上一镜那个浪费，而它有了一个精确的名字。</b><br><b>讲者的话</b>：<b>「<u>Internal fragmentation 基本上就是模型为了完成这个请求而预留的那块空间。而那个 reserved 的位置，是它里面对应着真正被用到的那些 token 的那个子集。所以它是那种实际被用上的空间 —— internal fragmentation 里面什么都没有，但它被预留了</u>。」</b><br><b>★★ 讲者这里的表述有一点绕，<u>把三个量的关系画出来就清楚了</u></b>：<b>⇒ 你预留了一整块（比如 2048 个槽位）。</b><b>⇒ 其中 <u>200 个真的放了 token</u> ⇒ 这是<u>实际使用</u>。</b><b>⇒ 剩下 <u>1848 个是空的</u>。</b><br><b>★★★ 而这 1848 个里，论文又分了两类</b>：<b>⇒ <u>reserved</u>：这次请求<u>将来还会用到的</u>（它还在生成中）。</b><b>⇒ <u>internal fragmentation</u>：<u>这次请求永远不会用到的</u>（它生成完就结束了，剩下的白占）。</b><br><b>⇒ <u>区别在于「将来会不会被填上」—— 而这决定了它能不能被别人借用</u>。</b><br><b>⚠ 而最要命的是：<u>这两者在请求跑完之前，你分不清哪些是哪些</u>。</b><b>⇒ <u>所以传统分配器只能把它们一视同仁地占着</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("94:52","external fragmentation is the memory management system that does not necessarily put one block one after another");
  note("⭐ 外部碎片：块与块之间的空隙",640,186,"y");
  boxNode(130,214,1020,44,"external fragmentation：内存管理系统「不一定把一块紧挨着另一块放」","g");
  note("⇒ 它有它自己那套分配内存块的方式",640,292,"y");
  note("★★ 所以它可能会「留下一些别的空隙」",640,324,"r");
  note("⚠ 后果：你明明有足够的「总空闲」，却没有一块「足够大的连续空间」",640,362,"g");},"<b>外部碎片是另一种浪费，而它的后果很反直觉。</b><br><b>讲者的话</b>：<b>「<u>而 external fragmentation 是：那个内存管理系统不一定把一块紧挨着另一块地放，而是有它自己那套分配内存块的方式。所以它可能会留下一些别的空隙</u>。」</b><br><b>★★★ 外部碎片最反直觉的后果是：<u>你有足够的总空闲，却分配不出一块</u></b>：<b>⇒ 比如显存里有 <u>5 个各 1 GB 的空隙</u>，总共 5 GB 空闲。</b><b>⇒ 而一个新请求要 <u>一块连续的 3 GB</u>。</b><b>⇒ ⇒ <u>分配失败 —— 虽然你有 5 GB</u>。</b><br><b>★★ 这是经典的内存碎片问题，<u>操作系统在五十年前就遇到过它</u>。</b><b>⇒ <u>而操作系统的解法就是「分页（paging）」—— 把内存切成固定大小的小页，然后用一张表把「逻辑地址」映射到「物理页」</u>。</b><b>⇒ 于是<u>逻辑上连续的东西，物理上可以散落在各处</u>。</b><br><b>⇒ <u>而 PagedAttention 这个名字，就是直接从操作系统的 paging 借来的</u>。</b><br><b>⚠ 这是一个很好的例子：<u>一个「新领域」的难题，往往在另一个老领域里早就有成熟的解法</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("95:14","they came up with a system that is called a PagedAttention that is powering one inference package called the vLLM");
  note("⭐⭐⭐ 解法：按「固定大小的块」来映射",640,188,"y");
  stack(640,202,["与其给一个请求分配「一整块内存」…","不如把它「拆成更小的块（chunks）」","⇒ 论文里块的大小取的是 16"],620,32,8);
  note("⇒ 而这个系统在驱动一个叫 vLLM 的推理包",640,330,"y");
  note("★★ 效果：你用完一行就「直接开始用另一行」，不会浪费超过那一点点空间",640,358,"g");
  note("⚠ 而有一个「字典」，把 token 的位置索引映射到它们的缓存值",640,386,"r");},"<b>这就是解法，而它和操作系统的分页是一模一样的结构。</b><br><b>讲者的话</b>：<b>「<u>而他们想出了一个系统叫做 PagedAttention，它在驱动一个叫 vLLM 的推理包，它通过「按固定大小的块来映射那个生成过程」解决了这个问题。所以与其分配一整块内存来回答某个给定的请求，它把它拆成更小的块。所以我想那篇论文块的取值是 16。所以如你所见，假设你在一个生成过程里、你已经用掉了某一行，你就直接开始用另一行，而不会浪费超过那一点点的空间。然后你有某个字典，把 token 的位置索引映射到它们的缓存值。所以有一套聪明的管理方式。而他们展示它把碎片减少了相当多</u>。」</b><br><b>★★★ 把机制说清楚</b>：<b>⇒ 把显存切成固定大小的「<u>块</u>」，每块装 <u>16 个 token</u> 的 KV。</b><b>⇒ 一个请求<u>按需申请块</u>：生成到第 17 个 token 时才申请第二块。</b><b>⇒ 一张<u>映射表</u>记住「这个请求的第 n 个 token 在哪一块」。</b><br><b>★★ 于是两种碎片同时被治好了</b>：<b>⇒ <u>内部碎片</u>：最多浪费 <u>15 个槽位</u>（最后一块没填满），<u>而不是 1848 个</u>。</b><b>⇒ <u>外部碎片</u>：所有块<u>一样大</u>，所以任何空闲块都能被任何请求用 —— <u>不存在「有空间但不连续」的问题</u>。</b><br><b>⚠ 而 <u>vLLM</u> 这个名字值得记：<u>它是今天最主流的开源推理引擎之一，而它的核心就是这篇论文</u>。</b>");
  SUM(0,51,{h:"⭐⭐ PagedAttention",k:"<b>PagedAttention</b> 这篇论文定义了三个量：<b>reserved（预留）、internal fragmentation、external fragmentation</b>。<b>内部碎片</b>：<b>模型为完成这个请求而预留的那块空间 —— 里面什么都没有，但它被预留了</b>。<b>外部碎片</b>：<b>内存管理系统不一定把一块紧挨着另一块放，它有自己那套分配方式，所以可能留下一些别的空隙</b>。解法：<b>与其给一个请求分配一整块内存，不如把它拆成更小的块（论文里块大小取 16）—— 你用完一行就直接开始用另一行，不会浪费超过那一点点；而有一个「字典」把 token 的位置索引映射到它们的缓存值</b>；<b>它在驱动一个叫 vLLM 的推理包，并把碎片减少了相当多</b>。",m:"★★★ 这篇论文做的第一件事是<b>给浪费起名字</b>，而这一步很重要：<b>在这之前大家只知道「显存不够用」—— 一个笼统的抱怨，没法针对性解决</b>；<b>而拆成三类后每类都有各自的治法：reserved（预留了但将来会用）不算真浪费；internal fragmentation（预留了而且永远不会用到）是最大的那块；external fragmentation（块与块之间的空隙）是分配器造成的</b> ⇒ 一般工程方法：<b>要优化一个东西，先把它分解成可以分别度量的部分 —— 「浪费了 90%」没法行动，「内部碎片 70%、外部碎片 20%」就可以了</b>。",w:"★★★ 外部碎片最反直觉的后果：<b>你有足够的总空闲却分配不出一块</b>（显存里 5 个各 1 GB 的空隙共 5 GB 空闲，而新请求要一块连续的 3 GB ⇒ <b>分配失败，虽然你有 5 GB</b>）。这是经典的内存碎片问题，<b>操作系统五十年前就遇到过，而它的解法就是「分页」—— 把内存切成固定大小的小页，用一张表把逻辑地址映射到物理页，于是逻辑上连续的东西物理上可以散落各处</b> ⇒ <b>PagedAttention 这个名字就是直接从操作系统的 paging 借来的</b>。⚠ 很好的例子：<b>一个「新领域」的难题，往往在另一个老领域里早就有成熟的解法</b>。",r:"⇒ 机制：<b>把显存切成固定大小的块（每块 16 个 token 的 KV），一个请求按需申请块（生成到第 17 个 token 才申请第二块），一张映射表记住「这个请求的第 n 个 token 在哪一块」</b> ⇒ 两种碎片同时被治好：<b>内部碎片最多浪费 15 个槽位（最后一块没填满）而不是 1848 个；外部碎片因为所有块一样大，任何空闲块都能被任何请求用 —— 不存在「有空间但不连续」</b>。⇒ 三个量的关系画出来才清楚：<b>预留 2048 个槽位，其中 200 个真放了 token（实际使用），剩下 1848 个空的又分两类 —— reserved（这次请求将来还会用到）和 internal fragmentation（永远不会用到）</b>，<b>区别在「将来会不会被填上」，而最要命的是请求跑完之前你分不清哪些是哪些，所以传统分配器只能一视同仁地占着</b>。⚠ <b>vLLM 这个名字值得记：今天最主流的开源推理引擎之一，核心就是这篇论文</b>。"});
  QUIZ(0,51,{t:"PagedAttention 怎么同时治好内部碎片和外部碎片？",o:["把缓存搬到 CPU 内存","共享不同请求的缓存","把显存切成固定大小的块（16 个 token）按需申请 + 一张映射表 ⇒ 内部最多浪费 15 个槽位，而块一样大就不存在「有空间但不连续」","压缩 KV 的数值精度"],a:2,w:"⇒ 这个名字直接借自操作系统的「分页」—— 一个新领域的难题，往往在老领域里早有成熟解法。而 vLLM 就是靠它驱动的。"});
});

  note("⚠ 关键词是 latent（潜在的）—— 它指的是那个「中间的低维空间」",640,362,"r");},"<b>名字里最要紧的那个词是 latent。</b><br><b>讲者的话</b>：<b>「<u>而这是 DeepSeek 试着去攻克的一个话题，在一个叫做 —— 我想它是叫 multi-latent attention 的概念里</u>。」</b><br><b>★★ 原论文（DeepSeek-V2，2024）里的全名是 <u>Multi-head Latent Attention</u>，<u>通常缩写成 MLA</u>。</b><br><b>★★★ 「<u>latent（潜在的）</u>」这个词在机器学习里有一个固定含义：<u>一个不直接可见的、低维的中间表示</u></b>：<b>⇒ <u>自编码器</u>里的 latent space：把高维输入压到低维再还原。</b><b>⇒ <u>扩散模型</u>里的 latent：Stable Diffusion 就是在一个压缩过的空间里做扩散。</b><b>⇒ <u>MLA</u> 里的 latent：<u>把 K、V 压到一个低维空间，存那个压缩版本</u>。</b><br><b>⇒ <u>三个场景，同一个想法：高维的东西其实「内在维度」没那么高，所以可以压</u>。</b><br><b>⚠ 而 DeepSeek 做这件事的动机很实际：<u>他们要在受限的算力下训出前沿模型，所以每一项成本都要抠</u>。</b><b>⇒ <u>MLA 和 MoE 都是他们那条路线上的产物</u>。</b>");

  note("⚠ 所以问题是两重的：份数多，而且每一份都长",640,386,"r");},"<b>把原味情形摆清楚，问题的两个维度就都出来了。</b><br><b>讲者的话</b>：<b>「<u>我们来看看原味的情形。如果你在多头注意力里，那么对一个 token 的某个给定表示，你有 h 个投影矩阵把它变成一个 key。大家都同意这个吗？所以那种自注意力公式里，你有一个给 key 的投影矩阵 W_k，它会把 token 的表示投影成某个 key。而你有 h 个头。你有 h 个这样的投影，而你有 h 个这样的结果嵌入需要存进你的缓存。因为你 key 是这样、value 也是这样。那是很多向量要存。而这些 key 和 value，它们本身也相当长。所以我们来看看能不能让它变小</u>。」</b><br><b>★★★ 两个维度要分开</b>：<b>⇒ <u>份数多</u>：h 个头 × 2（K 和 V）= <u>2h 个向量</u>。</b><b>⇒ <u>每份长</u>：每个向量 <u>d_head 维</u>（通常 128）。</b><br><b>★★ 而 GQA 治的是第一个（<u>把 2h 降到 2g</u>），<u>MLA 要治的是第二个</u>。</b><b>⇒ <u>不过你会看到 MLA 其实把两个都治了 —— 而且治得更彻底</u>（99:31 那镜）。</b><br><b>⚠ 「<u>我们来看看能不能让它变小</u>」—— 讲者这句引出的是一个很标准的技术：<u>低秩分解</u>。</b>");

  SUM(0,52,{h:"⭐⭐ MLA（一）：压到一个低维空间",k:"下一个问题：<b>你把 token 的内部表示投影成 query/key/value，而 key 和 value 的维度是「不可忽略」的，而且你要在每一个 transformer block 里都存一份 ⇒ 有很多这样的向量要跟踪 —— 有没有办法让那个表示更紧凑？</b>⇒ <b>这是 DeepSeek 试着攻克的一个话题，叫 multi-latent attention</b>。第一步：<b>把那些投影矩阵「因式分解」到一个「中间空间」里，而那个空间的维度低于 key 所在的空间 —— 先做一次降维变换，再做另一次解压变换</b>。",m:"★★★ 三个方向砍的是同一个乘积里的不同因子：<b>缓存大小 = 层数 × 头数 × 序列长度 × 每个向量的维度 × 2</b> —— <b>稀疏注意力砍「序列长度」、GQA 砍「头数」、MLA 砍「每个向量的维度」</b>，<b>而「层数」基本动不了（那是模型深度）</b> ⇒ <b>这三个互相正交、理论上可以叠加</b>。⚠ 「<b>把成本写成一个乘积，然后逐项找优化</b>」这个思路，是读所有效率论文的一把钥匙。",w:"★★★ 把形状写出来：<b>原来是 h（d_model）→ W_k → k（d_head），而你缓存 k；MLA 是 h → W_down → c（d_latent，很小）→ W_up → k，而你只缓存 c</b> ⇒ 这是经典的「<b>拿计算换存储</b>」：<b>存压缩版 c，用的时候现场乘 W_up 解压成 k —— 多一次矩阵乘法，少大量显存</b>。而<b>这个交换在推理时划算，因为推理是「内存受限」的 —— 计算单元本来就在等内存，多算一点不要钱</b>。⇒ 「因式分解」准确：<b>W_k ≈ W_up · W_down，一个大矩阵被拆成两个瘦矩阵的乘积 —— 这就是「低秩」：它假设 W_k 的秩其实没那么高</b>。",r:"⇒ 原论文（DeepSeek-V2，2024）里全名是 <b>Multi-head Latent Attention，缩写 MLA</b>。「<b>latent（潜在的）</b>」在机器学习里有固定含义：<b>一个不直接可见的、低维的中间表示</b> —— <b>自编码器的 latent space、扩散模型的 latent（Stable Diffusion 就在压缩空间里做扩散）、MLA 的 latent（把 K/V 压到低维空间存压缩版）</b> ⇒ <b>三个场景一个想法：高维的东西其实「内在维度」没那么高，所以可以压</b>。⚠ DeepSeek 做这件事的动机很实际：<b>他们要在受限算力下训出前沿模型，所以每一项成本都要抠 —— MLA 和 MoE 都是那条路线上的产物</b>。⇒ 另：原味情形的问题是两重的 —— <b>份数多（2h 个向量）而且每份长（d_head 维，通常 128）；GQA 治第一个，MLA 要治第二个（而你会看到它其实两个都治了）</b>。"});

  SUM(0,54,{h:"⭐⭐ speculative decoding：小模型先写草稿",k:"<b>speculative decoding</b>：<b>用某个「更小的模型」去帮助一个「更大的模型」的生成，然后用某种方案让输出的分布「匹配上目标模型的那个」</b>。流程：<b>① 让一个更小的模型（论文里叫 draft，草稿）去生成接下来的词 —— my teddy bear ⇒ is ⇒ cute ⇒ smart，而既然这个 LLM 很小，这典型地比用大 LLM 快 ② 一旦有了这些，你把小 LLM 预测的那些 token「全部作为输入」放进目标 LLM，让它为「每一个」生成概率分布</b>。它的结构是<b>小模型提建议、而某些「基于数学性质」的东西去「把关（gate）」它</b>。",m:"★★★ 定义里第二半才是真正了不起的：<b>「用小模型帮大模型」是显然的省钱想法，而「让输出分布匹配目标模型」是一个数学保证</b> ⇒ <b>它意味着这个方法是「精确」的不是「近似」的 —— 你用小模型加速，而最终输出分布和完全不用时一模一样，没有牺牲任何质量</b>，<b>这是极少数「纯赚」的优化之一</b>（⚠ 而讲者在 86:17 把它归到了「近似」那组线索里，严格说是个归类上的小出入）。",w:"★★★ 「<b>把关（gate）</b>」把两个模型的角色分清了：<b>小模型提建议（快但不够准），大模型拍板（准但慢）</b>，而关键在于「<b>拍板比生成便宜</b>」：<b>大模型生成 5 个 token 要跑 5 次前向（串行），而检查 5 个候选只要跑 1 次（并行）—— 这就是全部的加速来源</b>。⇒ 而「一次前向能拿到 4 个位置的分布」是<b>因为因果掩码</b>：<b>把整个序列喂进去，位置 4 只看到前 4 个、位置 5 只看到前 5 个 ⇒ 这一次前向同时给出了四个位置各自的「下一个该是什么」</b> ⇒ <b>这和 L2 的 teacher forcing 是完全同一个机制，区别只在「塞进去的是正确答案还是草稿」</b> ⇒ <b>speculative decoding 本质上是「在推理时用上训练时那种并行性」—— 而它能存在的根本原因是：验证可以并行，生成不能</b>。",r:"⚠ 草稿模型<b>仍然是串行的</b> —— 生成 4 个草稿要跑 4 次。所以加速的账（设草稿小 10 倍、一次出 4 个）：<b>不用是目标模型跑 4 次 = 4 个单位；用了是草稿 4 次（0.4）+ 目标 1 次（1）= 1.4 个单位 ⇒ 约 2.9 倍（如果全被接受）</b> ⇒ <b>草稿模型必须足够小，否则它自己那 4 次就把省下的时间吃光了 —— 典型搭配是「7B 目标 + 1B 草稿」或更悬殊</b>。"});

  note("⚠ 拒绝采样的经典用途：从一个难采的分布里采样，办法是「从易采的里采、再筛」",640,362,"r");},"<b>这个学生认出了一个老技术，而这个认出来本身很有价值。</b><br><b>对话</b>：<b>学生：<u>那是拒绝采样吗？</u></b><b>讲者：<u>是的。所以你们中有些人可能已经对它很熟悉了。</u></b><br><b>★★★ 「<u>拒绝采样（rejection sampling）</u>」是统计里一个<u>几十年的老技术</u></b>：<b>⇒ <u>问题</u>：你想从一个分布 p 里采样，<u>但 p 很难直接采</u>。</b><b>⇒ <u>办法</u>：找一个容易采的分布 q，<u>从 q 里采，然后按某个概率筛掉一部分</u>。</b><b>⇒ <u>只要筛的规则设计对了，留下来的样本就服从 p</u>。</b><br><b>★★ 而 speculative decoding 正是这个结构的一个实例</b>：<b>⇒ <u>p</u> = 目标模型的分布（<u>难采 —— 因为跑一次很贵</u>）。</b><b>⇒ <u>q</u> = 草稿模型的分布（<u>易采 —— 便宜</u>）。</b><b>⇒ <u>筛的规则</u> = 那个接受概率 p/q。</b><br><b>⇒ <u>所以这个方法的全部数学，在 1950 年代就已经有了 —— 新的只是「把它用在 LLM 上」这个想法</u>。</b><br><b>⚠ 这又是那个模式：<u>一个新领域的难题，在老领域里早有成熟的工具</u>（PagedAttention 借的是操作系统的分页，这里借的是统计的拒绝采样）。</b>");
  SUM(0,55,{h:"⭐⭐⭐ 接受拒绝，与分布不变的保证",k:"把关规则：<b>① 看草稿模型预测的那个 token 的概率 —— 如果目标模型给它的概率「大于」草稿模型的，就「直接接受」② 否则，有某个「接受拒绝机制」，它要么接受要么拒绝</b>。结局：<b>假设全部被接受，那在「一次传递」里你能前进多得多的 token；而如果失败了，你就从「那个好的 token」往后恢复生成，并对分布做一些调整</b>。最该问的问题：<b>这看起来像个配方 —— 它凭什么匹配上目标分布？⇒ 从「全概率公式」出发、把每一项用这些量写出来，你最后就会得到那个目标分布（论文只用几行就证明了，而讲者鼓励你自己做这个练习）</b>。一个提问：<b>那是「拒绝采样」吗？⇒ 是的</b>。",m:"★★★ 记号写清楚：<b>q(x) 是草稿模型的概率、p(x) 是目标模型的概率 —— p(x) ≥ q(x) 就无条件接受；否则以 p(x)/q(x) 的概率接受</b>。为什么必须「随机」拒绝而不是「一律」拒绝：<b>一律拒绝会让这个 token 的最终频率变成 0，而目标模型本来给它 p=0.4、它应该出现 40% 的时候 ⇒ 分布就偏了</b>；<b>而以 p/q 接受时：被草稿选中的概率是 q，乘接受概率 p/q ⇒ q × (p/q) = p，一行算完分布就对上了</b>。",w:"★★★ 那个证明的骨架确实只有几行：<b>一个 token x 最终被输出有两条路径 —— ① 草稿选了它（q(x)）并被接受（min(1, p/q)）② 草稿选了别的被拒，然后从修正分布里重采到了 x</b>；而<b>修正分布被精心设计成 norm(max(0, p − q))，正好补上第一条路径缺的那部分 ⇒ min(p,q) + [p − min(p,q)] = p</b>，证完。⚠ 「几行就证完」本身很说明问题：<b>一个在工程上带来 2–3 倍加速的方法，正确性证明只有几行 —— 这是一个设计上极干净的方案</b>。",r:"⇒ 失败的代价比想象中小，<b>它不是「全部作废」</b>：草稿给 4 个而第 3 个被拒 ⇒ <b>前 2 个仍然算数，第 3 个位置从修正分布重采一个（也是免费的，目标模型那次前向已经算出了这个位置的分布），只有第 4 个作废</b> ⇒ <b>一次「失败」仍然前进了 3 个 token，而代价只有一次目标模型前向（不用 speculative 的话 3 个要跑 3 次）—— 即便中途被拒这一轮仍然是赚的</b>；<b>最坏情况是「只前进 1 个 token」，而那时它和普通生成一样快 ⇒ 几乎没有下行风险</b>。★★ 而「拒绝采样」是统计里几十年的老技术：<b>想从难采的 p 里采样 ⇒ 从易采的 q 里采、再按某个概率筛掉一部分，只要规则设计对了，留下来的样本就服从 p</b>；speculative decoding 正是它的一个实例（<b>p = 目标模型分布（跑一次很贵）、q = 草稿模型分布（便宜）、筛的规则 = p/q</b>）⇒ <b>全部数学在 1950 年代就有了，新的只是「把它用在 LLM 上」</b> —— 又是那个模式：<b>新领域的难题在老领域里早有成熟工具</b>（PagedAttention 借操作系统的分页，这里借统计的拒绝采样）。"});
  QUIZ(0,55,{t:"speculative decoding 为什么要「随机地」拒绝，而不是 p<q 就一律拒绝？",o:["随机能提高接受率","一律拒绝会让草稿模型无法学习","随机能避免死循环","一律拒绝会把这个 token 的频率压成 0，而它本该出现 p 的比例；以 p/q 接受时 q×(p/q)=p，分布正好对上"],a:3,w:"⇒ 而被拒时从修正分布 norm(max(0, p−q)) 里重采，正好补上缺的那部分 ⇒ min(p,q) + [p−min(p,q)] = p。整个证明只有几行。"});
});
KP("56 · ⭐ 为什么「一次过一批」不比「一次过一个」贵",function(){

  note("⇒ 于是你可以直接从 q_{k+1} 里采样",640,362,"d");},"<b>这是一个很容易漏掉的细节，而它是白捡的便宜。</b><br><b>讲者的话</b>：<b>「<u>而我还没说的一件事是：我们为什么还要把最后那个 token 也放在这里？我们放了全部的草稿 token，但也放了被预测出来的最后那一个 —— 因为通过用所有这些草稿 token 做一次单独的前向传播，你就免费拿到了「它之后那个 token」的概率分布，然后你就可以直接从 q_{k+1} 里采样</u>。」</b><br><b>★★★ 这个细节的收益是：<u>多前进一个 token，而且完全免费</u></b>：<b>⇒ 草稿给了 4 个 token，<u>你把这 4 个全喂进目标模型</u>。</b><b>⇒ 那一次前向给出 <u>5 个位置的分布</u>：<u>4 个用来验证草稿，而第 5 个是「草稿之后该是什么」</u>。</b><b>⇒ <u>如果 4 个全被接受，你就直接从第 5 个分布里采一个 ⇒ 这一轮前进了 5 个 token</u>。</b><br><b>★★ 为什么是白拿的：<u>因为因果注意力的前向本来就会给每个位置都算出一个分布</u>。</b><b>⇒ 你不要它，<u>它也已经被算出来了</u>。</b><br><b>⇒ <u>所以「不用白不用」—— 这是一个零成本的加成</u>。</b><br><b>⚠ 这类「<u>顺手把已经算出来但没人要的东西用上</u>」的优化，在工程里是性价比最高的一类。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("106:07","Doing a single pass is as expensive as doing one pass at a time");
  note("⭐⭐⭐ 整个方法的物理前提，一句话",640,186,"y");

  note("⇒ 因为在推理时，你是「内存受限（memory bound）」的",640,292,"r");
  note("★★ 换句话说：「计算」不是那个限制因素",640,324,"y");
  note("⚠ 基本上是「内存」会成为你计算的瓶颈",640,362,"r");},"<b>这句话是整个方法能成立的物理前提，而它值得专门记住。</b><br><b>讲者的话</b>：<b>「<u>所以就给一点关于这个道理的总结。做一次单独的传递，和一次只做一次传递是一样贵的 —— 因为在推理时，你是内存受限的。换句话说，计算不是那个限制因素。基本上是内存会成为你计算的瓶颈</u>。」</b><br><b>★★★ 「<u>内存受限（memory bound）</u>」是什么意思，<u>这件事必须说清楚</u></b>：<b>⇒ 生成一个 token 时，GPU 要做两件事：<u>① 把全部模型权重从显存搬到计算单元 ② 做矩阵乘法</u>。</b><b>⇒ 对一个 7B 的模型，第①步要搬 <u>14 GB</u>（fp16）。</b><b>⇒ 而第②步只需要 <u>140 亿次乘加</u> —— <u>一张 A100 做这个只要不到 1 毫秒</u>。</b><br><b>★★ 而搬 14 GB 数据，<u>以 2 TB/s 的显存带宽算，要 7 毫秒</u>。</b><b>⇒ ⇒ <u>计算单元有 6 毫秒在干等</u>。</b><br><b>⇒ <u>这就叫「内存受限」：瓶颈是「搬数据」，不是「算数据」</u>。</b><br><b>★★★ 而关键在于：<u>搬那 14 GB 权重，不管你是算 1 个 token 还是 10 个 token，都只要搬一次</u>。</b><b>⇒ <u>所以一次过 10 个 token，和过 1 个几乎一样快</u>。</b><b>⇒ <u>这就是 speculative decoding 全部的物理依据</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("106:23","you want to compute all of these probability distributions at once");
  note("⭐ 把策略从那个前提推出来",640,188,"y");

  note("你想「一次性」把那些概率分布全算出来",950,286,"b");

  note("★★ 所以整个方案的形状，是被「内存受限」这个事实决定的",640,366,"y");},"<b>整个策略其实是从那个物理前提推出来的。</b><br><b>讲者的话</b>：<b>「<u>所以你想在一个更小的模型上做它。而接着在那个大模型上，你想一次性地把所有这些概率分布都算出来</u>。」</b><br><b>★★★ 把因果链写出来，这个方案就不再像一个巧思，而像一个必然</b>：<b>⇒ ① <u>推理是内存受限的</u>（搬权重比算数慢）。</b><b>⇒ ② ⇒ <u>一次前向的成本主要取决于「模型多大」，而不是「一次处理几个 token」</u>。</b><b>⇒ ③ ⇒ 所以<u>串行的那些步骤，应该放在小模型上做</u>（搬得少）。</b><b>⇒ ④ ⇒ 而<u>大模型只跑一次，一次处理一批</u>（搬一次，用到底）。</b><br><b>★★ 于是整个 speculative decoding 的形状<u>完全由第①条决定</u>。</b><br><b>⇒ <u>如果推理是「计算受限」的（比如 batch 很大时），那这个方法就没意义了</u> —— <u>因为那时一次处理 10 个 token 确实要花 10 倍的计算</u>。</b><br><b>⚠ 这是一个重要的适用条件：<u>speculative decoding 在「单请求、小 batch」时收益最大，在「大 batch 的服务」里收益会明显下降</u>。</b><b>⇒ <u>因为大 batch 本身就已经把权重搬运的成本摊薄了</u>。</b>");
  SUM(0,56,{h:"⭐ 为什么「一次过一批」不比「一次过一个」贵",k:"一个讲者自己补的细节：<b>我们为什么还要把「最后那个 token」也放进去？—— 因为用所有这些草稿 token 做「一次」前向，你就「免费」拿到了「它之后那个 token」的概率分布，然后可以直接从 q_{k+1} 里采样</b>。而整个方法的物理前提：<b>做「一次传递」和「一次只过一个」是一样贵的 —— 因为在推理时你是「内存受限（memory bound）」的；换句话说，计算不是那个限制因素，基本上是内存会成为瓶颈</b> ⇒ <b>所以你想在更小的模型上做（串行那部分），而在大模型上一次性把所有概率分布都算出来</b>。",m:"★★★ 「<b>内存受限</b>」必须说清楚：生成一个 token 时 GPU 要做两件事 —— <b>① 把全部模型权重从显存搬到计算单元 ② 做矩阵乘法</b>；对一个 7B 模型，<b>第①步要搬 14 GB（fp16），以 2 TB/s 带宽算要 7 毫秒；而第②步只要 140 亿次乘加，一张 A100 不到 1 毫秒</b> ⇒ <b>计算单元有 6 毫秒在干等 —— 瓶颈是「搬数据」不是「算数据」</b>。★★★ 关键在于：<b>搬那 14 GB 权重，不管你算 1 个 token 还是 10 个都只要搬一次 ⇒ 一次过 10 个和过 1 个几乎一样快 —— 这就是 speculative decoding 全部的物理依据</b>。",w:"⇒ 把因果链写出来，这个方案就不像巧思而像必然：<b>① 推理是内存受限的 ② ⇒ 一次前向的成本主要取决于「模型多大」而不是「一次处理几个 token」 ③ ⇒ 串行的步骤应该放在小模型上做（搬得少） ④ ⇒ 大模型只跑一次、一次处理一批（搬一次用到底）</b> ⇒ <b>整个 speculative decoding 的形状完全由第①条决定</b>。⚠ 重要的适用条件：<b>如果推理是「计算受限」的（比如 batch 很大时），这个方法就没意义 —— 那时一次处理 10 个确实要花 10 倍计算</b> ⇒ <b>它在「单请求、小 batch」时收益最大，在「大 batch 的服务」里收益明显下降，因为大 batch 本身已经把权重搬运的成本摊薄了</b>。",r:"⇒ 那个「最后一个 token」的细节是白捡的便宜：<b>草稿给 4 个，你全喂进去，那一次前向给出 5 个位置的分布 —— 4 个用来验证草稿，第 5 个是「草稿之后该是什么」⇒ 4 个全接受时直接从第 5 个分布采一个，这一轮前进 5 个 token</b>。为什么白拿：<b>因果注意力的前向本来就会给每个位置都算出一个分布，你不要它它也已经被算出来了</b> ⇒ <b>这类「顺手把已经算出来但没人要的东西用上」的优化，在工程里是性价比最高的一类</b>。"});
  QUIZ(0,56,{t:"「内存受限（memory bound）」在 LLM 推理里具体指什么？",o:["CPU 内存和显存之间传输慢","KV cache 占用太多内存","搬运权重比做矩阵乘法慢得多（7B 模型搬 14 GB 要 7 毫秒，算只要 1 毫秒）⇒ 计算单元在干等","显存装不下模型"],a:2,w:"⇒ 而权重只要搬一次就能算一批 ⇒ 一次过 10 个 token 和过 1 个几乎一样快 —— 这是 speculative decoding 全部的物理依据。所以它在大 batch 服务里收益会下降。"});
});

  note("⚠ 讲者顺带补了一句：顺便说，前一个技术叫 speculative decoding",640,362,"d");},"<b>最后一个技术，而它解决的是 speculative decoding 的一个实际麻烦。</b><br><b>讲者的话</b>：<b>「<u>然后我想讲最后一个技术，叫做 multi-token prediction。它是同样的 —— 顺便说，前面那个技术叫做 speculative decoding。而这一个基本上在做同样的事。所以它做的是稍微不同的一件事。但那个草稿模型是被嵌进同一个模型里的，而这非常有力</u>。」</b><br><b>★★★ 它要解决的麻烦很实际：<u>speculative decoding 要你有两个模型</u></b>：<b>⇒ 你得<u>额外训练或找到</u>一个小模型。</b><b>⇒ 那个小模型要<u>和大模型足够像</u>（否则接受率太低，加速就没了）。</b><b>⇒ 你要<u>同时把两个模型装进显存</u>。</b><b>⇒ 你要<u>维护两套部署</u>。</b><br><b>★★ 而「<u>草稿模型被嵌进同一个模型里</u>」一下子把这四个麻烦全消掉了</b>：<b>⇒ 不用额外训练、天然足够像、不额外占显存、只有一套部署。</b><br><b>⇒ <u>这就是讲者说「非常有力（very powerful）」的意思</u>。</b><br><b>⚠ 而这个想法在 DeepSeek-V3 里被用上了，<u>也是它训练效率高的原因之一</u>。</b>");

  SUM(0,57,{h:"⭐ multi-token prediction，与收尾",k:"<b>multi-token prediction</b>：<b>它基本上做同样的事，但那个「草稿模型是被嵌进同一个模型里的」—— 而这非常有力</b>。做法：<b>在「最后那个 decoder 的表示」之上「接多个头」；训练时它不做 next word prediction，它做 multi word prediction</b>；<b>测试时，草稿模型就是「你全部的那些头」，而主模型「就是第一个头」—— 你把全部草稿 token 喂回第一个头，再做接受拒绝</b>。⚠ 代价：<b>论文是用「贪心的方式」做的，不用那条公式 —— 因为架构和目标函数都变了，你就没有那个「能找回 next token 预测分布」的漂亮性质了，只有它的一个轻微变体</b>。两个要点：<b>① 目标函数的改变 ② 草稿模型和目标模型嵌在同一个里，不用把两者分开</b>。",m:"★★★ 它解决的麻烦很实际 —— <b>speculative decoding 要你有两个模型：额外训练或找到一个小模型、那个小模型要和大模型足够像（否则接受率太低）、同时把两个装进显存、维护两套部署</b>；而「嵌进同一个模型」一下子把四个麻烦全消掉了。⇒ 流程上它还比 speculative 更省：<b>speculative 的草稿模型要跑 k 次（串行），而 multi-token prediction 的 k 个头在「同一次」前向里全部输出 —— 零额外的串行步骤</b>。⚠ 代价是草稿质量：<b>第 k 个头看到的上下文和第 1 个头一样 ⇒ 越靠后的头预测越不准、接受率随 k 下降</b>。",w:"★★★ 那个让步是实质性的：<b>speculative decoding 是「精确」的（有数学证明，输出分布完全一致），而 multi-token prediction 不是</b>。为什么保证没了：<b>那个证明依赖「草稿分布 q 和目标分布 p 是两个独立的、定义良好的分布」，而这里两个「模型」共用绝大部分参数、分布不独立；而且第 k 个头预测的是「往后第 k 个」，这和目标模型逐个生成时在那个位置的分布不是一回事</b> ⇒ <b>那条接受拒绝公式在这里不成立，论文改用了贪心的匹配</b>。⚠ 很诚实的交代：<b>一个方法借用了另一个方法的形式，但失去了它的保证 —— 而讲者明确说了出来</b>。",r:"⇒ 两个技术并排：<b>speculative decoding 是两个模型 / 不改训练 / 有精确保证；multi-token prediction 是一个模型 / 要改训练 / 只有近似</b> ⇒ 适用场景完全不同：<b>只能用现成模型（调 API、下载权重）⇒ speculative decoding（不要求你改任何东西）；自己训模型 ⇒ multi-token prediction（训练时就把加速内建进去，而且「预测多个词」这个目标本身被发现能提升质量，因为它迫使表示编码更长程的规划）</b> ⇒ <b>前者是「用户侧的优化」，后者是「生产者侧的优化」</b>；⚠ 而 <b>DeepSeek-V3 两个都用了：训练时用 multi-token prediction 做辅助目标，推理时把那些头用作 speculative decoding 的草稿 —— 所以它们不互斥</b>。★★ 收尾回到 85:12 那张表，每格都填上了：<b>精确·避免冗余 ⇒ KV cache；精确·管理内存 ⇒ PagedAttention；精确·重新表述方程 ⇒ MLA；近似·架构变体 ⇒ GQA；近似·token 预测 ⇒ speculative decoding 和 multi-token prediction</b> ⇒ <b>「先给表、再填格」让你听的时候知道自己在哪一格，而讲完回看得到的不是一串孤立的名字，而是一个有结构的工具箱 —— 下次遇到推理性能问题你知道去哪一格找</b>。"});

    "<b>★★★ ② 解码那一块，是这一讲对你最有价值的部分，而且结局很反直觉。</b><br><b>问题是标准的搜索问题：给一个打分函数，从指数大的空间里挑一条路径。</b><br><span class='w'><b>贪心</b> —— 每步挑最大。快，但<b>局部最优 ≠ 全局最优</b>（0.8×0.1×0.1 输给 0.2×0.9×0.9），而且完全确定、没有多样性。</span><br><span class='w'><b>beam search</b> —— 保留 k 条路径，比的是<u>整条路径的累积概率</u>。更接近全局最优，但贵（k 倍前向、k 份 KV 缓存），<b>而且还要额外处理长度偏置</b>（不除以 Lᵅ 它就偏爱短序列）。</span><br><span class='k'><b>采样</b> —— 按概率抽，配 <b>top-k / top-p</b> 把长尾切掉，再用<b>温度 T</b> 调分布的尖平。</span><br><b>⭐ 而结局是：<u>实践中用的是采样，不是 beam search</u>。</b><b>讲者说得很明白 —— beam search 只在机器翻译那种「需要最可能的答案」的场合才用。</b><br><b>★★ 这个结局的教训对你很直接：<u>「更接近最优」不自动等于「更有用」</u>。</b><span class='w'>⚠ 在 LLM 这里，「最可能的序列」往往是乏味、重复、甚至退化的（likelihood trap）—— 所以人们宁可要一个概率略低但更好的输出。</span><br><b>⇒ 而你的课题里这一问有一个很清楚的版本：<u>你的代理模型的最优，和真实目标的最优，差多远？</u></b><b>如果差得远，那把搜索做得更接近代理模型的最优，只是在更精确地走错路。</b>");

    "<b>★★ ③ 效率那一块，带走那个「精确 / 近似」的分法 —— 而这一讲把每一格都填上了。</b><br><span class='w'><b>精确的</b>（结果一模一样，只是算得更聪明）：<b>KV 缓存</b>（别重算 —— 而它靠因果掩码才成立）、<b>PagedAttention</b>（按 16 个 token 一块分配，治内部/外部碎片）、<b>MLA</b>（低秩压缩 + 跨 K/V 和跨头共享，缓存压到 1/16）。</span><br><span class='w'><b>近似的</b>（结果可能不同，换速度）：<b>GQA</b>（砍 K/V 的头数）、<b>多 token 预测</b>（在最后一层接多个头，草稿模型内建在同一个模型里）。</span><br><b>⭐ 而投机解码那一条最漂亮：用一个小模型猜几个 token，再让大模型<u>一次</u>验证全部 —— 而且那个接受/拒绝规则有几行就能写完的证明，保证<u>输出分布和大模型完全一致</u>。</b><span class='w'>（所以严格说它属于「精确」那一类，而不是近似。）</span><br><b>⚠ 它成立的前提是一个硬件事实：推理时瓶颈是<u>显存带宽</u>而不是算力 —— 搬一次 14 GB 权重要 7 毫秒，而算只要 1 毫秒。</b><b>所以「一次验证 5 个」和「一次验证 1 个」几乎一样快。</b><br><b>⇒ 这条对你也直接可用：<u>先搞清楚你的瓶颈是算力还是访存，再决定优化什么</u>。优化错了的那一头，花再大力气也看不到变化。</b><br><b>⇒ 下一讲 L4 是 LLM Training：模型怎么训出来 —— 预训练、数据、规模定律。</b>");
