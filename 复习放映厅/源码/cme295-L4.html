<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>

#titleL{flex-direction:column}

.axline{stroke:#5C6B86;stroke-width:1.4}

.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}

.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}

.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});

    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}

    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}

      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});

  note("⚠ 这是继「每周四发幻灯」之后，第二份公开的课程材料",640,362,"d");},"<b>这条对自学的人是实打实有用的。</b><br><b>讲者的话</b>：<b>「<u>问题是不能用计算器。你不会需要计算器。不过说到速查表 —— 我不确定我们提过没有，我想我们提过 —— 这门课有一份速查表，我们不能带进考场，但你可以就用它来复习，它在网站上。课程网站上。所以 Jess 推荐去看一看</u>。」</b><br><b>★★ 把这门课公开的材料清单列一下，<u>它比大多数公开课都全</u></b>：<b>⇒ <u>录像</u>（YouTube）。</b><b>⇒ <u>人工字幕</u>（这正是这个片子能做到逐句走查的前提）。</b><b>⇒ <u>幻灯片</u>（L3 的 00:36 说每周四晚发布）。</b><b>⇒ <u>速查表</u>（这里）。</b><br><b>★★★ 而「<u>速查表</u>」这个东西对复习特别有用，<u>因为它是讲者自己做的「什么重要」的判断</u></b>：<b>⇒ 一门课讲了十几个小时，<u>而速查表上那几页就是他们认为必须记住的</u>。</b><br><b>⇒ <u>这个筛选你自己做要花很久，而他们已经做好了</u>。</b><br><b>⚠ 而「不能带进考场、只能用来复习」这个限制也说明了它的定位：<u>它是一张「检查你记住了没有」的表，不是一张「考场上查的」表</u>。</b>");
  SUM(0,2,{h:"四个关于考试形式的提问",k:"① <b>是闭卷（不能带笔记）吗？⇒ 是的</b>。② <b>多选题什么格式？⇒ 我们还没把考卷写完，但大概是「一个问题 + 三四个可能的答案、选对的那个」；而你也会有自由作答的，得用「你自己的话」回答</b>。③ <b>能带任何东西吗？⇒ 闭卷，什么都不能带，「就一支笔」；不能用计算器？⇒ 你不会需要计算器</b>。④ <b>这门课有一份 cheat sheet —— 不能带进考场，但可以用来复习，在课程网站上</b>。",m:"★★★ 「<b>用你自己的话</b>」是一个很高的要求，<b>而它正好对应这门课的教法</b>：这门课从头到尾在做的事，是<b>把每个概念讲到「你能用一句话说出它的意义」</b>（L3 那个学生说出「复用已经做过的计算」然后得到「Spot on」就是这个能力的样子）。而「用自己的话答」和「背诵定义」的差别正是<b>理解</b>和<b>记忆</b>的差别：<b>背诵是「MoE 是 mixture of experts，用门控选择专家」；理解是「它让参数量和计算量脱钩」—— 后者才是这类题要的</b>。",w:"★★★ 「<b>你不会需要</b>」比「不许用」有信息量得多：<b>前者只是规则，后者是在透露考什么 —— 不会有需要算的题</b> ⇒ 这门课考的是<b>概念</b>（MoE 是什么、为什么放 FFN）、<b>机制</b>（温度怎么影响分布、KV cache 为什么只存 K 和 V）、<b>判断</b>（什么时候用 beam search），<b>而不考「代入数字算一遍注意力」</b>。这和它的讲法完全一致：<b>它讲了很多公式，但每条都是用来「说明一件事」而不是「算题」的 ⇒ 复习时该问「这条公式在说明什么」而不是「我能不能算对」</b>。",r:"⚠ 这一条和 ARTI2001 正好相反（<b>那边是 2 小时开卷纸笔、20 选择 + 4 大题</b>），而这决定了两种复习方式：<b>开卷要准备「一份能快速查到东西的速查表」（重在组织和索引）；闭卷要准备「脑子里的那套东西」（重在理解和复述）</b> ⇒ <b>闭卷对「真懂」的要求更高 —— 你没法靠翻书蒙过去</b>。⇒ 这门课公开的材料比大多数公开课都全：<b>录像、人工字幕（这正是这个片子能逐句走查的前提）、幻灯片（每周四晚发布）、速查表</b>；而速查表特别有用，<b>因为它是讲者自己做的「什么重要」的判断 —— 十几个小时的课，那几页就是他们认为必须记住的，这个筛选你自己做要很久</b>。"});
  QUIZ(0,2,{t:"「你不会需要计算器」这个回答透露了什么？",o:["考的是概念、机制和判断，不会有需要算数的题 —— 所以复习该问「这条公式在说明什么」而不是「我能不能算对」","计算题放在作业里","考试时间很紧","可以用手机代替"],a:0,w:"⇒ 而「用你自己的话回答」对应的是「理解」而不是「记忆」：背诵是「MoE 用门控选专家」，理解是「它让参数量和计算量脱钩」。"});

  note("⇒ 如果你去他们网站，他们有一个巨大的归档 / 里面还有一堆别的网站",640,364,"d");},"<b>这是第一个该知道的数据集名字，而它的规模值得感受一下。</b><br><b>讲者的话</b>：<b>「<u>所以在被使用的数据集方面，你会在论文上大量看到 Common Crawl 这个词。它基本上是一个由你能在互联网上找到的任何东西组成的数据集。所以我想他们每个月有大约三十亿个页面。所以如果你去他们的网站，他们有一个巨大的归档。所以里面还有一堆别的网站。所以比如维基百科的文章、任何社交媒体，比如 Reddit</u>。」</b><br><b>★★★ 把 Common Crawl 的性质说清楚，<u>因为它是整个领域的数据基础设施</u></b>：<b>⇒ 它是一个<u>非营利组织</u>，从 2008 年起持续爬取整个网络。</b><b>⇒ 数据<u>完全公开、免费</u>。</b><b>⇒ 累计规模在 <u>几 PB</u> 的量级。</b><br><b>★★ 而「<u>每月 30 亿页</u>」这个数字说明它是<u>持续更新</u>的，不是一次性的快照。</b><b>⇒ <u>所以模型的「知识截止日期」，很大程度上就是它用的那一批 Common Crawl 快照的日期</u>。</b><br><b>⚠ 但要知道一件重要的事：<u>几乎没有人直接用原始的 Common Crawl</u>。</b><b>⇒ 原始数据里<u>充满了垃圾</u>：导航栏、广告、乱码、重复页面、机器生成的垃圾内容。</b><b>⇒ <u>所以真正用的是「清洗过的版本」—— 而那个清洗过程，是预训练里最有技术含量的部分之一</u>。</b>");
  SUM(0,6,{h:"预训练的数据：基本上是整个互联网",k:"「数据」在这里的意思是<b>你能找到的一切 —— 英文的文本、别的语言的文本、甚至代码（不同语言的代码），基本上整个互联网</b>。一句话概括：<b>就是训你的模型去试着「预测任何被写下来的东西」，而目标是预测下一个 token</b>。回忆 L3：<b>我们的 LLM 是 text-to-text 模型、而且 90% 以上是 decoder-only ⇒ 它拿一段输入文本，「迭代地」总是预测下一个 token</b>。第一个数据集名字：<b>Common Crawl —— 你会在论文上大量看到它，它基本上由「你能在互联网上找到的任何东西」组成，我想他们每个月有大约 30 亿个页面；里面还有维基百科文章、社交媒体比如 Reddit</b>。",m:"★★★ 「<b>任何被写下来的东西</b>」比「学会语言」准确得多：<b>模型的目标不是「学会写作」或「学会编程」，而是「预测文字」—— 而写作能力、编程能力、推理能力全都是这个目标的副产品</b>。为什么会有这些副产品：<b>要准确预测侦探小说最后一句「凶手是…」，你必须理解整个案情；要预测代码的下一行，你必须理解程序在干什么；要预测数学题答案后面那个数字，你必须会算</b> ⇒ <b>「把预测做到极致」在逻辑上要求你具备所有这些能力 —— 这就是「压缩即智能」那个论点的朴素版本，也是整个预训练范式的信念基础</b>。",w:"★★ 为什么那两条定性在这里要被重提：<b>因为它们决定了预训练的数据格式</b> —— <b>text-to-text ⇒ 训练数据就是纯文本、不需要任何额外结构；decoder-only + 自回归 ⇒ 训练目标就是「预测下一个 token」，而标签就是文本自己的下一个 token</b> ⇒ 合起来看数据准备有多简单：<b>拿一段文本 → tokenize → 就是一条训练样本，不需要标注、不需要配对、不需要格式化</b> ⇒ <b>这就是为什么预训练能用「整个互联网」：对数据的要求低到只剩「它是文字」</b>（对照 L2 的 T5：<b>span corruption 要挖空、要 sentinel token、要决定挖多长 —— 那正是它输给 next-word prediction 的原因</b>）。",r:"⇒ 「整个互联网」听起来夸张<b>但在数量级上是准确的</b>（L3 算过：<b>前沿模型用几十万亿 token，而整个可爬取互联网大约也就这个量级</b>）⇒ 由此带来一个要紧的问题：<b>数据正在用完 —— 有研究估计高质量公开文本会在 2026–2032 年间耗尽，于是业界转向合成数据、多模态、以及重复训练</b>。⇒ Common Crawl 的性质：<b>一个非营利组织，2008 年起持续爬取整个网络，数据完全公开免费，累计几 PB；而「每月 30 亿页」说明它是持续更新的，所以模型的「知识截止日期」很大程度上就是它用的那批快照的日期</b>。⚠ 但要知道：<b>几乎没有人直接用原始 Common Crawl —— 原始数据里充满导航栏、广告、乱码、重复页面、机器生成的垃圾，所以真正用的是「清洗过的版本」，而那个清洗过程是预训练里最有技术含量的部分之一</b>。⇒ 另：「不同语言的代码」被专门提出来，<b>因为不同编程语言有不同范式（函数式、面向对象、声明式），而见过多种范式的模型泛化更好</b>。"});
  QUIZ(0,6,{t:"为什么预训练能用上「整个互联网」，而 T5 的 span corruption 不能？",o:["因为 Common Crawl 不支持 T5 的格式","因为 T5 是 encoder-decoder","因为 T5 的模型太小","next-word prediction 对数据的要求低到只剩「它是文字」（拿一段文本 tokenize 就是一条样本），而 span corruption 要挖空、要 sentinel、要决定挖多长"],a:3,w:"⇒ 而「预测任何被写下来的东西」这个目标的副产品是写作、编程、推理能力 —— 因为准确预测「凶手是…」要求你理解整个案情。"});

  SUM(0,9,{h:"⭐ 第二个记号：FLOPS",k:"<b>FLOPS（也叫 FLOPS 但「是不同的」）= floating point operations per second —— 一个「算力速度」的度量，也就是「你的硬件能多快地执行这些运算」</b>。你会在哪碰到：<b>如果你玩 GPU，你会看到 GPU 的描述里「总是标明 FLOPS」</b>。⚠ 讲者亲自提醒的坑：<b>这里的 FLOPS 通常是「全大写」的，尽管你可能看到一些论文拿这个当那个用（令人困惑）—— 所以建议「根据它所在的那句话去理解这个记号」，因为有时人们确实会把两个换着用</b>。",m:"★★★ 把两个钉死（这是真实的混淆源）：<b>FLOPs（小写 s）= operations 的复数 ⇒ 一个总数 ⇒ 说「这个训练有多大」；FLOPS（大写 S）= per Second ⇒ 一个速率 ⇒ 说「这张卡有多快」</b>。⇒ 而最可靠的判据不是大小写而是<b>量级</b>：<b>训练总量在 10²³–10²⁶，单卡速度在 10¹⁴–10¹⁵ —— 差了十个数量级，看数字大小基本就能判断，这比看大小写可靠得多</b>。⚠ 另一个提醒：<b>FLOPS 还要看精度 —— 同一张卡 fp32/fp16/int8 的 FLOPS 差好几倍，所以报 FLOPS 不说精度这个数就没意义</b>。",w:"⇒ 几个真实数字（fp16 峰值）：<b>A100（2020）约 312 TFLOPS、H100（2022）约 989 TFLOPS（三倍多）、消费级 RTX 4090 约 165 TFLOPS</b>。★★★ 放在一起有个有意思的观察：<b>一张消费级显卡的算力已经是 A100 的一半了 ⇒ 「消费级显卡跑不了 LLM」的瓶颈从来不是算力，是显存（4090 只有 24 GB，A100 有 80 GB）</b> —— 正好呼应 L3 那个「推理是内存受限的」。⚠ 而「总是标明」也有坑：<b>厂商标的是峰值，而实际利用率通常只有 30–50% ⇒ 拿峰值去估训练时间会乐观两三倍</b>。",r:"★★ 过渡那三件事（<b>算力、数据、模型规模</b>）<b>正是 scaling law 的三个变量</b>（而 L3 的 05:24 说 LLM 的「大」也正是这三条）。而这个过渡逻辑很完整：<b>我们知道这三样都很大（事实），不知道它们之间有什么关系（问题），而「有没有关系」是可以用实验回答的</b> ⇒ <b>接下来的内容定位明确：它是一个实验结果，不是一个理论推导</b>。⚠ 这个定位很重要：<b>scaling law 是经验规律不是定理 —— 它在观测到的范围内成立，而外推到更大规模时并没有保证，而整个行业在拿几十亿美元赌它继续成立</b>。"});
  QUIZ(0,9,{t:"区分 FLOPs 和 FLOPS，比看大小写更可靠的判据是什么？",o:["看它出现在论文还是新闻里","看前面有没有 T 或 P","看量级：训练总量在 10²³–10²⁶，单卡速度在 10¹⁴–10¹⁵ —— 差了十个数量级","看它有没有带单位"],a:2,w:"⚠ 而 FLOPS 还要看精度（fp32/fp16/int8 差好几倍），厂商标的又是峰值（实际利用率只有 30–50%）—— 拿峰值估训练时间会乐观两三倍。"});
});

  SUM(0,10,{h:"⭐⭐ Scaling Laws",k:"那篇论文：<b>《Scaling Laws for Neural Language Models》，2020 年发表，做了一堆实验、办法是改变这些参数</b>。发现：<b>① 你有的算力越多，模型在「预测下一个 token」上学得越好 ② 训练集越大越好 ③ 模型越大越好</b> ⇒ <b>所以 2019 到 2024 年之间，你看到的模型越来越大 —— 人们就是在造越来越大的东西，因为按这些实验性能就是会一直变好</b>。第二个发现：<b>更大的模型倾向于更「sample efficient」—— 对同样数量的被处理 token，大模型的性能好于小模型</b>。",m:"★★★ 盯住那个因变量：「<b>在预测下一个 token 上学得越好</b>」—— <b>它量的是损失，不是「智能」、不是任何基准分数</b>。为什么这个指标干净：<b>它是连续的、可比的、不受任务定义影响 —— 基准分数会饱和（做到 99% 就没法再涨），而损失可以一直往下降、在任何规模上都能测</b> ⇒ <b>scaling law 能画出那么漂亮的直线，很大程度上是因为选对了因变量</b>。⚠ 但代价是：<b>「损失更低」和「更有用」之间的关系并不是这篇论文证明的 —— 那是一个额外的、靠经验支撑的信念，而整个行业建立在它上面</b>。",w:"★★★ 「<b>因为按这些实验性能就是会一直变好</b>」解释了一个时代：<b>在大多数机器学习的历史里「更大」是会碰到收益递减的（把模型从 1000 万加到 1 亿往往只是过拟合得更厉害），而 scaling law 说的是在这个规模区间里没有看到那个拐点</b> ⇒ <b>「变大」从一个要小心权衡的决定，变成了「只要你付得起就该做」的决定 —— 这是极罕见的状态，直接催生了那场规模竞赛</b>。⚠ 而讲者用「有一段时间，2019 到 2024 年之间」这个过去式，<b>暗示了那个时代已经过去</b>。",r:"★★★ 「样本高效」反直觉在于它说大模型<b>更省数据</b>：<b>直觉上你会以为更大的模型需要更多数据才能训好（不然过拟合），而实验说相反 —— 同样数据量下大模型学得更多</b>。具体表现：<b>画一张「损失 vs 已处理 token 数」的图，大模型那条曲线从一开始就在小模型下面，而不是「先在上面、训久了才下去」</b> ⇒ <b>如果你的算力只够跑固定的 token 数，你应该选一个尽量大的模型</b>。⚠ 但这个结论下一段会被 Chinchilla 修正：<b>因为「固定 token 数」不是真实的约束，真实的约束是「固定算力」—— 而大模型每个 token 更贵</b>。"});

  note("⚠ 因为这里你必须决定：你的模型要多大",640,364,"r");},"<b>这个约束把问题从「越大越好」变成了一个真正有意思的问题。</b><br><b>讲者的话</b>：<b>「<u>但接着你可以想：我们没有无限的算力。算力是昂贵的。它有很多缺点。所以你有一个固定的算力，而人们也试着回答这个问题：给定一定量的算力，你怎么能以一种更优的方式去定你的训练集规模和你的模型规模？因为这里你需要决定你的模型有多大</u>。」</b><br><b>★★★ 请看这个问题的形状变了</b>：<b>⇒ <u>原来的问题</u>：「更大会不会更好？」⇒ 答案是会。<u>而这个答案没有指导意义，因为你没有无限的钱</u>。</b><b>⇒ <u>新的问题</u>：「<u>固定预算下，怎么分配</u>？」⇒ <u>这才是一个可以行动的问题</u>。</b><br><b>★★ 而「分配」这个词说得很准：<u>因为算力 ≈ 参数量 × token 数</u>（14:42 那镜）。</b><b>⇒ 固定算力 ⇒ <u>这个乘积固定</u>。</b><b>⇒ <u>于是参数和数据是此消彼长的 —— 你把模型做大一倍，就只能用一半的数据</u>。</b><br><b>⇒ <u>所以这是一个真正的权衡，而不是两边都要</u>。</b><br><b>⚠ 而这正是 Chinchilla 那篇论文要回答的问题：<u>这个乘积该怎么分</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⇒ 而他们看到：这里「总是有一个甜点（sweet spot）」",640,330,"y");

  SUM(0,11,{h:"⭐⭐⭐ Chinchilla：固定算力下的最优配比",k:"那个约束：<b>我们没有无限的算力，算力是昂贵的 ⇒ 给定一定量的算力，你怎么定「训练集规模」和「模型规模」才更优？</b>实验：<b>固定一个算力单位（那就是这些曲线的颜色），然后用不同的训练集规模去训不同大小的模型 ⇒ 总是有一个「甜点」，而它遵循某种关系</b>。那条规律（有时被叫做 <b>Chinchilla law</b>）：<b>如果你的训练集规模大约是「模型规模的 20 倍」，那你就是在以「最优的方式」花你的算力</b>。而用它回头判 GPT-3：<b>约 1750 亿参数但只在 3000 亿 token 上训 ⇒ 按这个来看它是「严重训练不足」的</b>。",m:"★★★ 问题的形状变了：<b>原来是「更大会不会更好」（答案是会，但没有指导意义，因为你没有无限的钱）；新的是「固定预算下怎么分配」—— 这才是可以行动的</b>。而「分配」这个词很准：<b>因为算力 ≈ 参数量 × token 数，固定算力 ⇒ 这个乘积固定 ⇒ 参数和数据此消彼长：你把模型做大一倍，就只能用一半的数据</b> ⇒ <b>这是一个真正的权衡，而不是两边都要</b>。⇒ 那张图的读法：<b>每条曲线是一个固定预算，横轴是模型大小（预算固定 ⇒ 模型越大能用的 token 越少），纵轴是训完的损失；每条都是 U 形 —— 模型太小容量不够，模型太大则训练不足，中间那个最低点就是甜点，而把各条曲线的最低点连起来就是那条规律</b>。",w:"★★★ <b>D ≈ 20N</b> 的用法很直接：<b>训 70 亿参数就该用 1400 亿 token；有 15 万亿 token 就该训 7500 亿参数的模型</b>。而「最优」被加了引号，理由很实在：<b>它是从几百个实验点拟合出来的不是推导出来的，而且只在「训练算力最小化」这个目标下最优 —— 如果你还关心推理成本（而你应该关心），最优点会往「更小的模型 + 更多的数据」偏</b> ⇒ <b>这就是为什么 Llama 3 8B 用了 15 万亿 token（按 Chinchilla 它只该用 1600 亿）—— 它被「过度训练」了 100 倍，而这是故意的：它要被部署给几亿人用，推理成本远比训练成本重要</b>。",r:"⇒ GPT-3 那个差距：<b>按 D=20N 它该用 3.5 万亿，实际用了 3000 亿 —— 差了 11.7 倍</b>。而这个判决后果巨大：<b>Chinchilla 论文自己做了对照 —— 训一个 700 亿参数的模型用 1.4 万亿 token，算力和 2800 亿参数的 Gopher 一样，而它在几乎所有基准上都赢了 Gopher、也赢了 GPT-3</b> ⇒ <b>一个小四倍的模型赢了，只因为数据配对了</b>。⚠ 而 L2 结尾 RoBERTa 那个「<b>vastly undertrained</b>」是同一个发现在三年前的小规模版本 —— <b>这个错误被犯了两次，而第二次的代价是几亿美元</b>。⇒ 另：这个实验要跑几百个模型，<b>这正是为什么这种研究只有大公司做得了</b>。"});

  SUM(0,12,{h:"三个提问：架构、迁移、成本",k:"① <b>他们有没有也调神经网络架构？⇒ 到现在为止大家都同意 LLM 就是「基于 transformer 的 decoder-only 模型」，每个人用的都是同一个模型</b>；追问<b>架构的改变不起大作用？⇒ 那其实就是他们在论文里说的 —— 改变最大的那个东西，是你训练用的 token 量和你模型的规模</b>。② <b>不同版本的模型之间有没有迁移学习？⇒ 对很多这些模型来说它们是「闭源的」，不会确切透露这些事；这是个有意思的问题，但我没法用一般性的方式回答</b>。③ 但<b>论文总是会说训练这个要花多少钱 —— 而它总是在「百万」这个量级上；它不管怎样永远是昂贵的一步</b>。",m:"★★★ 「架构不起大作用」在 2020 年很反直觉，<b>因为在那之前架构创新是这个领域的主旋律</b>（2012–2019 的深度学习史基本上是一部架构史：<b>AlexNet、VGG、ResNet、Inception、LSTM、GRU、Attention、Transformer —— 每次大进步都来自一个新结构</b>）⇒ 而 scaling law 说<b>在 transformer 之内再折腾结构的收益远小于「加数据、加参数」</b>，<b>这在很大程度上把研究重心从「设计更好的架构」转向了「怎么训得更大、数据怎么选得更好」</b>。⚠ 但有个限定：<b>它说的是「在同一个架构家族内」—— transformer 本身的出现恰恰是一次架构创新带来的巨大收益 ⇒ 这不是「架构不重要」，而是「找到对的架构之后架构就不重要了」</b>。",w:"⇒ 「每个人用的都是同一个模型」在粗粒度上是对的：<b>Llama、Qwen、Mistral、DeepSeek、GPT 的 block 结构几乎一样，差别在层数、宽度、头数、用不用 MoE、RoPE 的 base、归一化放哪 —— 而这些是「参数」不是「架构」</b>。而这件事是 scaling law 研究的<b>前提</b>：<b>只有架构固定，「参数量」和「数据量」才是有意义的自变量 —— 否则你没法说「同样 10²¹ FLOPs 下哪种配置更好」</b> ⇒ <b>「大家都用同一个架构」反而是 scaling law 能成立的条件之一</b>。",r:"⚠ 第二个问题答不上来的原因和前面几次都不同：<b>L3 的 26:15 是讲者自己不记得，而这里是「没有人知道，因为公司不说」</b> ⇒ 这是领域的真实状况：<b>GPT-4 的参数量、架构、训练数据从未正式公布，我们知道的全是泄露和推测 ⇒ 「这个领域的知识」本身是分层的：公开的、半公开的（开放权重但不公开数据）、完全不公开的</b>。而学生那个问题很有价值：<b>GPT-5 是不是从 GPT-4 继续训的？这在技术上完全可行（叫 continued pretraining）、几乎肯定有人在做，但没人公开承认</b>。★★ 而「论文总是会说要花多少钱」在别的领域不常见，<b>因为成本在这里是科学上有意义的量：一个结果「用多少算力达到」和「达到什么水平」同样重要 —— 1 亿美元打赢 100 万美元不是有意思的结果，反过来才是</b> ⇒ <b>报成本本质上是在报「这个结果的性价比」，而这是 scaling law 时代特有的科学规范</b>；<b>DeepSeek-V3 引起那么大震动，正是因为它报了约 557 万美元这个极低的训练成本 —— 不报成本它就只是「又一个很好的模型」</b>。"});
  QUIZ(0,12,{t:"「架构的改变不起大作用」这个结论要配什么限定？",o:["只在 2020 年成立","只对小模型成立","只对英语成立","它说的是「在同一个架构家族内」—— transformer 本身的出现恰恰是架构创新的巨大收益；所以是「找到对的架构之后架构就不重要了」"],a:3,w:"⇒ 而「大家都用同一个架构」反而是 scaling law 能成立的条件：只有架构固定，参数量和数据量才是有意义的自变量。"});

  SUM(0,13,{h:"⚠ 预训练的四个挑战",k:"① <b>成本</b>：<b>我说「几百万美元」时那是最低的 —— 甚至可能几千万、有时几亿；而且它要花很多时间，人们也一直在把「生态成本」包括进来</b>。② <b>知识截止</b>：<b>预训练用的数据只到你预训练的那个时间点为止 ⇒ 获得的知识只能到你切数据集的那个日期，这个日期叫 knowledge cutoff date —— 你的基座模型没有办法「自己」知道这个日期之后发生的事</b>。③ <b>知识编辑很难</b>：<b>很多论文试过编辑/注入知识，但它总是棘手的 —— 没有干净的办法改权重而不惩罚到某些部分；人们想「注入知识但不在别的领域退步」，而这是一个非常难的问题</b>。④ <b>抄袭的风险</b>：<b>如果它就是生成了某个它在训练时见过的东西呢？—— 总是有风险</b>。查法：<b>OpenAI / Google 的模型卡上总有一行 knowledge cutoff date</b>（例：<b>GPT-5 几周前发布，截止日期是 9 月 30 日</b>）。",m:"★★★ 「没有办法『自己』知道」里的「自己」是重要限定：<b>它不是说模型永远不可能知道，而是说「模型的权重里没有这个信息」</b> ⇒ 这正好指向解决办法：<b>通过上下文告诉它</b>（L3 那个「我们是 10 月 10 日」就是在补一个权重里没有的事实，而 <b>RAG 是这个思路的完整版</b>）⇒ <b>「知识截止」这个限制是靠「把知识从权重挪到上下文」绕过的</b> —— 也呼应了前面那句：<b>预训练学的是「结构」不是「事实」，而结构不会过期、事实会，所以事实本来就该放在上下文里</b>。",w:"★★★ 知识编辑难的根子在于<b>权重是「分布式」的</b>：<b>「法国的首都是巴黎」不存在某一个具体参数里，它分散在成千上万个参数的组合里，而那些参数同时也在编码别的知识</b> ⇒ 「改一条知识」就像<b>在一张所有颜色都混在一起的画上只改一处的颜色 —— 你动的每一笔都会影响别处</b>（这个副作用叫<b>灾难性遗忘</b>或 <b>ripple effect</b>）⇒ <b>修正一个模型的错误知识，往往不如「把正确信息放进上下文」来得可靠 —— 又一次指向 RAG</b>。",r:"★★★ 抄袭风险的根子<b>恰恰在训练目标本身</b>：<b>模型被训练去「预测训练数据里的下一个 token」⇒ 「逐字复现训练数据」在这个目标下是「完美的表现」⇒ 抄袭不是 bug，它是目标函数的字面最优解</b>。而模型通常不逐字复现是因为它<b>「记不住」而不是「不想」</b>（<b>70B 模型压缩 15 万亿 token，压缩比几千倍，绝大多数内容必然被抽象掉</b>），<b>但那些在训练数据里出现过很多次的内容（名言、代码片段、流行歌词）确实会被逐字记住</b> ⇒ <b>这就是为什么今天所有大模型都有「去重」这一步，而这也是当前几起大规模版权诉讼的技术焦点</b>。⇒ 成本区间：<b>下限几百万（7B 级）、中间几千万（70B 级）、上限几亿（前沿）</b>；「要花很多时间」也不能忽略 —— <b>几个月的训练周期意味着你一年只能试两三次，所以每次配置必须尽量对，而这正是 scaling law 这类研究的价值：它让你能在小规模上预测大规模</b>。⚠ 而「从截止日期猜预训练时间」有一点不准：<b>截止日期是数据切片的日期，预训练在那之后才开始且要跑几个月，再加上后训练又几个月 ⇒ 截止日期和发布日期之间通常隔半年到一年，而这个间隔告诉你模型的认知落后现实多久</b>。"});
  QUIZ(0,13,{t:"为什么「编辑模型里的一条知识」是一个非常难的问题？",o:["因为权重是只读的","因为不知道知识存在哪一层","权重是分布式的 —— 一条知识分散在成千上万个参数里，而那些参数同时在编码别的知识 ⇒ 动一笔就影响别处","因为模型太大改不动"],a:2,w:"⇒ 所以修正错误知识往往不如「把正确信息放进上下文」可靠 —— 又一次指向 RAG。而抄袭风险的根子是：逐字复现训练数据，在那个目标函数下恰恰是「完美表现」。"});

  note("⇒ 它们基本上是「每一层上的那些值」—— 而算损失需要用到它们",640,364,"d");},"<b>第一步，而讲者立刻把注意力引向了「要存什么」。</b><br><b>讲者的话</b>：<b>「<u>所以你有一步叫做 forward pass，在那里你有一堆数据，你试着把它穿过那个网络。而在我们做这件事的同时，我只想点出一些重要的、我们需要以某种方式存在内存里的东西。所以当你做这个前向传播时，你有一个叫做 activations 的东西，它们基本上是每一层上的那些值，而为了算损失你需要它们</u>。」</b><br><b>★★★ 「<u>激活（activations）</u>」这个词 L2 的 48:12 定义过：<u>层与层之间流动的那些向量</u>。</b><b>⇒ 而这里说的是一件新的事：<u>它们必须被存下来</u>。</b><br><b>★★ 为什么必须存：<u>因为反向传播要用</u></b>：<b>⇒ 求某一层权重的梯度时，<u>你需要那一层的输入值</u>（链式法则里那一项）。</b><b>⇒ 而那个输入值就是<u>前一层的激活</u>。</b><b>⇒ <u>所以前向时算出来的每一层激活，都要留到反向时用</u>。</b><br><b>⇒ <u>也就是说：前向传播的「副产品」要在内存里一直待到反向传播结束</u>。</b><br><b>⚠ 讲者这里说「<u>算损失需要它们</u>」其实不够准确：<u>算损失只需要最后一层的输出</u>。</b><b>⇒ <u>真正需要全部激活的是「算梯度」</u>。</b><b>⇒ 不过这不影响结论 —— <u>它们确实必须存着</u>。</b>");

  note("★★ 所以这三个参数全都会「进到这笔账里来」",640,368,"r");},"<b>三个因子，而第三个是这门课反复出现的那个。</b><br><b>讲者的话</b>：<b>「<u>所以损失告诉你，你和你想训练它去对上的那个标签相比有多偏。而所以你在这里会用掉的内存量，取决于很多东西。它取决于模型规模（这影响激活的数量）。它取决于你训练用的那批数据有多大。而它取决于你的上下文长度有多长 —— 因为如果你记得，这里我们因为这个自注意力运算而有 O(N 平方) 的复杂度，其中 N 是序列长度。所以你有所有这些参数会进到这笔账里来</u>。」</b><br><b>★★★ 把这三个因子记住，<u>因为它们正是你训练时能调的三个旋钮</u></b>：<b>⇒ <u>模型规模</u>：定了就定了，不能动。</b><b>⇒ <u>batch 大小</u>：<u>可以调小</u> —— 这是显存不够时的第一反应。</b><b>⇒ <u>上下文长度</u>：<u>可以调短</u> —— 而且因为是平方关系，<u>减一半就省四倍</u>。</b><br><b>★★ 而「<u>O(n²)</u>」在这里出现得很关键：<u>它说明激活显存对上下文长度特别敏感</u>。</b><b>⇒ 上下文从 2K 到 8K ⇒ <u>那一部分显存涨 16 倍</u>。</b><br><b>⇒ <u>这正是为什么长上下文训练这么难，也正是 FlashAttention 要解决的问题</u>（38:25 之后）。</b><br><b>⚠ 顺带：<u>激活显存还和层数成正比 —— 每一层都要存一份</u>。</b>");

  SUM(0,15,{h:"⭐ 前向传播，与它要存的「激活」",k:"起点：<b>你有你的 LLM（现在用一个方框表示），你初始化它 —— 规模在几十亿到几千亿参数之间</b>；而训练要做的是<b>调那些权重，好让模型学会怎么生成下一个 token</b>。<b>第一步 forward pass</b>：<b>你有一堆数据，试着把它穿过网络</b>；而要存在内存里的是 <b>activations（激活）—— 每一层上的那些值</b>。占多少显存取决于三件事：<b>① 模型规模（影响激活的数量）② batch 有多大 ③ 上下文长度有多长（因为自注意力是 O(N²)）</b>。做完前向算出损失 ⇒ <b>你知道了和标签相比有多偏，下一步是调权重让损失最小化 ⇒ 有另一个 pass 叫 backwards pass</b>。",m:"★★★ 「<b>调那些权重，让模型学会生成下一个 token</b>」—— <b>整个训练就是这一句，没有别的目标</b>（没有「让它变聪明」「让它有用」，只有「更准地预测下一个 token」）。⇒ 而「用一个方框表示它」这个抽象做得好：<b>接下来要讲的（前向、反向、更新、显存）和模型内部长什么样完全无关 —— 这套流程对一个三层 MLP 也一样，变的只是规模，而规模正是让这件事变难的全部原因</b> ⇒ <b>它让你看清「难的不是训练这件事，而是在这个规模上训练」</b>。",w:"★★★ 「激活」L2 的 48:12 定义过（<b>层与层之间流动的那些向量</b>），而这里说的是新的一件事：<b>它们必须被存下来</b>。为什么：<b>因为反向传播要用 —— 求某一层权重的梯度时你需要那一层的输入值（链式法则里那一项），而那就是前一层的激活</b> ⇒ <b>前向传播的「副产品」要在内存里一直待到反向传播结束</b>。⚠ 讲者说「算损失需要它们」其实不够准确（<b>算损失只需要最后一层的输出，真正需要全部激活的是「算梯度」</b>），不过结论不变。",r:"★★ 那三个因子正是你训练时能调的三个旋钮：<b>模型规模定了就不能动；batch 大小可以调小（显存不够时的第一反应）；上下文长度可以调短，而且因为是平方关系，减一半就省四倍</b>。而 <b>O(n²)</b> 出现得很关键：<b>激活显存对上下文长度特别敏感 —— 从 2K 到 8K 那部分显存涨 16 倍 ⇒ 这正是长上下文训练这么难、也正是 FlashAttention 要解决的问题</b>（顺带：<b>激活显存还和层数成正比，每层都要存一份</b>）。⇒ 而那个逻辑链里有个缺口：<b>损失是一个标量、一个数，但你要改的是几千亿个权重 —— 一个数没法告诉它们各自往哪边改</b> ⇒ 你需要的是<b>对每个权重的偏导数（这个权重增大一点，损失变大还是变小、变多少），而把它们拼起来就是「梯度」—— 一个和权重同样大的向量</b>；⚠ <b>「和权重同样大」意味着梯度本身也要占和模型一样多的显存</b>。"});

  note("⚠ 而梯度「也需要被存在内存里的某个地方」—— 这是第二样要存的东西",640,364,"r");},"<b>第二步，而它又多出一样要存的东西。</b><br><b>讲者的话</b>：<b>「<u>所以这个 pass 做的事，是量化出那个让损失会被最小化的方向。它叫做梯度。你取损失相对于每一个参数的梯度。嗯，梯度它们也需要被存在内存里的某个地方</u>。」</b><br><b>★★★ 「<u>相对于每一个参数</u>」这几个字决定了梯度的大小</b>：<b>⇒ 模型有 <u>N 个参数</u> ⇒ 梯度就有 <u>N 个数</u>。</b><b>⇒ <u>所以梯度占的显存，和模型权重本身一样多</u>。</b><br><b>★★ 把账算一下（一个 70 亿参数的模型，fp16）</b>：<b>⇒ <u>权重</u>：70 亿 × 2 字节 = <u>14 GB</u>。</b><b>⇒ <u>梯度</u>：再 <u>14 GB</u>。</b><b>⇒ 已经 28 GB 了，<u>而激活和优化器状态还没算</u>。</b><br><b>⇒ <u>一张 80 GB 的 H100，已经被占掉三分之一了 —— 而这还只是一个 7B 的模型</u>。</b><br><b>⚠ 这就是为什么「<u>训练比推理贵得多</u>」：<u>推理只需要权重（14 GB）+ KV cache，而训练还要梯度、优化器状态、激活</u>。</b><b>⇒ <u>一个粗略的经验：训练一个模型需要的显存，大约是推理的 10 到 20 倍</u>。</b>");

  note("⚠ 而「有」这个回答让他可以直接讲它多出了什么，而不用从头解释优化器",640,386,"r");},"<b>第三步，而讲者又一次先确认了前置知识。</b><br><b>讲者的话</b>：<b>「<u>然后你最后有权重更新 —— 也就是你知道了你的损失会被最小化的那个方向，所以你把那个更新施加到你的权重上。而你典型地会用外面那些现成的优化器。你们听说过 Adam 优化器吗？</u>」</b><b>⇒ 学生：<u>听过。</u></b><br><b>★★ 这是这门课第六次做这个动作了</b>：<b>⇒ <u>L2</u>：三角公式、空间旋转、蒸馏。</b><b>⇒ <u>L3</u>：FLOPS、温度。</b><b>⇒ <u>这里</u>：Adam。</b><br><b>★★★ 而「<u>听过</u>」这个回答让他跳过了「什么是优化器」，<u>直接讲 Adam 多出了什么</u>。</b><b>⇒ 如果回答是「没听过」，<u>他就得先解释梯度下降、学习率、动量</u> —— <u>那会花五分钟</u>。</b><br><b>⇒ <u>所以这个动作的实际作用，一直是「决定从哪一层开始讲」</u>。</b><br><b>⚠ 而最朴素的更新规则（<u>SGD</u>）其实只有一行：<u>w ← w − 学习率 × 梯度</u>。</b><b>⇒ <u>它不需要存任何额外的东西</u>。</b><b>⇒ <u>而 Adam 的全部代价，就在于它要存的那些「额外的东西」—— 下一镜</u>。</b>");

  note("★★ 而这两个量「也需要被存在内存里的某个地方」",640,368,"r");},"<b>Adam 多出的那两个量，而它们正是训练显存里最被低估的一块。</b><br><b>讲者的话</b>：<b>「<u>所以 Adam 优化器就是一个花哨一点的版本，它有一些额外的量，用来跟踪 —— 那些量基本上是梯度的函数。所以你有第一动量和第二动量，它们基本上是梯度的移动平均、和梯度平方的移动平均。而所有这些量 —— 第一动量、第二动量 —— 你也需要以某种方式把它们存在内存里的某个地方。所以要存的东西很多</u>。」</b><br><b>★★★ 这两个量各自在干什么</b>：<b>⇒ <u>第一动量</u>（梯度的移动平均）⇒ 它起的是「<u>惯性</u>」的作用：<u>让更新方向平滑，不被单个 batch 的噪声带偏</u>。</b><b>⇒ <u>第二动量</u>（梯度平方的移动平均）⇒ 它起的是「<u>自适应学习率</u>」的作用：<u>梯度一直很大的参数，步子迈小一点；一直很小的，步子迈大一点</u>。</b><br><b>★★ 而代价是：<u>这两个量都和参数同样大</u></b>：<b>⇒ 所以 Adam 要额外存 <u>2N</u> 个数。</b><b>⇒ 而且<u>优化器状态通常用 fp32 存</u>（为了数值稳定）⇒ <u>每个数 4 字节</u>。</b><br><b>⇒ 一个 70 亿参数的模型：<u>2 × 70 亿 × 4 字节 = 56 GB</u>。</b><br><b>⚠ <u>优化器状态比模型权重本身还大四倍</u> —— <u>这就是为什么下一段的 ZeRO 要先从「切分优化器状态」开始</u>。</b>");
  SUM(0,16,{h:"⭐ 反向传播与更新权重",k:"<b>第二步 backwards pass</b>：<b>它量化出「那个让损失会被最小化的方向」—— 那叫梯度；你取「损失对每一个参数」的梯度，而梯度也需要被存在内存里</b>。<b>第三步 权重更新</b>：<b>你知道了方向，就把那个更新施加到权重上；而你典型地会用现成的优化器</b>。<b>Adam</b>：<b>就是一个花哨一点的版本，它有一些额外的量，而那些量是「梯度的函数」—— 你有第一动量和第二动量，基本上是「梯度的移动平均」和「梯度平方的移动平均」；而这些量也需要存在内存里 ⇒ 要存的东西很多</b>。",m:"★★★ 「相对于每一个参数」决定了梯度的大小：<b>模型有 N 个参数 ⇒ 梯度就有 N 个数 ⇒ 梯度占的显存和模型权重本身一样多</b>。算一下（70 亿参数、fp16）：<b>权重 14 GB + 梯度 14 GB = 28 GB，而激活和优化器状态还没算 —— 一张 80 GB 的 H100 已经被占掉三分之一，而这还只是一个 7B 的模型</b> ⇒ <b>这就是「训练比推理贵得多」的原因：推理只要权重 + KV cache，而训练还要梯度、优化器状态、激活 —— 粗略经验是训练显存约为推理的 10 到 20 倍</b>。",w:"★★★ Adam 那两个量各自在干什么：<b>第一动量（梯度的移动平均）起「惯性」作用 —— 让更新方向平滑、不被单个 batch 的噪声带偏；第二动量（梯度平方的移动平均）起「自适应学习率」作用 —— 梯度一直很大的参数步子迈小点，一直很小的迈大点</b>。而代价是<b>两个量都和参数同样大 ⇒ Adam 要额外存 2N 个数，而且优化器状态通常用 fp32（为数值稳定）⇒ 每个数 4 字节</b> ⇒ <b>70 亿参数的模型：2 × 70 亿 × 4 = 56 GB —— 优化器状态比模型权重本身还大四倍</b>，⚠ <b>这就是为什么下一段的 ZeRO 要先从「切分优化器状态」开始</b>。",r:"⇒ 这是这门课<b>第六次</b>「用一个概念前先确认听众有」（L2 的三角公式/空间旋转/蒸馏、L3 的 FLOPS/温度、这里的 Adam），<b>而「听过」这个回答让他跳过「什么是优化器」、直接讲 Adam 多出了什么 —— 如果回答是「没听过」，他就得先解释梯度下降、学习率、动量，那会花五分钟</b> ⇒ <b>这个动作的实际作用一直是「决定从哪一层开始讲」</b>。⚠ 而最朴素的更新规则 <b>SGD 只有一行：w ← w − 学习率 × 梯度，它不需要存任何额外的东西 —— 而 Adam 的全部代价就在于它要存的那些「额外的东西」</b>。"});
  QUIZ(0,16,{t:"Adam 优化器在显存上的代价有多大？",o:["两个动量各和参数同样大，而且通常用 fp32 存 ⇒ 70 亿参数就是 56 GB，比模型权重本身还大四倍","只在最后一层需要","和梯度一样大","可以忽略不计"],a:0,w:"⇒ 这就是为什么 ZeRO 要先从「切分优化器状态」开始。而两个动量分别起「惯性」和「自适应学习率」的作用。"});

  note("⇒ 好处：你「能把和 batch 大小挂钩的那部分内存降下来」",640,370,"g");},"<b>两句话说完了数据并行，而第二句是它的致命限制。</b><br><b>讲者的话</b>：<b>「<u>而这里的想法，是把那一批数据分散到各个设备上，而接着为了做到这件事，你当然需要每一块设备上都有一份模型的拷贝。因为你当然需要算那些激活，你需要算所有这些东西。但当你那么做的时候，你就能把和 batch 大小挂钩的那部分内存降下来</u>。」</b><br><b>★★★ 请把这两句话对照着读，<u>因为它们一个是好处、一个是限制</u></b>：<b>⇒ <u>好处</u>：<u>batch 相关的那部分内存（也就是激活）被切成了 N 份</u>。</b><b>⇒ <u>限制</u>：<u>权重、梯度、优化器状态这三样，每张卡上都还是一整份</u>。</b><br><b>★★ 回到那笔账（<u>7B 模型、四张卡</u>）</b>：<b>⇒ <u>激活</u>：被切成四份 ⇒ <u>省了</u>。</b><b>⇒ <u>权重 14 + 梯度 14 + 动量 56 = 84 GB</u>：<u>每张卡都还是 84 GB</u>。</b><b>⇒ <u>所以数据并行根本没解决那个最大的问题</u>。</b><br><b>⇒ <u>这正是 ZeRO 要动手的地方（33:34 之后）</u>。</b><br><b>⚠ 而「<u>每张卡要有一份完整拷贝</u>」这件事，<u>也是学生马上要指出的那个缺点</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("32:17","the gradient is just the average of the gradients");
  note("⭐ 学生问：那梯度更新怎么办？—— 讲者：好问题",640,186,"y");
  boxNode(60,214,560,44,"问题：既然各算各的，那梯度更新怎么对得上？","y");

  note("⇒ 所以你在多块 GPU 之间「有一些通信」，它基本上就是把梯度聚合起来用于更新",640,292,"g");
  note("★★ 而「平均」这件事成立，是因为损失本身就是「batch 内各样本损失的平均」",640,324,"v");
  note("⚠ 这个操作在工程上有名字：all-reduce",640,362,"d");},"<b>一个很好的学生提问，而答案比看起来更有分量。</b><br><b>讲者的话</b>：<b>「<u>问题是：那梯度更新怎么办？嗯，这是个很好的问题。所以当你在这儿那儿有一些独立的计算时，你做什么？嗯，梯度就是这些东西的各份梯度的平均。所以你在多块 GPU 之间有一些通信，它基本上就是把梯度聚合起来，用于更新</u>。」</b><br><b>★★★ 为什么「<u>取平均</u>」就是对的，而不是一个近似</b>：<b>⇒ 因为 batch 的损失本来就定义成<u>各样本损失的平均</u>。</b><b>⇒ 而求导是<u>线性</u>的 ⇒ <u>平均的梯度 = 梯度的平均</u>。</b><b>⇒ <u>所以四张卡各算四分之一再取平均，和一张卡算整个 batch，结果在数学上完全一样</u>。</b><br><b>★★ 这一点很要紧：<u>数据并行是「精确的」，不是近似</u></b>：<b>⇒ <u>它不改变训练结果，只改变训练在哪里发生</u>。</b><b>⇒ <u>而后面的量化就不是这样了 —— 那个是真的近似</u>。</b><br><b>⚠ 这个「<u>把各卡的梯度加起来再分发回去</u>」的操作在工程上有名字：<u>all-reduce</u>。</b><b>⇒ 而它的通信量 <u>和模型大小成正比 —— 每一步都要传一遍整个梯度</u>。</b><b>⇒ <u>这就是「通信代价」的具体样子，也是下一镜要说的事</u>。</b>");
  SUM(0,18,{h:"⭐ 数据并行（DP）",k:"<b>第一套方法叫 data parallelism，也叫 DP</b>：<b>它把「数据」分散到多块 GPU 上，这样前向传播和反向传播都可以被独立地做完</b>。具体：<b>把那一批数据分散到各个设备上 ⇒ 而为了做到这件事，你当然需要每一块设备上都有一份模型的拷贝（因为你得算激活、得算所有那些东西）⇒ 但这样你就能把「和 batch 大小挂钩的那部分内存」降下来</b>。学生问梯度更新怎么办 ⇒ <b>梯度就是各份梯度的平均；所以你在 GPU 之间有一些通信，它基本上就是把梯度聚合起来用于更新</b>。",m:"★★★ 「独立」为什么重要：<b>独立就意味着可以真正并行 —— 四张卡各拿四分之一 batch，同时跑前向和反向，谁都不用等谁，理论吞吐量四倍</b>。但它有硬边界：<b>只到「算完梯度」为止 —— 因为四张卡必须始终持有同一套权重，否则就变成四个不同的模型 ⇒ 每一步结束前必须把梯度合起来，那就是通信</b>。⚠ 「DP」这个缩写论文里到处都是：<b>DP、DDP（分布式数据并行）、FSDP（完全分片数据并行，本质就是 ZeRO-3）</b>。",w:"★★★ 那两句话一个是好处、一个是限制，要对照读：<b>好处是 batch 相关的那部分内存（激活）被切成 N 份；限制是权重、梯度、优化器状态这三样每张卡上都还是一整份</b>。回到那笔账（<b>7B、四张卡</b>）：<b>激活被切成四份省了，但权重 14 + 梯度 14 + 动量 56 = 84 GB 每张卡都还是 84 GB ⇒ 数据并行根本没解决那个最大的问题 —— 这正是 ZeRO 要动手的地方</b>。",r:"★★★ 为什么「取平均」是精确而非近似：<b>batch 的损失本来就定义成各样本损失的平均，而求导是线性的 ⇒ 平均的梯度 = 梯度的平均 ⇒ 四张卡各算四分之一再平均，和一张卡算整个 batch，数学上完全一样</b> ⇒ <b>所以数据并行是「精确的」：它不改变训练结果，只改变训练在哪里发生（而后面的量化就不是这样，那个是真的近似）</b>。⚠ 这个操作在工程上有名字：<b>all-reduce</b>，<b>而它的通信量和模型大小成正比 —— 每一步都要传一遍整个梯度，这就是「通信代价」的具体样子</b>。"});
  QUIZ(0,18,{t:"数据并行里「把各卡的梯度取平均」为什么是精确的、而不是近似？",o:["因为用了 fp32 累加","因为每张卡都有完整的模型拷贝","因为误差会随步数抵消","因为 batch 损失本就是各样本损失的平均，而求导是线性的 ⇒ 平均的梯度 = 梯度的平均"],a:3,w:"⇒ 所以数据并行不改变训练结果，只改变训练在哪里发生。而它省下的只有激活那部分 —— 权重、梯度、优化器状态每张卡还是一整份。"});
});
KP("19 · ⭐ 讲者反问：这就是万能解吗？—— 两个代价",function(){

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("★★ 他的总结：内存上你能往上扩 —— 但你会付出那些通信代价，所以并不全是好事",640,348,"v");},"<b>第二个缺点是讲者自己补的，而它是整个这一段的隐藏主角。</b><br><b>讲者的话</b>：<b>「<u>所以我要补的第二点是，你有一笔额外的代价，它叫做通信代价，因为你需要以某种方式在你的多块 GPU 之间通信，好把一些量聚合起来。所以你的训练会变慢。它是好的，你可以把内存往上扩。当然，你需要把一个模型装进一块设备，而我们会看到我们怎么做到那一点。但你会付出那些通信代价，所以并不全是好事</u>。」</b><br><b>★★★ 「<u>通信代价</u>」从这里起会一直跟到这一段结束，<u>而它是这一整段真正的主角</u></b>：<b>⇒ <u>数据并行</u>：要通信（all-reduce 梯度）。</b><b>⇒ <u>ZeRO</u>：要<u>更多</u>通信。</b><b>⇒ <u>模型并行</u>：要通信（层与层、块与块之间传激活）。</b><b>⇒ <u>所以每一个省显存的办法，都在拿通信去换</u>。</b><br><b>★★ 通信为什么贵：<u>因为卡与卡之间的带宽远低于卡内的带宽</u></b>：<b>⇒ 卡内显存带宽：<u>每秒几个 TB</u>。</b><b>⇒ 同机 <u>NVLink</u>：每秒几百 GB。</b><b>⇒ 跨机 <u>InfiniBand</u>：每秒几十到一百多 GB。</b><br><b>⇒ <u>所以「分散到多卡」这件事，一跨出机器就要慢一个量级 —— 这就是为什么超算集群的网络和卡一样贵</u>。</b><br><b>⚠ 而讲者那句「<u>并不全是好事</u>」是这一讲反复出现的那个判断方法：<u>看到一个优化，先问它省了什么、又多花了什么</u>。</b>");
  SUM(0,19,{h:"⭐ 数据并行的两个代价",k:"讲者反问：<b>这就是万能解吗？如果我们就这样一路加卡，加到很多很多块 GPU，它总是好的吗，还是有缺点？</b> ⇒ 学生指出 <b>① 你还是得把一个模型装进去</b>（讲者：噢对，很好的点）；讲者补 <b>② 通信代价 —— 因为你得在 GPU 之间通信好聚合一些量 ⇒ 你的训练会变慢</b>。总结：<b>它是好的，内存上你能往上扩；当然你需要把一个模型装进一块设备（我们会看到怎么做）；但你会付出那些通信代价，所以并不全是好事</b>。",m:"★★★ 学生指出的正是数据并行那个硬限制：<b>它要求每一块卡都装得下整个模型 ⇒ 所以它能解决「数据太多」，但完全不能解决「模型太大」—— 而今天的问题恰恰主要是后者</b>。★★ 而「通信代价」从这里起一直跟到这一段结束，<b>它是这一整段真正的主角：数据并行要通信（all-reduce 梯度）、ZeRO 要更多通信、模型并行要通信（传激活）⇒ 每一个省显存的办法都在拿通信去换</b>。",w:"★★ 通信为什么贵：<b>卡与卡之间的带宽远低于卡内的带宽 —— 卡内显存带宽每秒几个 TB、同机 NVLink 每秒几百 GB、跨机 InfiniBand 每秒几十到一百多 GB</b> ⇒ <b>「分散到多卡」一跨出机器就要慢一个量级，这就是为什么超算集群的网络和卡一样贵</b>。",r:"★★ 「先给一个方法，再问它有什么不好」在这门课已是固定动作：<b>L3 的 greedy 解码之后问「这样有什么问题」、KV cache 之后问「那代价是什么」、这里的数据并行之后问「这就是万能解吗」</b> ⇒ <b>这个动作的作用是让下一个方法的出现变得「必要」而不是「又一个」</b>。⚠ <b>你写论文里的 related work 时这正是该用的结构：不要列方法，要让每个方法都从上一个方法的缺陷里长出来</b>。而他那句「并不全是好事」就是这一讲反复出现的判断方法：<b>看到一个优化，先问它省了什么、又多花了什么</b>。"});
  QUIZ(0,19,{t:"数据并行解决不了的那个问题是什么？",o:["数据太多","通信太慢","模型太大 —— 它要求每一块卡都装得下整个模型，而今天的问题恰恰主要是这个","上下文太长"],a:2,w:"⇒ 外加第二个代价：通信 —— 你得在 GPU 之间聚合梯度，所以训练会变慢。「并不全是好事」。"});

KP("20 · ⭐⭐ ZeRO：把重复的三样东西依次切开",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("33:54","this method is called ZeRO");
  note("⭐⭐ 一个观察：多卡之间有「大量重复」",640,172,"y");
  gpus(249,206,3,["权重 + 梯度 + 优化器状态","一模一样的那三样","还是一模一样的那三样"],"y",250,44);
  note("⇒ 人们意识到：这里其实有「很多重复」",640,314,"r");
  note("★★ 于是有一篇论文想把这些重复的信息「去重」—— 这个方法叫 ZeRO",640,342,"g");
  note("ZeRO = ZeRO Redundancy Optimization（零冗余优化）",640,370,"v");},"<b>一个很简单的观察，而它带来了这一段里最大的节省。</b><br><b>讲者的话</b>：<b>「<u>所以说到内存、以及我们想要至少能在每块设备上存下一个模型这件事 —— 人们意识到其实这里有很多重复。而有一篇论文想要把这些重复的信息去重，而这个方法叫做 ZeRO，ZeRO redundancy optimization。而这个想法是：在每一块 GPU 上，你存着同样的参数，你存着同样的梯度，你存着同样的优化器状态</u>。」</b><br><b>★★★ 请把这个观察说得更直白一点</b>：<b>⇒ 数据并行里，<u>N 张卡上存着 N 份一模一样的权重、梯度和优化器状态</u>。</b><b>⇒ 而其中 <u>N−1 份是纯浪费</u>。</b><b>⇒ <u>每一步里，每张卡真正会去更新的，只是它自己那一部分 —— 如果我们把活分开的话</u>。</b><br><b>★★ 「<u>ZeRO</u>」这个名字是个双层的玩笑</b>：<b>⇒ 它读作「<u>零</u>」，而全称是 <u>ZeRO Redundancy Optimization</u>（零冗余优化）。</b><b>⇒ <u>也就是说这个缩写本身就是它要达到的目标 —— 把冗余降到零</u>。</b><br><b>⇒ <u>它出自微软 2019 年的 ZeRO 论文，而它的实现就是今天到处在用的 DeepSpeed</u>。</b><br><b>⚠ 而 PyTorch 自带的 <u>FSDP</u>（Fully Sharded Data Parallel）<u>本质上就是 ZeRO-3</u>。</b><b>⇒ <u>所以你今天训模型时很可能已经在用它了，只是名字不一样</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("34:17","how about we shard, we partition those quantities across GPUs");
  note("⭐⭐ ZeRO 的想法一句话，而它分三级",640,186,"y");
  boxNode(130,214,1020,44,"想法：那我们把这些量「分片、切分」到多块 GPU 上，怎么样？","g");
  note("⇒ 第一个变体：围绕「共享优化器状态」—— 也就是把那些状态切分到多块 GPU 上",640,292,"y");

  note("★★ 他在现场还口误改了一次：「然后另一块第 3 层 —— 抱歉，4 到 5，4、5、6」",640,358,"d");},"<b>第三刀，而它是三刀里最好懂、也最难做好的一刀。</b><br><b>讲者的话</b>：<b>「<u>而也许最后一个我会说的是 pipeline parallelism。它是当你把一次前向传播看成是涉及好几层的时候。所以你会说，一块 GPU 只负责，比如说，第 1 到 3 层，然后另一块第 3 层 —— 抱歉，4 到 5，4、5、6，以此类推。所以你也有那一种并行</u>。」</b><br><b>★★★ 它为什么好懂：<u>因为它就是把模型「竖着锯开」</u></b>：<b>⇒ 一个 80 层的模型、8 张卡 ⇒ <u>每张卡放 10 层</u>。</b><b>⇒ 前向时数据<u>像流水线一样从卡 1 走到卡 8</u>。</b><b>⇒ <u>每张卡只需要存 10 层的权重、梯度和优化器状态</u>。</b><br><b>★★ 它为什么最难做好：<u>因为天然会有「气泡」</u></b>：<b>⇒ 卡 1 算完第 1 到 10 层，<u>就要等数据走完剩下的 70 层才有事做</u>。</b><b>⇒ <u>也就是说在最朴素的实现里，8 张卡里有 7 张在空等</u>。</b><br><b>⇒ <u>解决办法是把 batch 切成很多个 micro-batch，让它们像装配线上的零件一样首尾相接地流过去 —— 这就是「流水线」这个名字的来处</u>。</b><br><b>⚠ 而那个口误（「第 3 层 —— 抱歉，4 到 5，4、5、6」）<u>恰好说明他是在现场即时举例，不是念稿</u>。</b>");

  SUM(0,21,{h:"⭐ 模型并行的三刀",k:"<b>另一套方法叫 model parallelism —— 它试着把运算并行掉，哪怕是在一个 batch 之内</b>（讲者先说：方法有一堆，我不想听起来太像在念目录，所以只点几个值得一提的）。三刀：<b>① 专家并行 —— 上一讲的 MoE 里序列被送到不同专家，那就能把它分散到多卡，比如一个专家在一块设备上、另一个在另一块；② 张量并行 —— 当你有很大的矩阵乘法时用某种方式把它切开，好把那件事所需的内存降下来；③ 流水线并行 —— 把一次前向看成涉及好几层，于是一块 GPU 只负责第 1 到 3 层、另一块负责 4、5、6，以此类推</b>。边界：<b>那上面的细节不需要知道，但知道有好几种方法和一个大概的想法是值得记在心里的好事</b>。",m:"★★★ 「哪怕在一个 batch 之内」是整个分界线：<b>数据并行是 N 张卡做 N 件不同的事（不同数据），各自完整；模型并行是 N 张卡合作做同一件事，各自只做一部分</b> ⇒ 后果是同步频率完全不同：<b>数据并行一步只在末尾同步一次（all-reduce 梯度），模型并行一次前向中就要同步很多次（每切一刀就传一次中间结果）⇒ 所以模型并行对卡间带宽要求高得多，基本只在同一台机器内走 NVLink 才划算</b>。",w:"★★ 三刀各自的性质：<b>专家并行切「专家」—— 最自然（MoE 的结构本来就是分开的，专家之间本来不交互），但每个 MoE 层都要做一次 all-to-all（按路由把 token 打散到各卡再收回），而 L3 那个「专家崩塌」在这里会变成工程灾难：大部分 token 都去一个专家，那块卡被打爆、其它卡空等 ⇒ 负载均衡损失直接决定你的卡会不会闲着</b>；<b>张量并行切「矩阵」—— 把 W 按列切成 [W₁|W₂]，卡 1 算 xW₁、卡 2 算 xW₂，拼起来完全等价，所以也是精确的；它真的降低了「每张卡要持有多少参数」，这是数据并行做不到的 ⇒ 是「把模型装进一块设备」的直接答案之一，但每层里有好几次这种切分、每次算完都要同步，通信密度极高</b>；<b>流水线并行切「层」—— 80 层 8 张卡每张放 10 层，数据像流水线从卡 1 走到卡 8；但天然有「气泡」：最朴素实现里 8 张卡有 7 张空等 ⇒ 办法是把 batch 切成很多 micro-batch 首尾相接地流过去，这就是「流水线」这个名字的来处</b>。",r:"⇒ 压成一张可带走的表：<b>专家并行切「专家」只对 MoE 适用；张量并行切「矩阵」通信最密、机内用；流水线并行切「层」通信最稀、跨机用</b> ⇒ <b>实践中的大规模训练几乎总是把它们叠起来用，这叫「3D 并行」：数据并行 × 张量并行 × 流水线并行 —— 讲者没提这个词，但他讲的三样正好就是它的三个维度，而典型配置是「机内张量并行 + 机间数据并行」</b>。⚠ 他给的掌握尺度对两种人都有用：<b>要考试的只要能把三个名字和「它切的是哪一刀」对上；要做研究的只需知道这些工具存在、以及该在什么时候去查它们</b>。而那个口误（「第 3 层 —— 抱歉，4 到 5」）<b>恰好说明他是在现场即时举例，不是念稿</b>。"});
  QUIZ(0,21,{t:"数据并行和模型并行的分界线是什么？",o:["一个精确，一个近似","一个省显存，一个省算力","数据并行是 N 张卡做 N 件不同的事（各自完整），模型并行是 N 张卡合作做同一件事（各自只做一部分）","一个用 GPU，一个用 TPU"],a:2,w:"⇒ 所以同步频率完全不同：数据并行一步末尾同步一次，模型并行一次前向中要同步很多次 —— 后者对卡间带宽要求高得多。"});

  SUM(0,22,{h:"⭐⭐ GPU 里的两种内存",k:"收口：<b>训练过程中我们不得不在内存里存下很多东西 ⇒ 于是看了一些减轻每块 GPU 内存负担的技术，做法是把它分摊到多块 GPU 上 —— 数据并行、带额外优化的 ZeRO、以及模型并行</b>。接着：<b>现在我们要看另一个技术，它利用的是 GPU 的「结构」—— 它叫 flash attention，实际上就是 2022 年在斯坦福这里被做出来的</b>。前提：<b>GPU 里我们有两种内存 —— HBM「大但相对慢」（几十个 GB、每秒几个 TB，就是规格说明里那个 GPU memory）；SRAM「快但小得多得多」，就在片上紧挨着计算发生的地方（几十个 MB、每秒几十个 TB）⇒ 小得多，但快十倍，是一个明显可感的速度差</b>。",m:"★★★ 前面那三样有个很重要的共同点：<b>它们都没有减少「总共要存多少」—— 数据并行总量反而变多（每卡一份完整拷贝）、ZeRO 总量不变只是不再重复、模型并行总量不变只是摊开 ⇒ 这一整段讲的都是「把同样多的东西放到更多的地方去」</b>；而 <b>FlashAttention 是完全不同性质的东西：它真的让「要搬多少」变少了，而且既省内存又更快 —— 这在这一讲里是唯一的一个</b>。立足点也转了：<b>前面所有技巧把 GPU 当黑盒、我们买更多个；FlashAttention 打开这个黑盒看它内部的结构 ⇒ 正因为打开了黑盒，它才能找到那个被所有人忽略的瓶颈</b>。",w:"★★★ 把那张表记成两句话：<b>容量上 HBM 比 SRAM 大约一千倍（几十 GB 对几十 MB），带宽上 SRAM 比 HBM 快约十倍（几十 TB/s 对几 TB/s）</b>；两句一合就逼出一个必然结论：<b>数据只能放在 HBM 里（SRAM 根本装不下），但计算只能在 SRAM 旁边发生 ⇒ 每一次计算都必然包含一次「从 HBM 搬到 SRAM」⇒ 于是真正的问题变成了「你搬了几次」</b> ⇒ <b>这正是 FlashAttention 的全部切入点：它一个乘法都没少算，它只是少搬了几次</b>。⚠ 对一下 L3 那个「内存受限」：<b>那里说的是 HBM 带宽受限（权重搬不动），这里说的是 HBM 与 SRAM 之间的搬运次数 —— 同一个瓶颈的两种表现</b>。",r:"⇒ 「紧挨着计算发生的地方」是整个 FlashAttention 的物理基础：<b>SRAM 就在计算单元旁边，取数几乎不要等；HBM 是焊在芯片外面的那一圈显存，取数要走一段物理距离 —— 而「距离」在这个尺度上是真会算进时间里的</b>。对应平时的说法：<b>你说一张卡「有 80 GB 显存」说的就是 HBM，而 SRAM 你买卡时根本看不到它的容量（规格表通常不写）⇒ 这一段讲的是一块你平时完全意识不到的内存</b>。「2022 年在斯坦福这里」是 <b>Tri Dao 等人的 FlashAttention 论文 —— 可能是近年影响最大的一篇「纯系统」论文：没改模型、没改目标函数，只改了同一个公式的算法实现，而它今天已是所有主流框架的默认实现（你用 PyTorch 跑注意力，底下大概就是它）</b> ⇒ <b>这一段的价值不只在于学一个技巧，而在于看一个「不改数学、只改怎么算」的工作能有多大</b>。⚠ 讲者公开承认「我也不是什么都知道」<b>反而让他接下来那几个数更可信 —— 他只讲他确实知道的那一层</b>。"});

  note("⚠ 讲者说「你之所以那么做，是因为这个 softmax 运算」—— 浪费是被逼出来的，不是写代码的人懒",640,378,"d");},"<b>这是整段里最关键的一环：浪费不是因为实现得差，而是被 softmax 逼出来的。</b><br><b>讲者的话</b>：<b>「<u>你之所以那么做，原因是这个 softmax 运算。所以你们记得 softmax 做什么吗？所以它把那些量归一化，好让它们加起来等于 1。但它是按行的，意思是每一行都需要加起来等于 1。所以在某种意义上，你需要那个计算先发生，然后你才能做你的 softmax</u>。」</b><br><b>★★★ 把这个死结写清楚</b>：<b>⇒ softmax 的第 i 行要除以「<u>第 i 行所有元素的指数之和</u>」。</b><b>⇒ 那个和<u>要等整行都算出来才知道</u>。</b><b>⇒ <u>所以你没法算一块、就把那一块归一化完 —— 你缺了分母</u>。</b><br><b>★★ 而这就逼出了原味实现的那个结构</b>：<b>⇒ <u>第一阶段</u>：把整个 n×n 的 QKᵀ <u>全部算完并存下来</u>。</b><b>⇒ <u>第二阶段</u>：才能逐行做 softmax。</b><b>⇒ <u>于是那个 n×n 必须在某个地方「整个地」存在过 —— 而它只能存在 HBM 里</u>。</b><br><b>⇒ <u>也就是说：那些读写不是实现上的疏忽，而是算法结构的必然</u>。</b><br><b>★★★ 所以要打破它，<u>你必须打破「softmax 需要整行」这个前提本身 —— 而这正是下一节那个技巧做的事</u>。</b><br><b>⚠ 请体会讲者的叙述顺序：<u>他先让你相信这件事做不到，再告诉你它能做到</u>。</b>");
  SUM(0,23,{h:"⭐⭐ 原味注意力一直在读写 HBM",k:"目标：<b>利用这两种内存各自的强项，把注意力的计算加速，而且是以一种「精确的」方式 —— 我的意思是我们不对那个计算做任何近似，我们做的只是利用这些部件的强项、并以聪明的方式去派发那个计算</b>。公式：<b>softmax(QKᵀ / 缩放因子) V，Q 的行数 = 序列长度、列数 = query 的维度，K 和 V 同理 ⇒ 你有这些很大的矩阵乘法</b>。原味做法：<b>从「大但慢」的 HBM 取出矩阵 ⇒ 算 ⇒ 写回 HBM ⇒ 再读出来算 softmax ⇒ 又写回 ⇒ 再和 V 一起加载、相乘、再写回 ⇒ 对 HBM 的读写「有很多」，这是大量的数据搬运，而它「实际上变成了那个瓶颈」</b>。一句关键话：<b>GPU 非常非常快，但你花了大量时间只是在从内存加载你的矩阵</b>。而原因是 <b>softmax：它把量归一化好让它们加起来等于 1，但它是「按行的」—— 每一行都要加起来等于 1 ⇒ 所以你需要那个计算先发生，然后才能做 softmax</b>。",m:"★★★ 「精确」不是修辞，<b>它是这个工作最硬的那一点</b>：<b>近年有几十篇论文在做「更快的注意力」，而绝大多数是近似的（稀疏、线性、低秩、局部窗口），它们都以「结果和原来不完全一样」为代价，所以都要证明「变差得不多」—— 那是个没完的争论</b>；而 <b>FlashAttention 的输出和原来逐位相同（浮点误差内）⇒ 换上它不需要重新验证任何东西，它没有「代价」这一栏 —— 这就是它能成为默认实现、而那几十篇近似方法都没能的根本原因</b>。⚠ <b>当一个优化「没有代价」时，它一定是改了「怎么算」而不是「算什么」</b>。",w:"★★★ 那个 n×n 矩阵的行程单：<b>第 1 趟 QKᵀ 算完写出去；第 2 趟读回来算 softmax 再写出去；第 3 趟再读回来乘 V ⇒ 一个 32 MB 的矩阵（n=4096、fp16、单头）被跨越那条慢总线搬了五次</b>。而「它实际上变成了那个瓶颈」是整个 FlashAttention 的论点：<b>不是算得不够快，是搬得太多 —— 而所有人都在优化「算」，因为那是公式里写着的部分 ⇒ FlashAttention 的洞见就是看清了瓶颈在另一头</b>。这类瓶颈叫 <b>memory-bound（内存受限）</b>，反面是 <b>compute-bound</b>；<b>L3 讲解码时用过同一个词 —— 那里是权重搬不动，这里是中间结果搬不动</b>。",r:"★★★ 这个死结要写清楚：<b>softmax 的第 i 行要除以「第 i 行所有元素的指数之和」，而那个和要等整行都算出来才知道 ⇒ 你没法算一块就把那块归一化完，你缺了分母</b> ⇒ 于是逼出原味实现的结构：<b>第一阶段把整个 n×n 的 QKᵀ 全部算完并存下来，第二阶段才能逐行做 softmax ⇒ 那个 n×n 必须在某处「整个地」存在过，而它只能存在 HBM 里</b> ⇒ <b>那些读写不是实现上的疏忽，而是算法结构的必然 ⇒ 要打破它，你必须打破「softmax 需要整行」这个前提本身</b>。⚠ 讲者的叙述顺序值得体会：<b>他先让你相信这件事做不到，再告诉你它能做到</b>。⇒ 另一个可带走的量是 <b>算术强度（arithmetic intensity）= 浮点运算次数 / 搬运字节数：高则受限于算力（卡在干活），低则受限于带宽（卡在等活）—— 而原味注意力很低，尤其 softmax 那步读 32 MB、写 32 MB，中间只做了一次指数和一次除法</b>；这也解释了那个常见困惑：<b>换了一张算力翻倍的卡但训练只快一点点，因为你原来的瓶颈从来不是算力</b>。"});
  QUIZ(0,23,{t:"原味注意力实现里那些反复的 HBM 读写，根本原因是什么？",o:["softmax 是按行归一的 —— 要算分母就得先知道整行的和，于是整个 n×n 必须先算完并存下来","矩阵乘法必须在 HBM 里做","HBM 比 SRAM 慢十倍","代码写得不够好"],a:0,w:"⇒ 所以那些读写是算法结构的必然，不是疏忽 ⇒ 要打破它，必须打破「softmax 需要整行」这个前提本身。"});

  note("★★ 请注意这是一个关于「依赖关系」的发现，不是一个关于「硬件」的发现",640,348,"v");},"<b>核心想法只有一句话，而它是一个关于依赖关系的发现。</b><br><b>讲者的话</b>：<b>「<u>如果你就那样看它，你会以为，是啊，你得先把整件事做完。嗯，结果发现，你并不需要一次把所有事情都做完。而这就是 flash attention 背后的核心想法</u>。」</b><br><b>★★★ 这句话之所以是整个工作的核心，<u>是因为它推翻的是上一节那个「必然」</u></b>：<b>⇒ 上一节的结论是：<u>softmax 要整行 ⇒ 整个矩阵必须先算完</u>。</b><b>⇒ 这一节说：<u>不对，那个「必须」是假的</u>。</b><br><b>★★ 而请注意这个发现的性质：<u>它是数学上的，不是工程上的</u></b>：<b>⇒ 硬件那两种内存的事实<u>早就摆在那里，所有人都知道</u>。</b><b>⇒ 真正缺的那一块是：<u>「softmax 其实可以分块做」这个代数事实</u>。</b><br><b>⇒ <u>也就是说：这个工作的突破点在数学，而它的收益在硬件</u>。</b><br><b>★★★ 这是一个很值得你记住的研究形状：<u>一个所有人都接受的「必须先做完」，其实只是没人去验证过的一个假设</u>。</b><br><b>⚠ 下面两镜分开讲它的两半：<u>先讲「怎么分块搬」（tiling），再讲「为什么分块算 softmax 也对」（那个缩放因子技巧）</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("43:48","the method is called tiling");
  note("⭐⭐ 做法的第一半：tiling（分块）",640,170,"y");
  stack(640,194,["flash attention 做的事：把「对 HBM 的读写量」最小化","⇒ 办法是取「小块」—— 这个方法就叫 tiling","⇒ 把这些小块送进 SRAM，让它在那里「从头到尾算完」，然后才被送回 HBM"],740,34,8);
  note("⇒ 讲者问：说得通吗？然后把这句话又说了一遍",640,328,"g");
  note("★★ 想法是：我们把小矩阵送进 SRAM，让它做完整的端到端计算，然后只把结果送回 HBM",640,348,"v");
  note("⚠ 因为我们想要的，就是把「对 HBM 的读写量」最小化",640,378,"r");},"<b>做法的第一半，而讲者把它重复了两遍。</b><br><b>讲者的话</b>：<b>「<u>所以 flash attention 做的事，是它试着把对 HBM 的读和写的量最小化，而改成取小块 —— 这个方法叫做 tiling。它取一些小块，把它们送进 SRAM，这样它就能在被送回 HBM 之前，从头到尾被算完。说得通吗？所以这个想法是，我们把小矩阵送进 SRAM，让它做完整的端到端计算，然后只把它送回 HBM，因为我们想把对 HBM 的读写量最小化</u>。」</b><br><b>★★★ 请抓住「<u>从头到尾</u>」这四个字，<u>因为它是全部的节省所在</u></b>：<b>⇒ <u>原味</u>：一块数据<u>每做一步就回 HBM 一次</u>（算 ⇒ 写 ⇒ 读 ⇒ softmax ⇒ 写 ⇒ 读 ⇒ 乘 V）。</b><b>⇒ <u>FlashAttention</u>：一块数据进了 SRAM，<u>三步全做完才出来</u>。</b><br><b>⇒ <u>所以中间那个 n×n 的大矩阵，从来没有被完整地写进 HBM 过 —— 它只以小块的形式在 SRAM 里短暂存在</u>。</b><br><b>★★ 这也顺带解释了一个常被误解的点：<u>FlashAttention 省的不只是时间，还有显存</u></b>：<b>⇒ 因为那个 <u>O(n²)</u> 的中间矩阵<u>根本不再被实例化</u>。</b><b>⇒ <u>于是注意力的显存从 O(n²) 降到 O(n) —— 这就是为什么它直接让长上下文变得可行</u>。</b><br><b>⚠ 「<u>tiling</u>」这个技术在高性能计算里是老办法（<u>矩阵乘法的分块早就这么做</u>）—— <u>新的是把它用到了带 softmax 的注意力上</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("44:07","let's send small matrices into the SRAM",168);
  note("⭐ 把矩阵切开，一步一步来 —— 画出来是这样",640,196,"y");

  note("⇒ 讲者：你会做的，是把你的矩阵切开，然后一步一步地推进",640,386,"y");},"<b>把切法画出来，而讲者在这里只说了一句「一步一步来」。</b><br><b>讲者的话</b>：<b>「<u>所以这里就是你会怎么做。所以你记得，那个带 query 和 key 然后 value 的 softmax 计算。嗯，你会做的，是把你的矩阵切开，然后一步一步地推进</u>。」</b><br><b>★★★ 具体怎么切（这是论文里的做法）</b>：<b>⇒ 把 <u>Q 按行切成若干块</u>（每块是一组 query）。</b><b>⇒ 把 <u>K 和 V 也按行切成若干块</u>（每块是一组 key/value）。</b><b>⇒ 于是 <u>n×n 的注意力矩阵就被切成了一个网格</u>，<u>每个格子对应「一块 Q」和「一块 K」</u>。</b><br><b>★★ 而遍历顺序是两层循环</b>：<b>⇒ <u>外层</u>：固定一块 Q。</b><b>⇒ <u>内层</u>：让这块 Q 依次和每一块 K、V 相遇，<u>边走边把结果累加起来</u>。</b><b>⇒ <u>一块 Q 走完所有 K 之后，它对应的那几行输出就彻底算完了，可以写回 HBM</u>。</b><br><b>⇒ <u>然后换下一块 Q</u>。</b><br><b>⚠ 但这里有一个没解决的问题：<u>内层每走一步，你只看到了整行的一部分 —— 那 softmax 的分母怎么办</u>？</b><b>⇒ <u>这正是下一镜那个技巧</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("44:49","you don't need to compute the whole matrix inside a softmax",166);

  stack(640,218,["假设你有一整个矩阵，而它被分成若干列（或者子矩阵）S₁ 到 Sₙ","⭐ 那么「整个大矩阵的 softmax」= 「对每个子矩阵各自取 softmax」的那个矩阵","⇒ 「差一个缩放因子（up to some scaling factor）」"],760,34,8);
  note("★★ 为什么：看 softmax 的公式 —— 它是「某个东西的指数」除以「某个量」，而那个量是「整行共享的」",640,352,"v");
  note("⇒ 所以那个缩放因子只是「把这个相对于那个修正过来」",640,372,"g");},"<b>这是整个 FlashAttention 的数学心脏，而它只有一行代数。</b><br><b>讲者的话</b>：<b>「<u>但接着有一个很酷的技巧我想跟你们讲，就是你并不需要把 softmax 里面那整个矩阵算出来，才能完成整个 softmax 计算。因为如果你想一想，假设你有一整个矩阵，然后你有不同的、比如说列或者子矩阵，S1 到 SN —— 嗯，这个巨大矩阵的 softmax，就等于这样一个矩阵：其中 softmax 是相对于每一个这些子矩阵取的，差一个缩放因子。所以这就是那个核心技巧。而如果你想被说服，就看看 softmax 的公式：它是某个东西的指数除以某个量，而那个量是整行共享的。所以这个缩放因子只是会把这个相对于那个修正过来</u>。」</b><br><b>★★★ 把这行代数写清楚（<u>一行里有两块：a 和 b</u>）</b>：<b>⇒ 整行的分母是 <u>Σexp(a) + Σexp(b)</u>。</b><b>⇒ 而你只算了 a 那块，<u>得到的分母是 Σexp(a)</u>。</b><b>⇒ 两者只差一个<u>比例</u> ⇒ <u>而比例是可以事后乘上去修正的</u>。</b><br><b>★★ 所以做法是：<u>一边走一边修正</u></b>：<b>⇒ 维护两个很小的量：<u>到目前为止的「行最大值」和「指数和」</u>。</b><b>⇒ 来了新的一块 ⇒ <u>更新这两个量，并把已累加的输出按新旧分母的比值缩放一下</u>。</b><b>⇒ <u>走完整行时，那个分母正好是对的 —— 结果和一次算完完全相同</u>。</b><br><b>⇒ <u>这就是「精确」这个词的全部来处</u>。</b><br><b>⚠ 这个技巧不是全新的：<u>它叫 online softmax，2018 年就有了</u>。</b><b>⇒ <u>FlashAttention 的贡献是把它和 tiling 拼起来、并真的写出了那个 CUDA kernel</u>。</b>");
  SUM(0,24,{h:"⭐⭐⭐ tiling 与分块 softmax",k:"核心想法：<b>如果你就那样看它，你会以为「你得先把整件事做完」—— 结果发现，你并不需要一次把所有事情都做完。而这就是 flash attention 背后的核心想法</b>。做法第一半：<b>它把「对 HBM 的读写量」最小化，改成取小块 —— 这个方法叫 tiling；把小块送进 SRAM，让它在那里「从头到尾算完」，然后才送回 HBM</b>；具体是<b>把你的矩阵切开，然后一步一步地推进</b>。做法第二半（<b>那个很酷的技巧</b>）：<b>你并不需要把 softmax 里面那整个矩阵算出来，才能完成整个 softmax 计算 —— 假设一整个矩阵被分成子矩阵 S₁ 到 Sₙ，那么整个大矩阵的 softmax 就等于「对每个子矩阵各自取 softmax」的那个矩阵，差一个缩放因子</b>；理由：<b>看 softmax 的公式 —— 它是某个东西的指数除以某个量，而那个量是整行共享的，所以这个缩放因子只是把这个相对于那个修正过来</b>。",m:"★★★ 「你并不需要一次把所有事情都做完」推翻的正是上一节那个「必然」，<b>而请注意这个发现的性质：它是数学上的，不是工程上的 —— 硬件那两种内存的事实早就摆在那里、所有人都知道，真正缺的那一块是「softmax 其实可以分块做」这个代数事实 ⇒ 这个工作的突破点在数学，收益在硬件</b> ⇒ <b>这是一个值得记住的研究形状：一个所有人都接受的「必须先做完」，其实只是没人去验证过的一个假设</b>。",w:"★★★ 把那行代数写清楚（<b>一行里有两块 a 和 b</b>）：<b>整行的分母是 Σexp(a) + Σexp(b)，而你只算了 a 那块、得到的分母是 Σexp(a) ⇒ 两者只差一个比例，而比例可以事后乘上去修正</b>；所以做法是<b>一边走一边修正：维护两个很小的量（到目前为止的「行最大值」和「指数和」），来了新的一块就更新这两个量，并把已累加的输出按新旧分母的比值缩放一下 ⇒ 走完整行时那个分母正好是对的，结果和一次算完完全相同 —— 这就是「精确」这个词的全部来处</b>。⚠ 这个技巧不是全新的：<b>它叫 online softmax，2018 年就有了；FlashAttention 的贡献是把它和 tiling 拼起来、并真的写出了那个 CUDA kernel</b>。",r:"★★ 「从头到尾」四个字是全部的节省所在：<b>原味是一块数据每做一步就回 HBM 一次（算 ⇒ 写 ⇒ 读 ⇒ softmax ⇒ 写 ⇒ 读 ⇒ 乘 V）；FlashAttention 是一块数据进了 SRAM，三步全做完才出来 ⇒ 那个 n×n 的大矩阵从来没有被完整地写进 HBM 过，它只以小块形式在 SRAM 里短暂存在</b> ⇒ 所以<b>它省的不只是时间，还有显存：那个 O(n²) 的中间矩阵根本不再被实例化，注意力的显存从 O(n²) 降到 O(n) —— 这就是为什么它直接让长上下文变得可行</b>。切法与遍历（论文里的做法）：<b>Q 按行切块、K 和 V 也按行切块 ⇒ n×n 的注意力矩阵变成一个网格；外层固定一块 Q，内层让它依次和每一块 K、V 相遇、边走边累加 ⇒ 一块 Q 走完所有 K，它那几行输出就彻底算完、可以写回 HBM，然后换下一块 Q</b>。⚠ <b>tiling 在高性能计算里是老办法（矩阵乘法的分块早就这么做）—— 新的是把它用到了带 softmax 的注意力上</b>。"});
  QUIZ(0,24,{t:"「整个矩阵的 softmax = 对每个子矩阵各自取 softmax，差一个缩放因子」—— 为什么？",o:["因为 softmax 是线性的","因为子矩阵之间互不相关","因为缩放因子是 √dk","因为 softmax 是「指数除以一个整行共享的量」⇒ 只算一块得到的分母只差一个比例，而比例可以事后乘上去修正"],a:3,w:"⇒ 实现上就是「一边走一边修正」：维护行最大值和指数和，来新块就更新并按新旧分母的比值缩放已累加的输出 ⇒ 走完整行时分母正好对 —— 这就是「精确」的来处。"});
});

  SUM(0,25,{h:"⭐⭐ 只剩一次从 HBM 读",k:"流程：<b>取这些矩阵各自对应的切片 ⇒ 做完整的那个计算 ⇒ 填上输出矩阵里对应的那一项；先在 Q 的第一个切片和 K、V 的第一个切片之间做，然后对其它切片重复直到走完，再对其它 query 重复直到走完</b>。边界：<b>论文解释的是这个缩放因子怎么被算出来的 —— 那是一个公式，我没放到幻灯上，所以你不必去背那个公式，它就是那个想法，而那个想法恰恰就是这个技巧</b>。结果：<b>一旦你那么做，你基本上只剩下一次从 HBM 读；那些量被存在 SRAM 里，从 SRAM 被读出来（非常快）、算完、再回到 SRAM；而最后为了累加结果，它们才被送回 HBM</b>（幻灯上<b>绿色是从 SRAM 读，蓝色是从 HBM 读</b>）。",m:"★★★ 这个结构和原味实现的根本差别：<b>原味是「阶段式」—— 先把整个 QKᵀ 算完、再整个做 softmax、再整个乘 V；FlashAttention 是「格子式」—— 一格走完三步，再走下一格</b>。这个翻转在系统里有通用的名字：<b>算子融合（kernel fusion）—— 把原本三个各自读写内存的运算合成一个 kernel，中间结果根本不离开片上</b> ⇒ <b>而它之所以难做，是因为中间夹着 softmax：融合算子通常只能融「逐元素」的运算，而 softmax 是跨元素的 —— 那个缩放因子技巧正是为了把这块障碍拆掉</b>。",w:"★★★ 前后对照才看得清分量：<b>原味那个 n×n 矩阵在 HBM 和芯片之间来回五趟；FlashAttention 是 Q、K、V 读一遍、输出写一遍，中间全在 SRAM 里 ⇒ HBM 访问量从 O(n²) 降到 O(n)</b>；论文里的实际效果是<b>训练快 2 到 4 倍、注意力部分显存降 10 到 20 倍，而输出逐位相同 ⇒ 这就是它在两年里成了所有框架默认实现的原因</b>。★★★ 请把这一个和这一讲其它所有技巧区分开：<b>其它的都在拿一种资源换另一种，而这一个两头都赚 —— 而它能两头都赚，是因为原来的做法在「瓶颈在哪里」这件事上判断错了</b>。⚠ <b>这是做研究时最值钱的一类发现：不是把现有权衡推进一点，而是发现那个权衡本来就不该存在</b>。",r:"⇒ 这是这一讲第二次明确划出掌握尺度（<b>上一次是模型并行那三刀的「细节不需要知道」，这里是「去背那个公式不是必要的」</b>）—— <b>两次都是在一堆工程细节之后告诉你该停在哪一层</b>；而「它就是那个想法」本身给出了考法：<b>要会的是「为什么分块 softmax 只差一个缩放因子」和「tiling 省的是什么」；不用会的是那个缩放因子的闭式表达</b>。⇒ 如果你真想知道：<b>它就是在线地维护「到目前为止的行最大值 m」和「指数和 ℓ」，每来一块就按新旧 m 的差做一次指数缩放；而减去行最大值这一步是为了数值稳定，否则 exp 会上溢 —— 这是所有 softmax 实现的标准做法</b>。"});

  note("⇒ 这正是前面 27:17 说过的那件事：激活必须被存着，因为反向要用",640,350,"g");
  note("★★ 而这一段要做的，是把那句话推翻 —— 或者说，给它一个出口",640,376,"r");},"<b>第二个想法的出发点，正是这一讲前面留下的那笔账。</b><br><b>讲者的话</b>：<b>「<u>第二个想法是：既然注意力的计算更快了，那现在我们就来试着对反向传播更聪明一点。因为当你在反向传播里计算、当你计算损失对一个参数的梯度时，链式法则会翻出一些你必须留在内存里的激活</u>。」</b><br><b>★★★ 请回到 <u>27:17</u> 那一镜，这两段是直接接上的</b>：<b>⇒ 那里说：<u>前向算出的激活必须被存下来，因为反向要用</u>。</b><b>⇒ 而激活的显存和<u>模型规模 × batch × 上下文长度</u>都成正比。</b><b>⇒ <u>所以它常常是训练显存里最大的一块 —— 比权重还大</u>。</b><br><b>★★ 为什么链式法则会「<u>翻出</u>」激活</b>：<b>⇒ 对一层 <u>y = f(xW)</u> 求 W 的梯度，结果里带着 <u>x</u>。</b><b>⇒ 而 <u>x</u> 就是前一层的激活。</b><b>⇒ <u>所以每一层的梯度公式里，都会出现那一层的输入</u>。</b><br><b>⇒ <u>这就是「必须留在内存里」的来处 —— 它是数学逼出来的，不是实现选择</u>。</b><br><b>⚠ 而「<u>翻出（surface）</u>」这个词用得很好：<u>它不是你主动要存的，是公式自己把它摆到你面前的</u>。</b>");

  SUM(0,27,{h:"⭐⭐ 第二个想法：重算",k:"<b>这就是 flash attention —— 但那篇论文其实还有另一个想法；第一个想法只是第一个，它围绕把注意力的计算做得更快</b>。<b>第二个想法：既然注意力的计算更快了，那就来对反向传播更聪明一点 —— 因为当你算「损失对一个参数的梯度」时，链式法则会翻出一些你必须留在内存里的激活</b>。<b>既然算这些激活非常快，一个想法就是干脆不存前向传播的那些激活（或至少不全存），而是在反向传播里把它们再算一次 —— 这叫 recomputation（重算）</b>：<b>前向时你算出激活、用它算损失，但与其存下来留着梯度更新时复用，你就把它丢掉，然后在反向时用这个非常快的技术把它重算出来</b>。",m:"★★★ 这一段和 27:17 那一镜是直接接上的：<b>那里说前向算出的激活必须被存下来因为反向要用，而激活显存和「模型规模 × batch × 上下文长度」都成正比 ⇒ 它常常是训练显存里最大的一块，比权重还大</b>。为什么链式法则会「翻出」激活：<b>对一层 y = f(xW) 求 W 的梯度，结果里带着 x，而 x 就是前一层的激活 ⇒ 每一层的梯度公式里都会出现那一层的输入 —— 这是数学逼出来的，不是实现选择</b>；⚠ <b>「翻出（surface）」这个词用得好：它不是你主动要存的，是公式自己把它摆到你面前的</b>。",w:"★★★ 这个技巧的一般形式叫 <b>梯度检查点（gradient checkpointing）</b>，<b>而它比 FlashAttention 老得多</b>：<b>每隔若干层存一个「检查点」、中间激活全丢，反向走到那段时从最近的检查点重新前向一遍 ⇒ 激活显存从 O(层数) 降到 O(√层数)，代价是多做一遍前向</b>。但请注意讲者给的那个前提「既然算这些激活非常快」：<b>常规的梯度检查点要付大约 30% 的额外时间，而在 FlashAttention 的注意力上，重算便宜到那笔时间也不用付了</b> ⇒ <b>所以这里真正新的不是「重算」这个主意，而是「重算已经便宜到不必权衡」这个事实</b>。",r:"⇒ 为什么第二个想法常被漏掉：<b>因为「FlashAttention」这个名字已经和「快速注意力」绑在一起了，而第二个想法说的是另一件事（怎么少存激活），它甚至不只适用于注意力 —— 它是一个更一般的技巧</b>。而两个想法之间有一个很漂亮的因果关系：<b>第一个想法让注意力变快了，而正因为它变快了，第二个想法才变得划算 ⇒ 这不是两个并列的技巧，而是第一个技巧「解锁」了第二个</b>。⚠ 讲者在这里连用两次「酷」加两次确认（「说得通吗」「有任何问题吗」），<b>是在确认前面那个技巧真的过关了才敢往下走</b>。"});
  QUIZ(0,27,{t:"FlashAttention 论文的第二个想法是什么，它和第一个什么关系？",o:["把权重量化到 fp16","重算（不存前向的激活，反向时再算一次）—— 而它之所以划算，正是因为第一个想法让算激活变得非常快","把注意力矩阵稀疏化，和第一个想法并列","把 batch 切开分到多卡"],a:1,w:"⇒ 所以不是两个并列的技巧，是第一个「解锁」了第二个。它的一般形式叫梯度检查点，而新的不是这个主意，是「重算已经便宜到不必权衡」。"});
});

  SUM(0,30,{h:"⭐⭐ 表示法与精度换速度",k:"<b>最常见的那些浮点表示在这张表里：单精度、半精度、floating point 64、brain float 16 —— 它们在「三个维度」上各有不同的粒度</b>。只看前两行（<b>你会在外面看到的两种最常见的</b>）：<b>FP16 只用 16 位，对比之下 FP32 是 32 位 ⇒ 它基本上只占一半的内存；但它不那么精确、不那么细 ⇒ 于是一个想法是把这些权重、这些数的粒度降下来，并「希望」它不会太影响性能</b>。而回到那张 GPU 规格表：<b>上面还有一堆关于计算速度的信息，而它是「你用哪种表示法」的函数 —— FP64（超细）只有 34 teraFLOPs；用 FP32（一半位数）就能把计算速度翻一倍，以此类推 ⇒ 所以你能省内存，你也能跑得更快</b>。",m:"★★★ 重点看 <b>FP16 和 BF16</b>：<b>位数一样但分法完全不同 —— FP16 是 5 位指数 + 10 位尾数（精细但量程窄），BF16 是 8 位指数 + 7 位尾数（粗但量程和 FP32 一样宽）</b>；这个差别在训练里是决定性的：<b>深度学习的梯度经常非常小（如 10⁻⁸），而 FP16 的量程下限约 6×10⁻⁵ ⇒ 这类梯度直接变成 0；BF16 量程和 FP32 相同 ⇒ 它不会 ⇒ BF16 用「更粗的刻度」换「不会归零」—— 在训练里宁可不准也不能变成 0</b>。<b>「brain float」的名字来自 Google Brain（为 TPU 设计），而今天几乎所有大模型训练都用 BF16 而不是 FP16，原因就是这一条</b> —— ⚠ <b>讲者没讲这个对比，但这张表把它摆在你面前了</b>。",w:"★★★ 精度不只影响「存多少」还影响「算多快」，<b>很多人会漏掉这一跳、以为量化只是省内存</b>。硬件层面的原因：<b>GPU 里有专门为不同精度做的计算单元（tensor core）—— 位数减半则同一块硅片上能同时算的数翻倍，而且搬同样多的数只要一半带宽</b> ⇒ <b>量化同时在三条账上省：显存容量（一半）、显存带宽（一半）、算力（翻倍）—— 它不是省一点，是三头一起省</b>。而 H100 上的具体数：<b>FP64 约 34、FP32 约 67、FP16/BF16 走 tensor core 约 1000、FP8 约 2000 TFLOPS</b> ⇒ <b>FP32 到 FP16 那一跳远不止两倍，因为它同时跨过了「普通计算单元」到「tensor core」的界 ⇒ 实践中用 FP16/BF16 训练的加速是十几倍而不是两倍，这才是混合精度训练真正的收益来源</b>；⚠ <b>所以「GPU 爱矩阵乘法」今天更准确的说法是「GPU 爱低精度的矩阵乘法」</b>。",r:"⇒ 把这个交易写干净：<b>确定会得到的是内存减半；确定会失去的是精度变粗；希望不会发生的是性能变差</b>。而「希望」这个词在学术报告里出现通常意味着两件事之一：<b>要么有理论保证（那就不会说「希望」），要么只有经验证据 —— 而这里是后者 ⇒ 正确态度是：量化在实践中很有效，但你每次都必须自己测一遍，而「测什么」正是下半场那个「评估为什么难」要回答的问题</b>。⚠ 一个常被忽略的细节：<b>权重的分布很集中（大多在 0 附近），而这正是量化能有效的根本原因 —— 如果权重均匀散布在整个可表示范围里，砍精度会立刻毁掉模型</b>。"});
  QUIZ(0,30,{t:"FP16 和 BF16 都是 16 位，差别在哪、为什么训练几乎都用 BF16？",o:["BF16 更快","BF16 位数更多","FP16 是 5 位指数 + 10 位尾数（精细但量程窄），BF16 是 8 位指数 + 7 位尾数（粗但量程与 FP32 相同）⇒ 很小的梯度在 FP16 下直接变 0","FP16 只能用于推理"],a:2,w:"⇒ 在训练里宁可不准也不能变成 0。而「brain float」的名字来自 Google Brain，它原本是为 TPU 设计的。"});
});

  note("⚠ 注意 ① 和 ③ 是同一件事的两面：权重始终以 FP32 存在，低精度只是「临时副本」",640,378,"r");},"<b>三条配方，而第三条最容易被忽略。</b><br><b>讲者的话</b>：<b>「<u>所以混合精度训练背后的想法是：你有你的模型，你把你的权重保持在高精度，也就是 FP32，而你在前向和反向传播里做的所有运算，你都要在更低的精度里做 —— 所以这里是 FP16。但接着权重更新还是会在 FP32 里做。所以那篇论文的作者，当他们那么做的时候，基本上发现性能没有退化太多。但接着你在内存上省了很多，而且它跑得更快</u>。」</b><br><b>★★★ 把这个流程走一遍，你就看出那份 FP32 权重的角色</b>：<b>⇒ <u>存着</u>一份 FP32 的权重（叫 master weights）。</b><b>⇒ 每一步<u>复制出一份 FP16 的</u>，拿它做前向和反向。</b><b>⇒ 得到 FP16 的梯度 ⇒ <u>转回 FP32</u> ⇒ <u>更新那份 FP32 的权重</u>。</b><b>⇒ <u>那份 FP16 副本用完就丢</u>。</b><br><b>★★ 第三条为什么不能省：<u>因为更新量常常比权重小好几个数量级</u></b>：<b>⇒ 比如权重是 1.0，更新是 10⁻⁷。</b><b>⇒ 在 <u>FP16</u> 下，1.0 的相邻可表示值差大约 10⁻³ ⇒ <u>这个更新加上去等于没加</u>。</b><b>⇒ <u>于是训练会完全停住 —— 而且不报错</u>。</b><br><b>⇒ <u>而在 FP32 下，1.0 附近的分辨率约 10⁻⁷ ⇒ 加得上去</u>。</b><br><b>⚠ 所以「<u>权重更新在 FP32 里做</u>」不是保守，<u>它是这个方法能成立的必要条件</u>。</b>");

  SUM(0,31,{h:"⭐⭐ 混合精度训练",k:"<b>在交给 Shervin 之前最后一个技术：混合精度训练 —— 想法是利用「不同粒度的浮点表示」，使它不会太伤性能，但又让你省内存、把事情做得更快</b>。配方三条：<b>① 你把权重保持在高精度（FP32）；② 而前向和反向传播里你做的所有运算，都在更低的精度里做（这里是 FP16）；③ 但权重更新还是在 FP32 里做</b>。结果：<b>那篇论文的作者这么做之后发现「性能没有退化太多」，但你在内存上省了很多，而且它跑得更快</b>。接着他自己提出该问的问题：<b>那你为什么把「权重」保持在高精度，却不这样对待激活之类的东西？⇒ 我可以给你们提供一点直觉</b>。",m:"★★★ 把流程走一遍就看出那份 FP32 权重的角色：<b>存着一份 FP32 的权重（master weights）⇒ 每一步复制出一份 FP16 的，拿它做前向和反向 ⇒ 得到 FP16 的梯度、转回 FP32、更新那份 FP32 权重 ⇒ 那份 FP16 副本用完就丢</b>。而第三条不能省：<b>更新量常常比权重小好几个数量级（权重 1.0、更新 10⁻⁷）；FP16 下 1.0 的相邻可表示值差约 10⁻³ ⇒ 这个更新加上去等于没加 ⇒ 训练会完全停住，而且不报错；FP32 下 1.0 附近分辨率约 10⁻⁷ ⇒ 加得上去</b> ⇒ <b>所以「权重更新在 FP32 里做」不是保守，而是这个方法能成立的必要条件</b>。",w:"★★★ 为什么权重和激活不对称（两者都是浮点数、都参与同一个矩阵乘法）—— 答案关于「累积」：<b>激活每一步重新算一遍、用完就扔 ⇒ 误差不会累积；权重被反复更新几十万步 ⇒ 误差会一步一步攒起来</b> ⇒ <b>判断一个量要不要高精度，看的不是它有多重要，而是「它的误差会不会累积」</b> ⇒ <b>这是一条可以带到别处去用的规则：一次性使用的量可以粗，被反复累加的量必须细</b>。",r:"⇒ 「混合」这个词是关键：<b>它不是「把所有东西都降到 FP16」，而是「哪些降、哪些不降」—— 而这个选择不是随便做的</b>；为什么不能全降：<b>「全降到 FP16」在 2017 年前后被试过，而它会训崩 —— 梯度太小在 FP16 下归零、一步步的小更新累加被舍入吃掉 ⇒ 混合精度训练那篇论文（2017，NVIDIA）本质上是在回答「哪些地方必须保住精度」</b>。⚠ <b>今天这件事已经是默认的：你用 PyTorch 的 autocast 或者 bf16 训练，就是在用它</b>。"});

KP("32 · ⭐ 那个直觉，与「该量化哪些层」的边界",function(){

  note("★★ 但接着：把「模型的权重」保持在高精度就重要得多了 —— 为了「不累积由量化带来的误差」",640,374,"r");},"<b>讲者给的直觉有两半，而两半各自对应一个量。</b><br><b>讲者的话</b>：<b>「<u>所以每当你做一次前向传播，你是在一组数据上做那件事。但那组数据本身就可能是有噪声的。所以也许小数点后面的 —— 所以小数点后面那些数字可能并没有那么有用。所以你可以把这个更新想成更像是：权重该往哪个方向走，去到一个更优的状态。所以它不要求它们超级精确。但接着，把你的权重、也就是模型的权重保持在高精度，这重要得多，为的是不累积由量化带来的误差。这只是一种可以去想它的方式</u>。」</b><br><b>★★★ 他这两半的论证各自针对一个量</b>：<b>⇒ <u>对激活和梯度</u>：<u>反正数据本身就有噪声，再精确也是在精确地描述噪声</u>。</b><b>⇒ <u>对权重</u>：<u>误差会累积，所以必须保住</u>。</b><br><b>★★ 「<u>往哪个方向走</u>」这个说法尤其值得记</b>：<b>⇒ 梯度的作用是<u>指方向</u>，不是给精确的位移。</b><b>⇒ 而方向这件事<u>对精度不敏感</u> —— <u>差一点的方向，下一步会自己纠回来</u>。</b><br><b>⇒ <u>这就是为什么随机梯度下降本身对噪声如此宽容：它每一步都在重新测量方向</u>。</b><br><b>⚠ 而他那句「<u>这只是一种可以去想它的方式</u>」是一个很诚实的标注：<u>这是直觉，不是证明</u>。</b>");

  stack(640,188,["总结一句话：如果你把某些数的粒度降下来，你会「得到很多好处，而在性能上没有很多坏处」","⇒ 学生问：这个技术是用在「所有层的所有权重」上，还是只用在「其中一些」上？","⭐ 答：关于那个有「很多论文」—— 而答案是「它有一些变体」","⇒ 所以答案是「不一定」—— 有些部分可能比别的部分「更重要」"],760,32,6);
  note("★★ 他还说：我确实有一些指引，很乐意分享给你们",640,350,"g");
  note("⚠ 他的定性：这个策略算是一个「比较高层的想法」，而「每个配置之间总会有一些变体」",640,370,"d");},"<b>一句总结，加一个很好的追问，而答案是「不一定」。</b><br><b>讲者的话</b>：<b>「<u>但长话短说，如果你把某些数的粒度降下来，那你会得到很多好处，而在性能方面没有很多坏处。所以问题是：你是把这个技术应用到所有层的所有权重上，还是只用到其中一些上？所以关于那个已经有很多论文了。而答案是，它有一些变体。所以答案是不一定。所以我确实有一些指引，很乐意分享给你们。但有些部分可能比别的部分更重要。所以这个策略算是一个比较高层的想法，但每个配置之间总会有一些变体</u>。」</b><br><b>★★★ 「<u>有些部分可能比别的部分更重要</u>」—— 这件事在实践里非常具体</b>：<b>⇒ 大多数量化方案会<u>保留某些层不量化</u>。</b><b>⇒ 典型的是：<u>嵌入层、输出的 LM head、以及 LayerNorm 的参数</u>。</b><b>⇒ 原因：<u>这些层的数值范围或敏感度和中间层很不一样</u>。</b><br><b>★★ 还有一个更细的发现（<u>这是量化研究里的核心现象</u>）</b>：<b>⇒ 大模型的激活里会出现<u>极少数但极大的「离群值」</u>。</b><b>⇒ 而它们一旦被粗暴量化 ⇒ <u>整个模型的质量会崩</u>。</b><br><b>⇒ <u>所以 LLM.int8()、GPTQ、AWQ 这些方案的核心差别，基本都在「怎么处理这些离群值」上</u>。</b><br><b>⇒ <u>这正是讲者说「它有一些变体」时指的那一片文献</u>。</b><br><b>⚠ 而「<u>每个配置之间总会有一些变体</u>」给了你一个很实用的提醒：<u>别人报的量化掉点数，不能直接搬到你的模型上</u>。</b>");
  SUM(0,32,{h:"⭐ 直觉与「该量化哪些层」",k:"那个直觉：<b>每当你做一次前向传播，你是在一组数据上做的 —— 而那组数据本身就可能有噪声 ⇒ 所以小数点后那些数字可能并没有那么有用；而你可以把那个更新想成更像是「权重该往哪个方向走，去到一个更优的状态」⇒ 它不要求它们超级精确。但接着，把模型的权重保持在高精度就重要得多了，为的是「不累积由量化带来的误差」—— 这只是一种可以去想它的方式</b>。总结：<b>如果你把某些数的粒度降下来，你会得到很多好处，而在性能上没有很多坏处</b>。追问：<b>这个技术是用在所有层的所有权重上，还是只用在其中一些上？⇒ 关于那个已经有很多论文；答案是它有一些变体，所以答案是「不一定」—— 有些部分可能比别的部分更重要；这个策略算是一个比较高层的想法，但每个配置之间总会有一些变体</b>。",m:"★★★ 他那两半论证各自针对一个量：<b>对激活和梯度 —— 反正数据本身就有噪声，再精确也是在精确地描述噪声；对权重 —— 误差会累积，所以必须保住</b>。「往哪个方向走」这个说法尤其值得记：<b>梯度的作用是指方向、不是给精确的位移，而方向这件事对精度不敏感 —— 差一点的方向，下一步会自己纠回来 ⇒ 这就是为什么随机梯度下降本身对噪声如此宽容：它每一步都在重新测量方向</b>。⚠ 他那句「这只是一种可以去想它的方式」是个很诚实的标注：<b>这是直觉，不是证明</b>。",w:"★★★ 「有些部分可能比别的部分更重要」在实践里非常具体：<b>大多数量化方案会保留某些层不量化 —— 典型的是嵌入层、输出的 LM head、以及 LayerNorm 的参数，因为这些层的数值范围或敏感度和中间层很不一样</b>。还有一个更细的、量化研究里的核心现象：<b>大模型的激活里会出现极少数但极大的「离群值」，它们一旦被粗暴量化、整个模型的质量会崩 ⇒ 所以 LLM.int8()、GPTQ、AWQ 这些方案的核心差别基本都在「怎么处理这些离群值」上 —— 这正是讲者说「它有一些变体」时指的那一片文献</b>。⚠ <b>「每个配置之间总会有一些变体」给了你一个很实用的提醒：别人报的量化掉点数，不能直接搬到你的模型上</b>。",r:"⇒ 这一段也给了你做研究时的一条判断规则：<b>一次性使用的量可以粗，被反复累加的量必须细</b> —— 而这条规则的适用面远不止量化（<b>任何迭代算法里，状态量比临时量更需要精度</b>）。而讲者说「我确实有一些指引，很乐意分享给你们」，<b>说明这片文献他自己也在跟 —— 这是一个还在快速变动的方向</b>。"});
  QUIZ(0,32,{t:"量化研究里那个「核心现象」是什么？",o:["低精度一定更快","大模型的激活里会出现极少数但极大的「离群值」，粗暴量化它们会让模型质量崩 ⇒ 各方案的差别主要在怎么处理它们","权重都集中在 0 附近","所有层的敏感度都一样"],a:1,w:"⇒ 这就是讲者说「它有一些变体、答案是不一定」时指的那片文献（LLM.int8()、GPTQ、AWQ）。实践里通常也会保留嵌入层、LM head、LayerNorm 不量化。"});

  stack(640,194,["它被训练的目标是「预测下一个 token」","⚠ 而「不是」去当一个助手、或者一个对你有帮助的人","⇒ 这就是为什么它会试着「模仿这里可能是什么样的模式」、以及「接下来可能出现哪些词」"],740,34,8);

  note("⚠ ……也许它被训练过的数据里就包含「泰迪熊的材质」—— 所以可能就是它",640,384,"d");},"<b>原因只有一句话，而它是这一讲最该带走的一句。</b><br><b>讲者的话</b>：<b>「<u>它被训练在下一个 token 预测上，而不是去当一个助手、或者一个对你有帮助的人。所以这就是为什么它会试着去模仿这里可能是什么样的模式、以及接下来可能出现哪些词。所以比如说，我们这里放的例子是和「泰迪熊是由什么做的」相关的东西。而因为它和泰迪熊在同一个领域里，而当你谈到洗衣机的时候，也许它被训练过的数据里就包含了泰迪熊的材质。所以可能就是它</u>。」</b><br><b>★★★ 「<u>被训练在 X 上，而不是 Y</u>」这个句式值得你记住</b>：<b>⇒ 它点明了一个很容易被忽略的事实：<u>模型只会它被优化的那件事</u>。</b><b>⇒ <u>任何你没有写进目标函数的东西，它都没有理由去做</u>。</b><br><b>★★ 而这件事在你自己的研究里也成立</b>：<b>⇒ 你拿一个指标去优化 ⇒ <u>你得到的就是那个指标</u>。</b><b>⇒ <u>你以为你还顺带得到了「背后那个你真正想要的东西」—— 但你没有</u>。</b><br><b>⇒ <u>这是整个 alignment 这个领域存在的理由</u>。</b><br><b>★★★ 所以这一讲下半场可以压成一句：<u>把「我真正想要的」写进目标函数里，是一件非常难的事，而人们是一步一步逼近它的</u>。</b><br><b>⚠ 讲者给的那个具体输出（聊泰迪熊的材质）也很真实：<u>它在「主题」上完全相关，只是在「意图」上完全不相关</u>。</b>");

  note("★★ 请注意这个过渡的形状：先制造不满，再命名解决办法",640,356,"v");
  note("⚠ 「你满意吗」这个问题是这门课里少见的「要求你表态」的提问",640,380,"r");},"<b>一个要求你表态的提问，然后才给出名字。</b><br><b>讲者的话</b>：<b>「<u>而我有一个问题要问你们所有人。你们对它满意吗？</u>」</b><b>⇒ 学生：<u>不。</u></b><b>⇒ 讲者：<u>是的。完全正确。所以这就是为什么我们要来看，我们能对这个模型做些什么，好让它对你有用。而这个阶段叫做 fine tuning</u>。」</b><br><b>★★★ 这个过渡的形状在教学上很有效：<u>先制造不满，再命名解决办法</u></b>：<b>⇒ 如果一上来就讲「<u>什么是微调</u>」，你会把它当成又一个技术名词。</b><b>⇒ 而先让你说出「<u>不满意</u>」，<u>这个名词就变成了「那个问题的答案」</u>。</b><br><b>★★ 顺带把这一讲的三个阶段再对一次位</b>：<b>⇒ <u>预训练</u>：让它懂语言 —— <u>已经做完了</u>。</b><b>⇒ <u>微调（SFT）</u>：让它当助手 —— <u>这一段</u>。</b><b>⇒ <u>偏好调优</u>：让它答得更合人意 —— <u>下一讲</u>。</b><br><b>⇒ <u>而后两者合称 alignment（对齐）—— 这是 96:33 会正式讲的</u>。</b><br><b>⚠ 「<u>fine tuning</u>」这个词在更广的机器学习语境里早就有了：<u>它泛指「在预训练权重上接着训」，不专指 LLM 的那一步</u>。</b><b>⇒ <u>而这正是下一镜要区分的两种用法</u>。</b>");
  SUM(0,35,{h:"⭐⭐ 泰迪熊进洗衣机",k:"复述：<b>预训练是一种「给模型建立直觉」的方式 —— 关于语言是怎么构造的、以及训练数据里包含的那些主要特征，而那是「足够一般」的；所以语料跨越了巨大的文本集合，典型地就是互联网上那些东西的规模 —— 非常大、很「原始」</b>。下半场的问题：<b>我们怎么才能让这样的知识「真的变得有用」？</b> 例子：<b>我们彻彻底底地爱过我们的泰迪熊，但它脏了得洗 ⇒ 你可能想问你最喜欢的 LLM：我能不能把它放进洗衣机？</b> 学生猜 <b>也许是「另一个问题」</b>（讲者：很好的猜测；幻灯上放的是另一句，<b>但要领是一样的</b>）。原因：<b>它被训练在「下一个 token 预测」上，而不是去当一个助手或者一个对你有帮助的人 ⇒ 所以它会试着模仿「这里可能是什么样的模式」—— 比如接着聊「泰迪熊是由什么做的」</b>。⇒ <b>你对它满意吗？不满意 ⇒ 所以我们来看能对模型做什么，好让它对你有用 —— 这个阶段叫 fine tuning</b>。",m:"★★★ 「原始（raw）」这个词是整个下半场的起点：<b>预训练数据是网页、书、代码 —— 它们是「文本」不是「对话」，里面没有人在扮演助手 ⇒ 所以模型学到的是「文本接下来通常怎么写」，而不是「别人问我我该怎么答」</b>；而「足够一般」同时是优点和缺点（<b>什么领域都懂一点，但不针对任何一种用法</b>）⇒ <b>下半场要做的就是把这份「一般」掰成一种「具体的用法」</b>。",w:"★★★ 「被训练在 X 上，而不是 Y」这个句式值得记住：<b>它点明了一个很容易被忽略的事实 —— 模型只会它被优化的那件事，任何你没写进目标函数的东西，它都没有理由去做</b>；而这在你自己的研究里也成立：<b>你拿一个指标去优化，你得到的就是那个指标 —— 你以为还顺带得到了「背后那个你真正想要的东西」，但你没有 ⇒ 这是整个 alignment 领域存在的理由</b> ⇒ <b>下半场可以压成一句：把「我真正想要的」写进目标函数里是一件非常难的事，而人们是一步一步逼近它的</b>。另外那个精确区分也值得留意：<b>模型已经有知识了，问题是那些知识不以「有用」的形式存在 ⇒ 微调不是在「教模型新东西」（它的数据量小好几个数量级，根本不足以塞进新知识），它能做的只是「改变模型调用已有知识的方式」</b>。",r:"⇒ 为什么「又一个问题」是非常自然的输出：<b>在互联网文本里一个问句后面经常跟着另一个问句（论坛标题、FAQ 列表、问卷）—— 「问句 → 问句」是一个高频的局部模式</b>；而「要领是一样的」才是重点：<b>不管它接什么，它接的都是「文本上合理的延续」，而「文本上合理」和「对你有用」是两件完全不同的事</b> ⇒ <b>预训练模型是一个「文本补全器」，不是一个「助手」—— 而「助手」这个身份完全是后天装上去的，它不在预训练的目标函数里，一个字都没有</b>。⚠ 教学法也值得学：<b>先制造不满，再命名解决办法 —— 如果一上来就讲「什么是微调」，你会把它当成又一个技术名词；而先让你说出「不满意」，这个名词就变成了「那个问题的答案」</b>。"});
  QUIZ(0,35,{t:"预训练完的模型被问「泰迪熊能放洗衣机吗」，为什么可能接着聊泰迪熊的材质？",o:["因为温度太高","因为它被训练在「预测下一个 token」上而不是当助手 ⇒ 它接的是「文本上合理的延续」，而那和「对你有用」是两回事","因为它不知道答案","因为提问里没有指令"],a:1,w:"⇒ 预训练模型是一个「文本补全器」，不是一个「助手」—— 而「助手」这个身份不在预训练的目标函数里，一个字都没有。"});

  stack(640,194,["模型微调（model fine tuning）通常被叫做 SFT","SFT = supervised fine tuning（有监督微调）","⭐ supervised 这个词「暗示我们需要一些标签」—— 而事实确实如此","⇒ 它是「一对对的输入和输出」，我们把它们给模型去训练 —— 所以它才叫「有监督」"],740,32,6);
  note("★★ 请注意这里的「标签」和你熟悉的分类标签很不一样",640,356,"v");
  note("⚠ 它不是「一个类别」，而是「一整段人写的回答」",640,380,"r");},"<b>三个字母，而其中 supervised 这个词的含义在这里有点特别。</b><br><b>讲者的话</b>：<b>「<u>所以首先，我想定义一些术语。所以模型微调通常被叫做 SFT。SFT 是 supervised fine tuning 的缩写。所以 supervised 这个部分暗示了我们需要一些标签。而事实确实如此。所以它是一对对的输入和输出，我们把它们提供给模型去训练。而这就是它为什么叫有监督</u>。」</b><br><b>★★★ 这里的「<u>标签</u>」和你在传统机器学习里熟悉的标签很不一样</b>：<b>⇒ <u>传统监督学习</u>：标签是<u>一个类别</u>（垃圾邮件 / 不是）或<u>一个数</u>。</b><b>⇒ <u>SFT</u>：标签是<u>一整段人写的回答</u>。</b><br><b>★★ 这个差别带来两个很实际的后果</b>：<b>⇒ <u>标注成本高得多</u>：写一段好回答比打一个勾贵几百倍。</b><b>⇒ <u>标签不唯一</u>：<u>同一个问题有无数种同样好的回答</u>。</b><br><b>⇒ <u>而「标签不唯一」这件事，正是后面「评估为什么难」的根源之一</u>。</b><br><b>⇒ <u>也是为什么下一讲要讲「偏好调优」：与其让人写出最好的回答，不如让人在两个回答里挑一个</u>。</b><br><b>⚠ 而 <u>SFT</u> 这个缩写你会到处看到 —— <u>把它和「指令微调」的关系记清楚：指令微调是 SFT 的一个子类，下一段讲</u>。</b>");

  stack(640,194,["fine tuning 这个词指的是：「精修那些已经被训练过的权重」","⇒ 你从「预训练好的权重」出发，在「额外的数据」上继续训，得到一个「微调过的模型」","⭐ 而一个有意思的注记：那个目标函数「虽然是同一个」，但会和预训练任务「有一点不一样」"],740,32,6);
  note("★★ 「同一个，但有一点不一样」—— 这句话听起来矛盾，而它是下一段的全部内容",640,318,"r");
  note("⚠ 同一个：仍然是「预测下一个 token」的交叉熵",640,348,"g");
  note("⚠ 不一样：「在哪些位置上算这个损失」变了",640,378,"v");},"<b>一句听起来矛盾的话，而它是下一段的全部内容。</b><br><b>讲者的话</b>：<b>「<u>然后 fine tuning 是那个指「精修那些已经被训练过的权重」的词。所以你从预训练好的权重出发，在额外的数据上进一步训练这个模型，得到一个微调过的模型。然后一个有意思的注记我想告诉你们所有人的是：那个目标函数，虽然它是同一个，却会和预训练任务有一点不一样</u>。」</b><br><b>★★★ 把这句矛盾话拆开</b>：<b>⇒ <u>同一个</u>：损失函数的<u>形式</u>没变 —— 还是「预测下一个 token」的<u>交叉熵</u>。</b><b>⇒ <u>不一样</u>：<u>在「哪些位置」上累加这个损失，变了</u>。</b><br><b>★★ 这是一个非常值得注意的工程细节</b>：<b>⇒ 它<u>不改模型、不改损失函数、不改优化器</u>。</b><b>⇒ 它只改<u>一个掩码</u> —— <u>哪些 token 参与损失</u>。</b><b>⇒ <u>而就是这个掩码，决定了模型学到的是「当助手」还是「鹦鹉学舌」</u>。</b><br><b>⇒ <u>一行代码的差别，行为上的根本差别</u>。</b><br><b>★★★ 这也是我建议你从这一讲带走的一个具体技能：<u>当你做任何序列到序列的微调时，先问「我的损失在哪些位置上算」</u>。</b><br><b>⚠ 讲者用「<u>有意思的注记</u>」这种轻描淡写的说法引入它 —— <u>但它其实是这一段最实在的一条</u>。</b>");
  SUM(0,36,{h:"⭐ 微调与 SFT 的定义",k:"微调能干两件事：<b>① 在 LLM 的一般情形下，把 LLM 变成一个「有用的助手」；② 如果你有一个具体的用例，也能用这个技术把「语言的一般表示」调向「你感兴趣的那个任务」—— 但我们先聚焦在一般情形</b>。名词：<b>模型微调通常被叫做 SFT = supervised fine tuning；supervised 这个词暗示我们需要一些标签，而事实确实如此 —— 它是「一对对的输入和输出」，我们把它们给模型去训练</b>；<b>fine tuning 指的是「精修那些已经被训练过的权重」—— 你从预训练好的权重出发，在额外的数据上继续训，得到一个微调过的模型</b>。而一个有意思的注记：<b>那个目标函数「虽然是同一个」，却会和预训练任务「有一点不一样」</b>。",m:"★★★ 把那句矛盾话拆开：<b>「同一个」是指损失函数的形式没变（还是「预测下一个 token」的交叉熵）；「不一样」是指「在哪些位置上累加这个损失」变了</b> ⇒ <b>它不改模型、不改损失函数、不改优化器，只改一个掩码 —— 哪些 token 参与损失；而就是这个掩码，决定了模型学到的是「当助手」还是「鹦鹉学舌」：一行代码的差别，行为上的根本差别</b> ⇒ <b>可带走的技能：当你做任何序列到序列的微调时，先问「我的损失在哪些位置上算」</b>。",w:"★★★ SFT 里的「标签」和传统监督学习很不一样：<b>传统监督学习的标签是一个类别或一个数；SFT 的标签是一整段人写的回答</b> ⇒ 两个很实际的后果：<b>标注成本高得多（写一段好回答比打一个勾贵几百倍）；标签不唯一（同一个问题有无数种同样好的回答）</b> ⇒ <b>「标签不唯一」正是后面「评估为什么难」的根源之一，也是为什么下一讲要讲偏好调优 —— 与其让人写出最好的回答，不如让人在两个回答里挑一个</b>。",r:"⇒ 微调那两种用法在规模和目的上都不同：<b>① 通用助手是几百万条指令数据、大公司做、做一次给所有人用；② 任务特化是几百到几万条你自己领域的数据、你自己做</b> ⇒ <b>对你的课题，第二种才是真正可操作的那条路：你不需要（也做不到）从头训一个助手，你要做的是拿一个已经对齐好的模型，再用自己的几千条数据把它调向你的任务 —— 而这一讲最后那个 LoRA 正是让这件事变得便宜的技术</b>。⚠ 讲者说「先聚焦在一般情形」，<b>但整段讲的机制（输入上不算损失、数据质量、评估）对两种用法完全一样</b>。"});
  QUIZ(0,36,{t:"SFT 的目标函数「和预训练是同一个，却又有一点不一样」，差在哪？",o:["换成了强化学习","学习率变了","形式没变（还是预测下一个 token 的交叉熵），变的是「在哪些位置上累加这个损失」","损失函数换成了均方误差"],a:2,w:"⇒ 它只改一个掩码 —— 哪些 token 参与损失；而就是这个掩码决定了模型学到的是「当助手」还是「鹦鹉学舌」。"});
});

  note("★★ 而我「不希望模型鹦鹉学舌地重复我说的话」",640,380,"r");},"<b>两边一对照，那处改动的必要性就立住了。</b><br><b>讲者的话</b>：<b>「<u>所以在预训练任务里，你从 BOS token、也就是句首开始，然后你把你全部的语料拟合进去，试着预测下一个 token。但在这里，既然我们有这个有监督微调的设定，你想让模型在你关心的那些情形下做点有用的事 —— 所以，比如说，当我问模型关于洗我的泰迪熊时，洗我的泰迪熊其实是我给模型的一个输入。它是固定的。我不希望模型鹦鹉学舌地重复我说的话</u>。」</b><br><b>★★★ 「<u>它是固定的</u>」这四个字是整个改动的理由</b>：<b>⇒ 预训练时，<u>每一个 token 都是「待预测的」</u> —— 因为没有谁事先给定了任何东西。</b><b>⇒ 微调时，<u>前半段（用户的话）是「给定的条件」</u>，<u>不是要预测的目标</u>。</b><br><b>★★ 如果你照搬预训练的做法会发生什么</b>：<b>⇒ 模型会被训练去<u>预测用户的提问</u>。</b><b>⇒ 于是它学会的技能里有一半是「<u>怎么像用户一样提问</u>」。</b><b>⇒ <u>而这正是「鹦鹉学舌」的意思 —— 它会倾向于复述、改写你的问题</u>。</b><br><b>⇒ <u>而那恰恰是我们在泰迪熊那一镜里看到的失败行为</u>。</b><br><b>⚠ 「<u>parrot（鹦鹉学舌）</u>」这个词选得很准：<u>它说的不是「答错了」，而是「学会了错的技能」</u>。</b>");

  seq(150,222,["我","能","洗","泰迪熊","吗","？"],["d","d","d","d","d","d"],110,40);

  note("⇒ 回答段：从这里开始预测、从这里开始算损失",640,382,"g");},"<b>改动本身只有一句话，而画出来就是这张图。</b><br><b>讲者的话</b>：<b>「<u>我想要模型成为一个有用的助手，去回应我给它的那个条件。所以在这个设定里，那个输入并不是一个你会去预测下一个 token 的位置。你不会在它上面做 teacher forcing，而是从这个输入出发，然后往后预测下一个 token。然后你会去调「基于这个输入，下一个 token 的最优分布可以是什么」</u>。」</b><br><b>★★★ 「<u>teacher forcing</u>」这个词值得解释一下，因为它是训练自回归模型的标准做法</b>：<b>⇒ 训练时<u>不让模型用自己上一步的输出</u>（那样一错就全错）。</b><b>⇒ 而是<u>把真实的那个 token 喂给它</u>，让它预测下一个。</b><b>⇒ <u>所以整个序列可以一次性并行地算完所有位置的损失</u>。</b><br><b>★★ 而这里说「<u>不在输入上做 teacher forcing</u>」，准确的含义是</b>：<b>⇒ 输入段的 token <u>照样被喂进模型</u>（它们是条件）。</b><b>⇒ 但那些位置上的预测<u>不计入损失</u>。</b><b>⇒ <u>实现上就是把这些位置的标签设成一个忽略值（PyTorch 里通常是 −100）</u>。</b><br><b>⇒ <u>所以这不是「不喂」，是「喂了但不考」</u>。</b><br><b>⚠ 这个区别很容易搞混，<u>而搞混的后果就是模型学会复述提问</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  SUM(0,37,{h:"⭐⭐⭐ 输入上不算损失",k:"预训练那边：<b>你从 BOS（句首）token 开始，把全部语料喂进去，试着预测下一个 token</b>。而这边不一样：<b>既然是有监督微调，你想让模型在你关心的情形下做点有用的事 —— 比如「洗我的泰迪熊」其实是「我给模型的一个输入」，它是「固定的」，而我不希望模型鹦鹉学舌地重复我说的话</b> ⇒ <b>所以在这个设定里，那个输入并不是一个你会去预测下一个 token 的位置：你不会在它上面做 teacher forcing，而是从这个输入出发、往后预测下一个 token，然后去调「基于这个输入，下一个 token 的最优分布可以是什么」</b>。学生确认：<b>我们不在输入上放损失 ⇒ 没错，你从那个输入出发开始预测下一个 token，而损失的计算是从那里开始的</b>。",m:"★★★ 「它是固定的」四个字是整个改动的理由：<b>预训练时每一个 token 都是「待预测的」（没有谁事先给定了任何东西）；微调时前半段（用户的话）是「给定的条件」，不是要预测的目标</b> ⇒ 照搬预训练会怎样：<b>模型会被训练去预测用户的提问，于是它学会的技能里有一半是「怎么像用户一样提问」—— 这就是「鹦鹉学舌」，它会倾向于复述、改写你的问题，而那恰恰是泰迪熊那一镜里的失败行为</b>；⚠ <b>「parrot」这个词选得准：它说的不是「答错了」，而是「学会了错的技能」</b>。",w:"★★★ 「teacher forcing」是训练自回归模型的标准做法：<b>训练时不让模型用自己上一步的输出（那样一错就全错），而是把真实的那个 token 喂给它、让它预测下一个 ⇒ 整个序列可以一次性并行算完所有位置的损失</b>；而「不在输入上做 teacher forcing」准确的含义是：<b>输入段的 token 照样被喂进模型（它们是条件），但那些位置上的预测不计入损失 —— 实现上就是把这些位置的标签设成一个忽略值（PyTorch 里通常是 −100）</b> ⇒ <b>这不是「不喂」，是「喂了但不考」—— 搞混的后果就是模型学会复述提问</b>。",r:"⇒ 压成一条能直接用的规则：<b>一条 SFT 样本是「提示 + 回答」拼成的一个序列；整条序列都进模型（提示提供上下文）；只有「回答」那一段的 token 参与损失</b>。几个你一定会遇到的变体：<b>多轮对话里只有「助手说的那几轮」算损失、用户说的都不算；系统提示不算损失；而「结束符」要算 —— 否则模型学不会什么时候停</b> ⇒ <b>最后这一条是新手最常漏的一个，漏了的后果是模型说个不停</b>。"});
  QUIZ(0,37,{t:"SFT 里「不在输入上做 teacher forcing」准确的含义是什么？",o:["输入段不喂给模型","输入段被随机掩码","输入段用更低的学习率","输入段照样喂进模型（它们是条件），但那些位置上的预测不计入损失 —— 喂了但不考"],a:3,w:"⇒ 实现上就是把这些位置的标签设成忽略值（PyTorch 里通常是 −100）。而结束符一定要算损失，否则模型学不会什么时候停。"});

KP("38 · ⭐ 指令微调：SFT 的那个子类",function(){

  note("★★ 所以三个词的层级是：微调 ⊃ SFT ⊃ 指令微调",640,356,"v");
  note("⚠ 这三个词在文献里常被混着用 —— 但这里讲者把它们分清楚了",640,380,"r");},"<b>三个很容易混的词，而讲者在这里把它们的从属关系说清楚了。</b><br><b>讲者的话</b>：<b>「<u>所以我刚才跟你们说的是，SFT 可以用来调你自己感兴趣的那个任务，但同时，它也是你每天在用的那些 LLM 的训练流程里的主要阶段之一。而这个从「模型是一个好的语言表示」到「一个有用的助手」的转变，是 SFT 的一个子类，叫做 instruction tuning。所以 instruction tuning 来自于我们想让模型去回应指令这件事</u>。」</b><br><b>★★★ 把这三个词的层级摆清楚</b>：<b>⇒ <u>fine tuning（微调）</u>：任何「在已训权重上继续训」的做法。</b><b>⇒ <u>SFT（有监督微调）</u>：微调里<u>用「输入—输出对」做监督</u>的那一类。</b><b>⇒ <u>instruction tuning（指令微调）</u>：SFT 里<u>那些对儿是「指令—回答」</u>的那一类。</b><br><b>★★ 为什么要单独给它一个名字：<u>因为它的目的和别的 SFT 不一样</u></b>：<b>⇒ 一般的 SFT 是让模型<u>学会一个任务</u>（比如判断情感）。</b><b>⇒ 指令微调是让模型<u>学会「听从任意指令」这个元能力</u>。</b><br><b>⇒ <u>也就是说：它教的不是某个任务，而是「怎么接受任务」</u>。</b><br><b>⚠ 这也解释了为什么指令微调的数据要「<u>什么任务都有一点</u>」—— <u>下一镜就是这件事</u>。</b>");

  note("⇒ 「data mixture（数据混合）」这个词从这里起会反复出现",640,384,"v");},"<b>几个具体的类别，而「ground truth」这个词在这里的含义值得留意。</b><br><b>讲者的话</b>：<b>「<u>所以你可以把这件事分成好几个类别。所以这里，我们列出一些对 LLM 的用户可能有帮助的类别。比如说，写故事。你有兴趣写一个故事。你给它一组指令，然后你有一个附在它上面的 ground truth。其它例子包括写诗、生成列表、做解释，还有更多，它们都是 SFT 数据混合的一部分</u>。」</b><br><b>★★★ 「<u>ground truth</u>」在这里不是通常那个意思</b>：<b>⇒ 通常它指「<u>唯一正确的答案</u>」（比如这张图是不是猫）。</b><b>⇒ 而这里它指的是「<u>一个人写出来的、我们认可的回答</u>」。</b><b>⇒ <u>它一点都不唯一 —— 另一个人会写出完全不同但同样好的一篇</u>。</b><br><b>★★ 这件事会一路影响到后面</b>：<b>⇒ 训练时：<u>模型被要求去逼近「某一个人的写法」</u>。</b><b>⇒ 评估时：<u>你没法用「和标准答案一样不一样」来打分</u>。</b><br><b>⇒ <u>所以 SFT 的损失函数其实是在做一件有点粗糙的事：让模型去复现一个任意选定的样本</u>。</b><br><b>⇒ <u>而下一讲的偏好调优，正是为了绕开这个粗糙 —— 改成「两个里挑一个」</u>。</b><br><b>⚠ 「<u>data mixture（数据混合）</u>」这个词从这里起会反复出现：<u>它指「各类数据按什么比例掺在一起」，而那个比例本身是一个重要的设计决定</u>。</b>");

  note("★★ 这「稍微加快了这类数据集的策展」—— 而讲者强调：如今「不只是人生成的」，你可以有一些帮手",640,380,"g");},"<b>如今的做法，而它让这件事从「写」变成了「审」。</b><br><b>讲者的话</b>：<b>「<u>但如今，你可以用这些已经训练好的 LLM 来生成这样的数据。所以典型地，当你有一个非常能打的大模型时，你可以把这样的指令喂给它，采样出一些生成的输出，然后让一个人、或者另一个 LLM 去审查质量。所以这是一件稍微加快了这类数据集策展的事。所以我只是想强调这个事实：如今它不只是人生成的，你可以有一些帮手</u>。」</b><br><b>★★★ 这个转变的实质是：<u>人的角色从「生产者」变成了「验收者」</u></b>：<b>⇒ <u>写</u>一个好回答：慢、贵、需要专业写手。</b><b>⇒ <u>审</u>一个回答好不好：<u>快得多，门槛也低得多</u>。</b><b>⇒ <u>而这个不对称，正是整个合成数据流水线成立的基础</u>。</b><br><b>★★ 但这里有一个必须知道的风险：<u>模型崩塌（model collapse）</u></b>：<b>⇒ 用模型生成的数据训下一代模型 ⇒ <u>分布会一代代收窄</u>。</b><b>⇒ <u>罕见的表达、少数的写法会逐渐消失</u>。</b><br><b>⇒ <u>所以实践中几乎总是「合成数据 + 人工审核 + 一定比例的真人数据」混着用，而不是纯合成</u>。</b><br><b>⇒ <u>讲者说的那个「让一个人或另一个 LLM 去审」，正是在堵这个口子</u>。</b><br><b>⚠ 而「<u>让另一个 LLM 去审</u>」这件事本身是一个很大的话题：<u>它叫 LLM-as-a-judge，而它的可靠性正是后面「评估为什么难」要讨论的</u>。</b>");
  SUM(0,39,{h:"⭐⭐ 指令数据从哪来",k:"<b>数据混合包含「以指令为导向的数据」—— 用户在推理时可能会要求的那些任务，讲者把它们归在 assistant dialogues（助手对话）这个类别下</b>。最初：<b>我提到的所有这些最初都是人写的 —— 你有人们收集起来的那一大堆指令，还有「专家语言学家」，他们有一整套「怎么写出最好的回答」的规范：要流畅、要有帮助，以及一切「以最大化你作为用户的满意度为导向」的东西</b>。如今：<b>你可以用这些已经训练好的 LLM 来生成这样的数据 —— 拿一个非常能打的大模型，把指令喂给它、采样出一些生成的输出，然后让「一个人、或者另一个 LLM」去审查质量 ⇒ 这稍微加快了这类数据集的策展；如今它不只是人生成的，你可以有一些帮手</b>。",m:"★★★ 请盯住「最大化你作为用户的满意度」：<b>它优化的不是「正确性」，而是「用户的满意度」—— 而这两者在很多时候并不一致</b> ⇒ 这个目标选择会在 93:55 结出果实：<b>一个详细、可操作的回答会让用户觉得有帮助，但它是不是事实正确的，用户根本判断不了 ⇒ 这条训练目标从一开始就把「让人满意」排在了「说得对」前面，而今天模型的「讨好倾向（sycophancy）」正是从这里长出来的</b>。⚠ 「专家语言学家」这个细节说明<b>早期指令数据是由职业写手按手册写的、而不是随便众包的 —— 这也是它贵的原因</b>。",w:"★★★ 「模型帮着写」这个转变的实质是：<b>人的角色从「生产者」变成了「验收者」—— 写一个好回答慢、贵、需要专业写手；审一个回答好不好快得多、门槛也低得多，而这个不对称正是整个合成数据流水线成立的基础</b>。但有一个必须知道的风险：<b>模型崩塌（model collapse）—— 用模型生成的数据训下一代模型，分布会一代代收窄，罕见的表达、少数的写法会逐渐消失 ⇒ 实践中几乎总是「合成数据 + 人工审核 + 一定比例的真人数据」混着用，而不是纯合成</b>，<b>讲者说的那个「让一个人或另一个 LLM 去审」正是在堵这个口子</b>；而「让另一个 LLM 去审」本身是个大话题：<b>它叫 LLM-as-a-judge，它的可靠性正是后面「评估为什么难」要讨论的</b>。",r:"⇒ 那个归类的依据不是「任务的学术分类」而是「用户真的会问什么」：<b>所以这块数据的设计本质上是在预测用户的需求分布 —— 你预测错了，模型就会在真实使用中露出短板</b>；这正是 81:27 那个讨论的伏笔（<b>SFT 数据的分布和真实推理时的分布要对得上，对不上则模型在那片区域泛化不动</b>）⇒ <b>「数据混合」不是一个数据工程问题，它是一个产品问题</b>。⚠ 对你的课题很实用：<b>你的微调数据应该照着「你真正会怎么用它」去造，而不是照着「有什么现成数据集」去凑</b>。"});
  QUIZ(0,39,{t:"让已有的大模型来生成指令数据，为什么划算、又有什么风险？",o:["划算是因为生成的数据更正确","划算是因为更便宜，没有风险","划算是因为「审」比「写」快得多（人从生产者变成验收者）；风险是模型崩塌 —— 分布会一代代收窄","划算是因为不需要人参与"],a:2,w:"⇒ 所以实践中是「合成 + 人工审核 + 一定比例真人数据」混着用。而「让另一个 LLM 去审」本身叫 LLM-as-a-judge，它的可靠性是后面要讨论的。"});

  note("★★ 「helpful but also harmless」—— 这组词是整个对齐领域的标准说法",640,380,"r");},"<b>一组会反复出现的词，而它们之间是有张力的。</b><br><b>讲者的话</b>：<b>「<u>而除了所有那些你关心的类别 —— 典型地，数学、或者你怎么写一个证明、事情之间怎么承接，或者代码、高质量的代码库 —— 你还有一些其它方面也非常重要，就是当你把这样一个产品发布给更广的人群时，那些被归在「安全」这把伞底下的东西。所以你想要你的模型有帮助，但同时也无害</u>。」</b><br><b>★★★ 「<u>helpful、harmless</u>」这组词是对齐领域的标准说法（<u>常见的是三个 H：helpful、harmless、honest</u>）</b>：<b>⇒ 而请注意：<u>这三者之间是有张力的</u>。</b><b>⇒ 最 helpful 的回答<u>未必 harmless</u>（比如教人做危险的事）。</b><b>⇒ 最 harmless 的回答<u>往往不 helpful</u>（什么都拒答最安全）。</b><br><b>★★ 所以安全这件事不是「加一个过滤器」，<u>它是在一组互相冲突的目标之间选一个点</u></b>：<b>⇒ <u>而选在哪里，是一个产品决定，不是一个技术决定</u>。</b><br><b>⇒ <u>讲者在 95:30 会明说这一点：拒答「可能最终是一个有意为之的产品决策」</u>。</b><br><b>⚠ 还要注意这一段的位置：<u>安全是作为「数据混合的一部分」被讲的，而不是作为一个独立的模块</u>。</b><b>⇒ <u>也就是说：安全是训出来的，不是外挂上去的</u>。</b>");

  stack(640,218,["数据混合里常常有一个子集，「强制模型的行为」不要重复它在预训练语料里见过的有害内容","⇒ 所以它会包含一些「拒绝某些用户 prompt」的技术","⇒ 你可能自己试过今天 LLM 的边界：提交可能导向「被认为不好的东西」的查询","⇒ 它就会说：好的，抱歉，我不能回答这个"],760,32,6);
  note("★★ 而这句「抱歉我不能回答」「可以用正则做，但非常少这么做 —— 因为那不可扩展」",640,380,"r");},"<b>这一镜回答了一个很多人想当然的问题：拒答到底是怎么做的。</b><br><b>讲者的话</b>：<b>「<u>所以你在数据混合里常常也有一个子集，它强制模型的行为不要去重复它在预训练语料里可能见过的那些有害内容。所以它会包含一些可能会拒绝某些用户 prompt 的技术。所以你可能自己试过今天一个 LLM 的边界。如果你提交的查询可能导向某种被认为不好的东西，它就会说：好的，抱歉，我不能回答这个。而这句「抱歉我不能回答」可以通过正则来做，但非常少这么做，因为那不可扩展</u>。」</b><br><b>★★★ 「<u>可以用正则，但不可扩展</u>」这句话值得展开</b>：<b>⇒ 正则是「<u>匹配关键词就拦下</u>」。</b><b>⇒ 它的问题不是<u>做不到</u>，而是<u>穷举不完</u>：<u>有害的表达方式是无限的</u>。</b><b>⇒ 而且它<u>完全不理解上下文</u> —— <u>同一个词在医学语境和攻击语境里意思完全不同</u>。</b><br><b>★★ 所以人们选择的做法是：<u>把这个性质「嵌进模型里」</u></b>：<b>⇒ 在数据混合里放进<u>「有害提问 → 得体拒答」的样本对</u>。</b><b>⇒ 让模型<u>自己学会「什么样的请求该拒</u>」。</b><br><b>⇒ <u>于是拒答能力就有了泛化性：没见过的新式有害提问，它也可能认得出来</u>。</b><br><b>⇒ <u>代价是：它也会误拒一些无害的问题 —— 而那正是 95:30 那个「用户不喜欢被拒」的来源</u>。</b><br><b>⚠ 这一条对你理解今天的产品很有用：<u>你看到的拒答绝大多数不是规则，是模型自己的判断</u>。</b>");

  note("⚠ 讲者问：关于数据有任何问题吗？—— 接下来是两个很好的追问",640,364,"d");},"<b>一句范围声明，而它对你自己做微调很有用。</b><br><b>讲者的话</b>：<b>「<u>但我这里列的，是外面那些以当通用助手为目标的 LLM 通常会收集的东西。它们往往就是那些被拿来训练的通用任务。关于数据有任何问题吗？</u>」</b><br><b>★★★ 这句范围声明的言下之意是：<u>这张清单不是给你照抄的</u></b>：<b>⇒ 它是「<u>通用助手</u>」这个产品定位下的数据混合。</b><b>⇒ 而<u>你的定位不同，混合就该不同</u>。</b><br><b>★★ 举个具体的例子</b>：<b>⇒ 如果你做的是一个<u>内部的代码审查助手</u>：<u>写诗、写故事那一块可以整块去掉</u>。</b><b>⇒ 但<u>拒答和 hedging 那一块可能仍然要留</u> —— <u>因为你仍然不希望它编造不存在的 API</u>。</b><br><b>⇒ <u>所以「数据混合」的设计，起点永远是「这个模型会被谁、在什么场景下用」</u>。</b><br><b>★★★ 把这一整段压成一句：<u>你想要模型有的每一种行为，都必须在数据混合里有对应的一块</u></b>：<b>⇒ <u>想让它答得好 ⇒ 放指令数据</u>。</b><b>⇒ <u>想让它会拒绝 ⇒ 放拒答数据</u>。</b><b>⇒ <u>想让它不说死 ⇒ 放 hedging 数据</u>。</b><br><b>⚠ 反过来也成立：<u>你没放进去的行为，它不会凭空有</u>。</b>");
  SUM(0,40,{h:"⭐⭐ 安全也在数据混合里",k:"<b>除了你关心的那些类别（数学、怎么写一个证明、事情之间怎么承接、高质量的代码库），当你把产品发布给更广的人群时，还有一些归在「安全」这把伞底下的方面 —— 你想要你的模型有帮助（helpful），但同时也无害（harmless）</b>。做法：<b>数据混合里常常有一个子集，强制模型的行为不要重复它在预训练语料里见过的有害内容 ⇒ 它包含一些「拒绝某些用户 prompt」的技术；你提交可能导向不好的东西的查询，它会说「抱歉，我不能回答这个」—— 而这句话「可以通过正则来做，但非常少这么做，因为那不可扩展」，人们把这个性质「嵌进模型里」</b>。第二类：<b>hedging —— 把输出做细微化处理，以免下那种全称的断言</b>。收口：<b>我这里列的是「外面那些以当通用助手为目标的 LLM」通常会收集的东西</b>。",m:"★★★ 「helpful、harmless」是对齐领域的标准说法（<b>常见的是三个 H：helpful、harmless、honest</b>），而<b>这三者之间是有张力的：最 helpful 的回答未必 harmless（比如教人做危险的事），最 harmless 的回答往往不 helpful（什么都拒答最安全）</b> ⇒ <b>所以安全不是「加一个过滤器」，而是在一组互相冲突的目标之间选一个点 —— 而选在哪里是一个产品决定，不是技术决定</b>（讲者在 95:30 会明说：拒答「可能最终是一个有意为之的产品决策」）。⚠ 还要注意这一段的位置：<b>安全是作为「数据混合的一部分」被讲的，而不是一个独立模块 —— 安全是训出来的，不是外挂上去的</b>。",w:"★★★ 「可以用正则，但不可扩展」值得展开：<b>正则是「匹配关键词就拦下」，它的问题不是做不到而是穷举不完（有害的表达方式是无限的），而且它完全不理解上下文 —— 同一个词在医学语境和攻击语境里意思完全不同</b> ⇒ 所以人们的做法是<b>把这个性质嵌进模型里：在数据混合里放进「有害提问 → 得体拒答」的样本对，让模型自己学会什么样的请求该拒 ⇒ 于是拒答能力有了泛化性，没见过的新式有害提问它也可能认得出来；代价是它也会误拒一些无害的问题 —— 而那正是 95:30「用户不喜欢被拒」的来源</b>。⚠ <b>你看到的拒答绝大多数不是规则，是模型自己的判断</b>。",r:"⇒ <b>hedging</b> 就是你一定见过的那种语气（<b>「一般来说……」「这取决于具体情况……」「建议咨询专业人士……」</b>）：<b>它的功能是在不确定时不把话说死 —— 一个斩钉截铁但错误的回答，危害远大于一个留了余地但错误的回答，因为前者会让用户直接照做 ⇒ hedging 是在为「模型可能是错的」买保险</b>；但副作用明显：<b>过度 hedging 让回答毫无信息量，而用户会对这类回答打低分 —— 于是它成了评估里的一个偏差来源</b>（讲者把它叫「现象」而不是「技术」，<b>因为它不是被显式编程的，而是从数据里长出来的一种语气</b>）。⇒ 整段压成一句：<b>你想要模型有的每一种行为，都必须在数据混合里有对应的一块 —— 想让它答得好就放指令数据，想让它会拒绝就放拒答数据，想让它不说死就放 hedging 数据；反过来也成立：你没放进去的行为，它不会凭空有</b>。而那句范围声明的言下之意是<b>这张清单不是给你照抄的 —— 比如一个内部的代码审查助手可以把写诗写故事整块去掉，但拒答和 hedging 可能仍要留（你仍然不希望它编造不存在的 API）</b>。"});
  QUIZ(0,40,{t:"LLM 说「抱歉，我不能回答这个」，是怎么实现的？",o:["由一个独立的安全模型在输出后过滤","把这个性质「嵌进模型里」—— 在数据混合里放进「有害提问 → 得体拒答」的样本对，让模型自己学会该拒什么","用正则匹配关键词拦下","靠系统提示里的规则"],a:1,w:"⇒ 正则不是做不到，而是穷举不完、且不懂上下文（同一个词在医学和攻击语境里意思完全不同）。代价是模型也会误拒无害的问题。"});

  note("★★ 「概念本身才是关键的学习」—— 这句话值得你在设计微调数据时反复想",640,380,"r");},"<b>讲者的评价里有一个很值得咀嚼的说法：学到的是「概念本身」。</b><br><b>讲者的话</b>：<b>「<u>所以你可以有 —— 我觉得你提到的那个例子，是 LLM 适应自然语言这种神奇能力的一个很好的例子。而这一切都和它过去见过的那种分布、以及我们教它的东西有关。所以我觉得「写故事」这个概念本身，才是模型学到的那个关键的东西，而它接着就能泛化</u>。」</b><br><b>★★★ 「<u>学到的是概念本身</u>」这句话的实际含义</b>：<b>⇒ 模型从那些样本里学到的<u>不是「这些具体的故事」</u>。</b><b>⇒ 而是「<u>当有人说『写个故事』时，接下来应该发生什么</u>」。</b><b>⇒ <u>也就是一个「指令 → 行为」的映射，而不是一堆「输入 → 输出」的记忆</u>。</b><br><b>★★ 这个区别可以用一个检验来看</b>：<b>⇒ 如果学的是<u>记忆</u> ⇒ 换个说法它就不认识了。</b><b>⇒ 如果学的是<u>概念</u> ⇒ <u>换一百种说法它都认识</u>。</b><br><b>⇒ <u>而后者正是「适应自然语言的神奇能力」这句话指的东西</u>。</b><br><b>⇒ <u>这也是为什么指令数据的「措辞多样性」比「数量」更重要</u>。</b><br><b>⚠ 讲者用了「<u>神奇（magical）</u>」这个词 —— <u>而他接着给了两个来源（过去见过的分布 + 我们教的东西）</u>。</b><b>⇒ <u>所以他说的不是「不可解释」，而是「效果超出直觉」</u>。</b>");
  SUM(0,41,{h:"⭐ 含糊的例子怎么泛化",k:"追问：<b>写故事那个例子并没说清楚这个故事该是关于哪一种诗，所以它可能是含糊的 —— 那它怎么泛化？</b> 答：<b>我们依赖的是「模型在预训练时积累下来的知识」，好让它能泛化到被喂过的那些例子之外 —— 比如现在你有一个关于诗歌的故事，而从预训练里它知道外面存在的所有各种各样的诗 ⇒ 所以在 SFT 时拟合过这样一个例子之后，你可以给这个 prompt 更多的细节，而模型有能力把故事的生成相对于那些别的属性泛化开来</b>。评价：<b>这是 LLM「适应自然语言这种神奇能力」的一个很好的例子；而这一切都和「它过去见过的那种分布」以及「我们教它的东西」有关 ⇒ 「写故事」这个概念「本身」才是模型学到的那个关键的东西，而它接着就能泛化出去</b>。",m:"★★★ 那个分工可以写成一句话：<b>预训练提供了「关于世界和语言的一切」，SFT 只提供「该用什么形式把它交出来」</b> ⇒ 所以那个疑问的前提就错了：<b>模型不需要从那几千条样本里学会「什么是十四行诗」—— 它早就知道了；它从 SFT 里学的只是「当有人要我写诗时，我应该真的去写一首，而不是接着聊诗是什么」，而这个行为确实只需要几千个例子就能学会，因为它是一个很简单的行为模式</b> ⇒ <b>SFT 几乎不增加模型的能力上限，它只是把已有的能力「接出来」</b>；⚠ 反过来也成立：<b>预训练里没有的东西 SFT 补不上 —— 你的领域知识如果不在预训练数据里，微调一万条也教不会它</b>。",w:"★★★ 「学到的是概念本身」的实际含义：<b>模型学到的不是「这些具体的故事」，而是「当有人说『写个故事』时，接下来应该发生什么」—— 是一个「指令 → 行为」的映射，而不是一堆「输入 → 输出」的记忆</b> ⇒ 一个检验：<b>如果学的是记忆，换个说法它就不认识了；如果学的是概念，换一百种说法它都认识 —— 而后者正是「适应自然语言的神奇能力」指的东西 ⇒ 这也是为什么指令数据的「措辞多样性」比「数量」更重要</b>。⚠ 讲者用了「神奇」这个词，<b>但他接着给了两个来源（过去见过的分布 + 我们教的东西）—— 所以他说的不是「不可解释」，而是「效果超出直觉」</b>。",r:"⇒ 泛化在实践中的样子就是「把两件已知的事拼起来」：<b>训练时见过「写一个故事」+ 一篇人写的故事；用的时候是「写一个十四行诗风格的侦探故事，发生在雨夜」—— 模型没见过这个组合，但它见过「写故事」这个动作，也见过「十四行诗」「侦探」「雨夜」这些概念</b> ⇒ <b>它要做的只是拼起来，而这正是语言模型最擅长的事：注意力机制本来就是按内容去组合信息的，组合性是它结构上自带的能力、不是 SFT 教的 ⇒ SFT 只需要「打开这个开关」，不需要「造出这个能力」</b>。⚠ 一条实用建议：<b>微调样本要覆盖「行为的种类」，不需要覆盖「内容的组合」—— 前者是有限的，后者是无穷的，而你只需要管前者</b>。"});
  QUIZ(0,41,{t:"SFT 只有几千条样本，模型凭什么能应付无穷多种指令？",o:["因为指令微调用了更大的学习率","因为样本被重复了很多遍","因为泛化来自预训练 —— SFT 只教「该用什么形式交出来」，内容是预训练早就有的","因为模型记住了所有样本"],a:2,w:"⇒ 反过来也成立：预训练里没有的东西，SFT 补不上。而数据设计上要覆盖「行为的种类」，不是「内容的组合」。"});

  SUM(0,42,{h:"⭐⭐ SFT 的数量级",k:"追问二：<b>这个「后训练」就是人们说的「被对齐了」吗？⇒ 你走在我前面了，再过几张幻灯我们就会讲到它</b>。数量级：<b>GPT-3 和 Llama 3 的论文在指令微调这边不给 token 数，而是给「样本条数」—— GPT-3 约 1.3 万条，Llama 3 是 1000 万条</b>；<b>假设每条样本约 1000 个 token，乘起来就看到：用于 SFT 的数据集规模比用于预训练的低「好几个数量级」</b>。心智模型：<b>预训练是大量的数据，你想学的是「关于语言的一般特征」；而 SFT 更确切地说是把「模型的目标」对齐到「适配你的任务」上 ⇒ 典型地是非常高质量的数据集，而且在数量上更精简、更精确</b>。",m:"★★★ 单位为什么会换，这件事本身说明两个阶段性质不同：<b>预训练的数据是「一片连续的文本流」⇒ 自然单位是 token；SFT 的数据是「一条一条独立的样本」⇒ 自然单位是条数</b>。两边并排：<b>GPT-3 预训练 3000 亿 token、SFT 约 1300 万 token ⇒ 差约 2 万倍；Llama 3 预训练 15 万亿、SFT 约 100 亿 ⇒ 差约 1500 倍</b> ⇒ 直接推论：<b>SFT 几乎不可能改变模型的知识 —— 你用占总量千分之一的数据再训一遍，它能改变的只是输出的「风格和行为」，改不动里面存的东西（这和「泛化来自预训练」是同一件事的两种说法）</b>。",w:"★★★ 请注意那个动词是「对齐目标」而不是「增加能力」：<b>模型的能力在预训练结束时就基本定了，SFT 改的是模型把这些能力「朝哪个方向」使</b> ⇒ 一个好比喻：<b>预训练像是把一个人培养成博学的人，SFT 像是教他怎么当一个好的咨询顾问 —— 后者不增加他的学识，只改变他「被问到时怎么应对」⇒ 这也是为什么 SFT 的数据可以少几千倍：改变行为比灌输知识便宜得多</b>。还有一个对比值得记：<b>预训练要「多」（脏一点的数据也有用，量压倒质），SFT 要「好」（一条坏样本就能教坏一个行为，质压倒量）—— 而这正是下一段「SFT 难在哪」的第一条</b>。",r:"⇒ 先把 alignment 的答案放在这里（<b>讲者在 96:33 给的</b>）：<b>alignment = 微调（SFT）+ 偏好调优（preference tuning），也就是「预训练之后的那两步合起来」</b>；而「post-training（后训练）」在文献里稍宽一点：<b>它泛指「预训练结束之后做的一切」⇒ post-training ⊇ alignment（还能包括 mid-training、蒸馏、量化等）—— 这两个词常被混用，而讲者这里给的是比较严格的那个说法</b>。⇒ 1.3 万 → 1000 万这个跨度也值得看：<b>GPT-3 时代（2020）指令微调还是小规模手工活，Llama 3 时代（2024）已是一条有合成数据参与的大规模流水线 —— 四年涨了近一千倍，而 1000 万条绝不可能全是人写的，所以这个数字本身就是「合成数据已是主流」的证据</b>。⇒ 这个悬殊对你是好消息：<b>微调是你真正负担得起的那一步 —— 预训练要几千万美元，而在一个开源模型上做任务特化的微调，几百美元就能起步</b>。"});

  SUM(0,44,{h:"⭐⭐ SFT 难在哪",k:"<b>我们谈了 SFT 所有那些好的方面，现在讲什么会让它变难</b>。第一点：<b>当我们有这些 SFT 的数据混合时，我们需要「高质量的数据」—— 而说高质量数据时往往意味着「有人在环里」，你得确保它符合所有那些规则、以及用户会在意的所有那些特征，所以典型地非常费人力</b>；<b>最初那些模型几乎全是人做的，现在可能是「人和生成」的混合；而有一件好事是那些数据集「是被复用的」—— 这是一件你做一次的工作，而且可以随时间补充；但它在时间和资源上仍然非常昂贵</b>。第二点：<b>你那些 SFT 数据集的「分布」和「真实推理时的分布」对不对得上 —— 那个「特定种类的诗」的例子里 prompt 分布「看起来足够接近」，泛化做得出来；但要一个「以某些电影情节为背景」的故事，它和教科书里的故事不一样 ⇒ 这可能就「稍微偏出分布了」，而它可能就难以泛化 ⇒ 所以 prompt 的分布非常重要，把它和目标任务对齐是值得做的事</b>。",m:"★★★ 他给「高质量」下的是一个操作性定义：<b>不是「没有错别字」，而是「符合所有那些规则、以及用户会在意的所有那些特征」—— 质量是相对于一套「你希望模型有的行为规范」来定义的</b> ⇒ 这就是人必须在环里的原因：<b>「符合规范」没法用一个自动指标判定；你能自动检查的只有格式、长度、是否有敏感词，而「这个回答是不是一个好助手会给的」只有人能判断 ⇒ 这条成本是结构性的，它不会因为算力变便宜而降低</b>；⚠ <b>这是 SFT 和预训练在成本结构上最大的差别：预训练的成本是算力（会越来越便宜），SFT 的成本是人力（不会）</b>。",w:"★★★ 「数据集被复用」改变的是成本的「形状」：<b>它是一笔一次性投入，不是每次训练都要再付一遍的钱 ⇒ 可以在很多次训练、很多代模型之间摊薄</b> ⇒ 这解释了一个现象：<b>为什么大厂的指令数据集是它们最核心的资产之一 —— 模型权重会一代代被淘汰，但那套人工策展的数据会一直用下去并不断追加 ⇒ 真正积累下来的不是模型，是数据；这也是为什么开源模型最难追赶的往往不是架构，是这部分数据</b>。⚠ 但讲者没把这件事说轻（<b>「仍然非常昂贵」</b>），<b>而正是这个昂贵引出了后面 LoRA 那一段 —— 不过注意：LoRA 省的是算力，不是数据的钱</b>。",r:"★★★ 他把上一个追问的答案「加了一个边界」：<b>之前是「靠预训练知识能泛化」，这里补的是「但只在足够接近的时候」</b> ⇒ 「足够接近」怎么判断：<b>「写故事」→「写一首特定体裁的诗化故事」换的是属性、行为没变 ⇒ 接近；「写教科书式的故事」→「写电影情节式的故事」换的是整个文体和结构 ⇒ 可能就远了 ⇒ 所以「分布」说的不是词汇，而是「任务的形状」</b>。⇒ 而他强调的是「prompt 的分布」而不是回答的分布：<b>人们做微调数据时通常把全部注意力放在「回答写得好不好」上，而「问题问得像不像真实用户会问的」常被忽略 —— 但后者同样重要甚至更重要，因为推理时你控制不了用户怎么问：如果你的训练 prompt 都是工整的书面句、而用户打的是碎片化短语，模型就会在最常见的输入上表现最差</b> ⇒ <b>可操作的检查：把你的训练 prompt 和真实会输入的 prompt 摆在一起看，不像就先改数据、再谈模型；而学术数据集的 prompt 往往比真实使用整齐得多</b>。"});
  QUIZ(0,44,{t:"SFT 的两个主要难点是什么？",o:["① 需要高质量数据而「高质量」只有人能判断（成本是人力，不会随算力变便宜）② 训练 prompt 的分布要和真实推理时的分布对得上","算力太贵、训练太慢","学习率难调、batch 难选","模型太大、显存不够"],a:0,w:"⇒ 好消息是数据集可以被复用（一次性投入，跨代摊薄）—— 所以真正积累下来的不是模型，是数据。"});
});

  note("★★ 「味道一样、用词不同」这个描述，正好对应「语义被记住、表层被重采样」",640,380,"v");},"<b>「味道一样、用词不同」这个描述，正好对应一个很具体的机制。</b><br><b>讲者的话</b>：<b>「<u>它也许会有同样的那种味道，但不是逐字一样。然后那个故事的味道，如果你给的是完全一样的 prompt，可能是一样的。这取决于它在预训练时见过什么。但对，所以答案是，如果我必须对那个具体的例子给一个猜测，它可能是同样的味道，但肯定不是同样的用词</u>。」</b><br><b>★★★ 为什么会是这种「<u>味道一样、用词不同</u>」的形态</b>：<b>⇒ 采样是<u>逐 token</u>做的，而每一步都有随机性。</b><b>⇒ 但那个概率分布<u>本身是被 prompt 牢牢约束住的</u>。</b><b>⇒ <u>所以「选哪个词」是随机的，而「大致往哪个方向写」是确定的</u>。</b><br><b>★★ 这就是你在实践中会看到的样子</b>：<b>⇒ 同一个 prompt 问十次 ⇒ <u>十篇不同的文字</u>。</b><b>⇒ <u>但结构、立场、要点往往高度一致</u>。</b><br><b>⇒ <u>也就是说：随机性作用在表层，而不在内容的骨架上</u>。</b><br><b>⚠ 这件事对评估有一个很实际的后果：<u>你不能只采一次样就下结论</u>。</b><b>⇒ <u>要判断一个模型在某个 prompt 上的表现，得采多次看分布 —— 而这也让评估更贵</u>。</b>");

  SUM(0,47,{h:"⭐⭐ 数据混合与两个预告",k:"<b>这是一个非常切题的问题，因为它触到了「泛化」这个话题 ⇒ 数据混合「关系非常大」</b>；而原则是：<b>让那些点在「分布空间里足够稀疏」，好把「它需要学的那个要领」给到模型，而不是「一遍又一遍地重复同一个故事」—— 这件事和泛化能力关系很大</b>。预告一：<b>接下来要看「你怎么评估这样的模型」—— 你作为用户对「一个模型有多有帮助」的那个感觉往往是「主观的」，所以「你怎么能给它放上一个数字」将是一个关键的关注点</b>。预告二：<b>还会看到怎么让计算不那么昂贵 —— Afshin 讲的是训练阶段的优化，而现在我们处在微调阶段，也许可以再往前走一步，看看能做出什么样的「简化假设」</b>。",m:"★★★ 「泛化」在这一段出现了四次，合起来说的是同一件事：<b>76:17 泛化来自预训练的知识；81:27 分布差太远就泛化不动；85:03 更多数据能让它泛化得更多；85:34 数据混合关系非常大</b> ⇒ <b>泛化不是模型的属性，是「数据覆盖」的属性 —— 你覆盖到的区域它表现好，没覆盖到、而预训练也没帮上忙的区域它表现差 ⇒ 「这个模型泛化能力强不强」这个问题问得不对，该问的是「它在你关心的那片分布上有没有被覆盖到」</b>。",w:"★★★ 「足够稀疏」说的是一件很具体的事：<b>假设你有 1000 条预算 —— 选择 A 是同一类故事的 1000 个相近变体，选择 B 是 1000 个互相差很远的例子；B 覆盖的分布区域大得多，而模型学到的是「这个任务的边界在哪」</b> ⇒ 而 A 的后果不只是覆盖少：<b>重复的样本会让模型把那个具体写法当成「正确答案」，于是它在别的写法上反而更差 —— 重复的数据不是「没用」，是「有害」</b> ⇒ <b>实用检查：造微调数据时，先看「最相似的那一对样本有多像」，而不是先看「一共有多少条」；这也是为什么指令数据集常要做去重和多样性筛选 —— 有时候删掉一半样本，效果反而更好</b>。",r:"★★★ 「简化假设」这个词用得非常准：<b>上半场那些技巧（并行、ZeRO、FlashAttention）一个假设都没做 —— 它们是精确的；而 LoRA 假设「微调带来的那个权重改变量是低秩的」，这是一个关于「问题本身」的假设，不是一个关于「怎么算」的技巧</b> ⇒ 这也是为什么它只能用在微调阶段：<b>预训练要让权重发生巨大的改变 ⇒ 低秩假设不成立；微调只是微调 ⇒ 改变量小而且有结构 ⇒ 假设站得住</b> ⇒ <b>讲者说的那个「再往前走一步」，指的正是「可以开始做假设了」；而这也给了你一条判断：任何基于假设的加速，都必须问「我的场景满不满足这个假设」</b>。⇒ 评估那句话的结构也值得抽出来：<b>你真正在意的量（有多有帮助）是主观的 ⇒ 没有客观尺度 ⇒ 没法优化也没法比较 ⇒ 于是人们永远在找「代理指标」，而代理指标一旦被用来优化就会偏离它要代理的东西</b>。"});
