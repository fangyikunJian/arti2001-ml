  note("★★ 并且要「在『有没有在测试任务上训练』这件事上确保对等（parity）」",640,380,"r");},"<b>benchmark 自己就提供了辅助训练集 —— 而这件事很多人没注意过。</b><br><b>讲者的话</b>：<b>「<u>而这就是为什么当你去查那类 benchmark 时，你会看到有一些所谓的「辅助训练」集合，它们可以被用来让模型在同一个领域上被训练。而这样一来，它就使得在那个具体能力上比较模型成为可能。所以这篇论文想在这里传达的是：如果你想把模型互相比较，你需要去比较它被训练的那个训练混合，然后在「有没有在测试任务上训练」这件事上确保对等</u>。」</b><br><b>★★★ 「<u>辅助训练集</u>」这个设计本来是好意</b>：<b>⇒ benchmark 的作者想让大家<u>站在同一条起跑线上</u>。</b><b>⇒ 所以他们提供一份<u>同领域但不重叠</u>的训练数据。</b><b>⇒ <u>大家都用它训一遍，再比，就公平了</u>。</b><br><b>★★ 但问题在于：<u>没有人强制你用它，也没有人强制你只用它</u></b>：<b>⇒ 一家公司可能<u>用了官方的辅助集</u>。</b><b>⇒ 另一家可能<u>自己造了一百倍的同类数据</u>。</b><b>⇒ <u>第三家可能一点都没用</u>。</b><br><b>⇒ <u>于是三个分数根本不在同一个坐标系里 —— 而报告上它们是并排的三个数字</u>。</b><br><b>⚠ 「<u>对等（parity）</u>」这个词是这篇论文给出的操作性建议：<u>不是要求大家都不训，而是要求「都训或都不训」</u>。</b>");

  note("⚠ 这一段是整个评估讨论的第一刀 —— 后面还有第二刀（Chatbot Arena）",640,378,"r");},"<b>结论用了一个很重的词：内在价值。</b><br><b>讲者的话</b>：<b>「<u>所以你需要确保，比如说，两边都在测试任务上训练过、或者都没有。而如果是一边训了、另一边没训，那把它们拿来比较可能就不是一件好事。它并不会给你这个模型的内在价值。所以对，这是这里一个很有意思的现象。有任何问题吗？好的。很好。那我们可以继续了</u>。」</b><br><b>★★★ 「<u>内在价值（intrinsic value）</u>」这个词值得停一下</b>：<b>⇒ 它预设了一件事：<u>模型有一个「内在的好坏」，和你怎么测无关</u>。</b><b>⇒ 而 benchmark 想量的就是这个东西。</b><b>⇒ <u>但这一段说明：benchmark 量到的其实是「模型 + 它的训练数据混合」这个组合</u>。</b><br><b>★★ 这是一个很深的问题，<u>而它在后面会被推得更远</u></b>：<b>⇒ 这一段的结论是：<u>benchmark 量不到内在价值</u>。</b><b>⇒ 下一段（Chatbot Arena）会说：<u>人类投票也量不到</u>。</b><b>⇒ <u>而最后讲者会说：没有哪一个数字能告诉你你关心的东西</u>。</b><br><b>⇒ <u>所以这三段是一个层层递进的论证，而不是三个并列的吐槽</u>。</b><br><b>★★★ 给你的实用结论：<u>看评测报告时，先问「这两个模型的训练数据混合可比吗」，再看分数</u>。</b><br><b>⚠ 绝大多数公开的模型卡片<u>根本不披露训练数据混合</u> —— <u>所以严格说，大多数横向比较都是不成立的</u>。</b>");
  SUM(0,49,{h:"⭐⭐⭐ 在「测试任务」上训练",k:"<b>有一篇论文我强烈推荐去看，它探讨的是「在测试任务上训练」这个现象 —— 不是测试集，是测试「任务」；当你有关于数学推理的 benchmark 时，模型有没有在那类推理相关的数据上训过，关系非常大</b>。<b>这就是为什么那类 benchmark 里会有所谓的「辅助训练」集合 —— 它们可以被用来让模型在同一个领域上被训练，从而使得「在那个具体能力上比较模型」成为可能</b>。论文想传达的是：<b>如果你想把模型互相比较，你得去比较「它被训练的那个训练混合」，并在「有没有在测试任务上训练」这件事上确保「对等（parity）」—— 要确保两边都训过、或者都没有；如果一边训了另一边没训，那把它们拿来比可能就不是一件好事，因为它「并不会给你这个模型的内在价值」</b>。",m:"★★★ 两件事性质完全不同，区分它们是这一段的全部重点：<b>在测试集上训练 —— 模型见过考题本身，这是作弊、而且可检测（查重复）；在测试任务上训练 —— 模型见过同一类型的大量题目，这不是作弊，没有任何规则禁止它</b> ⇒ <b>但后者同样让分数失去可比性：那个分数不再反映「模型有多强」，它反映的是「这家公司有没有决定在这个方向上投数据」—— 而这两件事完全是两回事</b> ⇒ <b>这是今天读任何模型评测报告时最该带的那副眼镜</b>；⚠ 最麻烦的是：<b>「在测试任务上训练」是完全合理的行为 —— 你当然应该在数学数据上训你的模型，问题只是你不能再拿这个分去和别人比</b>。",w:"★★★ 「辅助训练集」这个设计本来是好意：<b>benchmark 的作者想让大家站在同一条起跑线上，所以提供一份同领域但不重叠的训练数据，大家都用它训一遍再比就公平了</b> ⇒ 但问题是<b>没有人强制你用它，也没有人强制你只用它 —— 一家用了官方辅助集，另一家自己造了一百倍的同类数据，第三家一点都没用 ⇒ 三个分数根本不在同一个坐标系里，而报告上它们是并排的三个数字</b>；<b>「对等（parity）」是这篇论文给出的操作性建议：不是要求大家都不训，而是要求「都训或都不训」</b>。",r:"★★★ 「内在价值（intrinsic value）」这个词值得停一下：<b>它预设了「模型有一个内在的好坏，和你怎么测无关」，而 benchmark 想量的就是这个 —— 但这一段说明 benchmark 量到的其实是「模型 + 它的训练数据混合」这个组合</b> ⇒ 而这个问题后面会被推得更远：<b>这一段说 benchmark 量不到内在价值；下一段（Chatbot Arena）会说人类投票也量不到；最后讲者会说「没有哪一个数字能告诉你你关心的东西」⇒ 这三段是层层递进的论证，不是三个并列的吐槽</b>。⇒ <b>实用结论：看评测报告时，先问「这两个模型的训练数据混合可比吗」，再看分数 —— 而绝大多数公开的模型卡片根本不披露训练数据混合，所以严格说，大多数横向比较都是不成立的</b>。"});
  QUIZ(0,49,{t:"「在测试任务上训练」和「在测试集上训练」差在哪？",o:["测试任务只影响数学 benchmark","两者是同一件事","测试任务指的是测试集的子集","测试集是见过考题本身（作弊、可检测）；测试任务是见过同类型的大量题目（不是作弊，但同样让分数失去可比性）"],a:3,w:"⇒ 后者的分数反映的不是「模型有多强」，而是「这家公司有没有在这个方向上投数据」。论文的建议是确保「对等」：都训或都不训。"});

  SUM(0,51,{h:"⭐⭐ Chatbot Arena 与它的两个问题",k:"<b>Chatbot Arena 是一个网站：模型可以被提交上去，用户进来问他们自己的问题，然后「被呈现来自两个模型的回答」，并被要求判断哪一个更好</b>；<b>接着通过网站那一侧做的一些「两两之间的计算」，得出一个按「用户偏好」（他加了引号）排的排名 —— 所以它是「一个被放在『用户看到的那种感觉（vibes）』上的数字」</b>。那它完美吗？<b>其实，不</b>：<b>① 当一个新模型进来时，在「它被拿来和哪些模型比」上一开始有噪声，而最开始那几步对最终排名影响相当大 —— 这让它成为一个「脆弱的」性质；② 有一篇论文表明「要操纵这样一个排行榜是很容易做到的」—— 你问任何模型「你是谁」，它就会直说（问 ChatGPT 它会说「我是 ChatGPT」），而那篇论文就在这个极简单的性质上识别出了正在被评测的是哪个模型 ⇒ 一个对抗性玩家可以仅仅通过「选择正确的模型」来操纵排名 ⇒ 所以它不是万无一失的</b>。",m:"★★★ 这个设计绕开了 benchmark 的两个根本限制：<b>不需要标准答案（只比较两个回答，不需要知道「正确的是什么」）；不需要固定题目（用户问的是他们自己真正想问的）</b> ⇒ 第二条尤其重要：<b>benchmark 的题目固定、公开 ⇒ 可被针对性优化；而 Arena 的题目每天都是新的、由真实用户现想的 ⇒ 没法提前准备 ⇒ Arena 在原理上确实解决了「照着 benchmark 造数据」的问题，但它引入了一整套新的问题</b>。⚠ 「两两比较」这个形式也值得注意：<b>它比「给一个绝对分」容易得多 —— 人很难说「这个回答值 7 分」，但很容易说「这个比那个好」</b>。",w:"★★★ 「两两之间的计算」指的是 <b>Elo 评分</b>（国际象棋那一套）：<b>每场对决产生胜负，赢了加分输了扣分，而加扣多少取决于对手的分 —— 打赢高分的加得多，打赢低分的加得少</b>；Elo 的好处是<b>只需要「谁赢了」不需要「赢了多少」，正好匹配「人只会比较、不会打绝对分」</b>。但它的结构性弱点是<b>路径依赖：新模型的初始分是猜的，第一批对手是随机分配的 —— 一上来碰到弱对手分就被抬高，而后面的加扣分又基于这个被抬高的分算 ⇒ 同一个模型换一套对局顺序，最终分数会不一样</b> ⇒ <b>对局数足够多时影响会衰减，但榜单上最受关注的恰恰是「刚上榜的新模型」—— 那时对局数最少，所以这个弱点正好落在最需要准确的那个时刻</b>；「脆弱（brittle）」这个词选得准：<b>它不是说分数错，而是说分数「对无关因素太敏感」</b>。",r:"★★★ 那个操纵手法之所以有效，<b>是因为 Arena 的匿名性只是表面的：投票界面不显示模型名字（设计意图），但模型自己会说 —— 它的身份被写进了它自己的训练数据里 ⇒ 你只要在 prompt 里加一句「你是谁」，匿名性就破了</b>；破了之后能做的：<b>只在自家模型出现时投它一票、或者只在自家模型对上弱对手时才投票 ⇒ 「仅仅通过选择正确的模型，就能操纵那个排名」</b>。⚠ 请注意讲者的谨慎：<b>他明确说「我不确定有没有证据表明它被这么做过」—— 他说的是可能性，不是指控，这是一个很好的表述习惯</b>。"});

  note("★★ 那是「一整组另外的问题」，而「在很多查询上，你作为用户根本分辨不出来」",640,380,"r");},"<b>泰迪熊第三次回来，而这一次它拆的是「有帮助」这个词本身。</b><br><b>讲者的话</b>：<b>「<u>因为我们就拿那个你想把泰迪熊放进洗衣机的例子：如果我并不知道我需要手洗我的泰迪熊，而如果我拿到一个很详细的回答说「你需要用机洗、冷水」，那我作为用户，可能会觉得这些建议很有帮助，因为它们对我来说是可执行的。但实际上，它们是事实正确的吗？那是一整组另外的问题，而在很多查询上，你作为用户是根本分辨不出来的</u>。」</b><br><b>★★★ 这个例子的设计太漂亮了：<u>它让同一个回答，在两个维度上得到相反的评价</u></b>：<b>⇒ <u>有帮助</u>：✓ 详细、具体、<u>可执行</u>。</b><b>⇒ <u>正确</u>：✗ <u>会把泰迪熊洗坏</u>。</b><b>⇒ <u>而用户只能看到第一个维度</u>。</b><br><b>★★ 更糟的是，这两个维度在投票里会<u>同向作用</u></b>：<b>⇒ 一个<u>自信、具体、可执行</u>的错误回答 ⇒ <u>得票高</u>。</b><b>⇒ 一个<u>谨慎、留余地</u>的正确回答 ⇒ <u>得票低</u>。</b><br><b>⇒ <u>所以用户投票不只是「测不到正确性」，它还在反向激励正确性</u>。</b><br><b>★★★ 这就是「<u>自信地胡说</u>」这个毛病的经济学根源：<u>它在评价体系里是被奖励的</u>。</b><br><b>⚠ 请把这一镜和 72:35 那句「<u>以最大化你作为用户的满意度为导向</u>」连起来看 —— <u>从数据标注规范到评估方式，整条链路都在优化「满意」而不是「正确」</u>。</b>");
  SUM(0,52,{h:"⭐⭐⭐ 用户判断不了事实性",k:"<b>有些评测这些模型的 benchmark「实际上是由专家策展的」—— 那些专家非常清楚「一个给定的 prompt 应该给出什么样的目标分布」，所以它有一整套写得很清楚的规范：这个是「事实性的」、这个是「非事实性的」⇒ 于是他们能够判定什么是好的、什么是坏的；而「你作为用户，可能根本不知道这件事」</b>。例子：<b>如果我并不知道泰迪熊需要手洗，而我拿到一个很详细的回答说「用机洗、冷水」—— 我作为用户可能会觉得这些建议「很有帮助」，因为它们「对我来说是可执行的」；但实际上，它们「是事实正确的吗」？那是一整组另外的问题，而「在很多查询上，你作为用户根本分辨不出来」</b>。",m:"★★★ 这个对比点出两种评测的本质差别：<b>专家 benchmark 是「先有规范、再有判分」—— 判的是「对不对」；用户投票是「没有规范、只有感觉」—— 判的是「喜不喜欢」</b> ⇒ 而「事实性」恰恰是用户最判断不了的那一个：<b>判断一个回答读起来顺不顺任何人都行；判断一个回答是不是真的，需要你本来就知道答案 —— 而你如果本来就知道答案，你根本不会去问模型 ⇒ 这是一个结构性的死结</b>；⚠ <b>所以 Arena 的分数和专家 benchmark 的分数量的根本不是同一个东西，把它们放在一起比是没有意义的</b>。",w:"★★★ 泰迪熊这个例子太漂亮了：<b>它让同一个回答在两个维度上得到相反的评价 —— 有帮助 ✓（详细、具体、可执行），正确 ✗（会把泰迪熊洗坏），而用户只能看到第一个维度</b>；更糟的是这两个维度在投票里<b>同向作用：一个自信、具体、可执行的错误回答得票高；一个谨慎、留余地的正确回答得票低 ⇒ 用户投票不只是「测不到正确性」，它还在反向激励正确性</b> ⇒ <b>这就是「自信地胡说」这个毛病的经济学根源：它在评价体系里是被奖励的</b>。",r:"⚠ 请把这一镜和 72:35 那句「<b>以最大化你作为用户的满意度为导向</b>」连起来看 —— <b>从数据标注规范到评估方式，整条链路都在优化「满意」而不是「正确」</b>。⇒ 而这也给了你一条实用提醒：<b>在你自己的课题里，如果你用「人觉得好不好」当指标，你量到的就是「讨不讨喜」；要量正确性，你必须另外准备一套有标准答案的集合</b>。"});
  QUIZ(0,52,{t:"为什么「用户投票」测不出回答的事实正确性？",o:["因为模型会误导用户","因为判断「是不是真的」需要你本来就知道答案 —— 而你知道答案就不会去问模型；更糟的是自信可执行的错误回答反而得票更高","因为投票样本太小","因为用户不认真"],a:1,w:"⇒ 所以用户投票不只是「测不到正确性」，它还在反向激励正确性 —— 这就是「自信地胡说」在评价体系里被奖励的原因。"});

  note("★★ 注意最后这句：这不是模型的好坏问题，这是「口味」被当成了「质量」",640,380,"r");},"<b>一个看起来很轻的例子，但它指出的问题一点都不轻。</b><br><b>讲者的话</b>：<b>「<u>而我们这里还有另一个挑战，就是用户偏好。所以这儿有谁喜欢 LLM 的回答里带 emoji？是？不是？是的。我个人是喜欢的。而我觉得大家的意见很强烈。有些人则一点都不喜欢。所以他们会给这样的回答打低分。但实际上，这本该是用户自己能说了算、自己能选的东西</u>。」</b><br><b>★★★ 这个例子的要害在最后那句：<u>这不是「模型好不好」，这是「口味」</u></b>：<b>⇒ 一个带 emoji 的回答和一个不带的，<u>在信息上可能完全一样</u>。</b><b>⇒ 但在投票里，<u>它们会得到不同的分数</u>。</b><b>⇒ <u>于是 Elo 分里混进了一部分「和能力无关的风格偏好」</u>。</b><br><b>★★ 而这件事的后果比看起来严重</b>：<b>⇒ 因为模型厂商<u>会去迎合这个分数</u>。</b><b>⇒ <u>于是所有模型都会向「投票人群的平均口味」收敛</u>。</b><br><b>⇒ <u>这就是为什么今天的模型在风格上越来越像 —— 它们在优化同一个评委群</u>。</b><br><b>★★★ 讲者给的那个该有的做法是：「<u>本该是用户自己能选的</u>」</b>：<b>⇒ <u>也就是说：风格应该是一个设置项，而不是一个被平均掉的分数</u>。</b><br><b>⚠ 而他说「<u>我个人是喜欢的</u>」—— <u>他把自己的立场也摆出来了，这让这个例子更可信</u>。</b>");

  note("⚠ 讲者：所以我觉得这种「错配（mismatch）」就是你在这里会看到的一种",640,374,"r");},"<b>偏好偏差更深的一层：投票的人，和用模型的人不是同一批人。</b><br><b>讲者的话</b>：<b>「<u>而接着，那些去选出最好模型的人的分布，和那些将要使用这些模型的更广大人群的分布，常常会是不一样的。而我觉得 emoji 这个例子是一个好例子，因为我觉得总体上，emoji 在更广大的人群里是受欢迎的，但我觉得领域专家可能没那么喜欢它。所以我觉得那种错配就是你在这里会看到的一种</u>。」</b><br><b>★★★ 这是一个标准的<u>采样偏差</u>问题，而它在这里特别严重</b>：<b>⇒ 会去 Chatbot Arena 投票的人：<u>技术圈、爱折腾、多半是开发者</u>。</b><b>⇒ 真正用 LLM 的人：<u>学生、文员、客服、各行各业</u>。</b><b>⇒ <u>两者的口味、问的问题、在意的东西都不一样</u>。</b><br><b>★★ 而讲者举的例子方向很有意思：<u>他说的是「专家不喜欢，而大众喜欢」</u></b>：<b>⇒ 也就是说<u>在 emoji 这件事上，投票人群（偏专家）反而比真实用户更挑剔</u>。</b><b>⇒ <u>于是榜单会低估那些「大众喜欢的风格」</u>。</b><br><b>⇒ <u>这说明偏差不是单向的：它可能往任何方向偏，而你事先不知道往哪偏</u>。</b><br><b>★★★ 可带走的判断：<u>任何基于投票的评估，都要先问「谁在投」</u>。</b><br><b>⚠ 这条在你自己的用户研究里一样成立：<u>愿意填问卷的人，从来不是你的平均用户</u>。</b>");

  stack(640,218,["我要提的最后一个是「安全这一侧」","⇒ 你作为用户，「并不怎么喜欢模型拒掉你的 prompt」","⇒ 当你问起某件事，它说：好的，嘿，抱歉，我不能回答它","⭐ 于是会有一种「偏向那些真的回应了你查询的回答」的偏差"],760,32,6);
  note("★★ 而不是偏向「尊重某条安全原则」—— 而那条原则「可能最终恰恰是一个有意为之的产品决策」",640,380,"r");},"<b>第三类偏差，而它把「安全」和「评分」直接对立了起来。</b><br><b>讲者的话</b>：<b>「<u>而我这里要提的最后一个是安全这一侧。所以你作为用户，并不怎么喜欢模型拒掉你的 prompt。当你问起某件事，而它说：好的，嘿，抱歉，我不能回答它。所以会有一种偏向那些真的回应了你查询的回答的偏差，而不是偏向那些尊重了某条安全原则的回答 —— 而那条原则可能最终恰恰是一个有意为之的产品决策。所以也有这一类偏差会在这里冒出来</u>。」</b><br><b>★★★ 这一条揭示了一个很尖锐的矛盾</b>：<b>⇒ 厂商<u>花了很大力气</u>把拒答能力训进模型（<u>74:09 那一段</u>）。</b><b>⇒ 而评分系统<u>会因为这个能力给它扣分</u>。</b><b>⇒ <u>也就是说：你做得越负责任，榜单上的名次越低</u>。</b><br><b>★★ 「<u>可能最终恰恰是一个有意为之的产品决策</u>」这句话是关键</b>：<b>⇒ 拒答<u>不是 bug，是 feature</u>。</b><b>⇒ 但在用户投票里，<u>它和「模型不会答」完全无法区分</u>。</b><br><b>⇒ <u>于是一个刻意设计的行为，被当成了一个缺陷来计分</u>。</b><br><b>★★★ 把三类偏差放在一起看，它们有一个共同的形状：<u>投票量到的是「用户的即时满意度」，而它和「模型是否做对了事」系统性地不一致</u></b>：<b>⇒ <u>事实性</u>：用户判断不了。</b><b>⇒ <u>风格</u>：口味被当成质量。</b><b>⇒ <u>安全</u>：负责任被当成无能。</b><br><b>⚠ 这三条合起来，就是下一镜那个结论的全部理由。</b>");

  stack(640,218,["就像我刚才说的：「评估是一个难问题」","⇒ 你有所有这些「角度」可以去探索","⭐ 而「并不是某一个数字就能告诉你、你所关心的那件事」","⇒ 「是所有这些加在一起」—— 而到最后，它是「为你真正需要的东西量身定的」"],760,32,6);
  note("★★ 所以你需要去看一个给定模型的「强项和弱项」，并判断「哪一个对应你的用例」",640,380,"r");},"<b>这是这一讲下半场最诚实的一段话，而它没有给你一个答案。</b><br><b>讲者的话</b>：<b>「<u>而就像我刚才提到的，评估是一个难问题。所以你有所有这些角度可以去探索。而并不是某一个数字就能告诉你你所关心的那件事。是所有这些加在一起。而到最后，它是为你真正需要的东西量身定的。所以你会需要去看一个给定模型的强项和弱项，并判断哪一个对应你的用例</u>。」</b><br><b>★★★ 请注意这个结论的形式：<u>它拒绝给你一个单一的答案，而这恰恰是它的价值</u></b>：<b>⇒ 一个不诚实的讲法会是：「<u>所以我们应该用指标 X</u>」。</b><b>⇒ 而讲者说的是：「<u>不存在那个 X</u>」。</b><br><b>★★ 他给的替代方案是三条</b>：<b>⇒ ① <u>看多个角度</u>，而不是一个数。</b><b>⇒ ② <u>看强项和弱项</u>，而不是总分。</b><b>⇒ ③ <u>按你自己的用例去判断</u>，而不是按榜单。</b><br><b>⇒ <u>这三条合起来，其实就是「别人的评测只能帮你缩小范围，最后那一步必须你自己测」</u>。</b><br><b>★★★ 而我建议你把这个结论的「<u>形式</u>」带走，因为它在你的研究里会反复用到</b>：<b>⇒ <u>当你要报告一个系统的好坏时，不要只报一个数</u>。</b><b>⇒ <u>要报一组维度，并说清每个维度量的是什么、它在什么情况下会失真</u>。</b><br><b>⇒ <u>这比一个漂亮的单一数字可信得多，也有用得多</u>。</b><br><b>⚠ 这也是这一讲下半场和上半场最大的气质差别：<u>上半场每个结论都有一个数，而这里的结论是「不要相信那一个数」</u>。</b>");
  SUM(0,53,{h:"⭐⭐⭐ 偏好偏差、安全偏差与结论",k:"第二类问题 <b>用户偏好</b>：<b>这儿有谁喜欢 LLM 的回答里带 emoji？—— 我个人是喜欢的，而大家的意见很强烈；有些人一点都不喜欢，所以他们会给这样的回答打低分 —— 但实际上，这本该是用户自己能说了算、自己能选的东西</b>；更深一层：<b>去投票选「最好模型」的那群人的分布，和「真正会用这些模型的更广大人群」的分布常常不一样 —— emoji 就是好例子：总体人群里它大体受欢迎，但领域专家可能没那么喜欢 ⇒ 那种「错配」就是你在这里会看到的一种</b>。第三类 <b>安全</b>：<b>你作为用户并不怎么喜欢模型拒掉你的 prompt ⇒ 会有一种「偏向那些真的回应了你查询的回答」的偏差，而不是偏向「尊重了某条安全原则」的回答 —— 而那条原则「可能最终恰恰是一个有意为之的产品决策」</b>。结论：<b>评估是一个难问题；你有所有这些角度可以探索，而「并不是某一个数字就能告诉你、你所关心的那件事」—— 是所有这些加在一起，而到最后它是「为你真正需要的东西量身定的」⇒ 你需要去看一个给定模型的强项和弱项，并判断哪一个对应你的用例</b>。",m:"★★★ 三类偏差有一个共同的形状：<b>投票量到的是「用户的即时满意度」，而它和「模型是否做对了事」系统性地不一致 —— 事实性：用户判断不了；风格：口味被当成质量；安全：负责任被当成无能</b>。安全那一条尤其尖锐：<b>厂商花了很大力气把拒答能力训进模型，而评分系统会因为这个能力给它扣分 ⇒ 你做得越负责任，榜单上的名次越低；「可能最终恰恰是一个有意为之的产品决策」是关键 —— 拒答不是 bug 是 feature，但在用户投票里它和「模型不会答」完全无法区分，于是一个刻意设计的行为被当成缺陷来计分</b>。",w:"★★★ emoji 那个例子的要害在最后那句：<b>这不是「模型好不好」，这是「口味」—— 一个带 emoji 和一个不带的回答在信息上可能完全一样，但在投票里会得到不同分数 ⇒ Elo 分里混进了一部分「和能力无关的风格偏好」</b>；后果比看起来严重：<b>厂商会去迎合这个分数 ⇒ 所有模型都会向「投票人群的平均口味」收敛 —— 这就是为什么今天的模型在风格上越来越像，它们在优化同一个评委群</b>；而讲者给的该有的做法是「本该是用户自己能选的」：<b>风格应该是一个设置项，而不是一个被平均掉的分数</b>。⇒ 更深那一层是标准的<b>采样偏差</b>：<b>会去 Arena 投票的是技术圈、爱折腾、多半是开发者；真正用 LLM 的是学生、文员、客服、各行各业 —— 两者口味、问的问题、在意的东西都不一样</b>；而讲者举的方向很有意思：<b>他说的是「专家不喜欢而大众喜欢」—— 于是榜单会低估「大众喜欢的风格」⇒ 偏差不是单向的，它可能往任何方向偏，而你事先不知道往哪偏 ⇒ 任何基于投票的评估，都要先问「谁在投」（这条在用户研究里一样成立：愿意填问卷的人从来不是你的平均用户）</b>。",r:"★★★ 请注意那个结论的形式：<b>它拒绝给你一个单一的答案，而这恰恰是它的价值 —— 一个不诚实的讲法会是「所以我们应该用指标 X」，而讲者说的是「不存在那个 X」</b>；他给的替代方案三条：<b>① 看多个角度而不是一个数 ② 看强项和弱项而不是总分 ③ 按你自己的用例判断而不是按榜单 ⇒ 合起来就是「别人的评测只能帮你缩小范围，最后那一步必须你自己测」</b> ⇒ <b>把这个结论的「形式」带走：当你要报告一个系统的好坏时，不要只报一个数，要报一组维度，并说清每个维度量的是什么、它在什么情况下会失真 —— 这比一个漂亮的单一数字可信得多，也有用得多</b>。⚠ <b>这也是下半场和上半场最大的气质差别：上半场每个结论都有一个数，而这里的结论是「不要相信那一个数」</b>。"});

  SUM(0,54,{h:"⭐ alignment 与 mid-training",k:"<b>我要回来回答关于 alignment 的那个问题：下一讲会看到「把模型对齐到做你想做的事」的更进一步的一步，叫 preference tuning；而「微调」和「偏好调优」这两者的组合 —— 它们都在预训练之后 —— 就是我们所说的「模型的对齐」，所以这两步被称为 alignment</b>。另外：<b>有一步我们这里没提到，叫 mid training，是最近才冒出来的 —— 它紧接在预训练之后，把「模型被训练用的那类数据」对齐到「你真正关心的那些任务」上；它用的是「同一个预训练目标」，但把任务和数据集的种类对齐到你在意的东西 ⇒ 它是你会放在预训练和微调之间的那一步，是一个正在冒头的趋势</b>。接着：<b>现在我们要处理那些挑战里的一个方面 —— 计算上很昂贵；我们会用一个「众所周知的技术」来看它，它叫 LoRA，是一个「在微调阶段以一种高效的方式去微调你的权重」的技术</b>。",m:"★★★ 把 alignment 的定义画成一条线：<b>预训练 →【SFT → 偏好调优】→ 可用的模型；方括号里那两步合称 alignment，而预训练不在里面 —— 它是被对齐的那个对象，不是对齐的一部分</b>；为什么这两步合起来命名：<b>它们回答的是同一个问题的两半 —— SFT 教它「该做什么」（给出示范），偏好调优教它「两个候选里哪个更好」（给出比较）⇒ 前者需要人写出答案，后者只需要人做选择，而后者便宜得多，这正是它存在的理由，也正好接上「SFT 的 ground truth 不唯一」那个困难</b>。",w:"★★★ mid-training 和 SFT 的区别很容易混：<b>mid-training 的目标函数不变（还是预测下一个 token、所有位置都算损失），变的只是数据；SFT 是数据变了、而且目标函数的掩码也变了（只在回答上算损失）</b>。它填的空档是真实的：<b>预训练数据是「互联网上的一切」—— 对你的领域来说绝大部分是噪声；SFT 数据是「几千条示范」—— 太少，塞不进新知识；中间缺的那一块是「几十亿到几千亿 token 的、你那个领域的高质量原始文本」⇒ mid-training 正是在填这一块，它是唯一能真正给模型「加知识」的那一步</b> ⇒ <b>对你的课题非常实用：如果你发现微调怎么调都不行，很可能你缺的不是 SFT，是 mid-training</b>。⚠ 讲者说「我之前没提它」，<b>说明这套课件的流水线图是在这个趋势出现之前画的</b>。",r:"★★★ 先把 LoRA 的定位说清楚（它很容易被误解）：<b>它不改变你用什么数据、不改变目标函数、不改变训练流程 —— 它只改变「哪些参数在被更新」，以及由此带来的代价</b>；而它要解决的那个「昂贵」具体是：<b>全量微调一个 70 亿参数的模型，显存需求和预训练同一个量级（权重 + 梯度 + 优化器状态），前面算过约 84 GB —— 一张 80 GB 的卡都装不下 ⇒ 没有 LoRA，个人和小团队根本做不了微调</b> ⇒ <b>所以这一段的分量比看起来重：它是「微调这件事能不能被普通人做」的那个分界</b>。"});

  stack(640,218,["例子：Afshin 提过你可以把模型专门化到某些任务上 —— 比如「垃圾邮件检测」","⇒ 做法：拿你的预训练模型 ⇒ 在它的权重里「实例化出这个 B 和 A」 ⇒ 「在它们上面微调」","⭐ 于是你得到的 B 和 A，就是「专属于垃圾邮件检测这个任务的」—— 情感抽取也同理，以此类推","⇒ 讲者：这是一个「非常好的性质」—— 你可以从一个底座模型出发，进一步调你的权重，然后拥有一组「任务专属的 A 和 B」"],780,32,6);
  note("★★ 一个底座 + 很多套小插件 —— 这正是今天开源生态里 LoRA 被这么广泛使用的原因",640,380,"r");},"<b>这是 LoRA 最漂亮的那个性质，而它改变的是部署方式。</b><br><b>讲者的话</b>：<b>「<u>所以比如说你有一个模型 —— Afshin 提过那些你或许可以把模型专门化上去的任务，比如说垃圾邮件检测。所以你会拿你的预训练模型，在你模型的权重里实例化出这个 B 和 A，在它们上面微调。然后你会得到的，是 B 和 A 将专属于垃圾邮件检测这个任务，情感抽取也同理，以此类推。所以这是一个非常好的性质：你可以从一个底座模型出发，进一步调你的权重，然后拥有你那些任务专属的 A 和 B</u>。」</b><br><b>★★★ 这个性质改变的是「<u>部署</u>」，而不只是「训练</u>」</b>：<b>⇒ <u>全量微调</u>：十个任务 ⇒ <u>十份完整的模型权重</u>（每份 14 GB）⇒ <u>140 GB</u>。</b><b>⇒ <u>LoRA</u>：一份底座（14 GB）+ <u>十个小文件</u>（每个几十 MB）。</b><br><b>★★ 而更厉害的是：<u>这些小文件可以在运行时热插拔</u></b>：<b>⇒ 同一个底座<u>常驻显存</u>。</b><b>⇒ 来了一个垃圾邮件检测的请求 ⇒ <u>挂上那套 A 和 B</u>。</b><b>⇒ 下一个请求要做情感抽取 ⇒ <u>换一套</u>。</b><br><b>⇒ <u>于是一张卡可以同时服务几十个不同的专用模型 —— 这在全量微调下完全不可能</u>。</b><br><b>★★★ 这就是为什么今天开源社区分享的「<u>模型</u>」里，有很大一部分其实只是几十 MB 的 LoRA 权重。</b><br><b>⚠ 而它也有一个前提：<u>所有这些任务必须共用同一个底座模型</u>。</b><b>⇒ <u>底座一换，所有 A 和 B 全部作废</u>。</b>");
  SUM(0,56,{h:"⭐⭐ LoRA 怎么跑",k:"顺带提两个：<b>prefix tuning 和 adapters —— 它们在课本里有解释，但不深入，因为没那么常用</b>。走一遍 LoRA：<b>你有所有这些「在预训练时已经学到了一个分布」的权重，一个「朴素」的微调做法就是「直接在这些权重上迭代」；而我们这里做的是把它们分解成「已经预训练好的那些权重」和「这个矩阵乘积」</b>。跑法：<b>LoRA 说的是你可以「在这两项上都做一次前向传播」，然后「在最后把这些量加起来」—— 而 A 和 B「将会是你那个感兴趣任务的一种刻画」</b>。例子：<b>比如垃圾邮件检测 —— 拿你的预训练模型，在它的权重里「实例化出这个 B 和 A」，在它们上面微调 ⇒ 于是 B 和 A 就「专属于垃圾邮件检测这个任务」，情感抽取同理 ⇒ 这是一个非常好的性质：你可以从一个底座模型出发，进一步调你的权重，然后拥有一组「任务专属的 A 和 B」</b>。",m:"★★★ 请注意这是「加」而不是「替换」：<b>原模型 W₀ 的行为被完整保留，新学到的东西是叠在上面的一个增量 ⇒ 把 BA 拿掉，模型就精确地回到微调前的样子</b>；这带来一个实用性质：<b>训练开始时模型的行为和原模型完全一样 —— 因为 LoRA 的标准初始化是「A 用随机小值、B 全部初始化为 0」，于是 BA = 0、第一步时 W = W₀ ⇒ 保证了微调是从「一个已经能用的模型」平滑出发，而不是一上来就被随机扰动打乱 —— 这个小设计是 LoRA 能稳定训练的关键之一</b>。",w:"★★★ 那个「任务专属的 A 和 B」改变的是「部署」而不只是「训练」：<b>全量微调十个任务 ⇒ 十份完整权重（每份 14 GB）⇒ 140 GB；LoRA 是一份底座（14 GB）+ 十个小文件（每个几十 MB）</b> ⇒ 更厉害的是<b>这些小文件可以在运行时热插拔：同一个底座常驻显存，来了垃圾邮件检测的请求就挂上那套 A 和 B，下一个要情感抽取就换一套 ⇒ 一张卡可以同时服务几十个不同的专用模型，这在全量微调下完全不可能</b> ⇒ <b>这就是为什么今天开源社区分享的「模型」里，有很大一部分其实只是几十 MB 的 LoRA 权重</b>；⚠ 前提是<b>所有这些任务必须共用同一个底座模型 —— 底座一换，所有 A 和 B 全部作废</b>。",r:"⇒ 他提的那两个方法和 LoRA 属于同一个家族，叫<b>参数高效微调（PEFT）</b>：<b>adapters 在每层之间插入一个小瓶颈模块只训它；prefix tuning 在输入前面接一串可训练向量只训那串；LoRA 在权重上加一个低秩改变量只训它</b> ⇒ 而 LoRA 赢了那两个有个很具体的原因：<b>adapters 增加了推理时的层数（推理变慢）；prefix tuning 占掉一部分上下文长度；而 LoRA 训完之后可以把 BA 直接加回 W₀ —— 推理时和原模型一模一样，零额外开销 ⇒ 这就是「可合并」这个性质，是 LoRA 胜出的决定性优势</b>（⚠ 讲者没讲这一点，但它是你选方法时最该知道的那条）。"});
  QUIZ(0,56,{t:"LoRA 的「任务专属 A 和 B」在部署上带来什么好处？",o:["可以跨不同底座模型复用","不需要 GPU 了","一份底座 + 很多个几十 MB 的小文件，还能运行时热插拔 ⇒ 一张卡同时服务几十个专用模型","推理速度更快"],a:2,w:"⇒ 全量微调十个任务要十份 14 GB 的权重。而前提是所有任务共用同一个底座 —— 底座一换，所有 A 和 B 全部作废。"});

  SUM(0,57,{h:"⭐ LoRA 放哪儿，与两个经验性质",k:"位置：<b>LoRA 的原始论文里提到「只在注意力矩阵上训练」，但后来人们意识到那可能并不是对性能有最大正面影响的那个位置 —— 几周前出的一篇博客把这件事研究得很细，他们发现「前馈块才是放 LoRA 最有益的地方」⇒ 所以如今两个部件上通常都挂着 LoRA 矩阵，但「性能提升的大头其实在前馈块里」</b>。两个性质：<b>① 用 LoRA 微调时你会想用「一个更高的学习率」—— 典型的指导是「10 倍」；② 「当你用更大的 batch size 训它时，它表现得没那么好」</b>；而讲者说：<b>这两条我都「没有一个好的理论解释」，它更多是一些被提出来的「经验观察」</b>。试探性的解释：<b>第一条也许由「LoRA 矩阵的秩可能很小」所引导（鉴于它需要探索的那些空间区域，你需要更高的学习率）；第二条的假设是「矩阵乘积的训练动态和一个完整矩阵是不一样的」</b>。",m:"★★★ 为什么前馈块更重要：<b>一个 Transformer block 里前馈网络占了大约三分之二的参数，而注意力的四个投影矩阵只占三分之一 —— 知识主要存在参数多的地方，而要改变行为你得动存知识的地方</b>；原论文为什么选注意力是历史原因：<b>2021 年时大家把注意力当成 Transformer 里「最重要的部分」，而后来的研究逐渐发现前馈层才是存事实知识的地方 ⇒ 这是一个「直觉引导的默认选择，后来被实验推翻」的典型例子</b>。⚠ 「几周前出了一篇博客」是这一讲时效性最强的一条，<b>它也提醒你：这个领域的最佳实践还在动</b>。",w:"★★★ 这两条是你真要用 LoRA 时最该先知道的：<b>学习率上，全量微调常用 1e-5 到 2e-5，而 LoRA 常用 1e-4 到 2e-4；batch 上，直觉的「越大越稳」在这里不成立</b> ⇒ 第二条尤其反直觉：<b>通常大 batch 让梯度噪声小、训练更稳，而这里大 batch 反而更差 ⇒ 如果你照搬全量微调的超参去跑 LoRA，很可能两条都踩错</b>。⇒ 更值得注意的是讲者的态度：<b>他明说「我没有一个好的理论解释」—— 这在一门课上是很少见的坦率，而它传达了一个重要信息：这个领域里有大量「管用但说不清为什么」的东西</b>。",r:"⇒ 把第一条的直觉补完：<b>全量微调里每个参数只需动一点点（参数多可以分摊），而 LoRA 要用极少的参数表达同样大的改变 ⇒ 每个参数必须动得更多 ⇒ 需要更大的步子</b>；第二条的直觉：<b>你优化的不是 ΔW 而是 B 和 A 这两个因子，而乘积 BA 对 B、A 的梯度是互相耦合的（一个变了，另一个的最优值也变）—— 这种耦合让优化面不像凸的二次型，而更像一个鞍形地貌，而在这种地貌上适量的梯度噪声反而有帮助，这可能就是为什么大 batch（噪声小）反而更差</b>。⚠ <b>请把这两条当成「有道理的猜测」而不是结论 —— 讲者自己就是这么标注的（tentative explanations）</b>。"});

  note("★★ 请注意这两个数字的对比：主技巧 16 倍，而那个精巧的第二层只是「一点点」",640,380,"r");},"<b>最后的数字，而它把这一讲的那条主线又印证了一次。</b><br><b>讲者的话</b>：<b>「<u>所以这个方法带来了 16 倍的 VRAM 节省，而那些双重量化的方法又多给了一些节省，但没有那么多。不过知道一下还是挺有意思的。然后我们正好准时。谢谢你们的时间</u>。」</b><br><b>★★★ 请把这两个数字放在一起看，<u>它们印证了上一镜那条判断</u></b>：<b>⇒ <u>主技巧（4 位量化 + LoRA）</u>：<u>16 倍</u>。</b><b>⇒ <u>双重量化</u>：「<u>又多一些，但没那么多</u>」。</b><b>⇒ <u>这和「调 r 不划算」是同一个形状：主要的收益在第一步，后面都是边角</u>。</b><br><b>★★ 而 <u>16 倍</u> 这个数意味着什么</b>：<b>⇒ 一个原本需要 <u>780 GB</u> 才能全量微调的 650 亿参数模型。</b><b>⇒ <u>现在一张 48 GB 的卡就够了</u>。</b><b>⇒ <u>这就是 QLoRA 论文那句著名的宣称：在单张消费级 GPU 上微调一个 65B 模型</u>。</b><br><b>★★★ 把这一讲最后这几段串起来，你会看到一条完整的下降链</b>：<b>⇒ <u>全量微调</u> → <u>LoRA</u>（只训 0.1%）→ <u>QLoRA</u>（底座再压到 4 位）。</b><b>⇒ <u>而每一步都是把「不需要精度的那部分」识别出来，然后砍掉</u>。</b><br><b>⚠ 讲者最后说「<u>我们正好准时</u>」—— <u>这一讲 107 分钟，两位讲者各讲一半，而他们把时间卡得非常准</u>。</b>");
  SUM(0,59,{h:"⭐⭐ QLoRA 与 NF4",k:"<b>我们还有两分钟，快速过一下 quantized LoRA —— Afshin 提到的那些「量化权重、减小内存占用」的技术就是这里要看的</b>：<b>做法是把 W₀ 的权重「量化成一种非常聪明的格式」，而「正在被学习的那两个矩阵 A 和 B」则「在全精度下计算和迭代」—— 这里是 BF16</b>。<b>这些冻住权重的量化「超级聪明」：它是一种叫 NF4 的格式，它「假设那些权重是正态分布的」，并且「把空间切成分位数，而不是固定大小的桶」—— 这让每个格子里装进差不多一样多的数值，从而「把你用来编码的那些位优化掉」</b>。还有<b>「双重量化」：先量化权重，再「量化那些量化常数」（当你要把完整权重在量化状态之间来回转换时会生成一些常数，他们提议把这些也量化掉）</b>。结果：<b>这个方法带来了「16 倍的 VRAM 节省」，而双重量化「又多给了一些，但没有那么多」—— 然后我们正好准时，谢谢你们的时间</b>。",m:"★★★ 这个组合为什么天然成立：<b>W₀ 是冻住的 ⇒ 它只被读、从不被更新；而量化最怕的正是「反复累加小更新」（混合精度那一段讲过）⇒ 既然它根本不更新，那个风险就不存在了</b> ⇒ QLoRA 的分工是：<b>不更新的那一大块（W₀，占 99% 以上）狠狠压到 4 位；要更新的那一小撮（A、B）保持 BF16</b> ⇒ <b>这正好是前面那条规则的完美应用：一次性使用的量可以粗，被反复累加的量必须细</b>；⚠ 注意是 <b>BF16</b> 而不是 FP16 —— <b>呼应「训练用 BF16，因为量程宽」</b>。",w:"★★★ 为什么「等宽的桶」浪费：<b>神经网络权重高度集中在 0 附近（近似正态）—— 把 [−M, M] 等分成 16 份，绝大多数权重落进中间那两三份，而最两端的那几份可能一个权重都没有，那几个编码就白占了</b> ⇒ 按分位数切等于让每个编码「承担同样多的工作」：<b>0 附近密集就切得细、两端稀疏就切得粗 ⇒ 16 个编码全部被用满 —— 这就是「把编码用的位优化掉」的意思，而它正好回答了上半场 61:33 那个「量程该怎么定」的追问</b>；条件是：<b>它假设权重是正态分布的 —— 这对训练好的网络权重确实成立，但对激活不成立（激活有严重的离群值）⇒ 所以 NF4 只用在权重上</b>。<b>NF4 = 4-bit NormalFloat</b>。",r:"⇒ 那些「量化常数」是什么（讲者略过了）：<b>量化是分块做的（比如每 64 个权重一块），每块都要存一个自己的 fp32 缩放系数才能还原 ⇒ 权重被压到每个 4 位，但每 64 个权重还要配一个 32 位常数、平均每个权重多出 0.5 位 —— 元数据占了实际数据的 12% ⇒ 双重量化把这些常数也压成 8 位，额外开销从 0.5 位降到约 0.127 位</b>。⇒ 最后两个数字印证了同一条判断：<b>主技巧 16 倍，双重量化「又多一些但没那么多」—— 这和「调 r 不划算」是同一个形状：主要收益在第一步，后面都是边角</b>；而 16 倍意味着：<b>一个原本需要 780 GB 才能全量微调的 650 亿参数模型，现在一张 48 GB 的卡就够了 —— 这就是 QLoRA 论文那句著名的宣称</b> ⇒ <b>把最后几段串起来是一条完整的下降链：全量微调 → LoRA（只训 0.1%）→ QLoRA（底座再压到 4 位），而每一步都是把「不需要精度的那部分」识别出来然后砍掉</b>。"});
  QUIZ(0,59,{t:"NF4 相比普通 4 位量化聪明在哪？",o:["它只量化激活","它假设权重服从正态分布，按「分位数」切而不是等宽的桶 ⇒ 每个编码装进差不多一样多的数值，16 个编码全被用满","它用了更多位","它不需要缩放系数"],a:1,w:"⇒ 这正好回答了上半场那个「量程怎么定」的追问。而它只能用在权重上 —— 激活有严重离群值，不服从正态。"});
