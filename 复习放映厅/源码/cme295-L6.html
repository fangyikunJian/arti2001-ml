  note("「大规模地」才是难点：写一条链 CoT prompting 早就能做，让它自己总是写得又长又好才是新问题",640,380,"r");},"<b>问题被明确摆出来了，而「激励」这个词选得非常准。</b><br>⭐ 「<b>激励（incentivize）</b>」这个词值得单独停一下，<b>它和「教（teach）」是两件事</b>：「<b>教</b>」= <b>给它看正确答案，让它模仿</b> ⇒ <b>那是 SFT</b>。「<b>激励</b>」= 给它一个奖励，让它自己发现什么做法能拿到奖励 ⇒ <b>那是 RL</b>。<br>所以这一个词已经把答案透露了：这一讲的方案是 RL，不是 SFT。<br>而「<b>大规模地（at scale）</b>」这三个字是这一部分的真正难点：让模型写一条推理链：CoT prompting 早就能做（L2/L3）。让模型自己总是写、而且写得很长很好：这才是新问题。<br>所以「怎么造一个推理模型」=「怎么把 CoT 从一个 prompt 技巧变成一个内置能力」。<br>「<b>写推理链是一个非常难的任务</b>」—— <b>请注意这句话说的是「谁」难</b>：<b>它说的是「人类写推理链很难」</b>。而这正是下一个知识点要展开的第一条理由：SFT 需要这些链，但没人写得出来。<br>⚠ 讲者说「<b>翻一下我们的工具箱</b>」—— <b>接下来三镜是一个很漂亮的排除法</b>。");
  SUM(0,28,{h:"⭐ 别的指标与第二部分开场",k:"<b>「这些是人们用的『主要』指标，但『不是唯一的』—— 还有一个你可能会看到的叫『consensus@k』，它是『那个在你的生成里出现次数最多的答案』；而你可以把『self-consistency』那个技术想成是和它『非常相关』的；其它指标典型地就是你熟悉的那些 —— accuracy、exact match 等等」</b> ⇒ <b>「我在这『第一部分』上『花了很多时间』，我想我『需要走快一点』⋯⋯所以现在我希望你知道『推理模型是什么』⇒ 所以现在我们要进入『这一讲最有意思的部分』—— 就是『我们怎么能造出这样一个推理模型』」</b> ⇒ <b>「我们知道我们『想要』推理模型『产生一条推理链』，但现在我们『并不真的知道怎么「大规模地」做到那一点』⇒ 所以这里的想法，是『某种程度上「激励」模型在回答之前产生一条推理链』；而那件事的问题是：『写推理链是一个非常难的任务』」</b>。",m:"⭐ 「激励（incentivize）」这个词和「教（teach）」是两件事：<b>「教」= 给它看正确答案让它模仿 ⇒ 那是 SFT；「激励」= 给它一个奖励，让它自己发现什么做法能拿到奖励 ⇒ 那是 RL ⇒ 所以这一个词已经把答案透露了：这一讲的方案是 RL，不是 SFT</b> ⇒ 而「大规模地（at scale）」三个字是真正的难点：<b>让模型写一条推理链，CoT prompting 早就能做（L2/L3）；让模型自己总是写、而且写得很长很好，这才是新问题 ⇒ 所以「怎么造一个推理模型」=「怎么把 CoT 从一个 prompt 技巧变成一个内置能力」</b>。",w:"⭐ 请把 pass@k 和 consensus@k 的<b>前提</b>对照一下：<b>pass@k 问「k 个里至少一个对」⇒ 需要你「能认出哪个对」⇒ 只能用在可验证任务上；consensus@k 问「出现最多的那个答案对不对」⇒ 不需要验证，只需要数票 ⇒ 所以 consensus@k 适用范围更广，但也更弱：如果模型系统性地错在同一个地方，多数票会一致地错</b> ⇒ 而三个概念很容易混：<b>pass@k = 指标，要验证器；consensus@k = 指标，要投票；self-consistency = 方法，就是投票那件事本身（采 k 条链 ⇒ 取各自最终答案 ⇒ 投票 ⇒ 返回票数最多的）—— 所以 self-consistency 是「部署时就能用」的方法，pass@k 更多是「评测时用的指标」</b>。",r:"⇒ 回到开场那两个目标，<b>第一个到这里打勾了</b>：<b>目标一（推理模型是什么）✓；目标二（怎么被训练）从这里开始，而这一半会占掉剩下的全部时间</b> ⇒ 如果现在自测目标一，答案应该是这三条：<b>① 输出从「答案」变成「推理链 + 答案」② 本质上是「把 CoT 放大」，不是新架构 ③ 多生成 token = 多花算力，所以有一个「预算」可调 —— 能说出这三条，第一部分就过了</b>。⚠ <b>而讲者说「需要走快一点」有一个实际后果：后面那几块（尤其是 R1 的流水线和蒸馏）会讲得比前面快，所以那几块我会在旁白里补得更满一些</b>；另外「写推理链是一个非常难的任务」说的是<b>人类</b>写很难 —— <b>而这正是下一个知识点的第一条理由</b>。"});
  QUIZ(0,28,{t:"讲者说要「激励（incentivize）」模型产生推理链 —— 这个词透露了什么？",o:["透露了要改架构","透露了要加更多数据","「激励」≠「教」：教 = 给正确答案让它模仿（SFT），激励 = 给奖励让它自己发现什么做法有回报（RL）—— 所以答案是 RL","透露了要调温度"],a:2,w:"⇒ 而「大规模地（at scale）」才是难点：让模型写一条链 CoT prompting 早就能做，让它自己总是写得又长又好才是新问题。"});
});
KP("29 · ⭐ 为什么不走 SFT（前两个事实）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("49:33","the problem with SFT is you need high quality data",166);
  note("⭐ 第一个事实：没人写得出这些推理链",640,194,"y");
  stack(640,218,["翻一下工具箱：第一个想到的当然是 SFT","但 SFT 要「高质量的数据」—— 这里意味着你得把所有推理链都写出来","而你没有这些链 ⇒ 只能从零写 ⇒「那非常难」","⇒ 这是「一张不做 SFT 的票」—— 前提是我们没有任何推理链"],780,32,6);
  note("为什么不是夸张：一条竞赛题的完整链几千字，要几万条 ⇒ 几万人时的数学专家劳动",640,380,"r");},"<b>第一个事实：那份 SFT 数据根本不存在。</b><br>⭐ 请回忆 <b>L4</b> 里 SFT 的定义，<b>这条反驳才站得住</b>：SFT 需要「一个高质量的、精心策划的数据集」。那个数据集的每一条是「<b>输入 → 理想输出</b>」。<br>而这里「理想输出」= 一条完整正确的长推理链。<br>为什么「<b>那非常难</b>」不是夸张：一条竞赛数学题的完整推理链<b>可能几千字</b>。而它不能只是「<b>正确</b>」—— <b>它还得是「模型应该学会的那种写法」</b>。要凑几万条这样的链，你需要几万人时的数学专家劳动。<br>而这件事贵到没有任何实验室愿意作为起点去做。<br>注意讲者的用词是「<b>一张票（one vote）</b>」：他在做一个「投票式」的论证：每个事实投一票，三票之后结论自己浮出来。这个结构比「所以我们必须用 RL」要诚实得多。<br>⚠ 而他特意加了一句「<b>如果我们没有任何推理链的话</b>」—— 这个前提很重要：有链的时候 SFT 其实很好用，而这正是后面「蒸馏」那一段在做的事。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:04","the way the model reasons may be different from the way we reason",166);
  note("⭐ 第二个事实：模型推理的方式可能和我们不一样",640,194,"y");
  stack(640,218,["第二张票：「模型推理的方式，可能和我们推理的方式不同」","所以人写的推理，也许不是教模型怎么推理的最好方式","⚠ 这一条比第一条深：第一条说「做不到」,第二条说「做到了也不一定好」","⇒ 所以第二条在钱无限的情况下仍然成立，而第一条不成立"],780,32,6);
  note("为什么合理：人受工作记忆限制所以尽量少写步骤，模型不受 —— 它可以把中间结果全写在上下文里",640,380,"g");},"<b>第二个事实比第一个深，而讲者说得非常克制。</b><br>⭐ 两条反驳的性质完全不同，<b>请分开记</b>：<b>第一条</b>：「<b>做不到</b>」—— <b>那份数据太贵，凑不出来</b>。<b>第二条</b>：「<b>就算做到了也不一定好</b>」—— <b>人类的推理路径未必是模型的最优路径</b>。<br>所以第二条即使在钱无限的情况下仍然成立，而第一条不成立。<br>为什么「<b>模型推理的方式可能和我们不同</b>」是合理的：人类推理受<b>工作记忆</b>限制，所以我们会<b>尽量少写中间步骤</b>。模型<b>没有这个限制</b>：它可以把中间结果<b>全写在上下文里</b>。所以模型的最优策略可能是「写得极其啰嗦、反复验算、把失败的尝试也写出来」。<br>而一个人类专家绝不会那样写题解 —— 太难看了。<br>这一条后来被 R1 的结果<b>强烈证实</b>了，<b>而这是这一讲最有意思的发现之一</b>：R1 自己学出来的推理链里，有大量「等一下，我再检查一遍」式的自我纠正。那种写法没有任何人类会写进题解，但它确实提高了正确率。<br>所以「让它自己摸索」真的比「让它学人类」更好 —— 这一条讲者这里只是猜，但后来被验证了。<br>⚠ 注意他的措辞：「<b>可能不同</b>」「<b>也许不是最好</b>」—— 他没有断言人类的方式更差，只说不一定最好。");
  SUM(0,29,{h:"⭐ 不走 SFT 的前两个事实",k:"<b>「假设我们去翻一下『我们到现在学过的技术的工具箱』，也许我们可以想：好，我们可以『用 SFT』来做那件事 —— 但 SFT 的问题是『你需要高质量的数据』，而特别地『你会需要把所有这些推理链都写出来』；假设你『没有』这些推理链，你典型地会『从零开始写它们』,但『那非常难』⇒ 所以那是『一张不做 SFT 的票』——『如果我们没有任何推理链的话』」</b> ⇒ <b>「第二个『事实』是『模型推理的方式，可能和我们推理的方式不同』—— 而为此，『也许一条人写的推理，不是教模型怎么推理的最好方式』；所以那是第二个事实，它『反对』把某些人写的推理链当作 SFT 数据」</b>。",m:"⭐ 两条反驳的性质完全不同，<b>请分开记</b>：<b>第一条是「做不到」（那份数据太贵，凑不出来）；第二条是「就算做到了也不一定好」（人类的推理路径未必是模型的最优路径）⇒ 所以第二条即使在钱无限的情况下仍然成立，而第一条不成立</b> ⇒ 为什么第二条合理：<b>人类推理受工作记忆限制，所以我们会尽量少写中间步骤；模型没有这个限制，它可以把中间结果全写在上下文里 ⇒ 所以模型的最优策略可能是「写得极其啰嗦、反复验算、把失败的尝试也写出来」—— 而一个人类专家绝不会那样写题解</b>。",w:"⭐ 第二条后来被 R1 的结果<b>强烈证实</b>了，<b>而这是这一讲最有意思的发现之一</b>：<b>R1 自己学出来的推理链里有大量「等一下，我再检查一遍」式的自我纠正，那种写法没有任何人类会写进题解，但它确实提高了正确率 ⇒ 所以「让它自己摸索」真的比「让它学人类」更好 —— 这一条讲者这里只是猜，但后来被验证了</b>。⚠ <b>注意他的措辞「可能不同」「也许不是最好」—— 他没有断言人类的方式更差，只说不一定最好</b>。",r:"⇒ 请回忆 L4 里 SFT 的定义，<b>第一条反驳才站得住</b>：<b>SFT 需要「一个高质量的、精心策划的数据集」，每一条是「输入 → 理想输出」—— 而这里「理想输出」= 一条完整正确的长推理链</b> ⇒ 为什么「那非常难」不是夸张：<b>一条竞赛数学题的完整推理链可能几千字，而它不能只是「正确」，还得是「模型应该学会的那种写法」⇒ 要凑几万条，你需要几万人时的数学专家劳动，而这件事贵到没有任何实验室愿意作为起点去做</b>。⚠ <b>而他特意加了「如果我们没有任何推理链的话」—— 这个前提很重要：有链的时候 SFT 其实很好用，而这正是后面「蒸馏」那一段在做的事</b>；另外注意他用的词是「一张票（one vote）」，<b>他在做一个投票式的论证：每个事实投一票，三票之后结论自己浮出来，这比「所以我们必须用 RL」要诚实得多</b>。"});
  QUIZ(0,29,{t:"不走 SFT 的前两个理由，性质有什么不同？",o:["第一条是「做不到」（数据太贵凑不出来），第二条是「就算做到了也不一定好」（人类推理路径未必是模型的最优路径）—— 第二条在钱无限时仍然成立","第二条只是第一条的重复","两个都是算力问题","两个都是成本问题"],a:0,w:"⇒ 而第二条后来被 R1 证实了：它自己学出的链里有大量「等一下，我再检查一遍」式的自我纠正，没人会那样写题解，但它确实更准。"});
});
KP("30 · ⭐ 第三个事实：奖励是现成的 ⇒ 那就试 RL",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:34","these reasoning tasks, they have a very natural reward, which is actually verifiable",166);
  note("⭐ 第三个事实 —— 而它不是「反对 SFT」，是「支持 RL」",640,194,"y");
  stack(640,218,["第三张票方向不同：它不反对 SFT，它支持 RL","推理任务有一个「非常自然的奖励」—— 而且它「其实是可验证的」","编程：通过测试用例、能编译 ｜ 数学：答案和 ground truth 一样","⇒ 很自然地，你确实有一个奖励信号 —— 不用造"],780,32,6);
  note("「自然」是在对比 L5：那里的奖励是人造的（收数据、训模型），这里它本来就在任务定义里",640,380,"r");},"<b>第三个事实的方向不同：它不是在反对 SFT，而是在支持 RL。</b><br>⭐ 请看清这三票的<b>方向</b>，<b>它们不是三条同类的理由</b>：<b>事实一</b>：<b>SFT 需要的数据不存在</b> ⇒ <b>反对 SFT</b>。<b>事实二</b>：<b>人写的链未必是最好的教材</b> ⇒ <b>反对 SFT</b>。<b>事实三</b>：<b>奖励信号是现成的</b> ⇒ <b>支持 RL</b>。<br>两个关门 + 一个开门 = 一个干净的排除法。<br>「<b>自然的（natural）</b>」这个词用得很准确，<b>它是在对比 L5</b>：<b>L5 的奖励是「人造的」</b>：你得先收偏好数据，再训一个模型来当奖励。<b>L6 的奖励是「自然的」</b>：<b>它本来就在任务定义里，不需要你造</b>。<br><b>而这个差别决定了两讲的全部技术路线</b>。<br>注意他给编程举了<b>两个</b>判定条件，<b>这个细节有意思</b>：「<b>通过测试用例</b>」—— <b>正确性</b>。「<b>能编译</b>」—— <b>连编译都过不了的，是一个更低的门槛</b>。<br>而实践中这两层会被做成「分级奖励」：能编译给一点分，全部通过给满分。<br>这样奖励就不是纯 0/1 了，而稀疏奖励正是 RL 最怕的东西。<br>⚠ 请记住这个词：「可验证奖励（verifiable reward）」—— <b>它是这一讲后半场的核心术语</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("51:15","let's try RL then",166);
  note("⭐ 结论，以及一句顺手的课程设计说明",640,194,"y");
  boxNode(60,222,540,40,"有一个现成的奖励信号","g");
  boxNode(680,222,540,40,"SFT 不是一个从零开始的好方式","r");
  note("两个关门 + 一个开门 ⇒ 剩下的那条路就是 RL。这个论证形状值得照抄",640,284,"y");
  note("列出候选 ⇒ 给出排除每个候选的「具体事实」⇒ 剩下的就是答案",640,322,"g");
  note("⚠ 而「上周刚讲过 RL」不是巧合：L5 结尾就明确预告了 GRPO，那一整套词这里全要用",640,360,"v");},"<b>结论，而讲者顺手说明了一下这门课为什么是这个顺序。</b><br>⭐ 这个结论的形状非常干净，<b>而它值得你照抄到自己的论文里</b>：<b>列出候选方案（工具箱）</b>。给出排除每个方案的具体事实（而不是「它不好」）。<b>剩下的那个就是答案</b>。<br>这比「我们提出用 RL」有说服力得多，因为读者自己就能看出别的路走不通。<br>而「<b>上周我们看过了 RL</b>」不是巧合，<b>它是课程设计</b>：L5 花了一整讲讲 RLHF、PPO、奖励模型、KL 惩罚、advantage。而 L5 结尾明确预告了「下一讲会讲 GRPO」。<br>所以 L5 那一整套词汇，到这里全部要被用上 —— 如果你 L5 没跟上，这里会很吃力。<br>请先把 L5 的关键词在脑子里过一遍，<b>因为接下来全要用</b>：<b>policy（策略）= 你的 LLM</b>；<b>action = 下一个 token</b>；<b>reward = 对整条回答的打分</b>。<b>advantage = 比基线好多少</b>；KL penalty = 别离参考模型太远；<b>clip = 别一步走太大</b>。<br>而 GRPO 要动的，正是这里面的「advantage 怎么算」这一处。<br>⚠ 「那时机正好（great timing）」—— 讲者在自我调侃课程安排，但这个安排确实是有意的。");
  SUM(0,30,{h:"⭐ 奖励现成 ⇒ 试 RL",k:"<b>「第三个事实是：我们刚刚看到『这些推理任务有一个非常自然的奖励』——『而它其实是「可验证的」』：对『编程』，你知道行不行，如果它『通过了某些测试用例』、如果它『能编译』；对『数学』，如果『答案和你的 ground truth 一样』⇒ 所以『很自然地，你确实有一个奖励信号』」</b> ⇒ 结论：<b>「我们看到『有一个奖励信号』;『SFT 不是一个从零开始的好方式』—— 嗯，那你怎么办？『那我们就试试 RL』；而好事是『上周我们看过了 RL 在 LLM 这个情形下是怎么工作的』,所以『那时机正好』」</b>。",m:"⭐ 请看清这三票的<b>方向</b>，<b>它们不是三条同类的理由</b>：<b>事实一（SFT 需要的数据不存在）⇒ 反对 SFT；事实二（人写的链未必是最好的教材）⇒ 反对 SFT；事实三（奖励信号是现成的）⇒ 支持 RL ⇒ 两个关门 + 一个开门 = 一个干净的排除法</b> ⇒ 而「自然的（natural）」这个词是在对比 L5：<b>L5 的奖励是「人造的」（你得先收偏好数据，再训一个模型来当奖励）；L6 的奖励是「自然的」（它本来就在任务定义里，不需要你造）—— 而这个差别决定了两讲的全部技术路线</b>。",w:" 注意他给编程举了<b>两个</b>判定条件，<b>这个细节有意思</b>：<b>「通过测试用例」是正确性；「能编译」是一个更低的门槛 ⇒ 实践中这两层会被做成「分级奖励」：能编译给一点分，全部通过给满分 ⇒ 这样奖励就不是纯 0/1 了，而稀疏奖励正是 RL 最怕的东西</b>。⚠ <b>请记住这个词：「可验证奖励（verifiable reward）」—— 它是这一讲后半场的核心术语</b>。",r:"⭐ 这个结论的形状非常干净，<b>值得你照抄到自己的论文里</b>：<b>列出候选方案（工具箱）⇒ 给出排除每个方案的具体事实（而不是「它不好」）⇒ 剩下的那个就是答案 —— 这比「我们提出用 RL」有说服力得多，因为读者自己就能看出别的路走不通</b> ⇒ 而「上周我们看过了 RL」是课程设计不是巧合：<b>L5 花了一整讲讲 RLHF、PPO、奖励模型、KL 惩罚、advantage，而 L5 结尾明确预告了「下一讲会讲 GRPO」⇒ 所以 L5 那一整套词汇到这里全部要被用上</b> ⇒ 请先把 L5 的关键词过一遍：<b>policy = 你的 LLM；action = 下一个 token；reward = 对整条回答的打分；advantage = 比基线好多少；KL penalty = 别离参考模型太远；clip = 别一步走太大 —— 而 GRPO 要动的，正是「advantage 怎么算」这一处</b>。"});
  QUIZ(0,30,{t:"为什么结论是「那就试 RL」？这三个事实的方向有什么不同？",o:["三个都在说 SFT 不行","三个都在说 RL 更好","两个关门 + 一个开门：事实一、二反对 SFT（数据不存在、人写的链未必最好），事实三支持 RL（奖励现成且可验证）—— 一个干净的排除法","三个都是成本论证"],a:2,w:"⇒ 而这个论证形状值得照抄：列出候选 ⇒ 给出排除每个候选的具体事实 ⇒ 剩下的那个就是答案。"});
});
KP("31 · ⭐ 两个奖励：think token 在不在，答案对不对",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("51:48","we first want to have a reward that checks whether the reasoning chain is there",166);
  note("⭐ 第一个奖励：竟然只是检查「那两个标签在不在」",640,194,"y");
  stack(640,218,["奖励一：检查「那条推理链在不在」—— 就这么简单","做法：看输出里有没有 <think> … </think> 这一对标签","它检查的是「有没有推理这个动作」,不是「推理对不对」","⇒ 所以它是一个纯粹的「格式奖励」,一个正则就够了"],780,32,6);
  note("而这正是它能被程序化的原因：判一段推理好不好要一个模型，判两个标签在不在只要一行代码",640,380,"r");},"<b>第一个奖励简单到让人意外：它只检查两个标签在不在。</b><br>⭐ 请注意这个奖励<b>检查的是什么，以及不检查什么</b>：<b>它检查</b>：输出里有没有 &lt;think&gt; … &lt;/think&gt; 这一对标签。<b>它不检查</b>：标签里面写的推理「对不对」、「好不好」。<br>所以它是一个纯粹的「格式奖励（format reward）」。<br>这件事为什么重要：<b>它是「可程序化」的极端例子</b>：<b>判断一段推理好不好</b> ⇒ <b>需要一个模型，而且会被 hack</b>。<b>判断两个标签在不在</b> ⇒ <b>一个正则表达式</b>。<br><b>而后者零成本、零噪声、完全确定</b>。<br>不过这里有一个你应该想到的疑问：只奖励「有标签」，模型不会学会「写一对空标签」然后直接答吗？<b>会的 —— 如果只有这一个奖励</b>。<br>而这正是为什么必须配上第二个奖励：标签在、而且答案对。两个奖励一起，才逼出「真的用那段空间去推理」这个行为。<br>⚠ 「<b>指示（instruct）你的模型去用</b>」—— 这个格式是靠 prompt 要求的，和前面「强迫它把答案放进 box」是同一个手法。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("52:18","the second reward that you want to have is to check that the solution that it produced actually works",166);
  note("⭐ 第二个奖励：答案对不对 —— 而这正是前面铺了半小时的那件事",640,194,"y");
  stack(640,218,["奖励二：检查它产生的那个解「是不是真的可行」","代码：对所有测试用例都通过 ｜ 数学：答案和 ground truth 相同","⚠ 请注意：前面讲 benchmark 那半小时，现在整个变成了奖励函数","评测方式和训练信号，在这里是同一个东西"],780,32,6);
  note("好处是不会「训了半天优化错东西」;坏处是「直接优化指标」就是 benchmark 过拟合的定义",640,380,"r");},"<b>第二个奖励就是前面铺了半小时的那件事，现在它变成了训练信号。</b><br>⭐ 请把这件事和前面那半小时连起来看，<b>它们是同一个东西</b>：<b>前面</b>：「<b>跑测试用例</b>」「<b>比 ground truth</b>」是<b>评测</b>的方式。<b>这里</b>：<b>同一套检查，变成了训练时的奖励函数</b>。<br>所以「评测方式」和「训练信号」在这里是同一个东西 —— 而这在机器学习里其实是一个相当特殊的情形。<br>为什么特殊？<b>因为通常它们是分开的</b>：<b>一般情形</b>：你用交叉熵训练，用准确率评测 —— 训的和测的不是一回事。<b>这里</b>：<b>你直接优化那个评测指标</b>。<br>而这件事的好处是不会「训了半天优化错了东西」，坏处是「直接优化指标就是 benchmark 过拟合的定义」。<br>所以这里有一个真实的风险，<b>讲者没有在这里点</b>：你在 AIME 风格的题上做 RL ⇒ 它在 AIME 上涨。但它在「没见过的那类推理」上涨多少？这是一个开放问题。<br>而讲者在定义「推理」时说过「希望这些能力也能扩散到别的领域」—— 那个「希望」在这里才真正有了代价。<br>⚠ 注意数学那边的检查<b>只比最终答案</b> —— 一个过程全错但答案蒙对的回答，拿到的奖励和完美回答一样。");
  SUM(0,31,{h:"⭐ 两个可验证奖励",k:"<b>「我们想『教我们的模型解这些更复杂的问题』—— 而我们『也想教它「先」推理』；所以为了做到那一点，我们『首先想有一个奖励，去检查「那条推理链在不在」』⇒ 你可以通过『检查「think 的开始和结束 token」在不在』来检查那件事 —— 那些 token 是你『指示你的模型去用』来插入它的推理链的」</b> ⇒ <b>「然后你想有的『第二个』奖励，是『检查它产生的那个解「是不是真的可行」』—— 这是一件『对我们关心的那些 benchmark 你真的能做』的事：对『代码』，你会检查它『对所有用例都可行』；对『数学』，你就『相对于「答案和 ground truth 是否相同」』去验证」</b>。",m:"⭐ 请注意第一个奖励<b>检查什么、不检查什么</b>：<b>它检查「输出里有没有 &lt;think&gt;…&lt;/think&gt; 这一对标签」；它不检查「标签里面写的推理对不对、好不好」⇒ 所以它是一个纯粹的「格式奖励（format reward）」</b> ⇒ 这件事为什么重要：<b>判断一段推理好不好 ⇒ 需要一个模型，而且会被 hack；判断两个标签在不在 ⇒ 一个正则表达式 ⇒ 而后者零成本、零噪声、完全确定</b> ⇒ <b>但你应该想到一个疑问：只奖励「有标签」，模型不会学会「写一对空标签」然后直接答吗？会的 —— 如果只有这一个奖励；而这正是为什么必须配上第二个：标签在、而且答案对，两个一起才逼出「真的用那段空间去推理」这个行为</b>。",w:"⭐ 请把第二个奖励和前面那半小时连起来看，<b>它们是同一个东西</b>：<b>前面「跑测试用例」「比 ground truth」是评测的方式；这里同一套检查变成了训练时的奖励函数 ⇒ 所以「评测方式」和「训练信号」在这里是同一个东西，而这在机器学习里是一个相当特殊的情形</b> ⇒ 为什么特殊：<b>一般情形是你用交叉熵训练、用准确率评测 —— 训的和测的不是一回事；这里你直接优化那个评测指标 ⇒ 好处是不会「训了半天优化错了东西」，坏处是「直接优化指标就是 benchmark 过拟合的定义」</b> ⇒ <b>所以有一个真实的风险（讲者没点）：你在 AIME 风格的题上做 RL ⇒ 它在 AIME 上涨；但它在「没见过的那类推理」上涨多少是开放问题 —— 而讲者定义「推理」时说的「希望这些能力也能扩散到别的领域」，那个「希望」在这里才真正有了代价</b>。",r:"⚠ <b>数学那边的检查只比最终答案 —— 一个过程全错但答案蒙对的回答，拿到的奖励和完美回答一样</b>。⇒ 而「指示（instruct）你的模型去用」那些 token：<b>这个格式是靠 prompt 要求的，和前面「强迫它把答案放进 box」是同一个手法</b>。"});
  QUIZ(0,31,{t:"第一个奖励（检查 think token 在不在）检查的是什么？为什么它不能单独用？",o:["它检查答案格式","它检查推理的长度","它检查推理对不对；可以单独用","它只检查「有没有推理这个动作」（一对标签在不在），是纯格式奖励 —— 单独用模型会学会写一对空标签，所以必须配上「答案对不对」"],a:3,w:"⇒ 两个奖励一起，才逼出「真的用那段空间去推理」这个行为；而两者都只需要一个正则或一次测试运行，不需要任何模型。"});
});
KP("32 · ⭐ 总结，以及 R1-Zero 的那张曲线",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("53:11","no need for a model",166);
  note("⭐ 整个方案可以用一句话说完",640,194,"y");
  boxNode(130,222,1020,44,"整个方案一句话：跑 RL，奖励 =「think 标签在不在」+「最终结果对不对」的组合","r");
  note("而这两样「我们都能很容易地做到」—— 关键是接下来这五个字",640,292,"y");
  note("⭐ 「不需要一个模型」。对照 L5：那里要同时养策略、价值、参考、奖励四个模型",640,330,"g");
  note("⚠ 而最麻烦的那个「奖励模型」在这里被一个正则 + 一次单元测试取代了",640,368,"y");},"<b>整个方案可以用一句话说完，而那句「不需要一个模型」是全场最重的四个字。</b><br>⭐ 「不需要一个模型（No need for a model）」—— <b>请把这五个字和 L5 整整一讲对照</b>：L5 的 RLHF 要同时养「四个模型」：<b>策略、参考、奖励、价值</b>。<b>而其中「奖励模型」是最麻烦的那个</b>：<b>要收偏好数据、要训、会被 hack</b>。<br>而这里：那个模型被一个正则表达式和一次单元测试取代了。<br>这是这两讲之间最大的一处结构差异，<b>后果是连锁的</b>：<b>不用奖励模型</b> ⇒ <b>不用收偏好数据</b> ⇒ <b>边际成本归零</b>。<b>不用奖励模型</b> ⇒ 没有 reward hacking 的空间。<b>不用奖励模型</b> ⇒ 少一个模型要放进显存（L4 算过那很贵）。<br>所以推理这个场景不只是「能用 RL」，而是「用 RL 特别便宜」。<br>请注意那个词：「<b>组合（combination）</b>」：两个奖励不是二选一，是加在一起（典型做法是加权求和）。而权重怎么定是一个实际的调参问题，讲者这里没展开。<br>⚠ 这一镜是这一讲上半场所有线索的汇合点 —— <b>如果你只记一镜，记这一镜</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("54:10","only with these two verifiable rewards",166);
  note("⭐ 而它真的管用 —— 这张图来自 R1-Zero 的训练",640,194,"y");
  stack(640,218,["而它真的管用：AIME 上的表现随 RL 步数一路上涨，而且「涨得相当显著」","这张图来自 DeepSeek R1 的训练 —— 确切说是 R1-Zero","惊人之处：没有任何人教过它「怎么推理」,也没有一条人写的示范链","只有两个信号（写了 think 标签 · 答案对了），它自己摸出了多步推理"],780,32,6);
  note("这就是「Zero」的含义 —— 零人类示范，和 AlphaGo Zero 那个 Zero 是同一个意思",640,380,"r");},"<b>而它真的管用 —— 而这件事的惊人之处值得说清楚。</b><br>⭐ 请把这件事的惊人之处说清楚，<b>因为它很容易被当成一张普通的上升曲线</b>：<b>没有任何人教过它「怎么推理」</b>。<b>没有一条人写的推理链作为示范</b>。只有两个信号：「你写了 think 标签」和「你的答案对了」。<br><b>而它自己摸出了一整套多步推理的行为</b>。<br>这就是「<b>Zero</b>」这个名字的含义，<b>而这个命名是在致敬</b>：<b>AlphaGo</b>：先学人类棋谱，再自我对弈。<b>AlphaGo Zero</b>：<b>完全不看人类棋谱，纯自我对弈</b> ⇒ <b>反而更强</b>。<b>DeepSeek-R1-Zero</b>：<b>完全不做 SFT，纯 RL</b>。<br>而「Zero」在两处的含义一样：零人类示范。<br>这也正好验证了前面那个「<b>第二个事实</b>」：讲者猜「模型推理的方式可能和我们不同」。R1-Zero 证明了：不但可能不同，而且让它自己摸索真的能行。<br>⚠ 不过请记住「<b>R1-Zero</b>」不是「<b>R1</b>」—— R1-Zero 是纯 RL 的那个版本，它的推理链可读性差、会混语言；R1 在它基础上加了 SFT 冷启动，而后面会讲。");
  SUM(0,32,{h:"⭐ 「不需要一个模型」与那张曲线",k:"<b>「所以『总结一下』：我们会跑 RL，而我们用的奖励是『检查 think token 在不在』和『最终结果是对的』的『组合』—— 而我们看到这两者『我们都能很容易地做到』：『不需要一个模型』」</b> ⇒ <b>「如果你『相对于那些 benchmark 之一』画出模型的表现（这里是『AIME』），你会看到『随着你执行你的 RL 步，模型在那些 benchmark 上的表现，它们真的在涨』—— 而『它们涨得相当显著』；这张图其实来自『DeepSeek R1 的训练』—— 其实是『R1-Zero』⇒ 如果你『激励模型去思考并产生正确的答案』，它『真的能相当有意义地学会』——『只用这两个可验证的奖励』」</b>。",m:"⭐ 「不需要一个模型（No need for a model）」—— <b>请把这五个字和 L5 整整一讲对照</b>：<b>L5 的 RLHF 要同时养「四个模型」（策略、参考、奖励、价值），而其中「奖励模型」是最麻烦的那个：要收偏好数据、要训、会被 hack ⇒ 而这里，那个模型被一个正则表达式和一次单元测试取代了</b> ⇒ 后果是连锁的：<b>不用奖励模型 ⇒ 不用收偏好数据 ⇒ 边际成本归零；不用奖励模型 ⇒ 没有 reward hacking 的空间；不用奖励模型 ⇒ 少一个模型要放进显存（L4 算过那很贵）⇒ 所以推理这个场景不只是「能用 RL」，而是「用 RL 特别便宜」</b>。",w:"⭐ 请把那张曲线的惊人之处说清楚，<b>因为它很容易被当成一张普通的上升曲线</b>：<b>没有任何人教过它「怎么推理」、没有一条人写的推理链作为示范，只有两个信号（「你写了 think 标签」和「你的答案对了」）—— 而它自己摸出了一整套多步推理的行为</b> ⇒ 这就是「Zero」这个名字的含义，<b>而这个命名是在致敬</b>：<b>AlphaGo 先学人类棋谱再自我对弈；AlphaGo Zero 完全不看人类棋谱、纯自我对弈，反而更强；DeepSeek-R1-Zero 完全不做 SFT、纯 RL ⇒ 「Zero」在两处含义一样：零人类示范</b> ⇒ <b>这也正好验证了前面那个「第二个事实」：讲者猜「模型推理的方式可能和我们不同」，而 R1-Zero 证明了不但可能不同，而且让它自己摸索真的能行</b>。",r:"⚠ 请记住「R1-Zero」不是「R1」：<b>R1-Zero 是纯 RL 的那个版本，它的推理链可读性差、会混语言；R1 在它基础上加了 SFT 冷启动，而后面会讲</b>。⇒ 另外注意那个词「组合（combination）」：<b>两个奖励不是二选一，是加在一起（典型做法是加权求和），而权重怎么定是一个实际的调参问题，讲者这里没展开</b>。"});
  QUIZ(0,32,{t:"R1-Zero 那张 AIME 曲线惊人在哪？「Zero」是什么意思？",o:["惊人在训练只用了一天；Zero 指学习率为零","没人教过它「怎么推理」、没有一条人写的示范链，只有两个信号（有 think 标签、答案对）它就自己摸出了多步推理；「Zero」= 零人类示范（致敬 AlphaGo Zero）","惊人在它用了更大的模型；Zero 指零样本","惊人在它不需要 GPU"],a:1,w:"⇒ 而这正好验证了「模型推理的方式可能和我们不同」那个猜测：让它自己摸索真的能行。"});
});
KP("33 · ⭐ 思考预算（一）：不是所有 prompt 都该想那么久",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("54:29","there are some prompts that do not need the model to think too much",166);
  note("⭐ 那张欠条还了：怎么控制「想多久」",640,194,"y");
  stack(640,218,["那张「怎么控制想多久」的欠条还了：并不是所有 prompt 都平等","想太少 ⇒ 难题答不出 ｜ 想太多 ⇒ 简单题也烧几千 token，还不会更准","所以「想多久」不是越多越好，它是一个真正的最优化问题","⇒ 社区的做法叫 dynamic budget：别在不需要的问题上「过度思考」"],780,32,6);
  note("overthinking 在这里是技术术语不是比喻：问 2+2，它生成两千 token 讨论加法的定义",640,380,"r");},"<b>前面那张欠条还了：怎么控制「想多久」。</b><br>⭐ 把这个问题的两头都说清楚，<b>它是一个双向的问题</b>：<b>想太少</b>：难题答不出 ⇒ <b>准确率低</b>。<b>想太多</b>：简单题也烧几千 token ⇒ <b>慢、贵，而且准确率并不会更高</b>。<br>所以「想多久」不是「越多越好」，它是一个真正的最优化问题。<br>「<b>过度思考（overthinking）</b>」在这里是一个<b>技术术语</b>，<b>不是比喻</b>：它指：问「2+2 等于几」，模型生成两千个 token 讨论加法的定义。这件事真的会发生，而且是早期推理模型最常被抱怨的问题。<br>而根源很清楚：RL 只奖励「答对」，没有惩罚「写得长」。<br>请把这件事接回前面那个由定价逼出来的目标：「用最少的推理 token 拿到最大的推理能力」。而「dynamic budget（动态预算）」就是对这个目标的直接回答：按题目难度分配预算。<br>这和你那个课题里「给不同实例分配不同搜索预算」是同一个问题。<br>⚠ 讲者用「<b>社区里一直有很多工作</b>」这种措辞 —— <b>这是在说「这里还没有标准答案」</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("55:24","those LLMs, they have a limited context window",166);
  note("⭐ 第一个解法（分类器），和第二个约束（上下文窗口）",640,194,"y");
  stack(640,218,["解法一：一个快速分类器看一眼 prompt，判「高思考」还是「低思考」","⚠ 但讲者自己说「这更像是一个开放问题」——「这道题难不难」本身就要推理才知道","约束二性质完全不同：LLM 的上下文窗口是有限的","而推理链几千到几万 token，还要给 prompt 和答案留地方"],780,32,6);
  note("分类器那个是「该不该多想」（经济问题）;上下文那个是「还能不能多想」（硬限制，没得权衡）",640,380,"g");},"<b>第一个解法，以及一个完全不同性质的第二个约束。</b><br>⭐ 那个「<b>快速分类器</b>」方案的形状很简单，<b>而它的问题也很明显</b>：<b>做法</b>：一个小模型看一眼 prompt ⇒ 判「难」或「易」⇒ 据此设预算。<b>问题</b>：「这道题难不难」本身就是一个需要推理才能判断的问题。<br>所以这是一个「要先解决问题才能知道问题有多难」的循环 —— 这就是讲者说「更像是一个开放问题」的原因。<br>而「<b>上下文窗口</b>」这个约束<b>性质完全不同</b>：<b>分类器那个</b>：「<b>该不该多想</b>」⇒ 一个<b>经济</b>问题（花钱值不值）。<b>上下文那个</b>：「<b>还能不能多想</b>」⇒ 一个<b>硬限制</b>（物理上放不下了）。<br><b>而后者没有权衡可谈：超了就是超了</b>。<br><b>请想一下这个硬限制有多紧</b>：推理链<b>可以几千到几万 token</b>。而上下文窗口<b>还要装 prompt、要装最终答案</b>。<br>所以模型其实需要一种「我还剩多少空间」的意识 —— 而这件事它天然是没有的。<br>而这也顺带解释了为什么推理模型都特别强调长上下文：不是为了读长文档，是为了给思考留地方。<br>⚠ 「<b>这更像是一个开放问题</b>」—— 请把这句话记在这一讲所有「解法」的旁边：这一块整体上还没有定论。");
  SUM(0,33,{h:"⭐ 思考预算（一）",k:"<b>「假设我在教我的模型思考 —— 嗯，『并不是所有 prompt 都是平等的』：有些 prompt『不需要模型想太多』，相对于另一些『会需要一点点思考』的；所以社区里一直有很多关于『怎么控制模型思考的量』的工作 ⇒ 你会看到像『dynamic budget（动态预算）』这样的东西 —— 我们怎么能确保『模型不会在那些不需要太多思考的问题上「过度思考」』」</b> ⇒ <b>「所以为此，你可以有『一个快速的分类器』，它跑在 prompt 上，告诉你这是『一个高思考类的问题还是一个低思考的』—— 但『这更像是一个开放问题』」</b> ⇒ <b>「『第二个』是：这些 LLM『有一个有限的上下文窗口』—— 所以当 LLM 思考时，它也需要『意识到还剩多少上下文长度』」</b>。",m:"⭐ 把这个问题的两头都说清楚，<b>它是一个双向的问题</b>：<b>想太少 ⇒ 难题答不出 ⇒ 准确率低；想太多 ⇒ 简单题也烧几千 token ⇒ 慢、贵，而且准确率并不会更高 ⇒ 所以「想多久」不是「越多越好」，它是一个真正的最优化问题</b> ⇒ 而「过度思考（overthinking）」在这里是<b>技术术语不是比喻</b>：<b>问「2+2 等于几」，模型生成两千个 token 讨论加法的定义 —— 这件事真的会发生，而且是早期推理模型最常被抱怨的问题；根源很清楚：RL 只奖励「答对」，没有惩罚「写得长」</b>。",w:" 注意那两件事的性质完全不同：<b>分类器那个是「该不该多想」⇒ 一个经济问题（花钱值不值）；上下文那个是「还能不能多想」⇒ 一个硬限制（物理上放不下了）—— 而后者没有权衡可谈：超了就是超了</b> ⇒ 这个硬限制有多紧：<b>推理链可以几千到几万 token，而上下文窗口还要装 prompt、要装最终答案 ⇒ 所以模型其实需要一种「我还剩多少空间」的意识，而这件事它天然是没有的 ⇒ 这也顺带解释了为什么推理模型都特别强调长上下文：不是为了读长文档，是为了给思考留地方</b>。",r:"⇒ 那个「快速分类器」方案的形状很简单，<b>而它的问题也很明显</b>：<b>做法是一个小模型看一眼 prompt ⇒ 判「难」或「易」⇒ 据此设预算；问题是「这道题难不难」本身就是一个需要推理才能判断的问题 ⇒ 所以这是一个「要先解决问题才能知道问题有多难」的循环，这就是讲者说「更像是一个开放问题」的原因</b>。⇒ 请把这件事接回那个由定价逼出来的目标：<b>「用最少的推理 token 拿到最大的推理能力」—— 而「dynamic budget」就是对它的直接回答：按题目难度分配预算；这和你那个课题里「给不同实例分配不同搜索预算」是同一个问题</b>。⚠ <b>「这更像是一个开放问题」请记在这一讲所有「解法」的旁边：这一块整体上还没有定论</b>（讲者用「社区里一直有很多工作」这种措辞，也是在说这件事）。"});
  QUIZ(0,33,{t:"「思考预算」这个问题的两个约束，性质有什么不同？",o:["一个是经济问题（「该不该多想」—— 简单题过度思考只是浪费钱），一个是硬限制（「还能不能多想」—— 上下文窗口物理上放不下），后者没有权衡可谈","两个都是成本约束","两个都是硬限制","两个都靠分类器解决"],a:0,w:"⇒ 而那个「快速分类器」方案有个循环问题：「这道题难不难」本身就需要推理才能判断 —— 所以讲者说它「更像是一个开放问题」。"});
});
KP("34 · ⭐ 思考预算（二）：budget forcing，那个 \"Wait\"，以及连续思考",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("56:00","there is this term, budget forcing, that I think was introduced in this paper, S1",166);
  note("⭐ 一个很土但很有效的手法：直接往它嘴里塞一个词",640,194,"y");
  stack(640,218,["budget forcing（预算强制）—— 出自 S1 那篇论文，做法土得出奇","模型快写完推理链了（要输出 </think> 了）","你不让它输出结束标签，而是替它写一个「Wait」","⇒ 它看到 Wait 就继续写下去，典型地开始复查刚才的推理"],780,32,6);
  note("为什么有效：自回归模型只会续写，而「Wait」后面在训练数据里跟的几乎总是「重新考虑」",640,380,"r");},"<b>一个很土但出奇有效的手法：直接往它嘴里塞一个词。</b><br>⭐ <b>请停一下体会这件事有多朴素</b>：模型<b>快要写完推理链</b>了（要输出 <b>&lt;/think&gt;</b> 了）。你<b>不让它输出那个结束标签</b>，而是<b>替它写一个「Wait」</b>。模型看到「Wait」之后，就会继续往下写 —— 典型地是开始复查刚才的推理。<br>于是你就「延长」了它的思考，而完全没有改任何权重。<br>为什么这招有效：<b>它利用的是自回归的本性</b>：模型<b>只会「续写当前上下文」</b>。而「<b>Wait</b>」这个词在训练数据里<b>后面跟的几乎总是「重新考虑」</b>。<br>所以塞一个「Wait」就等于给了它一个「重新考虑」的强提示。<br>这篇 <b>S1</b>（Simple test-time scaling, Muennighoff et al. 2025）值得一提，<b>因为它的结论很有冲击力</b>：它用 1000 条样本做 SFT + budget forcing。就达到了接近 o1-preview 的数学表现。<br>而它的作者正是斯坦福的人 —— 所以讲者提它不只是因为相关。<br>⚠ 反方向也成立：想让它停，就强行插入 &lt;/think&gt; 和一句「答案是」—— 下一镜讲这个。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("56:31","sometimes the model will output something like, oh wait, wait, wait",166);
  note("⭐ 而这个行为是模型自己学出来的 —— 讲者顺手指了一眼",640,194,"y");
  stack(640,218,["而最有意思的是：这个「Wait」的行为是模型自己学出来的","看真实的推理链，它有时会写「哦，等一下，我想我发现了别的东西」","然后它就去走另一条推理路径 —— 没有人教过它这么写","⇒ 所以 budget forcing 不是人为设计的机制，它是在模仿这个自发行为"],780,32,6);
  note("这在 R1 论文里有名字：aha moment。⚠ 但别浪漫化 —— 它不是「意识到错了」,是奖励塑形出来的行为",640,380,"r");},"<b>而最有意思的是：这个「Wait」的行为是模型自己学出来的。</b><br>⭐ 请把上一镜和这一镜<b>连起来</b>看，<b>顺序很重要</b>：<b>先</b>：模型在 RL 里「自己」学会了说「Wait」然后重走一条路。<b>后</b>：人类发现了这个行为，于是「手动塞一个 Wait」来触发它。<br>所以 budget forcing 不是一个人为设计的机制，它是在模仿模型的自发行为。<br>这个自发行为在 R1 的论文里有一个名字，<b>而它是整件事最戏剧性的部分</b>：它被叫做「aha moment（顿悟时刻）」。指的就是：模型在纯 RL 训练中，没有任何人示范，自己开始写「等一下，让我重新想想」。<br>而这正是前面那个「第二个事实」最有力的证据：这种写法没有任何人类会写进题解。<br>不过也请保持清醒，<b>不要把它浪漫化</b>：<b>模型并没有「意识到自己错了」</b>。它只是学到了「在某些状态下写出『等一下』，后续答对的概率更高」。<br>这是一个被奖励塑造出来的行为模式，不是一个认知事件 —— 但它的效果是真的。<br>⚠ 「<b>一张我还没真的讲过的幻灯</b>」—— 他是临时指过去的，所以这一段讲得比较散。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("57:08","models may think on some other space, maybe not in the language space",166);
  note("⭐ 反方向的强制，以及一条更激进的研究线",640,194,"y");
  stack(640,218,["反方向完全对称：想让它停，就替它写「你的时间到了。现在我的答案是」","两招都是「替模型写一小段，让它续写」—— 这就是 budget forcing 的全部","更激进的一条线：模型也许根本不在「语言空间」里思考","⇒ 于是让 thinking token 不是 token，而是隐藏表示（continuous thoughts）"],780,32,6);
  note("动机：用 token 思考 = 每步把高维状态压成一个词再展开 —— 那是一道真实的信息瓶颈",640,380,"r");},"<b>反方向的强制，以及一条更激进的研究线。</b><br>⭐ 先把那个反方向的手法说清楚，<b>它和「Wait」完全对称</b>：<b>想让它多想</b> ⇒ <b>插入「Wait」</b>。<b>想让它停</b> ⇒ <b>插入「你的时间到了。现在我的答案是」</b>。<br>两招都是「替模型写一小段，然后让它续写」—— 这就是 budget forcing 的全部技术内容。<br>而「连续思考（continuous thoughts）」那条线的动机非常直接：现在的推理链是<b>一串 token</b>，也就是<b>人类语言</b>。但模型内部的状态是<b>高维连续向量</b>。所以用 token 思考 = 每一步都要把高维状态「压缩成一个词」，再在下一步重新展开。<br>而这是一道货真价实的信息瓶颈 —— 为什么不让它直接在向量空间里想？<br>讲者说「<b>更有意义，但也更压缩</b>」，<b>这两个词都要解释</b>：「<b>更有意义</b>」：一个连续向量能携带的信息远多于一个离散 token。「<b>更压缩</b>」：所以同样的「想法」需要的步数更少 ⇒ 更省算力。<br>而代价是：你完全看不懂它在想什么 —— 可解释性归零。<br>⚠ 讲者提的那篇 2024 年的论文是 Coconut（Chain of Continuous Thought, Hao et al.） —— <b>而这条线至今没有成为主流</b>。");
  SUM(0,34,{h:"⭐ budget forcing 与连续思考",k:"<b>「也有一些工作去『强迫模型要么多想、要么停下』—— 所以有这个词『budget forcing（预算强制）』，我想它是在『S1』那篇论文里被引入的：如果你想让模型『继续思考』，你会『在中途插入一些 token』去『强迫它多想』—— 而这样的 token 比如说是『Wait』」</b> ⇒ <b>「如果你看这条推理链，『有时候模型会输出类似「哦，等一下，等一下，等一下，我想我发现了别的东西」』—— 而典型地，模型会『再走一条别的推理路径』；而这可以是一个『激励你的模型多想』的方式」</b> ⇒ <b>「或者另一个词可以是：『好，你的时间到了。现在我的答案是』—— 它会『强迫你的模型回答』」</b> ⇒ <b>「你的模型在它的推理链里『给出的是 token』—— 但『模型也许在某个「别的空间」里思考，也许「不在语言空间」里』⇒ 所以也有一条工作线围绕『拥有某些「连续的思考」』：让这个 thinking token 其实『不是 token』，而是『隐藏表示』——『它们可以更有意义，但也更压缩』」</b>。",m:"⭐ 请把两镜<b>连起来</b>看，<b>顺序很重要</b>：<b>先是模型在 RL 里「自己」学会了说「Wait」然后重走一条路；后是人类发现了这个行为，于是「手动塞一个 Wait」来触发它 ⇒ 所以 budget forcing 不是一个人为设计的机制，它是在模仿模型的自发行为</b> ⇒ 这个自发行为在 R1 的论文里有名字：<b>「aha moment（顿悟时刻）」—— 模型在纯 RL 训练中，没有任何人示范，自己开始写「等一下，让我重新想想」；而这正是前面「第二个事实」最有力的证据：这种写法没有任何人类会写进题解</b> ⇒ 两个方向完全对称：<b>想让它多想 ⇒ 插入「Wait」；想让它停 ⇒ 插入「你的时间到了。现在我的答案是」—— 两招都是「替模型写一小段，然后让它续写」，这就是 budget forcing 的全部技术内容</b>。",w:"⭐ 请保持清醒，<b>不要把「aha moment」浪漫化</b>：<b>模型并没有「意识到自己错了」—— 它只是学到了「在某些状态下写出『等一下』，后续答对的概率更高」；这是一个被奖励塑造出来的行为模式，不是一个认知事件 —— 但它的效果是真的</b> ⇒ 而「Wait」这招为什么有效：<b>它利用的是自回归的本性 —— 模型只会「续写当前上下文」，而「Wait」这个词在训练数据里后面跟的几乎总是「重新考虑」⇒ 所以塞一个「Wait」就等于给了它一个「重新考虑」的强提示</b>。",r:"⇒ 「连续思考（continuous thoughts）」那条线的动机非常直接：<b>现在的推理链是一串 token（人类语言），但模型内部的状态是高维连续向量 ⇒ 用 token 思考 = 每一步都要把高维状态「压缩成一个词」，再在下一步重新展开 —— 这是一道货真价实的信息瓶颈</b> ⇒ 讲者说「更有意义，但也更压缩」：<b>「更有意义」是一个连续向量能携带的信息远多于一个离散 token；「更压缩」是同样的「想法」需要的步数更少 ⇒ 更省算力；而代价是你完全看不懂它在想什么 —— 可解释性归零</b>。⚠ <b>S1（Simple test-time scaling, Muennighoff et al. 2025）值得一提：它用 1000 条样本做 SFT + budget forcing 就达到接近 o1-preview 的数学表现，而作者正是斯坦福的人；而「连续思考」那篇 2024 年的是 Coconut（Chain of Continuous Thought），这条线至今没有成为主流</b>。"});
  QUIZ(0,34,{t:"budget forcing 怎么让模型「多想一会儿」？而这个手法从哪来？",o:["加大 KL 惩罚","重新训练模型","调大温度","在它快写完推理链时替它插一个「Wait」，模型就会续写下去（典型地开始复查）—— 而这是在模仿模型自己在 RL 里学出来的「aha moment」行为"],a:3,w:"⇒ 反方向对称：想让它停就插入「你的时间到了。现在我的答案是」—— 两招都是「替模型写一小段，让它续写」，一个权重都不改。"});
});

  stack(640,218,["⭐ 讲者亲口给的 takeaway，请原样收下","「如果我们从零开始（意思是我们没有推理链），我们想用 RL 去激励模型多想」","⚠ 前置条件不是客套，它是这个结论的适用范围","所以这不是「RL 比 SFT 好」,是「没有链的时候只能走 RL」"],780,32,6);
  note("有链之后 SFT 就够了，而且便宜得多 —— 那正是这一讲最后「蒸馏」那一段要讲的",640,380,"r");},"<b>讲者亲口给的 takeaway，而那个前置条件是它最重要的部分。</b><br>⭐ 请把那个前置条件和结论<b>一起</b>记，<b>只记结论会出错</b>：<b>结论</b>：<b>用 RL 去激励模型多想</b>。<b>前置条件</b>：「如果我们从零开始」，也就是「我们没有推理链」。<br>所以这不是「RL 比 SFT 好」，而是「在没有推理链的时候，只能走 RL」。<br>这个区分有一个非常实际的后果，<b>而它马上就会出现</b>：<b>第一个推理模型</b>（没有任何链可用）⇒ <b>必须用 RL</b>。<b>第二个之后</b>（可以从第一个那里拿到链）⇒ <b>SFT 就够了，而且便宜得多</b>。<br>而这正是「蒸馏」那一段要讲的：R1 训出来之后，用它的链去 SFT 一堆小模型。<br>所以这一讲的整条逻辑线现在完整了：没有链 ⇒ 用 RL 从零长出推理能力（R1-Zero / R1）。有了链 ⇒ 用 SFT 把能力传下去（蒸馏）。<br>而前面那三张「不做 SFT 的票」，只对第一步成立。<br>⚠ 讲者问「<b>我用那些论证把你们说服好了吗</b>」—— 他在主动邀请反驳，这一讲里他问了好几次。");

  stack(640,218,["执行那一步 RL 的算法叫 GRPO —— 2024 年发布","它一直是「所有这些推理任务的首选 RL 算法」","⚠ 来历容易搞错：它出自 DeepSeekMath（2024-02），比 R1 早将近一年","⇒ 所以 R1 不是 GRPO 的发明者，它是 GRPO 最成功的使用者"],780,32,6);

  note("而那两层约束是并存的：clip 参照上一轮（管速度）· KL 参照 SFT 模型（管位移）",640,380,"r");},"<b>第二件事，然后是这一整块的那句关键的话。</b><br>⭐ 他把 L5 那两层「<b>别跑太远</b>」又说了一遍，<b>而这两层很容易混</b>：偏离「旧模型」（π_old，上一轮 RL 迭代） ⇒ <b>由 clip 管</b> ⇒ <b>管的是「速度的上限」</b>。偏离「基础模型」（π_ref，SFT 阶段的那个） ⇒ <b>由 KL 惩罚管</b> ⇒ <b>管的是「位移的上限」</b>。<br>两条约束并存，不是二选一 —— 这是 L5 里反复强调过的那个符号陷阱。<br>所以 GRPO 的「<b>继承清单</b>」现在很清楚了：<b>目标</b>：<b>最大化 advantage</b> ✓ <b>和 PPO 一样</b>。<b>约束一</b>：<b>clip（别一步走太大）</b> ✓ <b>和 PPO 一样</b>。<b>约束二</b>：<b>KL 惩罚（别离参考模型太远）</b> ✓ <b>和 PPO 一样</b>。<b>advantage 怎么算</b>：<b>✗ 不一样</b>。<br>这个「<b>只改一处</b>」的结构本身值得学：GRPO 不是一个新框架，它是对一个成熟算法的一处替换。<b>而那一处替换省掉了一整个要训练的模型</b>。<br>这是最好的那种论文：改动最小，收益最大，而且你一眼就能看懂改了什么。<br>⚠ 从这里开始的四镜是这一讲的技术核心 —— <b>请放慢</b>。");
  SUM(0,36,{h:"⭐ GRPO 与 PPO 的共同部分",k:"<b>「我们要看的这个算法叫『GRPO』—— 而 GRPO 是『2024 年』发布的，而它一直是『所有这些推理任务的「首选」RL 算法』」</b> ⇒ <b>「GRPO 代表『group relative policy optimization』—— 而它是一个『非常像 PPO』的 RL 算法，目标是做『我们谈过的那两件事』：第一件是『最大化 advantage』（而 advantage 是『某个告诉你「你作为答案产生的东西，是不是比你会预期的更好」』的东西）」</b> ⇒ <b>「第二部分是：你『不想偏离太多』—— 要么偏离『旧模型』（上一轮迭代），要么偏离『基础模型』（SFT 阶段的那个）⇒ 所以在那个意义上 GRPO 也在做和 PPO『一样的事』；但接着『有一个「关键的」差别』—— 而『那个差别在于「它怎么计算 advantage」』」</b>。",m:"⭐ 把名字拆开读，<b>整个算法就说完了一半</b>：<b>「Policy Optimization」= 和 PPO 一样，优化策略（你的 LLM）；「Relative」= advantage 是「相对的」，相对于某个参照；「Group」= 而那个参照是「同一个 prompt 的一组 completion」⇒ 所以名字本身就是算法的定义：在一组里相对地算优势，然后优化策略</b> ⇒ 请确认 advantage 的定义（L5 讲过）：<b>advantage = 「实际拿到的」−「本来预期的」—— 为正就把这个行为的概率往上调，为负就往下调</b> ⇒ <b>而「本来预期的」是什么，就是 PPO 和 GRPO 唯一的分歧点：PPO 用一个专门训练的 value function 给出预期，GRPO 用同一组其它 completion 的平均奖励 —— 请把这一句记住，这一整块都是它的展开</b>。",w:" 他把 L5 那两层「别跑太远」又说了一遍，<b>而这两层很容易混</b>：<b>偏离「旧模型」（π_old，上一轮 RL 迭代）⇒ 由 clip 管 ⇒ 管「速度的上限」；偏离「基础模型」（π_ref，SFT 阶段的那个）⇒ 由 KL 惩罚管 ⇒ 管「位移的上限」—— 两条约束并存不是二选一，这是 L5 里反复强调过的那个符号陷阱</b> ⇒ 所以 GRPO 的<b>继承清单</b>很清楚：<b>目标（最大化 advantage）✓ 和 PPO 一样；约束一（clip）✓ 一样；约束二（KL 惩罚）✓ 一样；advantage 怎么算 ✗ 不一样</b>。",r:" 先把来历钉清楚，<b>因为这件事经常被搞错</b>：<b>GRPO 出自「DeepSeekMath」那篇论文（2024 年 2 月），而 R1 是 2025 年 1 月 ⇒ 所以 R1 不是 GRPO 的发明者，它是 GRPO 最成功的使用者</b> ⇒ 「首选（go-to）」不是修辞：<b>2025 年之后几乎每一个开源推理模型的训练流程里都是 GRPO，而它的变体（DAPO、GSPO、Dr. GRPO 等）也都是从它改的 ⇒ 所以这一块是这一讲里「最该学会」的部分，它的保质期比别的部分长</b>。⇒ 而这个「只改一处」的结构本身值得学：<b>GRPO 不是一个新框架，它是对一个成熟算法的一处替换，而那一处替换省掉了一整个要训练的模型 —— 这是最好的那种论文：改动最小、收益最大，而且你一眼就能看懂改了什么</b>。⚠ <b>「比你会预期的更好」—— 注意 advantage 关心的从来不是「好不好」，而是「比预期好不好」</b>。"});

  stack(640,218,["PPO 怎么算：奖励是「completion 级」的 —— 一整条回答，一个数","但 RL 要对每一个 token 决定该上调还是下调 ⇒ 粒度对不上","所以它还要一个「联合训练」的 value function 来补这个缺口","value function：给一段部分生成，估「按策略写完后最终奖励是多少」"],780,32,6);
  note("这件事在 L5 里有名字：功劳分配（credit assignment）—— 而「联合训练」四个字是下一镜那个瓶颈的源头",640,380,"g");},"<b>先把 PPO 那一套完整回忆一遍，不然下一镜的对比没有意义。</b><br>⭐ 请把 <b>value function</b> 的那个定义原样记住，<b>它在 L5 里出现过</b>：<b>输入</b>：一段<b>部分生成</b>（prompt + 已经写了一半的回答）。<b>输出</b>：「如果按当前策略把它写完，最终奖励大概是多少」。<br>所以它是一个「预期」的估计器 —— 而 advantage 就是「实际 − 预期」。<br>为什么 PPO <b>需要</b>这个东西：奖励只在<b>整条 completion 写完</b>之后才有一个数。但 RL 要<b>对每一个 token</b> 决定「该上调还是下调它的概率」。<br>所以你需要一个东西，告诉你「写到这里为止，形势是好还是坏」—— 那就是 value function。<br>而这件事在 L5 里有一个名字：功劳分配（credit assignment）。<br>注意「联合训练（training jointly）」这四个字，<b>它是下一镜那个瓶颈的源头</b>：value function 不是现成的，它要和策略一起训。而它典型地和策略一样大（因为它也得读懂整个上下文）。<br>⚠ 所以 PPO 训练时<b>显存里要放两个大模型的梯度</b> —— 而那正是 L5 说的「四个模型」里最贵的一笔。");

  note("所以去掉它不只是省钱，也去掉了一个误差来源 —— 而 GRPO 恰好把 GAE 整个扔掉了",640,380,"r");},"<b>那个瓶颈，而讲者顺手承认了 L5 跳过了 GAE 的公式。</b><br>⭐ 先替你确认一件事：<b>L5 真的跳过了 GAE</b>：L5 讲了 advantage 是什么、讲了 value function 是什么。但没有写出 GAE 那个公式 —— 讲者这里说「我们其实没有看过」，他记得没错。<br>而这不影响你理解 GRPO：因为 GRPO 恰好是把 GAE 整个扔掉了。<br>把那个瓶颈的代价<b>算一下</b>，<b>你就知道为什么这是个大问题</b>：value function 典型地<b>和策略一样大</b>（比如 7B）。它要存<b>参数 + 梯度 + 优化器状态</b>（Adam 要两份动量）。<b>所以它大致把训练显存需求翻了一倍</b>（L4 算过这笔账）。<br>而它还要调超参、还可能训不稳 —— 它自己就是一个会出问题的模型。<br>请注意这个瓶颈是<b>两重</b>的，<b>而两重都值得记</b>：<b>计算上</b>：<b>多一个和策略同等大小的模型要训</b>。<b>方法上</b>：value function 自己估不准时，advantage 就错，而策略会跟着错。<br>所以去掉它不只是省钱，也去掉了一个误差来源。<br>⚠ 「<b>一个非常复杂的公式</b>」—— GAE 的公式确实不短，但它的想法只是「把不同步数的回报按指数加权平均」。");
  SUM(0,37,{h:"⭐ PPO 的 value function 瓶颈",k:"<b>「PPO 是『通过取那些奖励』来估计 advantage 的 —— 而那些奖励是『在 completion 这个层面上』的：你有你的 prompt，有『一个完整的回答』，基于那两个元素你有一个奖励 ⇒ 所以 PPO 做的事，是『把那个考虑进来，连同另一个它在训练时「联合训练」的东西』——『value function（价值函数）』；而 value function 的目标是『试着预测：如果我们按照策略继续生成 token，那个奖励会是多少』」</b> ⇒ <b>「这里的 advantage 在 PPO 的情形里，是『某个我们基于「一个非常复杂的、我们其实没有看过的公式」』得到的东西 —— 那个叫『generalized advantage estimation（GAE）』⇒ 而那件事的『最大限制』是：『你必须把一个 value function 和你的策略「联合训练」』—— 所以这个『大瓶颈』」</b>。",m:"⭐ 请把 value function 的定义原样记住（L5 讲过）：<b>输入是一段部分生成（prompt + 写了一半的回答），输出是「如果按当前策略写完，最终奖励大概多少」⇒ 所以它是一个「预期」的估计器，而 advantage 就是「实际 − 预期」</b> ⇒ 为什么 PPO <b>需要</b>它：<b>奖励只在整条 completion 写完后才有一个数，但 RL 要对每一个 token 决定「该上调还是下调它的概率」⇒ 所以你需要一个东西告诉你「写到这里为止，形势是好还是坏」—— 那就是 value function，而这件事在 L5 里的名字是功劳分配（credit assignment）</b>。",w:" 把那个瓶颈的代价<b>算一下</b>：<b>value function 典型地和策略一样大（比如 7B），它要存参数 + 梯度 + 优化器状态（Adam 要两份动量）⇒ 所以它大致把训练显存需求翻了一倍（L4 算过这笔账）；而它还要调超参、还可能训不稳 —— 它自己就是一个会出问题的模型</b> ⇒ 所以这个瓶颈是<b>两重</b>的：<b>计算上是「多一个和策略同等大小的模型要训」；方法上是「value function 自己估不准时，advantage 就错，而策略会跟着错」⇒ 所以去掉它不只是省钱，也去掉了一个误差来源</b>。",r:"⇒ 先替你确认一件事：<b>L5 真的跳过了 GAE —— L5 讲了 advantage 是什么、value function 是什么，但没写出 GAE 那个公式，讲者这里说「我们其实没有看过」他记得没错；而这不影响你理解 GRPO，因为 GRPO 恰好是把 GAE 整个扔掉了</b>。⚠ <b>「一个非常复杂的公式」—— GAE 的公式确实不短，但它的想法只是「把不同步数的回报按指数加权平均」</b>。⇒ 另外注意「联合训练（training jointly）」这四个字是那个瓶颈的源头：<b>value function 不是现成的，它要和策略一起训，而它典型地和策略一样大（因为它也得读懂整个上下文）⇒ 所以 PPO 训练时显存里要放两个大模型的梯度，而那正是 L5 说的「四个模型」里最贵的一笔</b>。"});
  QUIZ(0,37,{t:"PPO 的「大瓶颈」是什么？它是几重的？",o:["奖励模型太贵；一重","KL 惩罚太强；一重","clip 的阈值不好调；一重","必须把一个 value function 和策略「联合训练」—— 两重：计算上多一个同等大小的模型要训，方法上它估不准时 advantage 就错"],a:3,w:"⇒ 所以去掉 value function 不只是省钱，也去掉了一个误差来源 —— 而 GRPO 正是把它整个扔掉了。"});

KP("38 · ⭐ GRPO 的办法：和同一个 prompt 的其它 completion 比",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,218,["GRPO 说：我们不要那么做","取一条 completion，算它的奖励","然后把它和「同一个 prompt 的那些 completion 的平均奖励」比","⭐ 本质：那个「预期」不再由模型预测，而是由同组其它样本当场测出来"],780,32,6);
  note("也就是用「蒙特卡洛估计」换掉「学出来的估计器」—— 而这招只在 LLM 上可行，下一镜说为什么",640,380,"r");},"<b>整个 GRPO 的核心，就这四句话。</b><br>⭐ 请看清这一招的本质，<b>它只换了一样东西</b>：advantage 需要一个「<b>预期</b>」作为基线。<b>PPO</b>：那个预期由<b>一个模型「预测」出来</b>。<b>GRPO</b>：那个预期由<b>同组其它样本「当场测」出来</b>。<br>也就是：用「蒙特卡洛估计」替换「学出来的估计器」。<br>为什么这招在 LLM 上特别合适，<b>而在传统 RL 上不行</b>：<b>传统 RL</b>：一个状态<b>只能走一次</b>（你没法把机器人倒回去重走）。<b>LLM</b>：同一个 prompt 可以采样无数次 —— 每次都是一个完整独立的轨迹。<br>所以「同一个起点重开 g 次」这件事在 LLM 上是免费的，在机器人上是不可能的。<br>而这正是为什么 GRPO 必须等到 LLM 时代才被发明。<br>请注意那句「<b>同一个 prompt</b>」，<b>它是全部的关键</b>：<b>比较只能在同一道题内部进行</b>。跨题比较没有意义（难题的奖励本来就低）。<br>而这一点正是下面那个「简单题 vs 难题」例子要说的事。<br>⚠ 「<b>我们不要那么做</b>」—— 讲者在用 GRPO 作者的口吻说话，而这个语气很准确：GRPO 的论文正是这么论证的。");

  note("而传统 RL 里一个状态只能走一次（没法把机器人倒回去重走）—— 所以 GRPO 必须等到 LLM 时代",640,380,"r");},"<b>一个具体例子，把「组」这个词坐实。</b><br>⭐ 用一行把它写清楚，这就是 GRPO 的 advantage:⇒ 对第 i 条 completion：A_i = r_i − mean(r₁ … r_g)。其中 <b>g</b> 是这一组的大小（<b>典型地 8 到 64</b>）。<br>而稍后会看到实际还除了一个标准差 —— 讲者自己会说那一处可能不是最好的做法。<br>「<b>那个 prompt 是共享的</b>」这句话请不要跳过：一组里的 g 条 completion，回答的是同一道题。它们唯一的差别是<b>采样的随机性</b>（所以温度又回来了）。<br>于是「比较」是公平的：难度相同、prompt 相同，只有运气和走法不同。<br>这个设计有一个漂亮的副作用，<b>请自己想一下</b>：如果一组里 g 条全对 ⇒ 平均 = 满分 ⇒ 所有 advantage 都是 0 ⇒ 这道题不产生任何梯度。如果一组里 g 条全错 ⇒ 同样，所有 advantage 都是 0。<br>所以 GRPO 自动忽略「太简单」和「太难」的题，只从「有的对有的错」的题上学。那正是信息量最大的那些题 —— 一个免费得到的课程学习（curriculum）效果。<br>⚠ 不过这也是一个已知缺点：全对或全错的那一组算力完全白费了，而后续的变体（如 DAPO）专门在修这件事。");

  note("⚠ 但它划算 —— 生成是推理（不存梯度、可并行），训 value function 是训练（显存几倍）",640,360,"v");},"<b>好处用一句话说完，而那个交换非常清楚。</b><br>⭐ 请把这笔交换完整地算一下，<b>因为它不是「净赚」</b>：<b>省下</b>：一个和策略同等大小的 value function（参数 + 梯度 + 优化器状态 + 调参 + 不稳）。<b>付出</b>：每个 prompt 要生成 g 条 completion 而不是 1 条（<b>推理算力 × g</b>）。<br><b>所以它是「把训练成本换成了推理成本」</b>。<br>为什么这笔交换是划算的，<b>而理由很具体</b>：生成 completion 是「推理」 ⇒ 不需要存梯度、可以大批量并行、可以用量化和 FlashAttention（L4 那一整讲）。训练一个 value function 是「训练」 ⇒ 要存梯度和优化器状态，显存占用是推理的好几倍。<br>所以「多生成几条」比「多训一个模型」便宜得多，而且工程上简单得多。<br>而「<b>我们做的唯一一件事</b>」这个说法值得记住：GRPO 的全部实现差异，就是「采 g 条，然后减去均值」。没有新的网络、没有新的损失项、没有新的超参（除了 g）。<br>这就是为什么它被这么快地普及：改动小到几十行代码。<br>⚠ 「<b>那你会改做什么呢？</b>」—— 讲者在把一个学生的追问重述给全班，而那个问题是「为什么要这么做」，下一个知识点就是答它。");
  SUM(0,38,{h:"⭐ GRPO 的 advantage",k:"<b>「与之相对，GRPO 说：『我们不要那么做』—— 我们要『取一个 completion』、要『算每一个的奖励』,而我们要『把它和「同一个 prompt 的那些 completion 的奖励的平均值」比较』」</b> ⇒ <b>「假设我们有一个『数学题』：我们要『为「同一个」prompt 生成「多个」completion』—— 而那个 prompt 是『共享的』⇒ 对每一个 completion，我们要衡量『那个 completion 的奖励』和『所有其它 completion 的奖励』之间的『一个「相对度量」』⇒ 这会给我们一个『它比「这一组里的其余」好多少或者差多少』的概念 —— 而『这就会是我们的 advantage』」</b> ⇒ <b>「所以这里的『大好处』是：我们『不用 value function』了 —— 我们做的『唯一』一件事，是『采样不只一个、而是多个 completion』,为了『算出这一组的奖励的平均值』」</b>。",m:"⭐ 用一行写清楚：<b>对第 i 条 completion，A_i = r_i − mean(r₁…r_g)，其中 g 是组大小（典型 8 到 64）—— 稍后会看到实际还除了一个标准差，而讲者自己会说那一处可能不是最好的做法</b> ⇒ 这一招的本质是只换了一样东西：<b>advantage 需要一个「预期」作为基线 —— PPO 用一个模型「预测」它，GRPO 用同组其它样本「当场测」它 ⇒ 也就是用「蒙特卡洛估计」替换「学出来的估计器」</b> ⇒ <b>而为什么这招在 LLM 上特别合适、在传统 RL 上不行：传统 RL 里一个状态只能走一次（你没法把机器人倒回去重走）；LLM 里同一个 prompt 可以采样无数次，每次都是一个完整独立的轨迹 ⇒ 「同一个起点重开 g 次」在 LLM 上免费、在机器人上不可能 —— 这正是为什么 GRPO 必须等到 LLM 时代才被发明</b>。",w:"⭐ 这个设计有一个漂亮的副作用，<b>请自己想一下</b>：<b>如果一组里 g 条全对 ⇒ 平均 = 满分 ⇒ 所有 advantage 都是 0 ⇒ 这道题不产生任何梯度；全错也一样 ⇒ 所以 GRPO 自动忽略「太简单」和「太难」的题，只从「有的对有的错」的题上学，而那正是信息量最大的那些题 —— 一个免费得到的课程学习（curriculum）效果</b> ⚠ <b>不过这也是一个已知缺点：全对或全错的那一组算力完全白费了，而后续的变体（如 DAPO）专门在修这件事</b>。",r:" 请把这笔交换完整地算一下，<b>因为它不是「净赚」</b>：<b>省下的是一个和策略同等大小的 value function（参数 + 梯度 + 优化器状态 + 调参 + 不稳）；付出的是每个 prompt 要生成 g 条 completion 而不是 1 条（推理算力 × g）⇒ 所以它是「把训练成本换成了推理成本」</b> ⇒ 为什么划算：<b>生成 completion 是「推理」—— 不存梯度、可以大批量并行、可以用量化和 FlashAttention（L4 那一整讲）；训一个 value function 是「训练」—— 要存梯度和优化器状态，显存占用是推理的好几倍 ⇒ 所以「多生成几条」比「多训一个模型」便宜得多，工程上也简单得多</b> ⇒ <b>而「我们做的唯一一件事」值得记住：GRPO 的全部实现差异就是「采 g 条，然后减去均值」—— 没有新网络、没有新损失项、没有新超参（除了 g），所以它被普及得这么快：改动小到几十行代码</b>。⇒ 另外「那个 prompt 是共享的」请不要跳过：<b>一组里 g 条回答的是同一道题，唯一差别是采样的随机性（所以温度又回来了）⇒ 于是比较是公平的：难度相同、prompt 相同，只有运气和走法不同</b>。"});
  QUIZ(0,38,{t:"GRPO 用什么替代了 value function？这笔交换换走了什么？",o:["用「同一个 prompt 采 g 条 completion 的平均奖励」当基线 —— 把训练成本换成了推理成本（省一个要训的模型，付 g 倍生成算力）","用奖励模型的输出当基线；换走了标注成本","直接去掉 advantage；换走了稳定性","用一个更小的 value function；换走了精度"],a:0,w:"⇒ 而这笔交换划算，因为「生成」是推理（不存梯度、可并行），「训 value function」是训练（显存占用是推理的好几倍）。"});

  note("2017 年的 RL：长轨迹、每步有奖励、重开一局很贵 ⇒ 必须学一个估计器；而 LLM 三条全反过来",640,380,"r");},"<b>讲者的回答从一个时间差开始，而这个角度很有启发。</b><br>⭐ 这是一个很有用的思维习惯，<b>请记下来</b>：一个方法的设计假设，来自它被发明时的那个问题。<b>而不是来自你现在的问题</b>。<br>所以搬用一个方法之前，先问：「它当初是为什么样的问题设计的」。<br>把 <b>PPO 当初的世界</b>想一下，<b>你就知道差别在哪</b>：<b>2017 年的 RL 场景</b>：Atari 游戏、机器人控制、连续控制。<b>那里的特征</b>：一条轨迹很长、每一步都有即时奖励、而且「重开一局」很贵。<br>所以你必须用一个学出来的 value function 去「猜」形势，因为你没法重采样同一个状态。<br>而 <b>LLM 的世界</b>恰好反过来：一条轨迹<b>只有一个终局奖励</b>（答案对不对）。而「重开一局」几乎免费（同一个 prompt 再采一次）。<br>所以那个「必须学一个估计器」的理由在 LLM 上消失了 —— 而 GRPO 只是注意到了这件事。<br>⚠ 「<b>也许在语言这个世界里不是</b>」—— 这句话很克制，但它其实是在说「PPO 的 value function 在 LLM 上是一个多余的复杂度」。");

  note("讲者用的词是「烤进（bake into）」—— 你想要的性质是机制的副产品，不是外加的补丁",640,380,"r");},"<b>那个例子说清了「相对」为什么必要，而它自动实现的方式很优雅。</b><br>⭐ 请注意这件事是<b>怎么自动实现的</b>，<b>不需要任何额外机制</b>：<b>简单题</b>：g 条里大部分都对 ⇒ 组内平均奖励高 ⇒ 你答对了，advantage 很小。<b>难题</b>：g 条里大部分都错 ⇒ 组内平均奖励低 ⇒ 你答对了，advantage 很大。<br>所以「难题的好解更值钱」这件事，是「减去组内均值」这个操作的直接后果。<br>把这个和 PPO 对照一下，<b>差别就很清楚</b>：<b>PPO</b>：也靠基线做这件事，<b>但那个基线是一个模型「猜」的</b>。而那个模型猜得准不准，直接决定了这个校正对不对。<br>GRPO 的基线是「当场测的」，所以它在这一点上天然更可靠。<br>「<b>烤进（bake into）</b>」这个词用得很好：它指「不是外加一个规则，而是让它成为公式的自然结果」。而这正是一个好设计的标志：你想要的性质，是机制的副产品，不是补丁。<br>这一点对你写论文也有用：如果一个性质要靠额外规则来保证，那通常说明你的主机制还没找对。<br>⚠ 「<b>上调那些 token 的权重</b>」—— 注意最终被改的是「每一个 token 的生成概率」，advantage 只是那个改动的幅度。");

  note("这也解开了 L5 那处困惑：公式里 KL 写在目标函数里，代码里却在奖励里 —— 两者数学上等价",640,380,"r");},"<b>一个 L5 跳过的实现细节，而它值得看清楚。</b><br>⭐ 请把这个数据结构<b>画出来</b>，<b>它很具体</b>：一条 completion 有 <b>T</b> 个 token ⇒ 奖励是一个<b>长度 T 的向量</b>。<b>第 1 到 T−1 格</b>：只有 −β·KL（那一个 token 的 KL 惩罚）。<b>第 T 格（最后一个）</b>：<b>任务奖励 r ＋ −β·KL</b>。<br>所以任务奖励是「稀疏的」：一整条几千 token，只有最后一格有它。<br>为什么要把 KL 写成「<b>每 token</b>」而不是一个总项：因为 KL 本来就是<b>逐 token 定义</b>的（比较两个分布在每一步的差异）。而把它<b>塞进奖励向量</b>，就能让它自动走完 GAE 那一整套 advantage 计算。<br>也就是说：这是一个「不用改算法，只改输入」的实现技巧。<br>这件事解释了 L5 那个让人困惑的地方：L5 的公式里 KL 写在目标函数里（max E[r] − β·KL）。<b>但实际代码里它在奖励里</b>。<br>两者数学上等价，而讲者在这里把这层对应关系补上了。<br>⚠ 「<b>我们上次没看到</b>」—— 这是讲者在补 L5 的一个空白，而他下一镜会说这件事「不是超级重要」。");

  note("GAE 的工作就是把这两个向量揉成一个 advantage 向量 —— 而那个价值模型和策略一样大",640,380,"r");},"<b>然后 value function 登场，而它也是「每 token」的。</b><br>⭐ 请把 PPO 现在手上的两个向量<b>并排</b>看一眼：<b>奖励向量</b>（长度 T）：<b>最后一格有任务奖励，每一格有 KL</b>。<b>价值向量</b>（长度 T）：<b>每一格是「从这里写完能拿多少」的预测</b>。<br>而 GAE 的工作就是：把这两个向量揉成一个 advantage 向量。<br>所以 PPO 的复杂度来源现在很清楚了：<b>它要在「token 级」上做功劳分配</b>。而为此它需要一个「每一步都能给出预测」的模型。<br>而那个模型必须和策略同等规模，因为它也要读懂整个上下文。<br>请对照 GRPO 在这件事上的选择，<b>它非常激进</b>：GRPO 干脆不做 token 级的功劳分配。一整条 completion 里的每一个 token，共享同一个 advantage 值。<br>所以 GRPO 的 advantage 是「序列级」的，PPO 的是「token 级」的。这是一个真实的精度损失 —— 但实践证明在 LLM 上它不要紧，而省下的成本很大。<br>⚠ 「<b>不是超级重要要记住的</b>」—— 讲者在时间紧的时候给出的优先级判断，我同意：这一段是实现细节。");

  note("而讲者那句「这个和那一个相比是复杂的」就是 GRPO 流行的全部原因：四个框 vs 七八个框 + 一个要训的模型",640,380,"r");},"<b>GAE 被一句带过，然后讲者说了一句很直接的话。</b><br>⭐ 「<b>这个和那一个相比是复杂的</b>」—— <b>这句话就是 GRPO 流行的全部原因</b>：两张图<b>并排放在一张幻灯上</b>。<b>GRPO 那张：四个框</b>。PPO 那张：七八个框，还有一个要联合训练的模型。<br>而两者在推理任务上的效果相当 —— 所以没有人会选复杂的那个。<br>我替你把 <b>GAE</b> 一句话讲完，<b>这样你不会留一个空洞</b>：它要估「从第 t 步开始，比预期好多少」。<b>最短视的估法</b>：只看下一步（偏差小、方差小，但看得太近）。<b>最远视的估法</b>：<b>看到序列结束（无偏，但方差巨大）</b>。<br>GAE 的做法：把所有步长的估计按 λ 的幂加权平均 —— 一个在偏差和方差之间的旋钮。<br>所以它「复杂」只是因为那个加权和写出来很长，想法本身不难。<br>而 GRPO 对这整件事的处理是：<b>跳过</b>：不估「从第 t 步开始」的优势，只估「这整条回答」的优势。于是 λ、价值函数、偏差方差权衡，全部不需要了。<br>⚠ 讲者两次说「<b>我们不会看</b>」GAE —— L5 没讲，L6 也不讲，所以你不需要为它焦虑。");
  SUM(0,42,{h:"⭐ PPO 的同一张图",k:"<b>「对 PPO：你有你的 prompt、你的 query，你把它通过你的策略模型 —— 而你『只有一个』completion；你把 prompt 和 completion 这一对通过奖励模型，而这给你『那一整条 completion 的一个奖励』」</b> ⇒ <b>「有一件『我们上次没看到』的事，它更像是一个『实现细节』：我们『也有一个 KL 散度项』—— 它『把每一个 token 的概率和参考模型给那个 token 的概率做比较』,而从实现的角度我们『典型地也把那个并进奖励里』⇒ 所以我们有『某种「每 token 的奖励」』——『只有最后一个 token 拿到整条 completion 的奖励』,『但每一个 token 也都有一个 KL 散度项』」</b> ⇒ <b>「一旦你有了那些奖励，你『还有一个 value function』—— 而『这一个是「每 token」的』：它『试着量化：如果你按照策略继续生成序列的其余部分，那些奖励会是多少』」</b> ⇒ <b>「而『有这个我们不会看的方法』叫『generalized advantage estimation』—— 它『把那两个量作为输入，算出 advantage』;你可以把它想成『某个复杂的公式』⇒ 『而就这样 —— 这个「和那一个相比是复杂的」』」</b>。",m:"⭐ 「只采一条」和「必须训一个 value function」是<b>因果关系</b>，不是两个独立的设计选择：<b>PPO 只采一条，所以它「没有可比对象」⇒ 于是它必须从别处得到「预期值」—— 那就是 value function 存在的全部理由 ⇒ 反过来：GRPO 采 g 条 ⇒ 有了可比对象 ⇒ 不再需要「预测预期值」的模型 ⇒ 所以 GRPO 不是「发明了一个新的 advantage」，它是「用采样换掉了一个模型」</b> ⇒ 请把 PPO 手上的两个向量并排看：<b>奖励向量（长度 T）：最后一格有任务奖励，每一格有 KL；价值向量（长度 T）：每一格是「从这里写完能拿多少」的预测 ⇒ 而 GAE 的工作就是把这两个向量揉成一个 advantage 向量</b>。",w:"⭐ 请对照 GRPO 在这件事上的选择，<b>它非常激进</b>：<b>GRPO 干脆不做 token 级的功劳分配 —— 一整条 completion 里的每一个 token 共享同一个 advantage 值 ⇒ 所以 GRPO 的 advantage 是「序列级」的，PPO 的是「token 级」的 ⇒ 这是一个真实的精度损失，但实践证明在 LLM 上它不要紧，而省下的成本很大</b> ⇒ 而「这个和那一个相比是复杂的」<b>就是 GRPO 流行的全部原因</b>：<b>两张图并排放在一张幻灯上 —— GRPO 四个框，PPO 七八个框还外加一个要联合训练的模型；而两者在推理任务上效果相当，所以没有人会选复杂的那个</b>。",r:"⇒ 那个 per-token 奖励的数据结构请画出来：<b>一条 completion 有 T 个 token ⇒ 奖励是一个长度 T 的向量；第 1 到 T−1 格只有 −β·KL；第 T 格是任务奖励 r ＋ −β·KL ⇒ 所以任务奖励是「稀疏的」：一整条几千 token，只有最后一格有它</b> ⇒ 为什么要把 KL 写成「每 token」：<b>因为 KL 本来就是逐 token 定义的，而把它塞进奖励向量就能让它自动走完 GAE 那一整套计算 —— 这是一个「不用改算法，只改输入」的实现技巧；而它也解释了 L5 那个让人困惑的地方：L5 的公式里 KL 写在目标函数里（max E[r] − β·KL），但实际代码里它在奖励里，两者数学上等价</b>。⇒ 最后替你把 GAE 一句话讲完：<b>它要估「从第 t 步开始比预期好多少」—— 只看下一步则偏差小方差小但看得太近；看到序列结束则无偏但方差巨大；GAE 把所有步长的估计按 λ 的幂加权平均，是一个在偏差和方差之间的旋钮 ⇒ 所以它「复杂」只是因为那个加权和写出来很长，想法本身不难；而 GRPO 对这整件事的处理是跳过：不估「从第 t 步开始」，只估「这整条回答」，于是 λ、价值函数、偏差方差权衡全部不需要了</b>。"});

  stack(640,218,["⭐ 讲者第二次说「关键差别」—— 而这次说的是成本","GRPO 要训的：策略模型（一个）","PPO 要训的：策略模型 + value function（两个同等规模的）","⇒ 「要训」是最贵的那一类 ⇒ 这大致把训练显存需求砍掉一半"],780,32,6);
  note("两次「关键差别」说的是同一件事：换掉 advantage 的算法（方法上）= 省掉那个模型（成本上）",640,380,"r");},"<b>关键差别，讲者亲口定性。</b><br>⭐ 请注意讲者<b>两次</b>说「关键差别」，<b>而两次说的内容不同</b>：<b>第一次</b>（前面）：「差别在于它怎么计算 advantage」⇒ <b>方法上的说法</b>。<b>第二次</b>（这里）：「<b>差别在于我们训练哪些模型</b>」⇒ <b>成本上的说法</b>。<br>而这两句说的是同一件事：换掉 advantage 的算法，就省掉了那个模型。<br>把最终的账摆出来，<b>这就是全部的结论</b>：<b>PPO 要训</b>：策略 + value function（两个同等规模的模型）。<b>GRPO 要训</b>：<b>策略</b>（一个）。<br>而「要训」是最贵的那一类 —— 所以这大致把训练显存需求砍掉一半。<br>顺便把这件事放进这门课的大图景里：<b>L4</b>：怎么<b>让一次训练/推理更省</b>（量化、FlashAttention、MoE）。<b>L5</b>：怎么<b>对齐</b>，而代价是四个模型。<b>L6</b>：在<b>可验证任务上</b>，<b>把那四个砍到两个 + 一段代码</b>。<br>所以这门课从头到尾都在算同一笔账：怎么用更少的资源拿到同样的能力。<br>⚠ 「<b>这两者是一样的</b>」—— 指冻结的那些模型在两个算法里一样，差别只在要训的那些。");
  SUM(0,43,{h:"⭐ 冻结的与要训的",k:"<b>「所以 GRPO，你用的 advantage 是『这个「组」计算的结果』;但 PPO 的 advantage 是『奖励和 value function 的结果』—— 而那个是『每 token』的」</b> ⇒ 学生问「这里涉及的模型有哪些」⇒ <b>「我们有一些『引号，被「冻结」』的模型 —— 它们『不是我们训练的那些』：对 GRPO 我们有『参考模型』（我们在它上面做 KL）、有『奖励模型』（那是我们『过去训练过』的）,而对 PPO 情况也一样 ⇒ 那么要注意的一件事是：『在「推理」这个情形里，我们其实「不训练一个奖励模型」』—— 因为『我们知道怎么判断一个解对不对』,『我们其实有一个「可验证的奖励」』」</b> ⇒ ⭐ <b>「『在推理这个情形里，我们其实「根本就没有任何奖励模型」』—— 这两者是一样的；那么『不同的是「我们训练的那些模型」』：在 GRPO 里我们『只训练策略模型』,而在 PPO 里我们『训练策略模型「和」value function』⇒ 『而这就是那个「关键差别」』」</b>。",m:"⭐ 请注意讲者<b>两次</b>说「关键差别」，<b>而两次说的内容不同</b>：<b>第一次（前面）是「差别在于它怎么计算 advantage」⇒ 方法上的说法；第二次（这里）是「差别在于我们训练哪些模型」⇒ 成本上的说法 ⇒ 而这两句说的是同一件事：换掉 advantage 的算法，就省掉了那个模型</b> ⇒ 最终的账：<b>PPO 要训策略 + value function（两个同等规模的模型）；GRPO 只要训策略（一个）—— 而「要训」是最贵的那一类，所以这大致把训练显存需求砍掉一半</b> ⇒ 请把「冻结（frozen）」的实际含义弄清楚：<b>冻结 = 只做前向、不算梯度、不更新参数 ⇒ 它只占「参数」的显存，不占梯度和优化器状态的显存；而梯度 + Adam 状态大致是参数的 3 倍 —— 所以「冻结」和「要训」在成本上差 4 倍</b>。",w:" 「推理场景里根本没有奖励模型」把账又减了一笔：<b>一般 RLHF 里奖励模型是一个和策略同等规模的、训好后冻住的网络；推理场景里那一格是一段 Python 代码（跑单元测试，或者比字符串）⇒ 所以它不占显存、不占 GPU、也不会给错答案</b> ⇒ 和 L5 的模型清单对照：<b>L5 的 RLHF + PPO 是策略（训）+ 价值（训）+ 参考（冻）+ 奖励（冻）= 4 个神经网络；L6 的推理 + GRPO 是策略（训）+ 参考（冻）= 2 个神经网络 + 1 段代码 ⇒ 而「要训的」从 2 个降到 1 个，这是最贵的那一项减半</b>。",r:"⇒ 那个学生的问题问得极好：<b>流程图上画了好几个框，但框不等于模型 —— 有些是「要训的模型」，有些是「冻住的模型」，有些根本不是模型；而「要训几个模型」才是决定成本的那个数 ⇒ 这一问把 L5 那个粗略的「四个模型」说法变成了一个精确的账</b>。⇒ 顺便把这件事放进这门课的大图景：<b>L4 是「怎么让一次训练/推理更省」（量化、FlashAttention、MoE）；L5 是「怎么对齐」，代价是四个模型；L6 是「在可验证任务上把那四个砍到两个 + 一段代码」⇒ 所以这门课从头到尾都在算同一笔账：怎么用更少的资源拿到同样的能力</b>。⚠ <b>「我们过去训练过的」指 L5 里那个用 Bradley-Terry 损失训出来的奖励模型；而「这两者是一样的」指冻结的那些在两个算法里一样，差别只在要训的那些</b>。"});
  QUIZ(0,43,{t:"按讲者亲口的定性，GRPO 和 PPO 的「关键差别」是什么？",o:["GRPO 的奖励模型更小","要训的模型数：GRPO 只训策略，PPO 训策略 + value function —— 而这和「advantage 怎么算」是同一件事的两种说法（方法上／成本上）","GRPO 不用参考模型","GRPO 不用 KL 惩罚"],a:1,w:"⇒ 而在推理场景里奖励模型那一格根本不是神经网络，是一段代码 —— 所以 L5 的「四个模型」在这里变成「两个 + 一段代码」。"});

KP("44 · ⭐ 两个损失函数：两个相同点，第一个不同点",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("71:57","they look scary",166);
  note("⭐ 从图切到数学，而讲者先承认它们看起来可怕",640,194,"y");
  stack(640,218,["从图切到数学。讲者先承认两个损失函数「看起来很可怕」","而他的处理方式很聪明：不逐符号解释，只「找相同、找不同」","先给你骨架：两个公式各有三块 —— ratio（概率比）· clip（截断）· KL（约束）","外面各套一层求平均（GRPO 多一层：对组内 g 条平均）"],780,32,6);
  note("看清骨架公式就不可怕了。而「只读 diff」是读任何「X 的改进版」论文的正确姿势",640,380,"g");},"<b>从图切到数学，而讲者的处理方式很聪明。</b><br>⭐ 请注意他没有做的事：<b>他不逐符号解释那两个公式</b>：<b>而是「找相同点，找不同点」</b>。于是你只需要记住差异，而共同部分 L5 已经讲过了。<br>这是读任何「X 的改进版」论文的正确姿势：只读 diff。<br>「<b>它们看起来很可怕</b>」—— <b>而这是真的，所以先给你一个结构</b>：两个公式<b>各自都有三块</b>：ratio（概率比）、clip（截断）、KL（约束）。外面<b>各自都套了一层求平均</b>（<b>GRPO 多一层：对组内 g 条平均</b>）。<br><b>看清这个骨架，公式就不可怕了</b>。<br>接下来讲者会给出<b>两个相同点和两个不同点</b>，<b>我先列给你</b>：<b>相同点一</b>：都作用在「新策略 / 旧策略」的概率比上。<b>相同点二</b>：<b>都用 clip 限制更新幅度</b>。<b>不同点一</b>：KL 的位置（目标函数里 vs advantage 里）。<b>不同点二</b>：advantage 怎么算（这个你已经知道了）。<br>⚠ 「<b>让我们看点数学</b>」—— 这是这一讲第二段真正的数学，上一段是 pass@k。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  setEq("$$r_\\theta \\;=\\; \\frac{\\pi_\\theta(o \\mid q)}{\\pi_{\\theta_{\\mathrm{old}}}(o \\mid q)}$$","top");
  says("72:11","both of them, they operate on the ratio of the probability of the current policy and the probability of the old policy",204);
  note("⭐ 相同点一：都作用在「新 / 旧」的概率比上",640,234,"y");
  note("相同点一：都作用在「新策略 / 旧策略」的概率比上",640,266,"r");
  note("比值 > 1 = 新策略更倾向这条输出；乘上 advantage 就是「往好的方向推多少」",640,298,"y");
  note("相同点二：都用 clip 把比值截在 [1−ε, 1+ε]（典型 ε=0.2）⇒ 一次最多改 20%",640,330,"g");
  note("⚠ 两个坑：r_θ 不是奖励是概率比 · old 不是 SFT 模型是上一轮迭代（SFT 那个叫 π_ref）",640,362,"v");},"<b>两个相同点，而这里正好踩在 L5 那两个符号陷阱上。</b><br>⭐ 请把 L5 那两个符号陷阱在这里再确认一遍，<b>它们非常容易中招</b>：<b>陷阱一</b>：这个 <b>r_θ 不是奖励（reward）</b> —— 它是「新策略给这条输出的概率 ÷ 旧策略给的概率」。<b>陷阱二</b>：<b>下标 old 不是 SFT 模型</b> —— <b>它是「RL 阶段上一轮迭代的策略」</b>。<br>而真正的 SFT 模型叫 π_ref，它出现在 KL 那一项里。<br>这个比值在做什么，<b>一句话说清</b>：<b>比值 &gt; 1</b> ⇒ <b>新策略比旧策略更倾向于这条输出</b>。<b>比值 &lt; 1</b> ⇒ <b>新策略更不倾向于它</b>。<br>而这个比值乘上 advantage，就是「往好的方向推，推多少由 advantage 定」。<br>而 <b>clip</b> 在做什么，<b>也一句话说清</b>：它把这个比值<b>截断在 [1−ε, 1+ε]</b>（典型 ε = 0.2）。于是「一次更新最多把概率改变 20%」。<br>目的：防止一次大步长把策略推到一个坏区域，而 RL 从坏区域很难回来。<br>⚠ 讲者说「<b>我建议你把那些图过一遍</b>」—— 指 L5 里 advantage 为正／为负时 clip 的两张图，那两张图值得回去看。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("72:58","this clipping function just allows you to not make updates that are too big",166);
  note("⭐ 讲者直接把你送回 L5 的那两张图",640,194,"y");
  stack(640,218,["讲者让你回 L5 看那两张图。我替你把结论说一遍","advantage 为正（想提高这条的概率）⇒ 比值超过 1+ε，目标被削平","advantage 为负（想降低它）⇒ 比值低于 1−ε，目标也被削平","⇒ 所以 clip 是「单边封顶」:往对的方向走可以，走太远就不再有收益"],780,32,6);
  note("为什么不用惩罚项：惩罚会把梯度一直拉回来，clip 只是「不罚你，但也不再奖励你」—— 更温和",640,380,"g");},"<b>讲者直接把你送回 L5 的那两张图，而我替你把结论说一遍。</b><br>⭐ 那两张图的结论，<b>我直接给你</b>：advantage 为正（这条输出比预期好 ⇒ 想提高它的概率）：比值一旦超过 1+ε，目标就被削平 ⇒ 再提高也不给额外奖励。advantage 为负（这条输出比预期差 ⇒ 想降低它的概率）：比值一旦低于 1−ε，目标也被削平 ⇒ 再降低也不给额外奖励。<br>所以 clip 的作用是「单边封顶」：往对的方向走可以，但一步走太远就没有收益了。<br>为什么要这样设计，<b>而不是直接加一个惩罚项</b>：<b>加惩罚项</b>：会把梯度一直拉回来，哪怕那一步本来是对的。<b>clip</b>：在允许范围内完全不干扰，超出范围后梯度直接变零。<br>也就是「不罚你，只是不再奖励你」—— 一个更温和的约束方式。<br>请记住 clip 和 KL 管的是<b>两件不同的事</b>（L5 的重点）：<b>clip</b> 参照 <b>π_old</b>（上一轮）⇒ 管「<b>速度的上限</b>」。<b>KL</b> 参照 <b>π_ref</b>（SFT 模型）⇒ 管「<b>位移的上限</b>」。<br>两条并存。而下一镜讲的「不同点」正是关于 KL 那一条放在哪里。<br>⚠ 「<b>但现在 —— 什么是不同的？</b>」—— <b>讲者的语气在这里停了一下，下面是正题</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("73:16","the KL divergence is actually something that is explicitly part of the objective function",166);
  note("⭐ 第一个不同点：KL 写在哪里",640,194,"y");
  boxNode(60,222,540,40,"GRPO：KL 是「目标函数里显式的一项」","g");
  boxNode(680,222,540,40,"PPO：KL 典型地「是 advantage 的一部分」","d");
  note("KL 直接以系数 β 出现 ⇒ 强度可控、可读",330,284,"g");
  note("KL 被塞进奖励向量 ⇒ 强度被 GAE 的 λ 和 γ 影响",950,284,"d");
  note("讲者说这「更像是一个技术细节」—— 但对读代码的人非常实际",640,336,"y");
  note("⚠ 找 PPO 的 KL 去看奖励怎么拼；找 GRPO 的 KL 去看损失的最后一项 —— 找错地方会找不到",640,374,"r");},"<b>第一个不同点：同一个 KL，写在两个不同的地方。</b><br>⭐ 请先确认一件事：<b>这两种写法想做的事是一样的</b>：<b>两边都在说「别离参考模型太远」</b>。差别只在「这个约束被放在公式的哪一层」。<br>所以讲者说它「更像是一个技术细节」，这个判断是对的。<br>但它<b>有一个实际后果</b>，<b>而讲者没有展开</b>：<b>PPO（KL 在奖励里）</b>：KL 会<b>经过 GAE 那一整套加权</b> ⇒ <b>它的实际强度被 λ 和 γ 影响</b>。<b>GRPO（KL 在目标里）</b>：KL <b>直接以 β 的系数出现</b> ⇒ <b>它的强度就是 β，可控、可读</b>。<br>所以 GRPO 这一处其实更干净 —— 它把一个被埋起来的约束拿到了明面上。<br>对读代码的人来说，<b>这个差别非常实际</b>：<b>找 PPO 的 KL</b> ⇒ <b>去看奖励向量是怎么拼的</b>。<b>找 GRPO 的 KL</b> ⇒ <b>去看损失函数的最后一项</b>。<br>而如果你在 GRPO 的实现里去奖励里找 KL，你会找不到。<br>⚠ 顺带一个后续发展：很多 GRPO 的实践（包括 DAPO）干脆把 KL 项整个去掉了，因为在可验证奖励下 reward hacking 的风险本来就小。");
  SUM(0,44,{h:"⭐ 两个损失：相同点与 KL 的位置",k:"<b>「到现在为止我们只看了图和示意 —— 『让我们看点数学』：你『上面』有 GRPO 的损失函数,『下面』有 PPO 的 ——『它们看起来很可怕』,但我们要『一起看一些相同点和一些不同点』」</b> ⇒ <b>相同点一：「它们两个都『作用在「当前策略的概率」和「旧策略的概率」的「比值」上』」；相同点二：「它们两个都『试着把更新「保持在某个区域内」—— 不要太宽』,而它们『用我们上一讲看过的那个「clip 机制」』做到那一点」—— 「所以『这个 clip 函数只是让你「不做那些太大的、太宽的更新」』」</b> ⇒ <b>不同点一：「在 GRPO 的情形里，『KL 散度其实是「显式地作为目标函数的一部分」』;而对 PPO，『这个 KL 散度「典型地是 advantage 的一部分」』—— 所以『这更像是一个技术细节』」</b>。",m:"⭐ 请把 L5 那两个符号陷阱在这里再确认一遍，<b>它们非常容易中招</b>：<b>陷阱一：这个 r_θ 不是奖励（reward）—— 它是「新策略给这条输出的概率 ÷ 旧策略给的概率」；陷阱二：下标 old 不是 SFT 模型 —— 它是「RL 阶段上一轮迭代的策略」，而真正的 SFT 模型叫 π_ref，它出现在 KL 那一项里</b> ⇒ 比值在做什么：<b>比值 > 1 ⇒ 新策略比旧策略更倾向于这条输出；< 1 ⇒ 更不倾向；而这个比值乘上 advantage，就是「往好的方向推，推多少由 advantage 定」</b> ⇒ clip 在做什么：<b>它把比值截断在 [1−ε, 1+ε]（典型 ε = 0.2）⇒ 「一次更新最多把概率改变 20%」⇒ 防止一次大步长把策略推到一个坏区域，而 RL 从坏区域很难回来</b>。",w:"⭐ 那两张图的结论我直接给你：<b>advantage 为正（想提高这条输出的概率）⇒ 比值一旦超过 1+ε，目标就被削平，再提高也不给额外奖励；advantage 为负（想降低它）⇒ 比值一旦低于 1−ε，目标也被削平 ⇒ 所以 clip 的作用是「单边封顶」：往对的方向走可以，但一步走太远就没有收益了</b> ⇒ 为什么这样设计而不是加一个惩罚项：<b>加惩罚项会把梯度一直拉回来，哪怕那一步本来是对的；clip 在允许范围内完全不干扰，超出范围后梯度直接变零 ⇒ 也就是「不罚你，只是不再奖励你」—— 一个更温和的约束方式</b> ⇒ <b>请记住 clip 和 KL 管两件不同的事（L5 的重点）：clip 参照 π_old（上一轮）管「速度的上限」；KL 参照 π_ref（SFT 模型）管「位移的上限」—— 两条并存</b>。",r:"⇒ KL 位置的差别<b>有一个实际后果</b>，而讲者没展开：<b>PPO（KL 在奖励里）⇒ KL 会经过 GAE 那一整套加权 ⇒ 它的实际强度被 λ 和 γ 影响；GRPO（KL 在目标里）⇒ KL 直接以 β 的系数出现 ⇒ 强度就是 β，可控、可读 ⇒ 所以 GRPO 这一处其实更干净：它把一个被埋起来的约束拿到了明面上</b> ⇒ 对读代码的人非常实际：<b>找 PPO 的 KL 去看奖励向量是怎么拼的；找 GRPO 的 KL 去看损失函数的最后一项 —— 如果你在 GRPO 的实现里去奖励里找 KL，你会找不到</b>。⚠ <b>顺带一个后续发展：很多 GRPO 的实践（包括 DAPO）干脆把 KL 项整个去掉了，因为在可验证奖励下 reward hacking 的风险本来就小</b>。⇒ 而讲者这个「找相同、找不同」的处理方式很好：<b>他不逐符号解释那两个公式，于是你只需要记住差异 —— 这是读任何「X 的改进版」论文的正确姿势：只读 diff</b>。"});

  note("所以这是一个涌现行为 —— 而它有好坏两半，接下来两镜就是把这两半分开",640,380,"r");},"<b>一个现象，而它的关键是「没人要求它这么做」。</b><br>⭐ 请先把这件事的性质说清楚：<b>这是一个涌现的行为</b>：奖励里<b>只有两项</b>：<b>有 think 标签、答案对</b>。<b>没有任何一项鼓励「写长一点」</b>。<br>但模型就是一路写得越来越长 —— 没人要求它，它自己变成了这样。<br>为什么会这样？<b>有两个层次的解释，而它们都对</b>：<b>有益的那一半</b>：更长的推理链真的能解更难的题（这是我们想要的）。<b>有害的那一半</b>：损失函数里有一个因子，让「写长」在数学上占便宜（这是一个 bug）。<br>而这一段剩下的内容，就是在把这两半分开 —— 保留前者，修掉后者。<br>注意讲者同时提了「<b>用户侧</b>」和「<b>提供方侧</b>」：<b>用户</b>：<b>不想为看不到的 token 付钱</b>。<b>提供方</b>：输出短 = 吞吐高 = 同样的卡能服务更多人。<br>所以这件事两边的利益是一致的 —— 这很少见，而它解释了为什么这个问题被这么多人跟进。<br>⚠ 「<b>以致于你要为它付费</b>」—— 注意这里的因果：不是「生成太多不好」，而是「生成太多你要付钱」。");

  SUM(0,47,{h:"⭐ 输出长度一直膨胀",k:"<b>「我们现在要看的，是『去年做的那个 GRPO 工作的一些「扩展」』—— 这个研究『回到 2025 年初，但它已经获得了足够的关注，让我们在这门课上讲它』」</b> ⇒ <b>「『推理 token 是要向你这个用户收费的』—— 你想让模型做你想要的事，『但你不想让它「生成太多」,以致于你要为它付费』;而『从提供方那一侧「更高效要好得多」』⇒ 所以『有一个激励，去看我们能从「输出长度」这个角度优化什么』」</b> ⇒ <b>「如果你看这些模型的训练：『随着你在 RL 阶段训练它，「输出的长度在增长」』—— 这张图显示『作为 RL 步的函数，每个回答的平均长度』,而『这主要来自「那条推理链变得越来越复杂」』;而当你和『模型表现是怎么改进的』做对照，『长度的这个增长其实「和表现的增长相关」』」</b> ⇒ ⭐ <b>「但『接着就来了一个阶段』——『你模型的表现「趋于稳定」—— 但「你的输出长度仍然在继续增长」』⇒ 『很多人看了这些图，他们就像：好，「这里有点什么在发生」』」</b>。",m:"⭐ 请先把这件事的性质说清楚：<b>这是一个涌现的行为 —— 奖励里只有两项（有 think 标签、答案对），没有任何一项鼓励「写长一点」，但模型就是一路写得越来越长</b> ⇒ 而它有<b>两个层次的解释，两个都对</b>：<b>有益的那一半：更长的推理链真的能解更难的题（这是我们想要的）；有害的那一半：损失函数里有一个因子，让「写长」在数学上占便宜（这是一个 bug）⇒ 而这一段剩下的内容就是在把这两半分开：保留前者，修掉后者</b> ⇒ <b>请把两张图叠起来看，那个分岔点就是全部的问题：分岔点之前长度涨、表现也涨 ⇒ 划算；之后长度还在涨、表现平了 ⇒ 纯亏（推理成本还在线性增长，而你什么也没换到）</b>。",w:"⭐ 请先自己猜一下原因，<b>因为答案很反直觉</b>：<b>不是「模型学坏了」、不是「奖励设计错了」，而是「GRPO 的损失在数学上偏爱长输出」—— 一个纯粹的归一化问题 ⇒ 而这件事之所以难发现，正是因为它不在奖励里，它在损失的分母里</b> ⇒ 前半段的长度增长是正向因果：<b>RL 奖励「答对」⇒ 模型发现「多想几步更容易答对」⇒ 于是写得更长 ⇒ 而确实答对得更多了 ⇒ 所以那一段的长度增长是「能力增长的副产品」</b>，而它正好印证了前面那个「第二个直觉」：<b>更多 token = 更多算力 —— 而 RL 自己发现了这件事，没人教它 ⇒ 所以「test-time compute scaling」不只是一个人为的推理策略，它也是 RL 自发学到的策略</b>。",r:"⇒ 「它已经获得了足够的关注，让我们在这门课上讲它」里有一个判断标准：<b>一门课不能讲每一篇新论文，所以要有门槛 —— 而「有足够的关注（traction）」这个标准比「新」或「效果好」都更合理：被很多人跟进的工作，说明它解决的是一个真问题</b>。⇒ 注意讲者<b>第三次</b>回到「定价」了：<b>第一次讲推理 token 也算输出 token；第二次讲「用最少 token 拿最大能力」这个目标；第三次在这里用它给一个纯技术问题找动机 ⇒ 所以「长度膨胀」在这一讲里不是一个算法缺陷，它是一个会出现在账单上的问题</b>；而两边利益一致：<b>用户不想为看不到的 token 付钱；提供方的输出短 = 吞吐高 = 同样的卡服务更多人 —— 这很少见，而它解释了为什么这个问题被这么多人跟进</b>。⇒ 对你的课题，这个动机链条值得照抄：<b>「我的方法更快」是弱动机，「我的方法让使用者少付钱 / 少等」是强动机 —— 而讲者全程用后者，哪怕他讲的是损失函数里的一个因子</b>。⚠ <b>「缓解（mitigate）」而不是「解决」—— 讲者用词很准：这件事还没有被彻底解决</b>。"});

  SUM(0,48,{h:"⭐ GRPO 损失逐项，以及那个 1/|o_i|",k:"<b>「为了理解正在发生什么，我们『需要看 GRPO 的损失』——『看起来像一个非常复杂的公式，但它其实不是一个复杂的』;『J of GRPO —— J 意思是「目标函数」』」</b> ⇒ <b>「GRPO 的目标函数是去『最大化这个量』—— 它是『「你的模型相对于旧的那个改变了多少」的一个函数』（那些『比值』）;你有『这个 clip 机制，它「防止你的更新太宽」』;然后『你在右边有 KL 散度，它「防止你的模型离基础模型太远」』」</b> ⇒ <b>「你这里有这些『求和』—— 它们对应于『你把那个过程走遍「你组里的所有 completion」』,然后『对你输出的每一个 token』做那件事：『第一个求和是「在你组的下标上」』,『第二个求和是「在「序列里的 token 编号」的那些下标上」』」</b> ⇒ ⭐ <b>「我『就把「1 除以第 i 个输出的长度」换了个位置』—— 我要解释我为什么那么做：『这是一个「只和你在哪一个输出里」有关的因子』,所以『如果你在一个「非常长」的输出里，这就会是「1 除以一个非常长的输出」』」</b>。",m:"⭐ 请看清这个「挪位置」在数学上做了什么：<b>什么都没做 —— 1/|o_i| 和内层求和的下标 t 无关，所以把它写在内层求和外面、还是乘进每一项里，完全等价；而挪动它的唯一目的是「让你看清它是什么」</b> ⇒ 挪完之后看清的是：<b>它是一个只依赖 i（哪一条回答）的常数，它对这一条里的「每一个 token」乘同一个系数 ⇒ 也就是它给「这一整条回答」统一打了一个折扣，折扣率是 1/长度</b> ⇒ ⭐ <b>于是那个 bug 就看出来了：一条 5000 token 的回答折扣 1/5000，一条 100 token 的回答折扣 1/100 ⇒ 长回答里每个 token 承受的梯度，是短回答里每个 token 的 1/50；如果这条长回答是错的（advantage 为负），它每个 token 受到的「别这么写」的压力也只有 1/50 ⇒ 写得越长，犯错的代价越小 ⇒ 模型学会了「写长一点就不容易被罚」—— 这就是「表现平了、长度还在涨」的机制性解释</b>。",w:" 请注意 J / L 这个记号习惯，<b>它是 L5 那个符号陷阱的延续</b>：<b>J（objective）是要「最大化」的目标，L（loss）是要「最小化」的损失 —— 而讲者口头上说「损失」，公式里写的却是 J，所以别被绕进去：GRPO 的 J 是要最大化的</b>（L5 里反过来点过：PPO-Clip 写成 L = …，但它其实是要最大化的 ⇒ <b>判断方向不要看字母，要看式子里 advantage 的符号怎么起作用</b>）⇒ 而「除」的动机本身是好的：<b>除以 g 让不同组大小的梯度尺度一致；除以 |o_i| 让不同长度的回答在梯度里「权重相同」—— 不想让一条 5000 token 的回答仅因为长就比一条 100 token 的影响大 50 倍；问题只在于它是「每条各自除以自己的长度」</b>。",r:"⇒ 三块的分工请再确认一次：<b>ratio × advantage 是「往哪边推、推多少」（动力）；clip 是「一步最多走多远」（速度限制）；KL 是「总共最多离家多远」（位移限制）—— 一个动力 + 两个刹车，整个 RL 目标就是这三样</b> ⇒ 所以一个 RL 更新可以用一句具象的话说：<b>「从 π_ref 出发，一小步一小步地走（clip 限步长），朝 advantage 为正的方向走，但总共不许走出 KL 画的那个圈」—— 而 GRPO 的全部贡献，是换了一个更便宜的方式来判断「哪个方向的 advantage 为正」</b>。⇒ 另外这一讲一共预警了三次，<b>而它们正好是三个难点</b>：<b>pass@k 的推导（「它不那么显然」）、GRPO vs PPO（「整门课最难的部分」）、这里的归一化 ⇒ 如果你要挑三段重读，就是这三段</b>（不过这一段其实比上一段简单：<b>上一段难在同时持有五个概念，这一段只需盯住一个 1/|o_i|</b>）。⚠ <b>讲者又把「基础模型」和「参考模型」说成一回事 —— 两个词指同一个东西：SFT 阶段结束时的那个模型 π_ref，它在整个 RL 过程中冻住，是那个「原点」</b>。"});

  note("这个分工很说明问题：上半场是「每个零件怎么工作」，下半场是「整条流水线」—— 而后者确实更容易",640,380,"g");},"<b>Shervine 接手，而第一句话就把下半场定了性。</b><br>⭐ 这个分工<b>很说明问题</b>，<b>而它对你怎么听下半场有直接影响</b>：<b>上半场</b>：「<b>每个零件怎么工作</b>」⇒ <b>要理解机制 ⇒ 难</b>。<b>下半场</b>：「<b>这些零件怎么被装成 R1</b>」⇒ <b>要记住顺序 ⇒ 容易</b>。<br>所以下半场不会有新算法，它是一条流水线的说明书。<br>而「<b>容易一点</b>」这个判断是对的，<b>但有一个前提</b>：<b>前提是你已经知道那些零件是什么</b>。如果你不知道 GRPO 是什么，那「R1 用 GRPO 做了第二阶段」这句话对你没有信息。<br><b>所以上半场的投入，是在下半场兑现的</b>。<br>下半场要讲的内容，<b>我先给你一个地图</b>：先讲「传统 LLM」的训练流程（预训练 → SFT → RL），作为对照。然后 R1-Zero 的配方：纯 RL，作为一个「概念验证」。然后 R1 的完整流水线：多个阶段，拿到一个「超强的模型」。<b>最后是蒸馏：用 R1 的链去教小模型</b>。<br>而「概念验证 + 完整流水线」这个两段式，正是 DeepSeek 那篇论文的结构。<br>⚠ 这部片子到此是 L6 字幕第 740 句 —— 后面还有 137 句，是 Shervine 的下半场。");

  QUIZ(0,52,{t:"上半场（Afshine）的五块内容是一条什么样的线？",o:["按时间顺序的五篇论文","定义 → 度量 → 方法 → 算法 → 修补：推理是什么 ⇒ 怎么量（pass@k）⇒ 为什么用 RL（三张票）⇒ GRPO ⇒ 三个修补 —— 这正是一篇完整论文的骨架","从易到难排列的五讲","五个互不相关的话题"],a:1,w:"⇒ 而下半场不再有新算法：它是「这些零件怎么被装成 R1」的说明书 —— 所以上半场的投入，是在下半场兑现的。"});

  note("⇒ 「所以『不是推理那种 RL』,而是『常规的』那个。而那个 SFT 是『指令微调』」",640,366,"v");},"<b>下半场开场，先把旧流程摆出来作为对照。</b><br>⭐ 这三步你应该已经很熟了，<b>而它正好是 L4 和 L5 的内容</b>：<b>预训练</b>（L1–L4）：互联网文本上的下一个 token 预测。<b>SFT</b>（L4）：<b>指令微调 —— 教它「怎么回应」</b>。<b>RL</b>（L5）：RLHF / DPO —— 教它「什么样的回应更受偏好」。<br>所以「传统 LLM」在这门课里不是一个贬义词，它指的就是 L1 到 L5 讲完的那个东西。<br>而「<b>不是推理那种 RL，而是常规的那个</b>」这句澄清很必要：两种 RL 的算法可以是同一个（都能用 PPO）。差别在<b>奖励从哪来</b>：常规的 RL 用「人类偏好训出来的奖励模型」。推理的 RL 用「可验证的奖励（跑测试 / 比答案）」。<br>所以这是「同一个优化器，两种监督信号」—— 请不要把它们当成两套不同的技术。<br>接下来下半场要做的事，<b>就是改这张图</b>：<b>R1-Zero</b>：<b>把 SFT 那一格「删掉」</b>。<b>R1</b>：<b>把这三格扩成四个阶段</b>。<br>⚠ 「<b>更新的（newer）</b>」—— <b>注意这里说的「新」只是一年以内的事</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,218,["「而我想『DeepSeek R1 那篇论文的例子是一个很好的例子』—— 因为『他们走了「多个阶段」』」","「第一，是去『展示：如果你应用 Afshine 提到的那些「可验证奖励」,RL 阶段「能有多强大」』」","「然后『基于你从中得到的表现的那些观察，「怎么设计出一整条完整的流水线」,去得到一个他们叫做「R1」的超强模型』」","「所以，分别是『一个「概念验证」』,然后『一个「完整的推理模型」』。『这听起来还好吗？好，很好』」"],780,32,6);
  note("请把这个结构记住：R1-Zero 是论文，R1 是产品 —— 两者的目的完全不同",640,380,"r");},"<b>R1 那篇论文的结构：先证明一件事，再把它做成产品。</b><br>⭐ 请把这个两段式记住，<b>因为它经常被混为一谈</b>：<b>R1-Zero</b> = 一个<b>科学实验</b>：「<b>光靠 RL 能不能长出推理能力</b>」。<b>R1</b> = 一个<b>工程产品</b>：「<b>怎么把它做得可用</b>」。<br>所以 R1-Zero 的价值不在于它好用（它不好用），而在于它证明了一件事。<br>而这个「<b>先证明，再落地</b>」的论文结构非常值得你照抄：<b>第一部分</b>：一个最简设置，只为回答一个科学问题（去掉所有能去掉的东西）。<b>第二部分</b>：把实用需要的东西加回来，给一个能用的系统。<br>第一部分让论文有「发现」，第二部分让论文有「影响」—— 两者都要。<br>对你的课题，这个结构可以直接套：<b>先做一个最干净的版本</b>：只验证「用代理模型引导搜索真的有效」这一件事。<b>再做完整系统</b>：加上精确求解器复核、加上预算分配、加上工程细节。<br>而不要一上来就做完整系统 —— 那样你会分不清是哪一部分起了作用。<br>⚠ 「<b>他们走了多个阶段</b>」—— 而「阶段」这个词在接下来会反复出现：R1 一共有四个训练阶段。");
  SUM(0,53,{h:"⭐ 旧流程与 R1 的两段式",k:"<b>「我们在前面几讲看到的，是那些『引号，「传统的」』LLM：你从一个『预训练的基础模型』开始（在『一堆互联网文本』上做『下一个 token 预测』）,然后你接着做你的『alignment』—— 它由『SFT，然后 RL』组成 ⇒ 所以『不是推理那种 RL，而是「常规的」那个』,而那个 SFT 是『指令微调』」</b> ⇒ <b>「『DeepSeek R1 那篇论文的例子是一个很好的例子』—— 因为『他们走了多个阶段』：第一是去『展示：如果你应用那些「可验证奖励」,RL 阶段「能有多强大」』;然后『基于那些观察,「怎么设计出一整条完整的流水线」,去得到一个他们叫做「R1」的超强模型』⇒ 所以分别是『一个「概念验证」』,然后『一个「完整的推理模型」』」</b>。",m:"⭐ 请把这个两段式记住，<b>因为它经常被混为一谈</b>：<b>R1-Zero = 一个科学实验（「光靠 RL 能不能长出推理能力」）;R1 = 一个工程产品（「怎么把它做得可用」）⇒ 所以 R1-Zero 的价值不在于它好用（它不好用），而在于它证明了一件事</b> ⇒ 而这个「先证明，再落地」的论文结构<b>非常值得照抄</b>：<b>第一部分是一个最简设置，只为回答一个科学问题（去掉所有能去掉的东西）;第二部分把实用需要的东西加回来，给一个能用的系统 ⇒ 第一部分让论文有「发现」，第二部分让论文有「影响」—— 两者都要</b>。",w:" 「不是推理那种 RL，而是常规的那个」这句澄清很必要：<b>两种 RL 的算法可以是同一个（都能用 PPO），差别在奖励从哪来 —— 常规的 RL 用「人类偏好训出来的奖励模型」，推理的 RL 用「可验证的奖励（跑测试 / 比答案）」⇒ 所以这是「同一个优化器，两种监督信号」，请不要把它们当成两套不同的技术</b> ⇒ 而那三步你应该已经很熟：<b>预训练（L1–L4）、SFT（L4，指令微调，教它「怎么回应」）、RL（L5，RLHF / DPO，教它「什么样的回应更受偏好」）—— 所以「传统 LLM」在这门课里不是贬义词，它指的就是 L1 到 L5 讲完的那个东西</b>。",r:"⇒ 接下来下半场要做的事，<b>就是改那张图</b>：<b>R1-Zero 把 SFT 那一格「删掉」；R1 把这三格扩成四个阶段</b>。⇒ 对你的课题，这个两段式结构可以直接套：<b>先做一个最干净的版本（只验证「用代理模型引导搜索真的有效」这一件事）,再做完整系统（加上精确求解器复核、预算分配、工程细节）⇒ 而不要一上来就做完整系统，那样你会分不清是哪一部分起了作用</b>。⚠ <b>「他们走了多个阶段」—— 而「阶段」这个词接下来会反复出现：R1 一共有四个训练阶段</b>。"});
  QUIZ(0,53,{t:"R1-Zero 和 R1 的关系是什么？",o:["R1-Zero 是一个科学实验（证明「光靠 RL 能不能长出推理能力」）,R1 是一个工程产品（怎么把它做得可用）—— 所以 R1-Zero 的价值不在好用，而在它证明了一件事","两者是同一个模型的两个名字","R1-Zero 是蒸馏出来的版本","R1-Zero 是 R1 的小一号版本"],a:0,w:"⇒ 而这个「先证明、再落地」的论文结构值得照抄：第一部分让论文有「发现」，第二部分让论文有「影响」。"});

KP("54 · ⭐ R1-Zero 的配方：直接在预训练模型上做 RL",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("91:47","they reuse a trick called multi-latent attention, MLA",166);
  note("⭐ 起点：一个普通但很现代的基础模型",640,194,"y");
  stack(640,218,["「所以现在让我们从『DeepSeek 那些人用于「R1-Zero」模型的配方』开始」","「所以他们『首先从一个预训练模型开始』—— 在『最新的架构』上、带着『所有那些花里胡哨』,用下一个 token 预测训出来的」","⇒ 「所以你从前面几讲回忆一下，我们谈过『mixture of experts』—— 所以他们有这个」","「而他们『重用了一个叫「multi-latent attention（MLA）」的技巧』—— 那是他们『在 DeepSeek V2 里引入的』。而我们也谈过它」"],780,32,6);
  note("请注意这两个名字都来自 L4（MoE 和 MLA）—— 推理能力和架构无关，但它确实长在一个很现代的架构上",640,380,"g");},"<b>起点是一个普通但很现代的基础模型，而这两个名字你在 L4 见过。</b><br>⭐ 这两个名字都来自 <b>L4</b>，<b>我替你各回忆一句</b>：MoE（mixture of experts）：每个 token 只激活一小部分专家 ⇒ 参数量大但计算量小。MLA（multi-latent attention）：把 KV cache 压缩到一个低维潜空间 ⇒ 推理时显存省一个量级。<br>所以 DeepSeek 的基础模型是一个「参数很大但跑得起」的设计。<br>不过请把这件事的因果关系看清楚，<b>它很容易被夸大</b>：<b>推理能力来自 RL，不来自架构</b>。MoE 和 MLA 解决的是「怎么养得起这么大的模型」。<br>所以它们是「前提条件」，不是「原因」—— 一个普通的稠密模型也能用同样的 RL 长出推理能力。<br>而「<b>pre-norm</b>」这个细节讲者下一镜会提，<b>我先说清</b>：<b>pre-norm</b> = <b>LayerNorm 放在子层「之前」</b>（而不是之后）。它让深层网络的训练稳定得多，是 2020 年之后的标准做法（L1 讲过）。<br>所以讲者提它只是在说「这是一个标准的现代 transformer，没有什么特殊的」。<br>⚠ 「所有那些花里胡哨（all the bells and whistles）」—— 一个英语惯用语，指「该有的新东西都有」。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("92:14","this is where the fun starts",166);
  note("⭐ 而这里是整篇论文最大胆的一步：SFT 那一格被删掉了",640,194,"y");
  stack(640,218,["「你可以看到，在他们的架构里，他们『在 transformer 块里用了 pre-norm』。所以他们有『一个典型的基础 LLM』—— 所以他们在它上面做下一个 token 预测」","「而『接下来就是「有意思的地方」开始了』」","「所以『「不是」接着去走一个「由 SFT 组成」的 alignment 策略』,他们『就从这个「只用下一个 token 预测训过」的预训练模型开始』」","「而『它到现在为止「还没见过任何监督」』—— 而他们『在「推理数据」上应用 Afshine 刚提到的那个技术』」"],780,32,6);
  note("「还没见过任何监督」—— 这是 R1-Zero 唯一的卖点：跳过 SFT，直接对一个「原始」基础模型做 RL",640,380,"r");},"<b>而这里是整篇论文最大胆的一步：SFT 那一格被直接删掉了。</b><br>⭐ <b>请停下来体会这一步有多反常识</b>：一个「刚预训练完」的基础模型，根本不会「回答问题」。它只会「续写」—— 你问它一个问题，它可能接着再写三个问题。<br>而 SFT 的全部作用就是教它「对话的格式」。所以跳过 SFT 直接做 RL，等于让一个不会对话的模型去学解数学题。<br>而它居然成功了，<b>这件事说明了什么</b>：「怎么回应」这件事，RL 也能顺带学会 —— 因为格式奖励在逼它。而「怎么推理」这件事，预训练数据里本来就有（人类写的解题过程）。<br>所以 RL 做的不是「教它新东西」，而是「把它本来就有的能力调出来」。<br>而这正好接上 L5 那把总钥匙：「我们不想学新的事实，只是把模型该返回的那一个挪一下」。<br>为什么作者要这么做？<b>因为这是唯一干净的实验</b>：如果先做 SFT 再做 RL ⇒ <b>你分不清推理能力是哪一步给的</b>。而跳过 SFT ⇒ 能力只可能来自 RL。<br>所以「还没见过任何监督」不是为了省事，它是为了让结论无可争辩。<br>⚠ 「有意思的地方开始了（this is where the fun starts）」—— <b>讲者在这里语气明显兴奋起来</b>。");
  SUM(0,54,{h:"⭐ R1-Zero 的配方",k:"<b>「他们『首先从一个预训练模型开始』—— 在『最新的架构』上、带着『所有那些花里胡哨』,用下一个 token 预测训出来的：我们谈过『mixture of experts』—— 他们有这个；而他们『重用了一个叫「multi-latent attention（MLA）」的技巧』（他们『在 DeepSeek V2 里引入的』）;他们『在 transformer 块里用了 pre-norm』—— 所以他们有『一个典型的基础 LLM』」</b> ⇒ ⭐ <b>「而『接下来就是「有意思的地方」开始了』：『「不是」接着去走一个「由 SFT 组成」的 alignment 策略』,他们『就从这个「只用下一个 token 预测训过」的预训练模型开始』——『而它到现在为止「还没见过任何监督」』;而他们『在「推理数据」上应用那个技术』」</b>。",m:"⭐ 请停下来体会这一步有多反常识：<b>一个「刚预训练完」的基础模型根本不会「回答问题」—— 它只会「续写」（你问它一个问题，它可能接着再写三个问题），而 SFT 的全部作用就是教它「对话的格式」⇒ 所以跳过 SFT 直接做 RL，等于让一个不会对话的模型去学解数学题</b> ⇒ 而它居然成功了，<b>这件事说明了什么</b>：<b>「怎么回应」RL 也能顺带学会（格式奖励在逼它）;而「怎么推理」预训练数据里本来就有（人类写的解题过程）⇒ 所以 RL 做的不是「教它新东西」，而是「把它本来就有的能力调出来」—— 而这正好接上 L5 那把总钥匙：「我们不想学新的事实，只是把模型该返回的那一个挪一下」</b> ⇒ <b>而作者这么做的理由是：这是唯一干净的实验 —— 先 SFT 再 RL，你分不清推理能力是哪一步给的；跳过 SFT，能力只可能来自 RL ⇒ 所以「还没见过任何监督」不是为了省事，它是为了让结论无可争辩</b>。",w:" 请把架构这件事的因果关系看清楚，<b>它很容易被夸大</b>：<b>推理能力来自 RL，不来自架构 —— MoE 和 MLA 解决的是「怎么养得起这么大的模型」⇒ 它们是「前提条件」不是「原因」，一个普通的稠密模型也能用同样的 RL 长出推理能力</b>。",r:"⇒ 那两个名字都来自 L4，各回忆一句：<b>MoE（mixture of experts）—— 每个 token 只激活一小部分专家 ⇒ 参数量大但计算量小；MLA（multi-latent attention）—— 把 KV cache 压缩到一个低维潜空间 ⇒ 推理时显存省一个量级 ⇒ 所以 DeepSeek 的基础模型是一个「参数很大但跑得起」的设计</b>。⇒ 而「pre-norm」= <b>LayerNorm 放在子层「之前」而不是之后，它让深层网络的训练稳定得多，是 2020 年之后的标准做法（L1 讲过）⇒ 所以讲者提它只是在说「这是一个标准的现代 transformer，没有什么特殊的」</b>。⚠ <b>「所有那些花里胡哨（all the bells and whistles）」是一个英语惯用语，指「该有的新东西都有」；而「有意思的地方开始了」那句，讲者语气明显兴奋起来</b>。"});

  note("请注意「全部事情（all they incentivize）」这个说法 —— 两个奖励，没有第三个，而它就长出了推理",640,380,"r");},"<b>奖励只有两样，而论文把 prompt 模板的原文都给出来了。</b><br>⭐ 「全部事情（all they incentivize）」这个说法请留意：<b>两个奖励，没有第三个</b>。没有「推理过程要清晰」、没有「步骤要正确」、没有「不要太长」。<br><b>而就这两个，长出了一整套多步推理行为</b>。<br>而「<b>论文给出了模板的确切内容</b>」这件事本身值得一提：<b>这是 R1 之所以能被复现的关键之一</b>。算法公开 + 奖励公开 + prompt 模板公开 ⇒ 任何人都能照着跑。<br>而 o1 一样都没给 —— 所以前面讲者说「他们真的在论文里描述出来了」是有分量的。<br>请注意「<b>格式奖励</b>」在这个配方里的地位比你想的重要：没有 SFT ⇒ 模型<b>不知道该怎么组织输出</b>。而格式奖励<b>就是那个替代 SFT 的东西</b>：它用奖励（而不是示范）教会模型输出格式。<br>所以「格式奖励」不是一个附属的小项，它承担了原本属于 SFT 的职责。<br>⚠ 讲者说「输入-答案（input answer）」—— 这里他口误了，他指的是模型给出的那个答案。");

  note("请注意这里的分工：prompt 负责「说清要求」，奖励负责「逼它遵守」—— 两者缺一不可",640,380,"r");},"<b>模板的内容真的就是几句大白话，而这件事比它看起来重要。</b><br>⭐ 请注意这里的<b>分工</b>，<b>它是整个配方的关键设计</b>：<b>prompt 负责「说清要求」</b>：把中间过程放进 &lt;think&gt;，最终答案放进 &lt;answer&gt;。<b>奖励负责「逼它遵守」</b>：<b>标签不在就没有格式奖励</b>。<br>两者缺一不可：光有 prompt 它会忘，光有奖励它不知道要什么格式。<br>而「<b>不管你想想什么，就去想</b>」这句话里有一个很重要的留白：<b>它没有规定「要想什么」</b>。<b>也没有规定「要怎么想」</b>。<b>只规定了「想的内容放哪里」</b>。<br>所以 think 标签提供的是「一个被允许自由发挥的空间」—— 而模型在那个空间里自己摸出了推理。<br>这个设计思路非常漂亮：不规定内容，只划出场地。<br>对你的课题，这个「<b>划场地而不规定内容</b>」的思路可以借：<b>你不需要告诉搜索「该怎么剪枝」</b>。你只需要给它一个「可以自由尝试并被评分」的结构，然后让奖励塑形。<br>⚠ 「搭好场子（set up the stage）」—— 指 system prompt 那几句「你是一个助手」之类的开场。");

  note("注意起点是一样的：R1 不是在 R1-Zero 上继续训的，它是从同一个基础模型重新开始的",640,380,"r");},"<b>R1-Zero 证完了，现在做产品 —— 而注意起点是一样的。</b><br>⭐ 请注意这个细节，<b>它经常被误解</b>：R1 不是「在 R1-Zero 上继续训的」。它是从「同一个 V3 base」重新开始的。<br>所以 R1-Zero 对 R1 的贡献不是权重，而是「它生成的那些推理链」—— 下一镜就会用到。<br>这个设计其实很聪明，<b>值得单独说</b>：R1-Zero 的权重有问题（混语言、语法乱）⇒ 在它上面继续训，问题会被带下去。但 R1-Zero 的「输出」很有价值 ⇒ 挑出好的、让人改一改，就是最好的 SFT 数据。<br>所以 R1-Zero 被当成了一个「数据生成器」,而不是一个「模型检查点」。<br>把 R1 的四个阶段先列出来，<b>这样接下来你有一张地图</b>：① <b>冷启动 SFT</b>（少量、人工整理过的推理链）。② <b>RL</b>（推理奖励 + 格式奖励 + 语言一致性奖励）。③ <b>大规模混合 SFT</b>（推理 + 非推理，3:1，拒绝采样）。④ <b>最后一个 RL</b>（有帮助 + 无害）。<br>而这四步的形状是：SFT → RL → SFT → RL。<br>⚠ 「<b>V3 base</b>」—— 指 DeepSeek-V3 的基础版（没做过对齐的那个），671B 的 MoE。");

  stack(640,218,["「所以它是这个模型的『非推理版本』—— 所以他们从它开始」","「而接着『「不是」直接开始去做我们讨论过的那个 RL 阶段』,他们『试着「用一种能很好地缓解我们看到的那些问题的方式」去对齐它』」","「所以它『从他们称之为「「冷启动数据（cold start data）」」的东西开始』」","⇒ 所以 R1 和 R1-Zero 的唯一结构差别，就是「在 RL 之前先插了一小段 SFT」"],780,32,6);
  note("「冷启动（cold start）」这个词借自推荐系统：指「系统刚上线、什么都没有」时怎么起步",640,380,"r");},"<b>这一次不直接上 RL —— 先给它一个锚。</b><br>⭐ 「<b>冷启动（cold start）</b>」这个词值得说一下，<b>它是借来的</b>：<b>它原本来自推荐系统</b>：一个新用户什么行为都没有，你怎么给他推荐。<b>借到这里</b>：一个基础模型完全不会写推理链，你怎么让 RL 起步。<br>而答案一样：先用一点点人工数据把它推过那个起步门槛。<br>请注意 R1 和 R1-Zero 的结构差别<b>只有这一处</b>：<b>R1-Zero</b>：<b>基础模型 ⇒ RL</b>。<b>R1</b>：基础模型 ⇒ 一小段 SFT ⇒ RL ⇒ …。<br>而就这一小段 SFT，解决了混语言和语法混乱。<br>这件事对「<b>SFT 还有什么用</b>」这个问题给了一个很好的答案：R1-Zero 证明了「SFT 不是必需的」（能力上）。R1 证明了「SFT 仍然是必要的」（可用性上）。<br>两个结论不矛盾：SFT 不负责「会不会推理」,它负责「推得人能不能看」。<br>而这正好是前一个知识点那个「锚」的含义。<br>⚠ 「<b>非推理版本</b>」—— 强调这个起点和 R1-Zero 的起点完全一样，是同一个未对齐的基础模型。");

  note("请看清这个循环：R1-Zero 生成草稿 → 人修 → 变成 SFT 数据 → 训出 R1 的起点",640,380,"r");},"<b>冷启动数据是怎么来的 —— 而这是一个很聪明的循环。</b><br>⭐ 请看清这个循环，<b>它解决了前面那个「数据不存在」的死结</b>：① R1-Zero 生成推理链（质量不稳，但内容是对的）。② 人去「重写」—— 修格式、统一语言，而不是从零写。③ 得到合规的推理链 ⇒ 变成 SFT 数据。④ <b>用它训出 R1 的起点</b>。<br>请注意第 ② 步里的那个词：「<b>重写（rewrite）</b>」,<b>而不是「写（write)</b>」：前面讲者说过：从零写推理链「非常难」—— 那是不可行的。但「修改一条已有的、内容正确的链」容易得多。<br>所以 R1-Zero 真正的贡献在这里：它把「写」这个不可行的任务，变成了「改」这个可行的任务。<br>这个思路值得你记住，<b>因为它有很强的一般性</b>：当你需要一份「没人写得出来」的数据集时。<b>先用一个不完美的自动方法生成草稿</b>。再让人去修 —— 人的成本从「创作」降到「编辑」。<br>而这在今天已经是标准做法了（叫 human-in-the-loop 数据生成）。<br>⚠ 讲者说「prompt 和重写过的 prompt」—— 他这里口误了，第二个应该是「重写过的回答」。");

  SUM(0,57,{h:"⭐ R1 第一步：冷启动",k:"<b>「既然我们看到了『R1-Zero 试着证明的那件事』（『只用 RL，你就能拿到推理级别的表现』）,现在我们要看『怎么把那些挑战调整进「一条完整的流水线」里』—— 他们叫它『R1』;而他们『从「同样的基础」开始』:一个『V3 base』,这个模型的『非推理版本』」</b> ⇒ <b>「而『「不是」直接去做那个 RL 阶段』,他们『试着「用一种能缓解我们看到的那些问题的方式」去对齐它』⇒ 它『从他们称之为「冷启动数据」的东西开始』」</b> ⇒ ⭐ <b>「他们『生成了 CoT』—— 在『R1-Zero 那个阶段』期间；而『这些 CoT 有时候有问题』,所以他们『「用人」去重写其中一些』,这样『所有这些 CoT 在「格式」和「语言一致性」上都是合规的』;然后他们『用这些「对」作为数据去训 SFT』」</b> ⇒ <b>「『没有给出』那个阶段的样本数 —— 但『从论文措辞来看，它可能比其它一些阶段「少好几个数量级」』,潜在地是『几千』对」</b>。",m:"⭐ 请看清这个循环，<b>它解决了前面那个「数据不存在」的死结</b>：<b>① R1-Zero 生成推理链（质量不稳，但内容是对的）② 人去「重写」—— 修格式、统一语言，而不是从零写 ③ 得到合规的链 ⇒ 变成 SFT 数据 ④ 用它训出 R1 的起点</b> ⇒ 请注意第 ② 步那个词是「<b>重写</b>」而不是「写」：<b>前面讲者说过从零写推理链「非常难」（不可行），但「修改一条已有的、内容正确的链」容易得多 ⇒ 所以 R1-Zero 真正的贡献在这里：它把「写」这个不可行的任务，变成了「改」这个可行的任务</b> ⇒ <b>量级对比是整条流水线最漂亮的一处：方案 A（被否掉的）从零写几十万条 ⇒ 不可行；方案 B（实际做的）让模型生成、人改几千条 ⇒ 可行 —— 而这几千条就足够了，因为它的任务不是「教会它推理」，只是「给它一个锚」</b>。",w:" 请注意一个经常被误解的细节：<b>R1 不是「在 R1-Zero 上继续训的」，它是从「同一个 V3 base」重新开始的 ⇒ 所以 R1-Zero 对 R1 的贡献不是权重，而是「它生成的那些推理链」</b> ⇒ 这个设计很聪明：<b>R1-Zero 的权重有问题（混语言、语法乱）⇒ 在它上面继续训问题会被带下去；但它的「输出」很有价值 ⇒ 挑出好的、让人改一改，就是最好的 SFT 数据 ⇒ 所以 R1-Zero 被当成了一个「数据生成器」而不是一个「模型检查点」</b> ⇒ <b>而这件事对「SFT 还有什么用」给了一个好答案：R1-Zero 证明了「SFT 不是必需的」（能力上），R1 证明了「SFT 仍然是必要的」（可用性上）—— 两个结论不矛盾：SFT 不负责「会不会推理」，它负责「推得人能不能看」</b>。",r:"⇒ R1 的四个阶段先列出来，<b>这样你有一张地图</b>：<b>① 冷启动 SFT（少量、人工整理过的推理链）② RL（推理 + 格式 + 语言一致性奖励）③ 大规模混合 SFT（推理 + 非推理，3:1，拒绝采样）④ 最后一个 RL（有帮助 + 无害）—— 而这四步的形状是 SFT → RL → SFT → RL</b>。⇒ 「冷启动（cold start）」这个词是借来的：<b>它原本来自推荐系统（一个新用户什么行为都没有，你怎么推荐）;借到这里是「一个基础模型完全不会写推理链，你怎么让 RL 起步」—— 而答案一样：先用一点点人工数据把它推过那个起步门槛</b>。⇒ 为什么几千条就够：<b>模型「怎么推理」已经在 RL 里学了；SFT 只需要告诉它「用一种语言、把句子写完整」—— 这是一个很窄的要求，而很窄的要求用很少的数据就能传达 ⇒ 实用推论：要改「能力」需要海量数据或 RL，要改「格式 / 风格 / 语言」几百到几千条就够了</b>。⚠ <b>讲者说「prompt 和重写过的 prompt」时口误了，第二个应该是「重写过的回答」；而「没有给出数字」是他在诚实说明这是从措辞推测的</b>。"});

  note("这是整讲最后一个、也是最该带走的结论之一：能力可以被「传」,但未必能在小模型上「长」出来",640,380,"r");},"<b>整讲最后一个问题，而这个答案很重要。</b><br>⭐ 这个问题问得很好，<b>而答案推翻了一个很自然的假设</b>：<b>自然的假设</b>：既然 RL 能在大模型上长出推理，那在小模型上也该能。<b>实际结果</b>：<b>在小尺寸上，蒸馏比直接 RL 更有效</b>。<br>所以 RL 不是在所有尺度上都最优的选择。<br>为什么会这样，<b>有一个很直观的解释</b>：RL 是一个「搜索」过程 —— 模型要自己摸索出好的推理路径。而能摸到什么，取决于「它本来有多大可能生成那种路径」。<br>一个小模型的初始分布里，那些复杂的推理路径概率极低 ⇒ 它几乎采不到 ⇒ 也就学不到。而蒸馏绕过了搜索：直接把答案摆在它面前让它模仿。<br>所以整讲最后的结论可以这么收，<b>而我认为这是最该带走的一条</b>：推理能力需要「足够大的模型 + RL」才能第一次「长」出来。但它一旦长出来，就可以被「传」到小模型上。<br>所以「发现」和「复制」的成本完全不对称 —— 第一次很贵，之后很便宜。<br>而这正好解释了这一整年的格局：一家做出来，全行业几个月内就都有了。<br>⚠ 「<b>祝你有一个很棒的周末</b>」—— 这一讲到此结束。而下一讲是 L7：Agentic LLMs。");

KP("完 · 一条可验证的奖励，和三处被钻的归一化",
function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L6 · 完","LLM 推理","两个目标，各一句话");},
    "收一下这一讲。⭐ <b>讲者自己立的两个目标是「推理模型是什么」和「它们怎么训出来的」——我按这两个目标各给一句话。</b><br><span class='k'><b>① 推理模型是什么</b>：输出从「答案」变成「<b>推理链 + 答案</b>」。就这一处结构差别 —— 没有新架构、没有新的层、没有新的注意力机制，它本质上是「把 2022 年那个 chain-of-thought 的 prompting 技巧放大」，并让模型自己就这么做。</span><br><span class='k'><b>② 它们怎么训出来的</b>：在「可验证奖励」上做 RL（GRPO）。而 GRPO 和 PPO 只差一处：PPO 用一个学出来的 value function 当基线，GRPO 用「同一个 prompt 采 g 条的平均奖励」当基线。那一处替换省掉了一整个要训练的模型。</span>");
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L6 · 完","地基","奖励不用学 —— 以及它的边界");},
    "<b>而这一讲真正的地基是一句讲者说得很平淡的话：「这就是我们验证一个被生成的回答是否真的正确的方式。」</b><br><span class='w'>这条因果链请背下来：推理任务（数学 / 代码）可验证 ⇒ 奖励可以是一个「函数」而不是一个「模型」⇒ 不用标注、不会被 reward hacking、训练信号可以无限量生成 ⇒ RL 终于能在 LLM 上大规模地跑。<br>⚠ 而它同时划出了<b>边界</b>：这一讲的全部方法都依赖「答案可验证」—— 换到「写一封好邮件」上，整套东西立刻不成立。</span><br><span class='k'>⭐ 请把它和 L5 对照一次，差距是结构性的：L5 要养「四个模型」（策略 / 价值 / 参考 / 奖励），其中奖励模型最麻烦；L6 在推理场景里是「两个神经网络 + 一段代码」—— 而「要训的」从 2 个降到 1 个。</span>");
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L6 · 完","三处归一化偏置","看起来中立的细节");},
    "⭐ <b>三处「看起来中立的技术细节，其实塞进了一个你没打算要的偏好」——我认为这是这一讲最该带走的方法论。</b><br><span class='w'>① 1/|o_i|（按自己长度归一化）：它只取决于「这一条有多长」，对整条统一打折 ⇒ <b>同样答错，写短了被罚得更重</b> ⇒ 模型学会「要错就错得长一点」。修法：DAPO 把分母换成整组总长度；Dr. GRPO 把它整个删掉。而最漂亮的验证是：修完之后只有「错解」变短，「对解」长度不变 —— 这正是那个诊断的独有预测。</span><br><span class='w'><b>② 除以组内标准差</b>：难题几乎全错 ⇒ 标准差小 ⇒ advantage 被放大 ⇒ <b>一条「蒙对」的侥幸路径拿到最大梯度</b>。讲者自己就说了「那可能不是最好的做法」。</span><br><span class='w'><b>③ 对称的 clip（同一个 ε）</b>：ε 是乘在 π_old 上的 ⇒ 概率 0.0001 的 token 一轮只能涨到 0.00012 ⇒ 低概率的好想法永远长不起来（熵坍缩）。修法：Clip-Higher，上界放宽、下界留着。</span><br>一句话：每一个归一化、每一个对称假设，都是一个隐含的偏好声明。");
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L6 · 完","两段推导","产出都不是公式");},
    "<b>两段推导，而它们的产出都不是公式。</b><br><span class='k'><b>pass@k</b>：1 − C(n−c,k) / C(n,k)。讲者说他推它的理由是「我不想让你在不知道它从哪来的情况下被它长什么样吓到」——而真正要记住的只有一句：<b>「它只是无放回抽样」</b>，公式随时能从这句话重推。边界自检：c=0 给 0、c=n 给 1、k=1 给 c/n（就是普通准确率）。⚠ 而报 pass@k 必须同时报 <b>温度、n、k</b> —— 温度为 0 时 k 条答案逐字相同，这个指标直接退化。</span><br><span class='k'><b>GRPO vs PPO</b>：讲者亲口说这「<b>大概是整门课最难的部分</b>」，并给了「只要告诉自己两件事」的及格线：① 这些算法只是 RL 阶段用来调模型的 ② GRPO 不需要 value function，它用同组其它 completion 的奖励做比较。难点不在单个概念，而在「同时持有五个彼此纠缠的定义」—— 所以「只记差异」才是对策。</span>");
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L6 · 完","R1 的两段式","以及那个自举");},
    "⭐ <b>R1 那篇论文的结构，以及那个自举。</b><br><span class='k'><b>R1-Zero</b>（概念验证）：<b>跳过 SFT</b>，直接对一个「还没见过任何监督」的基础模型做 RL。它成功了（AIME 一路涨），而这说明 RL 不是在「教新东西」，是在「把预训练里本来就有的能力调出来」—— 正好接上 L5 那把总钥匙。⚠ 但它的链会<b>混语言、语法乱</b>：讲者的解释是「它没有一个作为背景的「<b>锚</b>」」，而这揭示了 SFT 的第二个作用 —— 它不只教格式，还给后面的 RL 一个合理的原点（π_ref）。</span><br><span class='k'><b>R1</b>（四阶段：SFT → RL → SFT → RL）：<b>① 冷启动</b>：让 R1-Zero 生成链、人去「<b>改</b>」几千条 —— 把「写」这个不可行的任务变成「改」这个可行的任务；<b>② RL</b>：加一个「目标语言 token 比例」的语言一致性奖励（仍然是可验证的）；<b>③ 混合 SFT</b>：3:1，推理那 60 万条用<b>拒绝采样</b>由「上一步训出来的模型」自己生成 —— <b>模型在给自己造教材</b>；<b>④ 最后一轮 RL</b>：有帮助 + 无害，而无害覆盖 think 里的思考过程，有帮助只看用户看到的部分。</span>");
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L6 · 完","发现很贵，复制很便宜","接到你的课题");},
    "⭐ <b>最后一条结论，我认为是整讲最该带走的那一条。</b><br><span class='k'>「为什么要费劲蒸馏，你本来就可以做同样的 RL」——作者的回答是：在更小的尺寸层级上，蒸馏比直接从零学更高效。原因：<b>RL 是搜索</b>，而小模型的初始分布里那些复杂推理路径概率极低 ⇒ 它几乎采不到、也就学不到；而蒸馏绕过了搜索，直接把答案摆在它面前让它模仿。所以：推理能力需要「足够大的模型 + RL」才能第一次「长」出来，但一旦长出来就可以被「传」下去—— 发现很贵，复制很便宜，而这正好解释了这一整年的格局。</span><br><br><b>⇒ 接到你的课题，我挑三条</b>：① 「可验证 ⇒ 奖励可程序化」正是你那个「代价/可行性可以被精确求解器复核」的结构 —— 而 L5 的 reward hacking 风险在这里被结构性地消掉了，这是一个很强的设计论点；② GRPO 的「用同组采样的均值当基线」就是最朴素的「减基线降方差」，而它的启示是与其学一个估计器，不如找一个不用训练就能得到的基线；③ 那三处归一化偏置值得你在自己的实验里逐条检查 —— 任何「按实例长度 / 难度归一化」的指标，都可能悄悄塞进一个偏好。<br><br>下一讲 L7 是 Agentic LLMs，答的是 vanilla LLM 的弱点二和弱点三：知识过时，和「全是说，没有做」。");
});
