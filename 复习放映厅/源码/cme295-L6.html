<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;

/* caption band — pinned into the lower third, clears the strip, scrolls if long */

#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;

#quiz .why[hidden]{display:none}

#quiz .why em{font-style:normal;color:var(--green)}

#titleL{flex-direction:column}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}

#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}

.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}

.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

  stack(640,218,["目标：把模型对齐到人类偏好；常见做法是 RLHF，它分两段","第一段 学奖励：用人类偏好数据，学会把好的和坏的区分开","第二段 做 RL：讲者说「而那一步今天会有用」","⇒ 反过来说：第一段今天用不上。那奖励从哪来？"],780,32,6);
  note("答案是「可验证的奖励」：数学题对不对、代码跑不跑得过，程序直接判 —— 不用学",640,380,"r");},"<b>回顾第三步，而他明确点出了「哪一部分今天要用」。</b><br>⭐ 「<b>那一步今天会有用</b>」是一个非常明确的指路：RLHF 的<b>第一段</b>（训奖励模型）：<b>这一讲用不上</b>。RLHF 的<b>第二段</b>（RL）：<b>这一讲的核心</b>。<br>而「<b>第一段用不上</b>」这件事本身就很有信息量：它暗示：这一讲的奖励不来自一个学出来的奖励模型。<b>那它来自哪</b>？<br>答案是「可验证的奖励」—— 数学题对不对、代码跑不跑得过，直接用程序判。而这正是 L5 开场那句「或者对齐到我们定义的某个指标」留下的那扇门。<br>所以这一讲在 L5 的框架里只换了一个零件：把「学出来的奖励模型」换成「程序判定的奖励」：而那一个零件的替换，带来了整个推理模型这一类东西。<br>⚠ 请带着这个预判往下听 —— <b>它会让后面的内容容易很多</b>。");
  SUM(0,1,{h:"⭐ 开场与训练三步",k:"开场：<b>「今天其实是激动人心的一天 —— 我们要讲一个过去一年左右一直很火的话题：LLM reasoning；而相比上次讲的偏好调优，它其实是一个很好的衔接，因为我们在第 5 讲里用的很多方法，正是这一讲会拿来当基础的那些」</b>。回顾：<b>① 预训练是「最耗算力的一步」，教模型「文本的结构、代码的结构」⇒ 这一步结束得到一个懂代码懂语言、但「只知道怎么自动补全一个序列」的模型；② 微调：拿预训练模型「让它变得有用」（比如一个助手），这里有准备 SFT 数据的工作 —— 「一个高质量的、精心策展的数据集，用来教模型该怎么表现」；③ 偏好调优：「目标是把模型对齐到人类偏好」—— 特别看了 RLHF，它有两步：先用人类偏好数据「学会把好的和坏的区分开」，然后是那个 RL 阶段，「而那一步今天会有用」</b>。",m:"⭐ 「那一步今天会有用」是一个非常明确的指路：<b>RLHF 的第一段（训奖励模型）这一讲用不上，第二段（RL）才是核心</b> ⇒ 而「第一段用不上」本身就有信息量：<b>它暗示这一讲的奖励不来自一个学出来的奖励模型 —— 那它来自哪？答案是「可验证的奖励」：数学题对不对、代码跑不跑得过，直接用程序判</b> ⇒ <b>这正是 L5 开场那句「或者对齐到我们定义的某个指标」留下的那扇门 ⇒ 所以这一讲在 L5 的框架里只换了一个零件：把「学出来的奖励模型」换成「程序判定的奖励」—— 而那一个零件的替换，带来了整个推理模型这一类东西</b>。",w:" 请注意这三步回顾的<b>详略</b>：每一步他都只说「教什么」、不说「怎么教」（<b>预训练教文本和代码的结构、SFT 教怎么表现、偏好调优教该偏好什么</b>），而他完全没提 LoRA、损失掩码、数据混合那些细节 —— <b>因为这一讲用不上它们；他唯一讲得细的是 RL 那一段，因为 GRPO 要用</b> ⇒ <b>听课技巧：看讲者复述什么、跳过什么 —— 他复述的接下来一定会用，他跳过的接下来一定用不上</b>。",r:"⇒ 「只知道怎么自动补全一个序列」这句话在这门课里出现了三次（<b>L4 用泰迪熊演示、L5 说「很棒的自动补全器但还不是有用的模型」、这里又说一遍</b>），<b>三次都是为了引出「所以还要下一步」—— 而这一讲会把这个论证结构用第四次，只不过这次引出的不是「下一步训练」，而是「推理模型」这个新物种</b>。⇒ 「过去一年左右」这个时间范围值得记：<b>这节课录于 2025 年春，所以指的是 2024 到 2025 年初 —— 而那正好是 o1 和 DeepSeek-R1 出现的那一年；这是这门课里时效性最强、也最接近今天研究前沿的一讲</b>。"});
  QUIZ(0,1,{t:"这一讲用得上 RLHF 的哪一部分？这暗示了什么？",o:["只用第一段（训奖励模型）","只用第二段（RL）—— 这暗示奖励不来自学出来的奖励模型，而来自「可验证的奖励」（程序直接判对错）","两部分都用不上","两部分都要用"],a:1,w:"⇒ 所以这一讲在 L5 的框架里只换了一个零件：把「学出来的奖励模型」换成「程序判定的奖励」—— 而那一个替换，带来了整个推理模型这一类东西。"});

KP("2 · ⭐ RL 的设定，与它到 LLM 的映射",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("03:31","a policy, which is nothing else than just a probability distribution over actions",166);
  note("⭐ 传统 RL 那一边，三个词就说完了",640,194,"y");
  stack(640,218,["一个 agent 在和 environment 交互","给定当前的 state，它按照某个 policy 采取一个 action","而 policy「不过就是动作上的一个概率分布」—— 没有别的","⚠ 这个定义要记住，它是下一镜那张对照表的左半边"],780,32,6);
  note("讲者这次说得比 L5 更干脆：policy 不神秘，它就是一个分布",640,380,"d");},"<b>先把传统 RL 那一边复述一遍，而这次的措辞比 L5 更干脆。</b><br>⭐ 「policy 不过就是动作上的一个概率分布」—— 这句话值得单独记：在 L5 里他是先写公式 <b>π_θ(a|s)</b>，再解释。这里他<b>直接给了那句大白话</b>。复述时往往比第一次讲时更精炼 —— 因为他知道你已经见过了。<br>而这个定义之所以重要，是因为它让「<b>训练一个策略</b>」变得具体：策略是一个<b>概率分布</b>。分布由<b>参数决定</b>。所以「训练策略」= 「调参数，让那个分布变成我们想要的样子」。<br>而在 LLM 里，那个分布就是模型输出的 softmax。<br>⚠ 这一段回顾讲得比 L5 快得多 —— <b>他默认你刚听过</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("04:11","the environment that it interacts with is just a set of tokens that it can predict over",166);
  note("⭐ 那张对照表，再过一遍",640,194,"y");

  note("「采取一个动作」= 给定已经收到的那串输入，预测下一个 token 是什么",640,292,"y");

  note("⚠ 注意他把 agent 加了引号（quote unquote）—— 因为「agent」这个词今天另有所指",640,368,"d");},"<b>那张对照表再过一遍，而他给 agent 加了引号。</b><br>⭐ 「<b>引号，agent</b>」这个小动作值得注意：他在 L5 里也做过同样的事：「<b>我指的是 RL 术语里的 agent</b>」。因为今天「agent」这个词已经被 LLM 圈用成别的意思了。而那个意思是 L7 的主题 —— 下一讲。<br><b>这个小心翼翼在这一讲里尤其必要</b>：因为这一讲讲的是<b>推理模型</b>，而推理模型<b>常常被叫做「agentic」</b>。但那是另一回事：推理是「想得久」，agent 是「会调工具、会行动」。<br>两者今天经常被混着说，而这门课把它们分成了两讲。<br>请把这个区分记住，<b>因为它会帮你读懂今天大量混乱的宣传</b>：<b>L6 讲「想」，L7 讲「做」</b>。<br>⚠ 而 environment 那一格在 L5 里讲者自己就说过有点牵强 —— <b>这里他直接略过了那个保留</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("05:08","the human preferences is encapsulated in the reward",166);
  note("⭐ 最后一格 奖励：而这一格今天就要被换掉",640,194,"y");
  stack(640,218,["一个 prompt + 一条 completion ⇒ 拿到人类对它的偏好","人类偏好「被封装在奖励里」，再拿这个奖励去调 LLM","所以 L5 的奖励来自：人来标 → 训一个奖励模型 → 它给分","⚠ 这一讲要换掉的就是这个封装：改成程序直接判对错"],780,32,6);
  note("请盯住这一处替换 —— 这一讲后面全部的内容，都是它的后果",640,380,"r");},"<b>最后一格，而今天要换掉的正是这一格。</b><br>⭐ 「被封装在奖励里（encapsulated in the reward）」这个说法很准，<b>而它正是今天要动的地方</b>：<b>L5 的做法</b>：人类偏好 → 训一个奖励模型 → <b>奖励</b>。<b>L6 的做法</b>：<b>正确答案 → 程序判定 → 奖励</b>。「奖励」这个接口没变，变的只是它背后插的是什么。<br>这是一个很漂亮的工程性质：<b>RL 那一整套机器完全不用改</b>：它<b>不关心奖励从哪来</b>。它只要<b>一个数</b>。<br>所以把「人评」换成「程序判」，是一次「插拔式」的替换。<br>而这次替换带来了一个巨大的好处，<b>请先想一下是什么</b>：程序判定的奖励没有 reward hacking 的空间（代码跑过了就是跑过了）。<b>而且它不要钱、不要人、可以无限地产生</b>。<br>于是 L5 里那些关于「奖励模型不完美」的顾虑，一下子都不见了。<br>⚠ 这就是为什么推理模型这条线能走得这么快 —— <b>它站在一个干净得多的奖励上</b>。");
  SUM(0,2,{h:"⭐ RL 设定与它到 LLM 的映射",k:"传统 RL 那一边：<b>「我们有一个 agent 在和 environment 交互，而交互方式是：给定它所处的那个状态，它可以『按照某个 policy』采取一个动作 —— 而那个 policy『不过就是动作上的一个概率分布』；而作为结果，它收到某个奖励」</b>。对照表：<b>「我们的（引号）agent 就只是那个 LLM；它交互的 environment 就只是它能预测的那套 token；给定到目前为止收到的输入，它可以预测『下一个 token 可能是什么』—— 那就是动作；而它用的是『LLM 预测出来的那个概率分布』」</b>。奖励：<b>「我们能为每一条 completion 拿到人类偏好 —— 你有 prompt、有 completion，拿到那些人类偏好，而这就是你用来调 LLM 的东西；因为这一步是在把模型对齐到人类偏好，而那些人类偏好是『被封装在奖励里』的」</b>。",m:"⭐ 「被封装在奖励里」这个说法很准，<b>而它正是今天要动的地方</b>：<b>L5 的做法是「人类偏好 → 训一个奖励模型 → 奖励」；L6 的做法是「正确答案 → 程序判定 → 奖励」—— 「奖励」这个接口没变，变的只是它背后插的是什么</b> ⇒ <b>这是一个很漂亮的工程性质：RL 那一整套机器完全不用改，它不关心奖励从哪来、只要一个数 ⇒ 把「人评」换成「程序判」，是一次「插拔式」的替换</b> ⇒ 而这次替换带来的好处很大：<b>程序判定的奖励没有 reward hacking 的空间（代码跑过了就是跑过了），而且它不要钱、不要人、可以无限地产生 ⇒ L5 里那些关于「奖励模型不完美」的顾虑一下子都不见了 —— 这就是推理模型这条线能走这么快的原因：它站在一个干净得多的奖励上</b>。",w:" 「引号，agent」这个小动作值得注意：<b>他在 L5 里也做过（「我指的是 RL 术语里的 agent」）—— 因为今天「agent」这个词已经被 LLM 圈用成别的意思了，而那个意思是 L7 的主题</b> ⇒ 这个小心翼翼在这一讲尤其必要：<b>推理模型常常被叫做「agentic」，但那是另一回事 —— 推理是「想得久」，agent 是「会调工具、会行动」；两者今天经常被混着说，而这门课把它们分成了两讲 ⇒ L6 讲「想」，L7 讲「做」</b>。",r:"⇒ 「policy 不过就是动作上的一个概率分布」值得单独记：<b>L5 里他是先写公式 π_θ(a|s) 再解释，这里直接给了那句大白话 —— 复述时往往比第一次更精炼，因为他知道你已经见过了</b>；而这个定义让「训练一个策略」变得具体：<b>策略是一个概率分布，分布由参数决定 ⇒ 「训练策略」= 「调参数，让那个分布变成我们想要的样子」，而在 LLM 里那个分布就是模型输出的 softmax</b>。"});
  QUIZ(0,2,{t:"L6 相对 L5，在 RL 这套框架里换掉的是哪一个零件？",o:["换掉了「奖励从哪来」：从「训一个奖励模型」换成「程序判定（可验证的奖励）」—— RL 那套机器完全不用改","换掉了优化器","换掉了策略模型","换掉了 KL 项"],a:0,w:"⇒ 好处很大：程序判定的奖励没有 reward hacking 的空间，而且不要钱、不要人、可以无限产生 —— 推理模型这条线能走这么快，靠的就是这个干净的奖励。"});
});
KP("3 · ⭐ RL 损失的两部分",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("05:32","it has some baseline to just reduce the variance of the gradient",166);
  note("⭐ RL 损失的第一部分：最大化 advantage",640,194,"y");
  stack(640,218,["advantage 从奖励算出来，而且要「带一个基线」","基线的作用只有一个：降低梯度的方差","一句话：advantage = 这一次拿到的 − 本来预期的","⚠ 而「本来预期的」怎么来，正是 GRPO 和 PPO 唯一的分歧点"],780,32,6);
  note("L5 讲了十分钟的东西，这里一句话带过 —— 而这一句就够这一讲用了",640,380,"d");},"<b>一句话复述完了 L5 讲了十分钟的东西。</b><br>⭐ 这句复述里压缩了 L5 的三个知识点，<b>请都认出来</b>：<b>advantage 而不是奖励</b>：我们最大化的是「<b>比预期好多少</b>」。<b>基线</b>：那个「<b>预期</b>」就是基线。<b>降方差</b>：减基线不改变梯度的期望，但减小方差。<br>而「<b>基线</b>」这个词在这一讲里会变得格外重要：L5 里的基线<b>来自一个单独训练的价值模型</b>。而 <b>GRPO</b> 的全部创新，<b>就在于换了一个基线</b>。<br>它用「同一个 prompt 采样一组回答的平均分」当基线 —— 于是价值模型整个被去掉了。<br>所以请把「<b>基线</b>」这两个字记牢，<b>它是这一讲最关键的那个接口</b>：GRPO 这个名字里的 G，就是 Group —— 指的正是那「一组」采样。<br>⚠ 讲者这里完全没提 value function —— <b>而那正是因为今天要把它拿掉</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("06:09","the reason why we don't want to change too much is because our model has already learned a lot",166);
  note("⭐ 第二部分：别跑太远，而它有两个参照物",640,194,"y");
  boxNode(60,222,560,44,"别偏离「上一次迭代」太多","b");
  note("管的是「速度」：一步最多走多远",340,292,"b");
  boxNode(660,222,560,44,"也别偏离「最初的模型」太多","g");
  note("管的是「位移」：总共最多离家多远",940,292,"g");
  note("理由：模型「已经学了很多」，「在它做的事情上已经相当能打」",640,336,"y");
  note("⚠ 我们只是想把它挪向人类偏好 ——「那不是一件希望模型完全改变的事」",640,374,"r");},"<b>第二部分，而那两个参照物正是 L5 里那个最容易混的地方。</b><br>⭐ 两个参照物，<b>这正是 L5 里那个最容易混的地方</b>：<b>π_old</b>（上一次迭代）⇒ 管「<b>速度的上限</b>」⇒ 对应 <b>clip</b>。<b>π_ref</b>（SFT 模型）⇒ 管「<b>位移的上限</b>」⇒ 对应 <b>KL 惩罚</b>。<br>而「<b>它已经相当能打</b>」这个理由，<b>在这一讲里会被重新审视</b>：L5 的逻辑是：<b>模型已经很好了，别弄坏它</b>。而这一讲要做的，恰恰是让模型学会一个它原来不太会的行为（长链条推理）。<br>所以「别跑太远」这个约束，在推理训练里的分寸和 L5 不完全一样。<br>请带着这个疑问往下听：如果我们要模型学会一个新行为，那「别跑太远」还对吗：而后面会看到：有些 GRPO 的变体干脆把 KL 项去掉了。<br>⚠ 这是这一讲和 L5 之间一个很微妙、但很重要的张力。");
  SUM(0,3,{h:"⭐ RL 损失的两部分",k:"<b>「RL 阶段的那个损失函数是由两部分组成的」</b>。第一部分：<b>「这个 advantage 最大化 —— 而那个 advantage 是『基于那些奖励』的，而且它『带一个基线』，就是为了『降低梯度的方差』」</b>。第二部分：<b>「我们不想模型偏离太多 —— 既不想偏离『上一次迭代』（不想它从一次迭代到下一次变化太大），也不想相比『最初的模型、基座模型』变化太多（这里是那个 SFT 模型）」</b>；理由：<b>「因为我们的模型『已经学了很多』，它『在它做的事情上已经相当能打』—— 而我们想要的只是把它对齐到人类偏好，那不是一件『我们希望模型完全改变』的事」</b>。",m:"⭐ 「基线」这两个字在这一讲里格外重要：<b>L5 里的基线来自一个单独训练的价值模型，而 GRPO 的全部创新就在于换了一个基线 —— 它用「同一个 prompt 采样一组回答的平均分」当基线，于是价值模型整个被去掉了</b> ⇒ <b>GRPO 这个名字里的 G 就是 Group，指的正是那「一组」采样 —— 所以「基线」是这一讲最关键的那个接口</b>（讲者这里完全没提 value function，而那正是因为今天要把它拿掉）。",w:"⭐ 两个参照物正是 L5 里那个最容易混的地方：<b>π_old（上一次迭代）管「速度的上限」⇒ 对应 clip；π_ref（SFT 模型）管「位移的上限」⇒ 对应 KL 惩罚</b>。而「它已经相当能打」这个理由<b>在这一讲里会被重新审视</b>：<b>L5 的逻辑是「模型已经很好了，别弄坏它」；而这一讲要做的恰恰是让模型学会一个它原来不太会的行为（长链条推理）⇒ 「别跑太远」这个约束在推理训练里的分寸和 L5 不完全一样</b> ⇒ <b>请带着这个疑问往下听：如果我们要模型学会一个新行为，那「别跑太远」还对吗？—— 而后面会看到，有些 GRPO 的变体干脆把 KL 项去掉了</b>。",r:"⇒ 那句复述里压缩了 L5 的三个知识点：<b>advantage 而不是奖励（我们最大化的是「比预期好多少」）、基线（那个「预期」就是基线）、降方差（减基线不改变梯度的期望但减小方差）</b>。"});

KP("5 · ⭐ vanilla LLM 的强项，与第一个弱点",function(){

  stack(640,218,["vanilla LLM = 到现在为止学的那种：一个 prompt 进去，一个答案出来","它的强项：懂文本的结构、懂代码的结构","具体到活儿：debug 时很会找错在哪 · 很会生成代码 · 很会写文章和诗","⚠ 注意这四样的共同点：答案没有唯一标准，而且不需要多步演算"],780,32,6);
  note("先列强项再说弱点是有意的 —— 它避免你误以为「推理模型出来了，普通 LLM 就过时了」",640,380,"d");},"<b>先给旧模型一个名字，然后老老实实地列它的强项。</b><br>⭐ 「<b>vanilla（原味）</b>」这个词在系统和机器学习里是固定说法：它指「<b>最基本、没有加任何花样的那个版本</b>」。L4 里讲 FlashAttention 时也用过这个词（「<b>原味的注意力实现</b>」）。<br>而讲者先列强项再说弱点，<b>这个顺序是有意的</b>：它避免了一个常见的误导：让你以为「推理模型出来了，普通 LLM 就过时了」。事实恰恰相反：绝大多数日常任务用普通 LLM 更合适，因为推理模型又慢又贵。<br>而这一点在这一讲最后讲「思考预算」时会再回来。<br>请把这个列表记一下，因为它定义了「推理模型不需要解决的问题」：写代码、找 bug、写文章、写诗 —— 这些普通 LLM 已经很好了。<br>⚠ 注意这四项全是「<b>生成类</b>」任务 —— 而它们的共同点是：答案没有唯一标准，而且不需要多步演算。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,218,["症状：给它一道复杂的数学题，它会「在半路上迷失」","病因：它从头到尾只被训练过一件事 —— 给定 prompt，预测下一个 token","所以讲者说：「并没有什么大的理由说它「应该」能解复杂的问题」","⇒ 推理在 vanilla LLM 里是副产品，不是被优化的目标"],780,32,6);
  note("它能做一点，只是因为训练数据里有大量人类写的推理过程 —— 没人专门教过它",640,380,"r");},"<b>第一个弱点，而讲者给的理由非常到位。</b><br>⭐ 「<b>没有什么大的理由说它应该能</b>」—— 这句话是整个论证的核心：它用的还是那个老句式：<b>模型只会它被优化的那件事</b>。训练目标是「<b>预测下一个 token</b>」。而「解一道多步数学题」从来不在目标函数里。<br>所以推理能力在 vanilla LLM 里是一个<b>副产品</b>，不是一个被优化的目标：它能做一点，<b>是因为训练数据里有大量人类的推理过程</b>。但它<b>没有被专门训练去做这件事</b>。<br>于是碰到够难的题，它就「在半路上迷失」。<br>这就直接给出了这一讲要做的事：把「推理」从副产品变成一个被直接优化的目标：<b>而这正是 GRPO 那一段在做的</b>。<br>⚠ 「在半路上迷失（get lost in the way）」这个说法很形象 —— 它描述的是「前几步对了，后面跑偏了」这种典型的失败。");
  SUM(0,5,{h:"⭐ vanilla LLM 的强项与弱点一",k:"<b>「到现在为止我们看的是『vanilla LLM』—— 拿某个东西作为输入（比如一个 prompt），然后就回一个答案」；它们有很多强项：「懂很多文本的结构、懂很多代码」—— debug 代码时「很擅长找出错在哪」、很擅长生成代码、也很擅长写文章或诗，「真的非常非常好」</b>。弱点一：<b>「这些 vanilla LLM 有『引号，有限的推理能力』—— 典型地，如果你给它一个复杂的数学题，它不会真的给出解法，它可能会『在半路上迷失』，因为到现在为止我们的模型一直是被训练成『给定一个 prompt，用下一个 token 预测去回应它』⇒ 并没有什么大的理由说它『应该』能解决复杂的问题」</b>。",m:"⭐ 「没有什么大的理由说它应该能」是整个论证的核心：<b>它用的还是那个老句式 —— 模型只会它被优化的那件事；训练目标是「预测下一个 token」，而「解一道多步数学题」从来不在目标函数里</b> ⇒ <b>所以推理能力在 vanilla LLM 里是一个副产品、不是一个被优化的目标：它能做一点是因为训练数据里有大量人类的推理过程，但它没有被专门训练去做这件事 ⇒ 于是碰到够难的题，它就「在半路上迷失」</b> ⇒ <b>这就直接给出了这一讲要做的事：把「推理」从副产品变成一个被直接优化的目标 —— 而这正是 GRPO 那一段在做的</b>。",w:" 讲者先列强项再说弱点，<b>这个顺序是有意的</b>：<b>它避免了一个常见的误导 —— 让你以为「推理模型出来了，普通 LLM 就过时了」；事实恰恰相反：绝大多数日常任务用普通 LLM 更合适，因为推理模型又慢又贵</b>（这一点在讲「思考预算」时会再回来）⇒ <b>那个强项列表定义了「推理模型不需要解决的问题」：写代码、找 bug、写文章、写诗 —— 而它们的共同点是答案没有唯一标准，而且不需要多步演算</b>。",r:"⇒ 「vanilla（原味）」在系统和机器学习里是固定说法，<b>指「最基本、没加任何花样的那个版本」—— L4 讲 FlashAttention 时也用过（「原味的注意力实现」）</b>。⚠ 「在半路上迷失（get lost in the way）」这个说法很形象，<b>它描述的是「前几步对了，后面跑偏了」这种典型的失败</b>。"});

  note("⚠ 三种问题三种解法，所以被分到了三讲 —— 而三者叠起来，就是今天说的 agent",640,368,"d");},"<b>第三个弱点只有一句话，而它是下一讲的全部主题。</b><br>⭐ 「全是说，没有做（all talk, no action）」是一句英语习语：它原本是用来<b>说人的</b>：只会讲，不会干。用在 LLM 上非常贴切：它能告诉你怎么订机票，但它订不了。<br><b>这个弱点和前两个性质完全不同</b>：<b>弱点一</b>（推理）：是<b>能力</b>问题 ⇒ <b>靠训练解决</b>。<b>弱点二</b>（知识过时）：是<b>信息</b>问题 ⇒ <b>靠检索解决</b>。<b>弱点三</b>（不能行动）：是<b>接口</b>问题 ⇒ <b>靠给它工具解决</b>。<br>三种问题，三种完全不同的解法 —— 所以它们被分到了三讲。<br>而这三者在今天的产品里是叠在一起用的：一个能推理、能检索、能调工具的模型 ⇒ <b>那就是今天说的「agent」</b>。<br>⚠ 讲者说「<b>你就只能自己去做</b>」—— 这正是 agent 这个概念要消除的那一步。");

  SUM(0,6,{h:"⭐ 另外三个弱点与今天的范围",k:"弱点二：<b>「我们手上这个 LLM 是在『海量的、而且是静态的』数据上预训练的 —— 意思是它所获得的知识『被绑在截止日期上』；如果我们是用选举之前的数据训的，那今天问它『某某的当选官员是谁』，它答不上来」</b>。弱点三：<b>「到现在为止，『全是说，没有做』—— 你就是 prompt 你的 LLM，但如果你想下一个订单、做点什么动作，你就只能自己去做」</b>。弱点四：<b>「和传统 NLP 模型不同，LLM 生成的是『自由形式的文本』—— 而在 ML 社区直到几年前采用的那套框架里（翻译用 BLEU、摘要用 ROUGE）很难评估它们；但 LLM 能做的远不止那些，所以非常难评估」</b>。范围：<b>「这只是一个子集；后面三个会是『下一讲和第 8 讲』的话题；而今天的焦点是推理」；「这是一个非常新的话题 —— 我说新大概指一年，所以我们要看的几乎所有东西不是 2024 年的就是 2025 年的；而我们很幸运，因为现在有足够的后见之明，知道哪一块比别的更重要」</b>。",m:"⭐ 四个弱点和后面三讲对上，<b>整门课的结构就清楚了</b>：<b>弱点一（推理）⇒ L6 就是今天；弱点二（知识过时）+ 弱点三（不能行动）⇒ L7（Agentic LLMs）；弱点四（难评估）⇒ L8（LLM Evaluation）</b> ⇒ 而三个弱点的性质完全不同：<b>推理是「能力」问题（靠训练解决）；知识过时是「信息」问题（靠检索解决）；不能行动是「接口」问题（靠给它工具解决）—— 三种问题三种解法，所以它们被分到三讲；而这三者在今天的产品里是叠在一起用的，一个能推理、能检索、能调工具的模型，就是今天说的「agent」</b>。",w:"⭐ 弱点四在这门课里已经铺过两次，<b>每次角度不同</b>：<b>L4 是「没有哪一个数字能告诉你你关心的东西」；L5 是「BLEU/ROUGE 比的是和参考答案的字面重合，而偏好调优根本没有参考答案」；这里是「自由形式的输出装不进旧框架」</b> ⇒ 而这一讲马上要给出一个很重要的<b>例外</b>：<b>数学题和编程题是可以被自动判对错的 ⇒ 「难评估」这件事在推理这个场景里恰好不成立，而正是这个例外让 RL 在推理上变得异常好用</b> ⇒ <b>请把这个因果链记住：推理任务可验证 ⇒ 奖励可以程序化 ⇒ RL 可以大规模地跑 —— 这就是为什么「推理」成了 RL 在 LLM 上第一个真正成功的大规模应用</b>（讲者没点破这个对比，但它就埋在这里）。",r:"⇒ 弱点二的根是「静态」：<b>预训练数据是某个时刻的一个快照，模型的知识就冻在那个快照上 —— 世界继续往前走，而模型不会</b>；解法不是「更频繁地重训」（<b>重训一次要几千万美元，而世界每天都在变</b>）⇒ <b>解法是让模型「去外面查」，那就是 L7 的 RAG 和工具调用</b>；⚠ <b>注意他举的是一个「无法靠推理补上」的例子 —— 再会推理也猜不出谁当选了，这说明弱点二和弱点一是两类不同的问题</b>。⇒ 而「我们很幸运，因为现在有足够的后见之明」这句话很诚实：<b>它承认一年前讲这个你分不清哪些方法会活下来，而现在已经能看出来了 —— 这也是为什么这一讲讲的是 GRPO 和 R1，而不是 2024 年那一堆已被淘汰的尝试</b> ⇒ <b>对「为科研看课」的用途，这一讲的时效性是双刃的：好处是离前沿最近，坏处是最容易过期 ⇒ 听的时候要分清「这一年的做法」和「不会过期的判断」</b>。"});

  note("所以读论文第一件事是看它怎么量「推理」—— 有人指准确率，有人指逻辑一致性",640,380,"r");},"<b>坏消息先说：这个领域最核心的那个词，没有公认的定义。</b><br>⭐ 「<b>没有公认定义</b>」这件事值得停一下，<b>因为它有实际后果</b>：不同论文说「<b>推理能力提升了</b>」时，<b>说的可能不是同一件事</b>。有人指<b>数学题准确率</b>，有人指<b>逻辑一致性</b>，有人指<b>能不能分解问题</b>。所以读论文时，第一件事是看它怎么量「推理」。<br>而讲者给的定义「<b>解决一个问题的能力</b>」是一个<b>操作性定义</b>：它不试图说清「<b>推理在本质上是什么</b>」。它只说「<b>我们用什么来判断有没有推理</b>」。<br>这是一个很工程的处理：绕开哲学争论，直接给一个能测的标准。<br>请注意这个做法和 L4 结尾那段是一脉相承的：<b>量不清的东西，就先定义一个能量的代理</b>。而代价是：你从此只能谈那个代理 —— 以及它会被 hack 掉。<br>⚠ 讲者说「<b>我会尽我所能</b>」—— 他明确标注了这是他自己的定义，不是领域共识。");

  note("⚠ 而「数学 + 编程」真正的理由不是难，是它们「可以被自动判对错」",640,380,"r");},"<b>定义的第二半才是关键：它需要多步。</b><br>⭐ 完整的定义是两半，<b>而第二半才是真正起作用的那一半</b>：① <b>解决一个问题的能力</b>。② <b>而解决它需要一个多步的过程</b>。第一半太宽（什么都算），第二半才把范围收住。<br>「<b>多步</b>」这个特征为什么是关键：它正好解释了为什么「<b>让模型多生成一些 token</b>」会有用。如果答案是<b>一步就能得到的</b> ⇒ <b>多想没用</b>。如果答案<b>需要多步</b> ⇒ <b>给它空间把这些步写出来，就真的有用</b>。<br>所以「推理模型」这个方案，和「推理问题」这个定义是配套的。<br>而「<b>数学题和编程题</b>」这个范围限定，<b>其实暴露了一个更深的原因</b>：这两类题不只是「需要多步」，它们还「可以被自动判对错」。<b>而后者才是它们成为训练场的真正理由</b>。<br>⚠ 讲者说「<b>希望这些能力也能扩散到别的领域</b>」—— 这是一个期望，不是一个已经被证实的结论。");

  stack(640,218,["核心想法：借一个这门课前面讲过的概念 —— chain of thought（L2/L3 讲过）","推理模型的起点不是新架构：不是新的注意力、不是更多参数、不是更长上下文","它就是一个 2022 年的 prompting 技巧（Wei et al., CoT Prompting）","⇒ 而这一讲做的事，是把它从「技巧」放大成「一类模型的定义特征」"],780,32,6);

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 而光是这个形状的改变，准确率就显著提升了 —— 2022 年这件事相当令人意外",640,368,"d");},"<b>学生给了一个很精炼的回答。</b><br>⭐ 「thinking in steps instead of just giving a blanket answer」这十来个词，<b>就是 CoT 的全部定义</b>：「<b>blanket answer</b>」= <b>一个笼统的、不带过程的答案</b>。「<b>thinking in steps</b>」= <b>把中间过程写出来</b>。<br>而请注意这里<b>什么都没变</b>：<b>模型没变、权重没变、架构没变</b>。变的只是「输出的形状」—— 从「答案」变成「过程 + 答案」。<br>而这个输出形状的改变，就让准确率显著提升了。这件事在 2022 年是相当令人意外的。<br>为什么写出过程会让答案更准？<b>讲者马上会给两个直觉</b>：① <b>把难题分解成模型见过的小题</b>。② <b>多生成 token = 多给算力</b>。<br>这两个直觉值得分开记，因为后面的「思考预算」只建立在第二个上。<br>⚠ 讲者话说一半被打断了（「<b>就为了说明 —— 对。哦，对</b>」）—— <b>又有学生举手，而那个追问很好</b>。");
  SUM(0,8,{h:"⭐ 核心想法：借 chain of thought",k:"<b>「现在我们大致知道了推理是什么，接下来要看怎么『得到一个能应付这类 prompt 的模型』—— 而这里的核心想法，是去『借用一个我们这门课前面看过的概念』：回到大概第二或第三讲，我们看过一个叫 chain of thought 的技术」</b>；学生的回答：<b>「对，正是 —— 答案是『一步一步地想』，而不是只给『一个一揽子的答案』」</b>。",m:"⭐ 这句话的分量请不要低估：<b>推理模型的起点不是一个新架构 —— 不是新的注意力机制、不是更多参数、不是更长的上下文，它是一个 2022 年的 prompting 技巧（Wei et al., Chain-of-Thought Prompting）</b> ⇒ <b>而「thinking in steps instead of just giving a blanket answer」这十来个词就是 CoT 的全部定义：「blanket answer」是笼统的、不带过程的答案；「thinking in steps」是把中间过程写出来</b> ⇒ <b>请注意这里什么都没变：模型没变、权重没变、架构没变，变的只是「输出的形状」—— 从「答案」变成「过程 + 答案」，而这个改变就让准确率显著提升了（这件事在 2022 年是相当令人意外的）</b>。",w:" 「借用一个前面看过的概念」说明了这门课的设计：<b>L2/L3 讲 CoT 时它只是「prompting 的一个技巧」，到了这里它成了「一整类模型的定义特征」—— 同一个东西在两个尺度上的意义完全不同，而这正是「放大」这个词的含义</b> ⇒ <b>请先把路线图记住，因为这一讲剩下的全部内容都挂在它上面：① CoT 是一个 prompting 技巧 ⇒ ② 把它放大 ⇒ ③ 怎么让模型「自己就这么做」而不用你 prompt ⇒ 那就是训练的部分</b>。",r:"⇒ 为什么写出过程会让答案更准？讲者马上会给两个直觉：<b>① 把难题分解成模型见过的小题；② 多生成 token = 多给算力 —— 这两个直觉值得分开记，因为后面的「思考预算」只建立在第二个上</b>。⚠ <b>讲者话说一半被打断了（「就为了说明 —— 对。哦，对」）—— 又有学生举手，而那个追问很好</b>；而他又在用提问的方式引入关键概念，<b>这门课里他每次要引入一个关键概念，都先把它交给学生说一遍</b>。"});

  stack(640,218,["日期这种小块上下文，preamble 就解决了","但「你根本没有的那些信息」怎么办 —— 讲者明确推给第 7 讲","他的用词是：那是推理模型的「扩展」，不是「它们怎么工作的基础」","⇒ 基础（今天）= 自己能不能把难题分步走完；扩展（L7）= 能不能去外面取"],780,32,6);
  note("顺序不能倒：不会推理的模型给它检索也用不好（不知道查什么、查到了也不会组合）",640,380,"r");},"<b>而讲者把边界划得很干净。</b><br>⭐ 「<b>扩展</b>」和「<b>基础性</b>」这个区分非常重要，<b>而它正是这一讲和下一讲的分界线</b>：<b>基础性（今天）</b>：模型<b>自己能不能把一个难题分步走完</b>。<b>扩展（L7）</b>：模型能不能<b>去外面取它没有的东西</b>。<br><b>为什么这个顺序是对的</b>：一个<b>不会推理</b>的模型，<b>就算给它检索也用不好</b>（它不知道该查什么、查到了也不会组合）。而一个<b>会推理</b>的模型，<b>加上检索就立刻强一个量级</b>。<br>所以推理是底座，检索是放大器 —— 顺序不能倒。<br>而这也解释了今天的 agent 为什么都是推理模型：「决定下一步该调哪个工具」本身就是一个多步推理问题。<br>⚠ 讲者说「<b>绝对是一个会非常有用的东西</b>」—— 他在给下一讲打广告，但这个判断是对的：RAG 和工具调用是今天落地最多的那一块。");
  SUM(0,9,{h:"⭐ preamble 与 L7 的预告",k:"学生的追问：<b>「对某些问题，你需要有某种『上下文』的成分 —— 比如这里，你需要你的 LLM 知道今天是 2025 年 11 月 7 日」</b>；讲者的回答分两半：<b>「典型地，LLM 有一个我们称之为『preamble（前言）』的东西 —— 某种告诉你一些上下文的东西，而典型地『日期』就是我们放在 preamble 里的那种东西 ⇒ 所以对这个非常具体的情形，日期是『已经可以被 LLM 拿到』的信息」</b>；另一半：<b>「但对另外一些问题，你完全可能有你『并不拥有』的信息或上下文 —— 而在『第 7 讲』我们会看怎么把它『取回来』；不过就今天而言，我们会把它当成『推理模型的一个扩展』，而不是『它们怎么工作的基础』」</b>。",m:"⭐ 「扩展」和「基础性」这个区分正是这一讲和下一讲的分界线：<b>基础性（今天）是「模型自己能不能把一个难题分步走完」；扩展（L7）是「模型能不能去外面取它没有的东西」</b> ⇒ 而这个顺序是对的：<b>一个不会推理的模型，就算给它检索也用不好（它不知道该查什么、查到了也不会组合）；而一个会推理的模型，加上检索就立刻强一个量级 ⇒ 推理是底座，检索是放大器，顺序不能倒</b> ⇒ <b>这也解释了今天的 agent 为什么都是推理模型：「决定下一步该调哪个工具」本身就是一个多步推理问题</b>。",w:" 「preamble」是一个实际的工程细节，值得记：<b>它是系统 prompt 的一部分，由服务方自动塞在你的输入前面，里面典型地有当前日期、模型自己的身份、一些行为约束 ⇒ 所以「今天是哪天」这件事，模型不是「知道」的，是「被告知」的</b> ⇒ 而它和弱点二（知识截止）是<b>同一个问题的两个解法：preamble 解决「静态的一小块」（日期），L7 的检索解决「动态的一大块」（新闻、文档）</b>。",r:"⇒ 那个学生发现的是熊那个例子里的一个真漏洞：<b>「2020 年出生的熊在 2025 年多大」要算 2025 − 2020，但如果题目只说「现在」呢？模型怎么知道「现在」是哪一年</b>。⇒ 这也把录课日期钉死了：<b>2025 年 11 月 7 日 —— 而前面那场「几天前的选举」就是 2025 年 11 月 4 日那场</b>。⚠ <b>讲者说 L7「绝对是一个会非常有用的东西」—— 他在给下一讲打广告，但这个判断是对的：RAG 和工具调用是今天落地最多的那一块</b>。"});
  QUIZ(0,9,{t:"「今天是哪天」这件事，LLM 是怎么知道的？",o:["它从预训练数据里推断出来","它每次都去网上查","它不是「知道」的，是「被告知」的 —— preamble（系统 prompt 的前置部分）里典型地就塞了当前日期","它不知道，所以这类问题答不了"],a:2,w:"⇒ 而「拿不到的那一大块上下文」被明确推给了 L7：preamble 解决静态的一小块，检索解决动态的一大块。"});
});
KP("10 · ⭐ CoT 到底是什么，以及第一个直觉",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("18:34","the way chain of thought did that was by having some in-context learning examples",166);
  note("⭐ CoT 的机制：用示例「示范」推理，而不是训练",640,194,"y");
  stack(640,218,["CoT 的机制：在 prompt 里放几个例题，而例题答案里带着解题过程","模型看到这个「格式」，就照着这个格式输出 —— 不改一个权重","所以它是纯粹的 in-context learning（L2 讲过）：只改输入","⇒ 讲者自己改口强调：这就是 CoT 的全部，没有更多了"],780,32,6);
  note("而这一讲要做的，是同一件事「在大得多的尺度上」—— 这七个字是全片的纲领",640,380,"r");},"<b>CoT 的机制，以及这一讲的全部纲领。</b><br>⭐ 注意 CoT 原始版本的机制：<b>它完全不训练任何东西</b>：它只是在 prompt 里放几个例题，而例题的答案里带着解题过程。模型看到这个<b>格式</b>，就<b>照着这个格式输出</b>。<br>这是纯粹的 in-context learning（L2 讲过）：不改一个权重，只改输入。<br>而讲者那句自我更正很有意思：「那就是粗略的想法 —— 不，那不是粗略的想法，那就是那个想法」：他本来想说「<b>大致是这样</b>」，然后<b>自己改口说「就是这样，没有更多了</b>」。意思是：CoT 真的就这么简单，没有隐藏的复杂性。<br>「<b>在一个大得多的尺度上</b>」—— <b>这七个字是这一讲的全部纲领</b>：「尺度」指什么？指推理链的长度（从几句变成几千 token）、指它的来源（从 prompt 示例变成模型自己学会）。<br>⚠ 所以「<b>推理模型</b>」的一句话定义是：把 CoT 从「你 prompt 它」变成「它自己就这么做，而且做得长得多」。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("19:36","there are very few chances that that problem appeared in the training sets",166);
  note("⭐ 第一个直觉：把难题分解成「见过的」小题",640,194,"y");
  stack(640,218,["前提：模型只会重现它见过的模式（它只被训过「下一个 token 预测」）","一道难题整体 ⇒ 训练集里几乎肯定没有","但这道题的每一个小步骤 ⇒ 训练集里有成千上万个例子","⇒ 所以拆开，就把「没见过的」换成了「见过很多次的」"],780,32,6);
  note("这个覆盖率论证也划出了边界：需要「新知识」而不是「新组合」的题，CoT 没用",640,380,"g");},"<b>第一个直觉，而它本质上是一个「覆盖率」论证。</b><br>⭐ 这个论证的结构非常清楚，而它完全建立在「下一个 token 预测」这一件事上：模型只会<b>重现它见过的模式</b>。一道<b>难题整体</b>：<b>训练集里几乎肯定没有</b>。但这道题的<b>每一个小步骤</b>：<b>训练集里有成千上万个例子</b>。<br>所以把难题拆开，就把「没见过的东西」换成了「见过很多次的东西」。<br>这是一个<b>覆盖率</b>论证，<b>而它解释了一个具体的现象</b>：为什么 CoT 在<b>多步算术</b>上提升巨大？<b>因为每一步单独看都是模型早就会的</b>。为什么 CoT 在<b>需要新知识</b>的题上<b>没用</b>？<b>因为分解不出模型见过的子问题</b>。<br>「听起来可信（sound plausible）」这个措辞请留意：它诚实地说明了模型的默认行为：它优化的是「像人会说的话」，不是「对」。<br>⚠ 而这正是为什么推理需要被单独训练 —— 「可信」和「正确」不是同一件事。");
  SUM(0,10,{h:"⭐ CoT 的机制与第一个直觉",k:"<b>「chain of thought 做到这一点的方式，是『用一些 in-context learning 的示例，在示例里显式地（写出）推理』，来『鼓励模型在给出答案之前也那么做』」；「那就是粗略的 —— 不，那不是粗略的想法，那『就是』chain of thought 背后的想法。而这里我们想做的，是做同一件事，但『在一个大得多的尺度上』」</b>。第一个直觉：<b>「LLM 基本上是用『下一个 token 预测』训出来的，所以它们回答的方式典型地是『听起来可信』—— 在最大化那些 token 发生的概率；所以如果你给它一个非常难的问题，『那个问题出现在训练集里的机会非常小』⇒ 而想法是让 LLM『把这个问题分解成若干可处理的问题』，然后『依靠它在训练时见过的那些模式』去解掉所有这些小问题」</b>。",m:"⭐ CoT 原始版本<b>完全不训练任何东西</b>：<b>它只是在 prompt 里放几个例题，而例题的答案里带着解题过程 —— 模型看到这个「格式」，就照着这个格式输出；这是纯粹的 in-context learning（L2 讲过）：不改一个权重，只改输入</b> ⇒ 而第一个直觉的结构非常清楚，<b>它完全建立在「下一个 token 预测」这一件事上：模型只会重现它见过的模式；一道难题整体，训练集里几乎肯定没有；但这道题的每一个小步骤，训练集里有成千上万个例子 ⇒ 所以把难题拆开，就把「没见过的东西」换成了「见过很多次的东西」</b>。",w:" 这是一个<b>覆盖率</b>论证，而它解释了一个具体现象：<b>为什么 CoT 在多步算术上提升巨大？因为每一步单独看都是模型早就会的；为什么 CoT 在需要新知识的题上没用？因为分解不出模型见过的子问题</b> ⇒ 而「听起来可信（sound plausible）」这个措辞请留意：<b>它诚实地说明了模型的默认行为 —— 它优化的是「像人会说的话」，不是「对」；而这正是为什么推理需要被单独训练：「可信」和「正确」不是同一件事</b>。",r:"⇒ 讲者那句自我更正很有意思（「那就是粗略的想法 —— 不，那不是粗略的想法，那就是那个想法」）：<b>他本来想说「大致是这样」，然后自己改口说「就是这样，没有更多了」—— 意思是 CoT 真的就这么简单，没有隐藏的复杂性</b>。⇒ 而「在一个大得多的尺度上」这七个字是这一讲的全部纲领：<b>「尺度」指推理链的长度（从几句变成几千 token），也指它的来源（从 prompt 示例变成模型自己学会）</b> ⚠ <b>所以「推理模型」的一句话定义是：把 CoT 从「你 prompt 它」变成「它自己就这么做，而且做得长得多」</b>。"});
  QUIZ(0,10,{t:"「分解问题」这个直觉为什么能解释 CoT 有效？",o:["因为分解之后 token 变少了","因为难题整体几乎肯定不在训练集里，但它的每一个小步骤有成千上万个例子 —— 拆开就把「没见过的」换成了「见过很多次的」","因为模型会对短句更准确","因为分解会触发不同的注意力头"],a:1,w:"⇒ 这个覆盖率论证也解释了 CoT 的边界：需要「新知识」而不是「新组合」的题，分解不出见过的子问题，CoT 就没用。"});
});
KP("11 · ⭐ 另两个直觉：像学生那样，以及「更多 token = 更多算力」",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("20:06","you try to link it back to something that you know",166);
  note("⭐ 讲者把这个直觉接到你自己的考试经验上",640,194,"y");
  boxNode(130,222,1020,44,"讲者把这个直觉接到你自己的考试经验上","g");
  note("你做一道没见过的难题时，不是凭空想出解法，是在回忆「这一步像我做过的哪道题」",640,292,"y");
  note("而把题拆成几步，正是为了让每一步都能对上你记得的某个套路",640,330,"g");
  note("⚠ 限制也一样：某一步完全不像你学过的任何东西，拆得再细也过不去",640,368,"d");},"<b>讲者又把这个直觉接到你自己的考试经验上。</b><br>⭐ <b>这个类比其实比它看起来更准确</b>：你做一道<b>没见过的难题</b>时，你做的事情是什么？<b>你不是「凭空想出一个解法」</b>。你是在回忆：「这一步像我做过的哪道题」。<br>而把题拆成几步，正是为了让每一步都能对上你记得的某个套路。<br>而这个类比也点出了 CoT 的一个<b>限制</b>：如果某一步<b>完全不像任何你学过的东西</b> ⇒ <b>拆得再细也过不去</b>。模型也一样：分解只能把问题移到「它熟悉的区域」，移不进去就还是解不出。<br>讲者把「<b>你学习的时候</b>」直接叫成「训练时（at training time）」：<b>这个人—模型的类比在这门课里反复出现</b>。L5 讲偏好调优时他用过「你怎么学会写得像个人」。<br>它好用，但也要小心：类比能帮你记住机制，不能当成证据。<br>⚠ 下一个直觉会完全不同 —— <b>它不靠类比，而是一个硬的计算量论证</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("20:37","when you let the LLM generate more tokens, you're just giving it more compute",166);
  note("⭐ 第二个直觉：更多 token = 更多算力（这条最硬）",640,194,"y");
  stack(640,218,["每一个输出 token，都对应一整次完整的前向传播（L1/L4 讲过）","所以 N 个 token = N 次前向 ⇒ 多生成 token 字面上就是多花算力","生成 1000 个「思考」token ≈ 比直接答一句话多花几百倍计算","⇒ 一个固定大小的模型想多花算力，唯一的办法就是多生成 token"],780,32,6);
  note("这一条不是类比，是恒等式 —— 而「思考预算（compute budget）」整块内容都建在它上面",640,380,"r");},"<b>第二个直觉，而这一条最硬 —— 它不是类比，是一个计算量恒等式。</b><br>⭐ 请把这一条和上一条分开记，<b>因为它们的性质完全不同</b>：<b>第一个直觉（分解）</b>：一个关于「模型见过什么」的论证 —— 是启发式的。<b>第二个直觉（算力）</b>：一个关于「花了多少 FLOPs」的论证 —— 是恒等式。<br><b>这个恒等式为什么成立</b>：一个标准 LLM 对<b>每一个</b>输出 token 做<b>一整次</b>完整的前向传播（L1/L4 讲过）。所以N 个 token = N 次完整前向传播。生成 1000 个 token 的「思考」= 比直接答一句话多花了几百倍的计算。<br>而一个固定大小的模型，想在一次回答里多花算力，唯一的办法就是多生成 token。<br><b>这一条是后面一整块内容的地基</b>：它直接定义了「test-time compute（推理期算力）」这个概念。它让「思考预算（compute budget）」成为一个可以调的旋钮。而它也解释了推理模型为什么又慢又贵 —— 慢和贵不是实现问题，是这个方案的本质代价。<br>⚠ 讲者在这里就把「<b>compute budget</b>」这个词预告了 —— <b>记住它，这一讲后面会回来</b>。");
  SUM(0,11,{h:"⭐ 另两个直觉",k:"类比那一条：<b>「这有点像你们、或者我们当学生的时候：当我们给你一个问题，你会试着『把它链接回某个你知道的、你在「训练时」—— 就是你学习的时候 —— 见过的东西』，来解掉它们，从而找到答案」</b>。而最硬的那一条：<b>「我想另一个你能想到的理由是：当你让 LLM『生成更多 token』时，『你其实只是在给它更多算力』—— 因为在『每一个生成步』你都有『这一整次前向传播』，而当你做得更多次，你就只是给了它更多算力」；「而我们会看到有一个被称为『compute budget（算力预算）』的词 —— 那就是你想让你的 LLM 拿来生成回应的那个预算，我们后面会看到」</b>。",m:"⭐ 请把两个直觉分开记，<b>因为它们的性质完全不同</b>：<b>第一个（分解）是关于「模型见过什么」的论证 —— 启发式的；第二个（算力）是关于「花了多少 FLOPs」的论证 —— 恒等式</b> ⇒ 这个恒等式为什么成立：<b>一个标准 LLM 对每一个输出 token 做一整次完整的前向传播（L1/L4 讲过）⇒ N 个 token = N 次完整前向传播 ⇒ 生成 1000 个 token 的「思考」= 比直接答一句话多花了几百倍的计算</b> ⇒ <b>而一个固定大小的模型，想在一次回答里多花算力，唯一的办法就是多生成 token</b>。",w:" 第二条是后面一整块内容的地基：<b>它直接定义了「test-time compute（推理期算力）」这个概念；它让「思考预算（compute budget）」成为一个可以调的旋钮；而它也解释了推理模型为什么又慢又贵 —— 慢和贵不是实现问题，是这个方案的本质代价</b>（讲者在这里就把「compute budget」这个词预告了，记住它，这一讲后面会回来）。",r:"⇒ 那个考试类比其实比看起来更准确：<b>你做一道没见过的难题时，不是「凭空想出一个解法」，而是在回忆「这一步像我做过的哪道题」—— 而把题拆成几步，正是为了让每一步都能对上你记得的某个套路</b>；它也点出了 CoT 的限制：<b>如果某一步完全不像任何你学过的东西，拆得再细也过不去；模型也一样 —— 分解只能把问题移到「它熟悉的区域」，移不进去就还是解不出</b>。⚠ <b>讲者把「你学习的时候」直接叫成「训练时」—— 这个人—模型类比在这门课里反复出现（L5 讲偏好调优时他用过「你怎么学会写得像个人」）；它好用，但类比能帮你记住机制，不能当成证据</b>。"});
  QUIZ(0,11,{t:"「让 LLM 多生成 token」为什么等于「给它更多算力」？",o:["因为每一个输出 token 都对应一整次完整的前向传播 —— N 个 token = N 次前向传播，这是一个恒等式而不是启发式","因为更长的输出会激活更多参数","因为生成更久会让模型温度下降","因为长输出会触发更大的 batch"],a:0,w:"⇒ 而一个固定大小的模型想在一次回答里多花算力，唯一的办法就是多生成 token —— 这就是「test-time compute」和「思考预算」的地基。"});

  stack(640,218,["vanilla LLM：一个问题进去，一个答案出来","而我们想要的是：给定问题，「不直接生成答案」","「We first want to think」—— 四个词，这就是全部的结构差别","⇒ 没有新架构、没有新的层、没有新的注意力机制"],780,32,6);
  note("一个「在同一条自回归通道里多写一段」的改动，造就了 2024–2025 最大的一次能力跃升",640,380,"g");},"<b>讲者先确认大家跟上了，然后把两种模型并排摆出来。</b><br>⭐ 「We first want to think」—— <b>四个词，而这就是全部的结构差别</b>：<b>vanilla LLM</b>：问题 ⇒ <b>答案</b>。<b>推理模型</b>：问题 ⇒ <b>思考</b> ⇒ <b>答案</b>。<br>就这一处差别。没有新架构，没有新的层，没有新的注意力机制。<br>而这件事值得你停下来想一想，<b>因为它违反直觉</b>：一个让模型<b>在同一个自回归通道里多写一段话</b>的改动。却造就了 2024–2025 年最大的一次能力跃升。<br>而这说明：瓶颈从来不在模型能表达什么，而在它被允许花多少步去表达。<br>请注意讲者又用了一次「<b>引号，vanilla LLM</b>」：他加引号是因为这不是一个标准术语，是他自己为了对比而起的名字。<br>⚠ 而他每次引入关键对比都会先确认一句「<b>大家清楚了吗</b>」—— <b>这是一个教学信号：下面这句话很重要</b>。");

  note("它使「思考摘要」成为问题 · 使「思考预算」成为旋钮 · 使「只奖励答案」成为可能",640,322,"r");
  note("⚠ 最后一条是 GRPO 能工作的全部原因：只判答案那一段，奖励就能完全程序化",640,360,"v");},"<b>一个式子就能写完这一讲的上半场。</b><br>⭐ 「<b>输出 = 推理 + 答案</b>」这个式子是整个下半场的前提：<b>它使得「思考摘要」成为一个问题</b>（推理那一段要不要给用户看）。<b>它使得「思考预算」成为一个旋钮</b>（推理那一段允许多长）。<b>它使得「只奖励答案」成为可能</b>（答案可以自动判对错，而推理过程不用管）。<br>而最后那一点是 GRPO 能工作的全部原因，<b>所以请现在就记住</b>：既然输出<b>被分成了两段</b>。而我们<b>只需要判「答案」那一段对不对</b>。那就不需要任何人标注「推理过程好不好」—— 奖励可以完全程序化。<br>而这正好绕开了 L5 里「偏好数据贵、奖励模型会被 hack」那一整套麻烦。<br>对比一下 L5 和 L6 在这件事上的处境，<b>差别巨大</b>：<b>L5（偏好调优）</b>：输出是<b>自由文本</b> ⇒ 只能靠人标注偏好 ⇒ 训一个奖励模型 ⇒ 会被 hack。<b>L6（推理）</b>：输出<b>末尾是一个可判定的答案</b> ⇒ 奖励直接算 ⇒ 不会被 hack（至少不容易）。<br>⚠ 这就是为什么 RL 在推理上的成功，比在对齐上的成功来得更干脆。");
  SUM(0,12,{h:"⭐ 输出 = 推理 + 答案",k:"<b>「到现在为止我们有的是『引号，vanilla LLM』—— 有某个问题作为输入，然后用某个东西作为输出来回应；而在我们这个情形里，给定一个问题作为输入，我们『不想直接生成答案』——『我们首先想要思考』」</b> ⇒ <b>「而这里我们『思考』的方式，是『先输出一条推理链』，然后我们才提供答案 ⇒ 所以这里 LLM 的输出『不只是答案』——『它是推理加上答案』」</b>。",m:"⭐ 「We first want to think」四个词<b>就是全部的结构差别</b>：<b>vanilla LLM 是「问题 ⇒ 答案」；推理模型是「问题 ⇒ 思考 ⇒ 答案」—— 就这一处差别，没有新架构、没有新的层、没有新的注意力机制</b> ⇒ 而这件事违反直觉：<b>一个让模型「在同一个自回归通道里多写一段话」的改动，却造就了 2024–2025 年最大的一次能力跃升 ⇒ 这说明瓶颈从来不在模型能表达什么，而在它被允许花多少步去表达</b>。",w:"⭐ 「输出 = 推理 + 答案」这个式子是整个下半场的前提：<b>它使得「思考摘要」成为一个问题（推理那一段要不要给用户看）；使得「思考预算」成为一个旋钮（推理那一段允许多长）；使得「只奖励答案」成为可能（答案可以自动判对错，推理过程不用管）</b> ⇒ <b>而最后那一点是 GRPO 能工作的全部原因：既然输出被分成两段，而我们只需要判「答案」那一段对不对，那就不需要任何人标注「推理过程好不好」—— 奖励可以完全程序化，而这正好绕开了 L5 里「偏好数据贵、奖励模型会被 hack」那一整套麻烦</b>。",r:"⇒ 对比 L5 和 L6 在这件事上的处境，<b>差别巨大</b>：<b>L5（偏好调优）的输出是自由文本 ⇒ 只能靠人标注偏好 ⇒ 训一个奖励模型 ⇒ 会被 hack；L6（推理）的输出末尾是一个可判定的答案 ⇒ 奖励直接算 ⇒ 不会被 hack（至少不容易）⇒ 这就是为什么 RL 在推理上的成功，比在对齐上的成功来得更干脆</b>。⚠ <b>讲者又用了一次「引号，vanilla LLM」—— 他加引号是因为这不是标准术语，是他自己为了对比起的名字；而他每次引入关键对比都先确认一句「大家清楚了吗」，这是一个教学信号：下面这句话很重要</b>。"});
  QUIZ(0,12,{t:"推理模型和 vanilla LLM 唯一的结构差别是什么？",o:["换了一种注意力机制","多了一个专门的推理模块","推理模型是两个模型串起来的","输出从「答案」变成「推理链 + 答案」—— 同一个自回归通道，只是先写一段思考再给答案"],a:3,w:"⇒ 而这个「输出被分成两段」正是 GRPO 的前提：只判答案那一段对不对，奖励就能完全程序化，不需要人标注推理过程。"});

  note("要记的只有一句：整件事基本上是从 2024 年末才开始的 —— 讲课时只有 14 个月",640,366,"g");},"<b>把时间线收尾，而那句总结值得单独记。</b><br>⭐ 「<b>它基本上是从 2024 年末才开始的</b>」—— <b>请把这句话和你的直觉校准一下</b>：这一讲是 <b>2025 年 11 月</b>讲的。所以整个「<b>推理模型</b>」这件事，<b>到讲课时只有 14 个月</b>。<br><b>而它已经改变了几乎所有主流产品的形态</b>。<br>这个速度有一个实际后果，<b>而讲者前面已经点过</b>：「哪一块比别的更重要」现在刚刚能看出来。<b>而一年前看不出来，一年后可能又变了</b>。<br>所以这一讲的价值不在「告诉你最新的模型」，而在「给你那个不会过期的框架」。<br>那个框架其实很短，<b>你现在就可以先收着</b>：① <b>输出 = 推理 + 答案</b>。② <b>答案可验证 ⇒ 奖励可程序化</b>。③ 更多 token = 更多算力 ⇒ 有一个预算可调。<br><b>这三条不会因为换了一个新模型而失效</b>。<br>⚠ 「<b>不是穷举的</b>」这个免责声明讲者说了两次了 —— 他在提醒你不要把这张图当成一份完整的榜单。");
  SUM(0,13,{h:"⭐ 推理模型的时间线",k:"<b>「『推理』本身是一个『被研究了超过一年』的话题 —— 但『推理模型』是从 OpenAI 发布 o1-preview 开始『冒出来』的，而这一个是『2024 年 9 月』」</b> ⇒ <b>「在那之后，『所有人都在想 OpenAI 是怎么做到的』—— 所有这些 AI 实验室都在试着提高模型的推理能力；然后你有 Google 的『Gemini 2.0 Flash Thinking』，我想是『12 月』发布的」</b> ⇒ <b>「然后从 2025 年开始，有那篇『DeepSeek R1』的论文（『1 月』）—— 它造成了很大的声响，因为他们能做到的事，是『用一个他们真的在论文里描述出来的方法』去『匹配上 OpenAI 的推理能力表现』；那是一个大时刻，2025 年 1 月 ⇒ 而在那之后，所有这些其它模型也都被加上了推理能力」</b>（xAI、Anthropic 的 Claude、Mistral 等）⇒ <b>「这条时间线『不是穷举的』，它只是为了给你看『这些模型有多新』—— 而要记在心里的是：它基本上是从『2024 年末』才开始的」</b>。",m:"⭐ 请仔细听 R1 那句话的重心，<b>它被讲者刻意加长了</b>：<b>不是「他们做得一样好」，而是「他们做得一样好」＋「而且他们真的在论文里把方法描述出来了」—— 后半句才是「造成很大声响」的原因</b> ⇒ 为什么「写出来」的分量这么重：<b>在那之前 o1 的做法是一个黑盒 ⇒ 全行业都在猜；R1 之后做法公开了 ⇒ 任何有算力的团队都能复现 ⇒ 所以「在那之后所有其它模型也都加上了推理能力」不是巧合，是因果</b> ⇒ <b>而这一讲后面那一大块（GRPO、可验证奖励、R1 的流水线）讲的就是这篇论文：这门课能讲清推理模型怎么训，是因为 R1 把它写出来了 —— 讲者讲不了 o1，因为没人知道 o1 怎么训的</b>。",w:" 请把两件事分开，<b>混起来会让你误判这个领域的成熟度</b>：<b>「推理」作为研究课题很老（CoT 2022、self-consistency 2022、tree-of-thought 2023）；「推理模型」作为一类产品从 2024 年 9 月才开始 ⇒ 差别不在「有人想到了推理」，而在「有人把它变成了一个可以训出来的能力」</b> ⇒ 而「从 2024 年末才开始」这句话请和直觉校准：<b>这一讲是 2025 年 11 月讲的，所以整件事到讲课时只有 14 个月，而它已经改变了几乎所有主流产品的形态</b>。",r:"⇒ o1 发布时「能力已被证明存在，但做法未知」，<b>这在科研上是一个很特殊的状态：它排除了「做不到」这个可能（你知道一定有路），但不告诉你路在哪（于是所有人同时去搜索）—— 这种「存在性已知、构造未知」的激励极强，所以几个月内就被破解了</b>。⇒ 对「为科研看课」的用途，这条时间线的含义是：<b>这一整块文献只有一年多，所以读得完；但也意味着这里还没有定论，很多做法还会变 ⇒ 所以这一讲的价值不在「告诉你最新的模型」，而在「给你那个不会过期的框架」</b>，而那个框架很短：<b>① 输出 = 推理 + 答案 ② 答案可验证 ⇒ 奖励可程序化 ③ 更多 token = 更多算力 ⇒ 有一个预算可调 —— 这三条不会因为换了一个新模型而失效</b>。⚠ <b>而「一篇把做法讲清楚的论文，影响力可以超过一个效果更好的闭源产品」—— 这个观察对你写论文也有用</b>。"});
  QUIZ(0,13,{t:"DeepSeek-R1 那篇论文为什么「造成了很大的声响」？",o:["因为它第一次提出了 chain of thought","因为它是第一个推理模型","因为它既匹配上了 OpenAI 的推理表现，又「真的在论文里把方法描述出来了」—— 后半句才是关键","因为它的模型最小"],a:2,w:"⇒ 这也是为什么这门课能讲清「推理模型怎么训」：讲者讲不了 o1，因为没人知道 o1 怎么训的。"});

  note("所以选 extended thinking 做的事，是把思考预算调大 —— 代价是更慢、更贵",640,380,"g");},"<b>这里埋了一句伏笔，而顺带给出了「思考预算」的产品形态。</b><br>⭐ 两件事在这一镜里被串起来了，<b>请分别记</b>：① 界面上的「思考」是一个摘要，不是原始链 ⇒ <b>下一个知识点会讲三个理由</b>。② 「standard / extended」这个开关，就是前面预告的「compute budget」。<br>第二点值得多说一句，因为它把一个抽象概念落到了你见过的界面上：你在 ChatGPT 里选 extended thinking。<b>你做的事情就是「把思考预算调大」</b>。<b>而代价是：更慢、更贵</b>。<br>所以这个旋钮不是一个「要不要开更好的模型」的开关，而是一个「花多少算力买多少准确率」的滑块。<br>而「<b>思考的时间 = 产生推理链所需的时间</b>」这个等式也值得记：它说明那个等待时间不是在「搜索」，不是在「查资料」。它就是在一个 token 一个 token 地写。<br>⚠ 所以等待时间长短<b>基本上正比于推理链的 token 数</b> —— <b>而这正是第二个直觉的直接推论</b>。");
  SUM(0,14,{h:"⭐ 怎么认出推理模型",k:"<b>「我想让你们知道，『什么时候你在交互的那个模型是一个推理模型』—— 我前几天在和 ChatGPT 对话，而我在想：『这个用的是推理模型吗？』」</b> ⇒ 答案：<b>「对，正是 —— 所以这里的关键词是『thinking』。实际上，他们『把它放得到处都是』」</b> ⇒ 一句伏笔：<b>「当这些 UI 给你看那个『思考过程』时，他们其实『并不给你看完整的推理过程』—— 而我们会看到为什么；但他们告诉你『他们花了时间在思考』，而『那个思考的时间』其实就是『产生那条推理链所需要的时间』」；「比如对 ChatGPT，你有这个 thinking，你也可以把它从『standard』改成『extended』」</b>。",m:"⭐ 这个用词的一致性在整个行业里出奇地统一：<b>ChatGPT 的「Thinking…」/「Thought for 8 seconds」、Gemini 名字里的「Thinking」、Claude 的「extended thinking」—— 而这不是巧合</b> ⇒ 为什么大家都要<b>显式</b>标出来：<b>推理模型有一段明显的空白等待（几秒到几十秒），而一个没有解释的等待会被用户读成「卡住了」⇒ 所以「Thinking…」这三个字其实是在做产品设计：把一个技术代价翻译成一个用户能接受的叙事</b> ⇒ <b>而它顺带把「我花了更多算力」变成了一个可见的卖点而不是缺点：「它在认真想」比「它比较慢」好听得多，而两句话说的是同一件事</b>。",w:" 「standard / extended」这个开关，<b>就是前面预告的「compute budget」在产品上的样子</b>：<b>你在 ChatGPT 里选 extended thinking，做的事情就是「把思考预算调大」，而代价是更慢、更贵 ⇒ 所以这个旋钮不是「要不要开更好的模型」的开关，而是「花多少算力买多少准确率」的滑块</b> ⇒ 而「思考的时间 = 产生推理链所需的时间」这个等式也值得记：<b>它说明那个等待时间不是在「搜索」、不是在「查资料」，它就是在一个 token 一个 token 地写 ⇒ 所以等待时间长短基本上正比于推理链的 token 数，而这正是第二个直觉的直接推论</b>。",r:"⇒ 「我现在在跟哪种模型说话」有三个实际后果：<b>钱（推理模型按输出 token 收费，而推理 token 也算输出）、时间（它要先生成几百到几千个思考 token 才开始答）、可信度（它在数学/代码上明显更准，在闲聊上没有优势）</b>。⇒ 而讲者用「我前几天在和 ChatGPT 对话」来引入，<b>这又是他的习惯（L5 用「课末的掌声」，L4 用「我自己的 GPU 账单」）—— 他总是先给一个你能验证的、属于日常的例子</b>。⚠ <b>下一个知识点会给出更重要的事实：这个界面给你看的「思考」，并不是模型真正的推理链</b>。"});

KP("15 · ⭐ 思考摘要不是原始推理链（三个被标为「假设」的理由）",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("25:59","thought summary that you see is not the raw reasoning chain",166);
  note("⭐ 一个很多人不知道的事实，以及前两个理由",640,194,"y");
  stack(640,218,["你在界面上看到的那几行「我在考虑…」，不是模型真的生成的那条链","它是另一个（通常更小的）模型对那条链做的摘要","理由一：原始链可能根本不是人能看懂的东西（语法破碎、反复自我纠正）","理由二：你作为用户也不想读好几页好几页"],780,32,6);
  note("⚠ 讲者明确说了「我在做假设」—— 这三个理由是他的推测，不是任何官方声明",640,380,"r");},"<b>一个很多人每天用却不知道的事实，以及前两个理由。</b><br>⭐ 先把这个事实本身记住，<b>因为它经常被误解</b>：你在界面上看到的<b>那几行「我在考虑…」</b>。<b>不是模型真的生成的那条链</b>。它是另一个（通常更小的）模型对那条链做的摘要。<br>所以你无法从界面上读出模型真实的推理过程。<br>而讲者在这里<b>非常明确地加了一句「我在做假设」</b>：这三个理由是他的推测，不是任何官方声明。而他在这门课里每次给推测都会这样标注（L5 讲 reward hacking 时也是）。<br>这个习惯值得学：区分「我知道」和「我猜」，比两者都说得斩钉截铁要有用得多。<br><b>前两个理由各自的性质</b>：<b>理由一（不可理解）</b>：一个<b>关于原始链真实样子</b>的技术观察 —— 它可能语法破碎、反复自我纠正、夹杂无意义的试探。<b>理由二（太长）</b>：一个<b>纯粹的产品</b>理由。<br>⚠ 而第三个理由完全不同 —— 它是一个商业理由，而且讲者说「这将是我们要看到的东西」。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⭐ 第三个理由：推理链本身就是训练数据",640,194,"y");
  stack(640,218,["理由三最重，而讲者说「这将会是我们后面要看到的东西」","有了那些推理链，你就能训一个「模仿」这些能力的模型","前两个理由说「给你看也没好处」，第三个说「给你看对我们有坏处」","⇒ 而只有后者是不会被产品改版推翻的"],780,32,6);
  note("所以原始链不是日志，是最值钱的那份训练数据 —— 这正是后面「蒸馏」那一段的前提",640,380,"r");},"<b>第三个理由的分量最重，而它是后面「蒸馏」那一段的全部前提。</b><br>⭐ <b>这个理由为什么比前两个重得多</b>：前两个理由说的是「<b>给你看也没好处</b>」。第三个理由说的是「<b>给你看对我们有坏处</b>」。<br>而后者才是一个真正的、不会被产品改版推翻的理由。<br><b>这里的机制你已经有能力理解了</b>：一条<b>高质量的推理链</b> = <b>一条完美的 SFT 训练样本</b>（L4 讲过）。收集几万条 ⇒ <b>在一个小模型上做 SFT</b>。<b>小模型就能「模仿」出大模型的推理行为</b>。<br>这件事有名字，叫「蒸馏（distillation）」，而这一讲后面会专门讲 —— DeepSeek-R1 正是这么把能力传给一系列小模型的。<br>所以「<b>不给你看原始链</b>」这个决定，<b>本质上是在保护一份资产</b>：原始链不是日志，它是「最值钱的那份训练数据」。把它公开，等于把你最贵的训练成果免费送给竞争对手。<br>⚠ 而讲者说「<b>这将会是我们要看到的东西</b>」—— 他在明确告诉你：这个理由不是闲话，它后面会变成一个正式的技术话题。");
  SUM(0,15,{h:"⭐ 思考摘要不是原始链",k:"<b>「你看到的那个『引号，thought summary（思考摘要）』『不是』原始的推理链 —— 它是『它的一个摘要』；而他们那么做的原因（『我是说，我在做假设』）：『一』是因为那条原始链可能『不是一个从人的角度完全可理解的东西』；『二』是因为也许『你作为用户，你不想读好几页好几页』；『第三』—— 而『这将会是我们要看到的东西』——『如果你有那些推理链，你也许可以训练一个在这些链上训练的模型，让它基本上也能「模仿」那些能力』⇒ 所以这可能就是『你典型地看不到原始链』的那些原因」</b>。",m:"⭐ 第三个理由为什么比前两个重得多：<b>前两个说的是「给你看也没好处」，第三个说的是「给你看对我们有坏处」—— 而后者才是一个真正的、不会被产品改版推翻的理由</b> ⇒ 这里的机制你已经能理解了：<b>一条高质量的推理链 = 一条完美的 SFT 训练样本（L4 讲过）⇒ 收集几万条，在一个小模型上做 SFT ⇒ 小模型就能「模仿」出大模型的推理行为 ⇒ 这件事有名字，叫「蒸馏（distillation）」，而这一讲后面会专门讲 —— DeepSeek-R1 正是这么把能力传给一系列小模型的</b> ⇒ <b>所以「不给你看原始链」本质上是在保护一份资产：原始链不是日志，它是「最值钱的那份训练数据」，公开它等于把你最贵的训练成果免费送给竞争对手</b>。",w:"⭐ 先把这个事实本身记住，<b>因为它经常被误解</b>：<b>你在界面上看到的那几行「我在考虑…」不是模型真的生成的那条链，它是另一个（通常更小的）模型对那条链做的摘要 ⇒ 所以你无法从界面上读出模型真实的推理过程</b>。⚠ <b>而讲者非常明确地加了一句「我在做假设」—— 这三个理由是他的推测，不是任何官方声明；他在这门课里每次给推测都会这样标注（L5 讲 reward hacking 时也是），而这个习惯值得学：区分「我知道」和「我猜」，比两者都说得斩钉截铁要有用得多</b>。",r:"⇒ 前两个理由各自的性质不同：<b>理由一（不可理解）是一个关于原始链真实样子的技术观察 —— 它可能语法破碎、反复自我纠正、夹杂无意义的试探；理由二（太长）是一个纯粹的产品理由</b>；而第三个是商业理由 ⇒ <b>讲者说「这将会是我们要看到的东西」—— 他在明确告诉你：这个理由不是闲话，它后面会变成一个正式的技术话题（蒸馏）</b>。"});

KP("17 · ⭐ 编程类 benchmark —— 而「可验证」才是关键",function(){

  note("⭐ 第一块讲完了，现在换到「怎么量」",640,194,"y");
  stack(640,218,["第一块（推理是什么）讲完，现在换到第二个问题：怎么「量」","讲者自己把前面那个定义叫「尝试性的」—— 他没假装那是定论","第一类 benchmark：评估编程能力 —— 解一道编程题，或者修一个 bug","⇒ 而 benchmark 的选法不是任意的，它从那个定义直接推出来"],780,32,6);
  note("带着一个问题听这一块：为什么偏偏是「编程」和「数学」？答案不是「因为难」",640,380,"g");},"<b>第一块讲完了，现在换到「怎么量」这个问题。</b><br>⭐ 讲者自己把那个定义叫「<b>尝试性的（tentative）</b>」：<b>他没有假装那是一个定论</b>。而这和他前面说「外面并没有一个被普遍同意的定义」是一致的。<br>而这个顺序值得注意：<b>先定义，再量化</b>：<b>定义（tentative）</b>：推理 = <b>解决一个需要多步的问题</b>。<b>量化</b>：那就找一堆<b>需要多步、而且能判对错</b>的题。<br>所以 benchmark 的选择不是任意的，它是从那个定义直接推出来的。<br>请带着一个问题听接下来这一整块：<b>为什么偏偏是「编程」和「数学」</b>？答案不是「因为它们难」，而是下一镜那句话。<br>⚠ 「<b>修一个 bug</b>」也被列成了目标 —— <b>注意它比「写一段代码」更接近真实工作</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("28:50","this is our way of verifying that a response that was generated is actually a correct one",166);
  note("⭐ 这一句是这一讲后半场的全部地基",640,194,"y");
  stack(640,218,["设定：给一道题，产出一个「能通过所有测试用例」的解","通过了 ⇒ 这就是我们验证「一个生成的回答是否真的正确」的方式","⚠ 这句话表面在讲 benchmark，其实在讲「奖励从哪来」","有测试 ⇒ 能判对错 ⇒ 奖励是个函数而不是模型 ⇒ 不用标注、hack 不了"],780,32,6);
  note("这条链是 GRPO 和 R1 能成立的全部原因 —— 整讲最关键的一句，而讲者说得很平淡",640,380,"r");},"<b>这一句话是这一讲后半场的全部地基，请单独记住它。</b><br>⭐ 表面上这是在讲 benchmark，<b>实际上它在讲「奖励从哪来」</b>：<b>有测试用例</b> ⇒ <b>答案能被程序判对错</b>。<b>能判对错</b> ⇒ <b>奖励可以是一个函数，而不是一个模型</b>。<b>奖励是一个函数</b> ⇒ 不需要标注、不会被 hack、可以无限量地生成训练信号。<br>这条链是 GRPO 和 R1 能成立的全部原因。<br>请把它和 L5 的处境对照一下，<b>差别是结构性的</b>：<b>L5（偏好调优）</b>：「<b>这段话写得好不好</b>」<b>没有程序能判</b> ⇒ 只能请人标 ⇒ 训奖励模型 ⇒ 会被 hack。<b>L6（推理）</b>：「<b>这段代码对不对</b>」<b>跑一下测试就知道</b> ⇒ <b>奖励直接算</b>。<br>所以「为什么偏偏是编程和数学」的答案是：因为它们是极少数「机器能判对错」的任务。<br><b>这也给了一个重要的边界</b>：这一讲的全部方法，都依赖「答案可验证」这个前提。换到「写一封好邮件」上，整套东西就不成立了。<br>⚠ 讲者在这里说得很平淡 —— <b>但这是整讲最关键的一句话，请划下来</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,218,["HumanEval：164 道人手写的小函数题 —— Human 指「题是人原创的」,不是「人来评」","为什么要人原创：从网上抓的题，模型可能预训练时就见过答案（测的是记性）","CodeForces：竞技编程题，需要算法设计","SWE-bench：真实 GitHub issue —— 要在一个你没写过的大仓库里改对地方"],780,32,6);
  note("三个排下来正好是「越来越像真实工作」—— 而 SWE-bench 是今天被引用最多的那个",640,380,"g");},"<b>三个编程 benchmark，而它们的来源不同、意思也不同。</b><br>⭐ 这三个的排列顺序正好是「<b>越来越像真实工作</b>」：<b>HumanEval</b>（164 道）：<b>人手写的小函数题，每题几行</b>。「<b>Human</b>」指的是<b>题目是人写的，不是从网上爬的</b> —— <b>这是为了避免训练集污染</b>。<b>CodeForces</b>：<b>竞技编程题，需要算法设计</b>。<b>SWE-bench</b>：真实 GitHub 仓库里的真实 issue，要在一个大代码库里改对地方。<br>「<b>所以它才叫 HumanEval</b>」这个解释值得记一下：<b>它不是说「由人来评测」</b>。<b>它是说「题目由人原创编写」</b>。<br>而原因很实际：如果题目是从网上抓的，模型可能在预训练时就见过答案 —— 那测的就不是能力，是记性。<br>SWE-bench 的意义和前两个完全不同：<b>前两个测「会不会写算法」</b>。SWE-bench 测「能不能在一个你没写过的大项目里找到该改的地方并改对」。<br>而后者才是工程师真正在做的事，所以它也是今天被引用最多的那个。<br>⚠ 讲者两次说「<b>我相信</b>（I believe）」—— 他在凭记忆说数字，所以具体数值你最好自己核一下。");
  SUM(0,17,{h:"⭐ 编程 benchmark 与「可验证」",k:"<b>「现在我们要谈一些人们用来『量化推理能力』的 benchmark —— 第一个是关于『评估编程能力』，目标典型地是『解一个编程题，或者修一个 bug』」</b> ⇒ <b>「给定一个问题，你想产生『一个能通过测试用例』的解；如果你有一个通过了『所有』测试用例的解，那你就有一个『能工作』的解 ⇒ 而这『就是我们验证一个被生成的回答是否真的正确』的方式」</b> ⇒ 三个 benchmark：<b>「『HumanEval』—— 一组『一百多道人写的』编程题，『所以它才叫 HumanEval』；『CodeForces』—— 来自一个『竞技编程网站』；『SWE-bench』—— 一组『从 GitHub issue 导出来的』题目，『所以这些是真实的、实际的问题』」</b>。",m:"⭐ 表面上这是在讲 benchmark，<b>实际上它在讲「奖励从哪来」</b>：<b>有测试用例 ⇒ 答案能被程序判对错 ⇒ 奖励可以是一个函数而不是一个模型 ⇒ 不需要标注、不会被 hack、可以无限量地生成训练信号 —— 这条链是 GRPO 和 R1 能成立的全部原因</b> ⇒ 和 L5 的处境对照，<b>差别是结构性的</b>：<b>L5「这段话写得好不好」没有程序能判 ⇒ 只能请人标 ⇒ 训奖励模型 ⇒ 会被 hack；L6「这段代码对不对」跑一下测试就知道 ⇒ 奖励直接算 ⇒ 所以「为什么偏偏是编程和数学」的答案是：因为它们是极少数「机器能判对错」的任务</b>。",w:" 这也给了一个重要的边界：<b>这一讲的全部方法都依赖「答案可验证」这个前提 —— 换到「写一封好邮件」上，整套东西就不成立了</b>（讲者在这里说得很平淡，但这是整讲最关键的一句话）。⇒ 而「所以它才叫 HumanEval」这个解释容易误读：<b>它不是「由人来评测」，而是「题目由人原创编写」—— 原因很实际：如果题目是从网上抓的，模型可能在预训练时就见过答案，那测的就不是能力，是记性</b>。",r:" 三个编程 benchmark 的排列顺序正好是「越来越像真实工作」：<b>HumanEval（164 道）是人手写的小函数题，每题几行；CodeForces 是竞技编程题，需要算法设计；SWE-bench 是真实 GitHub 仓库里的真实 issue，要在一个大代码库里改对地方</b> ⇒ <b>前两个测「会不会写算法」，SWE-bench 测「能不能在一个你没写过的大项目里找到该改的地方并改对」—— 而后者才是工程师真正在做的事，所以它也是今天被引用最多的那个</b>。⚠ <b>讲者自己把那个推理定义叫「尝试性的（tentative）」，也两次说「我相信（I believe）」—— 他在凭记忆说数字，具体数值你最好自己核一下</b>。"});
  QUIZ(0,17,{t:"编程 benchmark 这一段真正在讲的是什么？",o:["「奖励从哪来」—— 有测试用例 ⇒ 能判对错 ⇒ 奖励可以是函数而不是模型 ⇒ 不用标注、不会被 hack、训练信号无限","怎么写测试用例","哪个 benchmark 分数最高","GitHub issue 的格式"],a:0,w:"⇒ 而这也划出了边界：这一讲的全部方法都依赖「答案可验证」，换到「写一封好邮件」上整套东西就不成立了。"});

  note("所以「可验证奖励」不是免费的：它需要一个格式约定，而那个约定靠 prompt 强加给模型",640,380,"g");},"<b>数学的验证方式，而「怎么解析」是一个真问题。</b><br>⭐ 这个细节听起来很琐碎，<b>但它是实际做这件事时的第一个坑</b>：模型输出的是<b>一大段自由文本</b>。你要从里面<b>把「那个答案」挑出来</b>。如果挑错了，一个对的回答会被判成错 —— 而这会直接污染你的奖励信号。<br>「<b>放在 box 的括号里</b>」指的是 LaTeX 的 <b>\\boxed{...}</b>：这是数学竞赛题的惯例写法，而所有主流数学 benchmark 都沿用它。于是流程变成：prompt 里要求「把最终答案放进 \\boxed{} 里」⇒ 正则抓出 \\boxed 的内容 ⇒ 和标准答案比。<br>所以「可验证奖励」不是免费的：它需要一个格式约定，而那个约定要靠 prompt 强加给模型。<br>注意讲者用的词是「<b>force（强迫）</b>」，<b>而他马上自己解释了</b>：不是改架构、不是加约束解码，就是「在 prompt 里要求」。而模型会不会听？大部分时候会，但不保证 —— 这也是一处噪声来源。<br>⚠ 「<b>有很多不同的方式做这件事</b>」是一句委婉话 —— 实际含义是：没有统一标准，各家的解析脚本不一样，所以跨报告比分数要小心。");

  note("形式上两者几乎一样 —— 都是「采 k/n 个候选再挑一个」,差别只在「怎么挑」",640,380,"g");},"<b>讲者自己把它接回上一讲，而这个对照非常有用。</b><br>⭐ 先把 L5 的 Best-of-N 完整回忆一遍，<b>因为对照全在细节里</b>：<b>做法</b>：采 n 个回答 ⇒ 用奖励模型给每个打分 ⇒ 返回分最高的。<b>卖点</b>：<b>一个权重都不训</b>。<b>代价</b>：每一次服务都要生成 n 遍 ⇒ 永久变贵。<br>而那个最漂亮的论证是：就算钱无限，「n 条里最慢那条」的延迟也救不回来。<br>而 pass@k 和 Best-of-N 在<b>形式上几乎一样</b>：都是「采 k/n 个候选，然后挑一个」。<b>差别只在「怎么挑」</b>。<br>而下一镜会说清这个差别，它比看起来重要得多。<br>请注意讲者在这门课里<b>反复</b>做这种跨讲的连接：L5 结尾预告 GRPO ⇒ L6 开头回顾 PPO ⇒ 这里回顾 Best-of-N。而每次连接都不是客套，是真的在用上一讲的结论。<br>⚠ 学生说「<b>对，大致记得</b>」—— 而讲者立刻就把它完整复述了一遍，没有让这个「大致」糊过去。");

  note("⚠ 温度为 0 ⇒ 贪心解码 ⇒ k 个答案逐字相同 ⇒ pass@k 退化成 pass@1，指标直接失效",640,368,"v");},"<b>一个被按住的好问题，而它问得非常到位。</b><br>⭐ 这个学生抓到了 pass@k 的一个<b>要害</b>：pass@k 的前提是「<b>生成 k 个答案</b>」。但如果这 k 个答案<b>一模一样</b>呢？那「至少一个对」就等于「那一个对」—— pass@k 退化成 pass@1，整个指标失效。<br>而「<b>有多不一样</b>」正是<b>温度</b>在控制的东西（L1 讲过）：<b>温度 = 0</b>：贪心解码 ⇒ k 个答案完全相同 ⇒ pass@k 毫无意义。<b>温度太高</b>：<b>答案够多样，但每一个的质量都掉下来</b>。<br>所以 pass@k 里一定有一个温度的最优点，而它取决于 k。<br>这个依赖关系有一个很实际的后果：报 pass@k 时不报温度，这个数字是不可比的。而 k 和温度应该一起调：k 大 ⇒ 温度可以高一点（更赌多样性）；k=1 ⇒ 温度应该接近 0。<br>讲者说他「有一张幻灯讲那个」—— 所以这件事确实会被正面回答，记住这张欠条。<br>⚠ 「<b>把你的问题先按住几张幻灯</b>」—— 这个处理方式本身值得学：不打断主线，但也不把问题丢掉。");
  SUM(0,20,{h:"⭐ pass@k 的辩护与 Best-of-N",k:"辩护：<b>「你可能有一些用例，在那里『你负担得起花更多时间去生成更多答案』—— 如果你知道你会『有更多机会答对』⋯⋯而在『编程』这种问题里，好处是『你可以检查你的答案对不对』⇒ 如果你处在那种『负担得起生成多个答案』的情形里，那也许『值得花更多算力去生成更多答案』—— 如果那意味着『其中之一答对的概率会更高』」</b> ⇒ 接回上一讲：<b>「有『一个我们上一讲看过的技术』和这个有点像 —— Best-of-N：你『生成 n 个答案』，用你的『奖励模型』给所有的打分，然后『取它们里面最好的那个』」</b> ⇒ 唯一的差别：<b>「所以这里你可以把它想成是『同一件事』—— 只不过『我们没有奖励模型』，我们有『一个确定性的、可验证的方式』去检查某个东西是不是对的」</b>；而一个被按住的问题：<b>「『你会不会选一个特定的温度？』—— 我『有一张幻灯』讲那个，所以我会『把你的问题先按住几张幻灯』」</b>。",m:"⭐ 把那一字之差的后果列出来，<b>你就知道它为什么是这一讲的主线</b>：<b>奖励模型 ⇒ 要人标偏好数据 ⇒ 要训一个模型 ⇒ 它不完美 ⇒ 会被 reward hacking；确定性验证器 ⇒ 不用标注 ⇒ 不用训 ⇒ 它不会错 ⇒ hack 不了（答案对就是对）⇒ 所以 L5 里那个「搜索越强越会骗过代理」的根本困境，在这里直接消失了</b> ⇒ 「确定性（deterministic）」这个词也请留意：<b>奖励模型给的分是连续的、有噪声的、依赖它自己的参数；验证器给的是一个布尔值，而且同样的输入永远得到同样的结果 —— 而后者正是 RL 训练稳定性的一个巨大优势</b>。",w:"⭐ 但也请公平地记下代价，<b>因为讲者没有在这里说</b>：<b>布尔奖励比连续奖励「信息量少得多」—— 它只说对错，不说「差多少」；而这会让 RL 的信号变得极其稀疏（一整条几千 token 的链，只换回一个 0 或 1）⇒ 这正是 GRPO 要解决的问题之一，请记住这个伏笔</b>。⇒ 而 pass@k 的辩护有一个<b>必要条件</b>：<b>「至少一个对」要变成「我拿到了对的那个」，你必须「能认出哪个是对的」—— 在编程和数学里你能（跑测试、比答案）；换成「写一封好邮件」，生成 100 封里「至少有一封好的」概率当然很高，但你分不出哪一封好 ⇒ 这个高 pass@k 对你毫无用处 ⇒ 所以 pass@k 不是通用指标，它是「可验证任务」专属的</b>。",r:" 那个温度的问题抓到了 pass@k 的一个要害：<b>pass@k 的前提是「生成 k 个答案」，但如果这 k 个答案一模一样呢？那「至少一个对」就等于「那一个对」—— pass@k 退化成 pass@1，整个指标失效</b> ⇒ 而「有多不一样」正是<b>温度</b>在控制的（L1 讲过）：<b>温度 = 0 ⇒ 贪心解码 ⇒ k 个答案完全相同 ⇒ pass@k 毫无意义；温度太高 ⇒ 答案够多样，但每一个的质量都掉下来 ⇒ 所以一定有一个最优点，而它取决于 k</b> ⇒ <b>实际后果：报 pass@k 时不报温度，这个数字是不可比的；而 k 和温度应该一起调（k 大 ⇒ 温度可以高一点；k=1 ⇒ 温度应该接近 0）</b>。⇒ 另外 L5 的 Best-of-N 完整回忆一遍：<b>采 n 个回答 ⇒ 奖励模型打分 ⇒ 返回最高的；卖点是「一个权重都不训」，代价是「每次服务都永久变贵」，而那个最漂亮的论证是「就算钱无限，n 条里最慢那条的延迟也救不回来」</b>。⚠ <b>「把你的问题先按住几张幻灯」这个处理方式值得学：不打断主线，但也不把问题丢掉</b>。"});
  QUIZ(0,20,{t:"pass@k 和上一讲的 Best-of-N 差别在哪？这个差别消掉了什么麻烦？",o:["Best-of-N 要训练权重","Best-of-N 用「奖励模型」挑，pass@k 用「确定性的、可验证的检查」挑 —— 后者不用标注、不用训、也 hack 不了，L5 那个「搜索越强越骗过代理」的困境直接消失","pass@k 只采一个答案","两者完全一样"],a:1,w:"⇒ 但代价是：布尔奖励比连续奖励信息量少得多（几千 token 只换回一个 0 或 1）—— 而这正是 GRPO 要解决的问题之一。"});

  note("所以要一个「没那么大方差」的估计 —— 这是接下来整段推导唯一的动机",640,380,"r");},"<b>最自然的做法是什么，以及它为什么不行。</b><br>⭐ 请把这段推导的动机记清楚，<b>它只有一个词：方差</b>：<b>要估计的量</b>：「<b>k 次里至少一次对</b>」的概率。<b>最朴素的估计</b>：真的跑 k 次，看有没有对过 ⇒ 得到一个 0 或 1。<br>而「一个 0 或 1」作为一个概率的估计，方差大到毫无意义。<br><b>讲者给的那个例子正是在说这件事</b>：<b>同一个模型、同一道题</b>。这一轮 <b>5 次里对 3 次</b>，下一轮 <b>5 次里对 1 次</b>。<br>而你报哪一个？两个都是「真实观测」，但它们差了三倍。<br>所以问题的形状是：<b>样本太少，估计不稳</b>：而解法在统计上很标准：多采样本，然后用一个方差更小的估计量。而「方差更小的估计量」不是「多跑几次取平均」那么简单 —— 下一镜会看到为什么。<br>⚠ 讲者在推导前先确认了两次「<b>大家都超级清楚了</b>」—— <b>他知道接下来要花掉好几分钟</b>。");

  stack(640,218,["关键的一招：不生成 k 个，而是生成 n 个（n 可以很大，比如 100）","这 n 个里 c 个对、n − c 个错","然后问：从这 n 个里「选」k 个，至少一个通过的概率是多少","⇒ n 和 k 被解耦了：n 是真跑了多少次，k 是指标里允许几次"],780,32,6);
  note("方差来自「样本少」—— 现在样本是 n 个不是 k 个，n 越大 c/n 越稳",640,380,"r");},"<b>关键的一招：把「跑了多少次」和「指标里允许几次」分开。</b><br>⭐ 这一招值得单独说清楚，<b>因为它是整段推导的全部聪明之处</b>：<b>n</b>：<b>你实际生成了多少个答案</b>（可以很大，比如 100）。<b>c</b>：<b>这 n 个里对了多少个</b>。<b>k</b>：<b>你想报的那个指标里允许几次尝试</b>（通常是 1、5、10）。<br>于是 n 和 k 解耦了：跑 n=100 次，然后算「如果只给 k=5 次机会会怎样」。<br><b>为什么这么做方差就小了</b>：方差来自「样本少」—— 而现在样本是 n 个，不是 k 个。<b>n 越大，c/n 这个比例就越稳</b>。<br>而「k 次里至少一次对」的概率可以从 c 和 n 算出来，不需要真的只跑 k 次。<br>请把这个问题的形状看清楚，<b>因为它决定了下面用什么数学</b>：手里有 n 个球，c 个白的、n−c 个黑的。随机抓 k 个，问「至少抓到一个白的」的概率。<br>这是一个纯粹的组合问题 —— 而它的名字叫「无放回抽样」，讲者马上会点出来。<br>⚠ 注意 <b>k ≤ n</b> 是一个隐含要求 —— 你不能从 100 个里「选」出 200 个。");
  SUM(0,21,{h:"⭐ 为什么不能直接数",k:"<b>「我们这里想做的，是『估计这个概率』。但你可能会跟我说：『就生成 k 次尝试，然后数一下有几次是对的』—— 但问题是：如果你『只做 k 次』，『你的估计会非常嘈杂』，因为纯粹靠运气，你可能一个实例是『5 次里对 3 次』，另一个是『对 1 次』⇒ 所以你想要一个『没有那么大方差』的估计」</b> ⇒ <b>「所以你做的事典型地是：『不生成 k 个，而是生成 n 个』答案 —— 这 n 个里有『c 个』成功、『n − c 个』不成功；而你问自己的问题是：『如果你有那 n 个观测，如果你要去选比如说 k 个，那「至少有一个通过」的概率是多少』」</b>。",m:"⭐ 这一招是整段推导的全部聪明之处：<b>n 是你实际生成了多少个答案（可以很大，比如 100）；c 是这 n 个里对了多少个；k 是你想报的那个指标里允许几次尝试（通常 1、5、10）⇒ 于是 n 和 k 解耦了：跑 n=100 次，然后算「如果只给 k=5 次机会会怎样」</b> ⇒ 为什么这么做方差就小了：<b>方差来自「样本少」，而现在样本是 n 个不是 k 个 —— n 越大，c/n 这个比例就越稳；而「k 次里至少一次对」的概率可以从 c 和 n 算出来，不需要真的只跑 k 次</b>。",w:" 请把这段推导的动机记清楚，<b>它只有一个词：方差</b>：<b>要估计的量是「k 次里至少一次对」的概率；最朴素的估计是真的跑 k 次看有没有对过 ⇒ 得到一个 0 或 1，而「一个 0 或 1」作为一个概率的估计方差大到毫无意义</b> ⇒ 讲者那个例子正是在说这件事：<b>同一个模型、同一道题，这一轮 5 次里对 3 次，下一轮 5 次里对 1 次 —— 你报哪一个？两个都是「真实观测」，但它们差了三倍</b>。",r:"⇒ 请把这个问题的形状看清楚，<b>因为它决定了下面用什么数学</b>：<b>手里有 n 个球，c 个白的、n−c 个黑的；随机抓 k 个，问「至少抓到一个白的」的概率 ⇒ 这是一个纯粹的组合问题，而它的名字叫「无放回抽样」，讲者马上会点出来</b>。⚠ <b>注意 k ≤ n 是一个隐含要求 —— 你不能从 100 个里「选」出 200 个</b>；而讲者在推导前先确认了两次「大家都超级清楚了」，<b>他知道接下来要花掉好几分钟</b>。"});
  QUIZ(0,21,{t:"为什么 pass@k 要「生成 n 个而不是 k 个」答案？",o:["因为 n 个答案可以并行","因为 k 必须等于 1","为了降方差：只跑 k 次得到的是一个 0 或 1，方差大到没意义；跑 n 次把 n 和 k 解耦，再算「如果只给 k 次机会会怎样」","为了省算力"],a:2,w:"⇒ 于是问题变成一个纯组合问题：n 个球里 c 个白的，随机抓 k 个，问「至少抓到一个白的」的概率。"});

  note("⚠ 这个技巧成立只需要「互为补事件」—— 不需要独立性、不需要同分布",640,362,"v");},"<b>第一步是整段推导里唯一的技巧，而它很标准。</b><br>⭐ 为什么「<b>至少有一个</b>」几乎总要取补，<b>原因是算数量级的</b>：<b>直接算</b>：「<b>正好 1 个对</b>」＋「<b>正好 2 个对</b>」＋ … ＋「<b>正好 k 个对</b>」⇒ <b>k 项相加，每项都是一个组合数</b>。<b>取补算</b>：「<b>全都不对</b>」⇒ <b>只有一种情况，一个式子</b>。<br>而两者的答案一样 —— 所以当然选后者。<br>这个技巧的一般形式你应该背下来，<b>它在概率题里出现的频率极高</b>：P(至少一个 A) = 1 − P(没有一个 A)。而它成立只需要一件事：「至少一个」和「一个都没有」互为补事件。<br>不需要独立性，不需要同分布 —— 这就是它为什么这么好用。<br>请注意讲者在这里停下来问了一句「你们都知道这个技巧吗」：<b>他在确认地基，而不是直接往上盖</b>。这一讲里他做了至少四次这种确认（而上一讲更多）。<br>⚠ 接下来三镜要算的就是那个「<b>全都不对</b>」的概率 —— <b>而它是一个无放回抽样</b>。");
  SUM(0,22,{h:"⭐ 为什么推，以及第一步取补",k:"<b>「所以我们『时间紧』—— 我其实『现在就要把它推一遍』。而我想那么做的原因，是因为『那个答案并不一定是平凡的』，而我『不想让你在不知道它从哪来的情况下，被它长什么样太吓到』」</b> ⇒ <b>「所以我们想推『我们从这 n 个样本里选出的 k 次尝试里，至少有一次是对的』那个概率 —— 我们想要它的『估计』」</b> ⇒ 第一步：<b>「如果你做过一些概率，有『一个非常常见的技巧』：如果你有一个『至少有一个』的概率，它就是『1 减去「它们全都不对」的概率』—— 你们都知道这个技巧吗？『因为我们要用那个技巧』⇒ 所以它会是『1 减去 k 次尝试全都不对』的概率」</b>。",m:"⭐ 为什么「至少有一个」几乎总要取补，<b>原因是算数量级的</b>：<b>直接算是「正好 1 个对」＋「正好 2 个对」＋ … ＋「正好 k 个对」—— k 项相加，每项都是一个组合数；取补算是「全都不对」—— 只有一种情况，一个式子；而两者答案一样，所以当然选后者</b> ⇒ 一般形式请背下来：<b>P(至少一个 A) = 1 − P(没有一个 A) —— 它成立只需要「至少一个」和「一个都没有」互为补事件，不需要独立性、不需要同分布，这就是它为什么这么好用</b>。",w:" 请注意他用的词是「估计（estimate）」而不是「概率」：<b>真正的 pass@k 是一个关于「模型在这道题上的分布」的量，我们永远不知道它 —— 我们能做的只是从 n 个样本里估它 ⇒ 所以这个公式是一个「估计量（estimator）」，不是一个「概率」，而这正是讲者说「不那么显然」的那一点</b> ⇒ 另外请先把三个符号固定住：<b>n = 一共生成了多少个答案；c = 其中正确的有几个（c = correct）；k = 指标里允许试几次 ⚠ 混淆 n 和 k 是读这个公式时最常见的错误，而它们在公式里出现的位置完全不同</b>。",r:" 这个取舍值得记住，<b>因为它是一个很好的教学判断</b>：<b>他时间不够，而他砍掉的不是推导 —— 因为「见过来历」比「记住结果」耐用得多：公式会忘，但「这就是无放回抽样」这个认识不会</b> ⇒ <b>「我不想让你被它长什么样太吓到」也很诚实：pass@k 的公式里有两个组合数，第一次看确实会愣一下；而一旦你知道它是「1 减去全错的概率」，它就变得完全自然 ⇒ 所以这段推导真正的产出不是公式，是「它不可怕」这个感觉</b>。⇒ 这和 L5 里他推 Bradley-Terry 和 DPO 时是同一个做法（<b>从第一性原理推，而不是抄公式</b>）—— 而这个习惯本身比任何单个结论都值钱。"});

  SUM(0,23,{h:"⭐ 无放回抽样",k:"<b>「在你有的这 n 个里，你找到『一个不成功的尝试』的概率是多少？你有 n − c 个不成功的、n 个观测 —— 所以它会是 (n − c) / n」</b> ⇒ <b>「所以现在，『已知这一个』的情况下，你有『另一个不成功的』的概率是多少？你有 n − c − 1 个其它不成功的，分母是 n − 1，『因为你已经取掉了一个』⇒ 而你把那个『继续 k 次』：(n − c − k + 1) / (n − k + 1)」</b> ⇒ <b>「所以这里我们是这样算的：算『第一次不对』，然后『在第一次不对的前提下第二次也不对』，等等 ⇒ 所以如果你在概率课上见过，它『基本上就是无放回抽样』」；「而现在这件事好的地方是：你可以用『一个漂亮的数学记号』把它表达出来 —— n choose k 等于 n! / (k!(n−k)!)」</b>。",m:"⭐ 「因为你已经取掉了一个」这一句话解释了全部的减一：<b>第 1 次抽完，池子里只剩 n − 1 个，而不成功的也只剩 n − c − 1 个（刚才抽走的那个就是不成功的）⇒ 所以第 2 次是 (n−c−1)/(n−1)</b> ⇒ 第 i 次的通项很整齐：<b>(n − c − i + 1) / (n − i + 1) —— i=1 给 (n−c)/n ✓，i=k 给 (n−c−k+1)/(n−k+1) ✓，所以「全都不对」就是这 k 项连乘</b> ⇒ <b>而这里用的是乘法公式（链式法则）而不是独立性：P(A₁∩…∩A_k) = P(A₁)·P(A₂|A₁)·… 这个式子永远成立、不需要任何假设；而每一项的「已知前面都不对」正好让分子分母同时减一 —— 这就是无放回</b>（⚠ 这里的减一不是「独立 × 修正」，它就是条件概率本身）。",w:" 「它基本上就是无放回抽样」<b>是这段推导真正的收获</b>：<b>你不需要记住那个公式，只需要记住「这是从 n 个球里不放回地抓 k 个」—— 而公式随时能从这句话重新推出来</b> ⇒ 这个分布有名字，讲者没点但你该知道：<b>「n 个球里 c 个白的，抓 k 个，问抓到几个白的」= 超几何分布（hypergeometric），而 pass@k 就是「超几何分布取 0 个白球」的概率的补 ⇒ 所以在论文里看到「hypergeometric」，它说的就是这件事</b>。",r:"⇒ 不过第一步悄悄做了一个假设：<b>「随机抽一个」意味着这 n 个答案是等可能被选中的 —— 也就是把「生成 k 个答案」建模成「从那 n 个里均匀随机取 k 个」；而这正是为什么这个估计量成立：它假设那 n 个样本是从同一个分布独立采出来的</b> ⇒ <b>实际含义（而它和那个被按住的温度问题直接相关）：n 个样本必须用「同一个温度、同一个 prompt」采出来；如果你中途改了温度，这个估计量就不成立了</b>。⇒ 而引入组合数纯粹是为了好写：<b>那个 k 项连乘很难看也不好排版，而它恰好能写成两个组合数的比</b>（讲者说「对知道的人来说」然后还是把定义写了出来 —— 一个很体贴的处理）。"});

KP("24 · ⭐ 第三步：把连乘化成两个组合数的比",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  says("41:49","it's factorial n minus c over factorial n minus c minus k",204);

  note("⚠ 这一步是纯代数，没有任何概率内容 —— 做它只为下一步能凑出组合数",640,362,"v");},"<b>先把那个连乘的分子和分母分别写成阶乘比。</b><br>⭐ 这一步只用到一个事实，<b>而它值得你自己验一遍</b>：(n−c)! = (n−c)(n−c−1)⋯(n−c−k+1) × (n−c−k)!。两边同除 <b>(n−c−k)!</b>。<b>剩下的正好是分子那 k 项连乘</b> ✓。<br><b>分母同理</b>：n! = n(n−1)⋯(n−k+1) × (n−k)!。所以分母那 k 项连乘 = n! / (n−k)!。<br>于是整个连乘 = [(n−c)!/(n−c−k)!] ÷ [n!/(n−k)!]。<br>这是一个纯代数操作，<b>没有任何概率内容</b>：讲者做它的唯一理由是：下一步要凑出组合数。而组合数需要分母上有一个 k!，所以他马上要「乘一个 k! 再除一个 k!」。<br>⚠ 讲者这里说的「<b>分子是 (n−k)! </b>」口误了位置 —— (n−k)! 在那个比的分母上，但他写在幻灯上是对的。");

  note("⚠ 讲者这里说「我就当作是同意了」—— 他敢这么做，因为这一步纯代数、没有新概念",640,362,"v");},"<b>那个技巧其实只有一句话：上下同乘一个 k!。</b><br>⭐ 这一镜的口头表达比较绕，<b>但做的事情很简单</b>：他要把 <b>(n−c)!/(n−c−k)!</b> 变成 <b>C(n−c, k)</b>。而 C(n−c, k) = (n−c)! / [k!·(n−c−k)!]。所以缺一个 k! 在分母上 ⇒ 补一个。<br>而为了不改变数值，同一个 k! 要在别处乘回来 —— 那就乘到分母那一项的分子上。<br><b>把两边凑完之后的样子</b>：左边那一块：(n−c)! / [(n−c−k)!·k!] = C(n−c, k) ✓。右边那一块：k!·(n−k)! / n! = 1 / C(n, k) ✓。<br>两块相乘 ⇒ C(n−c, k) / C(n, k)。<br>「<b>我就当作是同意了</b>」这句话值得记一下，<b>它是一个教学上的小决定</b>：<b>他在时间紧的时候选择不等更多确认</b>。而他之所以敢这么做，是因为这一步纯粹是代数，没有新概念。<br>⚠ 「某种程度上提上来（pop the expression up）」说的就是把阶乘凑成组合数这个动作。");

  note("⚠ 边界自检：c=0 给 0 ✓ · c=n 给 1 ✓ · k=1 给 c/n ✓（就是普通准确率）",640,362,"v");},"<b>结果出来了，而它读起来非常自然。</b><br>⭐ 请把这个公式用<b>中文读一遍</b>，它一下就自然了：<b>C(n, k)</b>：从 n 个答案里挑 k 个，<b>一共有多少种挑法</b>。<b>C(n−c, k)</b>：只从那 n−c 个「错的」里挑 k 个，有多少种挑法。两者之比 = <b>「挑中的 k 个全是错的」的概率</b>。<br>1 减它 ⇒ 「至少挑中一个对的」的概率 ⇒ 这就是 pass@k ✓。<br>几个边界情形请自己代一下，<b>它们能帮你确认公式没记错</b>：<b>c = 0</b>（全错）⇒ C(n,k)/C(n,k) = 1 ⇒ pass@k = 0 ✓。<b>c = n</b>（全对）⇒ C(0,k) = 0 ⇒ pass@k = 1 ✓。<b>k = 1</b> ⇒ C(n−c,1)/C(n,1) = (n−c)/n ⇒ pass@1 = c/n ✓（就是普通准确率）。<br>而讲者有一处口误：他先说了「n−c 除以 n」，然后自己改口说「抱歉，n−c choose k 除以 n choose k」：前者是 k=1 的特例，后者是一般情形 —— 他改对了。<br>⚠ 注意 <b>C(n−c, k)</b> 在 <b>n−c &lt; k</b> 时按惯例是 0 —— 也就是「错的答案不够 k 个，不可能全挑中错的」。");
  SUM(0,24,{h:"⭐ 化成两个组合数的比",k:"<b>「我们这里要用那个 —— 这里我们有『一串乘积』，我们可以把它表达成『一个阶乘除以另一个阶乘』：(n − c)! / (n − c − k)!；然后这个量我们也可以用阶乘表达，所以它是 n!，而分子是 (n − k)!」</b> ⇒ <b>「这里的数学大家都同意吗？—— 我就当作是『同意』了。而所以这里我们要『把上面那个表达式某种程度上提上来』⋯⋯所以这里我做了一个技巧」</b> ⇒ <b>「我做的事情，基本上是『把分子和分母同乘以 k!』—— 而所以这里我有 1 减去『n−c choose k，除以 n choose k』。所以这就是我们对 pass@k 的『估计』」</b>。",m:"⭐ 请把结果用<b>中文读一遍</b>，它一下就自然了：<b>C(n, k) 是「从 n 个答案里挑 k 个，一共多少种挑法」；C(n−c, k) 是「只从那 n−c 个错的里挑 k 个，多少种挑法」；两者之比 = 「挑中的 k 个全是错的」的概率 ⇒ 1 减它 = 「至少挑中一个对的」的概率 = pass@k ✓</b> ⇒ 几个边界情形请自己代一下：<b>c = 0（全错）⇒ pass@k = 0 ✓；c = n（全对）⇒ C(0,k) = 0 ⇒ pass@k = 1 ✓；k = 1 ⇒ (n−c)/n ⇒ pass@1 = c/n ✓（就是普通准确率）</b>。",w:" 那个「技巧」其实只有一句话：<b>他要把 (n−c)!/(n−c−k)! 变成 C(n−c, k)，而 C(n−c,k) = (n−c)!/[k!·(n−c−k)!] ⇒ 所以缺一个 k! 在分母上，补一个；而为了不改变数值，同一个 k! 要在别处乘回来（乘到分母那一项的分子上）</b> ⇒ 凑完之后：<b>左边一块是 (n−c)!/[(n−c−k)!·k!] = C(n−c,k) ✓；右边一块是 k!·(n−k)!/n! = 1/C(n,k) ✓ ⇒ 两块相乘 = C(n−c,k)/C(n,k)</b>。而写成阶乘比这一步只用到一个事实：<b>(n−c)! = (n−c)(n−c−1)⋯(n−c−k+1) × (n−c−k)!，两边同除 (n−c−k)! 剩下的正好是那 k 项连乘</b>。",r:"⚠ 讲者在这一段有两处小口误：<b>他说「分子是 (n−k)!」—— 实际上 (n−k)! 在那个比的分母上（幻灯上写的是对的）；以及他先说「n−c 除以 n」然后自己改口说「抱歉，n−c choose k 除以 n choose k」—— 前者是 k=1 的特例，后者是一般情形，他改对了</b>。⇒ 另外 <b>C(n−c, k) 在 n−c &lt; k 时按惯例是 0 —— 也就是「错的答案不够 k 个，不可能全挑中错的」</b>。⇒ 而「我就当作是同意了」是一个教学上的小决定：<b>他在时间紧的时候选择不等更多确认，而他敢这么做是因为这一步纯粹是代数、没有新概念</b>。"});
  QUIZ(0,24,{t:"pass@k 的估计量长什么样？怎么读它？",o:["c / n","1 − (1 − c/n)^k","C(c, k) / C(n, k)","1 − C(n−c, k) / C(n, k) —— 读作「1 减去『从 n 个里挑 k 个，挑中的全是那 n−c 个错的』的概率」"],a:3,w:"⇒ 边界检查：c=0 给 0，c=n 给 1，k=1 给 c/n（就是普通准确率）—— 三个都对得上。"});
});

  note("然后他说「回到你的问题」—— 那张被按住的温度欠条，他真的回来还了",640,380,"g");},"<b>先把 pass@1 的化简亲自确认一遍，然后他回去还那张欠条。</b><br>⭐ 「<b>直觉上也说得通</b>」这个自检方式请学会，<b>它在读任何公式时都适用</b>：找一个<b>你本来就知道答案的特例</b>。<b>代进去</b>。<b>看它是不是退化成那个你知道的东西</b>。<br>对得上 ⇒ 公式大概没抄错；对不上 ⇒ 立刻去找哪里错了。<br>而「<b>回到你的问题</b>」指的是前面那个被按住的<b>温度</b>问题：讲者说过「我有一张幻灯讲那个，我会把你的问题先按住几张幻灯」。<b>而现在他回来还这张欠条了</b>。<br>这个习惯本身值得学：按住一个问题，但一定要还。<br>接下来四镜是这一讲里一段被低估的内容：<b>它表面上只是在回答「温度选多少」</b>。但它实际上说清了「采样多样性」和「单次质量」之间的张力。<br>而这个张力在你那个搜索课题里是同一个东西：探索 vs 利用。<br>⚠ 「<b>你的问题</b>」—— <b>注意他记得是谁问的，这是前面那位学生</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⭐ 讲者直接说「你完全说对了」",640,194,"y");
  stack(640,218,["讲者直接说那个学生「完全说对了」","影响 pass@k 的，是「你生成的那些解有多多样」—— 而那由温度控制","温度是什么（L1）：logits 除以 T 再 softmax；T 小分布变尖，T 大变平","⇒ 所以温度不是调参细节，它是这个指标能不能成立的前提"],780,32,6);
  note("三选一：低温、高温、还是中间？答案是中间 —— 但要记的是「两端各自怎么坏」",640,380,"r");},"<b>讲者直接确认那个学生说对了，然后把问题做成一个三选一。</b><br>⭐ 先把<b>温度是什么</b>快速过一遍（L1 讲过）：模型在每一步给出一个 <b>logits 向量</b>。采样前把它<b>除以温度 T</b>，再做 softmax。T 小 ⇒ 分布变尖 ⇒ 几乎总选最可能的那个 token。T 大 ⇒ 分布变平 ⇒ 不那么可能的 token 也会被选中。<br>为什么 pass@k 对温度<b>格外</b>敏感：pass@k 的全部价值<b>来自「k 个答案不一样」</b>。而「<b>不一样的程度</b>」<b>完全由温度控制</b>。<br>所以温度不是一个「调参细节」，它是这个指标能不能成立的前提。<br>这个三选一的答案是「<b>介于两者之间</b>」，<b>但请不要只记住答案</b>：<b>要记住的是「两端各自是怎么坏的」</b>。太低 ⇒ 没有多样性 ⇒ k 个答案一样 ⇒ 多采白花钱。太高 ⇒ 有多样性但每个都差 ⇒ 没有一个对的。<br>而「两端都坏」正是「中间有最优点」的标准论证形状。<br>⚠ 讲者说「<b>你完全说对了</b>」—— <b>而那个学生确实点到了这个指标的要害</b>。");

  says("46:16","that quantity will not change, which is seen with this graph with the T equal to 0",166);
  note("⭐ 低温那一端：pass@k 完全不随 k 增长",640,194,"y");
