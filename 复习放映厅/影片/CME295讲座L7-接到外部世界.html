<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>

/* caption band — pinned into the lower third, clears the strip, scrolls if long */

#quiz .why[hidden]{display:none}

.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}

.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}

.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

  note("★ 结论：人们通常宁可「不靠额外训练」来注入知识",640,364,"y");},"<b>这一条是整个 RAG 存在的第一个理由，而讲者是用「你可能会问我」的方式自问自答的。</b><br><b>先说清问题</b>：<b>假设你的模型是一个月前训的，现在你想问它两周前的选举结果 —— <u>它答不出来，或者会给你错的答案，因为到现在为止我们的 LLM 没有任何通往外部来源的链接。它只依赖训练时获得的知识</u>。</b><b>⇒ 讲者给了个具体数字：<u>看 OpenAI GPT-5 的模型卡，知识截止日期是 2024 年 9 月 30 日</u> —— 之后发生的任何事，基座模型原样是答不了的。</b><br><b>★★ 然后那个自然的反问</b>：<b>「<u>你可能会跟我说，那为什么不干脆继续在那之后的数据上训你的模型呢？</u>」</b><b>⇒ 他说实际上有好几个问题。</b><br><b>⚠ 问题一</b>：<b><u>要改变一个 LLM 的知识、同时不在别的事情上造成回退，是非常棘手的。所以这通常是人们会尽量避免去做的一件事</u>。</b><br><b>⚠ 问题二</b>：<b><u>而且这很不实用。因为你很可能有一些用例是需要你去微调这个模型的。假设你有用例一，你从这个模型微调出来；然后你又想更新模型的权重去注入一些知识 —— 那你就得为你所有在做的用例都做一遍，这基本上给你加了一大堆开销、一大堆维护</u>。</b><br><b>★ 结论：<u>所以人们通常更倾向于「不做额外训练」来注入知识</u>。</b><br><b>⇒ 请注意问题二的形状：<u>它不是技术难度问题，是组合爆炸</u>。一个基座模型 × N 个下游微调 ⇒ 每次知识更新要做 N 次。</b>");
  SUM(0,2,{h:"⚠ 为什么不靠「继续训」注入知识",k:"<b>问题一</b>：要改一个 LLM 的知识而<b>不在别处造成回退</b>，非常棘手 ⇒ 人们尽量避免。<b>问题二</b>：你可能有若干下游用例各自从这个模型微调过，<b>每次注入知识都得为每个用例重做一遍</b> ⇒ 巨大的维护开销。",m:"⇒ 所以人们通常更倾向于<b>不做额外训练</b>来注入知识。而这正是 RAG 存在的第一个理由。",w:"⚠ 注意问题二的形状：<b>它不是技术难度问题，是组合爆炸</b>（一个基座 × N 个下游微调 ⇒ 每次更新做 N 次）。具体数字：GPT-5 的知识截止是 2024 年 9 月 30 日，之后的事基座模型原样答不了。",r:"同样的两难会出现在你的代理模型上：<b>用新实例重训一次，可能把原来调好的区域弄坏</b>（问题一），而若你为不同实例族各自特化过，每次更新都要重做一遍（问题二）。⇒ 所以优先考虑「<b>在推理时把新信息喂进去</b>」而不是「重训」，这正是 RAG 的思路。"});
  QUIZ(0,2,{t:"为什么不直接「继续训模型」来注入新知识？",o:["① 改知识很容易在别处造成回退；② 若有多个下游微调用例，每次注入都要为每个用例重做一遍 —— 是组合爆炸式的维护开销","会违反模型许可协议","算力不够","新数据的质量不够"],a:0,w:"⇒ 所以人们通常宁可不做额外训练来注入知识，而是在推理时把信息喂进去 —— 这就是 RAG 的出发点。"});

  note("⇒ 而这也预告了：整个 RAG 的难点会集中在「检索」那一步",640,386,"y");},"<b>把这条实验结论抽象一层，它就成了这一讲（乃至这整套做法）的设计原则。</b><br><b>结论的形状</b>：<b><u>喂进去的东西越多，不等于模型知道得越多</u>。</b><b>无关信息不是中性的 —— <u>它会稀释相关信息，让模型被搞糊涂</u>。</b><br><b>⇒ 于是目标变了：<u>不是「塞得多」，而是「塞得准」</u>。</b><br><b>★★ 讲者在引出 RAG 时，特意强调了这个词</b>：<b>「<u>所以基于所有这些理由，我希望我说服了你：我们需要一个更聪明的办法 —— 不是把所有新信息一次性全放进 prompt，而是只以某种方式找到相关的信息，把那部分放进 prompt。而这就是 RAG 背后的想法</u>。」</b><b>⇒ 他还特意说：<u>这里我把「相关」加粗了</u>。</b><br><b>★★★ 而这句话直接决定了这一讲的重心</b>：<b><u>这个技术的核心部分，就是「我们怎么才能只把相关的那部分放进 prompt」</u>。</b><b>⇒ 所以后面你会看到，RAG 三步里<u>第二步和第三步都很简单，几乎全部篇幅都花在第一步（检索）上</u>。</b><br><b>⚠ 顺带提醒一个很容易被忽略的推论：<u>「前半部分尤其难找回」这个发现，意味着信息放在 prompt 里的位置是一个可以优化的变量</u>。</b><b>实践中人们会把最相关的内容放在<u>靠后</u>的位置，正是因为这个。</b>");
  SUM(0,4,{h:"★★ 理由二：大海捞针（needle in a haystack）",k:"思想实验：假设上下文无限、全塞进去。⚠ 结果是 <b>喂进大量不相关信息，LLM 的表现会退化</b>。测试方法：给一个很长的 prompt（haystack），在里面埋一条事实（needle），再问模型这条事实。",m:"<b>两个变量都要紧</b>：prompt 的<b>长度</b>，以及事实放在的<b>位置</b>。结论：超过一定 token 数后模型就难以取回正确信息，而且<b>事实在前半部分时尤其难</b>（热力图是对 GPT-4 做的）。",w:"★ 抽象出来是一条设计原则：<b>喂得多 ≠ 知道得多</b>，无关信息会稀释相关信息。⇒ 目标是「塞得准」不是「塞得多」—— 这正是讲者把 RAG 里的 <b>relevant</b> 加粗的原因，也是为什么全讲篇幅几乎都花在「检索」那一步。",r:"★ 两条直接可用：① <b>给策略的特征/上下文不是越多越好</b> —— 无关特征会稀释信号，这和「加特征总没坏处」的直觉相反；② 「前半部分尤其难找回」说明<b>位置本身是可优化的变量</b>（实践中把最相关的放靠后）。你的输入若有顺序，就该把顺序当成一个设计选择而不是任意的。"});

  note("⇒ 讲者：这正是为什么检索那一步如此重要",640,384,"g");},"<b>RAG 的三步非常简单，而讲者反复强调了名字的由来，因为它就是流程本身。</b><br><b>① Retrieve（取回）</b>：<b><u>你有你的 prompt，而你想取回一段能帮你回答这个 prompt 的相关信息</u>。</b><b>⇒ 你可以把 prompt 看成一个实体，而在另一个空间里（比如知识库）住着你所有的文档 —— <u>要做的就是把相关的文档捞出来</u>。</b><br><b>② Augment（增广）</b>：<b><u>一旦你取回了相关信息，你就增广你的 prompt：把取回的信息放进 prompt，然后再问问题</u>。</b><b>⇒ 讲者用选举那个例子说得特别直白：<u>原来的 prompt 是「这次选举谁赢了」；现在 prompt 变成「这次选举谁赢了？顺便说，这次选举在某某时候举行，赢的是某某」—— 而这就是我们喂给 LLM 的东西</u>。</b><b>★ 他自己点破了这件事的实质：<u>换句话说，我们是在 prompt 里把答案给了它</u>。</b><br><b>③ Generate（生成）</b>：<b><u>把这个 prompt 喂给 LLM，生成回答</u>。</b><br><b>★★★ 然后学生当场问到了要害：<u>可你很可能在检索那一步就做得很差啊？</u></b><b>⇒ 讲者的回答把这一讲的重心定下来了：<u>是的。这正是为什么检索那一步如此重要。而我们接下来要聚焦的，就是怎么确保那一部分做得好</u>。</b><b><u>当我们谈 RAG 时，我们主要聚焦在「把检索部分做得尽可能好」上</u>。</b><br><b>⇒ 所以这一讲的结构就清楚了：<u>② ③ 各一句话，剩下的全部篇幅都给 ①</u>。</b>");
  SUM(0,6,{h:"RAG 的三步",k:"<b>R</b>etrieve 取回相关文档 → <b>A</b>ugment 把它拼进 prompt → <b>G</b>enerate 让 LLM 生成。名字就是这三步的首字母。",m:"★ 第 ② 步的实质，讲者自己点破了：<b>我们是在 prompt 里把答案给了它</b>（「这次选举谁赢了？顺便说，这次选举在某某时候举行，赢的是某某」）。",w:"★★★ 学生当场问到要害：<b>如果检索这一步做砸了呢？</b> 讲者：这正是为什么检索那一步如此重要 —— <b>谈 RAG 时主要就是在聚焦「把检索做得尽可能好」</b>。⇒ 所以 ② ③ 各一句话，全讲篇幅都给 ①。",r:"注意这个结构：<b>整条流水线的质量上限由第一步决定，后面两步只是「把它用掉」</b>。你的搜索同理 —— 若候选生成阶段就漏掉了最优配置，后面无论排序多精确都找不回来。⇒ 所以评估功夫应该优先花在「候选阶段的 recall」上，而不是末端排序。"});
  QUIZ(0,6,{t:"为什么讲者说 RAG 的重心全在「检索」那一步？",o:["因为检索最难实现","因为另外两步还没有成熟方案","因为另外两步计算量大","因为整条流水线的质量上限由它决定 —— 第 ② 步实质上只是「把答案放进 prompt」，第 ③ 步只是生成"],a:3,w:"学生当场问「检索做砸了怎么办」，讲者的回答定下了全讲重心：谈 RAG 主要就是在聚焦把检索做得尽可能好。"});
});
KP("7 · 知识库怎么建：chunk、embedding，和三个超参",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("20:29","whenever you hear retrieval, you should think about embeddings");
  seq(140,210,["收集可能有用的文档","切成 chunk（小块）","每个 chunk 算一个 embedding"],["v","b","g"],330,44);
  note("chunk：文档的一个子集，有一个最大长度，按 token 数量",640,286,"d");
  note("⇒ 这个最大长度通常在「几百 token」这个量级",640,316,"d");
  note("★ 讲者的口诀：一听到「检索」，你就该想到「embedding」",640,354,"y");
  note("⇒ 这一整套合起来就叫知识库（knowledge base）",640,384,"g");},"<b>要做检索，先得把外部文档整理成能被检索的形状 —— 这一整套叫<u>知识库</u>。</b><br><b>建库的三步</b>：<b><u>通常先收集那些有用、或者可能有用的文档；然后把它们划分成我们叫做 chunk（块）的东西</u>。</b><b>⇒ <u>一个 chunk 你可以理解成文档的一个子集，它有一个给定的最大长度，这个长度按 token 数量来度量，通常在几百 token 这个量级</u>。</b><br><b>★ 然后是那句很好记的口诀</b>：<b>「<u>这里的想法是：每当你听到「检索」，你就应该想到「embedding」</u>。」</b><b>⇒ <u>而我们做的就是：为每一个 chunk 计算对应的 embedding</u>。</b><br><b>⚠ 为什么这个口诀值得记住？因为它把「检索」这件事从「找关键词」转成了「<u>在向量空间里找最近的点</u>」。</b><b>⇒ 这个转换带来的好处是：<u>你能找到意思相近但用词完全不同的文档</u>；而它的代价也在后面会专门讲（<u>不保证关键词命中</u>）。</b><br><b>⭐ 课堂上还问了一个很好的问题：<u>这个 embedding 模型是你自己训的吗？</u></b><b>讲者的回答：<u>你有两个选择 —— 你可以用一个预训练的 embedding 模型（人们通常这么做），或者你可以训你自己的</u>。</b><b>而 embedding 模型的目的他也一句话说清了：<u>它试着去表示这些 chunk，使得它达成你的最终目标 —— 也就是把相关文档捞出来</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("21:55","people they choose chunk size of around 500 tokens");
  note("建库时要调的三个超参，每一个都是一笔取舍",640,186,"v");
  stack(640,210,[["① embedding 维度：量级在「几千」（比如 1500 上下）","g"],["⚠ 大 ⇒ 能表达更细腻；但更占空间、推理时更费算力","d"],["② chunk 大小：通常 500 token 上下","g"],["⚠ 太小 ⇒ 文本脱离语境；太大 ⇒ embedding 代表不了里面的内容","d"]],900,34,8);
  note("★ ③ 还有一个：相邻 chunk 之间要留多少「重叠」—— 通常低百量级的 token",640,386,"y");},"<b>三个超参，而讲者对每一个都说清了「两头都不好」的那个取舍。我建议你按「取舍」而不是按「数值」记。</b><br><b>① embedding 的维度。</b><b><u>如果你的文档更细腻、更复杂，你通常会想要更大的维度。但维度更高，可能更占空间，推理时可能有更多计算。所以这是一个取舍 —— 你不一定想要太大的 embedding 维度</u>。</b><b>⇒ 量级：<u>通常在几千这个数量级，比如 1500 左右</u>。</b><br><b>② chunk 的大小。</b><b>这一条的两头讲者说得特别清楚：<u>你不想它们太小，因为那样的话文本可能会脱离语境；你也不想它太大，因为那样 embedding 可能没法有意义地代表里面的内容</u>。</b><b>⇒ 量级：<u>人们通常选 500 token 左右，几百 token 这个数量级</u>。</b><br><b>★★ ② 的两头值得多想一层，因为它正好是 embedding 这个工具的本质限制</b>：<b><u>一个固定长度的向量，要代表的内容越多，它必然越「平均化」</u>。</b><b>⇒ 所以 chunk 不能太大不是工程问题，<u>是信息压缩的必然</u>。</b><br><b>③ 重叠（overlap）。</b><b><u>最天真的切法是让每块彼此独立、互不重叠。但通常上一块里有一部分，是理解当前这块所必需的 —— 所以我们想要有一些重叠。人们通常也会这么做，量级在低百位的 token</u>。</b><b>⇒ 重叠是<u>拿冗余换「不切断语境」</u>，而它的代价是存储和检索量都变大。</b>");
  SUM(0,7,{h:"知识库：chunk、embedding、三个超参",k:"建库三步：收集文档 → 切成 <b>chunk</b>（有最大长度，按 token 计，几百量级）→ 每个 chunk 算一个 <b>embedding</b>。★ 讲者的口诀：<b>一听到「检索」，就该想到「embedding」</b>。",m:"三个超参，每个都是取舍：① <b>embedding 维度</b>（量级几千，如 1500）—— 大则表达更细腻，但更占空间、推理更费；② <b>chunk 大小</b>（约 500 token）—— 太小则文本脱离语境，太大则 embedding 代表不了内容；③ <b>重叠</b>（低百量级 token）—— 上一块往往有理解当前块所必需的部分。",w:"★ ② 的两头是 embedding 的<b>本质限制</b>，不是工程问题：一个<b>固定长度的向量</b>，要代表的内容越多就必然越「平均化」。而 ③ 是拿<b>冗余换「不切断语境」</b>，代价是存储和检索量变大。",r:"把「<b>一听到检索就想到 embedding</b>」这个转换记住：它把「找关键词」变成「在向量空间里找最近的点」—— 好处是能找到用词完全不同但意思相近的东西，代价是<b>不保证关键词命中</b>（后面专门讲）。你做配置相似性匹配时面对的是同一个取舍。"});
  QUIZ(0,7,{t:"chunk 不能太大的根本原因是什么？",o:["一个固定长度的向量，要代表的内容越多就必然越「平均化」—— embedding 会代表不了里面的内容，这是信息压缩的必然","太大会让检索变慢","太大会超出上下文窗口","太大会导致重叠失效"],a:0,w:"而另一头是：太小则文本脱离语境。三个超参（维度 ~1500、chunk ~500 token、重叠低百量级）都该按「取舍」记而不是按数值记。"});
});
KP("8 · ★★ 两阶段检索：先便宜地粗筛，再昂贵地精排",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("24:29","the first stage is typically called candidate retrieval");
  note("⭐ 讲者说这一套是从「推荐系统 / 搜索」那边借来的",640,186,"v");
  boxNode(70,214,520,44,"第一阶段：candidate retrieval 候选召回","g");
  note("从成千上万甚至上百万 chunk ⇒ 砍到一百多个",330,284,"d");
  note("★ 目标是「最大化 recall」—— 做个粗糙操作，尽量别漏",330,314,"g");
  boxNode(690,214,520,44,"第二阶段：ranking 排序（有时可选）","b");
  note("候选少得多 ⇒ 可以用更费算力的方法",950,284,"b");
  note("⇒ 目标是让真正相关的确实排在最前面",950,314,"y");
  note("★ 两阶段的分工逻辑：便宜的管「别漏」，昂贵的管「排得准」",640,364,"y");},"<b>这是整个检索部分的骨架，而讲者先点明了它的出处 —— 这个出处本身就很有信息量。</b><br><b>出处</b>：<b>他先问「<u>你们有谁有推荐系统或者搜索的背景吗？</u>」然后说：<u>我们这里看到的方法和那个领域非常像。LLM 社区的人借用了那边的想法、直接把那些技术拿过来用了。这通常也是推荐问题里会有的设定</u>。</b><br><b>第一阶段：candidate retrieval（候选召回）。</b><b><u>目标是从一大堆、非常非常多的 chunk 出发，把它过滤到一个小得多的「可能相关的候选」集合</u>。</b><b>★ 而它的指标讲者说得很明确：<u>在这个阶段，我们想做的是尽量最大化 recall（召回率）—— 只做一个粗糙的操作，好让我们拿到尽可能多的「可能相关」的候选</u>。</b><br><b>第二阶段：ranking（排序）。</b><b><u>这一阶段有时是可选的。但它是为了真正确保排在最前面的那些文档确实是相关的</u>。</b><b>⇒ <u>基于那份「可能相关」的清单，把它们真正排好，让相关的排在最前</u>。</b><b>★ 而为什么这一阶段能用更贵的方法，他也说了：<u>这个阶段我们会用一个计算量更大一些的模型/方法，因为相比第一阶段，我们要排的候选集合小得多</u>。</b><br><b>★★★ 请把这个分工逻辑单独记住，它远不止用在 RAG 上</b>：<b><u>第一阶段面对的量级大 ⇒ 只能用便宜的方法 ⇒ 所以它的指标必须是 recall（漏了就永远找不回来）。第二阶段面对的量级小 ⇒ 可以用贵的方法 ⇒ 所以它负责精度</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("把这个结构的「为什么」想透：它是一条通用的设计模式",640,186,"v");
  stack(640,210,[["量级大的那一级，只能用便宜的判据","y"],["⇒ 所以它的指标必须是 recall：漏掉的，后面永远救不回来","r"],["量级小的那一级，才负担得起昂贵而精确的判据","g"],["⇒ 整条流水线的「上限」由第一级定，「精度」由第二级定","v"]],900,34,8);
  note("★ 一个推论：第一级的参数该调松不该调紧 —— 宁可多留，不可漏",640,386,"y");},"<b>把两阶段的「为什么」想透，它就成了一条可以到处用的设计模式，而不只是 RAG 的一个实现细节。</b><br><b>第一级的约束</b>：<b>它面对的是<u>成千上万甚至上百万</u>个候选，所以<u>每个候选上能花的算力极少</u>。⇒ 这就限死了它只能用便宜的判据（这里是向量的余弦相似度，而且还要用近似最近邻来加速）。</b><br><b>★★ 而由此推出它的指标必须是 recall</b>：<b><u>第一级漏掉的东西，第二级根本看不到 —— 它永远没有机会被救回来</u>。</b><b>⇒ 所以第一级犯「多留了无关的」这种错是<u>可以被下一级修正</u>的，而犯「漏掉了相关的」这种错是<u>不可逆</u>的。两类错误的代价完全不对称。</b><br><b>★ 一个很实际的推论</b>：<b><u>第一级的参数该往「松」的方向调</u>。</b><b>多留 50 个无关候选，第二级花点算力就排下去了；而少留了那一个对的，整个系统就答错了。</b><br><b>第二级的本钱</b>：<b>候选只剩一百多个 ⇒ <u>每个上面可以花百倍的算力</u>。所以它能用把 query 和 chunk 一起喂进模型的 cross-encoder（后面会讲），拿到第一级拿不到的那种「交互信息」。</b><br><b>⇒ <u>整条流水线的上限由第一级定（它决定对的东西在不在集合里），精度由第二级定（它决定对的东西排不排得上去）</u>。</b><b>⚠ 所以调优时先看第一级的 recall：<u>如果 recall 已经不高，再怎么优化第二级都是白费</u>。</b>");
  SUM(0,8,{h:"★★ 两阶段检索",k:"⭐ 这套结构借自<b>推荐系统/搜索</b>。<b>第一阶段 candidate retrieval</b>：从成千上万甚至上百万 chunk 砍到一百多个，目标是<b>最大化 recall</b>（粗糙操作，尽量别漏）。<b>第二阶段 ranking</b>（有时可选）：候选少得多，所以可以用<b>更费算力</b>的方法，负责让真正相关的排在最前。",m:"★★★ 分工的逻辑：<b>量级大 ⇒ 只能用便宜判据 ⇒ 指标必须是 recall</b>（漏了永远救不回来）；<b>量级小 ⇒ 负担得起昂贵判据 ⇒ 负责精度</b>。",w:"★ 两类错误代价<b>完全不对称</b>：第一级「多留了无关的」可被下一级修正，「漏掉了相关的」不可逆。⇒ 推论：<b>第一级的参数该往松调</b>。而调优时先看第一级的 recall —— recall 不高的话，再怎么优化第二级都白费。",r:"★★★ 这就是你课题的骨架：<b>dominance 剪枝 / 便宜代理 = 第一级（必须保证不剪掉最优解）；精确求解器复核 top-k = 第二级</b>。⇒ 所以你的剪枝判据必须是<b>可采纳的（admissible）</b> —— 这正是「第一级犯漏的错不可逆」的形式化版本。而实验里该单独报第一级的 recall，它定了整个方法的上限。"});
  QUIZ(0,8,{t:"为什么第一阶段（候选召回）的指标必须是 recall？",o:["因为候选数量太多，precision 没有意义","因为 recall 比 precision 容易计算","因为它漏掉的东西第二阶段根本看不到、永远救不回来 —— 两类错误的代价完全不对称","因为第二阶段不看 recall"],a:2,w:"⇒ 推论：第一级的参数该往松调（多留无关的可被修正，漏掉对的不可逆）。而调优时先看第一级 recall —— 它不高的话优化第二级是白费。"});
});
KP("9 · 候选召回：余弦相似度、近似最近邻、bi-encoder",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$\\mathrm{sim}(q,c)\\;=\\;\\frac{q\\cdot c}{\\lVert q\\rVert\\;\\lVert c\\rVert}$$");
  says("30:53","you may hear the term BI encoder");
  note("query 过一个编码器、chunk 过一个编码器 —— 两边「各编各的」",640,198,"d");
  note("⭐ 这个结构叫 bi-encoder（双编码器），通常是 encoder-only（如 BERT）",640,228,"g");
  note("⇒ 正因为各编各的，chunk 的 embedding 可以「离线先算好」",640,258,"y");},"<b>第一阶段具体怎么做：靠 embedding 之间的相似度，而这里有一个结构性的名字要记住。</b><br><b>做法</b>：<b>讲者先问「<u>你们还记得我们怎么比较 embedding 吗？</u>」答案是 <u>cosine similarity（余弦相似度）</u>。</b><b>⇒ <u>想法是：把我们的 query 用一个 embedding 表示出来 —— 而所有 chunk 的 embedding 我们已经有了 —— 然后做这个相似度搜索，把排在最前面的那些过滤出来，比如留前 100 个</u>。</b><br><b>★★ 结构的名字</b>：<b><u>你可能会听到 bi-encoder（双编码器）这个说法。它指的是：我们把 query 过一个编码器，把 chunk 过一个编码器 —— 两者是独立的 —— 然后比较这两个 embedding</u>。</b><b>⇒ 用的通常是 <u>encoder-only</u> 的模型，<u>比如 BERT 那一类</u>（第 2、3 讲讲过）。</b><br><b>★★★ 「各编各的」这件事是第一阶段能便宜的全部原因，值得想清楚</b>：<b><u>因为 chunk 的 embedding 不依赖 query，所以它可以在建库时就全部算好、存起来</u>。</b><b>⇒ 查询时只需要：<u>算一次 query 的 embedding，然后做向量比较</u>。<u>知识库有一百万个 chunk，也不需要跑一百万次模型</u>。</b><br><b>⚠ 而它的代价也正好藏在这里：<u>query 和 chunk 从来没有「见过面」</u>，模型没有机会捕捉两者之间的交互。<u>这正是第二阶段 cross-encoder 要补的那一块</u>。</b><br><b>⭐ 讲者还提了另一个问题：<u>默认的相似度就是余弦；你也会看到别的距离，比如 L2 —— 但如果所有向量的模长都是 1，就能做很多化简。所以你会看到一些变体，但我会说它们多多少少都是余弦相似度</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("建库时就把 embedding 做某种「分区」",950,288,"g");

  note("★ 讲者没有展开 ANN 的细节，但特意把这个术语点了出来",640,368,"y");},"<b>这一条是讲者特意「点一下但不展开」的，而他点它的理由值得留意。</b><br><b>他的说法</b>：<b>「<u>我想指出这个阶段里有一点复杂性，因为你的知识库可能非常大。所以人们通常会用我们叫做「近似最近邻」的方法。你可能听说过一些做这件事的库。这里通常就是它们相关的地方。我们不会展开细节，但我想把这一点点出来</u>。」</b><br><b>它在做什么</b>：<b><u>想法是：当你建知识库的时候，你以某种方式把 embedding 做分区，好让你避免去做那种天真的线性搜索</u>。</b><b>⇒ <u>你会看到一些像 ANN（approximate nearest neighbor，近似最近邻）这样的技术，它们通常就发生在这里</u>。</b><br><b>★★ 名字里的 approximate（近似）这个词很关键，值得多想一层</b>：<b><u>它意味着你放弃了「保证找到真正最近的那些」</u>。</b><b>⇒ 而这和上一条「第一阶段要最大化 recall」看起来是矛盾的 —— <u>ANN 本身就会漏</u>。</b><b>⚠ 所以实践中的做法是：<u>用更松的参数（召回更多候选）去补偿 ANN 带来的那部分漏</u>。这是一个「为了算得动而主动接受一点漏，再用数量补回来」的权衡。</b><br><b>⭐ 而讲者选择「点出名字但不展开」这个处理也值得学</b>：<b><u>一个术语只要你知道它存在、知道它解决什么问题、知道去哪找，就足以不被它卡住</u>。</b><b>⇒ 把有限的讲解预算花在「会影响你判断的东西」上，而不是平均分配。</b>");
  SUM(0,9,{h:"候选召回：余弦、ANN、bi-encoder",k:"用 <b>cosine similarity</b> 比较 query 与 chunk 的 embedding，留前若干（比如 100）个。结构叫 <b>bi-encoder</b>：query 过一个编码器、chunk 过一个编码器，<b>两者独立</b>，通常是 encoder-only（BERT 那一类）。",m:"★★★ 「各编各的」是第一阶段能便宜的全部原因：<b>chunk 的 embedding 不依赖 query ⇒ 建库时就能全部算好存起来</b>，查询时只需算一次 query 的 embedding。⚠ 代价是 query 和 chunk 从没「见过面」，捕捉不到交互 —— 这正是第二阶段要补的。",w:"⚠ 知识库很大时要用 <b>ANN（近似最近邻）</b>：建库时把 embedding 分区，避开线性搜索。注意 <b>approximate 意味着你放弃了「保证找到真正最近的」</b> —— 它本身会漏，实践中用更松的参数（召回更多）去补偿。",r:"⭐ 讲者「点出名字但不展开」的处理值得学：<b>一个术语只要知道它存在、解决什么问题、去哪找，就足以不被卡住</b>；把有限的讲解预算花在会影响判断的东西上。另外 bi-encoder 的那个结构性好处（<b>一侧可离线预计算</b>）在你做大规模候选比较时同样是关键。"});
  QUIZ(0,9,{t:"bi-encoder 结构让第一阶段便宜的关键在哪？",o:["它用的模型更小","它不需要 GPU","query 和 chunk 各编各的 ⇒ chunk 的 embedding 不依赖 query，可以建库时全部算好存起来","它只比较前 100 个 token"],a:2,w:"⚠ 代价正好藏在这里：query 和 chunk 从没见过面，捕捉不到交互 —— 这就是第二阶段 cross-encoder 要补的那一块。"});
});
KP("10 · embedding 怎么来：Sentence-BERT 与它的损失",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("31:44","there is a paper that I highly recommend reading");
  note("学生问：这些 embedding 到底怎么算出来的？",640,188,"v");
  boxNode(230,214,780,44,"答案：Sentence-BERT（S-BERT）—— 讲者强烈推荐读的那篇","g");
  note("它是 BERT 的一个扩展（名字就说了）",640,292,"d");
  note("⇒ 它让你能为「一整条序列」（你的 query、你的文档）算一个 embedding",640,322,"d");
  note("★ 而且这个 embedding 是「为相似度搜索量身定做」的",640,360,"y");},"<b>这一条回答的是「embedding 从哪来」，而讲者给了一篇他反复推荐的论文。</b><br><b>他的说法</b>：<b>「<u>有一篇论文我强烈推荐读，叫 Sentence BERT。那篇论文解释了 —— 首先，如名字所示，它是 BERT 的一个扩展。而这个扩展让你能为一条序列（为你的 query、为你的文档）计算一个 embedding，而这个 embedding 是专门为「用于相似度搜索」而定制的</u>。」</b><br><b>★★ 注意「<u>量身定做</u>」这四个字，它不是客套 —— 它指的是损失函数的设计。</b><br><b>损失在做什么</b>：<b>讲者一句话就说清了：<u>这里的想法是有一个损失函数，它去激励「相关的实体之间有高余弦相似度、不相关的实体之间有低余弦相似度」</u>。</b><br><b>⇒ 请看这个设计的形状：<u>它不是「学一个好的文本表示，然后顺便拿来算余弦」，而是「直接把『余弦相似度要满足什么』写进损失」</u>。</b><b>★★★ 这正是 L5 里那条判断的又一次出现：<u>当训练形态和使用形态不一致时，去设计损失</u>。</b><b>这里使用形态是「比余弦」，所以损失里就直接出现余弦。</b><br><b>⚠ 为什么必须这样？因为<u>一个普通 BERT 的 CLS 向量并不保证「余弦大 = 语义相关」</u> —— 它是为掩码语言模型那个目标训出来的，余弦只是个副产品。<u>拿它直接做检索效果并不好</u>，这正是 S-BERT 那篇论文的出发点。</b><br><b>⭐ 讲者还说了一句很实在的鼓励：<u>如果你懂 BERT —— 而我知道你们现在懂 —— 那篇相当好读。强烈推荐</u>。</b>");
  SUM(0,10,{h:"Sentence-BERT：为相似度搜索定做的 embedding",k:"讲者强烈推荐的那篇是 <b>Sentence-BERT（S-BERT）</b>：BERT 的一个扩展，让你能为<b>一整条序列</b>（query、文档）算一个 embedding，而且这个 embedding 是<b>为相似度搜索量身定做</b>的。",m:"★ 「量身定做」指的是损失设计：<b>有一个损失函数，去激励「相关的实体余弦相似度高、不相关的余弦相似度低」</b>。⇒ 不是「学一个好表示再顺便算余弦」，而是<b>把「余弦要满足什么」直接写进损失</b>。",w:"⚠ 为什么非这样不可：<b>普通 BERT 的向量并不保证「余弦大 = 语义相关」</b> —— 它是为掩码语言模型那个目标训的，余弦只是副产品，直接拿来检索效果不好。这正是 S-BERT 的出发点。",r:"★★★ 这是 L5「<b>训练形态与使用形态不一致时，去设计损失</b>」的又一次出现：使用形态是「比余弦」，损失里就直接出现余弦。⇒ 你若要用学出来的表示去做配置间的相似性判断，别指望随便一个表示的距离就有意义，<b>要把「距离该满足什么」写进训练目标</b>。"});
  QUIZ(0,10,{t:"Sentence-BERT 相对普通 BERT 的关键差别是什么？",o:["参数量更大","它的损失直接激励「相关的余弦相似度高、不相关的低」—— 普通 BERT 的向量并不保证「余弦大 = 语义相关」","它不需要预训练","它是 decoder-only 的"],a:1,w:"★ 这是「训练形态与使用形态不一致时去设计损失」的又一次出现：使用形态是比余弦，损失里就直接出现余弦。"});
});
KP("11 · ★ 语义相似不保证关键词命中：BM25 与混合检索",function(){

  note("★ 所以如今人们常用「两者混合」—— embedding 搜 + 启发式搜",640,364,"y");},"<b>这一条揭示了 embedding 检索的一个结构性盲点，而讲者的例子特别好记。</b><br><b>先把「语义相似」的含义说清</b>：<b>讲者自己问「<u>语义相似到底是什么意思？</u>」答案是：<u>找到意思相同或者相关的文档/实体。但是在我们计算这些 embedding 的方式里，我们并没有强制任何形式的关键词匹配</u>。</b><b>⇒ <u>所以用这种方式取回文档时，完全可能出现：匹配上的文档和查询一个词都不相同，但它们意思一样</u>。</b><br><b>⚠ 什么时候这会出问题</b>：<b><u>有时候你想确保你找的东西，确确实实包含你 prompt 里的那些关键词</u>。</b><b>⇒ 这时你就需要第二种做法。</b><br><b>★★ 那个例子</b>：<b><u>假设有两只泰迪熊，一只叫 Cuddly，另一只叫 Huggy。你想弄清楚 Cuddly 在哪 —— 这是你的查询</u>。</b><b><u>如果你用 BM25，那么你得到的答案按定义会包含一些和查询里的词重叠的词，所以你会拿到那些讲 Cuddly 在哪的文档。但如果你只用语义相似度搜索，你就没有这个保证 —— 你只会拿到语义相似的文档，而它们不保证含有你 prompt 里的关键词</u>。</b><b>⇒ 而讲者点破了这个例子的刀口：<u>Huggy 和 Cuddly 在语义上可以被认为是相似的</u>。</b><b>所以你很可能捞回一堆讲 Huggy 的东西。</b><br><b>★ BM25 是什么</b>：<b><u>一个相关性分数，而且它实际上是一个启发式的分数，基于「你的查询里有什么」和「你的文档里有什么」之间的重叠的某个函数</u>。</b><br><b>⇒ 结论：<u>所以如今人们会看自己的用例，想一想在相关性分数里加入某种启发式对自己有没有用。有些人就用这种混合 —— embedding 搜索和启发式搜索的组合</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("那实践中怎么选？讲者给的是一个「按用例决定」的规则",640,186,"v");
  stack(640,210,[["先看你自己的用例是什么样的","v"],["再想：在相关性分数里掺一点启发式，对我有没有用","y"],["⇒ 有些人就用混合：embedding 搜索 + BM25","g"],["★ 视用例而定，你可能因此拿到更贴切的文档","g"]],960,34,8);
  note("⇒ 注意这不是「哪个更好」的答案，而是「你该去问自己哪个问题」",640,386,"y");},"<b>两种检索怎么选，讲者没有给一个「X 比 Y 好」的答案，而是给了一个<u>要你去问自己的问题</u>。我觉得这个形式比答案本身更值钱。</b><br><b>他的话</b>：<b>「<u>而这就是为什么如今人们的做法是：看看自己手上的用例，想一想「在相关性分数里也放一点启发式」对他们的用例有没有用。所以有些人就走 embedding 检索和启发式检索的混合路线 —— 某种 embedding 和 BM25 的组合，这样视用例而定，你可能会拿到更贴切的文档</u>。」</b><br><b>★★ 那什么时候该掺启发式？把上一镜那个例子反过来想就有答案了</b>：<b><u>当你的查询里有「必须原样命中」的东西时</u>。</b><b>⇒ 专有名词（Cuddly 这种名字）、产品型号、错误码、人名、编号 —— <u>这些东西语义上和它们的同类非常像，而这恰恰是语义检索最容易出错的地方</u>。</b><br><b>⇒ 反过来，当用户的问法和文档的写法差别很大（问「怎么退货」而文档里写「退换货流程」），<u>语义检索才是能救你的那一个</u>。</b><br><b>★★★ 所以混合不是和稀泥，<u>它是因为两种检索的失败模式正好互补</u>：语义检索会漏掉「词对了但说法不像」的，关键词检索会漏掉「意思对了但一个词不沾」的。</b><b>⇒ 两个会在不同地方失败的方法放在一起，才真的能互补；两个在同一处失败的方法叠加，只是更贵而已。</b><br><b>⇒ 而这一条的通用形式，在后面工具那一半还会再出现一次：<u>学出来的判据和手写的规则不是竞争关系</u>。</b>");
  SUM(0,11,{h:"★ 语义相似 vs 关键词命中",k:"语义相似 = 找意思相同或相关的东西，但 <b>并没有强制任何关键词匹配</b> ⇒ 完全可能匹配上「一个词都不相同但意思一样」的文档。⚠ 而有时你就是要确保结果<b>确实含有你 prompt 里的关键词</b>。",m:"讲者的例子：两只泰迪熊 <b>Cuddly</b> 和 <b>Huggy</b> —— 它们语义上相似，所以查「Cuddly 在哪」可能捞回一堆讲 Huggy 的。<b>BM25</b> 是一个<b>启发式</b>相关性分数，基于查询与文档的<b>词重叠</b>，按定义保证结果含查询里的词。",w:"⇒ 所以如今人们常用<b>混合检索</b>：embedding 搜索 + 启发式（BM25）搜索的组合，视用例而定。",r:"★ 这一条的形状很可迁移：<b>学出来的判据擅长「意思对」，手写的启发式擅长「硬约束一定满足」</b>。你的搜索里也一样 —— 学出来的代价代理可能给一个「看起来很像可行解」的配置高分，而手写的约束检查才保证它真的满足约束。<b>两者不是竞争关系，该混着用</b>。"});
  QUIZ(0,11,{t:"Cuddly / Huggy 这个例子说明了什么？",o:["语义相似不保证关键词命中 —— 两只熊语义上相似，所以查 Cuddly 可能捞回一堆讲 Huggy 的；BM25 按定义保证结果含查询里的词","embedding 维度不够大","chunk 切得太小","需要更好的 ANN 算法"],a:0,w:"⇒ 所以人们常用混合检索。这一条的形状很通用：学出来的判据擅长「意思对」，手写启发式擅长「硬约束一定满足」，两者该混着用。"});
});

  note("★ HyDE 的办法：先让 LLM 根据 prompt 生成一个「假文档」，再去 embed 它",640,364,"g");},"<b>这一条处理的是一个很容易被忽略、但想明白了会觉得理所当然的不对等。</b><br><b>问题</b>：<b>讲者的描述是：<u>人们想问 LLM 某件事时，他们输入的那个 query，和知识库里的东西在性质上是不一样的。你的 query 通常是短的，也许是个问句；而你文档里的东西通常要长得多，是一句又一句的陈述</u>。</b><b>⇒ <u>所以如果你真去想一想：如果你用同一个编码器去 embed 你的 query 和你的文档，那这两个 embedding 其实不是很可比 —— 因为一个是针对问题的，另一个是针对文档的</u>。</b><br><b>★★ HyDE 的办法很巧</b>：<b><u>它不去计算与 prompt 相关的那个 embedding，而是先基于那个 prompt 生成一个「假文档」—— 这只是一次 LLM 调用 —— 然后去 embed 那个假文档，用它来找相关的 chunk</u>。</b><br><b>⇒ 想一下为什么这能成立：<u>假文档的内容可能是错的（模型不知道答案），但它的「形状」是对的</u> —— 它是一段陈述性的、长度相当的文本。<u>而 embedding 对这种形状的匹配是敏感的</u>。</b><br><b>⚠ 讲者的分寸把握得很好，我照搬</b>：<b>「<u>它可能管用也可能不管用。不是所有人、所有时候都在用。所以我会说，这就是一个值得一试、看看对你是否管用的东西</u>。」</b><br><b>⇒ 他还给了另一条路：<u>另一个办法可以是干脆有两个专门训练的编码器，一个编 query、一个编文档 —— 也就是不用同一个编码器。人们通常不这么做，纯粹是出于维护方面的考虑，但这也可以是一个解法</u>。</b>");
  SUM(0,12,{h:"HyDE：query 与文档的不对等",k:"问题：<b>query 通常很短、往往是问句；文档通常长得多、是陈述</b>。用同一个编码器去编两者，<b>embedding 其实不太可比</b>。",m:"<b>HyDE</b> 的办法：不直接 embed prompt，而是<b>先让 LLM 根据 prompt 生成一个「假文档」</b>（一次 LLM 调用），再 embed 那个假文档去找相关 chunk。⇒ 假文档的内容可能是错的，但它的<b>形状</b>是对的。",w:"⚠ 讲者的分寸：<b>它可能管用也可能不管用，不是所有人都在用</b> —— 值得一试，看看对你是否管用。另一条路是训<b>两个专门的编码器</b>（一个编 query、一个编文档），人们通常不这么做纯粹是出于<b>维护</b>考虑。",r:"值得记的提问方式：<b>你在比较的两个东西，真的是同一类东西吗？</b> 你的搜索里若要把「部分配置」和「完整配置」放进同一个评分函数，就是同一个不对等 —— 要么像 HyDE 那样先把一方补成另一方的形状，要么像双编码器那样给两类各一套评分。"});

  note("⚠ 可是 chunk 很多 ⇒ 这会是大量 LLM 调用 ⇒ 很贵",640,364,"r");},"<b>这一条回应的是学生早先那个问题：<u>你们是不是就天真地按 token 数切，完全不管切出来是什么？</u></b><br><b>讲者当时说那是个很好的问题，并预告「<u>我们会看到一个缓解这个问题的方法</u>」—— 就是这一条。</b><br><b>问题</b>：<b><u>如果这些 chunk 被从语境里拿出来，它们可能就说不通了</u>。</b><b>⇒ 想一下很具体的情形：一块文本里全是「他说」「这个方案」「因此」，<u>而主语和前提都在上一块里</u>。这样的 chunk 哪怕被检索到，塞进 prompt 也帮不上忙。</b><br><b>★ 办法</b>：<b><u>想法是在前面补上一段文字，它把「你需要知道什么才能理解这个 chunk」概括一下</u>。</b><b>具体做法：<u>你有一份文档，把它切成 n 个 chunk。然后不是把这些 chunk 各自孤立地看，而是为每个 chunk 计算一段「与它相关、而且基于整份文档」的上下文</u>。</b><br><b>⇒ 怎么算？<u>又是一次 LLM 调用</u>。<u>你通常是把整份文档、加上你想要上下文化的那个 chunk 一起给模型，然后说：请给我一段简短扼要的上下文，好让这个 chunk 说得通</u>。</b><br><b>⚠ 而讲者立刻自己提出了反对意见</b>：<b>「<u>现在你可能会跟我说：那可是大量的 LLM 调用啊。你可能有很多很多 chunk，那会非常贵</u>。」</b><b>⇒ 下一镜就是他给的解法，而那个解法本身是一个很值得知道的工程技巧。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,210,[["decoder-only ⇒ 注意力是「从左到右」的","v"],["⇒ 相同的前缀，必然产生相同的激活","g"],["那就只算一次、把激活存下来","g"],["之后直接「查表」，再解码剩下的部分","y"]],900,34,8);
  note("★ 价格上：OpenAI 的「已缓存输入 token」大约是普通输入的十分之一",640,386,"y");},"<b>这个技巧的原理，讲者说「<u>既然你们现在很清楚 LLM 怎么工作，知道它们通常是 decoder-only</u>」就能自己推出来 —— 我们照着推一遍。</b><br><b>推理</b>：<b><u>如果你所有的 prompt 都用同一个前缀，那你就是在一遍又一遍地做同样的计算</u>。</b><b>⇒ <u>所以想法是：你只做一次，把所有相关的激活保存下来；之后不再重新计算，而是直接查表，然后把剩下的部分解码出来</u>。</b><br><b>★★ 为什么「相同前缀 ⇒ 相同激活」成立？讲者回答学生提问时讲清了</b>：<b><u>当你把 prompt 喂给模型、让它生成回答时，模型要做的是：拿这整段输入，算出所有层的激活，然后在生成过程中对所有这些成分做注意力。而既然它是 decoder-only 的 —— 也就是只从左到右 —— 那么你输入的东西如果相同，它就会导出相同的激活</u>。</b><b>⇒ ⚠ 注意<u>这个性质是因果注意力（只看左边）给的</u>：前缀的激活不会被后面的内容改变。<u>换成双向编码器就不成立了</u>。</b><br><b>★ 闭源模型怎么办</b>：<b>讲者说这<u>也是闭源厂商提供的一个选项</u>：<u>看模型定价页，你会看到「普通输入（未缓存）」的价格，和「每个已缓存输入 token」的价格。对 OpenAI 的模型，它是十分之一的价格</u>。</b><br><b>★★★ 他由此给的建议非常实用</b>：<b>「<u>那我想借此告诉你什么呢？就是：对 prompt 聪明一点，把那些「很可能在各个 prompt 之间重复」的东西都收拢到开头，这样你就能拿到这个不错的折扣</u>。」</b><br><b>⇒ 这是一条<u>把一个架构事实（因果注意力）直接变成省钱策略</u>的例子。</b>");
  SUM(0,13,{h:"给 chunk 补上下文 · prompt caching",k:"问题：天真按 token 切出来的 chunk <b>脱离语境就看不懂</b>。办法：拿<b>整份文档 + 这个 chunk</b> 去问 LLM 要一段简短扼要的上下文，补在 chunk 前面。⚠ 但 chunk 很多 ⇒ 大量 LLM 调用 ⇒ 很贵。",m:"⭐ 解法是 <b>prompt caching</b>：decoder-only 的注意力只看左边 ⇒ <b>相同前缀必然产生相同激活</b> ⇒ 只算一次、把激活存下来，之后直接查表再解码剩下的。⚠ 这个性质是<b>因果注意力给的</b>，换成双向编码器就不成立。",w:"★ 价格：OpenAI 的「已缓存输入 token」约为普通输入的<b>十分之一</b>。讲者的建议：<b>对 prompt 聪明一点，把各个 prompt 间很可能重复的东西都收拢到开头</b>，好拿这个折扣。",r:"★★ 这是「<b>把一个架构事实直接变成省钱策略</b>」的范例。对应到你的搜索：<b>共享前缀 = 共享的部分配置</b> —— 同一个父节点下的所有分支共用那段已定的配置，它的评估/代价下界<b>只该算一次</b>。memoization 不是优化技巧，而是和 prompt caching 同构的结构性节省。"});
  QUIZ(0,13,{t:"prompt caching 为什么成立？",o:["因为模型会记住用户","因为厂商在服务端做了去重","因为 decoder-only 的注意力只看左边 ⇒ 相同的前缀必然产生相同的激活，可以只算一次存起来","因为 embedding 可以复用"],a:2,w:"⚠ 这个性质是因果注意力给的，双向编码器就不成立。价格上已缓存输入约为普通输入的十分之一 —— 所以要把重复的内容收拢到 prompt 开头。"});
});

  note("★ 为什么负担得起：你只在一百多个候选上做，不是在上百万个上做",640,364,"y");},"<b>第二阶段的做法，以及它为什么能比第一阶段更准 —— 原因非常具体。</b><br><b>名字</b>：<b><u>第二阶段叫 ranking，甚至叫 re-ranking（重排）。叫重排是因为第一步里你已经有了某种排序，所以我们是在重新排</u>。</b><b>⚠ 讲者也说了它的定位：<u>第二部分更偏可选，因为有时候第一刀切得就已经够好了；但这第二步是为了在「怎么给出最终分数」上更有意图性，好真正选出最终的 top-k 个 chunk</u>。</b><br><b>做法</b>：<b><u>我们不再用那个非常快的、在已算好的 embedding 之间做的相似度操作，而是用一个更精细一点的东西。不是把 query 和 chunk 分开考虑，而是把它们两个都放进编码器，从中得到一个相关性分数</u>。</b><br><b>★★ 为什么这样更有意义，他的解释很清楚</b>：<b><u>因为你有一个模型同时看着你的 query 和你的 chunk，然后给你一个分数；而在第一步里，你有一个 query 的 embedding 和一个 chunk 的 embedding，它们之间没有那种「模型能够捕捉到的交互」</u>。</b><b>⇒ 有学生追问「<u>所以你实际上会在两者之间算注意力？</u>」讲者答：<u>是的，绝对是</u>。</b><br><b>★ 名字的对照</b>：<b><u>第一种做法是 bi-encoder（双编码器）设置，这一种是 cross-encoder（交叉编码器）—— 因为你的两个输入都喂进了同一个编码器，所以有交叉的交互</u>。</b><br><b>⇒ 而为什么负担得起：<u>你能在这里花更多时间产出这个分数，因为你是在一百多个候选里操作，而不是在几百万、几十万里</u>。</b>");

  note("★ 所以两者不是「谁更好」，而是「各自能承受的规模不同」",640,386,"y");},"<b>把两种结构并排看，这个取舍就非常清楚了 —— 而它解释了为什么必须是两阶段，而不能只用其中一种。</b><br><b>bi-encoder 的本钱</b>：<b>两边各编各的 ⇒ <u>chunk 那一侧可以在建库时全部算好</u>。查询时只需算一次 query 的 embedding，剩下全是向量比较。<u>所以它能在百万量级上跑</u>。</b><b>⚠ 代价：<u>模型从来没有同时看过 query 和 chunk</u>，所以捕捉不到两者的交互（比如「这个 chunk 里的『它』指的正是 query 问的那个东西」）。</b><br><b>cross-encoder 的本钱</b>：<b>两者一起进 ⇒ <u>注意力可以在 query 的词和 chunk 的词之间来回算</u>，判断自然更准。</b><b>⚠ 代价是结构性的：<u>它的输入里有 query，所以什么都不能预先算好</u>。每一个 (query, chunk) 对都要跑一次完整的模型。<u>一百万个 chunk 就是一百万次前向</u> —— 这在查询时是不可能的。</b><br><b>★★★ 所以这两者不是「谁更好」的关系，而是「<u>各自能承受的规模不同</u>」</b>：<b><u>bi-encoder 便宜但粗，所以放在量级大的第一级；cross-encoder 贵但准，所以放在量级小的第二级</u>。</b><br><b>⇒ 两阶段结构不是某个人的巧思，<u>它是被这两种结构各自的约束逼出来的唯一解</u>。</b><br><b>⚠ 讲者还提了一句实务：<u>重排用的那个模型通常要训一个；可能有一些预训练的，但你完全可以有自己定制的</u>。而训练用的损失，他推荐去读 S-BERT 那篇 —— <u>那篇里比较了好几种损失函数，对比学习损失就是其中之一</u>。</b>");
  SUM(0,14,{h:"重排：cross-encoder",k:"第二阶段叫 <b>ranking / re-ranking</b>（第一步已排过一次）。做法：不再比已算好的 embedding，而是<b>把 query 和 chunk 一起喂进编码器</b>，直接输出一个相关性分数 —— 两者之间会算注意力。这个结构叫 <b>cross-encoder</b>。",m:"★★★ 两者不是「谁更好」，是<b>各自能承受的规模不同</b>：<b>bi-encoder</b> 一侧可离线预算 ⇒ 能在百万量级跑，但捕捉不到交互；<b>cross-encoder</b> 输入里有 query ⇒ <b>什么都不能预算</b>，每个 (query, chunk) 对都要跑一次模型。",w:"⇒ 所以<b>两阶段结构不是某人的巧思，是被这两种结构各自的约束逼出来的唯一解</b>。而为什么第二级负担得起：你只在一百多个候选上做。⚠ 重排模型通常要自己训，损失可参考 S-BERT 那篇（里面比较了好几种，对比学习损失是其中之一）。",r:"★ 同一个取舍在你的课题里：<b>独立评估每个分量</b>（可预算、可复用，但看不到分量之间的交互）vs <b>联合评估整个组合</b>（准，但每个组合都要算一次）。⇒ 你的剪枝判据若用前者会漏掉交互项造成的不可行；而把后者用在全空间上又算不动 —— 两阶段同样是被逼出来的。"});
  QUIZ(0,14,{t:"cross-encoder 为什么不能直接用在第一阶段？",o:["它只能处理短文本","它的输入里含 query ⇒ 什么都不能预先算好，每个 (query, chunk) 对都要跑一次模型，百万 chunk 就是百万次前向","它的精度不够","它不支持 ANN"],a:1,w:"★ 所以两阶段结构不是某人的巧思，而是被 bi-encoder（便宜但粗）和 cross-encoder（贵但准）各自的约束逼出来的唯一解。"});
});

  note("⇒ 所以把相关文档排在前面，分数就高 —— 这就是它全部的用意",640,258,"y");},"<b>检索做完了，怎么知道做得好不好？这一条讲的是最常见的那个指标，而讲者把一个看起来吓人的公式拆得很清楚。</b><br><b>先说设定</b>：<b><u>你有一堆 chunk，做完第一步和第二步，最后会有 k 个 chunk 排在最前面，你把它们认定为相关的。而你要拿它和「实际上相关的那些 chunk」去比</u>。</b><b>⇒ 讲者给了一个很好的类比：<u>你可以把它想成和二分类一样有标签 —— 有相关和不相关，你预测了一些为相关，然后你想知道自己做得怎么样</u>。</b><br><b>⚠ 但排序问题多一件事</b>：<b><u>说到排序，你得把「你把东西排得多靠前」这个信息也纳进来</u>。</b><br><b>★★ NDCG 在做什么</b>：<b><u>它试图通过「考虑你把相关文档排在了哪里」来量化你的排序有多好。这个公式看着可能吓人，但它想做的事其实相当简单：它激励「你把相关文档排得越靠近第一位，分数就越高」</u>。</b><br><b>具体怎么算</b>：<b><u>它是对你排出来的前 k 个位置求和，并且看你在每个位置上排的那个东西到底相不相关。比如它看第一个位置：第一个位置相不相关？如果相关，relevance 就是 1。于是它是「1 除以某个关于名次的量」。它对所有名次都这么做</u>。</b><b>⇒ <u>所以如果你把相关文档排得高，分数就会更高。这基本上就是这个指标的目标</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  stack(640,210,[["G = Gain 收益：这一位相关就得分","g"],["C = Cumulative 累积：把前 k 位加起来","g"],["D = Discounted 折扣：位置越靠后、除数越大","y"],["N = Normalized 归一：再除以「理想排序」能拿到的那个 DCG","v"]],900,34,8);
  note("★ 归一化的用意：如果你排得和最优排序一样，就正好得 1 分",640,386,"y");},"<b>把名字拆开，这个指标就完全不神秘了 —— 讲者正是这么讲的。</b><br><b>D-C-G 三个字母</b>：<b><u>这部分叫 discounted cumulative gain。叫 cumulative（累积）是因为你在看「你的前 k 个位置里有没有相关文档」，这是累积的部分；叫 discounted（折扣）是因为「相关文档出现在第一位」对你来说比出现在第 k 位更好 —— 而你能在分母里看到这一点</u>。</b><br><b>★★ 那 N 呢？讲者自己问了：<u>为什么我们说 NDCG？归一化那部分是什么？</u></b><b>理由他说得很实在：<u>这个指标会因为「到底有多少个相关文档」而取到差别很大的值</u>。</b><b>⇒ <u>所以人们的做法是：对一个给定的 query，算出你能拿到的那个所谓「理想的、最优的、上界的」DCG，把它叫做 ideal DCG，然后用 DCG 除以 IDCG</u>。</b><br><b>★★★ 而归一化的目的，他一句话点明了</b>：<b>「<u>他们这么做的理由是：他们希望你在「匹配上最优排序」时拿到 1 分。他们基本上是想让这个分数有意义</u>。」</b><br><b>⇒ 想清楚这件事为什么必要：<u>没有归一化的话，一个有 10 个相关文档的 query 和一个只有 1 个相关文档的 query，它们的 DCG 天然就不在同一个尺度上，没法横向比较、也没法求平均</u>。</b><b>⚠ 这和 L6 里 GRPO 的 advantage 要减均值除标准差是同一个动机：<u>把「题目本身的难易/规模」这个与方法无关的成分消掉</u>。</b><br><b>⭐ 还有学生问了「relevance 怎么来」：讲者答得很明确 —— <u>那是实际的标签，是 ground truth</u>。你按分数降序排好自己的 k 个 chunk，然后逐个问「这一个实际上相不相关」。</b>");
  SUM(0,15,{h:"★ NDCG",k:"DCG@k = Σ rel_i / log₂(i+1)，NDCG@k = DCG@k / IDCG@k。<b>rel_i 是实际标签（ground truth）</b>：排在第 i 位的 chunk 真的相关就记 1。",m:"名字拆开就是全部用意：<b>G</b>ain 这一位相关就得分 · <b>C</b>umulative 把前 k 位加起来 · <b>D</b>iscounted 位置越靠后除数越大 · <b>N</b>ormalized 再除以「理想排序」的 DCG。⇒ 把相关文档排得越靠前，分数越高。",w:"★ 归一化的用意（讲者原话）：<b>希望你匹配上最优排序时正好拿 1 分，让这个分数有意义</b>。没有它的话，「有 10 个相关文档的 query」和「只有 1 个的」天然不在同一尺度，没法横向比较或求平均。",r:"⚠ 这和 L6 里 GRPO 的 advantage 要减均值除标准差是<b>同一个动机</b>：把「题目本身的难易/规模」这个与方法无关的成分消掉。⇒ 你跨实例汇总结果时必须做同一件事，否则平均值只是在反映实例难度的分布。而「<b>位置折扣</b>」也直接可用：你报 top-k 候选质量时，排第 1 和排第 k 不该同等计分。"});
  QUIZ(0,15,{t:"NDCG 里的「N」（归一化）解决的是什么问题？",o:["抵消 ANN 带来的误差","让分数落在 0 到 1 之间好看","消除 chunk 长度的影响","不同 query 的相关文档数量不同，DCG 天然不在同一尺度 ⇒ 除以理想 DCG 后，匹配最优排序就正好得 1 分，分数才有意义"],a:3,w:"⚠ 这和 GRPO 的 advantage 减均值除标准差是同一个动机：把「题目本身的难易/规模」这个与方法无关的成分消掉。"});
});
KP("16 · 另外三个指标，与 MTEB 榜单",function(){

  note("★ 讲者：这四个（NDCG、MRR、recall@k、precision@k）在很多论文里都会见到",640,386,"y");},"<b>另外三个指标，讲者讲得很快，因为它们都是你已经熟悉的东西换一个说法。</b><br><b>reciprocal rank（倒数名次）</b>：<b><u>这个简单得多。它取「所有相关文档里名次最高的那一个」的倒数。所以假设在你的 top k 文档里，第一个相关文档出现在第二名，那么 rank 就等于 2</u>。</b><b>⚠ 它的性格很鲜明：<u>它基本上不在乎在第一个相关文档之后还有没有别的相关文档</u>。</b><b>⇒ 讲者说<u>这就是个更简单的指标，而且通常相关性不错，所以人们会用它</u>。</b><br><b>recall@k 与 precision@k</b>：<b>讲者是从二分类那边带过来的 —— <u>recall 是：看所有实际为正的观测，问其中有多少是你预测为正的</u>。<u>排序版本就是：在所有实际相关的文档里，哪些是你预测为相关的 —— 也就是哪些进了你的 top k</u>。</b><b><u>precision 是：在你预测为正的里面，有多少实际上是正的。这里的对应就是：你选进 top k 的那些里，哪些实际上是相关的</u>。</b><br><b>★★ 把 MRR 和 NDCG 对照着想一层会很有收获</b>：<b><u>MRR 只看第一个命中，NDCG 看全部 k 个且带位置折扣</u>。</b><b>⇒ 所以<u>如果你的用例是「只要有一条对的就行」（比如找一条事实），MRR 更贴；如果是「要把多条相关的都放进 prompt」，NDCG 更贴</u>。<u>指标的选择应该由你的使用方式倒推</u>。</b><br><b>★ 讲者的建议</b>：<b><u>这四个指标在一堆论文里都会见到，我强烈建议你去熟悉它们的想法、也许还有公式。它们就是你用来量化「你的检索器干得好不好」的东西</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("★ 有多个方案时，就比这些指标",640,364,"g");},"<b>最后把评测这一段收口：指标有了，还得有一个公共的比较场。</b><br><b>讲者的说法</b>：<b>「<u>外面有一堆 benchmark。有一个其实相当流行，叫 massive text embedding benchmark（MTEB）。如果你想测你的检索器表现好不好，你通常就把它拿过来，在那个 benchmark 上评测，然后把所有这些指标都算出来。而如果你有不同的方案，你通常就比较这些指标</u>。」</b><br><b>★★ 我想请你留意这一整段（KP 15 到这里）的结构，因为它是一个很完整的「<u>怎么把一个模糊的目标变成可比较的东西</u>」的示范</b>：<br><b>① 先说清<u>你在预测什么</u>（哪些 chunk 相关）；</b><br><b>② 再承认<u>这个问题比分类多一件事</u>（位置也重要）；</b><br><b>③ 设计一个<u>把位置纳进来</u>的分数（DCG）；</b><br><b>④ 发现它<u>跨 query 不可比</u>，于是归一化（NDCG）；</b><br><b>⑤ 补上<u>性格不同的其它指标</u>（MRR 只看第一个命中、recall@k 管漏没漏、precision@k 管准不准）；</b><br><b>⑥ 最后给一个<u>公共的比较场</u>（MTEB）。</b><br><b>⇒ 这六步缺任何一步，「我的检索器更好」这句话都站不住。</b><br><b>⚠ 而回想 L4 结尾讲者对 LLM 评估的那个结论（<u>没有哪一个数字能告诉你你关心的东西</u>），你会发现检索这一块反而是幸运的：<u>因为「相关不相关」有 ground truth，所以指标是实打实的</u>。这又一次说明了「可验证」这个性质有多值钱。</b>");
  SUM(0,16,{h:"MRR / recall@k / precision@k / MTEB",k:"<b>reciprocal rank</b>：第一个相关文档名次的倒数（⚠ 完全不管之后还有没有相关文档，但通常相关性不错）。<b>recall@k</b>：所有真正相关的里有多少进了 top k。<b>precision@k</b>：你放进 top k 的里有多少真的相关。榜单：<b>MTEB</b>（massive text embedding benchmark）。",m:"★ MRR 与 NDCG 的性格不同：<b>MRR 只看第一个命中，NDCG 看全部 k 个且带位置折扣</b>。⇒ 用例是「只要有一条对的就行」则 MRR 更贴；是「要把多条相关的都放进 prompt」则 NDCG 更贴 —— <b>指标该由使用方式倒推</b>。",w:"★★ 这一整段是「把模糊目标变成可比较的东西」的完整示范：① 说清在预测什么 → ② 承认比分类多一件事（位置）→ ③ 设计纳入位置的分数 → ④ 发现跨 query 不可比就归一化 → ⑤ 补上性格不同的其它指标 → ⑥ 给一个公共比较场。<b>缺任何一步，「我的更好」都站不住</b>。",r:"⚠ 对照 L4 结尾那个「没有哪个数字能告诉你你关心的东西」的结论：检索这块反而幸运，<b>因为「相关不相关」有 ground truth</b>。你的课题同样幸运（可行性与代价可精确判定）。⇒ 那六步正好是你实验章的骨架，而第 ⑤ 步尤其别省：<b>报一组性格不同的指标</b>，比把希望押在一个数上可信得多。"});
  QUIZ(0,16,{t:"MRR 和 NDCG 的性格差别是什么，该怎么选？",o:["MRR 只看第一个命中、NDCG 看全部 k 个且带位置折扣 ⇒ 「只要有一条对的就行」用 MRR，「要把多条都放进 prompt」用 NDCG","两者等价，只是写法不同","MRR 更精确，应该优先用","NDCG 用于训练，MRR 用于评测"],a:0,w:"★ 指标该由使用方式倒推。而这一整段（设定 → 位置 → DCG → 归一化 → 补指标 → 榜单）是「把模糊目标变成可比较的东西」的完整示范。"});
});
KP("17 · tool calling：RAG 管非结构化，它管结构化",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("59:57","the data that we want to inject is structured");
  note("下半场由 Shervine 讲，他说这是他最喜欢的部分",640,186,"v");
  boxNode(70,214,520,44,"RAG 处理的：非结构化数据","b");
  note("文档里全是词、词、词",330,284,"d");
  note("⇒ 你只想把相关的那几篇捞出来回答问题",330,314,"d");
  boxNode(690,214,520,44,"tool calling 处理的：结构化数据","g");
  note("输入与输出之间有确定的关系，比如一张表",950,284,"g");
  note("⇒ 那就可以把它重述成一个「函数」",950,314,"y");
  note("★ 所以 function calling 和 tool calling 说的是同一件事的两种叫法",640,364,"y");},"<b>下半场换 Shervine，而他切入的方式很干净：先说清 tool calling 和刚讲完的 RAG 分别管什么。</b><br><b>他的对照</b>：<b>「<u>Afshine 刚讲的是：当你要并入的数据是「非结构化」的时候，你怎么把它作为 prompt 的一部分处理。而现在我们要看的是，当我们想注入的数据是「结构化」的时候，我们还能做什么</u>。」</b><br><b>⇒ 具体化</b>：<b><u>在 RAG 的情形里，你有文档，里面是词、词、词，而你只是想捞出相关的文档来回答你的 prompt。但这里，假设你的数据里有某种结构，它决定了输入和输出之间的关系 —— 典型地你可以把它表示成一张表：你有若干列，而根据给定列的取值，你有一个给定的输出</u>。</b><br><b>★★ 关键的那一步转换</b>：<b>「<u>那我们大概可以把这个设定重新表述成一个函数的设定。所以我们说 tool calling，而这种重述就叫做 function calling</u>。」</b><b>⇒ 所以这两个词说的是同一件事：<u>把「输入到输出的确定关系」写成一个函数，让 LLM 去调用它</u>。</b><br><b>⭐ 一个实务上的说明</b>：<b><u>在 tool calling 和 function calling 的世界里，你经常会看到 LLM 倾向于用 Python 作为语言，就因为它特别好读。所以我们也用它做例子。但没有任何东西把我们绑死在 Python 上，你完全可以用别的语言做 tool calling</u>。</b><br><b>★ 这个「RAG 管非结构化、tool calling 管结构化」的划分很值得记，因为它直接告诉你<u>手上的问题该用哪一个</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("62:19","tool calling allows autonomous systems to complete complex tasks");
  note("Shervine 特意去找了一个权威定义来对齐说法",640,188,"v");
  boxNode(130,218,1020,44,"tool calling 让自主系统能通过「动态访问并作用于外部资源」来完成复杂任务","g");
  note("⭐ 他要你从这条定义里抓两件事",640,296,"y");
  note("① 完成某个「任务」：给一个输入，你得把某件事做完",640,326,"d");
  note("② 可能依赖「外部资源」—— 但不是非得外部",640,364,"d");},"<b>Shervine 在这里做了一件很讲究的事：他特意去找了一个<u>权威出处</u>的定义，而不是自己随口给一个。</b><br><b>他的说法</b>：<b>「<u>tool calling 没什么有争议的，但我还是要给一个完整的定义，确保我们在同一个频道上。我到处翻了翻，试着找一个权威的来源。IBM 上有一篇文章试图定义什么是 tool calling，所以我从现在起就锚在他们的定义上</u>。」</b><b>⇒ 然后他把定义念了出来：<u>tool calling 让自主系统能够通过动态地访问、并可能作用于外部资源，来完成复杂任务</u>。</b><br><b>★★ 他要你从里面抓的两件事</b>：<br><b>① <u>完成某个任务</u>：<u>给定一个输入，你得去完成某件事</u>。</b><br><b>② <u>可能依赖外部资源</u>：<u>它不一定非得是外部的，你不是非要依赖外部资源。但这是一个潜在的性质，它能帮你补上 Afshine 在开头提到的那个缺口 —— 补上你预训练 LLM 的知识缺口</u>。</b><b>⇒ 他的评价：<u>这是它神奇的地方之一</u>。</b><br><b>★★★ 注意第 ② 点里那个「<u>并可能作用于</u>」（may act upon）—— 这是 tool calling 和 RAG 最根本的区别</b>：<b><u>RAG 只能「读」；tool calling 可以「写」</u>。</b><b>⇒ 这一字之差就是弱点清单上第 ③ 条（光说不做）被修掉的地方，也是本讲最后要专门讲安全的原因。</b><br><b>⭐ 而「去找一个权威定义再锚住」这个做法本身值得学 —— 对照 L6 里讲者说「推理没有公认定义，我尽我所能给一个」，两种处理都很诚实，而且都把自己的依据交代清楚了。</b>");
  SUM(0,17,{h:"tool calling 的定位与定义",k:"<b>RAG 管非结构化</b>（文档里全是词，捞出相关的几篇）；<b>tool calling 管结构化</b>（输入输出间有确定关系，比如一张表）⇒ 把它重述成一个<b>函数</b>，这就是 <b>function calling</b>，和 tool calling 是同一件事的两种叫法。",m:"Shervine 特意找了 IBM 的权威定义来锚住：<b>tool calling 让自主系统能通过动态访问、并可能作用于外部资源，来完成复杂任务</b>。他要你抓两件事：① 完成某个<b>任务</b>；② 可能依赖<b>外部资源</b>（但不是非得外部）。",w:"★★★ 定义里「<b>并可能作用于</b>」（may act upon）是 tool calling 与 RAG 最根本的区别：<b>RAG 只能「读」，tool calling 可以「写」</b>。⇒ 这一字之差正是弱点清单第 ③ 条（光说不做）被修掉的地方，也是本讲最后要专门讲安全的原因。",r:"⭐ 「去找一个权威定义再锚住」这个做法本身值得学 —— 对照 L6 里「推理没有公认定义，我尽我所能给一个」，两种处理都诚实，关键是<b>把依据交代清楚</b>。你定义「可行」「最便宜」时也该如此：有公认定义就引，没有就明说这是你的操作性定义。"});
  QUIZ(0,17,{t:"tool calling 的定义里，哪一点使它和 RAG 根本不同？",o:["定义里的「并可能作用于（may act upon）外部资源」—— RAG 只能读，tool calling 可以写","它不需要 embedding","它更快","它只处理表格数据"],a:0,w:"⇒ 这一字之差正是弱点清单第 ③ 条（光说不做）被修掉的地方，也是本讲最后要专门讲安全的原因。"});
});
KP("18 · ⚠ 函数定义里，LLM 其实只看得到一小部分",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("一个 tool 的定义里有什么，以及谁看得到什么",640,186,"v");
  boxNode(70,214,520,44,"★ LLM 看得到的","g");
  note("函数的 API：名字、输入、输出",330,284,"g");

  note("函数的「实现」：怎么调后端 API、怎么筛结果",950,284,"r");
  note("⇒ 这些都在你的代码库里，模型看不到",950,314,"d");
  note("★ 所以 Python 函数下面那段 docstring 对模型来说是至关重要的",640,364,"y");},"<b>这一条是整个 tool calling 里最容易被误解的地方，而 Shervine 特意强调了一遍。</b><br><b>一个 tool 定义里有什么</b>：<b>他用「找泰迪熊」那个例子：<u>你可以想象一个函数定义叫 find teddy bear，它根据你的位置去调某个 API，取回一些候选</u>。</b><br><b>★★ 第一个要点：文档至关重要。</b><b><u>当我们想把这样一个 API 展示给模型时，你需要给它的输入和输出写文档，好让模型知道这个函数是干什么的。所以在 Python 的例子里，一个函数下面的那段 description（文档说明），对模型来说是至关重要的</u>。</b><br><b>★★★ 第二个要点，也是最关键的那个</b>：<b>「<u>我还想说一件事：我们这里看到的这一切，都是你实现出来的。如果你是一个 LLM，你不会看到这一切。你作为 LLM 唯一在乎的，是函数的 API —— 输入和输出 —— 以及文档的主要内容。所有这些实现细节会在你的代码库里，但 LLM 是看不到它们的</u>。」</b><br><b>⇒ 这件事的含义很实在</b>：<b>① <u>模型没法「读源码」来猜你的函数在干什么</u> —— 你写得含糊，它就用得含糊；② <u>实现里的复杂逻辑（调哪个 API、怎么处理异常、返回什么结构）对模型是透明的</u>，它只看到一个签名和一段话。</b><br><b>★ 所以一个很实际的结论：<u>docstring 不是给人看的注释，它是模型的唯一输入</u>。</b><b>⇒ 这和平时写代码的直觉不太一样 —— 平时注释写不写、写多细，是风格问题；这里它<u>直接决定模型能不能正确调用</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("那函数「返回什么」要不要讲究？要 —— 而且它是最后一步能成立的前提",640,186,"v");
  boxNode(70,214,520,44,"实现里返回一个「结构化」的对象","g");
  note("比如一个类，带着这只泰迪熊的名字、位置…",330,284,"d");
  note("⇒ 它把输出整理得「可被解读」",330,314,"g");
  boxNode(690,214,520,44,"★ 而这正是模型最后要锚定的东西","y");
  note("第三阶段 LLM 要把它转成人话",950,284,"d");
  note("⚠ 返回一坨没有结构的文本，这一步就没法可靠地做",950,314,"r");
  note("⇒ 所以「返回值的结构」是写给下游 LLM 的，不只是写给你自己的代码",640,364,"y");},"<b>函数的返回值怎么设计，Shervine 只说了一句，但那一句点出了它的角色。</b><br><b>他的话</b>：<b><u>它返回的是某种良好结构化的东西。你能看到有一个类的定义，它给输出加上了一些结构，让它变得可被解读。而我们很快就会看到，这个输出正是模型最后要锚定、用来给出它最终回答的东西</u>。</b><br><b>★★ 请把这句话和三阶段连起来</b>：<b>第三阶段的任务是<u>把函数的返回转成自然语言</u>，而它能不能做好，取决于它拿到的是什么。</b><b>⇒ <u>拿到一个带字段名的结构化对象（名字、位置、距离…），模型就知道每一项是什么、该怎么表述；拿到一坨没有结构的自由文本，它就只能猜</u>。</b><br><b>★ 所以可以带走的判断是：<u>返回值的结构不只是写给你自己的代码看的，它是写给下游那个 LLM 看的</u>。</b><br><b>⇒ 这和上一镜那条「docstring 是模型的唯一输入」是同一件事的另一面：<u>函数的两端（签名与文档、返回值的结构）都是「给模型的接口」，而中间的实现才是你自己的事</u>。</b><br><b>⚠ 一个很实际的推论：<u>如果你发现第三阶段的回答经常答非所问、或者漏掉关键信息，先别急着调那一步的 prompt —— 先看看函数返回的结构是不是把该说的都说清楚了</u>。</b><b>这两处出的毛病看起来一模一样，但改的地方完全不同。</b>");
  SUM(0,18,{h:"⚠ LLM 只看得到 API 和文档",k:"<b>LLM 看得到</b>：函数的 <b>API</b>（名字、输入、输出）+ <b>文档的主要说明</b>。<b>LLM 看不到</b>：函数的<b>实现</b>（怎么调后端 API、怎么筛结果）—— 那些都在你的代码库里。",m:"⇒ 所以那段 <b>docstring 对模型来说至关重要</b>：它是模型判断「这个函数是干什么的」的唯一依据。",w:"★ 一个和平时写代码不同的结论：<b>docstring 不是给人看的注释，它是模型的唯一输入</b>。平时注释写不写是风格问题；这里它<b>直接决定模型能不能正确调用</b>。模型没法读源码来猜，你写得含糊它就用得含糊。",r:"这条有个一般形式：<b>接口的「可见面」决定了调用方能做对多少</b>。你把求解器、评估器包给搜索策略用时也一样 —— 策略只能依据你暴露的签名与语义来决策，<b>藏在实现里的前提条件（定义域、精度、失败模式）它看不到</b>，必须显式写进接口说明，否则就会以你没预料的方式被调用。"});
  QUIZ(0,18,{t:"在 tool calling 里，LLM 看得到函数的哪些部分？",o:["API 加上最近的调用日志","只有函数名","完整的源码实现","只有 API（名字、输入、输出）和文档说明 —— 实现细节在你的代码库里，模型看不到"],a:3,w:"★ 所以 docstring 不是给人看的注释，而是模型的唯一输入 —— 它直接决定模型能不能正确调用。"});
});
KP("19 · tool calling 的三个阶段",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("68:53","the goal of the LLM here is not going to be to infer any of the functions implementations");
  seq(90,210,["① LLM 填参数","② 执行函数（和 LLM 无关）","③ LLM 把结果转成自然语言"],["g","b","g"],370,44);
  note("① 把函数 API 和文档放进 preamble，让 LLM 根据用户问题「填对参数」",640,286,"d");
  note("★ LLM 的目标不是推断实现，只是「该给它什么参数」",640,316,"y");
  note("② 纯粹的代码执行：拿函数和参数跑一下，拿到结构化的返回",640,354,"d");
  note("③ 把结构化结果喂回 LLM ⇒ 因为你要的是人话，不是一段 JSON",640,384,"g");},"<b>三个阶段，而 Shervine 特意点明了每一段里「LLM 在干什么、不干什么」。</b><br><b>① 填参数。</b><b><u>第一阶段是：当你问一个和你的函数相关的问题时，你会在 preamble（前置说明）的开头插入这个函数的 API —— 而且如我所说，不带实现。所以你只放函数本身，加上完整的文档</u>。</b><b>⇒ <u>你要的是 LLM 根据用户的 query，给你的函数喂进正确的参数</u>。</b><b>★ 而他把边界划得很清楚：<u>LLM 在这里的目标，不是去推断函数的任何实现，而只是「我们该给它什么参数」</u>。</b><b>⭐ 他举的例子里还有一层：<u>LLM 从它的上下文里很可能已经有我们的定位 —— 比如你开了定位权限，它知道你在 Stanford，于是这些坐标就被喂进函数</u>。</b><br><b>② 执行函数。</b><b><u>第二阶段是真正去做那个函数调用。而它和 LLM 没有任何关系 —— 你就是拿你的函数、你的参数，执行它，拿到答案</u>。</b><b>⇒ <u>而这个答案，如我们提到的，是以一种可理解的方式结构化的</u>：函数实现里返回一个对象，带着返回的泰迪熊的各种特征（名字、位置等等）。</b><br><b>③ 转成人话。</b><b><u>你把那个响应喂回 LLM，好拿到最终回答。因为当你问 LLM 一个问题时，你不想要那种类 JSON 的回应，而是想要自然语言的回应。这正是最后这一阶段的动机</u>。</b><br><b>★★ 请注意这个结构的干净之处：<u>中间那一段完全没有 LLM</u>。</b><b>LLM 只负责两端的「翻译」—— <u>把自然语言翻成函数参数，再把结构化结果翻回自然语言</u>。<u>真正干活的是你写的那段确定性代码</u>。</b>");
  SUM(0,19,{h:"tool calling 的三阶段",k:"① <b>LLM 填参数</b>：把函数 API + 文档放进 preamble，让它根据用户 query 填对参数（★ 目标<b>不是</b>推断实现）；② <b>执行函数</b> —— 和 LLM 无关，就是跑代码拿到结构化返回；③ <b>LLM 把结构化结果转成自然语言</b>（你要的是人话，不是 JSON）。",m:"⭐ 例子里还有一层：LLM 可能从上下文里已经有你的定位（开了权限 ⇒ 它知道你在 Stanford），于是坐标直接被填进函数参数。",w:"★★ 注意这个结构的干净之处：<b>中间那一段完全没有 LLM</b>。LLM 只负责两端的「翻译」—— 自然语言 → 函数参数，结构化结果 → 自然语言。<b>真正干活的是你写的那段确定性代码</b>。",r:"★ 这个分工值得照搬：<b>把「不确定的理解」和「确定的计算」分开</b> —— 模型负责把模糊输入变成结构化参数，求解器负责算，模型再负责把结果讲清楚。⇒ 你的系统里凡是能写成确定性代码的部分（约束检查、代价计算）都不该交给学出来的组件，这样错误也更好定位。"});
  QUIZ(0,19,{t:"tool calling 三阶段里，第二阶段（执行函数）有什么特点？",o:["它由 LLM 内部模拟执行","它在模型的推理链里完成","它和 LLM 完全无关 —— 就是拿函数和参数跑一遍确定性代码，拿到结构化返回","它需要再调用一次 LLM 来验证"],a:2,w:"★ LLM 只负责两端的翻译（自然语言→参数，结构化结果→自然语言），真正干活的是你写的确定性代码。"});
});
KP("20 · 怎么训它用工具：两组 SFT 对",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("72:44","this is why you typically have these two SFT pairs");
  note("三阶段里有两段是 LLM 驱动的 ⇒ 就要两组 SFT 对",640,186,"v");
  boxNode(70,214,520,44,"第一组：工具预测","g");
  note("输入：函数定义 + 用户 query",330,284,"d");
  note("输出：该调哪个函数、参数填什么",330,314,"d");
  boxNode(690,214,520,44,"第二组：最终回答","g");
  note("输入：⚠ 不只是 JSON，而是「到目前为止的整段对话历史」",950,284,"r");
  note("输出：你想要的那种格式的自然语言回答",950,314,"d");
  note("★ 为什么要第二组：你通常希望回答按某种特定方式被格式化",640,364,"y");},"<b>Shervine 把这一条做成了提问：<u>如果让你去训一个 LLM 来用这个工具，你需要聚焦在哪些步骤上？</u> 而答案正好对应三阶段里那两段有 LLM 的。</b><br><b>第一组：工具预测。</b><b><u>你需要第一次 LLM 调用能够识别出「函数实现 + query」的模式，并把它连到「你该给函数填什么参数」上</u>。</b><b>⇒ 这叫 tool prediction。</b><br><b>第二组：最终回答。</b><b>Shervine 自己先替学生提了反对意见：<u>你可能会说：LLM 已经见过一堆结构化数据，知道怎么把它看到的东西说成人话，这是个公道的说法</u>。</b><b>⚠ <u>但通常你会希望你的回答按某种特定的方式被格式化。所以你可能也想有一组 SFT 对，去做你想要的那种映射。这就是为什么你通常有这两组 SFT 对</u>。</b><br><b>★★★ 而他接着补的那个细节，是这一条最值得记的地方</b>：<b>「<u>如果我说得更精确一点：第二组对不只是把 JSON 响应映射到最终回答，它实际上串起了到目前为止的整段对话历史 —— 这样它才知道最初的 query 是某人在找一只泰迪熊，知道发生过一次工具调用，也知道那些结果对应的是那次工具调用。所以它的输入会稍微长一些</u>。」</b><br><b>⇒ 想清楚为什么必须这样：<u>光给模型一段 JSON，它不知道用户原本问的是什么，也就没法判断这段结果里哪一部分才是答案</u>。<u>上下文不是锦上添花，是这一步能做对的前提</u>。</b><br><b>⭐ 他还提到数据该怎么铺：<u>你要让例子有变化、能代表典型的用户分布</u>，而且可以变着花样（直接说位置、多轮对话中途才问，等等）。</b>");
  SUM(0,20,{h:"两组 SFT 对",k:"三阶段里有两段是 LLM 驱动的，所以要两组 SFT 对：<b>第一组（工具预测）</b> 输入函数定义 + 用户 query，输出该调哪个函数、参数填什么；<b>第二组（最终回答）</b> 输出你想要的格式的自然语言。",m:"⚠ 为什么要第二组（Shervine 先替学生提了反对）：LLM 确实会把结构化数据说成人话，<b>但你通常希望回答按某种特定方式格式化</b>。",w:"★★★ 最该记的细节：第二组对的输入<b>不只是 JSON，而是「到目前为止的整段对话历史」</b> —— 这样它才知道最初的 query 是什么、发生过一次工具调用、结果对应哪次调用。⇒ 光给一段 JSON，模型<b>不知道用户原本问的是什么</b>，也就没法判断哪部分才是答案。",r:"★ 「上下文不是锦上添花，是这一步能做对的前提」这条很通用：你把中间结果交给下一个组件时，<b>光传结果不传「为什么要这个结果」，下游就只能猜</b>。⇒ 你的搜索里若有多个阶段（候选生成 → 剪枝 → 复核），每一阶段都该带上足以解释上一阶段决策的信息。"});
  QUIZ(0,20,{t:"第二组 SFT 对的输入为什么不只是函数返回的 JSON？",o:["因为 JSON 格式不稳定","因为要串起到目前为止的整段对话历史 —— 否则模型不知道用户原本问的是什么，也就没法判断结果里哪部分才是答案","因为 JSON 太长","因为要做数据增强"],a:1,w:"★ 「上下文不是锦上添花，是这一步能做对的前提」—— 把中间结果交给下游时，光传结果不传「为什么要这个结果」，下游就只能猜。"});

  note("★ 学生先提了 few-shot：可行、也是常见做法，⚠ 但泛化是个问题",640,386,"y");},"<b>这一条是 Shervine 给的另一条路，而它的推理起点是一个很实在的观察。</b><br><b>观察</b>：<b><u>如今 LLM 的推理能力越来越强，而它们在预训练和初始指令微调阶段训的数据，典型地就包含这类代码数据。所以到最后，它们非常擅长摆弄 Python 代码</u>。</b><b>⇒ <u>所以你可能会问自己：我真的需要教模型怎么把一个 query 映射到一个函数调用吗？</u></b><br><b>★ 他的结论</b>：<b>「<u>这是个很有意思的观察。而如今你会看到，你可以放弃专门的 SFT 训练，只靠「说明」来绕过它 —— 不是写 SFT 然后重训模型，而是可以把它替换成只有一段 explanation</u>。」</b><br><b>⇒ 然后他把问题抛给学生：<u>假设我有一个新工具、有 API，我想让模型用它。你会怎么做？</u></b><br><b>学生的答案一：few-shot learning。</b><b><u>就在上下文窗口里给几组输入/输出的样例</u>。</b><b>★ Shervine 的回应很有分寸：<u>这是个很好的点，你当然可以这么做，而且这通常也是一种被接受的做法</u>。</b><b>⚠ <u>但如果我告诉你，few-shot learning 在泛化上是有挑战的呢？因为你得给出具体的输入/输出点，所以它可能适配了某些情形，而不见得能泛化到整个人类语言的跨度</u>。</b><br><b>学生的答案二：让它做推理。</b><b>⇒ 这就引到了下一镜：<u>写一段让它去推理的说明</u>。而最有意思的部分，是「这段说明该怎么写」。</b>");

  note("⇒ 问它：按现在这版说明，结果是这样 —— 你会怎么改才能让评测变好",640,288,"d");
  note("★ Shervine：我不建议你端到端地自己写，最多写个草稿",640,326,"y");
  note("⇒ 让一个逻辑很强的模型替你写；实践中效果会让你吃惊",640,364,"g");},"<b>这一镜是整条 tool calling 线里我认为最可迁移的一个技巧，而 Shervine 的建议非常直接。</b><br><b>先说难点</b>：<b><u>写一段「让它做推理」而且写得说得通的 prompt，是非常难的。所以在实践中你不会自己写</u>。</b><br><b>★★ 他的办法</b>：<b><u>你会把那些 SFT 对拿来 —— 它们就是你想要强制的那些行为 —— 然后把它们当作一个评测集用。你可以说：好，如果我问这个问题，我想要那个工具调用。于是你有一组对</u>。</b><b>⇒ <u>然后你拿你目前手上的那版说明去跑，用这些 prompt 在评测集上评一遍。于是你有一些赢的、一些输的 —— 比如「在巴黎找一只熊」效果不好，另一些 prompt 效果好。于是你有一张「每个样本配一个分数」的清单</u>。</b><br><b>⇒ <u>然后你把它喂回给一个模型（通常是推理模型），让它替你去写这段说明</u>。</b><b>具体就是问它：<u>嘿，用现在这版 prompt，我们得到的是这些结果。你会改什么，才能让评测结果更好？</u></b><br><b>★★★ 他的结论和建议</b>：<b><u>通过这个过程你就对这段详细说明做了一轮迭代。而如果你看实践中的结果，你会对它替你写得有多好感到吃惊</u>。</b><b>⇒ <u>所以这里的要点是：我不建议你端到端地自己写。也许写个草稿，然后让某个逻辑知识非常好的强模型替你做</u>。</b><br><b>⚠ 最后一个澄清很重要，学生问了「这是训练还是推理？」</b><b>答：<u>是训练。你在最开头做这件事，离线地迭代这段说明；然后在推理时，你把这段固定的说明连同函数 API 一起放进去，这样对任何 query 它都知道该做什么</u>。</b>");
  SUM(0,21,{h:"⭐ 用 explanation 代替 SFT",k:"观察：如今模型在预训练/指令微调里本来就吃了大量<b>代码数据</b>，很会摆弄 Python ⇒ 可以<b>放弃专门的 SFT 训练，只给它一段 explanation（说明）</b>。⚠ few-shot 也可行、是常见做法，但<b>泛化是个问题</b>（具体样例未必覆盖整个语言跨度）。",m:"★★ 这段说明怎么来：<b>把 SFT 对当评测集</b> → 拿当前这版说明去跑 → 逐条打分（哪些赢哪些输）→ <b>喂给一个推理模型</b>，问它「按现在这版说明结果是这样，你会怎么改才能让评测变好」。",w:"★ Shervine 的建议：<b>我不建议你端到端地自己写，最多写个草稿</b>，让一个逻辑很强的模型替你做 —— 实践中效果会让你吃惊。⚠ 澄清：这<b>是训练阶段</b>的事（离线迭代出一段固定说明），推理时把它连同函数 API 一起放进去。",r:"★★★ 这个闭环直接可用：<b>把你想要的行为写成评测集 → 跑当前配置 → 把「每个样本的得分」连同配置一起交给一个强模型 → 让它提出改法 → 再跑</b>。⇒ 你的搜索超参、剪枝阈值、启发式规则都能这样自动迭代，而关键前提是<b>你先有一个能自动打分的评测集</b> —— 这又回到「可验证」那条优势。"});
  QUIZ(0,21,{t:"Shervine 建议怎么写那段让 LLM 会用工具的 explanation？",o:["用 few-shot 样例替代说明","直接复制官方文档","别自己端到端写（最多写草稿）：把 SFT 对当评测集跑一遍打分，再把结果喂给一个推理模型，让它提出改法并迭代","端到端手写，反复打磨"],a:2,w:"⚠ few-shot 也可行且常见，但泛化是个问题。而这个闭环的关键前提是：你先有一个能自动打分的评测集。另外澄清一下，这是训练阶段离线做的事。"});
});
KP("22 · 工具能干什么：三类用途",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("82:06","you can take actions on behalf of the user");
  note("Shervine 列的三类，而第三类才是真正的分水岭",640,186,"v");
  stack(330,204,[["① 信息类 informational","g"],["搜索、天气、股价…","d"],["⇒ 补上知识截止那个缺口","d"],["② 计算类 computation","b"],["把 query 变成代码、执行、读回答案","d"]],460,32,6);
  stack(950,204,[["③ ⭐ 行动类 action","r"],["替用户去「做事」","d"],["比如一个发邮件的工具","d"],["模型填好收件人与正文","d"],["⚠ 甚至替你按下「发送」","r"]],460,32,6);},"<b>工具能干的事分三类，而我想请你特别留意第三类 —— 它和前两类的性质完全不同。</b><br><b>① 信息类。</b><b><u>泰迪熊那个例子就属于这一类：你有一个问题，你想问某个外部 API 把它取回来</u>。</b><b>⇒ Shervine 举的例子：<u>你有知识截止日期，而你问 LLM 今天的新闻 —— 那你通常不会有任何来自模型本身的东西，你会有一个 API 从一个叫 Search 的工具里把它取回来</u>。</b><b>这一类还包括<u>天气、股价</u>等等。</b><br><b>② 计算类。</b><b><u>如果你想让模型替你做一些计算 —— 你可以让模型靠推理链自己算出来，但绕过它的一个办法是：把 query 变成代码、执行那段代码，然后把答案读出来</u>。</b><b>⇒ <u>所以 tool call 在计算这一块有一整片应用</u>。</b><br><b>★★★ ③ 行动类。</b><b><u>你可以代表用户去采取行动。比如你有一个发邮件的工具，你可以让模型替你发一封邮件 —— 它可以把该填的东西填进邮件头和正文，甚至替你按下发送，因为你的工具 API 里有那个和外部世界交互的组件</u>。</b><br><b>⇒ 请看清这三类的递进：<u>① 读外部状态；② 算（纯函数，无副作用）；③ 改变外部状态</u>。</b><b>⚠ 前两类出错的后果是「答案不对」，<u>第三类出错的后果是「世界被改坏了」</u>。</b><b>⇒ 这正是本讲最后要专门讲安全的原因，而那一条会回到这里。</b><br><b>⭐ Shervine 自己的评价：<u>这些只是几个例子，但我想说 tool calling 这个领域太强大了 —— 你想做什么都行</u>。</b>");
  SUM(0,22,{h:"工具的三类用途",k:"① <b>信息类</b>（搜索、天气、股价）—— 补上知识截止那个缺口；② <b>计算类</b> —— 把 query 变成代码、执行、读回答案；③ ⭐ <b>行动类</b> —— 替用户做事（比如发邮件：填好收件人正文，甚至替你按发送）。",m:"⇒ 三类是递进的：<b>① 读外部状态；② 算（纯函数，无副作用）；③ 改变外部状态</b>。",w:"⚠ 这个递进的要害：<b>前两类出错只是「答案不对」，第三类出错是「世界被改坏了」</b>。这正是本讲最后要专门讲安全的原因。Shervine 的评价：tool calling 这个领域太强大了，你想做什么都行。",r:"★ 把你的系统里的操作也按这三类分一遍：<b>读（查询求解器状态）、算（评估一个配置）、写（真的去部署/下发配置）</b>。⇒ 只有第三类需要确认、审计与回滚；把它和前两类混在同一个接口里，是让一个研究原型变得危险的最常见方式。"});
  QUIZ(0,22,{t:"工具的三类用途里，为什么「行动类」性质不同？",o:["它最费算力","前两类是读和算（出错只是答案不对），行动类会改变外部状态（出错是世界被改坏了）","它只能用 Python 实现","它需要更长的上下文"],a:1,w:"⇒ 这正是本讲最后要专门讲安全的原因。把「读/算/写」分开，只对「写」做确认、审计与回滚。"});
});

  note("★ 还有第五条：每家 LLM 定义工具的方式可能都不一样 ⇒ 要重复实现",640,386,"y");},"<b>这一条是 Shervine 自己提出来、再让学生找问题的，而问题的根子正好回到这一讲开头。</b><br><b>现实的设定</b>：<b><u>实践中你不会只有一个工具 API 在上下文里，你会有好几个 —— 因为你的 LLM 不只是一个「找熊的 LLM」。你可能还想用它做别的事：抱一只泰迪熊、查泰迪熊的心情、给泰迪熊送礼物，等等</u>。</b><b>⇒ <u>所以你有很多可能相关的函数要加进 preamble。而就因为你不知道哪个函数会被用到，你只能全放上去，以防万一</u>。</b><br><b>⚠ 问题一与问题二</b>：<b>学生指出「那是很多工具」，Shervine 说你说得对：<u>如果你的工具太多，你就会碰到 Afshine 在开头提过的那个「大海捞针」问题 —— 某个工具 API 会在上下文里丢掉，你并不真的知道该用哪个。你可能还会有一堆互相冲突的 API</u>。</b><b>⇒ ⭐ 注意这一讲的两半在这里<u>合上了</u>：上半场讲 RAG 时说的那个毛病，在下半场以另一种形式又出现了一次。</b><br><b>⚠ 问题三</b>：<b><u>如果你想支持这么多情形，你可能最后在每一样上都只是平庸</u>。</b><br><b>⚠ 问题四</b>：<b><u>就算那不是问题，你的上下文窗口还是有限的。假设你有上亿用户在用你的 LLM、想用它做很多事 —— 你没法一次支持所有人的用例，就因为你不可能把那么多工具塞进上下文</u>。</b><br><b>⚠ 问题五</b>：<b><u>我刚才说的这些工具，是我手写的。而每个 LLM 可能都有自己定义和使用工具的方式</u>。</b><b>⇒ 这一条引出 MCP，后面会讲。</b>");

  note("⇒ 出处是 Google DeepMind 的一篇技术论文",640,384,"d");},"<b>工具太多怎么办？Shervine 引了一篇论文给的办法，而这个办法的形状你刚刚才见过。</b><br><b>做法</b>：<b><u>我这里要引一篇 Google DeepMind 的技术论文，它用了一个 tool selector（工具选择器）系统。它分两步</u>。</b><br><b>第一步</b>：<b><u>你有你的 query，还有一份工具清单 —— 这份清单想多大都行。而这份清单里只包含 API 的名字、也许再加一两个词说明它是干什么的。于是你把这个 prompt 和这份工具清单一起，请 LLM 挑出那些可能相关的工具</u>。</b><b>⇒ <u>这就是为什么那篇技术论文把这个系统叫 tool selector。你在文献里还会看到 router（路由器）这个词被说出来 —— tool selection 和 routing 是相近的概念</u>。</b><b>★ <u>目的是把工具的数量限制到「可能有用的那些」</u>。</b><br><b>第二步</b>：<b><u>你把选中的那些工具 API 拿过来，只把那些连同你的 query 一起喂进上下文</u>。</b><br><b>★★★ 请注意这和上半场检索的结构是<u>同一个</u></b>：<b><u>第一级用极便宜的信息（只有名字和一两个词）做粗筛，第二级才把完整的东西（完整 API + 文档）拿出来用</u>。</b><b>⇒ 连理由都一样：<u>第一级面对的量大，所以每项上只能花很少的「预算」（这里是 token）</u>。</b><br><b>⭐ 而学生当场问了一个很好的问题：<u>那这不就是 RAG 吗？</u></b><b>Shervine 的回答很坦率：<u>你可以用 RAG 来做，这是个很好的点。但它不一定非得是。你也可以就让一个 LLM 来干这活 —— 只是挑出对的工具，你给它一些指令让它输出正确的答案。你当然完全可以用 RAG 做，这确实是个很好的点</u>。</b>");
  SUM(0,24,{h:"⭐ tool selection / router",k:"出处是 Google DeepMind 的一篇技术论文。两步：① query + 一份<b>工具清单</b>（每个工具只有 <b>API 名字 + 一两个词</b>），请 LLM 挑出可能相关的；② 只把<b>选中的 API</b> 连同 query 喂进上下文。这个系统叫 <b>tool selector</b>，文献里也叫 <b>router</b>。",m:"★★★ 这和上半场检索的结构是<b>同一个</b>：第一级用极便宜的信息（名字 + 一两个词）粗筛，第二级才把完整的东西（完整 API + 文档）拿出来用。连理由都一样 —— 第一级面对的量大，每项上只能花很少的预算（这里是 token）。",w:"⭐ 学生当场问「那这不就是 RAG 吗」，Shervine 很坦率：<b>你可以用 RAG 做，但不一定非得是</b> —— 也可以就让一个 LLM 挑。⇒ 两者形状相同、实现可以不同。",r:"★ 「<b>两阶段</b>」在这一讲里出现了两次（文档检索、工具选择），这说明它不是某个领域的技巧，而是<b>「候选多 + 评估贵」时的通用解</b>。⇒ 你的课题正是这个形状，所以这个模式该是你的默认骨架，而不是备选方案之一。"});
  QUIZ(0,24,{t:"tool selector 的第一步为什么只给「API 名字 + 一两个词」？",o:["为了保护实现细节","因为 LLM 读不懂完整文档","因为论文规定如此","因为这是两阶段结构的第一级：面对的量大，每项上只能花很少的 token 预算 —— 和文档检索的第一级同理"],a:3,w:"★ 「两阶段」在这一讲出现了两次（文档检索、工具选择），说明它是「候选多 + 评估贵」时的通用解，不是某个领域的技巧。"});
});
KP("25 · MCP：把「工具怎么暴露给模型」标准化",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("89:35","it is called a model context protocol");
  note("要解决的问题：每个 LLM 定义工具的方式可能都不一样 ⇒ 重复实现",640,186,"v");
  boxNode(130,212,1020,40,"MCP = Model Context Protocol，来自 Anthropic，是一个「协议」","g");
  note("MCP server：提供工具的那个实例",330,282,"d");
  note("tools：你想让别人用的那些函数的实现",330,312,"d");
  note("prompts：告诉用户怎么用这些工具的模板",950,282,"d");
  note("resources：可以用来完成任务的外部数据库",950,312,"d");
  note("★ 而一个 MCP server 与 LLM 宿主里的 MCP client 是一对一连接",640,364,"y");},"<b>这一条处理的是上一条的第五个问题：标准化。</b><br><b>问题</b>：<b><u>正如我提到的，每一个工具实现 —— 你指定工具实现的方式 —— 可能是为某个特定 LLM 量身定做的。而你不会想要这样，因为那意味着对每一个 LLM，你可能都得把这些工具一遍又一遍地重新实现。而重复不是你想要的</u>。</b><br><b>★ 解法</b>：<b><u>这就是为什么有一个标准叫 MCP —— 我知道很多人在谈它。它来自 Anthropic 团队，它把「工具怎么暴露给模型」这件事标准化了。所以它是一个协议，叫 model context protocol</u>。</b><br><b>它的词汇表</b>：<b><u>MCP server：提供工具的那个实例。tools：你想让人们使用的那些函数的实现。prompts：可以向用户展示「怎么用这些工具」的模板。而所有这些都可以锚定在 resources 上 —— 那是你可以用来完成任务的外部数据库</u>。</b><br><b>⇒ <u>而一个 MCP server 被使用时，和你 LLM 宿主里的一个基础设施组件是一对一连接的，那个组件叫 MCP client</u>。</b><b>Shervine 说这些<u>也许只是基础设施细节</u>。</b><br><b>★★ 他给的那个具体例子很好记</b>：<b><u>我们知道泰迪熊喜欢读诗。那么要给泰迪熊推荐一本诗集，你可以想象一个提供「和书有关的工具」的 MCP server。你的 LLM 宿主 —— 既然 MCP 来自 Anthropic，就拿 Claude 当例子 —— Claude 就是宿主；而 MCP server 很可能由图书供应商来实现，因为他们通常是「提供这类内容」最专业的。那么这个图书供应商的 MCP server 就会有「找书」「推荐书」这类工具；prompts 可以是「怎么找某个书名」「怎么按某种口味推荐」的模板；而 resources 的例子可以是泰迪熊的私人藏书，或者大家买得最多的书</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("讲者完整走了一遍的例子：给爱读诗的泰迪熊推荐一本诗集",640,186,"v");
  stack(330,204,[["LLM 宿主 = Claude","v"],["（因为 MCP 出自 Anthropic）","d"],["MCP server = 图书供应商来实现","g"],["⇒ 因为他们最懂这类内容","y"],["tools = 找书 / 推荐书","b"]],460,32,6);
  stack(950,204,[["prompts = 用法模板","b"],["「怎么按书名找」","d"],["「怎么按口味推荐」","d"],["resources = 外部数据","g"],["泰迪熊的私人藏书 / 畅销书榜","d"]],460,32,6);},"<b>MCP 那四个名词单看有点抽象，而讲者用一个例子把它们各就各位，很值得跟一遍。</b><br><b>场景</b>：<b><u>我们知道泰迪熊喜欢读诗。那么在「给泰迪熊推荐一本诗集」这件事上，你可以想象一个提供「和书有关的工具」的 MCP server</u>。</b><br><b><u>LLM 宿主</u></b>：<b><u>既然 MCP 出自 Anthropic，就拿 Claude 当例子 —— Claude 就是你的 LLM host</u>。</b><br><b><u>MCP server</u></b>：<b><u>很可能由图书供应商来实现</u>。</b><b>★ 而讲者给的理由值得记：<u>因为他们通常是「提供这类内容」最专业的那一方</u>。</b><br><b><u>tools</u></b>：<b><u>我们可以假设这个图书供应商的 MCP server 有「找书」「推荐书」这类工具</u>。</b><br><b><u>prompts</u></b>：<b><u>这里可以是一些展示「怎么找某个书名」「怎么按某种口味（比如按用户的品味）去推荐」的模板</u>。</b><br><b><u>resources</u></b>：<b><u>一些例子可以是泰迪熊的私人藏书，或者大家买得最多的书</u>。</b><br><b>★★ 我想请你注意这个分工背后的判断，它比协议本身更有普遍性</b>：<b><u>最懂某类内容的那一方去实现那一类工具，而不是让宿主方去猜</u>。</b><br><b>⇒ 这也解释了 MCP 为什么是个「协议」而不是一个库：<u>它要让两边各自独立演进 —— 图书供应商改他们的工具、Anthropic 改他们的模型，而中间那层约定不动</u>。</b><b>⚠ 这正是上一镜那个问题（每个 LLM 定义工具的方式都不一样）的正解：<u>不是统一实现，而是统一接口</u>。</b>");
  SUM(0,25,{h:"MCP：Model Context Protocol",k:"要解决的问题：<b>每个 LLM 定义工具的方式可能都不一样</b>，那你就得为每个 LLM 把工具重新实现一遍。<b>MCP</b>（来自 <b>Anthropic</b>）是一个<b>协议</b>，把「工具怎么暴露给模型」标准化。",m:"词汇表：<b>MCP server</b>（提供工具的实例）· <b>tools</b>（函数的实现）· <b>prompts</b>（告诉用户怎么用这些工具的模板）· <b>resources</b>（可用来完成任务的外部数据库）。而一个 MCP server 与 LLM 宿主里的 <b>MCP client</b> 是一对一连接。",w:"★ 例子：给泰迪熊推荐诗集 ⇒ <b>Claude 是 LLM 宿主</b>，<b>图书供应商实现 MCP server</b>（因为他们最懂这类内容），tools 是「找书/推荐书」，prompts 是用法模板，resources 可以是泰迪熊的私人藏书或畅销书榜。",r:"注意这个分工的合理性：<b>最懂某类内容的人去实现那类工具</b>，而不是让宿主方去猜。⇒ 你若把搜索框架做成可复用的，接口应该让领域专家（知道约束和代价怎么算的人）去填，而框架只负责调度 —— 这比框架内置一堆领域假设更可能被别人用起来。"});
  QUIZ(0,25,{t:"MCP 要解决的是什么问题？",o:["工具调用太慢","上下文窗口太小","工具的安全性无法保证","每个 LLM 定义和使用工具的方式可能都不一样 ⇒ 要为每个 LLM 重复实现工具；MCP 是一个协议，把「工具怎么暴露给模型」标准化"],a:3,w:"词汇表：MCP server（提供工具）、tools（函数实现）、prompts（用法模板）、resources（外部数据库），server 与宿主里的 MCP client 一对一连接。"});
});
KP("26 · ★★ agent：比工具多了「循环」和「推理」",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("92:25","a system that autonomously pursues goal and completes tasks on a user's behalf");
  note("Shervine 说这是今天最让人兴奋的部分",640,186,"v");
  boxNode(130,212,1020,40,"agent 的定义：一个「自主追求目标、替用户完成任务」的系统","g");
  note("和工具比，多了什么？",640,282,"d");
  note("⭐ 不只是能执行任务，里面还「包含推理」",640,312,"y");
  note("⇒ 所以你可以有「多轮迭代的循环」—— 这就是 agent 与 tool 的分界",640,350,"g");
  note("★ 人们说 agent 时，通常就是指那个「递归 / 更高层推理」被内建了进去",640,382,"d");},"<b>Shervine 说这是「今天这一讲可能最激动人心的部分」，而他照例先给定义。</b><br><b>定义</b>：<b>「<u>我先给一个定义，好让我们对 agent 在这里指什么达成一致：它是一个「自主地追求目标、并代表用户完成任务」的系统</u>。」</b><br><b>★★ 和工具的区别，他说得很干脆</b>：<b><u>相比工具，你不只是能执行任务，你里面还牵涉到一些推理。所以你可以有多轮的迭代循环。而这就是在朴素的说法上，agent 和 tool 的区别</u>。</b><b>⇒ <u>人们谈 agent 的时候，通常就把那种递归性、或者说更高层次的推理，内建在里面了</u>。</b><br><b>★ 他还澄清了一个关系</b>：<b><u>这个新的 agentic 框架，和我们之前讲的那些并不是不相交的。你完全可以在里面有推理链。所以它们是可能重叠的。但它的结构由「工具调用」加「迭代」组成</u>。</b><br><b>⇒ 所以这三讲的东西在这里叠起来了</b>：<b><u>L6 的推理链（想）+ L7 上半场的检索（读）+ L7 下半场的工具（做）+ 一个把它们串起来的循环 = agent</u>。</b><br><b>⚠ 我建议你抓住「<u>循环</u>」这个词，因为它是真正的分水岭</b>：<b>工具调用是<u>一次性</u>的（填参数 → 执行 → 转述，完）；<u>而 agent 会根据执行结果决定「还要不要再来一轮」</u>。</b><b>⇒ 这意味着它的行为长度<u>不是事先确定的</u>，而这既是它强大的来源，也是它危险和难调的来源（本讲最后会回到这一点）。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("93:43","a hallmark paper called ReAct");
  note("ReAct = reason + act，把一个复杂目标拆成能原子完成的小步循环",640,186,"v");
  stack(640,210,[["observe 观察：把用户的话翻译成「可操作的表述」","g"],["plan 计划：说清「现在要确定/改变的是什么」","b"],["act 行动：调用上下文里那些工具 API","y"],["⇒ 拿到结果后回到 observe ⇒ 循环，直到目标达成才退出","v"]],960,34,8);
  note("⚠ 讲者提醒：名字和顺序不是死的（ReAct 原文用的是 think / observe / act）",640,386,"r");},"<b>ReAct 是这一块的标志性论文，而 Shervine 把它讲成了一个非常具体的循环。</b><br><b>它解决什么</b>：<b><u>很多时候当你有一个 query、想追求一个目标，你没法一次做完。你需要以某种方式把目标分解成可执行的子步骤，执行每一步，然后给出答案。而这正是 ReAct 讲的事 —— 把复杂任务分解成「能原子地完成的那些事」的循环</u>。</b><br><b>⚠ 他特意打了个预防针</b>：<b><u>我们把这些步骤分成 observe、plan、act。但它不一定非得这么叫、也不一定非得是这个顺序。比如 ReAct 那篇论文我记得引入的是 think、observe、act。你会看到语言从一篇论文到另一篇在变，但高层的直觉是不变的</u>。</b><br><b>★★ 他给的例子（泰迪熊怕冷）把循环走了两轮，很值得完整跟一遍</b>：<br><b>输入：<u>我的泰迪熊冷了，请做点什么</u>。</b><br><b><u>observe</u>：把用户的话翻译成可操作的表述 —— <u>用户的泰迪熊冷，这可能是因为房间当前的温度，而那个温度目前是未知的</u>。⇒ 于是你一下就知道<u>你得对「温度」做点什么</u>。</b><br><b><u>plan</u>：<u>那个「某件事」是未知的，你得去找出来 ⇒ 要确定房间的温度</u>。</b><b><u>act</u>：<u>而幸运的是你的工具里可能就有这么一个 —— get current room temperature，调它</u>。</b><br><b><u>回到 observe</u>：<u>房间温度是 65 华氏度，比预期的冷</u>。⇒ <u>plan</u>：<u>那我得把温度调高</u>。⇒ <u>act</u>：<u>调用那个能把温度调高的函数</u>。</b><br><b>⇒ <u>最后 observe 判定温度已经设对了，这时就可以退出循环、把回答返回给用户：我们把温度调高了 5 度</u>。</b><br><b>★ 他的总结：<u>我描述的那个循环里的东西，就是让一个 workflow 成为 agentic 的原因 —— 每一步 LLM 都在看「目标达到了没有」，到了就输出，没到就再来一轮</u>。</b>");
  SUM(0,26,{h:"★★ agent 与 ReAct 循环",k:"<b>agent 的定义</b>：一个「<b>自主追求目标、代表用户完成任务</b>」的系统。和工具比多了什么？<b>里面还包含推理 ⇒ 可以有多轮迭代的循环</b> —— 这就是 agent 与 tool 的分界。",m:"<b>ReAct</b>（reason + act）：把复杂任务分解成能原子完成的小步循环。<b>observe</b>（把用户的话翻译成可操作的表述）→ <b>plan</b>（说清现在要确定/改变什么）→ <b>act</b>（调工具）→ 拿到结果回到 observe，<b>直到目标达成才退出</b>。⚠ 名字和顺序不是死的（ReAct 原文是 think / observe / act）。",w:"★ 抓住「<b>循环</b>」这个词：工具调用是<b>一次性</b>的（填参数→执行→转述，完），而 agent 会<b>根据执行结果决定还要不要再来一轮</b>。⇒ 它的行为长度<b>不是事先确定的</b> —— 这既是它强大的来源，也是它危险和难调的来源。",r:"★★★ ReAct 的循环就是你的搜索循环：<b>observe = 读当前部分配置与已知约束；plan = 决定下一个要定的分量；act = 调求解器/评估器；再 observe</b>。⇒ 而「每一步都检查目标达到了没有」正是你的终止与剪枝判据所在的位置。这个对应让 agent 文献里的工程经验（循环发散、预算控制）可以直接搬给你用。"});
  QUIZ(0,26,{t:"agent 和 tool calling 的分界是什么？",o:["agent 里包含推理、因而有「多轮迭代的循环」，会根据执行结果决定还要不要再来一轮；工具调用是一次性的","agent 不需要函数 API","agent 用的模型更大","agent 只能用 MCP"],a:0,w:"⇒ 所以 agent 的行为长度不是事先确定的 —— 这既是它强大的来源，也是它危险和难调的来源（最后一条会回到这点）。"});
});

  note("★ A2A 要你定义两样：这个 agent 有哪些 skills，以及它怎么「执行」一个请求",640,364,"y");},"<b>把 agent 再推一步：不止一个。而这立刻带出一个和 MCP 同构的需求。</b><br><b>场景</b>：<b><u>你可以设想远不止一个 agent。你可以有一个 agent 负责设恒温器；但也许在你家里，你还想管理能耗怎么分配，或者空气质量（如果你有相关设置可以调）。所以你可以有不同的 agent。而一个有意思的用例是：用户对某一个 agent 说话，然后它们之间可能全都互相通信</u>。</b><br><b>★ 于是需求出现了</b>：<b><u>这就促成了对「agent 之间通信」也要标准化的需求，就像我们在 LLM 宿主和工具之间看到的那样。而这正是促使 Google 在今年早些时候发布 Agent2Agent 协议的原因</u>。</b><br><b>协议要你定义什么</b>：<b><u>它对「一个 agent 能暴露什么」做了标准化。它通常会暴露一组 skills（技能）—— 也就是它能做的事 —— 并且给出一些例子，好让别的 agent 知道它能干什么。而作为开发者，你要做的就是定义这些 skills</u>。</b><br><b>★★ 还有一件事他特意点了出来，而我觉得这一点比 skills 更有意思</b>：<b><u>另一个关键的事情，是定义「这个 agent 怎么执行一个给定的请求」。比如当你执行一个 query 时，你向别的 agent 发出什么状态？另外还有一个 cancel 方法 —— 比如某个 agent 说「停下你正在做的事」，那取消一个动作的流程是什么？这些就是 Agent2Agent 协议要求人们填写的主要函数之一</u>。</b><br><b>⇒ 请注意 <u>cancel</u> 这一项的分量：<u>它承认了「agent 会做长时间、可中断的事」</u>。一个只会一次性回答的系统不需要 cancel。</b><br><b>⭐ 学生还问了「每个 agent 都是一个带上下文的 LLM 吗」：<u>你完全可以这么设想，我举的例子里就是。而这些 agent 是独立运行的，它们有自己的推理循环；它们之间互相看到的只有输入和输出</u>。</b>");
  SUM(0,27,{h:"A2A：agent 之间的协议",k:"场景：不止一个 agent（一个管恒温器、一个管能耗分配…），用户对一个说话，它们之间互相通信 ⇒ 需要标准化，就像 LLM 宿主与工具之间需要 MCP。这就是 Google 今年发布的 <b>Agent2Agent（A2A）协议</b>。",m:"A2A 要你定义两样：① 这个 agent 暴露哪些 <b>skills</b>（能做什么，还要给例子让别的 agent 知道）；② ⭐ 它<b>怎么执行一个请求</b> —— 执行时向别的 agent 发什么<b>状态</b>，以及 <b>cancel</b>（别的 agent 说「停下」时，取消一个动作的流程是什么）。",w:"★ <b>cancel 这一项的分量</b>：它承认了「agent 会做长时间、可中断的事」—— 一个只会一次性回答的系统根本不需要 cancel。⭐ 另外：每个 agent <b>独立运行、有自己的推理循环</b>，彼此只看到输入和输出。",r:"★ 「状态 + cancel」正是你的分布式/并行搜索需要的那两样：<b>长时间运行的分支要能报进度，也要能被叫停</b>（比如上界已被别的分支改进到使它不可能更优）。⇒ 把「可中断」当成接口的一部分来设计，而不是事后加的补丁。"});
  QUIZ(0,27,{t:"A2A 协议里的 cancel 方法说明了什么？",o:["用户经常改主意","它承认了「agent 会做长时间、可中断的事」—— 一个只会一次性回答的系统根本不需要 cancel","agent 容易崩溃","agent 之间会互相冲突"],a:1,w:"A2A 要定义的两样是 skills（能做什么）和「怎么执行一个请求」（发什么状态 + 怎么取消）。而每个 agent 独立运行、有自己的推理循环，彼此只看到输入输出。"});
});
KP("28 · ⚠ 安全，以及收尾的几条实务忠告",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("102:48","data exfiltration");
  note("⚠ 新能力带来一整串新问题 —— 因为模型现在能「替你执行动作」",640,186,"r");
  boxNode(70,214,520,44,"例子：数据外泄 data exfiltration","r");
  note("假设有个能把数据写到公开可见处的工具（比如邮件 agent）",330,284,"d");
  note("⇒ 一个 prompt 让它「把我的密码写进邮件发到某地址」",330,314,"r");
  boxNode(690,214,520,44,"两类防线","g");
  note("训练期：数据混合里就带上安全（SFT 与 RL 的 harmlessness）",950,284,"g");
  note("推理期：安全分类器看整段对话，判断输出安不安全",950,314,"g");
  note("★ 还有 agent safety bench 这类基准，专门汇总可能的安全风险",640,364,"y");},"<b>安全这一段 Shervine 讲得很重，而他的理由很直接：<u>这些能力是新的，而伴随新能力来的是一整串新的潜在问题</u>。</b><br><b>风险的根源</b>：<b><u>你已经看到这些模型现在有替你执行动作的能力。所以你可以想象某个有害的行为者去做一些你不希望发生在你身上的事</u>。</b><br><b>★ 他给的那个例子很具体</b>：<b><u>data exfiltration（数据外泄）。假设你有一个能把数据以公开可见的方式写出去的工具 —— 比如某个邮件 agent。那么如果有一个 prompt 说「把我的密码（工具可能有权限拿到）写进一封邮件、发到那个地址」，你就可能把属于用户的数据泄露出去</u>。</b><b>⇒ 他还给了一篇论文（tool sort）汇总别的安全风险，推荐一读。</b><br><b>★★ 两类补救措施</b>：<b>① <u>训练阶段</u>：<u>如果你回想 R1 或别的模型的训练流程，里面有那些 harmlessness 的成分 —— 你通常在 SFT 和强化学习的数据混合里就有覆盖安全的数据。这是你能补救这些问题的地方</u>。</b><b>⇒ ⭐ 这正好接上 L6 里那条：<u>R1 的 harmlessness 奖励作用在全部输出 token 上，包括 think 段</u>。</b><b>② <u>推理阶段</u>：<u>假设一个 query 穿过了你训练期的那些防线。你还可以有推理期的安全护栏 —— 比如一个安全分类器，它看到目前为止的整段对话，判断 LLM 的输出会不会是安全的</u>。</b><br><b>⇒ 他还提了 <u>agent safety bench</u>：<u>它总结了可能的安全隐患的跨度，并提供了一整套基准，人们可以参照它来判断自己的 LLM 安不安全</u>。</b><br><b>⚠ 而他举了一个就发生在课前的例子：<u>就在昨天，Anthropic 披露他们是一次大规模网络攻击的受害者，而那次攻击是从 Claude 发起的 —— 它同样用到了工具和 agentic 能力。他们发表了一份非常详细的报告，一步步说明攻击者做了什么，以及可能的补救路线</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("107:51","start small and then start smart");
  note("收尾：Shervine 给的几条实务忠告",640,186,"v");
  stack(640,210,[["⚠ 最大的技术风险：循环里任何一步都可能「岔到走不通的地方」","r"],["① start small：先挑一个很简单的用例跑通（比如「找最近的熊」）","g"],["② start smart：先用最强的模型，摸清能力的上限在哪","g"],["③ 再去优化延迟、成本这些 —— 先对，再小，再快","y"]],960,34,8);
  note("★ 调试的抓手：这些 LLM 会输出推理链 —— 一定要去看，才知道哪里出错",640,386,"y");},"<b>最后几条忠告，而第一条其实是一个很重要的技术判断。</b><br><b>⚠ 最大的风险</b>：<b><u>当你谈 agent 时，你有这样一个风险：在你思考流程的每一步，你都可能岔到某个根本行不通的地方。那是个巨大的问题 —— 比如模型没有正确地锚定输出，或者在工具调用的参数预测上犯了个错</u>。</b><b>★ 而他由此给出的那个论断很有分量：<u>这就是为什么你现在没看到大规模的 agent 统治世界 —— 因为我们确实被这些后果限制着</u>。</b><b>⇒ 想一下为什么：<u>如果每一步有 95% 的正确率，十步下来就只剩 60%。循环越长，这个乘积衰减得越狠</u>。</b><br><b>实务忠告</b>：<b>① <u>永远从小处开始，从一个非常简单的情形开始</u>，比如「找最近的熊」。<u>先看看你现在的实现和 prompt 能不能跑通，再从那里往前走</u>。</b><b>② <u>start small, then start smart</u>：<u>先拿最有能力的模型，这样你就知道以现在的模型能走到哪、天花板在哪；然后再去争取延迟、能力这些方面的改善</u>。</b><b>⇒ <u>先对、先小，之后你才能去优化</u>。</b><br><b>★★ 调试的抓手</b>：<b><u>说到可调试性：这些 LLM 会输出推理链。所以去看它们总是好的 —— 这样你能看出哪里出了问题</u>。</b><br><b>⇒ 最后他以自己最喜欢的用例收尾：<u>AI 辅助写代码</u>。但他加了一句很重的提醒：<b><u>请务必学好代码的基本功、知道怎么把代码写对，因为从现在起，最要紧的是你的品味。生成代码是便宜的，而判断一段代码对不对、做的是不是正确的事 —— 那才是难的部分</u>。</b></b>");
  SUM(0,28,{h:"⚠ 安全与实务忠告",k:"风险的根源：<b>模型现在能替你执行动作</b>。例子 <b>data exfiltration</b>：有个能把数据写到公开处的工具（邮件 agent），一个 prompt 让它「把密码写进邮件发到某地址」就能把用户数据泄露出去。",m:"<b>两类防线</b>：① <b>训练期</b> —— SFT 与 RL 的数据混合里就带安全数据（⇒ 接上 L6：R1 的 harmlessness 奖励作用在<b>全部输出 token</b>，含 think 段）；② <b>推理期</b> —— 安全分类器看整段对话判断输出安不安全。还有 <b>agent safety bench</b> 这类基准。⚠ 课前一天 Anthropic 刚披露一次从 Claude 发起的大规模网络攻击，并发了详细报告。",w:"★ 最大的技术风险：<b>循环里任何一步都可能岔到行不通的地方</b> —— 这正是「现在没看到大规模 agent 统治世界」的原因（每步 95% 正确，十步只剩 60%）。忠告：<b>start small</b>（先跑通一个极简用例）、<b>start smart</b>（先用最强模型摸清天花板），<b>先对、再小、再快</b>。调试抓手是<b>去看推理链</b>。",r:"★★ 「每步 95%，十步剩 60%」这条直接是你的风险模型：<b>搜索路径越长，中途一步判错导致整条路作废的概率越高</b>。⇒ 所以剪枝判据的单步错误率必须按路径长度来折算，而不是单看它自己好不好。而「start smart：先用最强的配置摸清天花板，再去优化成本」是极好的实验顺序 —— <b>先知道上限在哪，才知道省下来的代价值不值</b>。"});
  QUIZ(0,28,{t:"为什么 Shervine 说「现在还没看到大规模 agent 统治世界」？",o:["算力不够","缺少统一协议","循环里任何一步都可能岔到行不通的地方（锚定错、参数预测错）—— 每步 95% 正确的话十步只剩 60%","安全法规还没跟上"],a:2,w:"⇒ 他的忠告：start small（先跑通极简用例）、start smart（先用最强模型摸清天花板），先对再小再快；调试抓手是去看推理链。"});
});
KP("完 · 两阶段，和那一个「可能作用于」",
function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L7 · 完","把 LLM 接到外部世界",
      "读 · 算 · 写 · 以及一个反复出现的结构");},
    "收一下这一讲。<b>它修了两条弱点，而我想按「一个结构 + 一个字眼 + 三条对你的用处」来收。</b><br><br><b>★★★ 一个结构：两阶段。</b><span class='k'>这一讲里它<b>独立出现了两次</b> —— <u>文档检索</u>（bi-encoder 粗筛 → cross-encoder 重排）和<u>工具选择</u>（只给名字粗选 → 再放完整 API）。而它的逻辑每次都一样：<b>量级大的那一级只能用便宜判据 ⇒ 它的指标必须是 recall（漏掉的，后面永远救不回来）；量级小的那一级才负担得起昂贵判据 ⇒ 它负责精度</b>。</span><br><span class='k'>⇒ 两个推论值得单独记：<b>① 两类错误的代价不对称 —— 第一级「多留了无关的」可被修正，「漏掉了相关的」不可逆 ⇒ 第一级的参数该往松调。② 整条流水线的上限由第一级定 ⇒ 调优先看第一级的 recall，它不高时优化第二级是白费。</b></span><br><span class='w'>⚠ 而这个结构<b>不是某人的巧思</b>：bi-encoder 能预计算所以便宜但看不到交互，cross-encoder 看得到交互但什么都不能预算 —— <b>两阶段是被这两种结构各自的约束逼出来的唯一解</b>。</span><br><br><b>★★ 一个字眼：「并可能作用于」。</b><span class='k'>tool calling 的定义里这几个字，就是它和 RAG 的根本区别：<b>RAG 只能读，tool calling 可以写</b>。而工具的三类用途正好是递进的 —— <u>① 读外部状态；② 算（纯函数、无副作用）；③ 改变外部状态</u>。<b>前两类出错只是「答案不对」，第三类出错是「世界被改坏了」</b>。</span><br><span class='w'>⇒ 这就是为什么最后要专门讲安全，而讲者举的例子<b>就发生在课前一天</b>（Anthropic 披露的那次从 Claude 发起的大规模攻击）。两类防线：<b>训练期</b>（SFT 与 RL 数据混合里的 harmlessness，接上 L6 那条「作用在全部输出 token、含 think 段」）与<b>推理期</b>（安全分类器看整段对话）。</span><br><br><b>★★★ 对你的课题，这一讲我认为有三条能直接用。</b><br><span class='w'><b>① 两阶段就是你的骨架，而且它给了你一个硬要求。</b><u>dominance 剪枝 / 便宜代理 = 第一级；精确求解器复核 top-k = 第二级</u>。而「第一级犯漏的错不可逆」这句话的形式化版本，正是<b>你的剪枝判据必须是可采纳的（admissible）</b>。⇒ 实验里该<b>单独报第一级的 recall</b>（被剪掉的分支里事后发现含最优解的比例），它定了整个方法的上限 —— 只报最终解的质量，是看不出这一层的。</span><br><span class='w'><b>② ReAct 的循环就是你的搜索循环。</b><u>observe = 读当前部分配置与已知约束；plan = 决定下一个要定的分量；act = 调求解器或评估器；再回到 observe</u>。而「<b>每一步都检查目标达成了没有</b>」正是你的终止与剪枝判据所在的位置。⇒ 这个对应让 agent 那边的工程经验直接可用，尤其是那条风险模型：<b>每步 95% 正确，十步只剩 60%</b> —— 所以<u>剪枝判据的单步错误率必须按路径长度折算</u>，而不是单看它自己好不好。</span><br><span class='w'><b>③ ⭐ 那个「让模型替你迭代说明」的闭环。</b><u>把你想要的行为写成评测集 → 跑当前这版配置 → 逐条打分 → 把「配置 + 每个样本的得分」一起交给一个强模型，问它「你会怎么改才能让评测变好」→ 再跑</u>。Shervine 说<b>我不建议你端到端地自己写</b>。⇒ 你的搜索超参、剪枝阈值、启发式规则都能这样自动迭代，而<b>关键前提是你先有一个能自动打分的评测集</b> —— 这又回到你和这一讲共有的那个幸运：<u>可验证</u>。</span><br><br><b>⇒ 另外三条小而实用的</b>：<b>① <u>prompt caching</u> 是「把一个架构事实（因果注意力 ⇒ 相同前缀相同激活）直接变成省钱策略」的范例 —— 对应你搜索里<u>共享的部分配置只该评估一次</u>；② <u>docstring 是模型的唯一输入</u>，不是给人看的注释 —— 对应你暴露给策略的接口说明；③ <u>start small, start smart</u>：先跑通一个极简用例，再用最强的配置摸清天花板，最后才去优化成本。<b>先知道上限在哪，才知道省下来的代价值不值。</b></b><br><br><b>⇒ 下一讲 L8 是 LLM Evaluation，修清单上的最后一条（自由文本难评估）。</b>");
});
