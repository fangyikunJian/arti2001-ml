<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>

.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}

.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;

    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}

  go(0);
}

  return x0+vals.length*(bw+gap)-gap;}

/* ── 一棵两层的搜索树（画 beam search / 贪心）── */
function tree(rootx,rooty,kids,dy,bw,bh){
  var i,n=kids.length,span=190,x0=rootx-(n-1)*span/2;
  boxNode(rootx-bw/2,rooty,bw,bh,"BOS","y");

    link(rootx,rooty+bh,x,rooty+dy);
    note(kids[i][2]||"",x,rooty+dy+bh+20,kids[i][1]||"d");}
  return x0;}

    "<b>三块的地图，而我建议你带着不同的问题去看每一块。</b><br><b>① MoE 那一块，带的问题是：<u>怎么在「参数更多」和「算得更慢」之间解耦？</u></b><span class='w'>这两件事通常绑在一起 —— 参数多就算得慢。而 MoE 的全部意义就是把它们拆开。</span><br><b>② 解码那一块，带的问题是：<u>给定一个打分函数，怎么从一个指数大的空间里挑出一条好的路径？</u></b><b>⭐ 这个问法你应该立刻觉得眼熟 —— 它就是搜索问题的标准形式。</b><br><span class='w'>而且这一块会出现三个你在搜索文献里见过的东西：贪心、束搜索（beam search 就是受限宽度的广度优先）、以及随机化。</span><br><b>③ 效率那一块，带的问题是：<u>哪些计算是重复的、哪些可以近似、哪些可以并行？</u></b><span class='w'>讲者自己把这一块分成了「精确」与「近似」两类，而这个分法很干净。</span><br><b>⚠ 一个提醒：这一讲的缩写密度是全课最高的（MoE、FLOPS、ICL、CoT、KV、GQA、MLA…）。</b><b>按第一讲那个建议 —— 每个缩写都当场落实成「它到底指哪个具体东西」，别让它们堆成一团。</b>");

KP("1 · 回顾：三类模型，以及 LLM 站在哪一类",function(){

  note("⇒ 而下一镜用参数量把这个答案算实",640,374,"d");},"<b>讲者把这个问题抛给了全班，而这个提问方式本身值得学：<u>他没有直接给答案，而是先给判据</u>。</b><br><b>decoder 里只有三个地方可以放</b>：<b>掩码自注意力层、前馈网络（FFN）、归一化。</b><br><b>他的判据</b>：<b>「哪里是网络里最复杂的部分？哪里有大量的运算？」</b><br><b>学生答：Feedforward。讲者说：对，很好的回答。</b><br><b>⭐ 为什么这个判据是对的？想一想 MoE 在做什么</b>：<b>它让你<u>多准备几份</u>某个组件，然后每次只用其中一份。</b><b>⇒ 那显然应该多准备<u>最贵</u>的那个组件 —— 复制一个便宜的组件，省不下什么。</b><br><b>⚠ 而且还有一层：MoE 省的是「不用算的那部分」。<u>如果这个组件本来就只占总计算的 5%，那你最多省 5%</u>。</b><br><b>⇒ 所以必须放在占大头的地方。下一镜用参数量把这件事算实 —— 而那个计算很值得自己跟一遍。</b>");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("17:23","the DFF is typically larger than your dimension");
  setEq("$$\\text{FFN}\\approx 2\\,d_{\\text{model}}\\, d_{\\text{ff}} \\qquad\\text{vs}\\qquad \\text{注意力的投影}\\approx d_{\\text{model}}\\,(d_q+d_k+d_v)$$");
  note("d_model 约 10² ~ 10³    d_ff 约 10³ ~ 10⁴（比 d_model 还大）",640,196,"y");
  note("而注意力里每个投影的维度「典型低得多」—— 100 的量级",640,228,"g");
  note("⇒ FFN 的参数量压倒性地大 ⇒ MoE 就放在这里",640,260,"r");},"<b>把「FFN 最贵」这件事算实，而这个计算只需要两个量级。</b><br><b>FFN 的形状（第一讲讲过）</b>：<b>输入是 d_model 维 → 投到 d_ff 维 → 再投回 d_model 维。</b><b>⚠ 而关键是：<u>d_ff 比 d_model 还大</u>（第二讲专门对比过，和 Word2vec 的瓶颈正好相反）。</b><br><b>⇒ 参数量约为 d_model × d_ff × 2（两个矩阵）再加偏置。</b><br><b>注意力层的参数</b>：<b>就是那些投影矩阵 —— d_model 乘上 query / key / value 各自的维度。</b><b>⭐ 而讲者说：<u>这个维度典型地低得多，想成 100 的量级</u>。</b><br><b>两个量级摆出来</b>：<b>d_model 是 10² ~ 10³；d_ff 是 10³ ~ 10⁴。</b><br><b>⇒ FFN 的参数量压倒性地大。<u>所以 MoE 就放在 FFN 的位置上</u>。</b><br><b>★★ 于是前面那个悬而未决的问题也有答案了：<u>「专家」到底是什么？——<u>专家就是前馈网络</u>。</b><b>你会有好几个可以训练的前馈网络，但每次只激活其中一个（k 通常等于 1，也可以是 2）。</b><br><b>⭐ 把这件事串起来看很舒服：问「放哪里」→ 给判据「哪里最贵」→ 用参数量验证 → 顺带回答了「专家是什么」。四步，没有一步是靠记忆的。</b>");
  SUM(0,6,{h:"MoE 放在 FFN：因为那里参数量压倒性地大",k:"三个候选位置（掩码自注意力 / FFN / 归一化）里，<b>FFN 最贵</b>：参数约 2·d_model·d_ff，而 <b>d_ff 比 d_model 还大</b>（10³~10⁴ vs 10²~10³）；注意力的投影维度「典型低得多」。",m:"⭐ 判据的逻辑：MoE 是「多准备几份、每次只用一份」⇒ 应该复制<b>最贵</b>的组件；而且<b>省的上限就是那个组件占的比例</b>，放在只占 5% 的地方最多省 5%。",w:"⇒ 顺带回答了前面悬而未决的问题：<b>「专家」就是前馈网络</b>。有好几个可训练的 FFN，每次只激活 k 个（通常 1，也可以 2）。",r:"⭐ 这一段的讲法值得学：<b>问「放哪」→ 给判据「哪里最贵」→ 用数量级验证 → 顺带回答了别的问题</b>。四步没有一步靠记忆。做优化决策时照这个顺序走。"});
  QUIZ(0,6,{t:"MoE 为什么放在 FFN 而不是注意力层？",o:["因为注意力层已经有多头了","因为 FFN 更容易训练","因为注意力层不能并行","因为 FFN 的参数量压倒性地大（d_ff 比 d_model 还大），而 MoE 省的上限就是该组件占的比例"],a:3,w:"讲者先给判据「哪里运算量最大」，再用参数量级验证：d_model 是 10²~10³，d_ff 是 10³~10⁴。顺带回答了「专家是什么」—— 专家就是前馈网络。"});
});
KP("7 · 路由发生在 token 级，而且每层各有一个",function(){

  says("19:39","this routing would be done at the token level");

  note("同一句话里，每个 token 可以走向不同的专家",640,374,"g");},"<b>路由的粒度常被想错，所以单独一镜说清：<u>路由是按 token 做的，不是按句子</u>。</b><br><b>讲者的说法</b>：<b>decoder 的输入是一堆 token；而每一个 token 都会被一个<u>可能和别人不同</u>的专家处理。</b><b>路由器拿这个 token 的表示作为输入，判断它该流向哪个专家。</b><br><b>⭐ 注意「token 的表示」这个说法 —— 它指的是<u>过完自注意力之后</u>的那个表示。</b><b>讲者在后面回答学生时专门确认过：路由发生在<u>自注意力层之后</u>。</b><br><b>⇒ 这一点很要紧：到了这里，这个 token 已经是<u>上下文感知</u>的了（它看过了前面所有 token）。</b><b>所以路由器看到的不是「这个词是什么」，而是「这个词在这个语境下是什么」。</b><br><b>⚠ 一个自然的疑问：那注意力的多个头怎么办，是不是每个头各有一个路由？</b><b>讲者回答：<u>不是，只有一个路由器</u>。</b><b>因为多头在注意力层末尾就已经被<u>拼接起来、再投影回 d_model 空间</u>了 —— 到 FFN 这里只有一个向量。</b><b>⇒ 「专家的数量和注意力头的数量是互相独立的两件事。」</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("33:59","the G is just layer specific");
  note("每一层有自己的路由器，而且权重不共享",640,190,"v");
  var i,L=["第 1 层","第 2 层","第 3 层"],E=["专家 3","专家 1","专家 2"];
  for(i=0;i<3;i++){
    boxNode(260,212+i*58,280,44,L[i],"b");
    boxNode(640,212+i*58,200,44,"G"+(i+1),"y");
    boxNode(900,212+i*58,280,44,E[i],"g");
    link(540,234+i*58,640,234+i*58); link(840,234+i*58,900,234+i*58);}
  note("⇒ 同一个 token 在第 1 层去专家 3、第 2 层可能去专家 1 —— 完全是学出来的",640,386,"d");},"<b>第二个容易想错的地方：<u>路由器不是全局只有一个，而是每层一个</u>。</b><br><b>学生问「是不是每个块都有一组专家」，讲者答：<u>是的，而且这些权重通常不共享</u>。</b><b>他举的例子很具体：很可能第 1 层选的是 3 号专家，而第 2 层选的是 1 号 —— 「这完全是训练出来的」。</b><br><b>另一个学生追问「是不是有不同的 G」，讲者的回答是：<u>G 是层特有的</u>（layer specific）。</b><b>第一层一个 G，第二层另一个 G，依此类推，而且都要训练。</b><br><b>⭐ 把这两条合起来，MoE 的实际形状就清楚了</b>：<b>一个 L 层的模型，有 <u>L 个独立的路由器</u>和 <u>L×n 个专家</u>（每层 n 个）。</b><b>⇒ 这解释了为什么 MoE 模型的总参数量能涨到万亿量级。</b><br><b>⚠ 而「谁去哪个专家」这件事没有任何人为设计，全部由门控的可训练权重决定。</b><b>讲者说：一切都由 gates 决定，而它有可训练的权重 —— 你可以把它想成从输入 x 到一个 n 维空间的投影（n 是专家数），然后过 softmax。</b><br><b>⇒ 所以路由器本身极简单：<u>一个线性层加一个 softmax</u>。复杂的不是它的结构，是怎么让它别坍塌 —— 下一个知识点。</b>");
  SUM(0,7,{h:"路由按 token 做，每层一个路由器",k:"路由是<b>按 token</b>而不是按句子；路由器发生在<b>自注意力之后</b>，所以它看到的是<b>上下文感知</b>的表示。每层有<b>自己的</b>路由器，权重不共享。",m:"路由器本身极简单：<b>一个线性层 + softmax</b>（投到 n 维，n = 专家数）。一个 L 层模型有 L 个路由器、L×n 个专家 ⇒ 这就是总参数能到万亿的原因。",w:"⚠ 两个常见误解：① 不是每个注意力头各有一个路由 —— <b>只有一个</b>（多头在层末已拼接并投回 d_model）；② 专家数与注意力头数<b>互相独立</b>。",r:"⭐ 「在上下文感知之后再做路由」这个顺序值得注意：决策依据是<b>交互后</b>的表示而非原始特征。你的剪枝若基于「这个选项本身的属性」而非「它在当前部分解语境下的属性」，就丢掉了同样的信息。"});

});
KP("8 · 路由坍塌：让所有专家都有活干",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("21:13","this problem is called routing collapse");
  note("训练 MoE 的主要难处",640,190,"y");
  bars(200,320,[0.95,0.9,0.05,0.04,0.03,0.05],110,120,["r","r","d","d","d","d"],
       ["专家1","专家2","专家3","专家4","专家5","专家6"]);
  note("⚠ 路由器总是挑同样那一两个，其余的「从不参与计算」",640,364,"r");
  note("⇒ 你花钱存了 6 个专家，实际只用了 2 个",640,386,"d");},"<b>MoE 最主要的训练难题，而且它的名字很形象。</b><br><b>问题</b>：<b>训练这些模型时，要<u>确保所有专家都被用上</u>。</b><b>因为很可能训着训着，只有一两个专家总是被激活，而其它的<u>从来不参与计算</u>。</b><br><b>这个问题叫 <u>routing collapse</u>（路由坍塌）。</b><b>讲者解释名字：因为路由器总是选某些专家，而不选另一些。</b><br><b>⭐ 为什么这是灾难？因为它把 MoE 的全部好处抵消掉了</b>：<b>你付出了「存 n 个专家」的显存代价，却只得到「用 k 个专家」的能力 —— 而那 n−k 个纯属浪费。</b><br><b>⚠ 而且它还有自我强化的性质（讲者没说，补的）：<u>被选中的专家会得到更多训练 ⇒ 变得更好 ⇒ 于是更容易被选中</u>。</b><b>⇒ 这是一个正反馈，所以不会自己恢复 —— 必须外加一个力把它掰回来。</b><br><b>⭐ 这个「富者愈富」的结构你应该很熟：它和赌博机里「只探索已知最好的臂、从不试别的」是<u>同一个</u>毛病。</b><b>⇒ 而对策的形状也是同一类：<u>给不被选中的那些加一点人为的倾斜</u>。</b>");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("22:29","f of I is the fraction of tokens that are routed to expert I");
  setEq("$$\\mathcal{L}_{\\text{total}}=\\mathcal{L}+\\alpha\\, n \\sum_{i=1}^{n} f_i\\, P_i$$");
  note("f_i = 被路由到专家 i 的 token 占比    P_i = 专家 i 的平均路由概率",640,196,"d");
  note("⭐ 这一项的作用：把这两个量都往「均匀分布」推",640,228,"g");
  note("⚠ 讲者说不必完全看懂公式 —— 要带走的只有「它逼出均匀」这一句",640,260,"y");},"<b>对策是改损失函数，加一个额外项。而讲者对这一页的态度很值得学。</b><br><b>公式</b>：<b>原损失 + α·n·Σ f_i·P_i。</b><b>其中 f_i 是被路由到专家 i 的 token <u>占比</u>，P_i 是专家 i 的<u>平均路由概率</u>。</b><br><b>★★ 讲者明说：「你不必完全理解这个公式具体怎么运作。<u>这一页你该带走的唯一一件事</u>是 —— 这个额外的损失让这些量更趋向于<u>均匀分布</u>。」</b><br><b>⭐ 这种「明确告诉学生哪部分不必深究」的做法很好，值得你在读论文时也学着用：<u>区分「必须懂的结论」和「可以先放过的推导」</u>。</b><br><b>⚠ 不过为什么这一项能逼出均匀，补一句直觉：f_i 和 P_i 都是「专家 i 有多受宠」的度量。</b><b>两者<u>相乘再求和</u>，这个量在分布<u>越集中</u>时越大、<u>越均匀</u>时越小。</b><b>⇒ 所以把它加进要<u>最小化</u>的损失里，就等于在惩罚集中。</b><br><b>⚠ 课堂上有人问这个式子怎么求导（f_i 是个计数占比，看起来不可微）。讲者很坦率：<u>「我现在想不出一个好答案，但我觉得人们有一些技巧；而且这些天你根本不用自己做这件事，框架里是内置的。」</u></b><b>他接着把能说清的那一半说清了：P_i 是门控输出的平均，<u>这一个是干净可微的</u>。</b><br><b>⭐ 这是一个很诚实的回答方式 —— 把「我确定的」和「我不确定的」分开讲。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("24:28","it's called noisy gating");
  boxNode(130,214,460,46,"做法二：noisy gating（带噪门控）","g");
  note("在门控的打分上加一点随机噪声",360,286,"d");
  note("⇒ 纯靠运气，别的专家也有机会被选中",360,322,"g");
  boxNode(700,214,460,46,"和 Dropout 是同一类想法","y");
  note("学生问能不能用 Dropout，讲者：当然可以",930,286,"d");
  note("「你总是可以把它和别的技巧捆在一起用」",930,322,"d");
  note("⭐ 两条对策的共同形状：给「没被选中的」人为加一点机会",640,374,"v");},"<b>第二种对策，比改损失更朴素：<u>在门控的输出上加噪声</u>。</b><br><b>讲者的说法</b>：<b>noisy gating（带噪门控）—— 你有门控给出的预测，然后往上面加一些噪声。</b><b>这样「<u>纯靠运气</u>，就能让别的专家也参与到计算里来」。</b><br><b>⚠ 学生问能不能用 Dropout，讲者说：当然可以 —— 你总是可以把它和别的技巧捆在一起用。</b><b>他还说人们发现这类做法「很有帮助」。</b><br><b>★★ 把两条对策放在一起，共同的形状就出来了：<u>给「没被选中的那些」人为地加一点机会</u>。</b><br><b>⭐ 而这正是探索-利用那一套的标准动作</b>：<b>辅助损失相当于「硬性要求你雨露均沾」；noisy gating 相当于 <u>ε-贪心</u> —— 以一定随机性偏离当前最优。</b><br><b>⇒ 对你的课题，这一条可以直接搬：<u>任何「按学出来的分数选择」的机制，都要问一句「不被选中的那些会不会永远得不到数据」</u>。</b><b>⚠ 而如果答案是「会」，那就必然需要某种形式的强制探索 —— 要么在目标里加均衡项，要么在选择时加噪。</b>");
  SUM(0,8,{h:"路由坍塌：富者愈富，必须外力掰回来",k:"<b>routing collapse</b>：路由器总挑同样那一两个专家，其余从不参与 ⇒ 存了 n 个只用了 k 个。两条对策：<b>辅助损失</b>（逼 f_i、P_i 趋向均匀）与 <b>noisy gating</b>（门控打分上加噪）。",m:"⚠ 它会<b>自我强化</b>（补的）：被选中 ⇒ 得到更多训练 ⇒ 更好 ⇒ 更容易被选中。正反馈 ⇒ 不会自愈，必须外加力。f_i 与 P_i 相乘求和，分布越集中该值越大 ⇒ 最小化它就是惩罚集中。",w:"⚠ 讲者明说「不必完全看懂公式，带走『它逼出均匀』就够」；问到 f_i 怎么求导时他坦率承认想不出好答案、只把能说清的 P_i 说清。<b>把确定的与不确定的分开讲</b>。",r:"⭐ 可直接搬的自查：<b>任何「按学出来的分数做选择」的机制，都要问「不被选中的那些会不会永远得不到数据」</b>。会的话就必然需要强制探索（均衡项或加噪）—— 这与 ε-贪心同构。"});
  QUIZ(0,8,{t:"路由坍塌为什么不会自己恢复？",o:["因为路由器的学习率太小","因为损失函数是非凸的","因为它自我强化：被选中 ⇒ 得到更多训练 ⇒ 变得更好 ⇒ 更容易被选中。是正反馈，必须外加力掰回来","因为专家之间不共享参数"],a:2,w:"这个「富者愈富」的结构与赌博机里「只利用已知最好的臂」是同一个毛病，所以对策形状也相同：给没被选中的人为加机会（辅助损失或 noisy gating）。"});
});
KP("9 · MoE 的真正卖点：扩容量而不扩激活参数",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("27:43","you can scale the model without having to incur the cost of having significantly more compute at inference time");
  boxNode(80,214,480,46,"总参数（容量）","b");
  note("可以一路涨到万亿量级",320,286,"g");
  note("Switch Transformer：1.6 万亿参数",320,322,"g");

KP("10 · ⭐ 换一个问题：拿到概率分布，怎么挑下一个词",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

       ["g","b","b","b","d","d","d"],["fluffy","gentle","kind","smart","big","airplane","…"]);
  note("⇒ 那怎么从这个分布里挑出下一个词？这是一个独立的问题",640,372,"v");},"<b>这一镜是整讲的转折点，而且它开启的是前两讲<u>完全没碰过</u>的一个维度。</b><br><b>讲者先把状态说清楚</b>：<b>给定一个（或一串）token 作为输入，你得到的是一个<u>输出概率分布</u> —— 它表示模型认为下一个 token 是 a、是 airplane、是 fluffy…… 各自的可能性。</b><br><b>⇒ 然后他把问题抛给全班：如果模型给出的是一个概率分布，你<u>怎么</u>据此挑出下一个 token？</b><br><b>学生答：取概率最大的那个。讲者：对，这是第一个想法。</b><br><b>★★ 为什么这一镜值得当成转折点？因为它把一件事剥了出来</b>：<b>⭐ <u>模型只负责给分布，怎么用分布是另一个完全独立的决策</u>。</b><br><b>⇒ 同一个模型，配不同的解码策略，会表现得像完全不同的系统 —— 有的死板、有的啰嗦、有的有创意。</b><br><b>⚠ 而这一点在实践中经常被误判：人们说「这个模型很有创意」或者「这个模型老是重复」，很多时候说的其实是<u>解码参数</u>，不是模型。</b><br><b>★ 对你来说，这一块是整讲最该花时间的部分，因为它整个是一个<u>搜索问题</u>：给定一个打分函数（这里是概率），从一个指数大的空间（所有可能的 token 序列）里挑出一条好的路径。</b><b>⇒ 接下来三个知识点就是三种搜索姿态。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("39:44","locally optimal, but you're not necessarily globally optimal");

  boxNode(80,216,470,44,"毛病一：完全确定，没有多样性","r");
  note("Transformer 里的计算全是确定的",315,284,"d");
  note("⇒ 同样的输入，永远给同样的输出",315,318,"d");
  note("而你用 ChatGPT 时，每次回答都略有不同",315,354,"y");
  boxNode(730,216,470,44,"毛病二：局部最优 ≠ 全局最优","r");
  note("每步都挑最大，不等于整条序列概率最大",965,284,"d");
  note("⇒ 下一镜用一个两步的例子算给你看",965,318,"g");},"<b>贪心解码（取概率最大）的两个毛病，而第二个是这一块的核心。</b><br><b>毛病一：没有多样性。</b><b>讲者的论证链很干净 —— Transformer 里的计算<u>全是确定的</u>；所以如果你总是挑概率最高的那个 token，<u>同样的输入就永远生成同样的东西</u>。</b><b>⇒ 可是你用 ChatGPT 或 Gemini 时，每次问同一个问题，回答都略有不同。</b><b>⇒ 所以它们显然不是在做贪心解码。</b><br><b>★★ 毛病二：局部最优不等于全局最优。</b><b>讲者说得很准确：我们的目标是产出一个<u>高概率的输出序列</u>；但如果你每一步都挑概率最高的 token，<u>你得到的未必是概率最高的序列</u>。</b><br><b>⇒ 然后他问全班：「你们信这句话吗？」—— 然后给了一个例子。</b><br><b>⭐ 这个问题的形式你应该立刻认出来：<u>这是搜索问题的最经典张力</u>。</b><b>每一步的局部最优选择，合起来未必是全局最优路径 —— 这正是为什么需要回溯、需要保留多条候选、需要剪枝判据必须是「安全」的。</b><br><b>⚠ 而 LLM 这里有一个额外的困难：<u>这个空间是指数大的</u>（词表 5 万、序列 100 步，就是 50000^100 条路径）。穷举绝无可能。</b><b>⇒ 所以所有方法都是某种形式的近似 —— 下面三种各有各的近似方式。</b>");
  SUM(0,10,{h:"解码问题：从分布到一句话，是独立的决策",k:"模型给的是<b>覆盖整个词表的概率分布</b>，不是一个词。<b>贪心解码</b>（取最大）有两个毛病：① <b>完全确定</b>没有多样性（Transformer 的计算全是确定的）② <b>局部最优 ≠ 全局最优</b>。",m:"⭐ 这一块整个是<b>搜索问题</b>：给定打分函数，从指数大的空间（词表 5 万、100 步就是 50000¹⁰⁰ 条路径）里挑一条好路径。穷举绝无可能 ⇒ 所有方法都是近似。",w:"⚠ 实践中常见的误判：说「这个模型很有创意/老是重复」，很多时候说的其实是<b>解码参数</b>，不是模型。同一个模型配不同解码策略会像完全不同的系统。",r:"⭐ 这正是你课题的核心张力的另一个版本：<b>每一步的局部最优合起来未必是全局最优</b> —— 这就是为什么需要回溯、保留多条候选、以及剪枝判据必须「安全」。"});
  QUIZ(0,10,{t:"贪心解码的两个毛病是什么？",o:["太慢；占显存太多","① 完全确定 ⇒ 同样输入永远同样输出，没有多样性 ② 每步挑最大 ≠ 整条序列概率最大（局部最优 ≠ 全局最优）","需要额外的超参；不可微","会漏掉低频词；无法处理长序列"],a:1,w:"讲者的论证：Transformer 的计算全是确定的 ⇒ 贪心就永远同样输出；而你用 ChatGPT 时每次回答都略有不同，所以它显然不是贪心。第二条是搜索问题的最经典张力。"});
});
KP("11 · beam search：保留 k 条路径",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("41:40","k, is sometimes called the beam size or the beam width");
  tree(640,192,[["the","g","p=0.5"],["a","g","p=0.4"],["my","d","p=0.1（丢掉）"]],82,150,42);
  note("k = 2 ⇒ 每一步只留「最有希望的两条路」",640,364,"y");
  note("k 也叫 beam size / beam width —— 就是保留几条路径",640,386,"d");},"<b>第二种解码策略：别只留一条路，留 k 条。</b><br><b>做法</b>：<b>从 BOS 开始，看下一个 token 的概率分布；取<u>最有可能的 k 个</u>，各自保留成一条分支。</b><b>第二步：对这 k 条分支<u>各自</u>算下一个 token 的概率，然后在所有组合里<u>再保留最有可能的 k 条</u>。</b><b>如此往复。</b><br><b>术语</b>：<b>k 有时叫 <u>beam size</u>，有时叫 <u>beam width</u> —— 讲者说「这些只是给『我们保留几条路径』起的名字」。</b><br><b>⭐ 而讲者给的「为什么」正是上一镜那个毛病</b>：<b>如果你只沿着概率最高的那个 token 走（比如 the），很可能 the 之后的最高概率，<u>比 a 之后的最高概率低得多</u>。</b><b>⇒ 于是整条路反而更差。</b><b>beam search 就是要往「更全局最优」的方向靠。</b><br><b>⚠ 注意讲者的措辞一直很小心：它是「更接近全局最优」，<u>不是</u>全局最优。</b><b>他后面明说：beam search「不是全局最优，但更朝那个方向」。</b><br><b>⇒ 这很对：保留 k 条仍然是<u>贪心</u>的 —— 只是贪心的宽度从 1 变成了 k。<u>被第 k+1 名淘汰掉的那条路，后面再好也回不来了</u>。</b><br><b>⭐ 这正是「束搜索」在搜索文献里的标准定位：<u>有界宽度的广度优先</u>，用内存换一点最优性，但不保证最优。</b>");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("43:51","they take the sum of the logarithm of the probabilities of the tokens");
  setEq("$$\\log P(y_{1:T})=\\sum_{t=1}^{T}\\log P(y_t \\mid y_{1:t-1}) \\qquad\\Longrightarrow\\qquad \\text{除以 } T^{\\alpha} \\text{ 做长度归一}$$");
  note("整条序列的概率 = 每一步概率的「连乘」⇒ 取对数变成「连加」",640,196,"d");
  note("⚠ 毛病：概率都小于 1 ⇒ 乘得越多越小 ⇒ 天然偏爱「短」序列",640,228,"r");
  note("⇒ 所以 beam search 要额外除一个长度项把这个偏置抵消掉",640,260,"g");},"<b>怎么比较两条长度不同的路径？这里有一个很实际的坑，而讲者专门指了出来。</b><br><b>打分方式</b>：<b>人们通常取<u>各步概率的对数之和</u>。</b><b>也就是：整条序列的对数概率 = log P(第一个词) + log P(第二个词 | 第一个) + ……</b><br><b>⚠ 而毛病在于：<u>你生成的 token 越多，整条序列的概率就越低</u>。</b><b>讲者的解释很直接：所有这些概率都在 0 和 1 之间；想成<u>连乘</u>的话 —— 你乘的小于 1 的数越多，这个量就越往 0 去。</b><br><b>⇒ 后果：<u>这个方法照原样用，会优先选短的序列</u>。</b><br><b>⇒ 对策：beam search 还有一个额外的项来抵消这个效应。讲者说「something on the order of 1 over 长度的某次方」—— 也就是除以 T^α 做长度归一化。</b><br><b>★★ 这个坑值得你记牢，因为它在你的课题里有一个完全对应的版本</b>：<br><b>⚠ <u>任何「把一串代价/概率累加或累乘」的打分，都天然对「步数少的解」有偏好</u>。</b><b>⇒ 如果你的搜索要在「不同长度的部分解」之间做比较，就必须问一句：<u>我这个分数对长度是公平的吗？</u></b><br><b>⭐ 而解法也是同一类：要么做长度归一化，要么比较时只在<u>同长度</u>的候选之间比。后者更干净，但不总是可行。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("46:19","beam search is actually not something that people typically use");
  boxNode(80,210,480,46,"为什么实践中不用它","r");

  note("② 它要的是「最可能的那条路」",320,316,"d");
  note("⚠ 而我们常常想要的是「多样」「有创意」",320,352,"y");
  boxNode(720,210,480,46,"那它用在哪？","g");
  note("机器翻译 —— 那里确实需要",960,282,"d");
  note("「非常接近最可能的那个答案」",960,316,"g");
  note("⇒ 任务的目标决定该用哪种解码",960,352,"v");},"<b>这是整个解码这一块最值得想的一个转折：<u>更接近全局最优的方法，实践中反而不用</u>。</b><br><b>讲者给了两条理由</b>：<br><b>① 算得贵</b>：<b>你得保存那些最可能的路径、做各种记录，「需要大量计算」。</b><br><b>★★ ② 更根本的那条：<u>我们要的根本不是「最可能的那条路」</u>。</b><b>讲者的原话：我们仍然在追求最可能的路径，这会得到一个模型认为「非常可能」的序列；<u>但有时候你想要的是输出更多样、更有创意</u>。</b><br><b>⇒ 所以 beam search 不是人们通常用的东西。</b><br><b>它用在哪？</b><b>讲者说：人们在<u>机器翻译</u>这类任务上用 beam search —— 因为那里你确实需要「非常接近最可能的那个东西」。</b><br><b>★★★ 把这个转折想透，它比任何具体算法都值钱</b>：<br><b>⭐ <u>「更优化目标函数」和「更有用」是两件事</u>。</b><b>当你把目标函数优化得更彻底时，你是在更忠实地执行那个目标 —— <u>前提是那个目标真的是你要的</u>。</b><br><b>⚠ 在 LLM 这里，「最可能的序列」常常是乏味的、重复的、甚至退化的（一直说同一句话的概率可以很高）。</b><b>⇒ 于是人们宁可要一个概率略低但实际更好的输出。</b><br><b>⇒ 对你的课题，这一问的版本是：<u>你的代理模型的最优，和真实目标的最优，差多远？</u></b><b>如果差得远，那把搜索做得更接近代理模型的最优，只是在更精确地走错路。</b>");
  SUM(0,11,{h:"beam search：保留 k 条，但实践中不用",k:"每步保留最有希望的 <b>k</b> 条路径（k 叫 beam size / beam width）。打分用<b>对数概率求和</b>，并<b>除以 T^α 做长度归一</b>（否则天然偏爱短序列）。",m:"⚠ 它<b>仍然是贪心的</b>，只是宽度从 1 变成 k —— 被第 k+1 名淘汰的路再好也回不来。标准定位：<b>有界宽度的广度优先</b>，用内存换一点最优性，不保证最优。",w:"★★ 实践中<b>不用</b>它，两条理由：① 算得贵 ② <b>我们要的根本不是「最可能的那条路」</b>（那常常乏味、重复）。只在机器翻译这类「确实需要最可能答案」的场合用。",r:"★★★ 最该带走的：<b>「更优化目标函数」≠「更有用」</b>。把搜索做得更接近<b>代理模型</b>的最优，若代理与真实目标差得远，只是在更精确地走错路。<br>⚠ 另一条直接可用：<b>累加/累乘的打分天然偏好步数少的解</b> —— 比较不同长度的部分解前，先问「我的分数对长度公平吗」。"});
  QUIZ(0,11,{t:"beam search 更接近全局最优，为什么实践中反而不用？",o:["① 算得贵；② 更根本的是我们要的根本不是「最可能的那条路」—— 那常常乏味重复，而人们想要多样和创意","因为它不可微","因为它只能用于短序列","因为它需要额外的超参 k"],a:0,w:"讲者说它只在机器翻译那种「确实需要非常接近最可能答案」的场合用。★★ 教训：更彻底地优化目标函数，前提是那个目标真的是你要的。"});
});
KP("12 · 采样，以及把长尾切掉：top-k 与 top-p",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("46:53","they just sample the next token using that probability distribution");
  note("第三种：直接按这个概率分布「抽」一个",640,190,"y");
  bars(230,320,[0.42,0.22,0.15,0.1,0.06,0.03,0.02],110,120,
       ["g","g","g","g","d","r","d"],["fluffy","gentle","kind","smart","big","airplane","…"]);
  note("fluffy 更容易被抽中，但 airplane 也有「非零」的机会",640,364,"d");
  note("⚠ 而这正是问题：那些极低概率的词理论上仍可能被抽出来",640,386,"r");},"<b>第三种，也是实际在用的那种：<u>按分布采样</u>。</b><br><b>做法</b>：<b>模型给了一个关于下一个 token 的概率分布，那就<u>直接用这个分布抽一个</u>。</b><br><b>⇒ fluffy、gentle、kind、smart 这些高概率的更容易被抽到；而 airplane 这种低概率的不容易 —— <u>但它的概率非零，所以仍有机会</u>。</b><br><b>⭐ 这一下就解决了贪心的第一个毛病：<u>有多样性了</u>。</b><b>同样的输入，每次抽到的可能不同 ⇒ 输出不同。</b><br><b>⚠ 但讲者立刻指出了新问题：那些<u>非常低概率</u>的 token，理论上仍然可能被采样出来 —— 而这「未必是我们想要的」。</b><br><b>⇒ 想一想为什么这是真问题：词表有几万个词，绝大多数在当前语境下都荒唐。</b><b>它们每个的概率都极小，<u>但加起来可能不小</u>。</b><b>⇒ 于是生成几百个 token，撞上一个荒唐词的概率就不可忽略了；而一个荒唐词会把后面整段话带偏。</b><br><b>⇒ 所以人们的做法是：<u>先把候选限制在高概率的那些里，再在里面采样</u>。下一镜两种限制法。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:16","their cumulative probability is more than a threshold p");
  boxNode(80,206,480,46,"top-k：固定「个数」","y");
  note("取概率最高的 k 个，只在它们里面采样",320,278,"d");
  note("例：k=4 ⇒ 只留前四个",320,312,"g");
  note("⚠ 分布很平时，k 个可能不够；很尖时，k 个又太多",320,350,"r");
  boxNode(720,206,480,46,"top-p：固定「累计概率」","g");
  note("从高到低累加，直到累计概率超过阈值 p 就停",960,278,"d");
  note("例：p=0.9 ⇒ 留到够 90% 为止",960,312,"g");
  note("⇒ 候选个数随分布形状自动伸缩",960,350,"v");},"<b>两种把长尾切掉的办法，想法相同，参数化方式不同。</b><br><b>top-k</b>：<b>讲者问了全班「听过这个词吗」，回答是「有一点」。</b><b>做法：选出概率最高的 <u>k</u> 个 token，然后只在它们里面采样。</b><b>「比如 k 等于 4，你就取最可能的四个，然后在它们之间抽。」</b><br><b>top-p</b>：<b>想法很相似 —— 你把自己限制在最高概率的那些 token 上，<u>使得它们的累计概率超过一个阈值 p</u>。</b><b>⇒ 从高到低累加，加到够 p（比如 0.9）为止，剩下的全切掉。</b><br><b>★★ 两者的差别值得想清楚，因为它决定了什么时候该用哪个（讲者没展开，补的）</b>：<br><b>⚠ top-k 固定的是<u>个数</u>。</b><b>如果分布很<u>平</u>（模型很不确定，几十个词都差不多可能），取 4 个就砍掉了太多合理选项；如果分布很<u>尖</u>（一个词占了 95%），取 4 个又把 3 个垃圾放了进来。</b><br><b>⭐ top-p 固定的是<u>累计概率</u>，所以候选个数会<u>随分布形状自动伸缩</u>：分布尖时只留一两个，分布平时留很多。</b><br><b>⇒ 这就是为什么实践中 top-p（也叫 nucleus sampling）更常见。</b><br><b>⚠ 注意这两个和温度是<u>互相独立</u>的旋钮，可以叠加使用 —— 温度改的是分布的<u>形状</u>，top-k/top-p 改的是<u>候选集</u>。</b>");
  SUM(0,12,{h:"采样 + 把长尾切掉：top-k 与 top-p",k:"<b>采样</b>：直接按分布抽 ⇒ 有多样性了。但极低概率的词理论上仍会被抽中 ⇒ 用 <b>top-k</b>（固定<b>个数</b>）或 <b>top-p</b>（固定<b>累计概率</b>）先把候选限制在高概率那些里。",m:"⭐ 差别（补的）：top-k 固定个数 ⇒ 分布平时砍太多、分布尖时放进垃圾；<b>top-p 的候选个数随分布形状自动伸缩</b> ⇒ 这就是实践中 top-p（nucleus sampling）更常见的原因。",w:"⚠ 长尾为什么是真问题：词表几万，每个荒唐词概率极小但<b>加起来不小</b>；生成几百个 token 撞上一个的概率不可忽略，而一个荒唐词会把后面整段带偏。",r:"两种限制候选集的方式对应两种剪枝风格：<b>固定保留个数</b>（beam 宽度）vs <b>固定保留「质量阈值」</b>（留住所有不比最优差 ε 的）。后者同样会随问题难度自动伸缩，通常更稳健。"});
  QUIZ(0,12,{t:"top-k 与 top-p 的关键差别是什么？",o:["top-k 用于训练，top-p 用于推理","top-k 更快","top-p 不需要排序","top-k 固定候选「个数」，top-p 固定「累计概率」⇒ top-p 的候选个数随分布形状自动伸缩"],a:3,w:"这一层讲者没展开，是补的。分布很平时 top-k 砍掉太多合理选项；很尖时又放进垃圾。这就是 top-p（nucleus sampling）实践中更常见的原因。"});
});
KP("13 · 温度：那个旋钮到底在拧什么",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("52:36","there is a hyperparameter that is quite important that I want to talk to you about, which is the temperature");
  setEq("$$P(y=w_i)=\\frac{\\exp(x_i/T)}{\\sum_j \\exp(x_j/T)}$$");
  note("概率是怎么来的：最后一层把 d_model 维投到「词表大小」维，再过 softmax",640,196,"d");
  note("⇒ 而 softmax 里多了一个 T —— 每个分数先除以它",640,228,"y");
  note("T 不改变「谁最大」，只改变「大多少」",640,260,"g");},"<b>先补上一个一直被跳过的问题：那些概率<u>本身</u>是怎么来的？</b><br><b>讲者说：在架构最顶上，你把 token 的编码嵌入过一个<u>线性层</u>，它把 d_model 维的向量投影到<u>词表大小</u>那一维的空间；然后过一个 <u>softmax</u>，把一切变成加起来等于 1 的概率。</b><br><b>⇒ 而 softmax 的式子里有一个超参 <u>T</u>，叫<u>温度</u>：每个分数 x_i 先<u>除以 T</u>，再取指数、再归一化。</b><br><b>⭐ 先说一个最容易建立的直觉：<u>T 不改变谁最大</u>。</b><b>因为除以一个正数不改变大小顺序。</b><b>⇒ 它改变的只是「最大的那个比别人大<u>多少</u>」。</b><br><b>⇒ T 小 ⇒ 分数之间的差距被<u>放大</u>（除以小数 = 乘以大数）⇒ 分布更<u>尖</u>。</b><br><b>⇒ T 大 ⇒ 差距被<u>压缩</u> ⇒ 分布更<u>平</u>。</b><br><b>⚠ 讲者问了全班「听说过采样里的温度吗」，有人听过。然后他说要给大家一个更好的理解 —— 下一镜是他在黑板上做的那个推导。</b>");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("55:21","low temperature will create a spiky distribution");
  setEq("$$\\frac{e^{x_i/T}}{\\sum_j e^{x_j/T}}=\\frac{e^{(x_i-x_k)/T}}{\\sum_j e^{(x_j-x_k)/T}} \\quad (k=\\arg\\max_i x_i)$$");
  note("技巧：分子分母同乘 e^{−x_k/T}，k 是最大那一项的下标",640,196,"d");
  note("于是指数全变成「非正数」：i=k 那项恰好是 0，其余都是负的",640,228,"g");
  note("⇒ T→0 时负项全部变成 e^{−∞}=0 ⇒ 只剩最大那一项 ⇒ 完全尖",640,260,"y");},"<b>讲者在黑板上现推了一遍，而这个推导只用一个技巧，值得跟一遍。</b><br><b>技巧：分子分母<u>同乘</u> e^(−x_k/T)，其中 k 是<u>最大</u>那一项的下标。</b><b>⇒ 分子分母同乘，值不变；但指数里全变成了「差」：x_i − x_k。</b><br><b>⭐ 现在看那些差的符号</b>：<b>当 i = k 时，差是 <u>0</u> —— 「它恰好是 0，<u>和温度无关</u>」。</b><b>当 i ≠ k 时，x_j − x_k <u>总是负的</u>（因为 x_k 最大）。</b><br><b>⇒ 于是整个式子变成：分子要么是 e^0 = 1（i=k），要么是 e^(负数/T)。</b><br><b>★★ 现在让 T → 0</b>：<b>「负数 / T」趋向<u>负无穷</u> ⇒ e^(负无穷) = <u>0</u>。</b><b>⇒ 分母只剩那个 1，分子也只有 k 那一项是 1，其余全是 0。</b><b>⇒ <u>完全尖</u>：最大的那个概率为 1，其余全为 0。</b><br><b>★★ 再让 T → ∞</b>：<b>「负数 / T」趋向 <u>0</u> ⇒ e^0 = 1 ⇒ 每一项都是 1。</b><b>⇒ 分母是「项数」n，每项都是 1/n。</b><b>⇒ <u>完全平</u>：词表上的均匀分布。</b><br><b>⭐ 这个推导的漂亮之处在于：它把「温度在干什么」从一个比喻变成了两行代数。</b><b>⚠ 而且它顺带说明了一件事 —— <u>T→0 的极限就是贪心解码</u>。所以贪心不是另一种方法，它是采样的一个端点。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("温度的两端，和该怎么选",640,186,"v");
  bars(150,316,[0.86,0.06,0.04,0.02,0.02],90,110,["g","d","d","d","d"],["","","","",""]);
  note("T 小 ⇒ 尖 ⇒ 更确定、更「高质量」",330,344,"g");
  bars(760,316,[0.24,0.21,0.2,0.18,0.17],90,110,["y","y","y","y","y"],["","","","",""]);
  note("T 大 ⇒ 平 ⇒ 更多样、更「有创意」",940,344,"y");
  note("⇒ 要写很有创意的东西 ⇒ 用高温；要稳、要可靠 ⇒ 用低温",640,382,"v");},"<b>把推导的结论落到实际使用上，讲者是用提问的方式带出来的。</b><br><b>他问：如果你想写一些<u>非常有创意</u>的东西，你会用低温还是高温？</b><b>学生答：高温。对。</b><br><b>⇒ 反过来：如果你想要更<u>确定</u>的、更接近「你认为高质量」的输出，就用更低的温度。</b><br><b>⭐ 讲者对高温的描述很具体：高温时「你会抽到一些<u>本来不会被抽到</u>的 token」。</b><b>⇒ 这就是「创意」的机制 —— 不是模型变聪明了，是采样允许它走冷门的路。</b><br><b>⚠ 而这也正是高温的风险：冷门的路里既有「有创意」，也有「不知所云」。<u>两者是同一个机制的两面，没法只要前者</u>。</b><br><b>★ 所以实践中温度和 top-p 常常<u>一起</u>用，而且分工清楚</b>：<b>top-p 先把明显荒唐的长尾切掉（守住下限），温度再在剩下的里面调节多样性（争取上限）。</b><br><b>⇒ 单用高温而不设 top-p，就是把长尾也一起放大了 —— 那才是真正会出乱子的配置。</b><br><b>⭐ 这个「一个机制守下限、另一个机制争上限」的搭配很值得记，它在你的搜索里也成立：<u>用硬约束（nogood / 可行性检查）守住绝不能碰的区域，用随机化在剩下的空间里争取多样性</u>。</b>");
  SUM(0,13,{h:"温度：改的是「大多少」，不是「谁最大」",k:"概率来自最后的 <b>线性层（投到词表维）+ softmax</b>，而 softmax 里每个分数先<b>除以 T</b>。T 不改变谁最大，只改变<b>大多少</b>：T 小 ⇒ 尖、确定；T 大 ⇒ 平、多样。",m:"⭐ 推导（讲者黑板现推）：分子分母同乘 e^(−x_k/T)（k 为最大项）⇒ 指数全成非正数，i=k 那项恰为 0。<b>T→0 其余项全变 0 ⇒ 完全尖（这就是贪心）</b>；<b>T→∞ 每项都是 1 ⇒ 均匀分布</b>。",w:"⚠ 高温的「创意」与「不知所云」是<b>同一个机制的两面</b>，没法只要前者。实践中温度与 top-p 搭配：<b>top-p 守下限（切长尾），温度争上限（调多样）</b>。",r:"⭐ 「一个机制守下限、另一个争上限」直接可搬：<b>用硬约束（nogood / 可行性检查）守住绝不能碰的区域，用随机化在剩下空间里争取多样性</b>。单靠随机化而不设硬约束，才是会出乱子的配置。"});
  QUIZ(0,13,{t:"温度 T → 0 时会发生什么？",o:["分布变成均匀分布","softmax 不再归一化","分布变成完全尖的：最大那项概率为 1、其余为 0 —— 也就是退化成贪心解码","所有概率都趋向 0"],a:2,w:"推导：分子分母同乘 e^(−x_k/T) 后，i≠k 的指数都是负数除以 T → 负无穷 → e 的负无穷次方 = 0。⭐ 顺带说明贪心不是另一种方法，它是采样的一个端点。"});
});
KP("14 · ⚠ 唯一的随机性在哪：以及 T=0 为什么仍不确定",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("62:42","nothing in the transformer architecture is probabilistic");
  boxNode(150,210,440,46,"Transformer 的计算：全部确定","g");
  note("矩阵乘法、softmax、归一化 —— 没有一处是随机的",370,282,"d");
  boxNode(690,210,440,46,"唯一不确定的：采样那一步","y");

KP("15 · 三种解码策略并排：各自在搜索里是什么",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("把三种策略摆在一起，用「搜索」的语言重读一遍",640,186,"v");
  matrix({rows:4,cols:5,cw:224,ch:36,x:50,y:208,
    cell:function(i,j){var t=[["","保留几条","随机吗","搜索里的名字","实践中"],
      ["贪心","1 条","否","最朴素的贪心","T→0 的极端"],
      ["beam search","k 条","否","有界宽度的广度优先","只用于翻译"],
      ["采样 + top-p","1 条（随机走）","是","随机化的贪心","⭐ 主流"]];return t[i][j];},
    hl:function(i,j){return (i===3)?"y":"";}});
  note("⚠ 三者都没有「回溯」—— 走错了不会退回来重选",640,368,"r");},"<b>把三种策略并排摆一次，而且用搜索的语言重读，因为这正是你该带走的那一层。</b><br><b>贪心</b>：<b>保留 1 条路径、不随机。<u>就是最朴素的贪心搜索</u>。</b><b>⭐ 而温度那一节已经说明：它其实是采样在 T→0 时的极端，不是独立的一种方法。</b><br><b>beam search</b>：<b>保留 k 条、不随机。<u>搜索文献里的名字是「有界宽度的广度优先」</u>（束搜索）。</b><b>实践中只用于机器翻译那类「确实要最可能答案」的任务。</b><br><b>采样 + top-p</b>：<b>仍然只走 1 条路，但<u>每一步是随机选的</u>（在被 top-p 截断后的候选里按概率抽）。</b><b>⇒ 可以叫「<u>随机化的贪心</u>」。而它是主流。</b><br><b>★★ 而最该注意的是那一行共同点：<u>三者都没有回溯</u>。</b><br><b>⇒ 一旦某一步选错了，<u>后面无论如何都回不去重选那一步</u>。beam search 看起来像在「保留多种可能」，但被挤出 beam 的那条路同样再也回不来。</b><br><b>⭐ 这是 LLM 解码和经典搜索最大的差别</b>：<b>经典搜索（分支定界、MCTS）可以<u>回到已展开的节点重新扩展</u>；而自回归生成一旦吐出一个 token，上下文就定了。</b><br><b>⇒ 而这正解释了后面几讲为什么会出现「让模型自己回头检查」「生成多个完整答案再选」这类做法 —— <u>它们是在<u>外层</u>补回缺失的回溯能力</u>。self-consistency 就是最简单的一种。</b>");
  SUM(0,15,{h:"三种解码策略，用搜索的语言重读",k:"<b>贪心</b>（留 1 条、不随机，是 T→0 的极端）· <b>beam search</b>（留 k 条、不随机，即<b>有界宽度的广度优先</b>，只用于翻译）· <b>采样+top-p</b>（留 1 条但随机走，可叫「随机化的贪心」，是主流）。",m:"★★ 三者的共同点：<b>都没有回溯</b>。一旦某步选错，后面回不去重选；被挤出 beam 的路也再回不来。",w:"⭐ 这是 LLM 解码与经典搜索最大的差别：经典搜索（分支定界、MCTS）可<b>回到已展开的节点重新扩展</b>，而自回归一旦吐出 token 上下文就定了。",r:"⇒ 后面几讲「让模型回头检查」「生成多个完整答案再选」这类做法，本质是<b>在外层补回缺失的回溯能力</b>（self-consistency 是最简单的一种）。<br>⭐ 对你：<b>内层能不能回溯，决定了外层需要补多少</b> —— 这是设计搜索框架时该先定的事。"});
  QUIZ(0,15,{t:"三种解码策略的共同局限是什么？",o:["都只能用于短序列","都需要很大的显存","都是确定性的","都没有回溯：一旦某步选错就回不去重选，被挤出 beam 的路也再回不来"],a:3,w:"这是 LLM 解码与经典搜索（分支定界、MCTS 可回到已展开节点重新扩展）最大的差别。⇒ 后面那些「回头检查」「多生成几个再选」的做法，是在外层补回回溯能力。"});
});
KP("16 · 上下文长度，和 context rot",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:41","it can have different names");
  boxNode(240,206,800,46,"同一个东西的四个名字","v");
  note("context length · context size · window size · 上下文窗口",640,282,"g");
  note("量的是：一次能塞进去多少个 token",640,318,"d");
  note("今天的量级：几万 / 几十万 / 上百万",640,354,"y");
  note("⚠ 新模型发布时吹的那个数字，说的就是这个",640,386,"d");},"<b>先统一术语，因为这一个概念有四个名字在混用。</b><br><b>Shervine 说：输入的长度按 token 数来量，而在文献里它有不同的名字 —— <u>context length、context size、window size</u>。</b><b>他还提了一句很实际的：「最新的工具，如果你用 Cursor 或别的代码助手，我想它们更多叫 context length」。</b><b>⇒ 但这些术语都是等价的，指同一件事。</b><br><b>量级</b>：<b>今天的 LLM 大约在<u>几万、几十万、甚至上百万</u>个输入 token。</b><b>⇒ 他说：有时你听到某个新 LLM 吹某个数字，那个数字就是这个 —— <u>它一次能容纳多少 token</u>。</b><br><b>⚠ 而课堂上有人问了一个很好的问题：这个 context length 是不是就是自注意力里看到的那个？</b><b>答：<u>是的</u>。</b><b>⇒ Shervine 接着把它和上一讲接上了：所以上一讲那些「让自注意力不是 n² 」的技巧，正是用来管理「上下文变长时计算复杂度」的。</b><br><b>⭐ 这个接法很重要：<u>上下文长度不是一个免费的参数</u>。</b><b>吹到一百万 token，意味着后面有一整套工程在扛着那个 n²。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("69:07","a phenomenon that was recently dubbed as context rot");
  note("那上下文越长就越好吗？—— 并不是",640,190,"r");
  axes({x0:200,x1:1080,y0:348,y1:208});
  curve(fn(function(x){return 220+112*(1-Math.exp(-(x-200)/330));},200,1080,200),"r");
  note("横轴：上下文长度        纵轴：找不到答案的程度",640,376,"d");
  note("「大海捞针」测试：把答案埋进越来越长的文本里",640,232,"y");
  note("⇒ 上下文越长，模型把答案「捞出来」的能力越差",640,268,"r");},"<b>一个很重要的、而且是今年夏天才被命名的现象。</b><br><b>Shervine 问：有更长的上下文，是不是就什么都解决了？<u>实际上并不是</u>。</b><br><b>这个现象叫 <u>context rot</u>（上下文腐坏），出自今年早些时候的一篇论文。</b><br><b>实验做法叫「<u>大海捞针</u>」（needle in a haystack）</b>：<b>问一个问题，然后把答案<u>埋进</u>越来越长的一段文本里，看模型还能不能把它找出来。</b><br><b>⇒ 结果：<u>随着上下文变长，模型把答案和上下文对应起来的能力在下降</u>。</b><br><b>★★ 而这篇论文还做了一件更要紧的事，Shervine 特意提了</b>：<b>它<u>控制了上下文里还有什么别的东西</u>。</b><b>论文里有一个词叫 <u>distractors</u>（干扰项）—— 他们往里面放一些噪声，然后发现<u>干扰项会进一步降低检索能力</u>。</b><br><b>⇒ 所以结论是两条，而第二条更实用：<u>不只是上下文有多长要紧，上下文里<u>是什么</u>也要紧</u>。</b><br><b>⭐ Shervine 给的实践建议很直接：所以当你有一个检索类的问题、想用 LLM 来解，你有很强的动机去<u>尽可能精准地圈出那一段该让 LLM 看的上下文</u>，而不是把什么都塞进去。</b><br><b>⚠ 这条和很多人的直觉相反 —— 很多人以为「上下文够长，那就全塞进去，让模型自己挑」。而 context rot 说的正是：模型挑不好，而且塞得越多挑得越差。</b>");
  SUM(0,16,{h:"上下文长度，和 context rot",k:"<b>context length / context size / window size</b> 是同一件事：一次能塞多少 token（今天几万~上百万）。它就是自注意力看到的那个长度 ⇒ 上一讲那些治 n² 的技巧正为它而设。",m:"<b>context rot</b>（今年新命名）：用「<b>大海捞针</b>」测试 —— 把答案埋进越来越长的文本里，<b>上下文越长，模型捞出答案的能力越差</b>。",w:"★★ 论文还控制了「上下文里还有什么」：<b>distractors（干扰项）会进一步降低检索能力</b> ⇒ 结论是两条 —— <b>不只是多长要紧，是什么也要紧</b>。",r:"⚠ 与常见直觉相反：不是「上下文够长就全塞进去让模型自己挑」—— <b>模型挑不好，而且塞得越多挑得越差</b>。⇒ 该精准圈出要看的那一段。同理：给代理模型喂越多特征不一定越好，无关特征是实打实的干扰。"});

});

  note("⇒ 看到任何一个喂给 LLM 的输入，都可以按这四块拆一遍",640,382,"v");},"<b>Shervine 先打了预防针：<u>关于怎么组织提示，没有正式的理论</u>。但实践中提示大致有四块。</b><br><b>① 背景（context）</b>：<b>把场景交代清楚，让模型明白你要问哪一类问题。</b><b>他举的真实例子很具体：「你是 ChatGPT。今天是 10 月 10 日，现在是下午 4:44。」</b><br><b>② 指令（instructions）</b>：<b>你要它执行什么任务。</b><br><b>③ 输入（inputs）</b>：<b>那些指令作用的对象 —— 他的说法很好：「指令是一些函数，而它们要接受输入」。</b><br><b>④ 约束（constraints）</b>：<b>为了让输出符合你要的样子而加的限制。</b><br><b>★★ 而第 ④ 块有一个很值得注意的点：<u>用户常常看不见它</u>。</b><b>Shervine 说：约束可能是你作为用户看不到、但确实出现在给 LLM 的提示里的东西 —— 比如<u>安全指令</u>（「不要生成任何可能导致伤害的内容」之类）。</b><br><b>⇒ 他给的用法建议很实用：<u>每次看到一个喂给 LLM 的输入，这四个维度可以作为一个好的心智模型，看清每一块各自服务什么目的</u>。</b><br><b>⭐ 这对你写提示有直接帮助：如果你的提示效果不好，先按这四块拆一遍，看是哪一块缺了或者混了。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  boxNode(670,344,520,42,"few-shot：先给几组「输入→输出」示例","g");},"<b>一个被广泛使用、但名字起得不太好的概念。</b><br><b>Shervine 自己点了这件事</b>：<b>in-context learning —— 「learning 这个词有点<u>被重载了</u>，因为你其实<u>并没有</u>就 LLM 的权重学到任何东西；但你可以把一些知识<u>蒸馏进它的上下文里</u>，来达到你想要的效果」。</b><br><b>⭐ 这个澄清很重要：<u>权重一个都没变</u>。</b><b>所谓「学习」全部发生在那一次前向传播里 —— 模型读到了你给的例子，然后照着做。</b><br><b>两类</b>：<br><b>zero-shot</b>：<b>「心态上非常简单」—— 除了你的输入查询，什么都不给。直接让它做。</b><br><b>few-shot</b>：<b>「另一个流派」—— 在问你真正关心的那个问题之前，先给模型几组「输入 → 输出」的示例。</b><br><b>⇒ 他举的例子：你有个叫 Teddy 的泰迪熊，你给出查询和你想要的故事；给几组这样的例子；然后你问「给叫 Bob 的泰迪熊也生成一个故事」。</b><br><b>⚠ 这里有一个很值得注意的点：few-shot 的例子<u>占用上下文</u>，而上下文是有代价的（既是 token 成本，也是 context rot）。</b><b>⇒ 所以下一镜那个「few-shot 不总是更好」的结论，一部分原因就在这里。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("77:33","you constrain your model into given sets of examples that are finite");

  note("要收集例子（贵）· 占上下文 · 更多算力",320,296,"d");
  note("⚠ 而且你把模型「约束」在了有限的几个例子上",320,332,"r");
  boxNode(720,224,480,46,"推理能力强的模型：换个做法","g");
  note("把指令写成「讲清怎么做」的自然语言",960,296,"d");
  note("⇒ 让它用推理能力去做，反而更能泛化",960,332,"g");
  note("⇒ 新分布上的任务，例子反而会把它带偏",640,380,"v");},"<b>这是这一段最有价值的一条，而且它推翻了一个很多人默认的结论。</b><br><b>常规说法</b>：<b>给例子通常能把 LLM 很好地导向你要的任务 —— 因为你让模型知道了你在找什么，它就能用训练中学到的东西把点连起来。</b><br><b>⚠ 但 Shervine 在幻灯上把「generally（一般）」这个词<u>写成了斜体</u>，然后解释了为什么</b>：<b>「它们<u>一般</u>在 few-shot 下更好，<u>但并不总是</u>。」</b><br><b>★★ 他给的理由很深，值得完整理解</b>：<b>因为当你提供例子时，<u>你把模型约束在了那几个有限的例子上</u>。</b><b>⇒ 于是在推理时，如果你要处理的数据分布是<u>没见过</u>的，模型<u>更难泛化</u> —— 因为它会试图对齐到上下文里看到的那些例子。</b><br><b>⭐ 而对策是：<u>把指令改写成更基于推理的</u> —— 用自然语言<u>讲清楚这个任务该怎么做</u>，让它用自己的推理能力去执行。</b><b>Shervine 说这是这些天越来越常见的做法，而且随着模型推理能力变强，这样做可以和给例子<u>打平、甚至更好</u>。</b><br><b>⚠ 他也诚实地标了边界：「关于这个的文献我想还在进展中」，并举了 plan-and-solve 这类论文。</b><br><b>★ 对你的课题，这条有一个很直接的类比：<u>给示例 = 给训练样本；给指令 = 给规则</u>。</b><b>⇒ 当测试分布和训练分布不同时，<u>规则比样本更能迁移</u>。这正是为什么你那套基于结构的剪枝判据，比纯粹学出来的代理模型更值得信任。</b>");
  SUM(0,17,{h:"提示的四块，以及 few-shot 不总是更好",k:"提示四块：<b>背景 / 指令 / 输入 / 约束</b>（第四块用户常看不见，安全指令藏在那里）。<b>in-context learning</b>：权重一个都没变，知识只是放进上下文 —— zero-shot vs few-shot。",m:"★★ <b>few-shot 一般更好，但不总是</b>：给例子<b>把模型约束在那几个有限例子上</b> ⇒ 新分布上反而更难泛化。对策是把指令写成「讲清怎么做」的自然语言，让它用推理能力执行。",w:"⚠ 讲者把 generally 写成斜体，并标明「这方面文献还在进展中」。另：few-shot 的例子<b>占上下文</b>，而上下文既有 token 成本也有 context rot 的代价。",r:"★ 很直接的类比：<b>给示例 = 给训练样本；给指令 = 给规则</b>。<b>测试分布与训练分布不同时，规则比样本更能迁移</b> —— 这正是基于结构的剪枝判据比纯学出来的代理模型更值得信任的理由。"});
  QUIZ(0,17,{t:"为什么 few-shot 不总是比 zero-shot 好？",o:["因为给例子把模型约束在那几个有限的例子上 ⇒ 面对没见过的分布时更难泛化；改用「讲清怎么做」的指令反而更好","因为例子里可能有错误","因为例子会占用太多算力","因为模型会直接复制例子的答案"],a:0,w:"Shervine 把 generally 写成了斜体。★ 类比：给示例=给样本，给指令=给规则；分布变了时规则比样本更能迁移。"});
});
KP("18 · chain of thought，和它的两个副产品",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("78:51","if you force the model to come up with some rationale to some answer before actually giving it");
  boxNode(80,214,480,46,"直接要一个答案","r");
  note("「这只泰迪熊几岁？」→「5」",320,286,"d");
  note("⚠ 模型没机会把中间的联系建立起来",320,322,"r");
  boxNode(720,214,480,46,"先说理由，再给答案（CoT）","g");
  note("「它 2019 年买的，现在 2024，所以…」",960,286,"d");
  note("⇒ 指标确实变好",960,322,"g");
  note("⚠ 代价：要生成更多 token ⇒ 更慢、更贵。但通常划算",640,376,"y");},"<b>chain of thought（思维链），今天几乎是常识了，但它的机制值得说清。</b><br><b>做法</b>：<b>研究者发现，<u>如果你强迫模型在真正给出答案之前先给出某种理由</u>，表现会更好。</b><b>这就是人们说的 chain of thought —— 「是什么把你引向了那个答案」。</b><br><b>Shervine 的例子</b>：<b>问「这只泰迪熊几岁？」—— 如果你强迫模型<u>直接回一个数字</u>，它可能建立不起「为什么是这个岁数」的联系；而如果你让它给出完整的推理链，那条链就清楚了。</b><br><b>⇒ 而这也能和 few-shot 结合：给几个「问题 → 推理 → 答案」的示例，模型就会照着这个格式，<u>既输出推理也输出答案</u>。</b><br><b>⭐ 为什么它有效，补一个机制上的理解（讲者没展开）</b>：<b>模型每生成一个 token 的计算量是<u>固定</u>的。</b><b>⇒ 强迫它先写推理，等于<u>给了它更多步计算</u>来得到最终答案。</b><b>⚠ 而且那些中间 token 会进入后续的上下文，成为后面步骤可以「读回来」的草稿纸。</b><br><b>⇒ 所以 CoT 不是「让模型更聪明」，是<u>给它更多计算和一块草稿纸</u>。</b><br><b>代价</b>：<b>Shervine 说得很明白 —— 和其它增加 token 数的技巧一样，这是一个要管理的权衡：推理会更慢，因为要生成更多 token。「但通常我们觉得划算。」</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("81:19","you can trace back to");
  note("CoT 的第二个好处，很实用但容易被忽略：可调试",640,190,"v");
  boxNode(150,224,980,46,"问：这只熊明年几岁？  推理里写着：「我们现在是 2019 年…」","y");
  note("⇒ 一眼看出问题不在模型，在你给的上下文里日期写错了",640,300,"g");
  note("⚠ 调 LLM 不像以前：你不看权重，你看它吐出来的 token",640,338,"d");
  note("⇒ 推理链让失败「可追溯」—— 这是把黑盒撬开一条缝",640,376,"v");},"<b>CoT 的第二个好处，Shervine 专门讲了，而它在工程上非常实用。</b><br><b>他的说法</b>：<b>你想把一个任务做好，总会有一些样本是不 work 的；对这些你需要<u>调试能力</u>。</b><b>而用 LLM 调试和以前不一样 —— <u>你不看权重、不看 LLM 的内部机理</u>；你要的是某种<u>更可解释、以 token 形式吐出来</u>的东西。</b><br><b>例子很具体</b>：<b>你问「这只熊<u>明年</u>几岁？」，而在推理链里它说「嘿，我们现在是 2019 年」。</b><b>⇒ 那你立刻知道：<u>问题出在你的上下文里 —— 也许是我把日期写错了</u>。</b><b>Shervine 说：你可以很容易地<u>追溯回去</u>、做根因分析。</b><br><b>★★ 把这件事抽象一层：<u>推理链把一个黑盒的失败，变成了一条可以逐步检查的轨迹</u>。</b><br><b>⇒ 没有 CoT 时，你只能看到「输入 → 错误答案」，中间什么都没有，只能靠猜。</b><b>有了 CoT，你能定位到<u>哪一步开始错的</u>。</b><br><b>⭐ 这对你的课题有一个很好的对应：<u>让你的搜索留下可读的轨迹</u>（哪一步剪了什么、为什么剪），而不只是输出最终解。</b><b>⚠ 当结果不对时，可追溯的轨迹和不可追溯的轨迹，调试成本差一个数量级。而这个成本在研究阶段是主要成本。</b>");
  SUM(0,18,{h:"CoT：给更多计算和一块草稿纸，顺带可调试",k:"<b>chain of thought</b>：强迫模型在给答案之前先给出理由 ⇒ 指标变好。可与 few-shot 结合（给「问题→推理→答案」的示例）。代价是生成更多 token ⇒ 更慢更贵，但通常划算。",m:"⭐ 机制（补的）：每生成一个 token 的计算量是<b>固定</b>的 ⇒ 先写推理等于<b>给了更多步计算</b>；而中间 token 进入上下文，成为后续可读回的<b>草稿纸</b>。所以不是「更聪明」，是「更多计算 + 草稿纸」。",w:"第二个好处：<b>可调试</b>。调 LLM 不看权重、看它吐出的 token；推理链让你定位到<b>哪一步开始错</b>（例：链里写着「现在是 2019 年」⇒ 是上下文里日期写错了）。",r:"⭐ 直接可搬：<b>让你的搜索留下可读的轨迹</b>（哪一步剪了什么、依据是什么），而不只输出最终解。可追溯与不可追溯的调试成本差一个数量级，而这在研究阶段是主要成本。"});
  QUIZ(0,18,{t:"chain of thought 为什么有效？",o:["它让注意力变成双向的","它减少了需要生成的 token 数","它让模型的参数更新得更好","每个 token 的计算量固定 ⇒ 先写推理等于给了更多步计算；而中间 token 进入上下文成为可读回的草稿纸"],a:3,w:"这一层机制讲者没展开，是补的。所以 CoT 不是「让模型更聪明」，是给它更多计算和一块草稿纸。第二个好处是可调试：失败变成一条能逐步检查的轨迹。"});
});
KP("19 · self-consistency：采样多次再投票",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("82:16","this is what we call self-consistency");
  note("既然采样是随机的，那就多采几次",640,188,"v");
  var i,ans=["答案 A","答案 A","答案 B","答案 A","答案 A"];
  for(i=0;i<5;i++){
    boxNode(90+i*232,222,210,42,"采样 "+(i+1),"d");
    boxNode(90+i*232,284,210,42,ans[i],ans[i]==="答案 A"?"g":"r");
    link(195+i*232,264,195+i*232,284);}
  note("⇒ 多数投票：A 得 4 票 ⇒ 输出 A",640,362,"g");
  note("⚠ 关键：这几次是「并行」跑的 ⇒ 延迟约等于跑一次",640,386,"y");},"<b>把 CoT 再推一步，而这一步的工程性质很好。</b><br><b>做法</b>：<b>对同一个问题<u>采样多次</u>，看它生成了哪些答案，然后<u>多数投票</u>选出被预测次数最多的那个。</b><b>这叫 <u>self-consistency</u>（自洽性）。</b><br><b>⇒ 具体：你把每次的<u>推理过程</u>剥掉，只抽出最终<u>答案</u>，然后对答案投票。</b><b>Shervine 说这样能「以更稳健的方式得到一个答案」。</b><br><b>★★ 而最要紧的一条工程性质是学生问出来的：这几次是怎么跑的？</b><b>答：<u>通常是并行采样的</u>。</b><b>你在若干条分支上各自从分布里抽，<u>全部并行做</u>；它们<u>互相不进入对方的上下文</u>。</b><br><b>⇒ 所以<u>整个过程的延迟，大约等于其中最慢的那一条生成的延迟</u> —— 也就是约等于跑一次。</b><br><b>⭐ 这一点让 self-consistency 变得非常实用：<u>它用「更多算力」换「更稳」，但几乎不用「更多时间」</u>。</b><br><b>⚠ 一个实现细节也被问到了：怎么从一段推理里抽出答案？</b><b>Shervine 给了三种办法：<u>在提示里要求「把最终答案放在最后」</u>（然后取最后一段）、用<u>正则</u>、或者<u>再用一个 LLM</u> 去抽。</b><b>「总有办法做到。」</b><br><b>⚠ 还有一问很对：怎么知道它确实更好？答：<u>需要 benchmark 和真值标签</u>，那篇论文是在算术和数学类任务上做的。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("三种「多花点力气换更好答案」的做法，摆在一起看",640,186,"v");
  matrix({rows:4,cols:4,cw:280,ch:36,x:50,y:208,
    cell:function(i,j){var t=[["","多花的是什么","换来什么","延迟"],
      ["CoT","更多输出 token","把中间计算显式化","变长"],
      ["self-consistency","更多次采样（并行）","更稳健的答案","几乎不变"],
      ["beam search","更多并行路径 + 记账","更高概率的序列","变长"]];return t[i][j];},

  note("⭐ 只有 self-consistency 是「花算力不花时间」—— 所以它最容易被采用",640,368,"g");},"<b>把这一讲里三种「多花力气换更好结果」的做法摆在一起，分野就很清楚了。</b><br><b>CoT</b>：<b>多花的是<u>输出 token</u>；换来的是把中间计算显式化；<u>延迟变长</u>（因为要串行地多生成）。</b><br><b>self-consistency</b>：<b>多花的是<u>采样次数</u>；换来的是更稳健的答案；<u>延迟几乎不变</u>（因为并行）。</b><br><b>beam search</b>：<b>多花的是<u>并行路径和记账</u>；换来的是更高概率的序列；<u>延迟变长</u>。</b><br><b>★★ 这张表最该带走的一行是中间那行：<u>self-consistency 是唯一一个「花算力但不花时间」的</u>。</b><br><b>⭐ 而这解释了它为什么在实践中被广泛采用 —— 在很多场景里，<u>延迟是硬约束，算力只是钱</u>。</b><b>⇒ 能把「变慢」换成「变贵」的技巧，往往比纯粹更强但更慢的技巧更容易落地。</b><br><b>⚠ 对你的课题，这一条有一个很直接的版本：<u>你的搜索哪些部分能并行？</u></b><b>如果多条分支的评估互不依赖，那「评估更多候选」就只花钱不花时间 —— 这会实质性地改变你该怎么设计实验预算。</b><br><b>⇒ 反过来，如果你的搜索是严格串行的（下一步依赖上一步的结果），那每增加一次评估都直接延长墙钟时间。<u>这个区别值得在方法章里明说</u>。</b>");
  SUM(0,19,{h:"self-consistency：唯一「花算力不花时间」的那个",k:"对同一问题<b>采样多次</b>、剥掉推理只留答案、<b>多数投票</b>。关键工程性质：几次是<b>并行</b>跑的、互不进入对方上下文 ⇒ <b>延迟约等于跑一次</b>。",m:"三者对照：<b>CoT</b> 多花输出 token、延迟变长；<b>self-consistency</b> 多花采样次数、<b>延迟几乎不变</b>；<b>beam search</b> 多花路径与记账、延迟变长。",w:"实现细节：抽答案可以靠「提示里要求把答案放最后」、正则、或再用一个 LLM。要验证它更好<b>需要 benchmark 与真值标签</b>（论文在算术/数学任务上做的）。",r:"⭐ <b>能把「变慢」换成「变贵」的技巧，比更强但更慢的技巧更容易落地</b>（延迟常是硬约束，算力只是钱）。⇒ 明确回答：<b>你的搜索哪些部分能并行？</b> 互不依赖的分支评估只花钱不花时间，这会实质改变实验预算的设计。"});

KP("20 · 推理效率的分类法：精确 vs 近似",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 两类的验收标准完全不同：第 ① 类要求逐位相同，第 ② 类只要求「够好」",640,386,"r");},"<b>在讲任何具体技巧之前，Shervine 先给了一个分类法，而这个分类法比技巧本身更值得记。</b><br><b>他把整段分成两类</b>：<br><b>① 精确</b>：<b>「你做的计算<u>和原来应该做的一模一样</u>，只是用更高效的方式做。」</b><b>他还给了三个找这类技巧的提示：<u>避免冗余</u>、<u>把内存管理做到最好</u>、<u>看看能不能把 LLM 内部的式子重新表述一下，让生成在实践中更简单</u>。</b><br><b>② 近似</b>：<b>「哪些近似是可以接受的，能以更低的代价拿到高质量的答案，但结果是近似的。」</b><b>三个方向：<u>架构上能做什么变化</u>、<u>嵌入上能不能更省</u>、<u>token 预测那一侧能不能更快</u>。</b><br><b>★★ 这个分法的价值在于：<u>两类技巧的验收标准完全不同</u>。</b><br><b>⇒ 第 ① 类你可以写一个测试，要求输出<u>逐位相同</u> —— 不同就是 bug。</b><b>⇒ 第 ② 类不行，你只能在 benchmark 上比「够不够好」，而且必须说清楚退化了多少。</b><br><b>⚠ 把这两类混在一起谈，是性能工作里一个很常见的毛病</b>：<b>人们把「KV 缓存」和「量化」并列成「两个加速技巧」，但前者<u>不该改变任何输出</u>，后者<u>一定会</u>。</b><br><b>⭐ 对你的课题，这条分法直接可用：<u>你的每一处优化，先归到这两类里的一类，然后用对应的方式验收</u>。</b>");
  SUM(0,20,{h:"推理优化先分两类：精确 vs 近似",k:"<b>① 精确</b>：算的东西一模一样，只是算得更聪明（避免冗余 / 管好内存 / 重整式子）。<b>② 近似</b>：结果可能不同，换速度（改架构 / 压嵌入 / 改 token 预测）。",m:"★★ 分法的价值在于<b>验收标准完全不同</b>：第 ① 类可以写测试要求输出<b>逐位相同</b>，不同就是 bug；第 ② 类只能在 benchmark 上比「够不够好」，且必须说清退化了多少。",w:"⚠ 把两类混谈是性能工作里常见的毛病：「KV 缓存」与「量化」被并列成两个加速技巧，但<b>前者不该改变任何输出，后者一定会</b>。",r:"⭐ 直接可用：<b>你的每一处优化先归到这两类之一，再用对应方式验收</b>。等价变换（更好的数据结构、记忆化）要求结果不变；启发式剪枝则必须报告它可能漏掉什么。"});

  note("⇒ 这正好解释了上一讲「为什么共享 K/V 投影而不共享 Q」",640,386,"v");},"<b>第一个、也是最基础的推理优化，而上一讲早就埋好了伏笔。</b><br><b>观察</b>：<b>在掩码自注意力里，当前 token 要和<u>前面所有</u> token 做注意力。</b><b>所以生成到「is」时，你要算 is 的 query、key、value（当然要算，它是当前 token）；但前面那些 token 的 <u>key 和 value，上一步就已经算过了</u>。</b><br><b>⇒ 于是想法很直接：<u>把这些 key 和 value 矩阵存起来，下次直接从缓存里取</u>。这就是 <u>KV 缓存</u>。</b><br><b>★★ Shervine 特意强调了一处不对称，而且解释了为什么</b>：<b>他说「我<u>没有</u>把 Q 这部分划出来，因为前面那些 token 对应的 <u>query 对当前 token 来说没有意义</u>」。</b><br><b>⇒ 为什么？因为 query 代表的是「<u>我</u>在问什么」。而当前这一步在问的是当前 token —— 前面那些 token 的提问已经问完了，不需要重问。</b><b>而 key 和 value 代表的是「<u>我能被查到什么</u>」，这是要被反复查的。</b><br><b>⭐ 这就把上一讲那个问题彻底讲通了：为什么 MQA/GQA 共享的是 K 和 V 的投影，而不是 Q 的？<u>因为只有 K 和 V 要进缓存，而缓存的大小是瓶颈</u>。</b><br><b>⚠ 一个学生问：训练时也做 KV 缓存吗？</b><b>Shervine 答：训练时用的是 <u>teacher forcing</u>，所有输入一次性全传进去 —— <u>所以 KV 缓存这个概念根本不会出现</u>。</b><b>⇒ 这又一次印证了第一讲那条：训练可以并行，生成必须串行。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  boxNode(690,218,520,42,"PagedAttention：切成固定大小的小块","g");
  note("论文里块大小取 16",950,284,"d");
  note("用一张表把「token 位置」映射到它的缓存块",950,318,"g");
  note("⇒ 用完一块再要下一块，不多占 ⇒ 碎片大幅减少",950,352,"g");},"<b>KV 缓存解决了「别重算」，但它本身带来一个新问题：<u>这些缓存放哪儿</u>。</b><br><b>场景</b>：<b>Shervine 让你想象自己是一台推理服务器，同时收到很多用户的请求。</b><br><b>朴素做法</b>：<b>一开始就按<u>最大上下文长度</u>给每个请求预留一整块显存 —— 因为<u>你不知道会生成到多长</u>（要等到 EOS 才停）。</b><br><b>⇒ 后果：<u>大量浪费</u>。如果上下文是 2k，每个请求就占 2k；很快显存就装不下更多请求了。</b><br><b>两个术语（出自 PagedAttention 那篇论文）</b>：<br><b><u>内部碎片</u></b>：<b>预留了、但实际没用到的那部分空间。</b><br><b><u>外部碎片</u></b>：<b>内存管理系统不一定把块一个紧挨一个放，中间留下的空隙。</b><br><b>★★ 对策：<u>PagedAttention</u>（它支撑着一个叫 <u>vLLM</u> 的推理框架）。</b><b>做法是：不再给一个请求分配一整块，而是<u>切成固定大小的小块</u>（论文取 16）。</b><b>用完一块再要下一块，<u>不多占</u>。</b><b>再用一个字典把「token 位置」映射到它对应的缓存块。</b><br><b>⇒ 结果：<u>碎片大幅减少</u>。</b><br><b>⭐ 这个方案的名字本身就是提示：它是把<u>操作系统的分页</u>搬到了显存管理上。</b><b>⚠ 而它的教训很一般：<u>「按最坏情况预留」是一种很贵的懒惰</u>。只要你能承受一点簿记开销，按需分配几乎总是更划算。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 论文还报告了性能提升 —— 被归因于某种正则化效果",640,380,"d");},"<b>第三招，来自 DeepSeek，叫 <u>multi-head latent attention</u>（MLA）。思路是：既然缓存是瓶颈，那就把要存的东西<u>本身</u>做小。</b><br><b>先看原本有多大</b>：<b>多头注意力下，对一个 token 的表示，你有 <u>h</u> 个投影矩阵把它变成 key —— 于是有 h 个 key 嵌入要存；value 同理。</b><b>「那是很多向量要存，而且这些 key 和 value 本身也挺长。」</b><br><b>MLA 做了三件事，一层比一层狠</b>：<br><b>① <u>低秩分解</u></b>：<b>把投影矩阵拆成「先降到一个比 key 空间更低维的中间空间，再升回去」。缓存只存那个<u>低维的中间表示</u>。</b><br><b>② <u>K 和 V 共用压缩矩阵</u></b>：<b>Shervine 说这一步「非常聪明」—— 对一个 token 而言，<u>要为 key 存的缓存和为 value 存的缓存是同一个</u>。解压时再用不同的矩阵分别还原成 key 和 value。</b><br><b>③ <u>跨 h 个头也共用</u></b>：<b>于是不再是 h 个嵌入，<u>只剩一个</u>。</b><br><b>⇒ 结果：<u>每个 transformer block、每个 token，只需要存一个表示</u>。</b><br><b>★ 而最有意思的是一个意外收获：<u>DeepSeek V2 的论文还报告了性能提升</u>。</b><b>Shervine 说这被归因于某种<u>正则化</u>效果 —— 「它学到的表示也许更有用、而且在 key 和 value 之间共享了」。</b><br><b>⭐ 所以「为了省显存而加的约束」顺带起到了正则化的作用。<u>这类「约束带来意外收益」的情况在机器学习里很常见，值得留意</u>。</b>");
  SUM(0,21,{h:"KV 缓存，以及围绕它的三个优化",k:"<b>KV 缓存</b>：前面 token 的 K、V 上一步已算过 ⇒ 存起来别重算。<b>只存 K/V 不存 Q</b>（前面 token 的「提问」已问完；K/V 是要被反复查的）⇒ 这正是上一讲 MQA/GQA 共享 K/V 的理由。",m:"<b>PagedAttention</b>（支撑 vLLM）：朴素做法按最大上下文预留 ⇒ <b>内部碎片</b>（留了没用）+ <b>外部碎片</b>（块间空隙）。对策是切成固定小块（论文取 16）按需分配 —— 把<b>操作系统的分页</b>搬到显存。",w:"<b>MLA</b>（DeepSeek）三步：低秩压缩 → K 与 V <b>共用</b>压缩矩阵 → 跨 h 个头也共用 ⇒ 每 block 每 token 只剩一个表示。⭐ 意外收获：论文报告<b>性能也提升</b>，被归因于正则化效果。<br>⚠ 训练时用 teacher forcing 一次性全传 ⇒ 根本不存在 KV 缓存。",r:"⭐ 两条可带走：① <b>「按最坏情况预留」是很贵的懒惰</b> —— 能承受一点簿记开销的话，按需分配几乎总更划算。② <b>为省资源而加的约束常顺带起到正则化作用</b>，值得在消融里专门查一下。"});
  QUIZ(0,21,{t:"为什么 KV 缓存只存 K 和 V，不存 Q？",o:["因为 Q 在推理时不需要","因为 Q 可以从 K 推出来","因为 query 代表「我在问什么」—— 前面 token 的提问已经问完了；而 K/V 代表「我能被查到什么」，要被反复查","因为 Q 的维度更大"],a:2,w:"Shervine 特意强调了这处不对称。⭐ 这也彻底讲通了上一讲那个问题：MQA/GQA 共享 K/V 的投影而不共享 Q，正因为只有 K/V 要进缓存，而缓存大小是瓶颈。"});

  note("⚠ 若某处被拒 ⇒ 从那里起按调整过的分布重采，再继续",640,368,"r");},"<b>这一招非常漂亮，而且它的成立依赖一个硬件事实（下一镜讲）。</b><br><b>做法</b>：<br><b>① 让一个<u>小模型</u>（论文叫 <u>draft</u>，草稿模型）连续猜出接下来的 k 个 token。</b><b>「因为这个 LLM 很小，这通常比用大模型快得多。」</b><br><b>② 把这 k 个猜出来的 token <u>一起</u>作为输入喂给<u>目标模型</u>（那个大的），让它<u>一次前向</u>就给出每个位置上的概率分布。</b><br><b>③ 然后逐个判定</b>：<b>如果草稿模型给那个 token 的概率<u>不高于</u>大模型给它的概率，就<u>直接接受</u>；否则走一个<u>接受/拒绝</u>的机制。</b><br><b>⇒ 如果全部被接受，那<u>一次前向就前进了 k 步</u>。</b><b>⇒ 如果中途有一个被拒，就从那个位置开始，按一个<u>调整过的分布</u>重新采样，然后继续。</b><br><b>★★ 而这里有一个关键问题，Shervine 自己提了出来：<u>这看起来像个菜谱 —— 凭什么它的输出分布和大模型一样？</u></b><b>他的回答：如果你从<u>全概率公式</u>出发，把每一项用这些量写出来，最后就会得到目标分布。</b><b>「这是一个我鼓励你自己做的练习，论文里几行就证完了，非常简单，我觉得非常有意思。」</b><br><b>⇒ 有学生问这是不是<u>拒绝采样</u>。答：是的。</b><br><b>⭐ 所以投机解码不是近似 —— <u>它在分布意义上是精确的</u>，这一点非常重要。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("106:15","you are memory bounds");
  boxNode(230,214,820,46,"为什么「一次验证 k 个」几乎不比「验证 1 个」慢","v");
  note("因为推理时的瓶颈是「显存带宽」，不是「算力」",640,290,"r");
  note("⇒ 把参数从显存搬进计算单元这件事，才是最花时间的",640,326,"d");
  note("⇒ 既然都要搬一遍参数，顺手多算几个 token 几乎是白赚",640,362,"g");
  note("⚠ 所以这一招的前提是硬件事实，不是算法技巧",640,386,"y");},"<b>这一镜解释投机解码<u>凭什么划算</u>，而理由是一个硬件事实，不是算法上的聪明。</b><br><b>Shervine 的总结很精炼</b>：<b>做一次前向（带着全部草稿 token）和一次只做一个 token，<u>代价几乎一样</u> —— 因为推理时你是 <u>memory bound</u>（受显存带宽限制）。</b><b>换句话说：<u>计算不是限制因素，是显存在瓶颈你的计算</u>。</b><br><b>⭐ 把这件事说透</b>：<b>大模型做一次前向，最花时间的事情是<u>把几千亿个参数从显存搬到计算单元里</u>。</b><b>而一旦搬进来了，用它算 1 个 token 还是算 5 个 token，<u>差别很小</u>。</b><br><b>⇒ 所以策略就清楚了：<u>在小模型上多跑几次（便宜），在大模型上一次算完所有概率分布（把那一次昂贵的搬运摊到 k 个 token 上）</u>。</b><br><b>★★ 这条教训对你的实验设计直接有用：<u>先搞清楚你的瓶颈是算力还是访存（或者是 I/O、是网络）</u>。</b><b>⚠ 优化错了的那一头，花再大力气也看不到变化 —— 这是性能工程里最常见的浪费。</b><br><b>⇒ 而且它还能反过来提示机会：<u>如果你是访存受限的，那「顺手多算一些」几乎是免费的</u>。你的搜索里如果已经把某批数据读进来了，多评估几个候选可能不花什么钱。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("107:01","the draft model is embedded in the same model");
  note("最后一招：把草稿模型「装进」目标模型里",640,190,"v");
  stack(640,214,[["最后一层 decoder 的表示","b"],
                 ["在它上面挂「多个」预测头","y"],
                 ["训练时就做「多 token 预测」而不是「下一个 token」","g"],
                 ["推理时：其余的头当草稿，第一个头当主模型","v"]],740,30,6);
  note("⚠ 代价：目标函数变了 ⇒ 不再有那个「分布完全一致」的漂亮性质",640,380,"r");},"<b>最后一个技巧，是投机解码的一个变体，但它的设计姿态很不一样。</b><br><b>multi-token prediction（多 token 预测）</b>：<b>「它做的事情基本相同，但<u>草稿模型被嵌入在同一个模型里</u> —— 这非常强大。」</b><br><b>做法</b>：<b>在最后一层 decoder 的表示之上，挂<u>多个</u>预测头。</b><b>而且训练时就不做「下一个词预测」了，改做<u>多词预测</u>。</b><br><b>⇒ 测试时：<u>其余那些头充当草稿模型，而第一个头是你的主模型</u>。</b><b>把草稿 token 喂回第一个头，再做接受/拒绝。</b><br><b>★★ 但 Shervine 诚实地指出了代价，这一点很重要</b>：<b>那篇论文是用<u>贪心</u>的方式做的，<u>而不是用前面那个公式</u>。</b><b>因为架构和目标函数都变了，<u>你不再拥有那个「能还原出下一 token 分布」的漂亮性质</u> —— 只有它的一个变体。</b><br><b>⇒ 所以两种方法的分野很清楚</b>：<b>投机解码 —— <u>分布精确</u>，但要维护<u>两个</u>模型；多 token 预测 —— <u>只有一个</u>模型（更简洁、更快），但<u>失去了分布一致的保证</u>。</b><br><b>⭐ Shervine 自己总结了该带走的两点：<u>目标函数变了</u>；以及<u>草稿模型和目标模型被装进了同一个里，不用分开维护两个</u>。</b><br><b>⚠ 这又是一次「精确 vs 近似」的取舍 —— 而这一整段（他开头就分过类）正是围绕这条线组织的。</b>");
  SUM(0,22,{h:"投机解码：小模型猜、大模型一次验证",k:"<b>投机解码</b>：小模型（<b>draft</b>）连猜 k 个 token → 大模型<b>一次前向</b>验证全部 → 逐个接受/拒绝。全接受则一次前进 k 步。⭐ 它在<b>分布意义上是精确的</b>（可由全概率公式证明，就是拒绝采样）。",m:"⭐ 凭什么划算是个<b>硬件事实</b>：推理时 <b>memory bound</b> —— 瓶颈是把参数从显存搬进计算单元，<b>搬一次之后算 1 个还是 5 个 token 差别很小</b>。",w:"<b>多 token 预测</b>：把草稿装进同一个模型（最后一层挂多个头，训练时就做多词预测）。<b>代价</b>：目标函数变了 ⇒ <b>失去「分布完全一致」的保证</b>，论文改用贪心。<br>⇒ 分野：精确但两个模型 vs 一个模型但近似。",r:"★★ 直接可用：<b>先搞清楚瓶颈是算力还是访存</b>（或 I/O、网络）—— 优化错了的那一头花再大力气也没变化。反过来也是机会：<b>访存受限时「顺手多算一些」几乎免费</b>，数据已读进来时多评估几个候选可能不花钱。"});
  QUIZ(0,22,{t:"投机解码凭什么能加速？",o:["因为小模型的预测更准","因为推理是 memory bound：瓶颈是把参数从显存搬进计算单元，搬一次后算 1 个还是 k 个 token 差别很小","因为它减少了模型的参数量","因为它跳过了 softmax"],a:1,w:"这是硬件事实不是算法技巧。⭐ 而且投机解码在分布意义上是精确的（拒绝采样，可由全概率公式证明）—— 而多 token 预测因为改了目标函数，失去了这个保证。"});
});
KP("23 · 六个效率技巧归位：各自省的是哪一种资源",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("92:02","group query attention");
  note("⚠ GQA 这一讲是第二次出现 —— 上一讲从「显存」角度，这里从「缓存」角度",640,182,"r");
  matrix({rows:7,cols:3,cw:360,ch:27,x:100,y:200,
    cell:function(i,j){var t=[["技巧","省的是","精确还是近似"],
      ["KV 缓存","重复计算","精确"],
      ["GQA","KV 缓存的大小","近似"],
      ["PagedAttention","显存碎片","精确"],
      ["MLA","KV 缓存的大小","近似"],
      ["投机解码","墙钟时间","⭐ 精确（分布一致）"],
      ["多 token 预测","墙钟时间 + 一个模型","近似"]];return t[i][j];},
    hl:function(i,j){return (i===5)?"y":"";}});},"<b>把这一段六个技巧归位，而这张表最该看的是最后两列的组合。</b><br><b>先说 GQA 为什么在这里又出现一次。</b><b>Shervine 把问题抛给学生：「上一讲有没有什么东西，能<u>减少要缓存的 key 和 value 的数量</u>？」</b><b>有人答 sparse attention —— 他说「可能，但不是这里」，然后提示：你在关注 key 和 value 的<u>数量</u>。</b><b>⇒ 答案是 <u>group query attention</u>。</b><br><b>⭐ 注意视角变了：上一讲讲 GQA 时，理由是「KV 缓存不要太大」；这一讲是<u>反过来</u>，先有了 KV 缓存这个具体对象，再回头说 GQA 正是用来压它的。</b><b>⇒ 同一个技巧，在两个不同的因果链上各出现一次 —— 这说明它的位置很核心。</b><br><b>再看那张表的两列</b>：<br><b>省「重复计算」的</b>：<b>KV 缓存（精确）。</b><br><b>省「缓存大小」的</b>：<b>GQA 与 MLA（都是近似 —— 它们改变了模型能表达的东西）。</b><br><b>省「显存碎片」的</b>：<b>PagedAttention（精确 —— 它只是换了分配方式）。</b><br><b>省「墙钟时间」的</b>：<b>投机解码与多 token 预测。</b><br><b>★★ 而最值得圈出来的一行是投机解码：<u>它是唯一一个「省时间却仍然精确」的</u>。</b><b>⇒ 多数省时间的办法都要牺牲点什么，而它靠一个接受/拒绝规则把分布一致性保住了。</b><b>⭐ 这类「看起来像近似、其实是精确」的方法最值钱，遇到了要特别留意它凭什么做到。</b>");
  SUM(0,23,{h:"六个效率技巧归位：省什么 × 精确还是近似",k:"<b>KV 缓存</b>（省重复计算，精确）· <b>GQA / MLA</b>（省缓存大小，近似）· <b>PagedAttention</b>（省显存碎片，精确）· <b>投机解码 / 多 token 预测</b>（省墙钟时间）。",m:"⭐ <b>投机解码是唯一「省时间却仍然精确」的</b> —— 多数省时间的办法要牺牲点什么，它靠接受/拒绝规则保住了分布一致性。这类方法最值钱。",w:"GQA 在这门课里<b>出现了两次</b>，视角相反：上一讲从「KV 缓存别太大」推出它，这一讲先有 KV 缓存这个对象再回头说 GQA 压它 ⇒ 说明它的位置很核心。",r:"⭐ 这张「省什么 × 精确/近似」的二维表可以直接照搬去整理你自己的优化：<b>先说省的是哪种资源，再说它改不改变结果</b>。两列都填清楚，取舍就一目了然。"});
  QUIZ(0,23,{t:"六个推理效率技巧里，哪一个是「省时间却仍然精确」的？",o:["投机解码 —— 它靠接受/拒绝规则保住了与大模型完全一致的输出分布","多 token 预测","GQA","KV 缓存"],a:0,w:"KV 缓存与 PagedAttention 是精确的但省的不是时间（省重复计算、省显存碎片）；GQA/MLA/多 token 预测都是近似的。⭐ 「看起来像近似、其实精确」的方法最值钱。"});
});
KP("完 · 这一讲给了你三样东西",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L3 · 完","Transformers 与大语言模型",
      "架构 · 解码 · 使用");},
    "收一下这一讲，三块各带走一样东西。<br><b>★★ ① 架构那一块，带走「把两件事解耦」这个动作。</b><br><b>参数量和计算量本来是绑死的 —— 参数越多，一次前向算得越久。</b><b>⭐ 而 MoE 把它们拆开了：<u>总参数</u>可以涨到万亿，而<u>激活参数</u>（真正参与这一次前向的）保持不变。</b><br><span class='w'>代价是三条：要多存那么多参数（显存）、要处理路由坍塌（辅助损失）、路由本身也要学。</span><br><b>⇒ 可带走的一般形式：<u>当两个你关心的量被绑在一起时，先问「有没有办法只让其中一个涨」</u>。</b><br><br><b>★★★ ② 解码那一块，是这一讲对你最有价值的部分，而且结局很反直觉。</b><br><b>问题是标准的搜索问题：给一个打分函数，从指数大的空间里挑一条路径。</b><br><span class='w'>贪心 —— 每步挑最大。<b>快，但局部最优 ≠ 全局最优</b>，而且完全确定（没有多样性）。</span><br><span class='w'>beam search —— 保留 k 条路径。<b>更接近全局最优</b>，但算得贵，而且<b>还要额外处理长度偏置</b>（否则它偏爱短序列）。</span><br><span class='k'>采样 —— 按概率抽。<b>有多样性</b>，而且配 top-k / top-p 把长尾切掉。</span><br><b>⭐ 而结局是：<u>实践中用的是采样，不是 beam search</u>。</b><b>讲者说得很明白 —— beam search 只在机器翻译那种「需要最可能的答案」的场合才用。</b><br><b>★★ 这个结局的教训对你很直接：<u>「更接近最优」不自动等于「更有用」</u>。</b><b>要先问清楚：你的目标函数真的是你要的那个东西吗？</b><span class='w'>⚠ 在 LLM 这里，「最可能的序列」往往是乏味、重复、甚至退化的 —— 所以人们宁可要一个概率略低但更好的输出。</span><br><b>⇒ 而你的课题里这一问有一个很清楚的版本：<u>你的代理模型的最优，和真实目标的最优，差多远？</u></b><b>如果差得远，那把搜索做得更接近代理模型的最优，只是在更精确地走错路。</b><br><br><b>★★ ③ 效率那一块，带走那个「精确 / 近似」的分法。</b><br><span class='w'>精确的（结果一模一样，只是算得更聪明）：<b>KV 缓存</b>（别重算）、<b>PagedAttention</b>（别浪费显存）、<b>MLA</b>（把要存的东西压小）。</span><br><span class='w'>近似的（结果可能不同，换速度）：<b>GQA</b>、<b>投机解码</b>、<b>多 token 预测</b>。</span><br><b>⭐ 而投机解码那一条最漂亮：用一个小模型猜几个 token，再让大模型<u>一次</u>验证全部 —— 而且有一个接受/拒绝规则保证<u>输出分布和大模型完全一致</u>。</b><b>⚠ 它成立的前提是一个硬件事实：推理时瓶颈是<u>显存带宽</u>而不是算力，所以「一次验证 5 个」和「一次验证 1 个」几乎一样快。</b><br><b>⇒ 这条对你也直接可用：<u>先搞清楚你的瓶颈是算力还是访存，再决定优化什么</u>。优化错了的那一头，花再大力气也看不到变化。</b><br><br><b>⇒ 下一讲 L4 是 LLM Training：模型怎么训出来 —— 预训练、数据、规模定律。</b>");
});
