<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS229 SVM 放映厅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;600;800&display=swap">

<style>
:root{
  --bg:#080B11; --ink:#F0F4FA; --dim:#77849A; --dimmer:#3D4658; --edge:#1B2230;
  --blue:#54A9F7; --yellow:#FFD36E; --green:#5BDDA8; --coral:#FF7C87; --violet:#B48BF5;
  --sans:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
mjx-container{color:inherit!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);margin:auto}
svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}

#eqBox{font-size:clamp(16px,2.5vw,36px);text-align:center;line-height:1.5;max-width:92%;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
#eqBox.off{opacity:0;transform:translateY(13px) scale(.97)}
#eqBox.top{align-self:flex-start;margin-top:4.5vh}

#big{font-family:var(--mono);font-size:clamp(30px,5.6vw,82px);font-weight:500;letter-spacing:-.03em;
  color:var(--yellow);text-shadow:0 0 44px rgba(255,211,110,.3);text-align:center;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
#big.off{opacity:0;transform:scale(.86)}
#big small{display:block;font-family:var(--sans);font-size:.23em;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);text-shadow:none;margin-top:.55em;font-weight:400}

#capL{align-items:flex-end;pointer-events:none}
#capL::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46vh;background:linear-gradient(to top,var(--bg) 30%,rgba(8,11,17,.72) 62%,transparent);pointer-events:none}
#capWrap{max-width:min(82ch,93%);width:100%;max-height:38vh;overflow-y:auto;margin-bottom:58px;display:flex;flex-direction:column;align-items:center;pointer-events:auto;-webkit-mask-image:none}
#cap{text-align:center;font-size:clamp(13.5px,1.56vw,22px);font-weight:400;line-height:1.55;
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#cap.off{opacity:0;transform:translateY(12px)}
#cap b{font-weight:600;color:var(--yellow)}
#cap i{font-style:normal;color:var(--blue);font-weight:600}
#cap em{font-style:normal;color:var(--green);font-weight:600}
#cap s{text-decoration:none;color:var(--coral);font-weight:600}
#narr{margin:1em 0 0;max-width:min(78ch,100%);text-align:left;
  font-size:clamp(11px,1.12vw,15.5px);font-weight:300;line-height:1.78;color:#93A1B5;
  border-top:1px solid #1E2634;padding-top:.85em;transition:opacity .4s ease}
#narr.off{opacity:0}
#narr[hidden]{display:none}
#narr b{color:#C6D2E2;font-weight:500}
#narr i{font-style:normal;color:var(--blue)}
#narr em{font-style:normal;color:var(--green)}
#narr s{text-decoration:none;color:var(--coral)}

#sum{max-width:min(98ch,93%);max-height:85vh;overflow:auto;
  background:rgba(13,18,26,.94);border:1px solid #253044;border-radius:14px;
  padding:24px 30px 22px;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#sum.off{opacity:0;transform:translateY(16px) scale(.985)}
#sum[hidden]{display:none}
#sum .sh{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--green);margin:0 0 5px}
#sum h3{font-size:clamp(17px,2.1vw,28px);font-weight:800;margin:0 0 15px;letter-spacing:-.02em;line-height:1.2}
#sum .rows{display:grid;gap:11px}
@media(min-width:900px){#sum .rows{grid-template-columns:1fr 1fr;gap:12px 26px}}
#sum .row{border-left:2px solid #2A3546;padding-left:13px}
#sum .rk{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 3px}
#sum .rv{font-size:clamp(11.5px,1.1vw,15px);font-weight:300;line-height:1.7;color:#C3CEDD;margin:0}
#sum .rv b{color:#F0F4FA;font-weight:600}
#sum .rv i{font-style:normal;color:var(--blue)}
#sum .rv em{font-style:normal;color:var(--green)}
#sum .rv s{text-decoration:none;color:var(--coral)}
#sum .row.k{border-left-color:var(--green)}
#sum .row.w{border-left-color:var(--coral)}
#sum .row.e{border-left-color:var(--yellow)}
#sum .row.m{border-left-color:var(--blue)}

#quizL{align-items:center;pointer-events:none}
#quiz{max-width:min(72ch,91%);pointer-events:auto;background:rgba(13,18,26,.95);
  border:1px solid #253044;border-radius:14px;padding:23px 27px;
  transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.3,1)}
#quiz.off{opacity:0;transform:translateY(14px);pointer-events:none}
#quiz[hidden]{display:none}
#quiz .qh{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--yellow);margin:0 0 10px}
#quiz .qq{font-size:clamp(13.5px,1.5vw,20px);font-weight:600;margin:0 0 15px;line-height:1.45}
#quiz .qo{display:flex;flex-direction:column;gap:7px}
#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;
  color:var(--ink);background:rgba(255,255,255,.045);border:1px solid #2A3546;
  border-radius:8px;padding:10px 15px;cursor:pointer;text-align:left;line-height:1.5;
  transition:background .2s,border-color .2s}
#quiz button:hover:not(.lk){border-color:var(--blue);background:rgba(84,169,247,.13)}
#quiz button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#quiz button.lk{cursor:default}
#quiz button.ok{border-color:var(--green);background:rgba(91,221,168,.15);color:var(--green)}
#quiz button.no{border-color:var(--coral);background:rgba(255,124,135,.13);color:var(--coral)}
#quiz button.off2{opacity:.32}
#quiz .why{margin:15px 0 0;font-size:clamp(11.5px,1.15vw,15px);font-weight:300;
  color:#93A1B5;line-height:1.7;border-top:1px solid #1E2634;padding-top:12px}
#quiz .why[hidden]{display:none}
#quiz .why b{color:#C6D2E2;font-weight:500}
#quiz .why em{font-style:normal;color:var(--green)}
#quiz .why s{text-decoration:none;color:var(--coral)}
#quiz .why i{font-style:normal;color:var(--blue)}

#titleL{flex-direction:column}
#titleL h1{font-size:clamp(25px,4.7vw,68px);font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.07;text-align:center;text-shadow:0 0 70px rgba(84,169,247,.25)}
#titleL p{font-size:clamp(12px,1.32vw,18px);color:var(--dim);font-weight:300;margin:2vh 0 0;letter-spacing:.05em;text-align:center;max-width:62ch}
#titleL .act{font-family:var(--mono);font-size:clamp(11px,1.18vw,15px);color:var(--blue);letter-spacing:.28em;margin:0 0 2.2vh;text-transform:uppercase}
#titleL .rule{width:60px;height:2px;background:var(--blue);margin:3.2vh auto 0;box-shadow:0 0 18px rgba(84,169,247,.7)}
.fade{transition:opacity .6s ease;display:flex;flex-direction:column;align-items:center}
.fade.off{opacity:0}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}
.tok.hl{color:var(--yellow);text-shadow:0 0 24px rgba(255,211,110,.5)}
.tok.res{color:var(--green);text-shadow:0 0 24px rgba(91,221,168,.45)}
.tok.ded{color:var(--coral);opacity:.5}
.tok.mut{color:var(--dimmer)}

#strip{position:fixed;z-index:6;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 20px}
#kps{display:flex;gap:3px;flex:1}
.kpbar{display:flex;gap:2px;flex:1;position:relative;cursor:pointer}
.pip{height:2px;flex:1;background:var(--edge);border-radius:2px;transition:background .4s}
.pip.seen{background:#2E3B50}
.pip.now{background:var(--blue);box-shadow:0 0 9px rgba(84,169,247,.85)}
.pip.sum{background:#1D3A30} .pip.sum.seen{background:#2C5C4A}
.pip.quiz{background:#3A3218} .pip.quiz.seen{background:#5C4E22}
.kplbl{position:absolute;top:-15px;left:0;font-family:var(--mono);font-size:8px;color:var(--dimmer);letter-spacing:.06em;white-space:nowrap;transition:color .3s}
.kpbar.active .kplbl{color:var(--blue)}
#hint{font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#tc{position:fixed;top:18px;left:20px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.1em;text-decoration:none;pointer-events:auto}
#tc:hover{color:var(--blue)}
#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}
.navbtn{position:fixed;top:0;bottom:44px;width:14%;background:none;border:0;cursor:pointer;opacity:0;z-index:4}
#prev{left:0} #next{right:0}
.navbtn:focus-visible{opacity:1;outline:2px solid var(--blue);outline-offset:-6px}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}
.pt{fill:var(--ink)}
.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.pt.sv{stroke:var(--yellow);stroke-width:3;fill:none;r:13}
.bnd{stroke:var(--yellow);stroke-width:3.2;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(255,211,110,.5))}
.mrg{stroke:var(--yellow);stroke-width:1.8;fill:none;stroke-dasharray:6 5;opacity:.65}
.band{fill:var(--yellow);fill-opacity:.07}
.wvec{stroke:var(--green);stroke-width:3;marker-end:url(#ah2);filter:drop-shadow(0 0 8px rgba(91,221,168,.6))}
.dist{stroke:var(--violet);stroke-width:2.2;stroke-dasharray:4 4}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.curve{stroke:var(--green);stroke-width:3;fill:none;filter:drop-shadow(0 0 10px rgba(91,221,168,.45))}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}
.box.r{stroke:var(--coral)} .box.v{stroke:var(--violet)}
.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}
.cellbg.hl3{fill:#3A1A1E;stroke:var(--coral);stroke-width:1.6}
.celltx{font-family:var(--mono);font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.celltx.d{fill:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

/* ── caption placement: P cycles bottom / top / side ──────────────────────
   The caption block carries a translucent backdrop so it stays readable even
   when it lands on top of the artwork; side mode also shifts the scene left
   so the two never fight for the same pixels. */
#capWrap{background:rgba(8,11,17,.74);backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);border-radius:13px;padding:13px 20px 15px}
#capL.pos-top{align-items:flex-start}
#capL.pos-top #capWrap{margin-bottom:0;margin-top:3.4vh}
#capL.pos-side{align-items:center;justify-content:flex-end}
#capL.pos-side #capWrap{margin-bottom:0;margin-right:2vw;max-width:min(44ch,36%);align-items:flex-start}
#capL.pos-side #cap{text-align:left}
#capL.pos-side #narr{max-width:100%}
/* Percentage translations on an SVG element resolve unreliably, so side mode
   narrows the canvas instead: preserveAspectRatio re-centres the artwork
   inside the smaller box, which moves it clear of the caption panel. */
svg#scene{transition:width .5s cubic-bezier(.2,.7,.3,1)}
body.scene-shift svg#scene{width:64%;right:auto}
#posHint{position:fixed;left:50%;top:16px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--yellow);background:rgba(8,11,17,.86);padding:5px 13px;border-radius:20px;
  opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:9}
#posHint.show{opacity:1}
/* fix: 面板 .off 立即不可见 */
#big.off,#cap.off,#eqBox.off,#titleBox.off,#sum.off,#quiz.off{visibility:hidden}
</style>

<div id="stage"><div id="frame">
  <svg id="scene" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
    <defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5BDDA8"/></marker></defs>
  </svg>
  <div class="layer" id="titleL"><div class="fade" id="titleBox"></div></div>
  <div class="layer"><div id="eqBox" class="off"></div></div>
  <div class="layer"><div id="big" class="off"></div></div>
  <div class="layer" id="capL"><div id="capWrap">
    <div id="cap" class="off"></div><p id="narr" class="off"></p>
  </div></div>
  <div class="layer"><div id="sum" class="off" hidden></div></div>
  <div class="layer" id="quizL"><div id="quiz" class="off" hidden></div></div>
</div></div>

<button class="navbtn" id="prev" aria-label="上一镜"></button>
<button class="navbtn" id="next" aria-label="下一镜"></button>
<a id="tc" href="#" target="_blank" rel="noopener">▶ L6 0:00</a>
<div id="kbd">空格 推进 · ← 回退 · N 讲解 · P 字幕位置</div>
<div id="strip"><div id="kps"></div><span id="hint"></span></div>

window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["$$","$$"]]},svg:{fontCache:"global"},startup:{typeset:false}};
</script>
<script src="../lib/tex-svg.js"></script>
<script>window.MathJax&&MathJax.version||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"><\/script>');</script>
<script src="../lib/d3.min.js"></script>
<script>window.d3||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"><\/script>');</script>
<script>
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var V6="https://www.youtube.com/watch?v=lDwow4aOrtg&t=",
    V7="https://www.youtube.com/watch?v=8NYoQiRANpg&t=";
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();}

function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(480).delay(220).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||9);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*38;}).attr("r",r||9);}
function ring(p,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt sv").attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];}).attr("fill","none");
  if(FAST)s.attr("r",r||15);else s.attr("r",0).transition().duration(DUR).delay(180).attr("r",r||15);}
function line(x1,y1,x2,y2,cls){var p=gS.append("path").attr("class",cls||"bnd")
  .attr("d","M"+x1+","+y1+"L"+x2+","+y2);
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(850).attr("stroke-dashoffset",0)
     .on("end",function(){if(cls&&cls.indexOf("mrg")>=0)d3.select(this).attr("stroke-dasharray","6 5");});}
  return p;}
function band(x1,y1a,y1b,x2,y2a,y2b){
  var e=gS.append("path").attr("class","band")
    .attr("d","M"+x1+","+y1a+"L"+x2+","+y2a+"L"+x2+","+y2b+"L"+x1+","+y1b+"Z");
  if(!FAST)e.attr("opacity",0).transition().duration(700).attr("opacity",1);}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function curve(pts,cls){var p=gS.append("path").attr("class",cls||"curve")
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(950).attr("stroke-dashoffset",0);}}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*20;rc.attr("opacity",0).transition().duration(380).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(380).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}

/* separable toy set in screen coords */
var POS=[[760,230],[850,180],[820,300],[930,250],[880,340]];
var NEG=[[430,470],[520,400],[380,380],[560,500],[470,540]];

/* ── text layers ── */
var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  if(FAST){cap.innerHTML=h;cap.classList.remove("off");return;}
  cap.classList.add("off");setTimeout(function(){cap.innerHTML=h;cap.classList.remove("off");},150);}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}
  var b={};eqBox.querySelectorAll("[data-id]").forEach(function(e){b[e.dataset.id]=e.getBoundingClientRect();});
  eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");
  if(!eqBox.animate)return;

SUM(4253,6,5,{h:"★ 函数间隔可以被任意放大",

 w:"<s>常见困惑</s>：既然可以随便缩放，那 SVM 的解岂不是不唯一？<b>正是为了解决这一点</b>才引入规范化——固定一个尺度后，解就唯一了。",

QUIZ(4253,6,5,{t:"把 w 和 b 同时乘以 5，下面哪一项会改变？",

/* ── 6 · 几何间隔 ── */
KP("6 · ★ 几何间隔",function(){
S(4458,6,function(){clearScene();setEq(null);
  dots(POS,"a");dots(NEG,"b");line(300,600,1000,120,"bnd");
  gS.append("path").attr("class","dist").attr("d","M850,180L710,384");
  note("真实的欧氏距离",900,300,"v","start");
  setEq("$$\\gamma^{(i)}=\\frac{y^{(i)}(w^{\\top}x^{(i)}+b)}{\\lVert w\\rVert}=\\frac{\\hat\\gamma^{(i)}}{\\lVert w\\rVert}$$","top");
  setCap("<b>几何间隔</b>：函数间隔<em>除以 ‖w‖</em>。<br>这才是点到边界的<i>真实欧氏距离</i>（带符号、带标签调整）。");},
  "除以 ‖w‖ 之后，缩放问题就消失了——<b>w 和 b 同乘 k，分子分母同时乘 k，比值不变</b>。所以几何间隔是一个<i>真正刻画模型好坏</i>的量，它就是点到超平面的几何距离。<s>你课程公告里专门澄清过两个说法</s>：<b>f(x)/‖w‖ 叫「带符号距离」</b>（不含标签），<b>y·f(x)/‖w‖ 叫「标签调整后的几何间隔」</b>。两者差一个 y，考试问哪个就答哪个。");
S(4458,6,function(){clearScene();setEq(null);
  matrix({rows:5,cols:4,cw:155,ch:50,y:215,
    cell:function(i,j){var t=[["点","f(x)","f/‖w‖","判定"],
      ["(1, 2)","0","0","边界上 · 违反"],["(2, 3)","2","√2","正确 · 间隔外"],
      ["(3, 3)","3","3/√2","误分类"],["(1, 1)","−1","−1/√2","正确 · 支持面上"]];return t[i][j];},
    dim:function(i,j){return i===0;},
    hl:function(i,j){return j===3&&i>0?"hl":"";},
    label:"‖w‖ = √2"});
  setCap("<b>Tutorial Q1 的完整答案表</b>。<br>带符号距离 = f(x)/‖w‖，这里 ‖w‖ = √2。");},
  "把上一张表补全。<i>w = (1,1)，所以 ‖w‖ = √(1²+1²) = √2</i>。带符号距离就是 f 除以 √2。<b>注意最后一列的判定用的是 y·f，不是距离</b>——(3,3) 的距离是 3/√2 很大，但因为 y·f = −3 < 0，它<s>依然是误分类</s>。距离大不代表分对，这是最容易搞混的一点。");
});
SUM(4458,6,6,{h:"★ 几何间隔：除以 ‖w‖",
 k:"几何间隔 γ = <b>y·f(x) / ‖w‖</b>，是点到超平面的真实欧氏距离（经标签调整）。除以 ‖w‖ 后，<em>缩放问题被彻底消除</em>——w、b 同乘 k，分子分母同时乘 k，比值不变。",
 m:"你课程公告区分了两个说法：<b>f(x)/‖w‖ 是「带符号距离」</b>（只看在哪一侧、多远，不含标签）；<b>y·f(x)/‖w‖ 是「标签调整后的几何间隔」</b>（把对错也编码进去）。<i>差一个 y</i>。",
 w:"<s>最易混的一点</s>：距离大 ≠ 分对。(3,3) 距边界 3/√2 很远，但 y·f = −3 < 0，<b>仍是误分类</b>——它远在<i>错误的一侧</i>。判定永远看 y·f 的符号，不看距离大小。",
 e:"<b>T4 Tutorial Q1 完整答案</b>：‖w‖=√2，四点的带符号距离依次是 0、√2、3/√2、−1/√2，判定依次是<i>边界上（违反）、正确在间隔外、误分类、正确在支持面上</i>。这张表要能默写。"});
QUIZ(4458,6,6,{t:"某点到决策边界的距离是 3/√2（相当远），但它的 y·f(x) = −3。这个点是？",
 o:["正确分类，而且离边界很远，非常可靠","<b>误分类</b>——它远在<i>错误的一侧</i>",
    "恰好在边界上","无法判断，还需要知道 ‖w‖"],
 a:1,
 w:"<b>判定只看 y·f(x) 的符号</b>：<i>y·f < 0 就是误分类</i>，与距离多远无关。<br><br>这个点距边界 3/√2 确实很远——但它远在<s>错误的那一侧</s>，说明模型不仅错了，还错得很有把握。<br><br>这正是 T4 Tutorial Q1 里 <b>(3,3) 那个点</b>。把「距离远」误读成「分得好」是这道题最常见的失分点。"});

/* ── 7 · 规范化 ── */
KP("7 · ★★ 规范化",function(){
S(504,7,function(){clearScene();setEq(null);
  setEq("$$\\max_{w,b}\\ \\gamma\\quad \\text{s.t.}\\quad y^{(i)}(w^{\\top}x^{(i)}+b)\\ge\\gamma,\\ \\ \\forall i$$","top");
  dots(POS,"a");dots(NEG,"b");line(300,620,1000,140,"bnd");
  line(340,500,1040,20,"mrg");line(260,720,960,240,"mrg");
  band(300,500,720,1000,20,240);
  setCap("把目标写成优化问题：<b>最大化 γ</b>，<br>约束是<em>每个点的间隔都不小于 γ</em>。");},
  "读这个式子：γ 是「所有点里最小的那个间隔」，我们要把这个最小值<b>撑到最大</b>——这叫 max-min 问题。约束条件保证了<i>没有任何一个点侵入间隔带</i>。<s>但这个形式还不能直接解</s>，因为上一个知识点说过：γ 可以靠缩放随意放大，优化器会把它推到无穷。必须先把尺度钉死。");
S(508,7,function(){clearScene();setEq(null);
  flip(T("fix","令函数间隔 = ")+T("one","1","hl")+T("th"," ⟹ ")+T("res","约束变成 y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b) ≥ 1","res"));
  setCap("<b>规范化</b>（canonical scaling）：<br>干脆规定<em>最近那个点的函数间隔正好等于 1</em>。");},
  "这一步是纯粹的<b>约定</b>，不损失任何一般性——因为我们本来就可以随意缩放，那就挑一个方便的尺度。<i>选 1 是为了式子好看</i>，选 7 也行，只是后面全是 7。规范化之后，缩放自由度被消除，<s>解变成唯一的</s>。你课程公告里的「under canonical scaling」指的就是这个约定，后面那两个公式全都建立在它之上。");
S(508,7,function(){clearScene();setEq(null);
  dots(POS,"a");dots(NEG,"b");
  line(300,620,1000,140,"bnd");line(340,500,1040,20,"mrg");line(260,720,960,240,"mrg");
  band(300,500,720,1000,20,240);
  ring([[850,180],[430,470],[520,400]]);
  setEq("$$\\text{单侧} = \\frac{1}{\\lVert w\\rVert},\\qquad \\text{全宽} = \\frac{2}{\\lVert w\\rVert}$$","top");
  note("单侧 1/‖w‖",700,255,"y");note("全宽 2/‖w‖",640,470,"y");
  setCap("<b>规范化的直接后果，也是你必背的两个式子。</b><br>边界到支持面：<em>1/‖w‖</em>；两条支持面之间：<em>2/‖w‖</em>。");},
  "推导很短：支持面上的点满足 y·f = 1，代进几何间隔公式得 <b>1/‖w‖</b>。上下各一条，所以全宽是它的两倍。<s>最常见的失分就是把这两个记反</s>——「1/‖w‖ 是单侧，2/‖w‖ 是全宽」，考试里问 margin width 答的是<i>后者</i>。另外注意：<b>最大化 2/‖w‖ 等价于最小化 ½‖w‖²</b>，这就是 SVM 目标函数长成那样的原因。");
});
SUM(508,7,7,{h:"★★ 规范化与两个必背公式",
 k:"<b>规范化</b>：规定最近点的函数间隔正好等于 1，于是约束变成 <i>y⁽ⁱ⁾(wᵀx⁽ⁱ⁾+b) ≥ 1</i>。直接后果是两个必背式子——<em>单侧间隔 = 1/‖w‖</em>，<em>全宽 = 2/‖w‖</em>。",
 m:"支持面上的点满足 y·f = 1，代入几何间隔 y·f/‖w‖ 得 1/‖w‖；上下各一条所以全宽翻倍。又因为最大化 2/‖w‖ ⟺ <b>最小化 ½‖w‖²</b>，SVM 的目标函数才写成那个形式。",
 w:"<s>把单侧和全宽记反是最高频失分</s>。记法：<b>「1 是一侧，2 是两侧」</b>。考试问 margin width（间隔宽度）答的是 <i>2/‖w‖</i>。另外规范化是<b>约定</b>不是定理，不损失一般性。",
 e:"<b>T4 Tutorial Q2 第 1 问原题</b>：w = (3,4)，求单侧距离和全宽。‖w‖ = √(9+16) = 5，所以单侧 = <i>1/5 = 0.2</i>，全宽 = <i>2/5 = 0.4</i>。这题必须秒答。"});
QUIZ(508,7,7,{t:"规范化下 w = (6, 8)，间隔的<b>全宽</b>是？",
 o:["0.1","<b>0.2</b>","10","0.05"],
 a:1,
 w:"‖w‖ = √(6² + 8²) = √(36+64) = √100 = <b>10</b>。<br><br>· 单侧间隔 = 1/‖w‖ = <i>0.1</i><br>· <b>全宽 = 2/‖w‖ = 0.2</b><br><br><s>选项 A（0.1）是最经典的陷阱</s>——那是<em>单侧</em>距离。题目问 width（宽度）就是两侧之和。<br><br>你课程 T4 Tutorial Q2 用的是 w=(3,4)，答案 0.2 和 0.4，同一个套路。"});

/* ── 8 · 判定约定 ── */
KP("8 · ★★ 判定约定",function(){
S(508,7,function(){clearScene();setEq(null);

    cell:function(i,j){var t=[["情形","判定"],
      ["f(x) = 0","在边界上 · 无严格类别 · 算违反"],
      ["y·f(x) < 1","margin violation（间隔违反）"],
      ["y·f(x) < 0","misclassified（误分类）"],
      ["ξ = 1","恰好落在决策边界上"],
      ["y·f(x) ≥ 1","正确且在间隔之外"]];return t[i][j];},
    dim:function(i,j){return i===0;},

  "三条界线要分清：<b>y·f ≥ 1</b> 是「安全区」，正确且在间隔之外；<b>0 ≤ y·f < 1</b> 是「侵入间隔但仍分对」；<b>y·f < 0</b> 才是分错。所以<i>「违反间隔」比「分错」宽松得多</i>——一个点可以既分对又违反间隔。<s>f(x) = 0 是特例</s>：它正好在边界上，没有严格的预测类别，手算时<b>不算作正确分类</b>，同时因为 y·f = 0 < 1，它<b>也是一个违反</b>。");
});
SUM(508,7,8,{h:"★★ 三条界线，别记混",
 k:"<b>y·f ≥ 1</b>：正确且在间隔外（安全）。<b>0 ≤ y·f < 1</b>：侵入间隔但仍分对。<b>y·f < 0</b>：误分类。<em>f(x) = 0 是特例</em>——在边界上、无严格类别、手算不计为正确，且因 y·f = 0 < 1 同时是违反。",
 m:"「<b>违反间隔</b>」的门槛是 1，「<b>误分类</b>」的门槛是 0。前者比后者宽松得多，所以<i>一个点完全可以既分对又违反间隔</i>——它落在间隔带里面。松弛变量 ξ = max(0, 1 − y·f) 度量的正是侵入的深度。",
 w:"<s>三个高频错误</s>：① 把 f=0 当成「正确分类」；② 把「违反间隔」等同于「分错」；③ 忘了 ξ = 1 对应<b>恰好在边界上</b>（而 ξ > 1 才是真的分错）。",
 e:"<b>你课程为此专门发过公告澄清</b>，说明是往年易错点。这张表是 T4 计算题的判定依据，必须能默写。Tutorial Q1 的四个判定就是照它给出的。"});
QUIZ(508,7,8,{t:"某点 y = +1，f(x) = 0，‖w‖ = 2。按你课程的约定，它是？",
 o:["正确分类，且在间隔外","<b>在边界上，无严格预测类别，且因 y·f = 0 < 1 是一个间隔违反</b>",

/* ── 9 · w 是样本的线性组合 ── */
KP("9 · w 的构成",function(){
S(760,7,function(){clearScene();setEq(null);
  setEq("$$w=\\sum_{i=1}^{m}\\alpha_i y^{(i)} x^{(i)}$$","top");
  dots(POS,"a");dots(NEG,"b");line(300,600,1000,120,"bnd");
  gS.append("path").attr("class","wvec").attr("d","M650,360L760,250");
  note("w",790,235,"g");
  setCap("一个关键结论：<b>w 一定是训练样本的线性组合</b>。<br>每个样本贡献一份，权重是 <em>αᵢ</em>。");},
  "这个结论看起来抽象，但它是<b>整个对偶推导的枢纽</b>。直觉上：w 决定了边界的方向，而边界只可能由数据决定，所以 w 必然是数据的某种加权和。<i>大部分 αᵢ 会等于 0</i>——那些样本对 w 毫无贡献。只有少数 αᵢ > 0 的样本参与其中，<s>它们就是支持向量</s>。这也解释了 SVM 名字的由来。");
S(1012,7,function(){clearScene();setEq(null);
  dots(POS,"a");dots(NEG,"b");line(300,600,1000,120,"bnd");
  gS.append("path").attr("class","wvec").attr("d","M650,360L775,178");
  note("w  ⊥  边界",800,165,"g","start");
  setCap("顺带一个几何事实：<b>w 永远垂直于决策边界</b>。");},
  "证明一行：取边界上任意两点 x₁、x₂，都满足 wᵀx + b = 0，相减得 <b>wᵀ(x₁ − x₂) = 0</b>——w 与边界上任意方向的内积为零，所以垂直。<i>这就是为什么 ‖w‖ 出现在距离公式的分母里</i>：把点到边界的位移投影到单位法向量 w/‖w‖ 上，就得到距离。<s>你课程不会直接考这个证明</s>，但它能让那两个公式不再是死记。");
});
SUM(760,7,9,{h:"w 由样本加权而成，且垂直于边界",
 k:"最优解满足 <b>w = Σ αᵢ y⁽ⁱ⁾ x⁽ⁱ⁾</b>——w 是训练样本的<i>线性组合</i>。大部分 αᵢ = 0，<em>只有 αᵢ > 0 的样本真正参与</em>，它们就是支持向量。",
 m:"另一个几何事实：<b>w 垂直于决策边界</b>。证明只需一行——边界上任意两点都满足 wᵀx+b=0，相减得 wᵀ(x₁−x₂)=0。这解释了为什么距离公式的分母是 ‖w‖：距离 = 位移在单位法向量上的投影。",
 w:"<s>误解</s>：以为所有样本都在决定边界。实际上<b>绝大多数样本的 α 是 0</b>，删掉它们边界一点不变。只有支持向量重要——这是 SVM 稀疏性的来源。",
 e:"<b>T4 Practical 会让你看 <i>.n_support_</i> 和 <i>.support_</i></b>，就是在数 αᵢ > 0 的样本。支持向量数量常被用作模型复杂度的代理指标——<i>比较配置时，准确率相同则取支持向量少的那个</i>。"});
QUIZ(1012,7,9,{t:"训练完成后，把一个<b>远离边界</b>、α = 0 的样本从训练集中删掉，再重新训练。结果会怎样？",
 o:["边界会明显改变","<b>边界几乎不变</b>——它对 w 的贡献本来就是 0",
    "模型将无法收敛","支持向量的数量会翻倍"],
 a:1,
 w:"因为 <b>w = Σ αᵢ y⁽ⁱ⁾ x⁽ⁱ⁾</b>，α = 0 的样本对 w 的贡献<em>恰好是零</em>。删掉它，w 的表达式一项没少。<br><br>这就是 SVM 的<b>稀疏性</b>：只有支持向量决定边界，其余样本可以全部丢弃。<br><br>反过来说——<s>移动一个支持向量，边界就会跟着动</s>。你课程 T4 Workflow 幻灯里那句「Move one → the boundary may move；Move a distant point → solution usually unchanged」说的正是这件事。"});

/* ── 10 · 对偶与内积 ── */
KP("10 · 对偶与内积",function(){
S(1266,7,function(){clearScene();setEq(null);
  setEq("$$\\max_\\alpha\\ \\sum_i\\alpha_i-\\tfrac12\\sum_{i,j}y^{(i)}y^{(j)}\\alpha_i\\alpha_j\\,\\langle x^{(i)},x^{(j)}\\rangle$$","top");
  setCap("把 w 代回去，整个问题<b>只剩下 α</b>。<br>而且——<em>数据只以「内积」的形式出现</em>。");},
  "这是<b>对偶形式</b>。原来的参数是 w（维度等于特征数），现在换成了 α（维度等于样本数）。这个转换本身有价值，但<i>真正关键的是最后那个尖括号</i>：<b>训练数据 x 只出现在两两内积里</b>，从不单独出现。这个观察是接下来一切的基础——<s>如果算法只需要内积，那我们根本不必知道特征向量本身长什么样</s>。");
S(1521,7,function(){clearScene();setEq(null);
  setEq("$$f(x)=\\sum_i \\alpha_i y^{(i)}\\langle x^{(i)},x\\rangle+b$$","top");
  setCap("<b>预测时也一样</b>：新样本只通过<em>内积</em>与训练样本发生关系。");},
  "训练和预测<b>双双只依赖内积</b>——这是核方法能成立的全部前提。注意预测式里的求和：<i>只有 αᵢ ≠ 0 的项有贡献</i>，所以实际上只需要遍历支持向量，而不是全部训练样本。<s>这也是 SVM 预测比 KNN 快的原因</s>：KNN 要比对全部数据，SVM 只比对支持向量。");
});
SUM(1266,7,10,{h:"对偶形式：数据只以内积出现",
 k:"把 w = Σαᵢy⁽ⁱ⁾x⁽ⁱ⁾ 代回目标函数，问题从「求 w」变成「<b>求 α</b>」。关键观察是：<em>训练数据只以两两内积 ⟨x⁽ⁱ⁾, x⁽ʲ⁾⟩ 的形式出现</em>，从不单独出现。",
 m:"预测式 f(x) = Σαᵢy⁽ⁱ⁾⟨x⁽ⁱ⁾, x⟩ + b 同样只用内积，而且<b>只有 αᵢ ≠ 0 的项有贡献</b>——只需遍历支持向量。训练和预测双双只依赖内积，这是核方法成立的<i>全部前提</i>。",
 w:"<s>参数维度变了</s>：原问题的参数是 w（维度 = 特征数 n），对偶问题的参数是 α（维度 = 样本数 m）。特征多样本少时对偶更划算，反之则原问题更划算。",
 e:"你课程<b>不要求推导对偶</b>，但要理解这个结论：<i>SVM 只通过内积接触数据</i>。这是 T4 Tutorial Q3「核技巧避免了什么」的答案基础，也是 <b>0 ≤ α ≤ C</b> 那道 extension 题的背景。"});
QUIZ(1521,7,10,{t:"为什么「数据只以内积形式出现」这个观察如此重要？",
 o:["因为内积计算很快","<b>因为只要能算出内积，就不必知道特征向量本身长什么样</b>——这为核技巧打开了大门",
    "因为内积保证了凸性","因为它减少了参数数量"],
 a:1,
 w:"这是核方法的<b>逻辑起点</b>。<br><br>如果算法在任何地方都需要 φ(x) 本身，那高维映射就必须真的算出来，维度一爆炸就完蛋。<br><br>但既然算法<em>只需要 ⟨φ(x), φ(z)⟩ 这个数</em>，我们就可以绕过 φ，<s>用一个函数直接算出这个内积</s>。<br><br>这就是下一个知识点——核技巧。"});

/* ── 11 · 特征映射 ── */
KP("11 · 特征映射",function(){
S(1771,7,function(){clearScene();setEq(null);
  setEq("$$\\phi(x_1,x_2)=\\bigl(x_1^2,\\ \\sqrt{2}\\,x_1x_2,\\ x_2^2\\bigr)$$","top");
  boxNode(200,320,300,100,"原始特征  (x₁, x₂)","b");
  boxNode(780,320,300,100,"高维特征  φ(x)","v");
  link(500,370,780,370);
  note("2 维",350,460,"b");note("3 维（或更高）",930,460,"v");
  setCap("<b>特征映射 φ</b>：把原始特征<em>换成它们的组合</em>。<br>直线在新空间里，回到原空间就成了曲线。");},
  "这就是知识点 1 埋的那个伏笔。<i>在 φ 的空间里做线性分类，映射回原空间就是非线性边界</i>——这是所有核方法的核心思想。<s>问题是维度爆炸</s>：n 个特征做二次映射会产生约 n²/2 个新特征，n=100 时是五千多，n=10000 时是五千万。<b>光是把 φ(x) 写下来就不可行</b>，更别说计算。");
S(2279,7,function(){clearScene();setEq(null);
  flip(T("l","⟨φ(x), φ(z)⟩")+T("e"," = ")+T("a","x₁²z₁²")+T("p1"," + ")+T("b","2x₁x₂z₁z₂")+T("p2"," + ")+T("c","x₂²z₂²"));
  setCap("把内积<b>展开</b>看看。");},
  "按定义逐项相乘：φ(x) 的三个分量分别是 x₁²、√2·x₁x₂、x₂²，φ(z) 同理。<i>对应相乘再相加</i>，中间那项的两个 √2 相乘正好得 2。看起来只是一堆项——但下一镜会看到，这堆项<b>可以被合并成一个极简的形式</b>。");
S(2279,7,function(){clearScene();setEq(null);
  flip(T("l","⟨φ(x), φ(z)⟩")+T("e"," = ")+T("res","(x₁z₁ + x₂z₂)²","res")+T("e2"," = ")+T("res2","(xᵀz)²","res"));
  setCap("<b>完全平方公式。</b>那三项正好是 <em>(x₁z₁ + x₂z₂)²</em> 的展开。<br>也就是 <b>(xᵀz)²</b>。");},
  "这一步是<b>整个核方法的高光时刻</b>。左边要先算出两个三维向量再做内积；右边只需<i>算一次原始内积再平方</i>。<s>结果完全相同</s>。这就是你课程 <b>T4 Tutorial Q3 第 2 问</b>要你证明的东西——展开 φ(x)·φ(y) 并说明它等于多项式核 (xᵀy)²。第 1 问还要你算 φ(1,1) = (1, √2, 1) 和 φ(2,2) = (4, 4√2, 4)。");
});
SUM(1771,7,11,{h:"特征映射与那个完全平方",
 k:"<b>φ 把原始特征换成它们的组合</b>，在 φ 空间里的线性边界，映射回原空间就是曲线。但维度会爆炸——n 个特征做二次映射产生约 n²/2 个新特征。<em>关键发现</em>：φ(x)·φ(z) 展开后正好等于 <b>(xᵀz)²</b>。",
 m:"逐项展开 φ(x)·φ(z) 得 x₁²z₁² + 2x₁x₂z₁z₂ + x₂²z₂²，按<i>完全平方公式</i>合并就是 (x₁z₁+x₂z₂)²。左边要构造三维向量再内积，右边只需一次原始内积再平方——<b>结果相同，代价天差地别</b>。",
 w:"<s>注意 √2 的作用</s>：φ 的中间分量写成 √2·x₁x₂ 而不是 x₁x₂，正是为了让展开后交叉项的系数变成 2，从而凑出完全平方。<b>少了这个 √2 就凑不出来</b>。",
 e:"<b>T4 Tutorial Q3 原题</b>：第 1 问算 φ(1,1) = <i>(1, √2, 1)</i> 和 φ(2,2) = <i>(4, 4√2, 4)</i>；第 2 问展开 φ(x)·φ(y) 证明等于 (xᵀy)²。这两问都要能完整写出。"});
QUIZ(2279,7,11,{t:"φ(x₁,x₂) = (x₁², √2·x₁x₂, x₂²)。计算 <b>φ(2, 2)</b>。",
 o:["(2, 2√2, 2)","<b>(4, 4√2, 4)</b>","(4, 8, 4)","(2, 4, 2)"],
 a:1,
 w:"逐个分量代入 x₁ = 2、x₂ = 2：<br><br>· 第一项 x₁² = 2² = <b>4</b><br>· 第二项 √2·x₁x₂ = √2 · 2 · 2 = <b>4√2</b><br>· 第三项 x₂² = 2² = <b>4</b><br><br>所以 φ(2,2) = <em>(4, 4√2, 4)</em>。<br><br><s>选项 C 的错误</s>是把 4√2 化成了 8——但 4√2 ≈ 5.66，不是 8。<b>保留根号</b>，这是 T4 Tutorial Q3 第 1 问的原题。"});

/* ── 12 · 核技巧 ── */
KP("12 · ★★ 核技巧",function(){
S(2279,7,function(){clearScene();setEq(null);
  matrix({rows:3,cols:3,cw:230,ch:56,y:250,
    cell:function(i,j){var t=[["","先构造 φ 再内积","直接算 (xᵀz)²"],
      ["步骤","造两个 O(n²) 维向量，再做内积","算一次内积，平方"],
      ["代价","O(n²)","O(n)"]];return t[i][j];},
    dim:function(i,j){return i===0||j===0;},
    hl:function(i,j){return j===2&&i>0?"hl2":(j===1&&i>0?"hl3":"");}});
  setCap("<b>代价对比。</b>右边这条路<em>快了一个数量级</em>，<br>而且<s>从来没有真的写下过 φ(x)</s>。");},
  "这就是<b>核技巧</b>（kernel trick）：定义一个函数 <i>K(x,z) = ⟨φ(x), φ(z)⟩</i>，然后<b>只用 K，永远不碰 φ</b>。于是特征空间可以是 5000 维、5000 万维、甚至<em>无穷维</em>——只要 K 算得出来就行。高斯核对应的正是一个无穷维的 φ。<s>但这里有个必须记准的边界</s>，下一镜说。");
S(2279,7,function(){clearScene();setEq(null);
  boxNode(180,200,420,88,"避免了：显式构造 φ(x)","g");
  boxNode(180,330,420,88,"没有避免：成对核计算的开销","r");
  note("m 个样本 ⟹ m² 次核求值",390,470,"r");
  note("✓",680,248,"g","start");
  note("✗",680,378,"r","start");
  setCap("<b>核技巧到底避免了什么？</b><br>避免的是<em>构造特征</em>，<s>不是降低计算量</s>。");},
  "这个区分是 <b>T4 Tutorial Q3 第 3 问</b>的原题，答错率很高。核技巧让高维甚至无穷维的特征空间变得<i>可操作</i>，但<b>不保证训练便宜</b>——因为核矩阵是 m×m 的，样本数增大时成对核求值的数量按 m² 增长，存储和计算都会成为瓶颈。<s>所以 SVM 在超大数据集上反而不如线性模型好用</s>。标准答法：「避免了显式构造变换后的特征，直接计算它们的内积；但由于样本增多时仍需大量成对核求值，<b>并不保证训练便宜</b>。」");
});
SUM(2279,7,12,{h:"★★ 核技巧：省的是构造，不是计算",
 k:"定义 <b>K(x,z) = ⟨φ(x), φ(z)⟩</b>，算法全程只用 K、<em>永不构造 φ</em>。于是特征空间可以是几千维、几千万维甚至<b>无穷维</b>（高斯核就是无穷维）。",
 m:"以 (xᵀz)² 为例：先造 φ 再内积是 <i>O(n²)</i>，直接算 (xᵀz)² 只要 <i>O(n)</i>，<b>结果完全相同</b>。之所以可行，是因为对偶形式里数据只以内积出现。",
 w:"<s>最高频的答错点</s>：以为核技巧让训练变快。<b>它避免的是「构造特征」，不是「计算量」</b>。核矩阵是 m×m 的，样本数增大时成对求值按 m² 增长，反而成为瓶颈。",
 e:"<b>T4 Tutorial Q3 第 3 问原题</b>：「核技巧精确地避免了什么？它保证大数据集上训练便宜吗？」标准答案：<i>避免显式构造变换特征、直接计算内积；但不保证训练便宜，因为样本增多时仍需大量成对核求值</i>。<b>两句都要写</b>。"});
QUIZ(2279,7,12,{t:"关于核技巧，下面哪句<b>最准确</b>？",
 o:["它保证在超大数据集上训练依然很快","<b>它避免显式构造高维特征、直接计算内积；但不保证训练便宜</b>",
    "它把非线性问题转化成了线性回归","它自动减少了特征数量"],
 a:1,
 w:"两个半句<b>缺一不可</b>，这是 T4 Tutorial Q3 第 3 问的标准答案结构。<br><br>· <em>前半句</em>：核技巧让高维/无穷维特征空间变得可操作，因为我们从不写下 φ(x)<br>· <s>后半句</s>：但核矩阵是 m×m 的，样本量增大时成对核求值的开销按 m² 增长，<b>训练反而可能很贵</b><br><br>只答前半句会被扣分——出题人专门问了「Does it guarantee that training is inexpensive for a large dataset?」"});

/* ── 13 · 核作为相似度 ── */
KP("13 · 核 = 相似度",function(){
S(3031,7,function(){clearScene();setEq(null);
  var P={l:340,r:940,t:170,b:470};
  gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.r).attr("y1",P.b).attr("y2",P.b);
  curve(fn(function(x){var d=(x-640)/95;return 470-280*Math.exp(-d*d/2);},340,940,90));
  note("‖x − z‖",940,505,"","end");note("K(x,z)",330,185,"g","end");
  setEq("$$K(x,z)=\\exp\\!\\left(-\\frac{\\lVert x-z\\rVert^2}{2\\sigma^2}\\right)$$","top");
  setCap("<b>高斯核</b>（RBF）。可以把它读成一个<em>相似度</em>：<br>两点越近，K 越接近 1；越远，K 越接近 0。");},
  "这是理解核最直观的角度：<b>K(x,z) 衡量 x 和 z 有多像</b>。相似的向量内积大，不相似的内积小。高斯核把这个直觉做到极致——完全重合时 K = 1，距离趋于无穷时 K → 0。<i>它对应的 φ 是无穷维的</i>，但我们永远不需要写出来。<s>sklearn 里的 gamma 就是这里的 1/(2σ²)</s>：σ 小 ⟺ gamma 大 ⟺ 衰减快 ⟺ 影响范围局部。");
S(3536,7,function(){clearScene();setEq(null);
  var P={l:200,r:1080,t:170,b:450};
  [[0.35,"γ 小 · 影响范围广"],[1.0,"γ 中等"],[3.2,"γ 大 · 影响很局部"]].forEach(function(cfg,k){
    var cx=340+k*300;
    gS.append("line").attr("class","axline").attr("x1",cx-120).attr("x2",cx+120).attr("y1",430).attr("y2",430);
    curve(fn(function(x){var d=(x-cx)/(70/Math.sqrt(cfg[0]));return 430-190*Math.exp(-d*d/2);},cx-120,cx+120,60));
    note(cfg[1],cx,490,k===2?"y":(k===0?"b":""));});
  setCap("<b>gamma 控制影响范围。</b><br>γ 小 → 曲线胖 → 边界平滑 → <s>可能欠拟合</s>；<br>γ 大 → 曲线瘦 → 边界细碎 → <s>可能过拟合</s>。");},
  "把三条曲线并排看就很清楚：<b>gamma 决定每个训练点的「影响半径」</b>。γ 大时每个点只影响自己周围一小圈，边界会被雕得很碎，贴合训练数据但泛化差；γ 小时每个点影响很广，边界平滑，可能连该分开的都分不开。<s>这和 C 是两个不同的旋钮</s>——C 管「违反的惩罚」，gamma 管「影响的范围」，你课程 T4 Practical Q4 要求同时搜索这两个参数。");
});
SUM(3031,7,13,{h:"核是相似度，gamma 是影响半径",
 k:"核可以读成<b>相似度函数</b>：K(x,z) 越大表示两点越像。高斯核（RBF）<em>K = exp(−γ‖x−z‖²)</em> 把这个直觉做到极致——重合时为 1，远离时趋于 0。它对应的 φ 是<i>无穷维</i>的。",
 m:"<b>gamma = 1/(2σ²)</b> 控制影响半径。<i>γ 大</i> ⟹ 衰减快 ⟹ 每点只影响周围一小圈 ⟹ 边界细碎 ⟹ <s>过拟合</s>；<i>γ 小</i> ⟹ 影响范围广 ⟹ 边界平滑 ⟹ <s>欠拟合</s>。",
 w:"<s>别把 gamma 和 C 混为一谈</s>：<b>C 管「违反间隔的惩罚有多重」，gamma 管「每个点的影响范围有多大」</b>。两者都调大会得到又窄又碎的边界，是过拟合的典型组合。",
 e:"<b>T4 Practical Q4 要求同时搜索 C 和 gamma</b>（4×3 网格）。答题时要能分别解释「很小」和「很大」的取值各自造成什么，并指出<i>单次验证划分 + 有限网格只能找出该划分下的最佳设置</i>，不是普遍最优。"});
QUIZ(3536,7,13,{t:"RBF 核的 <b>gamma 调大</b>，会发生什么？",
 o:["边界变平滑，倾向欠拟合","<b>每个点的影响范围变局部，边界更细碎，倾向过拟合</b>",
    "等价于增大 C","与边界形状无关，只影响训练速度"],
 a:1,
 w:"gamma 越大，exp(−γ‖x−z‖²) 衰减越快，<b>每个训练点的影响半径越小</b>。<br><br>结果是边界被雕成一个个贴着数据点的小岛——训练集上表现极好，<s>泛化很差</s>。<br><br><b>两个旋钮要分清</b>：<br>· <i>C</i> —— 违反间隔的惩罚权重<br>· <i>gamma</i> —— 每个点的影响范围<br><br>两个都调大 ⟹ 边界又窄又碎 ⟹ 典型的过拟合组合。"});

/* ── 14 · 软间隔 ── */
KP("14 · ★★ 软间隔",function(){
S(4041,7,function(){clearScene();setEq(null);
  dots(POS,"a");dots(NEG,"b");
  dots([[600,430]],"a",10);
  line(300,620,1000,140,"bnd");line(340,500,1040,20,"mrg");line(260,720,960,240,"mrg");
  band(300,500,720,1000,20,240);
  note("一个越界的点",600,480,"r");
  setCap("现实里数据<b>常常不可分</b>。<br>只要有<em>一个</em>点越界，前面那个「所有点都要 ≥ 1」的约束就<s>无解</s>。");},
  "硬间隔 SVM 有两个硬伤。<b>其一</b>：数据线性不可分时<i>根本无解</i>。<b>其二</b>更隐蔽：即使可分，<s>一个离群点也能把整条边界拽歪</s>——因为约束要求它也必须满足间隔，边界只好为它让路。解法是<b>允许违反，但要付出代价</b>。");
S(4041,7,function(){clearScene();setEq(null);
  setEq("$$\\min_{w,b,\\xi}\\ \\tfrac12\\lVert w\\rVert^2+C\\sum_i\\xi_i \\quad\\text{s.t.}\\quad y^{(i)}(w^{\\top}x^{(i)}+b)\\ge 1-\\xi_i,\\ \\ \\xi_i\\ge 0$$","top");
  setCap("<b>软间隔</b>：给每个点一个<em>松弛变量 ξᵢ</em>，<br>允许它侵入间隔，但在目标函数里<b>按 C 收费</b>。");},
  "读这个式子的两项：<b>½‖w‖²</b> 要间隔宽，<b>C·Σξ</b> 要违反少，<i>两者互相拉扯</i>。ξᵢ 的含义是「第 i 个点侵入了多深」，公式是 <b>ξᵢ = max(0, 1 − y·f)</b>。<s>你课程公告特别澄清了两个数值</s>：<b>ξ = 1 时点恰好落在决策边界上</b>；<b>ξ > 1 才是真的分错</b>。这两个数要记准。");

function go(n,force){
  n=Math.max(0,Math.min(SHOTS.length-1,n));
  if(n===cur)return;
  if(locked&&n>cur&&!force)return;
  FAST=true;clearScene();
  for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}
  FAST=false;
  cur=n;clearQuiz();clearSum();
  var sh=SHOTS[n];
  if(sh.enter)sh.enter();
  setNarr(sh.n);
  if(sh.sum){setNarr(null);showSum(sh.sum.kp,sh.sum.s);}
  if(sh.quiz){setNarr(null);askQ(sh.quiz.kp,sh.quiz.q);}
  pipEls.forEach(function(p,i){if(!p)return;
    var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
    p.className=base+(i===n?" now":(i<n?" seen":""));});
  var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
  [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});
  document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  先回答":"");
  var tc=document.getElementById("tc"),src=sh.src||7;
  tc.textContent="▶ L"+src+" "+hhmmss(sh.t);
  tc.href=(src===6?V6:V7)+Math.round(sh.t)+"s";}
window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;

  if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
