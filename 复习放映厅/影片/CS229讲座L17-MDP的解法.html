<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}
  var b={};eqBox.querySelectorAll("[data-id]").forEach(function(e){b[e.dataset.id]=e.getBoundingClientRect();});

       note("⚠ 注意它依赖 π —— 换个策略，这 11 个数全都会变",640,398,"r");},"<b>价值函数是这一讲的第一块地基。</b>Ng 的定义很直白：<b>V^π(s) 是「从状态 s 出发、执行策略 π」的期望总回报。</b><br><b>拆成三步看</b>：<b>① 把机器人放在状态 s；② 让它一路按策略 π 行动；③ 算它能拿到的期望总回报</b>（就是上一讲那个带 γ 折扣的和）。<br><b>⭐ 结果是：每个状态都得到一个数。</b>网格世界有 11 个状态，<b>V^π 就是 11 个数</b>。<br><b>⚠ 一个很要紧的细节：它依赖 π。</b><b>换一个策略，这 11 个数全都会变。</b>所以<b>「价值函数」永远是「某个策略的价值函数」</b>——<b>后面会看到还有另一种价值函数，Ng 说这是术语上最容易混的地方。</b><br><b>⭐ 为什么这个定义有用？因为它把「策略好不好」这个笼统问题，落到了每个状态上的一个具体数字。</b>");
  S(427,function(){clearScene();setEq(null);setCap("在网格世界里，V^π 就是写在格子上的 11 个数");
   grid(360,196,140,56,4,3,function(i,j){
     if(i===1&&j===1) return ["墙","d"];
     if(i===3&&j===0) return ["+1","g"];
     if(i===3&&j===1) return ["−1","r"];
     if(j===0) return [(i===0?"0.69":(i===1?"0.75":"0.81")),"b"];
     if(j===1) return [(i===0?"0.65":"0.49"),"b"];
     return [(i===0?"0.61":(i===1?"0.57":(i===2?"0.49":"0.28"))),"b"];});
   note("⭐ 离 +1 越近的格子，值越高；−1 旁边的格子被拉低",640,172,"y");
   note("⚠ 这些数不是奖励，是「从这里出发最终能拿多少」",640,398,"r");},"<b>抽象的定义落到网格世界上，V^π 就是写在每个格子里的一个数。</b><br><b>看一眼这些数的分布规律</b>：<b>离 +1 越近的格子，数值越高</b>（右上那几格 0.81、0.75）；<b>而 −1 旁边那格被明显拉低了</b>（0.49）。<br><b>⚠ 这里有个初学时极容易混的地方：这些数不是奖励。</b><b>网格世界里绝大多数格子的即时奖励 R(s) 都是同一个小负数（每走一步的代价），只有 +1 和 −1 两格特殊。</b><br><b>⭐ 而写在格子里的这些值说的是另一回事：从这一格出发，一路走下去，最终总共能拿到多少。</b><br><b>⇒ 所以 V 携带的是「前途」的信息，R 携带的是「眼下」的信息。</b><b>Bellman 方程正是把这两者连起来的那座桥。</b>");
  SUM(427,3,{h:"★★ V^π(s)：从 s 出发、按 π 行动的期望总回报",k:"Ng：<b>V^π(s) 是从状态 s 出发、执行策略 π 的期望总回报</b>。",m:"<b>三步</b>：① 把机器人放在 s ② 一路按 π 行动 ③ 算期望总回报（带 γ 折扣的和）。⭐ <b>每个状态得到一个数</b>，11 个状态就是 11 个数。",w:"⚠ <b>它依赖 π</b>：换一个策略，这 11 个数全都会变。所以<b>「价值函数」永远是「某个策略的价值函数」</b>。",e:"⭐ <b>它的用处</b>：把「策略好不好」这个笼统问题，<b>落到每个状态上的一个具体数字</b>。"});
  QUIZ(427,3,{t:"V^π(s) 的定义是什么？",o:["所有策略在 s 上的平均回报","在状态 s 能拿到的即时奖励","策略 π 在状态 s 选的那个动作","从状态 s 出发、一路按策略 π 行动，能拿到的期望（折扣）总回报"],a:3,w:"⭐ <b>每个状态得到一个数</b>（11 个状态 ⇒ 11 个数）。⚠ <b>它依赖 π</b>——换个策略这些数全变，所以价值函数永远是「某个策略的」。"});
});
KP("4 · ★★★ Bellman 方程：把无限的未来折成一步",function(){
  S(697,function(){clearScene();setEq("$$V^{\\pi}(s) \\;=\\; \\underbrace{R(s)}_{\\text{立刻拿到的}} \\;+\\; \\gamma\\,\\underbrace{\\textstyle\\sum_{s'} P_{s\\pi(s)}(s')\\,V^{\\pi}(s')}_{\\text{折扣后的未来}}$$","top");
       setCap("这是整个强化学习最核心的一个式子");
       says("14:28","the immediate reward plus Gamma, times the expected future rewards",232);
       note("⭐ 当前状态的价值 ＝ 立刻拿到的奖励 ＋ 折扣后的未来期望价值",640,296,"y");
       note("⚠ 注意右边又出现了 V^π —— 它是一个「自己定义自己」的方程",640,352,"r");
       note("而这恰恰是它的威力所在：无限长的未来被压成了「一步 + 剩下的」",640,402,"b");},"<b>★★★ 这是整个强化学习里最核心的一个式子，叫 Bellman 方程。</b><br>Ng 把它的含义说得很清楚：<b>一个状态的价值——也就是机器人在这个状态醒来时的期望总回报——等于立刻拿到的奖励，加上 γ 乘以未来奖励的期望。</b><br><b>逐项看式子</b>：<b>R(s) 是站在 s 这一刻就拿到的奖励</b>；<b>后面那一大项是「下一步会去哪儿、去了之后还能拿多少」</b>——<b>按 P_sa 对所有可能的 s′ 加权平均，再乘上折扣 γ</b>。<br><b>⚠ 注意一件怪事：等号右边又出现了 V^π。</b>这是一个<b>自己定义自己的方程</b>。<br><b>⭐ 而这恰恰是它的威力所在：一个无限长的未来，被压缩成了「走一步 + 剩下的价值」</b>，<b>而剩下的价值满足同一个方程</b>。<br><b>⇒ 这个结构让下一节那件事成为可能：把它变成一组能解的方程。</b>");
  S(697,function(){clearScene();setEq(null);setCap("展开一层看看它为什么成立");
       boxNode(120,185,420,54,"V^π(s) = 未来所有奖励的折扣和","b");
       boxNode(120,250,420,54,"R(s) + γR(s₁) + γ²R(s₂) + γ³R(s₃) + ⋯","b");
       boxNode(690,185,470,54,"把 γ 提出来","y");
       boxNode(690,250,470,54,"R(s) + γ·[ R(s₁) + γR(s₂) + γ²R(s₃) + ⋯ ]","y");
       note("⭐ 方括号里那一串，正好就是「从 s₁ 出发」的总回报 = V^π(s₁)",640,340,"g");
       note("⚠ 而 s₁ 是随机的，所以要对它求期望 —— 这就得到了 Bellman 方程",640,398,"r");},"<b>Bellman 方程不是凭空来的，展开一层就能看出它为什么成立。</b><br><b>左边：V^π(s) 按定义是未来所有奖励的折扣和</b>，写开就是 <b>R(s) + γR(s₁) + γ²R(s₂) + γ³R(s₃) + ⋯</b>。<br><b>右边：把第一项之后的所有项都提一个 γ 出来</b>，得到 <b>R(s) + γ·[ R(s₁) + γR(s₂) + γ²R(s₃) + ⋯ ]</b>。<br><b>⭐ 现在看方括号里那一串——它正好就是「从 s₁ 出发」的总回报，也就是 V^π(s₁)。</b>因为折扣的幂次被重新从 0 开始数了。<br><b>⚠ 最后一步：s₁ 是随机的</b>（由 P_sa 决定），<b>所以不能直接写 V^π(s₁)，要对它求期望</b>——<b>按概率把各个可能的 s′ 的价值加权平均。</b><br><b>⇒ 这就是上一镜那个式子。</b><b>⭐ 整个推导的关键只有一步：把 γ 提出来之后，剩下的东西和原来是同一种东西。</b>");
  SUM(697,4,{h:"★★★ Bellman 方程：V^π(s) = R(s) + γ·E[V^π(s′)]",k:"Ng：<b>一个状态的价值 ＝ 立刻拿到的奖励 ＋ γ 乘以未来奖励的期望</b>。",m:"<b>推导只有一步</b>：把 <b>R(s)+γR(s₁)+γ²R(s₂)+⋯</b> 的第一项之后<b>提出一个 γ</b>，方括号里剩下的<b>正好是「从 s₁ 出发」的总回报 = V^π(s₁)</b>（折扣幂次重新从 0 数起）。",w:"⚠ <b>s₁ 是随机的</b>（由 P_sa 决定），所以要<b>按概率对所有可能的 s′ 加权平均</b>。",e:"⭐ <b>威力所在</b>：等号右边又出现 V^π，<b>无限长的未来被压成「走一步 + 剩下的价值」</b>，而剩下的满足同一个方程。"});
  QUIZ(697,4,{t:"Bellman 方程说的是什么？它的推导关键是哪一步？",o:["价值等于所有奖励之和；关键是无穷级数求和公式","价值等于奖励除以 1−γ；关键是等比数列","V^π(s) = R(s) + γ·E[V^π(s′)]；关键是把第一项之后提出一个 γ，剩下的正好就是「从 s₁ 出发」的总回报","价值等于最大的那个奖励；关键是取 max"],a:2,w:"⭐ 它的威力在于<b>把无限长的未来压成「走一步 + 剩下的价值」</b>。⚠ 因为 s′ 是随机的，所以是<b>按 P_sa 加权的期望</b>。"});
});
KP("5 · ★ 11 个状态 ⇒ 11 个方程、11 个未知数",function(){
  S(1218,function(){clearScene();setEq(null);setCap("Bellman 方程给出的是一个线性方程组");
       says("20:18","Bellman's equations defines a linear system of equations");
       matrix({rows:5,cols:2,cw:420,ch:42,x:220,y:176,
         cell:function(i,j){var t=[
           ["每个状态写一个方程","未知数"],
           ["V(1,1) = R(1,1) + γ·Σ…","V(1,1)"],
           ["V(1,2) = R(1,2) + γ·Σ…","V(1,2)"],
           ["⋮","⋮"],
           ["V(4,3) = R(4,3) + γ·Σ…","V(4,3)"]];return t[i][j];},
         dim:function(i,j){return i===0||i===3;}});
       note("⭐ 11 个方程、11 个未知数，而且每个方程都是线性的",640,398,"y");},"<b>⭐ Bellman 方程真正的用处，是它给出一个能解的方程组。</b><br><b>把 11 个状态挨个代进去</b>，每个状态得到一个方程：<b>V(1,1) = R(1,1) + γ·Σ…、V(1,2) = …，一直到最后一个状态</b>。<br><b>⭐ 现在换个视角看：如果 π 是给定的，那么 R、γ、P_sa 全是已知的，唯一不知道的就是那 11 个 V 值。</b><br><b>⇒ 于是这是 11 个方程、11 个未知数。</b><b>而且关键是——每个方程都是线性的</b>（V 只以一次方出现，前面乘的都是常数）。<br><b>Ng 的说法是：Bellman 方程定义了一个线性方程组。</b><br><b>⇒ 所以可以直接用线性求解器解出来，不需要任何迭代。</b><b>⚠ 记住这一点，后面讲策略迭代时它是关键：策略迭代每一轮都要解一次这个方程组，这正是它在大状态空间上变慢的原因。</b>");
  S(1218,function(){clearScene();setEq("$$V^{\\pi}(3,1) \\;=\\; R(3,1) \\;+\\; \\gamma\\!\\!\\sum_{s'} P_{(3,1)\\,\\pi(3,1)}(s')\\,V^{\\pi}(s')$$","top");
   setCap("Ng 在课上挑的那一个方程");
   note("① 左边是未知数之一",640,266,"b");
   note("② 右边的 Σ 里又出现了别的未知数（邻居的 V）",640,318,"b");
   note("⭐ 所以 11 个方程是互相耦合的 —— 必须一起解，不能一个一个来",640,370,"y");
   note("Ng 的说法：把 11 个 V 排成一个 11 维向量，一次解出来",640,402,"g");},"<b>把 Ng 在课上挑出来的那一个方程单独看，耦合关系就清楚了。</b><br><b>左边 V^π(3,1) 是未知数之一。</b><br><b>右边那个求和里，出现的是邻居格子的 V 值——它们同样是未知数。</b><br><b>⭐ 所以这 11 个方程是互相耦合的：每一个都牵扯着别的几个。</b><b>⚠ 这意味着不能一个一个地解——你没法先把 V(3,1) 单独算出来，因为算它需要先知道邻居的值，而邻居的值又需要知道它。</b><br><b>Ng 给出的处理方式是：把 11 个 V 值排成一个 11 维向量，然后一次性解出整个向量。</b><br><b>⇒ 这正是线性代数擅长的事，也正是「线性方程组」这个说法的实际含义。</b>");
  SUM(1218,5,{h:"★ Bellman 方程 ⇒ 线性方程组，可直接解",k:"把 11 个状态挨个代入 Bellman 方程，得到 <b>11 个方程</b>；给定 π 时 <b>R、γ、P_sa 全已知</b>，未知的只有那 <b>11 个 V 值</b>。",m:"⭐ <b>每个方程都是线性的</b>（V 只以一次方出现，系数都是常数）⇒ Ng：<b>Bellman 方程定义了一个线性方程组</b>。",w:"⇒ <b>可以直接用线性求解器解出来，不需要迭代。</b>",e:"⚠ <b>记住这点</b>：<b>策略迭代每轮都要解一次这个方程组</b>，这正是它在大状态空间上变慢的原因。"});
  QUIZ(1218,5,{t:"给定策略 π 时，怎么求出 V^π？",o:["对所有策略取 max","把每个状态代入 Bellman 方程，得到 11 个线性方程、11 个未知数，用线性求解器直接解","只能靠反复模拟取平均","用梯度下降最小化误差"],a:1,w:"⭐ 之所以是<b>线性</b>的，是因为 V 只以一次方出现、系数都是常数。⚠ <b>策略迭代每轮都要解一次它</b>，这是它在大状态空间上变慢的原因。"});
});
KP("6 · ⚠ 两种价值函数：V^π 和 V*",function(){
  S(1540,function(){clearScene();setEq("$$V^{*}(s) \\;=\\; \\max_{\\pi}\\; V^{\\pi}(s)$$","top");
       setCap("Ng 说这是术语上最容易混的地方");
       says("25:40","there are two types of value function",214);
       matrix({rows:3,cols:2,cw:430,ch:46,x:210,y:246,
         cell:function(i,j){var t=[
           ["名字","是什么"],
           ["V^π","某一个具体策略的价值（那个策略可能很烂）"],
           ["V*","最优价值函数：所有策略里取最大"]];return t[i][j];},
         dim:function(i,j){return i===0;},
         hl:function(i,j){return i===2?"hl":"";}});
       note("⭐ 两个都叫「价值函数」，但说的是完全不同的两件事",640,398,"y");},"<b>⚠ Ng 在这里专门停下来提醒：强化学习的术语里有一个容易混淆的地方——有两种价值函数。</b><br><b>第一种是 V^π，某一个具体策略的价值函数。</b>Ng 特意说明：<b>那个策略可能很好，也可能很糟，也可能正好是最优的</b>——<b>V^π 只是忠实地报告「按这个策略走能拿多少」。</b><br><b>第二种是 V*，最优价值函数。</b><b>它的定义是：在所有可能的策略里，取价值最大的那个。</b><br><b>⭐ 注意 max 是对「策略」取的，而且是对每个状态分别取。</b><b>所以 V*(s) 的含义是：如果从 s 出发并且此后一直做得最好，最多能拿多少。</b><br><b>⚠ 两个都叫「价值函数」，但说的是完全不同的两件事</b>——<b>看到符号时一定要先看清上标是 π 还是星号。</b><br><b>⭐ 下一节会看到，V* 满足的 Bellman 方程和 V^π 的不一样。</b>");
  S(1540,function(){clearScene();setEq(null);setCap("一个记号上的分辨法");
   boxNode(130,196,470,58,"看到 V 带上标 π","b");
   boxNode(130,264,470,58,"问：是哪个策略？换个策略这些数就变","b");
   boxNode(690,196,470,58,"看到 V 带星号","y");
   boxNode(690,264,470,58,"它是唯一的，和任何具体策略无关","y");
   note("⭐ V^π 有无穷多个（每个策略一个）；V* 只有一个",640,348,"y");
   note("⚠ 而 V* 又恰好等于某一个 V^π —— 就是 π* 的那一个",640,398,"r");},"<b>给一个实用的分辨法。</b><br><b>看到 V 带上标 π，就问自己「是哪个策略」</b>——<b>换一个策略，这一组数就全变了。</b><br><b>看到 V 带星号，就知道它是唯一的</b>，<b>和任何具体策略都无关，它只取决于这个 MDP 本身。</b><br><b>⭐ 数量上的对比很说明问题：V^π 有无穷多个（严格说是和策略一样多，4¹¹ 个），而 V* 只有一个。</b><br><b>⚠ 但这两者之间有一座桥：V* 又恰好等于某一个 V^π——就是最优策略 π* 的那一个。</b><br><b>⇒ 这正是后面那条「V*(s) = V^{π*}(s)」说的事。</b><b>所以它们既是两个不同的概念，又在最优处重合。把这两点同时记住，就不会乱。</b>");
  SUM(1540,6,{h:"⚠ V^π 与 V*：两种价值函数别混",k:"⚠ Ng 专门提醒<b>这是术语上最容易混的地方</b>。",m:"<b>V^π</b>：某一个<b>具体策略</b>的价值（Ng 强调那个策略<b>可能很好也可能很糟</b>），它只忠实报告「按这个策略走能拿多少」。",w:"<b>V*</b>：<b>最优价值函数</b>，定义为 <b>max over π 的 V^π(s)</b>——⭐ <b>max 是对「策略」取的，而且对每个状态分别取</b>。",e:"⭐ <b>V*(s) 的含义</b>：从 s 出发、此后一直做得最好，最多能拿多少。⚠ <b>看符号先看上标是 π 还是星号。</b>"});
  QUIZ(1540,6,{t:"V^π 和 V* 的区别是什么？",o:["V^π 用于离散状态，V* 用于连续状态","V* 是 V^π 的平均","V^π 是期望，V* 是方差","V^π 是某一个具体策略的价值（可能很糟）；V* 是在所有策略里取最大，即最优价值函数"],a:3,w:"⚠ Ng 专门说<b>这是术语上最容易混的地方</b>。⭐ 注意 <b>max 是对「策略」取的，而且对每个状态分别取</b>。"});
});
KP("7 · ★ V* 的 Bellman 方程：多了一个 max",function(){
  S(1540,function(){clearScene();setEq("$$V^{*}(s) \\;=\\; R(s) \\;+\\; \\max_{a \\in A}\\; \\gamma \\textstyle\\sum_{s'} P_{sa}(s')\\,V^{*}(s')$$","top");
       setCap("和 V^π 的那个只差一处");
       boxNode(130,250,470,58,"V^π：动作由 π 定死 ⇒ 没得选","b");
       boxNode(690,250,470,58,"V*：可以挑最好的动作 ⇒ 取 max","y");
       note("⭐ 这个 max 正是「最优」二字的全部来源",640,342,"y");
       note("⚠ 注意 max 在 γΣ 前面：先算出每个动作的期望未来价值，再挑最大的",640,398,"r");},"<b>V* 也满足一个 Bellman 方程，但和 V^π 的那个有一处关键差别。</b><br><b>V^π 的式子里，动作是由策略 π 定死的</b>——<b>站在 s 就只能做 π(s)，没得选，所以直接用 P_{sπ(s)}。</b><br><b>⭐ 而 V* 说的是「做得最好」，所以可以挑动作：对每个可能的动作 a 算一遍期望未来价值，然后取最大的那个。</b><br><b>⇒ 式子里就多了一个 max over a。</b><b>这个 max 正是「最优」二字的全部来源。</b><br><b>⚠ 注意 max 的位置：它在 γΣ 的前面、R(s) 的后面。</b>意思是——<b>立刻拿到的奖励 R(s) 跟你选什么动作无关（它只取决于你站在哪儿）</b>，<b>而未来的部分才取决于你怎么选</b>。<br><b>⭐ 所以读法是：先对每个动作算出它的期望未来价值，再挑最大的那个，最后加上 R(s)。</b>");
  S(1540,function(){clearScene();setEq(null);setCap("两个式子逐项对照");
   matrix({rows:4,cols:3,cw:350,ch:48,x:130,y:192,
     cell:function(i,j){var t=[
       ["","V^π 的方程","V* 的方程"],
       ["即时奖励","R(s)","R(s)　（一样）"],

     dim:function(i,j){return i===0;},

   note("⭐ 全部差别只有一行：动作是被定死的，还是可以挑的",640,398,"y");},"<b>把两个 Bellman 方程逐项摆开，差别就只剩一行了。</b><br><b>即时奖励那一项：完全一样，都是 R(s)。</b>因为<b>站在哪儿就拿多少，和策略无关。</b><br><b>未来那一项：形式也一样，都是「按转移概率对邻居的价值加权平均，再乘 γ」。</b><br><b>⭐ 唯一的差别在动作那一行：V^π 里动作由 π(s) 定死，所以转移概率的下标是 P_{sπ(s)}；而 V* 里可以挑动作，所以出现 max over a，下标是 P_sa。</b><br><b>⚠ 这个差别带来一个重要后果：V^π 的方程是线性的（可以直接解），而 V* 的方程因为有 max 就不是线性的了。</b><br><b>⇒ 这正是为什么 V* 要靠值迭代一轮一轮逼近，而 V^π 可以一次解出来。</b><b>也正是策略迭代能用线性求解器的原因。</b>");
  SUM(1540,7,{h:"★ V* 的 Bellman 方程：多一个 max over a",k:"<b>V^π</b>：动作由 π <b>定死</b>，没得选 ⇒ 直接用 P_{sπ(s)}。",m:"⭐ <b>V*</b> 说的是「做得最好」⇒ <b>对每个动作 a 算一遍期望未来价值，取最大的</b>。<b>这个 max 正是「最优」二字的全部来源。</b>",w:"⚠ <b>max 的位置</b>：在 γΣ 前面、R(s) 后面——<b>R(s) 跟选什么动作无关（只取决于你站在哪儿）</b>，<b>未来的部分才取决于怎么选</b>。",e:"⭐ <b>读法</b>：先对每个动作算期望未来价值 → 挑最大的 → 再加上 R(s)。"});
  QUIZ(1540,7,{t:"V* 的 Bellman 方程和 V^π 的差在哪里？",o:["多了一个 max over a：V^π 的动作由 π 定死，而 V* 可以挑最好的动作","V* 的方程不含 R(s)","差一个折扣因子 γ","V* 的方程是非线性的，因为含有平方项"],a:0,w:"⚠ 注意 <b>max 在 γΣ 前面、R(s) 后面</b>：<b>R(s) 只取决于你站在哪儿，与选什么动作无关</b>；未来的部分才取决于怎么选。"});
});
KP("8 · ★★ 从 V* 到 π*：一个 argmax",function(){

       note("⚠ 注意这里不需要 R(s) —— 它对所有动作都一样，比大小时会抵消",640,398,"r");},"<b>有了 V*，最优策略就几乎是白送的。</b><br><b>回忆上一节：V* 的方程里那个 max 问的是「最大值是多少」。</b><b>⭐ 而我们真正想要的是「是哪个动作取到了这个最大值」——那就是 argmax。</b><br><b>所以 π*(s) 就定义成：让期望未来价值最大的那个动作。</b>Ng 把整个策略总结成两步：<b>第一，求出 V*；第二，用 argmax 的式子求出 π*。</b><br><b>⚠ 注意一个细节：这个式子里没有 R(s)，也没有 γ。</b>为什么可以省掉？<b>因为 R(s) 只取决于你站在哪一格，对所有动作都是同一个数；γ 也是同一个正数。</b><b>⇒ 比较不同动作的大小时，它们会一起抵消，不影响谁最大。</b><br><b>⭐ 这一节把整个问题收口了：只要能算出 V*，最优策略就能立刻读出来。</b><b>⇒ 剩下的唯一问题是：V* 怎么算？下一节的值迭代就是答案。</b>");

   note("⭐ argmax 返回的是「动作」，不是那个数值本身",640,402,"y");},"<b>把 argmax 在一个具体格子上走一遍，就不抽象了。</b><br><b>对这一格的四个动作各算一遍期望未来价值：往北 0.676、往南 0.61、往东 0.65、往西 0.740。</b><br><b>然后挑最大的那一个——是往西。</b><b>⇒ 所以 π*(这一格) = 往西。</b><br><b>⭐ 注意 argmax 返回的是「动作」，不是那个数值本身。</b><b>数值 0.740 是 max 给出的，动作「往西」才是 argmax 给出的。</b>这正是上一镜说的那个区别。<br><b>⚠ 再强调一遍 Ng 的严谨之处：四个方向都要算，不能只比你猜的那两个。</b><br><b>⭐ 而这一整套计算，对 11 个格子各做一遍，就得到了完整的最优策略——也就是 L16 里那张布满箭头的图。</b>");
  SUM(2069,8,{h:"★★ π*(s) = argmax over a 的期望未来价值",k:"<b>max 问「最大值是多少」，argmax 问「是哪个动作取到的」</b>——我们要的是后者。",m:"⭐ Ng 把求最优策略总结成<b>两步</b>：<b>① 先求出 V* ② 再对每个状态取 argmax</b>。",w:"⚠ <b>式子里没有 R(s) 也没有 γ</b>：R(s) <b>只取决于你站在哪一格，对所有动作是同一个数</b>，γ 也是同一个正数 ⇒ <b>比大小时一起抵消</b>。",e:"⭐ <b>问题收口了</b>：只要能算出 V*，最优策略就能立刻读出来。⇒ 剩下的唯一问题是 <b>V* 怎么算</b>。"});
  QUIZ(2069,8,{t:"已知 V* 之后，怎么得到最优策略 π*？",o:["对所有策略逐一评估后比较","把 V* 归一化成概率分布","对每个状态取 argmax：挑出让期望未来价值最大的那个动作","再跑一次 Bellman 方程"],a:2,w:"⚠ 式子里<b>不需要 R(s) 和 γ</b>——它们对所有动作都是同一个数，<b>比大小时会抵消</b>。⭐ 所以求最优策略就是<b>先求 V*、再取 argmax</b>两步。"});

KP("9 · ★★★ 一个策略同时在所有状态上最优",function(){
  S(1996,function(){clearScene();setEq("$$V^{*}(s) \\;=\\; V^{\\pi^{*}}(s) \\;\\ge\\; V^{\\pi}(s) \\qquad \\text{对每个 } \\pi \\text{、每个 } s$$","top");
       setCap("这件事比看上去不显然得多");
       says("33:16","for every policy Pi in every state S",214);
       note("⭐ 注意「对每个 s」这四个字 —— 同一个 π* 在所有状态上同时取到最大",640,278,"y");
       note("⚠ 先验地看完全可能不是这样：",640,334,"r");
       note("从 A 出发最好的策略，和从 B 出发最好的策略，本来可以是两个不同的策略",640,398,"r");},"<b>⭐ 这是这一讲里最容易被一带而过、但其实很不显然的一件事。</b><br><b>式子说的是：V*(s) 等于 V^{π*}(s)，而且对每一个策略 π、每一个状态 s，它都大于等于 V^π(s)。</b><br><b>⚠ 要紧的是「对每个 s」这四个字。</b>它的意思是——<b>存在同一个策略 π*，它在所有状态上同时取到最大值。</b><br><b>⭐ 为什么说这不显然？</b>回想 V* 的定义：<b>V*(s) = max over π 的 V^π(s)，这个 max 是对每个状态分别取的。</b><b>⚠ 先验地看，完全可能出现这种情况：从 A 格出发最好的策略是某一个 π₁，从 B 格出发最好的却是另一个 π₂。</b><b>那样的话就不存在「一个最优策略」，只有「每个起点各自的最优策略」。</b><br><b>⇒ 而这条性质保证了这种尴尬不会发生。</b><b>整个「求一个最优策略」的说法，正是立在它上面。</b>");
  S(1996,function(){clearScene();setEq(null);setCap("⚠ Ng 自己说了：他没有证明这一条");
       says("32:55","I am just claiming this. I am not proving this");
       boxNode(150,205,440,70,"Ng 在课上","b");
       boxNode(760,205,440,70,"「我只是断言，没有证明」","y");
       link(590,240,760,240);
       note("⭐ 这是个好习惯：把「讲过的」和「证过的」分清楚",640,320,"y");
       note("⚠ 考试时别把它当成课上推导过的结论去写推导过程",640,392,"r");},"<b>⚠ 这里有一点值得单独说：Ng 在课上明确讲了「我只是断言这件事，我没有证明它」。</b><br><b>⭐ 这其实是个很好的习惯——把「我告诉你的」和「我证给你看的」分清楚。</b><br><b>对你的实际意义有两点。</b><b>第一，考试或作业里引用这条性质时，它是一个可以直接用的已知结论，但别假装自己推导过它</b>——<b>课上确实没有推导。</b><br><b>第二，知道哪些是未证明的断言，你才知道自己真正理解到了哪一层。</b><br><b>⚠ 顺带说一句它为什么是对的（直觉上的）：Bellman 的那个 max 是在每个状态上「逐点」取最优动作的，而这种逐点的贪心选择之所以能拼成一个全局最优策略，正是 MDP 这个结构特有的好性质。</b><b>严格证明属于动态规划理论，CS229 没展开。</b>");
  SUM(1996,9,{h:"★★★ 同一个 π* 在所有状态上同时最优",k:"<b>V*(s) = V^{π*}(s) ≥ V^π(s)，对每个 π、每个 s</b>。⭐ 要紧的是<b>「对每个 s」</b>——<b>存在同一个 π*，在所有状态上同时取到最大</b>。",m:"⚠ <b>为什么不显然</b>：V* 的 max 是<b>对每个状态分别取的</b>。先验地看完全可能<b>从 A 出发最好的是 π₁、从 B 出发最好的是 π₂</b>，那就不存在「一个最优策略」。",w:"⇒ <b>这条性质保证了这种尴尬不会发生</b>，整个「求一个最优策略」的说法就立在它上面。",e:"⚠ <b>Ng 明说「我只是断言，没有证明」</b>——引用时可以直接用，<b>但别假装课上推导过</b>。严格证明属于动态规划理论。"});
  QUIZ(1996,9,{t:"「V*(s) = V^{π*}(s) 对每个 s 成立」这件事为什么不显然？",o:["因为 V* 可能是无穷大","因为策略数是指数级的，无法验证","V* 的 max 是对每个状态分别取的，先验地可能不同起点各有各的最优策略；这条性质保证了存在同一个 π* 在所有状态上同时最优","因为 γ<1 时级数才收敛"],a:2,w:"⚠ <b>Ng 在课上明说他只是断言、没有证明</b>。⭐ 整个「求一个最优策略」的说法正是立在这条性质上。"});
});
KP("10 · ★★★ 值迭代：反复用 Bellman 方程更新",function(){

       boxNode(170,331,980,56,"③ 重复 ② 直到不再变化","g");
       note("⭐ 就是「把 Bellman 方程当成赋值语句，反复执行」",640,398,"y");},"<b>★★★ 值迭代是求 V* 的算法，而它本身只有三行。</b><br><b>第一步：把每个状态的价值估计初始化为 0。</b>Ng 的原话就是这句。<b>⚠ 注意初始值是随便定的——0 只是最方便，换成别的数也能收敛。</b><br><b>第二步：对每个状态，用 V* 的 Bellman 方程去更新它的估计值。</b><br><b>第三步：重复第二步，直到数值不再变化。</b><br><b>⭐ 一句话概括：把 Bellman 方程当成赋值语句，反复执行。</b><br><b>为什么这样能行？</b>直觉是这样的：<b>第一轮之后，每个状态的估计值反映的是「只考虑眼前一步」的价值；第二轮之后反映两步；第三轮三步……</b><b>⇒ 轮数越多，看得越远，而 γ 的折扣让很远的部分越来越不重要，所以它会稳定下来。</b><br><b>⚠ 下一节讲第二步里一个容易被忽略、但实现时必须想清楚的细节。</b>");
  S(2179,function(){clearScene();setEq(null);setCap("前几轮在发生什么");
       matrix({rows:5,cols:3,cw:330,ch:42,x:155,y:172,
         cell:function(i,j){var t=[
           ["轮数","估计值反映的是","网格世界里"],
           ["初始","全是 0","什么都不知道"],
           ["第 1 轮","只看眼前一步","只有 +1 和 −1 旁边的格子有了值"],
           ["第 2 轮","看两步","值开始向外扩散一圈"],
           ["⋯ 之后","看得越来越远","⭐ 直到每一格都反映「最终能拿多少」"]];return t[i][j];},
         dim:function(i,j){return i===0;},
         hl:function(i,j){return i===4?"hl":"";}});
       note("⚠ γ 的折扣让很远的部分越来越不重要 —— 这正是它会停下来的原因",640,398,"r");},"<b>把前几轮摊开看，值迭代在干什么就很直观了。</b><br><b>初始时全是 0——什么都不知道。</b><br><b>第一轮之后</b>，只有<b>紧挨着 +1 和 −1 的那几格</b>有了非零的值，因为只有它们能「一步之内」碰到奖励。<br><b>第二轮之后</b>，<b>这些值开始向外扩散一圈</b>——<b>离奖励两步远的格子，通过邻居间接知道了那边有东西。</b><br><b>⇒ 可以把它想成：奖励的信息从 +1 和 −1 那两格开始，一轮一圈地往外渗。</b><br><b>⚠ 那它为什么会停下来，而不是一直变？因为 γ 的折扣。</b><b>每往外扩散一圈，带来的新信息都要再乘一次 γ</b>，<b>所以很远处的影响越来越小，直到小到可以忽略。</b><br><b>⭐ 这也解释了下一节那件事：γ 越接近 1，衰减越慢，需要的轮数就越多。</b>");
  SUM(2179,10,{h:"★★★ 值迭代：把 Bellman 方程当赋值语句反复执行",k:"<b>① 每个状态的 V(s) 初始化为 0</b>（⚠ 初值随便，0 只是方便）<b>② V(s) ← R(s) + max_a γΣP_sa(s′)V(s′) ③ 重复到不变</b>。",m:"⭐ <b>每轮在干什么</b>：第 1 轮只反映「眼前一步」⇒ 只有 +1/−1 旁边的格子有值；第 2 轮反映两步，值<b>向外扩散一圈</b>……",w:"⇒ 可以想成：<b>奖励的信息从 +1 和 −1 那两格开始，一轮一圈往外渗</b>。",e:"⚠ <b>为什么会停下来</b>：每扩散一圈就要再乘一次 γ，<b>远处的影响越来越小</b>。⭐ 所以 <b>γ 越接近 1，需要的轮数越多</b>。"});
  QUIZ(2179,10,{t:"值迭代做的是什么？它为什么会收敛？",o:["枚举所有策略取最好的；因为策略数有限","把 Bellman 方程当赋值语句反复执行；每多一轮就多看一步未来，而 γ 的折扣让远处影响越来越小","解一次线性方程组；因为方程组有唯一解","用梯度下降最小化误差；因为目标函数是凸的"],a:1,w:"⭐ 直观图景：<b>奖励的信息从 +1 和 −1 那两格开始，一轮一圈往外渗</b>。⚠ 初始值随便定，<b>0 只是最方便</b>。"});
});

       note("⚠ 差别在于算到第 11 个时，它用的邻居值是新的还是旧的",640,398,"r");},"<b>第二步「对每个状态更新」里藏着一个实现细节：更新的顺序怎么安排。</b><br><b>同步更新：把 11 个状态的新值全部算完，再一起替换掉旧的那 11 个。</b>也就是说<b>整轮计算用的都是上一轮的值</b>。<br><b>异步更新：算出一个就立刻覆盖一个。</b>于是<b>算第二个状态时，用的邻居值里已经有刚刚更新过的了</b>。<br><b>⚠ 差别就在这里：算到第 11 个状态时，它引用的邻居值，是这一轮的新值还是上一轮的旧值。</b><br><b>⭐ Ng 的结论很干脆：两种都能工作，值迭代用同步或异步都收敛，而多数人用异步。</b><br><b>为什么偏好异步？因为它省内存（不用存两份），而且新信息传播得更快——刚算出来的改进立刻就能被用上。</b>");

  SUM(2313,11,{h:"⚠ 同步更新 vs 异步更新",k:"<b>同步</b>：全部 11 个新值算完，<b>再一起替换</b>——整轮用的都是上一轮的值。",m:"<b>异步</b>：<b>算一个就立刻覆盖一个</b>，后面的计算会用上刚更新的值。",w:"⚠ <b>差别</b>：算到第 11 个时，它引用的邻居值<b>是这一轮的新值还是上一轮的旧值</b>。",e:"⭐ Ng：<b>两种都收敛，多数人用异步</b>。<b>异步省内存（不用存两份），而且新信息传播更快</b>。"});

   note("⭐ 关键：γ 不是一个「调快点」的旋钮 —— 它会改变最优策略本身",640,398,"y");},"<b>把 γ 的两头代价摆出来。</b><br><b>γ = 0.9：收敛快，几十轮搞定；但策略短视，只顾近处的奖励。</b><br><b>γ = 0.99：收敛慢，要几百轮；但策略看得长远。</b><br><b>⭐ 这里有一个必须说清楚的要点：γ 不是一个「嫌慢就调小点」的性能旋钮。</b><br><b>⚠ 它会改变最优策略本身。</b>想想网格世界：<b>γ 很小的时候，远处那个 +1 被折扣得几乎没有分量，机器人就没什么动力跑过去；而每走一步的小惩罚是立刻生效的。</b><b>⇒ 极端情况下它可能干脆原地不动。</b><br><b>⇒ 所以 γ 是问题定义的一部分，不是求解器的参数。</b><b>该怎么选，取决于你的问题真正需要看多远。</b>");
  SUM(2633,12,{h:"收敛速度：误差按固定比例缩小，γ 决定快慢",k:"Ng：<b>这个算法收敛得相当快</b>。<b>每迭代一轮，误差按一个固定比例缩小</b> ⇒ ⭐ <b>指数级下降</b>。",m:"<b>具体的数</b>：<b>γ = 0.9 ⇒ 十几到几十轮</b>就很接近 V*；<b>γ = 0.99 ⇒ 要一百多到几百轮</b>。",w:"⚠ <b>为什么 γ 越大越慢</b>：γ 控制「信息往外渗一圈衰减多少」，<b>接近 1 时衰减很慢、远处奖励仍有分量</b>，必须多渗几圈。",e:"⭐ <b>反过来</b>：γ 小则算法短视，但<b>收敛很快</b>——这是实实在在的权衡。"});
  QUIZ(2633,12,{t:"值迭代的收敛速度由什么决定？",o:["初始值离 V* 有多远","状态数：状态越多越慢","动作数的多少","折扣因子 γ：误差每轮按固定比例缩小，γ=0.9 要几十轮，γ=0.99 要几百轮"],a:3,w:"⚠ 机理：<b>γ 控制信息往外渗一圈要衰减多少</b>，接近 1 时衰减慢，<b>必须多渗几圈</b>。⭐ γ 小则短视但收敛快，是实在的权衡。"});

       note("⚠ Ng 补了一句严谨的：实际上东南西北四个方向都要算一遍再比",640,398,"r");},"<b>把两个算式摆在一起，逐项对照。</b><br><b>往西：0.8 的概率真的走到西边那格（它的 V* 是 0.75）；各 0.1 的概率偏到两侧</b>——<b>一侧偏向北（0.69），另一侧往南撞墙弹回来（0.71）</b>。<b>加权平均得到 0.740。</b><br><b>往北：0.8 的概率走到北边那格（0.69）；各 0.1 的概率偏到两侧（0.75 和 0.49）。加权平均得到 0.676。</b><br><b>⭐ 0.740 明显高于 0.676 ⇒ 往西（绕路）才是最优动作。</b>这正是 L16 里那张图上箭头朝左的原因。<br><b>⚠ 注意往北那一列里的 0.49</b>——<b>那是因为偏过去的方向离 −1 更近，价值被陷阱拉低了。</b><b>风险就是这样被定量地算进去的。</b><br><b>⚠ Ng 还补了一句很严谨的话：实际上东南西北四个方向都要各算一遍再比，才能确定往西确实最高。</b>");

       note("⭐ 和值迭代的区别：这里每一轮都产出一个新策略",640,398,"y");},"<b>解 MDP 还有第二个经典算法：策略迭代。</b>Ng 说它<b>把注意力放在策略 π 上，而不是价值函数上</b>。<br><b>第一步：随便初始化一个策略</b>——好不好无所谓。<br><b>第二步：解那个线性方程组，求出这个策略的价值函数 V^π。</b><b>⭐ 注意这里用的是 V^π 的 Bellman 方程（没有 max），所以是线性的、可以直接解。</b><br><b>第三步：假装 V^π 就是最优价值函数，用 argmax 的式子更新出一个新策略；然后回到第二步。</b><br><b>⭐ 和值迭代最大的区别在于：值迭代是先把 V* 彻底算准，最后才生成一次策略；而策略迭代每一轮都产出一个新策略。</b><br><b>⚠ 它有一个很好的性质：Ng 说迭代有限次之后，这个算法就会停止变化——也就是策略不再改变，说明已经到最优了。</b>");

       note("⭐ 关键是解 n 个未知数的线性方程组，代价随 n 增长得很快",640,398,"y");},"<b>两个算法都能解 MDP，怎么选？Ng 给的判据只有一个：状态数。</b><br><b>根子在于：策略迭代每一轮都要解一次线性方程组</b>，而<b>值迭代每轮只做一遍 max 更新，便宜得多</b>。<br><b>⭐ 解一个 n 个未知数的线性方程组，代价随 n 增长得很快</b>（一般是 n 的三次方量级）。<br><b>⇒ 状态少的时候这不算事。</b>Ng 说<b>像 11 个状态、或者几百个状态这种规模，策略迭代跑得很快</b>，而且<b>它往往用更少的轮数就收敛</b>。<br><b>⚠ 但状态一多，解方程组就成了瓶颈。</b>Ng 的原话是<b>这种情况下他会偏向值迭代</b>。<br><b>⭐ 记住这个判据的形状：不是「哪个算法更好」，而是「你的状态空间有多大」。</b>");
  S(3342,function(){clearScene();setEq(null);setCap("代价随状态数怎么长");
   axes({x0:280,x1:1000,y0:370,y1:190});
   curve(fn(function(x){var n=(x-300)/700;return 365-300*n*n*n;},300,1000,80),"r");
   curve(fn(function(x){var n=(x-300)/700;return 365-70*n;},300,1000,60),"g");
   note("策略迭代：解方程组 ≈ n³",870,232,"r");
   note("值迭代：每轮 ≈ n × 动作数",880,320,"g");
   note("⭐ 状态少时右边那点差距无所谓，状态一多就是天壤之别",640,398,"y");},"<b>把两者的代价随状态数的增长画出来，取舍就一目了然。</b><br><b>策略迭代每轮要解一个 n 个未知数的线性方程组，代价大约是 n 的三次方</b>——<b>图上那条陡峭的红线。</b><br><b>值迭代每轮只是扫一遍所有状态、每个状态试一遍所有动作，代价大约是 n 乘以动作数</b>——<b>绿色那条几乎是直线。</b><br><b>⭐ 看图的左半边：状态少的时候两者差不多，这时策略迭代「轮数更少」的优势反而占上风，所以它更快。</b><br><b>⭐ 再看右半边：状态一多，红线就甩开了，而且越来越离谱。</b><br><b>⇒ 这就是 Ng 那句「状态多时我偏向值迭代」的全部内容。</b><b>⚠ 注意这不是说策略迭代不好，而是说它的代价结构在大问题上撑不住。</b>");
  SUM(3342,15,{h:"⚠ 选哪个：看状态数",k:"<b>根子</b>：<b>策略迭代每轮要解一次线性方程组</b>，而<b>值迭代每轮只做一遍 max 更新，便宜得多</b>。",m:"⭐ 解 n 个未知数的线性方程组，<b>代价随 n 增长很快</b>（约 n³ 量级）。",w:"<b>状态少（十几～几百）</b>：Ng 说<b>策略迭代跑得很快</b>，而且<b>往往用更少轮数就收敛</b>。",e:"⚠ <b>状态多</b>：解方程组成为瓶颈 ⇒ Ng 说<b>他会偏向值迭代</b>。⭐ 判据不是「哪个更好」，而是<b>「状态空间多大」</b>。"});
  QUIZ(3342,15,{t:"值迭代和策略迭代之间该怎么选？",o:["看动作是离散还是连续","永远选值迭代，策略迭代不保证收敛","看折扣因子 γ 的大小","看状态数：策略迭代每轮要解一次线性方程组，状态少时很快且轮数更少；状态一多就成瓶颈，此时偏向值迭代"],a:3,w:"⭐ 解 n 个未知数的线性方程组代价约 n³ 量级。⭐ 判据的形状是「<b>你的状态空间有多大</b>」，而不是「哪个算法更好」。"});
});
KP("16 · ⚠ 收敛性：课上没证，问题集里要你证",function(){
  S(2581,function(){clearScene();setEq(null);setCap("哪些是讲过的，哪些是要你自己做的");
       says("43:01","showing that this will make a V of S converge to V star");
       boxNode(130,200,470,58,"课上给的","b");

       boxNode(690,200,470,58,"问题集里要你证的","y");
       boxNode(690,268,470,58,"反复套用 Bellman 方程，V 会收敛到 V*","y");
       note("⭐ 和上一个知识点一样：分清「被告知的」和「被证明的」",640,352,"y");
       note("⚠ 这是这一讲第二处 Ng 明确说「细节在问题集里」的地方",640,398,"r");},"<b>值迭代真的会收敛到 V* 吗？Ng 在课上说了结论，但把证明留给了问题集。</b><br><b>他的原话是：你会在问题集里看到更多细节——证明「反复套用 Bellman 方程会让 V(s) 收敛到 V*」。</b><br><b>⭐ 所以这一讲里有两处「被告知但没被证明」的地方</b>：<b>一处是上一节那条「同一个 π* 在所有状态同时最优」，另一处就是这里的收敛性。</b><br><b>⚠ 为什么要特意提醒？</b>因为<b>这两条恰恰是整套方法能成立的两根支柱</b>：<b>没有收敛性，值迭代算出来的东西就不知道是什么；没有同时最优性，「一个最优策略」这个说法就不成立。</b><br><b>⇒ 知道它们没在课上被证明，不是为了怀疑它们，而是为了知道自己的理解停在哪一层。</b>");
  S(2581,function(){clearScene();setEq(null);setCap("这一讲的逻辑结构：哪些撑着哪些");
   boxNode(300,190,680,52,"① 值迭代会收敛到 V*　（未证）","y");
   boxNode(300,254,680,52,"② 同一个 π* 在所有状态同时最优　（未证）","y");
   boxNode(300,330,680,56,"⇒ 「先算 V*、再 argmax」这套方法成立","g");
   link(640,242,640,330); link(640,306,640,330);
   note("⭐ 两条都未证，但它们都是真的 —— 属于动态规划的标准结论",640,398,"y");},"<b>把这一讲的逻辑结构画出来，就知道哪些东西撑着哪些东西。</b><br><b>整套方法是「先算 V*，再用 argmax 读出 π*」。</b>而它成立需要两个前提：<b>① 值迭代确实会收敛到 V*；② 确实存在同一个 π* 在所有状态上同时最优。</b><br><b>⚠ 这两条课上都没证明。</b><b>第一条留给了问题集，第二条 Ng 明说「我只是断言」。</b><br><b>⭐ 但要讲清楚分寸：它们都是真的，属于动态规划的标准结论，不是什么可疑的假设。</b><b>把它们拎出来，是为了让你知道这套方法的地基在哪儿，而不是为了怀疑它。</b><br><b>⇒ 实用的结论是：这两条可以放心引用，但别在答题时假装自己推导过。</b>");
  SUM(2581,16,{h:"⚠ 收敛性的证明留在问题集里",k:"Ng 说：<b>问题集里会证「反复套用 Bellman 方程会让 V(s) 收敛到 V*」</b>；课上只给了算法和「收敛很快」的直觉。",m:"⭐ <b>这一讲有两处「被告知但没被证明」</b>：① <b>同一个 π* 在所有状态同时最优</b> ② <b>值迭代的收敛性</b>。",w:"⚠ <b>而这两条恰恰是整套方法的两根支柱</b>：没有收敛性，算出来的东西不知道是什么；没有同时最优性，「一个最优策略」就不成立。",e:"⇒ 知道它们未被课上证明，<b>不是为了怀疑，而是为了知道自己的理解停在哪一层</b>。"});
  QUIZ(2581,16,{t:"关于值迭代收敛到 V*，L17 课上是怎么处理的？",o:["课上只给算法和「收敛很快」的直觉，证明留给问题集——这是本讲两处「告知但未证明」之一","收敛性只在 γ=1 时成立","课上给出了完整证明","课上证明了它不收敛，需要加阻尼"],a:0,w:"⭐ 另一处是<b>「同一个 π* 在所有状态同时最优」</b>。⚠ 这两条<b>恰是整套方法的两根支柱</b>。"});
});
KP("17 · ★ 策略迭代为什么会在有限步内停下来",function(){
  S(3432,function(){clearScene();setEq(null);setCap("和值迭代的收敛是两回事");
       says("57:12","after a finite number of iterations, this algorithm will stop changing");
       boxNode(130,196,470,58,"值迭代","b");
       boxNode(130,264,470,58,"数值逐渐逼近，理论上永远在变小","b");
       boxNode(690,196,470,58,"策略迭代","y");
       boxNode(690,264,470,58,"⭐ 策略完全不再改变 ⇒ 真的停住","y");
       note("⚠ 因为策略只有有限多个，而每一轮要么变好、要么就是最优了",640,348,"r");
       note("⇒ 不可能一直变下去，所以必然在有限步停住",640,398,"y");},"<b>策略迭代有一个值迭代没有的性质：它会在有限步之后真正停住。</b>Ng 说<b>迭代有限次之后，这个算法就不再变化了</b>。<br><b>⚠ 注意这和值迭代的「收敛」不是一回事。</b><b>值迭代的数值是逐渐逼近 V* 的，理论上每一轮都还在变一点点，你得设一个阈值来决定何时停手。</b><b>⭐ 而策略迭代是策略完全不再改变——那是一个干脆的、可以检测的终止条件。</b><br><b>为什么必然会停？直觉是这样的：策略的总数虽然巨大，但是有限的</b>（上一节算过是 4¹¹ 这个量级）；<b>而每一轮改进要么让策略严格变好，要么说明它已经是最优的了。</b><br><b>⇒ 不可能一直变下去，否则就会无限多次地产生不同的、越来越好的策略，而策略只有有限个。</b><b>所以它必然在有限步内停住。</b>");
  SUM(3432,17,{h:"★ 策略迭代有限步停止（和值迭代的收敛不同）",k:"Ng：<b>迭代有限次之后这个算法就不再变化</b>。",m:"⚠ <b>和值迭代的收敛不是一回事</b>：值迭代的数值<b>逐渐逼近、理论上一直在变</b>，要设阈值决定何时停手；⭐ <b>策略迭代是策略完全不变，终止条件干脆可检测</b>。",w:"<b>为什么必然停</b>：<b>策略总数虽巨大但有限</b>（4¹¹ 量级），<b>每轮要么严格变好、要么已是最优</b>。",e:"⇒ <b>不可能一直变下去</b>——否则会无限多次产生越来越好的不同策略，而策略只有有限个。"});
  QUIZ(3432,17,{t:"策略迭代的「有限步停止」和值迭代的「收敛」有什么不同？",o:["值迭代数值逐渐逼近、理论上一直在变，要设阈值；策略迭代是策略完全不再改变，终止条件干脆可检测","值迭代不保证收敛，策略迭代保证","两者是同一件事，只是说法不同","策略迭代更快，所以叫有限步"],a:0,w:"⭐ <b>必然停的理由</b>：策略总数虽巨大但<b>有限</b>，而每轮<b>要么严格变好、要么已是最优</b>，不可能一直变下去。"});
});
KP("18 · ★ 状态是连续的怎么办（预告 L18）",function(){
  S(2985,function(){clearScene();setEq(null);setCap("这一讲全程假设状态有限");
       says("49:45","if you have a continuous state MDP, one of the things that is often done is to discretize");
       boxNode(130,200,470,58,"这一讲的全部内容","b");
       boxNode(130,268,470,58,"都建立在「状态有限」之上","b");
       boxNode(690,200,470,58,"⚠ 可直升机的状态是连续的","r");
       boxNode(690,268,470,58,"位置和速度是实数 ⇒ 无穷多个状态","r");
       note("⭐ 办法一：离散化 —— 把连续空间切成有限多个格子",640,352,"y");
       note("办法二：有些版本的值迭代可以直接处理连续状态（L18 讲）",640,398,"g");},"<b>课上有同学问了一个很关键的问题：状态数总是有限的吗？</b><br><b>Ng 的回答很干脆：在我们目前讨论的范围里，是的。</b><br><b>⚠ 但这一讲全部的内容——11 个方程 11 个未知数、对所有状态遍历更新、解线性方程组——都建立在「状态有限」这个前提上。</b><b>而直升机的状态是连续的：位置和速度都是实数，有无穷多个状态。</b><b>⇒ 那时候「对每个状态更新一遍」根本写不出循环。</b><br><b>Ng 给了两条出路。</b><b>⭐ 第一条是离散化：把连续空间切成有限多个格子，每个格子当成一个状态</b>，这样就退回到这一讲的框架里了。<br><b>第二条是：有些版本的值迭代可以直接处理连续状态。</b><br><b>⇒ 这正是下一讲 L18 的主题。</b>");
  S(2985,function(){clearScene();setEq(null);setCap("离散化：把连续切成格子");
   axes({x0:300,x1:980,y0:370,y1:190});
   curve([[300,370],[980,370]],"d");
   var gx=[360,440,520,600,680,760,840,920];
   for(var q=0;q<gx.length;q++) curve([[gx[q],200],[gx[q],370]],"d");
   dots([[395,300],[475,260],[555,320],[635,280],[715,240],[795,310],[875,270]],"b",6);
   note("连续的位置 → 落在第几个格子里",640,172,"y");
   note("⭐ 切得越细 ⇒ 越准，但状态数爆炸",640,398,"y");},"<b>离散化的做法可以一句话说清：把连续的取值范围切成有限多段，每一段当成一个状态。</b><br><b>图上那些竖线就是切分，连续的位置落在第几格，就算处在第几个状态。</b><br><b>⚠ 但这里有一个躲不开的权衡：切得越细，近似越准，可状态数也越多。</b><br><b>⭐ 而且这个爆炸是按维度来的。</b>直升机的状态如果有<b>位置三个维度、速度三个维度、姿态三个维度</b>，<b>每个维度切 100 段，总状态数就是 100 的 9 次方</b>——<b>一个完全没法处理的数字。</b><br><b>⇒ 这个现象有个名字叫「维数灾难」。</b><b>它正是 L18 要面对的核心困难，也是为什么那一讲要讲「不靠离散化」的办法。</b>");
  SUM(2985,18,{h:"★ 连续状态：离散化，或用能直接处理的版本",k:"⚠ <b>这一讲的全部内容都建立在「状态有限」之上</b>：11 个方程 11 个未知数、遍历所有状态、解线性方程组。",m:"<b>而直升机的状态是连续的</b>——位置和速度是实数，<b>无穷多个状态</b> ⇒ <b>「对每个状态更新一遍」根本写不出循环</b>。",w:"⭐ <b>出路一：离散化</b>——把连续空间切成有限多个格子，每格当一个状态，就退回这一讲的框架。",e:"<b>出路二</b>：有些版本的值迭代<b>可以直接处理连续状态</b>。⇒ <b>这正是 L18 的主题</b>。"});
  QUIZ(2985,18,{t:"状态连续时，这一讲的方法为什么不能直接用？有哪两条出路？",o:["改用策略迭代就能处理连续状态","把 γ 设为 1 即可","可以直接用，只是慢一些","本讲全部内容建立在「状态有限」上，连续状态有无穷多个、无法遍历；出路是离散化成有限格子，或用能直接处理连续状态的值迭代版本"],a:3,w:"⭐ 离散化就是<b>把连续空间切成有限多个格子，每格当一个状态</b>，退回本讲框架。⇒ <b>L18 的主题</b>。"});
});
KP("19 · ★ P_sa 现实里从哪来：数次数",function(){
  S(3622,function(){clearScene();setEq("$$\\hat{P}_{sa}(s') \\;=\\; \\frac{\\text{在 } s \\text{ 做 } a \\text{ 后到达 } s' \\text{ 的次数}}{\\text{在 } s \\text{ 做过 } a \\text{ 的总次数}}$$","top");
       setCap("前面一直假装它是已知的");
       says("60:22","number of times took action a, in the state S and got to S prime",232);
       note("做法：先让机器人按某个策略（哪怕是随机策略）跑一阵，记录下每一步",640,296,"b");
       note("然后对每一组 (s, a) 数：去过哪些 s′、各去了几次",640,352,"b");
       note("⭐ 这就是极大似然估计 —— 和数硬币正反面是同一回事",640,402,"y");},"<b>到这里为止，我们一直假装 P_sa 是已知的。可现实里没人会把转移概率递给你。</b><br><b>Ng 说的工作流程很朴素：让机器人按某个策略在环境里跑一阵</b>（<b>哪怕是一个随机策略也行</b>），<b>把每一步都记下来</b>。<br><b>然后对每一组「状态 s + 动作 a」数次数</b>：<b>分子是「在 s 做 a 之后到达 s′ 的次数」，分母是「在 s 做过 a 的总次数」。</b><br><b>⭐ Ng 明确指出：这个比值就是极大似然估计。</b><b>它和「数硬币正反面来估计硬币的偏向」是同一回事</b>——<b>观察到的频率就是最可能的概率。</b><br><b>⚠ 但这个公式有个明显的破绽：如果某个 (s, a) 从来没试过，分母就是 0，整个式子是 0/0。</b><b>下一节讲这个。</b>");

     dim:function(i,j){return i===0;},
     hl:function(i,j){return i===4?"hl":"";}});
   note("⭐ 样本越多，估计越接近真值 —— 这就是极大似然的全部内容",640,398,"y");},"<b>用一个具体的数来看「数次数」是怎么回事。</b><br><b>假设机器人在某一格命令「往西」总共 100 次：其中 82 次真的到了西边，9 次偏到北边，9 次往南撞墙弹回。</b><br><b>⇒ 于是估计出的转移概率就是 0.82 / 0.09 / 0.09。</b><br><b>而这个环境真正的参数是 0.8 / 0.1 / 0.1——估计得相当准。</b><br><b>⭐ 样本越多，估计越接近真值，这就是极大似然估计的全部内容。</b><br><b>⚠ 但要注意一件事：这 100 次是怎么来的？是机器人实际走出来的。</b><b>如果它的策略从来不往某个方向走，那个方向的样本数就是 0。</b><br><b>⇒ 所以「数据从哪来」和「策略是什么」是纠缠在一起的——这个纠缠正是后面探索问题的根源。</b>");
  SUM(3622,19,{h:"★ P_sa 靠「数次数」估出来",k:"<b>做法</b>：让机器人<b>按某个策略（哪怕随机策略）跑一阵</b>，把每一步记下来。",m:"<b>公式</b>：分子 = <b>在 s 做 a 后到达 s′ 的次数</b>，分母 = <b>在 s 做过 a 的总次数</b>。",w:"⭐ Ng 明确指出<b>这就是极大似然估计</b>——和<b>数硬币正反面估计偏向</b>是同一回事，观察到的频率就是最可能的概率。",e:"⚠ <b>破绽</b>：某个 (s, a) <b>从来没试过时分母为 0</b>，整个式子是 <b>0/0</b>。"});
  QUIZ(3622,19,{t:"实际项目里 P_sa 是怎么得到的？",o:["由环境的物理方程推导出来","假定均匀分布即可","让机器人按某个策略跑一阵并记录，然后数次数：到达 s′ 的次数 ÷ 在 s 做过 a 的总次数，这就是极大似然估计","用神经网络拟合"],a:2,w:"⭐ 它和<b>数硬币正反面估计偏向</b>是同一回事。⚠ 破绽是<b>没试过的 (s,a) 会出现 0/0</b>。"});
});
KP("20 · ⚠ 没试过的动作怎么办",function(){
  S(3690,function(){clearScene();setEq(null);setCap("0/0 的那一格填什么");
       says("61:30","just assume that the state transition probability is 1 over 11");
       boxNode(130,196,470,58,"常用做法","g");
       boxNode(130,264,470,58,"假定它等概率通向任意状态：1/11","g");
       boxNode(690,196,470,58,"另一个选项：拉普拉斯平滑","y");
       boxNode(690,264,470,58,"分子加 1，分母加 11","y");
       note("⚠ Ng：MDP 的解法对 0 概率不像朴素贝叶斯那么敏感",640,348,"r");
       note("⇒ 所以实践中拉普拉斯平滑并不常用，前一种更常见",640,398,"y");},"<b>某个动作在某个状态下从来没试过，分母是 0，那一格填什么？</b><br><b>Ng 给的常用做法很直接：假定它等概率地通向任意一个状态，也就是 1/11。</b>意思是<b>「我完全不知道会发生什么，那就当它随机把我扔到某处」</b>。<br><b>另一个选项是拉普拉斯平滑</b>——<b>分子加 1、分母加 11</b>，<b>这同样避免了 0/0。</b><br><b>⚠ 但 Ng 在这里讲了一个很有意思的对比。</b>在<b>朴素贝叶斯</b>里，<b>出现 0 概率是非常要命的</b>——<b>一个 0 会让整个连乘变成 0，分类结果直接废掉</b>，所以那里必须做平滑。<br><b>⭐ 而 MDP 的解法对 0 概率没那么敏感</b>：<b>就算有些估计是 0，算法表现也不会差太多。</b><br><b>⇒ 所以 Ng 说实践中拉普拉斯平滑反而不常用，前面那个 1/11 的做法更常见。</b>");
  S(3690,function(){clearScene();setEq(null);setCap("两种填法的数值对比");
   matrix({rows:4,cols:3,cw:350,ch:48,x:130,y:196,
     cell:function(i,j){var t=[
       ["情形","1/11 的填法","拉普拉斯平滑"],
       ["完全没试过（0 次）","每个去向都填 1/11","也是 1/11（1÷11）"],
       ["试过 10 次，都去了同一处","1.0 和 0","0.52 和 0.048"],
       ["试过 1000 次","几乎相同","几乎相同"]];return t[i][j];},
     dim:function(i,j){return i===0;},
     hl:function(i,j){return i===2?"hl":"";}});
   note("⭐ 两种填法只在「样本很少」时才有差别，样本一多就趋同",640,398,"y");},"<b>把两种填法的数值摆出来对比。</b><br><b>完全没试过时：两种办法给出的结果其实一样，都是 1/11</b>（拉普拉斯平滑是 1 除以 11）。<br><b>⭐ 差别出现在「试过几次但很少」的时候。</b><b>比如试了 10 次、每次都去了同一个地方：直接数次数会给出 1.0 和 0（斩钉截铁），而拉普拉斯平滑给出 0.52 和 0.048（留了余地）。</b><br><b>试过 1000 次之后：两者几乎没有差别，数据压倒了平滑项。</b><br><b>⇒ 所以这两种填法的分歧，只存在于「样本很少」这个区间。</b><br><b>⭐ 这也解释了 Ng 为什么说实践中平滑不常用：MDP 的解法对那几个 0 不敏感，而真正重要的状态通常会被访问很多次，到那时两种填法早就趋同了。</b>");
  SUM(3690,20,{h:"⚠ 没试过的 (s,a)：填 1/11 或拉普拉斯平滑",k:"<b>常用做法</b>：<b>假定它等概率通向任意状态（1/11）</b>——「完全不知道会发生什么，就当它随机把我扔到某处」。",m:"<b>另一个选项</b>：拉普拉斯平滑，<b>分子加 1、分母加 11</b>。",w:"⚠ <b>和朴素贝叶斯的对比</b>：那里<b>一个 0 会让整个连乘变成 0，分类直接废掉</b>，所以必须平滑。",e:"⭐ <b>而 MDP 的解法对 0 概率没那么敏感</b>，就算有些估计是 0 表现也不会差太多 ⇒ Ng 说<b>实践中平滑反而不常用</b>。"});
  QUIZ(3690,20,{t:"某个 (s,a) 从未试过导致 0/0 时怎么办？为什么这里不像朴素贝叶斯那样必须平滑？",o:["直接把该状态从 MDP 中删掉","常用做法是假定等概率通向任意状态（1/11）；MDP 的解法对 0 概率不敏感，不像朴素贝叶斯那样一个 0 就让连乘归零","必须用拉普拉斯平滑，否则算法会崩溃","用邻近状态的转移概率代替"],a:1,w:"⭐ 朴素贝叶斯里<b>一个 0 概率会让整个连乘变成 0，分类结果直接废掉</b>；MDP 解法没有这个结构，所以<b>实践中平滑反而不常用</b>。"});
});
KP("21 · ★★ 把一切拼起来：完整的强化学习算法",function(){
  S(3900,function(){clearScene();setEq(null);setCap("前面所有零件装进一个循环");
       boxNode(170,180,980,50,"① 随便初始化一个策略 π","b");
       boxNode(170,238,980,50,"② 用 π 在环境里跑一阵，记录每一步","y");
       boxNode(170,296,980,50,"③ 数次数，更新对 P_sa（和 R）的估计","y");
       boxNode(170,354,980,50,"④ 用值迭代求 V*，再 argmax 得到新的 π；回到 ②","g");
       note("⭐ 注意这是个套娃：④ 里面的值迭代自己还有一层循环",640,166,"y");},"<b>现在把这一讲的所有零件装进一个循环，就是一个能真正跑起来的强化学习算法。</b><br><b>① 随便初始化一个策略。</b><br><b>② 用它在环境里跑一阵，把每一步都记录下来。</b><br><b>③ 数次数，更新对 P_sa 的估计</b>（<b>如果奖励也未知，同样用观测到的平均值估计 R</b>）。<br><b>④ 拿更新后的模型跑值迭代求出 V*，再用 argmax 得到新策略；然后回到第二步。</b><br><b>⭐ 注意这是一个套娃结构：第四步里面的值迭代，自己还有一层循环。</b>所以<b>外层是「收集数据 → 更新模型 → 重新求解」，内层是值迭代在反复刷 Bellman 方程。</b><br><b>⇒ 循环的逻辑很清楚：策略变好 ⇒ 走出的轨迹更有价值 ⇒ 模型估得更准 ⇒ 策略又能更好。</b><br><b>⚠ 但这个漂亮的循环里藏着一个严重的毛病，下一节就讲它。</b>");
  S(3900,function(){clearScene();setEq(null);setCap("⚠ 这个循环里，代价最大的是哪一步");
   boxNode(130,200,470,58,"② 跑一阵收集数据","y");
   boxNode(130,268,470,58,"要花真实时间（机器人要真的动）","d");
   boxNode(690,200,470,58,"④ 值迭代求 V*","b");
   boxNode(690,268,470,58,"纯计算，但要反复跑几十轮","d");
   note("⭐ 一个常见的加速：④ 不必从 0 开始，可以用上一轮的 V 当初值",640,348,"y");
   note("⚠ 因为模型只变了一点，上一轮的 V 已经是很好的起点了",640,398,"g");},"<b>这个循环跑起来之后，代价最大的是哪一步？值得想清楚。</b><br><b>第二步要花真实时间——机器人得真的在环境里动起来，这是没法加速的。</b><br><b>第四步是纯计算，但要反复跑几十轮值迭代。</b><br><b>⭐ 这里有一个很常用的加速办法：第四步不必每次都把 V 重新初始化为 0。</b><br><b>⚠ 理由是：每一轮外层循环只是让模型 P_sa 变了一点点（多了一批数据），所以新的 V* 和上一轮的 V* 应该很接近。</b><b>⇒ 用上一轮的结果当初值，值迭代往往几轮就收敛了，而不是几十轮。</b><br><b>⭐ 这个技巧的名字叫「热启动」，在很多迭代算法里都用得上。</b><b>它也再次印证了之前那句话：值迭代的初始值可以随便定，这给了我们利用先验信息的自由。</b>");
  SUM(3900,21,{h:"★★ 完整算法：收集数据 → 更新模型 → 重新求解",k:"<b>① 随便初始化 π ② 用它跑一阵、记录每一步 ③ 数次数更新 P_sa（R 未知时同样用平均值估计）④ 值迭代求 V*、argmax 得新 π，回到 ②</b>。",m:"⭐ <b>这是套娃结构</b>：第 ④ 步里面的<b>值迭代自己还有一层循环</b>。外层是「收集 → 更新 → 重解」，内层是值迭代刷 Bellman 方程。",w:"⇒ <b>循环逻辑</b>：策略变好 ⇒ 轨迹更有价值 ⇒ 模型估得更准 ⇒ 策略又能更好。",e:"⚠ <b>但这个循环里藏着一个严重的毛病</b>——见下一个知识点。"});
  QUIZ(3900,21,{t:"完整的（基于模型的）强化学习算法是怎么循环的？",o:["枚举所有策略，选价值最高的","直接对策略参数做梯度上升，不需要模型","初始化 π → 用 π 跑一阵记录 → 数次数更新 P_sa → 值迭代求 V* 并 argmax 得新 π → 回到第二步","收集全部数据 → 训练一次 → 结束"],a:2,w:"⭐ 注意这是<b>套娃结构</b>：第四步里的值迭代自己还有一层循环。⚠ 这个循环里藏着一个严重毛病（探索不足）。"});
});
KP("22 · ⚠⚠ 探索 vs 利用：它可能永远找不到那桶金子",function(){
  S(4181,function(){clearScene();setEq(null);setCap("纯贪心算法的致命盲点");
       says("69:41","it is called the exploration versus exploitation problem");
       grid(330,200,150,56,5,3,function(i,j){
         if(i===4&&j===0) return ["+1","g"];
         if(i===0&&j===2) return ["+10","y"];
         if(i===2&&j===1) return ["墙","d"];
         return ["",""];});
       note("⭐ 它找到了 +1，于是一直往那儿跑",640,176,"g");
       note("⚠ 左下角那个 +10 它可能一辈子都发现不了 —— 因为它从没去过",640,398,"r");},"<b>⚠⚠ 上一节那个算法有一个致命的盲点。</b><br><b>它是纯粹贪心的：每一步都按当前估计的最优去走。</b>听起来很合理，但想想会发生什么——<b>机器人偶然找到了右上角那个 +1，于是以后就一直往那儿跑。</b><br><b>⭐ 而左下角可能藏着一个 +10 的宝藏，它却一辈子都发现不了。</b><b>为什么？因为它从来没去过那边</b>，<b>而没去过就没有数据，没有数据就不知道那里有东西，不知道就更不会去。</b><b>⇒ 这是个自我锁死的循环。</b><br><b>Ng 说这叫「探索与利用」问题</b>：<b>利用是「用好你已经知道的」，探索是「去试试那些看起来不够好、但你其实没把握的选择」。</b><br><b>⚠ 他特意强调这不只是学术问题。</b>下一镜讲他举的那个现实例子。");
  S(4181,function(){clearScene();setEq(null);setCap("在线广告平台也有同一个问题");
       boxNode(130,196,470,58,"纯利用","r");
       boxNode(130,264,470,58,"只推你最可能点的广告 ⇒ 短期收入最高","r");
       boxNode(690,196,470,58,"带探索","g");
       boxNode(690,264,470,58,"偶尔推一个「不像你会点」的 ⇒ 可能发现新兴趣","g");
       note("⭐ Ng 的例子：如果平台从不试，就永远不知道他对火星着陆器感兴趣",640,348,"y");
       note("⚠ 他也说了句题外话：exploitation 这个词在广告语境里听起来很不妙",640,398,"d");},"<b>Ng 举的现实例子是大型在线广告平台，他说它们面对的是同一个问题。</b><br><b>纯利用的做法是：永远只推你最可能点击的广告</b>，<b>这样短期收入最高</b>。<br><b>⭐ 而带探索的做法是：偶尔推一个「我们并不认为你会点」的广告。</b>Ng 用自己打比方：<b>如果平台从来不试，就永远不会知道他其实对火星着陆器很感兴趣</b>；<b>而只要试一次、他点了，平台就学到了新东西。</b><br><b>⇒ 这正是网格世界里那个 +10 宝藏的现实版本：不去试，就永远不知道。</b><br><b>⚠ 顺带一提，Ng 在课上还特意澄清了一句：exploitation 这个词在广告的语境里听起来很不妙，但它在这里是纯技术术语，指「利用已有知识」，没有剥削的意思。</b>");
  SUM(4181,22,{h:"⚠⚠ 探索与利用：纯贪心会自我锁死",k:"纯贪心算法<b>每步都按当前估计的最优走</b> ⇒ 找到 +1 就一直往那儿跑，<b>左下角的 +10 可能一辈子发现不了</b>。",m:"⭐ <b>自我锁死的循环</b>：<b>没去过 ⇒ 没数据 ⇒ 不知道那里有东西 ⇒ 更不会去</b>。",w:"<b>术语</b>：<b>利用</b> = 用好你已经知道的；<b>探索</b> = 去试那些看起来不够好、但你其实没把握的选择。",e:"⭐ <b>Ng 的现实例子</b>：在线广告平台。纯利用 = 只推你最可能点的；带探索 = <b>偶尔推一个「不像你会点」的</b>，否则<b>永远不会知道他对火星着陆器感兴趣</b>。"});
  QUIZ(4181,22,{t:"「探索与利用」问题指的是什么？纯贪心算法为什么有问题？",o:["计算资源在探索和利用之间的分配","纯贪心只按当前估计的最优走，于是没去过的地方永远没有数据、也就永远不会去——可能一辈子发现不了更好的选择","模型复杂度与数据量的权衡","训练集和测试集的划分问题"],a:1,w:"⭐ 关键是<b>自我锁死</b>：没去过 ⇒ 没数据 ⇒ 不知道 ⇒ 更不会去。⭐ Ng 的例子是<b>在线广告平台</b>：不偶尔试试，就永远发现不了用户的新兴趣。"});
});
KP("23 · ★ ε-greedy：留 10% 给运气",function(){
  S(4438,function(){clearScene();setEq(null);setCap("最常用的那个办法");
       says("73:58","this particular exploration policy is called Epsilon-greedy");
       boxNode(150,200,440,76,"90% 的概率","g");
       boxNode(150,290,440,56,"照当前最优策略走","g");
       boxNode(760,200,440,76,"10% 的概率","y");
       boxNode(760,290,440,56,"随便挑一个动作","y");
       note("⭐ 每一步都掷一次这个偏心的硬币",640,172,"y");
       note("⚠ 这样它总有机会误打误撞走到那桶金子，然后学到它的存在",640,398,"r");},"<b>怎么强迫算法去探索？最常用的办法叫 ε-greedy，而且它简单得出奇。</b><br><b>每一步掷一次偏心的硬币：90% 的概率照当前认为最优的策略走，10% 的概率随便挑一个动作。</b><br><b>⭐ 就这么一点随机性，就打破了上一节那个自我锁死的循环</b>——<b>机器人总有机会误打误撞走到左下角，然后学到那里有个 +10。</b><br><b>⚠ 这里有个细节值得留意：探索的动作不是「好动作」，它按定义就是次优的。</b><b>所以探索是有代价的——你要用一部分短期收益，去换取「发现更好东西」的机会。</b><br><b>⭐ 那个 10% 就是 ε。</b>Ng 还吐槽了这个名字：<b>ε 是「随机行动」的概率，不是「贪心」的概率，所以按字面读 ε-greedy 像是说「只有 10% 的时间贪心」，其实正好反了——叫 1−ε greedy 才对。</b><br><b>⚠ 他也说明了：探索的办法不止这一种，有很多启发式做法。</b>");
  S(4438,function(){clearScene();setEq(null);setCap("ε 该设多大");
   matrix({rows:4,cols:3,cw:350,ch:48,x:130,y:196,
     cell:function(i,j){var t=[
       ["ε","后果",""],
       ["太小（如 0.01）","⚠ 几乎不探索，还是可能错过宝藏",""],
       ["太大（如 0.5）","⚠ 一半时间在瞎走，表现很差",""],
       ["★ 常见做法","一开始大、随时间逐渐调小",""]];return t[i][j];},

    "收一下。<b>出发点是一个很实际的困难：策略的数量是组合爆炸的。</b>Ng 算给你看——<b>11 个状态、每个状态 4 个动作，就有 4¹¹ 种策略</b>，而<b>一般是「动作数的状态数次方」</b>。<b>⇒ 枚举是没指望的，必须换一条路。</b><br><b>那条路是价值函数。</b><b>V^π(s) 的定义是：从状态 s 出发、一路按 π 行动，能拿到的期望总回报。</b>⭐ <b>它把「策略好不好」这个笼统问题，变成了每个状态上的一个数。</b><br><b>★★★ 核心是 Bellman 方程</b>：<b>V^π(s) = R(s) + γ · E[V^π(s′)]</b>——<b>当前状态的价值 ＝ 立刻拿到的奖励 ＋ 折扣后的未来期望价值</b>。⭐ <b>它的威力在于把一个「无限长的未来」压缩成了「一步 + 剩下的价值」</b>，而剩下的价值也满足同样的方程。<br><b>⇒ 于是 11 个状态给出 11 个方程、11 个未知数，这是一个线性方程组，可以直接解。</b><br><b>然后是两种价值函数，⚠ Ng 专门说这是术语上最容易混的地方</b>：<b>V^π 是某个具体策略的价值</b>（那个策略可能很烂），<b>V* 是最优价值函数</b>，定义成<b>所有策略里取最大</b>。<b>V* 的 Bellman 方程里多了一个 max</b>——因为你可以挑动作。<b>⭐ 有了 V*，最优策略就是一个 argmax：在每个状态挑那个让期望未来价值最大的动作。</b><br><b>值迭代</b>：<b>把所有状态的价值初始化为 0，然后反复用 Bellman 方程更新</b>。⚠ <b>同步更新</b>是算完全部 11 个再一起替换，<b>异步更新</b>是算一个就立刻覆盖一个；<b>两种都收敛，多数人用异步</b>。<b>收敛很快</b>：<b>γ=0.9 时几十次迭代就很接近了，γ=0.99 时要几百次</b>。<br><b>⭐ 算完 V* 再用 argmax，就兑现了上一讲的悬念</b>：那一格<b>往西的期望未来回报是 0.8×0.75 + 0.1×0.69 + 0.1×0.71 = 0.740</b>，<b>往北是 0.8×0.69 + 0.1×0.75 + 0.1×0.49 = 0.676</b>。<b>往西明显更高 ⇒ 绕路才是对的。</b>⚠ Ng 补了一句严谨的：<b>实际上四个方向都要算一遍再比。</b><br><b>策略迭代</b>换了个焦点：<b>盯着策略而不是价值函数</b>。<b>随便初始化一个 π，解线性方程组得到 V^π，再把 V^π 当成最优的来更新 π，如此反复</b>。<b>它在有限步内就会停止变化。</b><br><b>⚠ 怎么选</b>：<b>策略迭代每轮都要解一次线性方程组</b>，<b>状态只有十几个到几百个时很快</b>；<b>状态一多，解方程组就成了瓶颈，Ng 说他会偏向值迭代</b>。<br><b>最后两件很实际的事。</b>其一，<b>P_sa 现实里是估出来的</b>：<b>让机器人按某个策略跑一阵，然后数次数</b>——<b>在 s 做 a 后到达 s′ 的次数，除以在 s 做 a 的总次数</b>。<b>这就是极大似然估计。</b>⚠ <b>没试过的动作会出现 0/0</b>，常见做法是<b>假定它等概率通向任意状态（1/11）</b>；也可以用拉普拉斯平滑，<b>但 Ng 说 MDP 的解法对 0 概率不像朴素贝叶斯那么敏感，所以实践中不常用</b>。<br><b>⚠⚠ 其二是探索与利用。</b>上面那套算法是<b>纯粹贪心的</b>——<b>永远按当前估计的最优去走</b>。<b>后果是：它可能一辈子都发现不了角落里那个 +10 的宝藏，因为它从没去过那儿。</b>Ng 用在线广告平台做类比：<b>纯利用就是只推你最可能点的广告</b>，<b>而适当探索才能发现你自己都没意识到的兴趣</b>。<b>常用的办法是 ε-greedy：每一步以 90% 的概率照当前最优走，10% 的概率随便走一步。</b>⭐ <b>Ng 还吐槽这个名字起反了——ε 是「随机」的概率而不是「贪心」的概率，叫 1−ε greedy 才对。</b><br><b>下一讲 L18 处理一个这一讲回避了的前提：状态是连续的怎么办。</b>");
