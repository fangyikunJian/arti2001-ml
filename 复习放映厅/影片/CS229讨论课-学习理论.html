<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>

.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}

.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}
  var b={};eqBox.querySelectorAll("[data-id]").forEach(function(e){b[e.dataset.id]=e.getBoundingClientRect();});

    bar.addEventListener("click",function(){go(k.from,true);});
    kpsEl.appendChild(bar);});
  function hhmmss(s){s=Math.round(s);var m=Math.floor(s/60);
    return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
  var tcEl=document.getElementById("tc");
  if(!CFG.video)tcEl.hidden=true;
  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));

    if(locked&&n>cur&&!force)return;
    FAST=true;clearScene();
    for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}

    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});

    document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  先回答":"");
    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1,true);});

    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();narrOn=!narrOn;
      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});
  go(0);
}
window.__startProjector=startProjector;
})();

<script>
(function(){

/* ⚠ 这是助教的讨论课，不是 Ng 的正课，所以标「讨论课」而不是「Ng」 */
function says(ts,en,y){
  note("🎙 讨论课 "+ts+"  «"+en+"»",640,y||150,"g");}

/* ── 一团采样分布的点（cx,cy 中心，sd 分散度，n 个点）── */
function cloud(cx,cy,sd,n,cls,seed){
  var r=rng(seed||7), p=[], i;
  for(i=0;i<n;i++){
    var a=r()*Math.PI*2, d=sd*Math.sqrt(r());
    p.push([cx+d*Math.cos(a), cy+d*Math.sin(a)]);}
  dots(p,cls||"b",5);}

/* ── 靶心：真参数 θ* 的位置，外面套几圈 ──
   ⚠ 不能用 fn() 画圆：fn 是按 x 扫的，一个 x 只能有一个 y。圆要自己按角度生成点。*/
function ring(cx,cy,r0,cls){
  var p=[],i;
  for(i=0;i<=72;i++){var a=i/72*Math.PI*2;
    p.push([cx+r0*Math.cos(a), cy+r0*Math.sin(a)]);}
  curve(p,cls||"d");}
function bull(cx,cy,r0){
  ring(cx,cy,r0,"d"); ring(cx,cy,r0*0.62,"d");
  dots([[cx,cy]],"r",7);}

/* ── 一条衰减曲线 ── */
function decay(x0,x1,ybase,amp,k){
  return fn(function(x){return ybase-amp*Math.exp(-k*(x-x0)/(x1-x0));},x0,x1,90);}

KP("开场",function(){

    setTitle("CS229 讨论课","学习理论",
      "把偏差方差讲到底");},
    "这是一节助教主持的讨论课，专门补深正课里的学习理论。<b>它的开场就说明了路线：先框定学习问题，然后深入偏差-方差权衡，再讲经验风险最小化，最后花不少时间在一致收敛和 VC 维上。</b><br><b>⭐ 它最值钱的地方，是用一个和正课完全不同的角度重讲偏差和方差。</b><br><b>你在正课里见过的多半是那张「欠拟合 / 过拟合」的曲线图——模型太简单就欠拟合，太复杂就过拟合。</b><b>⚠ 那张图很直观，但它讲不清「偏差」和「方差」到底是什么量。</b><br><b>这节课换成参数视角：想象你把整个训练过程重复无数次，每次用一批新数据，得到一个 θ̂。</b><b>这些 θ̂ 会形成一个分布。</b><b>⭐ 于是偏差就是「这团分布有没有以真参数为中心」，方差就是「这团分布有多散」——两个都变成了可以精确说清楚的量。</b><br><b>后半段会把泛化误差拆成三块，再用 Hoeffding 不等式和 union bound 证明：只要假设类不太大、数据不太少，训练误差小就意味着泛化误差也小。</b>");
});
KP("1 · ★★ 换个视角：从参数去看偏差和方差",function(){
  S(642,function(){clearScene();setEq(null);setCap("正课那张曲线图讲不清的事");
       says("10:42","it is more useful to see it from the parameter view");
       boxNode(130,200,470,58,"正课的视角","d");
       boxNode(130,268,470,58,"欠拟合 / 过拟合的曲线图","d");
       boxNode(690,200,470,58,"★ 这节课的视角","y");
       boxNode(690,268,470,58,"看「θ̂ 的采样分布」长什么样","y");
       note("⭐ 想象把整个训练过程重复无数次，每次换一批新数据",640,348,"y");
       note("⇒ 得到无数个 θ̂，它们构成一个分布 —— 这就是采样分布",640,398,"g");},"<b>这节讨论课最值钱的地方，是用一个和正课不同的角度重讲偏差和方差。</b><br><b>正课里你见过的多半是那张欠拟合/过拟合的曲线图。</b><b>⚠ 它很直观，但讲不清「偏差」和「方差」到底是什么量。</b><br><b>★ 这节课说：要更正式地理解，从参数视角看更有用。</b><br><b>⭐ 具体怎么想：设想你把整个训练过程重复无数次，每一次都用一批新采来的数据，于是每次得到一个不同的 θ̂。</b><br><b>⇒ 这无数个 θ̂ 会构成一个分布，这就叫「采样分布」。</b><br><b>注意这个分布不是关于数据的，是关于「你的算法在不同数据上会给出什么答案」的。</b><b>下一节就在这团分布上定义偏差和方差。</b>");
  S(642,function(){clearScene();setEq(null);setCap("⚠ 一个很容易卡住的点");
   boxNode(130,196,470,58,"采样分布不是什么","d");
   boxNode(130,264,470,58,"不是数据的分布，也不是预测值的分布","d");
   boxNode(690,196,470,58,"★ 它是什么","y");
   boxNode(690,264,470,58,"「学到的参数 θ̂」的分布","y");
   note("⭐ 随机性的来源是「你抽到了哪一批训练数据」",640,348,"y");
   note("⚠ 所以现实中你永远只看到这个分布里的一个点 —— 它是个思想实验",640,398,"r");},"<b>「采样分布」这个词很容易卡住，澄清一下。</b><br><b>它不是数据的分布，也不是模型预测值的分布。</b><br><b>★ 它是「学到的参数 θ̂」的分布。</b><br><b>⭐ 随机性的来源只有一个：你抽到了哪一批训练数据。</b><b>换一批数据，算法吐出一个不同的 θ̂；再换一批，又一个——这些 θ̂ 的分布就是采样分布。</b><br><b>⚠ 要注意一件事：现实中你永远只看到这个分布里的一个点。</b><b>你只训练了一次，只有一个 θ̂。</b><br><b>⇒ 所以采样分布是一个思想实验，是用来定义概念的工具，不是你能直接观测到的东西。</b><b>⭐ 但这不妨碍它有用——正是靠它，偏差和方差才有了精确的定义。</b>");
  SUM(642,1,{h:"★★ 参数视角：看 θ̂ 的采样分布",k:"<b>正课的视角</b>：欠拟合/过拟合的曲线图。⚠ 很直观，<b>但讲不清偏差和方差到底是什么量</b>。",m:"★ <b>这节课</b>：讨论课说<b>要更正式地理解，从参数视角看更有用</b>。",w:"⭐ <b>怎么想</b>：把整个训练过程<b>重复无数次，每次用一批新数据</b>，每次得到一个不同的 θ̂。",e:"⇒ <b>这无数个 θ̂ 构成一个分布，叫「采样分布」</b>。⚠ 它不是关于数据的，<b>是关于「你的算法在不同数据上会给出什么答案」的</b>。"});

});
KP("2 · ★★★ 偏差 = 居不居中，方差 = 散不散",function(){
  S(836,function(){clearScene();setEq(null);setCap("两个都变成了能精确说清的量");
       says("13:56","is the sampling distribution kind of centered around the true parameter");

  S(847,function(){clearScene();setEq(null);setCap("方差：这团点有多散");

       note("⭐ 两者互相独立：可以低偏差高方差，也可以高偏差低方差",640,172,"y");},"<b>方差问的是另一件事：这团分布有多分散。</b>讨论课的说法是<b>「方差衡量的基本上就是采样分布有多分散」</b>。<br><b>左边低方差：那些 θ̂ 挤得很紧，意味着换一批数据，你得到的答案也差不多。</b><br><b>⚠ 右边高方差：点撒得很开，意味着换一批数据，答案就差很远</b>——<b>这正是「模型对训练数据太敏感」的精确说法。</b><br><b>⭐ 最要紧的一点：偏差和方差是两个互相独立的性质。</b><b>你可以低偏差高方差（平均对但不稳定），也可以高偏差低方差（很稳定但稳定地错着）。</b><br><b>⇒ 四种组合都存在，这是那张曲线图很难表达出来的。</b>");
  S(836,function(){clearScene();setEq(null);setCap("四种组合，各对应什么情况");
   matrix({rows:5,cols:2,cw:420,ch:38,x:220,y:196,

     dim:function(i,j){return i===0;},
     hl:function(i,j){return i===1?"hl":"";}});
   note("⭐ 注意「过拟合」对应的是低偏差高方差，不是「偏差大」",640,398,"y");},"<b>把四种组合和熟悉的说法对上，参数视角就和正课那张图接上了。</b><br><b>低偏差低方差：理想状态。</b><br><b>低偏差高方差：模型表达能力够，但数据不够，于是对训练数据太敏感——这就是过拟合。</b><br><b>高偏差低方差：模型太简单，系统性地错着，但很稳定——这就是欠拟合。</b><br><b>⚠ 高偏差高方差：模型选错了，而且数据还少，两头不讨好。</b><br><b>⭐ 这里有个值得注意的对应：过拟合对应的是「低偏差、高方差」，而不是「偏差大」。</b><b>过拟合的模型平均起来其实是对的，问题出在它太不稳定。</b><br><b>⇒ 想通这一点，「为什么集成方法（比如随机森林）能治过拟合」就很自然了——它就是在降方差。</b>");
  SUM(836,2,{h:"★★★ 偏差 = 居不居中，方差 = 散不散",k:"<b>偏差</b>：讨论课原话——<b>采样分布是不是大致以那个真实的、未知的参数为中心</b>。",m:"<b>方差</b>：<b>衡量采样分布有多分散</b>。低方差 = 换一批数据答案也差不多；<b>高方差 = 换一批数据答案差很远</b>（即「对训练数据太敏感」的精确说法）。",w:"⭐ <b>偏差描述系统性偏移</b>，和运气无关——<b>再跑一万次，那团点还是偏在那儿</b>。",e:"⭐ <b>两者互相独立</b>：可以<b>低偏差高方差</b>（平均对但不稳定），也可以<b>高偏差低方差</b>（稳定地错着）。四种组合都存在。"});
  QUIZ(836,2,{t:"在参数视角下，偏差和方差分别是什么？",o:["偏差 = 采样分布是否以真参数为中心；方差 = 这个分布有多分散。两者互相独立，四种组合都存在","偏差是均值，方差是中位数","偏差是训练误差，方差是测试误差","偏差是参数个数，方差是数据量"],a:0,w:"⭐ <b>偏差描述系统性偏移</b>，和运气无关——再跑一万次那团点还是偏在那儿。⇒ 「四种组合都存在」是那张曲线图很难表达的。"});
});
KP("3 · ⭐ 一句精炼的话：一阶矩和二阶矩",function(){
  S(862,function(){clearScene();setEq(null);setCap("把两者归到同一个框架下");
       says("14:22","bias and variance are basically just properties of the first and second moments");
       boxNode(130,200,470,58,"一阶矩（均值）","b");
       boxNode(130,268,470,58,"它等于 θ* 吗？ ⇒ 偏差","b");
       boxNode(690,200,470,58,"二阶矩（方差）","y");
       boxNode(690,268,470,58,"它有多大？ ⇒ 方差","y");
       note("⭐ 偏差和方差本质上就是采样分布的一阶矩和二阶矩的性质",640,348,"y");
       note("⚠ 所以它们不是两个互相对立的东西，而是同一个分布的两个侧面",640,398,"r");},"<b>讨论课给了一句很精炼的总结，值得单独记：偏差和方差，本质上就是采样分布的一阶矩和二阶矩的性质。</b><br><b>一阶矩就是均值。</b><b>你问的是：这个均值等不等于真参数 θ*？</b>——<b>这就是偏差。</b><br><b>二阶矩就是方差本身。</b><b>你问的是：它有多大？</b>——<b>这就是方差。</b><br><b>⭐ 这句话的价值在于它把两个看起来很不一样的概念，归到了同一个框架下：它们都只是在描述同一个分布的不同侧面。</b><br><b>⚠ 这也纠正了一个常见误解：偏差和方差不是两个互相对立、此消彼长的东西。</b><b>它们之所以常常此消彼长，是因为现实中的算法设计往往要在两者间取舍，而不是因为定义上对立。</b>");
  S(862,function(){clearScene();setEq("$$\\text{Bias} = \\mathbb{E}[\\hat{\\theta}] - \\theta^{*}, \\qquad \\text{Var} = \\mathbb{E}\\big[(\\hat{\\theta}-\\mathbb{E}[\\hat{\\theta}])^{2}\\big]$$","top");
   setCap("写成式子就一目了然");
   note("① 偏差：采样分布的均值，减去真参数",640,274,"b");
   note("② 方差：采样分布自己的离散程度（和 θ* 无关）",640,326,"b");
   note("⭐ 注意②的式子里根本没有 θ* —— 方差不知道真值是多少",640,378,"y");},"<b>把两个定义写成式子，关系就一目了然了。</b><br><b>① 偏差 = 采样分布的均值，减去真参数 θ*。</b><b>所以它需要知道真值。</b><br><b>② 方差 = 采样分布自己的离散程度，也就是 θ̂ 偏离自己均值的平方的期望。</b><br><b>⭐ 注意第二个式子里根本没有出现 θ*。</b><b>方差压根不知道真值是多少——它只关心「这团点自己散不散」。</b><br><b>⇒ 这就解释了为什么偏差和方差是独立的两件事：一个要对照真值，一个完全是内部性质。</b><br><b>⚠ 也解释了一个实践上的事实：你可以在不知道真值的情况下估计方差（多跑几次看结果波动多大），但没法同样轻松地估计偏差。</b>");
  SUM(862,3,{h:"⭐ 偏差方差 = 采样分布的一阶矩与二阶矩",k:"讨论课的精炼总结：<b>偏差和方差本质上就是采样分布的一阶矩和二阶矩的性质</b>。",m:"<b>一阶矩 = 均值</b>：它等不等于真参数 θ*？⇒ <b>偏差</b>。<b>二阶矩 = 方差本身</b>：它有多大？⇒ <b>方差</b>。",w:"⭐ <b>价值</b>：把两个看起来很不一样的概念<b>归到同一个框架</b>——它们都只是在描述同一个分布的不同侧面。",e:"⚠ <b>纠正一个误解</b>：偏差和方差<b>不是定义上对立、此消彼长的</b>。它们常常此消彼长，是因为<b>算法设计上要取舍</b>。"});
  QUIZ(862,3,{t:"「偏差和方差是一阶矩和二阶矩的性质」怎么理解？",o:["一阶矩是参数个数，二阶矩是样本量","一阶矩是训练误差，二阶矩是测试误差","一阶矩是梯度，二阶矩是 Hessian","一阶矩是采样分布的均值（问它等不等于 θ*，即偏差），二阶矩就是方差本身（问它有多大）"],a:3,w:"⭐ 这句话把两个概念<b>归到同一框架</b>。⚠ 它也说明<b>偏差方差不是定义上对立的</b>——常此消彼长是算法设计上要取舍。"});
});
KP("4 · ★ 数据越多，方差越小",function(){
  S(964,function(){clearScene();setEq(null);setCap("m 增大时发生什么");
       says("16:04","as we increase the size of the data");
       axes({x0:290,x1:1000,y0:370,y1:200});
       curve(decay(310,980,366,150,2.4),"y");
       note("横轴：样本量 m",640,398,"d");
       note("纵轴：方差",300,186,"d");
       note("⭐ m 越大，那团 θ̂ 挤得越紧 ⇒ 方差趋于 0",700,250,"y");
       note("⚠ 但偏差不会因为数据变多而消失",640,330,"r");},"<b>样本量 m 变大时，采样分布会发生什么？</b><br><b>⭐ 方差会变小，而且趋于 0。</b>直觉很好理解：<b>每次训练用的数据越多，不同批次之间的差异对结果的影响就越小，所以那团 θ̂ 会挤得越来越紧。</b><br><b>⚠ 但偏差不会因为数据变多而消失。</b><b>如果你的模型天生就表达不了真实规律（比如用直线去拟合一条曲线），那无论给多少数据，那团点还是会系统性地偏在一边。</b><br><b>⇒ 这是一个很实用的判断：如果你的问题是方差大，加数据有用；如果是偏差大，加数据没用，得换模型。</b><br><b>⭐ 而「方差下降得有多快」本身是一个值得研究的量，下一节讲。</b>");
  S(964,function(){clearScene();setEq(null);setCap("学习曲线为什么长那个样");
   axes({x0:300,x1:980,y0:370,y1:200});
   curve(fn(function(x){var n=(x-320)/640;return 230+100*Math.exp(-3.2*n);},320,960,80),"b");
   curve(fn(function(x){var n=(x-320)/640;return 350-95*Math.exp(-3.2*n);},320,960,80),"y");
   note("蓝：测试误差（随 m 下降）",820,214,"b");
   note("黄：训练误差（随 m 上升）",820,356,"y");
   note("⭐ 两条线最终收敛到的那个高度 = 偏差 ＋ 不可约误差",640,398,"y");},"<b>「方差随 m 下降、偏差不变」这件事，正好解释了学习曲线为什么长成那个样子。</b><br><b>测试误差随数据量增加而下降</b>——<b>因为方差在降。</b><br><b>训练误差随数据量增加而上升</b>——<b>因为样本越多越难全部拟合好。</b><br><b>⭐ 而两条线最终会收敛到同一个高度，那个高度就是偏差加上不可约误差。</b><br><b>⇒ 这给了一个很实用的诊断：看两条线收敛到的位置。</b><b>如果它们收敛到的高度已经很低，那加数据还有用（在缩小剩余的方差）；如果已经贴在一起但高度还很高，那就是偏差问题，加数据没用了。</b><br><b>⭐ 这和 L20 诊断法的精神完全一致：先判断问题在哪一环，再决定往哪使劲。</b>");
  SUM(964,4,{h:"★ m 增大 ⇒ 方差趋于 0，但偏差不会消失",k:"⭐ <b>方差会变小并趋于 0</b>。直觉：<b>每次训练用的数据越多，批次之间的差异对结果影响越小</b>，那团 θ̂ 挤得越紧。",m:"⚠ <b>但偏差不会因为数据变多而消失</b>：模型天生表达不了真实规律（用直线拟合曲线），<b>给多少数据那团点都系统性偏在一边</b>。",w:"⇒ ⭐ <b>很实用的判断</b>：<b>方差大 ⇒ 加数据有用</b>；<b>偏差大 ⇒ 加数据没用，得换模型</b>。",e:"⭐ 而「<b>方差下降得有多快</b>」本身是一个值得研究的量。"});
  QUIZ(964,4,{t:"样本量 m 增大时，偏差和方差分别怎么变？",o:["两者都趋于 0","偏差趋于 0，方差不变","方差趋于 0，但偏差不会消失——模型天生表达不了真实规律时，再多数据也系统性地偏着","两者都不变"],a:2,w:"⭐ 实用判断：<b>方差大 ⇒ 加数据有用</b>；<b>偏差大 ⇒ 加数据没用，得换模型</b>。"});
});
KP("5 · ★ 统计效率、一致性、无偏",function(){
  S(1035,function(){clearScene();setEq(null);setCap("三个容易混的术语");
       says("17:15","the rate at which the variance goes to 0 as you increase m");
       matrix({rows:4,cols:2,cw:430,ch:44,x:210,y:198,
         cell:function(i,j){var t=[
           ["术语","说的是什么"],
           ["统计效率","★ 方差随 m 下降的「速率」"],
           ["一致（consistent）","m → ∞ 时 θ̂ 收敛到 θ*"],
           ["无偏（unbiased）","⚠ 对任何 m，θ̂ 的期望都等于 θ*"]];return t[i][j];},
         dim:function(i,j){return i===0;},
         hl:function(i,j){return i>=2?"hl":"";}});
       note("⚠ 一致说的是极限行为；无偏说的是任何样本量下都居中 —— 两件事",640,398,"r");},"<b>围绕采样分布有三个术语，很容易混，这里一次分清。</b><br><b>★ 统计效率：方差随 m 下降的速率。</b>讨论课举了例子——<b>有的算法方差是 1/m² 的量级，有的是 e 的 −m 次方</b>，<b>同样加数据，下降速度可以差很远。</b><br><b>一致（consistent）：如果 m 趋于无穷时 θ̂ 收敛到 θ*，就说这个算法是一致的。</b><br><b>⚠ 无偏（unbiased）：如果对任何 m，θ̂ 的期望都等于 θ*，就说它是无偏的。</b><br><b>⭐ 关键区别：一致说的是极限行为——样本无穷多时才保证对；无偏说的是任何样本量下都居中——哪怕只有 10 个样本，平均起来也对。</b><br><b>⇒ 无偏是更强的要求。一个算法可以是一致但有偏的（样本少时偏，样本多了才靠拢）。</b>");
  S(1035,function(){clearScene();setEq(null);setCap("为什么要区分这些");
   boxNode(170,196,980,56,"⚠ 「这个算法会收敛到正确答案」—— 这句话太含糊","r");
   boxNode(170,264,980,56,"★ 它可能指：一致（极限对）/ 无偏（任何 m 都居中）/ 高效（降得快）","y");
   note("⭐ 三者可以互相独立：一个算法可以一致但有偏、也可以无偏但低效",640,340,"y");
   note("⚠ 选算法时该问哪一个，取决于你的样本量有多大",640,398,"r");},"<b>为什么要把这三个词分这么细？因为「这个算法会收敛到正确答案」这句话其实太含糊了。</b><br><b>★ 它可能指三件不同的事：一致（样本无穷多时对）、无偏（任何样本量下平均都对）、高效（方差降得快）。</b><br><b>⭐ 而三者可以互相独立。</b><b>一个算法可以是一致但有偏的——样本少时系统性偏着，样本多了才靠拢；也可以是无偏但低效的——平均总是对的，但方差降得很慢，所以单次结果很不可靠。</b><br><b>⚠ 选算法时该看哪一个，取决于你的样本量。</b><b>样本非常多时，一致性就够了；而样本有限时，无偏和高效才是你真正关心的。</b><br><b>⇒ 这也是为什么统计学里对这些词分得这么细——不是咬文嚼字，是因为它们对应不同的实际处境。</b>");
  SUM(1035,5,{h:"★ 统计效率 / 一致 / 无偏，三者的区别",k:"★ <b>统计效率</b>：方差随 m 下降的<b>速率</b>。例：有的算法方差按 <b>1/m²</b> 降，有的按 <b>e⁻ᵐ</b> 降。",m:"<b>一致（consistent）</b>：<b>m → ∞ 时 θ̂ 收敛到 θ*</b>。",w:"⚠ <b>无偏（unbiased）</b>：<b>对任何 m，θ̂ 的期望都等于 θ*</b>。",e:"⭐ <b>关键区别</b>：<b>一致是极限行为</b>（样本无穷多才保证对）；<b>无偏是任何样本量下都居中</b>。⇒ <b>无偏更强</b>；算法可以是<b>一致但有偏</b>的。"});
  QUIZ(1035,5,{t:"「一致」和「无偏」的区别是什么？",o:["一致指训练稳定，无偏指测试准确","一致是极限行为（m→∞ 时 θ̂ 收敛到 θ*）；无偏是对任何 m，θ̂ 的期望都等于 θ*——无偏是更强的要求","两者是同一件事的不同说法","一致针对方差，无偏针对效率"],a:1,w:"⭐ 还有<b>统计效率</b>：方差随 m 下降的速率（有的按 <b>1/m²</b>，有的按 <b>e⁻ᵐ</b>）。⇒ 一个算法可以是<b>一致但有偏</b>的。"});
});
KP("6 · ⭐ 同样的参数个数，偏差方差可以完全不同",function(){
  S(954,function(){clearScene();setEq(null);setCap("一个破除误解的例子");
       says("15:54","if you had regularization, the variance would come down");
       boxNode(130,200,470,58,"⚠ 常见误解","r");
       boxNode(130,268,470,58,"参数多 = 方差大，参数少 = 偏差大","r");
       boxNode(690,200,470,58,"★ 反例","g");
       boxNode(690,268,470,58,"参数个数相同，但一个加了正则化","g");
       note("⭐ 加了正则化，方差会降下来 —— 参数个数一个没少",640,348,"y");
       note("⚠ 所以偏差方差是「算法」的性质，不只是「模型容量」的性质",640,398,"r");},"<b>讨论课在问答里破除了一个很常见的误解。</b><br><b>⚠ 误解是：参数越多方差越大、参数越少偏差越大，好像偏差方差完全由参数个数决定。</b><br><b>★ 反例很简单：两个算法参数个数完全相同，但其中一个加了正则化。</b><b>⭐ 讨论课直接说——如果你加了正则化，方差就会降下来。</b><b>而参数个数一个都没少。</b><br><b>⇒ 结论是：偏差和方差是「算法」的性质，而不只是「模型容量」的性质。</b><b>同样的模型结构，换一个训练方式，偏差方差就可能完全不同。</b><br><b>⭐ 这也解释了为什么正则化有用：它不改变模型能表达什么，只改变算法在数据上的敏感程度。</b>");
  S(954,function(){clearScene();setEq(null);setCap("正则化到底做了什么");
   bull(360,290,76);
   cloud(362,288,92,22,"y",31);
   note("不加正则化：散得开",360,398,"y");
   bull(920,290,76);
   cloud(930,292,38,22,"g",33);
   note("★ 加了正则化：挤得紧（但中心略偏了）",920,398,"g");
   note("⭐ 典型的交易：用一点偏差，换掉很多方差",640,172,"y");},"<b>把正则化的作用画在采样分布上，这笔交易就看得很清楚了。</b><br><b>不加正则化：那团 θ̂ 散得很开——方差大。</b><br><b>★ 加了正则化：那团点挤紧了很多——方差明显下降。</b><b>但同时，它的中心也略微偏离了真参数。</b><br><b>⭐ 这就是正则化典型的交易：用一点偏差，换掉很多方差。</b><br><b>⚠ 为什么这笔交易通常划算？因为总误差里偏差和方差都要算进去，而正则化换来的方差减少往往远大于它引入的偏差增加。</b><br><b>⇒ 但注意「通常」两个字——如果你的模型本来偏差就很大，再加正则化只会更糟。</b><b>⭐ 所以正则化不是万灵药，它是一个有方向的工具：专治方差。</b>");
  SUM(954,6,{h:"⭐ 偏差方差是「算法」的性质，不只是「容量」的",k:"⚠ <b>常见误解</b>：参数多 = 方差大、参数少 = 偏差大，好像<b>完全由参数个数决定</b>。",m:"★ <b>反例</b>：两个算法<b>参数个数完全相同</b>，但其中一个<b>加了正则化</b>。讨论课：<b>加了正则化方差就会降下来</b>。",w:"⇒ <b>偏差方差是「算法」的性质，不只是「模型容量」的性质</b>——同样的结构换个训练方式，两者可能完全不同。",e:"⭐ 这也解释了<b>正则化为什么有用</b>：它<b>不改变模型能表达什么</b>，只改变<b>算法对数据的敏感程度</b>。"});

});
KP("7 · ★★ 三个假设：g、h*、ĥ",function(){
  S(1637,function(){clearScene();setEq(null);setCap("先把它们分清楚，误差分解才讲得通");

       note("⚠ 注意 g 在圈外 —— 它可能根本不在你的假设类里",640,398,"r");},"<b>后半段要讲误差分解，而分解的前提是把三个不同的假设分清楚。</b><br><b>g：最好的可能假设。</b><b>⚠ 注意图上它画在圈外——讨论课明说了，最好的可能假设可能根本不在你的假设类里。</b><b>它只是某个在所有函数中最优的东西。</b><br><b>h*：你的假设类里最好的那个。</b><b>一旦你决定「我只用逻辑回归」，你就把自己限制在了那个圈里，h* 是圈里的冠军。</b><br><b>ĥ：你用有限数据实际学到的那个。</b><br><b>⭐ 讨论课的原话很清楚：g 不是最好的可能假设在类内，h* 是类 H 里最好的，而 ĥ 是你从有限数据里学到的。</b><br><b>⇒ 三者之间的两段落差，正好对应误差的两块，下一节讲。</b>");

       note("⭐ ①↔数据本身的噪声　②↔g 与 h* 的差距　③↔h* 与 ĥ 的差距",640,178,"y");},"<b>★★★ 有了三个假设，就能把泛化误差拆成三块了。</b><br><b>① 不可约误差：讨论课说得很直接——无论你挑什么假设、有多少训练数据，都没办法去掉它。</b><b>它来自数据本身的噪声。</b><br><b>② 近似误差：因为你做了一个决定——「我只用神经网络」或者「我只用逻辑回归」——从而把自己限定在了一个假设类里。</b><b>⭐ 它对应 g 和 h* 之间的差距。</b><br><b>③ 估计误差：因为你手上的数据有限，而且算法本身有一些脾气。</b><b>⭐ 它对应 h* 和 ĥ 之间的差距。</b><br><b>★ 而讨论课进一步指出：估计误差还能再拆成估计偏差和估计方差。</b><br><b>⇒ 于是整个误差有了一个完整的层次结构。下一节讲它和「偏差-方差」那套说法的关系。</b>");
  S(2057,function(){clearScene();setEq(null);setCap("三块各该怎么治");
   matrix({rows:4,cols:3,cw:350,ch:44,x:130,y:198,
     cell:function(i,j){var t=[
       ["哪一块","来自哪里","怎么治"],

     dim:function(i,j){return i===0;},
     hl:function(i,j){return i===3?"hl":"";}});
   note("⭐ 第一行最重要：承认有一部分误差你根本消不掉",640,398,"y");},"<b>三块误差各该怎么治？列出来就清楚了。</b><br><b>不可约误差：来自数据本身的噪声。</b><b>⚠ 治不了。</b><br><b>近似误差：来自假设类太窄。</b><b>治法是换一个更强的模型。</b><br><b>估计误差：来自数据有限和算法本身的脾气。</b><b>★ 治法是加数据，或者加正则化（降估计方差）。</b><br><b>⭐ 而第一行其实是最重要的，因为它最容易被忽略：有一部分误差你根本消不掉。</b><br><b>⚠ 承认这一点的实际价值很大——它让你知道什么时候该停手。</b><b>如果你的误差已经接近不可约误差的水平，那继续调模型、加数据都是在浪费时间。</b><br><b>⇒ 可惜的是，不可约误差通常你并不知道它有多大，只能估计。</b>");
  SUM(2057,8,{h:"★★★ 泛化误差 = 不可约 ＋ 近似 ＋ 估计",k:"<b>① 不可约误差</b>：讨论课原话——<b>无论挑什么假设、有多少数据都去不掉</b>，来自<b>数据本身的噪声</b>。",m:"<b>② 近似误差</b>：因为你<b>把自己限定在某个假设类里</b>（「我只用逻辑回归」）⇒ ⭐ 对应 <b>g 与 h* 的差距</b>。",w:"<b>③ 估计误差</b>：因为<b>数据有限、算法有脾气</b> ⇒ ⭐ 对应 <b>h* 与 ĥ 的差距</b>。",e:"★ 而<b>估计误差还能再拆成估计偏差 ＋ 估计方差</b>，于是整个误差有了完整的层次结构。"});
  QUIZ(2057,8,{t:"泛化误差的三分解是哪三块？",o:["一阶误差、二阶误差、高阶误差","训练误差、验证误差、测试误差","不可约误差（数据噪声）＋ 近似误差（限定在某假设类里，g 与 h* 的差距）＋ 估计误差（数据有限，h* 与 ĥ 的差距）","偏差、方差、噪声比"],a:2,w:"★ <b>估计误差还能再拆成估计偏差 ＋ 估计方差</b>。⭐ 三块分别对应<b>数据噪声</b>、<b>g↔h*</b>、<b>h*↔ĥ</b>。"});
});
KP("9 · ⚠ 两种分解讲的是同一块误差",function(){
  S(2131,function(){clearScene();setEq(null);setCap("别以为它们在说不同的事");
       says("35:31","sometimes you see the bias-variance decomposition and sometimes you see the estimation approximation error decomposition");
       matrix({rows:4,cols:3,cw:350,ch:44,x:130,y:198,
         cell:function(i,j){var t=[
           ["这一块","近似-估计的叫法","偏差-方差的叫法"],
           ["数据噪声","不可约误差","不可约"],
           ["假设类太窄","近似误差","★ 算进「偏差」"],
           ["对数据敏感","估计方差","★ 就是「方差」"]];return t[i][j];},
         dim:function(i,j){return i===0;},
         hl:function(i,j){return i>=2?"hl":"";}});
       note("⭐ 两种拆法是从两个角度切同一块误差，不是两件事",640,398,"y");},"<b>⚠ 讨论课在这里点出了一件很容易混的事：同一块误差有两种拆法。</b><br><b>有时候你看到的是「偏差-方差分解」，有时候看到的是「近似误差-估计误差分解」。</b><b>⭐ 它们不是在说不同的事，而是从两个角度切同一块误差。</b><br><b>对照着看就清楚了</b>：<b>数据噪声在两套说法里都叫不可约误差</b>；<b>「假设类太窄」这一块，在近似-估计的叫法里是近似误差，而在偏差-方差的叫法里被算进「偏差」</b>；<b>「对数据太敏感」这一块，在一边叫估计方差，在另一边就是「方差」。</b><br><b>⇒ 所以读不同教材时，看到不同的拆法不必以为它们矛盾。</b><br><b>⭐ 要点是先问「这本书把哪些东西归进了偏差」，而不是假定大家用词一致。</b>");
  S(2131,function(){clearScene();setEq(null);setCap("读论文时怎么不被绕晕");
   boxNode(170,196,980,56,"看到「偏差」时，先问：它把近似误差算进去了吗？","y");
   boxNode(170,264,980,56,"★ 看到「方差」时，基本都是指估计方差 —— 这个比较一致","g");
   note("⭐ 分歧主要出在「偏差」这个词上，而不是「方差」",640,340,"y");
   note("⚠ 最稳妥的办法：看它的式子，而不是看它的名字",640,398,"r");},"<b>实际读文献时怎么不被两套说法绕晕？给一个办法。</b><br><b>⭐ 先说一个好消息：分歧主要出在「偏差」这个词上，「方差」这个词在两套说法里基本一致，都是指估计方差。</b><br><b>所以看到「方差」时一般不用多想。</b><br><b>★ 而看到「偏差」时，先问一句：它把近似误差算进去了吗？</b><b>有的文献里「偏差」只指估计偏差，有的把「假设类太窄」造成的那部分也算进去。</b><br><b>⚠ 最稳妥的办法其实很朴素：看它的式子，而不是看它的名字。</b><b>名字可以各家不同，但式子是明确的。</b><br><b>⇒ 这其实是读任何理论材料时都适用的一条经验。</b>");
  SUM(2131,9,{h:"⚠ 两种分解，同一块误差",k:"讨论课：<b>有时你看到「偏差-方差分解」，有时看到「近似-估计误差分解」</b>——⭐ <b>它们是从两个角度切同一块误差</b>。",m:"<b>对照</b>：数据噪声在两套说法里都叫<b>不可约误差</b>；<b>「假设类太窄」</b>一边叫<b>近似误差</b>，另一边<b>算进「偏差」</b>。",w:"<b>「对数据太敏感」</b>一边叫<b>估计方差</b>，另一边就是<b>「方差」</b>。",e:"⇒ 读不同教材时<b>不必以为它们矛盾</b>。⭐ <b>先问「这本书把哪些东西归进了偏差」</b>，而不是假定用词一致。"});
  QUIZ(2131,9,{t:"「偏差-方差分解」和「近似-估计误差分解」是什么关系？",o:["两者互相矛盾，只能信一个","前者用于分类，后者用于回归","是从两个角度切同一块误差：「假设类太窄」在一边叫近似误差、在另一边算进偏差；「对数据敏感」一边叫估计方差、一边就是方差","前者是经验的，后者是理论的"],a:2,w:"⭐ 实用建议：读不同教材时<b>先问「这本书把哪些东西归进了偏差」</b>，不要假定大家用词一致。"});
});
KP("10 · ★★ 风险与经验风险：无限 vs 有限",function(){
  S(1672,function(){clearScene();setEq(null);setCap("两个长得像、意思差很远的量");
       says("27:52","epsilon of H is, you will call this the risk or generalization error");
       boxNode(130,200,470,58,"风险 ε(h)（泛化误差）","y");
       boxNode(130,268,470,58,"在整个数据分布上的期望损失","y");
       boxNode(690,200,470,58,"经验风险 ε̂_S(h)","b");
       boxNode(690,268,470,58,"在你手上那 m 个样本上出错的比例","b");
       note("⚠ 讨论课的原话：一个是无限的过程，另一个是给你的有限几个数",640,348,"r");
       note("⭐ 你能算的只有右边；你真正关心的是左边",640,398,"y");},"<b>后半段要讲的保证，全都建立在两个量的区分上。</b><br><b>风险 ε(h)，也叫泛化误差：在整个数据分布上的期望损失。</b><b>也就是「这个假设在所有可能遇到的样本上，平均会错多少」。</b><br><b>经验风险 ε̂_S(h)：在你手上那 m 个训练样本上，出错的比例。</b><br><b>⚠ 讨论课把差别说得很准：前者是一个无限的过程，而后者是「给你一个有限的数量，看你在多大比例的样本上出错」。</b><br><b>⭐ 要害在于：你能算的只有右边那个，而你真正关心的是左边那个。</b><br><b>⇒ 整个学习理论要回答的，就是「右边小能不能推出左边也小」。</b>");
  S(1672,function(){clearScene();setEq(null);setCap("为什么经验风险会「骗」你");
   boxNode(170,196,980,56,"经验风险是在你见过的样本上算的","b");
   boxNode(170,264,980,56,"⚠ 而学习算法正是用这些样本挑出来的那个 h","r");
   note("⭐ 所以经验风险天然偏乐观 —— 它在「自己出的卷子」上打分",640,340,"y");
   note("⚠ 这就是为什么训练误差总比测试误差好看",640,398,"r");},"<b>经验风险为什么不能直接当泛化误差用？根子在一个循环里。</b><br><b>经验风险是在你见过的那些样本上算的。</b><b>⚠ 而你的学习算法，正是用这同一批样本挑出来的那个 h。</b><br><b>⭐ 于是经验风险天然偏乐观——它相当于让学生在自己出的卷子上打分。</b><br><b>⇒ 这就是为什么训练误差总是比测试误差好看，而且假设类越大、这个「乐观」的幅度越大</b>（因为你能挑的范围越大，碰巧挑到一个在这批数据上表现特别好的可能性也越大）。<br><b>⭐ 而一致收敛要做的事，正是给这个「乐观幅度」一个上界：它告诉你训练误差最多乐观 γ 那么多。</b><br><b>⚠ 想通这一点，后面那个 union bound 为什么必须有，就很自然了。</b>");
  SUM(1672,10,{h:"★★ 风险 ε(h) vs 经验风险 ε̂_S(h)",k:"<b>风险 ε(h)（泛化误差）</b>：在<b>整个数据分布</b>上的期望损失——「在所有可能遇到的样本上平均错多少」。",m:"<b>经验风险 ε̂_S(h)</b>：在你手上那 <b>m 个训练样本</b>上出错的比例。",w:"⚠ 讨论课的原话：<b>前者是一个无限的过程</b>，后者是「给你一个有限的数量，看你在多大比例的样本上出错」。",e:"⭐ <b>要害</b>：<b>你能算的只有经验风险，你真正关心的是风险</b> ⇒ 整个学习理论要回答的就是<b>「前者小能否推出后者也小」</b>。"});
  QUIZ(1672,10,{t:"风险（泛化误差）和经验风险的区别是什么？",o:["前者是训练误差，后者是测试误差","风险是整个数据分布上的期望损失（无限的过程）；经验风险是手上那 m 个样本上的出错比例（有限的数）","前者针对分类，后者针对回归","前者用平方损失，后者用 0-1 损失"],a:1,w:"⭐ 要害：<b>你能算的只有经验风险，真正关心的是风险</b>。整个学习理论就是要回答「<b>训练误差小能否推出泛化误差也小</b>」。"});
});
KP("11 · ★★ 经验风险最小化 ERM",function(){
  S(2722,function(){clearScene();setEq("$$\\hat{h}_{\\text{ERM}} \\;=\\; \\arg\\min_{h \\in \\mathcal{H}} \\; \\hat{\\varepsilon}_S(h)$$","top");
       setCap("在假设类里挑训练误差最小的那个");
       says("45:22","this is the Empirical Risk Minimizer",214);
       note("① 它是一个「学习算法」，不是一个假设",640,274,"b");
       note("② 做的事：在假设类 H 里，挑训练误差最小的那个 h",640,326,"b");
       note("⭐ 为什么要限定成这一类？因为只有限定了算法，才能推出更强的结论",640,378,"y");},"<b>接下来讨论课做了一件关键的事：把注意力限定到一类特定的学习算法上。</b><br><b>这一类叫经验风险最小化，简称 ERM。</b><b>① 要注意它是一个学习算法，不是一个假设。</b><br><b>② 它做的事只有一句话：在你的假设类 H 里，挑出训练误差最小的那个 h。</b><br><b>⭐ 为什么要做这个限定？讨论课说得很明白：如果我们把自己限制在经验风险最小化这一类算法上，就能推出更多的理论结果。</b><br><b>⚠ 这是理论研究里很常见的一步——先缩小研究对象，换取更强的结论。</b><b>⇒ 代价是这些结论只对 ERM 这一类算法成立。</b><br><b>⭐ 好消息是：很多常见算法在精神上都是 ERM（最小化训练损失），所以结论的适用面并不窄。</b>");
  S(2722,function(){clearScene();setEq(null);setCap("ERM 不等于「实际在做的事」");
   boxNode(130,196,470,58,"理论上的 ERM","b");
   boxNode(130,264,470,58,"在整个 H 里精确地找到最小值","b");
   boxNode(690,196,470,58,"⚠ 实践中","r");
   boxNode(690,264,470,58,"梯度下降，可能卡在局部最优、可能早停","r");
   note("⭐ 所以理论结论和你的代码之间，还隔着一层",640,340,"y");
   note("⚠ 这不是说理论没用 —— 而是说引用时要知道这一层在哪",640,398,"r");},"<b>这里要补一个分寸：理论上的 ERM 和你代码里实际在做的事，不完全是一回事。</b><br><b>理论上的 ERM 说的是：在整个假设类 H 里，精确地找到经验风险最小的那个 h。</b><br><b>⚠ 而实践中你做的是梯度下降——它可能卡在局部最优，可能因为早停而没走到底，可能因为学习率不对而没收敛。</b><br><b>⭐ 所以理论结论和你的代码之间，还隔着一层。</b><br><b>⚠ 说这个不是为了否定理论的价值，而是为了让你知道这一层在哪。</b><b>当你引用「样本复杂度随 log K 增长」这种结论时，前提之一就是你真的在做 ERM。</b><br><b>⇒ 顺带一提，有意思的是：梯度下降的这些「缺陷」有时反而有益——早停在实践中常常起到正则化的作用，降低了方差。</b>");
  SUM(2722,11,{h:"★★ ERM：在假设类里挑训练误差最小的",k:"① <b>ERM 是一个学习算法，不是一个假设</b>。② 它做的事：<b>在假设类 H 里挑出训练误差最小的那个 h</b>。",m:"⭐ <b>为什么要限定</b>：讨论课说<b>如果我们把自己限制在 ERM 这一类算法上，就能推出更多的理论结果</b>。",w:"⚠ <b>这是理论研究常见的一步</b>：<b>先缩小研究对象，换取更强的结论</b>。代价是结论只对 ERM 这类算法成立。",e:"⭐ <b>好消息</b>：很多常见算法<b>在精神上都是 ERM</b>（最小化训练损失），所以适用面并不窄。"});
  QUIZ(2722,11,{t:"什么是经验风险最小化（ERM）？为什么要限定到这一类？",o:["一个学习算法：在假设类 H 里挑训练误差最小的 h；限定它是因为只有限定了算法才能推出更强的理论结果","一种正则化方法；为了防止过拟合","一个假设；为了简化记号","一种交叉验证策略；为了选超参数"],a:0,w:"⚠ 「<b>先缩小研究对象、换取更强结论</b>」是理论研究常见的一步。⭐ 好消息是<b>很多常见算法在精神上都是 ERM</b>。"});
});
KP("12 · ★★ 工具：Hoeffding 不等式",function(){
  S(3197,function(){clearScene();setEq(null);setCap("用有限样本估一个概率，能偏多少");
       says("53:17","the Hoeffding Inequality basically says, the probability that the absolute difference");
       axes({x0:290,x1:1000,y0:370,y1:200});
       curve(fn(function(x){var n=(x-310)/670;return 366-152*(1-Math.exp(-3.4*n));},310,980,80),"r");
       note("横轴：样本量 m",640,398,"d");
       note("纵轴：「估计偏离真值超过 γ」的概率",330,186,"d");
       note("⭐ 这个概率随 m 指数级地往下掉",760,250,"y");},"<b>要把「训练误差小」变成「泛化误差也小」，需要一个工具，就是 Hoeffding 不等式。</b><br><b>它说的事很具体：你用 m 个样本去估计一个概率参数，得到估计值 φ̂；那么「φ̂ 偏离真值 φ 超过某个 γ」这件事发生的概率，有一个上界。</b><br><b>⭐ 而这个上界随 m 指数级地变小</b>——<b>图上那条曲线就是它的形状：样本越多，估计严重偏离的可能性掉得越快。</b><br><b>⚠ 讨论课提到了它的适用条件：这里用的是比较受限的一个版本，针对伯努利变量</b>（也就是只取 0 或 1 的随机变量）。<b>而「出不出错」恰好就是一个 0/1 的事件，所以用得上。</b><br><b>⇒ 下一节把它用到学习问题上。</b>");
  S(3197,function(){clearScene();setEq(null);setCap("用一个熟悉的例子理解它");
   boxNode(170,196,980,56,"抛一枚偏心硬币 m 次，用正面比例去估真实概率 φ","b");
   boxNode(170,264,980,56,"★ Hoeffding：估计偏离真值超过 γ 的概率，随 m 指数级下降","g");
   note("⭐ 而「某个假设在一个样本上出不出错」，恰好就是一次抛硬币",640,340,"y");
   note("⚠ 于是训练集上的错误率 = m 次抛硬币的正面比例",640,398,"g");},"<b>Hoeffding 不等式用抛硬币来理解最直接。</b><br><b>你有一枚偏心硬币，正面概率是 φ，但你不知道。</b><b>你抛 m 次，用正面出现的比例去估计 φ。</b><br><b>★ Hoeffding 说：你的估计偏离真值超过 γ 的概率，随 m 指数级地下降。</b><br><b>⭐ 而把它搬到学习问题上，对应关系非常干净：「某个固定的假设 h 在一个随机样本上出不出错」，恰好就是一次抛硬币。</b><b>出错是正面，不出错是反面，而出错的真实概率就是这个 h 的泛化误差。</b><br><b>⚠ 于是「训练集上的错误率」就是 m 次抛硬币里正面的比例，也就是经验风险。</b><br><b>⇒ 对应关系一建立，Hoeffding 就直接给出了「经验风险接近泛化误差」的保证。</b>");
  SUM(3197,12,{h:"★★ Hoeffding：估计偏离真值的概率随 m 指数下降",k:"<b>它说什么</b>：用 m 个样本估一个概率参数得到 φ̂，<b>「φ̂ 偏离真值超过 γ」的概率有一个上界</b>。",m:"⭐ <b>而这个上界随 m 指数级变小</b>——样本越多，<b>估计严重偏离的可能性掉得越快</b>。",w:"⚠ <b>适用条件</b>：这里用的是比较受限的版本，<b>针对伯努利变量</b>（只取 0 或 1）。",e:"⭐ <b>而「出不出错」恰好就是一个 0/1 事件</b>，所以用得上。"});
  QUIZ(3197,12,{t:"Hoeffding 不等式说的是什么？",o:["方差随 m 线性下降","训练误差一定小于测试误差","假设类越大误差越小","用 m 个样本估一个概率时，估计值偏离真值超过 γ 的概率有上界，且这个上界随 m 指数级变小"],a:3,w:"⚠ 适用条件是<b>伯努利变量</b>（只取 0/1）。⭐ 而<b>「出不出错」恰好就是 0/1 事件</b>，所以用得上。"});
});
KP("13 · ★★★ 一致收敛：要对所有 h 同时成立",function(){
  S(4172,function(){clearScene();setEq(null);setCap("只保证一个 h 为什么不够");
       says("69:32","and this is basically called uniform convergence");
       boxNode(130,196,470,58,"Hoeffding 给的","b");
       boxNode(130,264,470,58,"某一个固定的 h，经验风险接近真实风险","b");
       boxNode(690,196,470,58,"★ 我们需要的","y");
       boxNode(690,264,470,58,"假设类里所有的 h 同时都满足","y");
       note("⚠ 因为 ERM 会去「挑」那个训练集上看起来最好的 —— 挑本身带来风险",640,348,"r");
       note("⭐ 所有 h 同时成立，这就叫一致收敛",640,398,"y");},"<b>★★★ 这是整个论证里最关键、也最容易被跳过的一步。</b><br><b>Hoeffding 给你的是：对某一个固定的假设 h，它的经验风险接近真实风险。</b><br><b>⚠ 但这还不够。为什么？因为 ERM 不是随便拿一个 h，它会从整个假设类里挑出那个在训练集上看起来最好的。</b><br><b>而「挑」这个动作本身就带来风险：假设类里假设很多，总有那么几个碰巧在你这批训练数据上表现特别好——但那只是运气，不代表它真的好。</b><br><b>★ 所以我们需要的是更强的东西：假设类里所有的 h 同时都满足那个保证。</b><br><b>⭐ 这就叫一致收敛。</b>讨论课说<b>之所以叫「一致」，是因为我们在看风险曲线如何一致地收敛到泛化风险</b>。<br><b>⇒ 下一节讲怎么从「一个」推到「所有」。</b>");
  S(4172,function(){clearScene();setEq(null);setCap("用一个日常例子体会「挑」的风险");
   boxNode(170,196,980,56,"让 1000 个人各抛 10 次硬币，总有人抛出 9 次正面","b");
   boxNode(170,264,980,56,"⚠ 你若「挑出」那个人，会以为他的硬币有问题","r");
   note("⭐ 可他只是运气好 —— 人越多，出现这种巧合的机会越大",640,340,"y");
   note("⚠ ERM 做的正是「挑」—— 所以必须对所有候选同时给保证",640,398,"r");},"<b>「挑」这个动作为什么带来风险？用一个日常例子就能体会。</b><br><b>让 1000 个人各抛 10 次普通硬币。总会有那么几个人抛出 9 次正面。</b><br><b>⚠ 如果你事后「挑出」那个人，看着他的记录，你会以为他的硬币有问题。</b><br><b>⭐ 可他只是运气好。而且人越多，出现这种巧合的机会就越大。</b><br><b>⇒ ERM 做的正是这件事：它从假设类里挑出那个在训练集上表现最好的。</b><b>假设类越大（人越多），挑到一个「碰巧表现好」的假设的可能性就越大。</b><br><b>⭐ 所以保证必须对所有候选同时成立——这样才排除了「挑中了一个运气好的」这种可能。</b><b>⚠ 这就是一致收敛存在的理由，也是 union bound 里那个 K 的来历。</b>");
  SUM(4172,13,{h:"★★★ 一致收敛：所有 h 同时满足保证",k:"<b>Hoeffding 给的</b>：对<b>某一个固定的 h</b>，经验风险接近真实风险。",m:"⚠ <b>为什么不够</b>：<b>ERM 会从整个假设类里「挑」那个训练集上看起来最好的</b>，而<b>「挑」本身带来风险</b>——总有几个假设碰巧在这批数据上表现好，<b>那只是运气</b>。",w:"★ <b>需要的是</b>：<b>假设类里所有的 h 同时都满足那个保证</b>。",e:"⭐ <b>这就叫一致收敛</b>——讨论课说叫「一致」是因为<b>在看风险曲线如何一致地收敛到泛化风险</b>。"});
  QUIZ(4172,13,{t:"为什么只对单个 h 用 Hoeffding 不够，必须要一致收敛？",o:["因为 Hoeffding 只对连续变量成立","因为假设类可能是无限的","因为 ERM 会从整个假设类里挑训练集上看起来最好的，而总有几个假设是碰巧表现好的——「挑」这个动作本身带来风险","因为样本量不够大"],a:2,w:"★ 所以需要<b>所有 h 同时满足保证</b>，这就是<b>一致收敛</b>。⭐ 名字来自<b>「风险曲线如何一致地收敛到泛化风险」</b>。"});
});
KP("14 · ★ 从「一个」到「所有」：union bound",function(){
  S(4318,function(){clearScene();setEq(null);setCap("代价是乘上一个 K");
       says("71:58","we apply the union bound for all K hypotheses, and we end up just multiplying that by a factor of K");
       boxNode(170,196,980,56,"union bound：若干件事里「至少有一件发生」的概率 ≤ 各自概率之和","b");
       boxNode(170,264,980,56,"★ 用在这里：K 个假设各自「失手」的概率加起来 ⇒ 乘以 K","y");
       note("⭐ 所以整个推导就是「Hoeffding ＋ union bound」两步",640,340,"y");
       note("⚠ 代价很温和：概率界只是乘上 K，而 Hoeffding 给的是指数级的小",640,398,"g");},"<b>怎么从「某一个 h 成立」推到「所有 h 同时成立」？用 union bound。</b><br><b>union bound 本身很简单：若干件事里「至少有一件发生」的概率，不会超过它们各自概率之和。</b><br><b>★ 用在这里：假设类里有 K 个假设，每一个都有一个很小的「失手」概率（由 Hoeffding 给出）；那么「至少有一个失手」的概率，不会超过 K 倍的那个小概率。</b><b>⭐ 讨论课的说法就是：对 K 个假设套 union bound，最后就是乘上一个 K。</b><br><b>⭐ 所以整个推导只有两步：Hoeffding 加上 union bound。</b>讨论课自己也这么总结。<br><b>⚠ 这个代价其实很温和：概率界只是乘上 K，而 Hoeffding 给的是随 m 指数级下降的量。</b><b>⇒ 指数级的小，乘上 K 还是很小——这正是下一节那个「对数」结论的来源。</b>");
  S(4318,function(){clearScene();setEq(null);setCap("它为什么是「最保守」的估计");
   boxNode(130,196,470,58,"union bound 假定","b");
   boxNode(130,264,470,58,"各个「失手」事件互不重叠（最坏情况）","b");
   boxNode(690,196,470,58,"★ 实际上","g");
   boxNode(690,264,470,58,"假设之间往往高度相关，失手常常一起发生","g");
   note("⭐ 所以这个界是宽松的 —— 真实情况通常比它说的好",640,340,"y");
   note("⚠ 宽松但可靠：它给的是上界，不会低估风险",640,398,"g");},"<b>union bound 有一个性质值得知道：它是相当保守的。</b><br><b>它成立靠的是一个最坏情况的假定：各个「失手」事件互不重叠，所以概率可以直接相加。</b><br><b>★ 而实际上，假设类里的假设往往高度相关——相邻的两个逻辑回归模型几乎一样，它们要么一起失手，要么一起不失手。</b><br><b>⭐ 所以真实的「至少一个失手」的概率，通常远小于 K 倍。</b><b>这个界是宽松的。</b><br><b>⚠ 但宽松不等于没用：它给的是一个上界，意味着它不会低估风险。</b><b>你按它去估样本量，只会估多不会估少。</b><br><b>⇒ 而且正因为最终结论里 K 只以对数形式出现，这份保守的代价其实很小。</b>");
  SUM(4318,14,{h:"★ union bound：代价只是乘一个 K",k:"<b>union bound</b>：若干件事里「<b>至少有一件发生</b>」的概率 ≤ <b>各自概率之和</b>。",m:"★ <b>用在这里</b>：K 个假设各有一个很小的「失手」概率（Hoeffding 给的）⇒ <b>「至少一个失手」的概率不超过 K 倍</b>。",w:"⭐ <b>整个推导只有两步</b>：<b>Hoeffding ＋ union bound</b>。",e:"⚠ <b>代价很温和</b>：概率界只是<b>乘上 K</b>，而 Hoeffding 给的是<b>随 m 指数级下降</b>的量 ⇒ <b>这正是下一节那个「对数」结论的来源</b>。"});
  QUIZ(4318,14,{t:"怎么从「单个 h 的保证」推到「所有 h 同时成立」？",o:["只考虑最差的那个 h","用 union bound：K 个假设各自失手的概率加起来，所以概率界乘上一个 K——整个推导就是 Hoeffding ＋ union bound 两步","对所有 h 取平均","假设所有 h 互相独立"],a:1,w:"⚠ 代价很温和：<b>只是乘上 K</b>，而 Hoeffding 给的是<b>随 m 指数级下降</b>的量 ⇒ 这是「<b>样本数随假设类大小的对数增长</b>」的来源。"});
});
KP("15 · ★★ 样本复杂度：对数，不是线性",function(){
  S(4630,function(){clearScene();setEq(null);setCap("要多少数据才够");
       says("77:10","this is also called the sample complexity");
       axes({x0:290,x1:1000,y0:370,y1:200});
       curve(fn(function(x){var n=(x-310)/670;return 366-150*Math.log(1+9*n)/Math.log(10);},310,980,80),"g");
       note("横轴：假设类的大小 K",640,398,"d");
       note("纵轴：需要的样本数 m",320,186,"d");
       note("⭐ 需要的样本数随 K 的对数增长 —— 不是线性",700,250,"y");
       note("⚠ 所以假设类大一点并不可怕",640,330,"g");},"<b>把前面那个概率界反过来读，就得到样本复杂度：要达到某个精度和置信度，你需要多少个样本。</b>讨论课管它叫 sample complexity。<br><b>⭐ 结论的形状非常值得记：需要的样本数，随假设类大小的对数增长。</b><br><b>为什么是对数？因为 union bound 带来的是「乘以 K」，而 Hoeffding 给的是指数级下降的 e 的负某某次方——把这两个放在一起解出 m，K 就被 log 吃掉了。</b><br><b>⚠ 这个结论的实际意义很大：假设类大一点并不可怕。</b><b>K 翻一百倍，需要的样本数只增加一个常数倍（log 100 ≈ 4.6）。</b><br><b>⇒ 对比一下：如果是线性增长，K 翻一百倍就要一百倍的数据，那实践中就没法用了。</b><br><b>⭐ 所以「对数」这两个字是整个结论里最值钱的部分。</b>");
  S(4630,function(){clearScene();setEq(null);setCap("算一个具体的数感受一下");
   matrix({rows:4,cols:3,cw:350,ch:44,x:130,y:198,
     cell:function(i,j){var t=[
       ["假设类大小 K","log K（相对值）","需要的样本量"],
       ["1 000","1×","m"],
       ["1 000 000","2×","2m"],
       ["★ 10 的 12 次方","4×","4m"]];return t[i][j];},
     dim:function(i,j){return i===0;},
     hl:function(i,j){return i===3?"hl":"";}});
   note("⭐ K 从一千涨到一万亿，需要的样本量只翻两番",640,398,"y");},"<b>「对数增长」有多温和？代入几个数就有感觉了。</b><br><b>假设类有一千个假设时，你需要 m 个样本。</b><br><b>涨到一百万个（翻了一千倍），你只需要 2m。</b><br><b>★ 再涨到一万亿个（又翻了一百万倍），也只需要 4m。</b><br><b>⭐ K 从一千涨到一万亿，需要的样本量只翻两番。</b><br><b>⚠ 这个结论的分量在于它解释了一件看起来很反直觉的事：为什么参数那么多的模型居然能泛化。</b><b>因为「能表达多少种假设」和「需要多少数据」之间隔着一个对数。</b><br><b>⇒ 当然要加一句分寸：这个结论的前提是假设类有限且算法是 ERM。</b><b>现代深度网络的假设类是无限的，不能直接套用这个结论——那需要 VC 维或者更现代的工具。</b>");
  SUM(4630,15,{h:"★★ 样本复杂度随假设类大小的对数增长",k:"<b>样本复杂度</b>：要达到某个精度和置信度，<b>需要多少个样本</b>。",m:"⭐ <b>结论的形状</b>：<b>需要的样本数随假设类大小 K 的对数增长</b>——不是线性。",w:"<b>为什么是对数</b>：union bound 带来「<b>乘以 K</b>」，Hoeffding 给的是「<b>e 的负某某次方</b>」⇒ 两者放一起解出 m，<b>K 被 log 吃掉</b>。",e:"⚠ <b>实际意义</b>：<b>假设类大一点并不可怕</b>——K 翻一百倍，样本数只增加约 4.6 倍。<b>若是线性增长，实践中就没法用了。</b>"});
  QUIZ(4630,15,{t:"样本复杂度随假设类大小怎么增长？为什么这很重要？",o:["不增长；与假设类大小无关","线性增长；所以假设类必须很小","平方增长；所以要降维","对数增长；K 翻一百倍样本数只增加约 4.6 倍，所以假设类大一点并不可怕——若是线性增长实践中就没法用"],a:3,w:"<b>为什么是对数</b>：union bound 带来「乘以 K」，Hoeffding 给的是「e 的负某某次方」⇒ 解出 m 时 <b>K 被 log 吃掉</b>。"});
});
KP("16 · ⚠ VC 维：提了，但这节课没讲",function(){
  S(5027,function(){clearScene();setEq(null);setCap("诚实地标出边界");
       says("83:47","there is a concept called VC dimension, which is a pretty simple concept but we will not be going over it today");
       boxNode(130,200,470,58,"前面的结论","b");
       boxNode(130,268,470,58,"要求假设类是有限的（K 个）","b");

       boxNode(690,268,470,58,"比如所有的线性分类器","r");
       note("⭐ VC 维就是给「无限大的假设类」也定出一个「尺寸」",640,348,"y");
       note("⚠ 讨论课明说「今天不讲这个」—— 所以这里也不假装讲过",640,398,"r");},"<b>最后一块，讨论课提到了但明确说不讲，这里也如实标出来。</b><br><b>问题是这样的：前面所有结论都要求假设类是有限的——有 K 个假设，才能对 K 个套 union bound。</b><br><b>⚠ 可现实中很多假设类是无限的。</b><b>比如「所有的线性分类器」，参数是连续取值的，假设有无穷多个，K 根本写不出来。</b><br><b>⭐ VC 维就是为了解决这个问题：它给无限大的假设类也定出一个「尺寸」，衡量这个类的表达能力有多强。</b><b>讨论课说它是一个相当简单的概念，而且有很漂亮的几何意义。</b><br><b>⚠ 但他明确说了「今天我们不讲这个」。</b><b>⇒ 所以这里也不假装讲过——要学 VC 维，得去看正课的学习理论那一讲或者讲义。</b>");
  S(5027,function(){clearScene();setEq(null);setCap("它大概是个什么东西");
   boxNode(170,196,980,56,"有限假设类：用「个数 K」衡量复杂度","b");
   boxNode(170,264,980,56,"★ 无限假设类：用「VC 维 d」衡量，结论里 log K 换成 d","y");
   note("⭐ 讨论课说它概念相当简单，而且有很漂亮的几何意义",640,340,"y");
   note("⚠ 但他明说今天不讲 —— 要学得去看正课那一讲或讲义",640,398,"r");},"<b>虽然讨论课没讲，但说一句 VC 维大概是什么，有助于你知道去哪儿接着学。</b><br><b>有限假设类用「个数 K」来衡量复杂度，结论里出现的是 log K。</b><br><b>★ 无限假设类用「VC 维 d」来衡量，而结论的形状几乎不变——原来 log K 的位置换成 d。</b><br><b>⭐ 讨论课说它是一个相当简单的概念，而且在使用时有很漂亮的几何意义。</b><br><b>⚠ 但他明确说了今天不讲，所以这里也不展开。</b><br><b>⇒ 要学的话，去看正课的学习理论那一讲，或者 CS229 的讲义。</b><b>⭐ 知道「它是用来替代 log K 的」这一点，你再去读那部分时会轻松很多——因为你已经知道它在整个论证里占的是哪个位置。</b>");
  SUM(5027,16,{h:"⚠ VC 维：讨论课提了但没讲",k:"<b>问题</b>：前面所有结论都<b>要求假设类是有限的</b>（有 K 个才能套 union bound）。",m:"⚠ <b>可很多假设类是无限的</b>：比如<b>所有的线性分类器</b>，参数连续取值，<b>K 根本写不出来</b>。",w:"⭐ <b>VC 维</b>就是给<b>无限大的假设类也定出一个「尺寸」</b>，衡量这个类的<b>表达能力有多强</b>。讨论课说它<b>概念相当简单、有很漂亮的几何意义</b>。",e:"⚠ <b>但他明确说「今天不讲这个」</b> ⇒ 这里也不假装讲过，要学得去看<b>正课的学习理论那一讲或讲义</b>。"});
  QUIZ(5027,16,{t:"为什么需要 VC 维？这节讨论课讲了它吗？",o:["因为前面的结论都要求假设类有限，而像「所有线性分类器」这样的类是无限的；VC 维给无限类定出尺寸——但讨论课明说今天不讲","因为 Hoeffding 不成立；没提到","因为要处理噪声；讲了完整推导","因为要加正则化；讲了一半"],a:0,w:"⭐ VC 维衡量<b>假设类的表达能力有多强</b>，讨论课说它<b>概念简单、有漂亮的几何意义</b>。⚠ 但要学得去看<b>正课的学习理论那一讲或讲义</b>。"});
});
KP("17 · ★ 先框定问题：数据生成过程",function(){
  S(160,function(){clearScene();setEq(null);setCap("训练集和测试样本来自同一个源头");
       says("2:40","we have a few samples from the data generating process that becomes our training set");
       boxNode(480,186,320,56,"数据生成过程","y");
       boxNode(130,300,420,56,"训练集：有限的几个样本","b");
       boxNode(710,300,420,56,"测试时遇到的样本","g");
       link(560,242,340,300); link(720,242,920,300);
       note("⭐ 关键：你可以从这个过程取无穷多样本，但你手上只有有限几个",640,382,"y");
       note("⚠ 而测试样本来自同一个过程 —— 这是一切保证的前提",640,404,"r");},"<b>讨论课一开始先框定学习问题，这个框架后面一直在用。</b><br><b>设想背后有一个「数据生成过程」。</b><b>⭐ 你原则上可以从它那里取无穷多个样本——但实际上你手上只有有限的几个，这几个构成你的训练集。</b><br><b>⚠ 而最关键的一句是：你在测试时会遇到的样本，也来自同一个过程。</b><br><b>⇒ 这就是后面所有理论保证成立的前提。</b><b>如果测试样本来自另一个分布，那么「训练误差小能推出泛化误差小」这件事根本不成立——因为你在一个分布上学，在另一个分布上考。</b><br><b>⭐ 把这一点记住，你就知道学习理论那些漂亮结论的边界在哪了：它们全都假设训练和测试同分布。</b><b>现实中这个假设常常不成立，而那时所有保证都失效。</b>");
  S(160,function(){clearScene();setEq(null);setCap("「同分布」这个假设有多强");
   matrix({rows:4,cols:2,cw:430,ch:44,x:210,y:198,
     cell:function(i,j){var t=[
       ["场景","同分布假设成立吗"],
       ["随机划分训练/测试集","✓ 成立"],
       ["用去年数据训练、今年部署","⚠ 往往不成立"],
       ["★ 模型上线后影响了用户行为","⚠⚠ 被自己破坏了"]];return t[i][j];},
     dim:function(i,j){return i===0;},
     hl:function(i,j){return i===3?"hl":"";}});
   note("⭐ 第三行最隐蔽：模型自己改变了它要预测的那个分布",640,398,"y");},"<b>「训练与测试同分布」听起来像个技术细节，但它在现实中破得很厉害。</b><br><b>随机划分训练集和测试集：✓ 成立，这是教科书式的理想情形。</b><br><b>⚠ 用去年的数据训练、今年部署：往往不成立，因为世界变了。</b><br><b>★ 而最隐蔽的是第三种：模型上线之后影响了用户的行为。</b><b>⭐ 比如推荐系统推什么，用户就看什么，于是新收集的数据分布和当初训练时完全不同——模型自己破坏了它赖以成立的假设。</b><br><b>⚠ 这种情况下，你离线评估得再好，上线效果也可能完全不同。</b><b>⇒ 而这不是算法没调好，是前提不成立。</b><br><b>⭐ 所以学完这节课，最该带走的可能不是那些不等式，而是「先检查前提」这个习惯。</b>");
  SUM(160,17,{h:"★ 数据生成过程：训练与测试同源",k:"<b>框架</b>：背后有一个<b>数据生成过程</b>。⭐ 你原则上可取<b>无穷多样本</b>，但手上<b>只有有限几个</b>，构成训练集。",m:"⚠ <b>最关键的一句</b>：<b>测试时遇到的样本也来自同一个过程</b>。",w:"⇒ <b>这是后面所有理论保证的前提</b>。若测试来自另一个分布，「训练误差小推出泛化误差小」<b>根本不成立</b>——在一个分布上学，在另一个分布上考。",e:"⭐ <b>这就是那些漂亮结论的边界</b>：它们<b>全都假设训练与测试同分布</b>，而现实中这个假设常常不成立。"});
  QUIZ(160,17,{t:"学习理论的所有保证建立在什么前提上？",o:["训练样本和测试样本来自同一个数据生成过程——若测试来自另一个分布，所有保证都失效","模型是线性的","训练集足够大","数据没有噪声"],a:0,w:"⭐ 这就是那些漂亮结论的<b>边界</b>：它们全都假设<b>训练与测试同分布</b>，而现实中这个假设常常不成立。"});
});
KP("18 · ★ 假设类长什么样：逻辑回归的例子",function(){
  S(2580,function(){clearScene();setEq(null);setCap("一个具体的假设类");
       says("43:00","the set of all logistic regression models");
       boxNode(170,196,980,56,"假设类 H = 「所有的逻辑回归模型」","y");
       boxNode(170,264,980,56,"★ 你一决定用逻辑回归，就已经把自己限制在这个集合里了","g");
       note("⭐ 讨论课的说法：做梯度下降时，你是在「隐式地」限制自己",640,340,"y");
       note("⚠ 所以「选模型」这个动作，本身就决定了近似误差有多大",640,398,"r");},"<b>「假设类」听起来抽象，讨论课给了一个很具体的例子：所有的逻辑回归模型，这就是一个假设类。</b><br><b>★ 一旦你决定「我要用逻辑回归」，你就已经把自己限制在这个集合里了。</b><br><b>⭐ 讨论课的说法很有意思：当你对逻辑回归做梯度下降时，你是在隐式地把自己限制在这一类可能的逻辑回归模型之中。</b><b>你可能没有意识到自己做了这个限制，但限制确实发生了。</b><br><b>⚠ 而这个限制直接决定了近似误差有多大</b>——<b>如果真实规律根本不是逻辑回归能表达的形状，那么无论你怎么优化、有多少数据，都跨不过那道坎。</b><br><b>⇒ 所以「选模型」这个看起来很随意的动作，其实是在设定你能达到的上限。</b>");
  S(2580,function(){clearScene();setEq(null);setCap("假设类的「大小」怎么理解");
   matrix({rows:4,cols:2,cw:430,ch:44,x:210,y:198,
     cell:function(i,j){var t=[
       ["假设类","大小"],
       ["只有 3 条候选规则","K = 3，很小"],
       ["所有的逻辑回归模型","⚠ 无限大（参数连续取值）"],
       ["★ 后面的 K 个假设怎么来","理论里先假定有限，再用 VC 维推广"]];return t[i][j];},
     dim:function(i,j){return i===0;},
     hl:function(i,j){return i===3?"hl":"";}});
   note("⭐ 所以后面那个「K 个假设」是理论推导的简化起点",640,398,"y");},"<b>这里要先打个预防针，免得后面看到「K 个假设」时困惑。</b><br><b>如果假设类只有三条候选规则，那 K = 3，很好理解。</b><br><b>⚠ 但「所有的逻辑回归模型」这个类是无限大的——参数是连续取值的，假设有无穷多个。</b><br><b>★ 那后面理论里那个「K 个假设」是怎么回事？</b><b>⭐ 那是理论推导的一个简化起点：先假定假设类是有限的，把论证走通；然后再用 VC 维把结论推广到无限的情形。</b><br><b>⇒ 讨论课讲的就是前一半，而 VC 维那一半它明说了不讲。</b><br><b>⚠ 所以读到「有限假设类」时不要觉得不现实——它是一块踏脚石，不是最终结论。</b>");
  SUM(2580,18,{h:"★ 假设类的例子：所有的逻辑回归模型",k:"<b>一个具体例子</b>：<b>「所有的逻辑回归模型」就是一个假设类</b>。★ 一旦决定用逻辑回归，<b>就已经把自己限制在这个集合里</b>。",m:"⭐ 讨论课：做梯度下降时，你是在<b>「隐式地」把自己限制在这一类模型之中</b>——你可能没意识到，但限制确实发生了。",w:"⚠ <b>这个限制直接决定了近似误差有多大</b>：真实规律若不是逻辑回归能表达的形状，<b>再怎么优化、再多数据都跨不过去</b>。",e:"⇒ <b>「选模型」这个看起来随意的动作，其实是在设定你能达到的上限。</b>"});
  QUIZ(2580,18,{t:"「假设类」是什么？选模型这个动作有什么后果？",o:["假设类是损失函数族；选模型不影响误差","假设类是超参数空间；选模型只影响方差","假设类是训练集；选模型只影响速度","假设类就是你允许的所有模型的集合（如「所有逻辑回归模型」）；一选定就隐式地限制了自己，并直接决定了近似误差的下限"],a:3,w:"⭐ 讨论课说做梯度下降时你是在<b>「隐式地」限制自己</b>——可能没意识到，但限制确实发生了。"});
});

KP("20 · ★ 一致收敛的几何图景",function(){
  S(4804,function(){clearScene();setEq(null);setCap("两条曲线之间的缝隙");
       says("80:04","the gap between the dotted line and the thick black line is always less than Gamma");
       axes({x0:300,x1:980,y0:370,y1:200});
       curve(fn(function(x){var n=(x-320)/640;return 300-70*Math.sin(n*5.6)-40*n;},320,960,80),"b");
       curve(fn(function(x){var n=(x-320)/640;return 324-70*Math.sin(n*5.6)-40*n;},320,960,80),"y");
       note("蓝：真实风险 ε(h)　黄：经验风险 ε̂(h)",640,180,"d");
       note("⭐ 一致收敛说的是：两条曲线处处相差不超过 γ",640,398,"y");},"<b>一致收敛有一个很直观的图景，值得画出来。</b><br><b>把假设类里的假设排在横轴上，纵轴是误差。</b><b>于是你有两条曲线：一条是真实风险 ε(h)，另一条是经验风险 ε̂(h)。</b><br><b>⭐ 一致收敛说的就是：这两条曲线处处相差不超过 γ。</b>讨论课的说法是<b>「虚线和那条粗黑线之间的缝隙，始终小于 γ」</b>。<br><b>⚠ 注意「处处」两个字——不是在某一点上接近，而是在整条曲线上都接近。</b><b>这正是「一致」的含义。</b><br><b>⇒ 有了这个，ERM 的保证就水到渠成了：你在黄线上挑了最低点，而黄线和蓝线处处相差不超过 γ，所以你挑的那个点在蓝线上也不会差太多。</b><b>⭐ 整个证明的几何直觉就是这一句。</b>");
  S(4804,function(){clearScene();setEq(null);setCap("为什么 ERM 挑的那个点差不了太多");
   boxNode(170,186,980,48,"① 黄线上 ĥ 处的值 ≤ 黄线上 h* 处的值（因为 ĥ 是最低点）","b");
   boxNode(170,242,980,48,"② 黄线和蓝线处处相差不超过 γ","y");
   boxNode(170,298,980,48,"★ ⇒ ĥ 的真实风险 ≤ h* 的真实风险 ＋ 2γ","g");
   note("⚠ 为什么是 2γ：两次用到「相差不超过 γ」，一次在 ĥ 处、一次在 h* 处",640,366,"r");
   note("⭐ 这三行就是整个保证的全部内容",640,402,"y");},"<b>最后把那个保证的三行推理写出来，整节课就收口了。</b><br><b>① ĥ 是在经验风险（黄线）上挑的最低点，所以黄线在 ĥ 处的值，不会超过黄线在 h* 处的值。</b><br><b>② 一致收敛告诉你：黄线和蓝线处处相差不超过 γ。</b><br><b>★ ③ 把两件事拼起来：ĥ 的真实风险，不超过 h* 的真实风险加上 2γ。</b><br><b>⚠ 为什么是 2γ 而不是 γ？因为「相差不超过 γ」被用了两次：一次是从 ĥ 的经验风险跳到它的真实风险，一次是从 h* 的真实风险跳到它的经验风险。</b><br><b>⭐ 这三行就是整个保证的全部内容。</b><b>它说的是：你用 ERM 挑出来的那个假设，泛化表现不会比「假设类里最好的那个」差太多。</b>");
  SUM(4804,20,{h:"★ 一致收敛 = 两条误差曲线处处相差不超过 γ",k:"<b>图景</b>：假设排在横轴，纵轴是误差 ⇒ 两条曲线：<b>真实风险 ε(h)</b> 和 <b>经验风险 ε̂(h)</b>。",m:"⭐ <b>一致收敛说的是这两条曲线处处相差不超过 γ</b>。讨论课：<b>虚线和那条粗黑线之间的缝隙始终小于 γ</b>。",w:"⚠ <b>注意「处处」</b>——不是某一点接近，而是<b>整条曲线上都接近</b>，这正是「一致」的含义。",e:"⇒ ⭐ <b>ERM 的保证就水到渠成</b>：你在黄线上挑最低点，而两线处处相差不超过 γ ⇒ <b>你挑的点在蓝线上也不会差太多</b>。"});
  QUIZ(4804,20,{t:"一致收敛的几何图景是什么？",o:["参数收敛到最优值","把假设排在横轴，真实风险和经验风险两条曲线处处相差不超过 γ——「处处」正是「一致」的含义","误差随迭代次数收敛到 0","方差随样本量趋于 0"],a:1,w:"⇒ 有了它 <b>ERM 的保证水到渠成</b>：在经验风险曲线上挑最低点，两线处处相差不超过 γ，<b>所以挑的点在真实风险上也不会差太多</b>。"});
});
KP("21 · ★ 把整条链串起来",function(){
  S(4172,function(){clearScene();setEq(null);setCap("从 Hoeffding 到「训练误差小 ⇒ 泛化误差小」");
       boxNode(170,186,980,48,"① Hoeffding：单个 h 的经验风险接近真实风险","b");
       boxNode(170,242,980,48,"② union bound：推广到所有 K 个 h（代价：乘以 K）","y");
       boxNode(170,298,980,48,"③ 一致收敛：两条误差曲线处处相差不超过 γ","y");
       boxNode(170,354,980,48,"★ ④ 于是 ERM 挑出的 ĥ，泛化误差也有保证","g");
       note("⭐ 四步，每一步都只用到前一步",640,166,"y");},"<b>把整条论证链串起来，就能看清每一步在补什么。</b><br><b>① Hoeffding 不等式：对单个固定的 h，经验风险接近真实风险，而且偏离的概率随样本量指数级下降。</b><br><b>② union bound：把这个保证从「一个 h」推广到「所有 K 个 h」，代价是概率界乘以 K。</b><br><b>③ 一致收敛：于是两条误差曲线处处相差不超过 γ。</b><br><b>★ ④ 最后：ERM 在经验风险曲线上挑了最低点，由于两线处处接近，这个点在真实风险上也不会差太多——于是泛化误差有了保证。</b><br><b>⭐ 四步，每一步都只用到前一步的结论，整条链很干净。</b><br><b>⚠ 而且每一步补的都是前一步的一个具体缺口：①只管一个 h，②补上「所有」，③翻译成几何语言，④接上 ERM 这个具体算法。</b>");
  S(4172,function(){clearScene();setEq(null);setCap("每一步「花掉」了什么");
   matrix({rows:4,cols:3,cw:350,ch:44,x:130,y:198,
     cell:function(i,j){var t=[
       ["步骤","得到什么","代价"],
       ["Hoeffding","单个 h 的保证","要求样本独立同分布"],
       ["union bound","所有 h 的保证","★ 概率界乘以 K"],
       ["接上 ERM","ĥ 的泛化保证","⚠ 只对 ERM 这类算法"]];return t[i][j];},
     dim:function(i,j){return i===0;},
     hl:function(i,j){return i>=2?"hl":"";}});
   note("⭐ 每一步都在「用一个假定，换一点结论」",640,398,"y");},"<b>把每一步「花掉」了什么也列出来，这条链就完整了。</b><br><b>Hoeffding 给了你单个 h 的保证，代价是要求样本是独立同分布的。</b><br><b>union bound 把它推广到所有 h，★ 代价是概率界乘以 K。</b><br><b>接上 ERM 之后你得到了 ĥ 的泛化保证，⚠ 代价是这个结论只对 ERM 这一类算法成立。</b><br><b>⭐ 看出规律了吗：每一步都在「用一个假定，换一点结论」。</b><br><b>⇒ 这就是理论工作的基本形态——没有白来的保证，每一条都对应着一个你必须接受的前提。</b><br><b>⚠ 而当你在实践中发现理论结论不管用时，正确的做法不是怀疑理论，而是回头去查这些前提里哪一条不成立。</b>");
  SUM(4172,21,{h:"★ 四步链：Hoeffding → union bound → 一致收敛 → ERM 的保证",k:"<b>① Hoeffding</b>：单个 h 的经验风险接近真实风险，偏离概率<b>随样本量指数级下降</b>。",m:"<b>② union bound</b>：从「一个 h」推广到「所有 K 个 h」，<b>代价是乘以 K</b>。<b>③ 一致收敛</b>：两条误差曲线<b>处处相差不超过 γ</b>。",w:"★ <b>④</b> ERM 在经验风险曲线上挑最低点，<b>由于两线处处接近，这个点在真实风险上也不会差太多</b>。",e:"⭐ <b>每一步补的都是前一步的一个具体缺口</b>：①只管一个 h ②补上「所有」③翻译成几何语言 ④接上 ERM 这个具体算法。"});
  QUIZ(4172,21,{t:"从 Hoeffding 到「训练误差小 ⇒ 泛化误差小」，中间经过哪几步？",o:["偏差分解 → 方差分解 → 合并","交叉验证 → 正则化 → 早停","Hoeffding（单个 h）→ union bound（推广到所有 K 个，乘以 K）→ 一致收敛（两条曲线处处接近）→ ERM 挑的点也有保证","直接由 Hoeffding 得出"],a:2,w:"⭐ <b>每一步补的都是前一步的一个具体缺口</b>：①只管一个 h ②补「所有」③翻译成几何语言 ④接上 ERM。"});
});
KP("22 · ⚠ 这些保证管用在哪、不管用在哪",function(){
  S(5027,function(){clearScene();setEq(null);setCap("诚实地划出适用范围");
       matrix({rows:4,cols:2,cw:430,ch:44,x:210,y:198,
         cell:function(i,j){var t=[
           ["前提","不成立会怎样"],
           ["训练与测试同分布","⚠ 所有保证全部失效"],
           ["算法是 ERM 这一类","结论不直接适用"],
           ["★ 假设类有限（K 个）","要换成 VC 维那一套"]];return t[i][j];},
         dim:function(i,j){return i===0;},
         hl:function(i,j){return i===3?"hl":"";}});
       note("⭐ 知道边界在哪，比记住结论更有用",640,398,"y");},"<b>最后把这些保证的适用范围诚实地划出来——知道边界在哪，比记住结论更有用。</b><br><b>前提一：训练与测试同分布。</b><b>⚠ 这一条不成立的话，所有保证全部失效。</b>而现实中它常常不成立——<b>比如你用去年的数据训练，今年的情况变了。</b><br><b>前提二：算法属于 ERM 这一类（最小化训练误差）。</b><b>如果你的算法不是这样（比如带了很强的正则化、或者早停），结论就不直接适用。</b><br><b>★ 前提三：假设类是有限的，有 K 个。</b><b>而很多假设类是无限的，那就要换成 VC 维那一套——讨论课提了但没讲。</b><br><b>⭐ 把这三条记住，你就知道什么时候可以引用这些结论、什么时候不能。</b><b>⚠ 学习理论最常见的误用，就是把它的结论搬到前提不成立的场合。</b>");
  SUM(5027,22,{h:"⚠ 三个前提，三种失效方式",k:"<b>前提一：训练与测试同分布</b>。⚠ <b>不成立则所有保证全部失效</b>——现实中常常不成立（用去年的数据训练，今年情况变了）。",m:"<b>前提二：算法属于 ERM 这一类</b>。若带了很强的正则化或早停，<b>结论不直接适用</b>。",w:"★ <b>前提三：假设类有限（K 个）</b>。很多假设类是无限的 ⇒ <b>要换成 VC 维那一套</b>（讨论课提了但没讲）。",e:"⭐ <b>知道边界在哪比记住结论更有用</b>。⚠ <b>学习理论最常见的误用，就是把结论搬到前提不成立的场合。</b>"});
  QUIZ(5027,22,{t:"这节课的理论保证依赖哪三个前提？",o:["数据量大、模型简单、损失凸","训练与测试同分布、算法属于 ERM 这一类、假设类有限（K 个）","凸优化、学习率足够小、迭代足够多","无噪声、线性可分、特征独立"],a:1,w:"⚠ <b>学习理论最常见的误用，就是把结论搬到前提不成立的场合</b>。⭐ 知道边界比记住结论更有用。"});
});
KP("23 · ★ g 到底是什么：最好的可能假设",function(){
  S(1521,function(){clearScene();setEq(null);setCap("它不受任何假设类的限制");
       says("25:21","which is like the best possible hypothesis you can think of");
       boxNode(170,196,980,56,"g = 在「所有可能的假设」里，期望损失最小的那一个","y");
       boxNode(170,264,980,56,"★ 它不受你选的模型族限制 —— 可以是任何函数","g");

       note("⚠ 而它通常是写不出来的：你不知道真实的数据分布",640,398,"r");},"<b>三个假设里，g 是最容易被含糊带过的一个，值得单独说清楚。</b><br><b>讨论课说 g 是「你能想到的最好的那个假设」，并补充解释：把这个假设拿来，对数据分布求期望损失，得到的就是最小的那个值。</b><br><b>★ 关键在于 g 不受你选的模型族限制——它可以是任何函数，不必是线性的、不必是逻辑回归、不必能被任何算法表达出来。</b><br><b>⭐ 所以 g 的误差就是不可约误差：连「上帝」也做不到更好，因为剩下的全是数据本身的噪声。</b><br><b>⚠ 但要注意：g 通常是写不出来的。</b><b>要知道 g，你得知道真实的数据分布——而如果你知道那个，一开始就不需要做机器学习了。</b><br><b>⇒ 所以 g 是一个理论上的参照点，用来定义误差分解，而不是一个你能去求的东西。</b>");

    "收一下。这节讨论课做的事，是把正课里几个靠直觉理解的概念，换成可以精确说清、甚至可以证明的东西。<br><b>★★★ 第一件是用参数视角重讲偏差和方差。</b><b>设想把整个训练过程重复无数次，每次喂一批新数据，得到一个 θ̂——这些 θ̂ 构成一个「采样分布」。</b><b>⭐ 于是：偏差问的是「这个采样分布有没有以真参数 θ* 为中心」，方差问的是「它有多分散」。</b>讨论课点明了一句很精炼的话：<b>偏差和方差本质上就是采样分布的一阶矩和二阶矩的性质</b>——一阶矩是均值（看是否居中），二阶矩就是方差本身。<br><b>⚠ 这个视角比「欠拟合/过拟合」那张图强在哪？强在它能解释那张图解释不了的事。</b>比如<b>参数个数相同的两个算法，偏差和方差可以完全不同</b>——<b>加了正则化，方差就会降下来</b>。<br><b>⭐ 几个和样本量 m 有关的性质</b>：<b>数据越多，方差趋于 0</b>；而<b>方差随 m 下降的速率叫统计效率</b>（有的算法方差按 1/m² 降，有的按 e⁻ᵐ 降）；<b>如果 m 趋于无穷时 θ̂ 收敛到 θ*，这个算法叫「一致的」</b>；<b>而如果对任何 m，θ̂ 的期望都等于 θ*，那叫「无偏的」</b>。⚠ <b>这两件事不一样</b>：一致说的是极限行为，无偏说的是任何样本量下都居中。<br><b>★★ 第二件是把三个假设分清楚。</b><b>g 是最好的可能假设（可能根本不在你的假设类里）；h* 是你的假设类里最好的那个；ĥ 是你用有限数据实际学到的那个。</b><b>⇒ 三者之间的落差，正好对应误差的三块。</b><br><b>★★★ 于是有了误差三分解</b>：<b>不可约误差（无论你用什么假设、有多少数据都去不掉）＋ 近似误差（因为你把自己限定在某个假设类里，比如只用逻辑回归）＋ 估计误差（因为数据有限、算法有脾气）</b>。<b>⭐ 而估计误差还能再拆成估计偏差和估计方差。</b><br><b>⚠ 讨论课点出了一件容易混的事：同一件事有两种拆法。</b><b>「偏差-方差分解」和「近似-估计误差分解」是从两个角度切同一块误差</b>——<b>通常说的「方差」对应估计方差，「偏差」对应近似误差加估计偏差</b>。看到不同教材用不同拆法时，不必以为它们在说不同的事。<br><b>后半段转向可证明的保证。</b><b>先区分两个量：风险（也叫泛化误差）是在整个数据分布上的期望损失，这是个无限的过程；而经验风险是在你手上那有限几个样本上的出错比例。</b><b>★ 然后限定一类算法：经验风险最小化（ERM）——就是「在假设类里挑训练误差最小的那个」。</b>⭐ <b>为什么要限定？因为只有限定了算法，才能推出更强的理论结果。</b><br><b>★★ 工具是 Hoeffding 不等式</b>：它说<b>用 m 个样本估计一个概率时，估计值偏离真值超过 γ 的概率，会随 m 指数级地变小</b>。<b>⇒ 把它用在「某一个假设 h 的经验风险 vs 真实风险」上，就得到了这个 h 的保证。</b><br><b>⚠ 但只保证一个 h 是不够的——ERM 会从整个假设类里挑，而且是挑那个在训练集上看起来最好的，这个「挑」的动作本身就带来风险。</b><b>★★★ 所以要的是一致收敛：假设类里所有的 h 同时都满足那个保证。</b><b>做法是对 K 个假设套 union bound——代价就是把概率界乘上一个 K。</b><br><b>⇒ 由此得到样本复杂度：要达到某个精度和置信度，你需要多少个样本。</b><b>⭐ 结论的形状很值得记：需要的样本数随假设类大小的对数增长。</b><b>是对数，不是线性——所以假设类大一点并不可怕。</b><br><b>最后，讨论课提了 VC 维但没展开：它是用来给「无限大的假设类」也定出一个「尺寸」的概念，衡量这个类有多强的表达能力。</b><b>⚠ 讨论课明说了「今天不讲这个」，所以这里也不假装讲过。</b>");
