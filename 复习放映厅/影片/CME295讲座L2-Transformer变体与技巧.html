  stack(640,200,["从一个「标示第一个被损坏 span」的 token 开始","一直解码，直到它预测出「下一个 sentinel token」","两个连续 sentinel 之间解出的 token = 被恢复的那一段"],620,32,8);
  note("⇒ 一直这样走到第 n+1 个",640,318,"y");
  note("★★ 所以 sentinel token 在输出里起的是「分隔符」的作用",640,356,"g");
  note("⚠ 讲者的定性：这基本上是对 next token prediction 目标函数的一个「转变」",640,386,"r");},"<b>这是 span corruption 最精巧的一半：输出端怎么组织。</b><br><b>讲者的话</b>：<b>「<u>所以你们在 encoder 里有它们。然后 decoder 的工作就是按序把这些 span 一个个找出来。所以你从一个标示第一个被损坏 span 的 token 开始，然后你开始解码过程，直到它碰到一个预测出「下一个 sentinel token」的预测，一直到第 n+1 个 —— 其中两个连续的 sentinel token 之间被解码出来的那些 token，就对应着被恢复的那些损坏片段</u>。」</b><br><b>★★★ 用那个例句走一遍，整件事就清楚了</b>：<b>⇒ <u>encoder 输入</u>：<u>my ⟨id_0⟩ is reading</u>。</b><b>⇒ <u>decoder 目标输出</u>：<u>⟨id_0⟩ teddy bear cute and ⟨id_1⟩</u>。</b><br><b>★★ 请注意输出的形式：<u>它不是完整的原句，而是「每个 sentinel 后面跟着它该填的内容」</u>。</b><b>⇒ 为什么这样设计：<u>因为这样输出序列只包含被挖掉的部分，而不用重复抄一遍没被挖的部分</u>。</b><b>⇒ <u>于是训练效率高得多</u> —— 一个句子挖掉 15%，输出就只有 15% 那么长。</b><br><b>⚠ 而 sentinel token 在这里有<u>两个</u>角色：<u>在输入里它是占位符，在输出里它是分隔符</u>。</b><b>⇒ 一个符号干两件事，<u>这是很漂亮的设计</u>。</b>");
  SUM(0,36,{h:"⭐ span corruption：T5 换掉了训练目标",k:"关于 T5 家族最该知道的一件事：<b>目标函数变了</b>。<b>原始 transformer：next token prediction；T5 家族：span corruption</b> —— 句子进 encoder，但<b>不是把全部都放进去，而是留下一些「空白」</b>，而被损坏的 span <b>可以是一个也可以是多个 token 缺失</b>。例：<b>my teddy bear is cute and reading → my ⟦span⟧ is reading</b>。",m:"⭐⭐ 关键术语 <b>sentinel token（哨兵 token）</b>：n 是被损坏 span 的数量，<b>输入里放 n 个这样的 token，而「一个 sentinel 代表一整段被损坏的 token」</b>。⇒ decoder 的工作是<b>按序把每个 span 找出来</b>：从标示第一段的 token 开始解码，<b>直到预测出下一个 sentinel，而两个连续 sentinel 之间解出的 token 就是被恢复的那一段</b>。走一遍：<b>encoder 输入 my ⟨id_0⟩ is reading ⇒ decoder 输出 ⟨id_0⟩ teddy bear cute and ⟨id_1⟩</b>。",w:"★★★ 「<b>span（片段）</b>」是 T5 和 BERT 的分界：<b>BERT 的 MLM 挑单个 token 遮住，模型知道要填一个词；T5 挖连续一段，而且一个 sentinel 换一整段 ⇒ 长度信息被丢掉，模型得自己决定填几个词</b>。⇒ 所以 span corruption <b>更难、更接近生成</b>，而这也解释了三类架构的分工 —— <b>任务决定架构</b>：T5 的任务要生成所以留着 decoder，BERT 只要分类所以能扔掉 decoder。⇒ 输出形式的妙处：<b>只包含被挖掉的部分，不用重抄没挖的 ⇒ 挖 15% 输出就只有 15% 长，训练效率高得多</b>；而 sentinel 在输入里是占位符、在输出里是分隔符，<b>一个符号干两件事</b>。",r:"★★ 记牢这个对比，它是 71:14 那个结论的核心论据：讲者后面会说<b>人们的投入流向了「最容易 scale up 和泛化」的 next-word prediction，而不是 T5 那个「更定制、更复杂」的任务</b>。⇒ 所以这是一场<b>关于「预训练任务该有多复杂」的路线之争</b>：<b>T5 的立场是精心设计的任务学到更好的表示；GPT 的立场是最简单的任务 + 最多的数据和算力</b> —— 而历史给出的答案是后者。⇒ 另：挑 <b>teddy bear</b> 挖是好示范，因为它是<b>复合名词</b> —— 只遮「bear」模型靠搭配就猜出来了（学得很浅），<b>遮整段才迫使它从「my ___ is reading」推断出一个合理主语</b>。"});
  QUIZ(0,36,{t:"T5 的 span corruption 和 BERT 的 MLM 最本质的区别是什么？",o:["BERT 的遮罩是确定性的","T5 只在 decoder 里遮","一个 sentinel 换一整段（长度信息被丢掉，模型得自己决定填几个词），而 BERT 一个 [MASK] 换一个 token","T5 遮的 token 更多"],a:2,w:"⇒ 所以 span corruption 更接近生成，而这解释了架构分工：T5 的任务要生成所以留着 decoder，BERT 只要分类所以能扔掉。"});
});
KP("37 · 一个关于解码过程的提问，与 teacher forcing",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:03","So these parentheses is basically a shift from the next token prediction objective function");
  note("讲者给 span corruption 的定性",640,186,"v");
  boxNode(130,214,1020,44,"这基本上是对「next token prediction」这个目标函数的一个「转变（shift）」","g");
  note("⇒ 他用的词是 shift，不是 improvement（改进）",640,292,"y");
  note("★ 这个用词很中性 —— 它不预判哪个更好",640,324,"g");
  note("⚠ 而四分钟后他会说：历史选了 next-word prediction",640,362,"r");},"<b>这一镜很短，但讲者的用词值得留意。</b><br><b>他的话</b>：<b>「<u>所以这些括号基本上是对 next token prediction 这个目标函数的一个转变</u>。」</b><br><b>★★ 「<u>转变（shift）</u>」这个词是中性的</b>：<b>⇒ 他没有说 <u>improvement（改进）</u>，也没有说 <u>complication（复杂化）</u>。</b><b>⇒ <u>只是「不一样了」</u>。</b><br><b>★★★ 而这个中性在这里是对的，因为<u>在 2019 年，T5 的这个选择看起来是很有道理的</u></b>：<b>⇒ T5 论文本身做了大量的消融实验，<u>比较了各种预训练目标，而 span corruption 在他们的实验里确实最好</u>。</b><b>⇒ 所以这不是一个拍脑袋的决定，<u>它是有实验支持的</u>。</b><br><b>⚠ 但四分钟后（70:44）讲者会说：<u>人们的算力投向了「最容易 scale up」的那个任务</u>。</b><b>⇒ <u>也就是说，T5 在「同等规模下哪个目标更好」这个问题上赢了，而在「哪个目标更能扩大规模」这个问题上输了</u>。</b><br><b>⇒ <u>这两个问题不一样，而后者才决定了历史</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:34","So you have sentinel tokens that denote some missing text");
  note("提问：能把「解码过程」再说详细点吗？",640,186,"v");
  boxNode(130,214,1020,44,"讲者：你刚说的关于「重建」那部分「完全正确」","g");
  note("⇒ 你有 sentinel token，它们标示某些「缺失的文本」",640,292,"y");
  note("★ 所以你想解码出来的就是那段缺失的文本",640,324,"g");
  note("⇒ 于是 decoder 的输出就恰好是「每一个 span 被重建出来」的样子",640,362,"d");},"<b>学生要求把解码过程再说一遍，而讲者的复述把这件事钉死了。</b><br><b>学生的问题</b>：<b><u>你能把解码过程再说详细一点吗？</u></b><br><b>讲者的回答</b>：<b>「<u>所以你刚才说的关于重建那部分完全正确。所以你有 sentinel token，它们标示某些缺失的文本。所以你想要解码出来的就是那段缺失的文本。所以 decoder 的输出就会恰好是「每一个 span 被重建出来」的样子</u>。」</b><br><b>★★ 这个复述值得停一下，因为它排除了一个很自然的误解</b>：<b>⇒ <u>误解</u>：decoder 输出<u>完整的原句</u>（my teddy bear is cute and reading）。</b><b>⇒ <u>正解</u>：decoder 只输出<u>被挖掉的那些段</u>，用 sentinel 隔开。</b><br><b>★★★ 为什么这个区别要紧</b>：<b>⇒ 如果输出完整原句，<u>那模型大部分的工作是在抄写 encoder 已经看到的内容</u>。</b><b>⇒ 抄写是一个很容易学的任务，<u>它会把梯度和容量都浪费掉</u>。</b><br><b>⇒ 而只输出缺失部分，<u>每一个被预测的 token 都是真正需要推断的</u>。</b><b>⇒ <u>这是一个关于「如何设计训练目标」的普遍原则：让模型只为「它真正需要学会的东西」付出预测</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("67:50","you do a teacher-forcing mechanism where you input everything in the decoder");
  note("⭐ 训练时怎么跑：teacher forcing",640,186,"y");
  stack(640,200,["把「全部」都输入到 decoder 里","然后试着「一次性」把全部重建出来","⇒ 这叫 teacher forcing（教师强制）"],560,32,8);
  note("⇒ 讲者：如果你想知道训练是怎么工作的 —— 你做一个 teacher-forcing 机制",640,318,"y");
  note("★★ 关键在「一次性（all at once）」—— 训练时不是一个词一个词生成的",640,356,"g");
  note("⚠ 这是训练和推理的一个根本差异，很多人在这里卡住",640,386,"r");},"<b>这是一个很重要的机制，而它解释了训练和推理为什么看起来完全不同。</b><br><b>讲者的话</b>：<b>「<u>然后如果你想知道训练是怎么工作的 —— 你做一个 teacher-forcing 机制，在那里你把所有东西都输入到 decoder 里，然后试着一次性把所有东西重建出来</u>。」</b><br><b>★★★ 把训练和推理并排看，差别很大</b>：<b>⇒ <u>推理时</u>：生成第 1 个词 ⇒ 把它接到输入上 ⇒ 生成第 2 个词 ⇒ …… <u>完全串行，n 个词要跑 n 次</u>。</b><b>⇒ <u>训练时（teacher forcing）</u>：<u>把正确答案整个塞进 decoder</u>，配上因果掩码，<u>一次前向就同时得到所有位置的预测</u>。</b><br><b>★★ 为什么能这样：<u>因为因果掩码保证了第 t 个位置看不到第 t 之后的内容</u>。</b><b>⇒ 所以虽然你把完整答案都塞进去了，<u>每个位置的预测仍然只依赖它之前的部分</u> —— <u>和串行生成在数学上等价</u>。</b><br><b>⚠ 而「<u>教师强制</u>」这个名字说的是：<u>每一步喂给模型的都是「正确答案」，而不是模型上一步自己的输出</u>。</b><b>⇒ 这带来一个著名的问题，叫 <u>exposure bias</u>：<u>训练时它从来没见过自己的错误，而推理时它必须接着自己的错误往下写</u>。</b>");
  SUM(0,37,{h:"解码过程，与 teacher forcing",k:"讲者给 span corruption 的定性：<b>这基本上是对 next token prediction 这个目标函数的一个「转变（shift）」</b>。提问「能把解码过程再说详细点」⇒ <b>sentinel token 标示缺失的文本，你要解码出来的就是那段缺失文本，所以 decoder 的输出恰好是「每一个 span 被重建出来」的样子</b>。训练：<b>做一个 teacher-forcing 机制 —— 把全部输入到 decoder 里，然后试着「一次性」把全部重建出来</b>。",m:"★★ 这个复述排除了一个自然的误解：<b>误解是 decoder 输出完整原句，正解是只输出被挖掉的那些段、用 sentinel 隔开</b>。⇒ 为什么要紧：<b>输出完整原句时模型大部分工作是在抄写 encoder 已经看到的内容，而抄写很容易学、会把梯度和容量都浪费掉</b>；只输出缺失部分则<b>每个被预测的 token 都是真正需要推断的</b>。⇒ 普遍原则：<b>让模型只为「它真正需要学会的东西」付出预测</b>。",w:"★★★ teacher forcing 解释了训练和推理为什么看起来完全不同：<b>推理时完全串行（生成一个接上去再生成下一个，n 个词跑 n 次）；训练时把正确答案整个塞进 decoder、配因果掩码，一次前向就得到所有位置的预测</b>。⇒ 能这样是因为<b>因果掩码保证第 t 个位置看不到 t 之后的内容 ⇒ 和串行生成在数学上等价</b>。⚠ 而「教师强制」这个名字说的是<b>每一步喂的都是「正确答案」而不是模型自己上一步的输出</b> ⇒ 带来著名的 <b>exposure bias</b>：<b>训练时它从来没见过自己的错误，推理时却必须接着自己的错误往下写</b>。",r:"★★ 「<b>转变（shift）</b>」这个用词是中性的 —— 他没说 improvement 也没说 complication，<b>只是「不一样了」</b>。而这个中性是对的：<b>T5 论文本身做了大量消融实验比较各种预训练目标，而 span corruption 在他们的实验里确实最好</b> —— 不是拍脑袋的决定。★★★ 但四分钟后讲者会说算力投向了「最容易 scale up」的那个 ⇒ <b>T5 在「同等规模下哪个目标更好」上赢了，而在「哪个目标更能扩大规模」上输了 —— 这两个问题不一样，而后者才决定了历史</b>。"});
  QUIZ(0,37,{t:"训练 T5 时用 teacher forcing，关键在哪一点？",o:["它让训练更准确","它让 encoder 不必参与训练","它避免了梯度消失","把正确答案整个塞进 decoder、配因果掩码 ⇒ 一次前向同时得到所有位置的预测，而不用串行生成"],a:3,w:"⚠ 代价是著名的 exposure bias：训练时模型从来没见过自己的错误，推理时却必须接着自己的错误往下写。"});
});
KP("38 · 第二类：encoder-only —— 它不能生成，而那正是重点",function(){

  says("68:18","you just forget about the decoder and then just deal with the encoder");
  note("⭐⭐ 第二类架构，以及一段很漂亮的对话",640,186,"y");
  boxNode(130,214,1020,44,"做法：有 encoder/decoder 这个结构 ⇒ 你干脆忘掉 decoder，只处理 encoder","g");
  note("⇒ 讲者模拟学生：好，嘿，你这样没法做生成啊",640,292,"b");

  note("⚠ 这句回答值得记住，它把一个「缺陷」翻成了「设计」",640,362,"r");},"<b>这段对话很漂亮，而它翻转了一个判断。</b><br><b>讲者的话</b>：<b>「<u>然后现在我们要讲另一类 transformer —— 基本上你有这个 encoder/decoder 结构，而你干脆忘掉 decoder，只处理 encoder。所以你可能会跟我说：好，嘿，你这样没法做生成啊。而我会回答你：是的，那正是重点</u>。」</b><br><b>★★★ 「<u>是的，那正是重点</u>」—— 这句话把一个看起来的缺陷翻成了一个设计选择，而它的理由是实在的</b>：<b>⇒ 如果你的任务是<u>情感分类</u>，你根本不需要生成能力。</b><b>⇒ 而<u>带着一个用不上的 decoder，意味着一半的参数在白吃显存</u>。</b><br><b>★★ 但「那正是重点」还有一层更深的意思，<u>这一层才是真正的理由</u></b>：<b>⇒ <u>去掉 decoder 之后，你可以让注意力「双向」</u>。</b><b>⇒ 因为 decoder 必须用因果掩码（不能看未来），<u>而 encoder 没有这个限制</u>。</b><br><b>⇒ <u>所以 encoder-only 不只是「砍掉一半更省」，它换来了一个 decoder 永远做不到的能力 —— 每个 token 都能看到整个句子</u>。</b><b>⇒ 而这正是 BERT 名字里那个 <u>Bidirectional</u> 的来源（71:45 那镜）。</b>");

  note("⚠ 「过去要用专门模型」—— 这就是 BERT 当年带来的那场变化",640,386,"r");},"<b>这一镜给出了 encoder-only 的用途，而讲者那句定位最值得记。</b><br><b>他的话</b>：<b>「<u>所以它有 encoder 的表示，这些表示可以用在那些可能更偏向分类的任务上。所以情感抽取、token 分类、所有这些过去要用专门的语言模型来做的事情 —— 它们都能用 transformer 的 encoder 部分来做</u>。」</b><br><b>★★★ 「<u>过去要用专门的语言模型来做</u>」这几个字，说的是 BERT 当年带来的那场变化，而它的分量值得交代</b>：<b>⇒ <u>BERT 之前</u>（2018 年以前）：每个 NLP 任务都有自己的一套模型。<u>情感分析一个、命名实体识别一个、句法分析一个</u>。</b><b>⇒ 每个都要<u>从头设计特征、从头训练、从头调参</u>。</b><br><b>★★ <u>BERT 之后</u>：<u>一个预训练好的 encoder + 一个小小的分类头</u>，就能在几乎所有这些任务上刷新纪录。</b><b>⇒ 而那个分类头<u>往往只是一层线性映射</u>。</b><br><b>⇒ <u>这就是「预训练 + 微调」这个范式的诞生，而它彻底改变了 NLP 的工作方式</u>。</b><br><b>⚠ 而今天我们已经走到了下一步：<u>连微调都不需要了，直接用 prompt</u>。<u>但 BERT 那一步是关键的中间环节</u>。</b>");

  note("★ 而「两条轴」的具体内容在 103:02 会被明确说出来",640,364,"r");},"<b>下半场的三个主角公布，而「改进的轴」这个说法预告了结构。</b><br><b>讲者的话</b>：<b>「<u>而我们待会儿会深入一点，讲三个关键的 encoder-only 模型。所以 BERT —— 我会说它是这个格局里最中心的那个 —— 然后另外两个架构，DistilBERT 和 RoBERTa，它们是在若干条改进的轴上做探索的。所以这会很值得一看</u>。」</b><br><b>★★★ 「<u>改进的轴（axis of improvements）</u>」这个说法预告了整段的结构，而那两条轴在 <u>103:02</u> 那镜会被明确说出来</b>：<b>⇒ <u>轴一：延迟/成本</u> —— BERT base 有 1.1 亿参数，<u>有办法做得更小更快吗？</u> ⇒ <u>DistilBERT 的答案</u>。</b><b>⇒ <u>轴二：预训练目标</u> —— MLM 和 NSP 这两个目标<u>真的都有用吗？能不能简化？</u> ⇒ <u>RoBERTa 的答案</u>。</b><br><b>★★ 这个讲法值得学：<u>先讲一个基准模型，再用「它有什么毛病」来组织后续的模型</u>。</b><b>⇒ 比按时间顺序讲一串论文好得多，<u>因为你记住的是「每个模型解决了什么问题」而不是「它叫什么、哪年发的」</u>。</b><br><b>⇒ 而这也是一个读论文的办法：<u>任何一篇「改进了 X」的论文，先去找它认为 X 的毛病是什么</u>。</b>");
  SUM(0,38,{h:"第二类：encoder-only —— 不能生成，而那正是重点",k:"做法：<b>有 encoder/decoder 结构，而你干脆忘掉 decoder，只处理 encoder</b>。⇒ 讲者模拟学生「<b>你这样没法做生成啊</b>」，而他的回答是「<b>是的 —— 那正是重点</b>」。它能干什么：<b>有 encoder 的「表示」，用在更偏向分类的任务上 —— 情感抽取、token 分类，所有这些「过去要用专门的语言模型来做」的事</b>。下半场要深入三个：<b>BERT（这个格局里最中心的那个）、DistilBERT、RoBERTa（在若干条「改进的轴」上做探索）</b>。",m:"★★★ 「那正是重点」还有一层更深的理由：<b>去掉 decoder 之后，你可以让注意力「双向」</b> —— 因为 <b>decoder 必须用因果掩码（不能看未来），而 encoder 没有这个限制</b>。⇒ 所以 encoder-only 不只是「砍掉一半更省」，<b>它换来了一个 decoder 永远做不到的能力：每个 token 都能看到整个句子</b> —— 而这正是 BERT 名字里那个 <b>Bidirectional</b> 的来源。",w:"★★★ 「<b>过去要用专门的语言模型来做</b>」说的是 BERT 当年带来的那场变化：<b>BERT 之前每个 NLP 任务都有自己一套模型（情感分析一个、NER 一个、句法分析一个），每个都要从头设计特征、从头训练、从头调参</b>；<b>BERT 之后一个预训练好的 encoder + 一个往往只是一层线性映射的分类头，就能在几乎所有这些任务上刷新纪录</b>。⇒ <b>这就是「预训练 + 微调」范式的诞生</b>，而今天我们已走到下一步（连微调都不要、直接 prompt），但 BERT 那一步是关键的中间环节。",r:"★★ 「<b>改进的轴</b>」预告了整段结构，而那两条轴在 103:02 会被明确说出：<b>轴一是延迟/成本（BERT base 有 1.1 亿参数，能更小更快吗 ⇒ DistilBERT）；轴二是预训练目标（MLM 和 NSP 真的都有用吗、能简化吗 ⇒ RoBERTa）</b>。⇒ 这个讲法值得学：<b>先讲一个基准模型，再用「它有什么毛病」来组织后续的模型</b> —— 比按时间顺序讲一串论文好得多，<b>因为你记住的是「每个模型解决了什么问题」而不是「它叫什么、哪年发的」</b>。⇒ 也是一个读论文的办法：<b>任何一篇「改进了 X」的论文，先去找它认为 X 的毛病是什么</b>。"});

  note("⇒ 所以对我来说，ELMo 和 BERT 就只是论文名字 —— 我觉得这挺有意思的",640,362,"d");},"<b>这是这一讲里最轻松的一段，而它顺带说了一件关于学术文化的事。</b><br><b>讲者的话</b>：<b>「<u>而我想你们很多人想到 ELMo 和 BERT 时，第一反应不是这两篇论文 —— 因为它们是《芝麻街》里的角色。而我长大的地方，我并不知道《芝麻街》。所以对我来说，ELMo 和 BERT 就只是论文名字。但对你们来说，它可能首先代表的是别的东西。所以我觉得这挺有意思的</u>。」</b><br><b>★★ 这段八卦是真的，而且这个梗在 2018–2019 年失控过一阵</b>：<b>⇒ <u>ELMo</u>（2018）⇒ <u>BERT</u>（2018）⇒ 然后研究者们开始刻意往这个主题上凑：</b><b>⇒ <u>ERNIE</u>（百度，2019）、<u>Big BIRD</u>（Google，2020）、<u>KERMIT</u>、<u>Grover</u>…… <u>全是《芝麻街》角色</u>。</b><br><b>★★★ 而讲者那句「<u>我长大的地方不知道芝麻街</u>」很诚实，<u>它也提醒了一件事</u></b>：<b>⇒ <u>学术圈的很多「有趣」是文化特定的</u>。</b><b>⇒ 一个美国长大的人看到 BERT 会笑，<u>而一个法国或中国长大的人只看到四个字母</u>。</b><br><b>⇒ 这不影响理解，<u>但知道这些名字的来处，会让你读文献时少一点隔膜感</u>。</b>");

  note("⚠ 比如 ALiBi = Attention with Linear Bias，名字直接把方法说完了",640,362,"r");},"<b>这条观察看着是消遣，其实有实用价值。</b><br><b>讲者的话</b>：<b>「<u>而研究者们，他们普遍挺爱玩的。他们会试着把自己的缩写套进某些主题里。所以如果你去看论文的名字，你会被娱乐到</u>。」</b><br><b>★★★ 而这件事的实用面是：<u>一个好的缩写往往就是方法的摘要</u></b>：<b>⇒ <u>ALiBi</u> = Attention with <u>Li</u>near <u>Bi</u>as —— <u>名字就把方法说完了</u>（30:30 那镜）。</b><b>⇒ <u>RoPE</u> = <u>Ro</u>tary <u>P</u>osition <u>E</u>mbedding —— 同样。</b><b>⇒ <u>BERT</u> = Bidirectional Encoder Representations from Transformers —— <u>这一整段就是在拆这个名字</u>。</b><br><b>★★ 所以读论文时的一个小技巧：<u>先把标题里那个缩写展开</u>。</b><b>⇒ 很多时候展开之后，<u>你已经知道这篇论文在做什么了</u>。</b><br><b>⚠ 反过来也成立：<u>一个展开后什么都没说的缩写（纯粹为了好听），往往意味着作者自己也没能把贡献概括成一句话</u>。</b><br><b>⇒ 这不是什么硬规律，<u>但作为一个快速筛选的启发式，它意外地好用</u>。</b>");
  SUM(0,41,{h:"掩码的确认，与 ELMo 那段八卦",k:"确认型提问：<b>没有掩码时每个 token 就能互相关注？⇒ 对，完全正确；而那个掩码就恰恰是用来「阻止从一个 token 到它后面那些 token 的链接」</b>。然后讲者把 BERT 放进语境：<b>当时 NLP 正在「爆发」，同一年还有另一篇里程碑论文 ELMo = Embeddings from Language Models</b>，<b>基于一个「双向 LSTM」、多层堆叠，能为每个词建双向表示</b>；<b>但它没有 BERT 那么流行 —— 因为有和之前那些模型一样的缺点：因为这个「递推」，它很难 scale</b>。",m:"★★★ 两种「双向」的区别（BERT 论文自己强调的）：<b>ELMo 是「拼接式」—— 跑一个从左到右的 LSTM、再跑一个从右到左的，然后把两个方向的隐状态拼起来；BERT 是「融合式」—— 一个自注意力层里每个 token 同时看左右</b>。⇒ 为什么要紧：<b>ELMo 里每一层内部左向和右向彼此隔离（左向算第 3 个词时不知道右向算出了什么），只在最后拼接时相遇；而 BERT 里第 3 个词的表示在每一层都是左右信息的真正混合</b>。⚠ BERT 论文把前者叫「<b>shallow 双向</b>」、自己叫「<b>deep 双向</b>」—— <b>这正是那个 truly 的技术内容</b>。",w:"★★ 「<b>时机有点不幸</b>」这个评价说的是科研里反复发生的事：<b>ELMo 的核心洞见是对的（词的表示应依赖上下文且双向），而 BERT 得到同一个洞见但用了更好的载体（transformer 而非 LSTM）</b> ⇒ <b>想法被证明是对的，而功劳归给了后来者</b>（ELMo 拿了 2018 NAACL 最佳论文，几个月后被 BERT 盖住）。★★★ 而「难以 scale」是这门课第三次用同一个理由解释历史结果（L1 的 RNN、02:41 的硬件、这里的 ELMo）：<b>LSTM 算第 t 个词必须等 t−1 算完，长度 512 就要串行 512 步；而 transformer 一次矩阵乘法全算完</b> ⇒ <b>不能扩大规模就等于输</b>。",r:"⭐ 小八卦：<b>ELMo 和 BERT 是《芝麻街》里的角色</b>，而讲者说「<b>我长大的地方不知道芝麻街，所以对我它们就只是论文名字</b>」。这个梗在 2018–2019 失控过一阵：<b>ERNIE、Big BIRD、KERMIT、Grover 全是芝麻街角色</b>。⇒ 而他顺手给的那条建议有实用价值：<b>研究者普遍爱玩，会把缩写套进主题 —— 而一个好的缩写往往就是方法的摘要</b>（ALiBi = Attention with Linear Bias、RoPE = Rotary Position Embedding、BERT 这一整段就是在拆名字）⇒ <b>读论文先把标题里的缩写展开，很多时候展开后你已经知道它在做什么</b>；反过来，<b>展开后什么都没说的缩写往往意味着作者自己也没能把贡献概括成一句话</b>。⇒ 另：掩码实现上就是<b>在 softmax 前把那些位置的分数加上 −∞</b>，和位置偏置用的是同一个机制。"});

  note("★ 留意 placeholder（占位）这个词 —— 它本身不含任何文本信息",640,382,"g");},"<b>这是 BERT 最聪明的那个设计，而关键在「占位」这个词。</b><br><b>讲者的话</b>：<b>「<u>所以你首先有 CLS token，它代表 classification。而它基本上是一个占位 token，被放在序列的开头 —— 它接着会在走完整个注意力、然后投影、以及整个 encoder 机制之后，被投影成一个我们可以用来做分类的嵌入</u>。」</b><br><b>★★★ 为什么这个设计聪明：<u>它解决了一个形状上的问题</u></b>：<b>⇒ encoder 的输出是 <u>n 个向量</u>（每个 token 一个）。</b><b>⇒ 而分类任务需要 <u>一个</u> 向量（然后接一个分类头）。</b><b>⇒ <u>怎么从 n 个变成 1 个？</u></b><br><b>★★ 朴素的办法是<u>取平均</u>（mean pooling），但那样每个 token 的权重是固定相等的。</b><b>⇒ 而 CLS 的办法是：<u>加一个本身没有内容的 token，让注意力机制自己决定从哪些 token 吸收多少信息</u>。</b><br><b>⇒ <u>换句话说：怎么汇总这 n 个向量，这件事本身也是学出来的</u>。</b><br><b>⚠ 而「<u>占位、本身不含文本信息</u>」正是它能干这个活的原因：<u>它没有自己的词义偏好，所以它是一块干净的画布</u>。</b>");

  note("⚠ 如果是因果掩码，放在开头的 token 什么都看不到 —— CLS 就废了",640,362,"r");},"<b>这句总结里藏着一个很关键的依赖关系。</b><br><b>讲者的话</b>：<b>「<u>所以 CLS 只是某种占位符，它会携带你整个输入的双向信息</u>。」</b><br><b>★★★ 请想清楚这件事：<u>CLS 放在序列的「开头」，而它要「携带整个输入的信息」</u>。</b><br><b>⇒ <u>这只有在双向注意力下才可能</u>。</b><b>⇒ 如果用的是因果掩码，<u>位置 1 的 token 只能看到位置 1</u> —— 也就是它自己。<u>它什么信息都汇总不了</u>。</b><br><b>★★ 所以 <u>CLS 这个设计和「双向」是绑死的</u>，这两件事不能分开</b>：<b>⇒ <u>双向</u>让「在开头放一个汇总器」变得可行；</b><b>⇒ 而<u>把汇总器放在固定的开头</u>，让提取那个向量变得极其简单（永远取第 0 个位置）。</b><br><b>⇒ <u>两个设计互相成全</u>。</b><br><b>⚠ 顺带：<u>这也解释了为什么 GPT 那类模型做分类时不用「开头的 token」，而是用「最后一个 token」</u>。</b><b>⇒ 因为在因果注意力下，<u>只有最后那个位置看到了全文</u>。</b><b>⇒ <u>同一个需求（汇总全文），不同的结构，答案就反过来了</u>。</b>");

  note("⚠ 而那正是 NSP（下一句预测）这个目标要用的东西",640,362,"r");},"<b>第二个结构性 token，而它的存在本身就透露了 BERT 的训练任务。</b><br><b>讲者的话</b>：<b>「<u>而另一个可能有用去看的 token，是这个 SEP token。所以它就像 separator（分隔符）。而你很快就会看到 —— 我们马上会看它操作的那些目标函数。它的目标是分开两个句子</u>。」</b><br><b>★★★ 「<u>分开两个句子</u>」这几个字透露了一件事：<u>BERT 的输入经常不是一个句子，而是一对</u>。</b><br><b>⇒ 为什么会这样，有两个原因</b>：<b>⇒ ① <u>预训练时</u>：NSP 这个任务就是「判断这两句是不是连着的」（78:25 那镜），<u>所以必须一次喂两句</u>。</b><b>⇒ ② <u>微调时</u>：很多下游任务本身就是「一对输入」—— <u>句子相似度、自然语言推理、问答（问题 + 文档）</u>。</b><br><b>★★ 于是 BERT 的标准输入格式是：<u>[CLS] 句子A [SEP] 句子B [SEP]</u>。</b><b>⇒ 注意<u>末尾也有一个 SEP</u>，它标示输入的结束。</b><br><b>⚠ 而单句任务（比如情感分类）就只有：<u>[CLS] 句子 [SEP]</u>。</b><b>⇒ <u>同一个格式同时覆盖单句和双句任务，这是 BERT 能用一套模型打所有分类任务的原因之一</u>。</b>");
  SUM(0,42,{h:"CLS 和 SEP：两个「结构性」的 token",k:"encoder-only 的目标：<b>做那些「把某个表示投影到某处」的任务，典型就是分类</b>。而 BERT 的工作方式非常特定：<b>有两种 token 在这里是「结构性的」</b>。<b>CLS = classification</b>：一个<b>「占位 token」放在序列开头</b>，走完全部注意力 + 投影 + 整个 encoder 机制之后<b>被投影成一个能用来做分类的嵌入</b> —— 它<b>携带你整个输入的「双向」信息</b>。<b>SEP = separator</b>：目标是<b>分开两个句子</b>。",m:"★★★ CLS 为什么聪明 —— 它解决一个形状问题：<b>encoder 输出 n 个向量，而分类需要 1 个</b>。朴素办法是取平均（每个 token 权重固定相等），<b>而 CLS 的办法是加一个本身没有内容的 token，让注意力机制自己决定从哪些 token 吸收多少 ⇒ 「怎么汇总这 n 个向量」本身也是学出来的</b>。⚠ 而「<b>占位、本身不含文本信息</b>」正是它能干这活的原因：<b>它没有自己的词义偏好，是一块干净的画布</b>。",w:"★★★ 一个关键依赖：<b>CLS 放在「开头」却要携带整个输入的信息 —— 这只有在双向注意力下才可能</b>（因果掩码下位置 1 只能看到它自己，什么都汇总不了）⇒ <b>CLS 和「双向」是绑死的，两个设计互相成全</b>（双向让「开头放汇总器」可行，而固定在开头让提取那个向量极其简单 —— 永远取第 0 个位置）。⚠ 这也解释了<b>为什么 GPT 那类模型做分类用「最后一个 token」而不是开头</b> —— 因果注意力下只有最后那个位置看到了全文。<b>同一个需求、不同结构，答案就反过来了</b>。",r:"⚠ 「结构性 token」这个概念在今天的 LLM 里用得更多：<b>你和聊天模型对话时，背后输入里塞满了 ⟨|im_start|⟩、⟨|im_end|⟩、system、user、assistant 这类标记</b> —— 它们和你打的字一样进入模型，<b>但作用是「告诉模型这段是谁说的、到哪结束」</b>。⇒ <b>BERT 的 CLS 和 SEP 是这整套做法的起点</b>。⇒ 而「分开两个句子」透露了 <b>BERT 的输入经常是一对句子</b>：预训练时 NSP 要判断两句是否相连，微调时很多任务本身就是一对（句子相似度、自然语言推理、问答）。标准格式：<b>[CLS] 句子A [SEP] 句子B [SEP]</b>，单句任务就是 <b>[CLS] 句子 [SEP]</b> —— <b>同一格式覆盖单句和双句，这是 BERT 能用一套模型打所有分类任务的原因之一</b>。"});
  QUIZ(0,42,{t:"CLS 这个设计为什么必须依赖「双向」注意力？",o:["因为双向的参数更多","因为分类头需要双向梯度","因为 SEP 必须在双向下才起作用","CLS 放在开头却要汇总整个输入 —— 而因果掩码下位置 1 只能看到它自己，什么都汇总不了"],a:3,w:"⇒ 这也解释了为什么 GPT 那类模型做分类用「最后一个 token」—— 因果注意力下只有最后那个位置看到了全文。同一个需求、不同结构，答案反过来了。"});
});

KP("44 · 一个好提问：NSP 不是 decoder 的活吗？",function(){

  note("⚠ 讲者的回应：其实我马上就要详细讲这个",640,362,"d");},"<b>这个提问很敏锐，而它被名字误导了 —— 但那个误导本身值得分析。</b><br><b>学生的问题</b>：<b><u>这里还是只有一个 encoder 吗？因为「下一句预测」可以被看成是一个 decoder 的任务。</u></b><br><b>★★★ 为什么这个怀疑很合理，有两层</b>：<b>⇒ ① 名字里有 <u>prediction（预测）</u>，而预测听起来像生成。</b><b>⇒ ② 名字里有 <u>Next（下一个）</u>，而「下一个」在这门课里一直和 <u>next token prediction</u>（自回归生成）绑在一起。</b><br><b>★★ 所以一个很自然的读法是：<u>NSP = 给第一句，生成第二句</u>。</b><b>⇒ 而那确实需要 decoder。</b><br><b>⚠ 但那不是 NSP 做的事（下一镜揭晓）。</b><br><b>★ 这是一个很好的例子，说明<u>术语的命名会误导理解</u></b>：<b>⇒ <u>Next Sentence Prediction</u> 这个名字，如果叫 <u>Sentence Pair Classification</u>（句对分类），<u>学生根本不会有这个疑问</u>。</b><b>⇒ 而它的实际内容就是后者。</b><br><b>⇒ <u>所以读论文时，别太信名字 —— 去看它的输入和输出是什么</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⇒ 讲者说得很干脆：so it is a classification task",640,318,"y");
  note("★★ 输出不是文本，是一个「是 / 不是」",640,356,"g");
  note("⚠ 而一个二分类任务，encoder + 一个分类头就够了",640,386,"r");},"<b>答案很干脆，而它把那个误导彻底消除了。</b><br><b>讲者的话</b>：<b>「<u>所以实际上我要详细讲一下。下一句预测这个任务，实际上是我们把两个句子一前一后放进去，然后预测它们是不是真的连续的。所以它是一个分类任务</u>。」</b><br><b>★★★ 把输入输出写清楚，疑问就消失了</b>：<b>⇒ <u>输入</u>：<u>[CLS] 句子A [SEP] 句子B [SEP]</u> —— 两个句子<u>都已经给了</u>。</b><b>⇒ <u>输出</u>：<u>一个二分类标签</u>（IsNext / NotNext）。</b><br><b>★★ 所以它<u>什么都不生成</u>。</b><b>⇒ 它只是在 CLS 的输出嵌入上接一个二分类头，<u>和情感分类的结构完全一样</u>。</b><br><b>⇒ <u>于是不需要 decoder</u>。encoder + 一个分类头就够了。</b><br><b>⚠ 而名字里的「<u>Next</u>」说的不是「要生成下一句」，而是「<u>要判断它是不是下一句</u>」。</b><b>⇒ <u>一个字的差别（generate vs judge），决定了需不需要半个模型</u>。</b><br><b>★ 顺带：<u>这个任务的训练数据是白拿的</u>。<u>你从语料里取相邻两句标 IsNext，随机取两句标 NotNext</u> —— <u>一条标注都不用人工做</u>。</b>");

  note("★ 所以接下来的顺序是：先讲优劣，再回来讲 MLM 和 NSP 的细节",640,324,"g");
  note("⚠ 这个顺序其实挺好 —— 先知道这套做法值不值，再看它怎么做",640,362,"d");},"<b>这一镜是过渡，但讲者选的顺序值得说一句。</b><br><b>他的话</b>：<b>「<u>对，很好的点。而我们很快就会详细看到那个。所以在我们详细看那个之前，我要先讨论一下这个方法通常有的好处和坏处</u>。」</b><br><b>★★ 他选的顺序是：<u>① 范式的优劣 ⇒ ② 架构的细节 ⇒ ③ MLM 和 NSP 的具体做法</u>。</b><br><b>★★★ 而「<u>先讲优劣</u>」这个顺序比「先讲细节」好，理由是实在的</b>：<b>⇒ 如果你先学了 MLM 的 80/10/10 规则、segment embedding 的细节，<u>然后才知道「哦这套方法原来不能生成」</u> —— <u>那些细节对你来说就是无根的</u>。</b><b>⇒ 而<u>先知道这套做法能干什么、不能干什么、代价是什么</u>，后面每一个细节你都能挂上去。</b><br><b>★★ 这是一个通用的学习顺序建议：<u>学任何一个方法，先问「它适用于什么、它的代价是什么」，再问「它怎么实现」</u>。</b><b>⇒ <u>前者决定了你会不会用它，后者只决定你会不会写它</u>。</b><b>⇒ 而前者的价值在实践中大得多。</b>");
  SUM(0,44,{h:"NSP 不是 decoder 的活",k:"一个敏锐的提问：<b>这里还是只有一个 encoder 吗？因为「下一句预测」看起来像是一个 decoder 的任务</b>。⇒ 答：<b>NSP 实际上是我们把两个句子一前一后放进去，然后预测它们是不是真的连续 —— 所以它是一个「分类任务」</b>。",m:"★★★ 把输入输出写清楚疑问就消失了：<b>输入是 [CLS] 句子A [SEP] 句子B [SEP]（两个句子都已经给了），输出是一个二分类标签（IsNext / NotNext）</b> ⇒ <b>它什么都不生成</b>，只是在 CLS 的输出嵌入上接一个二分类头，<b>和情感分类的结构完全一样 ⇒ 不需要 decoder</b>。⚠ 名字里的「<b>Next</b>」说的不是「要生成下一句」，而是「<b>要判断它是不是下一句</b>」—— <b>一个字的差别（generate vs judge）决定了需不需要半个模型</b>。",w:"★ 这个怀疑之所以合理有两层：<b>① 名字里有 prediction，而预测听起来像生成；② 名字里有 Next，而「下一个」在这门课里一直和 next token prediction（自回归生成）绑在一起</b>。⇒ 很好的例子说明<b>术语的命名会误导理解</b>：如果它叫 <b>Sentence Pair Classification（句对分类）</b>，学生根本不会有这个疑问 —— <b>而它的实际内容就是后者</b>。⇒ 所以<b>读论文别太信名字，去看它的输入和输出是什么</b>。",r:"⇒ 顺带：<b>NSP 的训练数据是白拿的</b> —— 从语料里取相邻两句标 IsNext、随机取两句标 NotNext，<b>一条标注都不用人工做</b>。★★ 而讲者接下来选的顺序值得说：<b>① 范式的优劣 ⇒ ② 架构的细节 ⇒ ③ MLM 和 NSP 的具体做法</b>。「先讲优劣」比「先讲细节」好的理由很实在：<b>如果你先学了 MLM 的 80/10/10、segment embedding 的细节，然后才知道「哦原来这套不能生成」，那些细节对你就是无根的</b>。⇒ 通用建议：<b>学任何方法先问「它适用于什么、代价是什么」，再问「怎么实现」—— 前者决定你会不会用它，后者只决定你会不会写它</b>。"});
  QUIZ(0,44,{t:"NSP（下一句预测）为什么不需要 decoder？",o:["两个句子都已经给了，输出只是一个「是不是连续」的二分类标签 —— 它什么都不生成","因为它只用第一句","因为 encoder 也能自回归生成","因为它在预训练阶段不反向传播"],a:0,w:"⚠ 名字误导了：如果它叫 Sentence Pair Classification，根本不会有这个疑问。⇒ 读论文别太信名字，去看输入和输出。"});
});
KP("45 · 这套「预训练 + 微调」的好处与坏处",function(){

  note("⚠ 而这正是整个预训练范式成立的基础",640,362,"r");},"<b>这是好处里最根本的那一条，而它的论证方式值得体会。</b><br><b>讲者的话</b>：<b>「<u>那么在好处这一面：这个预训练机制可以在相当没有标注的数据上做。所以你仍然有这个下一句预测的任务，但这是某个你控制的东西，因为你知道哪些句子是彼此相接的。所以它是某个你知道它是自监督的东西</u>。」</b><br><b>★★★ 「<u>因为你知道哪些句子是彼此相接的</u>」—— 这就是自监督的全部诀窍</b>：<b>⇒ 你拿到的是一段<u>没有任何标注</u>的文本。</b><b>⇒ 但这段文本<u>自带结构</u>：句子有顺序、词有位置。</b><b>⇒ <u>而你可以把这个结构「藏起来一部分」，然后让模型把它猜回来</u>。</b><br><b>★★ 于是标签是免费的：<u>它不是人标的，是从数据本身的结构里抽出来的</u>。</b><b>⇒ 相邻两句 ⇒ 标签 IsNext。随机两句 ⇒ 标签 NotNext。<u>一行人工都没有</u>。</b><br><b>⇒ <u>这就是「自监督（self-supervised）」这个词的意思：监督信号来自数据自己</u>。</b><br><b>⚠ 而这是整个现代 AI 的地基，不只是 BERT：<u>GPT 的 next-word prediction 是自监督，图像的对比学习是自监督，掩码自编码也是</u>。</b><b>⇒ <u>因为只有自监督能用上「全部的数据」，而标注永远只能覆盖很小一块</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 注意他用了两个词：self-supervised（NSP）和 unsupervised（MLM）",640,362,"r");},"<b>这一镜把 MLM 也归进来，而讲者用词上有一个小小的不一致值得指出。</b><br><b>他的话</b>：<b>「<u>而掩码语言模型这个任务 —— 我们会看它是怎么构成的 —— 但它也是某种无监督的东西。所以这是一个从未标注数据里学到有意思嵌入的非常有趣的方式。而实践中我们看到，这些未标注的数据确实导向了有用的表示被学到</u>。」</b><br><b>★★ 用词上的小不一致：<u>他把 NSP 叫 self-supervised（自监督），把 MLM 叫 unsupervised（无监督）</u>。</b><br><b>⇒ 按今天通用的说法，<u>两个都是自监督</u>。</b><b>⇒ <u>无监督</u>一般指「完全没有预测目标」的方法（聚类、降维、密度估计）；<u>而 MLM 明明有一个预测目标（被遮住的那个词）</u>。</b><br><b>★★★ 不过这个用词混用在 2018–2020 年非常普遍，<u>而讲者的实质判断是对的</u>：<u>两者都不需要人工标注</u>。</b><br><b>⇒ 所以不必在术语上纠结，<u>但知道这个区别能让你读文献时不被绕晕</u>。</b><br><b>★ 而他那句实证补充很重要：「<u>实践中我们看到这些未标注数据确实导向了有用的表示</u>」。</b><b>⇒ <u>这件事在 2018 年之前是存疑的</u>。<u>「在无关的任务上训练能帮上忙」听起来不太可信，而 BERT 把它证实了</u>。</b>");

  note("⚠ 当时它是「设计选择」，这里它是「坏处」—— 同一件事的两种说法",640,362,"d");},"<b>第一个坏处，而它和十三分钟前那句话恰好是同一件事的两面。</b><br><b>讲者的话</b>：<b>「<u>然后关于坏处 —— 我们当然有所有那些文本生成任务是够不着的，因为我们没有 decoder</u>。」</b><br><b>★★★ 回想 <u>68:07</u> 那一镜：学生说「你这样没法做生成」，讲者答「<u>是的，那正是重点</u>」。</b><br><b>⇒ 而现在同一件事被列为<u>坏处</u>。</b><b>⇒ <u>这不矛盾</u> —— 它取决于你站在哪里看：</b><b>⇒ <u>如果你的任务是分类</u>：不能生成是「省掉了无用的一半」⇒ <u>优点</u>。</b><b>⇒ <u>如果你想要一个通用模型</u>：不能生成是「永远只能做一类事」⇒ <u>缺点</u>。</b><br><b>★★ 而历史选了后一个视角，<u>这正是 BERT 这条路最终被边缘化的根本原因</u></b>：<b>⇒ 2018 年大家要的是「<u>把每个 NLP 任务都做好</u>」⇒ BERT 完美。</b><b>⇒ 2023 年大家要的是「<u>一个能对话、能写代码、能推理的东西</u>」⇒ <u>BERT 做不到，而且永远做不到</u>。</b><br><b>⇒ <u>需求变了，而一个结构性的限制没法靠改进来绕过</u>。</b>");

  note("⇒ 讲者接着说：我这里有一些变体的名字，待会儿会深入其中两个",640,362,"d");},"<b>第二个坏处常被忽略，但它在实践中很真实。</b><br><b>讲者的话</b>：<b>「<u>而且我们也可以把这个两阶段的流程、以及「我们需要进一步去调那些嵌入」这件事，看成是某种需要被跨过去的障碍。所以当你把这种方法论和那些更传统的、可以一次搞定的方法相比时 —— 这可能可以被看成一个缺点</u>。」</b><br><b>★★ 「<u>一次搞定（one shot）</u>」指的是传统做法：<u>拿到数据，训一个模型，完事</u>。</b><br><b>★★★ 而两阶段带来的实际麻烦有几样，<u>它们都不是学术问题而是工程问题</u></b>：<b>⇒ ① <u>你得先搞到一个预训练模型</u>。自己训要几百张 GPU 几周 —— <u>所以你实际上依赖别人发布的权重</u>。</b><b>⇒ ② <u>微调本身也要调参</u>：学习率、冻不冻结、训几轮。<u>调坏了会「灾难性遗忘」</u>。</b><b>⇒ ③ <u>两个阶段的数据分布不一致时，效果会打折</u>（比如用通用语料预训练、拿去做医学文本）。</b><br><b>★★ 不过历史给了这条「坏处」一个有意思的回应：<u>今天这个门槛反而更高了（预训练一个 LLM 要上千万美元），但它被彻底外部化了</u>。</b><b>⇒ <u>你不再自己预训练，你调 API 或者下载权重 —— 于是那道门槛对使用者消失了</u>。</b>");
  SUM(0,45,{h:"这套「预训练 + 微调」的好处与坏处",k:"<b>好处</b>：① <b>预训练机制可以在「相当没有标注」的数据上做</b> —— <b>NSP 是「你控制的」，因为你知道哪些句子彼此相接 ⇒ 它是自监督的</b>；而 <b>MLM 也是无监督的 ⇒ 这是从未标注数据里学到有意思嵌入的一个非常有趣的方式</b>，且<b>实践中这些未标注数据确实导向了有用的表示</b>。② <b>你只需要很少的数据就能在它上面搭东西 —— 微调时从那些非常好的嵌入出发、只有少量几个权重要调，而这通常导向超过当时 SOTA 的性能</b>。<b>坏处</b>：① <b>所有文本生成任务都够不着，因为没有 decoder</b>；② <b>两阶段流程、以及还要进一步调嵌入这件事，可被看成一道要跨过去的障碍</b>（和「一次搞定」的传统方法相比）。",m:"★★★ 「<b>因为你知道哪些句子是彼此相接的</b>」就是自监督的全部诀窍：<b>文本自带结构（句子有顺序、词有位置），而你可以把这个结构藏起来一部分、让模型猜回来 ⇒ 标签不是人标的，是从数据本身的结构里抽出来的</b>。⇒ 这是整个现代 AI 的地基，不只是 BERT（GPT 的 next-word、图像的对比学习、掩码自编码都是）—— <b>因为只有自监督能用上「全部的数据」，而标注永远只覆盖很小一块</b>。",w:"★★★ 把两个好处拼成一句话就是 BERT 的价值主张：<b>用海量无标注数据学通用能力（便宜、量大）＋ 用少量标注数据学具体任务（贵、量小）⇒ 超过那些「只用标注数据从头训」的方法</b>。配上数字才有体感：<b>1.1 亿参数的主干 + 1536 个参数的分类头 ⇒ 几千条标注就够训那 1536 个，而从头训 1.1 亿需要几百万条</b>。⚠ 用词上的小不一致：<b>他把 NSP 叫 self-supervised、MLM 叫 unsupervised，而按今天的说法两个都是自监督</b>（无监督一般指「完全没有预测目标」的方法）—— 这个混用在 2018–2020 很普遍，实质判断是对的。",r:"★★★ 坏处一和 68:07 那句「<b>是的，那正是重点</b>」恰好是同一件事的两面，<b>不矛盾，取决于你站哪里看</b>：<b>任务是分类 ⇒ 不能生成是「省掉了无用的一半」（优点）；想要通用模型 ⇒ 不能生成是「永远只能做一类事」（缺点）</b>。⇒ 而历史选了后一个视角，<b>这正是 BERT 这条路被边缘化的根本原因</b>：2018 年大家要「把每个 NLP 任务都做好」⇒ BERT 完美；2023 年要「一个能对话、能写代码、能推理的东西」⇒ <b>BERT 做不到而且永远做不到 —— 需求变了，而结构性限制没法靠改进绕过</b>。⇒ 坏处二的实际麻烦都是工程问题：<b>① 你得先搞到一个预训练模型（所以实际依赖别人发布的权重）② 微调本身要调参，调坏了会灾难性遗忘 ③ 两阶段数据分布不一致时效果打折</b>。而历史的回应很有意思：<b>今天这道门槛更高了（预训练 LLM 要上千万美元），但它被彻底外部化了 —— 你调 API 或下载权重，于是门槛对使用者消失了</b>。"});
  QUIZ(0,45,{t:"「自监督」在 BERT 里具体是怎么做到不要人工标注的？",o:["用一个小模型给数据打标签","只用已经有标注的公开数据集","文本自带结构（句子有顺序、词有位置）⇒ 把结构藏起来一部分让模型猜回来，标签从数据自身结构里抽出来","用了半监督学习算法"],a:2,w:"★★★ 这是整个现代 AI 的地基：只有自监督能用上「全部的数据」，而标注永远只覆盖很小一块。"});

  note("⚠ 合并的目标是搭出你的「目标词表」",640,362,"r");},"<b>这是 L1 那段 tokenization 讨论的一个具体实例。</b><br><b>讲者的话</b>：<b>「<u>所以首先，一个有意思的点是它用了一个特定的 tokenizer，叫 WordPiece。所以你可以把它看成一个在你的训练集上学习的 tokenizer，基于那些「最大化似然」的合并规则。所以基本上你有某个巨大的训练集，然后你训一个 tokenizer，它把原子 token 合并起来，来搭出你的目标词表</u>。」</b><br><b>★★ 回想 L1：<u>子词切分（subword）是那四种切法里的折中方案</u>，而 WordPiece 是它的一种具体实现。</b><br><b>★★★ 「<u>最大化似然的合并规则</u>」是 WordPiece 和 BPE 的分界线，值得点一下</b>：<b>⇒ <u>BPE</u>（GPT 那边用的）：每一步合并<u>出现频率最高</u>的那一对。</b><b>⇒ <u>WordPiece</u>：每一步合并<u>能让语言模型似然提升最多</u>的那一对。</b><br><b>⇒ 区别在哪：<u>BPE 只看「这一对一起出现了多少次」；WordPiece 还看「它们单独出现的频率」</u>。</b><b>⇒ 所以如果 A 和 B 都很常见但只是偶然挨在一起，<u>BPE 可能把它们合并，而 WordPiece 不会</u>。</b><br><b>⚠ 实践中两者差别不大，<u>但知道这个区别能帮你读懂不同模型的 tokenizer 配置</u>。</b>");

  SUM(0,46,{h:"BERT 的改动清单，与 WordPiece",k:"讲者的讲法：<b>从原始 transformer「一步一步」走到 BERT</b>。改动清单一共三项：<b>① 把 encoder 部分抽出来 ② 接上那些新的目标函数（MLM + NSP）③ 外加一套「表示 token」的新技巧</b>。第三项之一：<b>WordPiece —— 一个「在你的训练集上学习」的 tokenizer，基于「最大化似然」的合并规则，把原子 token 合并起来搭出你的目标词表</b>。词表量级：<b>BERT 约 3 万；这类论文一般在 10⁴–10⁵；唯一例外是免 token 的方法（ByT5 的 2⁸ = 256）</b>。",m:"★★★ 三项改动的性质完全不同：<b>① 抽出 encoder = 架构上的删减（唯一动了网络结构的一项，而它只是「删掉一半」）② 新目标函数 = 训练方式的改动（网络没变，变的是损失）③ 新技巧 = 输入格式的改动</b>。⇒ 第三项其实有三样：<b>WordPiece、CLS/SEP、segment encoding</b>，而<b>只有 segment encoding 是 BERT 原创的</b>（WordPiece 之前就有，特殊 token 的思路也不新鲜）。",w:"★★★ 「<b>最大化似然的合并规则</b>」是 WordPiece 和 BPE 的分界：<b>BPE（GPT 那边）每步合并「出现频率最高」的那一对；WordPiece 每步合并「能让语言模型似然提升最多」的那一对</b> ⇒ 区别是 <b>BPE 只看「这一对一起出现多少次」，WordPiece 还看「它们单独出现的频率」</b> —— 所以 A、B 都很常见但只是偶然挨在一起时，<b>BPE 可能合并而 WordPiece 不会</b>。⚠ 实践中差别不大，但知道它能帮你读懂不同模型的 tokenizer 配置。",r:"★★ 这个量级能让你快速估算「词表侧」参数量（<b>嵌入矩阵 = 词表大小 × d_model</b>）：<b>BERT base 是 30000 × 768 ≈ 2300 万，而总共 1.1 亿 ⇒ 词表嵌入占约 21%</b>。★★★ 而对今天的大模型这个比例反过来了：<b>Llama 3 词表 128256（比 BERT 大四倍，为多语言和代码）、d_model 4096 ⇒ 嵌入约 5.2 亿，但模型总共 80 亿 ⇒ 词表只占 6.5%</b> ⇒ <b>模型越大，「词表要不要省」就越不重要</b> —— 这也是今天敢把词表开到十几万的原因。⇒ 另：「改动清单」这个讲法值得搬去读论文 —— <b>读一篇「在 X 基础上改进」的论文，第一件事是列出它改了哪几处</b>，多数时候那个清单短得出人意料。"});

  SUM(0,51,{h:"NSP 的做法，与论文记号和量级",k:"<b>NSP</b>：<b>从语料选两个句子，50% 的时候按原顺序并排放、另一部分按随机顺序；目标是让 CLS 之上的某个分类头判断 A 和 B 是不是连续的 —— 「这就是它做的全部」</b>，而「<b>假设</b>是它也有助于学到有用的嵌入」。<b>记号对照</b>（BERT 论文换了套字母）：<b>L = 原来的 n（层数）、H = 原来的 d_model（嵌入维度）、A = 原来的小 h（头数）</b>。<b>量级</b>：<b>原始 transformer 有 12 个堆叠的 encoder/decoder；参数量级 1 亿</b>。",m:"★★★ 问题恰恰在于 NSP <b>太</b>简单（这是 RoBERTa 后来指出的）：<b>随机配的两个句子往往来自完全不同的文档、讲完全不同的主题 ⇒ 模型只要判断「这两句主题一致吗」就能做对，根本不需要理解「顺序」或「连贯性」</b> ⇒ <b>一个能靠浅层特征解决的任务，提供的学习压力很小</b>。这就是「假设」这个词第四次出现的原因（78:25、78:58、86:26、这里）。",w:"⚠ 记号对照表很实用，因为<b>同一个字母在两篇论文里意思不同</b>：<b>transformer 论文里 h 是头数，BERT 论文里 H 是嵌入维度（头数叫 A）</b> ⇒ 看到 <b>H = 768</b> 那是维度、<b>h = 12</b> 那是头数，<b>大小写差一点意思完全不同</b>。⇒ BERT 的两个配置值得记：<b>base（L=12, H=768, A=12）1.1 亿参数；large（L=24, H=1024, A=16）3.4 亿参数</b>，而 <b>base 的规模是为了和 GPT-1 可比而选的</b>（要论证「双向比单向好」就得让两边规模一样，否则比的是规模不是架构）。",r:"⭐ 读论文建议（这一讲第二次）：<b>BERT 这篇「读起来非常好」，和《Attention is All You Need》并列的里程碑，17 万引用</b>。★★★ 对照 Afshine 说 transformer 那篇「<b>非常密、只有几页长</b>」—— 差别是真实的：<b>Attention is All You Need 要在 9 页里提出一整个新架构，每句压缩到极限；而 BERT 是在已有架构上改，所以有篇幅解释动机、做消融、讨论对比</b> ⇒ <b>只读一篇的话先读 BERT</b>。⇒ 实用小知识：<b>cased / uncased 表示对数据做了什么预处理</b> —— <b>NER 必须用 cased</b>（Apple 和 apple 是公司和水果的关键线索），<b>情感分类 uncased 更好</b>（THIS IS AMAZING 和 this is amazing 意思一样），而 uncased 还顺带<b>提高词表利用率</b>。⚠ 这类「选哪个预训练版本」的决定<b>在实践中对效果的影响常常比调参更大</b>。⇒ 量级放到今天小得惊人（GPT-3 是 BERT large 的 500 倍），<b>但 BERT base 至今仍被大量使用 —— 1.1 亿参数能在普通显卡上跑、延迟毫秒级，对一个情感分类服务这比「更聪明」要紧得多</b>。"});
  QUIZ(0,51,{t:"RoBERTa 后来指出 NSP 的问题在哪？",o:["它需要额外的标注","它和 MLM 的梯度冲突","它太简单：随机配的两句往往来自不同文档/主题 ⇒ 只要判断「主题一致吗」就能做对，不需要理解顺序或连贯性","它的正负样本比例不对"],a:2,w:"⚠ 记号别混：transformer 论文里 h 是头数，BERT 论文里 H 是嵌入维度（头数叫 A）。BERT base 是 L=12, H=768, A=12，1.1 亿参数。"});

  SUM(0,52,{h:"微调阶段，与两个例子",k:"微调：<b>拿预训练阶段学到的一切、把那些权重「冻住」，在 CLS 之上或在「感兴趣的那些 token」之上放一个分类用的线性层</b>，只学那里的线性嵌入。而方案不止一种：<b>可以全冻只训小权重，或者把整个东西重新训一遍</b> —— 选择<b>取决于「你愿意重训网络的多大一部分」以及「这个分类任务和原预训练任务差别有多大」</b>。两个例子：<b>情感抽取（在 CLS 之上建分类层）</b>；<b>问答（检测回答的起始和结束 span ⇒ 一个「token 层面」的目标函数）</b>。",m:"★★★ 两个挂法对应两类任务：<b>挂在 CLS 上 ⇒ 句子级（情感分类、句对关系、主题分类），输出一个标签；挂在每个 token 上 ⇒ token 级（NER、词性标注、问答 span 定位），每个位置输出一个标签</b>。⇒ 情感抽取的完整流程：<b>[CLS] this movie was great [SEP] → 12 层 encoder → 取第 0 个位置的 768 维向量 → 768×2 的线性层 → softmax</b>，<b>其余所有 token 的输出向量被直接丢掉</b>（这正是后面两个课堂提问的焦点）。",w:"★★★ 第二条判据是真正有用的那条：「<b>分类任务和预训练任务差多远</b>」—— <b>差得近（通用英文语料 → 英文新闻分类）冻住大部分就够；差得远（通用语料 → 医学论文实体识别）必须让更多层参与训练</b>，因为底层表示需要适应新的词汇分布和语法风格。⇒ 还有一条讲者没说的：<b>你有多少标注数据</b>（几百条 ⇒ 全部重训会过拟合、冻住更安全；几万条 ⇒ 全部重训更好）。⚠ 常用折中：<b>只解冻最后几层</b>（高层编码任务相关特征，底层编码通用语言特征）；而实践中最常用的其实是<b>全部重训但用很小的学习率</b>（2e-5 量级）。",r:"★★ 抽取式问答的设计很巧妙：输入 <b>[CLS] 问题 [SEP] 文档 [SEP]</b>（这就是 SEP 和 segment encoding 的用处），输出对文档里<b>每个 token 算两个分数（是答案开头吗 / 是答案结尾吗）</b>，取各自最高的位置、中间那段就是答案。⇒ 巧在<b>它把「生成答案」变成了「在原文里划一段」</b> ⇒ <b>一个不能生成的模型也能做问答，而且答案一定来自原文、不会编造</b>（今天我们管编造叫 hallucination）。⚠ 限制也在这里：<b>答案必须是原文里连续的一段</b> —— 需要综合多处信息或需要改写的问题做不了，<b>而那正是生成式模型今天的优势</b>。"});

  note("⇒ 所以你有某个长度的隐藏层 ⇒ 典型地两个矩阵：一个投到隐藏层、一个从隐藏层到输出",640,364,"d");},"<b>这个提问问的是那个分类头的内部结构，而答案把形状说清楚了。</b><br><b>学生的问题</b>：<b><u>这个 FFN 对应的是什么？</u></b><br><b>讲者的回答</b>：<b>「<u>所以基本上你有一个「输出嵌入的维度」和「你感兴趣的那个任务」之间的映射。所以它可能是分成正面或者负面这样的分类。所以你有某个长度的隐藏层。所以你典型地有两个矩阵，来学从一个到那个隐藏层、然后从隐藏层到输出的投影。然后你学这些权重，来基于它在这里学到的那些嵌入去做那个分类任务</u>。」</b><br><b>★★ 所以这个分类头不一定只是一层线性，<u>它可以是「两层 + 一个隐藏层」</u></b>：<b>⇒ <u>768 → 隐藏层 → 2</u>。</b><b>⇒ 两个矩阵，中间一个非线性激活。</b><br><b>★★★ 注意这和 79:29 那镜说的「<u>典型是一个线性投影</u>」有一点出入，<u>而两者都对</u></b>：<b>⇒ <u>最简单的做法是一层线性</u>（768 × 类别数）。</b><b>⇒ 而<u>实际的 BERT 实现（以及 Hugging Face 的默认）在 CLS 上先过一个「pooler」</u>：<u>768 → 768 的线性层 + tanh</u>，<u>然后才是分类层</u>。</b><br><b>⇒ <u>所以确实是两个矩阵，讲者说的是对的</u>。</b><b>⚠ 而这个 pooler 是在预训练时（为 NSP）就训好的，<u>微调时继续用</u>。</b>");
  SUM(0,53,{h:"⭐ teddy bear 端到端走查（上）",k:"例句第三次登场：<b>this teddy bear is so cute</b>。走查步骤：<b>① uncased 设置下预处理 —— 全部变小写，然后施加 WordPiece ② 开头加 [CLS]、加 [SEP] ③ 还有 PAD token 把序列填满到末尾（因为按 batch 训练，而 batch 是固定长度的矩阵）④ 三样嵌入叠起来：词嵌入（索引↔表示的巨大查表）＋ 位置嵌入 ＋ 新的 segment 嵌入 ⑤ 过整个 encoder 架构 ⑥ 对情感抽取：不在乎非 CLS 的输出嵌入，只取 CLS 的输出嵌入、在那里插一个线性层</b>。",m:"★★★ 讲者在 97:02 做了一次<b>重要的自我更正</b>：「现在你有某个位置感知的、以及上下文感知的 —— <b>所以还不是上下文感知的，但这里是 segment 感知的</b>」。⇒ 把这个区别钉死：<b>进 encoder 之前每个位置的向量知道「我是什么词、我在第几位、我属于哪一句」，但不知道「我周围有什么词」</b>；<b>「上下文感知」是自注意力的产物，不是输入嵌入的性质</b> —— 过了 12 层之后每个位置的向量才是整句话的一个函数。⇒ 这是 L1 那条线的回声：<b>word2vec 的嵌入是静态的（一个词永远一个向量），transformer 的输出是上下文相关的</b>。",w:"★★★ <b>PAD 和 CLS、SEP 有本质区别</b>：<b>CLS 和 SEP 携带功能（汇总器、分隔符），模型要学会用它们；而 PAD 什么都不携带，它存在的唯一理由是让 batch 里长短不同的句子能拼成矩形张量</b> ⇒ 正因如此<b>你必须让模型忽略它</b>：做法是 <b>attention mask —— softmax 之前把 PAD 位置的分数设成 −∞</b>。⚠ 实践中很常见的 bug：<b>忘记传 attention mask</b> —— 模型把 PAD 当真实词去关注，句子越短污染越严重，<b>而这个 bug 不会报错，只会让效果莫名其妙地差</b>。",r:"★★ 一个有意思的推论：<b>对单句任务（像这个例句），全部 token 都用 segment A，而 segment 嵌入就是「加在所有位置上的同一个常数向量」—— 它不改变任何两个 token 之间的差异，所以对注意力几乎没有影响</b> ⇒ <b>在单句任务上 segment 嵌入基本是个摆设</b>，它只在双句任务里真正起作用（这也解释了 RoBERTa 删掉 NSP 后很多人连 segment 嵌入也一起简化掉）。⇒ WordPiece 的记号值得知道：<b>teddy 不在词表时被切成 ted + ##dy，而 ## 表示「这一片接在前一片后面、中间没有空格」</b> —— 没有这个标记就<b>没法从 token 序列无损还原原文</b>；<b>BPE（GPT 那边）用相反的约定：Ġ 或空格字符标记「词首」</b>。⇒ 那个 FFN：<b>输出嵌入维度和你的任务之间的映射，典型是两个矩阵（到隐藏层、隐藏层到输出）</b> —— 而实际 BERT 实现在 CLS 上先过一个 <b>pooler（768→768 线性 + tanh，预训练时为 NSP 训好的）</b>，然后才是分类层。"});
  QUIZ(0,53,{t:"进 encoder 之前，BERT 的输入嵌入「不知道」什么？",o:["不知道「我周围有什么词」—— 上下文感知是自注意力的产物，不是输入嵌入的性质","不知道自己是什么词","不知道自己属于哪一句","不知道自己在第几个位置"],a:0,w:"★★★ 讲者当场自我更正了这一点（「所以还不是上下文感知的，但这里是 segment 感知的」）—— 它确实是入门时最常被混淆的一点。"});

  note("⚠ 关键词：mixed（混进去了）—— 信息没有被丢掉，它被搬家了",640,386,"r");},"<b>这是真正的答案，而关键词是「混进去了」。</b><br><b>讲者的话</b>：<b>「<u>而这个 token 的魔法在于：encoder 里那些自注意力机制已经把每一个别的 token 的表示混进了那个表示里，使得那些输出嵌入是上下文感知的。所以基本上，它是一个面向分类的嵌入。而这就是我们说会插进那个线性层的东西</u>。」</b><br><b>★★★ 「<u>混进去了（mixed）</u>」这个词把那个「浪费」的疑虑彻底解掉了</b>：<b>⇒ 你丢掉的不是<u>信息</u>，而是<u>信息的其它副本</u>。</b><br><b>★★ 把 CLS 走过的路数一遍，这个「混」才具体</b>：<b>⇒ <u>第 1 层</u>：CLS 对全部 n 个 token 做注意力 ⇒ 它的向量成了 n 个输入嵌入的加权和。</b><b>⇒ <u>第 2 层</u>：CLS 再对全部 token 做注意力，<u>而那些 token 的表示本身已经是第 1 层混合过的</u>。</b><b>⇒ ⋯⋯ <u>第 12 层</u>：CLS 的向量是整句话的一个<u>十二重嵌套的</u>非线性函数。</b><br><b>⇒ <u>所以 CLS 的那 768 个数，确实「见过」每一个 token，而且见过很多次</u>。</b><br><b>⚠ 而「<u>面向分类的（geared towards classification）</u>」这个说法也值得留意：<u>CLS 的表示不是通用的，它是被 NSP 训出来的「适合做句子级分类」的那种表示</u>。</b>");

  SUM(0,54,{h:"⭐⭐ 为什么能把其它输出嵌入全丢掉",k:"讲者：<b>这就是我一直在等的那个问题</b>。答：<b>我们这里不需要它们 —— 我们在做分类，而「在某个 token（比如 CLS）之上操作」是我们定的一个「约定」</b>。而这个 token 的<b>魔法</b>在于：<b>encoder 里那些自注意力机制已经把「每一个别的 token 的表示」混进了那个表示里，使得输出嵌入是「上下文感知的」⇒ 它基本上是一个「面向分类」的嵌入</b>。⚠ 补丁：<b>「扔掉其它嵌入」只是分类这个情形下做的事 —— 如果在 token 层面做分类，它们每一个都可能被用到</b>。",m:"★★★ 「<b>混进去了（mixed）</b>」这个词把「浪费」的疑虑彻底解掉：<b>你丢掉的不是信息，而是信息的其它副本</b>。⇒ 把 CLS 走过的路数一遍：<b>第 1 层 CLS 对全部 n 个 token 做注意力 ⇒ 它的向量成了 n 个输入嵌入的加权和；第 2 层再做一次，而那些 token 的表示本身已经被第 1 层混合过；⋯⋯第 12 层 CLS 的向量是整句话的一个十二重嵌套的非线性函数</b> ⇒ <b>CLS 那 768 个数确实「见过」每一个 token，而且见过很多次</b>。",w:"★★ 「<b>约定</b>」这个词承认了这<b>不是唯一做法</b>：你也可以 mean pooling、max pooling、或用最后一个 token（GPT 那边就是）。⇒ 而这几种效果差距不大，<b>这本身说明信息在 12 层之后已高度混合 —— 从哪个位置读都能读到整句信息</b>（有研究发现句子相似度任务上 <b>mean pooling 实际比 CLS 更好</b>）。⇒ <b>CLS 不是「正确答案」而是「BERT 选的答案」—— 它有效是因为预训练时 NSP 就在 CLS 上做，这个位置被专门训练过</b>。",r:"★★★ 这个补丁揭示了 BERT 架构真正的通用性：<b>同一个预训练模型、同一套权重，接不同的头就能做两类完全不同形状的任务 —— 句子级取 1 个向量、token 级取 n 个向量</b>，而 <b>encoder 本身完全不知道你要做哪一类，它只负责把每个位置都编码好</b>。⇒ 这是「通用表示」的具体含义：<b>不是「一个向量能干所有事」，而是「一组向量，让你按需取用」</b>。⇒ 问答的形状：<b>两个 FFN（起始头、结束头）各 768×1，施加到每个嵌入上 ⇒ n 个起始分数、n 个结束分数，取 argmax（约束 start ≤ end）</b> —— <b>加 1536 个参数就会做抽取式问答</b>。⚠ 经典缺陷：<b>没有「无答案」选项</b>，文档里没答案时模型还是会划一段（SQuAD 2.0 专门加了无答案样本，通常让 CLS 代表「没有答案」）。"});

  SUM(0,56,{h:"BERT 的好处与三个局限",k:"<b>好处</b>：<b>你有的是「上下文的（contextual）」嵌入</b> —— 基于这些学到的嵌入，<b>学任何你想要的分类任务都非常容易</b>，这个灵活性在当时被大大赞赏；而<b>它在工业界被广泛使用 —— 任何涉及情感检测或其它分类任务的事，今天用一个「BERT 类」模型非常常见</b>。<b>三个局限</b>：<b>① 上下文长度只有 512 ② 延迟可能被看成高（BERT base 还有 1.1 亿参数，相当多）—— 有办法更小更快吗？③ MLM 和 NSP 这两个目标函数真的都有帮助吗？能简化预训练吗？</b>",m:"★★★ 「<b>上下文的</b>」是对 L1 那条线的最终回答：<b>word2vec 一个词永远一个向量（「bank」在 river bank 和 bank account 里相同），而 BERT 里一个词的向量取决于它出现在哪句话 ⇒ 两个 bank 得到两个不同向量</b> —— 这就是从「词嵌入」到「上下文嵌入」那一步，它解决的是<b>一词多义</b>。⇒ 讲者把 ELMo 并列提出来是对的：<b>contextual embedding 这个概念确实是 ELMo 先提的</b>（论文标题就是 Deep contextualized word representations），BERT 做得更好但首创不在它。",w:"★★★ 为什么 LLM 时代 BERT 没过时，理由非常实在：<b>成本（1.1 亿参数在便宜显卡上几千条每秒，让 LLM 做同样分类成本高几个数量级）、延迟（BERT 一次前向毫秒级，LLM 逐 token 生成是秒级）、确定性（BERT 输出概率分布、稳定可复现，LLM 要解析文本而且可能不按格式回答）</b>。⇒ 今天一个常见的工程选择：<b>用 LLM 标注数据，然后蒸馏一个 BERT 上线 —— LLM 负责「贵但聪明」，BERT 负责「便宜且稳定」</b>。⚠ 更一般的结论：<b>任务形状固定而且量很大时，专用小模型几乎总是比通用大模型划算</b>。",r:"⚠ 关于 512 还有一个比算力更硬的原因讲者没提：<b>BERT 用的是「学出来的」位置嵌入，所以表只有 512 行 —— 第 513 行根本不存在</b>（正是 13:51 那个局限二）⇒ <b>BERT 的 512 是双重限制：算力上 O(n²) 太贵，而结构上位置表没有更多行；后者是硬的 —— 哪怕有无限算力，BERT 也处理不了 513 个 token</b>。★★ 而局限二、三正好对应 69:10 预告的那两条「改进的轴」：<b>局限二 ⇒ DistilBERT，局限三 ⇒ RoBERTa</b>。⇒ 这个讲法结构值得当模板：<b>① 讲一个基准模型 ② 列出它的局限 ③ 每个局限对应一个后续模型</b> ⇒ <b>于是你记住的不是「三个模型的名字」而是「三个问题和三个答案」</b>。"});

  note("⇒ 讲者的评价：这非常有意思（which is very interesting）",640,336,"d");
  note("⚠ 所以蒸馏不是「另一种损失」—— 它是交叉熵的「推广」",640,368,"r");},"<b>这是整段最漂亮的一个观察，而它改变了你看蒸馏的方式。</b><br><b>讲者的话</b>：<b>「<u>而一个有意思的点，你在这里会看到的是：如果你那个 y_T 分布就只是一个硬标签，你就找回了交叉熵损失。所以如果你只有一个位置上是 1、其余地方全是 0，你就有 −log(y_S) —— 这非常有意思</u>。」</b><br><b>★★★ 把这个代换做一遍，它确实只有一行</b>：<b>⇒ KL(T‖S) = Σᵢ y_T⁽ⁱ⁾ · log(y_T⁽ⁱ⁾ / y_S⁽ⁱ⁾)。</b><b>⇒ 如果 y_T 在第 k 个位置是 1、其余是 0 ⇒ <u>只有 i = k 那一项不为零</u>。</b><b>⇒ 那一项 = <u>1 · log(1 / y_S⁽ᵏ⁾) = −log y_S⁽ᵏ⁾</u>。</b><b>⇒ <u>而这正是交叉熵</u>。</b><br><b>★★ 所以结论是：<u>蒸馏不是「另一种损失」，它是交叉熵的推广</u></b>：<b>⇒ <u>普通训练</u>：用一个 one-hot 的目标 ⇒ 交叉熵。</b><b>⇒ <u>蒸馏</u>：用一个「软」的目标 ⇒ KL 散度。</b><b>⇒ <u>两者是同一条公式，区别只在目标分布有多「尖」</u>。</b><br><b>⚠ 而这立刻解释了 L1 那个 <u>label smoothing</u> 在这条谱上的位置：<u>它把 one-hot 稍微抹平一点（0.9 / 0.1 之类）—— 介于两者之间</u>。</b><b>⇒ <u>one-hot、label smoothing、蒸馏 —— 一条连续的谱，差别只是目标分布的软硬程度</u>。</b>");
  SUM(0,57,{h:"⭐⭐ 知识蒸馏：软目标、teacher/student、KL",k:"Hinton / Vinyals / Jeff Dean 那句引言：<b>「soft targets（软目标）包含了几乎全部的知识」</b> —— 讲者的解读是<b>一个模型「输出的那个分布」其实非常有助于知道它学到了什么</b>。两个角色：<b>teacher（更复杂的模型）和 student（更小的模型）</b>，目标是<b>把输出「分布」映射过去，而不是去学硬标签</b>；<b>实践中你很快看到，学一个模型的分布比直接学硬标签更有帮助</b>。目标函数：<b>KL 散度 —— 「在 teacher T 描述的那个世界里，用 student S 去建模有多糟」</b>。⭐⭐⭐ 而<b>如果 y_T 就是一个硬标签（一个位置 1、其余 0），你就找回了交叉熵损失 −log y_S</b>。",m:"★★★ 「软目标包含几乎全部知识」用一个例子就懂：<b>硬标签说「是狗」，软目标说「狗 0.85、狼 0.10、猫 0.03、汽车 0.0001」</b> —— 后者多了<b>「狼和狗很像、而汽车完全不像」这个「类别之间的相似结构」，而硬标签把它整个抹掉了</b> ⇒ <b>模型真正学到的不只是「答案」，而是「整个相似度地图」</b>，而<b>让学生去学这张地图，比让它从头自己画一张容易得多</b>。",w:"★★★ 那个特例是整段最漂亮的观察，代换只有一行：<b>KL = Σ y_T log(y_T/y_S)，y_T 在第 k 位是 1 其余 0 ⇒ 只剩 1·log(1/y_S⁽ᵏ⁾) = −log y_S⁽ᵏ⁾ = 交叉熵</b>。⇒ 结论：<b>蒸馏不是「另一种损失」，它是交叉熵的推广 —— 两者是同一条公式，区别只在目标分布有多「尖」</b>。⚠ 而这立刻定位了 L1 那个 <b>label smoothing</b>：<b>one-hot、label smoothing、蒸馏是一条连续的谱，差别只是目标分布的软硬程度</b>。",r:"⚠ 留意 <b>KL 不对称</b>：这里是 <b>KL(T‖S)</b>，对「T 认为可能的那些结果」加权 ⇒ <b>T 说某类 0.3 而 S 说 0.001 惩罚很重；T 说某类 0 则 S 说什么都不罚</b> ⇒ 效果是<b>强迫 student 覆盖 teacher 认为可能的一切（mode-covering）</b>，而反方向是 mode-seeking。<b>蒸馏要的正是覆盖 —— 你希望小模型把大模型的整张相似度地图都学下来</b>。⇒ 为什么比直接用硬标签训小模型好：<b>① 信息量（每个样本的监督从「1 个类别」变成「一整个分布」，多几千倍）② 平滑性（teacher 的分布连续、带不确定性，天然起正则化作用，而 one-hot 迫使模型过度自信）</b>。★★ 另：这是讲者第三次确认前置知识，而<b>这次回答是「几个人」（前两次是「所有人」「答对了」）⇒ 他跟着改了讲法：不从定义或公式开始，而从一句引言建立直觉</b> —— 这就是「先确认前置再决定讲法」的实际价值：<b>它决定了起点放在哪</b>。"});
  QUIZ(0,57,{t:"为什么说「蒸馏不是另一种损失，而是交叉熵的推广」？",o:["因为两者都用 softmax","因为 teacher 的输出也是 one-hot","因为蒸馏的梯度和交叉熵相同","把 y_T 代成 one-hot，KL(T‖S) 就化简成 −log y_S，正是交叉熵 ⇒ 同一条公式，区别只在目标分布有多「尖」"],a:3,w:"⇒ 于是 one-hot、label smoothing、蒸馏构成一条连续的谱，差别只是目标分布的软硬程度。"});

  SUM(0,58,{h:"DistilBERT 与 RoBERTa，与整讲收尾",k:"<b>DistilBERT</b>（「一篇非常干净的论文，只有四页左右，但影响力超大」）：<b>把层数减半，你有很多收益而且性能几乎一样 —— 这非常了不起</b>；而他们<b>用蒸馏作为保住那个性能的办法 —— 这就是关键，连同减少层数</b>。<b>RoBERTa</b>：① <b>研究了「去掉 NSP 几乎没带来性能下降」这个事实 ⇒ 他们就把它删了</b>；② <b>动态地做掩码 —— 对一段给定文本，每个 epoch 都换一次掩码</b>；③ <b>一个数据策略：他们看到模型「被大大地训练不足（vastly undertrained）」⇒ 大幅增加数据的多样性和规模 ⇒ 基准性能在同样基准上提升相当多</b>。",m:"★★★ DistilBERT 两件事的分工别混：<b>减半层数是「目标」（12→6 层，1.1 亿→6600 万参数，推理快约 60%），蒸馏是「手段」—— 如果只是把一个 6 层 BERT 从头训一遍，效果会明显变差</b>。「性能几乎一样」的具体数字：<b>保留了 BERT base 约 97% 的 GLUE 分数 —— 用 60% 的参数、40% 更快的推理，换 3% 的性能损失</b>。⚠ 两个讲者没提的实现细节：<b>① 学生的初始化是从老师那里「隔层取」的 ② 损失是三项加权：蒸馏 KL + 自己的 MLM 交叉熵 + 让学生和老师隐藏状态对齐的余弦损失</b>。",w:"★★★ <b>vastly undertrained</b> 这四个字是整段最重要的发现，含义是：<b>BERT 的局限不在架构，而在它没被训够</b>。RoBERTa 具体做了什么：<b>数据从 16GB 到 160GB（10 倍）、batch 从 256 到 8000、训练步数大幅增加 —— 架构一个字没改，结果在所有基准上大幅超过 BERT</b>。⇒ 这在 2019 年是震动，<b>而它预告了整个领域的方向：如果一个模型「只是没训够」，那继续加数据、加算力就能变好 —— 这正是 scaling law 那条路的起点</b>（GPT-3、Chinchilla、今天所有前沿模型走的都是这个方向；Chinchilla 2022 把它量化了）。",r:"★★ 那条伏笔的<b>五次</b>铺垫终于收口，这是整讲叙事最漂亮的一条线：<b>78:25「可以被看成」→ 78:58「作者假定」→ 86:26「我们会看到它被质疑了」→ 90:44「假设是」→ 103:02「那两个真的都有帮助吗」→ 106:17 删掉它性能几乎没降</b>。⇒ 而 RoBERTa 用什么代替 NSP？<b>什么都不用 —— 只做 MLM，但把每条输入填满到 512 个连续 token，省下的算力全用在 MLM 上</b>。⇒ 动态掩码解决的问题很真实：<b>原始 BERT 在预处理阶段就把掩码定好存起来，训 40 个 epoch 就是同一句话被看 40 次、每次遮同一批词 ⇒ 模型有机会「记住」这个特定遮法而不是学会「填空」</b>；改成每次取数据时现场做 ⇒ <b>40 种不同遮法，相当于把数据量放大，而代价几乎为零（只是把一行代码从预处理挪到训练循环）</b>。⇒ 整讲三条主线：<b>① 位置编码演化（同一目标、五代手段，注入位置一路搬进注意力内部，终点 RoPE）② 「变了哪三个零件」的框架 ③ 三类架构与路线之争（decoder-only 赢的理由不是更聪明，是最容易扩大规模且和聊天对齐）</b>。而 BERT 那一大段的价值在于<b>它让你看清了那条没被走下去的路 —— 双向、填空、分类每一样都做得很好，而每一样都通不到 ChatGPT</b>。"});

    "收一下这一讲。<br><b>★★★ 一句话总结：骨架八年没换，但三个零件各换了一遍 —— 而每一次更换都能说出具体理由。</b><br><b>先把占了全讲三分之一时间（10:44–42:43）的那条线列完整，这是最该带走的东西</b>：<br><span class='w'><b>① 学出来的嵌入</b> —— 毛病有两个：<b>依赖训练集</b>（会把「位置 2 通常是什么」这种统计规律一起吸进去），而且<b>只能学到训练时见过的最大位置</b>（第 513 行根本不存在）。</span><br><span class='w'><b>② 正弦余弦</b> —— 治好了外推，而且用 cos(a−b) 证明了<b>点积只依赖相对距离</b>；但它是加在<b>输入</b>上的，而我们真正想影响的是<b>注意力层</b>。</span><br><span class='w'><b>③ T5 的相对位置偏置</b> —— 直接加进 softmax 里（把 m−n 分桶），但<b>要学</b>，于是又带回了过拟合。</span><br><span class='w'><b>④ ALiBi</b> —— 不学了，用确定性公式，<b>但太简单、太受限</b>（只是 n 和 m 的线性差）。</span><br><span class='k'><b>⑤ RoPE</b> —— 回到正弦余弦的世界，但改成<b>旋转 query 和 key</b>，于是 QKᵀ 天然只依赖 n−m，还多一个<b>长程衰减的上界</b>。今天多数模型用它。</span><br><b>⚠ 认准这条线的真正剧情：<u>量化的办法基本没变（一直是三角函数），变的是「注入的地方」—— 它一路从输入端搬进了注意力内部</u>。</b>");

    "<b>② 归一化，换了两处 —— 一处是位置，一处是形式。</b><br><span class='w'><b>位置：post-norm → pre-norm</b>。原来是 Norm(x + Sublayer(x))，现在是 x + Sublayer(Norm(x))。<b>差别在那条残差路径上：post-norm 里相加之后还要过一次 Norm，把「那条直路」挡住了；pre-norm 里 x 原封不动加上去 ⇒ 从最后一层到第一层有一条完全畅通的恒等路径</b>，于是能训深得多、几乎不需要 warmup。</span><br><span class='w'><b>形式：LayerNorm → RMSNorm</b>。砍掉了「减均值」和偏置 β，只剩「除以均方根 × 一个学出来的 γ」。<b>收敛性质相当，但少学一半参数、而且省掉一次全向量求和 ⇒ 更快</b>。</span><br><br><b>③ 注意力，两个方向，而讲者明说它们是「<u>正交的</u>」—— 意思是可以同时用。</b><br><span class='w'><b>滑动窗口</b>治 O(n²) 的<b>计算</b>：每个 token 只看左右各几千个邻居，而<b>感受野随层数累积（L 层 × 窗口 w）</b>，所以 Mistral 全是局部注意力也能撑 32K。</span><br><span class='w'><b>共享 K/V 投影（MQA / GQA / MHA）</b>治 KV 缓存的<b>显存</b>：三档其实只是一个参数 g（组数）的三个取值，<b>g=1 是 MQA、g=h 是 MHA</b>。</span><br><b>⚠ 这两件事常被混为一谈，但它们治的是<u>不同的资源</u> —— 而 Mistral 7B 正是两个一起用。</b>");
