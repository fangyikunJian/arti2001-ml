<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>
:root{
  --bg:#080B11; --ink:#F0F4FA; --dim:#93A1B5; --dimmer:#3D4658; --edge:#1B2230;
  --blue:#54A9F7; --yellow:#FFD36E; --green:#5BDDA8; --coral:#FF7C87; --violet:#B48BF5;
  --sans:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
mjx-container{color:inherit!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);margin:auto}
svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}

#eqBox{font-size:clamp(16px,2.5vw,36px);text-align:center;line-height:1.5;max-width:92%;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
#eqBox.off{opacity:0;transform:translateY(13px) scale(.97)}
#eqBox.top{align-self:flex-start;margin-top:4.5vh}

#big{font-family:var(--mono);font-size:clamp(30px,5.6vw,82px);font-weight:500;letter-spacing:-.03em;
  color:var(--yellow);text-shadow:0 0 44px rgba(255,211,110,.3);text-align:center;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
#big.off{opacity:0;transform:scale(.86)}
#big small{display:block;font-family:var(--sans);font-size:.22em;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);text-shadow:none;margin-top:.55em;font-weight:400}

/* caption band — pinned into the lower third, clears the strip, scrolls if long */
#capL{align-items:flex-end;pointer-events:none}
#capL::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46vh;
  background:linear-gradient(to top,var(--bg) 30%,rgba(8,11,17,.72) 62%,transparent);pointer-events:none}
#capWrap{max-width:min(84ch,94%);width:100%;max-height:62vh;overflow-y:auto;margin-bottom:50px;
  display:flex;flex-direction:column;align-items:center;pointer-events:auto;position:relative;z-index:2}
#cap{text-align:center;font-size:clamp(13.5px,1.56vw,22px);font-weight:400;line-height:1.55;
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#cap.off{opacity:0;transform:translateY(12px)}
#cap b{font-weight:600;color:var(--yellow)}
#cap i{font-style:normal;color:var(--blue);font-weight:600}
#cap em{font-style:normal;color:var(--green);font-weight:600}
#cap s{text-decoration:none;color:var(--coral);font-weight:600}
#narr{margin:.7em 0 0;max-width:min(90ch,100%);text-align:left;

  background:rgba(8,11,17,.86);border:1px solid rgba(46,58,82,.7);border-radius:12px;
  padding:12px 17px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:1}
#narr.off{opacity:0}
#narr[hidden]{display:none}
#narr b{color:#C6D2E2;font-weight:500}
#narr i{font-style:normal;color:var(--blue)}
#narr em{font-style:normal;color:var(--green)}
#narr s{text-decoration:none;color:var(--coral)}

#sum{max-width:min(1200px,94%);width:100%;max-height:90vh;overflow:auto;
  background:rgba(17,23,33,.975);border:1px solid #303D52;border-radius:18px;padding:34px 46px 34px;
  box-shadow:0 28px 74px rgba(0,0,0,.62);
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#sum.off{opacity:0;transform:translateY(16px) scale(.985)}
#sum[hidden]{display:none}
#sum .sh{font-family:var(--mono);font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--green);margin:0 0 9px}
#sum h3{font-size:clamp(24px,2.7vw,38px);font-weight:800;margin:0 0 26px;letter-spacing:-.02em;line-height:1.25;color:#F6F9FE}
#sum .rows{display:flex;flex-direction:column;gap:15px}
#sum .row{border-left:4px solid #3C4A61;padding:17px 24px;background:rgba(255,255,255,.03);border-radius:0 12px 12px 0}
#sum .rk{font-family:var(--mono);font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:#9EABBE;margin:0 0 8px}
#sum .rv{font-size:clamp(16px,1.45vw,21px);font-weight:400;line-height:1.88;color:#E3EAF5;margin:0}
#sum .rv b{color:#FFFFFF;font-weight:700}
#sum .rv i{font-style:normal;color:#7CC0FF;font-weight:600}
#sum .rv em{font-style:normal;color:#6FE3B4;font-weight:600}
#sum .rv s{text-decoration:none;color:#FF97A0;font-weight:600}
#sum .row.k{border-left-color:var(--green)}
#sum .row.w{border-left-color:var(--coral)}
#sum .row.e{border-left-color:var(--yellow)}
#sum .row.m{border-left-color:var(--blue)}
#sum .row.r{border-left-color:var(--violet)}

#quizL{align-items:center;pointer-events:none}
#quiz{max-width:min(72ch,91%);pointer-events:auto;background:rgba(13,18,26,.95);
  border:1px solid #253044;border-radius:14px;padding:23px 27px;
  transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.3,1)}
#quiz.off{opacity:0;transform:translateY(14px);pointer-events:none}
#quiz[hidden]{display:none}
#quiz .qh{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--yellow);margin:0 0 10px}
#quiz .qq{font-size:clamp(13.5px,1.5vw,20px);font-weight:600;margin:0 0 15px;line-height:1.45}
#quiz .qo{display:flex;flex-direction:column;gap:7px}
#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;
  color:var(--ink);background:rgba(255,255,255,.045);border:1px solid #2A3546;
  border-radius:8px;padding:10px 15px;cursor:pointer;text-align:left;line-height:1.5;transition:background .2s,border-color .2s}
#quiz button:hover:not(.lk){border-color:var(--blue);background:rgba(84,169,247,.13)}
#quiz button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#quiz button.lk{cursor:default}
#quiz button.ok{border-color:var(--green);background:rgba(91,221,168,.15);color:var(--green)}
#quiz button.no{border-color:var(--coral);background:rgba(255,124,135,.13);color:var(--coral)}
#quiz button.off2{opacity:.32}
#quiz .why{margin:15px 0 0;font-size:clamp(11.5px,1.15vw,15px);font-weight:300;color:#93A1B5;line-height:1.7;border-top:1px solid #1E2634;padding-top:12px}
#quiz .why[hidden]{display:none}
#quiz .why b{color:#C6D2E2;font-weight:500}
#quiz .why em{font-style:normal;color:var(--green)}
#quiz .why s{text-decoration:none;color:var(--coral)}
#quiz .why i{font-style:normal;color:var(--blue)}

#titleL{flex-direction:column}
#titleL h1{font-size:clamp(25px,4.7vw,68px);font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.07;text-align:center;text-shadow:0 0 70px rgba(84,169,247,.25)}
#titleL p{font-size:clamp(12px,1.32vw,18px);color:var(--dim);font-weight:300;margin:2vh 0 0;letter-spacing:.05em;text-align:center;max-width:62ch}
#titleL .act{font-family:var(--mono);font-size:clamp(11px,1.18vw,15px);color:var(--blue);letter-spacing:.28em;margin:0 0 2.2vh;text-transform:uppercase}
#titleL .rule{width:60px;height:2px;background:var(--blue);margin:3.2vh auto 0;box-shadow:0 0 18px rgba(84,169,247,.7)}
.fade{transition:opacity .6s ease;display:flex;flex-direction:column;align-items:center}
.fade.off{opacity:0}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}
.tok.hl{color:var(--yellow);text-shadow:0 0 24px rgba(255,211,110,.5)}
.tok.res{color:var(--green);text-shadow:0 0 24px rgba(91,221,168,.45)}
.tok.ded{color:var(--coral);opacity:.5}

#strip{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:6}
#kps{display:flex;gap:3px;flex:1}
.kpbar{display:flex;gap:2px;flex:1;position:relative;cursor:pointer}
.pip{height:2px;flex:1;background:var(--edge);border-radius:2px;transition:background .4s}
.pip.seen{background:#2E3B50}
.pip.now{background:var(--blue);box-shadow:0 0 9px rgba(84,169,247,.85)}
.pip.sum{background:#1D3A30} .pip.sum.seen{background:#2C5C4A}
.pip.quiz{background:#3A3218} .pip.quiz.seen{background:#5C4E22}
.kplbl{position:absolute;top:-15px;left:0;font-family:var(--mono);font-size:8px;color:var(--dimmer);letter-spacing:.06em;white-space:nowrap;transition:color .3s}
.kpbar.active .kplbl{color:var(--blue)}
#hint{font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#tc{position:fixed;top:18px;left:20px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.1em;text-decoration:none;pointer-events:auto}
#tc:hover{color:var(--blue)}
#tc[hidden]{display:none}
#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}
.navbtn{position:fixed;top:0;bottom:44px;width:14%;background:none;border:0;cursor:pointer;opacity:0;z-index:4}
#prev{left:0} #next{right:0}
.navbtn:focus-visible{opacity:1;outline:2px solid var(--blue);outline-offset:-6px}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}
.pt{fill:var(--ink)}
.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}
.box.r{stroke:var(--coral)} .box.v{stroke:var(--violet)}
.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}
.cellbg.hl3{fill:#3A1A1E;stroke:var(--coral);stroke-width:1.6}
.celltx{font-family:var(--mono);font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.celltx.d{fill:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* fix: 面板 .off 立即不可见 */
#big.off,#cap.off,#eqBox.off,#titleBox.off,#sum.off,#quiz.off{visibility:hidden}
</style>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

    n=Math.max(0,Math.min(SHOTS.length-1,n));

    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
    [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});

    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;

    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}

      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});
  go(0);
}

  note("⇒ 而这一讲的回顾特别长（约 8 分钟），因为自注意力是后面一切的地基",640,364,"d");},"<b>这一小段是过渡，但讲者的这个习惯值得专门点出来。</b><br><b>他的话</b>：<b>「<u>那么把这些放一边，我们进入今天的主题。不过在那之前，像往常一样，我们要做的是快速回顾一下前几集看过的东西</u>。」</b><br><b>★★ 「<u>像往常一样</u>」说明这是个固定环节，而它对你有一个很实际的价值：<u>每一讲的开头都有一份「前情提要」</u>。</b><br><b>⇒ 所以如果你想跳着看某一讲，<u>成本比想象中低</u> —— 讲者会先把你需要的前置知识复述一遍。</b><b>⇒ L5 开场回顾 L4 的两阶段训练，L6 开场回顾 L5 的 RL 与 GRPO 的前身，L7 开场回顾 L6 的推理模型和长度膨胀。<u>每一次都够你接上</u>。</b><br><b>★ 而这一讲的回顾特别长（差不多 8 分钟），原因也清楚：<u>自注意力是后面所有内容的地基</u>。</b><b>⇒ 而且他在回顾里补讲了一个 L1 没讲透的东西 —— <u>多头到底各自在学什么</u>，这正是下面几镜的内容。</b>");
  SUM(0,1,{h:"开场的两件后勤",k:"① 他们<b>回看了第 1 讲录像，发现音频不理想</b>，所以这一讲换了录音设备 —— ⚠ 代价是「我的声音不会在教室里传开」，他当场确认后排能否听清。② 期末考占位日期是 <b>12 月 10 日</b>，但在想办法挪早，当时还是 TBD。",m:"然后照例进入<b>固定环节：快速回顾上一讲</b>（「像往常一样」）。★ 这个习惯对跳着看的人价值很大 —— <b>每一讲开头都有一份前情提要</b>，所以跳着看的成本比想象中低。",w:"★ 第一条后勤对你有实际意义：<b>这九讲的字幕全部是高质量人工稿，而这个片子的每一处判断都带原话时间码，靠的正是这份字幕</b>。⚠ 第二条则旁证了这门课是「<b>正在进行时</b>」录的 —— 不是打磨过的脚本，而是一个学期里真实发生的九次课。",r:"⇒ 那些「不完美」恰恰是价值所在：讲者会说「我们还没出题」「我看了时间，来不及了」「这个我讲太快跳过去了」。而<b>他在时间不够时的取舍本身就是信息</b> —— 被他选择展开的，是他认为真正要紧的。⇒ 这一讲的回顾特别长（约 8 分钟），因为自注意力是后面一切的地基。"});
  QUIZ(0,1,{t:"讲者每讲开头「快速回顾上一讲」这个习惯，对自学者的实际价值是什么？",o:["方便考试复习","每一讲开头都有一份前情提要 ⇒ 跳着看某一讲的成本比想象中低","可以验证字幕是否准确","可以省去看前一讲"],a:1,w:"⇒ L5 回顾 L4 的两阶段训练、L6 回顾 L5 的 RL、L7 回顾 L6 的推理模型，每次都够你接上。而这一讲的回顾特别长，因为自注意力是后面一切的地基。"});
});
KP("2 · 回顾（一）：自注意力与 Q/K/V",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("01:38","what self-attention is that each token is attending to all other tokens in the sequence");
  note("L1 的核心概念，一句话复述",640,186,"v");
  boxNode(130,214,1020,44,"自注意力：每个 token 通过注意力机制，去「关注」序列里所有其它 token","g");
  note("⇒ 而这里的记号就是 queries、keys、values",640,292,"y");
  note("★ 注意他的措辞：「通过注意力这个机制」—— 关注不是直接的，是算出来的",640,322,"g");
  note("⚠ 而「所有其它 token」这几个字，正是 O(n²) 的来源（本讲后半会讲）",640,360,"r");},"<b>讲者用一句话复述了 L1 的核心，而这句话里埋着本讲后半要处理的那个问题。</b><br><b>他的话</b>：<b>「<u>如果你记得，第 1 讲讲的全是引入自注意力这个概念。而自注意力是什么？就是每个 token 都通过注意力这个机制，去关注序列里所有其它的 token。所以你有 queries、keys、values 这些记号</u>。」</b><br><b>★ 两个词值得留意</b>：<b>① 「<u>通过…这个机制</u>」—— 关注不是凭空的，<u>它是算出来的</u>（下一镜就是怎么算）；② 「<u>所有其它 token</u>」—— <u>每个都看所有，所以是 n × n</u>。</b><br><b>★★ 第二点正是本讲后半那一整段的起点：<u>讲者会在第 50 分钟说「当你做自注意力时，你基本上让每个 token 和所有其它 token 交互，所以你有 O(n²) 的复杂度，而这很多」</u>。</b><br><b>⇒ 于是就有了滑动窗口注意力。<u>而那个问题，就藏在这句一分钟的回顾里</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("02:09","basically we will be taking the associated value");
  note("Q/K/V 在做什么，讲者的复述版本",640,186,"v");
  seq(110,214,["query 发问","和每个 key 比，看谁最像","取出对应的 value"],["g","b","y"],340,44);
  note("⇒ 他的原话：query 会通过「比较 query 和 key」来问「哪些别的 token 和我最像」",640,290,"d");
  note("★ 而一旦比完，我们基本上就把「关联的那个 value」取出来",640,320,"g");
  note("⚠ 注意这个复述把 L1 那条公式的三步说完了，但没提「加权」",640,358,"r");
  note("⇒ 实际上是「按相似度加权取所有 value」，不是只取最像的那一个",640,386,"d");},"<b>Q/K/V 的复述，而我想补一句他这次没说的。</b><br><b>他的话</b>：<b>「<u>这里的想法是：query 会通过比较 query 和 key，来问「其它哪些 token 和它自己最相似」。然后一旦那一步做完，我们基本上就会取出关联的那个 value</u>。」</b><br><b>★ 这个复述很准，但它是个简版 —— <u>它说的像是「找到最像的那一个，取它的 value」</u>。</b><br><b>⚠ 而 L1 里讲得更完整：<u>不是挑一个，而是按相似度给所有 value 分配权重，再加权平均</u>。</b><b>⇒ 这个区别不是吹毛求疵：<u>「挑一个」是不可导的，没法用梯度下降训；而「加权」才让整件事能训起来</u>。</b><br><b>⇒ 下一镜那条公式里的 softmax，干的正是「把相似度变成一组加起来为 1 的权重」这件事。</b><br><b>★ 复述时的简化是讲课的常态，<u>而知道哪里被简化了，是你能不能从复述里真正受益的关键</u>。</b>");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$\\mathrm{Attention}(Q,K,V)=\\mathrm{softmax}\\!\\left(\\frac{QK^{\\top}}{\\sqrt{d_k}}\\right)V$$");
  says("02:09","So we saw that the self-attention mechanism can be expressed with this formula");
  note("讲者把它念了一遍，然后说：我希望这条公式对你已经熟悉了",640,198,"d");
  note("⭐ 而他紧接着补了一句很重要的话 —— 关于这条公式的「硬件性」",640,228,"y");
  note("⇒ 这条公式是被「高度优化」过的",640,258,"g");},"<b>那条公式又出现了，而讲者这次补了一句 L1 里只是一带而过的话。</b><br><b>他的话</b>：<b>「<u>我们看到自注意力机制可以用这条公式表达：softmax(QKᵀ/√d_k)·V。我希望这条公式对你们来说已经熟悉了。而只要知道一点：这条公式是被高度优化过的</u>。」</b><br><b>★★ 「<u>高度优化</u>」这四个字指向的是下一镜要说的事，而它比看起来重要</b>：<b>⇒ 一条公式「好不好」，不只看它数学上优雅不优雅，<u>还看它能不能被现有硬件高效执行</u>。</b><br><b>⇒ L1 里 Afshine 说过「<u>GPU 爱矩阵</u>」，而这里他把这件事往前推了一步。</b><br><b>⚠ 而「被高度优化」还有一层含义：<u>这条公式在实践中并不是照着字面算的</u>。</b><b>⇒ 本讲后面讲滑动窗口时，有学生问「既然要算 softmax，那限制窗口有什么用」，<u>讲者的回答正是「实践中有一堆实现用了聪明的办法，比如 tiling，根本不会去算那个巨大的矩阵」</u>。</b><b>⇒ 而那就是 L4 的 FlashAttention。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("02:41","These are big matrix multiplications, or hardware, is very capable of doing");
  note("⭐ 为什么这条公式「跑得快」",640,186,"v");
  boxNode(130,214,1020,44,"它是一些「大矩阵乘法」—— 而我们的硬件非常擅长做这件事","g");
  note("⇒ 讲者：硬件在做这件事上是被高度优化过的",640,292,"y");
  note("★ 把它和 L1 那句「GPU 爱矩阵」接起来，这条线就完整了",640,322,"g");
  note("⚠ 对照 RNN：递推是串行的，用不上「同时做几万个乘加」这个长处",640,360,"r");},"<b>这一镜把「为什么 transformer 能赢」的硬件那一面说完整了。</b><br><b>讲者的话</b>：<b>「<u>这些是大的矩阵乘法，而我们的硬件非常有能力做这件事 —— 它在做这件事上是被高度优化过的</u>。」</b><br><b>★★★ 把这句话和 L1 里 Afshine 那句「<u>GPU 爱矩阵，所以它真的是为我们手上这种硬件而做的</u>」接起来，一条完整的论证就出来了</b>：<b>⇒ ① <u>自注意力可以写成矩阵形式</u>（Q/K/V 这种表达方式给的）；② <u>矩阵乘法正是 GPU 的强项</u>；③ ⇒ <u>于是这个架构能把算力吃满</u>。</b><br><b>⚠ 而对照 RNN 就看得更清楚：<u>RNN 的递推天然串行，第 t 步要等第 t−1 步算完</u>。</b><b>⇒ <u>GPU 的本事是「同时做几万个乘加」，而 RNN 让它们排队</u>。</b><br><b>★ 所以 L1 那条时间线（想法 80 年代就有、缺的是数据和算力）还要再补一句：<u>缺的还有「能用上这种算力的架构」</u>。</b>");
  SUM(0,2,{h:"回顾（一）：自注意力、Q/K/V、与硬件",k:"<b>自注意力</b>：每个 token 通过注意力机制去关注序列里<b>所有其它</b> token。<b>Q/K/V</b>：query 通过比较 query 和 key，问「哪些别的 token 和我最像」，然后取出<b>关联的 value</b>。公式：<b>softmax(QKᵀ/√d_k)·V</b>。",m:"⭐ 讲者补了一句 L1 只一带而过的话：<b>这条公式是被「高度优化」过的 —— 它是一些大矩阵乘法，而我们的硬件非常擅长做这件事</b>。★ 和 L1 那句「GPU 爱矩阵」接起来就是完整论证：自注意力能写成矩阵形式 ⇒ 矩阵乘法是 GPU 的强项 ⇒ 这个架构能把算力吃满。",w:"⚠ 他的复述有两处简化值得留意：① 说的像是「取最像那一个的 value」，而<b>实际是按相似度加权取所有 value</b>（「挑一个」不可导，没法训）；② 「所有其它 token」这几个字正是 <b>O(n²)</b> 的来源 —— 本讲后半那一整段就是在处理它。",r:"⚠ 「被高度优化」还有一层：<b>这条公式在实践中并不照字面算</b>。后面有学生问「既然要算 softmax，限制窗口有什么用」，讲者答<b>实践中有一堆实现用了 tiling 之类的聪明办法，根本不去算那个巨大的矩阵</b> —— 那就是 L4 的 FlashAttention。⇒ 对照 RNN：递推串行，用不上 GPU「同时做几万个乘加」的长处。"});
  QUIZ(0,2,{t:"讲者说那条注意力公式「被高度优化过」，指的是什么？",o:["它是一些大矩阵乘法，而硬件非常擅长做这件事 —— 接上 L1 那句「GPU 爱矩阵」就是完整论证","编译器会自动优化它","论文作者做了大量调参","它的数学形式最简洁"],a:0,w:"⚠ 还有一层：这条公式在实践中并不照字面算（tiling 之类的实现根本不算那个巨大矩阵）—— 那就是 L4 的 FlashAttention。"});
});
KP("3 · 回顾（二）：transformer 架构的两半",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("03:12","And the transformer was initially introduced in the context of machine translation");
  note("架构由两大部分组成",640,186,"v");
  boxNode(70,214,520,44,"encoder（左边）","g");
  note("处理源语言的输入文本 —— 比如英文",330,284,"d");
  boxNode(690,214,520,44,"decoder（右边）","b");
  note("负责把译文解码成目标语言 —— 比如法文",950,284,"d");
  note("⇒ 因为 transformer 最初是在「机器翻译」这个语境里被引入的",640,326,"y");
  note("★ 记住这个出身 —— 它解释了为什么原始架构是两半的",640,364,"g");},"<b>架构的回顾，而讲者点出了一件解释力很强的事：<u>它的出身</u>。</b><br><b>他的话</b>：<b>「<u>transformer 由两个主要部分组成：左边的 encoder 和右边的 decoder。而 transformer 最初是在机器翻译这个语境里被引入的。所以你可以把左边想成处理源语言（比如英语）的输入文本，而右边负责把译文解码成目标语言（比如法语）</u>。」</b><br><b>★★★ 「<u>最初是在机器翻译的语境里</u>」这一句，解释了原始架构为什么是两半的</b>：<b>⇒ <u>翻译这个任务天生有两个序列</u> —— 源句和译句。所以你需要一个部件去「理解源句」，另一个去「生成译句」。</b><br><b>⚠ 而这正是本讲下半场最重要的那个转折的前提：<u>今天的 LLM 没有「两个序列」这回事</u>。</b><b>⇒ 你给它一段 prompt，它接着往下写 —— <u>只有一个序列</u>。</b><br><b>⇒ 所以 Shervine 会说：<u>今天的 LLM 把 encoder 整个去掉了</u>。<u>而理解这件事的钥匙，就是记住原架构是为「两个序列」设计的</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("03:43","it is called multi-head attention layer");
  note("⇒ 而 L1 留下的那个问题，这一讲开头被专门回答了",640,186,"v");
  boxNode(130,214,1020,44,"讲者：我记得关于「multi-head attention 层」有很多问题 —— 有好几个 head，那对应什么？","b");
  note("⇒ 这正是 L1 里学生反复追问的那一点",640,292,"y");
  note("★ 而他这次不是再解释一遍定义，而是拿论文里的图来回答",640,322,"g");
  note("⚠ 所以接下来三镜会很值 —— 它们是 L1 那个问题的「视觉答案」",640,360,"r");},"<b>讲者在这里特意回头处理了 L1 遗留的一个问题，而他的处理方式很聪明。</b><br><b>他的话</b>：<b>「<u>而这个 multi-head attention 层，就是自注意力机制发生的地方。我记得当时关于这个有很多问题 —— 它叫 multi-head attention 层，所以有好几个 head，那对应的是什么？</u>」</b><br><b>⇒ 回想 L1：那个问题被问了<u>两次</u>（一次问「head 是什么意思」，一次问「那几个头会不会学成一样」），<u>而两次的回答都偏抽象</u>（「head 是那些投影矩阵」「是梯度下降的魔法」）。</b><br><b>★★ 而这次他换了一个办法：<u>不再解释定义，而是拿论文里的图给你看「每个头实际上学到了什么」</u>。</b><br><b>⇒ 这正是接下来三镜的内容，<u>而它们是 L1 那个问题的视觉答案</u>。</b><br><b>★ 这个做法本身值得学：<u>当一个概念解释两遍还不通时，别再换一种说法 —— 换一种证据</u>。</b><b>⇒ 定义说不清的事，一张「它实际上在干什么」的图往往能说清。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("04:13","And you can think of each head as an opportunity for the model to learn one way of projecting");
  note("先把「head」的定义再钉一次",640,186,"v");
  boxNode(130,214,1020,44,"每个 head = 模型学会「把输入投影成 query / key / value 的一种方式」的一次机会","g");
  note("⇒ 讲者：说得更清楚点，比如对 query 和 key，这里每一个就是一个 head",640,292,"d");
  note("★ 而「这些小方块的个数」，基本上就是 head 的数量",640,322,"y");
  note("⚠ 注意「一次机会（an opportunity）」这个词 —— 它呼应了 L1 那个「没有保证」",640,360,"r");},"<b>定义再钉一次，而他这次用的词比 L1 更准。</b><br><b>他的话</b>：<b>「<u>你可以把每一个 head 想成：模型学会「把输入投影成一个 query、一个 key、或一个 value」的某一种方式的一次机会。说得更清楚一点，比如对 query 和 key 来说，这里每一个就是一个 head。所以这些小方块的个数，基本上就是 head 的数量</u>。」</b><br><b>★★ 请留意「<u>一次机会（an opportunity）</u>」这个词，它选得很准</b>：<b>⇒ 它不是说「每个头<u>会</u>学到一种不同的投影」，<u>而是说「每个头<u>有机会</u>学到」</u>。</b><br><b>⇒ 这正好呼应了 L1 里 Shervine 那个很诚实的回答：<u>「是什么让你不会得到一样的东西？什么都没有。你没有任何约束。但那种学习的性质使得实践中它就这么做了」</u>。</b><br><b>★ 所以两位讲者在这件事上是一致的：<u>多头提供的是「机会」而不是「保证」</u>。</b><b>⇒ 而下面那张 attention map，正是去看这个机会<u>实际上有没有被用起来</u>。</b>");
  SUM(0,3,{h:"回顾（二）：架构两半，与「head 是什么」",k:"架构两大部分：<b>encoder（左）处理源语言输入</b>、<b>decoder（右）解码出目标语言</b> —— 因为 transformer <b>最初是在机器翻译的语境里</b>被引入的。",m:"★★★ 这个出身解释了原架构为什么是两半的：<b>翻译天生有两个序列</b>（源句、译句）。⚠ 而这正是下半场那个转折的前提 —— <b>今天的 LLM 只有一个序列</b>（给 prompt、接着往下写），所以 encoder 被整个去掉。",w:"讲者回头处理了 L1 遗留的「head 是什么」：<b>每个 head = 模型学会「把输入投影成 query/key/value 的一种方式」的一次机会</b>，小方块的个数就是 head 数。★ 留意「<b>一次机会</b>」这个词 —— 它呼应 L1 里 Shervine 那个诚实回答：<b>多头提供的是机会不是保证</b>。",r:"★ 他的处理方式值得学：L1 里这个问题被问过两次、两次回答都偏抽象，<b>而这次他不再解释定义，改用论文里的图给你看「每个头实际学到了什么」</b>。⇒ 通用判断：<b>一个概念解释两遍还不通时，别再换说法 —— 换一种证据</b>。定义说不清的事，一张「它实际在干什么」的图往往能说清。"});

});

  note("⚠ 讲者的用词很克制：这是「一种解释方式」，不是「这就是它在想什么」",640,360,"r");},"<b>这是回答「多头各自在学什么」的工具，而讲者的用词分寸值得注意。</b><br><b>他的话</b>：<b>「<u>为了更好地可视化和理解这意味着什么，我还想展示一下论文里展示的东西 —— 那是一种去解释「这些 head 各自在做什么」的方式。我们有一个概念叫 attention map（注意力图），它基本上试图把这些 query 的点积的值表示出来</u>。」</b><br><b>★★ 请留意「<u>一种去解释…的方式</u>」这个措辞</b>：<b>⇒ 他没有说「这张图显示了模型在想什么」，<u>而是说「这是一种解释的方式」</u>。</b><br><b>⚠ 这个克制是有道理的，而且这是机器学习可解释性里一个真实的争议：<u>注意力权重高，不一定意味着那个 token「被用上了」</u>。</b><b>⇒ 后来有不少工作专门讨论「注意力是不是解释」这个问题。</b><br><b>★ 但作为理解工具，它仍然非常有用 —— <u>尤其是当你需要一个直觉的时候</u>。下面那个例子就很有说服力。</b>");

  note("⇒ 这正好是 L1 里 QKᵀ 那个矩阵的某一行",640,386,"d");},"<b>论文挑的例子是一个代词消解的问题，而它选得很巧。</b><br><b>讲者的话</b>：<b>「<u>在这个例子里，我们感兴趣的是看「其它哪个 token 和 token『its』最相似」。所以我们做的是，去看这些量 —— 代表 its 的那个 query，点乘所有其它的 key。然后我们看哪些 key 导致了「query 乘 key」的高值</u>。」</b><br><b>★★ 把这件事和 L1 的形状对上：<u>这就是 QKᵀ 那个 n×n 矩阵里，对应 its 的那一行</u>。</b><b>⇒ 那一行的第 j 个数，就是「its 和第 j 个 token 有多相关」。</b><br><b>⇒ 而 attention map 就是<u>把整个 n×n 矩阵画成一张热力图</u>，颜色深的地方就是注意力权重高的地方。</b><br><b>★ 为什么挑代词？因为<u>代词消解是一个人类有明确答案的任务</u>。</b><b>⇒ 「its」指的是谁，这件事语言学上是确定的。<u>所以如果模型的注意力确实落在正确的先行词上，那就是一个可验证的证据</u>。</b><b>⇒ 这比展示一个说不清对错的例子有力得多。</b>");

  note("⚠ 而讲者的结论句很关键：模型需要学会把这些词和「之前发生的」联系起来",640,364,"r");},"<b>结果出来了，而它确实对上了人的直觉。</b><br><b>讲者的话</b>：<b>「<u>当你这么做时，你看到的、或者说论文看到的是：你有这两个词 —— application 和 law —— 被高亮为具有高注意力权重。而这里的注意力权重，就是 its 这个 query 和每个 token 的 key 的点积</u>。」</b><br><b>⇒ <u>而你能看到被高亮的那些 token 是 law 和 application，这基本上说得通，因为 token「its」指的就是 law。而 its 也在指 application，这是解释这件事的另一个角度</u>。</b><br><b>★★★ 然后是那句最该记的结论</b>：<b>「<u>所以基本上，模型需要学会把这些词和「之前发生过的东西」联系起来</u>。」</b><br><b>⇒ 请体会这句话的分量：<u>没有人教过模型什么是代词、什么是先行词</u>。</b><b>⇒ 它的训练目标只是「预测下一个词」（或者翻译），<u>而指代关系是自己长出来的</u>。</b><br><b>★ 这正是 L1 里那条反复出现的直觉：<u>一个好的代理任务，产出的东西往往比它要求的多</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  SUM(0,4,{h:"⭐ attention map：多头各自在关注谁",k:"<b>attention map</b>：把「每个 query 与 key 的点积」画成热力图 —— 也就是把 L1 里那个 <b>QKᵀ 的 n×n 矩阵</b>可视化。论文的例子：看代词 <b>its</b> 和谁最相似。",m:"结果：高亮的是 <b>law</b> 和 <b>application</b> —— 而 its 指的正是 law（也在指 application）。★★★ 讲者的结论句最该记：<b>模型需要学会把这些词和「之前发生过的东西」联系起来</b> —— 而<b>没有人教过它什么是代词</b>，指代关系是自己长出来的。",w:"★★ 最关键的一步：作者把这些值<b>按不同 head 分开画</b> —— 第一个 head 一个样子，第二个 head 对 law 的强度非常高。⇒ <b>这些 head 可能学到了不同的、判断哪些词要紧的方式</b>。这正是 L1 那个「多头会不会学成一样」的<b>视觉答案</b>（当时的回答是「什么都没保证，但实践中它就这么做了」）。",r:"⚠ 留意讲者两处克制的用词：① attention map 是「<b>一种解释方式</b>」，不是「这就是它在想什么」（注意力权重高不等于那个 token 被用上了，这是可解释性里真实的争议）；② 这些 head「<b>可能</b>」学到不同方式 —— <b>看到差异和「差异有用」之间还有距离</b>（后来确有研究发现相当一部分头是冗余的）。"});

});

  note("⇒ 它的作用是把拼接后的结果投回原来的嵌入维度 —— 这是能堆 N 层的前提",640,386,"d");},"<b>这一镜把多头的流程又走了一遍，而它和 L1 的走查完全吻合。</b><br><b>讲者的话</b>：<b>「<u>每个 head 在这里会有一个结果，然后它会被拼接起来，再被输出矩阵投影一次。所以长话短说，它是高度并行化的。而它基本上就是一些投影 —— 这里你有一些矩阵乘法和 softmax</u>。」</b><br><b>★ 对上 L1 的走查：<u>h 个头各出 n×d_k ⇒ 按列拼接成 n×(h·d_k) ⇒ 乘 W_o 回到 n×d_model</u>。</b><b>⇒ 「输出矩阵」就是 W_o。</b><br><b>★★ 而「<u>高度并行化</u>」这个词值得再强调一次，因为它贯穿这两讲</b>：<b>⇒ <u>头与头之间并行、序列里的位置之间也并行</u>。</b><b>⇒ 这就是为什么 transformer 能把 GPU 吃满，而 RNN 不能。</b><br><b>⚠ 他最后那句「<u>基本上就是一些投影，加矩阵乘法和 softmax</u>」听起来平淡，但它其实是个很强的陈述：<u>这个改变了整个领域的机制，用到的全部运算就是这三样</u>。</b><b>⇒ 没有特殊的算子、没有复杂的控制流。<u>简单正是它能被优化到极致的原因</u>。</b>");

  note("⚠ 「密（dense）」和「短」放在一起说 —— 这两件事其实是同一件事",640,360,"r");},"<b>回顾结束，讲者给了一条读论文的建议，而这条建议的时机选得很好。</b><br><b>他的话</b>：<b>「<u>说到这里，我强烈建议你去读 transformer 那篇论文，也就是《Attention is All You Need》。它是一篇非常密的论文，只有几页长。但我希望，你在第 1 讲看到的那些东西，能让你以一种对你说得通的方式去消化它的内容</u>。」</b><br><b>★★ 「<u>非常密，只有几页长</u>」—— 这两个描述放在一起说，其实是同一件事</b>：<b>⇒ <u>短，是因为每一句都压缩得很狠</u>。</b><b>原论文大概八九页，却提出了一整个架构、三种注意力的用法、位置编码、多头、label smoothing…… <u>每一个点都只给结论，不给推导</u>。</b><br><b>★★★ 而这正是他把这条建议放在「学完 L1 之后」的原因</b>：<b>⇒ <u>先有了直觉再去读，那些被压缩掉的东西你能自己补上；直接去读，你只会看到一堆结论</u>。</b><br><b>⇒ 这是一条很通用的读论文策略：<u>经典论文往往不适合当入门材料，它适合在你已经懂了之后去读 —— 那时你读的是「作者当初怎么想的」，而不是「这是什么」</u>。</b>");
  SUM(0,5,{h:"一个提问，与一条读论文建议",k:"学生问「这些计算是过不同的 <b>MLP</b> 吗」—— 讲者答：<b>我们为它们每一个都有不同的「投影矩阵」</b>，每个 head 有自己的投影，而且<b>并行</b>发生；每个 head 出一个结果 → <b>拼接</b> → 再用<b>输出矩阵</b>（就是 W_o）投影一次。",m:"⚠ 留意他没用「MLP」回答：<b>MLP 意味着多层 + 非线性，而 W_q/W_k/W_v 是单个线性变换</b>。这不是咬文嚼字 —— 正因为纯线性，很多优化（把多个头的投影合并成一个大矩阵乘法）才做得了。<b>注意力层里是投影，FFN 里才是 MLP</b>。",w:"★★ 讲者在这一整段里三次用了「<b>一种方式</b>」「<b>一次机会</b>」这类克制的措辞，始终没说「这就是多头的工作原理」。⇒ 因为多头为什么有效至今没有干净的理论解释，有的是：<b>一个合理动机 + 一些可视化证据 + 大量经验结果</b>。<b>知道一个结论靠什么支撑，比知道结论本身更重要</b> —— 它决定了你能推广多远。",r:"⭐ 读论文建议：<b>强烈建议读《Attention is All You Need》—— 一篇非常「密」、只有几页长的论文</b>，而他把这条建议放在学完 L1 之后。★★★ 「密」和「短」其实是同一件事（<b>短是因为每句都压缩得狠，只给结论不给推导</b>）⇒ 通用策略：<b>经典论文不适合当入门材料，适合在你已经懂了之后读</b> —— 那时你读的是「作者当初怎么想」而不是「这是什么」。"});

  note("★ 这个分工和 L1 完全一样：Afshine 讲机制，Shervine 讲全景",640,368,"g");},"<b>分工公布，而它和 L1 的分工是同一个模式。</b><br><b>讲者的话</b>：<b>「<u>我们打算把这堂课分成两部分。第一部分是我要讲的，也就是：transformer 里哪些部分是重要的、而且发生过一些变动。第二部分里，Shervine 会讲今天这些模型的命名法，以及它们和最初那个 transformer 的关系</u>。」</b><br><b>★★ 这个分工值得留意，因为它在这门课里是固定的</b>：<b>⇒ <u>Afshine 讲「这个东西怎么运转」，Shervine 讲「这些东西放在一起是个什么格局」</u>。</b><b>L1 里也是：Afshine 从 one-hot 一路推到多头，Shervine 最后做端到端走查。</b><br><b>⇒ 两种讲法你都需要：<u>只有机制没有全景，你不知道自己在哪；只有全景没有机制，你什么都不会算</u>。</b><br><b>⇒ 而第一个概念是 <u>position embedding（位置嵌入）</u>，它占了接下来三十多分钟 —— <u>这个时间分配本身就说明它有多要紧</u>。</b>");

KP("7 · ★★ 为什么 transformer 必须「额外」告诉它位置",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("10:44","here we are letting tokens interact with all other tokens in a direct fashion");
  note("自注意力的那个长处，正好带来一个短处",640,186,"v");
  boxNode(70,214,520,44,"transformer","g");
  note("每个 token 和所有 token 直接交互 —— 它们有「直接的链接」",330,284,"g");
  boxNode(690,214,520,44,"RNN","b");
  note("有「顺序依赖」—— 一次处理一个 token",950,284,"b");
  note("⇒ 而在 transformer 里，你基本上丢掉了「某个 token 在另一个之前被处理」这个概念",640,326,"r");
  note("★ 请注意：这个丢失不是 bug，它是「全部并行」的必然代价",640,364,"y");},"<b>这一镜说的是一个很深的事：<u>transformer 最大的长处，直接导致了它最大的一个缺口</u>。</b><br><b>讲者的话</b>：<b>「<u>如果你记得，这里我们让 token 以一种直接的方式和所有其它 token 交互 —— 它们有直接的链接。但和 RNN 这类东西相反：RNN 里你有一个顺序依赖，你一次处理一个 token。而在这里，你基本上丢掉了「一个 token 在另一个之前被处理」这个概念</u>。」</b><br><b>★★★ 这个因果关系必须想清楚</b>：<b>⇒ RNN 知道顺序，是因为<u>它的计算本身就是按顺序做的</u> —— 第 5 个词的隐状态里，天然含着前 4 个词按序累积的结果。<u>位置信息是「免费」的，它来自计算的形状</u>。</b><br><b>⇒ 而 transformer 为了并行，<u>把「按顺序算」这件事取消了</u>。所有位置同时进入同一个矩阵乘法。</b><b>⚠ 于是自注意力对输入<u>完全是置换不变的</u>：你把句子里的词打乱顺序，算出来的注意力结果只是跟着换了位置，<u>内容一点没变</u>。</b><br><b>★ 「狗咬人」和「人咬狗」，对裸的自注意力来说是同一件事。<u>这就是为什么位置信息必须额外注入</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("11:15","So you lose this position information");
  note("结论句：你丢了位置信息",640,186,"r");
  boxNode(130,214,1020,44,"⇒ 所以我们需要「以某种方式量化每个位置上的 token」","g");
  note("⇒ 并且在 transformer 处理输入时，把这个信息「注入」进去",640,292,"y");
  note("★ 留意两个动词：quantify（量化）和 inject（注入）",640,322,"g");
  note("⚠ 量化 = 把「第几个」变成一个向量；注入 = 让这个向量进到计算里",640,360,"r");},"<b>讲者把问题变成了任务，而他用的两个动词把这件事的两个层面分开了。</b><br><b>他的话</b>：<b>「<u>所以你丢了这个位置信息。而作为这件事的结果，我们需要以某种方式去量化每个位置上的 token，并且在 transformer 处理这些输入时，试着把那个信息注入进去</u>。」</b><br><b>★★ 两个动词，两个独立的设计决定</b>：<b>⇒ ① <u>quantify（量化）</u>：把「第几个位置」变成一个数值表示。<u>用什么形式？学出来的向量？一条公式？一个偏置？</u></b><br><b>⇒ ② <u>inject（注入）</u>：把这个表示送进计算。<u>送到哪里？加在输入嵌入上？加在注意力分数上？乘进 Q 和 K 里？</u></b><br><b>★★★ 这两个问题的答案组合，正好就是接下来三十分钟的五代位置编码</b>：<b>⇒ <u>学出来的向量 + 加在输入上</u>（第一代）⇒ <u>正弦公式 + 加在输入上</u>（第二代）⇒ <u>学出来的标量 + 加在注意力分数上</u>（T5）⇒ <u>固定的线性罚 + 加在分数上</u>（ALiBi）⇒ <u>旋转 + 乘进 Q 和 K</u>（RoPE）。</b><br><b>⚠ 所以这条线的真正剧情是：<u>「注入的位置」一路从输入端往注意力内部搬</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("11:40","So how are we going to do that?");
  note("⭐ 先自己想一下，再往下看",640,186,"y");
  boxNode(130,214,1020,44,"问题：怎么把「这是第 m 个 token」这件事告诉模型？","b");
  note("⇒ 一个很自然的念头：直接把位置号 m 当成一个数接上去？",640,292,"d");
  note("⚠ 为什么不行：① m 没有上界，数值会越来越大 ② 它只有一个维度，信息太薄",640,322,"r");
  note("★ 而「加一个和嵌入同维的向量」就同时解决了这两件事",640,360,"g");},"<b>讲者在这里抛出问题，而值得先自己想一想 —— 因为最朴素的答案为什么不行，恰恰解释了后面所有设计的动机。</b><br><b>他的话</b>：<b>「<u>那么我们要怎么做到这件事呢？</u>」</b><br><b>★ 最朴素的念头：<u>把位置号 m 当成一个数，接在嵌入后面</u>。为什么不行？</b><br><b>⚠ ① <u>m 没有上界</u>。位置 1 是 1，位置 5000 是 5000。神经网络对输入的尺度很敏感 —— 一个会无限增长的特征会把其它特征淹掉。</b><b>⇒ 你可以归一化成 m/L，但那样<u>同一个位置在不同长度的句子里数值不同</u>，模型学不到稳定的东西。</b><br><b>⚠ ② <u>一个标量只有一个自由度</u>。而要表达「相对距离」这种结构，一个数远远不够。</b><br><b>★★ 而「<u>给每个位置配一个和 token 嵌入同维的向量，然后加上去</u>」就同时解决了这两件事：维度够高、每一维都在有界范围内。</b><b>⇒ 这就是原论文的选择，也是下一镜的内容。</b>");
  SUM(0,7,{h:"★★ 为什么必须「额外」注入位置",k:"transformer 里 <b>token 和所有其它 token 直接交互（有直接的链接）</b>；而和 RNN 相反 —— RNN 有<b>顺序依赖，一次处理一个 token</b>。⇒ 于是在 transformer 里，<b>你丢掉了「一个 token 在另一个之前被处理」这个概念</b>。",m:"★★★ 因果要想清楚：RNN 知道顺序是因为<b>它的计算本身就是按顺序做的</b>，位置信息是免费的、来自计算的形状。而 transformer 为了并行<b>把「按顺序算」取消了</b> ⇒ ⚠ 自注意力对输入<b>完全置换不变</b>：打乱词序，结果只是跟着换位置、内容一点没变。<b>「狗咬人」和「人咬狗」对裸的自注意力是同一件事</b>。",w:"讲者的任务陈述用了两个动词，而它们是两个独立的设计决定：① <b>quantify（量化）</b>—— 把「第几个」变成什么形式？② <b>inject（注入）</b>—— 送进计算的哪个位置？",r:"★★★ 这两个问题的答案组合就是接下来三十分钟的五代位置编码：<b>学出的向量+加在输入上</b>（一代）→ <b>正弦公式+加在输入上</b>（二代）→ <b>学出的标量+加在注意力分数上</b>（T5）→ <b>固定线性罚+加在分数上</b>（ALiBi）→ <b>旋转+乘进 Q 和 K</b>（RoPE）。⚠ 所以这条线的真正剧情是：<b>注入的位置一路从输入端往注意力内部搬</b>。"});

  note("⚠ 这是这门课第二次出现 does wonders 这个说法（L1 讲 word2vec 时也用过）",640,384,"d");},"<b>这一镜把第二个局限说完整，然后给了「学出来的」方案一个公允的好话。</b><br><b>讲者的话</b>：<b>「<u>比如说，如果你在推理时有一个位置超出了训练集里的位置，那你就没有学过它，所以你需要找一个办法去推断那个值。这就是第二个局限。不过在好处那一面，我想你就只是让你的模型去学。而我们已经看到，梯度下降在「就从数据里学」这件事上创造奇迹</u>。」</b><br><b>★★ 「<u>创造奇迹（does wonders）</u>」这个说法在这门课里出现过不止一次 —— L1 里 Shervine 回答「多头会不会学成一样」时说的是「<u>这就是梯度下降的魔法</u>」。</b><br><b>⇒ 两位讲者在这件事上有一个共同的、很诚实的态度：<u>很多设计说不出严格的理由，但「让它自己学」在实践中出奇地好用</u>。</b><br><b>★★★ 而这正是「学出来的」方案的真正卖点：<u>你不需要知道位置信息「应该」长什么样</u>。</b><b>⇒ 你只需要给它足够的自由度和足够的数据。<u>它的局限不在表达力，而在泛化范围 —— 它学不到它没见过的位置</u>。</b>");

  SUM(0,9,{h:"⚠ 「学出来的」位置嵌入的两个局限",k:"<b>局限一</b>：你非常依赖训练集里有什么 —— 如果文本总是在位置 2 上发生某件事，<b>你学出来的嵌入会把那个偏置也学进去</b>。<b>局限二（更要命）</b>：<b>你只能学到训练集里出现过的最大位置</b> —— 在最长 512 的序列上训练，就只能学到位置 512；推理时超出就<b>没学过，得找办法去「推断」那个值</b>。",m:"★★ 局限一隐蔽，因为位置嵌入<b>本该只编码「第几个」</b>，但自由参数会把「位置 2 通常是什么」这种统计规律一起吸进去。⇒ 一般现象：<b>任何自由参数都会吸收数据里的相关性，包括你没打算让它吸收的</b>；而固定公式天然免疫 —— <b>它根本没有参数可以被污染</b>。",w:"⚠ 局限二是<b>硬性</b>的：位置嵌入表就是 512 行的矩阵，<b>第 513 行不存在</b>（不是学得差，是根本没有）。★ 实现细节（学生追问）：开一张「<b>占位</b>」的可学嵌入表（位置 1–512），让这些权重跟着常规梯度下降被学。⇒ 由此还有个更软的后果：<b>没被数据填到的行里就是随机初始值</b>，所以越靠后的位置学得越差 —— 长句本来就少。",r:"★★★ 这件事今天比 2017 年重要得多：当年翻译句子 512 够用，<b>而今天上下文从 512 一路到 128K、1M</b> ⇒ <b>「能否外推到没见过的长度」从学术性质变成了产品性质</b>，这是整条演化线最主要的驱动力。⇒ 公允的好话：好处是「<b>你就只是让模型去学</b>，而梯度下降在从数据里学这件事上<b>创造奇迹</b>」（L1 里也说过「梯度下降的魔法」）。"});

  note("⚠ 他没有说「实现」—— 因为余弦是周期的，严格的单调递减并不成立",640,360,"r");},"<b>学生做了一次确认，而讲者的用词再次很克制。</b><br><b>学生的问题</b>：<b><u>所以它们越近，就越相似？</u></b><b>讲者：<u>正是如此。</u></b><br><b>他接着说</b>：<b>「<u>所以这就是那个直觉 —— 基本上这种构造嵌入的方式是在试着逼近它、或者说试着模仿它。于是你基本上得到一个点积，它就只是 m 和 n 之间的、实际上是相对距离的函数</u>。」</b><br><b>★★ 「<u>逼近（approximate）</u>」和「<u>模仿（mimic）</u>」—— 他没有说「实现」或「保证」，而这个分寸是对的</b>：<b>⇒ 因为<u>余弦是周期函数</u>。cos(ω_i·d) 并不随 d 单调递减 —— <u>它会升回来</u>。</b><br><b>⇒ 讲者自己在下一镜（22:02）就会主动承认这件事：「<u>当然，它是周期的，所以我说的不一定是真的 —— 过了 π 它就反着走了</u>。」</b><br><b>★★★ 所以准确的说法是：<u>点积严格地只依赖相对距离（这是保证的）；而「越远越不相似」只是在一定范围内近似成立（这是逼近的）</u>。</b><b>⇒ <u>把「保证的」和「逼近的」分开，才是真的懂了这条公式</u>。</b>");
  SUM(0,12,{h:"★★★ 想要什么性质，以及公式给没给",k:"① <b>想要的性质</b>：以一种反映「<b>靠得近的词比离得远的词更可能相关</b>」的方式表示位置 —— 差 1 个位置的那一对，要比差 10000 个位置的那一对<b>更相似</b>。② <b>工具</b>：<b>cos(a−b)=cos a cos b + sin a sin b</b>。③ <b>结论</b>：做点积你得到<b>一堆余弦之和，而它们是 m 与 n 相对距离的函数</b>。",m:"★★★ 魔法在恒等式的右边形状：<b>PE 的第 2i 维贡献 sin(ω_i m)sin(ω_i n)、第 2i+1 维贡献 cos(ω_i m)cos(ω_i n)，两项加起来正是 cos(ω_i(m−n))</b>。⇒ 于是三个看起来任意的决定全有了理由：<b>① 用 sin/cos</b>（为用上 cos(a−b)）<b>② 奇偶维成对</b>（为让两项在点积求和里凑齐）<b>③ 同一对共用一个 ω_i</b>（为让角度能相减）。",w:"★★ 结论要说准：<b>点积只依赖 m−n，和 m、n 各自是多少完全无关</b>（位置 3 与 5 的点积严格等于 1003 与 1005 的）—— 这叫<b>平移不变性</b>，比「近的更相似」强得多。⚠ 而<b>第一代学出来的完全不保证这一点</b>：那是四个独立学出的向量，点积凭什么相等？",r:"⚠ 讲者用的是「<b>逼近</b>」「<b>模仿</b>」而不是「实现」，分寸是对的：<b>余弦是周期函数</b>，cos(ω_i·d) 并不随 d 单调递减、会升回来（他下一镜就主动承认「过了 π 就反着走了」）。★★★ 准确说法：<b>「点积只依赖相对距离」是保证的；「越远越不相似」只在一定范围内近似成立</b>。⇒ 把「保证的」和「逼近的」分开，才是真懂了这条公式。⇒ 另外「更可能（likely）」说明这是<b>统计先验不是硬约束</b> —— 注意力权重最终还是由内容决定。"});
  QUIZ(0,12,{t:"正弦位置编码真正「保证」的性质是什么？",o:["每个位置的嵌入范数相等","点积随距离严格单调递减","相邻位置的嵌入正交","点积只依赖相对距离 m−n，和绝对位置无关（平移不变）；而「越远越不相似」只是近似成立"],a:3,w:"⚠ 因为余弦是周期的，会升回来 —— 讲者自己说「过了 π 就反着走了」。把「保证的」和「逼近的」分开，才是真懂了这条公式。"});
});

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  SUM(0,13,{h:"为什么一直在算点积",k:"讲者回头补上前提：<b>在嵌入的世界里，量化两个嵌入的相似度，典型做法就涉及它们的点积</b> —— 你典型地用<b>余弦相似度 = 点积 ÷ 各自的范数</b>，所以它基本上就是个点积。",m:"★★★ 这直接接回 L1：那一讲用<b>同一把尺子</b>证明了「one-hot 下所有词两两正交」（cat 与 kitten 的相似度和 cat 与 bicycle 一样都是 0），那是整门课的起点。⇒ <b>L1 用它说明「one-hot 不行」，L2 用它说明「正弦编码行」—— 同一把尺子先量出一个失败，再量出一个成功</b>。",w:"验证「越近越相似」：<b>cos(0)=1 是最大值</b>，这个数越大 cos 值越低。⚠ 但讲者立刻自己打补丁：<b>当然它是周期的，所以我说的不一定为真 —— 过了 π 就反着走了</b>。★★ 这个「<b>给一个直觉，同时标注它的适用范围</b>」的习惯在技术沟通里价值极高 —— 否则听众会把直觉当普遍规律带走，等它在边界失效时以为自己理解错了。",r:"⭐ 唯一能<b>严格</b>断言的那一点：<b>m = n 时每一项都是 cos(0)，整个和取到最大</b> ⇒ 「看那个位置本身时它最相似」，符合直觉。★★★ 为什么这一点严格、别的不严格：cos 最大值 1 只在角度为 0 时取到 ⇒ m=n 时每项都最大 ⇒ 和当然最大，不需额外假设。⇒ 顺带：<b>低维 ω≈1 周期很短、稍远就绕回来；高维 ω≈0.0001 周期长达六万多位置</b> —— 所以「越远越不相似」主要靠高维低频分量撑起来。"});
  QUIZ(0,13,{t:"关于正弦位置编码的点积，哪一条是「严格」成立的？",o:["点积随距离单调递减","点积的值在 0 和 1 之间","m = n 时点积取到最大值（每项都是 cos 0 = 1，不需任何额外假设）","任意两个位置的点积都为正"],a:2,w:"⇒ 而「远的比近的更不相似」只是大致成立（余弦周期性）—— 这个区分正是讲者用「逼近/模仿」而不是「实现」的技术内容。"});
});

  note("⭐⭐⭐ 这就是接下来两代（T5、ALiBi）的全部",640,240,"y");
  note("⇒ 讲者先复述：自注意力层基本上就是 softmax(QKᵀ/√d) 乘 V",640,272,"d");
  note("★ 而我们想做的是：在那个 softmax 「里面」加一点东西",640,304,"g");
  note("⚠ 而 softmax 里面正是「你量化一个 token 和另一个 token 多相似」的地方",640,336,"r");
  note("⇒ 于是位置信息第一次直接坐在了「相似度」旁边",640,368,"y");},"<b>这就是 T5 和 ALiBi 的全部内容，一张图就说完了。</b><br><b>讲者的话</b>：<b>「<u>而我们做这件事的方式是：如果你记得，自注意力层基本上就是 softmax(QKᵀ 除以根号 d) 乘 V。所以我们想要的，是在那个 softmax 里面加一点小东西 —— 而那里基本上就是你量化「一个 token 和另一个 token 有多相似」的地方</u>。」</b><br><b>★★★ 请盯着那个加号看，因为它的位置就是全部的设计</b>：<b>⇒ 它<u>在 softmax 里面</u>，所以它影响的是「权重分配」。</b><b>⇒ 它<u>和 QKᵀ/√d 并列</u>，所以它和「内容相似度」是同一个量级、同一个舞台上的两个声音。</b><br><b>★★ 这个结构有一个很好的读法：<u>注意力分数 = 内容的相似度 ＋ 位置的亲疏</u>。</b><b>⇒ <u>前一项问「这两个词意思上相关吗」，后一项问「这两个词离得近吗」</u>。</b><b>⇒ 两个判断相加，再一起过 softmax。</b><br><b>⚠ 而这个「相加」意味着它们是<u>可以互相压倒</u>的：<u>内容足够相关时，模型可以压过位置的罚分去关注一个远处的词</u>。</b><b>⇒ 这正是前面说的「给先验、不给硬约束」。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 所以它是一个 n×n 的矩阵，和 QKᵀ 同形 —— 这样才能直接相加",640,362,"r");},"<b>这一镜把要加的那个东西的形状交代清楚了，而形状决定了后面两代的全部差异。</b><br><b>讲者的话</b>：<b>「<u>你想加一点小东西，来反映这样一个事实：某些 token 相比那个 token、相比其它 token，本该是更相似的。所以有几个方法尝试过这件事的某种变体</u>。」</b><br><b>★★ 先把形状钉死，这样下面两代就只是填空</b>：<b>⇒ <u>QKᵀ 是一个 n×n 的矩阵</u>，第 (i,j) 个元素是「token i 的 query 和 token j 的 key 的点积」。</b><b>⇒ <u>要加上去的那个 b 也必须是 n×n</u>。</b><b>⇒ 而它的第 (m,n) 个元素，只依赖<u>这一对位置</u> —— 不依赖这两个位置上是什么词。</b><br><b>★★★ 于是「设计一个位置偏置」这件事，就变成了一个很具体的问题：<u>给定一对位置 (m, n)，输出一个数。这个函数怎么定？</u></b><br><b>⇒ <u>T5 说：让模型自己学</u>（29:27）。</b><b>⇒ <u>ALiBi 说：用一条确定性公式</u>（30:30）。</b><br><b>⇒ <u>而这两条路，正好就是第一代和第二代那场「学 vs 不学」的争论，在一个新位置上重演了一遍</u>。</b>");
  SUM(0,16,{h:"★★ 把位置信息直接塞进 softmax 里面",k:"⭐⭐ 转折点：<b>我们主要想让这个直觉在「多头注意力层」里成立</b> ⇒ 所以人们尝试的变体方向是<b>让位置嵌入「直接在注意力层里介入」，而不是在输入处</b>。具体做法：<b>在 softmax 里面加一点小东西</b> —— softmax(QKᵀ/√d <b>+ b</b>)V。",m:"⚠ 对第一代的批评只用了一个词：<b>间接</b>。位置信息加在输入嵌入上后<b>和词义混在同一个向量里</b>，然后被 W_q/W_k 投影 —— 而这两个矩阵是学出来的，<b>模型得自己学会「从混合向量里提取位置成分、用它调节点积」</b>。★★★ 这能做到（transformer 确实学到了），<b>但它花掉模型容量、而且效果不受你控制</b>；直接加在分数上就不用学了，它被硬编码进了结构。",w:"★★ 一个很好的读法：<b>注意力分数 = 内容的相似度 ＋ 位置的亲疏</b>（前一项问「意思上相关吗」，后一项问「离得近吗」），两个判断相加再一起过 softmax。⚠ 而「相加」意味着它们<b>可以互相压倒</b> —— 内容足够相关时，模型可以压过位置罚分去关注远处的词（给先验、不给硬约束）。",r:"把要加的那个 b 的<b>形状</b>钉死，后面两代就只是填空：<b>QKᵀ 是 n×n，所以 b 也必须是 n×n，而它的第 (m,n) 个元素只依赖「这一对位置」、不依赖位置上是什么词</b>。★★★ 于是问题变得很具体：<b>给定一对位置 (m,n)，输出一个数 —— 这个函数怎么定？</b>⇒ <b>T5 说让模型自己学；ALiBi 说用一条确定性公式</b> —— 第一代和第二代那场「学 vs 不学」的争论，在新位置上重演了一遍。"});
  QUIZ(0,16,{t:"把位置偏置加在 softmax 里面，比加在输入嵌入上好在哪？",o:["加在输入上时位置信息和词义混在一起、要靠 W_q/W_k 学会提取；加在分数上则被硬编码进结构，不用学","能支持更大的 batch","参数更少","可以让注意力权重和为 1"],a:0,w:"★★ 读法：注意力分数 = 内容的相似度 ＋ 位置的亲疏。而「相加」意味着两者可以互相压倒 —— 内容足够相关时模型能压过位置罚分去关注远处的词。"});

KP("17 · T5 的相对位置偏置：把 m−n 分桶，然后学",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("28:48","they have tried these relative position bias by learning the bias term");
  note("第三代：T5 的 relative position bias（相对位置偏置）",640,186,"v");
  boxNode(130,214,1020,44,"做法：把上面那条公式里的那个 bias 项「学出来」","g");
  note("⇒ 讲者顺手预告：T5 这篇论文我们稍后（下半场）会讲到",640,292,"y");
  note("★ 他的设置：假设位置 m 和 n 之间有一个给定的距离",640,324,"g");
  note("⚠ 注意名字里的 relative（相对）—— 它只看 m−n，不看 m 和 n 各自是几",640,362,"r");},"<b>第三代登场，而它的名字已经把设计说完了。</b><br><b>讲者的话</b>：<b>「<u>对我们当中知道 T5 那篇论文的人来说 —— 我们稍后会讲到一点 —— 他们尝试了这些相对位置偏置，做法是把上面那条公式里的那个偏置项学出来。所以他们做的是：假设你在位置 m 和 n 之间有一个给定的距离</u>。」</b><br><b>★★ 名字拆开看：<u>relative position bias</u></b>：<b>⇒ <u>relative（相对）</u>：它的输入是 m−n，<u>不是 m 和 n 各自</u>。</b><b>⇒ <u>position（位置）</u>：它只看位置，不看内容。</b><b>⇒ <u>bias（偏置）</u>：它是加在分数上的一个数。</b><br><b>★★★ 请注意「相对」这件事在这里是<u>设计上免费拿到的</u></b>：<b>⇒ 第二代费了九分钟做三角推导，才让点积变成相对距离的函数。</b><b>⇒ <u>而 T5 直接把函数的输入定成 m−n —— 相对性是定义出来的，不是推出来的</u>。</b><br><b>⚠ 这是一个很值得体会的对比：<u>有时候你费力去证明一个性质，而换一个表示方式，这个性质就是白给的</u>。</b><b>⇒ 代价是你丢掉了别的东西（下面会说）。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("29:17","Let us basically bucketize all m minus n into some buckets");
  note("⭐ 关键的实现技巧：分桶（bucketize）",640,186,"y");
  seq(110,214,["把所有可能的 m−n","分到若干个「桶」里","让模型去学「每个桶一个数」"],["b","y","g"],340,44);
  note("⇒ 讲者：然后就让模型学这些量，它们接着被注入 softmax",640,290,"d");
  note("★ 为什么要分桶？因为 m−n 的取值范围无穷大，不可能每个距离一个参数",640,322,"y");
  note("⚠ 而分桶还顺手带来一个好处：距离越远的桶越宽 ⇒ 远处的分辨率自然变粗",640,360,"r");},"<b>这是 T5 这个方案真正的工程内容，而它解决的是一个必须解决的问题。</b><br><b>讲者的话</b>：<b>「<u>所以他们的想法是：我们来学它。基本上我们把所有的 m 减 n 分桶到一些桶里，然后就让模型去学这些量 —— 而这些量接着会被注入到 softmax 里</u>。」</b><br><b>★★ 为什么必须分桶</b>：<b>⇒ <u>m−n 的取值范围是无界的</u>。如果每个距离配一个可学参数，那你又回到了第一代的局限二 —— <u>训练时没见过的距离，你没有参数</u>。</b><br><b>★★★ 而分桶的巧妙之处在于它的<u>不均匀</u>划分（T5 论文里是对数式的）</b>：<b>⇒ <u>近处精细</u>：距离 1、2、3、4 各占一个桶 —— 因为近处的差别很要紧。</b><b>⇒ <u>远处粗糙</u>：距离 100 到 200 可能共用一个桶 —— 因为「远」和「更远」的区别没那么重要。</b><b>⇒ <u>而最远的所有距离都归进最后一个桶</u> —— 于是任意大的距离都有参数可用，<u>外推问题被分桶化解掉了</u>。</b><br><b>★ 这个设计很值得记：<u>当一个量的范围无界、但你只需要有限的分辨率时，用非均匀分桶把它压成有限个类别</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("29:50","you can do whatever you want inside the softmax, because the softmax is going to normalize it anyways");
  note("⭐⭐ 一个非常好的课堂提问，和一个很干脆的回答",640,186,"y");
  boxNode(130,214,1020,44,"问：偏置加在这里，不会和「最后要和为 1 的概率」冲突吗？","b");
  note("⇒ 答：在 softmax 里面你想干什么都行 —— 因为 softmax 反正会把它归一化",640,292,"g");
  note("★★ 所以你可以把偏置想成：对离得远的东西「更负」，对离得近的「没那么负」",640,324,"y");
  note("⚠ 这个回答值得记住 —— 它解释了为什么注意力里的各种 bias / mask 都能随便加",640,362,"r");},"<b>这个提问问得很好，而回答的那一句是整个注意力机制里最实用的直觉之一。</b><br><b>学生的问题</b>：<b><u>偏置加在这里，不会给「最后那个要和为 1 的概率」带来问题吗？因为它必须加起来等于 1。</u></b><br><b>讲者的回答</b>：<b>「<u>嗯，在 softmax 里面你想干什么都行，因为 softmax 反正会把它归一化掉。所以你可以把这个偏置想成：对离得远的东西，它可能更负一些；而对离得近的东西，没那么负</u>。」</b><br><b>★★★ 「<u>softmax 反正会归一化</u>」这句话该记住，因为它解释了注意力里一大类操作为什么合法</b>：<b>⇒ <u>causal mask</u>：给未来的位置加 −∞ ⇒ softmax 后变成 0。</b><b>⇒ <u>padding mask</u>：给填充位加 −∞。</b><b>⇒ <u>T5 的相对偏置、ALiBi 的线性罚</u>：加任意实数。</b><b>⇒ <u>每一种都是在 softmax 之前往分数上加东西，而和为 1 永远自动成立</u>。</b><br><b>★★ 而「<u>更负 / 没那么负</u>」这个说法把偏置的物理意义说清楚了：<u>它不是一个概率，它是一个「罚分」</u>。</b><b>⇒ 罚得越重，这一对位置在 softmax 后分到的权重越少。<u>而罚多少，T5 让模型自己学</u>。</b>");
  SUM(0,17,{h:"T5：把 m−n 分桶，然后学那个偏置",k:"第三代 = T5 的 <b>relative position bias（相对位置偏置）</b>：把 softmax 里那个<b>偏置项学出来</b>。做法：<b>把所有的 m−n 分桶（bucketize）到若干个桶里，让模型学「每个桶一个数」，再注入 softmax</b>。",m:"★★ 名字拆开就是设计：<b>relative</b>（输入是 m−n，不是 m 和 n 各自）+ <b>position</b>（只看位置不看内容）+ <b>bias</b>（加在分数上的一个数）。★★★ 而「相对」在这里是<b>设计上免费拿到的</b> —— 第二代费九分钟三角推导才得到的性质，<b>T5 直接把函数输入定成 m−n，相对性是定义出来的、不是推出来的</b>。",w:"★★ 为什么必须分桶：<b>m−n 范围无界</b>，每个距离配一个参数又会回到第一代的局限二。而分桶的巧妙在<b>不均匀划分</b>（T5 里是对数式的）：<b>近处精细</b>（距离 1,2,3,4 各一桶）、<b>远处粗糙</b>（100–200 共用一桶）、<b>最远全归最后一个桶</b> ⇒ 任意大的距离都有参数可用，<b>外推被分桶化解掉了</b>。",r:"⭐⭐ 一个很好的提问：<b>偏置加在这里不会和「概率要和为 1」冲突吗？</b>⇒ 答：<b>在 softmax 里面你想干什么都行，因为 softmax 反正会归一化</b>；可以把偏置想成「对远的更负、对近的没那么负」。★★★ 这句该记住 —— 它解释了注意力里一大类操作为什么合法：<b>causal mask 给未来位置加 −∞、padding mask、T5 偏置、ALiBi 线性罚</b>，全都是 softmax 之前往分数上加东西，而和为 1 永远自动成立。⇒ 偏置<b>不是概率，是罚分</b>。"});
  QUIZ(0,17,{t:"T5 为什么要把 m−n 「分桶」，而不是每个距离配一个参数？",o:["m−n 范围无界，每距离一个参数又会回到「训练时没见过的距离没有参数」；非均匀分桶（近细远粗、最远全归一桶）让任意距离都有参数可用","为了让偏置矩阵对称","为了减少显存占用","因为 softmax 只接受离散输入"],a:0,w:"⭐ 顺带记住那句回答：「在 softmax 里面你想干什么都行，因为 softmax 反正会归一化」—— causal mask、padding mask、各种 bias 全都靠这一点。"});
});

  note("★★ 所以 T5 和 ALiBi 讲完了，而它们都不是今天的主流",640,324,"r");
  note("⇒ 而那个主流就是接下来十二分钟的内容 —— RoPE",640,362,"g");},"<b>这一镜是一个很诚实也很重要的转折，而它顺带教了一件关于读论文的事。</b><br><b>讲者的话</b>：<b>「<u>而他们说了那个。所以他们有一些结果。所以所有这些论文，它们总是互相比较，来看哪一个 —— 我想 —— 更强一些。但现实是：在今天的模型里，大多数模型实际上用的是另一种位置嵌入方法。而我们现在就要看它</u>。」</b><br><b>★★★ 「<u>所有这些论文总是互相比，来看哪个更强；但现实是大多数模型用的是另一种</u>」—— 这两句放在一起，是一个很值得记的观察</b>：<b>⇒ <u>论文里的胜负，和实践中的采纳，是两件不同的事</u>。</b><br><b>⚠ 为什么会脱节，有几个很实际的原因</b>：<b>⇒ ① <u>论文的对比总是在作者自己选的设置上做的</u>；② <u>实践中的选择还要看实现成本、生态支持、和别的技术兼容不兼容</u>（比如 RoPE 和 FlashAttention、和 KV cache 的配合）；③ <u>有时候就是因为某个有影响力的开源模型用了它</u>。</b><br><b>★★ 所以讲者花四分钟讲了 T5 和 ALiBi，然后说「它们都不是主流」—— <u>这不是浪费</u>。</b><b>⇒ 因为那个 2×2 的格子你需要看全，<u>才知道 RoPE 填的是哪一格、以及它凭什么赢</u>。</b>");
  SUM(0,18,{h:"ALiBi：不学了，换一条确定性公式",k:"第四代 <b>ALiBi</b>，出自《<b>Train Short, Test Long</b>》—— <b>Attention with Linear Bias（带线性偏置的注意力）</b>。做法和 T5 刚好相反：<b>与其去学那些偏置，不如用一条「确定性公式」，它是那两个位置相对差的函数</b>。",m:"★★★ 四代排开就是一个漂亮的 2×2（<b>学 vs 不学</b> × <b>加在输入 vs 加在分数</b>）：<b>① 学出的向量+输入 ② 固定公式的向量+输入 ③ T5：学出的标量+分数 ④ ALiBi：固定公式的标量+分数</b>。⚠ 而「学 vs 不学」在两个位置上给出了同样的答案 —— <b>不学的那个赢了，因为它能外推</b>（固定公式天然定义在所有距离上，学出来的只在训过的范围里可信）。",w:"★★ 论文标题就是动机：<b>训练时用短序列，测试时能跑长序列而性能不塌</b>。这在 2021 年分量很重 —— 上下文长度已是竞争焦点，<b>而把训练长度拉长的代价是平方级的</b>，所以「短训练、长推理」直接等于省下大笔算力。⇒ 名字里的 <b>Linear</b> 就是全部技术内容：罚分和距离成线性关系。",r:"⚠⚠ 很诚实的转折：「<b>所有这些论文总是互相比，看哪个更强；但现实是今天大多数模型用的是另一种方法</b>」。★★★ 值得记的观察：<b>论文里的胜负和实践中的采纳是两件不同的事</b>。脱节的原因：① 论文对比总在作者自己选的设置上做；② 实践还要看实现成本、生态支持、与别的技术兼不兼容（RoPE 与 FlashAttention、KV cache 的配合）；③ 有时就因为某个有影响力的开源模型用了它。⇒ 所以讲 T5 和 ALiBi 不是浪费 —— <b>那个 2×2 要看全，才知道 RoPE 填的是哪一格、凭什么赢</b>。"});
  QUIZ(0,18,{t:"把四代位置编码排成 2×2，两个维度是什么？",o:["训练时 vs 推理时 × encoder vs decoder","绝对 vs 相对 × 稠密 vs 稀疏","维度高低 × 参数多少","「学 vs 不学」× 「加在输入 vs 加在分数」—— 四代正好填满四格"],a:3,w:"⚠ 而「学 vs 不学」在两个位置上给出了同样的答案：不学的赢了，因为固定公式天然定义在所有距离上，学出来的只在训过的范围里可信。"});

KP("19 · ⭐ RoPE 的核心动作：把 query 和 key 转一个角度",function(){

  note("⚠ 而「旋转」这个动作保范数 ⇒ 它不改变向量的长度，只改方向",640,362,"g");},"<b>一句话说完 RoPE，而它的位置和前四代都不一样。</b><br><b>讲者的话</b>：<b>「<u>所以这个方法依赖于：把 query 和 key 向量旋转某个角度</u>。」</b><br><b>★★★ 把它放回那条线上看，它动手的地方是全新的</b>：<b>⇒ <u>一、二代：动输入嵌入</u>（加一个向量上去）。</b><b>⇒ <u>三、四代：动注意力分数</u>（加一个标量上去）。</b><b>⇒ <u>RoPE：动 Q 和 K 本身</u>（对它们做一次旋转）。</b><br><b>★★ 而「旋转」这个选择有一个很关键的性质：<u>它保范数</u>。</b><b>⇒ 旋转一个向量，<u>方向变了、长度一点没变</u>。</b><b>⇒ 这意味着 RoPE <u>不会放大或缩小</u> query 和 key 的模长，<u>所以它不会干扰注意力分数的整体尺度</u>。</b><br><b>⚠ 对比一下：如果你选的是「给 Q 和 K 乘一个缩放因子」，那你会同时改变分数的大小，<u>softmax 的温度就跟着变了，训练可能不稳</u>。</b><b>⇒ <u>旋转是那种「只注入信息、不扰动数值」的操作 —— 这是它能被广泛采用的一个重要原因</u>。</b>");

  note("★★ 关键：转多少角度只看位置，而「转什么」是内容算出来的 q 和 k",640,364,"r");},"<b>这一镜把「谁转多少」说清楚了，而这里有一个很漂亮的分工。</b><br><b>讲者的话</b>：<b>「<u>而我想你可以这样想它：你有你的 query，你有你的 key —— 假设在一个 2 维空间里。那么你要做的是：把你的 query 旋转一个角度，这个角度是它的位置的函数；而你要把 key 向量旋转一个角度，这个角度是它的位置 n 的函数</u>。」</b><br><b>★★★ 分工在这里</b>：<b>⇒ <u>被转的东西（向量本身）来自内容</u>：q = W_q·x，它编码的是「这个词在问什么」。</b><b>⇒ <u>转多少（角度）来自位置</u>：角度只是 m 的函数，和词是什么完全无关。</b><br><b>★★ 于是位置和内容被干净地分到了两个不同的「通道」上</b>：<b>⇒ <u>内容决定向量的长度和初始方向；位置只决定再转多少度</u>。</b><b>⇒ 对比第一代：那里位置信息<u>被加进了同一个向量，和词义混成一团</u>（还记得 27:22 那个「间接」吗）。</b><br><b>⇒ <u>RoPE 的位置信息不混进内容里，它作用在内容之上 —— 这是一个结构上干净得多的做法</u>。</b><br><b>⚠ 而「假设在 2 维空间里」是一个简化，d 维怎么办他在 41:43 才补上。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("32:06","supposed to show this thing");
  note("⭐ 一个很有人味的瞬间",640,186,"y");
  boxNode(130,214,1020,44,"讲者：那顺便问一下，你怎么做到这件事？……我本来不该展示这个东西","b");
  note("⇒ 他发现下一页幻灯片已经写着答案了，于是自己把它遮回去",640,292,"d");
  note("★ 然后他问：对那些只想用直觉聊聊这件事的人，你会怎么下手？",640,324,"y");
  note("⚠ 这是个刻意的教学选择 —— 让你先自己想，而不是直接看答案",640,362,"r");},"<b>这是一个很有人味的瞬间，而它背后的教学选择是刻意的。</b><br><b>讲者的话</b>：<b>「<u>那么顺便问一句 —— 你要怎么做到这件事呢？我本来不该展示这个东西的。所以假设你有一个向量，而你想旋转那个向量 —— 因为我的答案已经在幻灯片上了。但你会怎么下手呢？我想，对那些只是想用直觉来聊这件事的人来说？</u>」</b><br><b>★★ 发生了什么：<u>他翻到下一页，发现答案已经写在上面了，于是停下来，把问题先抛给学生</u>。</b><br><b>★★★ 而这个选择是有道理的，因为「<u>先想再看</u>」和「<u>直接看</u>」留下的东西完全不同</b>：<b>⇒ 直接看到「旋转矩阵」四个字，你会点头，然后忘掉。</b><b>⇒ 而<u>先被问「你会怎么转一个向量」，你的脑子会去翻线性代数，然后自己想到矩阵乘法</u> —— 这时候那个答案就挂在了一个你自己搭的钩子上。</b><br><b>⚠ 这对你看录像的人同样适用：<u>这里就是暂停的地方</u>。</b><b>⇒ 先问自己：<u>在 2 维平面上，怎么用一次矩阵乘法把一个向量转 θ 度？那个矩阵长什么样？</u></b><b>⇒ 想三十秒再往下看，这一段的收获会差好几倍。</b>");
  SUM(0,19,{h:"⭐ RoPE 的核心动作：旋转 Q 和 K",k:"<b>这个方法依赖于把 query 和 key 向量「旋转」某个角度</b>：位置 m 的 query 转一个「<b>m 的函数</b>」的角度，位置 n 的 key 转一个「<b>n 的函数</b>」的角度（先在 2 维空间里想）。",m:"★★★ 它动手的地方是全新的：<b>一二代动输入嵌入（加向量）、三四代动注意力分数（加标量）、RoPE 动 Q 和 K 本身（旋转）</b>。★★ 而「旋转」有一个关键性质：<b>它保范数</b> —— 方向变了长度没变 ⇒ <b>不改变注意力分数的整体尺度</b>。⚠ 对比「给 Q/K 乘一个缩放因子」：那会同时改变分数大小，softmax 的温度跟着变、训练可能不稳。<b>旋转是「只注入信息、不扰动数值」的操作</b>。",w:"★★★ 一个很漂亮的分工：<b>被转的向量来自内容</b>（q = W_q·x，编码「这个词在问什么」），<b>转多少度只来自位置</b>（角度是 m 的函数，和词是什么无关）。⇒ 于是位置和内容被分到两个干净的通道上 —— 对比第一代，那里<b>位置信息被加进同一个向量、和词义混成一团</b>（就是那个「间接」）。<b>RoPE 的位置信息不混进内容，它作用在内容之上</b>。",r:"⭐ 一个很有人味的瞬间：讲者翻页发现答案已经在幻灯上，说「<b>我本来不该展示这个东西</b>」，然后把问题先抛给学生。★★★ 这个选择有道理 —— <b>直接看到「旋转矩阵」四个字你会点头然后忘掉；先被问「你会怎么转一个向量」，答案就挂在了你自己搭的钩子上</b>。⚠ 对你同样适用：<b>这里就是暂停的地方</b> —— 先自己想「2 维平面上怎么用一次矩阵乘法把向量转 θ 度」，再往下看。"});
  QUIZ(0,19,{t:"RoPE 选择「旋转」而不是「缩放」Q 和 K，一个关键好处是什么？",o:["旋转的计算更快","旋转矩阵的参数更少","旋转保范数 —— 只改方向不改长度，所以不扰动注意力分数的整体尺度（缩放会改 softmax 的温度）","旋转可以并行"],a:2,w:"★★★ 另一个漂亮之处是分工：被转的向量来自内容，转多少度只来自位置 —— 位置信息不混进内容，而是作用在内容之上。"});
});
KP("20 · 旋转矩阵，以及一个「我看了下时间」的瞬间",function(){

  note("⚠ 对照 17:02 那次（「谁还记得三角公式」）—— 同一个动作，同一个用意",640,362,"r");},"<b>这是讲者第二次在用一个前置知识之前先确认听众有，而两次的用意完全一样。</b><br><b>他的话</b>：<b>「<u>那么这里谁做过 —— 我不知道 —— 空间里的旋转？</u>」</b><b>⇒ 学生答：<u>矩阵乘法</u>。</b><b>⇒ 讲者：<u>那是对的，对。矩阵乘法。</u></b><br><b>★★ 把这两次放在一起看，模式就很清楚了</b>：<b>⇒ <u>17:02：「谁还记得三角函数公式？」⇒ 接下来九分钟全靠 cos(a−b)</u>。</b><b>⇒ <u>32:06：「谁做过空间里的旋转？」⇒ 接下来三分钟全靠旋转矩阵</u>。</b><br><b>★★★ 这个动作的价值不只是「避免讲太深」，<u>它还让学生成了答案的提出者</u></b>：<b>⇒ 「矩阵乘法」这四个字是<u>学生说出来的</u>，不是老师给的。</b><b>⇒ 而人对自己说出来的东西记得牢得多 —— <u>这就是为什么好的讲课里，关键词往往是从听众嘴里出来的</u>。</b><br><b>⇒ 顺带：这也是一次风险管理。<u>如果没人答得上来，他就知道这里得多花两分钟；而既然有人答对了，他可以直接往下走</u>。</b>");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();

  SUM(0,21,{h:"★★ 两行证明：乘上旋转矩阵就是转那个角",k:"要证：<b>用一次矩阵乘法就能在 2 维空间里旋转一个向量</b>。① 把 v 写成<b>直角坐标 (x,y)</b>；② 翻译成<b>极坐标 v = R(cos φ, sin φ)</b>（R 是范数、φ 是与 x 轴夹角）；③ 结论：<b>R(θ)·v = R(cos(θ+φ), sin(θ+φ))</b> —— <b>角度从 φ 变成 θ+φ，长度 R 一点没变</b>。",m:"★★★ 换表示就是全部技巧：<b>直角坐标里旋转很复杂（x 和 y 都变、互相纠缠），极坐标里旋转就是 φ → φ+θ、一个加法而已</b>。⇒ 这是数学里极常见的套路 ——<b>找一个让问题变简单的表示</b>（傅里叶把卷积变成乘法、对数把乘法变成加法、极坐标把旋转变成加法）。⇒ 把讲者留的那个乘法做一遍只用一次和角公式：<b>cosθ(Rcosφ)−sinθ(Rsinφ)=Rcos(θ+φ)</b>，第二行同理。",w:"★★★ 这是这一讲<b>第三次</b>用同一套三角恒等式：19:12 用 cos(a−b) 证正弦编码的相对性、这里用 cos/sin(a+b) 证旋转、38:30 还要再用一次证 RoPE 的相对性 ⇒ <b>整个位置编码这件事，数学上就架在「和角公式」这一条上</b>。⚠⚠ 记号坑：<b>这里的 R 是「范数」，而 R(θ) 是「旋转矩阵」</b> —— 讲者口头都念 R，靠括号和 θ 分辨。",r:"★★ 真正的工程含义：<b>旋转是线性的</b> ⇒ R(θ)(W_q x) 可重组为 (R(θ)W_q)x，<b>旋转能被吸收进投影矩阵</b>；而 R(θ) 是 2×2 块对角，实现上就是对相邻两维做几次乘加。⇒ 于是 RoPE 成本几乎为零：<b>没有新参数、几乎没有新计算、不改变任何张量形状</b> —— 这是它能一统天下的关键原因之一。⚠ 对比 T5 偏置要维护一张 n×n 矩阵，<b>和 FlashAttention 那类「不显式算出完整注意力矩阵」的优化配合很别扭；而 RoPE 只动 Q 和 K，对注意力内部实现完全透明</b>。"});

  boxNode(130,214,1020,44,"答：这其实是一条我相信是「数学上被证明出来」的曲线","g");
  note("⇒ 讲者：它有点复杂，我们不打算把公式写下来",640,292,"d");
  note("★ 但如果你感兴趣：RoFormer 那篇论文有一个附录，在那里他们数学上证明它被某个量上界住",640,324,"y");
  note("⚠⚠ 请记住这个论文名 —— RoPE 的原始论文叫《RoFormer》，不叫《RoPE》",640,362,"r");},"<b>最后一个提问问的是来源，而讲者给了一个很具体的去处。</b><br><b>学生的问题</b>：<b><u>你是怎么得到这条曲线的？</u></b><br><b>讲者的回答</b>：<b>「<u>所以这其实是一条我相信是在数学上被展示出来的曲线。所以它有点复杂，我们不打算把公式写下来。但如果你感兴趣的话 —— 在这篇论文里，在 RoFormer 那篇论文里，有一个附录，他们在那里数学上证明了它被某个量上界住。而这就是这个东西在显示的。对，很好的问题</u>。」</b><br><b>★★ 两件实用的信息</b>：<b>⇒ ① <u>RoPE 的原始论文叫《RoFormer: Enhanced Transformer with Rotary Position Embedding》</u>（苏剑林等，2021）。<u>如果你去搜「RoPE paper」，要找的就是这篇</u>。</b><b>⇒ ② <u>那个长程衰减的证明在附录里</u>，不在正文。</b><br><b>★★★ 而「<u>证明在附录里</u>」这件事本身有信息量</b>：<b>⇒ 它说明<u>作者自己也认为这是一个「锦上添花」的性质，而不是核心论证</u>。</b><b>⇒ RoPE 的核心论证是「相对位置性」（正文），<u>长程衰减是一个额外发现的好性质</u>。</b><br><b>⚠ 实际上后来的经验表明：<u>长程衰减有时反而是个麻烦</u> —— 它让模型对很远的 token 不敏感，<u>而这正是长上下文模型要去对抗的东西</u>。</b>");
  SUM(0,24,{h:"四个课堂提问：θ 是什么、d 维怎么办、曲线哪来的",k:"① <b>相对距离是被捕获在旋转矩阵里的？⇒ 正是如此</b>。② <b>θ 是什么？⇒ θ 其实是「固定的」</b> —— 就是前面那个 omega，是 i 和 d 的某个函数，「<b>这个 theta 大致就等于 omega i</b>」。③ <b>d 维怎么办？⇒ 按「块」切成一堆 2 维子空间</b>，i 在 1 到 d/2 之间。④ <b>那条衰减曲线哪来的？⇒ RoFormer 论文的附录里数学上证明它被某个量上界住</b>。",m:"★★★ 提问二是要害：RoPE 的动机就是「学出来的会过拟合、ALiBi 太僵硬」—— <b>如果 θ 是学出来的，RoPE 就掉回「会过拟合」那一边，整个卖点就没了</b>。所以「θ 固定」必须是真的，而它确实是：<b>θ_i = 10000^(−2i/d)，和第二代的 ω_i 同一条公式</b>。⇒ RoPE 的「无参数」是实打实的，唯一超参是那个 base（10000），<b>也是从第二代继承来的</b>。",w:"⚠⚠ 讲者主动承认「<b>我给你看的是 2 维空间，但这里我们在 d 维空间里 —— 我把这件事带得非常快</b>」，而这是实现时最要紧的一点。构造：<b>把 d 维切成 d/2 个 2 维块，第 i 块配自己的 θ_i，位置 m 处第 i 块被旋转 m·θ_i</b> ⇒ 整个矩阵是<b>块对角</b>的，乘一次只要 2d 次乘法（<b>和 d 成线性</b>）。★★★ 最漂亮的是：<b>每块频率不同 ⇒ 低 i 转得快（细粒度）、高 i 转得极慢（大尺度）—— 那张热力图的「低维高频、高维低频」在 RoPE 里原封不动地还在</b>。⚠ 实现坑：<b>哪两维配成一对（(0,1)(2,3)… 还是 (0,d/2)(1,d/2+1)…）不同实现真的不一样，配错权重完全不兼容</b>。",r:"★★ 位置信息「存在哪里」，RoPE 的答案和前四代都不同：<b>一二代存在一个向量里、三四代存在一个标量里、RoPE 存在一个算子（变换）里</b>。⇒ 后果是实际的：<b>加法项只能平移分数，而变换能重塑 q 和 k 的几何关系</b>。★★★ 时间账：位置嵌入从 10:44 讲到 42:43，<b>整整 32 分钟、占这一讲的三分之一</b> —— 而讲者自己说「我在这上面花了不少时间，因为我觉得这确实相当重要」。⇒ 值得：<b>今天所有「把 4K 扩到 128K」的工作（NTK 缩放、YaRN、位置插值）全都是在动 RoPE 的那个 θ</b>。⚠ 记住论文名：<b>《RoFormer》，不叫《RoPE》</b>；而证明在附录里说明<b>作者自己也认为长程衰减是锦上添花、不是核心论证</b>（后来的经验甚至表明长程衰减有时反而是麻烦 —— 它让模型对很远的 token 不敏感）。"});
  QUIZ(0,24,{t:"RoPE 在 d 维（d > 2）空间里是怎么做旋转的？",o:["用一个 d×d 的通用旋转矩阵","先降维到 2 维再旋转","对每一维单独乘一个 cos","把 d 维切成 d/2 个 2 维块，第 i 块用自己的频率 θ_i 各自做一次 2×2 旋转（块对角）"],a:3,w:"★★★ 于是「低维高频、高维低频」在 RoPE 里原封不动地还在。⚠ 实现坑：哪两维配成一对，不同实现真的不一样，配错权重完全不兼容。"});

  note("⇒ add = 残差（让梯度有一条直路）；norm = 归一化（让数值别跑飞）",640,386,"g");},"<b>这个名字就是字面意思，而它其实装了两件不同的事。</b><br><b>讲者的话</b>：<b>「<u>所以基本上，这里我们做的是：我们取这个子层的输入、以及这个子层的输出，我们把它们加起来，然后我们归一化。所以这是作者做的一个小技巧。而它在实践中被证明能改善收敛、并且就是让收敛更快一些</u>。」</b><br><b>★★★ 请注意 <u>Add & Norm</u> 这个方块里装的是<u>两个独立的机制</u>，而它们解决的是两个不同的问题</b>：<b>⇒ <u>Add（加）＝ 残差连接</u>。它把输入直接搭到输出上，<u>于是梯度有一条不经过子层的直路可以回传</u> —— 这是能把网络堆到几十上百层的前提。</b><b>⇒ <u>Norm（归一化）</u>。它把数值拉回一个合适的范围，<u>于是各层的激活不会越传越离谱</u>。</b><br><b>★★ 很多人（包括很多教程）把这两件事混着说，<u>但它们是可以分开讨论的</u>。</b><b>⇒ 证据就是：<u>后来的改动动的只是「Norm 放在哪」和「Norm 怎么算」，而「Add」从头到尾没变过</u>。</b><br><b>⇒ <u>残差连接是整个深度学习里最稳的一个设计 —— 2015 年的 ResNet 提出来，十年没人动过它</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("44:48","if you have a vector, sometimes the components of the vector can be super large, sometimes they can be super small");

  note("★ 注意这里说的是「一个向量内部」的分量 —— 这正是 LayerNorm 和 BatchNorm 的分界",640,364,"r");},"<b>问题陈述很朴素，但请盯住一个词：它说的是「一个向量内部」的分量。</b><br><b>讲者的话</b>：<b>「<u>所以想法是这样的 —— 如果你有一个向量，有时候这个向量的分量可以超级大，有时候它们可以超级小。这里的想法是把你这个向量的分量归一化到某个范围里、某个归一化后的范围</u>。」</b><br><b>★★★ 「<u>你这个向量的分量</u>」这几个字就是 <u>LayerNorm</u> 的定义核心，而它正是和 BatchNorm 的分界线</b>：<b>⇒ <u>LayerNorm</u>：对<u>同一个向量内部</u>的那 d 个分量求均值和标准差。</b><b>⇒ <u>BatchNorm</u>：对<u>一个 batch 里不同样本的同一个分量</u>求均值和标准差。</b><br><b>⇒ 两者归一化的「方向」是垂直的。<u>而讲者在 49:49 那镜会被学生问到这件事，到时候可以回头对照</u>。</b><br><b>★★ 先把这个区别记住一个最实用的后果：<u>LayerNorm 对每个样本独立计算，所以它和 batch size 无关，甚至 batch size = 1 也能算</u>。</b><b>⇒ 而这对<u>推理</u>极其重要 —— 推理时常常就是一个样本一个样本地来。</b>");

  note("★ 再用它的标准差去「归一化」它",640,258,"g");},"<b>公式很简单，而值得留意的是它用的是什么统计量。</b><br><b>讲者的话</b>：<b>「<u>所以你要做的方式是：你要取你的向量，然后把它减掉算出来的均值 —— 那基本上就是它各个分量的和 —— 然后基本上用它的标准差去归一化它</u>。」</b><br><b>★★ 两个动作，两个作用</b>：<b>⇒ <u>减均值（中心化）</u>：把这个向量的「整体偏移」去掉，<u>于是归一化后的向量均值为 0</u>。</b><b>⇒ <u>除标准差（缩放）</u>：把这个向量的「整体尺度」统一掉，<u>于是归一化后的标准差为 1</u>。</b><br><b>★★★ 请记住这两个动作，因为 <u>RMSNorm 恰好砍掉了第一个</u>（47:29 那镜）。</b><b>⇒ RMSNorm 不减均值，<u>它只除以均方根</u>。</b><b>⇒ 所以当你看到 RMSNorm 时，脑子里该浮现的问题是：<u>「不减均值真的没关系吗？」</u></b><br><b>⚠ 答案是在深层网络里基本没关系（经验上），<u>而这正是讲者那句「收敛性质基本上相当」的内容</u>。</b><b>⇒ 但它是一个经验结论，不是一个定理 —— <u>这个区别值得留着</u>。</b>");
  SUM(0,25,{h:"第二个变过的部件：层归一化",k:"架构图上那些写着 <b>add and norm</b> 的方块是什么意思？⇒ 字面意思：<b>取这个子层的「输入」和「输出」，加起来，然后归一化</b>。这是作者做的一个小技巧，<b>实践中被证明能改善收敛、让收敛更快</b>。归一化本身：<b>把向量减掉算出来的均值，再用它的标准差去归一化</b>。",m:"★★★ 这个方块里装的是<b>两个独立的机制</b>：<b>Add ＝ 残差连接</b>（把输入直接搭到输出上 ⇒ 梯度有一条不经过子层的直路，这是能堆几十上百层的前提）；<b>Norm ＝ 归一化</b>（把数值拉回合适范围 ⇒ 各层激活不会越传越离谱）。⇒ 证据是它们可以分开：<b>后来的改动动的只是「Norm 放哪」和「Norm 怎么算」，Add 从头到尾没变过</b>（残差是整个深度学习里最稳的设计，2015 年 ResNet 提出来十年没人动）。",w:"★★★ 「<b>你这个向量的分量</b>」这几个字就是 LayerNorm 的定义核心，也是和 BatchNorm 的分界：<b>LayerNorm 对同一个向量内部的 d 个分量求均值方差；BatchNorm 对一个 batch 里不同样本的同一个分量求</b> —— 两者方向垂直。⇒ 最实用的后果：<b>LayerNorm 对每个样本独立计算，和 batch size 无关，batch size = 1 也能算</b>，而这对推理极其重要。",r:"★ 他的切入点很好：从「<b>架构图上那个你早就见过、但可能一直没想过的方块</b>」出发，而不是从定义出发 ⇒ 通用教学模式：<b>找到学习者已经见过但没理解的东西，从那里开始</b> —— 它天然带着一个你自己早就挂好的钩子。⇒ 归一化的两个动作要记住：<b>减均值（中心化，均值→0）＋ 除标准差（缩放，标准差→1）</b>，因为 <b>RMSNorm 恰好砍掉了第一个</b>。"});
  QUIZ(0,25,{t:"Add & Norm 这个方块里装的两件事分别解决什么问题？",o:["Add 是为了增加参数，Norm 是为了减少参数","两者都是为了归一化数值","Add 用于训练，Norm 用于推理","Add = 残差连接（给梯度一条不经过子层的直路，能堆深）；Norm = 归一化（让各层激活不越传越离谱）"],a:3,w:"⇒ 证据是它们可以分开：后来的改动只动了「Norm 放哪」和「Norm 怎么算」，而 Add 从头到尾没变过。"});
});

KP("28 · 两个很好的提问：为什么要归一化、和 BatchNorm 的区别",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("48:12","So the question is, what is the intuition behind normalizing?");
  note("提问一（讲者：好问题）：归一化背后的直觉是什么？",640,186,"v");
  boxNode(130,214,1020,44,"答：看你的模型 —— 你有好几层","g");
  note("⇒ 在某些层里，你的向量 —— 更准确地说，你的「激活（activation）」—— ",640,292,"y");
  note("★ 讲者顺手补了个术语：从这里到那里的那个向量，基本上就叫做 activation",640,324,"g");
  note("⚠ 他的教法很一致：用到一个词之前先把它铺出来（L1 里也是这样）",640,362,"r");},"<b>这个提问讲者评为好问题，而他的回答里顺手铺了一个术语。</b><br><b>学生的问题</b>：<b><u>归一化背后的直觉是什么？</u></b><br><b>讲者的回答开头</b>：<b>「<u>所以这个直觉是：如果你看你的模型，你有好几层。在某些层里，你的向量 —— 更准确地说是你的激活 —— 所以你们知道吗，你看到的那个从这里走到那里的向量，基本上就叫做 activation（激活）</u>。」</b><br><b>★★ 请注意他在半句话中间停下来，<u>先把「activation」这个词定义了一遍</u>。</b><br><b>⇒ 这和他在 L1 里的做法完全一致：<u>用到一个术语之前先把它铺出来</u>。</b><b>⇒ L1 里他也是这样处理 <u>proxy task、OOV、perplexity</u> 的。</b><br><b>★★★ 而「<u>从这里走到那里的那个向量</u>」这个定义方式特别好</b>：<b>⇒ 他没有给一个抽象定义（「激活是神经元的输出值」），<u>而是指着架构图上的一段箭头说「就是这个」</u>。</b><b>⇒ <u>在一个有图的场合，指着图定义术语，比用文字定义准确得多</u>。</b><br><b>⇒ 顺带把这个词钉死：<u>激活 = 层与层之间流动的那些向量</u>，不是权重、不是梯度。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("48:45","the model is typically having trouble in learning the weights in each of these layers if these activations, they vary too much");
  note("⭐⭐ 这就是归一化的直觉，一句话",640,186,"y");
  boxNode(130,214,1020,44,"如果这些激活「变化太大」，模型在学每一层的权重时通常会有困难","g");
  note("⇒ 有时激活在它的某一部分分量上有极端值，有时在另一部分",640,292,"y");
  note("★ 所以想法是：把激活各分量的值带到「某个不太偏向任何方向」的范围里",640,324,"g");
  note("⚠ 关键词是「vary too much（变化太大）」—— 不是「太大」，是「变化太大」",640,362,"r");},"<b>这就是归一化的直觉，而关键词是「变化太大」而不是「太大」。</b><br><b>讲者的话</b>：<b>「<u>有时候激活在它某一部分分量上有极端值，有时候在另一部分。而如果这些激活变化太大，模型在学习这些层里每一层的权重时，通常会有困难。所以想法是把激活各分量的值带到某个不会在某个方向上偏太远的范围里</u>。」</b><br><b>★★★ 为什么是「<u>变化太大</u>」而不是「太大」—— 这个区别是实质性的</b>：<b>⇒ 如果所有激活都稳定地很大（比如都在 100 左右），<u>模型只要学一组相应小一点的权重就能适应</u>。</b><b>⇒ 麻烦在于<u>它不稳定</u>：这一步激活在 100，下一步在 0.01。<u>那模型该把权重调到多大？</u></b><br><b>★★ 这正好解释了为什么归一化能加速收敛</b>：<b>⇒ <u>每一层看到的输入分布被稳住了，于是它要学的那个函数不再是一个「移动的靶子」</u>。</b><b>⇒ 没有归一化时，第 10 层每一步都在适应前 9 层变化带来的新分布 —— <u>它学到的东西下一步就过时了</u>。</b><br><b>⇒ <u>而这个「移动的靶子」现象，就是下一镜那个术语说的事</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("49:09","there is this key word, internal covariate shift");
  note("⭐ 讲者给了一个可以自己去查的关键词",640,186,"y");
  boxNode(130,214,1020,44,"internal covariate shift（内部协变量偏移）","g");
  note("⇒ 讲者：这基本上就是给我这里描述的这个现象起的那个名字",640,292,"y");
  note("★ 「万一你感兴趣，有这个关键词」—— 这种给法很实用",640,324,"g");
  note("⚠ 但要知道：这个解释后来被相当有力地质疑过（下面说）",640,362,"r");},"<b>讲者给了一个关键词，而关于这个关键词有一段值得知道的后续。</b><br><b>他的话</b>：<b>「<u>所以万一你感兴趣，有这么一个关键词 —— internal covariate shift（内部协变量偏移）—— 它基本上就是给我在这里描述的这个现象起的那个名字。所以是的，这就是那个直觉</u>。」</b><br><b>★★ 这个词出自 2015 年 BatchNorm 那篇论文，<u>它是归一化最初被提出时给的解释</u>：</b><b>⇒ 「<u>内部</u>」= 网络内部；「<u>协变量偏移</u>」= 输入分布发生变化。<u>合起来就是「每一层的输入分布在训练过程中不断漂移」</u>。</b><br><b>⚠⚠ 但这个解释后来被相当有力地质疑了</b>：<b>⇒ 2018 年有一篇很有影响的工作（<u>How Does Batch Normalization Help Optimization?</u>）做了实验：<u>人为地在归一化之后再注入噪声、把分布偏移重新制造出来 —— 结果训练依然又快又稳</u>。</b><b>⇒ 他们的结论是：<u>归一化的真正好处是「让损失曲面更平滑」，而不是消除了协变量偏移</u>。</b><br><b>★★★ 所以这是一个「<u>解释被推翻、但技术依然有效</u>」的经典例子</b>：<b>⇒ <u>BatchNorm 和 LayerNorm 一直都管用，只是当初说的那个原因可能不对</u>。</b><b>⇒ 讲者说的是「这是给这个现象起的名字」，这个措辞是安全的。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("49:32","batch normalization is normalization across the other dimension, which is the dimension of the batch");
  note("提问二（讲者：很好很好的问题）：这个和 batch normalization 有什么区别？",640,186,"v");
  boxNode(70,214,520,44,"LayerNorm","g");
  note("沿着「一个向量内部的各分量」归一化",330,284,"g");
  boxNode(690,214,520,44,"BatchNorm","b");
  note("沿着「另一个维度」—— batch 那一维",950,284,"b");
  note("⇒ 讲者：假设你有一堆向量，你把每个分量相对「其它向量的同一个分量」去归一化",640,326,"y");
  note("★ 所以两者的方向是垂直的 —— 一个横着归一化，一个竖着",640,364,"r");},"<b>这个提问讲者连说了两次「很好的问题」，而答案的关键就一个字：方向。</b><br><b>学生的问题</b>：<b><u>这个和 batch normalization 有什么区别？</u></b><br><b>讲者的回答</b>：<b>「<u>所以 batch normalization 是沿着另一个维度做的归一化，也就是 batch 那个维度。所以假设你有一堆向量 —— 你做的是：把每一个分量，相对于「同一个维度上、但属于其它那些向量的」所有分量去归一化。所以你可以把它想成只是另一种归一化的方式</u>。」</b><br><b>★★★ 画一张表就最清楚了。设你有一个 batch，形状是 <u>（B 个样本 × d 个维度）</u></b>：<b>⇒ <u>LayerNorm：沿着 d 这一行算均值方差</u>（每个样本自己算一组）。</b><b>⇒ <u>BatchNorm：沿着 B 这一列算均值方差</u>（每个维度算一组，跨所有样本）。</b><br><b>★★ 而「<u>只是另一种归一化的方式</u>」这个说法很到位：<u>它们在数学上是对称的，没有哪个天生更对</u>。</b><b>⇒ 决定用哪个的<u>不是数学，是你的数据形状和使用场景</u>。</b><b>⇒ <u>CNN 的图像任务里 BatchNorm 一直是主流；而序列模型里是 LayerNorm</u>。下一镜说为什么。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:10","because BatchNorm, you are basically also dependent on the batch");
  note("⭐⭐ 为什么 transformer 用 LayerNorm 而不用 BatchNorm",640,188,"y");
  boxNode(70,216,520,44,"理由一","g");
  note("可能因为经验上它效果更好",330,286,"d");
  boxNode(690,216,520,44,"理由二（更硬的那个）","b");
  note("BatchNorm 让你「依赖于那个 batch」",950,286,"r");
  note("⇒ 而这会引入「训练时和推理时之间的差异」",640,328,"r");
  note("★★ 这就是那个硬理由 —— 推理时常常只有一个样本，哪来的 batch 统计量？",640,366,"y");},"<b>这一镜给出了两个理由，而第二个是真正硬的那个。</b><br><b>讲者的话</b>：<b>「<u>不过话说回来，当涉及到这些基于 transformer 的模型时，人们典型地用 LayerNorm —— 可能是因为经验上它效果更好。但也因为 BatchNorm，你基本上也依赖于那个 batch。而它可以引入、我想是、训练和推理之间的差异。所以这基本上就是原因</u>。」</b><br><b>★★★ 把第二个理由展开，它是一个很具体的工程问题</b>：<b>⇒ BatchNorm 要用<u>整个 batch</u>的统计量。训练时 batch 有 32、256 个样本，<u>统计量算得出来</u>。</b><b>⇒ 但<u>推理时你常常只有一个样本</u> —— 用户发来一句话，你就得回答。<u>一个样本的「跨样本均值」是什么？没有意义</u>。</b><br><b>⇒ 所以 BatchNorm 必须在训练时<u>额外维护一组滑动平均的统计量</u>，推理时拿它们来用。</b><b>⚠ 而这就是那个「<u>训练和推理之间的差异</u>」：<u>训练用的是当前 batch 的真实统计量，推理用的是历史平均 —— 两者不是同一个函数</u>。</b><br><b>★★ 而 <u>LayerNorm 完全没有这个问题：它只看当前这一个向量</u>。</b><b>⇒ <u>训练和推理算的是同一件事，batch size 是 1 还是 1000 毫无区别</u>。</b><b>⇒ 对一个要服务线上请求的模型，<u>这个性质几乎是必需的</u>。</b>");
  SUM(0,28,{h:"两个很好的提问：为什么归一化、与 BatchNorm 的区别",k:"① <b>归一化的直觉</b>：模型有好几层，<b>而如果这些「激活」变化太大，模型在学每一层的权重时通常会有困难</b> ⇒ 想法是把激活各分量带到某个不会偏太远的范围。关键词：<b>internal covariate shift（内部协变量偏移）</b>。② <b>与 BatchNorm 的区别</b>：<b>BatchNorm 是沿「另一个维度」—— batch 那一维 —— 归一化</b>，把每个分量相对「其它向量的同一个分量」去归一化。",m:"★★★ 关键词是「<b>变化太大</b>」而不是「太大」：所有激活都稳定地很大，模型学一组小权重就能适应；<b>麻烦在于它不稳定 —— 这一步 100、下一步 0.01，那权重该调到多大？</b>⇒ 这正解释了为什么归一化加速收敛：<b>每一层看到的输入分布被稳住了，它要学的函数不再是一个「移动的靶子」</b>。⇒ 画表最清楚（B 个样本 × d 维）：<b>LayerNorm 沿 d 这一行算（每样本一组），BatchNorm 沿 B 这一列算（每维一组、跨样本）—— 方向垂直</b>。",w:"⭐⭐ 为什么 transformer 用 LayerNorm：<b>理由一，可能因为经验上效果更好；理由二（更硬），BatchNorm 让你「依赖于那个 batch」，而这会引入「训练时和推理时之间的差异」</b>。★★★ 展开：<b>推理时常常只有一个样本，一个样本的「跨样本均值」没有意义</b> ⇒ BatchNorm 必须额外维护滑动平均统计量，<b>于是训练用当前 batch 的真实统计量、推理用历史平均 —— 不是同一个函数</b>。而 <b>LayerNorm 只看当前这一个向量，训练和推理算的是同一件事</b>，对要服务线上请求的模型几乎是必需的。",r:"⚠⚠ 关于 internal covariate shift 有一段后续值得知道：它出自 2015 年 BatchNorm 那篇论文，<b>但 2018 年《How Does Batch Normalization Help Optimization?》做了实验 —— 人为在归一化后注入噪声、把分布偏移重新造出来，训练依然又快又稳</b>，结论是<b>归一化的真正好处是「让损失曲面更平滑」而不是消除了协变量偏移</b>。★★★ 所以这是「<b>解释被推翻、但技术依然有效</b>」的经典例子。⇒ 另外讲者顺手铺了术语：<b>激活 = 层与层之间流动的那些向量</b>（不是权重、不是梯度），而他指着架构图上那段箭头说「就是这个」—— <b>在有图的场合，指着图定义术语比文字定义准确得多</b>。"});
  QUIZ(0,28,{t:"transformer 用 LayerNorm 而不用 BatchNorm，那个「更硬」的理由是什么？",o:["LayerNorm 的参数更少","BatchNorm 无法并行","BatchNorm 依赖整个 batch ⇒ 推理时常只有一个样本，必须改用历史滑动平均，于是训练和推理不是同一个函数","BatchNorm 不支持变长序列"],a:2,w:"⇒ 而 LayerNorm 只看当前这一个向量，训练和推理算的是同一件事，batch size 是 1 还是 1000 毫无区别。"});
});
KP("29 · ⚠ 第三个部件：注意力，以及那个 O(n²)",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:51","letting every token interact with all other tokens");
  note("三个部件里的第三个",640,186,"v");
  seq(100,214,["位置嵌入 ✓","层归一化 ✓","注意力 ← 现在"],["d","d","g"],340,44);
  note("⇒ 讲者：现在我们要看 transformer 第三个重要的部件 —— 注意力",640,290,"y");
  note("★ 而他的切入句很诚实：有件事我其实一直没真正强调",640,322,"g");
  note("⚠ 那件事就是：自注意力的「代价」",640,360,"r");},"<b>第三个部件，而讲者的切入方式是承认自己漏讲了一件事。</b><br><b>他的话</b>：<b>「<u>好，所以我们看了位置嵌入，我们看了层归一化。那么现在我们要看 transformer 第三个重要的部件 —— 它是注意力。而特别是，我想有一件事我其实并没有真正强调过</u>。」</b><br><b>★★ 「<u>有件事我其实没真正强调过</u>」—— 而那件事是自注意力的代价。</b><br><b>⇒ 回想 L1 和这一讲前面：<u>每一次讲自注意力，强调的都是它的好处</u> —— 每个 token 能直接看到所有 token、完全并行、GPU 爱矩阵。</b><br><b>★★★ 而这一镜开始讲的是账单的另一面：<u>「每个 token 看所有 token」这件事，本身就是 O(n²)</u>。</b><br><b>⇒ 其实这个代价一直在眼前：<u>01:38 那镜他复述自注意力时说的就是「每个 token 关注序列里所有其它 token」</u>。</b><b>⇒ 当时我就标注过：<u>「所有其它 token」这几个字正是 O(n²) 的来源</u>。</b><br><b>⇒ 现在它要被正式结账了。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:57","a matrix that shows all the interactions");
  note("那个 n×n 的交互矩阵",640,186,"v");
  var M=[["q₁·k₁","q₁·k₂","⋯"],["q₂·k₁","q₂·k₂","⋯"],["⋮","⋮","⋱"]];
  matrix({rows:3,cols:3,cw:120,ch:42,x:460,y:206,cell:function(i,j){return M[i][j];}});
  note("⇒ 行是 query 的位置，列是 key 的位置",640,346,"y");
  note("★ n 是序列长度 ⇒ 这张表有 n×n 个格子，每个格子都要算一次点积",640,378,"g");},"<b>把那张表画出来，代价就一目了然了。</b><br><b>讲者的话</b>：<b>「<u>但当你做自注意力时，你基本上让每一个 token 和所有其它 token 交互。所以当你看一个显示所有这些交互的矩阵时 —— 你有 n，序列长度</u>。」</b><br><b>★★ 这就是 L1 里那个 <u>QKᵀ</u></b>：<b>⇒ <u>行 = query 的位置</u>（谁在问）；<u>列 = key 的位置</u>（问谁）。</b><b>⇒ 第 (i,j) 个格子 = <u>token i 的 query 和 token j 的 key 的点积</u>。</b><br><b>★★★ 而「<u>每个 token 和所有其它 token 交互</u>」就是说<u>这张表每个格子都要填</u></b>：<b>⇒ 格子数 = <u>n × n</u>。</b><b>⇒ 每个格子要算一次 d_k 维的点积。<u>所以总计算量是 n²·d_k</u>。</b><br><b>⇒ 而更要命的往往不是计算量，是<u>存储</u>：<u>这张 n×n 的矩阵要存下来做 softmax</u>。</b><b>⇒ n = 1000 时是 100 万个数（还要乘头数和 batch）；<u>n = 100000 时是 100 亿个数 —— 一张显卡根本放不下</u>。</b><br><b>★ 这是 L4 讲 FlashAttention 时真正要解决的问题，<u>而今天这镜是它的起点</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("51:06","you basically have o of n squared complexity, which is a lot, especially as n grows longer");
  note("⭐⭐ 结论：O(n²) 的复杂度",640,186,"y");
  boxNode(130,214,1020,44,"讲者：而这「很多」—— 尤其是当 n 变得更长的时候","g");

  note("⚠ 而 MHA 就是 g = h 这个特例 —— 它不是「另一种机制」，是这个连续谱的端点",640,386,"r");},"<b>这一镜把那三个缩写从「名字」变成「一个可以算的数」。</b><br><b>讲者的话</b>：<b>「<u>你有中间的情形：你共享 g 个 —— g 是组数 —— g 组用于 v 和 k 的投影矩阵。然后你有大小为 h 除以 g 的那些组。所以这个叫 Group Query Attention，GQA</u>。」</b><br><b>★★★ 把三个数摆出来，整件事就只是一个比例</b>：<b>⇒ <u>query 的投影矩阵：h 个</u>，每个头一个，<u>五代里从来没动过</u>。</b><b>⇒ <u>K、V 的投影矩阵：g 个</u>。</b><b>⇒ <u>每组含 h/g 个头</u>，它们共用同一套 K、V。</b><br><b>★★ 代入真实的数字（Llama 3 8B）：<u>h = 32，g = 8</u></b>：<b>⇒ <u>每 4 个头共用一套 K、V</u>。</b><b>⇒ 于是 KV 缓存从「32 套」降到「8 套」—— <u>只剩 1/4</u>。</b><b>⇒ 而那个 17 GB 的例子就变成约 <u>4 GB</u>。</b><br><b>★★★ 而最该看清的是：<u>MQA 和 MHA 都只是 g 的两个端点</u></b>：<b>⇒ <u>g = 1 ⇒ MQA</u>（全部头共用一套）。</b><b>⇒ <u>g = h ⇒ MHA</u>（每头一套，也就是原来的多头注意力）。</b><br><b>⇒ 所以这<u>不是三种不同的机制</u>，<u>而是同一个机制上的一个可调参数</u>。</b><b>⇒ <u>把三个名字还原成一个数（g），你要记的东西就从三样变成了一样</u>。</b>");
  SUM(0,33,{h:"⭐⭐ MQA / GQA / MHA",k:"第二个变体（和第一个<b>正交</b>）：<b>不要每个头一个投影矩阵，而是跨多个头「共享」投影矩阵</b> —— 具体是 <b>query 保留若干个投影矩阵，而把 key 和 value 的投影矩阵分组、跨几个头共享</b>。三档：<b>MQA（全部 h 个头共享同一组 K、V）、GQA（分成 g 组，每组 h/g 个头）、MHA（每头自己的 Q/K/V —— 标准多头）</b>。",m:"★★★ 真正的理由（硬的那个）来自生成过程的不对称：<b>解码时你在「当前词」和「之前所有词」之间做注意力，每生成一个新词都要再做一次 ⇒ K 和 V 会反复出现</b>。⇒ 看清楚：<b>生成第 t 个词只需要第 t 个位置的 query（一个向量），却需要前面全部 t−1 个位置的 key 和 value（两个 (t−1)×d 矩阵）</b> ⇒ <b>Q 是 O(1)，K 和 V 是 O(t)，而 t 一直在增长</b> ⇒ 要省就该省那个会增长的。",w:"⭐⭐ 关键词 <b>KV cache</b>（下一讲讲）：<b>把 key 和 value 的值存下来，而我们想要的是让那个 cache 不要变得太大 —— 跨头共享投影矩阵就能省下空间和内存，这就是那个「为什么」</b>。⇒ 算一下：缓存大小 = <b>层数 × 头数 × 序列长度 × d_head × 2</b>；一个 7B 模型、32 层、32 头、d_head 128、序列 32000 ⇒ <b>约 17 GB（fp16），比模型权重本身还大</b>。而 GQA 把 K/V 头数从 32 降到 8 ⇒ <b>缓存降到约 4 GB</b>。★★ <b>所以 GQA 不是为了更快算，是为了放得下</b>，收益在<b>长上下文、大 batch 的推理服务</b>里最明显。",r:"★ 「正交」是数学借词，意思是<b>两个变体互不干涉、可以同时用</b>：<b>滑动窗口省「序列方向」的计算，共享投影省「头方向」的内存</b>（Mistral 7B 就是两个一起用）。⇒ 值得学的判断：面对一堆优化手段时<b>先问「它们省的是同一样东西吗」—— 是，就只能选一个；正交，就能叠加</b>。⇒ 软理由（讲者自己说只是「可能说得通」，还坦白「人们做事就是去试试行不行」）：<b>query 代表「问法」而不同的头该有不同问法，K/V 代表「被问的东西是什么」，这件事相对客观、不太需要多个版本</b>。⇒ 三个名字都在说「query 有几种」，因为变化的那一半恰恰是 K、V 共享了多少。"});
  QUIZ(0,33,{t:"为什么共享 K 和 V 的投影矩阵，而不共享 Q 的？",o:["解码时每生成一个词只需要 1 个 query，却需要全部历史的 K 和 V ⇒ Q 是 O(1)、K/V 是 O(t) 且 t 在增长，所以要省就省会增长的那个","因为 Q 的参数更多","因为 Q 必须保持精度","因为 K 和 V 在数学上是等价的"],a:0,w:"⇒ 具体地：7B 模型 32 层 32 头、序列 32000 的 KV cache 约 17 GB（比权重还大）；GQA 把 K/V 头数降到 8 ⇒ 约 4 GB。所以 GQA 不是为了更快算，是为了放得下。"});
});

  SUM(0,34,{h:"两个收尾提问：用在哪些层、怎么选",k:"① <b>要用到自注意力和交叉注意力上吗？</b>⇒ <b>典型是在 decoder 里的「带掩码自注意力」那里起作用，但这个技术可以用在所有注意力层</b>；而<b>现代 LLM 是 decoder-only 模型，基本上只有 transformer 的 decoder 部分</b>。② <b>怎么知道该用哪一个？</b>⇒ <b>这个选择永远由几个因素驱动：表现多好、你多在乎延迟和成本、模型多大、想省多少算力、输入长度如何</b>。",m:"⚠⚠ 讲者本想推给 Shervine，但漏了下半场最重要的那个结论：<b>「我们在如今的模型里其实放弃了 encoder」</b>。⇒ 回想 03:12：<b>transformer 最初为机器翻译设计所以有两半，而今天的 LLM 只有一个序列（给 prompt、往下写），所以 encoder 没有事情可做</b>。★★ 这个剧透有价值 —— <b>它让你带着一个明确的问题去听下半场：为什么是 decoder 赢了？</b>",w:"★★★ GQA 的收益只在「带掩码自注意力 + 自回归生成」这个组合里才成立，值得想清楚：<b>GQA 省的是 KV cache，而 KV cache 只在「一个词一个词往下生成」时才存在</b> ⇒ <b>如果你只做分类（BERT 那样一次过完整个句子），根本没有 cache 要省</b>。⚠ 所以 GQA 是一个「<b>为生成式推理而生</b>」的技术 —— 这也是它在 2023 年之后才普及的原因。",r:"把因素整理成判断表：<b>输入很短 ⇒ cache 本来不大、MHA 就行；输入很长或 batch 很大 ⇒ GQA 甚至 MQA；模型很大（层多头多）⇒ 必须共享；追求极致质量不在乎成本 ⇒ MHA</b>。⇒ 讲者那句最该记的总结：「<b>这里我们想做的是，避免为整个那个 O(n²) 的东西做所有这些事情</b>」—— 一切优化的出发点都是那个平方项。★★ 而他的回答顺序值得学：<b>先说「没有标准答案、取决于一堆因素」（诚实），再说「但典型来说你会看到 GQA」（有用）</b> —— 两句都说才完整，只说第一句是推诿、只说第二句是过度简化。⇒ 事实对得上：<b>Llama 2 70B、Llama 3 全系、Mistral、Qwen 2、Gemma 都是 GQA；MQA 用得少（质量损失大），纯 MHA 基本只在小模型和老模型里</b>。"});
  QUIZ(0,34,{t:"为什么 GQA 是一个「为生成式推理而生」的技术？",o:["因为它需要 RoPE 配合","因为它在训练时会降低质量","因为它只在 encoder 里有效","它省的是 KV cache，而 KV cache 只在「一个词一个词往下生成」时才存在 —— 做分类时根本没有 cache 要省"],a:3,w:"⇒ 默认值可以直接拿走：「典型来说你会看到 GQA」—— Llama 3 全系、Mistral、Qwen 2、Gemma 都是 GQA。"});

  SUM(0,35,{h:"Shervine 接手：三类架构，先看 T5 家族",k:"下半场两件事：<b>① 深入看 transformer 格局里「有哪些种类的模型」；② 深入一个「对分类场景特别有用」的具体架构</b>。先看 <b>T5 家族</b>：<b>T5 = 多个 T 的缩写 —— Transfer Text-to-Text Transformer</b>（不是「第 5 版」）。变体：<b>mT5（m = multilingual，在数据和「词表在什么上面算出来」这两件事上做了更多工作）</b>；<b>ByT5（By = byte，一种「免 tokenizer」的方法 —— 放弃 tokenization，在字节层面操作，词表从约 3 万降到 2⁸ = 256）</b>。",m:"★★ 名字里最重要的是中间那段 <b>Text-to-Text</b>：T5 的核心主张是「<b>把所有 NLP 任务都写成「输入一段文本、输出一段文本」</b>」（分类就输出类别名、翻译就输出译文、甚至回归就输出数字的文本形式）⇒ <b>这个想法在 2019 年相当激进，今天已是常识 —— 所有 LLM 都是这么用的</b>。",w:"★★★ mT5 改的是<b>数据 + 词表，不是架构</b>，而「词表」是多语言最实际的难题：<b>如果语料 95% 是英文，学出来的词表几乎全是英文子词 ⇒ 一个中文词被切成五六个 token，而同义的英文词只占一个</b> ⇒ <b>中文用户为同样内容付更多 token 费、更快撞到上下文上限</b>（今天所有 LLM 上都真实存在）。所以 mT5 做的是<b>在语言分布更均衡的语料上重学词表</b> —— 比「加几层」要紧得多。",r:"ByT5 解决了 tokenization 的全部麻烦：<b>没有 OOV、没有语言偏见、没有拼写盲区</b>（能看到每个字符 ⇒ 能数字母、能处理错别字，这是今天 LLM 的著名弱点）。⇒ 参数也省：<b>嵌入矩阵从 30000×d 降到 256×d —— d=768 时从 2300 万降到 20 万</b>，输出层同样。⚠ 但代价很大：<b>一个英文词平均 4–5 字节、子词切法下约 1.3 个 token ⇒ 序列长三四倍，而注意力 O(n²) ⇒ 计算量涨十倍以上，省下的参数远远补不上</b>。⇒ 这就是<b>字节级方法至今仍是少数派</b>的原因，但这条路没死 —— <b>tokenization 一直是 LLM 里最不优雅的那个部件</b>。"});
