<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>
:root{
  --bg:#080B11; --ink:#F0F4FA; --dim:#93A1B5; --dimmer:#3D4658; --edge:#1B2230;
  --blue:#54A9F7; --yellow:#FFD36E; --green:#5BDDA8; --coral:#FF7C87; --violet:#B48BF5;
  --sans:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
mjx-container{color:inherit!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);margin:auto}
svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}

#eqBox{font-size:clamp(16px,2.5vw,36px);text-align:center;line-height:1.5;max-width:92%;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
#eqBox.off{opacity:0;transform:translateY(13px) scale(.97)}
#eqBox.top{align-self:flex-start;margin-top:4.5vh}

#big{font-family:var(--mono);font-size:clamp(30px,5.6vw,82px);font-weight:500;letter-spacing:-.03em;
  color:var(--yellow);text-shadow:0 0 44px rgba(255,211,110,.3);text-align:center;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
#big.off{opacity:0;transform:scale(.86)}
#big small{display:block;font-family:var(--sans);font-size:.22em;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);text-shadow:none;margin-top:.55em;font-weight:400}

/* caption band — pinned into the lower third, clears the strip, scrolls if long */
#capL{align-items:flex-end;pointer-events:none}
#capL::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46vh;
  background:linear-gradient(to top,var(--bg) 30%,rgba(8,11,17,.72) 62%,transparent);pointer-events:none}
#capWrap{max-width:min(84ch,94%);width:100%;max-height:62vh;overflow-y:auto;margin-bottom:50px;
  display:flex;flex-direction:column;align-items:center;pointer-events:auto;position:relative;z-index:2}
#cap{text-align:center;font-size:clamp(13.5px,1.56vw,22px);font-weight:400;line-height:1.55;
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#cap.off{opacity:0;transform:translateY(12px)}
#cap b{font-weight:600;color:var(--yellow)}
#cap i{font-style:normal;color:var(--blue);font-weight:600}
#cap em{font-style:normal;color:var(--green);font-weight:600}
#cap s{text-decoration:none;color:var(--coral);font-weight:600}
#narr{margin:.7em 0 0;max-width:min(90ch,100%);text-align:left;
  font-size:clamp(12.5px,1.12vw,16px);font-weight:400;line-height:1.72;color:#D9E1ED;
  background:rgba(8,11,17,.86);border:1px solid rgba(46,58,82,.7);border-radius:12px;
  padding:12px 17px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:1}
#narr.off{opacity:0}
#narr[hidden]{display:none}
#narr b{color:#C6D2E2;font-weight:500}
#narr i{font-style:normal;color:var(--blue)}
#narr em{font-style:normal;color:var(--green)}
#narr s{text-decoration:none;color:var(--coral)}

#sum{max-width:min(1200px,94%);width:100%;max-height:90vh;overflow:auto;
  background:rgba(17,23,33,.975);border:1px solid #303D52;border-radius:18px;padding:34px 46px 34px;
  box-shadow:0 28px 74px rgba(0,0,0,.62);
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#sum.off{opacity:0;transform:translateY(16px) scale(.985)}
#sum[hidden]{display:none}
#sum .sh{font-family:var(--mono);font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--green);margin:0 0 9px}
#sum h3{font-size:clamp(24px,2.7vw,38px);font-weight:800;margin:0 0 26px;letter-spacing:-.02em;line-height:1.25;color:#F6F9FE}
#sum .rows{display:flex;flex-direction:column;gap:15px}
#sum .row{border-left:4px solid #3C4A61;padding:17px 24px;background:rgba(255,255,255,.03);border-radius:0 12px 12px 0}
#sum .rk{font-family:var(--mono);font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:#9EABBE;margin:0 0 8px}
#sum .rv{font-size:clamp(16px,1.45vw,21px);font-weight:400;line-height:1.88;color:#E3EAF5;margin:0}
#sum .rv b{color:#FFFFFF;font-weight:700}
#sum .rv i{font-style:normal;color:#7CC0FF;font-weight:600}
#sum .rv em{font-style:normal;color:#6FE3B4;font-weight:600}
#sum .rv s{text-decoration:none;color:#FF97A0;font-weight:600}
#sum .row.k{border-left-color:var(--green)}
#sum .row.w{border-left-color:var(--coral)}
#sum .row.e{border-left-color:var(--yellow)}
#sum .row.m{border-left-color:var(--blue)}
#sum .row.r{border-left-color:var(--violet)}

#quizL{align-items:center;pointer-events:none}
#quiz{max-width:min(72ch,91%);pointer-events:auto;background:rgba(13,18,26,.95);
  border:1px solid #253044;border-radius:14px;padding:23px 27px;
  transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.3,1)}
#quiz.off{opacity:0;transform:translateY(14px);pointer-events:none}
#quiz[hidden]{display:none}
#quiz .qh{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--yellow);margin:0 0 10px}
#quiz .qq{font-size:clamp(13.5px,1.5vw,20px);font-weight:600;margin:0 0 15px;line-height:1.45}
#quiz .qo{display:flex;flex-direction:column;gap:7px}
#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;
  color:var(--ink);background:rgba(255,255,255,.045);border:1px solid #2A3546;
  border-radius:8px;padding:10px 15px;cursor:pointer;text-align:left;line-height:1.5;transition:background .2s,border-color .2s}
#quiz button:hover:not(.lk){border-color:var(--blue);background:rgba(84,169,247,.13)}
#quiz button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#quiz button.lk{cursor:default}
#quiz button.ok{border-color:var(--green);background:rgba(91,221,168,.15);color:var(--green)}
#quiz button.no{border-color:var(--coral);background:rgba(255,124,135,.13);color:var(--coral)}
#quiz button.off2{opacity:.32}
#quiz .why{margin:15px 0 0;font-size:clamp(11.5px,1.15vw,15px);font-weight:300;color:#93A1B5;line-height:1.7;border-top:1px solid #1E2634;padding-top:12px}
#quiz .why[hidden]{display:none}
#quiz .why b{color:#C6D2E2;font-weight:500}
#quiz .why em{font-style:normal;color:var(--green)}
#quiz .why s{text-decoration:none;color:var(--coral)}
#quiz .why i{font-style:normal;color:var(--blue)}

#titleL{flex-direction:column}
#titleL h1{font-size:clamp(25px,4.7vw,68px);font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.07;text-align:center;text-shadow:0 0 70px rgba(84,169,247,.25)}
#titleL p{font-size:clamp(12px,1.32vw,18px);color:var(--dim);font-weight:300;margin:2vh 0 0;letter-spacing:.05em;text-align:center;max-width:62ch}
#titleL .act{font-family:var(--mono);font-size:clamp(11px,1.18vw,15px);color:var(--blue);letter-spacing:.28em;margin:0 0 2.2vh;text-transform:uppercase}
#titleL .rule{width:60px;height:2px;background:var(--blue);margin:3.2vh auto 0;box-shadow:0 0 18px rgba(84,169,247,.7)}
.fade{transition:opacity .6s ease;display:flex;flex-direction:column;align-items:center}
.fade.off{opacity:0}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}
.tok.hl{color:var(--yellow);text-shadow:0 0 24px rgba(255,211,110,.5)}
.tok.res{color:var(--green);text-shadow:0 0 24px rgba(91,221,168,.45)}
.tok.ded{color:var(--coral);opacity:.5}

#strip{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:6}
#kps{display:flex;gap:3px;flex:1}
.kpbar{display:flex;gap:2px;flex:1;position:relative;cursor:pointer}
.pip{height:2px;flex:1;background:var(--edge);border-radius:2px;transition:background .4s}
.pip.seen{background:#2E3B50}
.pip.now{background:var(--blue);box-shadow:0 0 9px rgba(84,169,247,.85)}
.pip.sum{background:#1D3A30} .pip.sum.seen{background:#2C5C4A}
.pip.quiz{background:#3A3218} .pip.quiz.seen{background:#5C4E22}
.kplbl{position:absolute;top:-15px;left:0;font-family:var(--mono);font-size:8px;color:var(--dimmer);letter-spacing:.06em;white-space:nowrap;transition:color .3s}
.kpbar.active .kplbl{color:var(--blue)}
#hint{font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#tc{position:fixed;top:18px;left:20px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.1em;text-decoration:none;pointer-events:auto}
#tc:hover{color:var(--blue)}
#tc[hidden]{display:none}
#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}
.navbtn{position:fixed;top:0;bottom:44px;width:14%;background:none;border:0;cursor:pointer;opacity:0;z-index:4}
#prev{left:0} #next{right:0}
.navbtn:focus-visible{opacity:1;outline:2px solid var(--blue);outline-offset:-6px}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}
.pt{fill:var(--ink)}
.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}
.box.r{stroke:var(--coral)} .box.v{stroke:var(--violet)}
.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}
.cellbg.hl3{fill:#3A1A1E;stroke:var(--coral);stroke-width:1.6}
.celltx{font-family:var(--mono);font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.celltx.d{fill:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* fix: 面板 .off 立即不可见 */
#big.off,#cap.off,#eqBox.off,#titleBox.off,#sum.off,#quiz.off{visibility:hidden}
</style>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

function seq(x0,y,toks,cls,bw,bh){

/* ── 竖着堆的模块（encoder / decoder 的内部）── */
function stack(cx,ytop,items,bw,bh,gap){

KP("开场",function(){

    "这是 Stanford <b>CME 295《Transformers and Large Language Models》</b>的第一讲，<b>2025 年秋</b>这一期，讲者是 <b>Afshine 与 Shervine Amidi</b> 兄弟俩（就是写那套 CS229 速查表的两个人）。<br><b>⚠ 先说这门课的形状，因为它决定了该怎么看</b>：<b>一共 9 讲，每讲约 107 分钟，每周五一次；没有编程作业；成绩是期中 50% + 期末 50%</b>。<b>配套的书叫 Super Study Guide — Transformers & LLMs，另外有一份压缩过的 VIP cheat sheet 挂在 GitHub 上</b>。<br><b>⭐ 对你来说最要紧的一点：这门课不是「教你调 API」，它是从底层机制讲起的。</b>讲者自己把目标说成两条——<b>第一条是搞懂让这一切跑起来的底层机制，第二条才是这些模型怎么训练、用在哪</b>。<br><b>而这第一讲的位置很特殊：它是唯一一讲「从零开始」的。</b><b>它不假设你懂 NLP，从「模型只懂数字，不懂文本」这句话出发，一步一步推到自注意力。</b><br><b>⚠ 我把这一讲的结构整理成了一条「关口链」，因为它真正的讲法是「上一步不够用，所以必须有下一步」</b>：<b>关口一是文本怎么变成数字（分词）；关口二是 token 怎么变成有意义的向量（Word2vec）；关口三是怎么把顺序和上下文吃进来（RNN）；而 RNN 的三个病，正好逼出了注意力。</b><br><b>⭐ 看这一讲的正确姿势是盯住每一处「所以」</b>——每一个新机制都是上一个机制的毛病逼出来的，<b>而不是因为它更时髦。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

    boxNode(490,y+104,300,46,"④ 直连代替串行","g"); note("注意力 → 自注意力",640,y+176,"d");
    boxNode(890,y+52,300,46,"⑤ 拼成一个架构","v"); note("Transformer",1040,y+124,"d");
    link(390,y+23,490,y+23); link(240,y+46,240,y+104); link(790,y+23,890,y+75);
    link(640,y+46,640,y+104); link(390,y+127,490,y+127); link(790,y+127,890,y+75);
    note("每一步都是上一步「不够用」逼出来的 —— 盯住每一处「所以」",640,y+230,"y");},
    "<b>先把整讲的地图摆出来，后面每一个知识点都能挂到这张图上。</b><br><b>① 文本 → 数字</b>：<b>模型只会算数，不认字。所以第一件事是把句子切成一个个单位——这叫分词，切出来的单位叫 token。</b>而怎么切，有三种路子、各有代价。<br><b>② token → 有意义的向量</b>：<b>切开了还不够，得给每个 token 一个向量。</b><b>最朴素的做法（one-hot）有一个致命毛病，而修这个毛病的办法就是 Word2vec 的「代理任务」。</b><br><b>③ 吃进顺序与上下文</b>：<b>Word2vec 学出来的向量有两个硬限制——不看上下文、不看词序。</b><b>于是需要一类能按顺序处理的模型，那就是 RNN 与 LSTM。</b><br><b>④ 直连代替串行</b>：<b>⚠ 而 RNN 自己有三个病：记不住远处的、梯度会消失、而且因为必须串行所以慢。</b><b>注意力就是冲着「记不住远处的」来的——在「要预测的东西」和「过去的某一处」之间直接架一条线。</b><b>⭐ 2017 年那篇论文干脆把串行整个扔了，只留直连，这就是自注意力。</b><br><b>⑤ 拼成一个架构</b>：<b>把自注意力、位置编码、多头、前馈层拼起来，就是 Transformer。</b><br><b>⚠ 注意这条链是「被迫」的，不是「设计」的</b>——<b>⭐ 这也是为什么这一讲值得当成一个方法论样本来看：它展示了一个领域怎么被一连串具体的失败推着往前走。</b>");

KP("1 · NLP 与它的三类任务",function(){

  note("摘要 · 写代码 · 写诗",1035,330,"d");
  note("⚠ 只有第 ③ 格的输出长度事先不知道 —— 这一条后面会反复要命",640,372,"y");},"<b>讲者把整个 NLP 的任务分成三个桶，而这个分法后面会一直用：讲到 RNN 时他会回来说「这三类任务各取哪个向量」。</b><br><b>① 分类</b>：<b>文本进去，预测<u>一件</u>事</b>。<b>例子：一条影评是正面、负面还是中性（情感分析）；「帮我订个明天的闹钟」这句话的意图是「创建闹钟」（意图识别）；还有语种检测、主题建模。</b><br><b>② 多分类</b>：<b>文本进去，预测<u>多</u>件事。</b><b>最有代表性的是 NER —— Named Entity Recognition，命名实体识别</b>：<b>给一句话，把其中某些词标出来，说这个是地点、那个是时间。</b><b>⚠ 讲者顺口说了一句行业温度计：词性标注、句法分析这类更偏语言学的任务「现在不太时髦了，但十年前是很多人研究的东西」。</b><br><b>③ 生成</b>：<b>文本进，文本出</b>。<b>机器翻译、问答（你用的 ChatGPT、Gemini 就在这一格）、摘要、生成代码、写诗。</b><br><b>★★ 而这三格之间有一个结构性的差别，值得现在就标出来，因为它后面会反复要命：只有第 ③ 格的输出长度是事先不知道的。</b><b>分类任务的输出是「三个标签里挑一个」，形状固定；而生成任务你根本不知道该写多长。</b><br><b>⇒ 这一条会直接导致三个后果，都在这一讲里</b>：<b>第一，生成任务需要一个「什么时候停」的机制（那就是 EOS token）；第二，生成任务的评估特别难（因为没有唯一答案）；第三，生成必须一个一个词地往外吐（自回归），而这正是后面所有效率问题的根源。</b>");
  SUM(0,1,{h:"NLP 的三类任务：分类 / 多分类 / 生成",k:"文本进 → 预测<b>一件</b>事（分类）· 预测<b>多</b>件事（多分类，如 NER）· 输出<b>文本</b>（生成）。ChatGPT 这类助手属于第三格。",m:"三格的真正分界不是「难不难」，而是<b>输出的形状是否事先已知</b>。前两格形状固定，第三格的长度未知。",w:"⚠ 别把「生成」当成「更高级的分类」。输出长度未知这一条，直接逼出了 EOS token、评估难题、以及自回归逐词生成这三件事。",r:"你的问题形状更像第 ① 格（给一个配置，判它可行/不可行、估它的成本），<b>但搜索空间是组合的</b> —— 组合结构带来的「输出空间大到不能枚举」这个困难，和第 ③ 格的「长度未知」是同一类麻烦的两个版本。"});
  QUIZ(0,1,{t:"三类 NLP 任务的真正分界线是什么？",o:["是否需要神经网络","输出的形状是否事先已知：前两类固定，生成类的长度未知","训练数据的规模","任务的难度高低"],a:1,w:"讲者在讲生成那一格时专门点了一句 the length can be variable（13:28）。这一条逼出了 EOS token、评估难题与自回归生成 —— 全都在这一讲里出现。"});

  note("⚠ 这不是「指标不够多」，是「这个指标问错了问题」",640,372,"y");},"<b>讲者在这里插了一段很实在的提醒，而且他说「我不确定在座每个人都知道这些，所以我提醒一下」。</b><br><b>先看那个陷阱。假设你的数据集里 99% 是正面、1% 是负面。</b><b>现在有一个极蠢的模型：不管输入什么，它永远输出「正面」。</b><b>⚠ 这个模型的准确率是 99%。</b><br><b>讲者的原话是：如果你的模型把一切都预测成多数类，那你就会有一个「很棒的分类器」——但事实并非如此。</b><br><b>⭐ 这里的要害不是「准确率这个指标不够好」，而是「准确率回答的不是你想问的问题」。</b><b>准确率问的是「我猜对了几成」；而你真正想问的是「负面的那些，我找出来了吗」。</b><b>在 99:1 的数据上，第二个问题的答案是「一个都没找到」，而第一个问题的答案是 99%。</b><br><b>⇒ 所以需要两个分别回答「另一半问题」的数。下一镜把它们算清楚。</b><br><b>⚠ 顺带说一句为什么这段值得认真看：类别不均衡几乎是所有真实数据集的默认状态。</b><b>而「用一个在均衡数据上合理的指标去量不均衡的数据」是最常见、也最难被自己发现的错误之一 —— 因为它的表现形式是「数字很好看」。</b>");

  SUM(0,2,{h:"分类指标：准确率的陷阱与精确率/召回率",k:"类别不均衡时准确率会严重误导（99:1 的数据上「永远猜多数类」就有 99% 准确率）。<b>精确率</b>的分母是「我的预测」，<b>召回率</b>的分母是「真实标签」，F1 是两者的调和平均。",m:"三个指标问的是三个不同的问题。准确率问「我猜对了几成」，精确率问「我开口时多靠谱」，召回率问「该找的我漏了多少」。<b>指标选错不是精度问题，是问错了问题。</b>",w:"⚠ 调和平均不是随便选的：它对两个数里<b>较小</b>的那个敏感，任何一边崩了 F1 就会跟着崩。算术平均会掩盖这件事。（这一条讲义没说，是补的。）",r:"你的两类错误<b>代价严重不对称</b>：把不可行判成可行（假正）不可恢复，漏掉可行配置（假负）只损失一点最优性。⇒ 该报的是<b>精确率在给定召回率下的表现</b>，而不是一个 F1 —— 后者恰好把不对称藏起来了。"});

KP("3 · 多分类与 NER：指标要在哪一层聚合",function(){

  note("直觉：模型对自己的输出有多「惊讶」",640,262,"y");},"<b>第三个指标和前两个完全不同类，而它的方向还是反的，特别容易记错。</b><br><b>perplexity（困惑度）只看一件事：模型自己输出的那些概率。</b><b>讲者给的直觉非常好记——它量的是「模型对自己的输出有多惊讶」。</b><br><b>⚠ 方向：BLEU 和 ROUGE 是越高越好；perplexity 是<u>越低</u>越好。</b><b>讲者专门把这句话并排说了一遍，因为这是最常记反的地方。</b><br><b>⭐ 为什么它不需要标注？因为它根本不和任何「正确答案」比。</b><b>它问的是：模型给自己实际生成的那串词，分配了多高的概率？</b><b>概率高 ⇒ 模型很确信 ⇒ 不惊讶 ⇒ perplexity 低。</b><br><b>⚠ 公式我写在上面了（讲者没写，是补的，但这是标准定义）：取每一步条件概率的对数、求平均、取负、再取指数。</b><b>那个 exp 和 log 其实互相抵消了一部分，留下的效果是「平均每一步，模型觉得有几个候选同样可能」。</b><b>⭐ 所以 perplexity 有一个很漂亮的解读：它约等于「有效的分支数」。</b><b>perplexity = 10 大致意思是「每一步模型都觉得有 10 个词差不多同样可能」。</b><br><b>⚠ 但它有个代价，这也是为什么它不能单用：它只衡量「模型对自己有多自信」，完全不管输出对不对。</b><b>一个胡说但说得很确信的模型，perplexity 可以很低。</b><b>⇒ 无标注是它的优点，不看正确性是它的缺点，两者是同一件事的两面。</b>");
  SUM(0,5,{h:"perplexity：不需要标注，但也不看正确性",k:"只看模型自己输出的概率 ⇒ <b>不需要任何参考文本</b>。⚠ 方向与 BLEU/ROUGE 相反：<b>越低越好</b>。直觉是「模型对自己的输出有多惊讶」。",m:"取每步条件概率的 log、平均、取负、再 exp ⇒ 可解读为<b>有效分支数</b>：perplexity=10 约等于「每一步都觉得有 10 个词同样可能」。",w:"⚠ 它的优点和缺点是同一件事：不和正确答案比 ⇒ 不要标注，但也<b>完全不管输出对不对</b>。一个胡说但很自信的模型 perplexity 可以很低。",r:"这正是「无标注代理指标」的原型：便宜、可大量计算、但度量的不是你真正关心的量。<b>和你用代理模型代替真实评估是同一个权衡</b> —— 可以用它做粗筛，不能用它做最终判定。"});
  QUIZ(0,5,{t:"perplexity 不需要标注，代价是什么？",o:["它只适用于翻译任务","它完全不衡量输出是否正确 —— 胡说但很自信的模型 perplexity 也可以很低","计算量很大","它需要知道词表大小"],a:1,w:"它只看模型给自己输出分配的概率。无标注是优点，不看正确性是缺点，两者是同一件事的两面 —— 这正是所有「无参考代理指标」的通病。"});
});

KP("7 · 关口一：模型只懂数字，所以必须先切开文本",function(){

  note("⇒ 中间必须有一道转换",640,290,"y");

  note("第二步：把每一块「变成向量」  ← 下一个大段",640,360,"g");},"<b>这是整讲的第一个真正的关口，而讲者把它说得特别朴素。</b><br><b>他的原话：模型懂数字，它们并不真的懂文本。</b><br><b>⇒ 所以必须有一道转换。而这道转换其实是<u>两</u>步，这一讲把它们分开讲，顺序不能颠倒</b>：<br><b>第一步，把句子切开</b> —— <b>切成一个个单位。这是接下来几个知识点的内容。</b><br><b>第二步，把每一个单位变成一个向量</b> —— <b>这是再下一个大段（one-hot 与 Word2vec）。</b><br><b>⭐ 为什么要强调「两步」？因为这两步的失败模式完全不同，而且常被混在一起谈</b>：<b>切得不好，后果是「词表爆炸」或者「序列太长」；而向量学得不好，后果是「相似的词在向量空间里不相似」。</b><b>⚠ 这是两个独立的毛病，要分别治。</b><br><b>这一镜还顺手回答了一个你可能有的疑问：为什么不直接把字符的 ASCII 码喂进去？</b><b>技术上可以，而这正是后面「字符级切分」那一支要讨论的 —— 它确实有人做，而且有它的好处（对拼写错误鲁棒）；代价是序列极长、而且单个字母的向量很难有意义。</b><b>⇒ 所以这不是「不能做」，是「代价不划算」。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("「a cute teddy bear is reading」",640,196,"d");
  var xs=seq(190,232,["a","cute","teddy bear","is","reading"],["g","g","g","g","g"],150,46);
  note("每一块 = 一个 「token」（文本的任意单位）",640,312,"y");
  note("做这件事的方法 = 「tokenization」 分词",640,346,"y");
  note("⚠ 「任意」是认真的：teddy bear 当成一个 token 也完全合法",640,378,"r");},"<b>两个术语一次定清楚，而且它们的关系就在名字里。</b><br><b>讲者的原话：文本的那个单位叫做 token，这也正是这个方法为什么叫 tokenization。</b><br><b>⇒ token = 切出来的一块；tokenization = 切的这个动作。</b><b>中文一般译成「词元」和「分词」，但「分词」这个译法有点误导 —— 因为切出来的不一定是词。</b><br><b>⚠ 讲者用的词是 arbitrary unit of text —— <u>任意</u>的文本单位。这个「任意」是认真的。</b><b>他举的第一个例子就故意不规整：「a」是一块、「cute」是一块、而「teddy bear」<u>两个词</u>也算一块。</b><br><b>⭐ 这一点值得停一下，因为它说明 token 不是语言学概念，而是<u>工程选择</u>。</b><b>没有什么「正确的切法」，只有「代价不同的切法」。</b><br><b>⇒ 于是问题就变成：有哪几种切法，各自的代价是什么？</b><b>讲者给了三种：词级、子词级、字符级。</b><b>接下来三个知识点逐个过，而且每一个都按「pro / con」来讲 —— 这是他自己用的结构。</b><br><b>⚠ 先给你一个判据，带着它去听会清楚得多：所有切法都在同一个权衡上取舍 —— <u>词表大小</u>（切得粗 ⇒ 词表大）对 <u>序列长度</u>（切得细 ⇒ 序列长）。</b><b>⭐ 而这两个量各自绑着一个具体的代价：词表大 ⇒ 容易遇到没见过的词；序列长 ⇒ 模型算得慢。</b>");
  SUM(0,7,{h:"关口一：文本 → 数字要分两步，先切开",k:"模型只懂数字不懂文本 ⇒ 必须转换，而转换是<b>两步</b>：① 把句子切成 token（分词）② 把每个 token 变成向量。两步的失败模式完全不同。",m:"token = 文本的<b>任意</b>单位（teddy bear 当一个 token 也合法）⇒ token 不是语言学概念，是<b>工程选择</b>。没有正确的切法，只有代价不同的切法。",w:"⚠ 别把两步混在一起谈：切得不好 ⇒ 词表爆炸或序列太长；向量学得不好 ⇒ 相似的词在向量空间里不相似。要分别治。",r:"全部切法都在同一个权衡上取舍：<b>词表大小 ↔ 序列长度</b>，各自绑着「遇到没见过的输入」与「算得慢」。这个「粒度选择决定两种代价」的结构，和你选搜索的分解粒度是同一类决定。"});
  QUIZ(0,7,{t:"讲者说 token 是文本的 arbitrary unit。这个「任意」意味着什么？",o:["token 不是语言学概念而是工程选择 —— 没有「正确的切法」，只有代价不同的切法","token 必须是完整的单词","切法可以随机决定，不影响结果","任意长度的文本都能当一个 token，所以词表可以无限大"],a:0,w:"他的第一个例子就故意不规整：teddy bear 两个词算一块。三种切法（词级/子词/字符）都在同一个权衡上取舍：词表大小 ↔ 序列长度。"});
});
KP("8 · 三种切法（上）：词级为什么不够",function(){

  note("⇒ 于是模型必须「分别」学两个向量，还得指望它们自己学得相似",640,354,"g");},"<b>词级切分是最自然的想法：按空格切开。而它的毛病讲者举了两个例子，都很小，但后果很大。</b><br><b>bear 和 bears</b>：<b>一个单数、一个复数，人看一眼就知道几乎是同一个词。</b><b>run 和 runs</b>：<b>同一个动词的两种形态。</b><br><b>⚠ 但在词级切分下，它们是词表上<u>两个不同的号码</u>，彼此毫不相干。</b><b>讲者的原话：我们最后会得到两个不同的实体，它们基本上就是被当成不同的东西。</b><br><b>⭐ 为什么这是个大问题？要往前看一步才明白。</b><b>我们的目标是给每个 token 一个<u>有意义</u>的向量（下一个大段的事）。</b><b>而如果 bear 和 bears 是两个独立的 token，那就得<u>分别</u>为它们学两个向量，然后<u>指望</u>模型自己把这两个向量学得相似。</b><br><b>⚠ 讲者点出的正是这一层：「你将需要为这些相似但不同的 token 计算嵌入，并设法让它们的嵌入相似」。</b><b>注意「设法」这个词 —— 这是额外的负担，而且没有保证。</b><br><b>⭐ 更坏的情况是罕见形态：如果 bears 在训练数据里只出现过三次，那它的向量基本学不出来，而 bear 出现了三万次。</b><b>明明是同一个词根，一个学得很好，一个学不出来。</b><br><b>⇒ 这就引出下一种切法：既然词根是共享的，为什么不<u>按词根切</u>？</b>");
  SUM(0,8,{h:"词级切分：相似的词成了无关的号码",k:"bear / bears、run / runs 在词级切分下是词表上<b>两个无关的号码</b>。于是必须分别学两个向量，还得指望它们自己学得相似。",m:"问题要往前看一步才成立：目标是给 token 有意义的向量，而<b>独立的 token 意味着独立的向量</b>，相似性得靠训练自己长出来，没有保证。",w:"⚠ 更坏的是罕见形态：bears 只出现三次、bear 出现三万次 ⇒ 同一词根，一个学得好一个学不出来。",r:"这是「<b>把本该共享的结构切散了</b>」的典型代价。对应到组合搜索：如果你的表示把共享的子结构当成互不相干的整体来处理，就无法在它们之间迁移任何信息 —— 这正是支配剪枝要利用的东西。"});
  QUIZ(0,8,{t:"词级切分让 bear 和 bears 成为两个 token，真正的坏处是？",o:["模型无法处理复数","词表会变大一点","必须分别学两个向量，相似性只能指望训练自己长出来；而罕见形态可能根本学不出来","序列会变长"],a:2,w:"讲者点的是 you will need to compute embeddings for these similar yet different tokens and somehow make their embeddings similar —— 注意 somehow，这是额外负担且无保证。"});
});

  note("（n 个 token 两两都要比一次 ⇒ n² —— 本讲后半会看到那个矩阵）",640,370,"d");},"<b>这一句是全讲最该提前记住的一句话，因为它在后半讲会升级成一个更严厉的版本。</b><br><b>讲者说：这些模型的复杂度也是序列长度的函数。</b><b>要处理的 token 越多，模型跑得越久 —— 因为它得把这些 token 全都处理一遍。</b><br><b>⭐ 现在它只是「子词切分的一个代价」。但往后看：自注意力要让 n 个 token <u>两两</u>都比一次。</b><b>⇒ 那就不是线性，是 n² 。</b><b>本讲后半你会亲眼看到那个矩阵：n 行 n 列，每一格是一个 query 和一个 key 的点积。</b><br><b>⚠ 所以「序列长度」这个量在这门课里的地位，比第一次出现时看起来重得多。</b><b>它是后面一长串工程技巧的共同动机：为什么要研究更长的上下文、为什么有各种近似注意力、为什么 KV 缓存重要 —— 全都挂在这一句上。</b><br><b>⭐ 而它反过来给分词施加了压力：既然序列长度这么贵，那就不能为了「词根共享」把序列切得太碎。</b><b>⇒ 于是子词切分成了那个折中点：比词级更能共享结构，比字符级短得多。</b><br><b>★ 这个结构你应该很熟：一个<u>粒度</u>参数，两端各绑一个代价，最优值在中间。</b><b>和你在搜索里选分解粒度是同一类决定 —— 切得太粗无法共享信息、切得太细搜索空间爆炸。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("29:16","this thing is called OOV, Out Of Vocabulary");
  note("推理时遇到一个「训练时没见过」的 token，怎么办？",640,192,"y");
  boxNode(360,224,560,46,"只能标成 <unknown> —— 一个「什么都装」的桶","r");

  note("⚠ 关键后果：所有不认识的东西共用「同一个」向量 ⇒ 它们彼此不可区分",640,334,"r");
  note("⇒ 切得越粗，撞上 OOV 的概率越大",640,370,"g");},"<b>OOV 是这一段的最后一个术语，而它正是「切法」这个选择的真正代价所在。</b><br><b>Out Of Vocabulary，词表外。</b><b>场景：训练的时候你定下了一个词表；推理的时候来了一个<u>没见过</u>的 token。</b><br><b>讲者说，通常的做法是预留一个位置，叫 unknown token 或者 out-of-vocabulary token，你可以把它想成「一个装所有我们没能识别的东西的桶」。</b><br><b>⚠ 这个桶有一个很要命的后果，讲者说了但值得说得更重一点：所有不认识的东西共用<u>同一个</u>向量。</b><b>⇒ 一个罕见的人名、一个新造的技术词、一个拼错的词，在模型眼里是<u>同一个东西</u>。</b><b>它们之间的全部区别都丢了。</b><br><b>⭐ 现在三种切法的 OOV 风险就能排序了，而这正是讲者那张 recap 的核心</b>：<b>词级 —— 风险最高（任何没见过的词形都中招）；子词级 —— 风险<u>降低</u>但仍存在；字符级 —— 基本没有这个问题（字符是有限的）。</b><br><b>⚠ 注意子词那一档讲者说得很准确：lower risk of OOV, but still you can have —— 降低，不是消除。</b><br><b>⇒ 把三条都串起来，这一整段的结论就出来了，下一镜那张表。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("三种切法的对照 —— 讲者自己的 recap",640,186,"v");
  matrix({rows:4,cols:4,cw:272,ch:40,x:68,y:206,
    cell:function(i,j){var t=[["","词级","子词级 ⭐","字符级"],
      ["利用词根","✗ 不利用","✓ 利用","—"],
      ["OOV 风险","高","低（仍有）","基本没有"],
      ["序列长度","短","中","很长 ⇒ 慢"]];return t[i][j];},
    hl:function(i,j){return (j===2&&i>0)?"y":"";}});
  note("⚠ 字符级还有一条独立的毛病：单个字母的向量很难有意义（「U 的表示」是什么？）",640,382,"r");},"<b>这是讲者自己做的那张 recap，我按三条判据重排了一下，因为按判据排比按方法排更好记。</b><br><b>词级</b>：<b>不利用词根、OOV 风险高、序列短。</b><b>讲者的评价是「super naive、super simple」—— 简单，但该拿的好处一个没拿到。</b><br><b>子词级（实际用的那个）</b>：<b>利用词根、OOV 风险低但仍存在、序列中等。</b><b>⭐ 它是那个折中点。</b><br><b>字符级</b>：<b>讲者给的优点很具体 —— 对拼写错误和大小写错误鲁棒。</b><b>「你我发消息的时候经常打错字，而子词切分可能根本认不出那个被拼错的词，字符级能把这件事考虑进来。」</b><b>⚠ 代价有两条，而第二条常被忽略。</b><br><b>第一条是序列极长 ⇒ 计算慢得多。</b><br><b>★ 第二条是讲者专门停下来说的：很难知道单个字母的表示意味着什么。他的原话是「字母 U 的表示是什么意思？非常难」。</b><br><b>⭐ 这一条比「慢」更根本，值得想清楚：向量要有意义，前提是这个单位本身承载意义。</b><b>词根承载意义（bear 是一种动物），单个字母不承载意义（U 什么都不是）。</b><b>⇒ 所以字符级不只是「更贵」，它是把「可以学出有意义向量」这个前提削弱了。</b><br><b>⚠ 关于词表大小，讲者在一个课堂问答里给了很实用的数量级：单语言约<u>几万</u>；而现在的模型是多语言的、还要处理代码，所以常见到<u>几十万</u>。</b><b>这个数字在后面算参数量的时候会用到。</b>");
  SUM(0,9,{h:"三种切法与那个权衡：词表大小 ↔ 序列长度",k:"<b>子词级是实际的选择</b>：利用词根、OOV 风险低（但仍有）、序列中等。词级简单但不利用词根且 OOV 高；字符级对拼写错误鲁棒但序列极长。",m:"全部切法在同一个权衡上：切粗 ⇒ 词表大 ⇒ 容易 OOV；切细 ⇒ 序列长 ⇒ 慢。而「模型复杂度是序列长度的函数」这句话到自注意力处会升级成 <b>n²</b>。",w:"⚠ 字符级的第二条毛病比「慢」更根本：<b>单个字母不承载意义</b>（「U 的表示是什么？」）⇒ 它削弱了「能学出有意义向量」这个前提。OOV 桶让所有不认识的东西共用同一向量，彼此不可区分。",r:"一个<b>粒度参数、两端各绑一个代价、最优值在中间</b> —— 和你在组合搜索里选分解粒度完全同形：太粗无法共享信息，太细搜索空间爆炸。词表量级：单语言几万，多语言几十万。"});
  QUIZ(0,9,{t:"为什么子词切分是实际的选择？",o:["它的序列最短，所以最快","它完全消除了 OOV 问题","它在「利用词根」与「序列不过长」之间折中，同时把 OOV 风险降下来（但没消除）","它不需要预先定下词表"],a:2,w:"讲者说子词是 a nice trade-off：能按词根识别词，又比词级更少撞上 OOV。注意他的措辞是 lower risk of OOV, but still you can have —— 降低不是消除。"});
});
KP("10 · one-hot：最朴素的那个向量",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("词表只有三个词的玩具例子",640,192,"d");
  matrix({rows:3,cols:4,cw:150,ch:44,x:320,y:222,
    cell:function(i,j){var t=[["soft","1","0","0"],
      ["teddy bear","0","1","0"],["book","0","0","1"]];return t[i][j];},
    hl:function(i,j){return (j>0&&((i===0&&j===1)||(i===1&&j===2)||(i===2&&j===3)))?"y":"";}});
  note("One-Hot Encoding（OHE）：每个词一个「我是第几号」的向量",640,384,"g");},"<b>关口二开始：token 已经切好了，现在要给每一个 token 一个向量。最朴素的做法叫 one-hot。</b><br><b>做法就是「点名」</b>：<b>词表里有几个词，向量就有几维；第 k 个词的向量就是「第 k 位是 1，其余全是 0」。</b><br><b>讲者的玩具例子只有三个词</b>：<b>soft 是 (1,0,0)，teddy bear 是 (0,1,0)，book 是 (0,0,1)。</b><b>这个方法的缩写是 OHE，他说「会经常见到」。</b><br><b>⭐ 先承认它的好处，因为它确实有一个</b>：<b>它不需要训练，拿到词表立刻就能写出来，而且绝不会把两个不同的词混为一谈。</b><b>作为「把文本变成数字」这个任务，它<u>完成</u>了。</b><br><b>⚠ 但它只完成了字面上的任务，没有完成真正的任务。</b><b>因为我们要的不是「变成数字」，而是「变成<u>有意义</u>的数字」。</b><br><b>⇒ 那「有意义」该怎么定义？讲者的答案很具体：意义体现在「能不能比较」。</b><b>我们希望意思相近的 token 向量相似，意思无关的 token 向量不相似。</b><br><b>⚠ 所以下一步必须先回答一个前置问题：两个向量「相似」到底怎么量？</b><b>这就是下一个知识点 —— 而且必须先讲它，因为不先定下「怎么量相似」，就说不清 one-hot 到底坏在哪。</b>");
  SUM(0,10,{h:"one-hot：完成了字面任务，没完成真正的任务",k:"词表 V 个词 ⇒ 向量 V 维，第 k 个词是「第 k 位 1、其余 0」。缩写 OHE。不用训练、不会混淆任何两个词。",m:"它把文本变成了数字，但我们要的是<b>有意义</b>的数字 —— 而「有意义」在这里的定义是「能比较相似性」。",w:"⚠ 想说清 one-hot 坏在哪，必须先定下「相似」怎么量。顺序不能颠倒，否则只能说出「感觉不好」。",r:"等价于给每个配置一个互不相同的 ID：信息完整但<b>不可比较</b>。任何依赖「相似配置有相似表现」的外推（代理模型、支配剪枝）在这种表示下都做不了。"});
  QUIZ(0,10,{t:"one-hot 的问题不能直接说出来，必须先补一个前置概念。是哪个？",o:["反向传播","「两个向量相似」怎么量 —— 不先定下这个，就说不清它坏在哪","词表大小的量级","softmax"],a:1,w:"这正是讲者的顺序：先讲余弦相似度，再指出 one-hot 下所有向量两两正交。质量线要求「术语先铺后用」，这一处是教科书式的例子。"});
});
KP("11 · 怎么量两个向量像不像：余弦相似度",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("31:59","you can think of it as just seeing what angle these vectors make in the n dimensional space");
  setEq("$$\\cos(u,v)=\\frac{u\\cdot v}{\\lVert u\\rVert\\,\\lVert v\\rVert}\\in[-1,1]$$");
  note("量的是「夹角」，不是距离 —— 所以与向量长短无关",640,196,"y");
  note("同向 ⇒ 接近 1（相似）· 垂直 ⇒ 0（无关）· 反向 ⇒ −1（相反）",640,232,"g");
  note("⚠ 分母那两个范数就是在「把长度除掉」",640,264,"d");},"<b>余弦相似度。讲者给的直觉一句话就够用：看这两个向量在那个 n 维空间里张开多大的角。</b><br><b>三个档位要记住</b>：<b>指向同一个方向 ⇒ 接近 1，判为相似；互相垂直（正交）⇒ 0，判为无关；指向相反 ⇒ −1，判为相反。</b><br><b>⭐ 要害在那个分母：两个范数（向量的长度）。它的作用就是把长度<u>除掉</u>，于是只剩方向。</b><br><b>⚠ 这一点课堂上正好有人追问，而讲者的回答很诚实，值得完整记下来，因为它示范了一种对待「约定」的正确态度。</b><br><b>学生问的是：为什么不管模长（norm）？</b><b>讲者先确认了问题，然后说的大意是 —— 这些都只是「度量」，都是人们试图量化相似性的方式；这不是那个完美的度量；也有人直接用点积当度量。</b><b>他最后说：「我没法给你一个很好的答案，但一般你在意的是它们指向哪里，而通常不把模长考虑进去。」</b><br><b>⭐ 为什么我要把这段原样记下来？因为这是一个很好的示范：当一个选择是约定而不是定理时，诚实的回答就是说「这是约定」。</b><b>⚠ 而对你有用的那一层是：模长并非没有信息 —— 在很多实际的嵌入里，模长和词频相关。</b><b>余弦相似度主动把这个信息扔了，这是一个<u>选择</u>，不是一个必然。</b><b>⇒ 以后如果你自己设计相似度，这就是一个可以重新考虑的旋钮。</b>");
  SUM(0,11,{h:"余弦相似度：只看夹角，主动把长度除掉",k:"cos(u,v) = u·v / (‖u‖‖v‖) ∈ [−1,1]。同向≈1（相似）、正交=0（无关）、反向=−1（相反）。分母的作用就是把长度除掉。",m:"它是一个<b>约定</b>而不是定理。课堂追问「为什么不管模长」时，讲者明确说这只是一种度量、不是完美的度量，也有人直接用点积。",w:"⚠ 模长并非没有信息（实际嵌入里常与词频相关）。余弦主动扔掉它，这是选择不是必然 —— 你自己设计相似度时这是个可调的旋钮。",r:"这是「把<b>比对象</b>换成<b>比某个量</b>」的范例。你那里的对应动作是：不去问「我找到的是不是那个最优解」，而问「我找到的解其成本是否达到最优值」。"});
  QUIZ(0,11,{t:"余弦相似度分母上的两个范数起什么作用？",o:["把向量的长度除掉，使结果只反映方向（夹角）","保证结果非负","让计算数值更稳定","把结果归一到 [0,1]"],a:0,w:"结果范围是 [−1,1] 不是 [0,1]。课堂追问「为什么不管模长」时讲者承认这只是一种约定 —— 而模长在实际嵌入里常与词频相关，被主动扔掉了。"});
});
KP("12 · one-hot 的死穴：任意两个都正交",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("32:33","you will end up with all your vectors being orthogonal to one another");
  setEq("$$\\cos\\big(e_i,e_j\\big)=0\\quad\\text{对一切 } i\\neq j$$");
  note("任取两个不同的词，点积必为 0 ⇒ 相似度恒为 0",640,196,"r");
  note("「teddy bear 与 soft」和「teddy bear 与 book」⇒ 一样是 0",640,230,"r");
  note("⇒ 这个表示里「相似」这件事根本无法表达",640,262,"y");},"<b>现在可以把 one-hot 的毛病说准了，而且它不是「不够好」，是「做不到」。</b><br><b>算一下就明白：两个不同的 one-hot 向量，1 的位置不同，所以逐位相乘再相加必然是 0。</b><b>⇒ 点积为 0 ⇒ 余弦相似度为 0 ⇒ 判为「无关」。</b><br><b>⚠ 而这对<u>任意</u>两个不同的词都成立。</b><b>讲者的原话：你会落得所有向量两两正交。</b><br><b>⭐ 为什么这是死穴而不是瑕疵？看这个对比</b>：<b>「teddy bear 与 soft」应该相似（泰迪熊是软的）；「teddy bear 与 book」应该无关。</b><b>而在 one-hot 下，这两个相似度<u>都是 0</u>，完全分不开。</b><br><b>⇒ 结论不是「one-hot 算出来的相似度不准」，而是「这个表示里根本没有地方放相似性这个信息」。</b><b>⚠ 信息不在，就不是调参能补的。</b><br><b>⭐ 那想要的是什么样子？讲者把目标说得很具体：意思相同或相近的 token 要有高相似度，无关的要接近 0。</b><br><b>⇒ 既然写不出来，那就<u>学</u>出来 —— 这就是下一步，而「怎么学」是这一段最漂亮的地方。</b><br><b>★ 顺带记一个数量级，前面课堂问答里讲者给过：one-hot 的维数等于词表大小，也就是单语言几万、多语言几十万。</b><b>所以 one-hot 不只是没信息，它还是个几十万维的稀疏向量 —— 又大又空。</b>");
  SUM(0,12,{h:"one-hot 的死穴：相似性无处安放",k:"两个不同的 one-hot 向量点积必为 0 ⇒ 任意两词相似度恒为 0。「teddy bear vs soft」与「teddy bear vs book」完全分不开。",m:"这不是「算得不准」，是<b>这个表示里没有地方放相似性这个信息</b>。信息不在，调参补不出来。而且它还是几十万维的稀疏向量，又大又空。",w:"⚠ 分清两种失败：「估计有误差」可以靠更多数据/更好模型改善；「表示里没有这个自由度」只能换表示。",r:"⭐ 这个区分对你很要紧：如果你的配置表示里没有编码「共享子结构」，那任何相似性度量都救不回来 —— 该换的是<b>表示</b>，不是模型。"});
  QUIZ(0,12,{t:"为什么 one-hot 的问题不能靠「更多数据」或「更好的模型」解决？",o:["因为余弦相似度不适合稀疏向量","因为词表太大","因为没有做归一化","因为这个表示里根本没有地方安放「相似性」这个信息 —— 信息不在，不是估计误差"],a:3,w:"任意两个不同 one-hot 向量点积恒为 0。要分清两类失败：估计有误差 vs 表示缺自由度。后者只能换表示。"});
});

  note("这个表面任务就叫「代理任务」proxy task",640,286,"v");
  note("⭐ 它的作用是「造一个有监督信号的理由」—— 文本自己就带着标签",640,324,"y");
  note("（下一个词是什么，不用人去标，文本里本来就写着）",640,358,"d");},"<b>这是整个一段最值钱的一个想法，而且它远不止用在 NLP 上。</b><br><b>问题是这样的：我们想要有意义的词向量，但「有意义」没法直接写成一个损失函数 —— 你没有「正确的词向量」可以去拟合。</b><br><b>⇒ Word2vec 的办法是绕一步：去做<u>另一个</u>任务，而那个任务的训练过程会顺带长出我们要的东西。</b><br><b>那个任务是「预测词」。讲者说这叫 proxy task，代理任务。</b><br><b>★★ 他把动机说得非常清楚，这几句值得完整理解</b>：<b>「说到底，在这个练习里，我们在意的不一定是预测下一个词，至少现在还不是。我们的目标是学到这些词的、有意义的表示。」</b><br><b>⭐ 然后他给了为什么这招成立的理由</b>：<b>「如果你有一个模型不知怎么就学会了预测下一个词，那意味着这个模型对语言是怎么运作的有了某种理解 —— 而这正是你想要的。」</b><br><b>⇒ 逻辑链是：会预测 ⇒ 必然掌握了语言的某些规律 ⇒ 而这些规律就存在它的内部表示里。</b><br><b>★★ 而代理任务之所以可行，关键在一个很容易被滑过去的地方：这个任务的标签是<u>免费</u>的。</b><b>「下一个词是什么」不需要任何人去标注 —— 文本里本来就写着。</b><b>⭐ 这就是后来所谓「自监督」的全部秘密，而它解释了为什么语言模型能吃下整个互联网：数据和标签是同一样东西。</b><br><b>⚠ 对照一下前面那条链就更清楚了：评估需要标注、标注很贵；而训练这里不需要标注。这个不对称是这个领域能起飞的根本原因之一。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("38:28","king is to queen, what this is to that");
  note("Word2vec（2013）为什么当年轰动：学出来的向量「讲得通」",640,192,"v");
  boxNode(150,224,440,46,"king : queen  ::  man : woman","g");
  boxNode(690,224,440,46,"Paris : France  ::  Berlin : Germany","g");
  note("向量之间的「差」竟然对应着可以说出口的关系",640,300,"y");
  note("⚠ 两种训练方向，想法同一个：拿上下文和目标词互相预测",640,340,"d");
  note("CBOW：用周围的词 → 猜中间那个    skip-gram：用中间那个 → 猜周围的词",640,374,"b");},"<b>先说 Word2vec 当年为什么轰动，再说它怎么做的 —— 讲者是这个顺序，因为「轰动」本身就是最好的动机。</b><br><b>它给出的是一种直观、可解释的方式来看这些向量。</b><b>讲者举的例子：king 对 queen，就像这个对那个；Paris 对 France，就像 Berlin 对 Germany。</b><br><b>⭐ 这些例子的意思是：向量之间的<u>差</u>对应着一个可以说出口的关系（性别、首都-国家）。</b><b>⇒ 于是「向量有意义」从一句空话变成了可以当场检验的东西 —— 这就是它当年打动人的地方。</b><br><b>⚠ 注意讲者的措辞是 a way to make sense of the embeddings —— 「让这些嵌入讲得通」。这是关于<u>可解释性</u>的论据，不是关于指标的论据。</b><br><b>然后是做法：两种，但他强调「它们依赖同一个想法」。</b><br><b>CBOW（continuous bag of words）</b>：<b>拿一个目标词<u>周围</u>的词，去预测这个目标词。</b><br><b>skip-gram</b>：<b>反过来 —— 从目标词出发，去预测它周围的词。</b><br><b>⭐ 同一个想法的两个方向：都是「让上下文和目标词互相预测」。</b><b>⚠ 而讲者接下来要走的那个例子用的是更简单的一种：直接预测<u>下一个</u>词。他明说这是为了讲清楚机制，不是这两种之一。</b>");
  SUM(0,13,{h:"代理任务：真正想要的是训练的副产品",k:"「有意义的词向量」写不成损失函数 ⇒ 改去做一个<b>能写成损失函数</b>的任务（预测词），而要的东西在训练过程中顺带长出来。这个任务叫 proxy task。",m:"⭐ 关键是代理任务的<b>标签免费</b>：「下一个词是什么」文本里本来就写着，不需要人标。这就是自监督的全部秘密，也是能吃下整个互联网的原因。",w:"⚠ CBOW（周围→中间）与 skip-gram（中间→周围）是同一想法的两个方向。而讲者接着走的那个例子用的是更简单的「预测下一个词」，不是这两种之一。",r:"⭐ 直接可搬：你真正想要的量（最优配置）难以直接优化时，找一个<b>标签免费</b>的代理任务（比如「预测两个配置谁更便宜」——历史日志里本来就有答案），把要的东西当副产品学出来。"});
  QUIZ(0,13,{t:"代理任务为什么可行？最关键的一条是什么？",o:["它的模型更简单，容易训练","它不需要反向传播","它的标签是免费的 —— 「下一个词是什么」文本里本来就写着，不需要人标注","它的损失函数是凸的"],a:2,w:"这正是自监督的核心：数据和标签是同一样东西。对照前面那条链 —— 评估需要标注且标注很贵，而训练这里不需要。这个不对称是领域起飞的根本原因之一。"});
});
KP("14 · 把那个玩具网络走一遍（上）：一次前向",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("41:28","the hidden layer is of size d, which is typically much smaller than the vocabulary");
  boxNode(100,222,180,46,"a","b");
  note("one-hot，V=6 维",190,196,"d");
  boxNode(360,222,180,46,"隐藏层 d 维","g");
  note("例子里 d=2，值 (0.2, 0.9)",450,196,"d");
  boxNode(620,222,180,46,"再乘一个矩阵","v");
  boxNode(880,222,230,46,"softmax → 6 个概率","y");
  link(280,245,360,245); link(540,245,620,245); link(800,245,880,245);
  note("V 几万~几十万    d 几百（讲者举 768）  ⇒ 中间这一层是个「瓶颈」",640,300,"y");
  note("⚠ 正因为 d 远小于 V，模型被迫把信息「压缩」—— 压缩就是学表示",640,338,"r");
  note("输出：0.2 / 0.4 / 0.1 / 0.1 / 0.1 / 0.1，而正确答案是第 2 个词",640,374,"d");},"<b>讲者用一个六个词的玩具词表把整条路走了一遍，数字很具体，值得跟着算。</b><br><b>网络极简</b>：<b>输入是 V 维的 one-hot（这里 V=6）→ 乘一个矩阵加偏置得到 d 维的隐藏层 → 再乘一个矩阵 → softmax → 得到 V 个概率。</b><br><b>他给的具体数</b>：<b>输入词是 a，隐藏层 d=2，算出来是 (0.2, 0.9)；输出的六个概率是 0.2、0.4、0.1、0.1、0.1、0.1。</b><b>而真正的下一个词是 cute，也就是词表里的第 2 个 —— 对应那个 0.4。</b><br><b>★★ 这一镜最要紧的不是数字，是那个维度关系：d 远小于 V。</b><b>讲者说 V 通常是几万或几十万，而 d 通常是几百 —— 他举的例子是 768。</b><br><b>⭐ 为什么这个「远小于」是整件事成立的关键？因为它造成了一个瓶颈。</b><b>模型必须把 V 维的信息挤进 d 维再放回来。</b><b>⚠ 挤不下，所以它只能保留「对预测下一个词最有用」的那部分信息。</b><b>⇒ 而「保留有用的、丢掉没用的」正是我们说的「学到了表示」。</b><br><b>★ 这一条值得单独记住，因为它是一个通用机制：<u>瓶颈本身就是学习的压力来源</u>。</b><b>如果 d 和 V 一样大，模型完全可以原封不动地把 one-hot 搬过去，什么都不用学 —— 那就学不到任何东西。</b><b>⇒ 自编码器、PCA、信息瓶颈，用的都是这同一个道理。</b>");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("44:14","you compute the loss, so typically cross-entropy");
  setEq("$$\\mathcal{L}=-\\sum_{k=1}^{V} y_k \\log \\hat{p}_k \\;=\\; -\\log \\hat{p}_{\\text{正确词}}$$");
  note("标签是 (0,1,0,0,0,0) —— 正确词那一位是 1",640,196,"d");
  note("⇒ 求和里只剩一项：正确词被预测的概率的对数",640,228,"g");
  note("⚠ 所以这个损失只做一件事：把「正确那一个」的概率往上推",640,260,"y");},"<b>损失函数这一步讲者讲得快，但有一个化简值得自己写一遍，因为它解释了交叉熵到底在干什么。</b><br><b>他说的是：拿到预测之后，你计算损失 —— 通常是交叉熵 —— 它决定了你离正确答案有多远；然后根据这个差距去更新权重，让预测更靠近真相。</b><br><b>⭐ 现在看那个化简。交叉熵的一般形式是对所有 V 个词求和：−Σ y_k log p̂_k。</b><b>但标签 y 是 one-hot ——正确词那一位是 1，其余全是 0。</b><b>⇒ 于是整个求和里只剩<u>一</u>项：−log p̂(正确词)。</b><br><b>★ 这一行化简揭示了交叉熵在这种场景下的真实作用：它只关心「正确那一个词」被预测了多高的概率，其它词的概率它<u>不直接</u>管。</b><br><b>⚠ 但「不直接管」不等于「不管」—— 因为 softmax 的输出加起来必须等于 1。</b><b>⇒ 把正确词的概率推上去，其余词的概率就被<u>自动</u>挤下去了。</b><b>这个「挤」是 softmax 带来的，不是损失函数带来的。</b><br><b>⭐ 把这两层分清楚很有用，因为后面讲 label smoothing 的时候正是在这里动手：它改的不是损失的形式，而是那个标签 —— 把 1 改成 1−ε，把 0 改成 ε/(V−1)。</b><b>⇒ 于是求和里就不止一项了，模型被要求「别那么确信」。</b>");
  SUM(0,14,{h:"玩具网络：瓶颈 d ≪ V 才是学习的压力来源",k:"输入 V 维 one-hot → d 维隐藏层 → 再投影 → softmax 得 V 个概率。V 几万~几十万，d 几百（讲者举 768）。损失是交叉熵。",m:"⭐ <b>d ≪ V 造成瓶颈</b>：信息挤不下，模型只能留「对预测最有用的那部分」—— 这就是「学到表示」。若 d=V，模型可以原封不动搬过去，什么都学不到。",w:"⚠ 交叉熵在 one-hot 标签下化简成 <b>−log p̂(正确词)</b>，只推正确那一个；其余被压下去是 <b>softmax 归一化</b>的后果，不是损失函数的。两层要分开。",r:"「瓶颈制造学习压力」是通用机制（自编码器、PCA、信息瓶颈同理）。若你要学配置的表示，<b>维度必须明显低于配置的枚举规模</b>，否则模型会退化成查表、学不到可迁移的结构。"});
  QUIZ(0,14,{t:"为什么 d 必须远小于 V？",o:["因为词表会不断变大","d≪V 造成瓶颈，信息挤不下 ⇒ 模型被迫只留最有用的部分，这就是「学到表示」；若 d=V 它可以原封不动搬过去，什么都不学","为了省内存","为了让 softmax 数值稳定"],a:1,w:"讲者只说了 d 比词表小得多（几百 vs 几万~几十万）。瓶颈即压力这一层是补的，但它正是这个方法成立的原因，也是自编码器/PCA/信息瓶颈的共同机制。"});
});
KP("15 · 把那个玩具网络走一遍（下）：嵌入到底在哪",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("45:34","take the representation that the model learns, which is the green units");
  boxNode(120,216,200,48,"one-hot 向量","b");
  boxNode(420,216,260,48,"第一层权重矩阵 W","v");
  boxNode(790,216,240,48,"d 维向量 ⇒ 这就是嵌入","g");
  link(320,240,420,240); link(680,240,790,240);
  note("⚠ one-hot 乘一个矩阵 = 把那个矩阵的第 k 行「取出来」",640,300,"r");
  note("⇒ 所谓「词嵌入表」就是 W 本身，查表即可，根本不用做乘法",640,336,"y");
  note("训练完就把网络后半截扔掉 —— 它只是用来制造梯度的脚手架",640,372,"d");},"<b>这一镜回答「嵌入到底是哪个东西」，而答案比大多数人以为的更朴素。</b><br><b>讲者说：你把模型学到的那个表示拿出来，就是那些绿色的单元。</b><b>也就是隐藏层那个 d 维向量。</b><b>以后每拿到一个词，就把它写成 one-hot、乘上这些权重，得到那个绿色的表示 —— 那就是它的词向量。</b><br><b>★★ 这里有一个关键的观察，讲者没明说，但它让整件事变得非常清楚：one-hot 向量乘一个矩阵，等于<u>把那个矩阵的第 k 行取出来</u>。</b><br><b>为什么？因为 one-hot 只有第 k 位是 1，其余是 0 —— 矩阵乘法的结果就只剩第 k 行。</b><br><b>⇒ 所以那个所谓的「嵌入层」根本不是在做乘法，它就是<u>查表</u>。</b><b>第一层权重矩阵 W 的每一行，就是一个词的向量。W 本身就是那张词向量表。</b><br><b>⭐ 这解释了几件实践上的事</b>：<b>为什么嵌入层的参数量是 V×d（几十万 × 几百，这通常是模型里最大的单个矩阵之一）；为什么代码里它叫 Embedding 而不是 Linear；为什么推理时它快得几乎不花时间。</b><br><b>★ 而最有教学价值的一点是：训练完之后，网络的后半截（第二个矩阵、softmax）就被<u>扔掉</u>了。</b><b>它们存在的唯一目的是制造一个损失、从而制造梯度，把信息压进 W 里。</b><b>⇒ 这就是「代理任务」那句话的具体兑现：我们要的从来不是那个预测器，是这张表。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("50:48","you want the embedding to be rich enough that it can be informative for your downstream task");
  note("两个实际问题，讲者都在课堂问答里回答了",640,192,"v");
  boxNode(80,226,520,46,"① d 取多大？","b");
  note("权衡：下游任务越复杂 ⇒ 要更大；而越大 ⇒ 推理越贵",340,298,"d");
  note("量级是几百到几千；768 是常见取值，且「是经验值」",340,332,"g");
  boxNode(680,226,520,46,"② 什么时候停止训练？","b");
  note("盯代理任务的损失曲线，收敛了就停",940,298,"d");
  note("⚠ 但要记住代理任务不是真目标 ⇒ 最终要看下游任务",940,332,"y");
  note("另：推理时遇到没见过的词 ⇒ 全部映到同一个 unknown 向量（29:16 那个 OOV 桶）",640,374,"r");},"<b>两个很实际的问题，都是课堂上问出来的，而讲者的回答都带着「这是权衡」的诚实。</b><br><b>① d 取多大？</b><b>他说这是一个权衡：你希望嵌入足够丰富，能为下游任务提供信息 —— 如果下游任务很专门、输出种类很多，可能需要更大的向量；任务简单，小向量也许就够。</b><b>⚠ 而另一头是成本：向量更长 ⇒ 计算更多 ⇒ 推理更贵。</b><b>他总结成两条：一是下游任务有多复杂，二是你对延迟和成本有多敏感。</b><b>量级是几百到几千，768 是常见值。</b><b>⭐ 有人追问这是不是纯经验的，他直接承认：是经验的，而且「你也可以沿用别人试出来的数」。</b><br><b>② 什么时候停？</b><b>做法是盯着代理任务的损失曲线（横轴是 epoch，也就是模型把训练集看过几遍），收敛了就停。</b><b>⚠ 但他特意加了一句：要记住这不一定是你的最终目标 —— 得看下游任务。</b><br><b>⭐ 这一句其实是代理任务这个套路的固有软肋，值得单独记：你优化的指标和你在意的指标<u>不是同一个</u>。</b><b>所以「代理任务收敛」只是一个方便的停止信号，不是正确性的保证。</b><br><b>★ 这一点和你的课题是同一个形状：用代理模型指导搜索时，「代理模型的拟合损失降下来了」不等于「搜索结果变好了」。两者必须分别度量、分别报告。</b>");
  SUM(0,15,{h:"嵌入就是第一层权重矩阵的一行 —— 查表而已",k:"one-hot 乘矩阵 = <b>取矩阵的第 k 行</b> ⇒ 「嵌入层」不是乘法而是<b>查表</b>，第一层权重矩阵 W 本身就是词向量表（V×d）。训练完网络后半截直接扔掉。",m:"后半截（第二个矩阵 + softmax）存在的唯一目的是制造损失→制造梯度，把信息压进 W。这就是代理任务那句话的具体兑现。",w:"⚠ d 的选择是权衡（下游任务复杂度 ↔ 推理成本），讲者承认 768 这类数字<b>是经验值</b>。停止训练靠看代理任务的损失，但<b>代理任务不是真目标</b>。",r:"⭐ 固有软肋，直接对应你那里：<b>你优化的指标与你在意的指标不是同一个</b>。「代理模型拟合损失降了」≠「搜索结果更好」——两者必须分别度量、分别报告。"});
  QUIZ(0,15,{t:"「嵌入层」实际在做什么运算？",o:["把向量归一化到单位长度","一次矩阵乘法加激活函数","一次 softmax","查表：one-hot 乘矩阵等于取出矩阵的第 k 行，所以第一层权重矩阵本身就是词向量表"],a:3,w:"这解释了为什么它的参数量是 V×d（常是模型里最大的矩阵之一）、为什么代码里叫 Embedding 而不是 Linear、为什么推理时它几乎不花时间。"});
});
KP("16 · Word2vec 的两个硬限制 ⇒ 下一关",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("52:47","how can you distinguish words that are spelled the same but in different contexts");
  note("一个词 ⇒ 永远只有一个向量",640,192,"r");
  boxNode(150,226,440,46,"river bank（河岸）","y");
  boxNode(690,226,440,46,"robbing a bank（银行）","y");

KP("19 · RNN 的三个病（上）：长程依赖与梯度消失",function(){

  note("⇒ 反向传播时必须穿过这一长串 ⇒ 变成一堆因子的「连乘」",640,230,"r");
  note("每个因子 >1 ⇒ 爆炸   每个因子 <1 ⇒ 衰减到 0",640,262,"r");},"<b>讲者在这里说「我知道我们时间不够了，但我还是要解释这一段」—— 他是对的，这一段值得解释。</b><br><b>先说症状：病一是长程依赖。</b><b>整句话的意思基本只被封装在那一个隐藏状态里（讲者原话），这直接削弱了模型「记住」过去看到的东西的能力。</b><br><b>然后是机制，而机制就是那个连乘。</b><b>⭐ 推理链条是这样的</b>：<b>要预测最后一个词，你依赖它之前<u>每一个</u>隐藏状态；</b><b>而更新权重时做反向传播，就必须考虑到这里的值不只取决于这一次计算，还取决于之前那些<u>串行发生</u>的计算。</b><b>⇒ 这叫「穿越时间的反向传播」。</b><br><b>⚠ 讲者坦白说那个公式「很丑」，而且明说「这不是这门课的重点，所以我不展开」。</b><b>但他把结论说准了：写出来之后它是<u>一堆量的乘积</u> —— 大于 1 就爆炸，小于 1 就衰减。</b><b>「因为如果你把很多小于 1 的东西乘起来，它就趋向 0 了。」</b><br><b>⭐ 为什么趋向 0 是灾难？因为梯度就是「该往哪个方向改、改多少」。</b><b>梯度变成 0 ⇒ 没有更新信号 ⇒ 那段远处的依赖<u>学不进去</u>。</b><br><b>★ 值得记住的一般形式：只要一个量是「长度随输入增长的连乘」，它几乎必然要么炸要么灭 —— 指数的两个方向都不友好。</b><b>⇒ 后面你会看到 Transformer 根本不做这个连乘：它从输出到任意输入只有「一步」直连，所以这个病从结构上就不存在。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 三者都是「学出来的」—— 由三个投影矩阵从同一份嵌入算出",640,382,"r");},"<b>Q、K、V 这套词是后面所有内容的语言，必须先把它们各自的角色钉死，否则后面的公式只是符号。</b><br><b>讲者给的定义框架很好：当你想<u>用别的东西来表达某个东西</u>时，我们用 query、key、value 这三个词。</b><br><b>⭐ 把例子套进去</b>：<b>目标是「用其它全部 token 来表达 teddy bear」。</b><br><b>Query = teddy bear</b> —— <b>我想表达的那个。</b><br><b>Key = 其它每个 token 的「名牌」</b> —— <b>拿来和 query 比，看谁跟我像。</b><br><b>Value = 其它每个 token 的「内容」</b> —— <b>比出来像谁，就多拿谁的 value。</b><br><b>⇒ 一句话流程：拿 query 去和所有 key 比 ⇒ 得到一组权重 ⇒ 用这组权重去加权求和所有 value。</b><br><b>★★ 课堂上有人正面问了「key 和 value 到底是什么、怎么来的」，讲者的回答有两层，都要记</b>：<b>第一层也是最要紧的 —— 这些量是<u>学出来的</u>，你不是把它们固定住的。</b><b>第二层是解释上的分工 —— key 的存在是为了让你判断「哪个和 query 最像」，而 value 是跟那个元素<u>关联</u>的实际内容。</b><br><b>⚠ 他最后补了一句关键的实现细节（是学生先提出来的）：我们会做<u>投影</u>来得到这三个量，而这些投影是模型学出来的。</b><br><b>⇒ 所以 Q、K、V 不是三份不同的数据，它们是<u>同一份</u>嵌入经过三个不同的学出来的矩阵投影出来的三个视角。这一点在端到端那一段会画出来。</b>");
  SUM(0,23,{h:"Q / K / V：用别人表达自己的三个角色",k:"Query = 我想表达的那个；Key = 别人的「名牌」，拿来和 query 比像不像；Value = 别人的「内容」，像谁就多拿谁的。流程：query 比所有 key ⇒ 权重 ⇒ 加权求和 value。",m:"⚠ 三者<b>不是三份不同的数据</b>：它们是<b>同一份嵌入</b>经过三个不同的、学出来的投影矩阵得到的三个视角。",w:"讲者强调的第一句是 these quantities, they are learned —— 你不固定它们。key 负责「判断像不像」，value 负责「提供实际内容」，分工不同。",r:"⭐ 这个三角色分解本身就是一个可复用的设计模式：把「<b>用来比较</b>的表示」与「<b>用来取用</b>的表示」分开学。你的剪枝判据也可以这样拆：一套特征判「这两个前缀可比吗」，另一套判「谁更好」。"});
  QUIZ(0,23,{t:"Q、K、V 三者的关系是什么？",o:["同一份嵌入经过三个不同的、学出来的投影矩阵得到的三个视角","三者固定不变，由词表决定","Q 是输入，K 和 V 是输出","三份独立的输入数据"],a:0,w:"讲者强调 these quantities, they are learned，并补了「我们会做投影来得到它们，而投影是模型学出来的」。设计上的要点是「用来比较的表示」与「用来取用的表示」分开学。"});
});
KP("24 · 写成矩阵：GPU 爱矩阵",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("71:16","GPUs love matrices");
  setEq("$$\\mathrm{Attention}(Q,K,V)=\\mathrm{softmax}\\!\\left(\\frac{QK^{\\top}}{\\sqrt{d_k}}\\right)V$$");
  note("整个序列的自注意力 ⇒ 一串矩阵乘法",640,196,"y");
  note("⭐ 没有任何一步要等「前一个 token 算完」⇒ 可以并行",640,228,"g");
  note("⚠ 这才是 RNN 那第三个病（串行慢）被治掉的地方",640,260,"r");},"<b>这是全讲最重要的一个公式，而讲者先说的是它的<u>硬件</u>意义 —— 这个顺序本身就很说明问题。</b><br><b>他说：用 Q/K/V 这种方式表达的一个好处是，我们可以把整个序列上的自注意力计算写成<u>矩阵形式</u>。而 GPU 爱矩阵。「所以它真的是为我们现有的硬件而生的。」</b><br><b>⭐ 把这件事说透：注意力不是「在 GPU 上跑得还行」，而是<u>形状上</u>就是矩阵乘法 —— 而矩阵乘法正是 GPU 唯一真正擅长的事。</b><br><b>★★ 关键在于那个公式里没有任何一步需要「等前一个 token 算完」。</b><b>⇒ 对比 RNN：第 5 步必须等第 4 步。</b><b>⇒ 而这里，所有 token 的 Q、所有 token 的 K，一次性全算出来，再一次矩阵乘法得到全部两两得分。</b><br><b>⇒ 这就是 RNN 第三个病（串行慢）被治掉的确切位置。</b><b>⚠ 而且治法不是「优化实现」，是「换了一个在数学形状上可并行的定义」。</b><br><b>⭐ 公式的三块各对应上一个知识点的一个角色</b>：<b>QKᵀ = 每个 query 和每个 key 比一次（得到一个 n×n 的得分表）；softmax = 把每一行得分变成一组和为 1 的权重；最后乘 V = 用这组权重去加权求和 value。</b><br><b>⚠ 分母那个 √d_k 现在先放着 —— 它有一个独立的理由，端到端那一段会专门讲。</b><br><b>★ 顺带注意一个代价，前面埋过伏笔：那个得分表是 n×n 的。⇒ 序列长度翻倍，这一步的计算量变成<u>四</u>倍。前面说的「复杂度是序列长度的函数」，在这里升级成了平方。</b>");
  SUM(0,24,{h:"softmax(QKᵀ/√d_k)V —— 形状上就是矩阵乘法",k:"整个序列的自注意力写成一串矩阵乘法：QKᵀ 得到 n×n 的两两得分表 → softmax 把每行变成和为 1 的权重 → 乘 V 加权求和。",m:"⭐ 没有任何一步需要等前一个 token 算完 ⇒ <b>可并行</b>。治法不是「优化实现」，而是换了一个<b>数学形状上就可并行</b>的定义。而 GPU 唯一真正擅长的就是矩阵乘法。",w:"⚠ 代价是那个得分表是 <b>n×n</b>：序列长度翻倍，这一步计算量变<b>四</b>倍。前面「复杂度是序列长度的函数」在这里升级成平方。",r:"⭐ 很值得带走：<b>把算法的数学形状对齐到硬件擅长的那种运算</b>，收益可能远大于算法层面的聪明。你的搜索如果能把「一批候选的评分」写成一次批量矩阵运算，实际吞吐的提升可能比改进剪枝判据更大。"});
  QUIZ(0,24,{t:"注意力能并行的根本原因是什么？",o:["用了更快的激活函数","GPU 显存更大","序列被切成了小块","它的定义在数学形状上就是矩阵乘法，没有任何一步需要等前一个 token 算完"],a:3,w:"讲者先说的是硬件意义：GPUs love matrices、「真的是为我们现有的硬件而生的」。治法不是优化实现，而是换了一个形状上可并行的定义。代价是 n×n 的得分表。"});
});
KP("25 · 架构全景：encoder + decoder，三处注意力",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("Transformer：左边 encoder（读源句）· 右边 decoder（吐译文）",640,186,"v");
  stack(330,200,[["输入嵌入 + 位置编码","b"],["多头「自注意力」","g"],["前馈层 FFN","v"]],300,36,8);
  note("encoder：源句的 token 互相看 ⇒ 产出丰富的表示",330,352,"d");
  stack(950,200,[["输出嵌入 + 位置编码","b"],["「掩码」自注意力","y"],["「交叉」注意力","r"],["前馈层 FFN","v"]],300,36,8);
  note("decoder：先看已译出的，再看源句",950,386,"d");
  link(480,236,800,306);
  note("K, V",640,262,"r");},"<b>把前面所有零件拼起来，就是这张架构图。而最该先建立的直觉是：同一个「注意力层」在三个位置上做了三件不同的事。</b><br><b>左边 encoder（编码器）</b>：<b>输入是源语言的句子。</b><b>它做的事是「让源句里所有 token 互相 attend」，产出一组丰富的表示。</b><b>讲者的描述：你把输入文本送进去，所有 token 彼此互相注意。</b><br><b>右边 decoder（解码器）</b>：<b>输入是你正在预测的目标语言。</b><br><b>⇒ 整体流程：先用 encoder 把源句算成一组好的表示；再由 decoder 一边参考这些表示、一边逐词吐出译文。</b><br><b>⭐ 而 decoder 里有<u>两</u>个注意力层，这是整张图最容易糊的地方，下一镜会逐个说清。</b><b>先给个一句话版本：第一个（掩码自注意力）看「已经译出来的部分」；第二个（交叉注意力）看「源句」。</b><br><b>⚠ 注意从 encoder 连到 decoder 的那两条线标的是 K 和 V —— 这是下一镜那个课堂提问的答案。</b><br><b>另外两个要点现在先记下</b>：<b>FFN（前馈层）在两边都有，讲者说它的作用只是「让模型再学一种投影」、多一点自由度；</b><b>而「多头」是把同一个注意力计算用不同的投影做好几遍 —— 本讲后面有专门一节。</b><br><b>⭐ 最后一句话定位：这张图是 2017 年那篇论文的原始形态，为<u>翻译</u>设计的。</b><b>⚠ 而你今天用的 ChatGPT 这类模型其实只用了右半边（decoder-only）—— 那是下一讲 L2 的内容。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("77:58","this arrow is indeed the query, because this is the thing that you want to figure out");
  note("课堂抢答：从 decoder 连进交叉注意力的那条箭头，是 Q 还是 K/V？",640,192,"y");
  boxNode(120,226,480,46,"来自 decoder ⇒ Query","y");
  note("因为「我想弄清楚的是它」",360,298,"g");
  boxNode(680,226,480,46,"来自 encoder ⇒ Key 与 Value","b");
  note("因为「输入里哪些东西重要」要去它那儿查",920,298,"g");
  note("⭐ 判据一句话：谁在<提问>，谁就是 Q",640,344,"v");
  note("⚠ 讲者的原话提示：given your query, what are the elements from the inputs that matter?",640,382,"d");},"<b>这是全讲最好的一个教学瞬间：讲者把问题抛给学生，还说「三分之一的概率，谁来试试」。值得自己先答一遍再看。</b><br><b>问题：交叉注意力层有三条输入线 —— 两条来自 encoder、一条来自 decoder。那条来自 decoder 的，是 Q、K 还是 V？</b><br><b>学生先猜 key，又猜 query。而答案是 query。</b><br><b>⭐ 讲者给的判据非常好用，建议背下来</b>：<b>「你要问自己的是：输入里哪些词是重要的？也就是说 —— 给定你的 query，输入里哪些元素是要紧的？」</b><b>⇒ 所以这条箭头确实是 query，因为<u>它才是你想弄清楚的那个东西</u>。</b><b>而 key 和 value 来自 encoder，也就是来自源句。</b><br><b>★★ 一句话判据：<u>谁在提问，谁就是 Q</u>。</b><b>⇒ 在交叉注意力里，提问的是「我正在生成译文的这一步」，被查的是源句。</b><b>⇒ 所以 Q 来自 decoder，K/V 来自 encoder。</b><br><b>⚠ 为什么这个判据值得记牢？因为 Q/K/V 的来源<u>唯一地决定</u>了一个注意力层在做什么事。</b><b>⭐ 三处注意力的区别，全部可以用「Q 从哪来、K/V 从哪来」说清楚</b>：<b>encoder 自注意力（Q、K、V 都来自源句）；decoder 掩码自注意力（都来自已译出的部分）；交叉注意力（Q 来自译文、K/V 来自源句）。</b><br><b>⇒ 以后看任何一个注意力变体，第一件事就是问这两个来源。这比记名字有用得多。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("78:54","it's called masked, because it only looks at the tokens that translated so far");
  note("三处注意力，用「Q 从哪来 / K,V 从哪来」一次说清",640,190,"v");
  matrix({rows:4,cols:4,cw:280,ch:38,x:50,y:206,
    cell:function(i,j){var t=[["","Q 来自","K, V 来自","它在问什么"],
      ["encoder 自注意力","源句","源句","源句里 token 之间的关系"],
      ["decoder 掩码自注意力","已译出","已译出（只到当前）","已译出的哪些对下一词有用"],
      ["交叉注意力","已译出","源句","源句里哪些对下一词有用"]];return t[i][j];},
    hl:function(i,j){return (i===2&&j===2)?"y":"";}});
  note("⚠ 「掩码」不是技巧，是必然：右边的词还没翻出来，根本不存在",640,382,"r");},"<b>三处注意力，一张表说清。而这张表的用法是：<u>按列读</u>，不要按行背。</b><br><b>encoder 自注意力</b>：<b>Q、K、V 全部来自源句 ⇒ 它在问「源句里 token 之间的关系」。</b><br><b>decoder 掩码自注意力</b>：<b>Q、K、V 全部来自<u>已经译出来</u>的部分 ⇒ 它在问「我已经译出的这些词里，哪些对预测下一个词有用」。</b><b>讲者的例子：已经译出 un ours en peluche，要预测下一个词，就看看至今译出的哪些 token 有用。</b><br><b>交叉注意力</b>：<b>Q 来自译文、K/V 来自源句 ⇒ 它在问「源句里哪些东西对预测下一个词有用」。</b><br><b>★★ 现在说「掩码」这个词，而关键是：它不是一个技巧，它是一个<u>必然</u>。</b><b>讲者的原话：它叫掩码，因为它只看<u>至今已翻译出来</u>的那些 token。它不看没被翻译的那些，因为它们当然还没被翻译 —— 所以在你要预测的那个 token 右边，根本没有东西。</b><br><b>⭐ 把这件事想清楚很重要，因为很多人把掩码当成「为了防止作弊而加的限制」。</b><b>⚠ 在<u>推理</u>时它不是限制，是事实：未来的词还不存在。</b><b>而在<u>训练</u>时它才表现为一个限制 —— 因为训练时整句译文都在手上，必须人为挡住右边，否则模型就能偷看答案。</b><br><b>⇒ 所以同一个掩码，在训练时是「防偷看」，在推理时是「本来就没有」。这两种解读都对，而且必须都知道。</b>");
  SUM(0,25,{h:"三处注意力：全部用「Q 从哪来 / K,V 从哪来」说清",k:"encoder 自注意力（Q,K,V 都来自源句）· decoder <b>掩码</b>自注意力（都来自已译出部分）· <b>交叉</b>注意力（Q 来自译文、K/V 来自源句）。判据：<b>谁在提问，谁就是 Q</b>。",m:"Q/K/V 的来源<b>唯一地决定</b>了一个注意力层在做什么事。看任何注意力变体，先问这两个来源，比记名字有用。",w:"⚠ 「掩码」不是防作弊的技巧而是必然：推理时未来的词<b>不存在</b>；只有训练时（整句译文在手）它才表现为「必须挡住右边」。两种解读都要知道。",r:"⭐ 「谁在提问谁就是 Q」是一个很干净的接口设计判据。你的搜索里也有类似的角色分配问题：当前部分解在<b>提问</b>（下一步选什么），而历史记录提供<b>可查的内容</b> —— 把这两者分开实现，接口会清楚很多。"});
  QUIZ(0,25,{t:"交叉注意力里，来自 decoder 的那条输入是 Q 还是 K/V？为什么？",o:["V —— 因为它提供要输出的内容","K —— 因为要用它去匹配源句","三者都来自 decoder","Q —— 因为它才是「我想弄清楚的那个东西」；判据是「谁在提问，谁就是 Q」"],a:3,w:"讲者的提示是 given your query, what are the elements from the inputs that matter? —— 提问的是「我正在生成的这一步」，被查的是源句。所以 Q 来自 decoder，K/V 来自 encoder。"});
});
KP("26 · 位置编码：扔掉顺序，再补回来",function(){
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("80:28","which is why you have position encodings");
  setEq("$$x_i \\;=\\; \\underbrace{E(\\text{token}_i)}_{\\text{学出来的嵌入}} \\;+\\; \\underbrace{P(i)}_{\\text{位置编码（正弦/余弦）}}$$");
  note("直连换掉了串行 ⇒ 顺序信息也跟着没了",640,196,"r");
  note("⇒ 把位置另外编码成一个向量，逐元素「加」到嵌入上",640,230,"g");
  note("⚠ 是相加，不是拼接 —— 原论文用一组正弦余弦",640,262,"y");},"<b>这是那把刀的代价，而讲者点它的方式很直接。</b><br><b>他说：这里你有通向不同 token 的直接链接，所以你<u>没有</u>顺序这个感觉了。因为在 RNN 里你是一次表达一个，所以你有某种词序感；而这里没有，因为它是直连 —— 这正是为什么你需要位置编码，它们的作用就是告知这个词在序列中的位置。</b><br><b>⭐ 把这段话的结构看清：它是一个「因为…所以…」的链条，而且是<u>代价</u>而非<u>设计</u></b>：<b>要并行 ⇒ 必须放弃串行 ⇒ 放弃串行就丢了顺序 ⇒ 所以必须把顺序用别的办法加回来。</b><br><b>做法（Shervine 在端到端那段讲的）</b>：<b>每个 token 的表示 = 它学出来的嵌入 + 一个位置编码向量，<u>逐元素相加</u>。原论文用的是一组正弦和余弦。</b><br><b>⚠ 「相加」这一点值得注意，因为直觉上「拼接」更自然（把位置信息放在另外几维里，互不干扰）。</b><b>⭐ 相加意味着位置信息和语义信息<u>共享同一批维度</u>、互相叠在一起 —— 这看起来很粗暴，但它省掉了维度增长，而且实践中确实有效。</b><br><b>⚠ 讲者两次明说「今天不深入这部分」，所以具体为什么用正弦余弦、为什么能相加，这一讲没讲。</b><b>⭐ 你只需要带走那个<u>结构</u>性的认识：这是一个为了并行而付出的代价，必须由一个额外机制来补偿。</b><b>⇒ 这个「一个机制的代价要靠另一个机制补」的模式，这一讲里出现了两次（另一次是 √d_k）。</b>");

KP("28 · label smoothing：因为「下一个词」本来就不唯一",function(){

  note("「what a great ___」—— day / lecture / book 都行",640,196,"y");
  note("⇒ 别再要求模型 100% 确信某一个词",640,228,"g");
  note("改的是「标签」，不是损失函数的形式",640,260,"v");},"<b>这是讲者补的「作者用的另一个技巧」，而它的动机是这一讲里最贴近语言本质的一条。</b><br><b>动机</b>：<b>在 NLP 里，当你要预测接下来是什么，通常<u>不止一种</u>答案。</b><b>讲者举的例子串得很好：what a great day、what a great lecture、what a great book —— 「填那个空总有多个选择」。</b><br><b>⇒ 那么用一个 one-hot 标签去训练，等于告诉模型「只有 day 是对的，别的都错」。而这是<u>假话</u>。</b><br><b>做法</b>：<b>把标签从 (1,0,0,…) 改成「正确词是 1−ε，其余每个是 ε/(V−1)」。</b><b>讲者的描述：它说「预测这个词，但有可能不是这个词」。</b><br><b>★★ 关键是看清它改的位置：改的是<u>标签</u>，不是损失函数。</b><b>⇒ 回到前面那个化简 —— one-hot 标签让交叉熵只剩一项 −log p̂(正确词)；而现在标签不再是 one-hot，于是求和里<u>多出</u>了其它项，模型被拉着「给别的词也留一点概率」。</b><br><b>⭐ 效果：讲者说它「倾向于让你的模型更不确信」，而作者观察到这能改善 BLEU 这类指标。</b><br><b>⚠ 课堂上有人问「softmax 不是已经免费给出这个了吗」，讲者的回答是关键：问题不在输出端，在<u>比较的对象</u>。「说到底你是在把你的预测和<u>标签</u>比。所以问题是，你想和 (1,0,0,0) 比，还是和一个不是 (1,0,0,0) 的东西比？softmax 不让你做这件事。」</b><b>⇒ softmax 管的是「输出是不是一个分布」，而 label smoothing 管的是「你拿什么当真相」。两件事。</b>");

});

  note("⇒ 从此之后，整句话就是「一个 d_model × n 的矩阵」",640,386,"y");},"<b>第二步把「一串 token」变成「一个矩阵」—— 这一步看着平淡，但它是后面能用矩阵乘法的前提。</b><br><b>Shervine 的描述</b>：<b>每个 token 的构成是 —— 它的嵌入（学出来的），加上一个表示「它在序列中处于什么位置」的位置嵌入。</b><b>原论文用正弦余弦的约定，<u>逐元素相加</u>。</b><br><b>⇒ 于是你得到一个「位置感知」的嵌入。对每个 token 都做一遍。</b><br><b>⭐ 然后关键一句：现在你可以把所有这些嵌入看成一个<u>矩阵</u>的形式 —— 一维是 d_model（嵌入的大小），另一维是序列长度（通常记作 n）。</b><br><b>★★ 为什么要强调这一步？因为它是整个「可并行」故事的前提。</b><b>⇒ 一旦整句话是一个矩阵，接下来的三个投影（Wq/Wk/Wv）就都是矩阵乘法，而不是「对每个 token 分别做一次」。</b><b>⚠ 从 RNN 到 Transformer，在数据结构上就是从「一个序列」变成「一个矩阵」。</b><br><b>⭐ 两个记号现在定下来，后面一直用</b>：<b>n = 序列里有几个 token；d_model = 每个 token 的向量有多长。</b><b>⇒ 那张得分表是 n×n（和 d_model 无关）；而每个投影矩阵是 d_model × d_k 这种形状。</b><b>⚠ 把这两个维度分清，后面所有矩阵形状都能自己推出来，不用背。</b>");
  SUM(0,29,{h:"端到端第 1–2 步：加 BOS/EOS，摞成 d_model × n 的矩阵",k:"分词后加 <b>BOS</b>（起跑线）与 <b>EOS</b>（停止信号）。每个 token 的表示 = 嵌入 + 位置编码（逐元素相加）。全部摞起来 = 一个 <b>d_model × n</b> 的矩阵。",m:"⭐ 「整句话变成一个矩阵」是可并行故事的前提：此后三个投影都是矩阵乘法，而不是逐 token 做一次。从 RNN 到 Transformer，数据结构上就是从序列变成矩阵。",w:"⚠ BOS/EOS 是词表里真实存在的 token（有自己的嵌入、参与注意力），不是程序标志位 ⇒ 模型必须<b>学会</b>在合适时候输出 EOS。",r:"记号纪律值得照搬：定清 <b>n</b>（序列长）与 <b>d_model</b>（向量长）两个维度后，所有矩阵形状都能现推、不用背。写方法章时先把维度表列出来，能省掉大量歧义。"});
  QUIZ(0,29,{t:"把整句话摞成一个 d_model × n 的矩阵，关键意义是什么？",o:["它是「可并行」的前提：此后三个投影都是矩阵乘法，而不是逐 token 各做一次","便于计算句子长度","让位置编码可以相加","节省内存"],a:0,w:"从 RNN 到 Transformer，在数据结构上就是从「一个序列」变成「一个矩阵」。记住 n（序列长）与 d_model（向量长）这两个维度，后面所有矩阵形状都能自己推。"});
});
KP("30 · 端到端（中）：QKᵀ 的每一行到底是什么",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("第 3 步：同一份嵌入，投影到三个空间",640,190,"v");
  boxNode(500,224,280,46,"输入嵌入矩阵","b");
  boxNode(90,320,300,44,"× Wq ⇒ Q 查询","y");
  boxNode(490,320,300,44,"× Wk ⇒ K 键","g");
  boxNode(890,320,300,44,"× Wv ⇒ V 值","v");
  link(640,270,240,320); link(640,270,640,320); link(640,270,1040,320);
  note("⚠ 三个 W 都是「学出来的」投影矩阵 —— 这是 Q/K/V 的唯一来源",640,290,"r");},"<b>第三步把 Q、K、V 真正造出来，而这一镜要坐实前面那句「它们是同一份嵌入的三个视角」。</b><br><b>Shervine 的描述很干脆</b>：<b>你拿这个输入，把它投影到<u>三个</u>空间 —— 投到 Wq 的空间得到 queries；把<u>同一份</u>嵌入投到 Wk 的空间得到 keys；对 values 做同样的事得到 values。</b><b>而 Wq、Wk、Wv 是模型学出来的，它们基本上就是投影矩阵。</b><br><b>★★ 「同一份嵌入」这四个字是重点。</b><b>⇒ Q、K、V 不是三份不同的输入数据，它们是一份数据的三个角度。</b><b>⚠ 这就是为什么叫「自」注意力：如果 K、V 来自<u>另一个</u>序列，那就是交叉注意力了 —— 区别只在这里。</b><br><b>⭐ 为什么要分成三个而不是直接用嵌入本身互相点积？因为三个角色的功能不同（前面讲过）</b>：<b>K 要负责「被比较」，V 要负责「被取用」，Q 要负责「发问」。</b><b>⇒ 让模型分别学三个投影，等于允许它为这三种不同的用途各自优化一套特征。</b><br><b>⚠ 如果强行共享（比如让 K = V），模型就必须用同一套特征同时服务「比较」和「取用」—— 又回到了那个「一个表示服务多种用途、只能取折中」的老毛病。</b><b>⭐ 这一讲里那个模式第四次出现了，而这次是以「怎么避免它」的形式出现。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  note("第 4 步：Q 乘 K 的转置 —— 这张表的每一格是什么",640,186,"v");
  matrix({rows:5,cols:5,cw:170,ch:32,x:215,y:196,
    cell:function(i,j){ var h=["","k:a","k:cute","k:teddy","k:is"];
      var q=["","q:a","q:cute","q:teddy","q:is"];
      if(i===0) return h[j]; if(j===0) return q[i];
      return (i===j)?"自己":"·"; },
    hl:function(i,j){return (i===3&&j>0)?"y":"";}});
  note("第 i 行 = 第 i 个 query 对每一个 key 的点积 ⇒ 对这一行做 softmax",640,376,"g");},"<b>这一镜是 Shervine 讲得最细的一段，而它回答的是「那个 n×n 的矩阵到底每一格是什么」。</b><br><b>他的拆解</b>：<b>算 Q 的时候，你把嵌入投到那个空间，得到一个矩阵 —— 其中<u>每一行</u>代表一个 query。</b><b>说 Kᵀ 的时候，是同一个矩阵但转置了 —— 其中<u>每一列</u>代表每个 token 的 key 表示。</b><br><b>⇒ 两者相乘：<u>每一行</u>就代表「这个 query 在每一个 key 上的投影」。</b><b>⇒ 对这一行取 softmax，就得到「这个 query 在各个 key 上的概率分布」。他说：每一行都会有这个。</b><br><b>★★ 把这件事讲到底：那张 n×n 的表，第 i 行第 j 列 = 第 i 个 token 的 query 和第 j 个 token 的 key 的点积。</b><b>⇒ 它量的是「第 i 个 token 问第 j 个 token：你跟我有多相关？」</b><br><b>⭐ 而 softmax 是<u>按行</u>做的，这一点非常关键，很多人会搞错方向</b>：<b>按行做 ⇒ 每一行加起来等于 1 ⇒ 含义是「第 i 个 token 把自己的注意力 100% 分配给各个 token，分别占多少」。</b><b>⚠ 如果按列做，含义就完全变了（变成「第 j 个 token 被各方关注的份额」），那不是我们要的。</b><br><b>⇒ 一个自查的办法：问「这一行/列加起来等于 1 意味着什么」，哪个说得通就是哪个方向。</b><br><b>⭐ 顺带：对角线那一格是 token 和自己的点积。它<u>不</u>被排除 —— 一个 token 当然可以主要关注自己，而且实践中经常如此。</b>");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  says("94:23","this is why you divide by square root of the dimension of keys");
  setEq("$$\\mathrm{softmax}\\!\\left(\\frac{QK^{\\top}}{\\sqrt{d_k}}\\right)V$$");
  note("点积会随着 key/query 的维度变大而变大",640,196,"y");
  note("⇒ 要把它归一化，所以除以「key 维度的平方根」",640,228,"g");
  note("⚠ 为什么必须是 d_k？因为点积强制了 d_q = d_k",640,260,"d");},"<b>那个 √d_k 的理由，Shervine 专门停下来讲了，而且他的切入点是「有没有人问过为什么」。</b><br><b>他的解释分两步</b>：<b>第一步是记号上的 —— 为什么是 d_k 而不是 d_q？因为矩阵乘法、也就是这里的点积，<u>强制</u>了 d_q 等于 d_k。所以写哪个都一样。</b><br><b>第二步是实质的</b>：<b>你会看到，随着 key 和 query 的维度变大，这些点积<u>也会跟着变大</u>。所以你想把这些点积归一化 —— 这就是为什么你要除以 key 维度的平方根。</b><br><b>⭐ 把机制补全（讲者没推，但这是标准论证）：点积是 d_k 个乘积项之和。</b><b>如果各维大致独立、方差相近，那么和的<u>方差</u>随 d_k 线性增长 ⇒ 标准差随 <u>√d_k</u> 增长。</b><b>⇒ 所以除以 √d_k 正好把尺度拉回来。</b><br><b>★★ 为什么尺度要紧？因为后面紧跟 softmax。</b><b>softmax 对输入的<u>尺度</u>极其敏感：输入都放大 10 倍，softmax 会变得非常尖锐 —— 几乎变成「只选最大的那一个」。</b><b>⇒ 一旦变得极尖，梯度就几乎全是 0（因为输出饱和了），训练就卡住。</b><br><b>⇒ 所以 √d_k 不是为了「数值好看」，是为了<u>保住梯度</u>。</b><br><b>★ 这是本讲第二次出现「一个机制的代价要靠另一个机制补」：用点积当相似度很方便，代价是它的尺度随维度漂移，于是必须显式地除回去。</b><b>⭐ 而它和你课题的接口很直接：任何「分数随规模漂移」的量，在拿去做 softmax、做阈值比较、做置信区间之前，都必须先问一句「它的尺度依赖什么」。</b>");
  SUM(0,30,{h:"QKᵀ 的每一行、按行 softmax、以及 √d_k 的真正理由",k:"Q 的每行是一个 query，Kᵀ 的每列是一个 key ⇒ 第 i 行第 j 列 = 「第 i 个 token 问第 j 个 token 有多相关」。softmax <b>按行</b>做 ⇒ 每行和为 1 = 第 i 个 token 的注意力分配。",m:"点积是 d_k 项之和 ⇒ 方差随 d_k 线性增长、标准差随 √d_k 增长，所以除以 √d_k 把尺度拉回。<b>目的是保住梯度</b>：softmax 对尺度极敏感，输入一大就饱和、梯度归零。",w:"⚠ softmax 方向别搞反：按行和为 1 才是「我的注意力怎么分配」；按列就变成「我被谁关注」，不是要的东西。对角线不排除 —— token 常主要关注自己。",r:"⭐ 直接可用：任何「分数随规模漂移」的量，在拿去做 softmax、阈值比较或置信区间之前，先问「它的尺度依赖什么」。这正是 bandit 置信半径要按维度/样本量缩放的同一件事。"});
  QUIZ(0,30,{t:"除以 √d_k 的真正目的是什么？",o:["让 Q 和 K 的维度相等","让数值更好看、避免溢出","点积的标准差随 √d_k 增长；不除回去，softmax 会因输入过大而饱和、梯度归零","归一化成概率分布"],a:2,w:"Shervine 说点积会随维度变大而变大、所以要归一化。而「为什么尺度要紧」是补的：softmax 对尺度极敏感，一旦变尖就饱和、梯度没了。所以这是为了保住梯度。"});
});
KP("31 · 端到端（下）：FFN、N 层堆叠、解码到 EOS",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("97:48","the hidden layer is of a bigger dimension than input and output");
  boxNode(130,222,300,46,"进：d_model","b");
  boxNode(500,222,300,46,"隐藏层：更「宽」","r");
  boxNode(870,222,300,46,"出：d_model","b");
  link(430,245,500,245); link(800,245,870,245);
  note("⚠ 和 Word2vec 正好相反 —— 那里隐藏层比输入输出「窄」",640,300,"y");
  note("Word2vec 要「压缩」出表示；FFN 要「多给自由度」",640,336,"g");
  note("⇒ 同一个结构，两个相反的意图 —— 看懂意图才知道该宽还是该窄",640,372,"v");},"<b>FFN（前馈层）这一步，Shervine 专门拿它和前面的 Word2vec 做了对比，而这个对比非常值得记。</b><br><b>他说：这里有人问过怎么选隐藏层相对输入输出的维度。前面 Afshine 讲 Word2vec 的时候，隐藏层的维度通常比输入输出<u>小</u>。而在这里，隐藏层的维度比输入输出<u>大</u>。</b><br><b>他给的理由：你希望给模型<u>足够的自由度</u>去学到有用的表示 —— 「这是一种让你学到的特征更复杂的方式」。</b><br><b>★★ 把两个意图并排写出来，这一镜的价值就出来了</b>：<b>Word2vec 的隐藏层<u>窄</u>，因为它要制造瓶颈、<u>迫使</u>模型压缩 ⇒ 目的是学出紧凑的表示。</b><b>FFN 的隐藏层<u>宽</u>，因为它要给模型更多转换空间 ⇒ 目的是增加表达力。</b><br><b>⭐ 结论：「隐藏层该宽还是该窄」没有普遍答案，取决于你要它做什么。</b><b>⚠ 这正是为什么「照抄别人的架构参数」有风险 —— 同一个数字在两种意图下的最优方向是<u>相反</u>的。</b><br><b>⇒ 顺带一个实用信息：标准 Transformer 里 FFN 的隐藏层通常是 d_model 的 4 倍（这个具体倍数讲者没说，是常识补充）。</b><br><b>⚠ 还有一件讲者提过的事值得注意：FFN 是<u>逐位置</u>独立作用的 —— 每个 token 各自过一遍同一个 FFN，token 之间不交互。</b><b>⇒ 所以「token 之间的交互」全部发生在注意力层，FFN 只负责「每个位置自己再加工一下」。这个分工很干净。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("98:43","the last representation of the encoder is what you will feed to the cross-attention of each decoder");
  var i;
  for(i=0;i<4;i++){ boxNode(170,206+i*44,320,38,"encoder 第 "+(4-i)+" 层","g"); }
  for(i=0;i<4;i++){ boxNode(790,206+i*44,320,38,"decoder 第 "+(4-i)+" 层","v"); }
  note("N 层",100,290,"d"); note("N 层",1160,290,"d");
  note("⚠ 只有「最后一层」encoder 的输出被送出去",640,196,"r");
  note("而它被送给「每一个」decoder 层的交叉注意力",640,384,"y");
  link(490,224,790,224); link(490,224,790,268); link(490,224,790,312); link(490,224,790,356);},"<b>堆叠这一步有一个很容易记错的细节，Shervine 说得很明确，值得单独一镜。</b><br><b>他说：你不是只有一个 encoder 模块，你实际上有 N 个（原论文里的大写 N）。decoder 同样是 N 个堆起来。</b><br><b>★★ 而关键是这一句：<u>最后一层</u> encoder 的表示，才是你要喂给<u>每一个</u> decoder 的交叉注意力的东西。</b><br><b>⇒ 两个「每一个 / 只有一个」要分清</b>：<b>送出去的只有<u>最后一层</u> encoder 的输出（不是每层各送自己的）；而它要送给<u>所有</u> decoder 层（不是只送第一层）。</b><br><b>⚠ 为什么容易记错？因为直觉上会想「第 k 层对第 k 层」那样一一对应。但不是 —— encoder 整体先算完，产出一组最终表示，然后 decoder 的每一层都去查<u>同一组</u>表示。</b><br><b>⭐ 这个设计有一个直接的后果，对理解推理效率很有用：源句只需要编码<u>一次</u>。</b><b>⇒ 之后不管解码多少步、decoder 有多少层，查的都是那同一组 K/V。</b><b>⚠ 这正是后来「KV 缓存」这类优化的起点（这一讲没讲，是往后的伏笔）。</b><br><b>⇒ 还有一件事现在能说清了：前面提过 Wo 让注意力模块「进出同维」。<u>正因为同维</u>，这些层才能一层叠一层叠 N 遍 —— 否则维度每过一层就变，没法堆。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("101:17","when you hit the EOS token");
  note("解码是一个「循环」，而且每一轮都把上一轮的输出喂回来",640,190,"v");
  boxNode(60,224,250,44,"① BOS 进去","y");
  boxNode(340,224,250,44,"② 掩码自注意力","b");
  boxNode(620,224,250,44,"③ 交叉注意力","r");
  boxNode(900,224,300,44,"④ FFN → linear → softmax","v");
  link(310,246,340,246); link(590,246,620,246); link(870,246,900,246);
  note("⑤ 得到词表上的一个概率分布 ⇒ 取出下一个词",640,300,"g");
  note("⑥ 把它喂回 decoder，再来一轮 —— 直到吐出 EOS",640,336,"y");
  note("⚠ 这一步「必须」串行：第 k 个词要等第 k−1 个 ⇒ 训练能并行，生成不能",640,380,"r");},"<b>最后一步：解码循环。而这一镜的末尾那条，是整讲最该带走的工程事实之一。</b><br><b>Shervine 把流程走了一遍</b>：<b>① 从 BOS 开始 —— 「相当于告诉模型：嘿，我们要预测下一个词了，开始吧」。</b><b>② 过掩码自注意力。他特意说第一步看不出区别，因为 BOS 只能注意到自己；后面解出更多 token 时差别才显出来。</b><b>③ 过交叉注意力，它拿 encoder 的输出当 K/V，而 Q 来自上一层的输出。</b><b>④ 再过 FFN，让表示更丰富；这一整套做 N 遍。</b><b>⑤ 最后是一个线性投影加 softmax，把「下一个词的预测」变成词表上的概率分布。</b><b>⑥ 取出那个词，把它的嵌入<u>喂回</u> decoder，继续这个过程。</b><br><b>什么时候停？Shervine 把这个问题抛给学生，答案是：碰到 EOS。</b><br><b>★★ 现在说那条最要紧的事：这个循环<u>必须</u>串行。</b><b>⇒ 第 k 个词依赖第 k−1 个词，没法并行。</b><br><b>⚠ 所以要把一件事分清楚，这是很多人混的地方</b>：<b>Transformer 治掉的串行是<u>训练时</u>的串行 —— 训练时整句话都在手上，可以一次性算完所有位置。</b><b>⭐ 而<u>生成时</u>的串行一点没治 —— 它是自回归的本质，不是架构的缺陷。</b><br><b>⇒ 这就解释了一个你肯定注意到的现象：为什么大模型「读」很快而「写」很慢。</b><b>读是一次矩阵乘法，写是一个词一个词地来。后面讲次里一大批优化技术（KV 缓存、投机解码等）全是冲着这一条来的。</b>");
  SUM(0,31,{h:"FFN 更宽、N 层堆叠、以及「生成必须串行」",k:"FFN 的隐藏层比输入输出<b>更宽</b>（与 Word2vec 相反）。encoder/decoder 各堆 N 层；<b>只有最后一层 encoder 的输出</b>被送给<b>每一个</b> decoder 层的交叉注意力。解码循环到 EOS 为止。",m:"Word2vec 窄是要<b>制造瓶颈逼压缩</b>，FFN 宽是要<b>多给自由度</b> —— 同一结构、相反意图。FFN 逐位置独立（token 不交互）⇒ 交互全在注意力层。Wo 保证进出同维，所以能堆 N 层。",w:"⚠⚠ Transformer 治掉的是<b>训练时</b>的串行；<b>生成时</b>的串行一点没治 —— 那是自回归的本质。这解释了「读得快、写得慢」，也是后续一大批优化的靶子。",r:"⭐ 「同一结构、相反意图 ⇒ 最优方向相反」直接提醒：照抄别人的超参有风险，得先问「我要它做什么」。另外源句只编码一次、被反复查 —— 这个「算一次、查多次」的结构值得在你的搜索里照用。"});

    "收一下这一讲。<br><b>★★★ 如果只带走一句话，带走这一句：Transformer 不是被设计出来的，是被一连串具体的失败逼出来的。</b><br><b>把那条链再走一遍，每一环都是「上一环的毛病」</b>：<br><b>① one-hot 的毛病是<span class='k'>任意两个向量都正交</span></b>——于是「相似度」这件事根本无法表达。<b>⇒ 所以要把向量学出来，这就是 Word2vec，而它学的办法是代理任务：真正想要的不是预测结果，是训练过程中顺带长出来的那层权重。</b><br><b>② Word2vec 的毛病是<span class='k'>一个词只有一个向量</span></b>——河岸的 bank 和银行的 bank 共用一个。<b>而且词序完全不进来。⇒ 所以要能按顺序处理的模型，这就是 RNN。</b><br><b>③ RNN 的毛病有三个</b>：<b>整句话的意思全压在一个隐藏状态里（长程依赖）、反向传播要连乘一串因子（梯度消失/爆炸）、而且必须一个一个走（慢）。</b><b>⇒ 注意力冲着第一个病来：在要预测的东西和过去的某一处之间架一条直连。</b><br><b>④ ⭐ 而 2017 年那一步是整条链上最大的一跳</b>：<b>既然直连有用，那干脆把串行<u>全部</u>扔掉，只留直连——所有 token 一次性互相看。</b><b>这一刀同时治了三个病：直连解决长程、一次性解决慢（可以并行、能写成矩阵乘法）。</b><b>⚠ 代价是顺序信息也被扔掉了，所以要用位置编码把它加回来。</b><br><b>⭐ 这里有一个非常值得记住的模式：一个机制的代价，往往要靠另一个机制去补。</b><b>扔掉串行换来了并行，然后补一个位置编码；用 softmax 做软加权换来了可微，然后补一个 √d_k 的缩放。</b><br><b>★★ 最后说一句这一讲和科研的接口，因为这是你看它的理由。</b><b>⭐ 自注意力的骨架是「用一个 query 去和一堆 key 比，按相似度加权地取 value」——这是一个<u>在候选集合上做软选择</u>的通用机制</b>，<b>而「在候选集合上选」正是你那类问题的形状。</b><b>⚠ 区别也很关键：注意力取的是 softmax 加权和（软的、可微的、全部候选都有份），而你的搜索取的是 argmin（硬的、只留一个）。</b><b>⭐ 软硬之差带来两件事：软的可以反向传播、但永远不会真正排除任何候选；硬的能剪掉整片子树、但不可微。</b><b>这条分界线在第 6、7 讲（LLM Reasoning 与 Agentic LLMs）会以「要不要做树搜索」的形式正面出现——那两讲是这门课离你课题最近的地方。</b><br><b>⇒ 下一讲 L2 是 Transformer-Based Models & Tricks：把这个架构拆成只用 encoder、只用 decoder 两种用法，并讲一批实际工程里必备的技巧。</b>");
