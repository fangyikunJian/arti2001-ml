<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>
:root{
  --bg:#080B11; --ink:#F0F4FA; --dim:#93A1B5; --dimmer:#3D4658; --edge:#1B2230;
  --blue:#54A9F7; --yellow:#FFD36E; --green:#5BDDA8; --coral:#FF7C87; --violet:#B48BF5;
  --sans:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
mjx-container{color:inherit!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);margin:auto}
svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}

#eqBox{font-size:clamp(16px,2.5vw,36px);text-align:center;line-height:1.5;max-width:92%;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
#eqBox.off{opacity:0;transform:translateY(13px) scale(.97)}
#eqBox.top{align-self:flex-start;margin-top:4.5vh}

#big{font-family:var(--mono);font-size:clamp(30px,5.6vw,82px);font-weight:500;letter-spacing:-.03em;
  color:var(--yellow);text-shadow:0 0 44px rgba(255,211,110,.3);text-align:center;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
#big.off{opacity:0;transform:scale(.86)}
#big small{display:block;font-family:var(--sans);font-size:.22em;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);text-shadow:none;margin-top:.55em;font-weight:400}

/* caption band — pinned into the lower third, clears the strip, scrolls if long */
#capL{align-items:flex-end;pointer-events:none}
#capL::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46vh;
  background:linear-gradient(to top,var(--bg) 30%,rgba(8,11,17,.72) 62%,transparent);pointer-events:none}
#capWrap{max-width:min(84ch,94%);width:100%;max-height:62vh;overflow-y:auto;margin-bottom:50px;
  display:flex;flex-direction:column;align-items:center;pointer-events:auto;position:relative;z-index:2}
#cap{text-align:center;font-size:clamp(13.5px,1.56vw,22px);font-weight:400;line-height:1.55;
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#cap.off{opacity:0;transform:translateY(12px)}
#cap b{font-weight:600;color:var(--yellow)}
#cap i{font-style:normal;color:var(--blue);font-weight:600}
#cap em{font-style:normal;color:var(--green);font-weight:600}
#cap s{text-decoration:none;color:var(--coral);font-weight:600}
#narr{margin:.7em 0 0;max-width:min(90ch,100%);text-align:left;
  font-size:clamp(12.5px,1.12vw,16px);font-weight:400;line-height:1.72;color:#D9E1ED;
  background:rgba(8,11,17,.86);border:1px solid rgba(46,58,82,.7);border-radius:12px;
  padding:12px 17px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:1}
#narr.off{opacity:0}
#narr[hidden]{display:none}
#narr b{color:#C6D2E2;font-weight:500}
#narr i{font-style:normal;color:var(--blue)}
#narr em{font-style:normal;color:var(--green)}
#narr s{text-decoration:none;color:var(--coral)}

#sum{max-width:min(1200px,94%);width:100%;max-height:90vh;overflow:auto;
  background:rgba(17,23,33,.975);border:1px solid #303D52;border-radius:18px;padding:34px 46px 34px;
  box-shadow:0 28px 74px rgba(0,0,0,.62);
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.3,1)}
#sum.off{opacity:0;transform:translateY(16px) scale(.985)}
#sum[hidden]{display:none}
#sum .sh{font-family:var(--mono);font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--green);margin:0 0 9px}
#sum h3{font-size:clamp(24px,2.7vw,38px);font-weight:800;margin:0 0 26px;letter-spacing:-.02em;line-height:1.25;color:#F6F9FE}
#sum .rows{display:flex;flex-direction:column;gap:15px}
#sum .row{border-left:4px solid #3C4A61;padding:17px 24px;background:rgba(255,255,255,.03);border-radius:0 12px 12px 0}
#sum .rk{font-family:var(--mono);font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:#9EABBE;margin:0 0 8px}
#sum .rv{font-size:clamp(16px,1.45vw,21px);font-weight:400;line-height:1.88;color:#E3EAF5;margin:0}
#sum .rv b{color:#FFFFFF;font-weight:700}
#sum .rv i{font-style:normal;color:#7CC0FF;font-weight:600}
#sum .rv em{font-style:normal;color:#6FE3B4;font-weight:600}
#sum .rv s{text-decoration:none;color:#FF97A0;font-weight:600}
#sum .row.k{border-left-color:var(--green)}
#sum .row.w{border-left-color:var(--coral)}
#sum .row.e{border-left-color:var(--yellow)}
#sum .row.m{border-left-color:var(--blue)}
#sum .row.r{border-left-color:var(--violet)}

#quizL{align-items:center;pointer-events:none}
#quiz{max-width:min(72ch,91%);pointer-events:auto;background:rgba(13,18,26,.95);
  border:1px solid #253044;border-radius:14px;padding:23px 27px;
  transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.3,1)}
#quiz.off{opacity:0;transform:translateY(14px);pointer-events:none}
#quiz[hidden]{display:none}
#quiz .qh{font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--yellow);margin:0 0 10px}
#quiz .qq{font-size:clamp(13.5px,1.5vw,20px);font-weight:600;margin:0 0 15px;line-height:1.45}
#quiz .qo{display:flex;flex-direction:column;gap:7px}
#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;
  color:var(--ink);background:rgba(255,255,255,.045);border:1px solid #2A3546;
  border-radius:8px;padding:10px 15px;cursor:pointer;text-align:left;line-height:1.5;transition:background .2s,border-color .2s}
#quiz button:hover:not(.lk){border-color:var(--blue);background:rgba(84,169,247,.13)}
#quiz button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#quiz button.lk{cursor:default}
#quiz button.ok{border-color:var(--green);background:rgba(91,221,168,.15);color:var(--green)}
#quiz button.no{border-color:var(--coral);background:rgba(255,124,135,.13);color:var(--coral)}
#quiz button.off2{opacity:.32}
#quiz .why{margin:15px 0 0;font-size:clamp(11.5px,1.15vw,15px);font-weight:300;color:#93A1B5;line-height:1.7;border-top:1px solid #1E2634;padding-top:12px}
#quiz .why[hidden]{display:none}
#quiz .why b{color:#C6D2E2;font-weight:500}
#quiz .why em{font-style:normal;color:var(--green)}
#quiz .why s{text-decoration:none;color:var(--coral)}
#quiz .why i{font-style:normal;color:var(--blue)}

#titleL{flex-direction:column}
#titleL h1{font-size:clamp(25px,4.7vw,68px);font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.07;text-align:center;text-shadow:0 0 70px rgba(84,169,247,.25)}
#titleL p{font-size:clamp(12px,1.32vw,18px);color:var(--dim);font-weight:300;margin:2vh 0 0;letter-spacing:.05em;text-align:center;max-width:62ch}
#titleL .act{font-family:var(--mono);font-size:clamp(11px,1.18vw,15px);color:var(--blue);letter-spacing:.28em;margin:0 0 2.2vh;text-transform:uppercase}
#titleL .rule{width:60px;height:2px;background:var(--blue);margin:3.2vh auto 0;box-shadow:0 0 18px rgba(84,169,247,.7)}
.fade{transition:opacity .6s ease;display:flex;flex-direction:column;align-items:center}
.fade.off{opacity:0}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}
.tok.hl{color:var(--yellow);text-shadow:0 0 24px rgba(255,211,110,.5)}
.tok.res{color:var(--green);text-shadow:0 0 24px rgba(91,221,168,.45)}
.tok.ded{color:var(--coral);opacity:.5}

#strip{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:6}
#kps{display:flex;gap:3px;flex:1}
.kpbar{display:flex;gap:2px;flex:1;position:relative;cursor:pointer}
.pip{height:2px;flex:1;background:var(--edge);border-radius:2px;transition:background .4s}
.pip.seen{background:#2E3B50}
.pip.now{background:var(--blue);box-shadow:0 0 9px rgba(84,169,247,.85)}
.pip.sum{background:#1D3A30} .pip.sum.seen{background:#2C5C4A}
.pip.quiz{background:#3A3218} .pip.quiz.seen{background:#5C4E22}
.kplbl{position:absolute;top:-15px;left:0;font-family:var(--mono);font-size:8px;color:var(--dimmer);letter-spacing:.06em;white-space:nowrap;transition:color .3s}
.kpbar.active .kplbl{color:var(--blue)}
#hint{font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#tc{position:fixed;top:18px;left:20px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.1em;text-decoration:none;pointer-events:auto}
#tc:hover{color:var(--blue)}
#tc[hidden]{display:none}
#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}
.navbtn{position:fixed;top:0;bottom:44px;width:14%;background:none;border:0;cursor:pointer;opacity:0;z-index:4}
#prev{left:0} #next{right:0}
.navbtn:focus-visible{opacity:1;outline:2px solid var(--blue);outline-offset:-6px}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}
.pt{fill:var(--ink)}
.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}
.box.r{stroke:var(--coral)} .box.v{stroke:var(--violet)}
.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}
.cellbg.hl3{fill:#3A1A1E;stroke:var(--coral);stroke-width:1.6}
.celltx{font-family:var(--mono);font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.celltx.d{fill:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* fix: 面板 .off 立即不可见 */
#big.off,#cap.off,#eqBox.off,#titleBox.off,#sum.off,#quiz.off{visibility:hidden}
</style>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("15:23","But you also have two key metrics, which I am just going to remind");

  boxNode(690,214,520,44,"recall（召回率）","b");

  note("★ 记法：precision 的分母是「你说是的」，recall 的分母是「真的是的」",640,364,"y");},"<b>两个指标的定义，我建议你直接按讲者的句式记，因为那个句式本身就把分母说清楚了。</b><br><b>precision（精确率）</b>：<b><u>在你做出的所有正例预测里，哪些是正确的？</u></b><br><b>recall（召回率）</b>：<b><u>在所有真实的标签里，你正确地把多少个预测成了正例？</u></b><br><b>★★ 这两句的差别全在<u>分母</u>上，而这正是记住它们的窍门</b>：<b><u>precision 的分母是「你说是的那些」；recall 的分母是「真的是的那些」</u>。</b><br><b>⇒ 由此可以直接推出两者各自会被什么「作弊」策略骗到</b>：<b>① <u>想要 precision 高？只在最有把握的那一个上说「是」</u> —— 分母只有 1，很容易全对；② <u>想要 recall 高？全都说「是」</u> —— 分母是全部真正例，而你一个没漏。</b><br><b>★ 所以它们必须成对看，<u>单看任何一个都能被轻易操纵</u>。这也正是下一镜 F1 存在的理由。</b><br><b>⇒ 而 L7 里那条「第一阶段的指标必须是 recall」现在就能理解了：<u>检索的第一级宁可多留（牺牲 precision），也绝不能漏（保住 recall），因为漏掉的后面永远找不回来</u>。</b>");
  S(0,function(){clearScene();setBig(null);setCap(null);noTitle();
  setEq("$$F_1=2\\cdot\\frac{\\mathrm{precision}\\cdot\\mathrm{recall}}{\\mathrm{precision}+\\mathrm{recall}}$$");

  note("F1：取 precision 和 recall 的「调和平均」，合成一个数",640,198,"d");

  note("⇒ 一个 1.0、一个 0.0 ⇒ 算术平均 0.5，而 F1 = 0",640,258,"g");},"<b>把两个指标合成一个数，用的是调和平均 —— 而「为什么是调和平均」值得想清楚。</b><br><b>讲者的话</b>：<b><u>而你有这个叫 F1 分数的指标，它基本上取 precision 和 recall 的调和平均，好给你一个数</u>。</b><br><b>★★ 为什么是调和平均？因为<u>它偏袒小的那一个</u>。</b><b>⇒ 用极端情形一验就明白：<u>precision = 1.0、recall = 0.0 时，算术平均是 0.5（看起来还行），而 F1 = 2×(1×0)/(1+0) = 0</u>。</b><br><b>⇒ 这正是我们要的行为：<u>上一镜说过，precision 和 recall 各自都能被作弊策略单独做高</u>。</b><b>「只在最有把握的那个上说是」能把 precision 做到 1.0，但 recall 会趴在地上；「全都说是」能把 recall 做到 1.0，但 precision 会很低。</b><b>★ <u>调和平均让这两种作弊都拿不到分</u> —— 你必须两个都不差。</b><br><b>⚠ 一个推论值得记：<u>任何时候你想把多个指标合成一个数，都要先问「我希望它惩罚短板，还是允许长板补短板？」</u></b><b>要惩罚短板就用调和平均（或取最小值），允许互补才用算术平均。<u>选错了，优化出来的东西会往你没想到的方向跑</u>。</b>");
  SUM(0,9,{h:"分类桶：数据集与四个指标",k:"例子：<b>「this teddy bear is so cute」⇒ 正面情感</b>（⭐ 泰迪熊第一次出场，会贯穿九讲）。数据集：IMDb 影评、Amazon 商品评论、X（原推特）帖。",m:"指标：<b>accuracy</b>（正确预测占全部的百分比）、<b>precision</b>（在你做出的所有正例预测里有哪些是对的）、<b>recall</b>（在所有真实标签里你正确预测成正例的有多少）、<b>F1</b>（两者的<b>调和平均</b>）。",w:"★ 记法：<b>precision 的分母是「你说是的」，recall 的分母是「真的是的」</b>。由此可推出各自的作弊方式：只在最有把握的一个上说是 ⇒ precision 高；全都说是 ⇒ recall 高。⇒ 所以必须成对看，而 <b>F1 用调和平均正是为了让这两种作弊都拿不到分</b>（1.0 与 0.0 时算术平均 0.5，F1 = 0）。",r:"⚠ 一条可带走的判断：<b>把多个指标合成一个数之前，先问「我要惩罚短板，还是允许长板补短板？」</b> 惩罚短板用调和平均或取最小值，允许互补才用算术平均 —— 选错了，优化出来的东西会往你没想到的方向跑。⇒ 另外 recall 在 L7 会变成关键：检索第一级宁可多留也绝不能漏。"});
  QUIZ(0,9,{t:"F1 为什么用调和平均而不是算术平均？",o:["计算更快","因为两个指标量纲不同","调和平均偏袒小的那个：precision=1.0、recall=0.0 时算术平均是 0.5，而 F1=0 ⇒ 让两种单独作弊都拿不到分","为了让结果落在 0 到 1 之间"],a:2,w:"★ 推论：把多个指标合成一个数之前，先问「我要惩罚短板还是允许互补」。惩罚短板用调和平均或最小值，允许互补才用算术平均。"});

  note("⇒ 这么做的好处：能看出模型是「哪一类实体」做不好",640,386,"y");},"<b>讲者把「实体类型级」这个说法展开了一句，而这一句包含了一个很实用的做法。</b><br><b>他的话</b>：<b>「<u>我的意思是：假设你有一个类别，比如说「地点」。而你想知道你在那个类别里的词预测得有多好。那你通常就会把这些指标按那个类别来聚合</u>。」</b><br><b>★★ 这个做法的价值在于<u>它把一个总分拆成了可诊断的几个分</u></b>：<b>一个 0.82 的总体 F1 不告诉你任何可以行动的东西；<u>而「地点 0.95 / 人名 0.88 / 组织 0.61」立刻告诉你该去修什么</u>。</b><br><b>⇒ 这是一条非常通用的实验习惯：<u>报总分的同时，按你关心的维度拆开报</u>。</b><b>⚠ 而它的反面也很常见：<u>只报一个加权平均，于是某一类上的灾难被别的类掩盖掉了</u> —— 尤其当那一类样本少的时候。</b><br><b>⇒ 后面你会看到这条习惯在这门课里反复出现：<u>L6 修长度膨胀时，证据不是「平均长度下降了」，而是「正确样本长度不变、错误样本长度大降」</u>；<u>L5 讲奖励模型时强调「奖励总是相对某个维度（有用/友好/安全）而言的」</u>。</b><b>⇒ <u>同一个判断，在三讲里换了三种面貌</u>。</b>");
  SUM(0,10,{h:"⚠ 类别不平衡 · 多分类的指标粒度",k:"为什么需要这么多指标？<b>因为类别会非常不平衡</b>（比如 99% 正例、1% 负例）。⚠ 这时 <b>accuracy 会非常误导</b>：一个「全预测成多数类」的模型 accuracy 高达 99%，看起来了不起，但它对少数类的 recall 是 <b>0</b>。⇒ 所以 precision 和 recall 才真正起作用。",m:"多分类（NER）仍用分类指标，但<b>粒度变了</b>：不在句子级，而在 <b>token 级</b>或<b>实体类型级</b>。实体类型级的做法是：把指标<b>按类别聚合</b>（地点一组、人名一组…）。",w:"⚠ 粒度会显著改变数字：一个三词实体只标对两个词，<b>token 级给 2/3，实体级判全错</b> ⇒ 读别人的 NER 结果要先确认是在哪一级算的。而按类别拆开报的价值是<b>把一个总分变成可诊断的几个分</b>（0.82 的总 F1 没法行动，「地点 0.95 / 人名 0.88 / 组织 0.61」立刻告诉你修什么）。",r:"★ 「<b>报总分的同时按你关心的维度拆开报</b>」是条通用实验习惯，这门课里出现了三次：L6 修长度膨胀的证据是「正确样本长度不变、错误样本大降」而非平均值；L5 强调「奖励总是相对某个维度而言」；这里是按实体类型聚合。⚠ 反面很常见 —— 只报加权平均，某一类上的灾难被掩盖，尤其当那类样本少时。"});
  QUIZ(0,10,{t:"为什么类别不平衡时 accuracy 会误导？",o:["因为 accuracy 计算有误差","一个什么都不学、全预测成多数类的模型，在 99:1 的数据上 accuracy 就有 99%，但它对少数类的 recall 是 0","因为 accuracy 只适用于二分类","因为少数类的标签通常是错的"],a:1,w:"⇒ 正确做法是先看数据的类别分布再决定看哪个指标。⚠ 更隐蔽的版本：有人报了 accuracy 但没告诉你分布 —— 那个数字几乎没有信息量。"});

  SUM(0,16,{h:"子词级：利用词根，代价是序列变长",k:"<b>subword tokenizer</b>：围绕<b>利用词根</b>来做 —— 找出词里能共享的公共词根（bear 和 bears 共享「bear」这个部件）。⇒ 于是相似性是<b>切法本身送的</b>，不用再「想办法让它们的嵌入相似」。",m:"⭐ 而「序列变长」为什么是真代价，讲者专门剧透了：<b>这些模型的复杂度也是序列长度的函数</b> —— token 越多跑得越久。★ 这句剧透会在后面反复兑现：L1 的 QKᵀ 是 n×n（平方级）、L2 的滑动窗口、L3 的 KV 缓存与 MLA、L4 的 FlashAttention、L7 的上下文有限，<b>全都是同一个限制的不同面</b>。",w:"★ 这笔交易为什么划算：<b>序列变长的代价可以靠工程缓解（FlashAttention、KV 缓存），而表示质量与词表规模是切法层面决定、事后补不回来的</b>。⇒ 通用判断：宁可接受一个能靠工程缓解的代价，也不要接受结构上补不回来的缺陷。",r:"⭐ 讲者对每种切法都走三段式（想法 / pro / con），而最值得学的是他在 con 之后<b>会解释「为什么这是个代价」</b> —— 「序列变长」本来听起来不像问题，直到他说「复杂度是序列长度的函数」。⇒ 你写论文的局限性时同理：<b>只写 X 不够，要写「X 会导致什么、在什么规模下开始要命」</b>；反过来，<b>只列局限却不说后果的工作，往往是作者自己也没量过</b>。"});

  note("★ 这个东西叫 OOV —— Out Of Vocabulary（词表之外）",640,386,"y");},"<b>这一条是整个分词段落里最要紧的概念，而讲者是以「我刚才忘了说」的方式补上的。</b><br><b>他的话</b>：<b>「<u>我刚才没提这个，但有一个术语。每当你切完东西，然后在推理时你想做预测，我想你有一个前提条件是：你在训练时见过的那个 token，你需要它在你的训练集里</u>。」</b><br><b>⇒ <u>而问题是：假设在推理时你把文本切成词，再假设你碰到一个训练时没见过的词 —— 你就只能把它标成「未知」。而这个东西叫 OOV，Out Of Vocabulary（词表之外）</u>。</b><br><b>★★ 请把 OOV 的机制想清楚，因为它不只是一个术语</b>：<b><u>模型的输入层是一张查找表：每个 token 对应一行向量。碰到表里没有的 token，就没有向量可查</u>。</b><b>⇒ 于是只能用一个专门的「unknown」槽位 —— <u>而那个槽位里所有不认识的词共用同一个向量</u>。</b><br><b>⇒ 后果很直接：<u>模型对那个词一无所知，而且把它和所有其它不认识的词混为一谈</u>。</b><br><b>⚠ 所以 OOV 不是「少学到一点」，<u>是「这个位置的信息被彻底抹掉了」</u>。这就是为什么降低 OOV 风险是选分词器时的首要考虑。</b>");

  note("⚠ 这个自我更正很说明问题 —— 术语是历史遗留的，而实际单位早就不是「词」了",640,386,"d");},"<b>分词讲完，讲者把下一段的问题摆了出来 —— 而他顺手做的一个自我更正值得留意。</b><br><b>他的交代</b>：<b>「<u>好，那么我们刚才做的是：我们拿了一段输入文本，我们做的是把它切成了一些部分，那些部分基本上就是 token。而为了让我们的模型能理解这些 token，我们需要为它们每一个找到一个表示</u>。」</b><br><b>⇒ <u>所以这里我们要看一下这个。这叫做 word representation（词表示）</u>。</b><br><b>★★ 然后他立刻自我更正</b>：<b>「<u>或者我想，更正确的说法是，它应该叫 token representation（token 表示）</u>。」</b><br><b>⭐ 这个小更正很说明问题，值得你记一下</b>：<b><u>「word embedding」「word representation」这些说法是历史遗留的 —— 它们来自 Word2vec 那个年代，那时候单位确实是「词」</u>。</b><b>⇒ 而今天的实际单位是子词 token，<u>所以严格说「词嵌入」这个词本身就不准确了</u>。</b><br><b>⚠ 这类「名字没跟上实际」的情况在这个领域很多，而它会制造真实的困惑</b>：<b>你后面还会遇到 <u>PPO 里的 old 不是 SFT 模型、r_θ 不是 reward、L 不是要最小化的损失</u> —— 讲者每次都会专门停下来提醒。</b><br><b>⇒ 下一段就从「怎么给 token 一个表示」开始。</b>");
  SUM(0,18,{h:"⚠ OOV 与三种切法的总对照",k:"<b>OOV = Out Of Vocabulary</b>：推理时碰到训练时没见过的 token，只能标成「未知」。⚠ 机制要想清楚：模型输入层是一张查找表，<b>表里没有就没有向量可查</b>，只能用一个 unknown 槽位 —— 而<b>所有不认识的词共用同一个向量</b>。⇒ 所以 OOV 不是「少学到一点」，是<b>这个位置的信息被彻底抹掉</b>。",m:"三档：<b>词级</b> OOV 风险最高、没利用词根；<b>子词级</b> 风险更低但仍可能有、利用了词根、代价是序列更长；<b>字符级</b> 讲者说「你没有这个问题」（因为<b>字符集是封闭的</b>），对拼写和大小写错误鲁棒，但计算慢得多、序列非常长、推理时间高得多。",w:"★★★ 三者其实是<b>同一条轴上的三个点</b>：粒度从粗到细 ⇒ OOV 风险从高到低、单位的意义从强到弱、序列从短到长。<b>没有哪个在所有维度都好，而子词级赢在每个维度都不差</b> —— 这是很典型的工程结论：<b>胜出的往往不是某维度的冠军，而是没有明显短板的那个</b>。",r:"⭐ 讲者在收口时做了个自我更正：「word representation…更正确地说应该叫 <b>token representation</b>」—— 这类<b>名字没跟上实际</b>的情况在这个领域很多（word embedding 来自 Word2vec 年代，而今天的单位是子词），会制造真实困惑。后面还有 <b>PPO 的 old 不是 SFT 模型、r_θ 不是 reward、L 不是要最小化的损失</b>，讲者每次都会专门停下来提醒。"});
  QUIZ(0,18,{t:"OOV 的后果为什么比「少学到一点」严重？",o:["会让 softmax 无法归一化","会让序列长度不一致","会导致程序崩溃","模型输入层是查找表，表里没有就只能用一个 unknown 槽位，而所有不认识的词共用同一个向量 ⇒ 这个位置的信息被彻底抹掉"],a:3,w:"★ 三种切法其实是同一条轴上的三点：切得越细 ⇒ 单位集合越封闭、OOV 越不可能，但单位越没意义、序列越长。子词级赢在没有明显短板。"});
});

});

  note("⇒ 它影响的是你「记住模型过去看到了什么」的能力",640,360,"d");},"<b>讲者主动提出了那个该问的问题，而答案就是 RNN 退场的原因。</b><br><b>他的话</b>：<b>「<u>你今天其实没怎么听说过 RNN 的原因是：它们有一些 pro，但有很多 con。其中一个 con 是：句子的意义基本上全部被封装在这个隐状态里。所以你有这个「长程依赖」的问题，它基本上影响你去「记住」模型过去看到了什么的能力</u>。」</b><br><b>★★ 请把因果链看清楚，它只有两步</b>：<b>① <u>整句话的意义全压在一个固定大小的向量里</u>（第 29 条就指出的那个强假设）；② ⇒ <u>句子越长，早期的信息越容易被挤掉</u>。</b><br><b>⇒ 这就是「<u>长程依赖（long-range dependencies）</u>」这个名字的含义：<u>当一个词要依赖很远之前的某个词时，RNN 做不好</u>。</b><br><b>★ 举个很具体的例子你就明白了：<u>「我在法国长大，……（中间一百个词）……所以我说一口流利的 ____」</u>。</b><b>要填「法语」，<u>模型必须记住一百个词之前的「法国」</u>。</b><b>⇒ 而那条信息要在固定大小的隐状态里<u>被挤压一百次</u>才能到这里。</b><br><b>⇒ 讲者用了引号的「记住」（quote unquote「remember」），这个谨慎是对的：<u>RNN 没有记忆器官，它只有一个被反复覆写的向量</u>。</b>");

  note("★ 而一个你想用来做更新的量如果趋于 0，你基本上就没法做更新了",640,364,"r");},"<b>这是整个机制的落点，而它简单得只需要一点算术直觉。</b><br><b>讲者的话</b>：<b>「<u>它最后变成一堆量的乘积 —— 而如果它大于 1，那它就是爆炸；如果它小于 1，那就是消失。因为如果你把很多小于 1 的东西乘起来，它就直接奔向 0 了。所以我想如果你有一个想用来做更新的东西却趋于 0，你基本上就很难做你的更新了</u>。」</b><br><b>★★ 自己感受一下量级：<u>0.9 的 100 次方 ≈ 0.000027</u>。</b><b>⇒ 也就是说，<u>一百步之前的那个词，收到的梯度只有万分之零点二七</u>。</b><b>它实际上收不到任何有效的更新信号。</b><br><b>⇒ 反方向也一样极端：<u>1.1 的 100 次方 ≈ 13780</u>。梯度爆炸会让训练直接发散。</b><br><b>★★★ 所以问题的本质是：<u>指数</u>。</b><b>只要是连乘，<u>偏离 1 一点点，经过很多步之后就会变成天文数字或者零</u>。<u>而 RNN 的结构决定了它必须连乘</u>。</b><br><b>⚠ 这也解释了为什么 LSTM 只是缓解而非解决：<u>它通过 cell state 提供了一条「乘法更少」的通路，但只要还是递推结构，这个风险就还在</u>。</b><b>⇒ <u>真正解决它的办法是：别再让信息走那么长的路</u> —— 那就是注意力。</b>");

  QUIZ(0,31,{t:"「梯度消失」这个名字的机制是什么？",o:["激活函数饱和导致输出为 0","学习率设得太小","梯度被正则化项抹掉了","反向传播要沿时间链回传，写出来是一串量的乘积 —— 每项小于 1 就奔向 0（0.9 的 100 次方 ≈ 0.000027），于是早期权重得不到有效更新"],a:3,w:"★ 本质是指数：只要连乘，偏离 1 一点点经过很多步就会变成天文数字或零。而真正的解法是别让信息走那么长的路 —— 那就是注意力。"});

  SUM(0,36,{h:"⭐ K 和 V 从哪来：投影，而且是学出来的",k:"学生追问「什么是 value、什么是 key、怎么拿到」。讲者第一句：<b>这些量是学出来的，你不是在把它们定死</b>。⚠ 所以别问「key 字面上代表什么」—— <b>它没有人给的定义</b>（和「学出来的表示没有哪一维有名字」是一回事）。",m:"他给的是<b>解释层面</b>（不是定义层面）的说法：<b>key 在那儿是为了让你弄清哪个和 query 最像；value 是和那个元素关联的实际的值</b>；而加权平均里的权重<b>基本上就是 query 和 key 的点积</b>。⇒ 对照公式：QKᵀ 是点积、softmax 变权重、乘 V 是加权平均 —— <b>公式的每一部分他都用大白话说过了</b>。",w:"★★★ 最后那个关键细节：<b>Q、K、V 都是「投影」出来的，而投影是模型学的</b> —— 三者<b>同源</b>，来自同一份输入表示，只是被 W_q / W_k / W_v 三个不同矩阵变换。⇒ 这正是「<b>self</b>」的字面含义；而 <b>cross-attention</b> 里 Q 来自一个序列、K 和 V 来自另一个，所以是「看别人」。",r:"⭐ 补充（讲者没展开）：<b>为什么非要投影</b>？若直接拿嵌入当 Q/K/V，则 Q 和 K 是同一组向量，<b>每个词和自己的点积最大 ⇒ 每个词主要在关注自己，机制就退化了</b>。有了三个投影，模型才有三个自由度：<b>以什么角度去找 / 以什么角度被找 / 被找到后贡献什么</b>。⇒ 投影是「职责分离」能真正实现的技术前提。"});
  QUIZ(0,36,{t:"Q、K、V 是怎么得到的？",o:["K 和 V 相同，只有 Q 不同","从预训练好的词表里查出来","由同一份输入表示分别乘上三个「学出来的」投影矩阵得到 —— 三者同源，只是被不同矩阵变换过","由人工规则从词性标注得出"],a:2,w:"⭐ 若不投影、直接拿嵌入当 Q/K/V，则 Q 和 K 相同 ⇒ 每个词和自己的点积最大 ⇒ 每个词主要关注自己，机制退化。投影是「职责分离」的技术前提。"});

  note("★ 他们的应用场景就是翻译 —— 所以这个架构天生是为「两种语言」设计的",640,364,"y");},"<b>架构登场，而它的形状直接来自它要解决的那个任务。</b><br><b>讲者的话</b>：<b>「<u>在一个很高的层面上，为了让自注意力机制发生，作者提出了一个由两部分组成的架构：一个 encoder，在左边；一个 decoder，在右边。他们的应用是翻译。所以走 encoder 的是你源语言的输入文本，而走 decoder 的是你正在预测的目标语言</u>。」</b><br><b>★ 这个两段式结构其实你在第 30 条见过：<u>RNN 做生成任务时，也是「先把整个源文本处理完得到 context vector，再拿它解码」</u>。</b><b>⇒ 所以 <u>encoder-decoder 不是 transformer 发明的</u>，transformer 只是把两边的内部从 RNN 换成了注意力。</b><br><b>★★ 高层任务讲者也说了</b>：<b>「<u>高层的想法是：你要通过把输入文本过一遍 encoder，来算出有意义的嵌入。而你想让自注意力机制起作用 —— 意思是你想把每个 token 的表示算成其它 token 的函数</u>。」</b><br><b>⇒ 「<u>每个 token 的表示 = 其它 token 的函数</u>」这句话，是自注意力最精确的一句定义。</b>");

  note("⚠ feedforward 层的作用：让模型再学一种别的投影",640,386,"d");},"<b>encoder 内部只有两样东西，而讲者对 multi-head 给了一句先行解释。</b><br><b>他的话</b>：<b>「<u>你用一个叫 attention layer 的层来做这件事 —— 是 multi-head attention 层，不过 multi-head 只是用不同的方式去做这个计算，好让模型学到不同的表示、不同的投影。但这里的想法是：你会输入你的输入文本，而你输入文本里的所有 token 都会互相 attend（关注）</u>。」</b><br><b>⇒ 具体到例子：<u>「a cute teddy bear is reading」，你要把这段文本里所有 token 的表示，都算成其它 token 的函数</u>。</b><br><b>★ 然后是第二层</b>：<b>「<u>然后你有一个 feedforward 层，它只是让模型学另一种投影。而在你编码过程结束时，你会得到输入句子那些 token 的丰富表示</u>。」</b><br><b>★★ 注意 feedforward 层的定位：<u>讲者两次都说它是「让模型学另一种投影 / 多一些自由度」</u>。</b><b>⇒ 它不像注意力那样有一个清晰的「它在做什么」的故事 —— <u>它就是加算力、加参数、加非线性</u>。</b><b>⇒ 而本讲最后 Shervine 会补一个有意思的细节：<u>FFN 的隐层维度比输入输出「更大」，和 Word2vec 那里正好相反</u>。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 而 decoder 那边的自注意力是「只看左边」的，后面会讲",640,360,"r");},"<b>这一镜把 encoder 在做的事落到那句老例子上。</b><br><b>讲者的话</b>：<b>「<u>所以比如「a cute teddy bear is reading」，你要把这段文本里所有 token 的表示，基本上都算成其它 token 的函数。而你是用 encoder 来做这件事的 —— 这里就是用 multi-head attention</u>。」</b><br><b>★★ 请留意一个这里没被强调、但很要紧的性质：<u>encoder 的自注意力是「全看」的</u>。</b><b>⇒ 算 teddy bear 的表示时，<u>它既看左边的 a、cute，也看右边的 is、reading</u>。</b><br><b>⇒ 这和第 30 条那个 RNN 的局限正好对照：<u>RNN 的隐状态只包含左边</u>，而 encoder 的自注意力两边都看。</b><br><b>⚠ 而这个「全看」在 decoder 那边是<u>不允许</u>的，原因第 37 条会讲（生成时右边还不存在）。</b><br><b>★★ 所以同一个机制（自注意力）在两处有不同的约束，而这个差别后来长成了两条技术路线</b>：<b>⇒ <u>L2 会讲 BERT（双向、全看，擅长理解类任务）和 decoder-only（单向、只看左边，擅长生成）</u>。</b><b>⇒ 它们的分野，<u>就始于这里这个「看不看右边」的选择</u>。</b>");

  note("★ 记法：谁在「提问」谁就是 Q；被查的那一方提供 K 和 V",640,364,"y");},"<b>答案和它的推理方式，讲者说得很清楚。</b><br><b>他的话</b>：<b>「<u>思考的方式是：你在问自己 —— 输入里的哪些词才是要紧的？对吧？所以基本上，给定你的 query，你想知道输入里哪些元素是要紧的。所以这里，这个箭头确实是 query，因为这就是你想弄清楚的那个东西。而 key 和 value 实际上来自 encoder，也就是来自输入序列</u>。」</b><br><b>★★★ 记法很简单，而且通用：<u>谁在「提问」，谁就是 Q；被查询的那一方提供 K 和 V</u>。</b><br><b>⇒ 用这个记法回头看 self-attention：<u>那里提问的和被查的是同一个序列，所以 Q、K、V 同源</u>（第 36 条讲的）。</b><b>⇒ 而 cross-attention 里提问的是 decoder、被查的是 encoder，<u>所以 Q 来自 decoder、K 和 V 来自 encoder</u>。</b><br><b>★ 这个结构在 L7 还会以另一个面貌出现：<u>RAG 的检索里，query 是用户的问题、而文档库提供「被查的那一面」</u>。</b><b>⇒ 同一个「提问方 vs 被查方」的结构，换了一层皮。</b>");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⇒ 讲者：所以在你要预测的那个 token 的「右边」，是没有东西可看的",640,386,"d");},"<b>第三处注意力，而它的名字 masked（被遮住的）说明了一切。</b><br><b>讲者的话</b>：<b>「<u>然后你有另一个 attention 层，就是这个。那一个在试图弄清楚：你正在解码的那个输出句子里，还有哪些 token 会对预测下一个 token 有用。假设你开始解码，你说了「un ours en peluche」（法语）。要预测下一个词，你基本上想弄清楚：到目前为止已经翻译出来的那些 token 里，哪些会对预测下一个词有用。所以这就是这一层在做的事</u>。」</b><br><b>★★ 名字的由来</b>：<b>「<u>而它被叫做 masked，是因为它只看到目前为止已经翻译出来的那些 token。它不看那些没被翻译的 —— 当然啦，因为它们还没被翻译出来。所以在你试图预测的那个 token 的右边，是没有办法（看到东西）的</u>。」</b><br><b>★★★ 这个限制不是可选的，<u>它是生成任务的逻辑必然</u></b>：<b>⇒ 生成第 5 个词时，第 6、7、8 个词<u>还不存在</u>。</b><b>如果训练时让模型看到它们，<u>那就是作弊</u> —— 模型会学会「抄答案」，而推理时根本没有答案可抄。</b><br><b>⇒ 这个性质在 L3 会有个名字叫<u>因果（causal）</u>，而 L7 的 prompt caching 正是建立在它上面（<u>只看左边 ⇒ 相同前缀必然相同激活</u>）。</b>");

  stack(640,206,[["① encoder 的自注意力：把输入句子表达成「它自己的函数」","g"],["② decoder 的 masked 自注意力：表达成「已解码出来的那些」的函数","y"],["③ cross-attention：表达成「输入里有什么」的函数","b"],["★ 同一个机制，三种「拿什么来表达什么」","v"]],960,34,8);
  note("⇒ 讲者：同一个 attention 层，但它有好几种用法",640,386,"y");},"<b>这是讲者对三处注意力的完整总结，而我认为它是全讲最该记住的一张表。</b><br><b>他的话</b>：<b>「<u>所以在一个很高的层面上，你有这个 attention 层，它在 encoder 里出现、也在 decoder 里出现，但它有好几种用法。这里的 attention 层，目标是「从输入句子算出嵌入，而这些嵌入是它们自己的函数」。然后 decoder 里那些 —— 第一个，masked 自注意力层，目标是「把东西表达成到目前为止已经解码出来的一切的函数」。而第二个，cross-attention 层，试图把东西表达成「输入里见到的东西」的函数</u>。」</b><br><b>★★★ 三句话的句式完全一样，只有「拿什么来表达」不同</b>：<b><u>① 用「输入自己」表达输入；② 用「已解码的部分」表达当前；③ 用「输入」表达当前</u>。</b><br><b>⇒ 这正好回到第 35 条那个定义：<u>注意力就是「用别的东西来表达某个东西」</u>。<u>三处注意力的差别，只在于「别的东西」指的是谁</u>。</b><br><b>★ 而用第 37 条那个记法对一遍，三处的 Q/K/V 来源也就清楚了</b>：<b><u>① Q、K、V 全来自输入；② 全来自已解码部分；③ Q 来自已解码部分，K 和 V 来自输入</u>。</b><br><b>⇒ <u>一个机制，三种接线方式</u>。记住这张表，transformer 的结构你就拿住了。</b>");
  SUM(0,37,{h:"★ encoder + decoder 与三处注意力",k:"架构两部分：<b>encoder</b>（左，走源语言输入，任务是算出有意义的嵌入）+ <b>decoder</b>（右，走目标语言，一个 token 一个地生成）。★ 自注意力最精确的一句定义：<b>把每个 token 的表示算成其它 token 的函数</b>。encoder 内部只有两样：<b>multi-head attention 层 + feedforward 层</b>。",m:"三处注意力各司其职：<b>① encoder 的自注意力</b>（输入里所有 token 互相 attend）；<b>② cross-attention</b> —— 讲者当堂考学生「decoder 那个箭头是 Q/K/V 哪个」，答案是 <b>query</b>（因为那是你想弄清楚的东西），<b>K 和 V 来自 encoder</b>；<b>③ masked self-attention</b> —— 只看已翻译出来的 token。",w:"★★★ 记法：<b>谁在「提问」谁就是 Q，被查的那一方提供 K 和 V</b>。而 masked 的限制<b>不是可选的，是生成任务的逻辑必然</b> —— 生成第 5 个词时第 6、7 个还不存在，训练时让它看到就是作弊（模型会学会抄答案，而推理时没答案可抄）。",r:"⚠ encoder-decoder <b>不是 transformer 发明的</b>：第 30 条里 RNN 做生成也是「先编码成 context vector、再解码」，transformer 只是把两边内部从 RNN 换成注意力。⇒ 而「只看左边」这个性质在 L3 叫<b>因果（causal）</b>，<b>L7 的 prompt caching 正建立在它上面</b>（相同前缀必然相同激活）。另外 FFN 的定位很朴素 —— 讲者两次都说它只是「让模型多些自由度」。"});
  QUIZ(0,37,{t:"cross-attention 里，来自 decoder 的那个箭头是 Q、K 还是 V？",o:["key，因为它要去匹配","三者都来自 decoder","value，因为它提供内容","query —— 因为那是「你想弄清楚的那个东西」（译文下一个词该是什么），而 K 和 V 来自 encoder"],a:3,w:"★★★ 通用记法：谁在「提问」谁就是 Q，被查的那一方提供 K 和 V。这个结构在 L7 的 RAG 检索里会换一层皮再出现。"});
});

  note("⇒ 而 head 这个词，指的就是你用来得到 Q、K、V 的那些「投影矩阵」",640,360,"g");},"<b>最后一个提问，而讲者又一次坦白了自己的疏漏。</b><br><b>他的话</b>：<b>「<u>那是个很好的问题。问题是：head 是什么意思？我想我讲太快了，我把那部分忽略掉了</u>。」</b><br><b>⇒ 他的解释：<u>当你做自注意力计算时，你基本上让 query 和 key 互动，然后取对应的 value。但没有什么能阻止你把这件事做好几次。所以 head 这个词，是给「你用来得到 query、key 和 value 的那些投影矩阵」的名字</u>。</b><br><b>★★ 把它和第 36 条接起来就完全通了</b>：<b>第 36 条说 <u>Q、K、V 是由三个学出来的投影矩阵得到的</u>。</b><b>⇒ 而「<u>多头</u>」就是：<u>不只有一组 (W_q, W_k, W_v)，而是有 h 组</u>。</b><b>每一组各算一次注意力，然后把结果拼起来。</b><br><b>⇒ 讲者说了它的好处：<u>当你有好几个 head 时，你是在允许你的模型学到不同的投影。所以这基本上是给你的模型一个额外的自由度，去学你那些向量之间的不同关联</u>。</b><br><b>★ 记号：<u>通常记作小写 h，表示 head 的数量</u>。</b>");

  SUM(0,38,{h:"⚠ 位置编码 · 端到端流程 · 多头",k:"⚠ 还债：<b>因为是直接链接，transformer 没有顺序感</b>（RNN 一次一个所以有）⇒ 需要 <b>position encodings</b>，作用就一句话：<b>告知这个词在序列里的位置</b>。★★★ 根子是：<b>并行处理和「知道顺序」天然冲突</b> —— 把词打乱送进自注意力，算出来的表示完全一样（注意力是对<b>集合</b>的操作）。",m:"端到端流程：① <b>分词</b> → ② 学 token 嵌入（input embedding）→ ③ 加<b>位置编码</b> → ④ 过 <b>encoder</b>（multi-head attention + FFN）→ ⑤ 过 <b>decoder</b>（masked MHA → cross-attention → FFN）→ ⑥ <b>softmax</b> 猜下一个词（向量长度 = 词表大小）。",w:"<b>head</b>：做自注意力时<b>没有什么能阻止你把这件事做好几次</b> —— head 指的就是你用来得到 Q/K/V 的那些<b>投影矩阵</b>（通常记作小写 h）。好处：<b>允许模型学到不同的投影</b>，是额外的自由度。⭐ 讲者给 CV 背景的人的类比：<b>就像卷积里有多个 filter</b>（同一个想法，不过这里不一样）。",r:"⇒ 位置编码这里没展开（讲者说「今天不讲，但点出来」），最后的走查会提原论文的<b>正弦余弦、逐元素相加</b>，而 <b>L2 会用一整段讲「位置嵌入换了五代」，终点是 RoPE</b>。⚠ 而学生追问「这些投影会不会学成一样」—— 讲者先简短答「不约束，让模型学，实践中会学出不同说法」，<b>完整回答由 Shervine 在最后的走查给出</b>。"});
  QUIZ(0,38,{t:"为什么 transformer 需要位置编码，而 RNN 不需要？",o:["因为 transformer 是「直接链接」、并行处理所有位置，注意力是对集合的操作 —— 把词打乱算出来的表示完全一样；而 RNN 一次一个，顺序天然在里面","因为位置编码能提升精度","因为 RNN 有专门的位置参数","因为 transformer 的序列更长"],a:0,w:"★★★ 根子是：并行处理和「知道顺序」天然冲突。这是 transformer 为了拿到三样好处（记得住、能并行、上下文化）而主动欠下的债。"});
});

  note("⚠ 关键细节：喂给每个 decoder 的，是「最后一个 encoder」的那份表示",640,382,"r");},"<b>堆叠这一步，以及一个容易搞错的连接方式。</b><br><b>Shervine 的话</b>：<b>「<u>而你不是只有一个 encoder 模块 —— 你实际上有 N 个，原论文里是大写的 N。而在这一切的最后，你得到一组编码过的、上下文感知的嵌入。然后这些被编码的嵌入，会是那些被喂给 N 个 decoder 的东西。所以你有一串堆叠的 N 个 encoder，你有一串堆叠的 N 个 decoder</u>。」</b><br><b>★★★ 而最关键的那个细节是</b>：<b>「<u>而 encoder 的最后那个表示，就是你会喂给每一个 decoder 的 cross-attention 的东西</u>。」</b><br><b>⇒ 请把这个连接方式想清楚，因为它很容易被想错：<u>不是「第 1 个 encoder 接第 1 个 decoder、第 2 个接第 2 个」</u>。</b><b>⇒ 而是：<u>N 个 encoder 先串着跑完，得到一份最终表示；然后这一份表示被送给每一个 decoder 层的 cross-attention</u>。</b><br><b>★ 所以 encoder 和 decoder 的关系是「<u>一对多</u>」的：<u>一份编码结果，被所有解码层共用</u>。</b><b>⇒ 这也意味着 encoder 只需要跑一次，而 decoder 要跑很多次（每生成一个 token 跑一轮）。</b>");

    "收一下这一讲。<br><b>★★★ 如果只带走一句话，带走这一句：Transformer 不是被设计出来的，是被一连串具体的失败逼出来的。</b><br><b>把那条链再走一遍，每一环都是「上一环的毛病」</b>：<br><b>① one-hot 的毛病是<span class='k'>任意两个向量都正交</span></b>——于是「相似度」这件事根本无法表达。<b>⇒ 所以要把向量学出来，这就是 Word2vec，而它学的办法是代理任务：真正想要的不是预测结果，是训练过程中顺带长出来的那层权重。</b><br><b>② Word2vec 的毛病是<span class='k'>一个词只有一个向量</span></b>——河岸的 bank 和银行的 bank 共用一个。<b>而且词序完全不进来。⇒ 所以要能按顺序处理的模型，这就是 RNN。</b><br><b>③ RNN 的毛病有三个</b>：<b>整句话的意思全压在一个隐藏状态里（长程依赖）、反向传播要连乘一串因子（梯度消失/爆炸）、而且必须一个一个走（慢）。</b><b>⇒ 注意力冲着第一个病来：在要预测的东西和过去的某一处之间架一条直连。</b><br><b>④ ⭐ 而 2017 年那一步是整条链上最大的一跳</b>：<b>既然直连有用，那干脆把串行<u>全部</u>扔掉，只留直连——所有 token 一次性互相看。</b><b>这一刀同时治了三个病：直连解决长程、一次性解决慢（可以并行、能写成矩阵乘法）。</b><b>⚠ 代价是顺序信息也被扔掉了，所以要用位置编码把它加回来。</b><br><b>⭐ 这里有一个非常值得记住的模式：一个机制的代价，往往要靠另一个机制去补。</b><b>扔掉串行换来了并行，然后补一个位置编码；用 softmax 做软加权换来了可微，然后补一个 √d_k 的缩放。</b><br><b>★★ 最后说一句这一讲和科研的接口，因为这是你看它的理由。</b><b>⭐ 自注意力的骨架是「用一个 query 去和一堆 key 比，按相似度加权地取 value」——这是一个<u>在候选集合上做软选择</u>的通用机制</b>，<b>而「在候选集合上选」正是你那类问题的形状。</b><b>⚠ 区别也很关键：注意力取的是 softmax 加权和（软的、可微的、全部候选都有份），而你的搜索取的是 argmin（硬的、只留一个）。</b><b>⭐ 软硬之差带来两件事：软的可以反向传播、但永远不会真正排除任何候选；硬的能剪掉整片子树、但不可微。</b><b>这条分界线在第 6、7 讲（LLM Reasoning 与 Agentic LLMs）会以「要不要做树搜索」的形式正面出现——那两讲是这门课离你课题最近的地方。</b><br><b>⇒ 下一讲 L2 是 Transformer-Based Models & Tricks：把这个架构拆成只用 encoder、只用 decoder 两种用法，并讲一批实际工程里必备的技巧。</b>");
