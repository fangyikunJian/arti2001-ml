<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;

/* caption band — pinned into the lower third, clears the strip, scrolls if long */

#quiz button{font-family:var(--sans);font-size:clamp(11.5px,1.2vw,16px);font-weight:300;

#quiz .why[hidden]{display:none}

#quiz .why em{font-style:normal;color:var(--green)}

#titleL{flex-direction:column}

.tok{display:inline-block;white-space:nowrap;padding:0 .06em}

#kbd{position:fixed;top:18px;right:20px;font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.1em}

.axline{stroke:#5C6B86;stroke-width:1.4}
.axlbl{fill:#8491A8;font-family:var(--mono);font-size:13px}

.pt.b{fill:var(--blue)} .pt.r{fill:var(--coral)} .pt.g{fill:var(--green)}
.pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)} .pt.d{fill:var(--dim)}
.pt.a{fill:var(--blue)} .pt.c{fill:var(--green)}
.fit{stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 9px rgba(84,169,247,.5))}
.fit.g{stroke:var(--green);filter:drop-shadow(0 0 9px rgba(91,221,168,.5))}
.fit.r{stroke:var(--coral);filter:drop-shadow(0 0 9px rgba(255,124,135,.5))}
.fit.y{stroke:var(--yellow);filter:drop-shadow(0 0 9px rgba(255,211,110,.5))}
.fit.b{stroke:var(--blue)}
.fit.v{stroke:var(--violet);filter:drop-shadow(0 0 9px rgba(180,139,245,.5))}
.fit.d{stroke:#8491A8;stroke-width:2;filter:none}
.guide{stroke:#55637C;stroke-width:1.4;stroke-dasharray:4 5}
.slbl{font-family:var(--mono);font-size:14px;fill:var(--dim)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}
.slbl.r{fill:var(--coral)} .slbl.v{fill:var(--violet)}
.box{fill:#101724;stroke:#53617A;stroke-width:1.4}
.box.g{stroke:var(--green)} .box.y{stroke:var(--yellow)} .box.b{stroke:var(--blue)}

.link{stroke:#5C6B86;stroke-width:1.6;fill:none}
.cellbg{fill:#101724;stroke:#53617A;stroke-width:1}
.cellbg.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:1.6}
.cellbg.hl2{fill:#0E2A24;stroke:var(--green);stroke-width:1.6}

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class","fit "+(cls||""))
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
function setEq(h,pos){if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}

  var tcEl=document.getElementById("tc");

  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));

    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});

  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;

  SUM(0,1,{h:"⭐ 开场与 L4 / L5 的回顾",k:"开场：<b>「今天要讲一个过去一年左右一直很火的话题：LLM reasoning；而相比上次讲的偏好调优，它其实是一个很好的衔接，因为第 5 讲里用的很多方法，正是这一讲会拿来当基础的那些」</b>。<br>三步回顾：<b>① 预训练「最耗算力」,教「文本的结构、代码的结构」⇒ 结束时模型「只知道怎么自动补全一个序列」; ② SFT 用「一个高质量的、精心策展的数据集，教模型该怎么表现」; ③ 偏好调优 = RLHF，它有两步，「而那一步（RL）今天会有用」</b>。<br>RL 那一边：<b>「policy 不过就是动作上的一个概率分布」; agent ⇒ LLM、action ⇒ 下一个 token、environment ⇒ 它能预测的那堆 token、reward ⇒ 「人类偏好被封装在奖励里」</b>。<br>损失两部分：<b>① 最大化 advantage（「基于那些奖励」、「带一个基线」、为了「降低梯度的方差」）② 别偏离太多（既不偏离「上一次迭代」,也不相比「最初的模型、基座模型」变化太多）—— 理由是「我们的模型已经学了很多、在它做的事情上已经相当能打」</b>。<br>PPO 两变体：<b>PPO-CLIP 裁剪「从一次迭代到下一次的更新」——「那个 R 其实不是奖励，它是比值，这是一个令人困惑的记号」; PPO-KL penalty 用 KL 惩罚「模型变化太多」,而「现代的 RLHF 训练」里 KL 是施加在基座（SFT）模型上的 ⇒ 「典型会有这两个损失的某种混合」</b>。",m:"⭐ <b>「基线」这两个字是这一讲最关键的接口</b>：L5 的基线来自一个单独训练的价值模型，而 <b>GRPO 的全部创新就是换了基线 —— 用「同一个 prompt 采一组回答的平均分」,于是价值模型整个被去掉；名字里的 G 就是 Group</b>。<br>⭐ <b>奖励这个接口没变，变的是背后插什么</b>：L5 是「人类偏好 → 训奖励模型 → 奖励」,L6 是「正确答案 → 程序判定 → 奖励」⇒ RL 那一整套机器完全不用改，<b>它不关心奖励从哪来，只要一个数</b> ⇒ 而程序判定的奖励<b>没有 reward hacking 的空间、不要钱、不要人、可以无限产生</b>。",w:" 两个参照物是 L5 最容易混的地方：<b>π_old（上一次迭代）管「速度上限」⇒ clip；π_ref（SFT 模型）管「位移上限」⇒ KL 惩罚</b>；两个符号也要分清：<b>r(x, y) 是奖励模型给的分（关于「内容」）,R(θ) 是两个策略的概率比值（关于「变化」）</b>，而「旧策略」是<b>上一次 RL 迭代</b>的那个、不是 SFT 模型。<br>⚠ 而「它已经相当能打」这个理由<b>在这一讲里会被重新审视</b>：这一讲要让模型学会一个它原来不太会的行为 ⇒ <b>有些 GRPO 变体干脆把 KL 项去掉了</b>。",r:"⇒ <b>看回顾的详略，能预判这一讲的结构</b>：预训练三句话、SFT 四句话、而偏好调优 + RL + PPO 将近六分钟 —— 讲者花时间复述的，是他接下来真的要用的。<br>⇒ 而「<b>agent</b>」他特意加了引号：<b>L6 讲「想」,L7 讲「做」</b>，今天的宣传常把两者混着说。<br>⇒ 更多（2017 年 PPO 的设计假设为什么在 LLM 上失效、「只知道自动补全」这句话在课上的三次出现、这一讲和你课题的接口）见<b>深度笔记</b>。"});

  SUM(0,2,{h:"⭐ 四个弱点与「推理」的定义",k:"<b>「到现在为止我们看的是 vanilla LLM —— 拿某个东西作为输入，然后就回一个答案」</b>；强项：「懂很多文本的结构、懂很多代码」、debug 时「很擅长找出错在哪」、写文章写诗「真的非常非常好」。<br>四个弱点：<b>① 「有限的推理能力 —— 给它一个复杂的数学题，它可能会在半路上迷失，因为它一直是被训练成『给定一个 prompt，用下一个 token 预测去回应它』⇒ 并没有什么大的理由说它应该能解决复杂的问题」; ② 「在海量的、而且是静态的数据上预训练 ⇒ 知识被绑在截止日期上」; ③ 「全是说，没有做 —— 你想下一个订单，只能自己去做」; ④ 「生成的是自由形式的文本，而旧框架（BLEU / ROUGE）很难评估它们」</b>。<br>范围与目标：<b>「后面三个会是下一讲和第 8 讲的话题；今天的焦点是推理」; 「几乎所有东西不是 2024 年就是 2025 年的，而我们很幸运，因为现在有足够的后见之明」; 「今天的目标是知道推理模型是什么、以及它们怎么训出来」</b>。<br>定义：<b>「其实没有一个公认的定义 —— 我会尽我所能：解决一个问题的能力，而我们典型地需要一个『多步的』推理过程」</b>；两个例子：<b>课程代码（查表）vs 「2020 年出生的熊在 2025 年多大」（演算）</b>。",m:"⭐ 弱点一的根是那个老句式：<b>模型只会它被优化的那件事 —— 推理在 vanilla LLM 里是副产品，不是被优化的目标 ⇒ 这一讲要把它变成一个被直接优化的目标</b>。<br>⭐ 四个弱点对上三讲，<b>整门课的结构就清楚了</b>：<b>推理是「能力」问题（靠训练）⇒ L6；知识过时是「信息」问题（靠检索）、不能行动是「接口」问题（靠工具）⇒ L7；难评估 ⇒ L8</b>。<br>⭐ 而弱点四在推理场景里有一个<b>例外</b>，整讲挂在它上面：<b>数学和代码能被自动判对错 ⇒ 奖励可以程序化 ⇒ RL 可以大规模地跑</b>。",w:" 「多步」这个特征和「让模型多生成 token」这个方案是<b>配套</b>的：一步能答的多想没用，需要多步的才有用。<br>⚠ 而「数学和编程」这个范围限定<b>暴露了一个更深的原因</b>：这两类题不只是「需要多步」,它们还「可以被自动判对错」—— <b>后者才是它们成为训练场的真正理由</b>；讲者说「希望这些能力也能扩散到别的领域」,<b>那是期望不是结论</b>。",r:"⇒ 「<b>没有公认定义</b>」有实际后果：不同论文说「推理提升了」时说的可能不是同一件事 ⇒ <b>读论文第一件事是看它怎么量「推理」</b>。<br>⇒ 「<b>我们很幸运，因为现在有足够的后见之明</b>」很诚实，但也意味着<b>这一讲最容易过期 —— 听的时候分清「这一年的做法」和「不会过期的判断」</b>。<br>⇒ 更多（四个弱点各自的解法细节、「vanilla」这个词的来历、查表 / 演算两种失败模式）见<b>深度笔记</b>。"});
  QUIZ(0,2,{t:"vanilla LLM 的四个弱点分别对应哪几讲？而「推理」的定义里哪一半起作用？",o:["推理 ⇒ L6、知识过时 + 不能行动 ⇒ L7、难评估 ⇒ L8（能力 / 信息 / 接口，三种解法）；而起作用的是第二半「需要多步」—— 它正好解释了「多生成 token 为什么有用」","四个都在 L7；两半都只是修辞","四个都在这一讲解决；定义的第一半「解决问题的能力」起作用","前两个在 L6、后两个在 L9；起作用的是「自由形式输出」那一条"],a:0,w:"⇒ 而弱点四在推理场景里恰好不成立（数学和代码能自动判对错）—— 正是这个例外，让 RL 在推理上异常好用。"});

  SUM(0,3,{h:"⭐ 把 chain of thought 放大",k:"<b>「接下来要看怎么得到一个能应付这类 prompt 的模型 —— 而这里的核心想法，是去借用一个我们这门课前面看过的概念：chain of thought」</b>；学生答：<b>「一步一步地想，而不是只给一个一揽子的答案」</b>。<br>一个追问：<b>「你需要你的 LLM 知道今天是 2025 年 11 月 7 日」⇒ 「典型地 LLM 有一个我们称之为 preamble 的东西 —— 而典型地日期就是我们放在 preamble 里的那种东西」; 「但对另外一些问题，你完全可能有你并不拥有的信息 —— 在第 7 讲我们会看怎么把它取回来；不过今天我们会把它当成推理模型的一个扩展，而不是它们怎么工作的基础」</b>。<br>机制：<b>「chain of thought 做到这一点的方式，是用一些 in-context learning 的示例、在示例里显式地写出推理，来鼓励模型在给出答案之前也那么做」; 「那不是粗略的想法，那就是它背后的想法。而这里我们想做的，是做同一件事，但在一个大得多的尺度上」</b>。<br>两个直觉：<b>①「一个非常难的问题出现在训练集里的机会非常小 ⇒ 让它把这个问题分解成若干可处理的问题，然后依靠它训练时见过的那些模式去解掉」（还用了考试类比：「把它链接回某个你在训练时见过的东西」）; ②「当你让 LLM 生成更多 token 时，你其实只是在给它更多算力 —— 因为在每一个生成步你都有这一整次前向传播」—— 并预告了「compute budget」这个词</b>。<br>收口：<b>「我们不想直接生成一个答案，我们首先想思考 ⇒ 输出就是『推理加上答案』」</b>。",m:"⭐ 核心想法的分量别低估：<b>推理模型的起点不是一个新架构 —— 不是新注意力、不是更多参数、不是更长上下文，而是一个 2022 年的 prompting 技巧；模型、权重、架构都没变，变的只是「输出的形状」</b>。<br>⭐ 两个直觉<b>性质完全不同，必须分开记</b>：<b>分解是「模型见过什么」的论证（启发式）—— 难题整体没见过，但每一小步见过成千上万次；算力是「花了多少 FLOPs」的论证（恒等式）—— 每个输出 token 一整次完整前向传播，N 个 token = N 次 ⇒ 固定大小的模型想多花算力，唯一办法就是多生成 token</b>。<br>⭐ 而「<b>输出 = 推理链 + 答案</b>」这个式子是整个下半场的前提：<b>它使「思考摘要」成为问题、使「思考预算」成为旋钮、使「只奖励答案」成为可能 —— 最后一条是 GRPO 能工作的全部原因</b>。",w:" 「基础」和「扩展」的区分是 L6 与 L7 的分界线：<b>推理是底座、检索是放大器，顺序不能倒 —— 不会推理的模型给它检索也用不好</b>。<br>⚠ 而覆盖率论证解释了 CoT 的<b>边界</b>：<b>多步算术提升巨大，需要「新知识」而不是「新组合」的题没用</b>；「听起来可信」也请留意：<b>模型优化的是「像人会说的话」,不是「对」</b>。",r:"⇒ 「<b>在一个大得多的尺度上</b>」是全片纲领：尺度既指<b>链的长度</b>（几句 → 几千 token）,也指<b>它的来源</b>（prompt 示例 → 模型自己学会）。<br>⇒ 对比 L5 和 L6 的处境差别巨大：<b>L5 输出是自由文本 ⇒ 只能靠人标偏好 ⇒ 训奖励模型 ⇒ 会被 hack；L6 输出末尾是一个可判定的答案 ⇒ 奖励直接算 ⇒ hack 不了</b> —— 这就是为什么 RL 在推理上的成功来得更干脆。<br>⇒ 更多（CoT 原论文、preamble 的工程细节、考试类比的限度、「推理期算力」这条线的来龙去脉）见<b>深度笔记</b>。"});
  QUIZ(0,3,{t:"推理模型的核心想法是什么？而「输出 = 推理链 + 答案」这个式子最重要的后果是哪一个？",o:["换一个新的位置编码；后果是思考摘要可以展示","一个新的注意力机制；后果是上下文变长了","把参数量翻十倍；后果是推理更快了","借 chain of thought（2022 年的 prompting 技巧）然后把它放大 —— 架构都没变，变的是输出的形状；而最重要的后果是「只奖励答案」成为可能：只判答案那一段，奖励就能完全程序化"],a:3,w:"⇒ 这正好绕开了 L5 里「偏好数据贵、奖励模型会被 hack」那一整套麻烦 —— 也是为什么 RL 在推理上的成功，比在对齐上的成功来得更干脆。"});

  SUM(0,4,{h:"⭐ 时间线 · 思考摘要 · 那张账单",k:"时间线：<b>「推理模型开始冒出来」—— 2024-09 o1-preview ⇒ 「你基本上看到所有人都在想 OpenAI 是怎么做到的」⇒ 2024-12 Gemini 2.0 Flash Thinking ⇒ 2025-01 DeepSeek-R1：「做到了和 OpenAI 一样的推理能力，而且是用一个他们真的在论文里描述出来了的方法」⇒ 「这条时间线不是穷举的」; 「它基本上是从 2024 年末才开始的」</b>。<br>怎么认出来：<b>「这里的关键词是 thinking」—— 而「他们把它放得到处都是」; 「那个 thinking 的时间，其实就是产生那条推理链所需要的时间」</b>。<br>思考摘要：<b>「你看到的那个 thought summary 不是原始的推理链 —— 它是它的一个摘要」</b>,三个理由（<b>「我是说，我在做假设」</b>）:<b>① 原始链「不是一个从人的角度完全可理解的东西」② 「你不想读好几页好几页」③ 「如果你有那些推理链，你也许可以训练一个在这些链上训练的模型，让它基本上也能模仿那些能力」—— 而「这将会是我们要看到的东西」</b>。<br>定价：<b>「你其实是按输出 token 收费的 —— 而那些输出 token 也包括推理 token」⇒ 「这也给了一个激励：用最少量的推理 token 拿到最大的推理能力，因为你不想付很多钱 —— 我们后面会看怎么应对那个」</b>。",m:"⭐ 中间那几个月是一个科研上很特殊的局面：<b>「能力已被证明存在、做法未知」—— 它排除了「做不到」却不告诉你路在哪 ⇒ 激励极强，几个月就被破解</b>；而 R1 的重心<b>不在效果，在「把方法写出来了」—— 这门课能讲清「怎么训」就是因为它写出来了</b>。<br>⭐ 第三个理由比前两个重得多：<b>前两个说「给你看也没好处」,第三个说「给你看对我们有坏处」⇒ 一条高质量推理链 = 一条完美的 SFT 样本 ⇒ 原始链不是日志，是最值钱的那份训练数据</b>。<br>⭐ 而定价那一处不对称是必然结果：<b>token 真的被生成了、真的烧了 GPU，而出于第三个理由不能给你看 ⇒ 「付费却看不到」成了唯一可能的安排</b>。",w:" 先把这个事实记住，<b>因为它经常被误解</b>：<b>界面上那几行「我在考虑…」是另一个模型做的摘要，不是模型真的生成的那条链</b>。<br>⚠ 而讲者明确说了「<b>我在做假设</b>」—— 三个理由是推测不是官方声明；<b>他每次给推测都这样标注，而这个习惯值得学</b>。<br>⚠ 「standard / extended」那个开关<b>不是「要不要开更好的模型」,而是「花多少算力买多少准确率」的滑块</b>。",r:"⇒ 「<b>Thinking…</b>」这三个字在做产品设计：<b>把一个技术代价翻译成用户能接受的叙事 —— 「它在认真想」比「它比较慢」好听得多，而两句说的是同一件事</b>。<br>⇒ 而那个被账单逼出来的目标，形状对你的课题应该很熟：<b>「在给定算力预算下最大化解的质量」= 你那个「最便宜可行配置」的搜索；推理模型这边的做法（固定预算、提前停止、按难度分配）几乎可以直接搬</b>。<br>⇒ 更多（o1 黑盒期的行业反应、R1 为什么能改变格局、三个理由各自的证据强度）见<b>深度笔记</b>。"});
  QUIZ(0,4,{t:"DeepSeek-R1 造成「很大声响」的重心在哪？而为什么界面上不给你看原始推理链？",o:["重心是它更便宜；因为原始链会泄露隐私","重心是它参数更多；因为原始链不可理解","重心不在「做得和 o1 一样好」,而在「而且他们真的在论文里把方法描述出来了」；而不给看最硬的理由是第三个：有了原始链就能 SFT 出一个模仿这些能力的模型 —— 它是最值钱的训练数据","重心是它开源了权重；因为原始链太长"],a:2,w:"⇒ 这门课能讲清「推理模型怎么训」就是因为 R1 写出来了 —— 讲者讲不了 o1。而「付费却看不到」是必然结果：token 真的烧了 GPU，但出于第三个理由不能给你看。"});

  SUM(0,5,{h:"⭐ benchmark、可验证，与 pass@k",k:"<b>「这是我们验证一个被生成的回应是不是真的正确的方式」</b> —— 编程三个：<b>HumanEval（「一百多道人手写的编程题」,「所以它才叫 HumanEval」）、CodeForces（竞技编程）、SWE-bench（「真实的、实际的问题」）</b>；数学：<b>「你可以让你的模型连着答案一起生成一条推理链」,做法是「像这样把答案解析出来，然后和某个 ground truth 比较」—— prompt 里强迫它放进 \\boxed{}；两个题库是 GSM8K 和 AIME（「一场为美国数学奥林匹克资格的数学考试」）</b>。<br>指标：<b>「pass@k 按定义是一个试图估计『k 次尝试中至少有一次成功』的概率的指标」; 「这 k 个答案里至少有一个通过测试的概率」; 「你为什么会想要 pass@k？为什么那会说得通？—— 它不是超级平凡的」</b>。<br>辩护与对照：<b>「在编程这种问题里，好处是你可以检查你的答案对不对」; 「Best-of-N 是我们上周看过的那个方法」—— 「你可以把它想成是同一件事，只不过我们没有奖励模型，我们有一个确定性的、可验证的方式去检查某个东西是不是对的」</b>；一个被按住的问题：<b>「你会不会选一个特定的温度？—— 我有一张幻灯讲那个」</b>。",m:"⭐ <b>「有测试用例 ⇒ 能判对错 ⇒ 奖励是个函数 ⇒ RL 能跑」这条链是 GRPO 和 R1 能成立的全部原因</b>：和 L5 一对照差别是结构性的 —— <b>L5「写得好不好」没有程序能判 ⇒ 请人标 ⇒ 训奖励模型 ⇒ 会被 hack；L6「代码对不对」跑一下就知道</b>。<br>⭐ 而<b>边际标注成本是零</b>：题目和答案现成，模型可以对同一道题采样一万次 ⇒ <b>成本是 GPU 时间，而 GPU 时间能靠买卡解决，人工标注不能 —— 这就是「可验证奖励（RLVR）」的全部含义</b>。<br>⭐ pass@k 的三个要素：<b>①「至少一次」②「k 次尝试」③ 它是一个「估计量」—— 第三点最容易忽略，而它正是「不显然」之处</b>。",w:" pass@k 的辩护有一个<b>必要条件</b>：<b>你得能「认出」哪个是对的 —— 编程和数学里你能，换成「写一封好邮件」,100 封里「至少有一封好的」概率当然高但你分不出哪一封 ⇒ 这个高 pass@k 毫无用处</b>。<br>⚠ 而布尔奖励的代价讲者没说：<b>它只说对错、不说差多少 ⇒ 一整条几千 token 的链只换回一个 0 或 1，信号极其稀疏 —— 这正是 GRPO 要解决的问题之一</b>。<br>⚠ 「Human」指题是人原创的，<b>不是人来评</b>；数学那边<b>只比最终答案</b>，过程全错而答案蒙对，奖励和完美回答一样。",r:"⇒ 温度那个问题抓到了要害：<b>温度 = 0 ⇒ k 个答案完全相同 ⇒ pass@k 退化成 pass@1 ⇒ 报 pass@k 必须同时报温度、n 和 k，否则不可比也无法复现</b>。<br>⇒ 「<b>可验证</b>」在两头都给了好处：<b>训练那边奖励能算，部署那边多试几次能筛</b>。<br>⇒ 更多（三个编程 benchmark 的细节与引用情况、\\boxed 解析的实际坑、GSM8K 饱和与 benchmark 轮替、Best-of-N 的延迟论证）见<b>深度笔记</b>。"});
  QUIZ(0,5,{t:"「为什么偏偏是编程和数学」的真正原因是什么？而 pass@k 和 Best-of-N 差在哪？",o:["因为数据最多；而 Best-of-N 要训练权重","因为它们是极少数「机器能判对错」的任务（有测试用例 ⇒ 能判对错 ⇒ 奖励是函数 ⇒ RL 能跑）；而 Best-of-N 用奖励模型挑、pass@k 用确定性验证挑 —— 后者不用标注、不用训、hack 不了","因为它们最难；而两者完全一样","因为题库免费；而 pass@k 只采一个答案"],a:1,w:"⇒ 所以 L5 那个「搜索越强越会骗过代理」的根本困境在这里直接消失了。但代价是布尔奖励信息量少得多 —— 几千 token 只换回一个 0 或 1。"});

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  setEq("$$\\mathrm{pass@}k \\;=\\; 1 \\;-\\; \\mathbb{P}\\big(\\text{k 次尝试全都错}\\big)$$","top");

  note("⚠ 它成立只需要互为补事件 —— 不需要独立性，不需要同分布",640,358,"r");},"<b>第一步是整段推导里唯一的技巧，而它很标准。</b><br>⭐ 为什么「至少有一个」几乎总要取补，是算数量级的：<b>直接算要把「正好 1 个对」「正好 2 个对」…… 加起来，k 项每项一个组合数；取补算只有一种情况、一个式子 —— 答案一样，当然选后者</b>。<br>⚠ 请注意讲者在这里停下来问了一句「<b>你们都知道这个技巧吗</b>」:<b>他在确认地基，而不是直接往上盖 —— 这一讲里他做了至少四次这种确认</b>。接下来三镜要算的就是那个「全都不对」的概率。");

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("40:58","it is basically the same as sampling without replacement",166);
  setEq("$$\\binom{n}{k} \\;=\\; \\frac{n!}{k!\\,(n-k)!}$$","top");
  note("⭐ 讲者给这个结构点了名字 —— 这是整段推导真正的收获",640,318,"y");
  note("⚠ 它有学名（讲者没点）:超几何分布 —— pass@k 就是「取 0 个白球」那个概率的补",640,358,"r");},"<b>讲者给这个结构点了名字，然后引入组合数记号准备化简。</b><br>⭐ 「<b>它基本上就是无放回抽样</b>」—— <b>你不需要记住那个公式，只需要记住「这是从 n 个球里不放回地抓 k 个」,公式随时能从这句话重新推出来</b>。<br>⚠ 而引入组合数纯粹是为了好写：<b>那个 k 项连乘很难看也不好排版，而它恰好能写成两个组合数的比</b>。讲者说「对知道的人来说」然后还是把定义写了出来 —— <b>一个很体贴的处理</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  setEq("$$1-\\frac{(n-c)!}{(n-c-k)!\\,k!}\\cdot\\frac{k!\\,(n-k)!}{n!}$$","top");
  note("⭐ 那个「技巧」只有一句话：分子分母同乘一个 k!",640,318,"y");
  note("⚠ 凑完：左边是 C(n−c, k) ✓，右边是 1 / C(n, k) ✓",640,358,"r");},"<b>先把连乘写成阶乘比，然后用一个技巧凑出组合数。</b><br>⭐ 写成阶乘比只用到一个事实，自己验一遍：<b>(n−c)! = (n−c)(n−c−1)⋯(n−c−k+1) × (n−c−k)! ⇒ 两边同除 (n−c−k)! 剩下的正好是那 k 项连乘</b>；分母同理。<br>⭐ 而那个技巧：<b>他要把 (n−c)!/(n−c−k)! 变成 C(n−c,k) = (n−c)!/[k!(n−c−k)!] ⇒ 分母缺一个 k!，补一个；为了不改数值，同一个 k! 乘到别处</b>。<br>⚠ 「<b>我就当作是同意了</b>」是一个教学决定：<b>时间紧时不等更多确认，而他敢这么做是因为这一步纯粹是代数、没有新概念</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("43:11","I basically multiplied the numerator and the denominator by k factorial",166);
  setEq("$$\\mathrm{pass@}k \\;=\\; 1 \\;-\\; \\frac{\\binom{n-c}{k}}{\\binom{n}{k}}$$","top");
  note("⭐ 用中文读一遍，它一下就自然了：1 减去「挑中的 k 个全是错的」的概率",640,318,"y");
  note("⚠ 边界自己代：c=0 给 0 ✓ ｜ c=n 给 1 ✓ ｜ k=1 给 c/n ✓（就是普通准确率）",640,358,"r");},"<b>结果出来了，而它读起来非常自然。</b><br>⭐ <b>C(n, k) 是「从 n 个答案里挑 k 个一共多少种挑法」,C(n−c, k) 是「只从那 n−c 个错的里挑 k 个有多少种」⇒ 两者之比 = 「挑中的 k 个全是错的」⇒ 1 减它 = 「至少挑中一个对的」= pass@k ✓</b>。<br>⚠ 讲者这里有两处小口误：<b>他说「分子是 (n−k)!」—— 实际上它在那个比的分母上（幻灯写的是对的）；以及他先说「n−c 除以 n」再改口说「n−c choose k 除以 n choose k」—— 前者是 k=1 的特例，他改对了</b>。另外 <b>C(n−c,k) 在 n−c &lt; k 时按惯例是 0</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("44:04","this formula can be a little bit daunting to look at",166);

  note("⭐ 对每一个公式问「它在数什么」—— pass@k 在数：挑 k 个全是错的有多少种挑法",640,322,"y");
  note("⚠ 而 pass@1 和 pass@100 的差距才是最值钱的那个数 —— 它说「还值不值得继续训」",640,362,"r");},"<b>讲者自己把这段推导真正的产出说出来了，然后代了 k=1 这个特例。</b><br>⭐ 请亲手代一遍，<b>这是检验「你是不是真懂那个公式」最快的方式</b>：<b>k=1 ⇒ C(n−c,1)=n−c、C(n,1)=n ⇒ pass@1 = 1 − (n−c)/n = c/n ✓</b>。<br>⚠ 而真正要带走的是那个<b>差距</b>：<b>pass@1 和 pass@100 差距大 ⇒ 模型「会做，但一次做对的概率低」⇒ 采样 / 稳定性问题；差距小而且都低 ⇒ 它真不会 ⇒ 能力问题</b> ⇒ <b>RL 很擅长把第一种变好，对第二种几乎无能为力 —— 所以这个差距是在替你回答「这个模型还值不值得继续训」</b>。");
  SUM(0,6,{h:"⭐ pass@k：它只是无放回抽样",k:"动机：<b>「如果你只做 k 次，你的估计会非常嘈杂」⇒ 「你典型地生成的不是 k 个、而是 n 个答案」</b>。<br>为什么要推：<b>「我想那么做的原因，是因为答案不一定平凡」; 「我不想让你被它长什么样太吓到」</b>。<br>推导：<b>①「如果你有『至少一个』的概率，它就是 1 减去『一个都没有』的概率」; ②「在你有的这 n 个里，你找到一个不成功的尝试的概率是 (n−c)/n」,「而已知这一个，你有另一个不成功的 —— 你有 n−c−1 个其它不成功的，分母是 n−1，因为你已经取掉了一个」; ③「如果你在概率课上见过，它基本上就是无放回抽样」,然后引入 n choose k；④「我做的事情，基本上是把分子和分母同乘以 k!」⇒ 「1 减去 n−c choose k 除以 n choose k。所以这就是我们对 pass@k 的估计」</b>。<br>收口：<b>「这个公式看起来可能有点让人发怵」—— 但「它只是无放回抽样」; 「pass@1 被定义为单次尝试成功的概率」= c/n</b>。",m:"⭐ 整段的动机只有一个词：<b>方差</b> —— 最朴素的估计跑 k 次得到一个 0 或 1，方差大到毫无意义；<b>关键一招是把 n（实际生成多少个）和 k（指标里允许几次）解耦，于是样本是 n 个不是 k 个</b>。<br>⭐ 推导只有一个技巧 + 一段代数：<b>技巧是取补（P(至少一个) = 1 − P(一个都没有)，不需要独立性）；代数是「每次抽完池子和不成功的都少一个」的 k 项连乘，再同乘一个 k! 凑成两个组合数的比</b>。<br>⭐ 而结果用中文读一遍就自然了：<b>1 减去「挑中的 k 个全是错的」的概率 ⇒ 边界 c=0 给 0、c=n 给 1、k=1 给 c/n</b>。",w:" 第一步悄悄做了一个假设：<b>「随机抽一个」= 这 n 个答案等可能被选中 ⇒ 它假设 n 个样本是从同一个分布独立采出来的 ⇒ 必须用同一个温度、同一个 prompt 采，中途改温度这个估计量就不成立</b>。<br>⚠ 而<b>减一不是「独立 × 修正」,它就是条件概率本身</b>；另外<b>混淆 n 和 k 是读这个公式时最常见的错误</b>。<br>⚠ 讲者两处小口误：<b>「分子是 (n−k)!」（实际在分母上）、先说「n−c 除以 n」再改口（前者是 k=1 的特例）</b>。",r:"⇒ 这段推导真正的收获不是公式，是那句「<b>它只是无放回抽样</b>」——<b>对每一个公式问「它在数什么」,一旦能用一句中文说出来，公式就只是那句话的转写</b>；这个分布有学名：<b>超几何分布</b>。<br>⇒ 而最值钱的那个数是 <b>pass@1 和 pass@100 的差距</b>：<b>差距大 ⇒ 采样 / 稳定性问题（RL 很擅长治）；差距小而且都低 ⇒ 能力问题（RL 几乎无能为力）</b>。<br>⇒ 更多（为什么讲者宁可砍别的也要推完、这个习惯在 L5 的两次先例、组合数凑项的每一步代数）见<b>深度笔记</b>。"});
  QUIZ(0,6,{t:"pass@k 推导的关键一招是什么？最后的估计量怎么读？",o:["用独立性假设把它拆成 k 个相同因子；结果是 1 − (1 − c/n)^k","直接枚举所有情况；结果是 C(c,k)/C(n,k)","多跑几次取平均；结果是 c/n","把 n（实际生成多少个）和 k（指标里允许几次）解耦 —— 样本是 n 个所以方差小；而结果 1 − C(n−c,k)/C(n,k) 读作「1 减去『挑中的 k 个全是那 n−c 个错的』的概率」"],a:3,w:"⇒ 而全部的减一只因为一句话：「因为你已经取掉了一个」—— 用的是乘法公式（链式法则），不需要独立性。这个分布有学名：超几何分布。"});

  SUM(0,7,{h:"⭐ 温度与 pass@k · 为什么不走 SFT",k:"温度：<b>「k = 1 时这个公式会大大化简 —— 它就会只是成功尝试的比例」⇒ 回到那个被按住的问题：「一个会影响你结果的东西，是你生成的那些解会有多『多样』,而这确实是一个你用温度来做的事」; 「如果你取一个非常低的温度，你知道你的解会好 —— 但它们不会多样；所以如果你增加样本数，那个量不会变 —— 这在图上 T = 0 那条看得到」; 「如果你把这个温度加得太多，那你会有多样性 —— 但它们也会损害你预测的表现，因为也许那些本来不那么可能的 token 会变得可能」; 「典型的温度选择会是某个不太大也不太小的东西 —— 我相信在这个例子里是 0.8」; 「所以这就是为什么你会在论文里看到：人们总是指明他们选的温度」</b>。<br>别的指标：<b>「consensus@k，就是那个出现次数最多的答案」</b>（还有 accuracy / exact match）。<br>转场：<b>「现在我们要进入这一讲最有意思的部分」—— 怎么「以某种方式激励模型去产生一条推理链」</b>。<br>三张票：<b>①「SFT 的问题是你需要高质量的数据 —— 你会需要把所有这些推理链都写出来；假设你没有，你典型地会从零开始写它们，但那非常难」; ②「模型推理的方式，可能和我们推理的方式不同 —— 也许一条人写的推理，不是教模型怎么推理的最好方式」; ③「这些推理任务有一个非常自然的奖励 —— 而它其实是可验证的：对编程，如果它通过了某些测试用例、如果它能编译；对数学，如果答案和 ground truth 一样」⇒ 「那我们就试试 RL」</b>。",m:"⭐ 温度两端的失败<b>形状完全不同</b>：<b>T=0 是贪心解码 ⇒ k 个答案逐字相同 ⇒ pass@k 退化成 pass@1（曲线是平的）；高温把分布压平 ⇒ 本来 1% 的 token 变 5% ⇒ 而一条几千 token 的链里踩错一步整条就废，伤害是累积的</b> ⇒ <b>两端都坏 = 中间有最优点，这就是「探索 vs 利用」</b>；而<b>最优温度依赖 k，所以不同 T 的曲线会交叉</b>。<br>⭐ 三张票的<b>方向</b>不同：<b>①② 反对 SFT（数据不存在 / 人写的未必最好）,③ 支持 RL（奖励现成且可验证）⇒ 两个关门 + 一个开门 = 一个干净的排除法</b>；而「自然的」是在对比 L5 的「人造奖励」。",w:" 「<b>激励（incentivize）</b>」和「<b>教（teach）</b>」是两件事：<b>教 = 给它看正确答案让它模仿（SFT）；激励 = 给它奖励让它自己发现（RL）—— 讲者的用词已经把答案透露了</b>。<br>⚠ 而三个概念很容易混：<b>pass@k 是指标（要验证器）· consensus@k 是指标（要投票）· self-consistency 是方法（就是投票那件事本身）</b>。<br>⚠ 两张反对票性质不同：<b>第一条说「做不到」,第二条说「就算做到了也不一定好」—— 后者在钱无限时仍然成立</b>。",r:"⇒ 这一段最实用的产出是那条规矩：<b>报 pass@k 必须同时报温度、n 和 k</b> —— 更一般地，<b>一个指标总是带着一组采样超参数，而那组超参数是指标定义的一部分</b>。<br>⇒ 而那个论证形状值得照抄到你的论文里：<b>列出候选方案 ⇒ 给出排除每个方案的具体事实（而不是「它不好」）⇒ 剩下的那个就是答案</b>。<br>⇒ 更多（第二条后来被 R1 怎么证实的、分级奖励与稀疏奖励、self-consistency 的细节、L5 关键词清单）见<b>深度笔记</b>。"});

  SUM(0,8,{h:"⭐ 两个奖励 · 那张曲线 · 思考预算",k:"<b>「我们首先想有一个奖励，去检查那条推理链在不在 —— 你可以通过检查 think 的开始和结束 token 在不在来检查」; 「第二个奖励是检查它产生的那个解是不是真的可行 —— 对代码，检查它对所有用例都可行；对数学，相对于『答案和 ground truth 是否相同』去验证」⇒ 「我们都能很容易地做到：不需要一个模型」; 「随着你执行你的 RL 步，模型在那些 benchmark 上的表现真的在涨 —— 只用这两个可验证的奖励」</b>。<br>思考预算：<b>「并不是所有 prompt 都需要模型想太多 ⇒ 你会看到像 dynamic budget 这样的东西」; 「你可以有一个快速的分类器跑在 prompt 上 —— 但这更像是一个开放问题」; 「这些 LLM 有一个有限的上下文窗口 —— 所以当 LLM 思考时，它也需要意识到还剩多少上下文长度」</b>。<br>budget forcing：<b>「有这个词 budget forcing，我想它是在 S1 那篇论文里被引入的：你会在中途插入一些 token 去强迫它多想 —— 比如说 Wait」; 「有时候模型会输出类似『哦，等一下，等一下，我想我发现了别的东西』」; 「或者：『好，你的时间到了。现在我的答案是』」; 「模型也许在某个别的空间里思考，也许不在语言空间里 ⇒ 让 thinking token 其实不是 token，而是隐藏表示 —— 更有意义，但也更压缩」; 「这非常是一个活跃的研究领域」</b>。<br>takeaway：<b>「如果我们从零开始，我们想用 RL 去激励模型多想」</b>。",m:"⭐ 第一个奖励<b>只查「有没有推理这个动作」,不查「推理对不对」</b>——纯格式奖励：<b>判断推理好不好要一个模型、会被 hack；判断标签在不在只要一个正则 ⇒ 零成本、零噪声、完全确定；而单用它模型会写一对空标签，所以必须两个一起</b>。<br>⭐ 「<b>不需要一个模型</b>」的后果是连锁的：<b>L5 的 RLHF 要养四个模型，其中奖励模型最麻烦（要收数据、要训、会被 hack）⇒ 这里它被一个正则和一次单元测试取代 ⇒ 推理场景不只是「能用 RL」,而是「用 RL 特别便宜」</b>。<br>⭐ 而 takeaway 的<b>前置条件</b>才是重点：<b>「如果我们从零开始」= 我们没有推理链 ⇒ 这不是「RL 比 SFT 好」,而是「没有链的时候只能走 RL」⇒ 有了链之后 SFT 就够了，那就是蒸馏</b>。",w:" 曲线的惊人之处别当成一张普通的上升曲线：<b>没人教过它「怎么推理」、没有一条人写的示范链，只有两个信号 —— 这就是「Zero」的含义（致敬 AlphaGo Zero 的零人类示范）</b>；而 <b>R1-Zero 不是 R1</b>。<br>⚠ 两个约束性质不同：<b>分类器那个是经济问题（该不该多想）,上下文那个是硬限制（还能不能多想）—— 后者没有权衡可谈</b>；而那个分类器有个<b>循环问题</b>：「这道题难不难」本身就需要推理才能判断。<br>⚠ 不要把「<b>aha moment</b>」浪漫化：<b>模型没有「意识到自己错了」,它只是学到了「写出『等一下』后续答对概率更高」—— 被奖励塑造出来的行为模式，不是认知事件</b>。",r:"⇒ 这一讲哪些会过期：<b>不会过期的是那三条框架（输出 = 推理 + 答案 · 可验证 ⇒ 奖励可算 · 更多 token = 更多算力）；会过期的是具体 budget 手法、模型名字、benchmark 分数</b>。<br>⇒ 而「<b>连续思考</b>」是这一讲唯一一条「还没成功」的方向 —— <b>对找课题的人往往比一条成熟的更值钱</b>。<br>⇒ 更多（格式奖励承担了 SFT 的职责、直接优化评测指标的风险、S1 与 Coconut 两篇、过度思考的实例）见<b>深度笔记</b>。"});
  QUIZ(0,8,{t:"「不需要一个模型」指的是不需要哪个模型？而那条 takeaway 的前置条件是什么？",o:["不需要价值模型；前置条件是题目可验证","不需要策略模型；前置条件是算力足够","不需要「奖励模型」—— 它被一个正则和一次单元测试取代了（于是没有 reward hacking、边际成本归零）；而前置条件是「如果我们从零开始」,也就是「我们没有推理链」","不需要参考模型；前置条件是上下文够长"],a:2,w:"⇒ 所以那三张「不做 SFT 的票」只对第一步成立：没有链 ⇒ 用 RL 从零长出能力；有了链 ⇒ 用 SFT 把能力传下去（那就是蒸馏）。"});

KP("9 · ⭐ GRPO：它只改了 advantage 那一处",function(){

  note("⚠ clip 管「速度上限」（对 π_old）· KL 管「位移上限」（对 π_ref）—— 两条并存",640,348,"r");},"<b>他把 L5 那两层「别跑太远」又说了一遍，然后给出这一整块那句关键的话。</b><br>⭐ 这个「<b>只改一处</b>」的结构本身值得学：<b>GRPO 不是一个新框架，它是对一个成熟算法的一处替换 —— 而那一处替换省掉了一整个要训练的模型 ⇒ 改动最小、收益最大、而且你一眼就能看懂改了什么，这是最好的那种论文</b>。<br>⚠ 而那两层约束很容易混：<b>偏离「旧模型」（π_old，上一轮 RL 迭代）由 clip 管；偏离「基础模型」（π_ref，SFT 那个）由 KL 惩罚管 —— 它们并存，不是二选一</b>。从这里开始的几镜是技术核心，请放慢。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("60:50","along with something else that it was training jointly at training time, which was called the value function",166);

  note("⭐ 先把 PPO 那一套回忆完，不然下一镜的对比没有意义",640,222,"y");

  note("⇒ 所以要一个 value function 告诉你「写到这里形势好不好」（功劳分配）",640,372,"g");},"<b>先把 PPO 那一套完整回忆一遍，然后是那个瓶颈。</b><br>⭐ value function 的定义原样记住：<b>输入是一段部分生成（prompt + 写了一半的回答）,输出是「如果按当前策略写完，最终奖励大概是多少」—— 它是一个「预期」的估计器，而 advantage 就是「实际 − 预期」</b>。<br>⚠ 而「<b>联合训练</b>」这四个字是瓶颈的源头，代价算一下：<b>它典型地和策略一样大（比如 7B）,要存参数 + 梯度 + 优化器状态 ⇒ 大致把训练显存翻了一倍；而且它还要调超参、还可能训不稳 —— 它自己就是一个会出问题的模型 ⇒ 去掉它不只是省钱，也去掉了一个误差来源</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("63:02","the big benefit here is that we do not use value functions",166);

  note("⚠ 生成是推理（不存梯度、可并行）,训 value function 是训练（显存好几倍）",640,386,"r");},"<b>好处用一句话说完，而那个交换不是「净赚」,要算清楚。</b><br>⭐ 为什么划算的理由很具体：<b>生成 completion 是「推理」⇒ 不存梯度、可大批量并行、可用量化和 FlashAttention；训一个 value function 是「训练」⇒ 要存梯度和优化器状态 ⇒ 「多生成几条」比「多训一个模型」便宜得多，工程上也简单得多</b>。<br>⚠ 而「<b>我们做的唯一一件事</b>」值得记住：<b>GRPO 的全部实现差异就是「采 g 条，然后减去均值」—— 没有新网络、没有新损失项、没有新超参（除了 g）⇒ 改动小到几十行代码，这就是它被普及得这么快的原因</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⚠ 所以那个「必须学一个估计器」的理由在 LLM 上消失了 —— GRPO 只是注意到了",640,374,"r");},"<b>讲者的回答从一个时间差开始，而这个角度很有启发。</b><br>⭐ 请记下这个思维习惯：<b>一个方法的设计假设来自它被发明时的那个问题，而不是你现在的问题 ⇒ 搬用一个方法之前，先问「它当初是为什么样的问题设计的」</b>。<br>⚠ 而「<b>把奖励放进上下文</b>」这个说法非常准：<b>一个奖励数字本身没有意义 ——「这条回答拿了 1 分」什么也不告诉你，除非你知道「同一道题的其它尝试拿了多少分」⇒ 「上下文」= 同组的其它尝试</b>。这在统计上有标准名字（<b>减去基线以降低方差</b>）,<b>GRPO 的贡献不是提出这个想法，而是「找到一个不用训练就能得到的基线」</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("65:21","if you find a good solution, it's a good solution to a hard problem",166);
  note("⭐ 「难题的好解更值钱」—— 而它是自动实现的",640,196,"y");

  note("问题变了，原方法的假设不再适用",950,328,"g");
  note("⚠ 后者贡献往往更大，因为它需要你先看清「问题变了」这件事",640,374,"r");},"<b>时间差论证的收尾，然后他预告：不懂没关系，马上有一次图示走查。</b><br>⭐ 在走查开始前，先自己把 GRPO 说一遍：<b>① 对一道题采 g 条 completion ② 每条算一个奖励 ③ advantage = 自己的奖励 − 这 g 条的平均 ④ 用它更新策略，clip 和 KL 照旧</b> —— 能说出这四步，下面的流程图就只是在给它配图。<br>⚠ 而讲者在这里还是用「<b>我会那样去想它</b>」这种措辞：<b>他在给一个「理解方式」,而不是在陈述论文里写的动机 —— 和他之前标注「我在做假设」是同一种克制</b>。走查里会补上一个细节：<b>advantage 实际上不只减均值，还除了一个标准差，而他会主动说「那可能不是最好的做法」</b>。");
  SUM(0,9,{h:"⭐ GRPO：只改 advantage 那一处",k:"<b>「它一直是所有这些推理任务的首选 RL 算法」; 「GRPO 代表 group relative policy optimization」</b>。<br>共同点与差别：<b>「有一个关键差别」—— 目标（最大化 advantage）、clip、KL penalty 三样都和 PPO 一样，只有「advantage 怎么算」不同</b>。<br>PPO 那一套：<b>「连同它在训练时联合训练的另一个东西，那个东西叫 value function」; 「你必须把一个 value function 和你的策略联合训练」</b>。<br>GRPO 的办法：<b>「把它和『同一个 prompt 的那些 completion 的奖励的平均值』比较」; 「衡量那个 completion 的奖励和所有其它 completion 的奖励之间的一个『相对度量』」⇒ 「这里的大好处是我们不用 value function 了」</b>。<br>为什么：<b>「传统的 RL 算法都是在所有这些 LLM 成为一件事之前被开发出来的」; 「用那个当成某种基线，把这个奖励『放进上下文』里」; 「如果你找到一个好的解，那是『对一个难问题的』好解」; 「GRPO 是一年前被开发出来的」⇒ 「我们会有一次关于它到底怎么工作的走查」</b>。",m:"⭐ 名字拆开就说完了一半：<b>Policy Optimization 和 PPO 一样、Relative 是「相对某个参照」、Group 是「那个参照是同一个 prompt 的一组 completion」</b>；而 advantage =「实际 − 预期」,<b>「预期」是什么就是两者唯一的分歧点</b>。<br>⭐ 这一招的本质：<b>用「蒙特卡洛当场测」替换「学出来的估计器」—— A_i = r_i − 组内均值</b>；而它<b>在 LLM 上特别合适、在传统 RL 上不行</b>：<b>传统 RL 一个状态只能走一次，LLM 同一个 prompt 可以采样无数次 ⇒ 「重开 g 次」在 LLM 上免费，这就是为什么 GRPO 必须等到 LLM 时代</b>。<br>⭐ 而「难题的好解更值钱」是<b>自动实现</b>的：<b>难题组内平均低 ⇒ 同样答对 advantage 就更大 —— 它是「减去组内均值」的直接后果，不需要任何额外机制</b>。",w:" 那笔交换不是「净赚」:<b>省下一个和策略同等大小的 value function（参数 + 梯度 + 优化器状态 + 调参 + 不稳）,付出每题生成 g 条 ⇒ 它把训练成本换成了推理成本 —— 而这划算，因为生成是推理（不存梯度、可并行）,训 value function 是训练（显存好几倍）</b>。<br>⚠ 两层约束别混：<b>clip 对 π_old 管「速度上限」,KL 对 π_ref 管「位移上限」—— 并存，不是二选一</b>。<br>⚠ 「一组全对或全错 ⇒ advantage 全为 0」<b>既是免费的课程学习，也是一个已知缺点</b>（那一组算力白费，DAPO 专门在修）。",r:"⇒ 请记下这个思维习惯：<b>一个方法的设计假设来自它被发明时的那个问题 —— 搬用之前先问「它当初是为什么样的问题设计的」</b>；而「改进」和「<b>为新问题重新设计</b>」要分开：<b>后者贡献往往更大，因为它需要你先看清「问题变了」这件事</b>。<br>⇒ 「<b>烤进（bake into）</b>」是好设计的标志：<b>你想要的性质是机制的副产品，不是补丁</b>。<br>⇒ 更多（GAE 为什么被整个扔掉、功劳分配、GRPO 名字里每个词的来历、作者动机与讲者诠释的区别）见<b>深度笔记</b>。"});
  QUIZ(0,9,{t:"GRPO 相对 PPO 只改了哪一处？而「难题的好解更值钱」是怎么实现的？",o:["改了 clip 的区间；靠给难题手动加权重","改了 KL 的参照物；靠一个难度分类器","只改了「advantage 怎么算」—— 用「同一 prompt 采 g 条的平均奖励」当基线（蒙特卡洛当场测，替换学出来的估计器）；而「难题更值钱」是「减去组内均值」的自动后果，不需要任何额外机制","改了奖励模型；靠 value function 预测难度"],a:2,w:"⇒ 而这招在 LLM 上才成立：传统 RL 一个状态只能走一次，LLM 同一个 prompt 可以重采无数次 —— 所以 GRPO 必须等到 LLM 时代才被发明。"});

  note("⚠ 前 T−1 格只有 KL 惩罚，只有最后一格带上任务奖励 r —— 任务奖励是稀疏的",640,372,"r");},"<b>PPO 的前三步，差别只在「一条」还是「g 条」—— 而这一步信息量很大。</b><br>⭐ <b>「只采一条」和「必须训一个 value function」是因果关系，不是两个独立的设计选择</b>：<b>没有可比对象 ⇒ 必须从别处得到「预期值」⇒ 那就是 value function 存在的全部理由</b> ⇒ 反过来就是理解 GRPO 的最短路径：<b>采 g 条 ⇒ 有了可比对象 ⇒ 不再需要那个模型 —— GRPO 是「用采样换掉了一个模型」</b>。<br>⚠ 而把 KL 写成「每 token」是一个<b>「不用改算法，只改输入」的实现技巧</b>：<b>它解释了 L5 那个困惑 —— 公式里 KL 写在目标函数里，代码里它在奖励里，两者数学上等价</b>。");

  SUM(0,10,{h:"⭐ 两张流程图与损失的异同",k:"GRPO 五步：<b>「你把它们过一遍那个给你 g 个奖励的奖励模型」; 「他们定义的方式是：奖励减去平均值，再除以那些奖励的标准差」; 「我们当然不想偏离太多」</b>。<br>PPO 同一张图：<b>「你只有一条 completion」; 「只有最后一个 token 带着整条 completion 的奖励」; 「人们是那样实现的，知道一下就好」; 「你可以把它想成某个复杂的公式」（GAE）; 「你用的是这个组计算得出的那些 advantage」</b>。<br>哪些要训：<b>「在推理这个情形里，我们其实并没有在训练一个奖励模型」; 「在 GRPO 的情形里，我们只训练策略模型」</b>。<br>两个损失：<b>「它们看起来很可怕」; 「两者都作用在当前策略的概率和旧策略的概率之比上」; 「这个裁剪函数只是让你不做太大的更新」; 「那个 KL 散度其实是目标函数里显式的一部分」</b>。",m:"⭐ 两张图的差别只在第三步（<b>1 条 vs g 条</b>）,而<b>「只采一条」和「必须训一个 value function」是因果关系</b>：<b>没有可比对象 ⇒ 必须从别处得到「预期值」⇒ 那就是 value function 存在的全部理由 ⇒ 反过来，采 g 条就不再需要它 —— GRPO 是「用采样换掉了一个模型」</b>。<br>⭐ 而「<b>框不等于模型</b>」:<b>冻结 = 只做前向，只占参数显存；要训还要梯度 + 优化器状态（大致是参数的 3 倍）⇒ 两者成本差 4 倍</b> ⇒ 账算出来是：<b>L5 的 RLHF + PPO = 4 个网络（2 个要训）;L6 的推理 + GRPO = 2 个网络 + 1 段代码（1 个要训）—— 最贵的那一项减半</b>。<br>⭐ 两次「关键差别」是同一件事：<b>换 advantage 的算法 = 省掉那个模型</b>。",w:" 「<b>除以标准差</b>」是一张欠条：<b>一组里只有一条对 ⇒ 标准差小 ⇒ advantage 被放大；对错各半 ⇒ 标准差大 ⇒ 反而被压小 ⇒ 恰好和你想要的相反，而后来 Dr. GRPO 把它去掉了</b>。<br>⚠ 两个符号陷阱在这里最容易中招：<b>r_θ 不是奖励，是「新策略 ÷ 旧策略」的概率比；而「old」是上一轮 RL 迭代的策略，SFT 模型叫 π_ref（它在 KL 那一项里）</b>。<br>⚠ 而 <b>GRPO 的 advantage 是「序列级」的</b>（整条共享一个值）,PPO 是 token 级的 —— <b>这是一个真实的精度损失，但实践证明在 LLM 上不要紧</b>。",r:"⇒ KL 位置这个「技术细节」有实际后果：<b>PPO 的 KL 经过 GAE 加权 ⇒ 强度被 λ、γ 影响；GRPO 的 KL 直接以 β 出现 ⇒ 可控可读 ⇒ 读代码时 PPO 去看奖励向量怎么拼的，GRPO 去看损失的最后一项</b>。<br>⇒ clip 是「<b>单边封顶</b>」:<b>不罚你，只是不再奖励你 —— 比惩罚项温和</b>；而它和 KL 管两件事：<b>clip 对 π_old 管速度，KL 对 π_ref 管位移</b>。<br>⇒ 更多（GAE 的 λ 旋钮、per-token 奖励向量的实现、这门课从 L4 到 L6 的同一笔账）见<b>深度笔记</b>。"});
  QUIZ(0,10,{t:"为什么 PPO 必须训一个 value function，而 GRPO 不用？这笔账差多少？",o:["因为 PPO 的损失更复杂；差一点点显存","因为 PPO 只采一条 completion ⇒ 没有可比对象 ⇒ 必须从别处得到「预期值」；而 GRPO 采 g 条就有了可比对象。账是：L5 的 RLHF 4 个网络（2 个要训），L6 是 2 个网络 + 1 段代码（1 个要训）—— 最贵的那一项减半","因为 GRPO 不需要 KL；差一个优化器","因为 PPO 的奖励是 token 级的；差四倍算力"],a:1,w:"⇒ 所以 GRPO 不是「发明了一个新的 advantage」，它是「用采样换掉了一个模型」。而「冻结」和「要训」在成本上差 4 倍（梯度 + Adam 状态大致是参数的 3 倍）。"});

  SUM(0,11,{h:"⭐ 最难的那段 · 长度膨胀的 bug",k:"<b>「第二个不同点是我们怎么计算 advantage 的方式」⇒ 「这非常技术，大概是整门课最难的部分」; 「如果没有人有任何问题，我其实更把这当成一个对我自己的警报」</b>。<br>两句要记的话：<b>「这些算法，它们就是在那儿用来在 RL 阶段调你的模型」; 「GRPO 和 PPO 的差别在于，GRPO 不需要一个 value function —— 它是通过把奖励相对于其它 completion 做比较来算 advantage」⇒ 「如果这说得通，我想这已经是一件很好的事了」; 「我也会建议就去重看录像 —— 这非常重，而且可以说很技术」</b>。<br>长度膨胀：<b>「它已经获得了足够的关注，让我们在这门课上讲它」; 「有一个激励去看看我们能从输出长度这个角度优化什么」; 「LLM 输出的那个答案变得越来越长」; 「你模型的表现倾向于稳定下来，但你的输出长度还在继续增长」</b>。<br>那个公式：<b>「有一个公式我会试着解释」; 「看起来像一个非常复杂的公式」（但其实不是）; 「GRPO 的目标函数是最大化这个量」; 「它们对应于你对组里所有 completion 走一遍那个过程」; 「我只是把那个『1 除以第 i 条输出的长度』换了个位置」</b>。",m:"⭐ 收一次 GRPO：<b>两同（概率比、clip）两异（KL 的位置 —— 技术细节；advantage 怎么算 —— 实质）</b>；而最短的可带走版本是：<b>「PPO 靠学出来的 value function 当基线，GRPO 靠同组采样的均值当基线」</b>。<br>⭐ 长度膨胀前半段是<b>正向</b>的：<b>RL 奖励「答对」⇒ 模型发现多想几步更容易答对 ⇒ 写得更长 ⇒ 真的答对更多 —— RL 自己发现了「更多 token = 更多算力」,没人教它</b>；而分岔点之后是<b>纯亏</b>。<br>⭐ 而原因很反直觉：<b>不是模型学坏了、不是奖励设计错了，而是损失里的内层「除以 |o_i|」—— 它对整条统一打一个 1/长度 的折 ⇒ 长回答里每个 token 的梯度是短回答的 1/50 ⇒ 写得越长，犯错的代价越小</b>。",w:" 为什么这一段<b>确实</b>最难：<b>它要求你同时持有五个来自上一讲、彼此纠缠且各有符号陷阱的概念 —— 难点不在单个概念，而在同时持有五个 ⇒ 这正是「只记差异」最有价值的地方</b>。<br>⚠ 记号陷阱：<b>J 是要最大化的目标、L 才是要最小化的损失，而讲者口头混用 ⇒ 判断方向看式子里 advantage 的符号怎么起作用，别看字母</b>。<br>⚠ 而那个 bug <b>难发现正是因为它不在奖励里，它在损失的分母里</b>；讲者用的词是「<b>缓解</b>」不是「解决」—— 这件事还没有被彻底解决。",r:"⇒ 「没人提问是一个警报」给了你一个自测法：<b>读完一段问自己「我能提出一个关于它的问题吗」—— 提不出就是在跟读</b>；三个该问的：<b>一组全对会学到什么 / g=1 会怎样 / PPO 能不能也用组均值</b>。<br>⇒ 而那个动机链条值得照抄：<b>「我的方法更快」是弱动机，「我的方法让使用者少付钱、少等」是强动机 —— 讲者全程用后者，哪怕他讲的是损失里的一个因子</b>。<br>⇒ 更多（重看为什么有效、三次预警各自对应的难点、两层求和的完整含义）见<b>深度笔记</b>。"});
  QUIZ(0,11,{t:"「表现平了而长度还在涨」的原因是什么？",o:["GRPO 损失内层「除以 |o_i|」对整条回答统一打了一个 1/长度 的折 ⇒ 长回答里每个 token 的梯度是短回答的 1/50 ⇒ 写得越长，犯错的代价越小","模型学坏了，需要降低学习率","奖励设计错了，应该加一个长度惩罚","上下文窗口不够长"],a:0,w:"⇒ 它难发现正是因为它不在奖励里，而在损失的分母里。而修法是把「每条各自除」改成「整组一起除」—— 下一块就讲这个。"});

  note("⭐ 模型被推向「短而对」—— 而这恰好是我们想要的",640,384,"y");},"<b>一句话就把这个 bug 说清了：一个 token 的贡献，取决于它在哪一条回答里。</b><br>⭐ 结构是<b>两项相乘</b>：<b>左边 1/|o_i| 只取决于「这一整条回答有多长」,右边是「token 特定」的 ⇒ 每个 token 的实际贡献 = 它自己的那一项 × 一个「整条共用的折扣」,而折扣大小完全由长度决定</b>。<br>⚠ 请停一下想清楚<b>为什么这本身就不该发生</b>：<b>一个 token 好不好，应该只取决于「它是不是一个好的选择」,而不该取决于「它所在那条回答恰好有多长」—— 这不是一个权衡，是一个纯粹不该有的依赖关系</b>。而答对那一半它是帮我们的 ——<b>问题全在答错的那一半，方向是反的</b>。");

  note("⚠ 同样是答错，写短了罚得更重 ⇒ 模型学会「要错，就错得长一点」",640,384,"r");},"<b>advantage 为负那一半方向是反的，而讲者把同一件事换了三个角度说了三次。</b><br>⭐ 它为什么造成「长度一直涨」,现在完全说得通：<b>训练后期容易的题已经都对了 ⇒ 剩下的大多是答错的 ⇒ 而答错的那些，梯度在推它「写长」⇒ 表现不涨（难题还是答不对）,长度一直涨（错解被推着变长）</b>。<br>⚠ 注意讲者那句自我更正（「所以不是『你想』」）:<b>没有人「想」这样 —— 这不是设计意图，是公式的副作用，而 bug 和设计选择不是一回事</b>；他也标了「人们『假设』的」—— <b>这是被广泛接受的解释，但仍然是一个假设，而下一镜那张图正是那个实验</b>。");

  note("⭐ 两者都消除了「长度依赖」,所以都能解决问题",640,372,"y");},"<b>两种修法，而第一种的实际改动只有一个字母。</b><br>⭐ 「<b>等化（equalize）</b>」这个词说得很准：<b>它不补偿长输出、也不惩罚长输出，只是让每个 token 的权重变得一样 ⇒ 不引入新偏好，只去掉一个旧偏见 —— 最干净的那种修法</b>。<br>⚠ 而 Dr. GRPO 还顺手还了前面那张欠条：<b>它同时把 advantage 里那个「除以标准差」也去掉了 ⇒ Dr. GRPO = GRPO 减去两个归一化项（长度、标准差）</b>。名字是个双关：<b>GRPO Done Right ⇒ 既读「Doctor GRPO」也是首字母 —— 一篇论文敢叫「把 GRPO 做对」,标题本身就是很强的声明</b>。");

  SUM(0,12,{h:"⭐ 那个坏激励与三个修改",k:"<b>「一个 token 相对于目标函数的贡献，取决于它所在的那个输出」; 「我们会想上调这个 token 再次出现的概率」（advantage 为正那一半）⇒ 「这是一个坏的激励」; 「去偏好更长的坏输出，而不是更短的坏输出」—— 而这是「人们假设的」长度一直增长的原因</b>。<br>修法：<b>「有一篇 3 月出来的论文 DAPO —— 它把这个 token 层面的贡献『等化』了，这个归一化因子现在对所有 token 是共同的」; 「还有一篇 GRPO done right —— Dr. GRPO —— 那篇论文提议把那个因子整个去掉」; ⭐ 「被修正过的策略的平均长度低得多」—— 而「正确的样本，长度其实和 GRPO 那个是吻合的」⇒ 「这个调整其实在产生那个意图中的后果」</b>。<br>另两个修改：<b>「那个在 advantage 公式里的标准差 —— 它会在问题的难度方面产生偏差：假设你有一个非常难的问题，你的大部分 completion 会是失败，而所以你的标准差不会超级大」; 「如果你那个 token 的概率非常低，那么只给它一个小的 epsilon 去增长，是有点不公平的 —— 因为这个 epsilon 是『被乘上去』的」⇒ 「你想在下界和上界之间引入一个非对称」</b>。<br>收尾：<b>「所以这是很多」; 「谢谢 Afshine 覆盖了所有难的部分」</b>。",m:"⭐ 这个 bug 的结构是<b>两项相乘</b>:<b>左边 1/|o_i| 只取决于整条回答有多长，右边才是 token 特定的 ⇒ 一个 token 好不好不该取决于它所在那条回答恰好有多长 —— 这不是权衡，是一个不该有的依赖</b>。<br>⭐ 而它只在<b>答错那一半</b>作祟：<b>答对时它把模型推向「短而对」（是好事）;答错时「写短罚得更重」⇒ 模型学会「要错，就错得长一点」⇒ 训练后期剩下的大多是答错的 ⇒ 表现不涨而长度一直涨</b>。<br>⭐ 而最漂亮的证据是那个<b>独有预测</b>:<b>修掉它之后只有「错解」变短、「对解」长度吻合 —— 这是一个「能区分假设」的证据，而不只是「符合假设」的证据</b>。",w:" 三个修改有一个<b>共同形状</b>:<b>① 1/|o_i| 引入长度偏好 ② 除以 std 引入难度偏好 ③ 对称的 ε 压制低概率探索 —— 三个都是「看起来中立的技术细节，实际上塞进了一个你没打算要的偏好」</b>；<b>这是这一讲最值得带走的方法论：每一个归一化、每一个对称假设，都是一个隐含的偏好声明</b>。<br>⚠ 标准差那个偏差的方向要分清：<b>「减去均值」已经做到了「难题的好解更值钱」（对的）,「再除以标准差」又放大了一次（过头了）⇒ Dr. GRPO 保留减均值、去掉除标准差</b>。<br>⚠ 而讲者标了「人们『假设』的」—— <b>这是被广泛接受的解释，但仍然是一个假设</b>。",r:"⇒ 那个<b>诊断闭环</b>值得照着做：<b>① 看到经验现象（两条曲线分岔）② 去损失函数里找机制 ③ 推出一个可检验的预测 ④ 改掉那一项看预测是否成立</b>。<br>⇒ 非对称 clip 两头的理由分开记：<b>上界放宽保探索，下界不能放宽（否则高概率 token 一步掉到接近 0，模型会突然「失忆」）—— DAPO 叫它 Clip-Higher（0.2 / 0.28）</b>。<br>⇒ 上半场五块是一条线：<b>定义 → 度量 → 方法 → 算法 → 修补，正是一篇完整论文的骨架</b>。<br>⇒ 更多（DAPO 四项改动的全貌、Dr. GRPO 的双关、熵坍缩、上半场逐块回顾）见<b>深度笔记</b>。"});

  note("⚠ 所以修法可以预测：把 SFT 加回来，但只用很少量的链 —— 那就是「冷启动数据」",640,384,"r");},"<b>讲者给的解释，而「锚」这个词用得极好。</b><br>⭐ 它说出了 <b>SFT 的第二个作用</b>：<b>第一个作用是教模型「怎么回应」（大家都知道）;第二个是给后面的 RL 一个「合理的原点」—— 而那个原点就是 π_ref，KL 惩罚要求 RL「别离它太远」</b>。<br>⚠ 和 L5 的 KL 连起来整个逻辑就通了：<b>正常 RLHF 里 π_ref 是一个「已经会好好说话」的 SFT 模型 ⇒ KL 把你拉在好区域；R1-Zero 里 π_ref 只会续写互联网文本 ⇒ 而那个区域里本来就包含混语言和语法混乱的文本</b>。「去优化任何它想要的东西」是一个很准确的描述：<b>没有锚的 RL 就是在一个没有边界的空间里优化</b>。");
  SUM(0,13,{h:"⭐ R1-Zero 的配方与两个问题",k:"开场对照：<b>「你接着做你的对齐，它由 SFT 然后 RL 组成」—— 这里说的是常规的 RL，不是推理那种</b>；起点：<b>「他们复用了一个叫 multi-latent attention（MLA）的技巧」,还有 MoE 和 pre-norm ——「所有那些花里胡哨的」</b>。<br>最大胆的一步：<b>「有意思的地方从这里开始」—— SFT 那一格被直接删掉，模型「还没见过任何监督」</b>。<br>配方：<b>「他们激励模型去做的全部事情，就是基于那些输出去提高奖励」; 模板是大白话：「不管你想想什么，就去想，但把它放进 think 框里」,答案包进 answer 块，最后「给模型一个回应的机会」; 「没有任何先前的监督，只是有这些作为奖励，就提高了分数」</b>。<br>两个问题：<b>「全都解决了，这很好，不用 SFT，而我们已经有了可能的最佳表现 ⇒ 嗯，没那么容易」—— 作者看那些推理链时看到了两种问题：混语言、语法上的问题 ⇒ 「它其实没有一个强的监督信号作为背景去『锚定』」</b>。",m:"⭐ <b>两段式</b>请记住：<b>R1-Zero 是科学实验（光靠 RL 行不行）,R1 是工程产品（怎么做得可用）⇒ R1-Zero 的价值不在好用，在它证明了一件事</b>；而这个「先证明、再落地」的结构值得照抄：<b>第一部分让论文有「发现」,第二部分让它有「影响」</b>。<br>⭐ 跳过 SFT <b>不是为了省事</b>：<b>先 SFT 再 RL 你分不清能力是哪一步给的；跳过它，能力就只可能来自 RL ⇒ 结论无可争辩</b>。而它成功说明：<b>「怎么回应」RL 顺带学会了（格式奖励在逼它）,「怎么推理」预训练数据里本来就有 ⇒ RL 是「把它本来就有的能力调出来」</b>。<br>⭐ 而「<b>锚</b>」说出了 SFT 的第二个作用：<b>给 RL 一个合理的原点（π_ref）—— R1-Zero 的 π_ref 只会续写互联网文本，而那个区域里本来就有混语言和破句，所以 KL 不但没拦，它是容许的</b>。",w:" 那两个问题有一个共同点：<b>它们都不影响答对率，只影响「人能不能读」⇒ 这是一个 benchmark 测不出来的问题 —— 你没量的东西，模型不会替你保住</b>。<br>⚠ 而 <b>MoE / MLA 是「前提条件」不是「原因」</b>:<b>推理能力来自 RL，不来自架构 —— 一个普通的稠密模型也能用同样的 RL 长出来</b>。<br>⚠ 「混语言」不是错误：<b>预训练数据是多语言的、而没有任何奖励要求它用一种语言 ⇒ 它是一个在没有约束下的最优行为</b>。",r:"⇒ 模板的设计思路很漂亮：<b>只规定「想的内容放哪里」,不规定想什么怎么想 —— 不规定内容，只划出场地</b>；对你的课题这个思路可以借：<b>你不需要告诉搜索「该怎么剪枝」,只需要给它一个「可以自由尝试并被评分」的结构，然后让奖励塑形</b>。<br>⇒ 而「论文给出了模板的确切内容」是 R1 能被复现的关键之一：<b>算法公开 + 奖励公开 + 模板公开，而 o1 一样都没给</b>。<br>⇒ 更多（R1-Zero 四样配方逐项、格式奖励怎么顶替 SFT、那张曲线在两个论证里的作用）见<b>深度笔记</b>。"});
  QUIZ(0,13,{t:"R1-Zero 为什么要跳过 SFT？而它的推理链出了什么问题、原因是什么？",o:["为了省钱；问题是太长，原因是没有长度惩罚","因为 SFT 会破坏推理；问题是太保守，原因是 KL 太强","不是为了省事：先 SFT 再 RL 就分不清能力是哪一步给的，跳过它结论才无可争辩；而问题是混语言和语法破碎（都不影响答对率，只影响可读性），原因是它没有一个作为背景的「锚」——π_ref 只会续写互联网文本","因为没有 SFT 数据；问题是答案错，原因是奖励太稀疏"],a:2,w:"⇒ 而「锚」这个词说出了 SFT 的第二个作用：它不只教格式，还给后面的 RL 一个合理的原点。R1 的修法就是把 SFT 加回来，但只用很少量的链 —— 那就是「冷启动数据」。"});

KP("14 · ⭐ R1 的四个阶段",function(){
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  note("⭐ R1 从「同一个 V3 base」重新开始 —— 而第一步是一小段 SFT",640,222,"y");

  note("⚠ R1-Zero 被当成「数据生成器」,不是「模型检查点」—— 它的权重有问题，输出有价值",640,374,"r");},"<b>R1-Zero 证完了，现在做产品 —— 而注意起点是一样的。</b><br>⭐ <b>R1 不是「在 R1-Zero 上继续训的」,它是从同一个 V3 base 重新开始的 ⇒ R1-Zero 对 R1 的贡献不是权重，而是它生成的那些推理链</b>（在它上面继续训，混语言和语法乱会被带下去）。<br>⚠ 关键在第二步那个词：「<b>重写</b>」而不是「写」:<b>从零写推理链「非常难」,但「修改一条内容已经正确的链」容易得多 ⇒ R1-Zero 真正的贡献是把「写」这个不可行的任务，变成了「改」这个可行的任务</b>。这个思路今天叫 human-in-the-loop 数据生成，<b>一般性很强</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("97:02","they used humans to rewrite some of these",166);
  says("97:35","it could have been several orders of magnitude less than some of the other stages",192);

  boxNode(80,254,500,50,"被否掉的方案","r");
  boxNode(700,254,500,50,"实际做的","g");
  note("从零写几十万条 —— 不可行",330,328,"r");
  note("改几千条 —— 可行",950,328,"g");
  note("⚠ 几千条就够，因为它的任务不是「教会它推理」,只是「给它一个锚」",640,374,"r");},"<b>这一次不直接上 RL —— 先给它一个锚，而这一步小得出奇。</b><br>⭐ 「<b>冷启动</b>」原本来自推荐系统（新用户什么行为都没有，怎么推荐）;借到这里是：<b>一个基础模型完全不会写推理链，你怎么让 RL 起步 —— 答案一样：先用一点点人工数据把它推过起步门槛</b>。<br>⚠ 这件事对「SFT 还有什么用」给了一个好答案：<b>R1-Zero 证明了「SFT 不是必需的」（能力上）,R1 证明了「SFT 仍然是必要的」（可用性上）—— 两个结论不矛盾：SFT 不负责「会不会推理」,它负责「推得人能不能看」</b>。实用推论：<b>改能力要海量数据或 RL；改格式 / 语言，几百几千条就够</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("98:28","there was something called a language consistency reward",166);
  note("⭐ 第二步 RL —— 而奖励从两个变成三个",640,196,"y");
  boxNode(110,254,250,46,"① 冷启动 SFT","d");
  boxNode(370,254,250,46,"② RL","y");
  boxNode(630,254,250,46,"③ 混合 SFT","d");
  boxNode(890,254,250,46,"④ RL（对齐）","d");
  boxNode(60,316,340,46,"答案对不对","g");
  boxNode(450,316,340,46,"格式对不对","y");
  boxNode(840,316,340,46,"语言一致性（新增）","v");
  note("⚠ 第三个就是「输出链里目标语言 token 的比例」—— 一个数字，不用任何模型",640,380,"r");},"<b>三个奖励，而第三个是专门为那个毛病加的。</b><br>⭐ 分工很清楚：<b>答案奖励管「对不对」（能力）、格式奖励管「有没有按结构写」（结构）、语言一致性管「能不能读」（可读性）—— 而三个都是程序能算的，所以仍然「不需要一个奖励模型」</b>。<br>⚠ 这一处最值得学的是那个<b>工作方法</b>：<b>① 观察到一个具体的失败模式 ② 设计一个最简单能量它的指标 ③ 把那个指标直接加进奖励 ⇒ 你能量的你就能优化，而你不量的它就会漂走</b>。不过也有一笔真实的交易：<b>强制单一语言可能让模型在某些步骤上用一个不那么顺手的表达，从而轻微损失准确率</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("99:15","they mix both reasoning and non-reasoning data",166);
  says("99:42","about 200k pairs",192);
  note("⭐ 第三步又是一次 SFT —— 而它解决的是一个还没被提过的问题",640,222,"y");
  boxNode(110,254,250,46,"① 冷启动 SFT","d");
  boxNode(370,254,250,46,"② RL","d");
  boxNode(630,254,250,46,"③ 混合 SFT","y");
  boxNode(890,254,250,46,"④ RL（对齐）","d");
  boxNode(80,316,260,46,"非推理 20 万","d");
  boxNode(360,316,820,46,"推理 60 万","y");
  note("回收 V3 用过的，边际成本接近零  ｜  新生成的 —— 比例 3 : 1，偏向推理",640,384,"r");},"<b>第三步又是一次 SFT，而讲者没明说它在解什么问题。</b><br>⭐ 问题是：<b>第二步的 RL 只在数学和编程上做，而 RL 会把模型往奖励高的方向推 ⇒ 一个只练做题的模型，问它别的反而变差了 —— 这叫 alignment tax（对齐税）,或者更一般地说就是灾难性遗忘</b> ⇒ 解法就是混数据：<b>推理数据保住刚学到的能力，非推理数据把写作、问答、常识找回来 —— 这一步不是在「提升」,是在「补回」被 RL 挤掉的东西</b>。<br>⚠ 四阶段的节奏是 <b>SFT（窄）→ RL（窄）→ SFT（宽）→ RL（宽）—— 每次 RL 之后跟一次 SFT 拉回来，先专精再拓宽</b>；而 3:1 没有理论依据，<b>是调出来的，但论文给出它别人才能复现</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("100:23","they used the model that had been trained so far to generate a response",166);
  note("⭐ 那 60 万条推理数据从哪来 —— 一个漂亮的自举",640,196,"y");
  boxNode(60,228,280,46,"第二步训出的模型","y");

  note("⚠ 链一旦有了，SFT 就重新可用，而且比 RL 便宜得多",640,348,"r");},"<b>那 60 万条推理数据从哪来 —— 而这里有一个漂亮的自举。</b><br>⭐ 「<b>拒绝采样</b>」在统计里本来是另一个意思，这里是借用：<b>统计上是「从一个易采的分布采样、按比例拒绝」,这里是「从模型采样、按对不对拒绝」—— 共同点是「生成很多，筛掉大部分」,而这正是 Best-of-N 的同一个结构</b>。<br>⚠ 请注意它和前面那三张「不做 SFT 的票」的关系：<b>最重的一张是「没有推理链可用」,而到这一步链已经有了（是前两步造出来的）⇒ SFT 在这里重新变得可用 —— 这正好印证了那个 takeaway 的前置条件：「如果我们从零开始」</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("101:17","they went on to a last stage",166);
  note("⭐ 为什么必须自动评判，以及第四步开场",640,196,"y");
  boxNode(110,254,250,46,"① 冷启动 SFT","d");
  boxNode(370,254,250,46,"② RL","d");
  boxNode(630,254,250,46,"③ 混合 SFT","d");
  boxNode(890,254,250,46,"④ RL（对齐）","y");
  boxNode(80,316,500,46,"要筛 60 万条，人工不可能","y");
  boxNode(700,316,500,46,"第四步其实就是普通的 RLHF","g");
  note("⚠ LLM judge 两个用途：这里筛数据，L8 评测模型 —— 同一个技术",640,380,"r");},"<b>为什么用自动评判，以及第四步开场。</b><br>⭐ 「<b>LLM judge</b>」在这里第一次作为工具出现：<b>拿一个强模型当裁判 —— 这里用来筛数据（一条回答够不够好）,L8 用来评测模型</b>。而「自动」不是偷懒：<b>人工审 60 万条推理链不可能，它是唯一可行的选择；代价是评判者本身会犯错，数据里会混进「judge 看错了」的样本</b>。<br>⚠ 而第四步<b>不再是推理专用的东西</b>：<b>它就是 L5 讲的那一套，用人类偏好对齐「有帮助」和「无害」⇒ R1 的最后一步，是把它变回一个「正常的助手」</b>。讲者说那些是「工作得相当好的启发式」—— <b>这个辩护基于实际效果，不是原理保证</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();
  says("102:01","the harmlessness was a reward that was applied on the whole tokens that were outputted",166);
  note("⭐ 两个新奖励，而「无害」那一项有一个很重要的细节",640,196,"y");
  boxNode(80,228,1100,46,"无害：覆盖「所有」输出 token，含 think 里的思考","r");

  note("在思考里就开始规划有害内容的模型，答案也不安全",640,350,"y");
  note("⚠ 而有帮助不覆盖思考是对的：硬要它「有帮助」会把试错压成整洁作文",640,384,"r");},"<b>两个新奖励，而它们作用的范围不一样 —— 这是一个很好的设计判断。</b><br>⭐ 为什么无害必须覆盖思考过程：<b>思考可能被泄露（界面摘要、API 返回、日志）;更重要的是，一个在思考里就开始规划有害内容的模型，最终答案也不可能真正安全 ⇒ 安全性不能只管「门口」,要管「整个房间」</b>。<br>⚠ 而为什么有帮助<b>不</b>覆盖思考：<b>思考过程本来就是杂乱的、试错的 —— 那是它该有的样子；要求它也「对用户有帮助」,就会把它压成一篇整洁的作文，而那恰好破坏它的作用 ⇒ 这个范围差别不是偷懒，是在保护推理过程的自由度</b>。「有帮助 + 无害」这一对来自 Anthropic 的 HH 框架。");
  SUM(0,14,{h:"⭐ R1 的四个阶段",k:"<b>「只用 RL，你就能得到推理级别的表现」（R1-Zero 已证）⇒ R1 从同一个 V3 base 重新开始，「他们试着用一种能很好地缓解我们看到的那些问题的方式去对齐它」</b>。<br>① 冷启动：<b>「他们用人去『重写』其中一些」; 「它可能比其它阶段少好几个数量级」</b>。<br>② RL：<b>「有一个叫语言一致性奖励的东西」—— 奖励从两个变成三个</b>。<br>③ 混合 SFT：<b>「他们把推理和非推理数据混在一起」; 「大约 20 万对」非推理（回收 V3 用过的）+ 约 60 万推理 = 3 : 1；而那 60 万是「他们用目前为止训出来的那个模型去生成回答」再用评判者筛（拒绝采样）</b>。<br>④ 最后一个 RL：<b>「他们接着进入最后一个阶段」—— 「无害是一个施加在所有被输出的 token 上的奖励」,而有帮助只看用户看到的部分</b>。",m:"⭐ <b>R1 不是在 R1-Zero 上继续训的</b>,它从同一个 V3 base 重开 ⇒ <b>R1-Zero 的贡献不是权重，是它生成的那些链 —— 它被当成「数据生成器」而不是「模型检查点」</b>；而关键在那个词：<b>「重写」而不是「写」—— 它把一个不可行的任务变成了一个可行的任务</b>。<br>⭐ 第三步在解一个讲者没明说的问题：<b>第二步的 RL 只在数学和编程上做 ⇒ 模型可能变得「只会做题」（对齐税 / 灾难性遗忘）⇒ 混数据不是在「提升」,是在「补回」被 RL 挤掉的东西 ⇒ 四阶段的节奏是「先专精、再拓宽」反复交替</b>。<br>⭐ 而那 60 万条是一个<b>自举</b>：<b>模型在给自己造教材 —— 链一旦有了，SFT 就重新可用，而且比 RL 便宜得多</b>。",w:" 「冷启动」几千条就够，<b>因为它的任务不是「教会它推理」,只是「给它一个锚」</b> ⇒ 实用推论：<b>改能力要海量数据或 RL；改格式 / 风格 / 语言，几百到几千条就够 —— 动手前先分清你想改的是能力还是形式</b>。<br>⚠ 而两个新奖励的<b>范围差别</b>是有道理的：<b>无害必须覆盖思考（在思考里规划有害内容的模型，答案也不安全）;有帮助不覆盖思考（否则会把试错压成整洁作文，破坏它的作用）</b>。<br>⚠ 自动评判的代价：<b>评判者本身会犯错，数据里会混进「judge 看错了」的样本</b>。",r:"⇒ 「SFT 还有什么用」在这里有了好答案：<b>R1-Zero 证明「SFT 不是必需的」（能力上）,R1 证明「SFT 仍然是必要的」（可用性上）—— 它不负责「会不会推理」,它负责「推得人能不能看」</b>。<br>⇒ 第二步那个工作方法值得抄：<b>观察到一个具体的失败模式 ⇒ 设计一个最简单能量它的指标 ⇒ 直接加进奖励</b>。<br>⇒ 而 3:1 这个配比<b>没有理论依据，是调出来的 —— 但论文给出它，别人才能复现</b>。<br>⇒ 更多（四阶段逐步细节、拒绝采样与 Best-of-N 的同构、HH 框架、LLM judge 的两个用途）见<b>深度笔记</b>。"});
  QUIZ(0,14,{t:"R1 的第三步（混合 SFT）在解什么问题？而「无害」和「有帮助」的作用范围为什么不同？",o:["在降低推理长度；两个奖励都覆盖思考过程","在补回被 RL 挤掉的通用能力（第二步只练数学和代码 ⇒ 对齐税 / 灾难性遗忘）；而无害覆盖所有输出 token（含思考，因为在思考里规划有害内容的模型答案也不安全），有帮助只看用户看到的部分（否则会把试错压成整洁作文）","在提升推理能力；两个奖励范围其实一样","在扩大数据量；两个奖励都只看最终答案"],a:1,w:"⇒ 四阶段的节奏是 SFT（窄）→ RL（窄）→ SFT（宽）→ RL（宽）：每次 RL 之后跟一次 SFT 拉回来，先专精再拓宽。"});
});

  note("⚠ 多出来的是「哪些次好、哪些完全离谱」—— 那才是教师学到的知识",640,374,"r");},"<b>先把旧的蒸馏设定回忆一遍，而「数据是固定的」这四个字是整个对比的关键。</b><br>⭐ <b>预训练那段文本是给定的、SFT 那些对是给定的 ⇒ 「要拟合什么」是一个已知量；而推理这个场景恰好不是 —— 你没有一份「正确推理链」的数据集 ⇒ 旧蒸馏在这里直接用不上，它少了最关键的那个输入</b>。<br>⚠ 而学分布比学硬标签好在哪：<b>软分布告诉你「教师是怎么看这个世界的」—— 它传递的是教师的「相似性结构」,这就是学生能用小得多的参数达到不错效果的原因</b>；但<b>要拿到每步的分布你得访问 logits、还得有固定数据 —— 这里两个条件都不成立</b>。");
  S(0,function(){clearScene();setEq(null);setBig(null);setCap(null);noTitle();

  SUM(0,15,{h:"⭐ 蒸馏：把能力传到小模型",k:"<b>「R1 相对于闭源模型是相当有竞争力的」—— 而图上是两簇：推理模型一簇、非推理模型一簇</b>。<br>蒸馏：<b>「假设你手上没有一个 600B 的 MoE」⇒ 先回忆旧定义：「比如对下一个 token 预测，你知道你想让模型拟合的那段文本」（数据是固定的）; 「你拟合的不是硬标签，而是教师模型的整个概率分布」</b>。<br>这里的做法：<b>「我们这里用教师模型 —— R1 —— 去生成一些样本回答，包括 thinking token」—— 而这是「离线」做的 ⇒ 「你就试着去预测教师输出过的同一个 token 序列」</b>。<br>结果与最后那个问题：<b>「那些结果再一次相对于闭源替代品非常有竞争力」; 「你为什么要费这个劲去蒸馏，你本来就可以做同样的那些 RL 技术」⇒ 「在一个更小的尺寸层级上，蒸馏知识在表现上比直接从零开始学更高效」; 「祝你有一个很棒的周末」</b>。",m:"⭐ 「<b>两簇</b>」这个观察比任何具体分数都重要：<b>一个小一点的推理模型可能打败一个大得多的非推理模型 ⇒ 在推理类任务上，「用不用推理模型」比「用哪个厂的」更重要</b>。<br>⭐ 两种蒸馏并排：<b>经典 = 固定数据 + 学软分布（要 logits）;这里 = 教师生成数据 + 学硬序列（只要文本）⇒ 这个「另一种口味」其实就是「在教师生成的数据上做普通 SFT」,而它在「把一个没有数据的问题变成一个有数据的问题」</b>。<br>⭐ 而最后那个答案推翻了一个自然的假设：<b>RL 是搜索，小模型的初始分布里复杂推理路径概率极低 ⇒ 几乎采不到也学不到；蒸馏绕过了搜索 ⇒ 推理能力要「够大的模型 + RL」才第一次长出来，但一旦长出来就能被传下去 —— 发现很贵，复制很便宜</b>。",w:" 旧蒸馏在这里<b>直接用不上</b>:<b>它要「每一步的分布」（需要 logits）和「一份固定的数据」—— 推理场景里两个条件都不成立</b>。<br>⚠ 而新做法<b>丢掉</b>了「次好的是什么」那类信息 ⇒ <b>信息效率更低、理论上需要更多数据；但它只要文本不要 logits，连只给 API 的闭源模型都能当教师 —— 这个便利压倒了那点损失</b>。<br>⚠ 对 benchmark 结果也保持清醒：<b>分数是「直接被优化的目标」⇒ 「在 AIME 上追上」不完全等于「推理能力追上」;而讲者用「相当有竞争力」而不是「超过」,措辞是准确的</b>。",r:"⇒ 这正好呼应了「思考摘要为什么不给你看」的第三个理由：<b>有了链就能训一个模仿它的模型 —— 而 DeepSeek 自己就是这么做的，所以那个担忧是真实存在的</b>。<br>⇒ 「追上闭源」两次意义不同：<b>R1 vs o1 是科学意义（方法可行）,蒸馏版 vs o1-mini 是实用意义（能力可搬运）—— 两件事合起来才真正改变了行业格局</b>。<br>⇒ 对你的用途有一个很具体的推论：<b>你不需要 671B —— 一个 7B 到 32B 的蒸馏版推理模型在数学和代码上已经相当可用，这条路是开着的</b>。<br>⇒ 更多（经典蒸馏的软标签原理、离线 vs 在线、小模型为什么采不到复杂路径）见<b>深度笔记</b>。"});
  QUIZ(0,15,{t:"这个「另一种口味」的蒸馏和经典蒸馏差在哪？而为什么小模型用蒸馏而不是直接 RL？",o:["它要求教师和学生同架构；因为小模型不能用 GRPO","它蒸馏权重而不是输出；因为 RL 太贵","它用 RL 代替了 SFT；因为小模型没有 think token","经典是「固定数据 + 学教师的软分布（要 logits）」，这里是「教师先离线生成数据 + 学教师的硬序列（只要文本）」—— 其实就是在教师生成的数据上做普通 SFT；而小模型用蒸馏是因为 RL 是搜索，小模型的初始分布里复杂推理路径概率极低，几乎采不到也学不到"],a:3,w:"⇒ 所以整讲最后的结论是：推理能力要「足够大的模型 + RL」才能第一次长出来，但一旦长出来就能被传下去 —— 发现很贵，复制很便宜。"});

KP("完 · 一条可验证的奖励，和三处被钻的归一化",
function(){
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L6 · 完","两个目标","各一句话");},
    "⭐ <b>讲者自己立的两个目标，各给一句话。</b><br><span class='k'><b>① 推理模型是什么</b>：输出从「答案」变成「<b>推理链 + 答案</b>」—— 就这一处结构差别，没有新架构、没有新的层、没有新的注意力。它本质上是「把 2022 年那个 chain-of-thought 的 prompting 技巧放大」,并让模型自己就这么做。</span><br><span class='k'><b>② 它们怎么训出来的</b>：在「可验证奖励」上做 RL（GRPO）。而 GRPO 和 PPO 只差一处：<b>PPO 用一个学出来的 value function 当基线，GRPO 用「同一个 prompt 采 g 条的平均奖励」当基线</b> —— 那一处替换省掉了一整个要训练的模型。</span>");
  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);

  S(0,function(){clearScene();setBig(null);setCap(null);setEq(null);
    setTitle("CME295 L6 · 完","三处归一化偏置","看起来中立的细节");},
